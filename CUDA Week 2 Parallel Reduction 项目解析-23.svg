<text x="928" y="325" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" class="mono">block_start=3*blockDim.x</text>
<rect x="190" y="430" width="420" height="130" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="208" y="458" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="start">naive/shared 常用</text>
<text x="208" y="485" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">tid = threadIdx.x</text>
<text x="208" y="505" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">gid = blockIdx.x * blockDim.x + threadIdx.x</text>
<text x="208" y="525" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">block_start = blockIdx.x * blockDim.x</text>
<text x="208" y="545" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">block_end = min(block_start + blockDim.x, n)</text>
<rect x="690" y="430" width="360" height="130" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="708" y="458" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="start">shuffle 常用</text>
<text x="708" y="485" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">lane = tid % warpSize</text>
<text x="708" y="505" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">warp_id = tid / warpSize</text>
<text x="708" y="525" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">num_warps = blockDim.x / warpSize</text>
<rect x="390" y="610" width="490" height="34" rx="17.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="635.0" y="632.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">默认 blockDim.x=256：每 block 8 个 warp；每 warp 32 个 lane</text>
</svg>
