<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 880" width="100%" height="100%">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      /* 基础字体与背景 */
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
      .bg-rect { fill: #ffffff; }

      /* 标题区样式 */
      .title-box { fill: #1565c0; rx: 4px; }
      .title-num { fill: #ffffff; font-size: 20px; font-weight: bold; }
      .title-text { font-size: 24px; font-weight: bold; fill: #202124; }
      .subtitle { font-size: 18px; fill: #3c4043; line-height: 1.6; }

      /* 图表区样式 */
      .diagram-border { fill: none; stroke: #bdc1c6; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12px; }
      .diagram-title-bg { fill: #ffffff; }
      .diagram-title { font-size: 20px; font-weight: bold; fill: #202124; text-anchor: middle; }

      .time-label { font-size: 16px; font-weight: bold; fill: #202124; }
      .status-label { font-size: 16px; fill: #5f6368; }

      /* 块区域样式 */
      .block-running { fill: #e6f4ea; stroke: #81c784; stroke-width: 1.5; rx: 4px; }
      .block-running-text { font-size: 15px; font-weight: bold; fill: #137333; text-anchor: middle; }
      .block-unrun { fill: #f1f3f4; stroke: #bdc1c6; stroke-width: 1.5; rx: 4px; }
      .block-unrun-text { font-size: 15px; font-weight: bold; fill: #5f6368; text-anchor: middle; }

      /* 红框警告区 */
      .alert-box { fill: #fce8e6; stroke: #f28b82; stroke-width: 1.5; rx: 8px; }
      .alert-title { font-size: 19px; font-weight: bold; fill: #c5221f; }
      .alert-text { font-size: 17px; font-weight: bold; fill: #202124; }

      /* 绿框结论区 */
      .success-box { fill: #e8f5e9; stroke: #81c784; stroke-width: 1.5; rx: 8px; }
      .success-text { font-size: 19px; font-weight: bold; fill: #137333; }

      .ellipsis { font-size: 20px; font-weight: bold; fill: #5f6368; letter-spacing: 2px;}
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg-rect"/>

  <rect x="40" y="40" width="32" height="32" class="title-box"/>
  <text x="50" y="64" class="title-num">2</text>
  <text x="85" y="65" class="title-text">为什么不能在一个 kernel 内跨 block 同步？</text>

  <text x="85" y="115" class="subtitle">CUDA 调度 block 的方式不是“所有 block 一定同时运行”。</text>
  <text x="85" y="145" class="subtitle">例如你启动了 1000 个 block，但 GPU 资源有限，可能一次</text>
  <text x="85" y="175" class="subtitle">只能运行其中的一部分。</text>

  <rect x="40" y="230" width="770" height="290" class="diagram-border"/>

  <rect x="300" y="215" width="250" height="30" class="diagram-title-bg"/>
  <text x="425" y="238" class="diagram-title">GPU 执行的可能过程</text>

  <text x="65" y="293" class="time-label">时间段 1</text>
  <rect x="150" y="270" width="255" height="36" class="block-running"/>
  <text x="277" y="294" class="block-running-text">Block 0   <tspan class="ellipsis">...</tspan>   Block 79</text>
  <rect x="415" y="270" width="255" height="36" class="block-unrun"/>
  <text x="542" y="294" class="block-unrun-text">Block 80   <tspan class="ellipsis">...</tspan>   Block 999</text>
  <text x="690" y="293" class="status-label">未运行</text>

  <text x="65" y="348" class="time-label">时间段 2</text>
  <rect x="150" y="325" width="255" height="36" class="block-running"/>
  <text x="277" y="349" class="block-running-text">Block 80   <tspan class="ellipsis">...</tspan>   Block 159</text>
  <rect x="415" y="325" width="255" height="36" class="block-unrun"/>
  <text x="542" y="349" class="block-unrun-text">Block 160   <tspan class="ellipsis">...</tspan>   Block 999</text>
  <text x="690" y="348" class="status-label">未运行</text>

  <text x="65" y="403" class="time-label">时间段 3</text>
  <rect x="150" y="380" width="255" height="36" class="block-running"/>
  <text x="277" y="404" class="block-running-text">Block 160   <tspan class="ellipsis">...</tspan>   Block 239</text>
  <rect x="415" y="380" width="255" height="36" class="block-unrun"/>
  <text x="542" y="404" class="block-unrun-text">Block 240   <tspan class="ellipsis">...</tspan>   Block 999</text>
  <text x="690" y="403" class="status-label">未运行</text>

  <text x="120" y="450" class="ellipsis">......</text>

  <text x="65" y="488" class="time-label">时间段 n</text>
  <rect x="150" y="465" width="255" height="36" class="block-running"/>
  <text x="277" y="489" class="block-running-text">Block 920   <tspan class="ellipsis">...</tspan>   Block 999</text>

  <rect x="40" y="550" width="770" height="180" class="alert-box"/>
  <text x="60" y="585" class="alert-title">问题：如果在 kernel 里让所有 block 互相等待（假设有 global_sync()），</text>
  <text x="110" y="615" class="alert-title">就可能死锁！</text>

  <circle cx="70" cy="650" r="3.5" fill="#202124"/>
  <text x="85" y="656" class="alert-text">正在运行的 block 在等还没开始运行的 block；</text>
  <circle cx="70" cy="682" r="3.5" fill="#202124"/>
  <text x="85" y="688" class="alert-text">还没运行的 block 需要 GPU 资源才能开始；</text>
  <circle cx="70" cy="714" r="3.5" fill="#202124"/>
  <text x="85" y="720" class="alert-text">GPU 资源被正在等待的 block 占着，导致死锁。</text>

  <rect x="40" y="750" width="770" height="95" class="success-box"/>
  <text x="60" y="785" class="success-text">结论：传统 CUDA kernel 没有普通的全局同步 (global_syncthreads()) 。</text>
  <text x="110" y="820" class="success-text">__syncthreads() 只能同步当前 block 内部线程。</text>

</svg>
