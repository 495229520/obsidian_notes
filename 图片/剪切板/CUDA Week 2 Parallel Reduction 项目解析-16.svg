<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Benchmark 结果对比条形图</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">16 64M 规模有效带宽对比：Shuffle 最强</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“14.10 实测 benchmark 结果”后，补充数字表的可视化</text>
<rect x="100" y="135" width="1080" height="500" rx="20" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="145" y="180" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">BW(GB/s), 64M</text>
<text x="160" y="240" font-size="14" font-weight="800" fill="#334155" text-anchor="start">Naive float</text>
<rect x="300" y="220" width="506.16" height="28" rx="8" fill="#F59E0B" opacity="1"/>
<rect x="806.1600000000001" y="220" width="273.84" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="816.1600000000001" y="240" font-size="14" font-weight="800" fill="white" text-anchor="start">42.18</text>
<text x="160" y="302" font-size="14" font-weight="800" fill="#334155" text-anchor="start">Shared float</text>
<rect x="300" y="282" width="587.7599999999999" height="28" rx="8" fill="#059669" opacity="1"/>
<rect x="887.7599999999999" y="282" width="192.24000000000012" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="897.7599999999999" y="302" font-size="14" font-weight="800" fill="white" text-anchor="start">48.98</text>
<text x="160" y="364" font-size="14" font-weight="800" fill="#334155" text-anchor="start">Shuffle float</text>
<rect x="300" y="344" width="723.84" height="28" rx="8" fill="#2563EB" opacity="1"/>
<rect x="1023.84" y="344" width="56.15999999999997" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="1033.8400000000001" y="364" font-size="14" font-weight="800" fill="white" text-anchor="start">60.32</text>
<text x="160" y="426" font-size="14" font-weight="800" fill="#334155" text-anchor="start">Naive int</text>
<rect x="300" y="406" width="514.92" height="28" rx="8" fill="#F59E0B" opacity="1"/>
<rect x="814.92" y="406" width="265.08000000000004" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="824.92" y="426" font-size="14" font-weight="800" fill="white" text-anchor="start">42.91</text>
<text x="160" y="488" font-size="14" font-weight="800" fill="#334155" text-anchor="start">Shared int</text>
<rect x="300" y="468" width="594.96" height="28" rx="8" fill="#059669" opacity="1"/>
<rect x="894.96" y="468" width="185.03999999999996" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="904.96" y="488" font-size="14" font-weight="800" fill="white" text-anchor="start">49.58</text>
<text x="160" y="550" font-size="14" font-weight="800" fill="#334155" text-anchor="start">Shuffle int</text>
<rect x="300" y="530" width="729.84" height="28" rx="8" fill="#2563EB" opacity="1"/>
<rect x="1029.8400000000001" y="530" width="50.15999999999997" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="1039.8400000000001" y="550" font-size="14" font-weight="800" fill="white" text-anchor="start">60.82</text>
<line x1="300" y1="590" x2="1080" y2="590" stroke="#334155" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1085" y="595" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">65 GB/s</text>
<rect x="520" y="640" width="420" height="34" rx="17.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="730.0" y="662.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">趋势一致：float/int 都主要受内存访问与归约组织方式影响</text>
</svg>
