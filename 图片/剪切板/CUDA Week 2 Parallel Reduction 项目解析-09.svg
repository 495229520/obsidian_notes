<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Correctness 测试链路</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">09 Correctness Test：输入 → CPU reference → GPU reduce → check_result</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“8. 测试工具”或“13. Correctness Test”中</text>
<rect x="65" y="150" width="205" height="160" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="65" y="150" width="205" height="8" rx="18" fill="#0891B2" opacity="1"/>
<text x="85" y="184" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">generate_input&lt;T&gt;(n)</text>
<text x="85" y="214" font-size="14" font-weight="400" fill="#334155" text-anchor="start">mt19937 seed=42</text>
<text x="85" y="235" font-size="14" font-weight="400" fill="#334155" text-anchor="start">float[0,1), int[0,99]</text>
<line x1="270" y1="230" x2="305" y2="230" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="305" y="150" width="205" height="160" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="305" y="150" width="205" height="8" rx="18" fill="#059669" opacity="1"/>
<text x="325" y="184" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">sum_reference&lt;T&gt;</text>
<text x="325" y="214" font-size="14" font-weight="400" fill="#334155" text-anchor="start">float: double acc</text>
<text x="325" y="235" font-size="14" font-weight="400" fill="#334155" text-anchor="start">int: exact acc</text>
<line x1="510" y1="230" x2="545" y2="230" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="545" y="150" width="205" height="160" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="545" y="150" width="205" height="8" rx="18" fill="#2563EB" opacity="1"/>
<text x="565" y="184" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">DeviceBuffer + H2D</text>
<text x="565" y="214" font-size="14" font-weight="400" fill="#334155" text-anchor="start">分配 d_input</text>
<text x="565" y="235" font-size="14" font-weight="400" fill="#334155" text-anchor="start">HostToDevice</text>
<line x1="750" y1="230" x2="785" y2="230" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="785" y="150" width="205" height="160" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="785" y="150" width="205" height="8" rx="18" fill="#7C3AED" opacity="1"/>
<text x="805" y="184" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">reduce_xxx&lt;T&gt;</text>
<text x="805" y="214" font-size="14" font-weight="400" fill="#334155" text-anchor="start">naive/shared/shuffle</text>
<text x="805" y="235" font-size="14" font-weight="400" fill="#334155" text-anchor="start">统一 API</text>
<line x1="990" y1="230" x2="1025" y2="230" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1025" y="150" width="205" height="160" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="1025" y="150" width="205" height="8" rx="18" fill="#F59E0B" opacity="1"/>
<text x="1045" y="184" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">check_result&lt;T&gt;</text>
<text x="1045" y="214" font-size="14" font-weight="400" fill="#334155" text-anchor="start">float rel_err &lt; 1e-3</text>
<text x="1045" y="235" font-size="14" font-weight="400" fill="#334155" text-anchor="start">int exact ==</text>
<rect x="120" y="420" width="1035" height="155" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="150" y="455" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start">测试矩阵</text>
<rect x="180" y="485" width="165" height="32" rx="16.0" fill="#F1F5F9" stroke="#334155" stroke-width="1" opacity="1"/>
<text x="262.5" y="506.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">n = 1</text>
<text x="262" y="530" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">单元素边界</text>
<rect x="410" y="485" width="165" height="32" rx="16.0" fill="#F1F5F9" stroke="#334155" stroke-width="1" opacity="1"/>
<text x="492.5" y="506.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">n = 1024</text>
<text x="492" y="530" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">刚好 4 blocks</text>
<rect x="640" y="485" width="165" height="32" rx="16.0" fill="#F1F5F9" stroke="#334155" stroke-width="1" opacity="1"/>
<text x="722.5" y="506.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">n = 1 &lt;&lt; 20</text>
<text x="722" y="530" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">大规模 partials</text>
<rect x="870" y="485" width="165" height="32" rx="16.0" fill="#F1F5F9" stroke="#334155" stroke-width="1" opacity="1"/>
<text x="952.5" y="506.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">n = 1000</text>
<text x="952" y="530" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">非 block 对齐</text>
<rect x="480" y="605" width="300" height="34" rx="17.0" fill="#D1FAE5" stroke="#059669" stroke-width="1" opacity="1"/>
<text x="630.0" y="627.0" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">float + int 两种类型，共 8 个 case</text>
</svg>
