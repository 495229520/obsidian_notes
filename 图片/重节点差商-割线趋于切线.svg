<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#444" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f3a5f">重节点差商：割线斜率 → 切线斜率</text>

  <!-- coordinate axes -->
  <line x1="70" y1="330" x2="470" y2="330" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="90" y1="350" x2="90" y2="70"  stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="476" y="334" font-size="13" fill="#666">x</text>
  <text x="78"  y="66"  font-size="13" fill="#666">y</text>

  <!-- curve f(x) -->
  <path d="M110,300 Q250,40 440,140" fill="none" stroke="#2e6fb0" stroke-width="2.4"/>
  <text x="430" y="120" font-size="14" fill="#2e6fb0" font-style="italic">f(x)</text>

  <!-- two points P0, P1 on the curve -->
  <!-- P0 approx at x=300 ; P1 approx at x=410 -->
  <circle cx="300" cy="112" r="4.5" fill="#1f3a5f"/>
  <circle cx="410" cy="128" r="4.5" fill="#c0392b"/>
  <text x="284" y="104" font-size="13" fill="#1f3a5f">P₀(x₀, f(x₀))</text>
  <text x="402" y="152" font-size="13" fill="#c0392b">P₁(x₁, f(x₁))</text>

  <!-- secant line through P0,P1 (dashed) -->
  <line x1="232" y1="102" x2="470" y2="138" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="300" y="186" font-size="12.5" fill="#c0392b">割线斜率 = f[x₀,x₁] = (f(x₁)−f(x₀))/(x₁−x₀)</text>

  <!-- tangent at P0 (solid) -->
  <line x1="222" y1="148" x2="392" y2="78" stroke="#27894a" stroke-width="1.8"/>
  <text x="150" y="158" font-size="12.5" fill="#27894a">切线斜率 = f'(x₀)</text>

  <!-- limit arrow P1 -> P0 -->
  <path d="M404,128 q-40,18 -86,-8" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="330" y="150" font-size="12" fill="#444">x₁ → x₀</text>

  <!-- right panel: key formula -->
  <rect x="500" y="70" width="234" height="270" rx="10" fill="#f3f7fb" stroke="#cdddee"/>
  <text x="617" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3a5f">核心结论</text>

  <text x="518" y="132" font-size="13" fill="#333">两节点重合时差商为</text>
  <text x="617" y="166" text-anchor="middle" font-size="17" fill="#c0392b">f[x₀,x₁] = 0/0  ✗</text>

  <text x="518" y="206" font-size="13" fill="#333">取极限即得导数：</text>
  <text x="617" y="240" text-anchor="middle" font-size="17" fill="#1f3a5f" font-style="italic">f[x,x] = f'(x)</text>

  <line x1="518" y1="262" x2="716" y2="262" stroke="#cdddee" stroke-width="1"/>
  <text x="518" y="292" font-size="13" fill="#333">一般地（k+1 个相同节点）：</text>
  <text x="617" y="326" text-anchor="middle" font-size="17" fill="#1f3a5f" font-style="italic">f[x,…,x] = f⁽ᵏ⁾(x)/k!</text>
</svg>
