<svg width="1120" height="720" viewBox="0 0 1120 720" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1120" height="720" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="560" y="44" fill="#444441" font-family="system-ui,sans-serif" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="central">使用信号量实现生产者-消费者模型</text>
  <text x="560" y="76" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">两个信号量让输入线程和计算线程按“输入一次、计算一次”的节奏交替执行</text>

  <!-- thread areas -->
  <path d="M70 142H410Q418 142 418 150V548Q418 556 410 556H70Q62 556 62 548V150Q62 142 70 142Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <path d="M710 142H1050Q1058 142 1058 150V548Q1058 556 1050 556H710Q702 556 702 548V150Q702 142 710 142Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>

  <text x="240" y="174" fill="#0C447C" font-family="system-ui,sans-serif" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central">输入线程</text>
  <text x="240" y="204" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">input_num()</text>

  <text x="880" y="174" fill="#633806" font-family="system-ui,sans-serif" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central">计算线程</text>
  <text x="880" y="204" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">lession96()</text>

  <!-- thread creation -->
  <path d="M750 220H370" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="204" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">pthread_create 创建输入线程</text>

  <!-- input thread nodes -->
  <rect x="110" y="240" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="240" y="260" fill="#444441" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">sem_wait(&amp;sem_two)</text>
  <text x="240" y="282" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">等待允许输入</text>

  <rect x="110" y="360" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="240" y="380" fill="#0C447C" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">scanf("%d", &amp;num)</text>
  <text x="240" y="402" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">生产数据 num</text>

  <rect x="110" y="480" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="240" y="500" fill="#085041" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">sem_post(&amp;sem_one)</text>
  <text x="240" y="522" fill="#085041" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">通知可以计算</text>

  <!-- calculation thread nodes -->
  <rect x="750" y="240" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="880" y="260" fill="#444441" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">sem_wait(&amp;sem_one)</text>
  <text x="880" y="282" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">等待输入完成</text>

  <rect x="750" y="360" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="880" y="380" fill="#633806" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">sum += num</text>
  <text x="880" y="402" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">消费数据 num</text>

  <rect x="750" y="480" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="880" y="500" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">sem_post(&amp;sem_two)</text>
  <text x="880" y="522" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">通知可以继续输入</text>

  <!-- shared data -->
  <rect x="480" y="326" width="160" height="92" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="560" y="350" fill="#633806" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central">共享变量</text>
  <text x="560" y="378" fill="#633806" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">num</text>
  <text x="560" y="402" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">生产者写入，消费者读取</text>

  <!-- data flow -->
  <path d="M370 388H480" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="425" y="368" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">写入</text>

  <path d="M640 388H750" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="695" y="368" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">读取</text>

  <!-- semaphore handoff -->
  <path d="M1010 508C1068 508 1068 126 372 126C324 126 282 170 252 240" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="118" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">sem_two：计算线程通知输入线程继续输入</text>

  <path d="M370 508C448 584 672 584 750 508" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="572" fill="#085041" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">sem_one：输入线程通知计算线程读取 num</text>

  <!-- init state -->
  <rect x="390" y="620" width="340" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="560" y="642" fill="#444441" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">初始化：sem_one = 0，sem_two = 1</text>
</svg>
