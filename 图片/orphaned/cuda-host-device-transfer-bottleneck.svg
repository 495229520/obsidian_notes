<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 1360 860" role="img" aria-labelledby="title desc">
  <title id="title">CUDA Host-Device Transfer Bottleneck and Process Thread Roles</title>
  <desc id="desc">Diagram showing process ownership, CPU runtime submission, PCIe or NVLink transfer bottleneck, GPU copy engine, device memory, SMs, and CUDA thread execution.</desc>

  <defs>
    <style>
      .bg { fill: rgb(245, 244, 237); }
      .outer { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .host { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .runtime { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .bus { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .gpu { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .note { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; }
      .summary { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.6; }
      .title { font: 700 30px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .h2 { font: 700 21px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .h3 { font: 700 17px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #1e293b; }
      .text { font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .muted { font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .warn { font: 700 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #b91c1c; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrowhead); }
      .data { fill: none; stroke: #dc2626; stroke-width: 3; marker-end: url(#arrowhead-red); }
      .control { fill: none; stroke: #059669; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrowhead-green); }
      .local { fill: none; stroke: #059669; stroke-width: 2.5; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1360" height="860" />
  <text class="title" x="44" y="54">CUDA Host-Device 数据传输瓶颈与进程 / 线程角色</text>
  <text class="small" x="46" y="84">进程拥有资源，CPU 线程提交任务，Runtime / Driver 调度传输，GPU copy engine 和 SM 执行实际工作。</text>

  <rect class="outer" x="40" y="118" width="1280" height="690" rx="24" />

  <rect class="host" x="74" y="158" width="310" height="410" rx="18" />
  <text class="h2" x="104" y="198">OS Process / Host Program</text>
  <text class="small" x="104" y="226">角色：拥有资源和上下文边界</text>

  <rect class="note" x="104" y="260" width="250" height="66" rx="12" />
  <text class="h3" x="128" y="290">Host Address Space</text>
  <text class="muted" x="128" y="312">std::vector / heap / stack</text>

  <rect class="note" x="104" y="350" width="250" height="72" rx="12" />
  <text class="h3" x="128" y="380">Pageable Host Memory</text>
  <text class="muted" x="128" y="402">普通 CPU 内存，可能需要 staging</text>

  <rect class="note" x="104" y="446" width="250" height="72" rx="12" />
  <text class="h3" x="128" y="476">Pinned Host Memory</text>
  <text class="muted" x="128" y="498">page-locked，更适合 async copy</text>

  <rect class="runtime" x="454" y="158" width="300" height="410" rx="18" />
  <text class="h2" x="484" y="198">CPU Threads / Runtime</text>
  <text class="small" x="484" y="226">角色：提交 copy / kernel / sync</text>

  <rect class="note" x="484" y="260" width="240" height="62" rx="12" />
  <text class="h3" x="508" y="288">Main CPU Thread</text>
  <text class="muted" x="508" y="308">orchestrate host code</text>

  <rect class="note" x="484" y="346" width="240" height="62" rx="12" />
  <text class="h3" x="508" y="374">Worker CPU Thread</text>
  <text class="muted" x="508" y="394">prepare next batch</text>

  <rect class="note" x="484" y="432" width="240" height="96" rx="12" />
  <text class="h3" x="508" y="462">CUDA Runtime API</text>
  <text class="muted" x="508" y="486">cudaMemcpy / cudaMemcpyAsync</text>
  <text class="muted" x="508" y="508">kernel launch / stream / event</text>

  <rect class="bus" x="820" y="238" width="200" height="250" rx="18" />
  <text class="h2" x="866" y="278">PCIe / NVLink</text>
  <text class="small" x="858" y="306">Host ↔ Device 数据通道</text>
  <text class="warn" x="868" y="358">常见端到端瓶颈</text>
  <text class="muted" x="858" y="394">带宽有限</text>
  <text class="muted" x="858" y="420">每次传输有延迟</text>
  <text class="muted" x="858" y="446">小而频繁 copy 更差</text>

  <rect class="gpu" x="1080" y="158" width="210" height="410" rx="18" />
  <text class="h2" x="1112" y="198">GPU Device</text>
  <text class="small" x="1112" y="226">角色：执行传输和 kernel</text>

  <rect class="note" x="1110" y="260" width="150" height="62" rx="12" />
  <text class="h3" x="1130" y="288">Copy Engine</text>
  <text class="muted" x="1130" y="308">DMA transfer</text>

  <rect class="note" x="1110" y="346" width="150" height="72" rx="12" />
  <text class="h3" x="1130" y="376">Device Memory</text>
  <text class="muted" x="1130" y="398">global memory</text>

  <rect class="note" x="1110" y="442" width="150" height="82" rx="12" />
  <text class="h3" x="1130" y="472">SMs</text>
  <text class="muted" x="1130" y="496">CUDA threads</text>
  <text class="muted" x="1130" y="514">execute kernel</text>

  <path class="arrow" d="M354 386 C402 386, 428 430, 484 476" />
  <text class="small" x="370" y="362">host pointer 交给 Runtime</text>

  <path class="data" d="M724 480 C770 480, 780 370, 820 370" />
  <text class="small" x="752" y="452">H2D / D2H copy</text>
  <path class="data" d="M1020 370 C1048 370, 1070 370, 1110 370" />
  <text class="small" x="1030" y="348">进入 device memory</text>

  <path class="control" d="M724 506 C830 620, 1010 620, 1110 486" />
  <text class="small" x="850" y="640">kernel launch 控制路径：提交命令，不搬大数据</text>

  <path class="local" d="M1185 418 L1185 442" />
  <text class="small" x="1200" y="434">kernel 读取显存</text>

  <rect class="summary" x="74" y="610" width="1216" height="78" rx="14" />
  <text class="h3" x="104" y="640">读图顺序</text>
  <text class="small" x="104" y="668">1. 进程拥有 host 地址空间和 CUDA context；2. CPU 线程调用 Runtime API 提交 copy / kernel；3. H2D/D2H 经过 PCIe/NVLink；4. 数据到达 GPU 后，SM 上的 CUDA 线程才执行 kernel。</text>

  <rect class="note" x="92" y="718" width="338" height="54" rx="12" />
  <text class="small" x="116" y="742">Pinned memory helps async copy / overlap</text>
  <text class="muted" x="116" y="762">但不是越多越好，会影响系统内存管理</text>

  <rect class="note" x="510" y="718" width="338" height="54" rx="12" />
  <text class="small" x="534" y="742">More CPU threads do not raise bus bandwidth</text>
  <text class="muted" x="534" y="762">CPU 线程改善提交组织，不能突破物理链路上限</text>

  <rect class="note" x="928" y="718" width="338" height="54" rx="12" />
  <text class="small" x="952" y="742">Not the same as memory coalescing</text>
  <text class="muted" x="952" y="762">coalescing 是 GPU 内部访存模式问题</text>
</svg>
