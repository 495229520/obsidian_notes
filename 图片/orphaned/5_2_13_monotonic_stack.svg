<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <style>
      .title { font: 700 24px sans-serif; fill: #111827; }
      .label { font: 600 16px sans-serif; fill: #374151; }
      .small { font: 14px sans-serif; fill: #4b5563; }
      .tiny { font: 12px sans-serif; fill: #6b7280; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 10; }
      .cell { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 6; }
      .current { fill: #fef3c7; stroke: #d97706; stroke-width: 1.6; rx: 6; }
      .stack { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 8; }
      .pop { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; rx: 8; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; }
      .arrow { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="920" height="420" fill="#ffffff" />
  <text x="40" y="44" class="title">单调栈：当前元素触发弹栈并结算答案</text>

  <text x="55" y="92" class="label">输入数组 temperatures</text>
  <g transform="translate(55,112)">
    <rect x="0" y="0" width="70" height="54" class="cell" />
    <rect x="80" y="0" width="70" height="54" class="cell" />
    <rect x="160" y="0" width="70" height="54" class="cell" />
    <rect x="240" y="0" width="70" height="54" class="current" />
    <rect x="320" y="0" width="70" height="54" class="cell" />
    <text x="35" y="32" text-anchor="middle" class="label">73</text>
    <text x="115" y="32" text-anchor="middle" class="label">74</text>
    <text x="195" y="32" text-anchor="middle" class="label">75</text>
    <text x="275" y="32" text-anchor="middle" class="label">71</text>
    <text x="355" y="32" text-anchor="middle" class="label">76</text>
    <text x="35" y="74" text-anchor="middle" class="tiny">i=0</text>
    <text x="115" y="74" text-anchor="middle" class="tiny">i=1</text>
    <text x="195" y="74" text-anchor="middle" class="tiny">i=2</text>
    <text x="275" y="74" text-anchor="middle" class="tiny">i=3</text>
    <text x="355" y="74" text-anchor="middle" class="tiny">i=4 当前</text>
  </g>

  <path d="M 450 140 C 500 120, 535 120, 575 140" class="arrow" />
  <text x="512" y="112" text-anchor="middle" class="small">76 比栈顶更高</text>

  <text x="610" y="92" class="label">递减栈保存下标</text>
  <g transform="translate(635,115)">
    <rect x="0" y="160" width="160" height="42" class="stack" />
    <rect x="0" y="108" width="160" height="42" class="stack" />
    <rect x="0" y="56" width="160" height="42" class="pop" />
    <rect x="0" y="4" width="160" height="42" class="pop" />
    <text x="80" y="187" text-anchor="middle" class="small">idx 1, value 74</text>
    <text x="80" y="135" text-anchor="middle" class="small">idx 2, value 75</text>
    <text x="80" y="83" text-anchor="middle" class="small">idx 3, value 71</text>
    <text x="80" y="31" text-anchor="middle" class="small">idx 4, value 76</text>
    <text x="176" y="82" class="tiny">弹出并结算</text>
  </g>

  <g transform="translate(80,265)">
    <rect x="0" y="0" width="760" height="90" class="note" />
    <text x="24" y="30" class="label">不变量</text>
    <text x="24" y="58" class="small">栈内下标对应的值从栈底到栈顶保持递减；当前元素更大时，被弹出的元素第一次找到右侧更大值。</text>
    <text x="24" y="80" class="small">每日温度中：answer[弹出下标] = 当前下标 - 弹出下标。</text>
  </g>
</svg>
