<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="900px" viewBox="0 0 1280 900" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)" />
  <defs>
    <marker id="arrowSlate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#334155" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#16a34a" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7c3aed" />
    </marker>
  </defs>

  <g font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#0f172a" font-size="36" font-weight="800" x="640" y="54" text-anchor="middle" dominant-baseline="middle">进程生命周期：创建 → 就绪 → 运行 → 终止</text>
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#475569" font-size="18" font-weight="500" x="640" y="96" text-anchor="middle" dominant-baseline="middle">理解重点：进程不是一直运行，而是在 CPU、等待事件、就绪队列之间切换</text>

    <rect fill="#f8fafc" stroke="#64748b" stroke-width="2.5" x="72" y="265" width="160" height="112" rx="20" ry="20" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#334155" font-size="18" font-weight="700" x="152" y="295" text-anchor="middle" dominant-baseline="middle">创建<tspan x="152" dy="25">fork / exec</tspan><tspan x="152" dy="25">产生进程</tspan></text>

    <rect fill="#dbeafe" stroke="#2563eb" stroke-width="4" x="330" y="240" width="260" height="150" rx="26" ry="26" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#1e3a8a" font-size="24" font-weight="800" x="460" y="276" text-anchor="middle" dominant-baseline="middle">就绪态 Ready<tspan x="460" dy="34">条件已满足</tspan><tspan x="460" dy="34">等待 CPU 时间片</tspan></text>

    <rect fill="#dcfce7" stroke="#16a34a" stroke-width="4" x="770" y="240" width="260" height="150" rx="26" ry="26" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#14532d" font-size="24" font-weight="800" x="900" y="276" text-anchor="middle" dominant-baseline="middle">运行态 Running<tspan x="900" dy="34">正在 CPU 上</tspan><tspan x="900" dy="34">执行指令</tspan></text>

    <rect fill="#fee2e2" stroke="#dc2626" stroke-width="4" x="735" y="520" width="260" height="150" rx="26" ry="26" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#7f1d1d" font-size="24" font-weight="800" x="865" y="556" text-anchor="middle" dominant-baseline="middle">阻塞态 Blocked<tspan x="865" dy="34">等待 I/O / 资源</tspan><tspan x="865" dy="34">暂时不能运行</tspan></text>

    <rect fill="#f1f5f9" stroke="#475569" stroke-width="2.5" x="1080" y="265" width="160" height="112" rx="20" ry="20" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#334155" font-size="18" font-weight="700" x="1160" y="295" text-anchor="middle" dominant-baseline="middle">终止<tspan x="1160" dy="25">exit / kill</tspan><tspan x="1160" dy="25">回收资源</tspan></text>

    <line stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)" x1="232" y1="321" x2="310" y2="321" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#475569" font-size="16" font-weight="700" x="272" y="296" text-anchor="middle" dominant-baseline="middle">进入队列</text>

    <line stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowGreen)" x1="590" y1="315" x2="750" y2="315" />
    <rect fill="#f0fdf4" stroke="#86efac" stroke-width="2" x="625" y="272" width="84" height="68" rx="15" ry="15" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#166534" font-size="17" font-weight="800" x="667" y="295" text-anchor="middle" dominant-baseline="middle">调度器<tspan x="667" dy="22">选中</tspan></text>
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#166534" font-size="17" font-weight="700" x="667" y="362" text-anchor="middle" dominant-baseline="middle">分到 CPU 时间片</text>

    <line stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)" x1="1030" y1="321" x2="1060" y2="321" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#475569" font-size="16" font-weight="700" x="1045" y="296" text-anchor="middle" dominant-baseline="middle">执行结束</text>

    <path fill="none" stroke="#d97706" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowOrange)" d="M 895 230 C 860 145 490 145 470 230" />
    <rect fill="#fffbeb" stroke="#f59e0b" stroke-width="2" x="520" y="145" width="260" height="48" rx="24" ry="24" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#92400e" font-size="20" font-weight="800" x="650" y="170" text-anchor="middle" dominant-baseline="middle">时间片用完：让出 CPU</text>

    <line stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowRed)" x1="900" y1="390" x2="900" y2="500" />
    <rect fill="#fef2f2" stroke="#fca5a5" stroke-width="2" x="900" y="430" width="185" height="48" rx="24" ry="24" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#991b1b" font-size="18" font-weight="800" x="992" y="455" text-anchor="middle" dominant-baseline="middle">等待 I/O 或资源</text>

    <path fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)" d="M 735 595 L 460 595 L 460 410" />
    <rect fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" x="505" y="548" width="190" height="46" rx="23" ry="23" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#5b21b6" font-size="18" font-weight="800" x="600" y="572" text-anchor="middle" dominant-baseline="middle">I/O 完成，回到就绪</text>

    <rect fill="#fff7ed" stroke="#fed7aa" stroke-width="2.5" x="90" y="665" width="520" height="190" rx="24" ry="24" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#9a3412" font-size="24" font-weight="800" x="125" y="703" text-anchor="start" dominant-baseline="middle">怎么读这张图</text>
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#7c2d12" font-size="18" font-weight="600" x="125" y="743" text-anchor="start" dominant-baseline="middle">1. 就绪：万事俱备，只差 CPU。<tspan x="125" dy="27">2. 运行：真正占用 CPU 执行。</tspan><tspan x="125" dy="27">3. 阻塞：缺 I/O 或资源，暂时不能跑。</tspan><tspan x="125" dy="27">4. 阻塞事件完成后，不直接运行，而是先回就绪。</tspan></text>

    <rect fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" x="680" y="800" width="500" height="58" rx="20" ry="20" />
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#0f172a" font-size="19" font-weight="800" x="930" y="830" text-anchor="middle" dominant-baseline="middle">核心结论：CPU 调度只在“就绪 ↔ 运行”之间发生</text>
    <text font-family="Inter, Microsoft YaHei, PingFang SC, system-ui, sans-serif" fill="#475569" font-size="15" font-weight="700" x="930" y="852" text-anchor="middle" dominant-baseline="middle">等待外部事件会进入阻塞，事件完成后先回到就绪队列</text>
  </g>
</svg>
