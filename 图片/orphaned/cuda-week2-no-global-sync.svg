<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="100%" height="100%">
    <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
    <defs>
        <marker id="arrow-down-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 2 2 L 8 5 L 2 8" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
        <marker id="arrow-down-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 2 2 L 8 5 L 2 8" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
        <marker id="arrow-up-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 2 2 L 8 5 L 2 8" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
        <marker id="arrow-down-red-thick" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 2 2 L 8 5 L 2 8" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </marker>

        <pattern id="hatch-red" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <rect width="12" height="12" fill="#fff1f2" />
            <line x1="0" y1="0" x2="0" y2="12" stroke="#fca5a5" stroke-width="4" />
        </pattern>

        <g id="warning-icon">
            <path d="M 12 2 L 22 20 L 2 20 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="1" />
            <text x="12" y="16" font-size="14" font-family="sans-serif" font-weight="bold" fill="white" text-anchor="middle">!</text>
        </g>
    </defs>

    <rect width="1080" height="380" fill="#ffffff" />

    <rect x="20" y="15" width="1040" height="350" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />

    <rect x="35" y="30" width="30" height="30" rx="4" fill="#1e3a8a" />
    <text x="50" y="52" font-size="18" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">2.</text>
    <text x="75" y="52" font-size="20" font-family="sans-serif" font-weight="bold" fill="#1e3a8a">不同 Block 之间：为什么不能在一个 kernel 里简单全局同步？</text>

    <rect x="150" y="75" width="360" height="32" rx="16" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.5" />
    <text x="330" y="97" font-size="16" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">reduceKernel&lt;&lt;&lt;1000, 256&gt;&gt;&gt;</text>

    <line x1="180" y1="107" x2="180" y2="122" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-down-green)" />
    <line x1="250" y1="107" x2="250" y2="122" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-down-green)" />
    <line x1="330" y1="107" x2="330" y2="122" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow-down-gray)" />
    <line x1="410" y1="107" x2="410" y2="122" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-down-green)" />
    <line x1="480" y1="107" x2="480" y2="122" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-down-green)" />

    <g transform="translate(130, 125)">
        <path d="M -8 5 L -12 5 L -12 35 L -8 35 M -12 20 L -16 20" stroke="#16a34a" stroke-width="1.5" fill="none" />
        <text x="-20" y="15" font-size="13" font-family="sans-serif" font-weight="bold" fill="#16a34a" text-anchor="end">正在运行</text>
        <text x="-20" y="32" font-size="12" font-family="sans-serif" font-weight="bold" fill="#16a34a" text-anchor="end">(占用资源)</text>

        <rect x="0" y="0" width="65" height="40" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" />
        <text x="32.5" y="25" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">Block 0</text>

        <rect x="75" y="0" width="65" height="40" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" />
        <text x="107.5" y="25" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">Block 1</text>

        <text x="175" y="25" font-size="18" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">...</text>

        <rect x="210" y="0" width="70" height="40" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" />
        <text x="245" y="25" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">Block 78</text>

        <rect x="290" y="0" width="70" height="40" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" />
        <text x="325" y="25" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">Block 79</text>
    </g>

    <g transform="translate(130, 195)">
        <path d="M -8 5 L -12 5 L -12 35 L -8 35 M -12 20 L -16 20" stroke="#4b5563" stroke-width="1.5" fill="none" />
        <text x="-20" y="15" font-size="13" font-family="sans-serif" fill="#4b5563" text-anchor="end">还没开始</text>
        <text x="-20" y="32" font-size="12" font-family="sans-serif" fill="#4b5563" text-anchor="end">(等待资源)</text>

        <rect x="0" y="0" width="65" height="40" rx="4" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" />
        <text x="32.5" y="25" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">Block 80</text>

        <rect x="75" y="0" width="65" height="40" rx="4" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" />
        <text x="107.5" y="25" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">Block 81</text>

        <text x="175" y="25" font-size="18" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">...</text>

        <rect x="210" y="0" width="70" height="40" rx="4" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" />
        <text x="245" y="25" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">Block 158</text>

        <rect x="290" y="0" width="70" height="40" rx="4" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" />
        <text x="325" y="25" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">Block 159</text>
    </g>

    <text x="235" y="265" font-size="24" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">... ... ...</text>

    <g transform="translate(550, 145)">
        <rect x="0" y="0" width="130" height="135" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" />

        <g transform="translate(30, 15)">
            <rect x="-4" y="10" width="78" height="50" fill="#475569" />
            <rect x="10" y="-4" width="50" height="78" fill="#475569" />
            <rect x="0" y="0" width="70" height="70" rx="6" fill="#1e293b" />
            <rect x="10" y="10" width="50" height="50" rx="2" fill="none" stroke="#334155" stroke-width="2" />
            <text x="35" y="41" font-size="16" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU</text>
        </g>

        <text x="65" y="102" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">GPU 资源有限，</text>
        <text x="65" y="118" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">一次只能同时</text>
        <text x="65" y="134" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">运行部分 block</text>
    </g>

    <text x="735" y="103" font-size="14" font-family="sans-serif" font-weight="bold" fill="#dc2626" text-anchor="end">想象中的 global_sync()</text>
    <rect x="650" y="110" width="180" height="15" rx="4" fill="url(#hatch-red)" stroke="#dc2626" stroke-width="1.5" />

    <path d="M 690 280 L 800 280 L 800 135" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-up-red)" />
    <path d="M 690 240 L 770 240 L 770 135" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-up-red)" />
    <path d="M 690 200 L 740 200 L 740 135" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-up-red)" />
    <path d="M 690 160 L 710 160 L 710 135" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-up-red)" />
    <line x1="680" y1="160" x2="680" y2="135" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-up-red)" />


    <g transform="translate(840, 65)">
        <rect x="0" y="0" width="190" height="50" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
        <text x="95" y="20" font-size="13" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">已运行的 block</text>
        <text x="95" y="38" font-size="13" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">等待还没开始的 block</text>

        <line x1="95" y1="50" x2="95" y2="70" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-down-red-thick)" />

        <rect x="0" y="80" width="190" height="50" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
        <text x="95" y="100" font-size="13" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">还没开始的 block</text>
        <text x="95" y="118" font-size="13" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">需要等 GPU 资源</text>

        <line x1="95" y1="130" x2="95" y2="150" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-down-red-thick)" />

        <rect x="0" y="160" width="190" height="50" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
        <text x="95" y="180" font-size="13" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">GPU 资源又被</text>
        <text x="95" y="198" font-size="13" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">等待中的 block 占着</text>

        <line x1="95" y1="210" x2="95" y2="230" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-down-red-thick)" />

        <rect x="0" y="240" width="190" height="45" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" />
        <text x="95" y="268" font-size="16" font-family="sans-serif" font-weight="bold" fill="#b91c1c" text-anchor="middle">可能死锁</text>
        <use href="#warning-icon" x="155" y="250" />
    </g>

    <rect x="65" y="300" width="600" height="45" rx="6" fill="#fffaf0" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,4" />
    <use href="#warning-icon" x="85" y="312" />
    <text x="125" y="328" font-size="16" font-family="sans-serif" font-weight="bold" fill="#dc2626">传统 CUDA kernel <tspan fill="#111827">中没有普通的</tspan> global_syncthreads()</text>

</svg>
