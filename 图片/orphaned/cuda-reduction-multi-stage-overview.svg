<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <style>
      .bg { fill: #fbfbf7; }
      .title { font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #1f2933; }
      .subtitle { font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; font-size: 15px; fill: #52606d; }
      .h2 { font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1f2933; }
      .text { font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; font-size: 14px; fill: #243b53; }
      .small { font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; font-size: 12px; fill: #52606d; }
      .tiny { font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; font-size: 11px; fill: #52606d; }
      .panel-blue { fill: #e8f4ff; stroke: #2f80ed; stroke-width: 2; }
      .panel-green { fill: #eaf8ef; stroke: #2f9e44; stroke-width: 2; }
      .panel-amber { fill: #fff4df; stroke: #f59f00; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #8aa0b3; stroke-width: 1.5; }
      .thread { fill: #d7ecff; stroke: #4a90e2; stroke-width: 1.2; }
      .block { fill: #dcfce7; stroke: #2f9e44; stroke-width: 1.2; }
      .partial { fill: #fff3bf; stroke: #f08c00; stroke-width: 1.2; }
      .result { fill: #ffe3e3; stroke: #e03131; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #52606d; stroke-width: 1.8; marker-end: url(#arrow-open); }
      .arrow-blue { fill: none; stroke: #2f80ed; stroke-width: 1.8; marker-end: url(#arrow-open-blue); }
      .arrow-green { fill: none; stroke: #2f9e44; stroke-width: 1.8; marker-end: url(#arrow-open-green); }
      .arrow-amber { fill: none; stroke: #f08c00; stroke-width: 1.8; marker-end: url(#arrow-open-amber); }
      .dash { stroke-dasharray: 6 4; }
    </style>
    <marker id="arrow-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#52606d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-open-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#2f80ed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-open-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#2f9e44" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-open-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#f08c00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="620"/>
  <text class="title" x="36" y="44">从 Vector Add 到 Reduction：输出模型变了</text>
  <text class="subtitle" x="36" y="72">Week 1 是一线程一输出；Week 2 是多线程协作产生 partial sum，再多阶段归约到最终结果。</text>

  <rect class="panel-blue" x="36" y="105" width="410" height="205" rx="18"/>
  <text class="h2" x="60" y="138">Vector Add：一线程一输出</text>
  <text class="small" x="60" y="163">每个 thread 只负责一个 c[i]，线程之间基本互不协作。</text>

  <g transform="translate(62 188)">
    <rect class="thread" x="0" y="0" width="70" height="38" rx="8"/><text class="text" x="22" y="24">T0</text>
    <rect class="thread" x="90" y="0" width="70" height="38" rx="8"/><text class="text" x="112" y="24">T1</text>
    <rect class="thread" x="180" y="0" width="70" height="38" rx="8"/><text class="text" x="202" y="24">T2</text>
    <rect class="thread" x="270" y="0" width="70" height="38" rx="8"/><text class="text" x="292" y="24">T3</text>

    <path class="arrow-blue" d="M35 44 V78"/>
    <path class="arrow-blue" d="M125 44 V78"/>
    <path class="arrow-blue" d="M215 44 V78"/>
    <path class="arrow-blue" d="M305 44 V78"/>

    <rect class="box" x="0" y="86" width="70" height="38" rx="8"/><text class="text" x="18" y="110">c[0]</text>
    <rect class="box" x="90" y="86" width="70" height="38" rx="8"/><text class="text" x="108" y="110">c[1]</text>
    <rect class="box" x="180" y="86" width="70" height="38" rx="8"/><text class="text" x="198" y="110">c[2]</text>
    <rect class="box" x="270" y="86" width="70" height="38" rx="8"/><text class="text" x="288" y="110">c[3]</text>
  </g>

  <rect class="panel-green" x="36" y="348" width="900" height="225" rx="18"/>
  <text class="h2" x="60" y="382">Reduction：多线程协作，先产生 partial sums，再继续归约</text>
  <text class="small" x="60" y="407">目标不是得到 n 个输出，而是把 n 个输入合并成一个或少量结果，例如 sum / max。</text>

  <g transform="translate(60 432)">
    <rect class="box" x="0" y="0" width="58" height="34" rx="7"/><text class="tiny" x="17" y="22">a0</text>
    <rect class="box" x="66" y="0" width="58" height="34" rx="7"/><text class="tiny" x="83" y="22">a1</text>
    <rect class="box" x="132" y="0" width="58" height="34" rx="7"/><text class="tiny" x="149" y="22">a2</text>
    <rect class="box" x="198" y="0" width="58" height="34" rx="7"/><text class="tiny" x="215" y="22">a3</text>
    <rect class="box" x="286" y="0" width="58" height="34" rx="7"/><text class="tiny" x="303" y="22">a4</text>
    <rect class="box" x="352" y="0" width="58" height="34" rx="7"/><text class="tiny" x="369" y="22">a5</text>
    <rect class="box" x="418" y="0" width="58" height="34" rx="7"/><text class="tiny" x="435" y="22">a6</text>
    <rect class="box" x="484" y="0" width="58" height="34" rx="7"/><text class="tiny" x="501" y="22">a7</text>

    <path class="arrow-green" d="M128 42 C128 62 128 70 128 86"/>
    <path class="arrow-green" d="M414 42 C414 62 414 70 414 86"/>

    <rect class="block" x="25" y="92" width="205" height="50" rx="10"/>
    <text class="text" x="63" y="114">Block 0 reduce</text>
    <text class="tiny" x="70" y="133">shared memory + sync</text>

    <rect class="block" x="310" y="92" width="205" height="50" rx="10"/>
    <text class="text" x="348" y="114">Block 1 reduce</text>
    <text class="tiny" x="355" y="133">shared memory + sync</text>

    <path class="arrow-amber" d="M128 148 V176"/>
    <path class="arrow-amber" d="M414 148 V176"/>

    <rect class="partial" x="50" y="184" width="155" height="42" rx="9"/>
    <text class="text" x="78" y="210">partial sum 0</text>
    <rect class="partial" x="335" y="184" width="155" height="42" rx="9"/>
    <text class="text" x="363" y="210">partial sum 1</text>

    <path class="arrow-amber" d="M210 205 H330"/>
    <path class="arrow-amber" d="M493 205 C575 205 610 180 650 150"/>
    <path class="arrow-amber" d="M205 205 C585 240 640 215 690 170"/>

    <rect class="result" x="660" y="116" width="170" height="62" rx="12"/>
    <text class="text" x="704" y="140">final sum</text>
    <text class="tiny" x="682" y="160">second pass / final pass</text>
  </g>

  <rect class="panel-amber" x="485" y="105" width="451" height="205" rx="18"/>
  <text class="h2" x="510" y="138">关键认知变化</text>
  <text class="text" x="510" y="171">1. 输出数量从 n 个变成 1 个或少量。</text>
  <text class="text" x="510" y="201">2. 线程之间必须协作，不能各算各的。</text>
  <text class="text" x="510" y="231">3. 多个 block 先写 partial sums。</text>
  <text class="text" x="510" y="261">4. 再用下一轮 kernel 继续归约。</text>
</svg>
