<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" width="100%" height="100%">
    <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a8a" />
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b823e" />
        </marker>
        <marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
        </marker>

        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>

        <g id="thread-box">
            <rect x="0" y="0" width="40" height="42" rx="4" fill="#ffffff" stroke="#3b823e" stroke-width="1.2" />
            <text x="20" y="16" font-size="11" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">Thread</text>
        </g>
    </defs>

    <rect width="1050" height="480" fill="#ffffff" />

    <text x="525" y="45" font-size="34" font-family="sans-serif" font-weight="bold" fill="#1e3a8a" text-anchor="middle">CUDA 中同步的核心限制</text>

    <rect x="250" y="65" width="550" height="42" rx="6" fill="#fff9d6" stroke="#fcd34d" stroke-width="1.5" />
    <text x="525" y="92" font-size="18" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">block 内部容易同步，block 之间不能随便同步</text>


    <g transform="translate(40, 75)">
        <rect x="0" y="0" width="60" height="64" rx="6" fill="#e0e7ff" stroke="#3b82f6" stroke-width="2" />
        <rect x="6" y="6" width="13" height="13" rx="2" fill="#60a5fa" />
        <rect x="23" y="6" width="13" height="13" rx="2" fill="#60a5fa" />
        <rect x="40" y="6" width="13" height="13" rx="2" fill="#60a5fa" />

        <rect x="6" y="25" width="13" height="13" rx="2" fill="#60a5fa" />
        <rect x="23" y="25" width="13" height="13" rx="2" fill="#60a5fa" />
        <rect x="40" y="25" width="13" height="13" rx="2" fill="#60a5fa" />

        <rect x="6" y="44" width="13" height="13" rx="2" fill="#60a5fa" />
        <rect x="23" y="44" width="13" height="13" rx="2" fill="#60a5fa" />
        <rect x="40" y="44" width="13" height="13" rx="2" fill="#60a5fa" />

        <text x="75" y="25" font-size="16" font-family="sans-serif" font-weight="bold" fill="#1d4ed8">Grid</text>
        <text x="75" y="45" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827">(网格)</text>
    </g>

    <line x1="70" y1="145" x2="70" y2="175" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)" />

    <g transform="translate(40, 185)">
        <rect x="-5" y="0" width="70" height="70" rx="6" fill="#ecfdf5" stroke="#166534" stroke-width="2" />
        <rect x="4" y="9" width="24" height="24" rx="3" fill="#4ade80" stroke="#166534" stroke-width="1" />
        <rect x="32" y="9" width="24" height="24" rx="3" fill="#4ade80" stroke="#166534" stroke-width="1" />
        <rect x="4" y="37" width="24" height="24" rx="3" fill="#4ade80" stroke="#166534" stroke-width="1" />
        <rect x="32" y="37" width="24" height="24" rx="3" fill="#4ade80" stroke="#166534" stroke-width="1" />

        <text x="80" y="30" font-size="16" font-family="sans-serif" font-weight="bold" fill="#15803d">Block</text>
        <text x="75" y="50" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827">(线程块)</text>
    </g>

    <line x1="70" y1="262" x2="70" y2="292" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)" />

    <g transform="translate(48, 305)">
        <rect x="0" y="0" width="44" height="44" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />

        <text x="60" y="20" font-size="16" font-family="sans-serif" font-weight="bold" fill="#d97706">Thread</text>
        <text x="65" y="40" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827">(线程)</text>
    </g>


    <rect x="210" y="115" width="760" height="345" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />

    <rect x="220" y="125" width="30" height="30" rx="4" fill="#1e40af" />
    <text x="235" y="147" font-size="18" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">1.</text>

    <text x="260" y="147" font-size="20" font-family="sans-serif" font-weight="bold" fill="#1e40af">同一个 Block 内：可以用 __syncthreads() 同步</text>

    <rect x="220" y="170" width="540" height="275" rx="6" fill="#f8faf8" stroke="#15803d" stroke-width="1.5" />
    <text x="490" y="190" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">Block 0</text>

    <text x="255" y="235" font-size="13" font-family="sans-serif" font-weight="bold" fill="#333" text-anchor="middle">写入</text>
    <text x="255" y="255" font-size="13" font-family="sans-serif" font-weight="bold" fill="#333" text-anchor="middle">共享内存</text>

    <text x="255" y="338" font-size="13" font-family="sans-serif" font-weight="bold" fill="#333" text-anchor="middle">同步屏障</text>

    <text x="255" y="415" font-size="13" font-family="sans-serif" font-weight="bold" fill="#333" text-anchor="middle">屏障之后</text>
    <text x="255" y="435" font-size="13" font-family="sans-serif" font-weight="bold" fill="#333" text-anchor="middle">继续执行</text>

    <g transform="translate(290, 205)">
        <use href="#thread-box" x="0" y="0" />   <text x="20" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">0</text>
        <use href="#thread-box" x="55" y="0" />  <text x="75" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">1</text>
        <use href="#thread-box" x="110" y="0" /> <text x="130" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">2</text>
        <use href="#thread-box" x="165" y="0" /> <text x="185" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">3</text>
        <use href="#thread-box" x="220" y="0" /> <text x="240" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">4</text>
        <use href="#thread-box" x="275" y="0" /> <text x="295" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">5</text>
        <use href="#thread-box" x="330" y="0" /> <text x="350" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">6</text>
        <use href="#thread-box" x="385" y="0" /> <text x="405" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">7</text>

        <line x1="20" y1="45" x2="20" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="75" y1="45" x2="75" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="130" y1="45" x2="130" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="185" y1="45" x2="185" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="240" y1="45" x2="240" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="295" y1="45" x2="295" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="350" y1="45" x2="350" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="405" y1="45" x2="405" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
    </g>

    <rect x="288" y="278" width="428" height="26" rx="4" fill="#eefaf0" stroke="#15803d" stroke-width="1.2" />
    <text x="502" y="296" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827" text-anchor="middle">共享内存 shared memory / sdata[]</text>

    <line x1="290" y1="334" x2="445" y2="334" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" />
    <text x="505" y="340" font-size="16" font-family="monospace" font-weight="bold" fill="#111827" text-anchor="middle">__syncthreads()</text>
    <line x1="565" y1="334" x2="745" y2="334" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-black)" />

    <g transform="translate(290, 365)">
        <use href="#thread-box" x="0" y="0" />   <text x="20" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">0</text>
        <use href="#thread-box" x="55" y="0" />  <text x="75" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">1</text>
        <use href="#thread-box" x="110" y="0" /> <text x="130" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">2</text>
        <use href="#thread-box" x="165" y="0" /> <text x="185" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">3</text>
        <use href="#thread-box" x="220" y="0" /> <text x="240" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">4</text>
        <use href="#thread-box" x="275" y="0" /> <text x="295" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">5</text>
        <use href="#thread-box" x="330" y="0" /> <text x="350" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">6</text>
        <use href="#thread-box" x="385" y="0" /> <text x="405" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#000" text-anchor="middle">7</text>

        <line x1="20" y1="45" x2="20" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="75" y1="45" x2="75" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="130" y1="45" x2="130" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="185" y1="45" x2="185" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="240" y1="45" x2="240" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="295" y1="45" x2="295" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="350" y1="45" x2="350" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
        <line x1="405" y1="45" x2="405" y2="65" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" />
    </g>


    <rect x="790" y="185" width="160" height="110" rx="8" fill="#f0fcf0" stroke="#86efac" stroke-width="1.5" />
    <g transform="translate(802, 200)">
        <circle cx="12" cy="12" r="12" fill="#16a34a" />
        <path d="M7 12 l3 3 l7 -7" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="832" y="217" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827">含义：</text>
    <text x="815" y="242" font-size="13" font-family="sans-serif" fill="#111827">本 block 内所有线程</text>
    <text x="815" y="262" font-size="13" font-family="sans-serif" fill="#111827">都到这里后，大家再</text>
    <text x="815" y="282" font-size="13" font-family="sans-serif" fill="#111827">一起往下走。</text>

    <rect x="790" y="340" width="160" height="85" rx="8" fill="#f0fcf0" stroke="#86efac" stroke-width="1.5" />
    <g transform="translate(802, 355)">
        <circle cx="12" cy="12" r="12" fill="#16a34a" />
        <path d="M7 12 l3 3 l7 -7" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="832" y="372" font-size="14" font-family="sans-serif" font-weight="bold" fill="#111827">因此可以保证：</text>
    <text x="815" y="397" font-size="13" font-family="sans-serif" fill="#111827">本 block 内所有</text>
    <text x="815" y="417" font-size="13" font-family="sans-serif" fill="#111827">sdata 都已经写好。</text>

</svg>
