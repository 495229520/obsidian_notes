<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>状态上行三订阅通道与 QoS 匹配</title>
  <desc>同一状态话题被三类订阅者消费，QoS 兼容规则决定发布端必须 RELIABLE；9ae4678 后监视路兼作 Seer 聚合路</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="rgb(245, 244, 237)"/>

  <text x="640" y="26" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#444441">状态上行：/{id}_state 的三类订阅通道与 QoS 匹配（9ae4678 后监视路兼聚合）</text>

  <!-- ① 当前订阅 -->
  <rect x="50" y="90" width="360" height="170" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="230" y="112" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">① ros_bridge 当前订阅</text>
  <text x="230" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">subscribeByType：Fr / Aubo / SeerCtrl</text>
  <text x="230" y="156" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">SensorDataQoS（BEST_EFFORT）· /{完整ID}_state</text>
  <text x="230" y="176" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">仅当前选中设备 · 全字段 robotStatusUpdated</text>
  <text x="230" y="196" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">convertSeerMessage：m/rad → mm/deg</text>
  <text x="230" y="216" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">电池/置信度等新字段透传（RobotTypes 扩展）</text>
  <text x="230" y="236" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">10~100Hz → UI 实时面板 + HomePageStatus</text>

  <!-- ② 全量监视 -->
  <rect x="470" y="90" width="360" height="170" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="650" y="112" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">② ros_bridge 全量监视</text>
  <text x="650" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">monitorEntries_：组内每台可心跳设备</text>
  <text x="650" y="156" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">刷 lastSeen + errCode · 3s 窗口 1s 重算</text>
  <text x="650" y="176" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">deviceStatusUpdated → 设备树状态灯</text>
  <text x="650" y="196" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">Seer 兼聚合路：非当前设备也转发遥测</text>
  <text x="650" y="216" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">当前设备由 ① 发布 —— 监视路抑制防双发</text>
  <text x="650" y="236" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">statusText 决策「离线(无数据)」</text>

  <!-- ③ 代理订阅 -->
  <rect x="890" y="90" width="360" height="170" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="1070" y="112" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">③ hyrms_export 代理订阅</text>
  <text x="1070" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">RELIABLE + KeepLast(10)（库默认）</text>
  <text x="1070" y="156" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">connect 后驱动代理结果成员更新</text>
  <text x="1070" y="176" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">发布端 BEST_EFFORT → 代理收不到状态</text>
  <text x="1070" y="196" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">→ connectRobot 卡死无回包（11b042c）</text>
  <text x="1070" y="216" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">由适配器 executor 线程 spin 驱动</text>

  <!-- 发布端 -->
  <rect x="390" y="440" width="500" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="640" y="462" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441">/{id}_state 发布端（下位机 linker / 模拟器）</text>
  <text x="640" y="486" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">必须 RELIABLE + KeepLast(10) —— 11b042c 的教训</text>

  <!-- 箭头：发布端 → 三订阅 -->
  <polyline points="450,440 450,400 230,400 230,262" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="650" y1="440" x2="650" y2="262" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <polyline points="830,440 830,400 1070,400 1070,262" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <text x="640" y="556" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">QoS 兼容规则：BEST_EFFORT 订阅可收 RELIABLE 发布；RELIABLE 订阅收不到 BEST_EFFORT 发布 —— 发布端统一 RELIABLE 才能同时喂饱 ①②③</text>
  <text x="640" y="580" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">聚合链路：①② 的 robotStatusUpdated → Worker.handleRobotStatus → UI 实时面板 + HomePageStatus（首页聚合，变化才推）</text>
</svg>
