<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1370" viewBox="0 0 1320 1370">
  <title>MFMS 数据中台整体分层架构</title>
  <desc>从 Qt UI 到下位机物理设备的九层架构，含 MySQL 事件通道、告警日志平面与首页聚合链路</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1320" height="1370" fill="rgb(245, 244, 237)"/>

  <text x="660" y="26" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#444441">MFMS 数据中台整体分层架构（fix/homepage-client-api @ 2f21499，2026-07）</text>

  <!-- L1 Qt UI -->
  <rect x="340" y="50" width="940" height="86" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="810" y="72" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">Qt UI 主线程（QApplication 事件循环）</text>
  <text x="810" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">hybrid_robot_system · Control（控制权 2s / 导航 1s · 200ms 点击节流）· TaskManager · VisualProgram · Myviz</text>
  <text x="810" y="116" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">HomePage：构造即拉 homePageStatus()/alarmSnapshot() 缓存 · 下拉框前缀白名单（robFro/robAub/agvSrc）</text>

  <line x1="810" y1="136" x2="810" y2="194" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="830" y="162" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">槽调用（UI 线程）→ emit requestXxx</text>

  <!-- L2 Impl -->
  <rect x="340" y="196" width="940" height="74" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="810" y="218" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">CommunicationInterfaceImpl —— Meyers 单例（UI 线程侧）</text>
  <text x="810" y="240" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">requestXxx 信号 ≈30 路 · nextRequestId_ 原子发号（运动接口返回 ID）</text>
  <text x="810" y="258" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">缓存 ×4：deviceTree · deviceStatus · homePageStatus · alarmSnapshot（推送先写缓存再转发）</text>

  <text x="830" y="288" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">Qt::QueuedConnection 跨线程边界（worker 已 moveToThread，自动队列投递）</text>
  <line x1="340" y1="300" x2="1280" y2="300" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="810" y1="270" x2="810" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L3 Worker -->
  <rect x="340" y="330" width="940" height="104" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="810" y="352" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">CommunicationWorker —— QThread 独立线程（事件循环）</text>
  <text x="810" y="376" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">rosNode communication_worker_node · doXxx 槽 ≈34 · 组连接状态机（2s 延迟收尾 / 20s 死线）</text>
  <text x="810" y="396" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">middlePlatformTimer 1s：首页聚合（导航/控制权单飞查询 → HomePageStatus）· alarmTimer 100ms：告警 tail</text>
  <text x="810" y="416" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">resolveCurrentAgvDeviceId 优先已连接代理的 SeerAgv（agvSm4 隔离后防打到无代理设备）</text>

  <line x1="810" y1="434" x2="810" y2="492" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="830" y="462" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">直接成员调用（同线程）</text>

  <!-- L4 Gateway -->
  <rect x="340" y="494" width="940" height="74" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="810" y="516" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">MfmsGatewayImpl —— 门面 Facade（parent 链同属 worker 线程）</text>
  <text x="810" y="538" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">信号直通 ≈30 条（signal→signal）· gateway↔mfms 类型转换 · start: db → ros_bridge → cmd（stop 逆序）</text>
  <text x="810" y="556" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">robotMotionExecuted 新带 requestId 尾参 · moveToRobotWaypoint(requestId) 直通（ac76897）</text>

  <line x1="476" y1="568" x2="476" y2="626" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="809" y1="568" x2="809" y2="626" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1143" y1="568" x2="1143" y2="626" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L5 三服务 -->
  <rect x="340" y="628" width="273" height="130" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="476" y="650" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">MfmsDbService</text>
  <text x="476" y="674" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">QMYSQL 连接 mfms_db_&lt;this&gt;</text>
  <text x="476" y="694" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">100ms 轮询 *_ui_event 消费即删</text>
  <text x="476" y="714" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">load/unload/lua 写态·触发器回退</text>
  <text x="476" y="734" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">DbConfig 默认 127.0.0.1 / hyrms</text>

  <rect x="673" y="628" width="273" height="130" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="809" y="650" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">MfmsRosBridge</text>
  <text x="809" y="674" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">spin_some @100Hz（QTimer 10ms）</text>
  <text x="809" y="694" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">1s 状态评估 · 3s 设备列表轮询</text>
  <text x="809" y="714" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">订阅 /{id}_state · 心跳窗口 3s</text>
  <text x="809" y="734" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">Seer 监视路兼聚合（防双发抑制）</text>

  <rect x="1006" y="628" width="274" height="130" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="1143" y="650" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">MfmsCommandService</text>
  <text x="1143" y="674" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">臂 jog：worker 线程同步直调</text>
  <text x="1143" y="694" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">臂到点：QtConcurrent + 按次 60s</text>
  <text x="1143" y="714" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">AGV：QtConcurrent 池异步</text>
  <text x="1143" y="734" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">agv_path / robot_waypoint 直连 DB</text>

