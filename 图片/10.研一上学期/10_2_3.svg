<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760">
  <title>代理适配器双层锁与 RPC 护栏</title>
  <desc>bac7252 的两段式加锁范式与 ac76897 的按次 RPC 超时：全局锁短持有，RPC 在每设备互斥下执行</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="760" fill="rgb(245, 244, 237)"/>

  <text x="620" y="26" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#444441">代理适配器双层锁与 RPC 护栏（bac7252 双层锁 + ac76897 按次超时）</text>

  <!-- 调用方 -->
  <rect x="40" y="70" width="260" height="130" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="170" y="92" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">调用方线程</text>
  <text x="170" y="116" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">worker 线程（臂 jog 同步）</text>
  <text x="170" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">QtConcurrent 池（AGV · 臂到点）</text>
  <text x="170" y="156" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">到点传 rpcTimeoutSecs=60</text>
  <text x="170" y="176" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">每次调用固定走 ① → ②</text>

  <line x1="300" y1="135" x2="358" y2="135" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ① 全局锁 -->
  <rect x="360" y="70" width="800" height="120" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="760" y="92" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">① 全局 mutex_ —— 只做短持有</text>
  <text x="760" y="116" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">校验 running_ · 查/建代理表（proxies_ / auboProxies_ / SeerCtrl 表）</text>
  <text x="760" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">取每设备锁 opMutexes_[deviceId]（首用创建 · 只增不删，保护在途 RPC）</text>
  <text x="760" y="156" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">AGV：selfControl_ 控制权指纹缓存的读写也仅在此锁内</text>

  <line x1="760" y1="190" x2="760" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="780" y="216" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">释放全局锁后才进入 ②</text>

  <!-- ② 每设备锁 -->
  <rect x="360" y="250" width="800" height="160" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="760" y="272" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">② 每设备 opMutex —— 仅 RPC 期间持有</text>
  <text x="760" y="296" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">同设备串行：代理结果成员（desc_pose / control / msg）非线程安全</text>
  <text x="760" y="316" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">跨设备并行：单台设备卡死不再拖累其他设备与急停</text>
  <text x="760" y="336" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">wait_for_service(1s) 预检 → proxy-&gt;RPC（future 忙轮询 1ms · jog 3s / 到点按次 60s）</text>
  <text x="760" y="356" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">op.unlock() 之后才 emit commandExecuted（避免信号槽重入持锁）</text>
  <text x="760" y="380" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">AGV 接管序列（checkControl→acquire→回查→guideCancel→stopManualCtrl）全程只持本锁</text>

  <line x1="545" y1="410" x2="545" y2="468" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="975" y1="410" x2="975" y2="468" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ③ 超时 -->
  <rect x="360" y="470" width="370" height="150" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="545" y="492" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">③ ShortRpcTimeoutProxy&lt;T&gt;</text>
  <text x="545" y="516" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">派生类访问 protected future_timeout_</text>
  <text x="545" y="536" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">默认（Config，8s）→ 3s 快超时</text>
  <text x="545" y="556" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">applyRpcTimeoutSecs：按次放宽（新增）</text>
  <text x="545" y="576" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">moveJ/L(rpcTimeoutSecs=60) 到点专用</text>
  <text x="545" y="596" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">RPC 返回后恢复 3s（持 opMutex 期间）</text>

  <!-- ④ 回滚 -->
  <rect x="790" y="470" width="370" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="975" y="492" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">④ 失败回滚与清理</text>
  <text x="975" y="516" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">connect 失败：重取全局锁 removeProxy</text>
  <text x="975" y="536" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">removeProxy（AGV）时 clearSelfControl</text>
  <text x="975" y="556" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">opMutex 不随代理销毁（保护在途 RPC）</text>
  <text x="975" y="576" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">Unknown 类型（agvSm4）不建代理</text>
  <text x="975" y="596" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">预检失败消息附带设备 ID（31ac743）</text>

  <text x="620" y="664" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">改造前：全局锁横跨 RPC —— 下位机卡死时 8s/条串行排队（急停同样被阻塞），AGV 接管序列最坏 40s 占锁</text>
  <text x="620" y="688" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">ac76897 动机：到点服务执行完运动才回包，3s 快超时把 &gt;3s 的成功行程误判 -1001 —— 按次放宽而非全局放宽，jog 护栏不变</text>
  <text x="620" y="712" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">浸泡证据：Phase B 并发 3 条 p50 ≈ 2.3×（锁排队实锤）· 异步到点回归 30s/556 条零失败零超时零串扰</text>
</svg>
