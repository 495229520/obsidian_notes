<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
  <rect x="0" y="0" width="1200" height="590" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .amber { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
      .rose { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 8; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">Nsight Compute 指标：从现象回到可能原因</text>
  <text x="56" y="88" class="small">不要单看一个指标；把 occupancy、throughput、memory 和 stall reason 放在一起解释。</text>

  <rect x="70" y="135" width="230" height="150" class="blue"/>
  <text x="105" y="173" class="label">high-level</text>
  <text x="105" y="207" class="small">SM throughput</text>
  <text x="105" y="234" class="small">DRAM throughput</text>
  <text x="105" y="261" class="small">Speed of Light</text>

  <path d="M310 210 H390" class="line"/>

  <rect x="410" y="135" width="230" height="150" class="green"/>
  <text x="445" y="173" class="label">resource</text>
  <text x="445" y="207" class="small">register count</text>
  <text x="445" y="234" class="small">shared memory</text>
  <text x="445" y="261" class="small">achieved occupancy</text>

  <path d="M650 210 H730" class="line"/>

  <rect x="750" y="135" width="230" height="150" class="amber"/>
  <text x="785" y="173" class="label">memory</text>
  <text x="785" y="207" class="small">global load efficiency</text>
  <text x="785" y="234" class="small">bank conflict</text>
  <text x="785" y="261" class="small">cache / DRAM</text>

  <path d="M990 210 H1060" class="line"/>

  <rect x="70" y="350" width="1060" height="82" class="rose"/>
  <text x="100" y="387" class="label">warp stall reason</text>
  <text x="100" y="420" class="small">long scoreboard、memory dependency、barrier、not selected、math pipe throttle 等指标用来解释“warp 为什么没有发射指令”。</text>

  <rect x="70" y="470" width="1060" height="54" class="warn"/>
  <text x="100" y="504" class="small">高 occupancy 不等于快；高 memory throughput 也不等于好。报告必须写出指标组合后的解释。</text>
</svg>
