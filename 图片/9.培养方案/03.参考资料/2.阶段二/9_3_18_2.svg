<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect x="0" y="0" width="1200" height="560" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 19px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 14px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .step { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .desc { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .heur { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .run { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">cuBLASLt 最小 GEMM 调用链</text>
  <text x="56" y="88" class="small">先描述 GEMM 问题，再让 heuristic 返回候选 algorithm，最后执行 matmul。</text>

  <rect x="55" y="150" width="160" height="95" class="step"/>
  <text x="86" y="185" class="label">handle</text>
  <text x="78" y="214" class="small">cublasLtCreate</text>

  <path d="M225 198 H285" class="line"/>

  <rect x="295" y="130" width="190" height="135" class="desc"/>
  <text x="330" y="165" class="label">op desc</text>
  <text x="325" y="195" class="small">compute type</text>
  <text x="325" y="220" class="small">opA / opB</text>
  <text x="325" y="245" class="small">epilogue</text>

  <path d="M495 198 H555" class="line"/>

  <rect x="565" y="130" width="205" height="135" class="desc"/>
  <text x="604" y="165" class="label">matrix layout</text>
  <text x="600" y="195" class="small">A/B/C/D dtype</text>
  <text x="600" y="220" class="small">rows / cols / ld</text>
  <text x="600" y="245" class="small">order</text>

  <path d="M780 198 H840" class="line"/>

  <rect x="850" y="130" width="205" height="135" class="heur"/>
  <text x="892" y="165" class="label">preference</text>
  <text x="890" y="195" class="small">workspace budget</text>
  <text x="890" y="220" class="small">algo constraints</text>
  <text x="890" y="245" class="small">heuristic query</text>

  <path d="M952 275 V338" class="line"/>

  <rect x="770" y="350" width="285" height="105" class="heur"/>
  <text x="815" y="386" class="label">heuristic result</text>
  <text x="815" y="416" class="small">algo + workspace + status</text>

  <path d="M760 402 H675" class="line"/>

  <rect x="430" y="350" width="235" height="105" class="run"/>
  <text x="482" y="386" class="label">cublasLtMatmul</text>
  <text x="470" y="416" class="small">execute selected algo</text>

  <path d="M420 402 H315" class="line"/>

  <rect x="95" y="350" width="210" height="105" class="step"/>
  <text x="142" y="386" class="label">benchmark log</text>
  <text x="132" y="416" class="small">time / TFLOPS / fields</text>

  <text x="78" y="510" class="tiny">每个 descriptor 最终都要映射到 report 字段，否则第三个人无法复现实验条件。</text>
</svg>
