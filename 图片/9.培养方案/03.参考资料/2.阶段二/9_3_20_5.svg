<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect x="0" y="0" width="1200" height="600" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 19px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 14px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .gemm { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .carry { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .next { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">从 GEMM 收束到 LLM kernels / attention / serving</text>
  <text x="56" y="88" class="small">GEMM 项目的价值不是停在 matmul，而是沉淀一套性能工程方法。</text>

  <rect x="70" y="150" width="240" height="190" class="gemm"/>
  <text x="110" y="190" class="label">GEMM lab</text>
  <text x="110" y="225" class="small">CUDA / Triton</text>
  <text x="110" y="252" class="small">baseline discipline</text>
  <text x="110" y="279" class="small">profiling report</text>
  <text x="110" y="306" class="small">limitations</text>

  <path d="M320 245 H430" class="line"/>

  <rect x="450" y="130" width="270" height="230" class="carry"/>
  <text x="490" y="170" class="label">迁移的方法</text>
  <text x="490" y="205" class="small">correctness tests</text>
  <text x="490" y="232" class="small">benchmark protocol</text>
  <text x="490" y="259" class="small">Nsight metrics</text>
  <text x="490" y="286" class="small">roofline thinking</text>
  <text x="490" y="313" class="small">artifact index</text>

  <path d="M730 245 H840" class="line"/>

  <rect x="860" y="115" width="270" height="260" class="next"/>
  <text x="900" y="155" class="label">下一主线</text>
  <text x="900" y="190" class="small">RMSNorm / LayerNorm</text>
  <text x="900" y="217" class="small">RoPE</text>
  <text x="900" y="244" class="small">Attention</text>
  <text x="900" y="271" class="small">FlashAttention</text>
  <text x="900" y="298" class="small">KV cache</text>
  <text x="900" y="325" class="small">LLM serving metrics</text>

  <rect x="70" y="445" width="1060" height="70" class="warn"/>
  <text x="100" y="485" class="small">Week16 的关键判断：GEMM 已经形成闭环，就转入 LLM-specific kernels，不让 matmul 无限拖延主线。</text>
</svg>
