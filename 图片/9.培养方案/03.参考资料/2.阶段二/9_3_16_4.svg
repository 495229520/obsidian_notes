<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 14px; fill: #435363; text-anchor: middle; }
      .small { font-size: 13px; fill: #526475; text-anchor: middle; }
    </style>
  </defs>
  <text x="56" y="54" class="title">Triton autotune 初版记录方式</text>
  <text x="56" y="83" class="subtitle">autotune 是候选配置评估，不是“一键找到全局最优”</text>

  <rect x="78" y="148" width="210" height="210" rx="8" fill="#e8f0f6" stroke="#86a8c4" stroke-width="2"/>
  <text x="183" y="187" class="head">Config A</text>
  <text x="183" y="226" class="body">32 x 32 x 32</text>
  <text x="183" y="252" class="body">num_warps=4</text>
  <text x="183" y="304" class="small">time_ms = ...</text>

  <rect x="346" y="148" width="210" height="210" rx="8" fill="#efe8f6" stroke="#aa92c5" stroke-width="2"/>
  <text x="451" y="187" class="head">Config B</text>
  <text x="451" y="226" class="body">64 x 64 x 32</text>
  <text x="451" y="252" class="body">num_warps=4</text>
  <text x="451" y="304" class="small">time_ms = ...</text>

  <rect x="614" y="148" width="210" height="210" rx="8" fill="#f4ead7" stroke="#c6a661" stroke-width="2"/>
  <text x="719" y="187" class="head">Config C</text>
  <text x="719" y="226" class="body">64 x 128 x 32</text>
  <text x="719" y="252" class="body">num_warps=8</text>
  <text x="719" y="304" class="small">time_ms = ...</text>

  <rect x="882" y="174" width="150" height="158" rx="8" fill="#e7efe3" stroke="#84a96d" stroke-width="2"/>
  <text x="957" y="215" class="head">Best</text>
  <text x="957" y="252" class="body">per shape</text>
  <text x="957" y="278" class="small">not global</text>

  <line x1="300" y1="253" x2="332" y2="253" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="568" y1="253" x2="600" y2="253" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="836" y1="253" x2="868" y2="253" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="156" y="430" width="808" height="54" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="560" y="464" class="body">保留所有候选配置、key、warmup/repeat 和结果；不要只保存最佳数字。</text>
</svg>
