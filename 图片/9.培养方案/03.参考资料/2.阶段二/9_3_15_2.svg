<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 14px; fill: #435363; text-anchor: middle; }
      .small { font-size: 13px; fill: #526475; text-anchor: middle; }
    </style>
  </defs>
  <text x="56" y="54" class="title">四类 GEMM 实现的定位</text>
  <text x="56" y="83" class="subtitle">报告里要明确区分：自己写的、DSL 实现、复现的模板库、vendor baseline</text>

  <rect x="72" y="142" width="216" height="236" rx="8" fill="#e8f0f6" stroke="#86a8c4" stroke-width="2"/>
  <text x="180" y="180" class="head">手写 CUDA</text>
  <text x="180" y="224" class="body">naive</text>
  <text x="180" y="250" class="body">tiled</text>
  <text x="180" y="276" class="body">register blocking</text>
  <text x="180" y="330" class="small">学习优化路径</text>

  <rect x="332" y="142" width="216" height="236" rx="8" fill="#efe8f6" stroke="#aa92c5" stroke-width="2"/>
  <text x="440" y="180" class="head">Triton v1</text>
  <text x="440" y="224" class="body">program tile</text>
  <text x="440" y="250" class="body">mask</text>
  <text x="440" y="276" class="body">BLOCK sweep</text>
  <text x="440" y="330" class="small">DSL 快速实现</text>

  <rect x="592" y="142" width="216" height="236" rx="8" fill="#f4ead7" stroke="#c6a661" stroke-width="2"/>
  <text x="700" y="180" class="head">CUTLASS</text>
  <text x="700" y="224" class="body">example</text>
  <text x="700" y="250" class="body">profiler</text>
  <text x="700" y="276" class="body">hierarchy</text>
  <text x="700" y="330" class="small">工业模板库参考</text>

  <rect x="852" y="142" width="216" height="236" rx="8" fill="#e7efe3" stroke="#84a96d" stroke-width="2"/>
  <text x="960" y="180" class="head">cuBLAS</text>
  <text x="960" y="224" class="body">SGEMM</text>
  <text x="960" y="250" class="body">vendor library</text>
  <text x="960" y="276" class="body">ratio baseline</text>
  <text x="960" y="330" class="small">性能基准</text>

  <rect x="164" y="442" width="792" height="54" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="560" y="476" class="body">写报告时：CUDA / Triton 是自己的实现；CUTLASS / cuBLAS 是复现和分析的库 baseline。</text>
</svg>
