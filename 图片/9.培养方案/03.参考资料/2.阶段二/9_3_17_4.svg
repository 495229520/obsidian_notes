<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
  <rect x="0" y="0" width="1200" height="590" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .bank0 { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .bank1 { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .bank2 { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .bank3 { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">shared memory layout：padding 只是为了解决特定 bank conflict</text>
  <text x="56" y="88" class="small">shared memory 很快，但 warp 内同一轮访问落到同一 bank 时会被拆成多次请求。</text>

  <rect x="70" y="130" width="470" height="330" class="panel"/>
  <text x="95" y="168" class="label">无 padding：stride = BLOCK_N</text>
  <text x="95" y="197" class="small">列式访问可能重复命中同一组 bank</text>
  <g transform="translate(95 225)">
    <rect x="0" y="0" width="52" height="42" class="bank0"/><rect x="52" y="0" width="52" height="42" class="bank1"/><rect x="104" y="0" width="52" height="42" class="bank2"/><rect x="156" y="0" width="52" height="42" class="bank3"/>
    <rect x="0" y="48" width="52" height="42" class="bank0"/><rect x="52" y="48" width="52" height="42" class="bank1"/><rect x="104" y="48" width="52" height="42" class="bank2"/><rect x="156" y="48" width="52" height="42" class="bank3"/>
    <rect x="0" y="96" width="52" height="42" class="bank0"/><rect x="52" y="96" width="52" height="42" class="bank1"/><rect x="104" y="96" width="52" height="42" class="bank2"/><rect x="156" y="96" width="52" height="42" class="bank3"/>
    <rect x="0" y="144" width="52" height="42" class="bank0"/><rect x="52" y="144" width="52" height="42" class="bank1"/><rect x="104" y="144" width="52" height="42" class="bank2"/><rect x="156" y="144" width="52" height="42" class="bank3"/>
    <path d="M26 18 L26 160" stroke="#dc2626" stroke-width="4"/>
    <text x="245" y="32" class="tiny">同一列访问</text>
    <text x="245" y="58" class="tiny">可能反复落到相同 bank</text>
    <text x="245" y="84" class="tiny">表现：bank conflict 指标上升</text>
  </g>

  <path d="M560 300 H650" class="line"/>

  <rect x="670" y="130" width="460" height="330" class="panel"/>
  <text x="695" y="168" class="label">加 padding：stride = BLOCK_N + 1</text>
  <text x="695" y="197" class="small">下一行起点错开，某些列式访问冲突减少</text>
  <g transform="translate(695 225)">
    <rect x="0" y="0" width="52" height="42" class="bank0"/><rect x="52" y="0" width="52" height="42" class="bank1"/><rect x="104" y="0" width="52" height="42" class="bank2"/><rect x="156" y="0" width="52" height="42" class="bank3"/><rect x="208" y="0" width="28" height="42" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="0" y="48" width="52" height="42" class="bank1"/><rect x="52" y="48" width="52" height="42" class="bank2"/><rect x="104" y="48" width="52" height="42" class="bank3"/><rect x="156" y="48" width="52" height="42" class="bank0"/><rect x="208" y="48" width="28" height="42" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="0" y="96" width="52" height="42" class="bank2"/><rect x="52" y="96" width="52" height="42" class="bank3"/><rect x="104" y="96" width="52" height="42" class="bank0"/><rect x="156" y="96" width="52" height="42" class="bank1"/><rect x="208" y="96" width="28" height="42" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="0" y="144" width="52" height="42" class="bank3"/><rect x="52" y="144" width="52" height="42" class="bank0"/><rect x="104" y="144" width="52" height="42" class="bank1"/><rect x="156" y="144" width="52" height="42" class="bank2"/><rect x="208" y="144" width="28" height="42" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="245" y="32" class="tiny">padding column</text>
    <text x="245" y="58" class="tiny">改变下一行起始 bank</text>
    <text x="245" y="84" class="tiny">但会增加 shared memory 用量</text>
  </g>

  <rect x="70" y="498" width="1060" height="58" class="warn"/>
  <text x="95" y="535" class="small">结论必须来自指标：shared_bank_conflict 下降不等于 TFLOPS 一定提升，还要看 shared memory bytes、occupancy 和 stall reason。</text>
</svg>
