<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect x="0" y="0" width="1200" height="560" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .amber { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .rose { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">comparison report 的主结论必须可追溯</text>
  <text x="56" y="88" class="small">Week16 的 report polish 重点不是美化，而是让每个 finding 回到证据。</text>

  <rect x="70" y="150" width="210" height="120" class="blue"/>
  <text x="115" y="188" class="label">Finding</text>
  <text x="105" y="222" class="small">CUDA v2 improves</text>
  <text x="105" y="249" class="small">on shape X</text>

  <path d="M290 210 H380" class="line"/>

  <rect x="400" y="150" width="210" height="120" class="green"/>
  <text x="445" y="188" class="label">Evidence</text>
  <text x="435" y="222" class="small">CSV row</text>
  <text x="435" y="249" class="small">Nsight report</text>

  <path d="M620 210 H710" class="line"/>

  <rect x="730" y="150" width="210" height="120" class="amber"/>
  <text x="765" y="188" class="label">Interpretation</text>
  <text x="765" y="222" class="small">data reuse</text>
  <text x="765" y="249" class="small">resource tradeoff</text>

  <path d="M950 210 H1030" class="line"/>

  <rect x="70" y="350" width="1060" height="86" class="rose"/>
  <text x="100" y="387" class="label">Limitation</text>
  <text x="100" y="420" class="small">不外推到所有 GPU、所有 dtype、所有 shape；不把 CUTLASS / cuBLAS / cuBLASLt 说成手写实现。</text>

  <rect x="1045" y="156" width="85" height="108" class="warn"/>
  <text x="1065" y="198" class="small">Trust</text>
  <text x="1062" y="226" class="tiny">not hype</text>
</svg>
