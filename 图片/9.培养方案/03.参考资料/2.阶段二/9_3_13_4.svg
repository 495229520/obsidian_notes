<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #435363; }
      .cell { font-size: 13px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
      .metric { font-size: 14px; font-weight: 700; fill: #334155; }
    </style>
  </defs>

  <text x="56" y="54" class="title">Register Blocking v1: reuse 与 pressure 的交换</text>
  <text x="56" y="83" class="subtitle">一个线程计算多个 C 输出，可以复用 A/B，也会消耗更多寄存器</text>

  <rect x="78" y="130" width="286" height="286" rx="8" fill="#e8f0f6" stroke="#89a9c6" stroke-width="2"/>
  <text x="110" y="168" class="head">1x1 baseline</text>
  <rect x="132" y="214" width="62" height="62" fill="#dcfce7" stroke="#7da66d"/>
  <text x="163" y="245" class="cell">C0</text>
  <text x="220" y="238" class="body">一个线程</text>
  <text x="220" y="263" class="body">一个 accumulator</text>
  <text x="110" y="336" class="body">优点：简单、寄存器少</text>
  <text x="110" y="364" class="body">缺点：线程内复用少</text>

  <rect x="418" y="130" width="286" height="286" rx="8" fill="#e7efe3" stroke="#84a96d" stroke-width="2"/>
  <text x="450" y="168" class="head">1x2 thread tile</text>
  <rect x="472" y="214" width="62" height="62" fill="#dcfce7" stroke="#7da66d"/>
  <rect x="540" y="214" width="62" height="62" fill="#dcfce7" stroke="#7da66d"/>
  <text x="503" y="245" class="cell">C0</text>
  <text x="571" y="245" class="cell">C1</text>
  <line x1="504" y1="306" x2="570" y2="306" stroke="#3f7f5f" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="450" y="336" class="body">同一个 A[row, k] 可服务两个输出</text>
  <text x="450" y="364" class="body">accumulator 从 1 个变成 2 个</text>

  <rect x="758" y="130" width="286" height="286" rx="8" fill="#f4ead7" stroke="#c6a661" stroke-width="2"/>
  <text x="790" y="168" class="head">2x2 thread tile</text>
  <rect x="812" y="214" width="54" height="54" fill="#dcfce7" stroke="#7da66d"/>
  <rect x="872" y="214" width="54" height="54" fill="#dcfce7" stroke="#7da66d"/>
  <rect x="812" y="274" width="54" height="54" fill="#dcfce7" stroke="#7da66d"/>
  <rect x="872" y="274" width="54" height="54" fill="#dcfce7" stroke="#7da66d"/>
  <text x="839" y="241" class="cell">C00</text>
  <text x="899" y="241" class="cell">C01</text>
  <text x="839" y="301" class="cell">C10</text>
  <text x="899" y="301" class="cell">C11</text>
  <text x="790" y="364" class="body">复用更多，但 accumulator 和临时值更多</text>

  <line x1="376" y1="273" x2="404" y2="273" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="716" y1="273" x2="744" y2="273" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="158" y="462" width="804" height="48" rx="8" fill="#fffaf0" stroke="#d7c083"/>
  <text x="200" y="493" class="metric">Nsight 观察：</text>
  <text x="296" y="493" class="body">registers/thread ↑ 可能让 achieved occupancy ↓；如果出现 spill，性能可能反而下降。</text>
</svg>
