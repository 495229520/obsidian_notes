<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect x="0" y="0" width="1200" height="560" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .perf { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .prof { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">GEMM report 的证据链：不要让 finding 悬空</text>
  <text x="56" y="88" class="small">每个结论都必须能回到 correctness、benchmark 和 profiling 证据。</text>

  <rect x="70" y="150" width="220" height="145" class="ok"/>
  <text x="105" y="188" class="label">correctness</text>
  <text x="105" y="222" class="small">reference</text>
  <text x="105" y="249" class="small">tolerance</text>
  <text x="105" y="276" class="small">max abs / RMS</text>

  <path d="M300 222 H390" class="line"/>

  <rect x="410" y="150" width="220" height="145" class="perf"/>
  <text x="455" y="188" class="label">benchmark</text>
  <text x="455" y="222" class="small">time_ms</text>
  <text x="455" y="249" class="small">TFLOPS</text>
  <text x="455" y="276" class="small">ratio vs baseline</text>

  <path d="M640 222 H730" class="line"/>

  <rect x="750" y="150" width="220" height="145" class="prof"/>
  <text x="795" y="188" class="label">profiling</text>
  <text x="795" y="222" class="small">occupancy</text>
  <text x="795" y="249" class="small">throughput</text>
  <text x="795" y="276" class="small">stall reason</text>

  <path d="M980 222 H1070" class="line"/>

  <rect x="70" y="365" width="1060" height="86" class="warn"/>
  <text x="100" y="402" class="label">finding 模板</text>
  <text x="100" y="435" class="small">Finding -> Evidence -> Interpretation -> Limitation。少任何一段，都容易变成只堆数字或只讲故事。</text>

  <rect x="1080" y="174" width="50" height="98" class="card"/>
  <text x="1044" y="320" class="tiny">report finding</text>
</svg>
