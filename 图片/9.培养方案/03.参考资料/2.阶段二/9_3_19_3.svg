<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect x="0" y="0" width="1200" height="620" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .axis { stroke: #111827; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .mem { stroke: #2563eb; stroke-width: 4; fill: none; }
      .compute { stroke: #16a34a; stroke-width: 4; fill: none; }
      .point1 { fill: #dc2626; stroke: #991b1b; stroke-width: 2; }
      .point2 { fill: #d97706; stroke: #92400e; stroke-width: 2; }
      .point3 { fill: #2563eb; stroke: #1e3a8a; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
    </style>
  </defs>

  <text x="56" y="55" class="title">roofline thinking：用 FLOPs / bytes 判断瓶颈方向</text>
  <text x="56" y="88" class="small">Week15 不要求论文级模型，但要说明性能点更像 memory-bound、compute-bound，还是实现开销不足。</text>

  <line x1="110" y1="500" x2="620" y2="500" class="axis"/>
  <line x1="110" y1="500" x2="110" y2="145" class="axis"/>
  <text x="300" y="545" class="small">Arithmetic Intensity = FLOPs / bytes</text>
  <text x="30" y="315" class="small" transform="rotate(-90 30 315)">Performance / TFLOPS</text>

  <path d="M120 480 L365 250" class="mem"/>
  <path d="M365 250 H600" class="compute"/>
  <text x="210" y="350" class="small" fill="#2563eb">memory roof</text>
  <text x="430" y="235" class="small" fill="#16a34a">compute roof</text>

  <circle cx="250" cy="390" r="10" class="point1"/>
  <text x="270" y="394" class="tiny">CUDA v1</text>
  <circle cx="360" cy="315" r="10" class="point2"/>
  <text x="380" y="319" class="tiny">CUDA v2</text>
  <circle cx="500" cy="265" r="10" class="point3"/>
  <text x="520" y="269" class="tiny">vendor baseline</text>

  <rect x="690" y="150" width="420" height="210" class="panel"/>
  <text x="725" y="190" class="label">GEMM 估算口径</text>
  <text x="725" y="228" class="small">FLOPs = 2 * M * N * K</text>
  <text x="725" y="258" class="small">TFLOPS = FLOPs / seconds / 1e12</text>
  <text x="725" y="288" class="small">bytes ~= sizeof(dtype) * (M*K + K*N + M*N)</text>
  <text x="725" y="318" class="small">AI ~= FLOPs / bytes</text>

  <rect x="690" y="395" width="420" height="84" class="warn"/>
  <text x="725" y="430" class="label">边界</text>
  <text x="725" y="460" class="small">AI 是 roofline thinking，不是真实 memory traffic 证明。</text>
</svg>
