<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect x="0" y="0" width="1200" height="620" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .grid { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .cta { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .warp { fill: #fef3c7; stroke: #d97706; stroke-width: 2.4; }
      .thread { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.4; }
      .reg { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <text x="56" y="55" class="title">GEMM v2 的三层 tile hierarchy</text>
  <text x="56" y="88" class="small">C tile 先分给 threadblock，再分给 warp，最后落到 thread 的 register accumulator。</text>

  <rect x="70" y="135" width="330" height="330" class="grid" rx="8"/>
  <line x1="70" y1="217.5" x2="400" y2="217.5" class="dash"/>
  <line x1="70" y1="300" x2="400" y2="300" class="dash"/>
  <line x1="70" y1="382.5" x2="400" y2="382.5" class="dash"/>
  <line x1="152.5" y1="135" x2="152.5" y2="465" class="dash"/>
  <line x1="235" y1="135" x2="235" y2="465" class="dash"/>
  <line x1="317.5" y1="135" x2="317.5" y2="465" class="dash"/>
  <rect x="70" y="135" width="165" height="165" class="cta" rx="6"/>
  <text x="100" y="195" class="label">CTA tile</text>
  <text x="100" y="225" class="small">BLOCK_M x BLOCK_N</text>
  <text x="100" y="252" class="small">shared memory scope</text>
  <text x="70" y="500" class="small">C matrix 被切成 threadblock tiles</text>

  <path d="M420 252 H510" class="line"/>

  <rect x="530" y="135" width="270" height="210" class="cta" rx="8"/>
  <rect x="555" y="165" width="105" height="72" class="warp" rx="6"/>
  <rect x="670" y="165" width="105" height="72" class="warp" rx="6"/>
  <rect x="555" y="250" width="105" height="72" class="warp" rx="6"/>
  <rect x="670" y="250" width="105" height="72" class="warp" rx="6"/>
  <text x="581" y="208" class="small">warp 0</text>
  <text x="696" y="208" class="small">warp 1</text>
  <text x="581" y="293" class="small">warp 2</text>
  <text x="696" y="293" class="small">warp 3</text>
  <text x="535" y="382" class="small">每个 warp 负责 CTA tile 的一块</text>

  <path d="M815 252 H900" class="line"/>

  <rect x="920" y="135" width="220" height="210" class="warp" rx="8"/>
  <rect x="960" y="175" width="52" height="52" class="thread" rx="5"/>
  <rect x="1020" y="175" width="52" height="52" class="thread" rx="5"/>
  <rect x="960" y="235" width="52" height="52" class="thread" rx="5"/>
  <rect x="1020" y="235" width="52" height="52" class="thread" rx="5"/>
  <text x="967" y="206" class="tiny">T0</text>
  <text x="1027" y="206" class="tiny">T1</text>
  <text x="967" y="266" class="tiny">T2</text>
  <text x="1027" y="266" class="tiny">T3</text>
  <text x="940" y="382" class="small">thread tile: THREAD_M x THREAD_N</text>

  <rect x="920" y="445" width="220" height="105" class="reg" rx="8"/>
  <text x="950" y="480" class="label">register acc</text>
  <text x="950" y="510" class="small">acc[THREAD_M][THREAD_N]</text>
  <path d="M1030 345 V428" class="line"/>

  <text x="74" y="565" class="tiny">设计检查：BLOCK_M/BLOCK_N/BLOCK_K、WARPS_PER_BLOCK、THREAD_M/THREAD_N、shared memory bytes、register count 必须一起记录。</text>
</svg>
