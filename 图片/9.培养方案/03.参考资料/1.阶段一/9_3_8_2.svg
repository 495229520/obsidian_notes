  <text x="989" y="470" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#8a4f12">C[row, col]</text>

  <path d="M385 344 L430 344" fill="none" stroke="#42545a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M767 344 L824 344" fill="none" stroke="#42545a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="110" y="608" width="980" height="82" rx="16" ry="16" fill="#eef3ef" stroke="#afbeb6" stroke-width="1.6"/>
  <text x="600" y="636" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#1d5c63">C[row,col] = sum_k A[row,k] * B[k,col]</text>
  <text x="600" y="668" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#33464b">K 越大，每个输出元素累加越长，误差和计算量都增加</text>
