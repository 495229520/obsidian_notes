<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200px" height="760px" viewBox="0 0 1200 760" version="1.1">
  <title>Single C element as dot product in matmul</title>
  <desc>Teaching diagram for C row col equals dot product between one row of A and one column of B over K dimension.</desc>
  <rect x="0" y="0" width="1200" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#42545a"/>
