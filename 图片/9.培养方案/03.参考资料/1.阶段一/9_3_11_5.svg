<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 15px; fill: #334155; }
      .small { font-size: 13px; fill: #ffffff; font-weight: 700; }
    </style>
  </defs>
  <text font-family="Inter, Arial, sans-serif" x="70" y="70" class="title">Contiguous KV vs Paged KV for Variable-Length Requests</text>
  <text font-family="Inter, Arial, sans-serif" x="70" y="105" class="subtitle">Paged KV reduces fragmentation and improves scheduling flexibility, with block table overhead</text>
  <rect x="80" y="165" width="520" height="460" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="120" y="215" class="label">Contiguous KV</text>
  <text font-family="Inter, Arial, sans-serif" x="120" y="250" class="text">Each request reserves a large contiguous range</text>
  <rect x="120" y="300" width="410" height="48" rx="8" fill="#fb923c"/>
  <text font-family="Inter, Arial, sans-serif" x="140" y="331" class="small">req A long</text>
  <rect x="120" y="365" width="170" height="48" rx="8" fill="#fb923c"/>
  <rect x="300" y="365" width="230" height="48" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-dasharray="6 6"/>
  <text font-family="Inter, Arial, sans-serif" x="140" y="396" class="small">req B short</text>
  <text font-family="Inter, Arial, sans-serif" x="338" y="396" class="text">reserved / wasted</text>
  <rect x="120" y="430" width="250" height="48" rx="8" fill="#fb923c"/>
  <rect x="380" y="430" width="150" height="48" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-dasharray="6 6"/>
  <text font-family="Inter, Arial, sans-serif" x="140" y="461" class="small">req C medium</text>
  <text font-family="Inter, Arial, sans-serif" x="120" y="545" class="text">Risk: internal waste, holes after completion, hard admission under long context</text>
  <rect x="680" y="165" width="520" height="460" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="720" y="215" class="label">Paged KV</text>
  <text font-family="Inter, Arial, sans-serif" x="720" y="250" class="text">Requests map logical blocks to physical pages</text>
  <rect x="720" y="300" width="70" height="48" rx="8" fill="#16a34a"/>
  <rect x="800" y="300" width="70" height="48" rx="8" fill="#16a34a"/>
  <rect x="880" y="300" width="70" height="48" rx="8" fill="#16a34a"/>
  <rect x="960" y="300" width="70" height="48" rx="8" fill="#16a34a"/>
  <text font-family="Inter, Arial, sans-serif" x="742" y="331" class="small">A0</text>
  <text font-family="Inter, Arial, sans-serif" x="822" y="331" class="small">A1</text>
  <text font-family="Inter, Arial, sans-serif" x="902" y="331" class="small">A2</text>
  <text font-family="Inter, Arial, sans-serif" x="982" y="331" class="small">A3</text>
  <rect x="720" y="375" width="70" height="48" rx="8" fill="#22c55e"/>
  <text font-family="Inter, Arial, sans-serif" x="742" y="406" class="small">B0</text>
  <rect x="800" y="375" width="70" height="48" rx="8" fill="#22c55e"/>
  <text font-family="Inter, Arial, sans-serif" x="822" y="406" class="small">C0</text>
  <rect x="880" y="375" width="70" height="48" rx="8" fill="#22c55e"/>
  <text font-family="Inter, Arial, sans-serif" x="902" y="406" class="small">C1</text>
  <rect x="960" y="375" width="70" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="6 6"/>
  <text font-family="Inter, Arial, sans-serif" x="982" y="406" class="text">free</text>
  <rect x="720" y="495" width="300" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text font-family="Menlo, Consolas, monospace" x="745" y="529" class="text">block_table: A->[0,1,2,3], B->[4], C->[5,6]</text>
  <text font-family="Inter, Arial, sans-serif" x="720" y="585" class="text">Benefit: allocate on demand; Cost: page table / indirection overhead</text>
</svg>
