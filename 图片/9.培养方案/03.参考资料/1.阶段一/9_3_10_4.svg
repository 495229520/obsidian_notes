<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #475569; }
      .step { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .text { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #334155; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #64748b; }
    </style>
  </defs>

  <text font-family="Inter, Arial, sans-serif" x="70" y="70" class="title">Serving Runbook Template</text>
  <text font-family="Inter, Arial, sans-serif" x="70" y="105" class="subtitle">不要只写原因列表，要写看到症状后的下一步动作</text>

  <rect x="60" y="240" width="165" height="155" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="88" y="286" class="step">Symptom</text>
  <text font-family="Inter, Arial, sans-serif" x="88" y="323" class="text">TTFT p95 high</text>
  <text font-family="Inter, Arial, sans-serif" x="88" y="352" class="text">TPOT high</text>
  <text font-family="Inter, Arial, sans-serif" x="88" y="381" class="text">failed rises</text>

  <rect x="275" y="240" width="165" height="155" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="303" y="286" class="step">Metrics</text>
  <text font-family="Inter, Arial, sans-serif" x="303" y="323" class="text">queue time</text>
  <text font-family="Inter, Arial, sans-serif" x="303" y="352" class="text">running / waiting</text>
  <text font-family="Inter, Arial, sans-serif" x="303" y="381" class="text">KV cache</text>

  <rect x="490" y="240" width="165" height="155" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="518" y="286" class="step">Cause</text>
  <text font-family="Inter, Arial, sans-serif" x="518" y="323" class="text">backlog</text>
  <text font-family="Inter, Arial, sans-serif" x="518" y="352" class="text">prefill-heavy</text>
  <text font-family="Inter, Arial, sans-serif" x="518" y="381" class="text">decode pressure</text>

  <rect x="705" y="240" width="165" height="155" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="733" y="286" class="step">Experiment</text>
  <text font-family="Inter, Arial, sans-serif" x="733" y="323" class="text">lower req/s</text>
  <text font-family="Inter, Arial, sans-serif" x="733" y="352" class="text">sweep conc</text>
  <text font-family="Inter, Arial, sans-serif" x="733" y="381" class="text">split workload</text>

  <rect x="920" y="240" width="165" height="155" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="948" y="286" class="step">Mitigate</text>
  <text font-family="Inter, Arial, sans-serif" x="948" y="323" class="text">rate limit</text>
  <text font-family="Inter, Arial, sans-serif" x="948" y="352" class="text">shorten context</text>
  <text font-family="Inter, Arial, sans-serif" x="948" y="381" class="text">add replica</text>

  <rect x="1075" y="510" width="135" height="95" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="1100" y="550" class="step">Fix</text>
  <text font-family="Inter, Arial, sans-serif" x="1100" y="582" class="text">capacity</text>

  <path d="M225 318 H255" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M440 318 H470" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M655 318 H685" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M870 318 H900" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1003 395 V465 H1142 V492" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="110" y="510" width="810" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="145" y="548" class="text">每个症状都要能落到一个实验：复跑同一 workload、扫 request rate、扫 max concurrency、拆短 prompt / 长 prompt。</text>
  <text font-family="Inter, Arial, sans-serif" x="145" y="580" class="small">Runbook 目标：新人照着做也能收集证据，而不是只看到“可能是系统压力”。</text>
</svg>
