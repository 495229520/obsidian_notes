<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 15px; fill: #334155; }
      .code { font-size: 14px; fill: #0f172a; }
      .page { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <text font-family="Inter, Arial, sans-serif" x="70" y="70" class="title">Paged KV: Logical Tokens to Physical Pages</text>
  <text font-family="Inter, Arial, sans-serif" x="70" y="105" class="subtitle">request -> logical positions -> block table -> physical KV pages</text>
  <rect x="70" y="185" width="240" height="155" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="105" y="235" class="label">Request</text>
  <text font-family="Inter, Arial, sans-serif" x="105" y="272" class="text">request_id = 17</text>
  <text font-family="Inter, Arial, sans-serif" x="105" y="302" class="text">seq_len = 10</text>
  <rect x="385" y="185" width="300" height="155" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="420" y="235" class="label">Logical positions</text>
  <text font-family="Menlo, Consolas, monospace" x="420" y="275" class="code">[0..3] [4..7] [8..9]</text>
  <text font-family="Inter, Arial, sans-serif" x="420" y="307" class="text">block size = 4 tokens</text>
  <rect x="760" y="170" width="260" height="190" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="795" y="220" class="label">Block table</text>
  <text font-family="Menlo, Consolas, monospace" x="795" y="262" class="code">logical 0 -> page 12</text>
  <text font-family="Menlo, Consolas, monospace" x="795" y="292" class="code">logical 1 -> page 05</text>
  <text font-family="Menlo, Consolas, monospace" x="795" y="322" class="code">logical 2 -> page 31</text>
  <rect x="170" y="500" width="940" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="210" y="545" class="label">Physical KV page pool</text>
  <rect x="210" y="570" width="92" height="34" rx="8" fill="#64748b"/>
  <rect x="320" y="570" width="92" height="34" rx="8" fill="#16a34a"/>
  <rect x="430" y="570" width="92" height="34" rx="8" fill="#64748b"/>
  <rect x="540" y="570" width="92" height="34" rx="8" fill="#16a34a"/>
  <rect x="650" y="570" width="92" height="34" rx="8" fill="#64748b"/>
  <rect x="760" y="570" width="92" height="34" rx="8" fill="#16a34a"/>
  <rect x="870" y="570" width="92" height="34" rx="8" fill="#64748b"/>
  <text font-family="Inter, Arial, sans-serif" x="234" y="593" class="page">page 04</text>
  <text font-family="Inter, Arial, sans-serif" x="344" y="593" class="page">page 05</text>
  <text font-family="Inter, Arial, sans-serif" x="454" y="593" class="page">page 06</text>
  <text font-family="Inter, Arial, sans-serif" x="564" y="593" class="page">page 12</text>
  <text font-family="Inter, Arial, sans-serif" x="674" y="593" class="page">page 18</text>
  <text font-family="Inter, Arial, sans-serif" x="784" y="593" class="page">page 31</text>
  <text font-family="Inter, Arial, sans-serif" x="894" y="593" class="page">page 32</text>
  <path d="M310 262 H365" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M685 262 H740" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M890 360 V480" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text font-family="Inter, Arial, sans-serif" x="405" y="682" class="text">Physical pages need not be contiguous; kernel follows the block table during attention.</text>
</svg>
