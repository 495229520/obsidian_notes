<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">CUDA Week 2 Reduction 前置知识迁移图</title>
  <desc id="desc">从 vector add 到 reduction，再到 benchmark 和 profiling 证据链的概念迁移图。</desc>
  <rect x="0" y="0" width="980" height="620" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="490" y="38" fill="#0C447C" font-family="system-ui,sans-serif" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central">从 Week 1 vector add 迁移到 Week 2 reduction + profiling</text>

  <rect x="40" y="86" width="180" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="116" fill="#0C447C" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">vector add</text>
  <text x="130" y="140" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">线程独立写 c[i]</text>

  <rect x="290" y="86" width="180" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="380" y="116" fill="#633806" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">reduction</text>
  <text x="380" y="140" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">多线程共同产出 sum</text>

  <rect x="540" y="86" width="180" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="630" y="116" fill="#085041" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">partial sum</text>
  <text x="630" y="140" fill="#085041" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">每个 block 先汇总一段</text>

  <rect x="790" y="86" width="150" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="865" y="116" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">multi-pass</text>
  <text x="865" y="140" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">多次 kernel 汇总</text>

  <rect x="165" y="260" width="190" height="82" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="260" y="290" fill="#085041" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">shared memory</text>
  <text x="260" y="315" fill="#085041" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">block 内共享临时工作区</text>

  <rect x="420" y="260" width="190" height="82" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="515" y="290" fill="#633806" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">__syncthreads()</text>
  <text x="515" y="315" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">只同步同一个 block</text>

  <rect x="675" y="260" width="190" height="82" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="770" y="290" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">warp shuffle</text>
  <text x="770" y="315" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">warp 内交换寄存器值</text>

  <rect x="125" y="445" width="210" height="82" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="230" y="475" fill="#444441" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">correctness</text>
  <text x="230" y="500" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">边界 / FP32 误差 / Check</text>

  <rect x="395" y="445" width="210" height="82" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="500" y="475" fill="#0C447C" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">CUDA event benchmark</text>
  <text x="500" y="500" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">回答“跑多快”</text>

  <rect x="665" y="445" width="210" height="82" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="770" y="475" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Nsight Compute</text>
  <text x="770" y="500" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">回答“为什么快或慢”</text>

  <path d="M220 124H290" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M470 124H540" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720 124H790" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M380 162C380 206 300 206 280 260" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M630 162C630 210 525 210 515 260" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M865 162C865 206 792 206 770 260" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M355 301H420" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M610 301H675" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M260 342C260 382 230 400 230 445" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M515 342C515 384 500 402 500 445" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M770 342V445" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M335 486H395" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M605 486H665" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="490" y="577" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">顺序：先保证结果正确，再用 benchmark 比较版本，最后用 profiler 给性能结论找证据</text>
</svg>
