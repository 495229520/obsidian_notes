<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200px" height="800px" viewBox="0 0 1200 800" version="1.1"><title>CUDA threadIdx local coordinate versus global matrix coordinate</title><desc>Block tiles, a simplified 4 by 3 local coordinate grid, and explicit note that a real block has 16 by 16 threads.</desc><rect x="0" y="0" width="1200" height="800" fill="rgb(245, 244, 237)" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#455a64" /></marker><marker id="hollowArrow" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto" viewBox="0 0 9 10"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7a5c2e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" fill="#263238" font-weight="700" x="600" y="36" text-anchor="middle" dominant-baseline="middle">block 内坐标 vs 全局矩阵坐标</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#37474f" font-weight="700" x="600" y="74" text-anchor="middle" dominant-baseline="middle">threadIdx 只说明自己在当前 block 内的位置；访问矩阵必须先换算成全局 x / y</text><text font-family="Menlo, Consolas, monospace" font-size="18" fill="#8a4f12" font-weight="700" x="600" y="108" text-anchor="middle" dominant-baseline="middle">x = blockIdx.x * blockDim.x + threadIdx.x    |    y = blockIdx.y * blockDim.y + threadIdx.y</text><rect fill="#fffaf0" stroke="#c7bda4" stroke-width="2" x="40" y="140" width="650" height="445" rx="20" ry="20" /><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#2f3b3f" font-weight="700" x="72" y="178">整张输入矩阵 / global memory</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#5b686d" x="72" y="207">矩阵被许多 block tile 覆盖；每个 block 都有自己的 threadIdx 原点。</text><rect fill="#e8f3ee" stroke="#81909a" stroke-width="1.4" x="98" y="240" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="164" y="266" text-anchor="middle" dominant-baseline="middle">block (0,0)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="164" y="290" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="164" y="310" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#edf1fb" stroke="#81909a" stroke-width="1.4" x="230" y="240" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="296" y="266" text-anchor="middle" dominant-baseline="middle">block (1,0)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="296" y="290" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="296" y="310" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#f7eadc" stroke="#81909a" stroke-width="1.4" x="362" y="240" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="428" y="266" text-anchor="middle" dominant-baseline="middle">block (2,0)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="428" y="290" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="428" y="310" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#eee7f5" stroke="#81909a" stroke-width="1.4" x="494" y="240" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="560" y="266" text-anchor="middle" dominant-baseline="middle">block (3,0)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="560" y="290" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="560" y="310" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#edf1fb" stroke="#81909a" stroke-width="1.4" x="98" y="328" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="164" y="354" text-anchor="middle" dominant-baseline="middle">block (0,1)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="164" y="378" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="164" y="398" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#ffe2b5" stroke="#d27600" stroke-width="3" x="230" y="328" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="296" y="354" text-anchor="middle" dominant-baseline="middle">block (1,1)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="296" y="378" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="296" y="398" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#eee7f5" stroke="#81909a" stroke-width="1.4" x="362" y="328" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="428" y="354" text-anchor="middle" dominant-baseline="middle">block (2,1)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="428" y="378" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="428" y="398" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#e8f3ee" stroke="#81909a" stroke-width="1.4" x="494" y="328" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="560" y="354" text-anchor="middle" dominant-baseline="middle">block (3,1)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="560" y="378" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="560" y="398" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#f7eadc" stroke="#81909a" stroke-width="1.4" x="98" y="416" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="164" y="442" text-anchor="middle" dominant-baseline="middle">block (0,2)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="164" y="466" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="164" y="486" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#eee7f5" stroke="#81909a" stroke-width="1.4" x="230" y="416" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="296" y="442" text-anchor="middle" dominant-baseline="middle">block (1,2)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="296" y="466" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="296" y="486" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#e8f3ee" stroke="#81909a" stroke-width="1.4" x="362" y="416" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="428" y="442" text-anchor="middle" dominant-baseline="middle">block (2,2)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="428" y="466" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="428" y="486" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><rect fill="#edf1fb" stroke="#81909a" stroke-width="1.4" x="494" y="416" width="132" height="88" rx="0" ry="0" /><text font-family="Menlo, Consolas, monospace" font-size="14" fill="#37474f" font-weight="700" x="560" y="442" text-anchor="middle" dominant-baseline="middle">block (3,2)</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="560" y="466" text-anchor="middle" dominant-baseline="middle">16 x 16 threads</text><text font-family="Menlo, Consolas, monospace" font-size="12" fill="#31535b" font-weight="700" x="560" y="486" text-anchor="middle" dominant-baseline="middle">= 256 threads</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#59676d" x="362" y="535" text-anchor="middle">blockIdx.x 选择横向 tile</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#59676d" transform="rotate(-90 70 372)" x="70" y="372" text-anchor="middle" dominant-baseline="middle">blockIdx.y</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#7a4a16" font-weight="700" x="365" y="570" text-anchor="middle">重点：一个 block 不是一个 thread，而是一组线程；这里每个 block 有 16 x 16 = 256 个 thread。</text><line stroke="#7a5c2e" stroke-width="2" fill="none" marker-end="url(#hollowArrow)" stroke-dasharray="7 7" x1="362" y1="410" x2="735" y2="410" /><rect fill="#fffaf0" stroke="#c7bda4" stroke-width="2" x="735" y="140" width="425" height="445" rx="20" ry="20" /><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#2f3b3f" font-weight="700" x="765" y="178">放大 block (1,1)</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#5b686d" x="765" y="207">真实 block 是 16 x 16；右图只截取 4 列 x 3 行来示意。</text><text font-family="Menlo, Consolas, monospace" font-size="15" fill="#7a4a16" font-weight="700" x="849" y="236" text-anchor="middle">1</text><text font-family="Menlo, Consolas, monospace" font-size="15" fill="#7a4a16" font-weight="700" x="907" y="236" text-anchor="middle">2</text><text font-family="Menlo, Consolas, monospace" font-size="15" fill="#7a4a16" font-weight="700" x="965" y="236" text-anchor="middle">3</text><text font-family="Menlo, Consolas, monospace" font-size="15" fill="#7a4a16" font-weight="700" x="1023" y="236" text-anchor="middle">4</text><text font-family="Menlo, Consolas, monospace" font-size="15" fill="#7a4a16" font-weight="700" x="798" y="287" text-anchor="middle" dominant-baseline="middle">1</text><text font-family="Menlo, Consolas, monospace" font-size="15" fill="#7a4a16" font-weight="700" x="798" y="345" text-anchor="middle" dominant-baseline="middle">2</text><text font-family="Menlo, Consolas, monospace" font-size="15" fill="#7a4a16" font-weight="700" x="798" y="403" text-anchor="middle" dominant-baseline="middle">3</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#7a4a16" transform="rotate(-90 762 345)" x="762" y="345" text-anchor="middle" dominant-baseline="middle">纵向第 3 行</text><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="820" y="258" width="58" height="58" rx="0" ry="0" /><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="878" y="258" width="58" height="58" rx="0" ry="0" /><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="936" y="258" width="58" height="58" rx="0" ry="0" /><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="994" y="258" width="58" height="58" rx="0" ry="0" /><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="820" y="316" width="58" height="58" rx="0" ry="0" /><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="878" y="316" width="58" height="58" rx="0" ry="0" /><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="936" y="316" width="58" height="58" rx="0" ry="0" /><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="994" y="316" width="58" height="58" rx="0" ry="0" /><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="820" y="374" width="58" height="58" rx="0" ry="0" /><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="878" y="374" width="58" height="58" rx="0" ry="0" /><rect fill="#faf7ec" stroke="#aeb9b8" stroke-width="1.4" x="936" y="374" width="58" height="58" rx="0" ry="0" /><rect fill="#ff7043" stroke="#a13f1f" stroke-width="3" x="994" y="374" width="58" height="58" rx="0" ry="0" /><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#6b4719" font-weight="700" x="1126" y="307" text-anchor="middle">第 4 列</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#6b4719" font-weight="700" x="1126" y="390" text-anchor="middle">第 3 行</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#5f5141" font-weight="700" x="947" y="458" text-anchor="middle">每个小框 = 当前 block 中的一个 thread。</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#5f5141" font-weight="700" x="947" y="480" text-anchor="middle">第 4 列对应 x=3；第 3 行对应 y=2。</text><rect fill="#fff1dc" stroke="#d48b2a" stroke-width="1.8" x="812" y="512" width="300" height="58" rx="14" ry="14" /><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#5a3211" font-weight="700" x="962" y="537" text-anchor="middle">视觉位置: 第 4 列、第 3 行</text><text font-family="Menlo, Consolas, monospace" font-size="15" fill="#5a3211" font-weight="700" x="962" y="560" text-anchor="middle">CUDA 零基 threadIdx = (3, 2)</text><rect fill="#eef3ef" stroke="#afbeb6" stroke-width="2" x="40" y="620" width="1120" height="135" rx="20" ry="20" /><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#2f3b3f" font-weight="700" x="72" y="657">例子: blockDim=(16,16), blockIdx=(1,1), threadIdx=(3,2)</text><text font-family="Menlo, Consolas, monospace" font-size="19" fill="#1d5c63" font-weight="700" x="72" y="694">x = 1 * 16 + 3 = 19    // col，全局列号</text><text font-family="Menlo, Consolas, monospace" font-size="19" fill="#1d5c63" font-weight="700" x="72" y="727">y = 1 * 16 + 2 = 18    // row，全局行号</text><line stroke="#455a64" stroke-width="3" fill="none" marker-end="url(#arrow)" x1="575" y1="686" x2="735" y2="686" /><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#33464b" font-weight="700" x="780" y="660">访问输入</text><text font-family="Menlo, Consolas, monospace" font-size="17" fill="#33464b" font-weight="700" x="780" y="686">in[y * width + x]</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#33464b" font-weight="700" x="780" y="712">不是重复左上角</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#6b4719" font-weight="700" x="960" y="660">转置写出</text><text font-family="Menlo, Consolas, monospace" font-size="17" fill="#6b4719" font-weight="700" x="960" y="686">out[x * height + y]</text><text font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#6b4719" font-weight="700" x="960" y="712">完成行列交换</text></svg>