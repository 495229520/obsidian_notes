<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" role="img" aria-labelledby="title desc">
  <title id="title">CUDA warp 概念图</title>
  <desc id="desc">展示 thread、warp、block 的层级关系，以及 warp 内 SIMT 执行和 shuffle reduce 的直觉。</desc>
  <rect x="0" y="0" width="980" height="600" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="490" y="36" fill="#0C447C" font-family="system-ui,sans-serif" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central">warp：GPU 硬件一起执行的一组连续线程</text>

  <rect x="40" y="90" width="250" height="120" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="165" y="122" fill="#0C447C" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">代码里看到 thread</text>
  <text x="165" y="150" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">threadIdx.x = 0, 1, 2...</text>
  <text x="165" y="176" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">每个 thread 处理不同数据</text>

  <rect x="390" y="90" width="250" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="515" y="122" fill="#085041" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">硬件按 warp 执行</text>
  <text x="515" y="150" fill="#085041" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">1 warp = 32 个 thread</text>
  <text x="515" y="176" fill="#085041" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">连续 thread 被打包调度</text>

  <rect x="730" y="90" width="210" height="120" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="835" y="122" fill="#633806" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">SIMT 直觉</text>
  <text x="835" y="150" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">同一条指令</text>
  <text x="835" y="176" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">32 个 thread 一起执行</text>

  <rect x="40" y="300" width="250" height="180" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="165" y="330" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">256 线程 block 示例</text>
  <text x="165" y="358" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">warp 0: thread 0 ~ 31</text>
  <text x="165" y="382" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">warp 1: thread 32 ~ 63</text>
  <text x="165" y="406" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">...</text>
  <text x="165" y="430" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">warp 7: thread 224 ~ 255</text>
  <text x="165" y="456" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">一共 8 个 warp</text>

  <rect x="390" y="300" width="250" height="120" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="515" y="332" fill="#444441" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">warp shuffle</text>
  <text x="515" y="360" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">同一 warp 内交换寄存器值</text>
  <text x="515" y="386" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">减少 shared memory 和同步</text>

  <rect x="730" y="300" width="210" height="120" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="835" y="332" fill="#0C447C" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">性能关注点</text>
  <text x="835" y="360" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">分支发散</text>
  <text x="835" y="386" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">连续访存</text>

  <path d="M290 150H390" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M640 150H730" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290 390H390" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M640 360H730" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="490" y="548" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">记忆：thread 是代码编号，block 是协作单位，warp 是硬件一起执行的一组线程</text>
</svg>
