<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3C4043" />
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D93025" />
    </marker>

    <style>
      .bg-rect { fill: #ffffff; stroke: #DADCE0; stroke-width: 2; rx: 12px; }
      .title-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: bold; fill: #1A73E8; }
      .axis-line { stroke: #3C4043; stroke-width: 2; }
      .axis-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #3C4043; }
      .thread-label { font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; font-weight: bold; fill: #202124; text-anchor: end; }

      .box-orange { fill: #FFF8E1; stroke: #FFE082; stroke-width: 2; rx: 8px; stroke-dasharray: 4 4;}
      .box-green { fill: #E8F5E9; stroke: #A5D6A7; stroke-width: 2; rx: 8px; stroke-dasharray: 4 4;}

      .chunk-orange { fill: #FFCA28; stroke: #FF8F00; stroke-width: 1.5; rx: 2px; }
      .chunk-green { fill: #81C784; stroke: #388E3C; stroke-width: 1.5; rx: 2px; }

      .box-title-orange { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #E65100; text-anchor: middle; }
      .box-title-green { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #1B5E20; text-anchor: middle; }
      .box-title-red { font-family: 'Consolas', 'Courier New', monospace; font-size: 18px; font-weight: bold; fill: #B71C1C; text-anchor: middle; }
      .box-subtitle-red { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #D32F2F; text-anchor: middle; }

      .barrier-line { stroke: #D32F2F; stroke-width: 3; }
      .barrier-box { fill: #FFEBEE; stroke: #D32F2F; stroke-width: 1.5; }

      .wait-arrow { stroke: #D93025; stroke-width: 1.5; fill: none; }

      .footer-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #202124; text-anchor: middle; }
      .dots { fill: #5F6368; font-size: 24px; font-weight: bold; text-anchor: middle; letter-spacing: 2px;}
    </style>
  </defs>
<text x="50" y="55" class="title-text">时间线（同一个 block 内的线程）</text>

  <line x1="50" y1="70" x2="800" y2="70" stroke="#E8EAED" stroke-width="2" />

  <rect x="150" y="90" width="280" height="300" class="box-orange" />
  <text x="290" y="125" class="box-title-orange">写入 sdata[tid]</text>

  <rect x="520" y="90" width="280" height="300" class="box-green" />
  <text x="660" y="115" class="box-title-green">继续执行后面的</text>
  <text x="660" y="140" class="box-title-green">代码（如规约）</text>

  <text x="130" y="185" class="thread-label">Thread 0</text>
  <text x="130" y="235" class="thread-label">Thread 1</text>
  <text x="130" y="285" class="thread-label">Thread 2</text>
  <text x="100" y="335" class="dots">⋮</text>
  <text x="130" y="365" class="thread-label">Thread 255</text>

  <line x1="100" y1="410" x2="790" y2="410" class="axis-line" marker-end="url(#arrow)" />
  <text x="790" y="440" class="axis-text" text-anchor="end">时间 (Time)</text>

  <rect x="470" y="160" width="20" height="230" class="barrier-box" />
  <line x1="480" y1="150" x2="480" y2="420" class="barrier-line" />
  <text x="480" y="115" class="box-title-red">__syncthreads()</text>
  <text x="480" y="140" class="box-subtitle-red">（同步屏障）</text>

  <rect x="170" y="170" width="30" height="20" class="chunk-orange" />
  <rect x="210" y="170" width="30" height="20" class="chunk-orange" />
  <rect x="250" y="170" width="30" height="20" class="chunk-orange" />
  <rect x="290" y="170" width="30" height="20" class="chunk-orange" />
  <rect x="330" y="170" width="30" height="20" class="chunk-orange" />
  <rect x="370" y="170" width="30" height="20" class="chunk-orange" />
  <line x1="410" y1="180" x2="465" y2="180" class="wait-arrow" marker-end="url(#red-arrow)" /> <rect x="540" y="170" width="30" height="20" class="chunk-green" />
  <rect x="580" y="170" width="30" height="20" class="chunk-green" />
  <rect x="620" y="170" width="30" height="20" class="chunk-green" />
  <rect x="660" y="170" width="30" height="20" class="chunk-green" />
  <rect x="700" y="170" width="30" height="20" class="chunk-green" />
  <rect x="740" y="170" width="30" height="20" class="chunk-green" />

  <rect x="170" y="220" width="30" height="20" class="chunk-orange" />
  <rect x="210" y="220" width="30" height="20" class="chunk-orange" />
  <rect x="250" y="220" width="30" height="20" class="chunk-orange" />
  <rect x="290" y="220" width="30" height="20" class="chunk-orange" />
  <rect x="330" y="220" width="30" height="20" class="chunk-orange" />
  <line x1="370" y1="230" x2="465" y2="230" class="wait-arrow" marker-end="url(#red-arrow)" /> <rect x="540" y="220" width="30" height="20" class="chunk-green" />
  <rect x="580" y="220" width="30" height="20" class="chunk-green" />
  <rect x="620" y="220" width="30" height="20" class="chunk-green" />
  <rect x="660" y="220" width="30" height="20" class="chunk-green" />
  <rect x="700" y="220" width="30" height="20" class="chunk-green" />
  <rect x="740" y="220" width="30" height="20" class="chunk-green" />

  <rect x="170" y="270" width="30" height="20" class="chunk-orange" />
  <rect x="210" y="270" width="30" height="20" class="chunk-orange" />
  <rect x="250" y="270" width="30" height="20" class="chunk-orange" />
  <rect x="290" y="270" width="30" height="20" class="chunk-orange" />
  <rect x="330" y="270" width="30" height="20" class="chunk-orange" />
  <rect x="370" y="270" width="30" height="20" class="chunk-orange" />
  <rect x="410" y="270" width="30" height="20" class="chunk-orange" />
  <line x1="450" y1="280" x2="465" y2="280" class="wait-arrow" marker-end="url(#red-arrow)" /> <rect x="540" y="270" width="30" height="20" class="chunk-green" />
  <rect x="580" y="270" width="30" height="20" class="chunk-green" />
  <rect x="620" y="270" width="30" height="20" class="chunk-green" />
  <rect x="660" y="270" width="30" height="20" class="chunk-green" />
  <rect x="700" y="270" width="30" height="20" class="chunk-green" />
  <rect x="740" y="270" width="30" height="20" class="chunk-green" />

  <text x="290" y="335" class="dots">⋮</text>
  <text x="660" y="335" class="dots">⋮</text>

  <rect x="170" y="350" width="30" height="20" class="chunk-orange" />
  <rect x="210" y="350" width="30" height="20" class="chunk-orange" />
  <rect x="250" y="350" width="30" height="20" class="chunk-orange" />
  <rect x="290" y="350" width="30" height="20" class="chunk-orange" />
  <rect x="330" y="350" width="30" height="20" class="chunk-orange" />
  <rect x="370" y="350" width="30" height="20" class="chunk-orange" />
  <line x1="410" y1="360" x2="465" y2="360" class="wait-arrow" marker-end="url(#red-arrow)" />

  <rect x="540" y="350" width="30" height="20" class="chunk-green" />
  <rect x="580" y="350" width="30" height="20" class="chunk-green" />
  <rect x="620" y="350" width="30" height="20" class="chunk-green" />
  <rect x="660" y="350" width="30" height="20" class="chunk-green" />
  <rect x="700" y="350" width="30" height="20" class="chunk-green" />
  <rect x="740" y="350" width="30" height="20" class="chunk-green" />

  <text x="425" y="455" class="footer-text">只有本 block 内的<tspan fill="#D93025">所有线程都到达这里</tspan>，才能一起继续往下走。</text>

</svg>
