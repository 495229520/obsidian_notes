<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
<defs>
    <style>
      /* 基础字体与背景 */
      text { font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; }
      .bg-rect { fill: #ffffff; }

      /* 标题区样式 */
      .title-box { fill: #1565c0; rx: 4px; }
      .title-num { fill: #ffffff; font-size: 20px; font-weight: bold; }
      .title-text { font-size: 24px; font-weight: bold; fill: #202124; }
      .subtitle { font-size: 18px; fill: #3c4043; line-height: 1.6; }

      /* 图表区样式 */
      .box-blue { fill: #f4f8ff; stroke: #8ab4f8; stroke-width: 2; rx: 8px; }
      .box-blue-title { font-size: 22px; font-weight: bold; fill: #164bc5; text-anchor: middle; }
      .box-blue-code { font-size: 20px; font-weight: bold; fill: #164bc5; text-anchor: middle; font-family: 'Consolas', monospace; }

      .box-green { fill: #e8f5e9; stroke: #81c784; stroke-width: 2; rx: 8px; }
      .box-green-title { font-size: 22px; font-weight: bold; fill: #137333; text-anchor: middle; }
      .box-green-code { font-size: 20px; font-weight: bold; fill: #137333; text-anchor: middle; font-family: 'Consolas', monospace; }

      .box-label { font-size: 18px; font-weight: bold; fill: #202124; text-anchor: middle; }

      /* 底部结论样式 */
      .conclusion-prefix { font-size: 26px; font-weight: bold; fill: #202124; }
      .conclusion-main { font-size: 26px; font-weight: bold; fill: #d32f2f; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#669df6" />
    </marker>
  </defs>
<rect x="40" y="40" width="32" height="32" class="title-box"/>
  <text x="50" y="64" class="title-num">3</text>
  <text x="85" y="65" class="title-text">为什么 kernel 之间天然形成全局完成点？</text>

  <text x="85" y="115" class="subtitle">一个 kernel 启动后，只有当它的所有 block 都执行完，</text>
  <text x="85" y="145" class="subtitle">这个 kernel 才算完成。默认情况下，同一个 stream 里的</text>
  <text x="85" y="175" class="subtitle">kernel 是按顺序执行的。</text>

  <rect x="85" y="230" width="310" height="90" class="box-blue"/>
  <text x="240" y="265" class="box-blue-title">Kernel A</text>
  <text x="240" y="295" class="box-blue-code">&lt;&lt;&lt;grid, block&gt;&gt;&gt;</text>
  <text x="240" y="355" class="box-label">所有 block 全部执行完</text>

  <line x1="420" y1="275" x2="465" y2="275" stroke="#669df6" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="485" y="230" width="310" height="90" class="box-green"/>
  <text x="640" y="265" class="box-green-title">Kernel B</text>
  <text x="640" y="295" class="box-green-code">&lt;&lt;&lt;grid2, block2&gt;&gt;&gt;</text>
  <text x="640" y="355" class="box-label">才开始执行</text>

  <text x="440" y="430" text-anchor="middle">
    <tspan class="conclusion-prefix">所以：</tspan>
    <tspan class="conclusion-main">kernel launch 边界 = 全局同步点</tspan>
  </text>

</svg>
