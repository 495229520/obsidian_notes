  <text x="999" y="198" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">核心问题：A/B 数据如何复用？</text>
