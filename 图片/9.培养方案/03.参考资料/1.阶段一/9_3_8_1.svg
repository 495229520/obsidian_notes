  <text x="222" y="320" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#31535b">tile</text>
  <path d="M103 393 L275 393" fill="none" stroke="#1d6f73" stroke-width="4" marker-end="url(#arrow)"/>
