<svg xmlns="http://www.w3.org/2000/svg" width="1200px" height="760px" viewBox="0 0 1200 760" version="1.1">
  <title>Week 3 transpose to Week 4 matmul concept migration</title>
  <desc>Teaching diagram linking memory access shape in transpose to data reuse and arithmetic intensity in matmul.</desc>
  <rect x="0" y="0" width="1200" height="760" fill="rgb(245, 244, 237)"/>
