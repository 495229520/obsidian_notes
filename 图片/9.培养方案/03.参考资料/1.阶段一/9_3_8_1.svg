  <path d="M1023 306 L1018 336" fill="none" stroke="#b85b31" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="977" y="474" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#4f5e63">shared memory 的作用：</text>
  <text x="977" y="498" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#4f5e63">让 A/B tile 服务一整块 C</text>
  <text x="977" y="558" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#8a4f12">FLOPs / byte ↑</text>
