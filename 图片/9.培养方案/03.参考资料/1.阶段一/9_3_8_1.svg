  <text x="600" y="82" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#455a64">同样是二维 tile；MatMul 额外关注 K 维复用与 FLOPs / byte</text>

