  <title>cuBLAS Day 2 row-major wrapper</title>
  <desc>Teaching diagram comparing row-major GEMM intent and cuBLAS column-major swapped-operand call.</desc>
  <rect x="0" y="0" width="1120" height="670" fill="rgb(245, 244, 237)"/>
