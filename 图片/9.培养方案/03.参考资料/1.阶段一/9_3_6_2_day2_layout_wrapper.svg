  <text x="560" y="42" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#0C447C">Day 2：row-major wrapper 的转置等价</text>
  <text x="560" y="76" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">C/C++ 按行存，cuBLAS 按列解释；wrapper 的任务是让语义保持 C = A @ B</text>

