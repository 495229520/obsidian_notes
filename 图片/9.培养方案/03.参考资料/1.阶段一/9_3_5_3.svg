<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 620" width="100%" height="100%">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a73e8" />
    </marker>

    <style>
      /* 基础字体与背景 */
      text { font-family: 'Segoe UI', system-ui, sans-serif; fill: #202124; }
      .bg-rect { fill: #ffffff; }

      /* 标题区样式 */
      .main-title-box { fill: #1565c0; rx: 4px; }
      .main-title-num { fill: #ffffff; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .main-title-text { font-size: 22px; font-weight: bold; }

      /* 阶段容器样式 */
      .phase-container { fill: #ffffff; stroke: #dadce0; stroke-width: 1.5; rx: 8px; }
      .phase-title { font-size: 18px; font-weight: bold; fill: #1967d2; }
      .phase-desc { font-size: 14px; fill: #3c4043; line-height: 1.5; }

      /* Block内部通用样式 */
      .block-title { font-size: 16px; font-weight: bold; text-anchor: middle; }
      .block-subtitle { font-size: 13px; text-anchor: middle; }
      .thread-box { fill: #ffffff; stroke-width: 1.5; rx: 3px; }
      .thread-text { font-family: 'Consolas', monospace; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .reduce-box { fill: #ffffff; stroke-width: 1.5; rx: 4px; }
      .reduce-text { font-size: 12px; text-anchor: middle; }
      .partial-text { font-size: 15px; font-weight: bold; text-anchor: middle; }

      /* Block 特定颜色 */
      .b0-bg { fill: #e8f0fe; stroke: #8ab4f8; stroke-width: 1.5; }
      .b0-text { fill: #1967d2; }
      .b0-stroke { stroke: #8ab4f8; }

      .b1-bg { fill: #e6f4ea; stroke: #81c784; stroke-width: 1.5; }
      .b1-text { fill: #137333; }
      .b1-stroke { stroke: #81c784; }

      .b2-bg { fill: #fef7e0; stroke: #ffb300; stroke-width: 1.5; }
      .b2-text { fill: #b06000; }
      .b2-stroke { stroke: #ffb300; }

      .b3-bg { fill: #f3e8fd; stroke: #ba68c8; stroke-width: 1.5; }
      .b3-text { fill: #7b1fa2; }
      .b3-stroke { stroke: #ba68c8; }

      /* 连线与特殊文字 */
      .line-arrow { stroke: #5f6368; stroke-width: 1.5; fill: none; }
      .dots { font-size: 18px; font-weight: bold; fill: #5f6368; letter-spacing: 2px; }
      .red-highlight { font-size: 18px; font-weight: bold; fill: #d93025; text-anchor: middle; }

      /* 底部警告与提示框 */
      .info-box { fill: #fff8e1; stroke: #ffe082; stroke-width: 1.5; rx: 8px; }
      .warning-box { fill: #fce8e6; stroke: #f28b82; stroke-width: 1.5; rx: 8px; }
      .info-text { font-size: 15px; font-weight: bold; fill: #202124; }
      .warning-text { font-size: 15px; font-weight: bold; fill: #c5221f; }
    </style>
  </defs>
<rect x="30" y="25" width="26" height="26" class="main-title-box"/>
  <text x="43" y="44" class="main-title-num">4</text>
  <text x="68" y="45" class="main-title-text">以大规模求和（Reduction）为例：多阶段完成计算</text>

  <rect x="30" y="70" width="680" height="420" class="phase-container"/>

  <text x="50" y="105" class="phase-title">阶段一：每个 block 计算本地和（第一个 kernel）</text>
  <text x="50" y="135" class="phase-desc">每个 block 负责一段数据，</text>
  <text x="50" y="155" class="phase-desc">在 block 内用 __syncthreads() 完成规约，</text>
  <text x="50" y="175" class="phase-desc">最后由 Thread 0 写出本 block 的部分和。</text>

  <g transform="translate(45, 200)">
    <rect x="0" y="0" width="130" height="90" rx="6" class="b0-bg"/>
    <text x="65" y="25" class="block-title b0-text">Block 0</text>
    <text x="65" y="45" class="block-subtitle b0-text">处理数据片段 0</text>
    <rect x="10" y="60" width="24" height="20" class="thread-box b0-stroke"/><text x="22" y="74" class="thread-text">T0</text>
    <rect x="40" y="60" width="24" height="20" class="thread-box b0-stroke"/><text x="52" y="74" class="thread-text">T1</text>
    <text x="76" y="74" class="thread-text">...</text>
    <rect x="88" y="60" width="32" height="20" class="thread-box b0-stroke"/><text x="104" y="74" class="thread-text">T255</text>

    <line x1="22" y1="95" x2="22" y2="115" class="line-arrow" marker-end="url(#arrow)"/>
    <line x1="104" y1="95" x2="104" y2="115" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="5" y="120" width="120" height="45" class="reduce-box b0-stroke"/>
    <text x="65" y="138" class="reduce-text b0-text">本地规约</text>
    <text x="65" y="156" class="reduce-text b0-text">(多轮 + __syncthreads())</text>

    <line x1="65" y1="170" x2="65" y2="195" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="15" y="200" width="100" height="30" class="reduce-box b0-stroke"/>
    <text x="65" y="221" class="partial-text b0-text">partial[0]</text>
  </g>

  <g transform="translate(195, 200)">
    <rect x="0" y="0" width="130" height="90" rx="6" class="b1-bg"/>
    <text x="65" y="25" class="block-title b1-text">Block 1</text>
    <text x="65" y="45" class="block-subtitle b1-text">处理数据片段 1</text>
    <rect x="10" y="60" width="24" height="20" class="thread-box b1-stroke"/><text x="22" y="74" class="thread-text">T0</text>
    <rect x="40" y="60" width="24" height="20" class="thread-box b1-stroke"/><text x="52" y="74" class="thread-text">T1</text>
    <text x="76" y="74" class="thread-text">...</text>
    <rect x="88" y="60" width="32" height="20" class="thread-box b1-stroke"/><text x="104" y="74" class="thread-text">T255</text>

    <line x1="22" y1="95" x2="22" y2="115" class="line-arrow" marker-end="url(#arrow)"/>
    <line x1="104" y1="95" x2="104" y2="115" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="5" y="120" width="120" height="45" class="reduce-box b1-stroke"/>
    <text x="65" y="138" class="reduce-text b1-text">本地规约</text>
    <text x="65" y="156" class="reduce-text b1-text">(多轮 + __syncthreads())</text>

    <line x1="65" y1="170" x2="65" y2="195" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="15" y="200" width="100" height="30" class="reduce-box b1-stroke"/>
    <text x="65" y="221" class="partial-text b1-text">partial[1]</text>
  </g>

  <g transform="translate(345, 200)">
    <rect x="0" y="0" width="130" height="90" rx="6" class="b2-bg"/>
    <text x="65" y="25" class="block-title b2-text">Block 2</text>
    <text x="65" y="45" class="block-subtitle b2-text">处理数据片段 2</text>
    <rect x="10" y="60" width="24" height="20" class="thread-box b2-stroke"/><text x="22" y="74" class="thread-text">T0</text>
    <rect x="40" y="60" width="24" height="20" class="thread-box b2-stroke"/><text x="52" y="74" class="thread-text">T1</text>
    <text x="76" y="74" class="thread-text">...</text>
    <rect x="88" y="60" width="32" height="20" class="thread-box b2-stroke"/><text x="104" y="74" class="thread-text">T255</text>

    <line x1="22" y1="95" x2="22" y2="115" class="line-arrow" marker-end="url(#arrow)"/>
    <line x1="104" y1="95" x2="104" y2="115" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="5" y="120" width="120" height="45" class="reduce-box b2-stroke"/>
    <text x="65" y="138" class="reduce-text b2-text">本地规约</text>
    <text x="65" y="156" class="reduce-text b2-text">(多轮 + __syncthreads())</text>

    <line x1="65" y1="170" x2="65" y2="195" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="15" y="200" width="100" height="30" class="reduce-box b2-stroke"/>
    <text x="65" y="221" class="partial-text b2-text">partial[2]</text>
  </g>

  <g transform="translate(495, 200)">
    <rect x="0" y="0" width="130" height="90" rx="6" class="b3-bg"/>
    <text x="65" y="25" class="block-title b3-text">Block 3</text>
    <text x="65" y="45" class="block-subtitle b3-text">处理数据片段 3</text>
    <rect x="10" y="60" width="24" height="20" class="thread-box b3-stroke"/><text x="22" y="74" class="thread-text">T0</text>
    <rect x="40" y="60" width="24" height="20" class="thread-box b3-stroke"/><text x="52" y="74" class="thread-text">T1</text>
    <text x="76" y="74" class="thread-text">...</text>
    <rect x="88" y="60" width="32" height="20" class="thread-box b3-stroke"/><text x="104" y="74" class="thread-text">T255</text>

    <line x1="22" y1="95" x2="22" y2="115" class="line-arrow" marker-end="url(#arrow)"/>
    <line x1="104" y1="95" x2="104" y2="115" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="5" y="120" width="120" height="45" class="reduce-box b3-stroke"/>
    <text x="65" y="138" class="reduce-text b3-text">本地规约</text>
    <text x="65" y="156" class="reduce-text b3-text">(多轮 + __syncthreads())</text>

    <line x1="65" y1="170" x2="65" y2="195" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="15" y="200" width="100" height="30" class="reduce-box b3-stroke"/>
    <text x="65" y="221" class="partial-text b3-text">partial[3]</text>
  </g>

  <text x="645" y="250" class="dots">......</text>

  <text x="370" y="465" class="red-highlight">第一个 kernel 结束后，所有 partial[] 都已经写好！</text>


  <rect x="730" y="70" width="490" height="420" class="phase-container"/>

  <text x="750" y="105" class="phase-title">阶段二：对所有部分和再做一次归约（第二个 kernel）</text>
  <text x="750" y="135" class="phase-desc">第二个 kernel 只处理 partial[] 数组，</text>
  <text x="750" y="155" class="phase-desc">继续用 block 内归约，得到最终结果。</text>

  <g transform="translate(750, 200)">
    <rect x="0" y="0" width="85" height="32" rx="4" class="b0-bg"/>
    <text x="42.5" y="21" class="partial-text b0-text">partial[0]</text>
    <line x1="42.5" y1="36" x2="42.5" y2="65" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="100" y="0" width="85" height="32" rx="4" class="b1-bg"/>
    <text x="142.5" y="21" class="partial-text b1-text">partial[1]</text>
    <line x1="142.5" y1="36" x2="142.5" y2="65" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="200" y="0" width="85" height="32" rx="4" class="b2-bg"/>
    <text x="242.5" y="21" class="partial-text b2-text">partial[2]</text>
    <line x1="242.5" y1="36" x2="242.5" y2="65" class="line-arrow" marker-end="url(#arrow)"/>

    <rect x="300" y="0" width="85" height="32" rx="4" class="b3-bg"/>
    <text x="342.5" y="21" class="partial-text b3-text">partial[3]</text>
    <line x1="342.5" y1="36" x2="342.5" y2="65" class="line-arrow" marker-end="url(#arrow)"/>

    <text x="410" y="23" class="dots">......</text>

    <rect x="0" y="70" width="450" height="50" rx="6" class="b0-bg"/>
    <text x="225" y="101" class="block-title b0-text">再次归约（多轮 + __syncthreads()）</text>

    <line x1="225" y1="125" x2="225" y2="165" class="line-arrow" marker-end="url(#arrow)"/>
    <rect x="110" y="170" width="230" height="44" rx="4" class="b0-bg"/>
    <text x="225" y="198" class="block-title b0-text">最终结果 total_sum</text>
  </g>


  <rect x="30" y="510" width="680" height="80" class="info-box"/>
  <text x="50" y="542" font-size="24">💡</text>
  <text x="90" y="542" class="info-text">关键点：两个 kernel 之间有可靠的全局完成边界，保证数据已就绪；</text>
  <text x="90" y="568" class="info-text">而在同一个 block 内，__syncthreads() 保证本 block 内线程的协作安全。</text>

  <rect x="730" y="510" width="490" height="80" class="warning-box"/>
  <text x="750" y="542" class="warning-text">如果试图在一个 kernel 内让所有 block 先算完，再由 Block 0 汇总，</text>
  <text x="750" y="568" class="warning-text">由于没有全局同步，可能读到未写完的数据，结果错误或死锁。</text>

</svg>
