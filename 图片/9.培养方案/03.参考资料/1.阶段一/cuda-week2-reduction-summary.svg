<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
    <defs>
        <style>
            .list-text { font-family: sans-serif; font-size: 18px; fill: #111827; }
            .mono { font-family: monospace; font-size: 18px; font-weight: bold; }
            .list-num { font-family: sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
        </style>
    </defs>

    <rect width="1000" height="200" fill="rgb(245, 244, 237)" />

    <rect x="20" y="20" width="960" height="160" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />

    <g transform="translate(60, 32)">
        <rect x="0" y="0" width="150" height="42" rx="8" fill="#2563eb" />
        <text x="75" y="27" font-size="20" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">一句话总结</text>

        <g transform="translate(35, 60)">
            <rect x="0" y="0" width="60" height="75" rx="5" fill="#c48a47" />

            <rect x="5" y="5" width="50" height="65" rx="2" fill="#ffffff" />

            <rect x="18" y="-5" width="24" height="12" rx="3" fill="#334155" />
            <circle cx="30" cy="-2" r="3" fill="#ffffff" />

            <rect x="12" y="20" width="5" height="5" rx="1" fill="#60a5fa" />
            <line x1="22" y1="22" x2="42" y2="22" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

            <rect x="12" y="32" width="5" height="5" rx="1" fill="#60a5fa" />
            <line x1="22" y1="34" x2="35" y2="34" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

            <line x1="12" y1="46" x2="45" y2="46" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

            <line x1="12" y1="58" x2="32" y2="58" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

            <g transform="translate(55, 60)">
                <circle cx="0" cy="0" r="16" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" />
                <path d="M -6 0 L -2 4 L 6 -5" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </g>
        </g>
    </g>

    <g transform="translate(280, 52)">
        <circle cx="0" cy="0" r="12" fill="#2563eb" />
        <text x="0" y="1" class="list-num">1</text>
        <text x="25" y="6" class="list-text"><tspan class="mono">__syncthreads()</tspan> 只能同步当前 block 内的线程。</text>

        <circle cx="0" cy="32" r="12" fill="#2563eb" />
        <text x="0" y="33" class="list-num">2</text>
        <text x="25" y="38" class="list-text">同一个 kernel 中，不同 block 之间没有普通的全局同步。</text>

        <circle cx="0" cy="64" r="12" fill="#2563eb" />
        <text x="0" y="65" class="list-num">3</text>
        <text x="25" y="70" class="list-text">多阶段计算通常拆成多个 kernel。</text>

        <circle cx="0" cy="96" r="12" fill="#2563eb" />
        <text x="0" y="97" class="list-num">4</text>
        <text x="25" y="102" class="list-text">前一个 kernel 结束，就是所有 block 都完成的可靠边界。</text>
    </g>

</svg>
