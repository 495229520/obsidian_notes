<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200px" height="760px" viewBox="0 0 1200 760" version="1.1">
  <title>Roofline intuition for Week 4 matmul</title>
  <desc>Teaching diagram showing arithmetic intensity and performance with naive, tiled, and cuBLAS points.</desc>
  <rect x="0" y="0" width="1200" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#42545a"/>
    </marker>
  </defs>
  <text x="600" y="44" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#263238">Roofline：用 FLOPs / byte 解释 MatMul</text>
  <text x="600" y="82" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#455a64">横轴是 arithmetic intensity，纵轴是 performance；tiling 提高数据复用</text>

  <rect x="92" y="126" width="720" height="520" rx="16" ry="16" fill="#fffaf0" stroke="#c8bea7" stroke-width="2"/>
  <line x1="170" y1="570" x2="740" y2="570" stroke="#42545a" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="170" y1="570" x2="170" y2="182" stroke="#42545a" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="455" y="622" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#33464b">Arithmetic intensity = FLOPs / bytes moved</text>
  <text x="118" y="370" text-anchor="middle" transform="rotate(-90 118 370)" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#33464b">Performance / TFLOPS</text>

  <line x1="170" y1="570" x2="430" y2="310" stroke="#1d6f73" stroke-width="4"/>
  <line x1="430" y1="310" x2="740" y2="310" stroke="#b85b31" stroke-width="4"/>
  <text x="282" y="388" text-anchor="middle" transform="rotate(-45 282 388)" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1d6f73">memory bandwidth roof</text>
  <text x="592" y="292" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#b85b31">compute roof</text>

  <circle cx="265" cy="486" r="12" fill="#d95f43" stroke="#8c3a24" stroke-width="2"/>
  <text x="265" y="518" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#7a3423">naive</text>
  <text x="265" y="540" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#7a3423">复用差</text>

  <circle cx="450" cy="390" r="12" fill="#3f8f8c" stroke="#1d5c63" stroke-width="2"/>
  <text x="450" y="424" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1d5c63">tiled</text>
  <text x="450" y="446" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d5c63">shared reuse</text>

  <circle cx="635" cy="326" r="12" fill="#7b61a8" stroke="#4b3b67" stroke-width="2"/>
  <text x="635" y="360" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#4b3b67">cuBLAS</text>
  <text x="635" y="382" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#4b3b67">工业优化</text>

  <path d="M284 480 C340 455 380 430 438 396" fill="none" stroke="#8a5f22" stroke-width="2.4" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="354" y="470" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#8a5f22">tiling 提高复用</text>
  <path d="M466 382 C518 350 560 333 620 326" fill="none" stroke="#8a5f22" stroke-width="2.4" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="548" y="336" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#8a5f22">多级 tiling / 调度</text>

  <text x="185" y="594" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#607077">low</text>
  <text x="720" y="594" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#607077">high</text>
  <text x="142" y="568" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#607077">low</text>
  <text x="142" y="196" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#607077">high</text>

  <rect x="850" y="126" width="300" height="520" rx="16" ry="16" fill="#f8fbff" stroke="#b8c4d6" stroke-width="2"/>
  <text x="1000" y="166" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2f3b3f">Week 4 读图方式</text>
  <rect x="880" y="214" width="240" height="76" rx="10" ry="10" fill="#fffaf0" stroke="#c8bea7" stroke-width="1.5"/>
  <text x="1000" y="242" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#33464b">naive 点低</text>
  <text x="1000" y="266" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#607077">先怀疑 A/B 重复 global load</text>
  <rect x="880" y="320" width="240" height="76" rx="10" ry="10" fill="#eef3ef" stroke="#afbeb6" stroke-width="1.5"/>
  <text x="1000" y="348" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#33464b">tiled 向右上移动</text>
  <text x="1000" y="372" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#607077">说明 shared reuse 起作用</text>
  <rect x="880" y="426" width="240" height="92" rx="10" ry="10" fill="#eee7f5" stroke="#b09cc7" stroke-width="1.5"/>
  <text x="1000" y="454" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#33464b">仍然离 cuBLAS 远</text>
  <text x="1000" y="478" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#607077">看 Tensor Core、tile 层级、</text>
  <text x="1000" y="500" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#607077">register blocking、调度工程</text>
  <rect x="880" y="548" width="240" height="58" rx="10" ry="10" fill="#fff1dc" stroke="#d48b2a" stroke-width="1.5"/>
  <text x="1000" y="575" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#7a4a16">TFLOPS 是结果</text>
  <text x="1000" y="598" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#7a4a16">Nsight 才能解释原因</text>
</svg>
