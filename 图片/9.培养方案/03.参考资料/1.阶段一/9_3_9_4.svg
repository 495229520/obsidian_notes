<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200px" height="760px" viewBox="0 0 1200 760" version="1.1">
  <title>Serving workload matrix for Week 5</title>
  <desc>Workload matrix covering low latency, high throughput, long context, and shared prefix scenarios.</desc>
  <rect x="0" y="0" width="1200" height="760" fill="rgb(245, 244, 237)"/>
  <text x="600" y="44" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#263238">Week 5 Workload Matrix</text>
  <text x="600" y="82" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#455a64">真实请求要看长度分布、共享前缀、长上下文比例</text>

  <rect x="80" y="148" width="250" height="210" rx="16" ry="16" fill="#eef3ef" stroke="#8fa6a0" stroke-width="2"/>
  <text x="205" y="188" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1d5c63">低延迟</text>
  <text x="205" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1d5c63">short prompt</text>
  <text x="205" y="260" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1d5c63">short output</text>
  <text x="205" y="306" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#516165">观察 TTFT 是否稳定</text>

  <rect x="365" y="148" width="250" height="210" rx="16" ry="16" fill="#fff1dc" stroke="#d48b2a" stroke-width="2"/>
  <text x="490" y="188" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#7a4a16">高吞吐</text>
  <text x="490" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#7a4a16">high req/s</text>
  <text x="490" y="260" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#7a4a16">high concurrency</text>
  <text x="490" y="306" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#6a5840">看 TPS 与 p95 tradeoff</text>

  <rect x="650" y="148" width="250" height="210" rx="16" ry="16" fill="#eee7f5" stroke="#b09cc7" stroke-width="2"/>
  <text x="775" y="188" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#5c4770">长上下文</text>
  <text x="775" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#5c4770">long prompt</text>
  <text x="775" y="260" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#5c4770">prefill-heavy</text>
  <text x="775" y="306" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#5c5361">看 TTFT 与 KV cache</text>

  <rect x="935" y="148" width="185" height="210" rx="16" ry="16" fill="#f7eadc" stroke="#d6ad86" stroke-width="2"/>
  <text x="1028" y="188" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#734821">共享 prefix</text>
  <text x="1028" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#734821">system prompt</text>
  <text x="1028" y="258" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#734821">tools schema</text>
  <text x="1028" y="306" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#6a5840">看 prefix cache</text>

  <rect x="130" y="438" width="940" height="160" rx="18" ry="18" fill="#f8fbff" stroke="#b8c4d6" stroke-width="2"/>
  <text x="600" y="478" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2f3b3f">真实请求结构</text>
  <rect x="190" y="520" width="210" height="48" rx="8" ry="8" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.5"/>
  <text x="295" y="549" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1d5c63">shared system prompt</text>
  <rect x="410" y="520" width="190" height="48" rx="8" ry="8" fill="#fff1dc" stroke="#d48b2a" stroke-width="1.5"/>
  <text x="505" y="549" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#7a4a16">tools schema</text>
  <rect x="610" y="520" width="230" height="48" rx="8" ry="8" fill="#eee7f5" stroke="#b09cc7" stroke-width="1.5"/>
  <text x="725" y="549" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#5c4770">RAG / repo prefix</text>
  <rect x="850" y="520" width="160" height="48" rx="8" ry="8" fill="#f7eadc" stroke="#d6ad86" stroke-width="1.5"/>
  <text x="930" y="549" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#734821">user question</text>
  <text x="600" y="632" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#33464b">shared prefix ratio 越高，越接近 Agent / RAG 的真实压力</text>
</svg>
