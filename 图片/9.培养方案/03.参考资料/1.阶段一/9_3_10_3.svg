<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #475569; }
      .node-title { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #334155; }
      .metric { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #0f172a; }
      .tag { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <text font-family="Inter, Arial, sans-serif" x="70" y="70" class="title">TTFT p95 Higher: First Triage Path</text>
  <text font-family="Inter, Arial, sans-serif" x="70" y="105" class="subtitle">先判断是否排队，再拆 prefill、network、KV cache pressure</text>

  <rect x="465" y="145" width="350" height="92" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="523" y="182" class="node-title">Symptom: TTFT p95 rises</text>
  <text font-family="Inter, Arial, sans-serif" x="523" y="212" class="metric">vllm:time_to_first_token_seconds</text>

  <rect x="110" y="315" width="250" height="210" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <rect x="135" y="340" width="96" height="28" rx="14" fill="#ea580c"/>
  <text font-family="Inter, Arial, sans-serif" x="157" y="360" class="tag">Queue</text>
  <text font-family="Inter, Arial, sans-serif" x="135" y="397" class="node-title">queueing?</text>
  <text font-family="Inter, Arial, sans-serif" x="135" y="430" class="metric">num_requests_waiting</text>
  <text font-family="Inter, Arial, sans-serif" x="135" y="456" class="metric">request_queue_time</text>
  <text font-family="Inter, Arial, sans-serif" x="135" y="493" class="text">if both rise:</text>
  <text font-family="Inter, Arial, sans-serif" x="135" y="519" class="text">rate limit or add capacity</text>

  <rect x="395" y="315" width="250" height="210" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="420" y="340" width="96" height="28" rx="14" fill="#2563eb"/>
  <text font-family="Inter, Arial, sans-serif" x="440" y="360" class="tag">Prefill</text>
  <text font-family="Inter, Arial, sans-serif" x="420" y="397" class="node-title">long prompt?</text>
  <text font-family="Inter, Arial, sans-serif" x="420" y="430" class="metric">request_prefill_time</text>
  <text font-family="Inter, Arial, sans-serif" x="420" y="456" class="metric">rate(prompt_tokens)</text>
  <text font-family="Inter, Arial, sans-serif" x="420" y="493" class="text">if prefill rises:</text>
  <text font-family="Inter, Arial, sans-serif" x="420" y="519" class="text">shorten prompt or use prefix cache</text>

  <rect x="680" y="315" width="250" height="210" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="705" y="340" width="104" height="28" rx="14" fill="#16a34a"/>
  <text font-family="Inter, Arial, sans-serif" x="727" y="360" class="tag">Network</text>
  <text font-family="Inter, Arial, sans-serif" x="705" y="397" class="node-title">client path?</text>
  <text font-family="Inter, Arial, sans-serif" x="705" y="430" class="metric">server metrics normal</text>
  <text font-family="Inter, Arial, sans-serif" x="705" y="456" class="metric">client TTFT high</text>
  <text font-family="Inter, Arial, sans-serif" x="705" y="493" class="text">if mismatch:</text>
  <text font-family="Inter, Arial, sans-serif" x="705" y="519" class="text">run same-host client test</text>

  <rect x="965" y="315" width="250" height="210" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="990" y="340" width="120" height="28" rx="14" fill="#7c3aed"/>
  <text font-family="Inter, Arial, sans-serif" x="1013" y="360" class="tag">KV Cache</text>
  <text font-family="Inter, Arial, sans-serif" x="990" y="397" class="node-title">cache pressure?</text>
  <text font-family="Inter, Arial, sans-serif" x="990" y="430" class="metric">kv_cache_usage_perc</text>
  <text font-family="Inter, Arial, sans-serif" x="990" y="456" class="metric">num_preemptions</text>
  <text font-family="Inter, Arial, sans-serif" x="990" y="493" class="text">if near full:</text>
  <text font-family="Inter, Arial, sans-serif" x="990" y="519" class="text">lower concurrency or max len</text>

  <path d="M640 237 V280" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 280 H235 V300" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 280 H520 V300" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 280 H805 V300" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 280 H1090 V300" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="255" y="615" width="770" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="293" y="653" class="text">结论必须写成下一步实验：降 request rate、扫 prompt length、同机压测、降 max concurrency / max_model_len。</text>
</svg>
