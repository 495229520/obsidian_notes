<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460">
  <title>mini-kv record 磁盘格式：定长头 + 变长体</title>
  <desc>普通 put 记录与墓碑记录的字段布局：crc32c、时间戳、key_size、value_size 组成 20 字节定长头，key 与 value 为变长体；CRC 覆盖除自身外的全部字节。字段在磁盘上连续存放，图中拉开只为标注。</desc>
  <rect x="0" y="0" width="1080" height="460" fill="rgb(245, 244, 237)"/>

  <text x="540" y="34" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">mini-kv record 磁盘格式：定长头 + 变长体（字段在盘上连续，图中拉开只为标注）</text>

  <!-- 普通记录 -->
  <text x="60" y="72" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">普通记录（put）：</text>

  <rect x="60" y="92" width="110" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="115" y="110" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">crc32c</text>
  <text x="115" y="132" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">4 B</text>

  <rect x="230" y="92" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="285" y="110" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">tstamp</text>
  <text x="285" y="132" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">8 B</text>

  <rect x="400" y="92" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="455" y="110" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">key_size</text>
  <text x="455" y="132" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">4 B</text>

  <rect x="570" y="92" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="625" y="110" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">value_size</text>
  <text x="625" y="132" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">4 B</text>

  <rect x="740" y="92" width="110" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="795" y="110" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">key</text>
  <text x="795" y="132" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">key_size B</text>

  <rect x="910" y="92" width="110" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="965" y="110" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">value</text>
  <text x="965" y="132" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">value_size B</text>

  <!-- 定长/变长标注 -->
  <polyline points="60,160 60,168 680,168 680,160" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="370" y="188" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">定长头 20 B：恢复扫描先读它，才知道这条记录多长</text>
  <polyline points="740,160 740,168 1020,168 1020,160" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="880" y="188" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">变长体：按头中长度读取</text>

  <!-- 墓碑记录 -->
  <text x="60" y="228" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">墓碑记录（delete）：</text>

  <rect x="60" y="248" width="110" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="115" y="266" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">crc32c</text>
  <text x="115" y="288" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">4 B</text>

  <rect x="230" y="248" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="285" y="266" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">tstamp</text>
  <text x="285" y="288" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">8 B</text>

  <rect x="400" y="248" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="455" y="266" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">key_size</text>
  <text x="455" y="288" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">4 B</text>

  <rect x="570" y="248" width="110" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="625" y="266" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">value_size</text>
  <text x="625" y="288" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">= 墓碑标记值</text>

  <rect x="740" y="248" width="110" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="795" y="266" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">key</text>
  <text x="795" y="288" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">key_size B</text>

  <rect x="910" y="248" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="965" y="276" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">（无 value 段）</text>

  <!-- 底部说明 -->
  <text x="60" y="344" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">CRC 覆盖范围：tstamp 起到 value 末尾（不含 crc 字段自身）；先校验、后使用</text>
  <text x="60" y="368" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">恢复扫描循环：读 20 B 头 → 长度合法性检查（防越界）→ 读体 → CRC 校验 → 更新 KeyDir → 前进到下一条</text>
  <text x="60" y="392" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">尾部不足 20 B、长度越界或 CRC 失败 → 从该 offset 截断（前缀一致）</text>
</svg>
