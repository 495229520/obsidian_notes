<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460">
  <title>崩溃注入闭环：kill -9、恢复、校验不变量</title>
  <desc>父进程 driver fork 出引擎子进程跑随机负载，随机时刻 SIGKILL，重启恢复后按 committed ⊆ recovered ⊆ attempted 校验，循环 1000 次并归档失败样本。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="460" fill="rgb(245, 244, 237)"/>

  <text x="410" y="34" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">崩溃注入闭环：kill -9 → 恢复 → 校验不变量</text>

  <!-- 父进程 -->
  <rect x="60" y="80" width="290" height="72" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="205" y="104" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">父进程 crash_test driver</text>
  <text x="205" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">固定随机种子；维护 committed 集合</text>

  <!-- 子进程 -->
  <rect x="470" y="80" width="290" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="615" y="104" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">子进程 mini-kv-engine</text>
  <text x="615" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central">随机 workload：put / del / overwrite</text>

  <line x1="350" y1="102" x2="464" y2="102" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="407" y="88" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">随机时刻 SIGKILL</text>
  <line x1="470" y1="130" x2="356" y2="130" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="407" y="146" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central">应答管道 (key, seq)</text>

  <!-- 重启恢复 -->
  <rect x="470" y="252" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="615" y="270" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">重启 → crash recovery</text>
  <text x="615" y="292" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">全量扫描 + CRC 截断</text>
  <line x1="615" y1="152" x2="615" y2="248" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="627" y="200" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">SIGKILL 后</text>

  <!-- 校验 -->
  <rect x="60" y="252" width="290" height="72" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="205" y="276" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">校验不变量（每轮）</text>
  <text x="205" y="300" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">committed ⊆ recovered ⊆ attempted</text>
  <line x1="464" y1="280" x2="356" y2="280" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 循环 -->
  <line x1="205" y1="252" x2="205" y2="158" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="217" y="205" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">下一轮，共 1000 次；失败样本归档（种子 + log）</text>

  <!-- 底部注释 -->
  <text x="60" y="380" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">kill -9 只测进程崩溃：已 write 进 page cache 的数据内核仍会落盘 —— fsync=always 下已应答必须零丢失</text>
  <text x="60" y="404" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">断电语义另测：dm-flakey / dm-log-writes / 虚拟机断电，作为边界声明或可选加分</text>
</svg>
