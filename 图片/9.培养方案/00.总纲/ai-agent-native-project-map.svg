<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <title id="title">AI Agent Native 项目总图</title>
  <desc id="desc">按能力主线和项目阶段重绘的项目总图，加入推理 Infra 桥接期和新增 serving 项目。</desc>
  <rect width="1700" height="1120" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="lineArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2937; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .laneTitle { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .laneSub { font-size: 13px; fill: #f8fafc; }
      .colTitle { font-size: 19px; font-weight: 700; }
      .tag { font-size: 13px; fill: #475569; }
      .cardTitle { font-size: 16px; font-weight: 700; }
      .cardText { font-size: 13px; fill: #475569; }
      .foot { font-size: 13px; fill: #64748b; }
    </style>
  </defs>

  <text font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" class="title" x="60" y="58">项目总图</text>
  <text font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" class="subtitle" x="60" y="88">从基础 kernel 到推理 Infra 桥接，再进入 GEMM / KV / disaggregation，最后汇成作品集和开源证据。</text>

  <rect x="60" y="128" width="250" height="850" rx="22" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
