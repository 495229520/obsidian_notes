  <text font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" class="tag" x="92" y="190">每条主线支撑不同项目</text>

  <rect x="92" y="220" width="186" height="82" rx="14" fill="#2563eb"/>
