<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5d8c"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #223; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #52616b; }
      .stage { font-size: 20px; font-weight: 700; fill: #17324d; }
      .body { font-size: 15px; fill: #243442; }
      .small { font-size: 13px; fill: #52616b; }
      .card { fill: #ffffff; stroke: #7895b2; stroke-width: 2; rx: 18; }
      .core { fill: #eaf4ff; stroke: #2f80c0; stroke-width: 2.5; rx: 20; }
      .guard { fill: #fff6df; stroke: #c28a1d; stroke-width: 2; rx: 16; }
      .target { fill: #eaf7ec; stroke: #438a52; stroke-width: 2.5; rx: 20; }
      .line { stroke: #2f5d8c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #93a8b8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="580" y="46" text-anchor="middle" class="title">AI Agent Native AI Infra / GPU Performance Engineer 能力闭环</text>
  <text x="580" y="76" text-anchor="middle" class="subtitle">不是“让 Agent 代替判断”，而是把 Agent 提效接入 correctness、profiling、serving benchmark 和上线决策</text>

  <rect x="60" y="135" width="210" height="310" class="card"/>
  <text x="165" y="170" text-anchor="middle" class="stage">AI Agent 工程流</text>
  <text x="90" y="215" class="body">• 项目脚手架</text>
  <text x="90" y="245" class="body">• 测试与 benchmark 初稿</text>
  <text x="90" y="275" class="body">• README / 报告草稿</text>
  <text x="90" y="305" class="body">• PR review checklist</text>
  <text x="90" y="355" class="small">边界：Agent 只加速工程产出</text>
  <text x="90" y="380" class="small">不决定性能结论</text>

  <rect x="335" y="115" width="250" height="350" class="core"/>
  <text x="460" y="150" text-anchor="middle" class="stage">Kernel / GPU Core</text>
  <text x="370" y="195" class="body">• CUDA / Triton</text>
  <text x="370" y="225" class="body">• RMSNorm / Softmax / GEMM</text>
  <text x="370" y="255" class="body">• Memory coalescing / tiling</text>
  <text x="370" y="285" class="body">• Nsight Compute / Systems</text>
  <text x="370" y="315" class="body">• Roofline / bottleneck 判断</text>
  <text x="370" y="365" class="small">核心要求：能解释为什么快/慢</text>
  <text x="370" y="390" class="small">并用硬件指标支撑判断</text>

  <rect x="650" y="115" width="250" height="350" class="core"/>
  <text x="775" y="150" text-anchor="middle" class="stage">LLM Serving / Infra</text>
  <text x="685" y="195" class="body">• vLLM / SGLang / TRT-LLM</text>
  <text x="685" y="225" class="body">• TTFT / TPOT / TPS / RPS</text>
  <text x="685" y="255" class="body">• KV cache / PagedAttention</text>
  <text x="685" y="285" class="body">• continuous batching</text>
  <text x="685" y="315" class="body">• cost / 1M tokens</text>
  <text x="685" y="365" class="small">核心要求：把 kernel 优化接回</text>
  <text x="685" y="390" class="small">线上延迟、吞吐和成本</text>

  <rect x="965" y="135" width="145" height="310" class="target"/>
  <text x="1037" y="170" text-anchor="middle" class="stage">最终人设</text>
  <text x="990" y="215" class="body">会用 Agent</text>
  <text x="990" y="245" class="body">会写 kernel</text>
  <text x="990" y="275" class="body">会做 profiling</text>
  <text x="990" y="305" class="body">会算成本</text>
  <text x="990" y="335" class="body">会判断上线</text>

  <path d="M 270 290 C 300 290, 305 290, 330 290" class="line"/>
  <path d="M 585 290 C 615 290, 620 290, 645 290" class="line"/>
  <path d="M 900 290 C 925 290, 935 290, 960 290" class="line"/>

  <rect x="250" y="505" width="660" height="80" class="guard"/>
  <text x="580" y="535" text-anchor="middle" class="stage">人工验证 Gate：正确性、数值稳定性、benchmark 可信度、profiling 证据、上线取舍</text>
  <text x="580" y="563" text-anchor="middle" class="small">每个项目都必须留下 reference test、atol / rtol、warmup、重复实验、原始数据、Nsight / metrics 证据与复现实验命令</text>

  <path d="M 580 505 C 470 475, 410 460, 410 430" class="thin"/>
  <path d="M 580 505 C 685 475, 750 460, 750 430" class="thin"/>
</svg>
