<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5d8c"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #1f2d3d; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { font-size: 16px; fill: #52616b; }
      .stage { font-size: 22px; font-weight: 700; fill: #17324d; }
      .body { font-size: 16px; fill: #273849; }
      .tiny { font-size: 14px; fill: #5b6770; }
      .gateTitle { font-size: 21px; font-weight: 700; fill: #17324d; }
      .s1 { fill: #eaf4ff; stroke: #367bb5; stroke-width: 2.2; rx: 16; }
      .s2 { fill: #eaf7ec; stroke: #4b915b; stroke-width: 2.2; rx: 16; }
      .s3 { fill: #fff2e8; stroke: #d07a32; stroke-width: 2.2; rx: 16; }
      .gate { fill: #fff; stroke: #8aa4bd; stroke-width: 2; rx: 12; }
      .line { stroke: #2f5d8c; stroke-width: 2.7; fill: none; marker-end: url(#arrow3); }
      .vline { stroke: #b0bcc8; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <text x="640" y="46" text-anchor="middle" class="title">三阶段培养路线：从能跑 kernel 到能解释系统成本</text>
  <text x="640" y="78" text-anchor="middle" class="sub">每个阶段都用“项目产出 + 验证 gate + 面试表达”闭环，而不是只列学习主题</text>

  <rect x="70" y="135" width="340" height="235" class="s1"/>
  <text x="240" y="174" text-anchor="middle" class="stage">阶段一：2026.05 - 2026.07</text>
  <text x="105" y="214" class="body">目标：拿到 AI Infra 实习面试</text>
  <text x="105" y="247" class="body">主线：CUDA / Triton 基础</text>
  <text x="105" y="276" class="body">　　　+ serving 入门</text>
  <text x="105" y="309" class="body">项目：基础 kernel、RMSNorm</text>
  <text x="105" y="338" class="body">　　　benchmark harness</text>
  <text x="105" y="357" class="tiny">验收：vector add / transpose / matmul / TTFT</text>

  <rect x="470" y="135" width="340" height="235" class="s2"/>
  <text x="640" y="174" text-anchor="middle" class="stage">阶段二：2026.07 - 2027.03</text>
  <text x="505" y="214" class="body">目标：转正实习竞争力</text>
  <text x="505" y="247" class="body">主线：GEMM / Attention</text>
  <text x="505" y="276" class="body">　　　KV cache / cost</text>
  <text x="505" y="309" class="body">项目：GEMM lab、tiny kernels</text>
  <text x="505" y="338" class="body">　　　paged KV、PD</text>
  <text x="505" y="357" class="tiny">验收：Nsight 证据 → serving 指标变化</text>

  <rect x="870" y="135" width="340" height="235" class="s3"/>
  <text x="1040" y="174" text-anchor="middle" class="stage">阶段三：2027.03 - 2027.09</text>
  <text x="905" y="214" class="body">目标：秋招正式 offer</text>
  <text x="905" y="247" class="body">主线：作品集、开源贡献</text>
  <text x="905" y="276" class="body">　　　系统叙事</text>
  <text x="905" y="309" class="body">项目：benchmark suite、mini-vLLM</text>
  <text x="905" y="338" class="body">　　　agent workflow</text>
  <text x="905" y="357" class="tiny">验收：数据 / 图表 / issue / PR 证明能力</text>

  <path d="M 410 252 L 462 252" class="line"/>
  <path d="M 810 252 L 862 252" class="line"/>

  <line x1="240" y1="370" x2="240" y2="425" class="vline"/>
  <line x1="640" y1="370" x2="640" y2="425" class="vline"/>
  <line x1="1040" y1="370" x2="1040" y2="425" class="vline"/>

  <rect x="70" y="425" width="340" height="125" class="gate"/>
  <text x="240" y="459" text-anchor="middle" class="gateTitle">Gate 1</text>
  <text x="105" y="496" class="body">correctness test + CUDA event</text>
  <text x="105" y="526" class="body">基础 profiling + 可复现 benchmark</text>

  <rect x="470" y="425" width="340" height="125" class="gate"/>
  <text x="640" y="459" text-anchor="middle" class="gateTitle">Gate 2</text>
  <text x="505" y="496" class="body">Nsight / metrics 证据链</text>
  <text x="505" y="526" class="body">TTFT / TPOT / KV cache / cost 分析</text>

  <rect x="870" y="425" width="340" height="125" class="gate"/>
  <text x="1040" y="459" text-anchor="middle" class="gateTitle">Gate 3</text>
  <text x="905" y="496" class="body">作品集报告 + 简历 bullet</text>
  <text x="905" y="526" class="body">issue reproduction / PR / 开源反馈</text>

  <rect x="180" y="602" width="920" height="54" fill="#eef2f5" stroke="#9aa8b5" stroke-width="1.5" rx="16"/>
  <text x="640" y="636" text-anchor="middle" class="body">路线判断标准：不能留下代码、数据、图表、报告或面试表达的学习任务，要重新定义产出。</text>
</svg>
