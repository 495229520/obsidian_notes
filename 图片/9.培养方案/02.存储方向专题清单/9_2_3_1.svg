<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <title>readahead：冷顺序读为什么快于冷随机读</title>
  <desc>顺序读触发内核预读窗口，后续读命中刚预读的 page；随机读无法触发预读，每次都同步到 NVMe 设备。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="rgb(245, 244, 237)"/>

  <text x="450" y="32" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">readahead：冷顺序读为什么快于冷随机读</text>

  <!-- Panel A: 顺序读 -->
  <text x="40" y="70" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="start" dominant-baseline="central">A. 冷 cache 顺序读：预读窗口批量化</text>

  <rect x="40" y="100" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="145" y="118" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">顺序 pread</text>
  <text x="145" y="140" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">块 0, 1, 2, 3, …</text>

  <line x1="254" y1="128" x2="314" y2="128" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 文件块条带 A：单一容器 + 内部填充/分隔线。0-2 已读入，3-7 预读窗口，8-9 未读 -->
  <rect x="320" y="106" width="480" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <path d="M328 106 h136 v44 h-136 a8 8 0 0 1 -8 -8 v-28 a8 8 0 0 1 8 -8 z" fill="#E1F5EE" stroke="none"/>
  <path d="M464 106 h240 v44 h-240 z" fill="#E1F5EE" fill-opacity="0.45" stroke="none"/>
  <path d="M464 106 h240 v44 h-240 z" fill="none" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="368" y1="106" x2="368" y2="150" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="416" y1="106" x2="416" y2="150" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="464" y1="106" x2="464" y2="150" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="512" y1="106" x2="512" y2="150" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="560" y1="106" x2="560" y2="150" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="608" y1="106" x2="608" y2="150" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="656" y1="106" x2="656" y2="150" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="704" y1="106" x2="704" y2="150" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="752" y1="106" x2="752" y2="150" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="344" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="392" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="440" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="488" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="536" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="584" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="632" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="680" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">7</text>
  <text x="728" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">8</text>
  <text x="776" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">9</text>

  <text x="392" y="176" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">已在 page cache</text>
  <text x="584" y="176" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">预读窗口：内核异步大块读入（虚线区）</text>
  <text x="752" y="198" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">未读</text>
  <text x="450" y="226" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">第 N+1 次 pread 命中刚预读进来的 page —— 单次 syscall 看到内存速度，设备在后台大块顺序喂数据</text>

  <!-- Panel B: 随机读 -->
  <text x="40" y="278" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="start" dominant-baseline="central">B. 冷 cache 随机读：预读不启动</text>

  <rect x="40" y="308" width="210" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="145" y="326" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">随机 pread</text>
  <text x="145" y="348" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">偏移无规律</text>

  <line x1="254" y1="336" x2="314" y2="336" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 文件块条带 B：单一容器，1/5/8 为本次访问（琥珀色填充） -->
  <rect x="320" y="314" width="480" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <path d="M368 314 h48 v44 h-48 z" fill="#FAEEDA" stroke="none"/>
  <path d="M560 314 h48 v44 h-48 z" fill="#FAEEDA" stroke="none"/>
  <path d="M704 314 h48 v44 h-48 z" fill="#FAEEDA" stroke="none"/>
  <line x1="368" y1="314" x2="368" y2="358" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="416" y1="314" x2="416" y2="358" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="464" y1="314" x2="464" y2="358" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="512" y1="314" x2="512" y2="358" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="560" y1="314" x2="560" y2="358" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="608" y1="314" x2="608" y2="358" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="656" y1="314" x2="656" y2="358" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="704" y1="314" x2="704" y2="358" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="752" y1="314" x2="752" y2="358" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="344" y="336" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="392" y="336" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="440" y="336" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="488" y="336" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="536" y="336" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="584" y="336" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="632" y="336" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="680" y="336" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">7</text>
  <text x="728" y="336" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">8</text>
  <text x="776" y="336" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">9</text>

  <!-- 三次访问各自到设备 -->
  <polyline points="392,358 392,412 500,412 500,438" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="584,358 584,412 570,412 570,438" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="728,358 728,412 640,412 640,438" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <rect x="440" y="442" width="260" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="570" y="464" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">NVMe 设备（同步等待）</text>

  <text x="450" y="518" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">偏移无规律打不出顺序模式，预读不启动 —— 每一次读都同步等待设备（数十微秒起）</text>

  <text x="450" y="566" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">同样的冷数据量：顺序被批量化为少数大请求（iostat 中 rareq-sz 变大），随机退化为逐次设备往返</text>
</svg>
