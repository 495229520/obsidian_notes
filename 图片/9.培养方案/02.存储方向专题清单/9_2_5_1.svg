<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700">
  <title>一次 put 的持久化时间线与崩溃窗口</title>
  <desc>put 从序列化、append 进 page cache、fsync 落盘到应答客户端的四个阶段，以及每个间隙崩溃时的数据后果与恢复不变量。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="700" fill="rgb(245, 244, 237)"/>

  <text x="470" y="34" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">一次 put 的持久化时间线与崩溃窗口</text>

  <!-- 主时间线（自上而下） -->
  <rect x="70" y="80" width="360" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="250" y="102" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">序列化 record（内存中）</text>

  <rect x="70" y="184" width="360" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="250" y="202" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">append：write 返回</text>
  <text x="250" y="224" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">数据进 page cache（脏页）</text>

  <rect x="70" y="300" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="250" y="318" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">fsync / fdatasync 返回</text>
  <text x="250" y="340" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">数据与 size 元数据到设备</text>

  <rect x="70" y="416" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="250" y="434" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">应答客户端</text>
  <text x="250" y="456" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">此后 = 已提交（committed）</text>

  <line x1="250" y1="124" x2="250" y2="180" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="240" x2="250" y2="296" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="356" x2="250" y2="412" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 崩溃窗口 -->
  <rect x="530" y="126" width="340" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="700" y="144" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">崩溃于 append 中途</text>
  <text x="700" y="166" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">半条记录（torn）→ 靠 CRC 识别并截断</text>
  <line x1="262" y1="154" x2="524" y2="154" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="242" width="340" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="700" y="260" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">崩溃点 ①：write 后、fsync 前</text>
  <text x="700" y="282" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">断电丢 page cache；kill -9 不丢</text>
  <line x1="262" y1="270" x2="524" y2="270" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="358" width="340" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="700" y="376" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">崩溃点 ②：fsync 后、应答前</text>
  <text x="700" y="398" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">数据在、客户端不知道 → 允许“多”</text>
  <line x1="262" y1="386" x2="524" y2="386" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="474" width="340" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="700" y="492" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">崩溃点 ③：应答之后</text>
  <text x="700" y="514" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">必须恢复出来，丢一条就是 bug</text>
  <polyline points="250,472 250,502 524,502" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 底部不变量 -->
  <rect x="70" y="590" width="800" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="470" y="608" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">恢复不变量：committed ⊆ recovered ⊆ attempted</text>
  <text x="470" y="632" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">① 允许丢未提交；② 允许多、不允许坏；③ 一条都不能丢 —— 崩溃注入按这三条校验</text>
</svg>
