<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#f8fafc"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">从 YAML 到 benchmark 命令：合并 → 映射 → continuous/static 分叉</text>

  <!-- inputs -->
  <rect x="30" y="70" width="190" height="60" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="125" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">scenario.yaml</text>
  <text x="125" y="114" text-anchor="middle" font-size="11" fill="#7c3aed">只含差异字段</text>

  <rect x="30" y="150" width="190" height="60" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="125" y="175" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">benchmark_config.yaml</text>
  <text x="125" y="194" text-anchor="middle" font-size="11" fill="#7c3aed">base 全字段默认</text>

  <!-- merge -->
  <rect x="280" y="108" width="180" height="64" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="370" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">_deep_merge()</text>
  <text x="370" y="151" text-anchor="middle" font-size="11" fill="#1e3a8a">scenario 覆盖 base</text>
  <text x="370" y="166" text-anchor="middle" font-size="10.5" fill="#1e3a8a">递归合并 dict</text>

  <!-- dataclass -->
  <rect x="520" y="100" width="190" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="615" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">BenchmarkConfig</text>
  <text x="615" y="143" text-anchor="middle" font-size="10.5" fill="#1e3a8a">model/engine/workload/</text>
  <text x="615" y="158" text-anchor="middle" font-size="10.5" fill="#1e3a8a">measurement/cost</text>
  <text x="615" y="173" text-anchor="middle" font-size="10.5" fill="#b91c1c">_validate() 非法即报错</text>

  <line x1="220" y1="100" x2="280" y2="125" stroke="#475569" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="220" y1="180" x2="280" y2="155" stroke="#475569" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="460" y1="140" x2="520" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- mapping table -->
  <rect x="60" y="230" width="430" height="210" rx="8" fill="#fff" stroke="#60a5fa"/>
  <text x="275" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">to_vllm_args() · 字段→flag 唯一映射</text>
  <line x1="60" y1="262" x2="490" y2="262" stroke="#cbd5e1"/>
  <text x="74" y="282" font-size="11" fill="#334155">request_rate / burstiness / max_concurrency</text>
  <text x="380" y="282" font-size="11" font-family="monospace" fill="#0f766e">--request-rate …</text>
  <text x="74" y="304" font-size="11" fill="#334155">prompt_length_distribution（fixed_N/uniform）</text>
  <text x="380" y="304" font-size="11" font-family="monospace" fill="#0f766e">--random-input-len</text>
  <text x="74" y="326" font-size="11" fill="#334155">output_length_distribution</text>
  <text x="380" y="326" font-size="11" font-family="monospace" fill="#0f766e">--random-output-len</text>
  <text x="74" y="348" font-size="11" fill="#334155">shared_prefix_tokens &gt; 0</text>
  <text x="380" y="348" font-size="11" font-family="monospace" fill="#0f766e">--random-prefix-len</text>
  <text x="74" y="370" font-size="11" fill="#334155">dataset_name=custom</text>
  <text x="380" y="370" font-size="11" font-family="monospace" fill="#0f766e">--dataset-path</text>
  <text x="74" y="392" font-size="11" fill="#334155">engine.name → backend</text>
  <text x="380" y="392" font-size="11" font-family="monospace" fill="#0f766e">vllm / openai</text>
  <text x="74" y="414" font-size="11" fill="#334155">streaming=false → 固定输出长度</text>
  <text x="380" y="414" font-size="11" font-family="monospace" fill="#0f766e">--ignore-eos</text>
  <text x="74" y="433" font-size="10" fill="#94a3b8">注：--save-result/--result-* 由 run_benchmark.py 负责，不在映射里</text>

  <line x1="615" y1="180" x2="615" y2="208" stroke="#475569" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="520" y="208" width="380" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="710" y="233" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">build_command() · 按 engine.batching_mode 分叉</text>

  <line x1="275" y1="230" x2="430" y2="248" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- fork -->
  <rect x="520" y="280" width="380" height="120" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="710" y="302" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a16207">continuous（在线）</text>
  <text x="710" y="322" text-anchor="middle" font-size="11" font-family="monospace" fill="#854d0e">vllm bench serve + to_vllm_args()</text>
  <text x="710" y="340" text-anchor="middle" font-size="11" fill="#a16207">打活 server，按到达率/并发压</text>
  <text x="710" y="360" text-anchor="middle" font-size="11" fill="#a16207">→ 同时得 TTFT/TPOT/ITL/E2E + TPS/RPS</text>
  <text x="710" y="382" text-anchor="middle" font-size="10.5" fill="#a16207">--save-result --result-dir --result-filename</text>

  <rect x="520" y="412" width="380" height="120" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="710" y="434" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">static（离线基线）</text>
  <text x="710" y="454" text-anchor="middle" font-size="11" font-family="monospace" fill="#9a3412">vllm bench throughput</text>
  <text x="710" y="472" text-anchor="middle" font-size="11" fill="#c2410c">固定 batch、无逐请求到达</text>
  <text x="710" y="492" text-anchor="middle" font-size="11" fill="#c2410c">→ 仅峰值 tokens/s，无 TTFT/TPOT/tail</text>
  <text x="710" y="514" text-anchor="middle" font-size="10.5" fill="#9a3412">--output-json （且禁止 --engine sglang）</text>

  <line x1="710" y1="248" x2="710" y2="280" stroke="#475569" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="600" y1="248" x2="600" y2="412" stroke="#475569" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- outputs -->
  <rect x="60" y="470" width="430" height="100" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="275" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">两种 JSON 形状 → summarize.py 统一聚合</text>
  <text x="74" y="514" font-size="11" fill="#9a3412">serve JSON：含 mean_ttft_ms / request_throughput …</text>
  <text x="74" y="534" font-size="11" fill="#9a3412">throughput JSON：仅 tokens_per_second / requests_per_second</text>
  <text x="74" y="556" font-size="11" fill="#9a3412">→ 派生 cost/1M tokens（gpu_hourly_usd 假设）→ CSV</text>
  <line x1="520" y1="360" x2="490" y2="500" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="520" y1="472" x2="490" y2="510" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>
</svg>
