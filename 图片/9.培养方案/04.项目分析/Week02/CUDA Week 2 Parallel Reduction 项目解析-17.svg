<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Nsight Compute Profiling 证据图</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">17 Nsight Compute：从代码结构到性能证据</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“15. Nsight Compute Profiling”中</text>
<rect x="100" y="160" width="310" height="330" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="100" y="160" width="310" height="8" rx="18" fill="#7C3AED" opacity="1"/>
<text x="120" y="194" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">代码结构</text>
<text x="120" y="224" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Naive：thread 0 串行读</text>
<text x="120" y="245" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Shared：多轮 __syncthreads</text>
<text x="120" y="266" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Shuffle：warp register exchange</text>
<line x1="410" y1="325" x2="490" y2="325" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="490" y="160" width="310" height="330" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="490" y="160" width="310" height="8" rx="18" fill="#2563EB" opacity="1"/>
<text x="510" y="194" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">核心指标</text>
<text x="510" y="224" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Kernel time / Memory throughput</text>
<text x="510" y="245" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Achieved occupancy</text>
<text x="510" y="266" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Warp stall reasons</text>
<text x="510" y="287" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Registers / Shared memory / L1-L2 hit</text>
<line x1="800" y1="325" x2="880" y2="325" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="880" y="160" width="310" height="330" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="880" y="160" width="310" height="8" rx="18" fill="#059669" opacity="1"/>
<text x="900" y="194" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">预期解释</text>
<text x="900" y="224" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Naive：Long Scoreboard / 活跃线程少</text>
<text x="900" y="245" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Shared：barrier 与 smem 压力</text>
<text x="900" y="266" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Shuffle：smem 少、同步少、带宽更高</text>
<rect x="200" y="545" width="880" height="80" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="218" y="573" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="start">建议命令</text>
<text x="218" y="600" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">ncu --set full ./build/test_reduce_naive</text>
<text x="218" y="620" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">ncu --set full ./build/test_reduce_shared</text>
<text x="218" y="640" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">ncu --set full ./build/test_reduce_shuffle</text>
<rect x="420" y="645" width="440" height="34" rx="17.0" fill="#D1FAE5" stroke="#059669" stroke-width="1" opacity="1"/>
<text x="640.0" y="667.0" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">不要只写“更快”，要写“哪个指标证明它为什么更快”</text>
</svg>
