<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Shared Memory 二分树形归约</title>
  <desc id="desc">blockDim.x=8 示例：每轮 stride 减半，前 stride 个线程做 sdata[tid] += sdata[tid+stride]，log2(8)=3 轮后 sdata[0] 持有 block 内总和。</desc>
  <rect x="0" y="0" width="1040" height="600" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="520" y="34" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#0C447C">Shared Memory 二分树形归约（blockDim.x = 8）</text>
  <text x="520" y="60" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#444441">每轮 stride 减半，前 stride 个线程做 sdata[tid] += sdata[tid + stride]，log2(8)=3 轮完成</text>

  <!-- thread header -->
  <text x="250" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#7A7872">T0</text>
  <text x="350" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#7A7872">T1</text>
  <text x="450" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#7A7872">T2</text>
  <text x="550" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#7A7872">T3</text>
  <text x="650" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#7A7872">T4</text>
  <text x="750" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#7A7872">T5</text>
  <text x="850" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#7A7872">T6</text>
  <text x="950" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#7A7872">T7</text>

  <!-- ROW 0: initial load (orange) -->
  <text x="130" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#633806">初始 sdata</text>
  <rect x="214" y="110" width="72" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/><text x="250" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#633806">3</text>
  <rect x="314" y="110" width="72" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/><text x="350" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#633806">1</text>
  <rect x="414" y="110" width="72" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/><text x="450" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#633806">4</text>
  <rect x="514" y="110" width="72" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/><text x="550" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#633806">1</text>
  <rect x="614" y="110" width="72" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/><text x="650" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#633806">5</text>
  <rect x="714" y="110" width="72" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/><text x="750" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#633806">9</text>
  <rect x="814" y="110" width="72" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/><text x="850" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#633806">2</text>
  <rect x="914" y="110" width="72" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/><text x="950" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#633806">6</text>

  <!-- Round 1 arrows (stride=4): source i+4 -> target i -->
  <line x1="650" y1="156" x2="256" y2="228" stroke="#0F6E56" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>
  <line x1="750" y1="156" x2="356" y2="228" stroke="#0F6E56" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>
  <line x1="850" y1="156" x2="456" y2="228" stroke="#0F6E56" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>
  <line x1="950" y1="156" x2="556" y2="228" stroke="#0F6E56" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>

  <!-- ROW 1: stride=4 -->
  <text x="130" y="251" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#085041">Round 1 · stride=4</text>
  <rect x="214" y="228" width="72" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="250" y="251" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#085041">8</text>
  <rect x="314" y="228" width="72" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="350" y="251" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#085041">10</text>
  <rect x="414" y="228" width="72" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="450" y="251" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#085041">6</text>
  <rect x="514" y="228" width="72" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="550" y="251" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#085041">7</text>
  <rect x="614" y="228" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="714" y="228" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="814" y="228" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="914" y="228" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>

  <!-- Round 2 arrows (stride=2): source i+2 -> target i -->
  <line x1="450" y1="274" x2="256" y2="346" stroke="#0F6E56" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>
  <line x1="550" y1="274" x2="356" y2="346" stroke="#0F6E56" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>

  <!-- ROW 2: stride=2 -->
  <text x="130" y="369" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#085041">Round 2 · stride=2</text>
  <rect x="214" y="346" width="72" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="250" y="369" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#085041">14</text>
  <rect x="314" y="346" width="72" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="350" y="369" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#085041">17</text>
  <rect x="414" y="346" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="514" y="346" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="614" y="346" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="714" y="346" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="814" y="346" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="914" y="346" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>

  <!-- Round 3 arrow (stride=1): source 1 -> target 0 -->
  <line x1="350" y1="392" x2="256" y2="464" stroke="#0F6E56" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>

  <!-- ROW 3: stride=1 -->
  <text x="130" y="487" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#085041">Round 3 · stride=1</text>
  <rect x="214" y="464" width="72" height="46" rx="8" fill="#CDEBE0" stroke="#0F6E56" stroke-width="2"/><text x="250" y="487" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#063b30">31</text>
  <rect x="314" y="464" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="414" y="464" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="514" y="464" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="614" y="464" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="714" y="464" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="814" y="464" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>
  <rect x="914" y="464" width="72" height="46" rx="8" fill="#ECEAE5" stroke="#CFCDC4" stroke-width="1"/>

  <!-- result callout -->
  <line x1="286" y1="487" x2="372" y2="487" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="378" y="464" width="606" height="46" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <text x="681" y="487" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">sdata[0] = 31 = 3+1+4+1+5+9+2+6 → 线程 0 写出 partial_sums[blockIdx.x]</text>

  <!-- footer note -->
  <rect x="214" y="540" width="772" height="34" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="600" y="558" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#444441">每轮结束都需要 __syncthreads()；灰色格子表示该 lane 已退出归约，活跃线程数逐轮减半（128→64→…→1）</text>
</svg>
