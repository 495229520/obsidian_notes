<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc">
  <title id="title">三种 reduction 实现对比</title>
  <desc id="desc">对比 naive、shared memory 和 warp shuffle 在并行度、通信介质、同步成本和学习重点上的差异，并用迷你条展示 block 内有效线程占比。</desc>
  <rect x="0" y="0" width="1080" height="510" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="540" y="34" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#0C447C">三种 parallel reduction 的核心差异</text>
  <text x="540" y="60" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#444441">从“几乎没有 block 内协作”逐步走向“warp 内寄存器通信”</text>

  <!-- ============ Card A: Naive ============ -->
  <rect x="60" y="92" width="280" height="306" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.3"/>
  <path d="M60 134 v-32 a10 10 0 0 1 10 -10 h260 a10 10 0 0 1 10 10 v32 z" fill="#854F0B"/>
  <text x="200" y="116" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Naive reduce</text>
  <text x="200" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" fill="#633806">线程 0 在 block 内串行累加</text>
  <text x="82" y="196" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">通信：几乎没有协作</text>
  <text x="82" y="224" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">同步：不需要 barrier</text>
  <text x="82" y="252" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">作用：建立低效 baseline</text>
  <text x="82" y="280" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">瓶颈：线程闲置 + 全局访存等待</text>
  <text x="82" y="326" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#633806">block 内有效线程占比</text>
  <text x="318" y="326" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#854F0B">≈ 1/256</text>
  <rect x="82" y="344" width="236" height="14" rx="7" fill="#E7E1D2"/>
  <rect x="82" y="344" width="22" height="14" rx="7" fill="#854F0B"/>
  <text x="200" y="380" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#7A6A4A">并行度：低</text>

  <!-- ============ Card B: Shared ============ -->
  <rect x="400" y="92" width="280" height="306" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <path d="M400 134 v-32 a10 10 0 0 1 10 -10 h260 a10 10 0 0 1 10 10 v32 z" fill="#0F6E56"/>
  <text x="540" y="116" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Shared memory reduce</text>
  <text x="540" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" fill="#085041">block 内二分树形归约</text>
  <text x="422" y="196" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">通信：shared memory</text>
  <text x="422" y="224" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">同步：每轮 __syncthreads()</text>
  <text x="422" y="252" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">作用：学习 block 协作</text>
  <text x="422" y="280" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">瓶颈：barrier + shared 资源</text>
  <text x="422" y="326" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#085041">block 内有效线程占比</text>
  <text x="658" y="326" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#0F6E56">逐轮减半</text>
  <rect x="422" y="344" width="236" height="14" rx="7" fill="#D2E8DF"/>
  <rect x="422" y="344" width="150" height="14" rx="7" fill="#0F6E56"/>
  <text x="540" y="380" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#4A7466">并行度：block 内提升</text>

  <!-- ============ Card C: Shuffle ============ -->
  <rect x="740" y="92" width="280" height="306" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
  <path d="M740 134 v-32 a10 10 0 0 1 10 -10 h260 a10 10 0 0 1 10 10 v32 z" fill="#534AB7"/>
  <text x="880" y="116" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Warp shuffle reduce</text>
  <text x="880" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" fill="#3C3489">warp 内寄存器到寄存器</text>
  <text x="762" y="196" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">通信：register + 少量 shared</text>
  <text x="762" y="224" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">同步：warp 内天然同步</text>
  <text x="762" y="252" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">作用：学习 warp primitive</text>
  <text x="762" y="280" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">瓶颈：跨 warp 汇总 + 拷回</text>
  <text x="762" y="326" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#3C3489">block 内有效线程占比</text>
  <text x="998" y="326" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#534AB7">warp 内近满载</text>
  <rect x="762" y="344" width="236" height="14" rx="7" fill="#E2E0F4"/>
  <rect x="762" y="344" width="212" height="14" rx="7" fill="#534AB7"/>
  <text x="880" y="380" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#6259A6">并行度：warp 内高效</text>

  <!-- progression arrows between cards -->
  <line x1="348" y1="245" x2="392" y2="245" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="688" y1="245" x2="732" y2="245" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="230" y="462" width="620" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="540" y="478" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">优化方向：减少闲置线程、减少高延迟通信、用 Nsight 指标验证判断</text>
</svg>
