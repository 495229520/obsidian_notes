<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="980" height="500" fill="#ffffff"/>

  <!-- ===== 顶层：测试 / 基准入口 ===== -->
  <rect x="60" y="18" width="410" height="66" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="265" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">tests/test_matmul_*.cu</text>
  <text x="265" y="64" text-anchor="middle" font-size="12" fill="#3c4043">CPU 三重循环对拍 · 相对误差 2e-2</text>

  <rect x="510" y="18" width="410" height="66" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="715" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">benchmarks/bench_matmul.cu</text>
  <text x="715" y="64" text-anchor="middle" font-size="12" fill="#3c4043">cudaEvent 计时 · TFLOPS · profile 钩子</text>

  <!-- ===== 四列：每个版本的调用栈 ===== -->
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">
    <text x="150" y="108">naive</text>
    <text x="370" y="108">tiled</text>
    <text x="590" y="108">register</text>
    <text x="810" y="108">cuBLAS</text>
  </g>

  <!-- Host wrapper 行 -->
  <g font-size="12.5">
    <rect x="65" y="120" width="170" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <rect x="285" y="120" width="170" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <rect x="505" y="120" width="170" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <rect x="725" y="120" width="170" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <g text-anchor="middle" fill="#137333" font-weight="bold">
      <text x="150" y="140">matmul_naive()</text>
      <text x="370" y="140">matmul_tiled()</text>
      <text x="590" y="140">matmul_register()</text>
      <text x="810" y="140">matmul_cublas()</text>
    </g>
    <g text-anchor="middle" fill="#3c4043" font-size="11">
      <text x="150" y="159">H2D → launch → D2H</text>
      <text x="370" y="159">H2D → launch → D2H</text>
      <text x="590" y="159">H2D → launch → D2H</text>
      <text x="810" y="159">H2D → launch → D2H</text>
    </g>
  </g>

  <!-- launch 行 -->
  <g font-size="12.5">
    <rect x="65" y="200" width="170" height="44" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
    <rect x="285" y="200" width="170" height="44" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
    <rect x="505" y="200" width="170" height="44" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
    <rect x="725" y="200" width="170" height="44" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
    <g text-anchor="middle" fill="#b06000" font-weight="bold">
      <text x="150" y="227">launch_…_naive</text>
      <text x="370" y="227">launch_…_tiled</text>
      <text x="590" y="227">launch_…_register</text>
      <text x="810" y="227">cublasSgemm</text>
    </g>
  </g>

  <!-- kernel 行 -->
  <g font-size="11.5">
    <rect x="65" y="274" width="170" height="58" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
    <rect x="285" y="274" width="170" height="58" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
    <rect x="505" y="274" width="170" height="58" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
    <rect x="725" y="274" width="170" height="58" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
    <g text-anchor="middle" fill="#c5221f" font-weight="bold">
      <text x="150" y="297">__global__ kernel</text>
      <text x="370" y="297">__global__ kernel</text>
      <text x="590" y="297">__global__ kernel</text>
    </g>
    <g text-anchor="middle" fill="#3c4043" font-size="10.5">
      <text x="150" y="316">1 线程 = 1 元素</text>
      <text x="150" y="328">无复用</text>
      <text x="370" y="316">16×16 shared tile</text>
      <text x="370" y="328">block 内复用 ×16</text>
      <text x="590" y="316">64×64 block tile</text>
      <text x="590" y="328">4×4 寄存器累加</text>
      <text x="810" y="300" font-weight="bold" fill="#5f6368">闭源库 kernel</text>
      <text x="810" y="319">volta_sgemm_32x128_nn</text>
    </g>
  </g>

  <!-- ===== 底层：基础设施 ===== -->
  <rect x="60" y="372" width="860" height="100" rx="8" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.5"/>
  <text x="490" y="394" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7627bb">include/ — 复用基础设施 (header-only)</text>
  <g font-size="12">
    <rect x="85" y="408" width="255" height="52" rx="6" fill="#ffffff" stroke="#a142f4"/>
    <text x="212" y="430" text-anchor="middle" font-weight="bold" fill="#7627bb">cuda_check.cuh</text>
    <text x="212" y="449" text-anchor="middle" font-size="11" fill="#3c4043">CUDA_CHECK 宏 · 抛异常</text>

    <rect x="362" y="408" width="255" height="52" rx="6" fill="#ffffff" stroke="#a142f4"/>
    <text x="489" y="430" text-anchor="middle" font-weight="bold" fill="#7627bb">device_buffer.cuh</text>
    <text x="489" y="449" text-anchor="middle" font-size="11" fill="#3c4043">DeviceBuffer&lt;T&gt; 显存 RAII</text>

    <rect x="639" y="408" width="256" height="52" rx="6" fill="#ffffff" stroke="#a142f4"/>
    <text x="767" y="430" text-anchor="middle" font-weight="bold" fill="#7627bb">test_utils.cuh</text>
    <text x="767" y="449" text-anchor="middle" font-size="11" fill="#3c4043">CPU 参考 · 相对误差校验</text>
  </g>

  <!-- 箭头：入口 → host -->
  <g stroke="#5f6368" stroke-width="1.5" fill="none">
    <path d="M150,84 L150,120" marker-end="url(#ar)"/>
    <path d="M370,84 L370,120" marker-end="url(#ar)"/>
    <path d="M590,84 L590,120" marker-end="url(#ar)"/>
    <path d="M810,84 L810,120" marker-end="url(#ar)"/>
    <!-- host → launch -->
    <path d="M150,170 L150,200" marker-end="url(#ar)"/>
    <path d="M370,170 L370,200" marker-end="url(#ar)"/>
    <path d="M590,170 L590,200" marker-end="url(#ar)"/>
    <path d="M810,170 L810,200" marker-end="url(#ar)"/>
    <!-- launch → kernel -->
    <path d="M150,244 L150,274" marker-end="url(#ar)"/>
    <path d="M370,244 L370,274" marker-end="url(#ar)"/>
    <path d="M590,244 L590,274" marker-end="url(#ar)"/>
    <path d="M810,244 L810,274" marker-end="url(#ar)"/>
    <!-- kernel → infra -->
    <path d="M150,332 L150,372" marker-end="url(#ar)" stroke-dasharray="4 3"/>
    <path d="M370,332 L370,372" marker-end="url(#ar)" stroke-dasharray="4 3"/>
    <path d="M590,332 L590,372" marker-end="url(#ar)" stroke-dasharray="4 3"/>
  </g>
</svg>
