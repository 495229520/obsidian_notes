<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7b"/>
    </marker>
    <style>
      .ttl{font-size:22px;font-weight:700;fill:#1f2d3d}
      .sub{font-size:13px;fill:#5b6b7b}
      .grp{font-size:14px;font-weight:700;fill:#2c3e50}
      .mono{font-family:'Consolas','SFMono-Regular',monospace;font-size:13px;fill:#1f2d3d}
      .note{font-size:12px;fill:#7a8794}
      .edge{stroke:#5b6b7b;stroke-width:1.6;fill:none}
    </style>
  </defs>

  <text x="40" y="40" class="ttl">Week 3 Transpose — 项目架构</text>
  <text x="40" y="62" class="sub">单一静态库 transpose_lib 提供 4 个 kernel，tests / benchmark 链接同一个库；Makefile 包装 CMake</text>

  <!-- include group -->
  <rect x="40" y="100" width="250" height="210" rx="10" fill="#eef4fb" stroke="#b9d2ec"/>
  <text x="56" y="125" class="grp">include/  公共基础设施</text>
  <rect x="58" y="140" width="214" height="40" rx="6" fill="#ffffff" stroke="#b9d2ec"/>
  <text x="70" y="158" class="mono">cuda_check.cuh</text>
  <text x="70" y="173" class="note">CUDA_CHECK 宏 + 抛异常</text>
  <rect x="58" y="190" width="214" height="40" rx="6" fill="#ffffff" stroke="#b9d2ec"/>
  <text x="70" y="208" class="mono">device_buffer.cuh</text>
  <text x="70" y="223" class="note">DeviceBuffer RAII 显存封装</text>
  <rect x="58" y="240" width="214" height="40" rx="6" fill="#ffffff" stroke="#b9d2ec"/>
  <text x="70" y="258" class="mono">test_utils.cuh</text>
  <text x="70" y="273" class="note">generate / cpu_transpose / check</text>

  <!-- transpose_lib -->
  <rect x="355" y="100" width="250" height="300" rx="10" fill="#eafaf1" stroke="#9fdcc0"/>
  <text x="371" y="125" class="grp">transpose_lib  (src/*.cu)</text>
  <rect x="373" y="140" width="214" height="56" rx="6" fill="#ffffff" stroke="#9fdcc0"/>
  <text x="385" y="160" class="mono">transpose_copy.cu</text>
  <text x="385" y="178" class="note">带宽 baseline · 读写均 coalesced</text>
  <rect x="373" y="204" width="214" height="56" rx="6" fill="#ffffff" stroke="#9fdcc0"/>
  <text x="385" y="224" class="mono">transpose_naive.cu</text>
  <text x="385" y="242" class="note">coalesced 读 · uncoalesced 写</text>
  <rect x="373" y="268" width="214" height="56" rx="6" fill="#ffffff" stroke="#9fdcc0"/>
  <text x="385" y="288" class="mono">transpose_tiled.cu</text>
  <text x="385" y="306" class="note">shared tile · 32-way bank conflict</text>
  <rect x="373" y="332" width="214" height="56" rx="6" fill="#ffffff" stroke="#9fdcc0"/>
  <text x="385" y="352" class="mono">transpose_padded.cu</text>
  <text x="385" y="370" class="note">+1 padding · 无 bank conflict</text>

  <!-- consumers -->
  <rect x="670" y="100" width="250" height="130" rx="10" fill="#fff4e9" stroke="#f3cfa0"/>
  <text x="686" y="125" class="grp">tests/  正确性</text>
  <text x="686" y="148" class="mono">test_transpose_copy</text>
  <text x="686" y="167" class="mono">test_transpose_naive</text>
  <text x="686" y="186" class="mono">test_transpose_tiled</text>
  <text x="686" y="205" class="mono">test_transpose_padded</text>

  <rect x="670" y="250" width="250" height="80" rx="10" fill="#fdeef0" stroke="#f3b9c2"/>
  <text x="686" y="275" class="grp">benchmarks/  性能</text>
  <text x="686" y="298" class="mono">bench_transpose.cu</text>
  <text x="686" y="316" class="note">4 版本统一计时 + 校验</text>

  <!-- edges -->
  <path class="edge" d="M290,200 L353,235" marker-end="url(#arr)"/>
  <text x="300" y="210" class="note">#include</text>
  <path class="edge" d="M605,180 L668,165" marker-end="url(#arr)"/>
  <text x="612" y="160" class="note">link</text>
  <path class="edge" d="M605,300 L668,295" marker-end="url(#arr)"/>
  <text x="612" y="288" class="note">link</text>

  <!-- build chain -->
  <rect x="40" y="470" width="880" height="120" rx="10" fill="#f5f7fa" stroke="#d7dee6"/>
  <text x="56" y="495" class="grp">构建链（Makefile 是 CMake 的便捷包装）</text>
  <rect x="58" y="510" width="170" height="56" rx="6" fill="#ffffff" stroke="#d7dee6"/>
  <text x="72" y="532" class="mono">make / make test</text>
  <text x="72" y="550" class="note">make bench / clean</text>
  <rect x="270" y="510" width="230" height="56" rx="6" fill="#ffffff" stroke="#d7dee6"/>
  <text x="284" y="532" class="mono">cmake -S . -B build</text>
  <text x="284" y="550" class="note">project(LANGUAGES CXX CUDA)</text>
  <rect x="540" y="510" width="220" height="56" rx="6" fill="#ffffff" stroke="#d7dee6"/>
  <text x="554" y="532" class="mono">cmake --build build</text>
  <text x="554" y="550" class="note">编译库 + tests + bench</text>
  <path class="edge" d="M228,538 L268,538" marker-end="url(#arr)"/>
  <path class="edge" d="M500,538 L538,538" marker-end="url(#arr)"/>

  <!-- reading order -->
  <text x="40" y="630" class="grp">建议阅读顺序：</text>
  <text x="40" y="652" class="mono">cuda_check → device_buffer → copy → naive → tiled → padded</text>
</svg>
