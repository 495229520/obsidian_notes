<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1c8a52"/>
    </marker>
    <style>
      .ttl{font-size:21px;font-weight:700;fill:#1f2d3d}
      .sub{font-size:13px;fill:#5b6b7b}
      .ph{font-size:15px;font-weight:700;fill:#2c3e50}
      .mono{font-family:'Consolas',monospace;font-size:12px;fill:#1f2d3d}
      .note{font-size:12px;fill:#7a8794}
      .ok{font-size:14px;font-weight:700;fill:#1c8a52}
      .bad{font-size:14px;font-weight:700;fill:#c0392b}
      .er{stroke:#c0392b;stroke-width:1.3;fill:none;opacity:.8}
      .eg{stroke:#1c8a52;stroke-width:1.3;fill:none;opacity:.8}
    </style>
  </defs>

  <text x="40" y="36" class="ttl">写阶段读 shared memory：tile[threadIdx.x][c] — bank 冲突的根因与 padding 解法</text>
  <text x="40" y="58" class="sub">一个 warp 的 32 个 lane 固定列 c、行 = threadIdx.x = 0..31。bank = 地址 % 32（每 4B 一个 bank，共 32 bank）</text>

  <!-- LEFT: tiled -->
  <rect x="30" y="78" width="450" height="540" rx="12" fill="#fdeef0" stroke="#f3b9c2"/>
  <text x="50" y="104" class="ph">tiled：tile[32][32]，行距 stride = 32</text>
  <text x="50" y="126" class="mono">addr = row*32 + c  →  bank = (row*32+c)%32 = c</text>
  <text x="50" y="146" class="note">取 c = 0 举例：每一行都落在 bank 0</text>

  <g>
    <rect x="50" y="160" width="170" height="26" fill="#fff" stroke="#e08493"/><text x="58" y="178" class="mono">tile[0][0] → bank 0</text>
    <rect x="50" y="192" width="170" height="26" fill="#fff" stroke="#e08493"/><text x="58" y="210" class="mono">tile[1][0] → bank 0</text>
    <rect x="50" y="224" width="170" height="26" fill="#fff" stroke="#e08493"/><text x="58" y="242" class="mono">tile[2][0] → bank 0</text>
    <rect x="50" y="256" width="170" height="26" fill="#fff" stroke="#e08493"/><text x="58" y="274" class="mono">tile[3][0] → bank 0</text>
    <text x="58" y="300" class="note">⋮  共 32 行（32 lanes）全部 → bank 0</text>
  </g>

  <!-- converge arrows -->
  <path class="er" d="M222,173 C320,173 320,470 70,505" marker-end="url(#ar)"/>
  <path class="er" d="M222,205 C330,205 320,470 70,505" marker-end="url(#ar)"/>
  <path class="er" d="M222,237 C340,237 320,470 70,505" marker-end="url(#ar)"/>
  <path class="er" d="M222,269 C350,269 320,470 70,505" marker-end="url(#ar)"/>

  <!-- bank strip left -->
  <text x="50" y="500" class="note">banks 0 — 31</text>
  <g>
    <rect x="50" y="506" width="14" height="22" fill="#c0392b" stroke="#fff"/>
    <rect x="64" y="506" width="364" height="22" fill="#f6dde1" stroke="#e08493"/>
  </g>
  <text x="50" y="556" class="bad">32 个 lane 抢同一个 bank → 32-way conflict</text>
  <text x="50" y="578" class="bad">硬件串行化为 32 次访问</text>
  <text x="50" y="600" class="note">现象：写阶段 shared load 吞吐骤降，掩盖了 global 已 coalesced 的收益</text>

  <!-- RIGHT: padded -->
  <rect x="500" y="78" width="450" height="540" rx="12" fill="#eafaf1" stroke="#9fdcc0"/>
  <text x="520" y="104" class="ph">padded：tile[32][33]，行距 stride = 33</text>
  <text x="520" y="126" class="mono">addr = row*33 + c → bank = (row+c)%32（33%32=1）</text>
  <text x="520" y="146" class="note">取 c = 0：bank = row，逐行错开一个</text>

  <g>
    <rect x="520" y="160" width="180" height="26" fill="#fff" stroke="#86cfa8"/><text x="528" y="178" class="mono">tile[0][0] → bank 0</text>
    <rect x="520" y="192" width="180" height="26" fill="#fff" stroke="#86cfa8"/><text x="528" y="210" class="mono">tile[1][0] → bank 1</text>
    <rect x="520" y="224" width="180" height="26" fill="#fff" stroke="#86cfa8"/><text x="528" y="242" class="mono">tile[2][0] → bank 2</text>
    <rect x="520" y="256" width="180" height="26" fill="#fff" stroke="#86cfa8"/><text x="528" y="274" class="mono">tile[3][0] → bank 3</text>
    <text x="528" y="300" class="note">⋮  共 32 行 → bank 0,1,…,31 全不同</text>
  </g>

  <!-- fan-out arrows -->
  <path class="eg" d="M704,173 C770,173 540,470 527,505" marker-end="url(#ag)"/>
  <path class="eg" d="M704,205 C790,205 560,470 541,505" marker-end="url(#ag)"/>
  <path class="eg" d="M704,237 C810,237 580,470 555,505" marker-end="url(#ag)"/>
  <path class="eg" d="M704,269 C830,269 600,470 569,505" marker-end="url(#ag)"/>

  <!-- bank strip right -->
  <text x="520" y="500" class="note">banks 0 — 31</text>
  <g>
    <rect x="520" y="506" width="14" height="22" fill="#1c8a52" stroke="#fff"/>
    <rect x="534" y="506" width="14" height="22" fill="#2fa86a" stroke="#fff"/>
    <rect x="548" y="506" width="14" height="22" fill="#46b87d" stroke="#fff"/>
    <rect x="562" y="506" width="14" height="22" fill="#5cc78f" stroke="#fff"/>
    <rect x="576" y="506" width="322" height="22" fill="#dff3e8" stroke="#86cfa8"/>
  </g>
  <text x="520" y="556" class="ok">32 个 lane 命中 32 个不同 bank → 无 conflict</text>
  <text x="520" y="578" class="ok">一次完成，无串行化</text>
  <text x="520" y="600" class="note">代价：每个 block 多 32 个 float（128B）shared memory，几乎免费</text>
</svg>
