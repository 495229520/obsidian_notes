<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280px" height="720px" viewBox="0 0 1280 720" version="1.1"><title>Metric space to GPU kernel correctness bridge</title><desc>A diagram connecting metric space concepts to error metrics, GPU kernel correctness tests, reduction, softmax, quantization, and profiling.</desc><rect x="0" y="0" width="1280" height="720" fill="rgb(245, 244, 237)" /><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2f3f46" /></marker><marker id="softArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6e7564" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect fill="rgb(245, 244, 237)" x="0" y="0" width="1280" height="720" /><text fill="#18282f" font-size="31" font-weight="700" font-family="Arial, sans-serif" x="640" y="52" text-anchor="middle" dominant-baseline="middle">From Metric Space to GPU Kernel Correctness</text><rect fill="#fffdf8" stroke="#2f3f46" stroke-width="2" x="70" y="116" width="275" height="152" rx="10" ry="10" /><text fill="#18282f" font-size="22" font-weight="700" font-family="Arial, sans-serif" x="207" y="158" text-anchor="middle" dominant-baseline="middle">Math Layer</text><text fill="#34464d" font-size="17" font-family="Arial, sans-serif" x="207" y="211" text-anchor="middle" dominant-baseline="middle">object: vector / function / tensor<tspan x="207" dy="22.95">metric: d(x, y)</tspan><tspan x="207" dy="22.95">meaning: what counts as close?</tspan></text><rect fill="#eef5f0" stroke="#2f3f46" stroke-width="2" x="502" y="116" width="275" height="152" rx="10" ry="10" /><text fill="#18282f" font-size="22" font-weight="700" font-family="Arial, sans-serif" x="640" y="158" text-anchor="middle" dominant-baseline="middle">Error Metric Choice</text><text fill="#273b34" font-size="17" font-family="Arial, sans-serif" x="640" y="211" text-anchor="middle" dominant-baseline="middle">L infinity: worst element<tspan x="640" dy="22.95">L2: overall energy</tspan><tspan x="640" dy="22.95">relative error: scale-aware</tspan></text><rect fill="#edf1f5" stroke="#2f3f46" stroke-width="2" x="934" y="116" width="275" height="152" rx="10" ry="10" /><text fill="#18282f" font-size="22" font-weight="700" font-family="Arial, sans-serif" x="1072" y="158" text-anchor="middle" dominant-baseline="middle">Kernel Practice</text><text fill="#263543" font-size="17" font-family="Arial, sans-serif" x="1072" y="211" text-anchor="middle" dominant-baseline="middle">reference vs CUDA output<tspan x="1072" dy="22.95">atol / rtol / max error</tspan><tspan x="1072" dy="22.95">PASS before benchmark</tspan></text><line stroke="#2f3f46" stroke-width="2.7" marker-end="url(#arrow)" x1="345" y1="192" x2="492" y2="192" /><line stroke="#2f3f46" stroke-width="2.7" marker-end="url(#arrow)" x1="777" y1="192" x2="924" y2="192" /><rect fill="#fff8e8" stroke="#b79d58" stroke-width="2" x="92" y="358" width="228" height="112" rx="9" ry="9" /><text fill="#4a3f26" font-size="17" font-family="Arial, sans-serif" x="206" y="414" text-anchor="middle" dominant-baseline="middle">Reduction<tspan x="206" dy="22.95">sum / max / RMSNorm</tspan><tspan x="206" dy="22.95">choose neutral value</tspan></text><rect fill="#f4fbf6" stroke="#7b9d8e" stroke-width="2" x="376" y="358" width="228" height="112" rx="9" ry="9" /><text fill="#273b34" font-size="17" font-family="Arial, sans-serif" x="490" y="414" text-anchor="middle" dominant-baseline="middle">Softmax<tspan x="490" dy="22.95">max-shift stability</tspan><tspan x="490" dy="22.95">control overflow</tspan></text><rect fill="#f7f4ea" stroke="#b79d58" stroke-width="2" x="660" y="358" width="228" height="112" rx="9" ry="9" /><text fill="#4a3f26" font-size="17" font-family="Arial, sans-serif" x="774" y="414" text-anchor="middle" dominant-baseline="middle">Quantization<tspan x="774" dy="22.95">approximation space</tspan><tspan x="774" dy="22.95">measure quality loss</tspan></text><rect fill="#f2f6fb" stroke="#8fa4bd" stroke-width="2" x="944" y="358" width="228" height="112" rx="9" ry="9" /><text fill="#263543" font-size="17" font-family="Arial, sans-serif" x="1058" y="414" text-anchor="middle" dominant-baseline="middle">Profiling<tspan x="1058" dy="22.95">speed with evidence</tspan><tspan x="1058" dy="22.95">not correctness proof</tspan></text><line stroke="#6e7564" stroke-width="2" marker-end="url(#softArrow)" x1="206" y1="280" x2="206" y2="348" /><line stroke="#6e7564" stroke-width="2" marker-end="url(#softArrow)" x1="600" y1="280" x2="490" y2="348" /><line stroke="#6e7564" stroke-width="2" marker-end="url(#softArrow)" x1="680" y1="280" x2="774" y2="348" /><line stroke="#6e7564" stroke-width="2" marker-end="url(#softArrow)" x1="1072" y1="280" x2="1058" y2="348" /><rect fill="#e9efe8" stroke="#2f3f46" stroke-width="2" x="260" y="560" width="760" height="62" rx="9" ry="9" /><text fill="#18282f" font-size="18" font-weight="700" font-family="Arial, sans-serif" x="640" y="591" text-anchor="middle" dominant-baseline="middle">A kernel is acceptable only when its metric says close enough and its profiler explains the speed.</text></svg>