<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180px" height="740px" viewBox="0 0 1180 740" version="1.1"><rect width="100%" height="100%" fill="rgb(245, 244, 237)" /><title>Softmax 与 RMSNorm 的数值稳定性</title><desc>展示数学等价变换与低精度累加如何影响 GPU kernel correctness。</desc><defs><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b00000" /></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b6b2b" /></marker><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3f627e" /></marker></defs><rect fill="rgb(245, 244, 237)" x="0" y="0" width="1180" height="740" /><text fill="#223142" font-size="28" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="590" y="44" text-anchor="middle" dominant-baseline="middle">代码中的数值稳定性：Softmax 与 RMSNorm</text><rect fill="#fff7f3" stroke="#b00000" stroke-width="2" x="60" y="92" width="500" height="270" rx="16" ry="16" /><text fill="#b00000" font-size="24" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="310" y="130" text-anchor="middle" dominant-baseline="middle">不稳定写法：naive softmax</text><text fill="#333333" font-size="20" font-weight="600" font-family="Menlo, Consolas, Microsoft YaHei, PingFang SC, monospace" x="92" y="180">exp(x_i) / sum(exp(x_j))<tspan x="92" dy="27" /><tspan x="92" dy="27">风险：</tspan><tspan x="92" dy="27">- x 很大时 exp(x) overflow</tspan><tspan x="92" dy="27">- FP16 / FP32 下都可能失控</tspan><tspan x="92" dy="27">- 结果可能出现 inf / nan</tspan></text><rect fill="#f3fbf4" stroke="#0b6b2b" stroke-width="2" x="620" y="92" width="500" height="270" rx="16" ry="16" /><text fill="#0b6b2b" font-size="24" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="870" y="130" text-anchor="middle" dominant-baseline="middle">稳定写法：max-shift softmax</text><text fill="#333333" font-size="20" font-weight="600" font-family="Menlo, Consolas, Microsoft YaHei, PingFang SC, monospace" x="652" y="180">m = max(x)<tspan x="652" dy="27">exp(x_i - m) / sum(exp(x_j - m))</tspan><tspan x="652" dy="27" /><tspan x="652" dy="27">收益：</tspan><tspan x="652" dy="27">- 最大指数项变成 exp(0)=1</tspan><tspan x="652" dy="27">- overflow 风险显著降低</tspan><tspan x="652" dy="27">- 数学等价，计算更稳定</tspan></text><line stroke="#3f627e" stroke-width="3" marker-end="url(#arrowBlue)" x1="560" y1="226" x2="610" y2="226" /><text fill="#3f627e" font-size="16" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="590" y="205" text-anchor="middle" dominant-baseline="middle">等价变换</text><rect fill="#fffdf8" stroke="#a74722" stroke-width="2" x="60" y="414" width="500" height="230" rx="16" ry="16" /><text fill="#a74722" font-size="23" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="310" y="452" text-anchor="middle" dominant-baseline="middle">RMSNorm：低精度输入，高精度累加</text><text fill="#333333" font-size="20" font-weight="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="92" y="502">输入：FP16 / BF16<tspan x="92" dy="27">sum(x^2)：FP32 accumulation</tspan><tspan x="92" dy="27">输出：FP16 / BF16</tspan><tspan x="92" dy="27" /><tspan x="92" dy="27">核心问题：舍入误差会在 reduction 中累积</tspan></text><rect fill="#f7f8ff" stroke="#4b2a8a" stroke-width="2" x="620" y="414" width="500" height="230" rx="16" ry="16" /><text fill="#4b2a8a" font-size="23" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="870" y="452" text-anchor="middle" dominant-baseline="middle">Correctness Gate</text><text fill="#333333" font-size="20" font-weight="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="652" y="502">1. PyTorch reference<tspan x="652" dy="27">2. 多 dtype / 多 shape</tspan><tspan x="652" dy="27">3. 极端输入：大值、小值、全 0</tspan><tspan x="652" dy="27">4. atol / rtol 说明</tspan><tspan x="652" dy="27">5. benchmark 不能替代 correctness</tspan></text><line stroke="#3f627e" stroke-width="3" marker-end="url(#arrowBlue)" x1="560" y1="530" x2="610" y2="530" /><text fill="#3f627e" font-size="16" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="590" y="509" text-anchor="middle" dominant-baseline="middle">验证</text><rect fill="#e9f1f7" stroke="#3f627e" stroke-width="1.6" x="170" y="674" width="840" height="42" rx="12" ry="12" /><text fill="#223142" font-size="19" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="590" y="696" text-anchor="middle" dominant-baseline="middle">面试表达：我不只跑通 kernel，还能解释它在低精度下为什么稳定，以及误差阈值为什么合理</text></svg>