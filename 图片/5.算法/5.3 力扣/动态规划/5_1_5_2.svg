<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000px" height="560px" viewBox="0 0 1000 560" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f4f5f"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #1f2933; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #1f2933; }
      .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; fill: #43505f; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1f2933; }
      .cell { font-family: Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1f2933; }
    </style>
  </defs>

  <text x="500" y="38" text-anchor="middle" dominant-baseline="middle" class="title">最长回文子串：动态规划填表</text>
  <text x="500" y="70" text-anchor="middle" dominant-baseline="middle" class="small">dp[i][j] 表示子串 s[i...j] 是否是回文串；按长度从短到长填表</text>

  <rect x="68" y="104" width="330" height="120" rx="16" ry="16" fill="#fbfaf5" stroke="#c5bda8" stroke-width="2"/>
  <text x="233" y="132" text-anchor="middle" dominant-baseline="middle" class="label">输入字符串</text>
  <g class="mono" text-anchor="middle" dominant-baseline="middle">
    <rect x="103" y="158" width="42" height="42" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/><text x="124" y="179">b</text>
    <rect x="145" y="158" width="42" height="42" fill="#eef8ef" stroke="#6f9678" stroke-width="2"/><text x="166" y="179">a</text>
    <rect x="187" y="158" width="42" height="42" fill="#fff1c7" stroke="#b7872f" stroke-width="2"/><text x="208" y="179">b</text>
    <rect x="229" y="158" width="42" height="42" fill="#eef8ef" stroke="#6f9678" stroke-width="2"/><text x="250" y="179">a</text>
    <rect x="271" y="158" width="42" height="42" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/><text x="292" y="179">d</text>
    <text x="124" y="214" class="small">0</text>
    <text x="166" y="214" class="small">1</text>
    <text x="208" y="214" class="small">2</text>
    <text x="250" y="214" class="small">3</text>
    <text x="292" y="214" class="small">4</text>
  </g>

  <rect x="70" y="270" width="330" height="190" rx="16" ry="16" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/>
  <text x="235" y="300" text-anchor="middle" dominant-baseline="middle" class="label" fill="#324a82">状态转移</text>
  <text x="98" y="334" class="mono">dp[i][j] = true</text>
  <text x="98" y="364" class="small">当且仅当：</text>
  <text x="118" y="394" class="mono">s[i] == s[j]</text>
  <text x="118" y="424" class="mono">且 (j - i &lt; 3 或 dp[i+1][j-1])</text>

  <rect x="466" y="104" width="468" height="356" rx="16" ry="16" fill="#fbfaf5" stroke="#c5bda8" stroke-width="2"/>
  <text x="700" y="132" text-anchor="middle" dominant-baseline="middle" class="label">DP 表：只填 i ≤ j 的上三角</text>

  <g class="cell" text-anchor="middle" dominant-baseline="middle">
    <text x="548" y="170">j=0</text><text x="608" y="170">j=1</text><text x="668" y="170">j=2</text><text x="728" y="170">j=3</text><text x="788" y="170">j=4</text>
    <text x="500" y="215">i=0</text><text x="500" y="275">i=1</text><text x="500" y="335">i=2</text><text x="500" y="395">i=3</text><text x="500" y="455">i=4</text>

    <rect x="528" y="190" width="40" height="40" fill="#d8f0df" stroke="#598765" stroke-width="2"/><text x="548" y="210">T</text>
    <rect x="588" y="190" width="40" height="40" fill="#f3f0e8" stroke="#c5bda8" stroke-width="1.5"/><text x="608" y="210">F</text>
    <rect x="648" y="190" width="40" height="40" fill="#d8f0df" stroke="#598765" stroke-width="3"/><text x="668" y="210">T</text>
    <rect x="708" y="190" width="40" height="40" fill="#f3f0e8" stroke="#c5bda8" stroke-width="1.5"/><text x="728" y="210">F</text>
    <rect x="768" y="190" width="40" height="40" fill="#f3f0e8" stroke="#c5bda8" stroke-width="1.5"/><text x="788" y="210">F</text>

    <rect x="588" y="250" width="40" height="40" fill="#d8f0df" stroke="#598765" stroke-width="2"/><text x="608" y="270">T</text>
    <rect x="648" y="250" width="40" height="40" fill="#f3f0e8" stroke="#c5bda8" stroke-width="1.5"/><text x="668" y="270">F</text>
    <rect x="708" y="250" width="40" height="40" fill="#d8f0df" stroke="#598765" stroke-width="2"/><text x="728" y="270">T</text>
    <rect x="768" y="250" width="40" height="40" fill="#f3f0e8" stroke="#c5bda8" stroke-width="1.5"/><text x="788" y="270">F</text>

    <rect x="648" y="310" width="40" height="40" fill="#d8f0df" stroke="#598765" stroke-width="2"/><text x="668" y="330">T</text>
    <rect x="708" y="310" width="40" height="40" fill="#f3f0e8" stroke="#c5bda8" stroke-width="1.5"/><text x="728" y="330">F</text>
    <rect x="768" y="310" width="40" height="40" fill="#f3f0e8" stroke="#c5bda8" stroke-width="1.5"/><text x="788" y="330">F</text>

    <rect x="708" y="370" width="40" height="40" fill="#d8f0df" stroke="#598765" stroke-width="2"/><text x="728" y="390">T</text>
    <rect x="768" y="370" width="40" height="40" fill="#f3f0e8" stroke="#c5bda8" stroke-width="1.5"/><text x="788" y="390">F</text>

    <rect x="768" y="430" width="40" height="40" fill="#d8f0df" stroke="#598765" stroke-width="2"/><text x="788" y="450">T</text>
  </g>

  <path d="M398 365 C430 342 440 300 466 282" fill="none" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="678" y="504" text-anchor="middle" dominant-baseline="middle" class="label" fill="#244c2e">最长回文：s[0...2] = "bab"</text>
  <text x="678" y="530" text-anchor="middle" dominant-baseline="middle" class="small">因为 s[0] == s[2] 且长度为 3，内部只有一个字符，必然回文</text>
</svg>
