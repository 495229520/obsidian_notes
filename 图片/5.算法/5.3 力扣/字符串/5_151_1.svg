<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <rect x="0" y="0" width="980" height="620" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 2 2 L 8 5 L 2 8" fill="none" stroke="#52616b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2933; }
      .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #243b53; }
      .body { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334e68; }
      .mono { font: 17px Consolas, "Microsoft YaHei", monospace; fill: #102a43; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #52616b; }
      .box { fill: #ffffff; stroke: #bcccdc; stroke-width: 1.5; rx: 8; }
      .word { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.4; rx: 6; }
      .space { fill: #fff7ed; stroke: #f97316; stroke-width: 1.2; rx: 6; }
      .step { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.4; rx: 8; }
      .arrow { stroke: #52616b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .hint { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">151. 反转字符串中的单词：整体反转 + 逐词反转</text>
  <text x="40" y="82" class="body">示例输入含有前导、尾随和连续空格：先压缩空格，再通过两次反转得到答案。</text>

  <rect x="40" y="108" width="900" height="78" class="box"/>
  <text x="62" y="136" class="label">1. 压缩空格 reduceEmpty</text>
  <rect x="62" y="150" width="44" height="26" class="space"/>
  <text x="72" y="169" class="mono">_</text>
  <rect x="114" y="150" width="60" height="26" class="space"/>
  <text x="124" y="169" class="mono">_ _</text>
  <rect x="184" y="150" width="92" height="26" class="word"/>
  <text x="204" y="169" class="mono">hello</text>
  <rect x="286" y="150" width="44" height="26" class="space"/>
  <text x="296" y="169" class="mono">_</text>
  <rect x="340" y="150" width="92" height="26" class="word"/>
  <text x="360" y="169" class="mono">world</text>
  <rect x="442" y="150" width="60" height="26" class="space"/>
  <text x="452" y="169" class="mono">_ _</text>
  <path d="M 530 163 L 600 163" class="arrow"/>
  <rect x="625" y="145" width="104" height="34" class="word"/>
  <text x="644" y="168" class="mono">hello</text>
  <rect x="738" y="145" width="32" height="34" class="space"/>
  <text x="748" y="168" class="mono">_</text>
  <rect x="780" y="145" width="104" height="34" class="word"/>
  <text x="799" y="168" class="mono">world</text>

  <rect x="40" y="218" width="900" height="98" class="box"/>
  <text x="62" y="246" class="label">2. 整体反转 reverse(res.begin(), res.end())</text>
  <rect x="62" y="264" width="104" height="34" class="word"/>
  <text x="81" y="287" class="mono">hello</text>
  <rect x="176" y="264" width="32" height="34" class="space"/>
  <text x="186" y="287" class="mono">_</text>
  <rect x="218" y="264" width="104" height="34" class="word"/>
  <text x="237" y="287" class="mono">world</text>
  <path d="M 350 281 C 410 230, 500 230, 560 281" class="arrow"/>
  <rect x="595" y="264" width="104" height="34" class="word"/>
  <text x="611" y="287" class="mono">dlrow</text>
  <rect x="710" y="264" width="32" height="34" class="space"/>
  <text x="720" y="287" class="mono">_</text>
  <rect x="752" y="264" width="104" height="34" class="word"/>
  <text x="771" y="287" class="mono">olleh</text>
  <text x="62" y="306" class="small">整体反转后，单词顺序已经反了，但每个单词内部字符也被反了。</text>

  <rect x="40" y="348" width="900" height="136" class="box"/>
  <text x="62" y="376" class="label">3. 遇到空格或末尾，就反转当前单词</text>
  <rect x="62" y="396" width="104" height="34" class="word"/>
  <text x="78" y="419" class="mono">dlrow</text>
  <text x="81" y="447" class="small">start = 0</text>
  <path d="M 178 413 L 246 413" class="arrow"/>
  <rect x="270" y="396" width="104" height="34" class="step"/>
  <text x="292" y="419" class="mono">world</text>
  <rect x="392" y="396" width="32" height="34" class="space"/>
  <text x="402" y="419" class="mono">_</text>
  <rect x="440" y="396" width="104" height="34" class="word"/>
  <text x="459" y="419" class="mono">olleh</text>
  <text x="62" y="474" class="small">第一段 [0, 5) 反转完成后，start 移动到空格后一位。</text>

  <path d="M 570 413 L 640 413" class="arrow"/>
  <rect x="665" y="396" width="104" height="34" class="step"/>
  <text x="684" y="419" class="mono">world</text>
  <rect x="779" y="396" width="32" height="34" class="space"/>
  <text x="789" y="419" class="mono">_</text>
  <rect x="821" y="396" width="104" height="34" class="step"/>
  <text x="840" y="419" class="mono">hello</text>
  <text x="665" y="474" class="small">第二段 [6, 11) 反转后得到最终结果。</text>

  <rect x="40" y="514" width="900" height="66" class="hint"/>
  <text x="62" y="542" class="label">关键不变量</text>
  <text x="198" y="542" class="body">空格压缩后，单词之间只有一个空格；整体反转负责改变单词顺序；逐词反转负责修复单词内部顺序。</text>
  <text x="198" y="566" class="body">最终结果：world hello</text>
</svg>
