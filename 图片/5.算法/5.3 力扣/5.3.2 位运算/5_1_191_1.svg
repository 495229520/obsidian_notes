<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760px" height="480px" viewBox="0 0 760 480" version="1.1"><rect x="0" y="0" width="760" height="480" fill="rgb(245, 244, 237)" /><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><text font-size="15" font-weight="500" fill="#444441" font-family="system-ui, sans-serif" x="380" y="28" text-anchor="middle" dominant-baseline="central">Brian Kernighan：n = 11 (1011) 的执行过程</text><rect fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" x="40" y="60" width="680" height="80" rx="8" /><text font-size="13" fill="#0C447C" font-family="monospace, system-ui, sans-serif" x="380" y="82" text-anchor="middle" dominant-baseline="central">第 1 轮：n = 1011，n-1 = 1010<tspan x="380" dy="18.2">n &amp; (n-1) = 1010　→　消去最低位的 1，sum = 1</tspan></text><path fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" d="M380 140 L380 160" /><rect fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" x="40" y="166" width="680" height="80" rx="8" /><text font-size="13" fill="#085041" font-family="monospace, system-ui, sans-serif" x="380" y="188" text-anchor="middle" dominant-baseline="central">第 2 轮：n = 1010，n-1 = 1001<tspan x="380" dy="18.2">n &amp; (n-1) = 1000　→　消去最低位的 1，sum = 2</tspan></text><path fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" d="M380 246 L380 266" /><rect fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" x="40" y="272" width="680" height="80" rx="8" /><text font-size="13" fill="#633806" font-family="monospace, system-ui, sans-serif" x="380" y="294" text-anchor="middle" dominant-baseline="central">第 3 轮：n = 1000，n-1 = 0111<tspan x="380" dy="18.2">n &amp; (n-1) = 0000　→　消去最低位的 1，sum = 3</tspan></text><path fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" d="M380 352 L380 372" /><rect fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" x="200" y="378" width="360" height="50" rx="8" /><text font-size="14" font-weight="500" fill="#3C3489" font-family="system-ui, sans-serif" x="380" y="403" text-anchor="middle" dominant-baseline="central">n == 0，退出循环，返回 sum = 3</text><text font-size="12" fill="#444441" font-family="system-ui, sans-serif" x="380" y="458" text-anchor="middle" dominant-baseline="central">循环次数 = 二进制中 1 的个数，而非总位数 → 时间 O(k)</text></svg>