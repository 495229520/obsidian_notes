<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 268：异或找丢失数字</title>
  <desc id="desc">展示把完整集合 0..n 与数组实际出现的值逐一异或配对，成对抵消后剩下的即为丢失数字。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4f5b66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#e08830" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #65717d; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; fill: #4d5965; }
      .val { font-size: 26px; font-weight: 700; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 14px; fill: #22313f; }
      .mono-sm { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; fill: #4d5965; }
      .box { fill: #fffaf0; stroke: #d2b46f; stroke-width: 1.6; }
      .dep { fill: #dcefe4; stroke: #4d9465; stroke-width: 1.8; }
      .cur { fill: #fff3e0; stroke: #e08830; stroke-width: 2; }
      .miss { fill: #faf0f0; stroke: #c98a8a; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .note { fill: #fffaf0; stroke: #d2b46f; stroke-width: 1.6; }
    </style>
  </defs>

  <!-- 标题 -->
  <text class="title" x="48" y="46">268. 丢失数字 — 异或配对抵消</text>
  <text class="subtitle" x="48" y="72">nums = [3, 0, 1]，n = 3，缺失的数字为 2</text>

  <!-- 说明 -->
  <rect class="note" x="48" y="92" width="864" height="74" rx="8"/>
  <text class="small" x="72" y="116">把「完整集合 0..n」和「数组实际出现的值」全部异或在一起。</text>
  <text class="small" x="72" y="138">完整集合来自：循环里 i 遍历 0..n-1，再补一个 nums.size() = n，恰好凑齐 0..n。</text>
  <text class="small" x="72" y="160">出现过的数字各贡献两次（一次来自集合、一次来自数组）→ 成对抵消；只有缺失的数字落单。</text>

  <!-- 上排：完整集合 0..n -->
  <text class="label" x="48" y="206">完整集合 0..n</text>
  <!-- 列中心：205, 365, 525, 685 -->
  <rect class="box" x="155" y="220" width="100" height="74" rx="8"/>
  <text class="val" x="205" y="265" text-anchor="middle">0</text>
  <rect class="box" x="315" y="220" width="100" height="74" rx="8"/>
  <text class="val" x="365" y="265" text-anchor="middle">1</text>
  <rect class="cur" x="475" y="220" width="100" height="74" rx="8"/>
  <text class="val" x="525" y="265" text-anchor="middle" fill="#e08830">2</text>
  <rect class="box" x="635" y="220" width="100" height="74" rx="8"/>
  <text class="val" x="685" y="265" text-anchor="middle">3</text>

  <!-- 连接线 + 抵消标记 -->
  <path d="M 205 294 L 205 340" fill="none" stroke="#4f5b66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="mono-sm" x="214" y="322">^ ⇒ 0</text>
  <path d="M 365 294 L 365 340" fill="none" stroke="#4f5b66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="mono-sm" x="374" y="322">^ ⇒ 0</text>
  <path d="M 685 294 L 685 340" fill="none" stroke="#4f5b66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="mono-sm" x="694" y="322">^ ⇒ 0</text>

  <!-- 2 落单：高亮箭头指向结果 -->
  <path d="M 525 294 L 525 470" fill="none" stroke="#e08830" stroke-width="2" marker-end="url(#arrowHi)"/>
  <text class="small" x="536" y="384" fill="#e08830">无配对，幸存</text>

  <!-- 下排：数组实际出现的值 -->
  <text class="label" x="48" y="350">数组出现的值</text>
  <rect class="dep" x="155" y="346" width="100" height="74" rx="8"/>
  <text class="val" x="205" y="391" text-anchor="middle">0</text>
  <rect class="dep" x="315" y="346" width="100" height="74" rx="8"/>
  <text class="val" x="365" y="391" text-anchor="middle">1</text>
  <rect class="miss" x="475" y="346" width="100" height="74" rx="8"/>
  <text class="val" x="525" y="388" text-anchor="middle" fill="#c98a8a">缺</text>
  <rect class="dep" x="635" y="346" width="100" height="74" rx="8"/>
  <text class="val" x="685" y="391" text-anchor="middle">3</text>

  <!-- 结果 -->
  <rect class="cur" x="425" y="476" width="200" height="56" rx="8"/>
  <text class="label" x="525" y="510" text-anchor="middle" fill="#e08830">答案 = 2</text>

  <text class="subtitle" x="48" y="566">时间 O(n)，空间 O(1)。整体异或顺序无关，等价于 (0^1^2^3) ^ (3^0^1) = 2。</text>
</svg>
