<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 260：异或分组找两个唯一数</title>
  <desc id="desc">展示对 nums = [1,2,1,3,2,5] 执行全部异或、取最低位1、分组异或的完整过程。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4f5b66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #65717d; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; fill: #4d5965; }
      .bit { font-size: 20px; font-weight: 700; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 14px; fill: #22313f; }
      .mono-sm { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; fill: #4d5965; }
      .box { fill: #fffaf0; stroke: #d2b46f; stroke-width: 1.6; rx: 8; }
      .step { fill: #f3fbf6; stroke: #69a87b; stroke-width: 1.5; rx: 8; }
      .grp-a { fill: #dcefe4; stroke: #4d9465; stroke-width: 1.8; rx: 8; }
      .grp-b { fill: #eef5fb; stroke: #7ba5c7; stroke-width: 1.8; rx: 8; }
      .result { fill: #fff3e0; stroke: #e08830; stroke-width: 1.8; rx: 8; }
    </style>
  </defs>

  <!-- 标题 -->
  <text class="title" x="48" y="46">260. 只出现一次的数字 III — 异或分组</text>
  <text class="subtitle" x="48" y="72">nums = [1, 2, 1, 3, 2, 5]，答案为 3 和 5</text>

  <!-- Step 1 -->
  <rect class="step" x="48" y="100" width="400" height="140"/>
  <text class="label" x="72" y="128">Step 1：全部异或 → x = a ^ b</text>
  <text class="mono" x="72" y="158">1 ^ 2 ^ 1 ^ 3 ^ 2 ^ 5</text>
  <text class="mono" x="72" y="182">= (1^1) ^ (2^2) ^ (3^5)</text>
  <text class="mono" x="72" y="206">= 0 ^ 0 ^ 6 = 6    (0b110)</text>
  <text class="small" x="72" y="230">x = 6，即 3 ^ 5 的异或值</text>

  <!-- Step 2 -->
  <rect class="step" x="500" y="100" width="420" height="140"/>
  <text class="label" x="524" y="128">Step 2：取最低位的 1</text>
  <text class="mono" x="524" y="158">x     = 6  = 0b 110</text>
  <text class="mono" x="524" y="182">-x    = -6 = 0b...010  (补码)</text>
  <text class="mono" x="524" y="206">bit = x &amp; -x = 0b 010 = 2</text>
  <text class="small" x="524" y="230">bit = 2，3 和 5 在第 1 位上不同</text>

  <path d="M 452 170 L 490 170" fill="none" stroke="#4f5b66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 关键洞察 -->
  <rect class="box" x="48" y="260" width="872" height="60"/>
  <text class="label" x="72" y="290">关键洞察</text>
  <text class="small" x="190" y="290">x 中为 1 的位，说明 a 和 b 在该位不同。用这一位分组：成对的数一定分到同一组，a 和 b 分到不同组。</text>

  <path d="M 480 324 L 480 352" fill="none" stroke="#4f5b66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 标题 -->
  <text class="label" x="48" y="378">Step 3：按 bit = 2（第 1 位）分组，各自异或</text>

  <!-- 数组元素：1(蓝) 2(绿) 1(蓝) 3(绿) 2(绿) 5(蓝) -->
  <!-- n&2: 1&2=0→蓝, 2&2=2→绿, 1&2=0→蓝, 3&2=2→绿, 2&2=2→绿, 5&2=0→蓝 -->
  <g transform="translate(48, 392)">
    <rect class="grp-b" x="0" y="0" width="64" height="50"/>
    <text class="bit" x="22" y="32">1</text>
    <text class="mono-sm" x="9" y="66">0b 0<tspan font-weight="700" fill="#c75050">0</tspan>1</text>

    <rect class="grp-a" x="80" y="0" width="64" height="50"/>
    <text class="bit" x="102" y="32">2</text>
    <text class="mono-sm" x="89" y="66">0b 0<tspan font-weight="700" fill="#c75050">1</tspan>0</text>

    <rect class="grp-b" x="160" y="0" width="64" height="50"/>
    <text class="bit" x="182" y="32">1</text>
    <text class="mono-sm" x="169" y="66">0b 0<tspan font-weight="700" fill="#c75050">0</tspan>1</text>

    <rect class="grp-a" x="240" y="0" width="64" height="50"/>
    <text class="bit" x="262" y="32">3</text>
    <text class="mono-sm" x="249" y="66">0b 0<tspan font-weight="700" fill="#c75050">1</tspan>1</text>

    <rect class="grp-a" x="320" y="0" width="64" height="50"/>
    <text class="bit" x="342" y="32">2</text>
    <text class="mono-sm" x="329" y="66">0b 0<tspan font-weight="700" fill="#c75050">1</tspan>0</text>

    <rect class="grp-b" x="400" y="0" width="64" height="50"/>
    <text class="bit" x="422" y="32">5</text>
    <text class="mono-sm" x="405" y="66">0b 1<tspan font-weight="700" fill="#c75050">0</tspan>1</text>

    <!-- 图例 -->
    <rect class="grp-a" x="520" y="2" width="16" height="16"/>
    <text class="small" x="544" y="15">第 1 位 = 1（绿组）</text>
    <rect class="grp-b" x="520" y="30" width="16" height="16"/>
    <text class="small" x="544" y="43">第 1 位 = 0（蓝组）</text>
  </g>

  <!-- 绿组 -->
  <rect class="grp-a" x="48" y="490" width="400" height="100"/>
  <text class="label" x="72" y="518">绿组（n &amp; bit ≠ 0）：2, 3, 2</text>
  <text class="mono" x="72" y="544">a ^= 2 ^ 3 ^ 2</text>
  <text class="mono" x="72" y="568">  = (2 ^ 2) ^ 3 = 3</text>

  <!-- 蓝组 -->
  <rect class="grp-b" x="500" y="490" width="420" height="100"/>
  <text class="label" x="524" y="518">蓝组（n &amp; bit = 0）：1, 1, 5</text>
  <text class="mono" x="524" y="544">b ^= 1 ^ 1 ^ 5</text>
  <text class="mono" x="524" y="568">  = (1 ^ 1) ^ 5 = 5</text>

  <!-- 箭头向下 -->
  <path d="M 248 594 L 248 630" fill="none" stroke="#4f5b66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 710 594 L 710 630" fill="none" stroke="#4f5b66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 结果 -->
  <rect class="result" x="148" y="638" width="200" height="50"/>
  <text class="label" x="248" y="668" text-anchor="middle">a = 3</text>

  <rect class="result" x="610" y="638" width="200" height="50"/>
  <text class="label" x="710" y="668" text-anchor="middle">b = 5</text>

  <text class="subtitle" x="48" y="714">时间 O(n)，空间 O(1)。两次遍历：第一次求 x = a^b，第二次按 lowbit 分组异或。</text>
</svg>