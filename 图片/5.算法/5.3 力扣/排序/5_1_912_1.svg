<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980px" height="560px" viewBox="0 0 980 560" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f4f5f"/>
    </marker>
  </defs>

  <text x="490" y="38" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="28" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">912. 排序数组：四种手写排序思路</text>

  <rect x="310" y="72" width="360" height="70" rx="14" ry="14" fill="#fbfaf5" stroke="#c5bda8" stroke-width="2"/>
  <text x="490" y="100" text-anchor="middle" dominant-baseline="middle" fill="#43505f" font-size="20" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">输入 nums</text>
  <text x="490" y="124" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="20" font-weight="700" font-family="Menlo, Consolas, monospace">[5, 1, 1, 2, 0, 0]</text>

  <line x1="490" y1="150" x2="490" y2="184" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="540" y="168" fill="#56677a" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">选择一种手写排序</text>

  <rect x="54" y="206" width="205" height="190" rx="14" ry="14" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/>
  <text x="156" y="238" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="21" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">快速排序</text>
  <text x="156" y="272" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">围绕 pivot 分区</text>
  <text x="156" y="302" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">左边 ≤ pivot</text>
  <text x="156" y="330" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">右边 ≥ pivot</text>
  <text x="156" y="366" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="17" font-weight="700" font-family="Menlo, Consolas, monospace">平均 O(nlogn)</text>

  <rect x="281" y="206" width="205" height="190" rx="14" ry="14" fill="#eef8ef" stroke="#6f9678" stroke-width="2"/>
  <text x="383" y="238" text-anchor="middle" dominant-baseline="middle" fill="#244c2e" font-size="21" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">归并排序</text>
  <text x="383" y="272" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">先递归拆分</text>
  <text x="383" y="302" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">再合并有序区间</text>
  <text x="383" y="330" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">复杂度稳定</text>
  <text x="383" y="366" text-anchor="middle" dominant-baseline="middle" fill="#244c2e" font-size="17" font-weight="700" font-family="Menlo, Consolas, monospace">O(nlogn), O(n)</text>

  <rect x="508" y="206" width="205" height="190" rx="14" ry="14" fill="#fff1c7" stroke="#b7872f" stroke-width="2"/>
  <text x="610" y="238" text-anchor="middle" dominant-baseline="middle" fill="#6a4817" font-size="21" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">计数排序</text>
  <text x="610" y="272" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">利用固定值域</text>
  <text x="610" y="302" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="Menlo, Consolas, monospace">[-50000, 50000]</text>
  <text x="610" y="330" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">统计次数后回填</text>
  <text x="610" y="366" text-anchor="middle" dominant-baseline="middle" fill="#6a4817" font-size="17" font-weight="700" font-family="Menlo, Consolas, monospace">O(n + k)</text>

  <rect x="735" y="206" width="205" height="190" rx="14" ry="14" fill="#f2e8ff" stroke="#8a6bb8" stroke-width="2"/>
  <text x="837" y="238" text-anchor="middle" dominant-baseline="middle" fill="#563a7c" font-size="21" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">堆排序</text>
  <text x="837" y="272" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">建立大根堆</text>
  <text x="837" y="302" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">最大值放到末尾</text>
  <text x="837" y="330" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">原地排序</text>
  <text x="837" y="366" text-anchor="middle" dominant-baseline="middle" fill="#563a7c" font-size="17" font-weight="700" font-family="Menlo, Consolas, monospace">O(nlogn)</text>

  <path d="M490 184 C410 188 250 188 156 206" fill="none" stroke="#3f4f5f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M490 184 C440 190 400 194 383 206" fill="none" stroke="#3f4f5f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M490 184 C540 190 590 194 610 206" fill="none" stroke="#3f4f5f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M490 184 C620 188 770 188 837 206" fill="none" stroke="#3f4f5f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M156 404 C250 460 730 460 837 404" fill="none" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M383 404 C430 438 550 438 610 404" fill="none" stroke="#3f4f5f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="300" y="462" width="380" height="64" rx="14" ry="14" fill="#d8f0df" stroke="#598765" stroke-width="2"/>
  <text x="490" y="488" text-anchor="middle" dominant-baseline="middle" fill="#244c2e" font-size="20" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">输出升序数组</text>
  <text x="490" y="512" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="20" font-weight="700" font-family="Menlo, Consolas, monospace">[0, 0, 1, 1, 2, 5]</text>
</svg>
