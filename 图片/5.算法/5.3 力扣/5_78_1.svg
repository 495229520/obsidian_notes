<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect x="0" y="0" width="1080" height="720" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 2 2 L 8 5 L 2 8" fill="none" stroke="#52616b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2933; }
      .subtitle { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #52616b; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #243b53; }
      .body { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334e68; }
      .mono { font: 16px Consolas, "Microsoft YaHei", monospace; fill: #102a43; }
      .small { font: 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #52616b; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; rx: 8; }
      .root { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; rx: 8; }
      .leaf { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.6; rx: 8; }
      .choose { fill: #fff7ed; stroke: #f97316; stroke-width: 1.3; rx: 6; }
      .back { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 8; }
      .line { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <text x="40" y="48" class="title">78. 子集：回溯树与 path 变化</text>
  <text x="40" y="78" class="subtitle">示例 nums = [1, 2, 3]。每个节点都会先记录当前 path，然后继续向后选择元素。</text>

  <rect x="440" y="110" width="200" height="56" class="root"/>
  <text x="500" y="134" class="label">start = 0</text>
  <text x="508" y="156" class="mono">path = []</text>

  <rect x="130" y="230" width="180" height="56" class="node"/>
  <text x="175" y="254" class="label">选 nums[0]</text>
  <text x="174" y="276" class="mono">path = [1]</text>

  <rect x="450" y="230" width="180" height="56" class="node"/>
  <text x="495" y="254" class="label">选 nums[1]</text>
  <text x="494" y="276" class="mono">path = [2]</text>

  <rect x="770" y="230" width="180" height="56" class="leaf"/>
  <text x="815" y="254" class="label">选 nums[2]</text>
  <text x="814" y="276" class="mono">path = [3]</text>

  <path d="M 477 166 L 285 230" class="line"/>
  <path d="M 540 166 L 540 230" class="line"/>
  <path d="M 603 166 L 795 230" class="line"/>

  <rect x="50" y="360" width="180" height="56" class="node"/>
  <text x="95" y="384" class="label">选 nums[1]</text>
  <text x="88" y="406" class="mono">path = [1,2]</text>

  <rect x="290" y="360" width="180" height="56" class="leaf"/>
  <text x="335" y="384" class="label">选 nums[2]</text>
  <text x="328" y="406" class="mono">path = [1,3]</text>

  <rect x="530" y="360" width="180" height="56" class="leaf"/>
  <text x="575" y="384" class="label">选 nums[2]</text>
  <text x="568" y="406" class="mono">path = [2,3]</text>

  <path d="M 185 286 L 122 360" class="line"/>
  <path d="M 255 286 L 335 360" class="line"/>
  <path d="M 575 286 L 608 360" class="line"/>

  <rect x="82" y="490" width="180" height="56" class="leaf"/>
  <text x="127" y="514" class="label">选 nums[2]</text>
  <text x="114" y="536" class="mono">path = [1,2,3]</text>

  <path d="M 150 416 L 164 490" class="line"/>

  <rect x="755" y="360" width="260" height="176" class="back"/>
  <text x="782" y="388" class="label">回溯动作</text>
  <text x="782" y="418" class="body">1. push：把当前选择加入 path</text>
  <text x="782" y="446" class="body">2. dfs：进入下一层继续选择</text>
  <text x="782" y="474" class="body">3. pop：撤销选择，回到上一步</text>
  <text x="782" y="506" class="body">撤销后，才能尝试同层的下一个元素。</text>

  <rect x="40" y="600" width="1000" height="78" class="back"/>
  <text x="66" y="628" class="label">记录答案的时机</text>
  <text x="210" y="628" class="body">进入每个 dfs 节点时都执行 res.push_back(path)，因此空集、单元素集合、多元素集合都会被记录。</text>
  <text x="210" y="654" class="body">本图得到的子集顺序：[]、[1]、[1,2]、[1,2,3]、[1,3]、[2]、[2,3]、[3]。</text>

  <path d="M 230 418 C 310 470, 375 470, 470 418" class="dash"/>
  <text x="295" y="462" class="small">pop 后回到 [1]，再选 3</text>
</svg>
