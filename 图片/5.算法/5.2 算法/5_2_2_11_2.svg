<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">优先队列常见算法场景</title>
  <desc id="desc">展示优先队列在 Top K、合并 K 个有序链表、数据流中位数、Dijkstra 中的典型用法。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#33495c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .small { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4b5b6b; }
      .tiny { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5b6976; }
      .center { fill: #f8e7ae; stroke: #c28a1d; stroke-width: 1.9; rx: 8; }
      .blue { fill: #e6f0f7; stroke: #4d7fa3; stroke-width: 1.7; rx: 8; }
      .green { fill: #d8ead8; stroke: #4f9a68; stroke-width: 1.7; rx: 8; }
      .red { fill: #f4d6cf; stroke: #c65d52; stroke-width: 1.7; rx: 8; }
      .card { fill: #fbfaf4; stroke: #d8cfbf; stroke-width: 1.4; rx: 8; }
      .line { stroke: #33495c; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="470" y="44" text-anchor="middle" class="title">优先队列：动态候选集合里的最优元素</text>
  <text x="470" y="72" text-anchor="middle" class="small">只关心当前最大或最小，不要求整个集合完全有序</text>

  <g transform="translate(350 104)">
    <rect x="0" y="0" width="240" height="78" class="center"/>
    <text x="120" y="29" text-anchor="middle" class="label">priority_queue</text>
    <text x="120" y="54" text-anchor="middle" class="small">push / pop / top</text>
  </g>

  <g transform="translate(54 226)">
    <rect x="0" y="0" width="236" height="104" class="blue"/>
    <text x="118" y="26" text-anchor="middle" class="label">Top K</text>
    <text x="118" y="50" text-anchor="middle" class="small">小根堆保留最大 k 个</text>
    <text x="118" y="72" text-anchor="middle" class="tiny">超过 k 就弹出堆顶</text>
    <text x="118" y="92" text-anchor="middle" class="tiny">复杂度 O(nlogk)</text>
  </g>

  <g transform="translate(352 226)">
    <rect x="0" y="0" width="236" height="104" class="green"/>
    <text x="118" y="26" text-anchor="middle" class="label">合并 K 个链表</text>
    <text x="118" y="50" text-anchor="middle" class="small">小根堆保存当前头节点</text>
    <text x="118" y="72" text-anchor="middle" class="tiny">弹一个，推进一个</text>
    <text x="118" y="92" text-anchor="middle" class="tiny">复杂度 O(NlogK)</text>
  </g>

  <g transform="translate(650 226)">
    <rect x="0" y="0" width="236" height="104" class="red"/>
    <text x="118" y="26" text-anchor="middle" class="label">数据流中位数</text>
    <text x="118" y="50" text-anchor="middle" class="small">大根堆 + 小根堆</text>
    <text x="118" y="72" text-anchor="middle" class="tiny">左半区不大于右半区</text>
    <text x="118" y="92" text-anchor="middle" class="tiny">保持堆大小平衡</text>
  </g>

  <g transform="translate(204 386)">
    <rect x="0" y="0" width="236" height="76" class="card"/>
    <text x="118" y="27" text-anchor="middle" class="label">Dijkstra</text>
    <text x="118" y="52" text-anchor="middle" class="small">小根堆取当前最短距离</text>
  </g>

  <g transform="translate(502 386)">
    <rect x="0" y="0" width="236" height="76" class="card"/>
    <text x="118" y="27" text-anchor="middle" class="label">自定义比较器</text>
    <text x="118" y="52" text-anchor="middle" class="small">决定谁成为 top()</text>
  </g>

  <path d="M 420 184 C 330 198, 230 208, 174 222" class="line"/>
  <path d="M 470 184 C 470 202, 470 212, 470 222" class="line"/>
  <path d="M 520 184 C 610 198, 710 208, 766 222" class="line"/>
  <path d="M 410 332 C 360 350, 330 364, 322 382" class="line"/>
  <path d="M 530 332 C 580 350, 610 364, 620 382" class="line"/>
</svg>
