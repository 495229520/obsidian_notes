<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">二分答案流程</title>
  <desc id="desc">展示二分答案从答案范围开始，通过 check 函数判断候选答案是否可行，并根据最小化最大值或最大化最小值收缩区间。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#33495c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .small { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4a5968; }
      .tiny { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5b6976; }
      .card { fill: #fbfaf4; stroke: #d9cfbd; stroke-width: 1.4; rx: 8; }
      .answer { fill: #e6f0f7; stroke: #4d7fa3; stroke-width: 1.7; rx: 8; }
      .check { fill: #f8e7ae; stroke: #c28a1d; stroke-width: 1.9; rx: 8; }
      .ok { fill: #d8ead8; stroke: #4f9a68; stroke-width: 1.7; rx: 8; }
      .bad { fill: #f4d6cf; stroke: #c65d52; stroke-width: 1.7; rx: 8; }
      .line { stroke: #33495c; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .plain { stroke: #33495c; stroke-width: 1.6; fill: none; }
      .rangeLine { stroke: #4d7fa3; stroke-width: 8; stroke-linecap: round; }
      .tick { stroke: #33495c; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="460" y="46" text-anchor="middle" class="title">二分答案：不是找元素，而是找最优可行值</text>
  <text x="460" y="75" text-anchor="middle" class="small">先猜一个答案 mid，再用 check(mid) 判断这个答案是否可行</text>

  <g transform="translate(76 112)">
    <rect x="0" y="0" width="768" height="112" class="card"/>
    <text x="384" y="28" text-anchor="middle" class="label">答案空间</text>
    <line x1="74" y1="68" x2="690" y2="68" class="rangeLine"/>
    <line x1="74" y1="52" x2="74" y2="84" class="tick"/>
    <line x1="382" y1="48" x2="382" y2="92" class="tick"/>
    <line x1="690" y1="52" x2="690" y2="84" class="tick"/>
    <circle cx="382" cy="68" r="12" fill="#f8e7ae" stroke="#c28a1d" stroke-width="2"/>
    <text x="74" y="104" text-anchor="middle" class="tiny">left</text>
    <text x="382" y="104" text-anchor="middle" class="tiny">mid 候选答案</text>
    <text x="690" y="104" text-anchor="middle" class="tiny">right</text>
  </g>

  <path d="M 460 230 C 460 250, 460 264, 460 282" class="line"/>

  <g transform="translate(330 286)">
    <rect x="0" y="0" width="260" height="68" class="check"/>
    <text x="130" y="27" text-anchor="middle" class="label">check(mid)</text>
    <text x="130" y="50" text-anchor="middle" class="small">mid 能不能满足题目约束？</text>
  </g>

  <path d="M 380 356 C 344 370, 302 376, 252 376" class="line"/>
  <path d="M 540 356 C 576 370, 618 376, 668 376" class="line"/>

  <g transform="translate(44 300)">
    <rect x="0" y="0" width="364" height="86" class="ok"/>
    <text x="182" y="26" text-anchor="middle" class="label">最小化最大值：找第一个可行值</text>
    <text x="182" y="51" text-anchor="middle" class="small">check(mid) 为 true：r = mid</text>
    <text x="182" y="72" text-anchor="middle" class="small">check(mid) 为 false：l = mid + 1</text>
  </g>

  <g transform="translate(512 300)">
    <rect x="0" y="0" width="364" height="86" class="answer"/>
    <text x="182" y="26" text-anchor="middle" class="label">最大化最小值：找最后一个可行值</text>
    <text x="182" y="51" text-anchor="middle" class="small">check(mid) 为 true：l = mid</text>
    <text x="182" y="72" text-anchor="middle" class="small">check(mid) 为 false：r = mid - 1</text>
  </g>

  <g transform="translate(76 414)">
    <text x="0" y="0" class="small">关键：先证明可行性关于 mid 单调，再选择对应的收缩模板。</text>
  </g>
</svg>
