<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect width="980" height="520" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 700 17px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .node { fill: #eef6fb; stroke: #6f94b3; stroke-width: 2; }
      .root { fill: #dff0ea; stroke: #45907a; stroke-width: 2.2; }
      .query { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2.2; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #9aa9b5; stroke-width: 1.7; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .note { fill: #edf4f1; stroke: #9db7aa; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">路径压缩：一次 find 后，把沿途节点直接挂到根节点</text>
  <text x="40" y="76" class="subtitle">集合没有改变，只是树变矮；后续查询同一集合中的节点会更快。</text>

  <rect x="48" y="110" width="400" height="300" class="panel"/>
  <text x="78" y="146" class="label">压缩前：find(5)</text>
  <text x="78" y="172" class="small">需要沿父指针一路向上找到根 0</text>

  <circle cx="248" cy="210" r="26" class="root"/>
  <text x="248" y="216" text-anchor="middle" class="mono">0</text>
  <circle cx="248" cy="274" r="26" class="node"/>
  <text x="248" y="280" text-anchor="middle" class="mono">1</text>
  <circle cx="248" cy="338" r="26" class="node"/>
  <text x="248" y="344" text-anchor="middle" class="mono">3</text>
  <circle cx="248" cy="402" r="26" class="query"/>
  <text x="248" y="408" text-anchor="middle" class="mono">5</text>

  <path d="M 248 248 L 248 236" class="arrow"/>
  <path d="M 248 312 L 248 300" class="arrow"/>
  <path d="M 248 376 L 248 364" class="arrow"/>
  <text x="302" y="306" class="small">5 -> 3 -> 1 -> 0</text>

  <rect x="532" y="110" width="400" height="300" class="panel"/>
  <text x="562" y="146" class="label">压缩后：parent[5] = 0</text>
  <text x="562" y="172" class="small">沿途节点 1、3、5 都直接指向根节点</text>

  <circle cx="732" cy="210" r="26" class="root"/>
  <text x="732" y="216" text-anchor="middle" class="mono">0</text>
  <circle cx="650" cy="320" r="26" class="node"/>
  <text x="650" y="326" text-anchor="middle" class="mono">1</text>
  <circle cx="732" cy="320" r="26" class="node"/>
  <text x="732" y="326" text-anchor="middle" class="mono">3</text>
  <circle cx="814" cy="320" r="26" class="query"/>
  <text x="814" y="326" text-anchor="middle" class="mono">5</text>

  <path d="M 664 299 C 682 270 704 246 721 232" class="arrow"/>
  <path d="M 732 294 L 732 238" class="arrow"/>
  <path d="M 800 299 C 782 270 760 246 743 232" class="arrow"/>
  <text x="654" y="372" class="small">再查 5 时，一步就到根 0</text>

  <path d="M 456 258 C 484 258 500 258 524 258" class="soft"/>
  <text x="490" y="238" text-anchor="middle" class="small">递归回溯时改父节点</text>

  <rect x="116" y="442" width="748" height="38" class="note"/>
  <text x="490" y="466" text-anchor="middle" class="small">不变量：根节点代表集合；路径压缩只优化树形，不改变元素之间的连通关系。</text>
</svg>
