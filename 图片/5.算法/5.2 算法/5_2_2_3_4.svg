<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">高精度除法：从高位开始与余数滚动</title>
  <desc id="desc">以 1234 ÷ 7 = 176 余 2 为例，从最高位开始，每步用上一余数 r 组成 r×10+当前位，再取商与新余数。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2c8c6f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .sub   { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .hdr   { font: 600 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .ln    { font: 15px "Consolas", "Microsoft YaHei", monospace; fill: #23313f; }
      .q     { font: 600 15px "Consolas", "Microsoft YaHei", monospace; fill: #2f7a44; }
      .rem   { fill: #1d6b53; }
      .res   { font: 600 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .note  { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .step  { fill: #eef5f1; stroke: #2c8c6f; stroke-width: 1.4; }
      .rflow { stroke: #2c8c6f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .resbox{ fill: #fbfaf4; stroke: #d9cfbd; stroke-width: 1.4; }
    </style>
  </defs>

  <text x="450" y="40" text-anchor="middle" class="title">高精度除法：1234 ÷ 7 = 176 … 余 2</text>
  <text x="450" y="66" text-anchor="middle" class="sub">唯一从最高位开始；余数 r 在各位之间滚动：r×10 + 当前位</text>

  <!-- 进入 r=0 -->
  <text x="22" y="186" text-anchor="start" class="ln rem">r=0</text>
  <path d="M 22 196 L 30 196" class="rflow"/>

  <!-- step 1 -->
  <rect x="34" y="100" width="190" height="160" rx="8" class="step"/>
  <text x="129" y="128" text-anchor="middle" class="hdr">取最高位 1</text>
  <text x="129" y="164" text-anchor="middle" class="ln"><tspan class="rem">0</tspan>×10 + 1 = 1</text>
  <text x="129" y="196" text-anchor="middle" class="q">商 1 ÷ 7 = 0</text>
  <text x="129" y="228" text-anchor="middle" class="ln">余 = <tspan class="rem">1</tspan></text>

  <path d="M 224 196 L 244 196" class="rflow"/>

  <!-- step 2 -->
  <rect x="244" y="100" width="190" height="160" rx="8" class="step"/>
  <text x="339" y="128" text-anchor="middle" class="hdr">取下一位 2</text>
  <text x="339" y="164" text-anchor="middle" class="ln"><tspan class="rem">1</tspan>×10 + 2 = 12</text>
  <text x="339" y="196" text-anchor="middle" class="q">商 12 ÷ 7 = 1</text>
  <text x="339" y="228" text-anchor="middle" class="ln">余 = <tspan class="rem">5</tspan></text>

  <path d="M 434 196 L 454 196" class="rflow"/>

  <!-- step 3 -->
  <rect x="454" y="100" width="190" height="160" rx="8" class="step"/>
  <text x="549" y="128" text-anchor="middle" class="hdr">取下一位 3</text>
  <text x="549" y="164" text-anchor="middle" class="ln"><tspan class="rem">5</tspan>×10 + 3 = 53</text>
  <text x="549" y="196" text-anchor="middle" class="q">商 53 ÷ 7 = 7</text>
  <text x="549" y="228" text-anchor="middle" class="ln">余 = <tspan class="rem">4</tspan></text>

  <path d="M 644 196 L 664 196" class="rflow"/>

  <!-- step 4 -->
  <rect x="664" y="100" width="190" height="160" rx="8" class="step"/>
  <text x="759" y="128" text-anchor="middle" class="hdr">取下一位 4</text>
  <text x="759" y="164" text-anchor="middle" class="ln"><tspan class="rem">4</tspan>×10 + 4 = 44</text>
  <text x="759" y="196" text-anchor="middle" class="q">商 44 ÷ 7 = 6</text>
  <text x="759" y="228" text-anchor="middle" class="ln">余 = <tspan class="rem">2</tspan></text>

  <path d="M 854 196 L 876 196" class="rflow"/>
  <text x="878" y="186" text-anchor="end" class="ln rem"> </text>

  <!-- 结果 -->
  <rect x="34" y="288" width="820" height="92" rx="8" class="resbox"/>
  <text x="444" y="318" text-anchor="middle" class="res">商位（高→低）= 0 · 1 · 7 · 6　→　去前导零　→　176，余数 = 2</text>
  <text x="444" y="352" text-anchor="middle" class="note">商按高位→低位生成，与逆序存储相反，故代码里先 reverse 再去前导零对齐其他运算</text>
</svg>
