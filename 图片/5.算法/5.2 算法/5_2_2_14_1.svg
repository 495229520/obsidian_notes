<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <title id="title">Trie 字典树结构总览</title>
  <desc id="desc">展示 cat、car、dog 三个单词在 Trie 中如何共享前缀，以及 Trie 的常见操作和应用题型。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .node { fill: #f8fafc; stroke: #2563eb; stroke-width: 2; }
      .end { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .root { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-label { font-size: 18px; font-weight: 700; fill: #334155; }
      .node-label { font-size: 17px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .panel-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .panel-body { font-size: 13px; fill: #475569; }
    </style>
  </defs>

  <text x="560" y="52" text-anchor="middle" class="title">Trie 字典树：用路径表示字符串</text>
  <text x="560" y="80" text-anchor="middle" class="subtitle">节点保存子节点和 isEnd；边上的字符连起来就是一个前缀或单词</text>

  <rect x="60" y="112" width="650" height="540" rx="14" fill="#fffdf7" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="90" y="146" class="panel-title">示例单词：cat、car、dog</text>
  <text x="90" y="170" class="small">绿色节点表示 isEnd = true，也就是完整单词在这里结束</text>

  <circle cx="385" cy="230" r="32" class="root"/>
  <text x="385" y="236" text-anchor="middle" class="node-label">root</text>

  <path d="M 365 257 C 315 300, 270 326, 230 358" class="edge"/>
  <text x="292" y="306" class="edge-label">c</text>
  <circle cx="225" cy="380" r="30" class="node"/>
  <text x="225" y="386" text-anchor="middle" class="node-label">c</text>

  <path d="M 405 257 C 455 300, 500 326, 540 358" class="edge"/>
  <text x="478" y="306" class="edge-label">d</text>
  <circle cx="545" cy="380" r="30" class="node"/>
  <text x="545" y="386" text-anchor="middle" class="node-label">d</text>

  <path d="M 225 410 C 225 442, 225 462, 225 492" class="edge"/>
  <text x="236" y="455" class="edge-label">a</text>
  <circle cx="225" cy="520" r="30" class="node"/>
  <text x="225" y="526" text-anchor="middle" class="node-label">a</text>

  <path d="M 205 544 C 170 578, 145 596, 112 624" class="edge"/>
  <text x="161" y="582" class="edge-label">t</text>
  <circle cx="96" cy="636" r="30" class="end"/>
  <text x="96" y="642" text-anchor="middle" class="node-label">t</text>
  <text x="96" y="682" text-anchor="middle" class="small">cat</text>

  <path d="M 245 544 C 285 578, 315 596, 350 624" class="edge"/>
  <text x="294" y="582" class="edge-label">r</text>
  <circle cx="366" cy="636" r="30" class="end"/>
  <text x="366" y="642" text-anchor="middle" class="node-label">r</text>
  <text x="366" y="682" text-anchor="middle" class="small">car</text>

  <path d="M 545 410 C 545 442, 545 462, 545 492" class="edge"/>
  <text x="556" y="455" class="edge-label">o</text>
  <circle cx="545" cy="520" r="30" class="node"/>
  <text x="545" y="526" text-anchor="middle" class="node-label">o</text>

  <path d="M 545 550 C 545 582, 545 600, 545 622" class="edge"/>
  <text x="556" y="588" class="edge-label">g</text>
  <circle cx="545" cy="636" r="30" class="end"/>
  <text x="545" y="642" text-anchor="middle" class="node-label">g</text>
  <text x="545" y="682" text-anchor="middle" class="small">dog</text>

  <rect x="755" y="112" width="305" height="540" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="785" y="150" class="panel-title">节点里存什么</text>
  <rect x="785" y="172" width="245" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="805" y="202" class="panel-body">child[26]：指向下一层字符</text>
  <text x="805" y="228" class="panel-body">isEnd：是否是完整单词结尾</text>

  <text x="785" y="298" class="panel-title">基础操作</text>
  <rect x="785" y="320" width="245" height="112" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="805" y="350" class="panel-body">insert：没有节点就创建</text>
  <text x="805" y="376" class="panel-body">search：走完后还要看 isEnd</text>
  <text x="805" y="402" class="panel-body">startsWith：只要求路径存在</text>

  <text x="785" y="476" class="panel-title">常见题型</text>
  <rect x="785" y="498" width="245" height="112" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="805" y="528" class="panel-body">前缀匹配：快速判断前缀</text>
  <text x="805" y="554" class="panel-body">替换单词：找最短词根</text>
  <text x="805" y="580" class="panel-body">搜索建议：收集前 3 个候选</text>
</svg>
