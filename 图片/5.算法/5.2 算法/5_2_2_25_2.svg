<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <rect width="980" height="560" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .cityA { fill: #dff0ea; stroke: #45907a; stroke-width: 2; }
      .cityB { fill: #eef6fb; stroke: #6f94b3; stroke-width: 2; }
      .cityC { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2; }
      .edge { fill: none; stroke: #53616f; stroke-width: 2; }
      .bad { fill: none; stroke: #d36b5f; stroke-width: 3; stroke-dasharray: 7 5; }
      .land { fill: #dff0ea; stroke: #45907a; stroke-width: 1.5; rx: 5; }
      .water { fill: #e8eef3; stroke: #aebcc8; stroke-width: 1.2; rx: 5; }
      .note { fill: #edf4f1; stroke: #9db7aa; stroke-width: 1.2; rx: 8; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="40" y="48" class="title">并查集应用：连通分量、加边判环、网格映射</text>
  <text x="40" y="76" class="subtitle">同一个模板可以服务三类常考模型：数有几组、判断新边是否冗余、把二维相邻格合并成岛。</text>

  <rect x="46" y="116" width="276" height="344" class="panel"/>
  <text x="72" y="150" class="label">连通分量：省份数量</text>
  <text x="72" y="176" class="small">成功合并一次，分量数减一</text>

  <circle cx="116" cy="238" r="25" class="cityA"/>
  <text x="116" y="244" text-anchor="middle" class="mono">0</text>
  <circle cx="206" cy="238" r="25" class="cityA"/>
  <text x="206" y="244" text-anchor="middle" class="mono">1</text>
  <circle cx="162" cy="318" r="25" class="cityA"/>
  <text x="162" y="324" text-anchor="middle" class="mono">2</text>
  <path d="M 141 238 L 181 238" class="edge"/>
  <path d="M 129 260 L 150 296" class="edge"/>
  <path d="M 194 260 L 174 296" class="edge"/>

  <circle cx="254" cy="318" r="25" class="cityB"/>
  <text x="254" y="324" text-anchor="middle" class="mono">3</text>
  <text x="92" y="392" class="small">根相同：0、1、2 是一组</text>
  <text x="92" y="418" class="small">根不同：3 自成一组</text>

  <rect x="352" y="116" width="276" height="344" class="panel"/>
  <text x="378" y="150" class="label">冗余连接：加边判环</text>
  <text x="378" y="176" class="small">两端点已连通，再加边会形成环</text>

  <circle cx="442" cy="248" r="25" class="cityC"/>
  <text x="442" y="254" text-anchor="middle" class="mono">1</text>
  <circle cx="536" cy="248" r="25" class="cityC"/>
  <text x="536" y="254" text-anchor="middle" class="mono">2</text>
  <circle cx="489" cy="330" r="25" class="cityC"/>
  <text x="489" y="336" text-anchor="middle" class="mono">3</text>
  <path d="M 467 248 L 511 248" class="edge"/>
  <path d="M 455 270 L 477 308" class="edge"/>
  <path d="M 523 270 L 501 308" class="bad"/>
  <text x="398" y="392" class="mono">unite(2, 3) == false</text>
  <text x="398" y="418" class="small">说明 2 和 3 原本就在同一集合</text>

  <rect x="658" y="116" width="276" height="344" class="panel"/>
  <text x="684" y="150" class="label">岛屿变体：二维映射</text>
  <text x="684" y="176" class="small">相邻陆地合并为同一集合</text>

  <g transform="translate(704,206)">
    <rect x="0" y="0" width="48" height="48" class="land"/>
    <text x="24" y="29" text-anchor="middle" class="mono">0</text>
    <rect x="56" y="0" width="48" height="48" class="land"/>
    <text x="80" y="29" text-anchor="middle" class="mono">1</text>
    <rect x="112" y="0" width="48" height="48" class="water"/>
    <text x="136" y="29" text-anchor="middle" class="mono">2</text>
    <rect x="0" y="56" width="48" height="48" class="land"/>
    <text x="24" y="85" text-anchor="middle" class="mono">3</text>
    <rect x="56" y="56" width="48" height="48" class="water"/>
    <text x="80" y="85" text-anchor="middle" class="mono">4</text>
    <rect x="112" y="56" width="48" height="48" class="land"/>
    <text x="136" y="85" text-anchor="middle" class="mono">5</text>
    <rect x="0" y="112" width="48" height="48" class="water"/>
    <text x="24" y="141" text-anchor="middle" class="mono">6</text>
    <rect x="56" y="112" width="48" height="48" class="land"/>
    <text x="80" y="141" text-anchor="middle" class="mono">7</text>
    <rect x="112" y="112" width="48" height="48" class="land"/>
    <text x="136" y="141" text-anchor="middle" class="mono">8</text>
  </g>
  <path d="M 752 230 L 760 230" class="arrow"/>
  <path d="M 728 254 L 728 262" class="arrow"/>
  <path d="M 840 342 L 848 342" class="arrow"/>
  <text x="704" y="392" class="mono">id = row * cols + col</text>
  <text x="704" y="418" class="small">只合并相邻的陆地格，水格不计入岛屿</text>

  <rect x="120" y="492" width="740" height="38" class="note"/>
  <text x="490" y="516" text-anchor="middle" class="small">共同点：边或相邻关系只是触发 unite；真正的答案来自根节点是否相同以及 count 的变化。</text>
</svg>
