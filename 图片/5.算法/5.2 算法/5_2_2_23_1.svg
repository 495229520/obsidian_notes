<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
  <rect width="980" height="540" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .node { fill: #eef6fb; stroke: #6f94b3; stroke-width: 2; }
      .root { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2.2; }
      .child { fill: #dff0ea; stroke: #45907a; stroke-width: 2; }
      .edge { fill: none; stroke: #53616f; stroke-width: 2; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .note { fill: #edf4f1; stroke: #9db7aa; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">树形 DP：子树状态向父节点汇总</text>
  <text x="40" y="76" class="subtitle">以打家劫舍 III 为例，每个节点返回 choose / skip 两个状态，父节点根据子节点状态做决策。</text>

  <rect x="58" y="116" width="410" height="328" class="panel"/>
  <text x="88" y="152" class="label">后序遍历：先子节点，后父节点</text>
  <circle cx="263" cy="198" r="28" class="root"/>
  <text x="263" y="204" text-anchor="middle" class="mono">3</text>
  <circle cx="178" cy="292" r="28" class="child"/>
  <text x="178" y="298" text-anchor="middle" class="mono">2</text>
  <circle cx="348" cy="292" r="28" class="child"/>
  <text x="348" y="298" text-anchor="middle" class="mono">3</text>
  <circle cx="212" cy="382" r="28" class="node"/>
  <text x="212" y="388" text-anchor="middle" class="mono">3</text>
  <circle cx="382" cy="382" r="28" class="node"/>
  <text x="382" y="388" text-anchor="middle" class="mono">1</text>
  <path d="M 244 220 L 197 270" class="edge"/>
  <path d="M 282 220 L 329 270" class="edge"/>
  <path d="M 188 319 L 202 356" class="edge"/>
  <path d="M 358 319 L 372 356" class="edge"/>
  <path d="M 212 350 C 230 314 248 274 258 228" class="arrow"/>
  <path d="M 382 350 C 364 314 346 274 268 228" class="arrow"/>
  <text x="102" y="428" class="small">子树状态计算完后，才能合成根节点状态</text>

  <rect x="526" y="116" width="396" height="328" class="panel"/>
  <text x="556" y="152" class="label">每个节点返回两个状态</text>
  <text x="556" y="198" class="mono">choose = node.val + left.skip + right.skip</text>
  <text x="556" y="244" class="mono">skip = max(left.choose, left.skip)</text>
  <text x="610" y="270" class="mono">+ max(right.choose, right.skip)</text>
  <text x="556" y="326" class="small">choose：选当前节点，子节点必须不选</text>
  <text x="556" y="354" class="small">skip：不选当前节点，子节点可选可不选</text>
  <text x="556" y="400" class="mono">answer = max(root.choose, root.skip)</text>

  <rect x="138" y="480" width="704" height="38" class="note"/>
  <text x="490" y="504" text-anchor="middle" class="small">树形 DP 的关键：定义每个节点要交给父节点的信息，而不是只定义最终答案。</text>
</svg>
