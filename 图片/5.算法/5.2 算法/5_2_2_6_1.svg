<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">二分查找的本质是寻找单调边界</title>
  <desc id="desc">展示一个由不满足到满足的单调序列，二分查找每次用 mid 判断并收缩搜索区间，最终定位边界。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3b5164" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .label { font: 600 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .small { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .tiny { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5a6876; }
      .falseBox { fill: #f4d6cf; stroke: #c65d52; stroke-width: 1.8; }
      .trueBox { fill: #d8ead8; stroke: #4f9a68; stroke-width: 1.8; }
      .midBox { fill: #f8e7ae; stroke: #c28a1d; stroke-width: 2.2; }
      .card { fill: #fbfaf4; stroke: #d9cfbd; stroke-width: 1.4; rx: 8; }
      .line { stroke: #3b5164; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #3b5164; stroke-width: 1.5; stroke-dasharray: 6 6; fill: none; }
    </style>
  </defs>

  <text x="460" y="46" text-anchor="middle" class="title">二分查找：把区间切向单调边界</text>
  <text x="460" y="75" text-anchor="middle" class="small">只要答案能被划分成“左侧不满足、右侧满足”，就可以用二分找第一个满足的位置</text>

  <g transform="translate(96 118)">
    <rect x="0" y="0" width="70" height="64" rx="8" class="falseBox"/>
    <rect x="76" y="0" width="70" height="64" rx="8" class="falseBox"/>
    <rect x="152" y="0" width="70" height="64" rx="8" class="falseBox"/>
    <rect x="228" y="0" width="70" height="64" rx="8" class="midBox"/>
    <rect x="304" y="0" width="70" height="64" rx="8" class="trueBox"/>
    <rect x="380" y="0" width="70" height="64" rx="8" class="trueBox"/>
    <rect x="456" y="0" width="70" height="64" rx="8" class="trueBox"/>
    <rect x="532" y="0" width="70" height="64" rx="8" class="trueBox"/>

    <text x="35" y="28" text-anchor="middle" class="label">F</text>
    <text x="111" y="28" text-anchor="middle" class="label">F</text>
    <text x="187" y="28" text-anchor="middle" class="label">F</text>
    <text x="263" y="28" text-anchor="middle" class="label">mid</text>
    <text x="339" y="28" text-anchor="middle" class="label">T</text>
    <text x="415" y="28" text-anchor="middle" class="label">T</text>
    <text x="491" y="28" text-anchor="middle" class="label">T</text>
    <text x="567" y="28" text-anchor="middle" class="label">T</text>

    <text x="35" y="50" text-anchor="middle" class="tiny">不满足</text>
    <text x="111" y="50" text-anchor="middle" class="tiny">不满足</text>
    <text x="187" y="50" text-anchor="middle" class="tiny">不满足</text>
    <text x="263" y="50" text-anchor="middle" class="tiny">检查</text>
    <text x="339" y="50" text-anchor="middle" class="tiny">满足</text>
    <text x="415" y="50" text-anchor="middle" class="tiny">满足</text>
    <text x="491" y="50" text-anchor="middle" class="tiny">满足</text>
    <text x="567" y="50" text-anchor="middle" class="tiny">满足</text>

    <line x1="302" y1="-18" x2="302" y2="88" class="dash"/>
    <text x="302" y="-28" text-anchor="middle" class="label">真实边界</text>
  </g>

  <g transform="translate(88 230)">
    <rect x="0" y="0" width="214" height="74" class="card"/>
    <text x="107" y="26" text-anchor="middle" class="label">1. 取中点</text>
    <text x="107" y="51" text-anchor="middle" class="small">mid = l + (r - l) / 2</text>
  </g>

  <path d="M 308 267 C 336 267, 352 267, 380 267" class="line"/>

  <g transform="translate(386 230)">
    <rect x="0" y="0" width="214" height="74" class="card"/>
    <text x="107" y="26" text-anchor="middle" class="label">2. 判断性质</text>
    <text x="107" y="51" text-anchor="middle" class="small">check(mid) 是真还是假</text>
  </g>

  <path d="M 606 267 C 634 267, 650 267, 678 267" class="line"/>

  <g transform="translate(684 230)">
    <rect x="0" y="0" width="184" height="74" class="card"/>
    <text x="92" y="26" text-anchor="middle" class="label">3. 缩小区间</text>
    <text x="92" y="51" text-anchor="middle" class="small">保留可能有答案的一半</text>
  </g>
</svg>
