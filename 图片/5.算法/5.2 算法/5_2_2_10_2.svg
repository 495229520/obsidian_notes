<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect width="980" height="520" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .cell { fill: #ffffff; stroke: #8aa1b4; stroke-width: 1.5; rx: 8; }
      .window { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2; rx: 8; }
      .drop { fill: #fde2df; stroke: #d36b5f; stroke-width: 2; rx: 8; }
      .keep { fill: #dff0ea; stroke: #45907a; stroke-width: 2; rx: 8; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .queue { fill: #eef6fb; stroke: #6f94b3; stroke-width: 1.5; rx: 8; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .brace { fill: none; stroke: #d59a2d; stroke-width: 2; }
    </style>
  </defs>

  <text x="40" y="48" class="title">单调队列：窗口最大值保留在队头</text>
  <text x="40" y="76" class="subtitle">以 nums = [1, 3, -1, -3, 5, 3, 6, 7], k = 3 为例，处理 right = 4 时窗口是 [2, 4]。</text>

  <text x="58" y="124" class="label">数组 nums</text>
  <g transform="translate(58,140)">
    <g>
      <rect x="0" y="0" width="82" height="58" class="cell"/>
      <text x="41" y="25" text-anchor="middle" class="mono">1</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=0</text>
    </g>
    <g transform="translate(90,0)">
      <rect x="0" y="0" width="82" height="58" class="drop"/>
      <text x="41" y="25" text-anchor="middle" class="mono">3</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=1</text>
    </g>
    <g transform="translate(180,0)">
      <rect x="0" y="0" width="82" height="58" class="window"/>
      <text x="41" y="25" text-anchor="middle" class="mono">-1</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=2</text>
    </g>
    <g transform="translate(270,0)">
      <rect x="0" y="0" width="82" height="58" class="window"/>
      <text x="41" y="25" text-anchor="middle" class="mono">-3</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=3</text>
    </g>
    <g transform="translate(360,0)">
      <rect x="0" y="0" width="82" height="58" class="keep"/>
      <text x="41" y="25" text-anchor="middle" class="mono">5</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=4</text>
    </g>
    <g transform="translate(450,0)">
      <rect x="0" y="0" width="82" height="58" class="cell"/>
      <text x="41" y="25" text-anchor="middle" class="mono">3</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=5</text>
    </g>
    <g transform="translate(540,0)">
      <rect x="0" y="0" width="82" height="58" class="cell"/>
      <text x="41" y="25" text-anchor="middle" class="mono">6</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=6</text>
    </g>
    <g transform="translate(630,0)">
      <rect x="0" y="0" width="82" height="58" class="cell"/>
      <text x="41" y="25" text-anchor="middle" class="mono">7</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=7</text>
    </g>
  </g>

  <path d="M 238 214 L 418 214" class="brace"/>
  <text x="328" y="238" text-anchor="middle" class="small">当前窗口 [2, 4]</text>

  <rect x="58" y="276" width="252" height="154" class="panel"/>
  <text x="82" y="310" class="label">1. 删除过期下标</text>
  <text x="82" y="342" class="mono">left = 2</text>
  <text x="82" y="370" class="mono">dq.front() = 1</text>
  <text x="82" y="398" class="small">下标 1 已经不在窗口内，弹出队头</text>

  <rect x="364" y="276" width="252" height="154" class="panel"/>
  <text x="388" y="310" class="label">2. 弹出队尾更小值</text>
  <text x="388" y="342" class="mono">5 &gt; -3</text>
  <text x="388" y="370" class="mono">5 &gt; -1</text>
  <text x="388" y="398" class="small">更小且更旧的元素不可能再成为最大值</text>

  <rect x="670" y="276" width="252" height="154" class="panel"/>
  <text x="694" y="310" class="label">3. 当前下标入队</text>
  <g transform="translate(708,342)">
    <rect x="0" y="0" width="160" height="36" class="queue"/>
    <text x="80" y="23" text-anchor="middle" class="mono">4:5  ← front</text>
  </g>
  <text x="694" y="410" class="small">队头值 5 就是窗口 [2, 4] 的最大值</text>

  <path d="M 310 353 C 336 353 340 353 364 353" class="arrow"/>
  <path d="M 616 353 C 642 353 646 353 670 353" class="arrow"/>

  <g transform="translate(74,458)">
    <rect x="0" y="0" width="832" height="34" fill="#edf4f1" stroke="#9db7aa" stroke-width="1.2" rx="8"/>
    <text x="416" y="22" text-anchor="middle" class="small">不变量：deque 中保存窗口内候选下标，值从队头到队尾单调递减；队头永远是当前窗口最大值。</text>
  </g>
</svg>
