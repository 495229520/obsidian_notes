<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <title id="title">链表常见技巧总览</title>
  <desc id="desc">用题目关键词、推荐技巧和核心不变量串联链表面试题的常见解法。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .col-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-body { font-size: 13px; fill: #475569; }
      .note { font-size: 14px; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="560" y="54" text-anchor="middle" class="title">链表常见技巧总览</text>
  <text x="560" y="82" text-anchor="middle" class="subtitle">先识别题目关键词，再选择指针技巧，最后守住不变量和边界</text>

  <rect x="58" y="118" width="260" height="42" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="430" y="118" width="260" height="42" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="802" y="118" width="260" height="42" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="188" y="145" text-anchor="middle" class="col-title">题目关键词</text>
  <text x="560" y="145" text-anchor="middle" class="col-title">推荐技巧</text>
  <text x="932" y="145" text-anchor="middle" class="col-title">核心不变量</text>

  <g transform="translate(58 190)">
    <rect width="260" height="72" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="22" y="28" class="box-title">头节点可能变化</text>
    <text x="22" y="52" class="box-body">删除、插入、合并、分组反转</text>
  </g>
  <g transform="translate(430 190)">
    <rect width="260" height="72" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="22" y="28" class="box-title">虚拟头节点 dummy</text>
    <text x="22" y="52" class="box-body">让所有操作都有稳定前驱</text>
  </g>
  <g transform="translate(802 190)">
    <rect width="260" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="22" y="28" class="box-title">返回 dummy.next</text>
    <text x="22" y="52" class="box-body">prev 永远指向待操作节点前面</text>
  </g>
  <path d="M 318 226 H 418" class="arrow"/>
  <path d="M 690 226 H 790" class="arrow"/>

  <g transform="translate(58 286)">
    <rect width="260" height="72" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="22" y="28" class="box-title">中点、找环、倒数第 N 个</text>
    <text x="22" y="52" class="box-body">需要一次遍历得到位置关系</text>
  </g>
  <g transform="translate(430 286)">
    <rect width="260" height="72" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="22" y="28" class="box-title">快慢指针</text>
    <text x="22" y="52" class="box-body">速度差或固定距离差</text>
  </g>
  <g transform="translate(802 286)">
    <rect width="260" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="22" y="28" class="box-title">先判空再移动</text>
    <text x="22" y="52" class="box-body">fast 和 fast-&gt;next 必须安全</text>
  </g>
  <path d="M 318 322 H 418" class="arrow"/>
  <path d="M 690 322 H 790" class="arrow"/>

  <g transform="translate(58 382)">
    <rect width="260" height="72" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="22" y="28" class="box-title">反转整链或局部区间</text>
    <text x="22" y="52" class="box-body">206、25、两两交换、分组题</text>
  </g>
  <g transform="translate(430 382)">
    <rect width="260" height="72" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="22" y="28" class="box-title">三指针反转</text>
    <text x="22" y="52" class="box-body">prev、curr、next 逐步改向</text>
  </g>
  <g transform="translate(802 382)">
    <rect width="260" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="22" y="28" class="box-title">先存 next 再断链</text>
    <text x="22" y="52" class="box-body">每段翻完要接回前后边界</text>
  </g>
  <path d="M 318 418 H 418" class="arrow"/>
  <path d="M 690 418 H 790" class="arrow"/>

  <g transform="translate(58 478)">
    <rect width="260" height="72" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="22" y="28" class="box-title">合并、相交、排序</text>
    <text x="22" y="52" class="box-body">多条链表协同推进或拆分</text>
  </g>
  <g transform="translate(430 478)">
    <rect width="260" height="72" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="22" y="28" class="box-title">双指针 + 归并</text>
    <text x="22" y="52" class="box-body">尾插合并，快慢切分</text>
  </g>
  <g transform="translate(802 478)">
    <rect width="260" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="22" y="28" class="box-title">tail 指向已合并末尾</text>
    <text x="22" y="52" class="box-body">切分后必须断开 slow-&gt;next</text>
  </g>
  <path d="M 318 514 H 418" class="arrow"/>
  <path d="M 690 514 H 790" class="arrow"/>

  <rect x="92" y="604" width="936" height="70" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="122" y="632" class="box-title">面试手写顺序</text>
  <text x="122" y="656" class="note">画出节点关系 → 写清楚前驱和后继 → 先保存 next → 再改 next → 最后确认返回头节点和空链表边界</text>
</svg>
