  <rect x="420" y="175" width="175" height="42" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" />
  <text x="507.5" y="201" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#075985">入度 0 入队：0</text>

  <rect x="420" y="246" width="175" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" />
  <text x="507.5" y="272" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#166534">弹出 0，删除出边</text>

  <rect x="420" y="317" width="175" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
  <text x="507.5" y="343" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#92400e">1、2 入度归零</text>

