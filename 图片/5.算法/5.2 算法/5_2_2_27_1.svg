  <text x="804.5" y="144" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#0f172a">输出拓扑序</text>

  <rect x="716" y="183" width="54" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" />
