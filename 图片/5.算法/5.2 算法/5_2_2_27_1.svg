  <path d="M 883 230 C 883 255 845 255 826 270" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-26)" />

  <text x="804.5" y="346" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#475569">若处理数量小于节点数，说明存在环</text>

  <path d="M 337 242 L 381 242" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-26)" />
  <path d="M 630 242 L 678 242" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-26)" />

  <rect x="95" y="438" width="790" height="104" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8" />
  <text x="490" y="470" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">DAG DP 的使用方式</text>
  <text x="490" y="502" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" fill="#334155">按照拓扑序处理节点，前置状态已经确定后，再更新后继状态</text>
  <text x="490" y="528" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" fill="#334155">常见转移：dp[v] = max(dp[v], dp[u] + w) 或 dp[v] += dp[u]</text>
</svg>
