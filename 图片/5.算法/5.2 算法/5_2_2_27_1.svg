  <text x="490" y="44" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#1f2937">拓扑排序：按依赖逐步解锁</text>
  <text x="490" y="76" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" fill="#64748b">有向边表示“先完成左边，才能解锁右边”</text>

