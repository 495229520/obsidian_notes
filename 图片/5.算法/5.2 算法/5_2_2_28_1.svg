<svg width="980" height="600" viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="980" height="600" fill="rgb(245, 244, 237)" />
  <defs>
    <marker id="arrow-25" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <text x="490" y="44" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#1f2937">最短路径算法怎么选</text>
  <text x="490" y="76" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" fill="#64748b">先看边权，再看起点数量和查询范围</text>

  <rect x="365" y="105" width="250" height="74" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
  <text x="490" y="135" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1f2937">题目要求最短路</text>
  <text x="490" y="160" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#475569">路径长度 / 代价 / 时间</text>

  <rect x="75" y="235" width="215" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="182.5" y="263" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f172a">无权图</text>
  <text x="182.5" y="288" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">每条边代价相同</text>
  <text x="182.5" y="311" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">求最少步数</text>

  <rect x="315" y="235" width="215" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="422.5" y="263" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f172a">非负权图</text>
  <text x="422.5" y="288" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">边权都大于等于 0</text>
  <text x="422.5" y="311" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">单源最短距离</text>

  <rect x="555" y="235" width="215" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="662.5" y="263" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f172a">存在负权边</text>
  <text x="662.5" y="288" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">需要安全松弛</text>
  <text x="662.5" y="311" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">可能要判负环</text>

  <rect x="795" y="235" width="120" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="855" y="263" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f172a">任意两点</text>
  <text x="855" y="288" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">点数较少</text>
  <text x="855" y="311" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">多次查询</text>

  <rect x="75" y="420" width="215" height="94" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2" />
  <text x="182.5" y="450" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#075985">BFS</text>
  <text x="182.5" y="476" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">单源：起点入队</text>
  <text x="182.5" y="499" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">多源：所有源点入队</text>

  <rect x="315" y="420" width="215" height="94" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="2" />
  <text x="422.5" y="450" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#166534">Dijkstra</text>
  <text x="422.5" y="476" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">邻接表 + 小顶堆</text>
  <text x="422.5" y="499" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">出堆时跳过旧记录</text>

  <rect x="555" y="420" width="215" height="94" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2" />
  <text x="662.5" y="450" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Bellman-Ford</text>
  <text x="662.5" y="476" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">扫描边集 n - 1 轮</text>
  <text x="662.5" y="499" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">第 n 轮仍更新即负环</text>

  <rect x="795" y="420" width="120" height="94" rx="10" fill="#f8fafc" stroke="#d97706" stroke-width="2" />
  <text x="855" y="450" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#92400e">Floyd</text>
  <text x="855" y="476" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">邻接矩阵</text>
  <text x="855" y="499" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#334155">O(V³)</text>

  <path d="M 490 180 C 490 205 182.5 205 182.5 232" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-25)" />
  <path d="M 490 180 C 490 209 422.5 205 422.5 232" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-25)" />
  <path d="M 490 180 C 490 209 662.5 205 662.5 232" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-25)" />
  <path d="M 490 180 C 490 205 855 205 855 232" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-25)" />

  <path d="M 182.5 326 L 182.5 416" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-25)" />
  <path d="M 422.5 326 L 422.5 416" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-25)" />
  <path d="M 662.5 326 L 662.5 416" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-25)" />
  <path d="M 855 326 L 855 416" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-25)" />

  <rect x="210" y="543" width="560" height="32" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" />
  <text x="490" y="565" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#7c2d12">多源带权最短路：可添加超级源点，再按边权条件选择 Dijkstra 或 Bellman-Ford</text>
</svg>
