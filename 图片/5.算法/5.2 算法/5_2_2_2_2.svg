<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">状态压缩 DP 的 mask 转移</title>
  <desc id="desc">展示状态压缩 DP 中从当前集合 mask 选择一个未选元素 i，转移到 next mask 的过程。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4f5b66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
      .title { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #65717d; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #4d5965; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 15px; fill: #22313f; }
      .state { fill: #fffaf0; stroke: #d2b46f; stroke-width: 1.6; rx: 8; }
      .next { fill: #eaf7ef; stroke: #5ca36f; stroke-width: 1.7; rx: 8; }
      .rule { fill: #eef5fb; stroke: #7ba5c7; stroke-width: 1.5; rx: 8; }
      .bit-on { fill: #dcefe4; stroke: #4d9465; stroke-width: 1.6; rx: 6; }
      .bit-off { fill: #f7eee3; stroke: #c89063; stroke-width: 1.5; rx: 6; }
      .highlight { fill: #f6df9e; stroke: #c8912d; stroke-width: 1.7; rx: 6; }
    </style>
  </defs>

  <text class="title" x="48" y="54">状态压缩 DP：从一个集合状态转移到另一个集合状态</text>
  <text class="subtitle" x="48" y="82">`dp[mask]` 记录当前已经选择集合 mask 时的答案，再把一个未选元素加入集合。</text>

  <rect class="state" x="70" y="132" width="290" height="188"/>
  <text class="label" x="96" y="166">当前状态</text>
  <text class="mono" x="96" y="196">mask = 0b0101</text>
  <text class="small" x="96" y="224">已选择：元素 0、元素 2</text>
  <g transform="translate(96 246)">
    <rect class="bit-off" x="0" y="0" width="48" height="44"/>
    <rect class="bit-on" x="58" y="0" width="48" height="44"/>
    <rect class="bit-off" x="116" y="0" width="48" height="44"/>
    <rect class="bit-on" x="174" y="0" width="48" height="44"/>
    <text class="mono" x="17" y="29">0</text>
    <text class="mono" x="75" y="29">1</text>
    <text class="mono" x="133" y="29">0</text>
    <text class="mono" x="191" y="29">1</text>
    <text class="small" x="8" y="66">bit3</text>
    <text class="small" x="66" y="66">bit2</text>
    <text class="small" x="124" y="66">bit1</text>
    <text class="small" x="182" y="66">bit0</text>
  </g>

  <rect class="rule" x="410" y="148" width="178" height="154"/>
  <text class="label" x="438" y="184">选择未选 i</text>
  <text class="small" x="438" y="214">这里选择 i = 1</text>
  <text class="mono" x="438" y="246">next = mask</text>
  <text class="mono" x="438" y="274">       | (1&lt;&lt;i)</text>

  <path d="M 366 226 C 386 226 390 226 406 226" fill="none" stroke="#4f5b66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 592 226 C 612 226 616 226 634 226" fill="none" stroke="#4f5b66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="next" x="640" y="132" width="290" height="188"/>
  <text class="label" x="666" y="166">转移后状态</text>
  <text class="mono" x="666" y="196">next = 0b0111</text>
  <text class="small" x="666" y="224">已选择：元素 0、元素 1、元素 2</text>
  <g transform="translate(666 246)">
    <rect class="bit-off" x="0" y="0" width="48" height="44"/>
    <rect class="bit-on" x="58" y="0" width="48" height="44"/>
    <rect class="highlight" x="116" y="0" width="48" height="44"/>
    <rect class="bit-on" x="174" y="0" width="48" height="44"/>
    <text class="mono" x="17" y="29">0</text>
    <text class="mono" x="75" y="29">1</text>
    <text class="mono" x="133" y="29">1</text>
    <text class="mono" x="191" y="29">1</text>
    <text class="small" x="8" y="66">bit3</text>
    <text class="small" x="66" y="66">bit2</text>
    <text class="small" x="124" y="66">bit1</text>
    <text class="small" x="182" y="66">bit0</text>
  </g>

  <rect class="rule" x="92" y="374" width="776" height="96"/>
  <text class="label" x="120" y="408">状态压缩 DP 的基本循环</text>
  <text class="mono" x="120" y="438">for mask in [0, 1&lt;&lt;n): for i in [0, n): if (!(mask &amp; (1&lt;&lt;i))) update next</text>
  <text class="small" x="120" y="462">n 通常不大；当 n = 20 时，状态数已经约为 100 万。</text>
</svg>
