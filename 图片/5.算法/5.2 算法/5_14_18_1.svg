<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000px" height="620px" viewBox="0 0 1000 620" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f4f5f"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #1f2933; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; fill: #56677a; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #1f2933; }
      .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; fill: #43505f; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1f2933; }
    </style>
  </defs>

  <text x="500" y="38" text-anchor="middle" dominant-baseline="middle" class="title">贪心算法：局部最优如何走向全局最优</text>
  <text x="500" y="68" text-anchor="middle" dominant-baseline="middle" class="subtitle">每一步都做“当前不吃亏”的选择，但必须能证明这种选择不会破坏最终最优解</text>

  <rect x="56" y="108" width="276" height="300" rx="16" ry="16" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/>
  <text x="194" y="138" text-anchor="middle" dominant-baseline="middle" class="label" fill="#324a82">区间调度</text>
  <text x="194" y="166" text-anchor="middle" dominant-baseline="middle" class="small">局部选择：结束最早</text>

  <line x1="88" y1="214" x2="300" y2="214" stroke="#9aa8b8" stroke-width="2"/>
  <rect x="96" y="190" width="72" height="26" rx="6" fill="#d8f0df" stroke="#598765" stroke-width="2"/>
  <rect x="150" y="230" width="118" height="26" rx="6" fill="#fff1c7" stroke="#b7872f" stroke-width="2"/>
  <rect x="184" y="190" width="84" height="26" rx="6" fill="#d8f0df" stroke="#598765" stroke-width="2"/>
  <rect x="238" y="270" width="58" height="26" rx="6" fill="#d8f0df" stroke="#598765" stroke-width="2"/>
  <text x="132" y="204" text-anchor="middle" dominant-baseline="middle" class="mono">选</text>
  <text x="209" y="244" text-anchor="middle" dominant-baseline="middle" class="mono">冲突</text>
  <text x="226" y="204" text-anchor="middle" dominant-baseline="middle" class="mono">选</text>
  <text x="267" y="284" text-anchor="middle" dominant-baseline="middle" class="mono">选</text>

  <text x="88" y="336" class="small">按结束时间排序</text>
  <text x="88" y="362" class="small">每次选最早结束且不冲突的区间</text>
  <text x="88" y="386" class="small">给后续选择留下最大空间</text>

  <rect x="362" y="108" width="276" height="300" rx="16" ry="16" fill="#eef8ef" stroke="#6f9678" stroke-width="2"/>
  <text x="500" y="138" text-anchor="middle" dominant-baseline="middle" class="label" fill="#244c2e">跳跃游戏</text>
  <text x="500" y="166" text-anchor="middle" dominant-baseline="middle" class="small">局部选择：扩展最远覆盖</text>

  <g class="mono" text-anchor="middle" dominant-baseline="middle">
    <rect x="395" y="204" width="42" height="42" fill="#fbfaf5" stroke="#9aa8b8" stroke-width="2"/>
    <rect x="437" y="204" width="42" height="42" fill="#fbfaf5" stroke="#9aa8b8" stroke-width="2"/>
    <rect x="479" y="204" width="42" height="42" fill="#fbfaf5" stroke="#9aa8b8" stroke-width="2"/>
    <rect x="521" y="204" width="42" height="42" fill="#fbfaf5" stroke="#9aa8b8" stroke-width="2"/>
    <rect x="563" y="204" width="42" height="42" fill="#fbfaf5" stroke="#9aa8b8" stroke-width="2"/>
    <text x="416" y="225">2</text>
    <text x="458" y="225">3</text>
    <text x="500" y="225">1</text>
    <text x="542" y="225">1</text>
    <text x="584" y="225">4</text>
  </g>
  <path d="M416 270 C450 298 520 298 584 270" fill="none" stroke="#598765" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="500" y="320" text-anchor="middle" dominant-baseline="middle" class="mono">farthest = max(farthest, i + nums[i])</text>
  <text x="394" y="356" class="small">遍历可达范围内的每个位置</text>
  <text x="394" y="382" class="small">持续更新当前能到达的最远下标</text>

  <rect x="668" y="108" width="276" height="300" rx="16" ry="16" fill="#fff1c7" stroke="#b7872f" stroke-width="2"/>
  <text x="806" y="138" text-anchor="middle" dominant-baseline="middle" class="label" fill="#6a4817">分发糖果</text>
  <text x="806" y="166" text-anchor="middle" dominant-baseline="middle" class="small">局部约束：左右两次扫描</text>

  <g class="mono" text-anchor="middle" dominant-baseline="middle">
    <text x="710" y="214">评分</text>
    <rect x="760" y="194" width="34" height="34" fill="#fbfaf5" stroke="#9aa8b8" stroke-width="2"/><text x="777" y="211">1</text>
    <rect x="798" y="194" width="34" height="34" fill="#fbfaf5" stroke="#9aa8b8" stroke-width="2"/><text x="815" y="211">2</text>
    <rect x="836" y="194" width="34" height="34" fill="#fbfaf5" stroke="#9aa8b8" stroke-width="2"/><text x="853" y="211">2</text>

    <text x="710" y="266">左扫</text>
    <rect x="760" y="246" width="34" height="34" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/><text x="777" y="263">1</text>
    <rect x="798" y="246" width="34" height="34" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/><text x="815" y="263">2</text>
    <rect x="836" y="246" width="34" height="34" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/><text x="853" y="263">1</text>

    <text x="710" y="318">右扫</text>
    <rect x="760" y="298" width="34" height="34" fill="#d8f0df" stroke="#598765" stroke-width="2"/><text x="777" y="315">1</text>
    <rect x="798" y="298" width="34" height="34" fill="#d8f0df" stroke="#598765" stroke-width="2"/><text x="815" y="315">2</text>
    <rect x="836" y="298" width="34" height="34" fill="#d8f0df" stroke="#598765" stroke-width="2"/><text x="853" y="315">1</text>
  </g>
  <text x="700" y="356" class="small">左到右满足右高于左</text>
  <text x="700" y="382" class="small">右到左满足左高于右</text>

  <path d="M194 430 C270 488 380 500 500 500" fill="none" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M500 430 L500 488" fill="none" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M806 430 C730 488 620 500 500 500" fill="none" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="290" y="500" width="420" height="74" rx="16" ry="16" fill="#f2e8ff" stroke="#8a6bb8" stroke-width="2"/>
  <text x="500" y="526" text-anchor="middle" dominant-baseline="middle" class="label" fill="#563a7c">证明关键</text>
  <text x="500" y="552" text-anchor="middle" dominant-baseline="middle" class="small">局部选择必须“不会让全局最优变差”</text>
</svg>
