<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-labelledby="title desc">
  <title id="title">一维前缀和的区间求和原理</title>
  <desc id="desc">展示原数组 a 与前缀和数组 s，通过 s[r] 减去 s[l-1] 得到区间 [l, r] 的和。以 a=[3,1,4,1,5,9,2]、查询区间 [3,6] 为例。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3b5164" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .sub   { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .rlab  { font: 600 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .idx   { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5a6876; }
      .val   { font: 600 18px "Consolas", "Microsoft YaHei", monospace; fill: #23313f; }
      .note  { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .tiny  { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #6b7884; }
      .cellA { fill: #dbe7f5; stroke: #2f6cb0; stroke-width: 1.4; }
      .cellS { fill: #eae6f6; stroke: #6a59c0; stroke-width: 1.4; }
      .hit   { fill: #d8ead8; stroke: #4f9a68; stroke-width: 1.8; }
      .plus  { fill: #d8ead8; stroke: #3f9a5e; stroke-width: 2.4; }
      .minus { fill: #f7e0cf; stroke: #c5612f; stroke-width: 2.4; }
      .line  { stroke: #3b5164; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .box   { fill: #fbfaf4; stroke: #d9cfbd; stroke-width: 1.4; }
    </style>
  </defs>

  <text x="440" y="42" text-anchor="middle" class="title">一维前缀和：s[r] − s[l−1] = 区间 [l, r] 之和</text>
  <text x="440" y="70" text-anchor="middle" class="sub">s[i] = s[i−1] + a[i]　·　预处理 O(n)，单次查询 O(1)</text>

  <!-- 行标签 -->
  <text x="112" y="116" text-anchor="end" class="idx">下标 i</text>
  <text x="112" y="155" text-anchor="end" class="rlab">a[i]</text>
  <text x="112" y="239" text-anchor="end" class="rlab">s[i]</text>

  <!-- 下标行 -->
  <text x="170" y="116" text-anchor="middle" class="idx">0</text>
  <text x="254" y="116" text-anchor="middle" class="idx">1</text>
  <text x="338" y="116" text-anchor="middle" class="idx">2</text>
  <text x="422" y="116" text-anchor="middle" class="idx">3</text>
  <text x="506" y="116" text-anchor="middle" class="idx">4</text>
  <text x="590" y="116" text-anchor="middle" class="idx">5</text>
  <text x="674" y="116" text-anchor="middle" class="idx">6</text>
  <text x="758" y="116" text-anchor="middle" class="idx">7</text>

  <!-- a[] 数组 -->
  <rect x="128" y="128" width="84" height="54" rx="6" class="box"/>
  <rect x="212" y="128" width="84" height="54" rx="6" class="cellA"/>
  <rect x="296" y="128" width="84" height="54" rx="6" class="cellA"/>
  <rect x="380" y="128" width="84" height="54" rx="6" class="hit"/>
  <rect x="464" y="128" width="84" height="54" rx="6" class="hit"/>
  <rect x="548" y="128" width="84" height="54" rx="6" class="hit"/>
  <rect x="632" y="128" width="84" height="54" rx="6" class="hit"/>
  <rect x="716" y="128" width="84" height="54" rx="6" class="cellA"/>
  <text x="170" y="155" text-anchor="middle" class="tiny">—</text>
  <text x="254" y="155" text-anchor="middle" class="val">3</text>
  <text x="338" y="155" text-anchor="middle" class="val">1</text>
  <text x="422" y="155" text-anchor="middle" class="val">4</text>
  <text x="506" y="155" text-anchor="middle" class="val">1</text>
  <text x="590" y="155" text-anchor="middle" class="val">5</text>
  <text x="674" y="155" text-anchor="middle" class="val">9</text>
  <text x="758" y="155" text-anchor="middle" class="val">2</text>

  <!-- 目标区间标注 -->
  <text x="548" y="202" text-anchor="middle" class="note">目标区间 [3, 6]：4 + 1 + 5 + 9 = 19</text>

  <!-- s[] 前缀和数组 -->
  <rect x="128" y="212" width="84" height="54" rx="6" class="cellS"/>
  <rect x="212" y="212" width="84" height="54" rx="6" class="cellS"/>
  <rect x="296" y="212" width="84" height="54" rx="6" class="minus"/>
  <rect x="380" y="212" width="84" height="54" rx="6" class="cellS"/>
  <rect x="464" y="212" width="84" height="54" rx="6" class="cellS"/>
  <rect x="548" y="212" width="84" height="54" rx="6" class="cellS"/>
  <rect x="632" y="212" width="84" height="54" rx="6" class="plus"/>
  <rect x="716" y="212" width="84" height="54" rx="6" class="cellS"/>
  <text x="170" y="239" text-anchor="middle" class="val">0</text>
  <text x="254" y="239" text-anchor="middle" class="val">3</text>
  <text x="338" y="239" text-anchor="middle" class="val">4</text>
  <text x="422" y="239" text-anchor="middle" class="val">8</text>
  <text x="506" y="239" text-anchor="middle" class="val">9</text>
  <text x="590" y="239" text-anchor="middle" class="val">14</text>
  <text x="674" y="239" text-anchor="middle" class="val">23</text>
  <text x="758" y="239" text-anchor="middle" class="val">25</text>

  <!-- s[2]=被减, s[6]=被加 角标 -->
  <text x="338" y="285" text-anchor="middle" class="tiny" fill="#c5612f">s[l−1] = s[2]　被减</text>
  <text x="674" y="285" text-anchor="middle" class="tiny" fill="#3f9a5e">s[r] = s[6]　被加</text>

  <!-- 箭头汇入结果框 -->
  <path d="M 674 296 C 674 322, 600 326, 560 332" class="line"/>
  <path d="M 338 296 C 338 322, 410 326, 440 332" class="line"/>

  <!-- 结果框 -->
  <rect x="296" y="334" width="296" height="74" rx="8" class="box"/>
  <text x="444" y="362" text-anchor="middle" class="rlab">区间和 = s[r] − s[l−1]</text>
  <text x="444" y="390" text-anchor="middle" class="val">s[6] − s[2] = 23 − 4 = 19 ✓</text>

  <!-- 哨兵脚注 -->
  <text x="36" y="438" text-anchor="start" class="tiny">下标从 1 开始，s[0] = 0 作哨兵：当 l = 1 时 s[l−1] = s[0] = 0，无需特判越界。</text>
</svg>
