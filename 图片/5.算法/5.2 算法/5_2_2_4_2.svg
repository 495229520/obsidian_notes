<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">二维前缀和的容斥原理</title>
  <desc id="desc">用四块拆分 A、B、C、D 统一解释二维前缀和的递推构建与子矩阵查询。A 是左上重叠块，B 是上段，C 是左段，D 是目标块。递推时重叠块被多加一次需减回；查询时重叠块被多减一次需加回。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <style>
      .title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .sub   { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .ptit  { font: 700 17px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .reg   { font: 600 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .rsub  { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5a6876; }
      .note  { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .fml   { font: 600 16px "Consolas", "Microsoft YaHei", monospace; fill: #23313f; }
      .blockA { fill: #dbe7f5; stroke: #2f6cb0; stroke-width: 1.4; }
      .blockB { fill: #d9efe7; stroke: #2c8c6f; stroke-width: 1.4; }
      .blockC { fill: #eae6f6; stroke: #6a59c0; stroke-width: 1.4; }
      .blockD { fill: #f7e6c4; stroke: #c08a1d; stroke-width: 1.8; }
      .resbox { fill: #fbfaf4; stroke: #d9cfbd; stroke-width: 1.4; }
    </style>
  </defs>

  <text x="450" y="40" text-anchor="middle" class="title">二维前缀和：容斥原理（四块拆分 A·B·C·D）</text>
  <text x="450" y="68" text-anchor="middle" class="sub">S(i,j) 表示从 (1,1) 到 (i,j) 的子矩阵之和，下标从 1 开始</text>

  <!-- ============ 面板 ① 递推构建 ============ -->
  <g transform="translate(48,100)">
    <text x="170" y="6" text-anchor="middle" class="ptit">① 递推构建 S(i,j)</text>

    <rect x="0"   y="24"  width="240" height="150" class="blockA"/>
    <rect x="240" y="24"  width="100" height="150" class="blockB"/>
    <rect x="0"   y="174" width="240" height="60"  class="blockC"/>
    <rect x="240" y="174" width="100" height="60"  class="blockD"/>

    <text x="120" y="92"  text-anchor="middle" class="reg" fill="#1c4e87">A</text>
    <text x="120" y="114" text-anchor="middle" class="rsub">S(i−1, j−1)</text>
    <text x="290" y="92"  text-anchor="middle" class="reg" fill="#1d6b53">B</text>
    <text x="290" y="114" text-anchor="middle" class="rsub">列 j 上段</text>
    <text x="120" y="200" text-anchor="middle" class="reg" fill="#463a93">C</text>
    <text x="120" y="220" text-anchor="middle" class="rsub">行 i 左段</text>
    <text x="290" y="200" text-anchor="middle" class="reg" fill="#7d5708">D</text>
    <text x="290" y="220" text-anchor="middle" class="rsub">a(i,j)</text>

    <text x="170" y="264" text-anchor="middle" class="note">S(i−1,j)=A+B　　S(i,j−1)=A+C</text>
    <text x="170" y="288" text-anchor="middle" class="note">两块重叠于 A → A 被多加一次，需减回</text>
  </g>

  <!-- ============ 面板 ② 子矩阵查询 ============ -->
  <g transform="translate(512,100)">
    <text x="170" y="6" text-anchor="middle" class="ptit">② 子矩阵查询 sum(D)</text>

    <rect x="0"   y="24"  width="240" height="150" class="blockA"/>
    <rect x="240" y="24"  width="100" height="150" class="blockB"/>
    <rect x="0"   y="174" width="240" height="60"  class="blockC"/>
    <rect x="240" y="174" width="100" height="60"  class="blockD"/>

    <text x="120" y="92"  text-anchor="middle" class="reg" fill="#1c4e87">A</text>
    <text x="120" y="114" text-anchor="middle" class="rsub">S(x1−1, y1−1)</text>
    <text x="290" y="92"  text-anchor="middle" class="reg" fill="#1d6b53">B</text>
    <text x="290" y="114" text-anchor="middle" class="rsub">上段</text>
    <text x="120" y="200" text-anchor="middle" class="reg" fill="#463a93">C</text>
    <text x="120" y="220" text-anchor="middle" class="rsub">左段</text>
    <text x="290" y="196" text-anchor="middle" class="reg" fill="#7d5708">D</text>
    <text x="290" y="216" text-anchor="middle" class="rsub">目标子矩阵</text>

    <text x="170" y="264" text-anchor="middle" class="note">S(x1−1,y2)=A+B　　S(x2,y1−1)=A+C</text>
    <text x="170" y="288" text-anchor="middle" class="note">两次相减重复扣 A → A 被多减一次，需加回</text>
  </g>

  <!-- ============ 结论公式 ============ -->
  <rect x="48" y="408" width="804" height="104" rx="8" class="resbox"/>
  <text x="450" y="438" text-anchor="middle" class="note">D = 整块 −（上方）−（左方）+（重叠），二维前缀和的核心都是这一句容斥</text>
  <text x="76" y="470" text-anchor="start" class="fml">递推:  S(i,j)  = S(i−1,j) + S(i,j−1) − S(i−1,j−1) + a(i,j)</text>
  <text x="76" y="498" text-anchor="start" class="fml">查询:  sum     = S(x2,y2) − S(x1−1,y2) − S(x2,y1−1) + S(x1−1,y1−1)</text>
</svg>
