<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 850" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="850" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">误摘除雪崩：一个正反馈环和三个断路器</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">灰色故障时代，检测系统自己可能是最大的故障源——环上每一段都要装限流</text>

  <!-- 环上五个节点 -->
  <rect x="450" y="130" width="320" height="70" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="610" y="158" font-size="13.5" font-weight="700" fill="#733428" text-anchor="middle">① 节点高负载（不是死，是忙）</text>
  <text x="610" y="182" font-size="11" fill="#733428" text-anchor="middle">benchmark / 重建流量把盘和队列打满</text>

  <rect x="860" y="290" width="320" height="70" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="1020" y="318" font-size="13.5" font-weight="700" fill="#733428" text-anchor="middle">② 探测 IO 跟着排队 → 超时</text>
  <text x="1020" y="342" font-size="11" fill="#733428" text-anchor="middle">探测与数据同队列，一起变慢（1.7）</text>

  <rect x="860" y="470" width="320" height="70" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="1020" y="498" font-size="13.5" font-weight="700" fill="#733428" text-anchor="middle">③ 连续失败 → 判死 → 摘除</text>
  <text x="1020" y="522" font-size="11" fill="#733428" text-anchor="middle">把"忙"误诊为"病"</text>

  <rect x="450" y="620" width="320" height="70" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="610" y="648" font-size="13.5" font-weight="700" fill="#733428" text-anchor="middle">④ 触发副本重建</text>
  <text x="610" y="672" font-size="11" fill="#733428" text-anchor="middle">大规模顺序读 + 网络搬运 + 远端写（7.1）</text>

  <rect x="60" y="470" width="320" height="70" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="220" y="498" font-size="13.5" font-weight="700" fill="#733428" text-anchor="middle">⑤ 剩余节点更忙，p99 全面上涨</text>
  <text x="220" y="522" font-size="11" fill="#733428" text-anchor="middle">下一个"病人"已经在路上</text>

  <!-- 环形箭头 -->
  <path d="M774,178 C900,190 990,230 1016,286" fill="none" stroke="#A64B3C" stroke-width="2" marker-end="url(#arrr)"/>
  <line x1="1020" y1="364" x2="1020" y2="466" stroke="#A64B3C" stroke-width="2" marker-end="url(#arrr)"/>
  <path d="M886,544 C820,590 760,610 774,634" fill="none" stroke="#A64B3C" stroke-width="2" marker-end="url(#arrr)"/>
  <path d="M446,660 C330,650 260,600 226,544" fill="none" stroke="#A64B3C" stroke-width="2" marker-end="url(#arrr)"/>
  <path d="M240,466 C320,380 400,250 450,180" fill="none" stroke="#A64B3C" stroke-width="2" marker-end="url(#arrr)"/>

  <!-- 断路器 -->
  <rect x="800" y="150" width="330" height="86" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="820" y="178" font-size="12.5" font-weight="700" fill="#24473F">断路器 A：探测路径隔离</text>
  <text x="820" y="200" font-size="11" fill="#24473F">探测走独立队列 / 高优先级 —— 忙不该</text>
  <text x="820" y="220" font-size="11" fill="#24473F">等于"探测必超时"（切断 ①→② 这条边）</text>
  <line x1="905" y1="240" x2="925" y2="262" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrt)"/>

  <rect x="770" y="386" width="240" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="790" y="410" font-size="12.5" font-weight="700" fill="#24473F">断路器 B：摘除熔断</text>
  <text x="790" y="432" font-size="11" fill="#24473F">每轮限量；大面积"坏"→ 先怀疑检测</text>
  <line x1="990" y1="418" x2="1014" y2="418" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrt)"/>

  <rect x="450" y="726" width="330" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="470" y="750" font-size="12.5" font-weight="700" fill="#24473F">断路器 C：重建限速（backfill throttle）</text>
  <text x="470" y="772" font-size="11" fill="#24473F">重建带宽设上限，前台 IO 永远优先</text>
  <line x1="612" y1="722" x2="612" y2="696" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrt)"/>

  <!-- 滞回卡 -->
  <rect x="60" y="130" width="330" height="180" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="80" y="158" font-size="13.5" font-weight="700" fill="#2B2A26">滞回（hysteresis）防抖</text>
  <text x="80" y="186" font-size="11.5" fill="#4A473F">判死：连续 N 次失败才摘</text>
  <text x="80" y="208" font-size="11.5" fill="#4A473F">判活：连续 M 次成功才收回来</text>
  <text x="80" y="230" font-size="11.5" fill="#4A473F">两个阈值拉开 → 阈值附近不来回横跳</text>
  <text x="80" y="258" font-size="11.5" fill="#6B675C">同款思想：施密特触发器、路由抑制、</text>
  <text x="80" y="278" font-size="11.5" fill="#6B675C">TCP 拥塞控制的进出不对称（正文有代码）</text>

  <!-- 中心提示 -->
  <text x="610" y="410" font-size="13" font-weight="700" fill="#A64B3C" text-anchor="middle">正反馈环：</text>
  <text x="610" y="432" font-size="12" fill="#A64B3C" text-anchor="middle">每转一圈，"证据"越充分，</text>
  <text x="610" y="452" font-size="12" fill="#A64B3C" text-anchor="middle">误判越坚定</text>

  <!-- 底部三层健康 -->
  <rect x="60" y="806" width="1120" height="0" fill="none"/>
  <text x="60" y="826" font-size="12" fill="#4A473F">三层健康：<tspan font-weight="700">存活</tspan>（进程在）≪ <tspan font-weight="700">就绪</tspan>（能服务）≪ <tspan font-weight="700">性能健康</tspan>（不比同伴慢）—— 灰色故障只有第三层能抓到，且要用同伴对比而非绝对阈值（负载一变绝对阈值就失效）</text>
</svg>
