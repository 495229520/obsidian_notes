<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect x="0" y="0" width="1200" height="560" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .algo { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .chosen { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; rx: 8; }
      .locked { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 2; rx: 8; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">heuristic + workspace：候选算法来自约束条件</text>
  <text x="56" y="88" class="small">同一个 shape，不同 workspace budget 可能暴露不同 algorithm candidate。</text>

  <rect x="70" y="130" width="270" height="280" class="panel"/>
  <text x="105" y="170" class="label">problem config</text>
  <text x="105" y="210" class="small">shape: M/N/K</text>
  <text x="105" y="240" class="small">dtype / compute</text>
  <text x="105" y="270" class="small">layout / op</text>
  <text x="105" y="300" class="small">epilogue</text>
  <text x="105" y="330" class="small">workspace budget</text>

  <path d="M350 270 H445" class="line"/>

  <rect x="465" y="130" width="280" height="280" class="panel"/>
  <text x="510" y="170" class="label">heuristic query</text>
  <rect x="510" y="205" width="190" height="42" class="algo"/>
  <text x="560" y="232" class="small">algo 0</text>
  <rect x="510" y="260" width="190" height="42" class="chosen"/>
  <text x="560" y="287" class="small">algo 1 selected</text>
  <rect x="510" y="315" width="190" height="42" class="algo"/>
  <text x="560" y="342" class="small">algo 2</text>

  <path d="M755 270 H845" class="line"/>

  <rect x="865" y="130" width="270" height="280" class="panel"/>
  <text x="900" y="170" class="label">benchmark log</text>
  <text x="900" y="210" class="small">returned count</text>
  <text x="900" y="240" class="small">algo id</text>
  <text x="900" y="270" class="small">workspace bytes</text>
  <text x="900" y="300" class="small">status</text>
  <text x="900" y="330" class="small">time / TFLOPS</text>

  <rect x="70" y="455" width="1065" height="64" class="warn"/>
  <text x="100" y="493" class="small">heuristic 结果是“在当前约束下的候选选择”，不是全局最优证明；workspace 是约束的一部分，必须记录。</text>
</svg>
