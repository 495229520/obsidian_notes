<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
<title>DONE 之后还有几道门：完整性、可见性与调度</title>
<desc>工程状态模型 · 构造时间标记；不是 NIXL 原生 enum，也不是用 CUDA event 代替外部 DMA 协议</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="690" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="47" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">DONE 之后还有几道门：完整性、可见性与调度</text>
<text x="48" y="77" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400">工程状态模型 · 构造时间标记；不是 NIXL 原生 enum，也不是用 CUDA event 代替外部 DMA 协议</text>
<rect x="48" y="128" width="280" height="79" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="188" y="161" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="700">TP0 / B420 DONE</text>
<text x="188" y="184" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400">7.4 ms · 局部完成</text>
<rect x="48" y="236" width="280" height="79" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="188" y="269" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="700">TP1 / B421 DONE</text>
<text x="188" y="292" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400">10.0 ms · 局部完成</text>
<path d="M330,168 H360 V216 H392" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M330,276 H360 V216" fill="none" stroke="#5A564B" stroke-width="1.5"/>
<rect x="400" y="168" width="288" height="98" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="544" y="199" font-size="15" fill="#24473F" text-anchor="middle" font-weight="700">全部必要 worker / fragment</text>
<text x="544" y="222" font-size="14" fill="#24473F" text-anchor="middle" font-weight="400">完整性汇合</text>
<text x="544" y="245" font-size="14" fill="#24473F" text-anchor="middle" font-weight="400">max，不是 min</text>
<line x1="693" y1="216" x2="760" y2="216" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="768" y="146" width="424" height="140" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="980" y="186.5" font-size="15" fill="#6B4E28" text-anchor="middle" font-weight="700">GPU 消费契约</text>
<text x="980" y="209.5" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400">当前 attempt / layout / generation</text>
<text x="980" y="232.5" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400">GPU-direct：遵守 backend 排序</text>
<text x="980" y="255.5" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400">Host staging：还需 H2D 完成</text>
<line x1="980" y1="289" x2="980" y2="326" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="768" y="334" width="424" height="75" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="980" y="365" font-size="15" fill="#24473F" text-anchor="middle" font-weight="700">KV_USABLE = 10.4 ms</text>
<text x="980" y="388" font-size="14" fill="#24473F" text-anchor="middle" font-weight="400">可消费 ≠ 已调度</text>
<line x1="980" y1="412" x2="980" y2="454" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="1000" y="439" font-size="13" fill="#6B4E28" text-anchor="start" font-weight="400">等待 1.6 ms</text>
<rect x="768" y="462" width="424" height="75" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="980" y="493" font-size="15" fill="#4A3F68" text-anchor="middle" font-weight="700">DISPATCH = 12.0 ms</text>
<text x="980" y="516" font-size="14" fill="#4A3F68" text-anchor="middle" font-weight="400">之后还有 GPU launch / 前驱等待</text>
<rect x="48" y="357" width="640" height="180" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="69" y="389" font-size="17" fill="#733428" text-anchor="start" font-weight="700">取消 / 失败支路</text>
<text x="69" y="423" font-size="16" fill="#733428" text-anchor="start" font-weight="700">CANCEL_PENDING / FAILED</text>
<text x="69" y="455" font-size="14" fill="#733428" text-anchor="start" font-weight="400">旧 attempt 的 DONE：不得发布给新请求</text>
<text x="69" y="482" font-size="14" fill="#733428" text-anchor="start" font-weight="400">已提交 DMA：停止或排空后，才能回收相关内存</text>
<text x="69" y="509" font-size="14" fill="#733428" text-anchor="start" font-weight="400">generation 防误认，不会自动停止在途传输</text>
<path d="M544,270 V345" fill="none" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="558" y="311" font-size="13" fill="#733428" text-anchor="start" font-weight="400">若已取消</text>
<text x="67" y="587" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700">关键路径</text>
<text x="228" y="587" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="400">start = max(KV_USABLE, other, gate)</text>
<line x1="48" y1="629" x2="1192" y2="629" stroke="#D8D5C8" stroke-width="1.5"/>
<text x="48" y="658" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">局部完成、全部数据完整、GPU 可见、调度发车是不同承诺；减少一个分支时长，未必改变消费者的开始时刻。</text>
</svg>