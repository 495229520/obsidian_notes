<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<title>LRC(6,2,2)：局部修复很省，但不是任意四片都可丢</title><desc>上半两组三数据片及其局部异或校验，D0 可用 D1 D2 L0 重建；下半删除 D0 D1 D2 L0，剩六片但对三个未知量只有两条全局方程。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A64B3C"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6B5E"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5A80"/></marker>
</defs>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">LRC(6,2,2)：局部修复很省，但不是任意四片都可丢</text>
<text x="48" y="82" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">特定教学布局：6 个 data、2 个 local parity、2 个 global parity；不是所有 LRC 的统一保证。</text>
<rect x="48" y="120" width="552" height="205" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="150" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">局部组 A：缺 D0 时只读 3 个 helper</text>
<rect x="68" y="173" width="116" height="63" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="126.0" y="197.26" font-size="14" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">D0</text>
<text x="126.0" y="221.26" font-size="14" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">不可用</text>
<rect x="200" y="173" width="116" height="63" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="258.0" y="197.26" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D1</text>
<text x="258.0" y="221.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">可验证</text>
<rect x="332" y="173" width="116" height="63" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="390.0" y="197.26" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D2</text>
<text x="390.0" y="221.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">可验证</text>
<rect x="464" y="173" width="116" height="63" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="522.0" y="197.26" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">L0</text>
<text x="522.0" y="221.26" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">可验证</text>
<text x="324" y="305" font-size="16" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">D0 = D1 XOR D2 XOR L0</text>
<path d="M522,238 L522,263 L126,263 L126,238" fill="none" stroke="#2F6B5E" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#green)"/>
<line x1="258" y1="238" x2="258" y2="263" stroke="#2F6B5E" stroke-width="1.6"/>
<line x1="390" y1="238" x2="390" y2="263" stroke="#2F6B5E" stroke-width="1.6"/>
<rect x="640" y="120" width="552" height="205" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="660" y="150" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">局部组 B：D3、D4、D5 与 L1</text>
<rect x="660" y="173" width="116" height="63" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="718.0" y="197.26" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D3</text>
<text x="718.0" y="221.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">可验证</text>
<rect x="792" y="173" width="116" height="63" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="850.0" y="197.26" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D4</text>
<text x="850.0" y="221.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">可验证</text>
<rect x="924" y="173" width="116" height="63" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="982.0" y="197.26" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D5</text>
<text x="982.0" y="221.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">可验证</text>
<rect x="1056" y="173" width="116" height="63" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1114.0" y="197.26" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">L1</text>
<text x="1114.0" y="221.26" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">可验证</text>
<text x="916" y="305" font-size="16" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">L1 = D3 XOR D4 XOR D5</text>
<rect x="316" y="353" width="608" height="57" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="620.0" y="386.94" font-size="16" font-weight="700" fill="#4A3F68" text-anchor="middle" data-role="body">G0、G1：覆盖全部六个 data shard</text>
<path d="M310,325 L310,342 L420,342 L420,353" fill="none" stroke="#6B5B95" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M906,325 L906,342 L820,342 L820,353" fill="none" stroke="#6B5B95" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="48" y="450" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">四片失效反例：D0 + D1 + D2 + L0 全部不可用</text>
<rect x="48" y="478" width="99" height="62" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="97.5" y="501.76" font-size="14" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">D0</text>
<text x="97.5" y="525.76" font-size="14" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">缺失</text>
<rect x="167" y="478" width="99" height="62" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="216.5" y="501.76" font-size="14" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">D1</text>
<text x="216.5" y="525.76" font-size="14" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">缺失</text>
<rect x="286" y="478" width="99" height="62" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="335.5" y="501.76" font-size="14" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">D2</text>
<text x="335.5" y="525.76" font-size="14" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">缺失</text>
<rect x="405" y="478" width="99" height="62" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="454.5" y="501.76" font-size="14" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">L0</text>
<text x="454.5" y="525.76" font-size="14" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">缺失</text>
<text x="48" y="579" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">仍有 6 片：D3、D4、D5、L1、G0、G1</text>
<rect x="638" y="467" width="554" height="151" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="658" y="498" font-size="16" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">L1 只约束已知的第二组数据</text>
<text x="658" y="536" font-size="16" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">第一组：3 个未知量，只有 2 个全局方程</text>
<text x="658" y="574" font-size="16" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">rank ≤ 2 &lt; 3 → 不能唯一恢复</text>
<line x1="48" y1="643" x2="1192" y2="643" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="671" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">该构造能容忍任意 3 片及部分 4 片故障；同容量 RS(6,4) 保证任意 4 片，但传统单片恢复要读 6 个 helper。</text>
</svg>