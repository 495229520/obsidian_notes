<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>traceroute 的 TTL 阶梯与路径 MTU 发现的反馈环</title>
  <desc>上半部分用四条逐次加长的探测条画出 traceroute 如何靠递增 TTL 逼每一跳返回超时差错，并解释星号的来源；下半部分对照路径 MTU 发现正常收敛与 ICMP 被丢弃形成黑洞两种情况。</desc>

  <rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">traceroute 与路径 MTU 发现：两个都靠 ICMP 把反馈送回来</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">把 ICMP 一刀切丢掉，前者变成一排星号，后者变成「小包通、大包卡死」</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="102" width="1144" height="280" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · TTL 从 1 开始递增，每次多逼出一跳</text>

  <rect x="88" y="152" width="160" height="46" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="168" y="180" font-size="12.5" fill="#2C4460" text-anchor="middle">发起方</text>
  <rect x="304" y="152" width="160" height="46" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.3"/>
  <text x="384" y="180" font-size="12.5" fill="#4A473F" text-anchor="middle">R1</text>
  <rect x="520" y="152" width="160" height="46" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.3"/>
  <text x="600" y="180" font-size="12.5" fill="#4A473F" text-anchor="middle">R2</text>
  <rect x="736" y="152" width="160" height="46" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.3"/>
  <text x="816" y="180" font-size="12.5" fill="#4A473F" text-anchor="middle">R3</text>
  <rect x="952" y="152" width="160" height="46" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1032" y="180" font-size="12.5" fill="#24473F" text-anchor="middle">目标主机</text>

  <line x1="384" y1="198" x2="384" y2="344" stroke="#DCD8CC" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="600" y1="198" x2="600" y2="344" stroke="#DCD8CC" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="816" y1="198" x2="816" y2="344" stroke="#DCD8CC" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1032" y1="198" x2="1032" y2="344" stroke="#DCD8CC" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="92" y="230" font-size="11.5" fill="#4A473F">TTL = 1</text>
  <rect x="168" y="216" width="216" height="18" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="396" y="230" font-size="11.5" fill="#2C4460">R1 回 Type 11，第 1 跳暴露</text>

  <text x="92" y="264" font-size="11.5" fill="#4A473F">TTL = 2</text>
  <rect x="168" y="250" width="432" height="18" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="612" y="264" font-size="11.5" fill="#2C4460">R2 回 Type 11，第 2 跳暴露</text>

  <text x="92" y="298" font-size="11.5" fill="#4A473F">TTL = 3</text>
  <rect x="168" y="284" width="648" height="18" rx="3" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="828" y="298" font-size="11.5" fill="#733428">R3 不回 ICMP，这一行是 * * *</text>

  <text x="92" y="332" font-size="11.5" fill="#4A473F">TTL = 4</text>
  <rect x="168" y="318" width="864" height="18" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1044" y="332" font-size="11.5" fill="#24473F">目标回 3/3，结束</text>

  <text x="92" y="366" font-size="11.5" fill="#6B675C">每个 TTL 默认发 3 个探测包，所以每行是三个时间</text>
  <text x="560" y="366" font-size="11.5" fill="#6B675C">星号只说明这一跳不回 ICMP，不代表这条路不通</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="400" width="1144" height="280" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="428" font-size="15" font-weight="700" fill="#4A473F">B · 路径上有一段 MTU 只有 1400 时，两种结局</text>

  <rect x="72" y="444" width="530" height="196" rx="7" fill="#F4F2EA" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="92" y="470" font-size="12.5" font-weight="700" fill="#24473F">正常：一个来回就收敛</text>
  <text x="92" y="500" font-size="11.5" fill="#2B2A26">① 主机发 1500 字节，DF 位置 1</text>
  <text x="92" y="528" font-size="11.5" fill="#2B2A26">② R1 出口 MTU 只有 1400，不许分片，只能丢</text>
  <text x="92" y="556" font-size="11.5" fill="#2B2A26">③ R1 回 Type 3 Code 4，里面带 MTU = 1400</text>
  <text x="92" y="584" font-size="11.5" fill="#2B2A26">④ 主机把这条路径记成 1400，重发就通</text>
  <text x="92" y="616" font-size="11" fill="#6B675C">IPv6 版本是 Type 2 Packet Too Big，逻辑一样</text>

  <rect x="638" y="444" width="530" height="196" rx="7" fill="#F4F2EA" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="658" y="470" font-size="12.5" font-weight="700" fill="#733428">黑洞：③ 那一步被丢了</text>
  <text x="658" y="500" font-size="11.5" fill="#2B2A26">① ② 完全相同</text>
  <text x="658" y="528" font-size="11.5" fill="#2B2A26">③ 中间某台设备把 ICMP 一律丢弃</text>
  <text x="658" y="556" font-size="11.5" fill="#2B2A26">④ 主机收不到任何反馈，继续按 1500 重传</text>
  <text x="658" y="584" font-size="11.5" fill="#733428">症状：握手成功，一传大数据就卡死</text>
  <text x="658" y="616" font-size="11" fill="#6B675C">最难查的一类故障，因为 ping 和 curl 首包都正常</text>

  <text x="72" y="666" font-size="11.5" fill="#6B675C">Linux 的绕法：打开 tcp_mtu_probing，不等 ICMP，自己二分探出可用大小（RFC 4821）</text>
</svg>
