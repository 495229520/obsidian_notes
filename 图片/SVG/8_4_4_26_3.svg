<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">Traffic Class 的 8 bit，不是设备的队列编号</title>
<desc id="desc">示例 DSCP 26；ECT(0) = 106，CE = 107；改变拥塞状态不改变 DSCP</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="title">Traffic Class 的 8 bit，不是设备的队列编号</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="title">示例 DSCP 26；ECT(0) = 106，CE = 107；改变拥塞状态不改变 DSCP</text>
<rect x="48" y="108" width="806" height="315" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="70" y="137" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">A · 网络头部字节：高 6 bit 是 DSCP，低 2 bit 是 ECN</text>
<text x="128.0" y="169" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-zone="body">7</text>
<text x="216.0" y="169" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-zone="body">6</text>
<text x="304.0" y="169" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-zone="body">5</text>
<text x="392.0" y="169" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-zone="body">4</text>
<text x="480.0" y="169" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-zone="body">3</text>
<text x="568.0" y="169" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-zone="body">2</text>
<text x="656.0" y="169" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-zone="body">1</text>
<text x="744.0" y="169" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-zone="body">0</text>
<rect x="84" y="180" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="126.5" y="209.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">0</text>
<rect x="172" y="180" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="214.5" y="209.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">1</text>
<rect x="260" y="180" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="302.5" y="209.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">1</text>
<rect x="348" y="180" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="390.5" y="209.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">0</text>
<rect x="436" y="180" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="478.5" y="209.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">1</text>
<rect x="524" y="180" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="566.5" y="209.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">0</text>
<rect x="612" y="180" width="85" height="49" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="654.5" y="209.5" font-size="20" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">1</text>
<rect x="700" y="180" width="85" height="49" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="742.5" y="209.5" font-size="20" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">0</text>
<text x="90" y="256" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="body">发送 · ECT(0)</text>
<text x="378" y="256" font-size="14" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">DSCP = 26</text>
<text x="638" y="256" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="start" data-zone="body">ECN = 2</text>
<rect x="84" y="289" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="126.5" y="318.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">0</text>
<rect x="172" y="289" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="214.5" y="318.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">1</text>
<rect x="260" y="289" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="302.5" y="318.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">1</text>
<rect x="348" y="289" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="390.5" y="318.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">0</text>
<rect x="436" y="289" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="478.5" y="318.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">1</text>
<rect x="524" y="289" width="85" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="566.5" y="318.5" font-size="20" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">0</text>
<rect x="612" y="289" width="85" height="49" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="654.5" y="318.5" font-size="20" fill="#733428" font-weight="700" text-anchor="middle" data-zone="body">1</text>
<rect x="700" y="289" width="85" height="49" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="742.5" y="318.5" font-size="20" fill="#733428" font-weight="700" text-anchor="middle" data-zone="body">1</text>
<text x="90" y="365" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="body">拥塞标记 · CE</text>
<text x="378" y="365" font-size="14" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">DSCP = 26</text>
<text x="638" y="365" font-size="14" fill="#733428" font-weight="700" text-anchor="start" data-zone="body">ECN = 3</text>
<rect x="874" y="108" width="318" height="315" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="896" y="137" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">B · 命名空间分开记</text>
<text x="900" y="182" font-size="16" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">tc8 = 106</text>
<text x="900" y="209" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">完整 IP 字节</text>
<text x="900" y="251" font-size="16" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">DSCP = 26</text>
<text x="900" y="278" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">6-bit codepoint</text>
<text x="900" y="320" font-size="16" fill="#24473F" font-weight="700" text-anchor="start" data-zone="body">内部 TC / Q</text>
<text x="900" y="347" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">通过策略映射选择</text>
<rect x="48" y="443" width="1144" height="153" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="70" y="471" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">C · 三个正确编码与一个常见错填</text>
<rect x="70" y="497" width="262" height="71" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="201.0" y="526.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">104 = 26 × 4 + 0</text>
<text x="201.0" y="549.0" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle" data-zone="body">DSCP26 / Not-ECT</text>
<rect x="348" y="497" width="262" height="71" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="479.0" y="526.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">106 = 26 × 4 + 2</text>
<text x="479.0" y="549.0" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle" data-zone="body">DSCP26 / ECT(0)</text>
<rect x="626" y="497" width="262" height="71" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="757.0" y="526.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">107 = 26 × 4 + 3</text>
<text x="757.0" y="549.0" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle" data-zone="body">DSCP26 / CE</text>
<rect x="904" y="497" width="262" height="71" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="1035.0" y="526.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle" data-zone="body">直接填 26</text>
<text x="1035.0" y="549.0" font-size="14" fill="#733428" font-weight="400" text-anchor="middle" data-zone="body">DSCP6 / ECT(0)</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="646" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="footer">只改 DSCP 时保留 ECN；不能用“整个字节等于 106”的规则代替“DSCP 等于 26”。</text>
</svg>