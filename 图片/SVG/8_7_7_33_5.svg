<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="925" viewBox="0 0 1200 925" role="img" aria-labelledby="title desc">
<title id="title">Checkpoint：加密、审计与恢复各有保护对象</title><desc id="desc">一种分层架构示例；真正的 PoR 层必须遵循已分析方案的完整定义。。教学示意图，不代表实测数据。</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#345AC9"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127B6A"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#AE4247"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#586375"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A641B"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="925" rx="0" fill="rgb(245, 244, 237)"/>
<text x="42" y="35" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" text-anchor="start">8 · 7 · 7 · 33 · 5</text>
<text x="42" y="81" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" text-anchor="start">Checkpoint：加密、审计与恢复各有保护对象</text>
<text x="42" y="119" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">一种分层架构示例；真正的 PoR 层必须遵循已分析方案的完整定义。</text>
<path d="M42 141 L1158 141" fill="none" stroke="#D1D7DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="42" y="181" width="251" height="165" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="58" y="201" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="74" y="224" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">应用快照 F</text>
<text x="64" y="261" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">一致的训练状态</text>
<text x="64" y="290" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">模型 + 优化器 + 元数据</text>
<text x="64" y="319" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">先定义恢复合同。</text>
<rect x="330" y="181" width="251" height="165" rx="14" fill="#E8EDF9" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="346" y="201" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="362" y="224" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">分块 AEAD</text>
<text x="352" y="261" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">加密与认证</text>
<text x="352" y="290" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">唯一 nonce + 完整 tag</text>
<text x="352" y="319" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">得到序列化密文 G。</text>
<rect x="618" y="181" width="251" height="165" rx="14" fill="#E7F1EC" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="634" y="201" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="650" y="224" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">PoR 保护 G</text>
<text x="640" y="261" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">按方案编码与认证</text>
<text x="640" y="290" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">生成审计所需结构</text>
<text x="640" y="319" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">不是任意 HMAC 求和。</text>
<rect x="906" y="181" width="252" height="165" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="922" y="201" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="938" y="224" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">远端表示</text>
<text x="928" y="261" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">存储编码数据</text>
<text x="928" y="290" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">及辅助认证信息</text>
<text x="928" y="319" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">可能是不可信服务。</text>
<path d="M297 260 L324 260" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M585 260 L612 260" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M873 260 L900 260" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="42" y="393" width="539" height="140" rx="14" fill="#E7F1EC" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="58" y="413" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="74" y="436" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">可信控制面与密钥恢复</text>
<text x="64" y="473" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">认证 manifest、文件身份、编码参数、最新提交点</text>
<text x="64" y="502" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">独立保存验证能力与解密 key 的恢复路径。</text>
<rect x="618" y="393" width="540" height="140" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="634" y="413" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="650" y="436" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">日常审计：只针对被承诺的存储对象</text>
<text x="640" y="473" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">Challenge → data-dependent proof → Verify</text>
<text x="640" y="502" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">不声称已验证模型语义、明文 key 或恢复吞吐。</text>
<path d="M1032 350 L1032 387" fill="none" stroke="#127B6A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M586 463 L612 463" fill="none" stroke="#127B6A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M42 567 L1158 567" fill="none" stroke="#D1D7DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="42" y="604" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">实际恢复：数据沿反向链路返回，不能只拿 proof 代替下载</text>
<rect x="42" y="635" width="251" height="146" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="58" y="655" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="74" y="678" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">① 取有效片段</text>
<text x="64" y="715" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">下载足够的数据</text>
<text x="64" y="744" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">按可信版本取对象。</text>
<rect x="330" y="635" width="251" height="146" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="346" y="655" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="362" y="678" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">② 解码得到 G</text>
<text x="352" y="715" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">重建密文对象</text>
<text x="352" y="744" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">核对编码与格式。</text>
<rect x="618" y="635" width="251" height="146" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="634" y="655" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="650" y="678" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">③ 验证并解密</text>
<text x="640" y="715" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">取得正确 key</text>
<text x="640" y="744" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">认证成功再释放 P。</text>
<rect x="906" y="635" width="252" height="146" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="922" y="655" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="938" y="678" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">④ 装载快照 F</text>
<text x="928" y="715" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">完整性与业务检查</text>
<text x="928" y="744" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">记录真实恢复时间。</text>
<path d="M297 705 L324 705" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M585 705 L612 705" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M873 705 L900 705" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="42" y="809" width="1116" height="54" rx="12" fill="#F8EEDB"/>
<text x="64" y="839" fill="#9A641B" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">三项工作并行存在：随机审计 + 后台 scrubbing + 完整恢复演练。</text>
<path d="M42 876 L1158 876" fill="none" stroke="#D1D7DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="42" y="902" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" text-anchor="start">高性能存储 · P1  /  与正文配合阅读：前提、成本、失败边界</text>
<text x="1158" y="902" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" text-anchor="end">2026-09-16</text>
</svg>