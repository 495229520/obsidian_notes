<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 910" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>MSI-X 完成通知路径</title>
  <desc>NVMe 完成通知从设备 DMA 写 CQE、MSI-X 消息、中断控制器定向,到提交核收割 CQ 的完整路径;每队列独立向量的亲和拓扑与错配代价;中断合并的取舍。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="910" fill="rgb(245, 244, 237)"/>

  <text x="48" y="44" font-size="22" font-weight="700" fill="#2B2A26">MSI-X：完成通知怎样找到正确的 CPU</text>
  <text x="48" y="70" font-size="13" fill="#6B675C">中断不搬数据，只把「CQE 已可见」告诉某个核 —— 通知回到提交核 = 上下文还热；跨核 = IPI + 缓存行迁移</text>

  <!-- A · 通知路径 -->
  <text x="48" y="102" font-size="13" font-weight="700" fill="#2B2A26">A · 一次完成通知的完整路径：两次 posted 内存写，设备一次都不等</text>

  <rect x="64" y="116" width="200" height="68" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="164" y="138" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">① 设备 DMA 写 CQE</text>
  <text x="164" y="156" font-size="10.5" fill="#733428" text-anchor="middle">Memory Write TLP → 主机 DRAM</text>
  <text x="164" y="172" font-size="10.5" fill="#733428" text-anchor="middle">相位位翻转（3.2）</text>

  <rect x="292" y="116" width="210" height="68" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="397" y="138" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">② 设备发 MSI-X 消息</text>
  <text x="397" y="156" font-size="10.5" fill="#733428" text-anchor="middle">同样是 Memory Write TLP</text>
  <text x="397" y="172" font-size="10.5" fill="#733428" text-anchor="middle">目标：该向量的 Message Address</text>

  <rect x="530" y="116" width="200" height="68" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="630" y="138" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">③ 中断控制器定向</text>
  <text x="630" y="156" font-size="10.5" fill="#2C4460" text-anchor="middle">按 MSI-X 表项把消息</text>
  <text x="630" y="172" font-size="10.5" fill="#2C4460" text-anchor="middle">投递成 Core N 的一个向量</text>

  <rect x="758" y="116" width="200" height="68" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="858" y="138" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">④ Core N：hardirq</text>
  <text x="858" y="156" font-size="10.5" fill="#2C4460" text-anchor="middle">打断当前指令流</text>
  <text x="858" y="172" font-size="10.5" fill="#2C4460" text-anchor="middle">进入 nvme_irq()</text>

  <rect x="986" y="116" width="196" height="68" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1084" y="138" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">⑤ 收割 CQ → 唤醒</text>
  <text x="1084" y="156" font-size="10.5" fill="#24473F" text-anchor="middle">按相位位批量扫 CQE</text>
  <text x="1084" y="172" font-size="10.5" fill="#24473F" text-anchor="middle">唤醒睡眠线程 / 完成回调</text>

  <line x1="264" y1="150" x2="288" y2="150" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="502" y1="150" x2="526" y2="150" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="730" y1="150" x2="754" y2="150" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="958" y1="150" x2="982" y2="150" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="64" y="200" width="1118" height="58" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
  <text x="80" y="224" font-size="11.5" font-weight="700" fill="#6B4E28">关键保序【事实】：同一设备发出的 posted Memory Write 不互相超车 —— ② 不会跑到 ① 前面到达。</text>
  <text x="80" y="244" font-size="11.5" fill="#6B4E28">CPU 看到中断时，CQE 必定已在内存中可见：设备侧 ≈ store-release 发布，ISR 读 CQE ≈ load-acquire（类比，非等同）。</text>

  <!-- B · 亲和拓扑 -->
  <text x="48" y="296" font-size="13" font-weight="700" fill="#2B2A26">B · 每条 CQ 绑独立向量：完成精确送回提交核 vs 错配的代价</text>

  <rect x="56" y="310" width="556" height="288" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="74" y="334" font-size="12" font-weight="700" fill="#2F6B5E">亲和正确：提交核 = 完成核</text>

  <rect x="76" y="350" width="110" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="131" y="378" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">Core 0</text>
  <rect x="76" y="414" width="110" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="131" y="442" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">Core 1</text>
  <rect x="76" y="478" width="110" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="131" y="506" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">Core 2</text>

  <rect x="240" y="350" width="150" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="315" y="371" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">SQ0 / CQ0</text>
  <text x="315" y="388" font-size="10" fill="#2C4460" text-anchor="middle">MSI-X vec 1 → CPU 0</text>
  <rect x="240" y="414" width="150" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="315" y="435" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">SQ1 / CQ1</text>
  <text x="315" y="452" font-size="10" fill="#2C4460" text-anchor="middle">MSI-X vec 2 → CPU 1</text>
  <rect x="240" y="478" width="150" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="315" y="499" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">SQ2 / CQ2</text>
  <text x="315" y="516" font-size="10" fill="#2C4460" text-anchor="middle">MSI-X vec 3 → CPU 2</text>

  <rect x="452" y="350" width="130" height="176" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="517" y="428" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">NVMe 设备</text>
  <text x="517" y="446" font-size="10" fill="#733428" text-anchor="middle">每 CQ 一个向量</text>

  <line x1="190" y1="374" x2="236" y2="374" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="438" x2="236" y2="438" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="502" x2="236" y2="502" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="448" y1="374" x2="394" y2="374" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="448" y1="438" x2="394" y2="438" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="448" y1="502" x2="394" y2="502" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="76" y="556" font-size="10.5" fill="#4A473F">提交、执行返回、完成处理都在同一个核：请求上下文还在本核 L1/L2，</text>
  <text x="76" y="574" font-size="10.5" fill="#4A473F">无跨核唤醒、无缓存行迁移 ≈ sharded executor（5.12 thread-per-core）</text>

  <rect x="628" y="310" width="556" height="288" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="646" y="334" font-size="12" font-weight="700" fill="#A64B3C">错配：完成落到别的核</text>

  <rect x="648" y="356" width="150" height="56" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.4"/>
  <text x="723" y="379" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">Core 0</text>
  <text x="723" y="397" font-size="10" fill="#4A473F" text-anchor="middle">提交线程在此睡眠</text>

  <rect x="852" y="356" width="160" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="932" y="379" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">Core 3 收到中断</text>
  <text x="932" y="397" font-size="10" fill="#733428" text-anchor="middle">在这里处理 CQE</text>

  <rect x="1052" y="356" width="112" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1108" y="379" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">设备完成</text>
  <text x="1108" y="397" font-size="10" fill="#733428" text-anchor="middle">向量指向 CPU 3</text>

  <line x1="1048" y1="384" x2="1016" y2="384" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <line x1="848" y1="384" x2="802" y2="384" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <text x="825" y="374" font-size="9.5" fill="#A64B3C" text-anchor="middle">跨核唤醒 IPI</text>

  <text x="648" y="446" font-size="10.5" fill="#4A473F">· 请求上下文的缓存行从 Core 0 迁到 Core 3，处理完再迁回来</text>
  <text x="648" y="466" font-size="10.5" fill="#4A473F">· 唤醒多一跳处理器间中断（IPI）+ 目标核的调度延迟</text>
  <text x="648" y="486" font-size="10.5" fill="#4A473F">· 单笔只多零点几~几 μs，但高 IOPS 下持续发生，p99 整体上浮</text>
  <text x="648" y="518" font-size="10.5" font-weight="700" fill="#733428">常见诱因：irqbalance 迁走了向量（非 managed 场景）/</text>
  <text x="648" y="536" font-size="10.5" font-weight="700" fill="#733428">VM 里队列数少于核数被迫共享 / 手工绑核与队列映射不一致</text>
  <text x="648" y="568" font-size="10" fill="#6B675C">排查入口：/proc/interrupts 看 nvme 各向量落在哪个 CPU 计数增长</text>

  <!-- C · 中断合并 -->
  <text x="48" y="632" font-size="13" font-weight="700" fill="#2B2A26">C · 中断合并（Set Features 08h）：攒一批 CQE 再打一次中断</text>

  <rect x="56" y="646" width="1128" height="176" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="100" y1="716" x2="1150" y2="716" stroke="#9B968A" stroke-width="1.4"/>

  <circle cx="150" cy="716" r="5" fill="#A64B3C"/>
  <circle cx="190" cy="716" r="5" fill="#A64B3C"/>
  <circle cx="230" cy="716" r="5" fill="#A64B3C"/>
  <circle cx="270" cy="716" r="5" fill="#A64B3C"/>
  <line x1="270" y1="708" x2="270" y2="678" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="270" y="668" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">中断 ×1</text>
  <text x="240" y="746" font-size="10.5" fill="#4A473F" text-anchor="middle">高负载：聚合阈值先到（如 4 条 CQE 触发一次）</text>
  <text x="240" y="764" font-size="10" fill="#6B675C" text-anchor="middle">中断次数 ÷4，每条平均只多等几 μs —— 划算</text>

  <circle cx="700" cy="716" r="5" fill="#A64B3C"/>
  <line x1="700" y1="724" x2="700" y2="740" stroke="#8A6A3A" stroke-width="1.2"/>
  <line x1="900" y1="724" x2="900" y2="740" stroke="#8A6A3A" stroke-width="1.2"/>
  <line x1="700" y1="736" x2="900" y2="736" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="800" y="756" font-size="10.5" fill="#6B4E28" text-anchor="middle">聚合时间窗（100 μs 粒度）</text>
  <line x1="900" y1="708" x2="900" y2="678" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="900" y="668" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">中断 ×1</text>
  <text x="920" y="776" font-size="10.5" fill="#4A473F" text-anchor="middle">低负载：凑不够阈值，等时间窗到期才触发</text>
  <text x="920" y="794" font-size="10" fill="#6B675C" text-anchor="middle">这条孤立 IO 凭空多等最多一个时间窗 —— 延迟敏感路径通常关掉</text>

  <text x="76" y="796" font-size="10.5" fill="#4A473F">≈ 生产者攒 N 个任务才 notify 一次：吞吐更好、单个任务响应变差【取舍】</text>

  <rect x="56" y="842" width="1128" height="46" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="76" y="862" font-size="11.5" font-weight="700" fill="#2B2A26">一句话：数据早已 DMA 到位，中断只是「叫醒服务」——</text>
  <text x="76" y="880" font-size="11.5" fill="#4A473F">通知走哪条路、回到哪个核、攒几个再叫，决定完成路径里软件那几 μs；设备越快，这几 μs 占比越大（0.6 / 5.6）</text>
</svg>
