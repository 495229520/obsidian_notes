<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 视觉系统对齐 9.7 / 9.2：
       底色 rgb(245,244,237)
       蓝 #E3EAF4 / #3D5A80 / #2C4460
       绿 #DCE9E3 / #2F6B5E / #24473F
       琥珀 #EFE7DA / #8A6A3A / #6B4E28
       红 #F0E0DB / #A64B3C / #733428
       中性 #F1EFE8 / #D8D5C8 / #4A473F / #6B675C / #2B2A26
       面板底 #FBFBF6 · 实心三角箭头 #5A564B -->
  <title>fio Benchmark Matrix：先固定路径，再扫描负载</title>
  <desc>上半：六个正交受控变量。下半：fio worker 经 ioengine、VFS，分 Page Cache 与 O_DIRECT 两路进入块层，再分本地 NVMe 与网络存储；标出 slat/clat 边界、旁路对账与结果成立前提。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">fio Benchmark Matrix：先固定路径，再扫描负载</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">同一个 IOPS 数字，可能来自 Page Cache、本地 NVMe，也可能包含网络与远端设备——条件不固定，结果不可复现</text>

  <!-- ============ Panel A：六个正交变量 ============ -->
  <text x="48" y="108" font-size="13" font-weight="700" fill="#4A473F">A · 六个正交变量：一次只改一个，才能把结果变化归因到对应机制</text>

  <rect x="48" y="120" width="180" height="88" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="138" y="144" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">访问模式 rw</text>
  <text x="138" y="166" font-size="10.5" fill="#2C4460" text-anchor="middle">顺序 / 随机</text>
  <text x="138" y="186" font-size="10.5" fill="#2C4460" text-anchor="middle">读写比 · 写后 GC</text>

  <rect x="244" y="120" width="180" height="88" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="334" y="144" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">请求大小 bs</text>
  <text x="334" y="166" font-size="10.5" fill="#2C4460" text-anchor="middle">4k · 16k · 128k · 1m</text>
  <text x="334" y="186" font-size="10.5" fill="#2C4460" text-anchor="middle">固定成本 vs 带宽摊销</text>

  <rect x="440" y="120" width="180" height="88" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="530" y="144" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">iodepth</text>
  <text x="530" y="166" font-size="10.5" fill="#24473F" text-anchor="middle">每 job 目标在途上限</text>
  <text x="530" y="186" font-size="10.5" fill="#24473F" text-anchor="middle">≠ 设备真实 QD</text>

  <rect x="636" y="120" width="180" height="88" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="726" y="144" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">numjobs</text>
  <text x="726" y="166" font-size="10.5" fill="#24473F" text-anchor="middle">并行 worker</text>
  <text x="726" y="186" font-size="10.5" fill="#24473F" text-anchor="middle">CPU / NUMA / 锁竞争</text>

  <rect x="832" y="120" width="180" height="88" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="922" y="144" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">缓存路径 direct</text>
  <text x="922" y="166" font-size="10.5" fill="#6B4E28" text-anchor="middle">0 = Page Cache</text>
  <text x="922" y="186" font-size="10.5" fill="#6B4E28" text-anchor="middle">1 = O_DIRECT 绕过</text>

  <rect x="1028" y="120" width="164" height="88" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="1110" y="144" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">工作集 · 时间</text>
  <text x="1110" y="166" font-size="10.5" fill="#6B4E28" text-anchor="middle">size / runtime</text>
  <text x="1110" y="186" font-size="10.5" fill="#6B4E28" text-anchor="middle">预热 · 稳态 · 盘温</text>

  <!-- Q_fio 提示条 -->
  <rect x="48" y="224" width="1144" height="40" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="248" font-size="11.5" fill="#4A473F">总并发窗口近似：Q_fio ≈ numjobs × iodepth　·　实际深度看 iodepth_level 与 iostat aqu-sz　·　自检 Q ≈ IOPS × latency_seconds</text>

  <!-- ============ Panel B：请求路径 ============ -->
  <text x="48" y="296" font-size="13" font-weight="700" fill="#4A473F">B · 请求路径：先固定走哪条路，再谈 IOPS 数字代表什么</text>

  <!-- 主路径面板 -->
  <rect x="48" y="308" width="1144" height="280" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <!-- 前半：worker → engine → VFS -->
  <rect x="68" y="400" width="140" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="138" y="424" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">fio worker</text>
  <text x="138" y="446" font-size="10.5" fill="#2C4460" text-anchor="middle">准备 IOUnit</text>
  <path d="M208,432 L230,432" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="232" y="400" width="150" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="307" y="424" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">ioengine</text>
  <text x="307" y="446" font-size="10.5" fill="#2C4460" text-anchor="middle">io_uring / libaio / sync</text>
  <path d="M382,432 L404,432" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="406" y="400" width="140" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="476" y="424" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">VFS / 文件系统</text>
  <text x="476" y="446" font-size="10.5" fill="#2C4460" text-anchor="middle">映射 · 锁 · 元数据</text>

  <!-- 分叉：Page Cache / O_DIRECT -->
  <path d="M546,432 L570,432 L570,360 L590,360" fill="none" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arra)"/>
  <path d="M546,432 L570,432 L570,504 L590,504" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrg)"/>

  <rect x="592" y="332" width="150" height="56" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="667" y="354" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">Page Cache</text>
  <text x="667" y="374" font-size="10.5" fill="#6B4E28" text-anchor="middle">direct=0 · 可命中内存</text>

  <rect x="592" y="476" width="150" height="56" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="667" y="498" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">O_DIRECT</text>
  <text x="667" y="518" font-size="10.5" fill="#24473F" text-anchor="middle">direct=1 · 绕过缓存</text>

  <!-- 汇合到块层 -->
  <path d="M742,360 L762,360 L762,432 L782,432" fill="none" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arra)"/>
  <path d="M742,504 L762,504 L762,432 L782,432" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrg)"/>

  <rect x="784" y="400" width="140" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="854" y="424" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">块层 blk-mq</text>
  <text x="854" y="446" font-size="10.5" fill="#2C4460" text-anchor="middle">排队 · tag · 调度</text>

  <!-- 分叉：本地 / 网络 -->
  <path d="M924,432 L948,432 L948,360 L968,360" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrg)"/>
  <path d="M924,432 L948,432 L948,504 L968,504" fill="none" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arra)"/>

  <rect x="970" y="332" width="190" height="56" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1065" y="354" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">本地 NVMe</text>
  <text x="1065" y="374" font-size="10.5" fill="#24473F" text-anchor="middle">驱动 / PCIe / SSD</text>

  <rect x="970" y="476" width="190" height="56" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="1065" y="498" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">网络存储</text>
  <text x="1065" y="518" font-size="10.5" fill="#6B4E28" text-anchor="middle">TCP·RDMA → target → 远端</text>

  <!-- slat / clat 标注 -->
  <path d="M68,388 L68,378 L382,378 L382,388" fill="none" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="225" y="370" font-size="10.5" font-weight="700" fill="#3D5A80" text-anchor="middle">slat：提交准备与进入引擎</text>

  <path d="M232,548 L232,558 L1160,558 L1160,548" fill="none" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="696" y="576" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">clat：引擎接受 → fio 收割完成；网络目标时跨客户端、网络与服务端</text>

  <!-- 关键说明 -->
  <text x="68" y="340" font-size="11" fill="#6B675C">两个易混边界：direct=0 命中缓存测的是内存路径；direct=1 只绕过 Page Cache，不绕过 VFS / 块层 / 驱动</text>

  <!-- ============ 对账 + 前提 ============ -->
  <text x="48" y="620" font-size="13" font-weight="700" fill="#4A473F">C · 结果要与旁路观测对账 · 条件一起记录才可复现</text>

  <rect x="48" y="632" width="268" height="96" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="182" y="656" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">fio 输出</text>
  <text x="182" y="678" font-size="10.5" fill="#24473F" text-anchor="middle">IOPS / BW / clat 分位数</text>
  <text x="182" y="698" font-size="10.5" fill="#24473F" text-anchor="middle">iodepth_level · CPU 占用</text>

  <rect x="332" y="632" width="268" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="466" y="656" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">本机 OS</text>
  <text x="466" y="678" font-size="10.5" fill="#2C4460" text-anchor="middle">iostat · CPU · IRQ · NUMA</text>
  <text x="466" y="698" font-size="10.5" fill="#2C4460" text-anchor="middle">Page Cache / writeback</text>

  <rect x="616" y="632" width="268" height="96" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="750" y="656" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">设备状态</text>
  <text x="750" y="678" font-size="10.5" fill="#6B4E28" text-anchor="middle">SMART · 温度 · GC · 错误</text>
  <text x="750" y="698" font-size="10.5" fill="#6B4E28" text-anchor="middle">空盘预处理与稳态</text>

  <rect x="900" y="632" width="292" height="96" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.5"/>
  <text x="1046" y="656" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">网络与服务端</text>
  <text x="1046" y="678" font-size="10.5" fill="#4A473F" text-anchor="middle">重传 · 拥塞 · NIC 队列</text>
  <text x="1046" y="698" font-size="10.5" fill="#4A473F" text-anchor="middle">target 队列 · 远端 iostat</text>

  <rect x="48" y="748" width="1144" height="112" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="68" y="774" font-size="12" font-weight="700" fill="#733428">结果成立的前提</text>
  <text x="68" y="798" font-size="11" fill="#733428">① 目标、路径、负载、时间状态必须一起记录；只改一个变量，才能归因。</text>
  <text x="68" y="820" font-size="11" fill="#733428">② QD 增加后若吞吐封顶、队列与 p99 继续增长 → 新增并发已变成排队，不是有效并行。</text>
  <text x="68" y="842" font-size="11" fill="#733428">③ --client/--server 只是远程控制 worker，不会把本地文件 IO 自动变成网络 IO。</text>
</svg>
