<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 14px; fill: #435363; text-anchor: middle; }
      .small { font-size: 13px; fill: #526475; text-anchor: middle; }
    </style>
  </defs>
  <text x="56" y="54" class="title">CUDA / Triton / cuBLAS 进入同一张表</text>
  <text x="56" y="83" class="subtitle">不同 implementation，共享同一套输入、shape、dtype、timing 和 correctness 字段</text>

  <rect x="70" y="152" width="180" height="126" rx="8" fill="#e8f0f6" stroke="#86a8c4" stroke-width="2"/>
  <text x="160" y="190" class="head">Reference</text>
  <text x="160" y="224" class="body">PyTorch / CPU</text>
  <text x="160" y="250" class="small">fixed seed</text>

  <rect x="326" y="120" width="190" height="190" rx="8" fill="#f7e8e5" stroke="#c98e83" stroke-width="2"/>
  <text x="421" y="158" class="head">CUDA kernels</text>
  <text x="421" y="196" class="body">naive</text>
  <text x="421" y="222" class="body">tiled</text>
  <text x="421" y="248" class="body">reg-block</text>

  <rect x="586" y="120" width="190" height="190" rx="8" fill="#efe8f6" stroke="#aa92c5" stroke-width="2"/>
  <text x="681" y="158" class="head">Triton v1</text>
  <text x="681" y="196" class="body">program tile</text>
  <text x="681" y="222" class="body">mask boundary</text>
  <text x="681" y="248" class="body">BLOCK sweep</text>

  <rect x="846" y="120" width="190" height="190" rx="8" fill="#e7efe3" stroke="#84a96d" stroke-width="2"/>
  <text x="941" y="158" class="head">cuBLAS</text>
  <text x="941" y="196" class="body">SGEMM</text>
  <text x="941" y="222" class="body">row-major wrapper</text>
  <text x="941" y="248" class="body">ratio baseline</text>

  <line x1="262" y1="215" x2="312" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="528" y1="215" x2="572" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="788" y1="215" x2="832" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="156" y="382" width="808" height="82" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="560" y="416" class="head">benchmark_results.csv</text>
  <text x="560" y="444" class="body">implementation, M, N, K, dtype, layout, time_ms, TFLOPS, ratio_vs_cublas, correct, config</text>
</svg>
