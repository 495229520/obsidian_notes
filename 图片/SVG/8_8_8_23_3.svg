<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<title id="title">1 MiB 如何切成五段：大小限制与两端 MR 边界共同生效</title>
<desc id="desc">按比例显示本地384KiB边界、远端640KiB边界和五个slice，长度为256、128、256、256、128KiB。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="740" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">1 MiB 如何切成五段：大小限制与两端 MR 边界共同生效</text>
<text x="48" y="76" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">教学参数：S = 256 KiB，F = 64 KiB；不是 Mooncake 默认配置</text>
<line x1="48" y1="96" x2="1192" y2="96" stroke="#D8D5C8" stroke-width="1"/>
<text x="230.0" y="135" font-size="12" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">0</text>
<line x1="230.0" y1="142" x2="230.0" y2="335" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="454.0" y="135" font-size="12" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">256</text>
<line x1="454.0" y1="142" x2="454.0" y2="335" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="566.0" y="135" font-size="12" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">384</text>
<line x1="566.0" y1="142" x2="566.0" y2="335" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="790.0" y="135" font-size="12" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">640</text>
<line x1="790.0" y1="142" x2="790.0" y2="335" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1014.0" y="135" font-size="12" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">896</text>
<line x1="1014.0" y1="142" x2="1014.0" y2="335" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1126.0" y="135" font-size="12" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">1024</text>
<line x1="1126.0" y1="142" x2="1126.0" y2="335" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="68" y="135" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">单位：KiB</text>
<text x="68" y="188" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">A 本地 MR</text>
<rect x="230.0" y="160" width="336.0" height="44" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="398.0" y="188" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">MR 0 · 384 KiB</text>
<rect x="566.0" y="160" width="560.0" height="44" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="846.0" y="188" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">MR 1 · 640 KiB</text>
<text x="68" y="252" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">B 远端 MR</text>
<rect x="230.0" y="224" width="560.0" height="44" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
