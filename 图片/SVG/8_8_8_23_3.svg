<text x="726" y="462" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">MR 0</text>
<text x="898" y="462" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">常规块长</text>
<line x1="68" y1="473" x2="1172" y2="473" stroke="#D8D5C8" stroke-width="0.8"/>
<text x="84" y="496" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">1</text>
<text x="228" y="496" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">256</text>
<text x="400" y="496" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">128</text>
<text x="566" y="496" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">MR 0</text>
<text x="726" y="496" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">MR 0</text>
<text x="898" y="496" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">本地边界</text>
<line x1="68" y1="507" x2="1172" y2="507" stroke="#D8D5C8" stroke-width="0.8"/>
<text x="84" y="530" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">2</text>
<text x="228" y="530" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">384</text>
<text x="400" y="530" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">256</text>
<text x="566" y="530" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">MR 1</text>
<text x="726" y="530" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">MR 0</text>
<text x="898" y="530" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">远端边界</text>
<line x1="68" y1="541" x2="1172" y2="541" stroke="#D8D5C8" stroke-width="0.8"/>
<text x="84" y="564" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">3</text>
<text x="228" y="564" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">640</text>
<text x="400" y="564" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">256</text>
<text x="566" y="564" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">MR 1</text>
<text x="726" y="564" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">MR 1</text>
<text x="898" y="564" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">常规块长</text>
<line x1="68" y1="575" x2="1172" y2="575" stroke="#D8D5C8" stroke-width="0.8"/>
<text x="84" y="598" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">4</text>
<text x="228" y="598" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">896</text>
<text x="400" y="598" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">128</text>
<text x="566" y="598" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">MR 1</text>
<text x="726" y="598" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">MR 1</text>
<text x="898" y="598" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">请求尾段</text>
<line x1="68" y1="609" x2="1172" y2="609" stroke="#D8D5C8" stroke-width="0.8"/>
<line x1="48" y1="670" x2="1192" y2="670" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="696" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">源码先按 S 与尾段阈值 F 决定候选长度，再按能查到的本地/远端 MR 剩余范围收紧。</text>
<text x="48" y="717" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">总量校验：1024 KiB；slice ≠ 网络包 ≠ KV block ≠ NIC。</text>
</svg>