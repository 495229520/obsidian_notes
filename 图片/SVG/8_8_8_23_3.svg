<text x="400" y="426" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">长度 / KiB</text>
<text x="566" y="426" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">本地 MR</text>
<text x="726" y="426" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">远端 MR</text>
<text x="898" y="426" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">停止原因</text>
