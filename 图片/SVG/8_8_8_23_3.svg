<rect x="790.0" y="224" width="336.0" height="44" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="958.0" y="252" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">MR 1 · 384 KiB</text>
<text x="68" y="316" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">最终 slices</text>
<rect x="230.0" y="288" width="224.0" height="44" rx="2" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="342.0" y="316" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="400" data-role="body">S0 · 256</text>
<rect x="454.0" y="288" width="112.0" height="44" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
<text x="510.0" y="316" font-size="13" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body">S1 · 128</text>
<rect x="566.0" y="288" width="224.0" height="44" rx="2" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="678.0" y="316" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="400" data-role="body">S2 · 256</text>
<rect x="790.0" y="288" width="224.0" height="44" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
<text x="902.0" y="316" font-size="13" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body">S3 · 256</text>
<rect x="1014.0" y="288" width="112.0" height="44" rx="2" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="1070.0" y="316" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="400" data-role="body">S4 · 128</text>
<text x="68" y="382" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">每段都用自己的地址范围和匹配 key</text>
<rect x="68" y="401" width="1104" height="37" rx="2" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="84" y="426" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">slice</text>
