<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">OFI 对象：所属范围不等于绑定关系</title><desc id="desc">左侧展示Fabric包含Domain、EQ、Passive Endpoint，Domain包含Active Endpoint、CQ、AV、MR；右侧为provider分层。虚线表示可选关联。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">OFI 对象：所属范围不等于绑定关系</text>
<text x="48" y="83" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">Fabric / Domain 管资源边界；Endpoint 使用队列、地址与注册内存</text>
<rect x="48" y="115" width="784" height="445" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="70" y="145" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · Fabric 资源范围</text>
<rect x="344" y="162" width="217" height="50" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="452.5" y="182.05" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">Passive Endpoint</text>
<text x="452.5" y="201.05" font-size="13" font-weight="400" fill="#4A473F" text-anchor="middle">MSG 监听入口</text>
<rect x="607" y="162" width="200" height="50" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="707.0" y="182.05" font-size="13" font-weight="700" fill="#4F446B" text-anchor="middle">EQ</text>
<text x="707.0" y="201.05" font-size="13" font-weight="400" fill="#4F446B" text-anchor="middle">连接 / 控制事件</text>
<line x1="562" y1="186" x2="603" y2="186" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="72" y="234" width="735" height="304" rx="8" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.2"/>
<text x="94" y="264" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">Domain · 共享与注册边界</text>
<rect x="346" y="298" width="194" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="443.0" y="324.75" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle">Active Endpoint</text>
<text x="443.0" y="345.75" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle">TX / RX 上下文</text>
<path d="M 706,213 L 706,280 L 502,280 L 502,296" fill="none" stroke="#6B5B95" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="581" y="266" font-size="12" font-weight="400" fill="#6B5B95" text-anchor="start">可绑定 EQ</text>
<rect x="98" y="438" width="181" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="188.5" y="465.05" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">CQ</text>
<text x="188.5" y="484.05" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle">数据完成 / 异步错误</text>
<rect x="331" y="438" width="181" height="64" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="421.5" y="465.05" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">AV</text>
<text x="421.5" y="484.05" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">对端地址 → fi_addr_t</text>
<rect x="589" y="438" width="191" height="64" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="684.5" y="465.05" font-size="13" font-weight="700" fill="#4F446B" text-anchor="middle">MR</text>
<text x="684.5" y="484.05" font-size="13" font-weight="400" fill="#4F446B" text-anchor="middle">内存范围 / 访问资格</text>
<path d="M 367,364 L 367,405 L 188,405 L 188,435" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M 435,364 L 435,435" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M 519,364 L 519,405 L 685,405 L 685,435" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="189" y="396" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">完成绑定</text>
<text x="453" y="395" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="start">RDM 地址</text>
<text x="678" y="396" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">数据引用</text>
<text x="100" y="525" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start">MR 的 endpoint 绑定仅在要求时建立</text>
<rect x="856" y="115" width="336" height="445" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="878" y="145" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · Provider 可以组合</text>
<rect x="880" y="168" width="288" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="1024.0" y="189.05" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">上层应用 / 运行时</text>
<text x="1024.0" y="208.05" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle">MPI · RPC · Storage</text>
<line x1="1024" y1="221" x2="1024" y2="244" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="880" y="248" width="288" height="52" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="1024.0" y="269.05" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">libfabric / OFI API</text>
<text x="1024.0" y="288.05" font-size="13" font-weight="400" fill="#4A473F" text-anchor="middle">声明服务与契约</text>
<line x1="1024" y1="301" x2="1024" y2="324" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="880" y="328" width="288" height="52" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="1024.0" y="349.05" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">Utility Provider</text>
<text x="1024.0" y="368.05" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">示例：ofi_rxm</text>
<line x1="1024" y1="381" x2="1024" y2="404" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="880" y="408" width="288" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1024.0" y="429.05" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">Core Provider</text>
<text x="1024.0" y="448.05" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle">示例：verbs</text>
<line x1="1024" y1="461" x2="1024" y2="484" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="880" y="490" width="288" height="52" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="1024.0" y="511.05" font-size="13" font-weight="700" fill="#4F446B" text-anchor="middle">具体数据路径</text>
<text x="1024.0" y="530.05" font-size="13" font-weight="400" fill="#4F446B" text-anchor="middle">RNIC / 其他实现</text>
<rect x="48" y="582" width="1144" height="59" rx="8" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="73" y="605" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">读图边界</text>
<text x="244" y="620" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">Domain ≠ 固定一个端口</text>
<text x="569" y="620" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">Endpoint ≠ 固定一个 QP</text>
<text x="908" y="620" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">RMA 能力 ≠ 原生 RDMA</text>
<line x1="48" y1="660" x2="1192" y2="660" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="683" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start">依据：libfabric 2.7.0 对象与 RxM 手册；图为抽象关系，不是某块网卡的资源清单。</text>
</svg>