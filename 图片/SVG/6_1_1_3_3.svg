<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>TryParse 解析决策流</title>
  <desc>自上而下短路检查：缓冲区长度、Magic、BodyLen、完整性、Checksum，任一命中即返回对应结果，全部通过则 Complete。</desc>
  <rect x="0" y="0" width="760" height="760" fill="rgb(245, 244, 237)"/>

  <text x="380" y="40" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">TryParse 解析决策（自上而下短路）</text>

  <!-- 决策列 -->
  <g>
    <rect x="60" y="80" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="190" y="102" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">缓冲区 &lt; 10 字节?</text>
  </g>
  <g>
    <rect x="60" y="196" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="190" y="218" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Magic != 0xFEFF?</text>
  </g>
  <g>
    <rect x="60" y="312" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="190" y="334" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">BodyLen &lt; 4?</text>
  </g>
  <g>
    <rect x="60" y="428" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="190" y="450" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">缓冲区 &lt; packetSize?</text>
  </g>
  <g>
    <rect x="60" y="544" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="190" y="566" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Checksum 不匹配?</text>
  </g>

  <!-- 结果列 -->
  <g>
    <rect x="420" y="80" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="570" y="98" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">NeedMoreData</text>
    <text x="570" y="118" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">consumed = 0</text>
  </g>
  <g>
    <rect x="420" y="196" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="570" y="214" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Invalid</text>
    <text x="570" y="234" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central">consumed = 0</text>
  </g>
  <g>
    <rect x="420" y="312" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="570" y="330" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Invalid</text>
    <text x="570" y="350" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central">consumed = 0</text>
  </g>
  <g>
    <rect x="420" y="428" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="570" y="446" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">NeedMoreData</text>
    <text x="570" y="466" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">consumed = 0</text>
  </g>
  <g>
    <rect x="420" y="544" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="570" y="562" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Invalid ★</text>
    <text x="570" y="582" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central">consumed = packetSize</text>
  </g>

  <!-- 全部通过 -->
  <g>
    <rect x="60" y="660" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="210" y="678" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Complete（全部通过）</text>
    <text x="210" y="698" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">consumed = packetSize</text>
  </g>

  <!-- 是：横向到结果 -->
  <path d="M320 102 L420 102" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="90" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">是</text>
  <path d="M320 218 L420 218" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="206" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">是</text>
  <path d="M320 334 L420 334" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="322" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">是</text>
  <path d="M320 450 L420 450" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="438" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">是</text>
  <path d="M320 566 L420 566" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="554" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">是</text>

  <!-- 否：纵向下落 -->
  <path d="M190 124 L190 196" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="202" y="160" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">否</text>
  <path d="M190 240 L190 312" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="202" y="276" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">否</text>
  <path d="M190 356 L190 428" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="202" y="392" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">否</text>
  <path d="M190 472 L190 544" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="202" y="508" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">否</text>
  <path d="M190 588 L190 660" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="202" y="624" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">否</text>
</svg>
