<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>PD 分离下的 KV Cache 网络传输总体架构</title>
  <desc>控制面先预留目标 slot 与 credit，数据面按 chunk 异步流水与 Prefill 计算重叠，目标端完成 CUDA 可见性与校验 barrier 后才允许 Decode，失败按剩余 TTFT 预算阶梯降级。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/>
    </marker>
  </defs>

  <!-- 背景画布 -->
  <rect x="0" y="0" width="1240" height="820" fill="rgb(245, 244, 237)"/>

  <!-- 顶部主副标题 -->
  <text x="48" y="44" font-size="22" font-weight="700" fill="#2B2A26">PD 分离下的 KV Cache 网络传输架构：先预留、再流水、后提交</text>
  <text x="48" y="70" font-size="13" fill="#6B675C">传输主线：HBM 注册切片 → GPUDirect 多 Rail 搬运 → 目标设备可见性与校验 → 全请求 Commit Barrier 准入</text>

  <!-- ============ 顶部控制面：Conductor / Router 协商流程 ============ -->
  <rect x="48" y="92" width="1144" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="68" y="114" font-size="13" font-weight="700" fill="#3C3489">控制面 · Conductor &amp; Router</text>
  <text x="68" y="136" font-size="11" fill="#3C3489">① 请求到达与 TTFT 预算检查</text>

  <rect x="270" y="104" width="230" height="42" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
  <text x="282" y="122" font-size="11" font-weight="700" fill="#3C3489">② 选 P/D 拓扑与首选 Rail</text>
  <text x="282" y="137" font-size="9.5" fill="#6B675C">NUMA 亲和 + PCIe 拓扑对齐</text>

  <rect x="540" y="104" width="270" height="42" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
  <text x="552" y="122" font-size="11" font-weight="700" fill="#3C3489">③ 目标预留 Reservation</text>
  <text x="552" y="137" font-size="9.5" fill="#6B675C">分配 slot + 代次 generation + credit</text>

  <rect x="850" y="104" width="322" height="42" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
  <text x="862" y="122" font-size="11" font-weight="700" fill="#3C3489">④ 交换描述符与 rkey</text>
  <text x="862" y="137" font-size="9.5" fill="#6B675C">描述符：offset / bytes / layout / epoch</text>

  <line x1="236" y1="125" x2="262" y2="125" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="506" y1="125" x2="532" y2="125" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="816" y1="125" x2="842" y2="125" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- ============ 中部三大核心节点面板 ============ -->

  <!-- Panel A: Prefill Node -->
  <rect x="48" y="174" width="344" height="380" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="68" y="200" font-size="14" font-weight="700" fill="#2C4460">A · Prefill 节点（算力与生产端）</text>
  <text x="68" y="218" font-size="10.5" fill="#2C4460">流水生产不可变 Chunk，边算边发</text>
  <line x1="68" y1="228" x2="372" y2="228" stroke="#3D5A80" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- A1: 预注册 HBM Slab -->
  <rect x="64" y="238" width="312" height="114" rx="6" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.9"/>
  <text x="76" y="258" font-size="11.5" font-weight="700" fill="#2C4460">已注册 HBM Slab（离线注册 MR）</text>
  
  <rect x="76" y="268" width="80" height="26" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="116" y="285" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">Chunk 0 · READY</text>

  <rect x="164" y="268" width="80" height="26" rx="4" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1"/>
  <text x="204" y="285" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">Chunk 1 · CALC</text>

  <rect x="252" y="268" width="112" height="26" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="308" y="285" font-size="10" fill="#4A473F" text-anchor="middle">Chunk 2..N · PENDING</text>

  <text x="76" y="312" font-size="10" fill="#2C4460">· CUDA Event 保证写入完成</text>
  <text x="76" y="328" font-size="10" fill="#2C4460">· ReadyLocal：不可变、校验就绪</text>
  <text x="76" y="344" font-size="9.5" fill="#6B675C">· 算 Chunk 1 时异步发 Chunk 0</text>

  <!-- A2: 源端保留区 Source Retention -->
  <rect x="64" y="362" width="312" height="88" rx="6" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.9"/>
  <text x="76" y="382" font-size="11.5" font-weight="700" fill="#2C4460">源副本保留区（Source Retention）</text>
  <text x="76" y="402" font-size="10" fill="#2C4460">· 严禁 post 后立即 free 显存</text>
  <text x="76" y="418" font-size="10" fill="#2C4460">· 保留至收到对端 Commit ACK</text>
  <text x="76" y="434" font-size="9.5" fill="#A64B3C">· 显存高水位时 D2H 至 DRAM</text>

  <!-- A3: 发送代理 -->
  <rect x="64" y="460" width="312" height="80" rx="6" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.9"/>
  <text x="76" y="480" font-size="11.5" font-weight="700" fill="#2C4460">Transfer Agent（发送调度）</text>
  <text x="76" y="500" font-size="10" fill="#2C4460">· 切分 16 KiB 传输分片</text>
  <text x="76" y="516" font-size="10" fill="#2C4460">· 受限于目标 Rail Credit</text>
  <text x="76" y="532" font-size="9.5" fill="#6B675C">· 维护重试索引与超时计时</text>

  <!-- Panel B: Network Fabric -->
  <rect x="424" y="174" width="392" height="380" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="444" y="200" font-size="14" font-weight="700" fill="#24473F">B · 传输引擎与 RDMA 网络织巢</text>
  <text x="444" y="218" font-size="10.5" fill="#24473F">Multi-Rail 条带化、GDR 直通与背压控制</text>
  <line x1="444" y1="228" x2="796" y2="228" stroke="#2F6B5E" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- B1: GDR 快路径 -->
  <rect x="440" y="238" width="360" height="138" rx="6" fill="#FFFFFF" stroke="#2F6B5E" stroke-width="0.9"/>
  <text x="452" y="258" font-size="11.5" font-weight="700" fill="#24473F">快路径 · GPUDirect RDMA (P2P PCIe)</text>

  <!-- Rail 0 & Rail 1 -->
  <rect x="452" y="268" width="160" height="42" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="0.8"/>
  <text x="460" y="285" font-size="10" font-weight="700" fill="#24473F">Preferred Rail 0 (400G)</text>
  <text x="460" y="301" font-size="9.5" fill="#2F6B5E">Primary QP · 低跳步传输</text>

  <rect x="626" y="268" width="164" height="42" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="0.8"/>
  <text x="634" y="285" font-size="10" font-weight="700" fill="#24473F">Secondary Rail 1 (400G)</text>
  <text x="634" y="301" font-size="9.5" fill="#2F6B5E">备选/聚合 · 故障无缝切路径</text>

  <text x="452" y="332" font-size="10" fill="#24473F">· 在途量 = min(BDP, Credit)</text>
  <text x="452" y="348" font-size="10" fill="#24473F">· PFC / DCQCN 拥塞流控保障</text>
  <text x="452" y="364" font-size="9.5" fill="#6B675C">· DMA 直写入目标 HBM 预留区</text>

  <!-- B2: Host Bounce 降级 -->
  <rect x="440" y="386" width="360" height="92" rx="6" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="0.9"/>
  <text x="452" y="406" font-size="11.5" font-weight="700" fill="#6B4E28">慢路径 · Host Pinned DRAM Bounce</text>
  <text x="452" y="426" font-size="10" fill="#6B4E28">· HBM → D2H → NIC → H2D → HBM</text>
  <text x="452" y="442" font-size="10" fill="#6B4E28">· 无 P2P / GDR 异常 / 注册受限</text>
  <text x="452" y="458" font-size="9.5" fill="#A64B3C">· 占双倍 PCIe 带宽与 CUDA Event</text>

  <!-- B3: 传输完成通知 -->
  <rect x="440" y="488" width="360" height="52" rx="6" fill="#FFFFFF" stroke="#2F6B5E" stroke-width="0.9"/>
  <text x="452" y="508" font-size="11.5" font-weight="700" fill="#24473F">Transport Completion 通知</text>
  <text x="452" y="526" font-size="9.5" fill="#24473F">CQE / 通知仅代表链路传输完成，非业务可用</text>

  <!-- Panel C: Decode Node -->
  <rect x="848" y="174" width="344" height="380" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="868" y="200" font-size="14" font-weight="700" fill="#6B4E28">C · Decode 节点（接收与准入端）</text>
  <text x="868" y="218" font-size="10.5" fill="#6B4E28">预留槽位、设备可见性、Commit 门禁</text>
  <line x1="868" y1="228" x2="1172" y2="228" stroke="#8A6A3A" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- C1: Reserved HBM Slots -->
  <rect x="864" y="238" width="312" height="114" rx="6" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="0.9"/>
  <text x="876" y="258" font-size="11.5" font-weight="700" fill="#6B4E28">预留 HBM 槽位（带 Generation）</text>
  
  <rect x="876" y="268" width="90" height="26" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="921" y="285" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">Chunk 0 · ARRIVED</text>

  <rect x="976" y="268" width="96" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="1024" y="285" font-size="10" font-weight="700" fill="#3C3489" text-anchor="middle">Chunk 1 · INFLIGHT</text>

  <rect x="1082" y="268" width="84" height="26" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="1124" y="285" font-size="10" fill="#4A473F" text-anchor="middle">RESERVED</text>

  <text x="876" y="312" font-size="10" fill="#6B4E28">· generation 防旧包污染新槽位</text>
  <text x="876" y="328" font-size="10" fill="#6B4E28">· 提交前对 Decode 算子不可见</text>
  <text x="876" y="344" font-size="9.5" fill="#6B675C">· 维护 Ingest 队列与 Watermark</text>

  <!-- C2: Ingest & 校验发布 -->
  <rect x="864" y="362" width="312" height="88" rx="6" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="0.9"/>
  <text x="876" y="382" font-size="11.5" font-weight="700" fill="#6B4E28">Ingest 散布、重排与设备可见性</text>
  <text x="876" y="402" font-size="10" fill="#6B4E28">· Stream 同步确保 GPU 缓存刷入</text>
  <text x="876" y="418" font-size="10" fill="#6B4E28">· TP 散布 / 转换 + Checksum 校验</text>
  <text x="876" y="434" font-size="9.5" fill="#2F6B5E">· 置 Ready 位图并回 Commit ACK</text>

  <!-- C3: Commit Barrier -->
  <rect x="864" y="460" width="312" height="80" rx="6" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="0.9"/>
  <text x="876" y="480" font-size="11.5" font-weight="700" fill="#6B4E28">全请求 Commit Barrier（准入）</text>
  <text x="876" y="500" font-size="10" fill="#6B4E28">· 全部 Chunk Commit + 位图置满</text>
  <text x="876" y="516" font-size="10" font-weight="700" fill="#24473F">· KVReady → 进入 Decode 批处理</text>
  <text x="876" y="532" font-size="9.5" fill="#6B675C">· 首 Token 解码 / 归还 Credit</text>

  <!-- 中间连线 -->
  <!-- GDR Path Arrow -->
  <path d="M392,295 L436,295" fill="none" stroke="#2F6B5E" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="414" y="285" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">GDR</text>

  <path d="M816,295 L844,295" fill="none" stroke="#2F6B5E" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="832" y="285" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">DMA</text>

  <!-- Bounce Path Arrow -->
  <path d="M392,430 L436,430" fill="none" stroke="#8A6A3A" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-amber)"/>
  <text x="414" y="420" font-size="9.5" font-weight="700" fill="#8A6A3A" text-anchor="middle">D2H</text>

  <path d="M816,430 L844,430" fill="none" stroke="#8A6A3A" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-amber)"/>
  <text x="832" y="420" font-size="9.5" font-weight="700" fill="#8A6A3A" text-anchor="middle">H2D</text>

  <!-- Commit ACK Return Arrow (Bottom to Top/Left) -->
  <path d="M864,520 L400,520" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr-blue)"/>
  <text x="630" y="513" font-size="9.5" font-weight="700" fill="#3D5A80" text-anchor="middle">Commit ACK → 释放 Prefill 源副本 &amp; 归还 Credit</text>

  <!-- ============ 底部三大收口面板 ============ -->

  <!-- Panel D: 多级存储池 -->
  <rect x="48" y="574" width="374" height="180" rx="8" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.2"/>
  <text x="68" y="598" font-size="13" font-weight="700" fill="#2B2A26">D · 存储分层账本：速度 vs 容量</text>
  <line x1="68" y1="608" x2="402" y2="608" stroke="#9B968A" stroke-width="0.8"/>

  <text x="68" y="628" font-size="10.5" font-weight="700" fill="#0C447C">Prefill HBM</text>
  <text x="160" y="628" font-size="10" fill="#4A473F">生产源 · 保留至 Commit</text>
  <line x1="300" y1="624" x2="400" y2="624" stroke="#185FA5" stroke-width="6" stroke-linecap="round"/>

  <text x="68" y="654" font-size="10.5" font-weight="700" fill="#633806">Pinned DRAM</text>
  <text x="160" y="654" font-size="10" fill="#4A473F">Bounce 降级 / 溢出暂存</text>
  <line x1="300" y1="650" x2="380" y2="650" stroke="#854F0B" stroke-width="6" stroke-linecap="round"/>

  <text x="68" y="680" font-size="10.5" font-weight="700" fill="#085041">集群 DRAM 池</text>
  <text x="160" y="680" font-size="10" fill="#4A473F">Prefix 共享 / 重路由缓存</text>
  <line x1="300" y1="676" x2="355" y2="676" stroke="#0F6E56" stroke-width="6" stroke-linecap="round"/>

  <text x="68" y="706" font-size="10.5" font-weight="700" fill="#444441">NVMe / 远端存储</text>
  <text x="160" y="706" font-size="10" fill="#4A473F">冷层持久化 / 灾难恢复</text>
  <line x1="300" y1="702" x2="330" y2="702" stroke="#5F5E5A" stroke-width="6" stroke-linecap="round"/>

  <text x="68" y="736" font-size="9.5" fill="#6B675C">监控每层 Watermark，防显存空闲但队列溢出</text>

  <!-- Panel E: 四级完成语义门禁 -->
  <rect x="438" y="574" width="378" height="180" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="458" y="598" font-size="13" font-weight="700" fill="#2C4460">E · 四级完成语义：不能混为一谈</text>
  <line x1="458" y1="608" x2="796" y2="608" stroke="#3D5A80" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Step cards -->
  <rect x="458" y="618" width="70" height="42" rx="4" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.8"/>
  <text x="493" y="635" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">CQE</text>
  <text x="493" y="650" font-size="9.5" fill="#6B675C" text-anchor="middle">单 WR 完成</text>

  <rect x="544" y="618" width="76" height="42" rx="4" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.8"/>
  <text x="582" y="635" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">Arrived</text>
  <text x="582" y="650" font-size="9.5" fill="#6B675C" text-anchor="middle">Slice 全到达</text>

  <rect x="636" y="618" width="86" height="42" rx="4" fill="#FFFFFF" stroke="#2F6B5E" stroke-width="0.8"/>
  <text x="679" y="635" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">Committed</text>
  <text x="679" y="650" font-size="9.5" fill="#24473F" text-anchor="middle">单 Chunk 校验</text>

  <rect x="738" y="618" width="68" height="42" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="772" y="635" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">Ready</text>
  <text x="772" y="650" font-size="9.5" fill="#24473F" text-anchor="middle">Decode 准入</text>

  <path d="M528,639 L540,639" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M620,639 L632,639" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M722,639 L734,639" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="458" y="682" font-size="10" fill="#2C4460">① CQE 仅代表网卡 DMA 完成，非 CUDA 读安全</text>
  <text x="458" y="700" font-size="10" fill="#2C4460">② Committed = 设备可见 + 校验 + Ready 位图</text>
  <text x="458" y="718" font-size="10" font-weight="700" fill="#24473F">③ KVReady = 全请求 Barrier 完成，准入 Decode</text>
  <text x="458" y="736" font-size="9.5" fill="#6B675C">④ 迟到包因 Generation 不匹配被静默丢弃</text>

  <!-- Panel F: 预算感知降级阶梯 -->
  <rect x="832" y="574" width="360" height="180" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="852" y="598" font-size="13" font-weight="700" fill="#733428">F · 预算感知降级：拒绝无界重试</text>
  <line x1="852" y1="608" x2="1172" y2="608" stroke="#A64B3C" stroke-width="0.8" stroke-opacity="0.4"/>

  <text x="852" y="628" font-size="10.5" font-weight="700" fill="#733428">① 换 QP / Secondary Rail</text>
  <text x="1015" y="628" font-size="10" fill="#733428">链路级自愈（微秒级）</text>

  <text x="852" y="652" font-size="10.5" font-weight="700" fill="#733428">② 换 Decode + 幂等重传</text>
  <text x="1015" y="652" font-size="10" fill="#733428">目标节点故障（毫秒级）</text>

  <text x="852" y="676" font-size="10.5" font-weight="700" fill="#733428">③ 退回 Pinned DRAM Bounce</text>
  <text x="1015" y="676" font-size="10" fill="#733428">GDR 异常 / 拓扑受限</text>

