<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200px" height="780px" viewBox="0 0 1200 780" version="1.1">
  <title>Shared memory tiled matmul</title>
  <desc>Teaching diagram showing one C tile produced by repeated A and B K tiles loaded into shared memory.</desc>
  <rect x="0" y="0" width="1200" height="780" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#42545a"/>
    </marker>
    <marker id="smallArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8a5f22"/>
    </marker>
  </defs>
  <text x="600" y="42" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#263238">Shared Memory Tiled MatMul</text>
  <text x="600" y="80" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#455a64">一个 block 计算一个 C tile；沿 K 维分段加载 A/B tile</text>

  <rect x="42" y="128" width="330" height="458" rx="18" ry="18" fill="#fffaf0" stroke="#c8bea7" stroke-width="2"/>
  <text x="207" y="166" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2f3b3f">Global A[M,K]</text>
  <text x="207" y="194" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">取 C tile 对应的若干行</text>
  <g>
    <rect x="98" y="242" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="140" y="242" width="42" height="38" fill="#ffdfae" stroke="#d27600" stroke-width="2.2"/>
    <rect x="182" y="242" width="42" height="38" fill="#ffdfae" stroke="#d27600" stroke-width="2.2"/>
    <rect x="224" y="242" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="266" y="242" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="98" y="280" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="140" y="280" width="42" height="38" fill="#ffdfae" stroke="#d27600" stroke-width="2.2"/>
    <rect x="182" y="280" width="42" height="38" fill="#ffdfae" stroke="#d27600" stroke-width="2.2"/>
    <rect x="224" y="280" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="266" y="280" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="98" y="318" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="140" y="318" width="42" height="38" fill="#ffdfae" stroke="#d27600" stroke-width="2.2"/>
    <rect x="182" y="318" width="42" height="38" fill="#ffdfae" stroke="#d27600" stroke-width="2.2"/>
    <rect x="224" y="318" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="266" y="318" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="98" y="356" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="140" y="356" width="42" height="38" fill="#ffdfae" stroke="#d27600" stroke-width="2.2"/>
    <rect x="182" y="356" width="42" height="38" fill="#ffdfae" stroke="#d27600" stroke-width="2.2"/>
    <rect x="224" y="356" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
    <rect x="266" y="356" width="42" height="38" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="1.1"/>
  </g>
  <text x="207" y="432" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#8a4f12">A tile = rows of C tile x K tile</text>
  <text x="207" y="462" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">本轮 k0 只搬一段 K</text>

  <rect x="830" y="128" width="330" height="458" rx="18" ry="18" fill="#f8fbff" stroke="#b8c4d6" stroke-width="2"/>
  <text x="995" y="166" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2f3b3f">Global B[K,N]</text>
  <text x="995" y="194" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">取 C tile 对应的若干列</text>
  <g>
    <rect x="902" y="232" width="40" height="40" fill="#edf1fb" stroke="#8fa0c2" stroke-width="1.1"/>
    <rect x="942" y="232" width="40" height="40" fill="#edf1fb" stroke="#8fa0c2" stroke-width="1.1"/>
    <rect x="982" y="232" width="40" height="40" fill="#edf1fb" stroke="#8fa0c2" stroke-width="1.1"/>
    <rect x="1022" y="232" width="40" height="40" fill="#edf1fb" stroke="#8fa0c2" stroke-width="1.1"/>
    <rect x="1062" y="232" width="40" height="40" fill="#edf1fb" stroke="#8fa0c2" stroke-width="1.1"/>
    <rect x="902" y="272" width="40" height="40" fill="#fff1dc" stroke="#d27600" stroke-width="2.2"/>
    <rect x="942" y="272" width="40" height="40" fill="#fff1dc" stroke="#d27600" stroke-width="2.2"/>
    <rect x="982" y="272" width="40" height="40" fill="#fff1dc" stroke="#d27600" stroke-width="2.2"/>
    <rect x="1022" y="272" width="40" height="40" fill="#fff1dc" stroke="#d27600" stroke-width="2.2"/>
    <rect x="1062" y="272" width="40" height="40" fill="#fff1dc" stroke="#d27600" stroke-width="2.2"/>
    <rect x="902" y="312" width="40" height="40" fill="#fff1dc" stroke="#d27600" stroke-width="2.2"/>
    <rect x="942" y="312" width="40" height="40" fill="#fff1dc" stroke="#d27600" stroke-width="2.2"/>
    <rect x="982" y="312" width="40" height="40" fill="#fff1dc" stroke="#d27600" stroke-width="2.2"/>
    <rect x="1022" y="312" width="40" height="40" fill="#fff1dc" stroke="#d27600" stroke-width="2.2"/>
    <rect x="1062" y="312" width="40" height="40" fill="#fff1dc" stroke="#d27600" stroke-width="2.2"/>
    <rect x="902" y="352" width="40" height="40" fill="#edf1fb" stroke="#8fa0c2" stroke-width="1.1"/>
    <rect x="942" y="352" width="40" height="40" fill="#edf1fb" stroke="#8fa0c2" stroke-width="1.1"/>
    <rect x="982" y="352" width="40" height="40" fill="#edf1fb" stroke="#8fa0c2" stroke-width="1.1"/>
    <rect x="1022" y="352" width="40" height="40" fill="#edf1fb" stroke="#8fa0c2" stroke-width="1.1"/>
    <rect x="1062" y="352" width="40" height="40" fill="#edf1fb" stroke="#8fa0c2" stroke-width="1.1"/>
  </g>
  <text x="995" y="432" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#8a4f12">B tile = K tile x cols of C tile</text>
  <text x="995" y="462" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">同一段 K，与 A tile 对齐</text>

  <rect x="433" y="128" width="334" height="458" rx="18" ry="18" fill="#eef3ef" stroke="#afbeb6" stroke-width="2"/>
  <text x="600" y="166" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2f3b3f">Block 内 shared memory</text>
  <rect x="475" y="220" width="110" height="96" rx="8" ry="8" fill="#ffdfae" stroke="#d27600" stroke-width="2"/>
  <text x="530" y="258" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#7a4a16">As</text>
  <text x="530" y="286" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#7a4a16">TILE x TILE</text>
  <rect x="615" y="220" width="110" height="96" rx="8" ry="8" fill="#fff1dc" stroke="#d27600" stroke-width="2"/>
  <text x="670" y="258" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#7a4a16">Bs</text>
  <text x="670" y="286" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#7a4a16">TILE x TILE</text>
  <text x="600" y="354" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#1d5c63">__syncthreads()</text>
  <rect x="486" y="392" width="228" height="88" rx="12" ry="12" fill="#eee7f5" stroke="#9277a8" stroke-width="2"/>
  <text x="600" y="424" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#5c4770">acc += As[ty][kk]</text>
  <text x="600" y="451" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#5c4770">     * Bs[kk][tx]</text>
  <text x="600" y="526" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#516165">每轮：load -> sync -> compute -> sync</text>

  <path d="M374 318 L472 268" fill="none" stroke="#42545a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M827 318 L728 268" fill="none" stroke="#42545a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 480 L600 622" fill="none" stroke="#42545a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="394" y="622" width="412" height="92" rx="16" ry="16" fill="#f0eef7" stroke="#9277a8" stroke-width="2"/>
  <text x="600" y="652" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#2f3b3f">写回 C tile</text>
  <text x="600" y="681" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#5c4770">C[row * N + col] = acc</text>
  <text x="600" y="704" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#516165">一个 block 产出一个输出矩阵小块</text>

  <path d="M759 130 C792 180 792 530 759 584" fill="none" stroke="#8a5f22" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#smallArrow)"/>
  <text x="802" y="360" text-anchor="middle" transform="rotate(90 802 360)" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#8a5f22">for k0 in 0..K step TILE</text>
</svg>
