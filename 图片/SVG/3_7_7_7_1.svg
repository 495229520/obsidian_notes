<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>半连接队列与全连接队列</title>
  <desc>三次握手过程中，连接先落在半连接队列，收到第三次 ACK 后移入全连接队列，accept 从全连接队列取走；下方说明两个队列的长度分别由哪个参数决定，以及队列满了之后的行为。</desc>

  <rect x="0" y="0" width="1240" height="730" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">listen 建的不是一个队列，是两个</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">连接在握手途中待在半连接队列，握完才移进全连接队列；accept 只从后者取</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="316" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 一条连接在两个队列间的移动</text>

  <!-- 客户端 -->
  <rect x="76" y="220" width="148" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="150" y="248" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">客户端</text>
  <text x="150" y="270" font-size="10.5" fill="#2C4460" text-anchor="middle">connect()</text>

  <line x1="228" y1="236" x2="332" y2="236" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="229" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">① SYN</text>
  <line x1="332" y1="262" x2="228" y2="262" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="255" font-size="10.5" fill="#4A473F" text-anchor="middle">② SYN + ACK</text>
  <line x1="228" y1="288" x2="332" y2="288" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="281" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">③ ACK</text>

  <!-- 内核 -->
  <rect x="340" y="168" width="560" height="236" rx="8" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="620" y="190" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">服务端内核</text>

  <rect x="364" y="200" width="512" height="72" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="380" y="218" font-size="11" font-weight="700" fill="#2C4460">半连接队列（SYN queue）</text>
  <rect x="380" y="228" width="156" height="30" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="458" y="248" font-size="10.5" fill="#2C4460" text-anchor="middle">SYN_RCVD</text>
  <rect x="544" y="228" width="156" height="30" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="622" y="248" font-size="10.5" fill="#2C4460" text-anchor="middle">SYN_RCVD</text>
  <rect x="708" y="228" width="156" height="30" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="786" y="248" font-size="10.5" fill="#6B675C" text-anchor="middle">空槽</text>

  <line x1="620" y1="272" x2="620" y2="296" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="636" y="290" font-size="10.5" font-weight="700" fill="#733428">③ 到达后，整条移下来</text>

  <rect x="364" y="300" width="512" height="72" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="380" y="318" font-size="11" font-weight="700" fill="#24473F">全连接队列（accept queue）</text>
  <rect x="380" y="328" width="156" height="30" rx="4" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="458" y="348" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">ESTABLISHED</text>
  <rect x="544" y="328" width="156" height="30" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="622" y="348" font-size="10.5" fill="#6B675C" text-anchor="middle">空槽</text>
  <rect x="708" y="328" width="156" height="30" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="786" y="348" font-size="10.5" fill="#6B675C" text-anchor="middle">空槽</text>

  <line x1="880" y1="336" x2="932" y2="336" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="940" y="300" width="224" height="72" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="1052" y="322" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">服务端应用</text>
  <text x="1052" y="342" font-size="10.5" fill="#6B4E28" text-anchor="middle">④ accept() 取走一个</text>
  <text x="1052" y="360" font-size="10.5" fill="#6B4E28" text-anchor="middle">返回新的 connfd</text>

  <text x="940" y="228" font-size="11" fill="#6B675C">应用此时还不知情：</text>
  <text x="940" y="250" font-size="11" fill="#6B675C">①②③ 全由内核自动完成</text>
  <text x="940" y="272" font-size="11" fill="#6B675C">accept 慢不影响握手，</text>
  <text x="940" y="294" font-size="11" fill="#6B675C">只会让全连接队列积压</text>

  <!-- ================= Panel B ================= -->
  <rect x="48" y="436" width="1144" height="224" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="462" font-size="15" font-weight="700" fill="#4A473F">B · 长度由谁决定，满了会怎样</text>

  <rect x="72" y="474" width="358" height="166" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="94" y="498" font-size="12" font-weight="700" fill="#2C4460">半连接队列的长度</text>
  <text x="94" y="522" font-size="11.5" fill="#2C4460">主要受 tcp_max_syn_backlog 约束</text>
  <text x="94" y="544" font-size="11.5" fill="#2C4460">查看：sysctl net.ipv4.</text>
  <text x="94" y="562" font-size="11.5" fill="#2C4460">tcp_max_syn_backlog</text>
  <text x="94" y="586" font-size="11.5" fill="#2C4460">满了就丢掉新来的 SYN</text>
  <text x="94" y="610" font-size="11" fill="#2C4460">开启 syncookies 后不再受它限制</text>
  <text x="94" y="630" font-size="11" fill="#6B675C">代价是丢掉 SYN 里的选项</text>

  <rect x="446" y="474" width="358" height="166" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="468" y="498" font-size="12" font-weight="700" fill="#24473F">全连接队列的长度</text>
  <text x="468" y="522" font-size="11.5" font-weight="700" fill="#24473F">min(listen 的 backlog, somaxconn)</text>
  <text x="468" y="546" font-size="11.5" fill="#24473F">两个值取小的那个，谁小谁生效</text>
  <text x="468" y="570" font-size="11.5" fill="#24473F">somaxconn 的默认值换过：</text>
  <text x="468" y="590" font-size="11.5" fill="#24473F">Linux 5.4 之前 128，之后 4096</text>
  <text x="468" y="614" font-size="11" fill="#24473F">调大了 somaxconn 却没改代码里的</text>
  <text x="468" y="632" font-size="11" fill="#24473F">backlog，等于白调</text>

  <rect x="820" y="474" width="348" height="166" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="842" y="498" font-size="12" font-weight="700" fill="#733428">全连接队列满了之后</text>
  <text x="842" y="522" font-size="11.5" fill="#733428">默认行为是丢掉第三次 ACK</text>
  <text x="842" y="546" font-size="11.5" fill="#733428">客户端那边已经 ESTABLISHED</text>
  <text x="842" y="570" font-size="11.5" fill="#733428">服务端却当这条连接不存在</text>
  <text x="842" y="592" font-size="11.5" font-weight="700" fill="#733428">现象：连上了但一直没响应</text>
  <text x="842" y="616" font-size="11" fill="#733428">改 tcp_abort_on_overflow=1</text>
  <text x="842" y="634" font-size="11" fill="#733428">可让它直接回 RST，快速失败</text>

  <text x="48" y="698" font-size="11.5" fill="#4A473F">溢出次数可以直接读：ss -lnt 的 Send-Q 是全连接队列容量，Recv-Q 是当前积压；nstat -az TcpExtListenOverflows 累计了丢弃次数。</text>
  <text x="48" y="720" font-size="11.5" fill="#4A473F">这两个数字长期不为零，说明 accept 的速度跟不上握手的速度，加大队列只是拖延，要去看处理线程为什么慢。</text>
</svg>
