<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<title id="title">发布与回收：两处屏障、两种进度、三个地址对象</title><desc id="desc">左侧是WQE写入、设备写屏障、DBR、MMIO及flush，经过RNIC执行后，右侧从CQE所有权、读屏障到WC和SQ/CQ回收。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">发布与回收：两处屏障、两种进度、三个地址对象</text>
<text x="48" y="82" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">SQ/WQE、Host DBR、UAR MMIO 必须分开；CQ owner/phase 与内容读取也必须分开。</text>
<rect x="48" y="115" width="540" height="404" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<rect x="618" y="115" width="574" height="404" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text x="68" y="146" font-size="14" font-weight="700" fill="#2C4460" text-anchor="start" data-role="section">CPU → RNIC：提交发布</text>
<text x="638" y="146" font-size="14" font-weight="700" fill="#24473F" text-anchor="start" data-role="section">RNIC → CPU：完成消费</text>
<rect x="74" y="169" width="362" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="255.0" y="196.42" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">① 写 WQE / shadow</text>
<text x="482" y="197" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">Host RAM</text>
<path d="M255,218 L255,233" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="74" y="237" width="362" height="46" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="255.0" y="264.42" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">② DMA 写屏障</text>
<text x="482" y="265" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">to_device</text>
<path d="M255,286 L255,301" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="74" y="305" width="362" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="255.0" y="332.42" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">③ 更新 SQ DBR</text>
<text x="482" y="333" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">Host RAM</text>
<path d="M255,354 L255,369" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="74" y="373" width="362" height="46" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="255.0" y="400.42" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">④ BF 或 MMIO doorbell</text>
<text x="482" y="401" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">UAR 映射</text>
<path d="M255,422 L255,437" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="74" y="441" width="362" height="46" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="255.0" y="468.42" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">⑤ 冲刷 MMIO 写 / 解锁</text>
<text x="482" y="469" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">MMIO 顺序</text>
<rect x="646" y="169" width="362" height="46" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="827.0" y="196.42" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">① CQE / owner 交接</text>
<text x="1084" y="197" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">设备写入</text>
<path d="M827,218 L827,233" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="646" y="237" width="362" height="46" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="827.0" y="264.42" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">② 检查 owner / phase</text>
<text x="1084" y="265" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">是否有新完成</text>
<path d="M827,286 L827,301" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="646" y="305" width="362" height="46" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="827.0" y="332.42" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">③ DMA 读屏障</text>
<text x="1084" y="333" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">from_device</text>
<path d="M827,354 L827,369" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="646" y="373" width="362" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="827.0" y="400.42" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">④ CQE → WC / wr_id</text>
<text x="1084" y="401" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">shadow 映射</text>
<path d="M827,422 L827,437" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="646" y="441" width="362" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="827.0" y="468.42" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">⑤ SQ tail + CQ 消费进度</text>
<text x="1084" y="469" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">两种回收</text>
<rect x="48" y="553" width="1144" height="61" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="620.0" y="588.26" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">RNIC：获取任务 → DMA / RC 网络 → 发布 CQE</text>
<path d="M255,490 L255,549" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M1170,553 L1170,159 L827,159 L827,165" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="68" y="650" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">DBR 不是 MMIO；设备发布屏障也不是 CUDA 消费者同步。</text>
<text x="48" y="673" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="scope">依据 v57.0 post_send_db / mlx5_get_next_cqe / mlx5_parse_cqe；图中省略扩展与异常分支。</text>
</svg>