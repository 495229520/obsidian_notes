<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect x="0" y="0" width="1200" height="560" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .load { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .compute { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .sync { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
      .stage { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">simple pipeline / double buffering：把下一块 K tile 提前准备好</text>
  <text x="56" y="88" class="small">教学版 pipeline 关注思路：stage 0 计算当前 tile，stage 1 尝试准备下一 tile。</text>

  <text x="70" y="140" class="label">无 pipeline</text>
  <rect x="70" y="165" width="150" height="58" class="load"/>
  <text x="106" y="201" class="small">load k0</text>
  <path d="M230 194 H275" class="line"/>
  <rect x="285" y="165" width="105" height="58" class="sync"/>
  <text x="315" y="201" class="small">sync</text>
  <path d="M400 194 H445" class="line"/>
  <rect x="455" y="165" width="180" height="58" class="compute"/>
  <text x="498" y="201" class="small">compute k0</text>
  <path d="M645 194 H690" class="line"/>
  <rect x="700" y="165" width="105" height="58" class="sync"/>
  <text x="730" y="201" class="small">sync</text>
  <path d="M815 194 H860" class="line"/>
  <rect x="870" y="165" width="150" height="58" class="load"/>
  <text x="906" y="201" class="small">load k1</text>

  <text x="70" y="300" class="label">double buffer 思路</text>
  <rect x="70" y="330" width="215" height="92" class="stage"/>
  <text x="98" y="365" class="small">shared stage 0</text>
  <rect x="105" y="382" width="130" height="28" class="compute"/>
  <text x="130" y="402" class="tiny">compute k0</text>

  <rect x="325" y="330" width="215" height="92" class="stage"/>
  <text x="353" y="365" class="small">shared stage 1</text>
  <rect x="360" y="382" width="130" height="28" class="load"/>
  <text x="392" y="402" class="tiny">load k1</text>

  <path d="M560 376 H665" class="line"/>

  <rect x="685" y="330" width="215" height="92" class="stage"/>
  <text x="713" y="365" class="small">stage 1</text>
  <rect x="720" y="382" width="130" height="28" class="compute"/>
  <text x="745" y="402" class="tiny">compute k1</text>

  <rect x="930" y="330" width="215" height="92" class="stage"/>
  <text x="958" y="365" class="small">stage 0</text>
  <rect x="965" y="382" width="130" height="28" class="load"/>
  <text x="997" y="402" class="tiny">load k2</text>

  <rect x="70" y="470" width="1075" height="58" class="warn"/>
  <text x="95" y="507" class="small">Week 13 只要求入门版 pipeline：是否真正 overlap 要看 stall reason、指令调度、同步位置和 shared/register 资源，而不是只看代码里有两个 buffer。</text>
</svg>
