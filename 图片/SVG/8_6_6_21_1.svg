<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">Page 与 Frame：身份、驻留与回收资格</title>
<desc id="desc">页表将 P17 和 P42 分别映射到 F0 与 F1。F0 有 pin 不可淘汰，F1 无 pin 但脏，需要写回才能复用；F2 空闲。下方显示调度器、磁盘管理器与逻辑磁盘页。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)"/>
<text class="title" x="48" y="52" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">Page 与 Frame：身份、驻留与回收资格</text>
<text class="subtitle" x="48" y="81" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">Fall 2026 基线 · 每个 frame 8 KiB · 图中槽位表示逻辑布局，不表示物理连续分配</text>
<rect x="48" y="116" width="234" height="308" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<rect x="330" y="116" width="550" height="308" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<rect x="928" y="116" width="264" height="308" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text class="body" x="68" y="146" font-size="17" fill="#3D5A80" font-weight="700" text-anchor="start">Page Table</text>
<text class="body" x="68" y="170" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">只记录当前驻留映射</text>
<text class="body" x="350" y="146" font-size="17" fill="#3D5A80" font-weight="700" text-anchor="start">Buffer Pool / FrameHeader</text>
<text class="body" x="372" y="176" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">Frame</text>
<text class="body" x="482" y="176" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">页内容 data</text>
<text class="body" x="673" y="176" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">pin</text>
<text class="body" x="783" y="176" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">dirty</text>
<text class="body" x="948" y="146" font-size="17" fill="#2F6B5E" font-weight="700" text-anchor="start">回收资格</text>
<text class="body" x="948" y="170" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">正常驻留，无额外 I/O 保留</text>
<rect x="68" y="190" width="194" height="58" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text class="body" x="94" y="225" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="start">P17</text>
<text class="body" x="157" y="225" font-size="19" fill="#6B675C" font-weight="400" text-anchor="start">→</text>
<text class="body" x="205" y="225" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="start">F0</text>
<rect x="350" y="190" width="510" height="58" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text class="body" x="372" y="225" font-size="17" fill="#2B2A26" font-weight="700" text-anchor="start">F0</text>
<text class="body" x="482" y="225" font-size="17" fill="#2B2A26" font-weight="400" text-anchor="start">P17</text>
<text class="body" x="682" y="225" font-size="17" fill="#2B2A26" font-weight="400" text-anchor="start">2</text>
<text class="body" x="798" y="225" font-size="17" fill="#2B2A26" font-weight="400" text-anchor="start">0</text>
<path d="M264 219 H346" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M863 219 H944" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<rect x="68" y="264" width="194" height="58" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
<text class="body" x="94" y="299" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="start">P42</text>
<text class="body" x="157" y="299" font-size="19" fill="#6B675C" font-weight="400" text-anchor="start">→</text>
<text class="body" x="205" y="299" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="start">F1</text>
<rect x="350" y="264" width="510" height="58" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
<text class="body" x="372" y="299" font-size="17" fill="#2B2A26" font-weight="700" text-anchor="start">F1</text>
<text class="body" x="482" y="299" font-size="17" fill="#2B2A26" font-weight="400" text-anchor="start">P42 · 已修改</text>
<text class="body" x="682" y="299" font-size="17" fill="#2B2A26" font-weight="400" text-anchor="start">0</text>
<text class="body" x="798" y="299" font-size="17" fill="#2B2A26" font-weight="400" text-anchor="start">1</text>
<path d="M264 293 H346" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M863 293 H944" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<rect x="948" y="190" width="224" height="58" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
<text class="body" x="966" y="215" font-size="16" fill="#A64B3C" font-weight="700" text-anchor="start">F0：不可淘汰</text>
<text class="body" x="966" y="237" font-size="13" fill="#A64B3C" font-weight="400" text-anchor="start">pin &gt; 0</text>
<rect x="948" y="264" width="224" height="58" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text class="body" x="966" y="289" font-size="15" fill="#2F6B5E" font-weight="700" text-anchor="start">F1：可选为 victim</text>
<text class="body" x="966" y="311" font-size="13" fill="#2F6B5E" font-weight="400" text-anchor="start">复用前仍需保存脏内容</text>
<rect x="350" y="338" width="510" height="58" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.4"/>
<text class="body" x="372" y="373" font-size="16" fill="#6B675C" font-weight="400" text-anchor="start">F2</text>
<text class="body" x="482" y="373" font-size="16" fill="#6B675C" font-weight="400" text-anchor="start">FREE · 无绑定页</text>
<text class="body" x="682" y="373" font-size="16" fill="#6B675C" font-weight="400" text-anchor="start">0</text>
<text class="body" x="798" y="373" font-size="16" fill="#6B675C" font-weight="400" text-anchor="start">0</text>
<text class="body" x="948" y="363" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">Free list：F2</text>
<text class="body" x="948" y="387" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">不属于 resident candidate</text>
<text class="body" x="68" y="367" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">P99：当前未驻留</text>
<text class="body" x="68" y="391" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">无映射 ≠ 页不存在</text>
<path d="M605 425 V449 H216 V477" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text class="body" x="623" y="450" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">页读入 / 脏页写出</text>
<rect x="48" y="478" width="336" height="128" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text class="body" x="70" y="508" font-size="17" fill="#3D5A80" font-weight="700" text-anchor="start">Disk Scheduler</text>
<text class="body" x="70" y="538" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">请求队列 + 后台 worker</text>
<text class="body" x="70" y="566" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">借用 data* · 每请求一个 promise</text>
<rect x="450" y="478" width="302" height="128" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text class="body" x="473" y="508" font-size="17" fill="#2F6B5E" font-weight="700" text-anchor="start">Disk Manager</text>
<text class="body" x="473" y="538" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">page_id → 文件偏移</text>
<text class="body" x="473" y="566" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">ReadPage / WritePage</text>
<rect x="818" y="478" width="374" height="128" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text class="body" x="840" y="507" font-size="17" fill="#2B2A26" font-weight="700" text-anchor="start">逻辑磁盘页</text>
<rect x="840" y="524" width="102" height="43" rx="5" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.4"/>
<text class="body" x="891" y="551" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="middle">P17</text>
<rect x="954" y="524" width="102" height="43" rx="5" fill="#F3E8D3" stroke="#D8D5C8" stroke-width="1.4"/>
<text class="body" x="1005" y="551" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="middle">P42</text>
<rect x="1068" y="524" width="102" height="43" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.4"/>
<text class="body" x="1119" y="551" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="middle">P99</text>
<text class="body" x="840" y="590" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">P42：上次已写回的版本</text>
<path d="M388 541 H446" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M756 541 H814" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="48" y="629" width="550" height="43" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
<text class="body" x="70" y="657" font-size="15" fill="#B07D2B" font-weight="700" text-anchor="start">可淘汰 ≠ 已写回；pin ≠ 页内容互斥</text>
<rect x="624" y="629" width="568" height="43" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text class="body" x="646" y="657" font-size="15" fill="#6B675C" font-weight="400" text-anchor="start">容量 3  /  驻留 2  /  可淘汰 1  /  空闲 1</text>
</svg>
