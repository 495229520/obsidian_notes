<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<title>一个 RS(8,3) 条带：容量、有效输入与错误预算</title><desc>八个数据片与三个校验片，每片 4 MiB，逻辑容量 32 MiB，编码容量 44 MiB。下半比较已知擦除和未知错误的预算。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A64B3C"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6B5E"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5A80"/></marker>
</defs>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">一个 RS(8,3) 条带：容量、有效输入与错误预算</text>
<text x="48" y="82" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">本文 RS(k,m) 表示 k 个数据片 + m 个冗余片；有些资料使用 (n,k)，必须先核对符号。</text>
<text x="48" y="130" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">同一 object / generation / stripe；每片 S = 4 MiB</text>
<rect x="76" y="167" width="84" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="118.0" y="208.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D0</text>
<text x="118.0" y="232.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">4 MiB</text>
<rect x="175" y="167" width="84" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="217.0" y="208.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D1</text>
<text x="217.0" y="232.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">4 MiB</text>
<rect x="274" y="167" width="84" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="316.0" y="208.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D2</text>
<text x="316.0" y="232.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">4 MiB</text>
<rect x="373" y="167" width="84" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="415.0" y="208.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D3</text>
<text x="415.0" y="232.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">4 MiB</text>
<rect x="472" y="167" width="84" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="514.0" y="208.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D4</text>
<text x="514.0" y="232.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">4 MiB</text>
<rect x="571" y="167" width="84" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="613.0" y="208.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D5</text>
<text x="613.0" y="232.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">4 MiB</text>
<rect x="670" y="167" width="84" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="712.0" y="208.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D6</text>
<text x="712.0" y="232.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">4 MiB</text>
<rect x="769" y="167" width="84" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="811.0" y="208.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">D7</text>
<text x="811.0" y="232.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">4 MiB</text>
<rect x="868" y="167" width="84" height="96" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="910.0" y="208.1" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">P0</text>
<text x="910.0" y="232.1" font-size="15" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">4 MiB</text>
<rect x="967" y="167" width="84" height="96" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1009.0" y="208.1" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">P1</text>
<text x="1009.0" y="232.1" font-size="15" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">4 MiB</text>
<rect x="1066" y="167" width="84" height="96" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1108.0" y="208.1" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">P2</text>
<text x="1108.0" y="232.1" font-size="15" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">4 MiB</text>
<line x1="76" y1="289" x2="853" y2="289" stroke="#3D5A80" stroke-width="2.4"/>
<text x="464" y="318" font-size="16" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">8 个 data shard = 32 MiB 逻辑数据</text>
<line x1="868" y1="289" x2="1150" y2="289" stroke="#2F6B5E" stroke-width="2.4"/>
<text x="1009" y="318" font-size="16" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">3 个 parity = 12 MiB</text>
<rect x="48" y="345" width="1144" height="52" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="620.0" y="376.44" font-size="16" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">编码容量 44 MiB；44 / 32 = 1.375×（不含头、摘要、padding）</text>
<rect x="48" y="424" width="552" height="190" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="68" y="457" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">已知位置不可用：擦除解码</text>
<text x="68" y="500" font-size="30" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">s ≤ 3</text>
<text x="210" y="486" font-size="15" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">选取 8 个不同、正确、同版本的位置</text>
<text x="210" y="515" font-size="15" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">缺失 / EIO / 已定位坏块 → 不计入输入</text>
<text x="68" y="582" font-size="16" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">可达节点数不是有效方程数。</text>
<rect x="640" y="424" width="552" height="190" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="660" y="457" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">未知错误：还要定位错误位置</text>
<text x="660" y="500" font-size="29" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="body">2e + s ≤ 3</text>
<text x="660" y="541" font-size="15" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">e = 未知位置错误；s = 已知擦除</text>
<text x="660" y="569" font-size="15" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">仅对支持相应纠错的解码器给出唯一恢复界</text>
<line x1="48" y1="643" x2="1192" y2="643" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="671" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">校验定位一个错误，可将它从 e 移入 s；普通擦除解码 API 不会因此自动具备未知错误纠正能力。</text>
</svg>