<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Group 不会取消依赖；nonblocking 也有两道完成门</title><desc id="desc">8.21 · 图 2　左：参与 stream 的汇合　右：host 进展与设备完成。原创教学图，非实测数据。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="red-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">Group 不会取消依赖；nonblocking 也有两道完成门</text>
<text x="48" y="78" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">8.21 · 图 2　左：参与 stream 的汇合　右：host 进展与设备完成</text>
<rect x="48" y="110" width="555" height="466" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="138" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · 同一 group 混用多条 stream</text>
<text x="68" y="179" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">Stream A</text>
<text x="68" y="267" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">Stream B</text>
<rect x="176" y="150" width="135" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="243.5" y="172.4" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">前置计算 A</text>
<text x="243.5" y="193.4" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">已就绪</text>
<rect x="176" y="238" width="180" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="266.0" y="260.4" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">前置计算 B</text>
<text x="266.0" y="281.4" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">更晚就绪</text>
<polyline points="316,178 385,178 385,332" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="361,266 425,266 425,332" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="280" y="337" width="270" height="62" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="415.0" y="362.4" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">group 的共同执行点</text>
<text x="415.0" y="383.4" font-size="14" font-weight="400" fill="#6B4E28" text-anchor="middle">等相关前置工作</text>
<polyline points="415,404 415,433" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="188" y="438" width="361" height="62" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="368.5" y="463.4" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">参与 stream 的后续工作</text>
<text x="368.5" y="484.4" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">不能越过该组</text>
<text x="72" y="544" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">不等于同步设备上的所有 stream</text>
<rect x="625" y="110" width="567" height="466" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="641" y="138" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · nonblocking：先查询进展，再看 CUDA</text>
<rect x="660" y="153" width="225" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="772.5" y="176.4" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">NCCL host 调用</text>
<text x="772.5" y="197.4" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">可能 ncclInProgress</text>
<polyline points="772,216 772,245" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="648" y="250" width="292" height="57" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="794.0" y="283.05" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">ncclCommGetAsyncError()</text>
<polyline points="944,278 1145,278 1145,231 794,231 794,246" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="946,296 1020,296 1020,345" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#red-arr)"/>
<text x="974" y="260" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">InProgress</text>
<polyline points="790,311 790,344" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="804" y="331" font-size="13" font-weight="400" fill="#2F6B5E" text-anchor="start">Success</text>
<rect x="657" y="349" width="268" height="56" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="791.0" y="371.4" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">NCCL 此阶段进展完成</text>
<text x="791.0" y="392.4" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle">不等于 GPU 数据完成</text>
<polyline points="794,410 794,436" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="657" y="441" width="490" height="58" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="902.0" y="464.4" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">CUDA stream / event 完成</text>
<text x="902.0" y="485.4" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">输出消费与 buffer 生命周期的边界</text>
<text x="967" y="369" font-size="13" font-weight="400" fill="#A64B3C" text-anchor="start">失败分支</text>
<text x="967" y="390" font-size="13" font-weight="400" fill="#A64B3C" text-anchor="start">任务级协调退出</text>
<line x1="48" y1="606" x2="1192" y2="606" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="48" y="626" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">不要在未结束 group 内等待尚未入队的工作；不要把 ncclSuccess 当成任意 buffer 的完成证据。</text>
<text x="48" y="649" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start">状态机为语义简图；错误码、deadline、abort 与恢复策略需要由实际程序补齐。</text>
</svg>