<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">一帧的 VLAN：入口归类与出口表示分开</title>
<desc id="desc">基本模型：入口 PVID 10、允许 VLAN 10；示意查找阶段，不规定 ASIC 的实现顺序。</desc>
<defs>
<marker id="arr-bs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-gs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/></marker>
<marker id="arr-rs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-ns" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8574"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="660" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="46" font-size="23" fill="#2B2A26" font-weight="700" text-anchor="start">一帧的 VLAN：入口归类与出口表示分开</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">基本模型：入口 PVID 10、允许 VLAN 10；示意查找阶段，不规定 ASIC 的实现顺序。</text>
<rect x="48" y="116" width="260" height="332" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="145" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">① 入口分类</text>
<rect x="354" y="116" width="232" height="332" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="370" y="145" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">② 成员检查</text>
<rect x="636" y="116" width="234" height="332" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="652" y="145" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">③ 上下文内转发</text>
<rect x="920" y="116" width="272" height="332" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="936" y="145" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">④ 出口表示</text>
<rect x="64" y="166" width="228" height="56" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="178.0" y="199.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Untagged → PVID 10</text>
<rect x="64" y="242" width="228" height="56" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="178.0" y="275.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Tag VID 10 → VLAN 10</text>
<rect x="64" y="318" width="228" height="56" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="178.0" y="351.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">Tag VID 20 → VLAN 20</text>
<path d="M294,194 L324,194 L324,234 L350,234" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)"/>
<path d="M294,270 L324,270 L324,234" fill="none" stroke="#3D5A80" stroke-width="1.8"/>
<rect x="370" y="190" width="200" height="89" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="470.0" y="228.0" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">VLAN 10</text>
<text x="470.0" y="251.0" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">成员允许</text>
<line x1="590" y1="234" x2="631" y2="234" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-gs)"/>
<rect x="370" y="319" width="200" height="62" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="470.0" y="343.5" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">VLAN 20</text>
<text x="470.0" y="366.5" font-size="14" fill="#733428" font-weight="400" text-anchor="middle">非成员：丢弃</text>
<line x1="296" y1="346" x2="364" y2="346" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arr-rs)"/>
<rect x="652" y="175" width="202" height="113" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="753.0" y="213.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">学习源 MAC</text>
<text x="753.0" y="236.5" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">查目的 MAC</text>
<text x="753.0" y="259.5" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">例：(VID, MAC)</text>
<text x="654" y="327" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">IVL 简化模型</text>
<text x="654" y="355" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">未知目的：限制泛洪</text>
<text x="654" y="383" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">还要检查端口状态</text>
<path d="M872,234 L899,234 L899,206 L916,206" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)"/>
<path d="M899,234 L899,327 L916,327" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)"/>
<rect x="936" y="171" width="240" height="72" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1056.0" y="200.5" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">Trunk：VLAN 10</text>
<text x="1056.0" y="223.5" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle">出口 Tagged</text>
<rect x="936" y="292" width="240" height="72" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1056.0" y="321.5" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">Access：VLAN 10</text>
<text x="1056.0" y="344.5" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">出口 Untagged</text>
<text x="936" y="409" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">按实际候选出口选择</text>
<rect x="48" y="474" width="1144" height="105" rx="8" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="501" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">两个独立标志</text>
<line x1="270" y1="491" x2="270" y2="560" stroke="#8A8574" stroke-width="1"/>
<text x="292" y="506" font-size="15" fill="#2C4460" font-weight="400" text-anchor="start">只设 pvid：入口归类正确</text>
<text x="292" y="546" font-size="15" fill="#733428" font-weight="400" text-anchor="start">不保证出口去标签</text>
<line x1="724" y1="491" x2="724" y2="560" stroke="#8A8574" stroke-width="1"/>
<text x="746" y="506" font-size="15" fill="#24473F" font-weight="400" text-anchor="start">只设 untagged：出口去标签</text>
<text x="746" y="546" font-size="15" fill="#733428" font-weight="400" text-anchor="start">不保证入口存在默认 PVID</text>
<text x="48" y="617" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">Tag 是链路上的表示；VLAN 上下文可以存在于内部元数据中。</text>
</svg>