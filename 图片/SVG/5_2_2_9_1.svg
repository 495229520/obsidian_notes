<text x="643.0" y="286" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">3</text>
<path d="M679,280 L758,280" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="765" y="260" width="66" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.4"/>
<text x="798.0" y="286" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">4</text>
<path d="M834,280 L864,280" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="871" y="285" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">null</text>
<text x="488" y="248" font-size="14" fill="#2F6B5E" text-anchor="middle" font-weight="400">slow：左中点</text>
<text x="984" y="189" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="400">找中间节点</text>
<text x="984" y="282" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="400">在 slow 后断链</text>
<rect x="32" y="365" width="1176" height="215" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text x="52" y="396" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700">B · 删除倒数第 2 个：从 dummy 先走 3 步</text>
<rect x="185" y="438" width="66" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.4"/>
<text x="218.0" y="464" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">D</text>
<path d="M254,458 L320,458" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
