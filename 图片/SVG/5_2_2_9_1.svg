<rect x="610" y="166" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="643.0" y="192" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">3</text>
<path d="M679,186 L758,186" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="765" y="166" width="66" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.4"/>
<text x="798.0" y="192" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">4</text>
<path d="M834,186 L864,186" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="871" y="191" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">null</text>
<text x="643" y="154" font-size="14" fill="#2F6B5E" text-anchor="middle" font-weight="400">slow：右中点</text>
