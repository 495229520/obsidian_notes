<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<title>中点与倒数位置：起点和终点要配套</title>
<desc>上半图使用 while (fast &amp;&amp; fast-&gt;next)；下半图让 fast 走到 null。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect width="1240" height="640" fill="rgb(245, 244, 237)"/>
<text x="48" y="50" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">中点与倒数位置：起点和终点要配套</text>
<text x="48" y="80" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400">上半图使用 while (fast &amp;&amp; fast-&gt;next)；下半图让 fast 走到 null。</text>
<rect x="32" y="104" width="1176" height="244" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text x="52" y="135" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700">A · 4 个节点：slow 最终位置</text>
<text x="60" y="191" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="400">fast = head</text>
<rect x="300" y="166" width="66" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.4"/>
<text x="333.0" y="192" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">1</text>
