<path d="M680,458 L746,458" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="753" y="438" width="66" height="40" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
<text x="786.0" y="464" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">4</text>
<path d="M822,458 L888,458" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="895" y="438" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="928.0" y="464" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">5</text>
<path d="M964,458 L994,458" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="1001" y="463" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">null</text>
<text x="644" y="426" font-size="14" fill="#2F6B5E" text-anchor="middle" font-weight="400">slow：前驱</text>
<text x="786" y="506" font-size="14" fill="#A64B3C" text-anchor="middle" font-weight="400">待删除</text>
<text x="1030" y="426" font-size="14" fill="#3D5A80" text-anchor="start" font-weight="400">fast</text>
<text x="64" y="551" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="400">位置差 = n + 1 = 3 条边：3 → 4 → 5 → null</text>
<text x="48" y="617" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="400">两节点切分自查：左段 1 个、右段 1 个；子问题长度必须缩小。</text>
</svg>