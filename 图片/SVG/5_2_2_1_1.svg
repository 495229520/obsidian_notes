<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <title id="title">数学与数论基础总览</title>
  <desc id="desc">展示 gcd、快速幂、取模、素数筛和组合数在算法题中的关系与典型用途。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .core { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.2; }
      .box { fill: #fffdf7; stroke-width: 1.7; rx: 10; }
      .box-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .box-body { font-size: 13px; fill: #475569; }
      .formula { font-size: 15px; font-weight: 700; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="560" y="52" text-anchor="middle" class="title">数学与数论基础</text>
  <text x="560" y="80" text-anchor="middle" class="subtitle">后端面试和笔试里常见的五个基础模块：约数、幂、模、素数、组合</text>

  <rect x="400" y="118" width="320" height="112" rx="14" class="core"/>
  <text x="560" y="158" text-anchor="middle" class="box-title">算法题里的数学工具箱</text>
  <text x="560" y="188" text-anchor="middle" class="box-body">先识别问题类型，再选择对应模板</text>
  <text x="560" y="210" text-anchor="middle" class="box-body">注意范围、溢出、取模和预处理成本</text>

  <rect x="70" y="290" width="280" height="118" rx="10" class="box" stroke="#38bdf8"/>
  <text x="100" y="325" class="box-title">gcd / lcm</text>
  <text x="100" y="353" class="formula">gcd(a, b) = gcd(b, a % b)</text>
  <text x="100" y="378" class="box-body">约分、互质、周期同步、比例化简</text>

  <rect x="420" y="290" width="280" height="118" rx="10" class="box" stroke="#f59e0b"/>
  <text x="450" y="325" class="box-title">快速幂</text>
  <text x="450" y="353" class="formula">a^n = 按二进制拆分</text>
  <text x="450" y="378" class="box-body">幂运算、矩阵快速幂、模逆元</text>

  <rect x="770" y="290" width="280" height="118" rx="10" class="box" stroke="#22c55e"/>
  <text x="800" y="325" class="box-title">取模运算</text>
  <text x="800" y="353" class="formula">(a + b) % M, (a * b) % M</text>
  <text x="800" y="378" class="box-body">防溢出、答案取模、负数规范化</text>

  <rect x="245" y="500" width="280" height="118" rx="10" class="box" stroke="#a855f7"/>
  <text x="275" y="535" class="box-title">素数筛</text>
  <text x="275" y="563" class="formula">从 i * i 开始标记倍数</text>
  <text x="275" y="588" class="box-body">批量判素数、质因子预处理</text>

  <rect x="595" y="500" width="280" height="118" rx="10" class="box" stroke="#ef4444"/>
  <text x="625" y="535" class="box-title">组合数</text>
  <text x="625" y="563" class="formula">C(n,k)=C(n-1,k-1)+C(n-1,k)</text>
  <text x="625" y="588" class="box-body">路径计数、方案数、概率和计数 DP</text>

  <path d="M 466 230 C 360 250, 280 260, 210 285" class="arrow"/>
  <path d="M 560 230 L 560 278" class="arrow"/>
  <path d="M 654 230 C 760 250, 840 260, 910 285" class="arrow"/>
  <path d="M 495 230 C 430 330, 395 410, 385 488" class="arrow"/>
  <path d="M 625 230 C 690 330, 725 410, 735 488" class="arrow"/>

  <rect x="90" y="642" width="940" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="668" text-anchor="middle" class="box-body">常见判断：单次计算用模板，批量查询先预处理；涉及除法取模时确认是否能用逆元</text>
</svg>
