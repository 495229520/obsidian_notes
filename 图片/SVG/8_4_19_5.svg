<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">重放同一个业务身份，不是重复制造一次副作用</title>
  <desc id="desc">远端提交完成但回执丢失时，重试必须查询或命中去重记录。。图中预算、序号与布局均为教学示意，不是实测结果。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="bluearr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3" />
  <text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">重放同一个业务身份，不是重复制造一次副作用</text>
  <text x="48" y="79" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">远端提交完成但回执丢失时，重试必须查询或命中去重记录。</text>
  <line x1="48" y1="98" x2="1192" y2="98" stroke="#D8D5C8" stroke-width="1" />
  <text x="1192" y="658" font-size="12" fill="#8B8679" font-weight="400" text-anchor="end">8 · 4 · 19 · 5</text>
  <text x="67" y="136" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">① 首次请求</text>
  <rect x="67" y="160" width="210" height="90" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="172.0" y="198.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">客户端</text>
  <text x="172.0" y="222.0" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">business_id = r17</text>
  <rect x="366" y="160" width="219" height="90" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="475.5" y="198.0" font-size="14" fill="#514573" font-weight="700" text-anchor="middle">去重查询</text>
  <text x="475.5" y="222.0" font-size="14" fill="#514573" font-weight="400" text-anchor="middle">r17 尚未提交</text>
  <rect x="676" y="151" width="315" height="165" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="2" />
  <text x="834" y="180" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">同一可恢复提交边界</text>
  <rect x="693" y="197" width="280" height="43" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="833.0" y="223.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">业务副作用</text>
  <rect x="693" y="254" width="280" height="43" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="833.0" y="280.5" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle">COMMITTED(r17, result)</text>
  <rect x="1064" y="160" width="127" height="90" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="1127.5" y="198.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">返回</text>
  <text x="1127.5" y="222.0" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">result</text>
  <polyline points="281,205 362,205" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <polyline points="589,205 672,205" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <polyline points="995,205 1060,205" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <polyline points="1127,254 1127,350 173,350 173,257" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#redarr)" stroke-dasharray="6 4" />
  <text x="465" y="338" font-size="14" fill="#733428" font-weight="700" text-anchor="start">回执在途中丢失，业务却已经提交</text>
  <line x1="620" y1="341" x2="638" y2="359" stroke="#A64B3C" stroke-width="2.5" />
  <line x1="620" y1="359" x2="638" y2="341" stroke="#A64B3C" stroke-width="2.5" />
  <text x="67" y="403" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">② 恢复后再请求</text>
  <rect x="67" y="423" width="210" height="87" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="172.0" y="459.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">客户端重试</text>
  <text x="172.0" y="483.5" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">仍使用 r17</text>
  <rect x="366" y="423" width="280" height="87" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="506.0" y="459.5" font-size="14" fill="#514573" font-weight="700" text-anchor="middle">查询 / 去重命中</text>
  <text x="506.0" y="483.5" font-size="14" fill="#514573" font-weight="400" text-anchor="middle">读取 COMMITTED 结果</text>
  <rect x="881" y="423" width="310" height="87" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="1036.0" y="459.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">返回原 result</text>
  <text x="1036.0" y="483.5" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">不再执行副作用</text>
  <polyline points="281,466 362,466" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <polyline points="650,466 877,466" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="700" y="451" font-size="13" fill="#24473F" font-weight="400" text-anchor="start">命中提交记录</text>
  <text x="66" y="558" font-size="14" fill="#733428" font-weight="700" text-anchor="start">错误窗口：先做副作用再记去重；或先记成功再做副作用。</text>
  <rect x="48" y="603" width="1144" height="47" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="66" y="632" font-size="14" fill="#4A473F" font-weight="700" text-anchor="start">语义边界</text>
  <text x="142" y="632" font-size="14" fill="#4A473F" font-weight="400" text-anchor="start">去重记录须与副作用一起恢复；保留期覆盖重试窗口，并写清崩溃与复制条件。</text>
</svg>