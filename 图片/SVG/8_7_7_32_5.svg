<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">每周检查一次，先算得过物理读取这笔账</title>
  <desc id="desc">假设：100 TiB 逻辑数据、三完整副本、无压缩去重；以下全部为计算示例。。原创教学示意图，非真实产品内部拓扑或性能实测。</desc>
  <defs>
    <marker id="arr-base" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B968A" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5B95" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="700" fill="#F5F4ED" stroke="none" rx="0" stroke-width="1.3" />
  <text x="48" y="53" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="title">每周检查一次，先算得过物理读取这笔账</text>
  <text x="48" y="82" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="subtitle">假设：100 TiB 逻辑数据、三完整副本、无压缩去重；以下全部为计算示例。</text>
  <text x="64" y="135" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">A · 一轮覆盖量：D = 300 TiB</text>
  <rect x="65" y="153" width="371" height="65" fill="#E3EAF4" stroke="#3D5A80" rx="0" stroke-width="1.3" />
  <text x="250.5" y="193" font-size="16" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">副本 1  ·  100 TiB</text>
  <rect x="436" y="153" width="371" height="65" fill="#DCE9E3" stroke="#2F6B5E" rx="0" stroke-width="1.3" />
  <text x="621.5" y="193" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">副本 2  ·  100 TiB</text>
  <rect x="807" y="153" width="371" height="65" fill="#EDEAF3" stroke="#6B5B95" rx="0" stroke-width="1.3" />
  <text x="992.5" y="193" font-size="16" fill="#544673" font-weight="700" text-anchor="middle" data-role="body">副本 3  ·  100 TiB</text>
  <rect x="49" y="243" width="548" height="256" fill="#FBFBF6" stroke="#D8D5C8" rx="8" stroke-width="1.3" />
  <text x="67" y="271" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">B · 从目标周期反推有效带宽</text>
  <text x="76" y="301" font-size="17" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">7 天 = 604,800 秒</text>
  <text x="76" y="343" font-size="19" fill="#2C4460" font-weight="700" text-anchor="start" data-role="body">B ≥ D / T ≈ 520.13 MiB/s</text>
  <text x="76" y="388" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">这是聚合、持续平均、有效读取量</text>
  <text x="76" y="432" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">每天只运行 25% 的时间</text>
  <text x="76" y="470" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">活跃窗口需 ≥ 2,080.51 MiB/s</text>
  <rect x="622" y="243" width="570" height="256" fill="#FBFBF6" stroke="#D8D5C8" rx="8" stroke-width="1.3" />
  <text x="640" y="271" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">C · 带宽不足，周期就会延长</text>
  <text x="645" y="308" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">520.13 MiB/s</text>
  <rect x="800" y="290" width="115.5" height="35" fill="#DCE9E3" stroke="#2F6B5E" rx="3" stroke-width="1.3" />
  <text x="927.5" y="314" font-size="14" fill="#24473F" font-weight="700" text-anchor="start" data-role="body">7.00 天</text>
  <text x="645" y="401" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">200 MiB/s</text>
  <rect x="800" y="383" width="300.37333333333333" height="35" fill="#F3E8D3" stroke="#8A6A3A" rx="3" stroke-width="1.3" />
  <text x="1112.3733333333334" y="407" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="start" data-role="body">18.20 天</text>
  <line x1="800" y1="456" x2="1130" y2="456" stroke="#9B968A" stroke-width="1" />
  <line x1="800.0" y1="453" x2="800.0" y2="461" stroke="#9B968A" stroke-width="1" />
  <text x="800.0" y="481" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">0</text>
  <line x1="915.5" y1="453" x2="915.5" y2="461" stroke="#9B968A" stroke-width="1" />
  <text x="915.5" y="481" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">7</text>
  <line x1="1031.0" y1="453" x2="1031.0" y2="461" stroke="#9B968A" stroke-width="1" />
  <text x="1031.0" y="481" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">14</text>
  <line x1="1130.0" y1="453" x2="1130.0" y2="461" stroke="#9B968A" stroke-width="1" />
  <text x="1130.0" y="481" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">20</text>
  <text x="657" y="480" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">周期（天）</text>
  <text x="65" y="536" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">D · 健康冗余恢复之前的暴露窗口</text>
  <rect x="65" y="555" width="320" height="49" fill="#F3E8D3" stroke="#8A6A3A" rx="0" stroke-width="1.3" />
  <text x="225.0" y="585" font-size="14.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">发现延迟</text>
  <rect x="385" y="555" width="230" height="49" fill="#F1EFE8" stroke="#9B968A" rx="0" stroke-width="1.3" />
  <text x="500.0" y="585" font-size="14.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">排队等待</text>
  <rect x="615" y="555" width="310" height="49" fill="#E3EAF4" stroke="#3D5A80" rx="0" stroke-width="1.3" />
  <text x="770.0" y="585" font-size="14.5" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">修复传输</text>
  <rect x="925" y="555" width="253" height="49" fill="#DCE9E3" stroke="#2F6B5E" rx="0" stroke-width="1.3" />
  <text x="1051.5" y="585" font-size="14.5" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">复核收尾</text>
  <text x="66" y="632" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">W = T_detect + T_queue + T_repair + T_verify</text>
  <line x1="48" y1="649" x2="1192" y2="649" stroke="#D8D5C8" stroke-width="1" />
  <text x="48" y="678" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">严格周期 T、损坏相位均匀且无延期时，平均发现延迟约 T/2；实际可靠性还受相关故障与剩余冗余影响。</text>
</svg>