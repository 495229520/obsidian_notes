<svg xmlns="http://www.w3.org/2000/svg" width="780" height="452" viewBox="0 0 780 452">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>Serialize() 序列化流程（以 Hello 为例）</title>
  <desc>CPacket 经过计算 bodyLength、分配缓冲、逐段 memcpy 写入，输出小端序字节流：Magic、BodyLen、Command、Payload、Checksum。</desc>
  <rect x="0" y="0" width="780" height="452" fill="rgb(245, 244, 237)"/>

  <text x="390" y="40" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Serialize() 序列化流程（以 Hello 为例）</text>

  <g>
    <rect x="160" y="70" width="460" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="390" y="88" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">CPacket</text>
    <text x="390" y="108" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central">command = 1001, payload = "123456\nAlice"</text>
  </g>

  <path d="M390 126 L390 188" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="130" y="188" width="520" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="390" y="208" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">① bodyLength = payload(12) + 2 + 2 = 16</text>
    <text x="390" y="228" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">② 分配 vector&lt;char&gt;(6 + 16 = 22)</text>
    <text x="390" y="248" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">③ 用 cursor 逐段 memcpy 写入</text>
  </g>

  <path d="M390 268 L390 330" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="700" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <line x1="110" y1="330" x2="110" y2="374" stroke="#185FA5" stroke-width="1"/>
  <line x1="230" y1="330" x2="230" y2="374" stroke="#185FA5" stroke-width="1"/>
  <line x1="300" y1="330" x2="300" y2="374" stroke="#185FA5" stroke-width="1"/>
  <line x1="660" y1="330" x2="660" y2="374" stroke="#185FA5" stroke-width="1"/>

  <text x="75" y="352" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">FF FE</text>
  <text x="170" y="352" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">10 00 00 00</text>
  <text x="265" y="352" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">E9 03</text>
  <text x="480" y="352" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">31 32 33 34 35 36 0A 41 6C 69 63 65</text>
  <text x="700" y="352" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">1D 03</text>

  <line x1="75" y1="374" x2="75" y2="384" stroke="#185FA5" stroke-width="1"/>
  <line x1="170" y1="374" x2="170" y2="384" stroke="#185FA5" stroke-width="1"/>
  <line x1="265" y1="374" x2="265" y2="384" stroke="#185FA5" stroke-width="1"/>
  <line x1="480" y1="374" x2="480" y2="384" stroke="#185FA5" stroke-width="1"/>
  <line x1="700" y1="374" x2="700" y2="384" stroke="#185FA5" stroke-width="1"/>

  <text x="75" y="394" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Magic</text>
  <text x="75" y="412" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">0xFEFF</text>
  <text x="170" y="394" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">BodyLen</text>
  <text x="170" y="412" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">16 · 小端序</text>
  <text x="265" y="394" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Cmd</text>
  <text x="265" y="412" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">1001</text>
  <text x="480" y="394" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Payload "123456\nAlice"</text>
  <text x="480" y="412" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">12 字节</text>
  <text x="700" y="394" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Chksum</text>
  <text x="700" y="412" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">0x031D</text>
</svg>
