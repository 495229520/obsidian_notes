  <title id="title">两份旧 Root 相等，仍然可能有一份数据坏了</title>
  <desc id="desc">摘要缓存描述的是过去的输入；重新读取才产生新的完整性证据。。原创教学示意图，非真实产品内部拓扑或性能实测。</desc>
