<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">union U 内部字节布局</title>
  <desc id="desc">char buf[5] 占 5 个字节，尾部补齐到 8 字节；int i 覆盖偏移 0 到 3 的 4 个字节。</desc>
  <rect width="980" height="360" fill="rgb(245, 244, 237)"/>

  <style>
    .title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
    .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
    .small { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5f6b76; }
    .cellText { font: 700 17px Consolas, "Microsoft YaHei", monospace; fill: #26323d; }
    .note { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5f6b76; }
    .buf { fill: #e8f3ff; stroke: #4f86c6; stroke-width: 1.5; }
    .pad { fill: #f2e7d5; stroke: #c58a45; stroke-width: 1.5; }
    .intBox { fill: #e8f7ee; stroke: #4f9b69; stroke-width: 1.8; }
    .grid { stroke: #cfd6d9; stroke-width: 1; }
  </style>

  <text x="60" y="44" class="title">单个 union U 的内部布局</text>
  <text x="60" y="72" class="note">sizeof(U) 向 4 字节对齐补齐：5 字节 buf + 3 字节尾部 padding = 8 字节</text>

  <g transform="translate(60 108)">
    <text x="0" y="20" class="small">偏移</text>
    <g transform="translate(120 0)">
      <text x="28" y="20" text-anchor="middle" class="small">0</text>
      <text x="98" y="20" text-anchor="middle" class="small">1</text>
      <text x="168" y="20" text-anchor="middle" class="small">2</text>
      <text x="238" y="20" text-anchor="middle" class="small">3</text>
      <text x="308" y="20" text-anchor="middle" class="small">4</text>
      <text x="378" y="20" text-anchor="middle" class="small">5</text>
      <text x="448" y="20" text-anchor="middle" class="small">6</text>
      <text x="518" y="20" text-anchor="middle" class="small">7</text>
    </g>

    <text x="0" y="76" class="label">buf[5]</text>
    <g transform="translate(120 42)">
      <rect x="0" y="0" width="70" height="54" class="buf"/>
      <rect x="70" y="0" width="70" height="54" class="buf"/>
      <rect x="140" y="0" width="70" height="54" class="buf"/>
      <rect x="210" y="0" width="70" height="54" class="buf"/>
      <rect x="280" y="0" width="70" height="54" class="buf"/>
      <rect x="350" y="0" width="70" height="54" class="pad"/>
      <rect x="420" y="0" width="70" height="54" class="pad"/>
      <rect x="490" y="0" width="70" height="54" class="pad"/>
      <text x="35" y="34" text-anchor="middle" class="cellText">b0</text>
      <text x="105" y="34" text-anchor="middle" class="cellText">b1</text>
      <text x="175" y="34" text-anchor="middle" class="cellText">b2</text>
      <text x="245" y="34" text-anchor="middle" class="cellText">b3</text>
      <text x="315" y="34" text-anchor="middle" class="cellText">b4</text>
      <text x="385" y="34" text-anchor="middle" class="cellText">pad</text>
      <text x="455" y="34" text-anchor="middle" class="cellText">pad</text>
      <text x="525" y="34" text-anchor="middle" class="cellText">pad</text>
    </g>
  </g>

  <g transform="translate(60 218)">
    <text x="0" y="20" class="small">偏移</text>
    <g transform="translate(120 0)">
      <text x="28" y="20" text-anchor="middle" class="small">0</text>
      <text x="98" y="20" text-anchor="middle" class="small">1</text>
      <text x="168" y="20" text-anchor="middle" class="small">2</text>
      <text x="238" y="20" text-anchor="middle" class="small">3</text>
    </g>

    <text x="0" y="76" class="label">int i</text>
    <g transform="translate(120 42)">
      <rect x="0" y="0" width="280" height="54" class="intBox"/>
      <line x1="70" y1="0" x2="70" y2="54" class="grid"/>
      <line x1="140" y1="0" x2="140" y2="54" class="grid"/>
      <line x1="210" y1="0" x2="210" y2="54" class="grid"/>
      <text x="140" y="34" text-anchor="middle" class="cellText">i 的 4 个字节</text>
    </g>
  </g>

  <text x="60" y="338" class="note">尾部 padding 不属于任何成员，只用于保证下一个 U 仍从满足 int 对齐的位置开始。</text>
</svg>
