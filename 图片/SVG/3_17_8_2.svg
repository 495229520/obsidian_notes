<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500">
  <rect x="0" y="0" width="940" height="500" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>双重检查锁定（DCLP）的重排隐患</title>
  <desc>new 表达式的分配、构造、发布指针三步可能被重排，使另一线程看到非空指针却指向未构造完的对象。</desc>

  <text x="470" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    双重检查锁定（DCLP）为何会出错
  </text>
  <text x="470" y="54" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">
    new 的三步可被重排，线程 B 看到非空指针却指向"半成品"对象
  </text>

  <!-- 线程 A 容器 -->
  <path d="M78 110 H442 A8 8 0 0 1 450 118 V422 A8 8 0 0 1 442 430 H78 A8 8 0 0 1 70 422 V118 A8 8 0 0 1 78 110 Z"
        fill="none" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="260" y="130" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C">线程 A：instance = new Singleton()</text>

  <rect x="100" y="150" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="260" y="175" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">① 分配内存（尚未构造）</text>
  <rect x="100" y="260" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="260" y="285" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">③ instance = 该地址  ← 被重排提前</text>
  <rect x="100" y="370" width="320" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="260" y="395" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">② 执行构造函数  ← 推迟到最后</text>
  <path d="M260 200 L260 260" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M260 310 L260 370" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 线程 B 容器 -->
  <path d="M528 200 H862 A8 8 0 0 1 870 208 V422 A8 8 0 0 1 862 430 H528 A8 8 0 0 1 520 422 V208 A8 8 0 0 1 528 200 Z"
        fill="none" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="695" y="222" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#633806">线程 B（并发读取）</text>

  <rect x="545" y="250" width="300" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="695" y="275" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">if (instance) 检查通过（非空）</text>
  <rect x="545" y="360" width="300" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="695" y="385" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">解引用 → 半构造对象 ✗ UB</text>
  <path d="M695 300 L695 360" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M420 285 L545 275" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="482" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#3C3489">看到非空指针</text>

  <text x="470" y="455" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    解决：① C++11 magic static（局部 static）② std::call_once ③ atomic&lt;T*&gt; 配 release/acquire
  </text>
</svg>
