<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 570" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>为什么非 volatile 的局部变量在 longjmp 之后会变回旧值</title>
  <desc>上半是三个时刻两个变量的状态网格：普通 int x 被编译器放进 rbx，setjmp 把 rbx 存进 env，赋值 10 只改了寄存器，longjmp 把 rbx 恢复成 0，于是打印出 0；volatile int y 每次读写都落到栈内存，env 不管栈内容，所以跳回来仍是 10。下半列出 C 标准判定值不确定的三个条件，以及不满足这些条件的几类数据。</desc>

  <rect x="0" y="0" width="1240" height="570" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">同一个 10，为什么 x 变回去了而 y 没有</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">差别不在语言规则，在编译器把这个变量放进了寄存器还是栈内存</text>

  <text x="56" y="118" font-size="13" font-weight="700" fill="#4A473F">A · 两个变量的三个时刻</text>

  <rect x="48" y="132" width="1144" height="262" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <text x="300" y="164" font-size="11.5" font-weight="700" fill="#4A473F">① setjmp 存档</text>
  <text x="578" y="164" font-size="11.5" font-weight="700" fill="#4A473F">② x = 10; y = 10</text>
  <text x="856" y="164" font-size="11.5" font-weight="700" fill="#4A473F">③ longjmp 打回来</text>

  <text x="72" y="232" font-size="11.5" font-weight="700" fill="#4A473F">x（普通 int）</text>
  <text x="72" y="254" font-size="10.5" fill="#6B675C">编译器把它放进 rbx</text>

  <rect x="300" y="200" width="256" height="76" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="318" y="228" font-size="11.5" font-weight="700" fill="#2C4460">rbx = 0</text>
  <text x="318" y="252" font-size="10.5" fill="#2C4460">env 里连 rbx 一起存下</text>

  <rect x="578" y="200" width="256" height="76" rx="7" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="596" y="228" font-size="11.5" font-weight="700" fill="#6B4E28">rbx = 10</text>
  <text x="596" y="252" font-size="10.5" fill="#6B4E28">只改了寄存器，没进内存</text>

  <rect x="856" y="200" width="304" height="76" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="874" y="228" font-size="11.5" font-weight="700" fill="#733428">rbx 被恢复成 0</text>
  <text x="874" y="252" font-size="10.5" fill="#733428">printf 打出来是 0</text>

  <text x="72" y="324" font-size="11.5" font-weight="700" fill="#4A473F">y（volatile int）</text>
  <text x="72" y="346" font-size="10.5" fill="#6B675C">每次读写都落到栈内存</text>

  <rect x="300" y="292" width="256" height="76" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="318" y="320" font-size="11.5" font-weight="700" fill="#2C4460">栈上 y = 0</text>
  <text x="318" y="344" font-size="10.5" fill="#2C4460">env 不管栈里的内容</text>

  <rect x="578" y="292" width="256" height="76" rx="7" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="596" y="320" font-size="11.5" font-weight="700" fill="#6B4E28">栈上 y = 10</text>
  <text x="596" y="344" font-size="10.5" fill="#6B4E28">写进了内存，落地了</text>

  <rect x="856" y="292" width="304" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="874" y="320" font-size="11.5" font-weight="700" fill="#24473F">栈上 y 还是 10</text>
  <text x="874" y="344" font-size="10.5" fill="#24473F">printf 打出来是 10</text>

  <text x="56" y="424" font-size="13" font-weight="700" fill="#4A473F">B · 标准划的线，以及实践里怎么写</text>

  <rect x="48" y="438" width="560" height="110" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="464" font-size="11.5" font-weight="700" fill="#4A473F">三个条件同时成立，值才不确定</text>
  <text x="68" y="490" font-size="10.5" fill="#4A473F">① 是调用 setjmp 那个函数的局部变量</text>
  <text x="68" y="514" font-size="10.5" fill="#4A473F">② 没有 volatile 限定</text>
  <text x="68" y="538" font-size="10.5" fill="#4A473F">③ 在 setjmp 与 longjmp 之间被改过</text>

  <rect x="624" y="438" width="568" height="110" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="644" y="464" font-size="11.5" font-weight="700" fill="#4A473F">少一个条件，值就是确定的</text>
  <text x="644" y="490" font-size="10.5" fill="#4A473F">跳回来还要读的局部变量：加 volatile</text>
  <text x="644" y="514" font-size="10.5" fill="#4A473F">static、全局、堆上的数据：不受影响</text>
  <text x="644" y="538" font-size="10.5" fill="#4A473F">更深层函数的局部变量：帧本来就没了</text>
</svg>
