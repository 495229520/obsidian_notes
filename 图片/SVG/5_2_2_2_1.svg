<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">位掩码表示集合与常用位操作</title>
  <desc id="desc">展示一个四位 mask 如何表示集合元素选择，以及测试位、置位、清位、翻转位四种常用操作。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4f5b66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
      .title { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #65717d; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #4d5965; }
      .bit { font-size: 22px; font-weight: 700; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 15px; fill: #22313f; }
      .box { fill: #fffaf0; stroke: #d2b46f; stroke-width: 1.6; rx: 8; }
      .op { fill: #f3fbf6; stroke: #69a87b; stroke-width: 1.5; rx: 8; }
      .note { fill: #eef5fb; stroke: #7ba5c7; stroke-width: 1.5; rx: 8; }
      .selected { fill: #dcefe4; stroke: #4d9465; stroke-width: 1.8; rx: 8; }
      .empty { fill: #f7eee3; stroke: #c89063; stroke-width: 1.6; rx: 8; }
    </style>
  </defs>

  <text class="title" x="48" y="54">位掩码：用一个整数表示一组选择</text>
  <text class="subtitle" x="48" y="82">第 i 位为 1 表示选择第 i 个元素；第 i 位为 0 表示未选择。</text>

  <rect class="box" x="58" y="126" width="390" height="150"/>
  <text class="label" x="82" y="160">示例集合</text>
  <text class="small" x="82" y="190">元素编号从右往左对应 bit0、bit1、bit2、bit3</text>
  <text class="mono" x="82" y="226">nums = [A, B, C, D]</text>
  <text class="mono" x="82" y="254">mask = 0b1011</text>

  <g transform="translate(535 124)">
    <text class="label" x="0" y="34">二进制位</text>
    <rect class="selected" x="0" y="58" width="72" height="72"/>
    <rect class="empty" x="84" y="58" width="72" height="72"/>
    <rect class="selected" x="168" y="58" width="72" height="72"/>
    <rect class="selected" x="252" y="58" width="72" height="72"/>
    <text class="bit" x="27" y="103">1</text>
    <text class="bit" x="111" y="103">0</text>
    <text class="bit" x="195" y="103">1</text>
    <text class="bit" x="279" y="103">1</text>
    <text class="small" x="19" y="153">bit3</text>
    <text class="small" x="103" y="153">bit2</text>
    <text class="small" x="187" y="153">bit1</text>
    <text class="small" x="271" y="153">bit0</text>
    <text class="small" x="23" y="180">D</text>
    <text class="small" x="107" y="180">C</text>
    <text class="small" x="191" y="180">B</text>
    <text class="small" x="275" y="180">A</text>
  </g>

  <path d="M 452 204 C 482 204 497 204 524 204" fill="none" stroke="#4f5b66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="note" x="58" y="322" width="390" height="88"/>
  <text class="label" x="82" y="354">mask = 0b1011 表示</text>
  <text class="small" x="82" y="384">A、B、D 被选中，C 未选中。</text>

  <g transform="translate(520 322)">
    <rect class="op" x="0" y="0" width="166" height="78"/>
    <text class="small" x="18" y="30">测试位</text>
    <text class="mono" x="18" y="56">mask &amp; (1&lt;&lt;i)</text>

    <rect class="op" x="190" y="0" width="166" height="78"/>
    <text class="small" x="208" y="30">置位</text>
    <text class="mono" x="208" y="56">mask | (1&lt;&lt;i)</text>

    <rect class="op" x="0" y="102" width="166" height="78"/>
    <text class="small" x="18" y="132">清位</text>
    <text class="mono" x="18" y="158">mask &amp; ~(1&lt;&lt;i)</text>

    <rect class="op" x="190" y="102" width="166" height="78"/>
    <text class="small" x="208" y="132">翻转</text>
    <text class="mono" x="208" y="158">mask ^ (1&lt;&lt;i)</text>
  </g>

  <text class="subtitle" x="58" y="486">面试中常见模式：把“是否选择、是否访问、是否存在”压缩进整数的每一位。</text>
</svg>
