<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>TX 的完成不是一种：先看是谁的资源，再看承诺覆盖哪一层</title><desc>上半部表示普通复制式 TCP 的共享数据关系；下半部是语义对照，不是固定先后时间线。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="ctrl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="51" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">TX 的完成不是一种：先看是谁的资源，再看承诺覆盖哪一层</text>
<text x="48" y="80" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">上半部表示普通复制式 TCP 的共享数据关系；下半部是语义对照，不是固定先后时间线。</text>
<rect x="48" y="112" width="1144" height="226" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="140" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · 同一 payload，可能由多个独立引用维持生命</text>
<rect x="78" y="173" width="226" height="83" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="191.0" y="197.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">用户原始 buffer</text>
<text x="191.0" y="219.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle">普通发送接受的前缀</text>
<text x="191.0" y="241.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle">返回后可按复制式规则复用</text>
<rect x="400" y="177" width="266" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="533.0" y="209.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">内核 payload 存储</text>
<text x="533.0" y="231.0" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle">线性区 / 页片段</text>
<path d="M 308,213 L 396,213" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="350" y="196" font-size="12" font-weight="400" fill="#3D5A80" text-anchor="middle">CPU 复制</text>
<rect x="841" y="156" width="315" height="60" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="998.5" y="180.0" font-size="14" font-weight="700" fill="#51416D" text-anchor="middle">TCP 保留的引用</text>
<text x="998.5" y="202.0" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">尚未确认时，可能用于重传</text>
<rect x="841" y="251" width="315" height="60" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="998.5" y="275.0" font-size="14" font-weight="700" fill="#733428" text-anchor="middle">下层 skb / 驱动引用</text>
<text x="998.5" y="297.0" font-size="12.5" font-weight="400" fill="#733428" text-anchor="middle">DMA 提交与设备完成清理</text>
<path d="M 836,186 L 729,186 L 729,200 L 670,200" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 836,281 L 729,281 L 729,232 L 670,232" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="411" y="288" font-size="13" font-weight="700" fill="#2F6B5E" text-anchor="start">引用全部释放后，存储才可能回收</text>
<text x="48" y="370" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">B · 四种事件，分别回答四个问题</text>
<rect x="48" y="387" width="234" height="36" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="63" y="411" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start">事件</text>
<rect x="282" y="387" width="440" height="36" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="297" y="411" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start">该事件提供的证据</text>
<rect x="722" y="387" width="470" height="36" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="737" y="411" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start">仍不能证明</text>
<rect x="48" y="423" width="234" height="47" rx="0" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="63" y="452" font-size="13" font-weight="700" fill="#2C4460" text-anchor="start">sendmsg 返回 n</text>
<rect x="282" y="423" width="440" height="47" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="297" y="452" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">内核已接受前 n 字节</text>
<rect x="722" y="423" width="470" height="47" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="737" y="452" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">设备已发送 / 远端已收到</text>
<rect x="48" y="470" width="234" height="47" rx="0" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="63" y="499" font-size="13" font-weight="700" fill="#733428" text-anchor="start">设备 TX 完成</text>
<rect x="282" y="470" width="440" height="47" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="297" y="499" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">对应驱动资源可按契约回收</text>
<rect x="722" y="470" width="470" height="47" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="737" y="499" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">TCP 已 ACK / 应用已执行</text>
<rect x="48" y="517" width="234" height="47" rx="0" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="63" y="546" font-size="13" font-weight="700" fill="#51416D" text-anchor="start">TCP 累计 ACK</text>
<rect x="282" y="517" width="440" height="47" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="297" y="546" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">相应字节范围已被对端 TCP 确认</text>
<rect x="722" y="517" width="470" height="47" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="737" y="546" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">应用已读取 / 数据已落盘</text>
<rect x="48" y="564" width="234" height="47" rx="0" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="63" y="593" font-size="13" font-weight="700" fill="#24473F" text-anchor="start">应用协议 ACK</text>
<rect x="282" y="564" width="440" height="47" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="297" y="593" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">协议明确定义的处理结果</text>
<rect x="722" y="564" width="470" height="47" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="737" y="593" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">协议没有承诺的持久性</text>
<text x="48" y="651" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start">MSG_ZEROCOPY 另有用户内存完成契约；设备回收与 ACK 的软件观察顺序不可简单按上表排列。</text>
<text x="48" y="679" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start">业务“已收到 / 已执行 / 已持久化”必须由应用协议明确区分。</text>
</svg>