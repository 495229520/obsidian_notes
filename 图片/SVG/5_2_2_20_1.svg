<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect width="980" height="520" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .cell { fill: #eef6fb; stroke: #6f94b3; stroke-width: 1.5; rx: 6; }
      .active { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2; rx: 6; }
      .safe { fill: #dff0ea; stroke: #45907a; stroke-width: 2; rx: 6; }
      .bad { fill: #fde2df; stroke: #d36b5f; stroke-width: 2; rx: 6; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .note { fill: #edf4f1; stroke: #9db7aa; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">背包 DP：0-1 背包倒序，完全背包正序</text>
  <text x="40" y="76" class="subtitle">一维压缩后，容量遍历方向决定当前物品能不能在同一轮被重复使用。</text>

  <rect x="56" y="120" width="402" height="260" class="panel"/>
  <text x="84" y="154" class="label">0-1 背包：容量倒序</text>
  <text x="84" y="180" class="small">每个物品最多用一次，读取的是上一轮状态</text>
  <g transform="translate(84,220)">
    <rect x="0" y="0" width="52" height="42" class="cell"/><text x="26" y="26" text-anchor="middle" class="mono">0</text>
    <rect x="60" y="0" width="52" height="42" class="cell"/><text x="86" y="26" text-anchor="middle" class="mono">1</text>
    <rect x="120" y="0" width="52" height="42" class="safe"/><text x="146" y="26" text-anchor="middle" class="mono">2</text>
    <rect x="180" y="0" width="52" height="42" class="cell"/><text x="206" y="26" text-anchor="middle" class="mono">3</text>
    <rect x="240" y="0" width="52" height="42" class="active"/><text x="266" y="26" text-anchor="middle" class="mono">4</text>
  </g>
  <path d="M 354 286 L 220 286" class="arrow"/>
  <text x="158" y="326" class="small">更新 dp[4] 时读取旧的 dp[2]</text>
  <text x="108" y="354" class="mono">for j = capacity ... weight</text>

  <rect x="522" y="120" width="402" height="260" class="panel"/>
  <text x="550" y="154" class="label">完全背包：容量正序</text>
  <text x="550" y="180" class="small">物品可重复使用，允许读取本轮刚更新的状态</text>
  <g transform="translate(550,220)">
    <rect x="0" y="0" width="52" height="42" class="cell"/><text x="26" y="26" text-anchor="middle" class="mono">0</text>
    <rect x="60" y="0" width="52" height="42" class="cell"/><text x="86" y="26" text-anchor="middle" class="mono">1</text>
    <rect x="120" y="0" width="52" height="42" class="safe"/><text x="146" y="26" text-anchor="middle" class="mono">2</text>
    <rect x="180" y="0" width="52" height="42" class="cell"/><text x="206" y="26" text-anchor="middle" class="mono">3</text>
    <rect x="240" y="0" width="52" height="42" class="active"/><text x="266" y="26" text-anchor="middle" class="mono">4</text>
  </g>
  <path d="M 698 286 L 832 286" class="arrow"/>
  <text x="582" y="326" class="small">dp[2] 可能已经用过当前物品</text>
  <text x="574" y="354" class="mono">for j = weight ... capacity</text>

  <rect x="150" y="426" width="680" height="38" class="note"/>
  <text x="490" y="450" text-anchor="middle" class="small">判断方向：最多用一次就倒序；可以重复用就正序。转移式相似，循环语义不同。</text>
</svg>
