<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 14px; fill: #435363; text-anchor: middle; }
      .small { font-size: 13px; fill: #526475; text-anchor: middle; }
    </style>
  </defs>
  <text x="56" y="54" class="title">CUTLASS 复现证据链</text>
  <text x="56" y="83" class="subtitle">从环境到报告，每个性能数字都要能追溯</text>

  <rect x="78" y="150" width="168" height="126" rx="8" fill="#e8f0f6" stroke="#86a8c4" stroke-width="2"/>
  <text x="162" y="188" class="head">Environment</text>
  <text x="162" y="222" class="body">commit / CUDA</text>
  <text x="162" y="248" class="small">GPU / compiler</text>

  <rect x="306" y="150" width="168" height="126" rx="8" fill="#efe8f6" stroke="#aa92c5" stroke-width="2"/>
  <text x="390" y="188" class="head">Command</text>
  <text x="390" y="222" class="body">example</text>
  <text x="390" y="248" class="small">profiler args</text>

  <rect x="534" y="150" width="168" height="126" rx="8" fill="#f4ead7" stroke="#c6a661" stroke-width="2"/>
  <text x="618" y="188" class="head">Raw Output</text>
  <text x="618" y="222" class="body">runtime</text>
  <text x="618" y="248" class="small">verification</text>

  <rect x="762" y="150" width="168" height="126" rx="8" fill="#e7efe3" stroke="#84a96d" stroke-width="2"/>
  <text x="846" y="188" class="head">CSV Row</text>
  <text x="846" y="222" class="body">same fields</text>
  <text x="846" y="248" class="small">same shape</text>

  <line x1="258" y1="213" x2="292" y2="213" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="486" y1="213" x2="520" y2="213" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="714" y1="213" x2="748" y2="213" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="236" y="382" width="648" height="88" rx="8" fill="#fffaf0" stroke="#d7c083"/>
  <text x="560" y="416" class="head">Report Section</text>
  <text x="560" y="446" class="body">setup -> result -> hierarchy -> comparison -> limitations -> next step</text>
