<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect x="0" y="0" width="1200" height="520" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#374151" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 13px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .muted { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 10; }
      .accent { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="60" y="55" class="title">Week 13：从 CUDA GEMM v1 升级到可解释的 v2</text>
  <text x="60" y="86" class="small">目标不是追平 cuBLAS，而是把优化层级、证据链和边界写清楚。</text>

  <rect x="60" y="135" width="210" height="170" class="box"/>
  <text x="88" y="172" class="label">Week 9 v1</text>
  <text x="88" y="207" class="small">naive kernel</text>
  <text x="88" y="234" class="small">shared tiled v1</text>
  <text x="88" y="261" class="small">small register block</text>

  <path d="M280 220 H372" class="line"/>

  <rect x="390" y="115" width="230" height="210" class="muted"/>
  <text x="420" y="153" class="label">GEMM v2 设计</text>
  <text x="420" y="189" class="small">threadblock tile</text>
  <text x="420" y="216" class="small">warp tile</text>
  <text x="420" y="243" class="small">thread tile</text>
  <text x="420" y="270" class="small">register accumulator</text>

  <path d="M630 220 H722" class="line"/>

  <rect x="740" y="95" width="250" height="250" class="accent"/>
  <text x="770" y="133" class="label">优化开关</text>
  <text x="770" y="169" class="small">vectorized load</text>
  <text x="770" y="196" class="small">alignment fallback</text>
  <text x="770" y="223" class="small">shared padding</text>
  <text x="770" y="250" class="small">simple pipeline</text>
  <text x="770" y="277" class="small">Nsight evidence</text>

  <path d="M1000 220 H1092" class="line"/>

  <rect x="60" y="375" width="1080" height="88" class="warn"/>
  <text x="92" y="412" class="label">Week 13 report 的判断口径</text>
  <text x="92" y="444" class="small">v2 是否更快，要同时看 correctness、TFLOPS、register count、occupancy、global load efficiency、bank conflict 和 stall reason。</text>

  <rect x="1110" y="184" width="30" height="72" fill="#059669" opacity="0.16" stroke="#059669" stroke-width="2" rx="6"/>
  <text x="1065" y="165" class="small">comparison</text>
  <text x="1068" y="283" class="tiny">v1 / v2 / Triton / CUTLASS / cuBLAS</text>
</svg>
