<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>以太网二层环路危害与 STP 剪枝成树</title>
  <desc>以太网帧缺乏 TTL 机制导致二层环路灾难，STP 通过分布式选举将物理冗余网络裁剪为逻辑无环树。</desc>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect x="0" y="0" width="1200" height="590" fill="rgb(245, 244, 237)"/>

  <!-- 顶部标题区 -->
  <text x="44" y="44" font-size="20" font-weight="700" fill="#2B2A26">以太网二层环路危害与 STP 剪枝成树</text>
  <text x="44" y="70" font-size="12.5" fill="#6B675C">以太网帧缺乏 TTL 机制导致广播风暴与 MAC 震荡；STP 在保持物理冗余的同时将转发拓扑裁为逻辑树</text>

  <!-- ========================================================================= -->
  <!-- 左卡片：A · 物理环路与二层三大灾难 -->
  <!-- ========================================================================= -->
  <rect x="44" y="90" width="536" height="470" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="44" y="90" width="536" height="34" rx="8" fill="#F4EAE6" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="60" y="112" font-size="13" font-weight="700" fill="#733428">A · 物理成环与三大二层灾难（无 TTL 机制）</text>

  <!-- 主机 A -->
  <rect x="70" y="150" width="94" height="42" rx="6" fill="#EDE9DF" stroke="#8C887B" stroke-width="1"/>
  <text x="117" y="169" font-size="11" font-weight="700" fill="#2B2A26" text-anchor="middle">主机 A</text>
  <text x="117" y="184" font-size="9.5" fill="#6B675C" text-anchor="middle">MAC: AA:AA:AA</text>

  <!-- 连线 Host A -> SW1 -->
  <line x1="164" y1="171" x2="210" y2="171" stroke="#8C887B" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="187" y="163" font-size="9.5" fill="#A64B3C" text-anchor="middle">ARP 广播</text>

  <!-- 交换机 SW1 -->
  <rect x="212" y="150" width="96" height="42" rx="6" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.2"/>
  <text x="260" y="169" font-size="11" font-weight="700" fill="#2B2A26" text-anchor="middle">SW1</text>
  <text x="260" y="184" font-size="9.5" fill="#6B675C" text-anchor="middle">MAC: 00:11:11</text>

  <!-- 交换机 SW2 -->
  <rect x="130" y="244" width="96" height="42" rx="6" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.2"/>
  <text x="178" y="263" font-size="11" font-weight="700" fill="#2B2A26" text-anchor="middle">SW2</text>
  <text x="178" y="278" font-size="9.5" fill="#6B675C" text-anchor="middle">MAC: 00:22:22</text>

  <!-- 交换机 SW3 -->
  <rect x="294" y="244" width="96" height="42" rx="6" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.2"/>
  <text x="342" y="263" font-size="11" font-weight="700" fill="#2B2A26" text-anchor="middle">SW3</text>
  <text x="342" y="278" font-size="9.5" fill="#6B675C" text-anchor="middle">MAC: 00:33:33</text>

  <!-- 环路死循环连线 -->
  <line x1="236" y1="192" x2="190" y2="244" stroke="#A64B3C" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="226" y1="265" x2="294" y2="265" stroke="#A64B3C" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="326" y1="244" x2="284" y2="192" stroke="#A64B3C" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- 环路中心警告 -->
  <circle cx="260" cy="235" r="16" fill="#FCEBE6" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="260" y="240" font-size="12" font-weight="700" fill="#A64B3C" text-anchor="middle">∞</text>

  <!-- 灾难解释卡片 -->
  <rect x="62" y="306" width="500" height="236" rx="6" fill="#FFFFFF" stroke="#E2DFD2" stroke-width="1"/>
  
  <text x="78" y="332" font-size="11" font-weight="700" fill="#A64B3C">1. 广播风暴 (Broadcast Storm)</text>
  <text x="94" y="352" font-size="10" fill="#5A564B">以太网帧无 TTL 机制，广播帧在环路中无限倍增泛洪，数秒打满带宽。</text>

  <text x="78" y="384" font-size="11" font-weight="700" fill="#A64B3C">2. MAC 地址表震荡 (MAC Flapping)</text>
  <text x="94" y="404" font-size="10" fill="#5A564B">同一 MAC 的广播帧从不同端口循环灌入，交换机 MAC 表不停重写抖动。</text>
  <text x="94" y="420" font-size="9.5" fill="#8C887B">示例：SW1 刚在 Gi0/1 记录 AA:AA，瞬间又在 Gi0/2 收到该帧并覆盖表项。</text>

  <text x="78" y="452" font-size="11" font-weight="700" fill="#A64B3C">3. 重复多副本数据帧 (Duplicate Frames)</text>
  <text x="94" y="472" font-size="10" fill="#5A564B">端点主机不断收到相同帧的无意义副本，触发网卡频繁中断，耗尽 CPU。</text>
  <text x="94" y="492" font-size="9.5" fill="#8C887B">即使是单播，当交换机在泛洪未知单播时也会瞬间演变为环路泛滥。</text>

  <!-- ========================================================================= -->
  <!-- 右卡片：B · STP 选举破环与逻辑转发树 -->
  <!-- ========================================================================= -->
  <rect x="620" y="90" width="536" height="470" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="620" y="90" width="536" height="34" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="636" y="112" font-size="13" font-weight="700" fill="#24473F">B · STP 选举破环与逻辑无环树（裁图成树）</text>

  <!-- 根交换机 SW1 -->
  <rect x="836" y="146" width="104" height="44" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="888" y="166" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">SW1 (Root Bridge)</text>
  <text x="888" y="181" font-size="9.5" fill="#3D5A80" text-anchor="middle">Priority: 4096 (最小优先)</text>

  <!-- 端口标签 SW1 -->
  <rect x="814" y="194" width="34" height="18" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="831" y="207" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">DP</text>

  <rect x="928" y="194" width="34" height="18" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="945" y="207" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">DP</text>

  <!-- 交换机 SW2 -->
  <rect x="706" y="246" width="100" height="42" rx="6" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.2"/>
  <text x="756" y="265" font-size="11" font-weight="700" fill="#2B2A26" text-anchor="middle">SW2 (非根桥)</text>
  <text x="756" y="280" font-size="9.5" fill="#6B675C" text-anchor="middle">BID: 32768:BB</text>

  <!-- 端口标签 SW2 -->
  <rect x="768" y="222" width="34" height="18" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="785" y="235" font-size="9.5" font-weight="700" fill="#2C4460" text-anchor="middle">RP</text>

  <rect x="810" y="258" width="34" height="18" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="827" y="271" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">DP</text>

  <!-- 交换机 SW3 -->
  <rect x="970" y="246" width="100" height="42" rx="6" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.2"/>
  <text x="1020" y="265" font-size="11" font-weight="700" fill="#2B2A26" text-anchor="middle">SW3 (非根桥)</text>
  <text x="1020" y="280" font-size="9.5" fill="#6B675C" text-anchor="middle">BID: 32768:CC</text>

  <!-- 端口标签 SW3 -->
  <rect x="974" y="222" width="34" height="18" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="991" y="235" font-size="9.5" font-weight="700" fill="#2C4460" text-anchor="middle">RP</text>

  <rect x="932" y="258" width="36" height="18" rx="3" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="950" y="271" font-size="9.5" font-weight="700" fill="#733428" text-anchor="middle">BLK</text>

  <!-- 活动链路 SW1-SW2 -->
  <line x1="848" y1="190" x2="774" y2="246" stroke="#2F6B5E" stroke-width="2.5"/>
  <!-- 活动链路 SW1-SW3 -->
  <line x1="928" y1="190" x2="1002" y2="246" stroke="#2F6B5E" stroke-width="2.5"/>

  <!-- 阻塞链路 SW2-SW3 -->
  <line x1="806" y1="267" x2="970" y2="267" stroke="#A64B3C" stroke-width="1.8" stroke-dasharray="4 4"/>
  <!-- 阻塞红叉 -->
  <circle cx="910" cy="267" r="11" fill="#FCEBE6" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="910" y="271" font-size="12" font-weight="700" fill="#A64B3C" text-anchor="middle">✕</text>

  <!-- STP 机制说明卡片 -->
  <rect x="638" y="306" width="500" height="236" rx="6" fill="#FFFFFF" stroke="#E2DFD2" stroke-width="1"/>
  
  <text x="654" y="332" font-size="11" font-weight="700" fill="#2F6B5E">1. 物理有环用于冗余，逻辑无环用于转发</text>
  <text x="670" y="352" font-size="10" fill="#5A564B">物理布线保持三角形全连接，单线损坏绝不造成单点瘫痪。</text>

  <text x="654" y="384" font-size="11" font-weight="700" fill="#2F6B5E">2. 阻塞端口（Blocking / Discarding）并非关机</text>
  <text x="670" y="404" font-size="10" fill="#5A564B">不转发业务数据帧、不学习 MAC 地址，但持续监听 BPDU 控制报文。</text>
  <text x="670" y="420" font-size="9.5" fill="#8C887B">若主链路断开，该端口能感知拓扑破损并在安全时间内恢复转发。</text>

  <text x="654" y="452" font-size="11" font-weight="700" fill="#2F6B5E">3. 选举角色权责明确</text>
  <text x="670" y="472" font-size="10" fill="#5A564B">Root Port（RP）：本台交换机通往根桥的最佳出口（每台非根仅选一个）。</text>
  <text x="670" y="492" font-size="10" fill="#5A564B">Designated Port（DP）：该网段通往根桥的最优接口（每个物理段选一个）。</text>
</svg>