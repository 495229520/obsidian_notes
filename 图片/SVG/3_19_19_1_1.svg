<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>RX：从网卡写入，到应用真正读到字节</title><desc>实线：数据与处理推进；虚线：通知与唤醒。主线为物理 NIC + 普通 IPv4/TCP 接收。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="ctrl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="51" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">RX：从网卡写入，到应用真正读到字节</text>
<text x="48" y="80" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">实线：数据与处理推进；虚线：通知与唤醒。主线为物理 NIC + 普通 IPv4/TCP 接收。</text>
<rect x="48" y="112" width="1144" height="104" rx="7" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="63" y="135" font-size="12.5" font-weight="700" fill="#A64B3C" text-anchor="start">硬件 · NIC</text>
<rect x="48" y="228" width="1144" height="104" rx="7" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="63" y="251" font-size="12.5" font-weight="700" fill="#2F6B5E" text-anchor="start">主机内存 · 驱动预置资源</text>
<rect x="48" y="344" width="1144" height="104" rx="7" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="63" y="367" font-size="12.5" font-weight="700" fill="#6B5B95" text-anchor="start">CPU · NAPI 与协议栈</text>
<rect x="48" y="460" width="1144" height="104" rx="7" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="63" y="483" font-size="12.5" font-weight="700" fill="#3D5A80" text-anchor="start">socket / 应用 · 就绪不等于已读取</text>
<rect x="80" y="148" width="180" height="52" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="170.0" y="168.0" font-size="14" font-weight="700" fill="#733428" text-anchor="middle">① 帧到达</text>
<text x="170.0" y="190.0" font-size="12.5" font-weight="400" fill="#733428" text-anchor="middle">RSS 选择 RX queue</text>
<rect x="322" y="148" width="210" height="52" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="427.0" y="168.0" font-size="14" font-weight="700" fill="#733428" text-anchor="middle">② DMA 写入</text>
<text x="427.0" y="190.0" font-size="12.5" font-weight="400" fill="#733428" text-anchor="middle">设备回写完成信息</text>
<rect x="574" y="148" width="185" height="52" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="666.5" y="168.0" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">③ MSI-X</text>
<text x="666.5" y="190.0" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle">仅通知，不搬整包</text>
<path d="M 264,174 L 318,174" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 534,174 L 570,174" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ctrl)"/>
<rect x="80" y="263" width="180" height="54" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="170.0" y="284.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">RX Ring</text>
<text x="170.0" y="306.0" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle">地址 / 长度 / 完成</text>
<rect x="322" y="263" width="210" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="427.0" y="284.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">接收 buffer / page</text>
<text x="427.0" y="306.0" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle">真正的 packet bytes</text>
<path d="M 427,202 L 427,259" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 260,278 L 298,278 L 298,214 L 322,214" fill="none" stroke="#5A564B" stroke-width="1.7"/>
<text x="264" y="302" font-size="11.5" font-weight="400" fill="#6B675C" text-anchor="start">引用</text>
<path d="M 350,200 L 285,220 L 168,220 L 168,259" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ctrl)"/>
<rect x="574" y="378" width="185" height="62" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="666.5" y="403.0" font-size="14" font-weight="700" fill="#51416D" text-anchor="middle">④ NAPI poll</text>
<text x="666.5" y="425.0" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">读取完成 · 批量处理</text>
<path d="M 667,202 L 667,374" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ctrl)"/>
<text x="678" y="286" font-size="12" font-weight="400" fill="#8A6A3A" text-anchor="start">schedule</text>
<path d="M 262,316 L 280,333 L 553,333 L 553,408 L 570,408" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ctrl)"/>
<text x="330" y="331" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start">完成状态 + DMA 同步</text>
<rect x="803" y="378" width="180" height="62" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="893.0" y="403.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">⑤ skb / GRO</text>
<text x="893.0" y="425.0" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle">数据引用 + 元数据</text>
<rect x="1024" y="378" width="142" height="62" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1095.0" y="403.0" font-size="14" font-weight="700" fill="#51416D" text-anchor="middle">⑥ IPv4 / TCP</text>
<text x="1095.0" y="425.0" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">校验 · 查找 · 排序</text>
<path d="M 761,409 L 799,409" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 987,409 L 1020,409" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 533,290 L 787,290 L 787,364 L 891,364 L 891,374" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="812" y="283" font-size="12" font-weight="400" fill="#2F6B5E" text-anchor="start">payload 引用</text>
<rect x="803" y="494" width="180" height="53" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="893.0" y="514.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">⑦ socket 可读</text>
<text x="893.0" y="536.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle">等待者有机会被唤醒</text>
<rect x="1024" y="494" width="142" height="53" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1095.0" y="514.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">⑧ recv/recvmsg</text>
<text x="1095.0" y="536.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle">字节进入用户 buf</text>
<path d="M 1095,442 L 1095,478 L 894,478 L 894,490" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 987,509 L 1020,509" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ctrl)"/>
<text x="1002" y="487" font-size="11.5" font-weight="400" fill="#8A6A3A" text-anchor="middle">唤醒</text>
<path d="M 987,535 L 1020,535" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="1002" y="563" font-size="11.5" font-weight="400" fill="#2F6B5E" text-anchor="middle">复制</text>
<text x="83" y="502" font-size="14" font-weight="700" fill="#3D5A80" text-anchor="start">线程可能仍在睡眠</text>
<text x="83" y="526" font-size="13" font-weight="400" fill="#2C4460" text-anchor="start">就绪事件 ≠ 已被调度 ≠ 已完成 RPC</text>
<text x="83" y="548" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start">NAPI 可继续处理新包，也可能清理 TX 完成</text>
<text x="48" y="598" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">观察点</text>
<rect x="120" y="612" width="238" height="49" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="239.0" y="630.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">NIC / 驱动</text>
<text x="239.0" y="652.5" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle">ethtool -S</text>
<rect x="372" y="612" width="246" height="49" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="495.0" y="630.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">每 CPU 的网络处理</text>
<text x="495.0" y="652.5" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle">interrupts / softnet_stat</text>
<rect x="632" y="612" width="230" height="49" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="747.0" y="630.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">socket 接收积压</text>
<text x="747.0" y="652.5" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle">ss -tinm / Recv-Q</text>
<rect x="876" y="612" width="316" height="49" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1034.0" y="630.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">应用消费与调度</text>
<text x="1034.0" y="652.5" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle">recv 进度 / 应用 p99</text>
<text x="48" y="684" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start">边界：GRO/RPS、socket 锁、busy polling 与 threaded NAPI 会改变具体分支；图不是固定函数调用栈。</text>
</svg>