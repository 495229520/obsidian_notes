<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>迭代式服务器与多进程并发服务器的时间轴对照</title>
  <desc>上面板是迭代式服务器：三个客户端同时到达，只有一个进程，服务段首尾相接排开，client 2 排队 3 秒、client 3 排队 6 秒，最后一个客户端到第 9 秒才完成。下面板是多进程：父进程只花时间在 accept 和 fork 上，随后一直阻塞在 accept；三个子进程的服务段几乎完全重叠，三个客户端在第 3.9 秒全部完成。图中假设单个客户端的处理需要 3 秒。</desc>

  <rect x="0" y="0" width="1240" height="660" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">并发省下的是排队时间，不是处理时间</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">图里假设每个客户端占用 3 秒，accept 加 fork 的开销按 0.3 秒画，三个客户端同时到达</text>

  <text x="56" y="118" font-size="13" font-weight="700" fill="#4A473F">A · 迭代式服务器：一个进程，一次只能招待一个人</text>
  <rect x="48" y="132" width="1144" height="176" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <text x="64" y="180" font-size="11.5" font-weight="700" fill="#4A473F">client 1</text>
  <text x="64" y="220" font-size="11.5" font-weight="700" fill="#4A473F">client 2</text>
  <text x="64" y="260" font-size="11.5" font-weight="700" fill="#4A473F">client 3</text>

  <rect x="210" y="160" width="288" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="354" y="180" font-size="10.5" fill="#24473F" text-anchor="middle">被服务 3 秒</text>

  <rect x="210" y="200" width="288" height="30" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="354" y="220" font-size="10.5" fill="#6B675C" text-anchor="middle">干等 3 秒</text>
  <rect x="498" y="200" width="288" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="642" y="220" font-size="10.5" fill="#24473F" text-anchor="middle">被服务 3 秒</text>

  <rect x="210" y="240" width="576" height="30" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="498" y="260" font-size="10.5" fill="#6B675C" text-anchor="middle">干等 6 秒</text>
  <rect x="786" y="240" width="288" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="930" y="260" font-size="10.5" fill="#24473F" text-anchor="middle">被服务 3 秒</text>

  <line x1="1074" y1="156" x2="1074" y2="284" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="1082" y="152" font-size="10.5" fill="#733428">第 9 秒才全部做完</text>

  <line x1="200" y1="284" x2="1110" y2="284" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="210" y1="284" x2="210" y2="291" stroke="#9B968A" stroke-width="1.2"/>
  <text x="210" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">0</text>
  <line x1="306" y1="284" x2="306" y2="291" stroke="#9B968A" stroke-width="1.2"/>
  <text x="306" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">1</text>
  <line x1="402" y1="284" x2="402" y2="291" stroke="#9B968A" stroke-width="1.2"/>
  <text x="402" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">2</text>
  <line x1="498" y1="284" x2="498" y2="291" stroke="#9B968A" stroke-width="1.2"/>
  <text x="498" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">3</text>
  <line x1="594" y1="284" x2="594" y2="291" stroke="#9B968A" stroke-width="1.2"/>
  <text x="594" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">4</text>
  <line x1="690" y1="284" x2="690" y2="291" stroke="#9B968A" stroke-width="1.2"/>
  <text x="690" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">5</text>
  <line x1="786" y1="284" x2="786" y2="291" stroke="#9B968A" stroke-width="1.2"/>
  <text x="786" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">6</text>
  <line x1="882" y1="284" x2="882" y2="291" stroke="#9B968A" stroke-width="1.2"/>
  <text x="882" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">7</text>
  <line x1="978" y1="284" x2="978" y2="291" stroke="#9B968A" stroke-width="1.2"/>
  <text x="978" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">8</text>
  <line x1="1074" y1="284" x2="1074" y2="291" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1074" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">9</text>
  <text x="1126" y="303" font-size="9.5" fill="#6B675C" text-anchor="middle">秒</text>

  <text x="56" y="344" font-size="13" font-weight="700" fill="#4A473F">B · 多进程：父进程只把时间花在 accept 和 fork 上</text>
  <rect x="48" y="358" width="1144" height="210" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <text x="64" y="403" font-size="11.5" font-weight="700" fill="#4A473F">父进程</text>
  <text x="64" y="442" font-size="11.5" font-weight="700" fill="#4A473F">子进程 1</text>
  <text x="64" y="474" font-size="11.5" font-weight="700" fill="#4A473F">子进程 2</text>
  <text x="64" y="506" font-size="11.5" font-weight="700" fill="#4A473F">子进程 3</text>

  <text x="256" y="376" font-size="10.5" fill="#6B4E28" text-anchor="middle">accept + fork ×3</text>
  <rect x="210" y="384" width="29" height="28" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.3"/>
  <rect x="239" y="384" width="29" height="28" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.3"/>
  <rect x="268" y="384" width="29" height="28" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.3"/>
  <rect x="297" y="384" width="777" height="28" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="686" y="403" font-size="10.5" fill="#2C4460" text-anchor="middle">又阻塞在 accept，等第 4 个客户端</text>

  <rect x="239" y="424" width="288" height="26" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="383" y="442" font-size="10.5" fill="#24473F" text-anchor="middle">服务 client 1</text>
  <rect x="268" y="456" width="288" height="26" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="412" y="474" font-size="10.5" fill="#24473F" text-anchor="middle">服务 client 2</text>
  <rect x="297" y="488" width="288" height="26" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="441" y="506" font-size="10.5" fill="#24473F" text-anchor="middle">服务 client 3</text>

  <line x1="585" y1="420" x2="585" y2="538" stroke="#2F6B5E" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="596" y="474" font-size="10.5" fill="#24473F">第 3.9 秒全部做完</text>

  <line x1="200" y1="538" x2="1110" y2="538" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="210" y1="538" x2="210" y2="545" stroke="#9B968A" stroke-width="1.2"/>
  <text x="210" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">0</text>
  <line x1="306" y1="538" x2="306" y2="545" stroke="#9B968A" stroke-width="1.2"/>
  <text x="306" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">1</text>
  <line x1="402" y1="538" x2="402" y2="545" stroke="#9B968A" stroke-width="1.2"/>
  <text x="402" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">2</text>
  <line x1="498" y1="538" x2="498" y2="545" stroke="#9B968A" stroke-width="1.2"/>
  <text x="498" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">3</text>
  <line x1="594" y1="538" x2="594" y2="545" stroke="#9B968A" stroke-width="1.2"/>
  <text x="594" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">4</text>
  <line x1="690" y1="538" x2="690" y2="545" stroke="#9B968A" stroke-width="1.2"/>
  <text x="690" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">5</text>
  <line x1="786" y1="538" x2="786" y2="545" stroke="#9B968A" stroke-width="1.2"/>
  <text x="786" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">6</text>
  <line x1="882" y1="538" x2="882" y2="545" stroke="#9B968A" stroke-width="1.2"/>
  <text x="882" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">7</text>
  <line x1="978" y1="538" x2="978" y2="545" stroke="#9B968A" stroke-width="1.2"/>
  <text x="978" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">8</text>
  <line x1="1074" y1="538" x2="1074" y2="545" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1074" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">9</text>
  <text x="1126" y="557" font-size="9.5" fill="#6B675C" text-anchor="middle">秒</text>

  <text x="68" y="600" font-size="11.5" fill="#4A473F">A 里三段绿色首尾相接，因为只有一个进程；B 里三段几乎完全重叠，父进程把连接派出去就走了。</text>
  <text x="68" y="624" font-size="11.5" fill="#4A473F">单个客户端并没有变快，它还是要 3 秒。省掉的是干等那部分，代价是同时驻留三个进程。</text>
</svg>
