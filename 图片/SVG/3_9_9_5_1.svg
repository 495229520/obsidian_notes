<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>QUIC Packet 结构：UDP 外壳、Long / Short Header 与 PN Space</title>
  <desc>展示一个 UDP Datagram 中合并多个 QUIC Packet、QUIC v1 Long Header 与 Short Header 的字段对照，以及 Initial、Handshake、Application 三个独立的 Packet Number Space。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <!-- 全图背景 -->
  <rect x="0" y="0" width="1240" height="730" fill="rgb(245, 244, 237)"/>

  <!-- 顶部标题区 (y <= 100) -->
  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">QUIC Packet 结构：UDP 外壳、Long / Short Header 与 PN Space</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">线格式以 QUIC v1 为例；头部保护覆盖 Packet Number，载荷由 AEAD 认证加密</text>

  <!-- ============ Section A: UDP Datagram 与 Coalescing ============ -->
  <text x="48" y="116" font-size="14" font-weight="700" fill="#4A473F">A · UDP Datagram 与 Coalescing（合包）机制</text>

  <rect x="48" y="128" width="1144" height="92" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="64" y="148" font-size="12" font-weight="700" fill="#2B2A26">单个 UDP Datagram</text>
  <text x="180" y="148" font-size="11" fill="#6B675C">单 UDP 数据报可合并多个不同加密级别的 QUIC Packet</text>
  <text x="1176" y="148" font-size="11" fill="#A64B3C" text-anchor="end">Short Header 无显式长度，必须位于合包末尾</text>

  <!-- Coalesced Packet 1: Initial -->
  <rect x="64" y="158" width="340" height="50" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="76" y="178" font-size="12" font-weight="700" fill="#2C4460">Initial Packet · Long Header</text>
  <text x="76" y="197" font-size="10.5" fill="#2C4460">Initial PN Space ｜ CRYPTO / ACK</text>
  <text x="392" y="188" font-size="10" fill="#3D5A80" text-anchor="end">带 Length</text>

  <!-- Coalesced Packet 2: Handshake -->
  <rect x="420" y="158" width="340" height="50" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="432" y="178" font-size="12" font-weight="700" fill="#24473F">Handshake Packet · Long Header</text>
  <text x="432" y="197" font-size="10.5" fill="#24473F">Handshake PN Space ｜ CRYPTO / ACK</text>
  <text x="748" y="188" font-size="10" fill="#2F6B5E" text-anchor="end">带 Length</text>

  <!-- Coalesced Packet 3: 1-RTT -->
  <rect x="776" y="158" width="400" height="50" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="788" y="178" font-size="12" font-weight="700" fill="#733428">1-RTT Packet · Short Header</text>
  <text x="788" y="197" font-size="10.5" fill="#733428">Application PN Space ｜ STREAM / ACK / 流控</text>
  <text x="1164" y="188" font-size="10" fill="#A64B3C" text-anchor="end">无显式 Length</text>

  <!-- 分隔虚线 -->
  <line x1="412" y1="158" x2="412" y2="208" stroke="#9B968A" stroke-dasharray="3 3" stroke-width="1.2"/>
  <line x1="768" y1="158" x2="768" y2="208" stroke="#9B968A" stroke-dasharray="3 3" stroke-width="1.2"/>

  <!-- ============ Section B: Long Header vs Short Header ============ -->
  <text x="48" y="246" font-size="14" font-weight="700" fill="#4A473F">B · QUIC v1 线格式：Long Header vs Short Header 对照</text>

  <!-- Panel Left: Long Header -->
  <rect x="48" y="258" width="736" height="232" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="64" y="280" font-size="12.5" font-weight="700" fill="#2B2A26">QUIC v1 Long Header</text>
  <text x="206" y="280" font-size="11" fill="#6B675C">适用 Initial / 0-RTT / Handshake；Retry 格式独立</text>

  <!-- Long Header: Public Fields -->
  <text x="64" y="304" font-size="10.5" font-weight="700" fill="#4A473F">未加密公共头部（网络可见）</text>
  <rect x="64" y="312" width="94" height="46" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="111" y="331" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">First Byte</text>
  <text x="111" y="347" font-size="9.5" fill="#2C4460" text-anchor="middle">Header Form / Type</text>

  <rect x="164" y="312" width="92" height="46" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="210" y="331" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">Version</text>
  <text x="210" y="347" font-size="9.5" fill="#4A473F" text-anchor="middle">32 bit (v1: 0x1)</text>

  <rect x="262" y="312" width="168" height="46" rx="5" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="346" y="331" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">DCID Len + DCID</text>
  <text x="346" y="347" font-size="9.5" fill="#6B4E28" text-anchor="middle">0–20 B（接收端标识）</text>

  <rect x="436" y="312" width="168" height="46" rx="5" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="520" y="331" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">SCID Len + SCID</text>
  <text x="520" y="347" font-size="9.5" fill="#6B4E28" text-anchor="middle">0–20 B（发送端标识）</text>

  <rect x="610" y="312" width="158" height="46" rx="5" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="689" y="331" font-size="11" font-weight="700" fill="#4A3F6B" text-anchor="middle">Type-Specific</text>
  <text x="689" y="347" font-size="9.5" fill="#4A3F6B" text-anchor="middle">Token Length + Token</text>

  <!-- Long Header: Protected Fields -->
  <text x="64" y="380" font-size="10.5" font-weight="700" fill="#4A473F">受保护字段与有效载荷</text>
  <rect x="64" y="388" width="94" height="50" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="111" y="408" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">Length</text>
  <text x="111" y="426" font-size="9.5" fill="#4A473F" text-anchor="middle">varint 载荷长</text>

  <rect x="164" y="388" width="140" height="50" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="234" y="408" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">Packet Number</text>
  <text x="234" y="426" font-size="9.5" fill="#733428" text-anchor="middle">1–4 B · 头部保护 (HP)</text>

  <rect x="310" y="388" width="458" height="50" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="539" y="408" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">Protected Payload + AEAD Tag</text>
  <text x="539" y="426" font-size="9.5" fill="#24473F" text-anchor="middle">装载 CRYPTO / ACK / PING / 流控等 Frame</text>

  <line x1="64" y1="452" x2="768" y2="452" stroke="#D8D5C8" stroke-width="1"/>
  <text x="64" y="472" font-size="10.5" fill="#6B675C">注：HP 为头部保护；PN 不在线路上明文暴露，同 Space 内单调递增</text>

  <!-- Panel Right: Short Header -->
  <rect x="800" y="258" width="392" height="232" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="816" y="280" font-size="12.5" font-weight="700" fill="#2B2A26">1-RTT Short Header</text>
  <text x="816" y="299" font-size="10.5" fill="#6B675C">稳态数据传输：省去 Version、SCID 与 Length</text>

  <rect x="816" y="312" width="360" height="46" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="996" y="331" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">First Byte</text>
  <text x="996" y="347" font-size="9.5" fill="#2C4460" text-anchor="middle">Fixed · Spin · Key Phase · PN Len（受 HP 保护）</text>

  <rect x="816" y="366" width="176" height="48" rx="5" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="904" y="386" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">Destination CID</text>
  <text x="904" y="403" font-size="9.5" fill="#6B4E28" text-anchor="middle">长度由握手上下文确定</text>

  <rect x="998" y="366" width="178" height="48" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1087" y="386" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">Packet Number</text>
  <text x="1087" y="403" font-size="9.5" fill="#733428" text-anchor="middle">1–4 B · 截断受 HP 保护</text>

  <rect x="816" y="422" width="360" height="50" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="996" y="442" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">1-RTT Protected Payload + AEAD Tag</text>
  <text x="996" y="459" font-size="9.5" fill="#24473F" text-anchor="middle">装载 STREAM / ACK / PATH 验证等 Frame</text>

  <!-- ============ Section C: 三个独立的 Packet Number Space ============ -->
  <text x="48" y="514" font-size="14" font-weight="700" fill="#4A473F">C · 三个独立的 Packet Number Space（独立编号与丢包恢复）</text>

  <!-- Card 1: Initial PN Space -->
  <rect x="48" y="526" width="364" height="102" rx="8" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.2"/>
  <path d="M48,534 A8,8 0 0,1 56,526 L404,526 A8,8 0 0,1 412,534 L412,554 L48,554 Z" fill="#E3EAF4"/>
  <text x="64" y="545" font-size="11.5" font-weight="700" fill="#2C4460">Initial Space</text>
  <text x="396" y="545" font-size="10" fill="#3D5A80" text-anchor="end">PN: 0, 1, 2…</text>
  <text x="64" y="572" font-size="10.5" fill="#2B2A26">• 包含包：Initial Packet（握手首包）</text>
  <text x="64" y="591" font-size="10.5" fill="#2B2A26">• 确认方式：仅由 Initial Packet 内 ACK 确认</text>
  <text x="64" y="610" font-size="10.5" fill="#2B2A26">• 密钥机制：由公开 Salt 与初始 DCID 派生</text>

  <!-- Card 2: Handshake PN Space -->
  <rect x="438" y="526" width="364" height="102" rx="8" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.2"/>
  <path d="M438,534 A8,8 0 0,1 446,526 L794,526 A8,8 0 0,1 802,534 L802,554 L438,554 Z" fill="#DCE9E3"/>
  <text x="454" y="545" font-size="11.5" font-weight="700" fill="#24473F">Handshake Space</text>
  <text x="786" y="545" font-size="10" fill="#2F6B5E" text-anchor="end">PN: 0, 1, 2…</text>
  <text x="454" y="572" font-size="10.5" fill="#2B2A26">• 包含包：Handshake Packet（证书/完成）</text>
  <text x="454" y="591" font-size="10.5" fill="#2B2A26">• 确认方式：仅由 Handshake 内 ACK 确认</text>
  <text x="454" y="610" font-size="10.5" fill="#2B2A26">• 密钥机制：由 TLS 1.3 握手协商密钥保护</text>

  <!-- Card 3: Application Data PN Space -->
  <rect x="828" y="526" width="364" height="102" rx="8" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.2"/>
  <path d="M828,534 A8,8 0 0,1 836,526 L1184,526 A8,8 0 0,1 1192,534 L1192,554 L828,554 Z" fill="#F0E0DB"/>
  <text x="844" y="545" font-size="11.5" font-weight="700" fill="#733428">Application Data Space</text>
  <text x="1176" y="545" font-size="10" fill="#A64B3C" text-anchor="end">PN: 0, 1, 2…</text>
  <text x="844" y="572" font-size="10.5" fill="#2B2A26">• 包含包：0-RTT 与 1-RTT Packet（应用数据）</text>
  <text x="844" y="591" font-size="10.5" fill="#2B2A26">• 确认方式：由 1-RTT ACK 确认；0-RTT 无 ACK</text>
  <text x="844" y="610" font-size="10.5" fill="#2B2A26">• 密钥机制：0-RTT 恢复密钥 / 1-RTT 稳态密钥</text>

  <!-- ============ Footer: 关键约束与口径 (y >= 730 - 90 = 640) ============ -->
  <rect x="48" y="644" width="1144" height="62" rx="8" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="668" font-size="11.5" font-weight="700" fill="#4A3F6B">核心约束：</text>
  <text x="135" y="668" font-size="11" fill="#4A473F">每个 Space 各自维护独立的 Packet Number（从 0 单调递增且永不复用），ACK 与丢包判定严格隔离。</text>
  <text x="135" y="688" font-size="11" fill="#4A473F">拥塞控制状态（cwnd、bytes_in_flight、pacing）与 RTT 估计则跨所有 Space 统一计算，防止重传放大。</text>
</svg>
