<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>gRPC AddCall 的 CQ 生命周期与所有权</title>
  <desc>上半部分展示 registry 先持有 AddCall，再以对象地址作为 tag 注册 RequestAdd；请求到达后补一个新 listener，并在 Finish 完成事件返回后退役当前对象。下半部分对照经典三态与本文两种等待态。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A6C1F"/>
    </marker>
  </defs>

  <rect width="1240" height="820" fill="#F5F4ED"/>
  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">AddCall 怎么被 CQ 反复叫回：tag 是身份，registry 才拥有对象</text>
  <text x="48" y="78" font-size="13.5" fill="#6B675C">同一个 AddCall 等两次完成事件：先等 RequestAdd 匹配请求，再等 Finish 完成响应阶段</text>

  <rect x="48" y="112" width="1144" height="448" rx="10"
        fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="142" font-size="14" font-weight="700" fill="#4A473F">A · 当前 AddCall 的生命周期</text>

  <rect x="78" y="180" width="205" height="104" rx="12"
        fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="180.5" y="210" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">① registry 取得所有权</text>
  <text x="180.5" y="237" font-size="11.5" fill="#2C4460" text-anchor="middle">unique_ptr&lt;AddCall&gt;</text>
  <text x="180.5" y="260" font-size="11" fill="#53677E" text-anchor="middle">tag = call.get()</text>

  <rect x="350" y="180" width="205" height="104" rx="12"
        fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="452.5" y="210" font-size="13" font-weight="700" fill="#4A3F68" text-anchor="middle">② Requesting</text>
  <text x="452.5" y="237" font-size="11.5" fill="#4A3F68" text-anchor="middle">RequestAdd(..., tag)</text>
  <text x="452.5" y="260" font-size="11" fill="#665B78" text-anchor="middle">等待新 RPC 匹配</text>

  <rect x="622" y="180" width="230" height="104" rx="12"
        fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="737" y="210" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">③ Request 事件返回</text>
  <text x="737" y="237" font-size="11.5" fill="#24473F" text-anchor="middle">ok=true，request/context 可用</text>
  <text x="737" y="260" font-size="11" fill="#4A655F" text-anchor="middle">先补 listener，再算 Add</text>

  <rect x="920" y="180" width="230" height="104" rx="12"
        fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="1035" y="210" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">④ Finishing</text>
  <text x="1035" y="237" font-size="11.5" fill="#6B4E28" text-anchor="middle">Finish(reply, status, tag)</text>
  <text x="1035" y="260" font-size="11" fill="#806541" text-anchor="middle">等待响应阶段完成</text>

  <line x1="283" y1="232" x2="350" y2="232" stroke="#3D5A80" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <line x1="555" y1="232" x2="622" y2="232" stroke="#6B5B95" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <line x1="852" y1="232" x2="920" y2="232" stroke="#2F6B5E" stroke-width="2.2" marker-end="url(#arrow-green)"/>

  <rect x="350" y="344" width="205" height="92" rx="12"
        fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="452.5" y="374" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">新的 AddCall</text>
  <text x="452.5" y="400" font-size="11.5" fill="#2C4460" text-anchor="middle">owner.CreateListener()</text>
  <text x="452.5" y="422" font-size="11" fill="#53677E" text-anchor="middle">继续等下一请求</text>

  <path d="M737 284 V322 H452.5 V344" fill="none" stroke="#2F6B5E" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="606" y="315" font-size="10.5" fill="#2F6B5E" text-anchor="middle">补位</text>

  <rect x="920" y="344" width="230" height="92" rx="12"
        fill="#F1EFE8" stroke="#5A564B" stroke-width="1.5"/>
  <text x="1035" y="374" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">⑤ Finish 事件返回</text>
  <text x="1035" y="400" font-size="11.5" fill="#4A473F" text-anchor="middle">OnCompletion(ok) → Retire</text>
  <text x="1035" y="422" font-size="11" fill="#6B675C" text-anchor="middle">registry erase，安全析构</text>

  <line x1="1035" y1="284" x2="1035" y2="344" stroke="#9A6C1F" stroke-width="2.2" marker-end="url(#arrow-gold)"/>

  <rect x="78" y="470" width="1072" height="62" rx="10" fill="#F3F1E9" stroke="#D8D5C8"/>
  <text x="98" y="495" font-size="11.5" font-weight="700" fill="#4A473F">所有权不变量</text>
  <text x="230" y="495" font-size="11" fill="#5A564B">CQ 只保存并返回 tag；对象在 tag 返回前始终由 registry 的 unique_ptr 持有</text>
  <text x="98" y="518" font-size="11.5" font-weight="700" fill="#4A473F">销毁条件</text>
  <text x="230" y="518" font-size="11" fill="#5A564B">只有 Finish 完成事件已经取出，当前 AddCall 才能从 registry 退役</text>

  <rect x="48" y="586" width="1144" height="174" rx="10"
        fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="616" font-size="14" font-weight="700" fill="#4A473F">B · 经典三态与本文两种等待态</text>

  <rect x="86" y="652" width="220" height="58" rx="9" fill="#E3EAF4" stroke="#3D5A80"/>
  <text x="196" y="676" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">CREATE</text>
  <text x="196" y="696" font-size="10.5" fill="#53677E" text-anchor="middle">注册 RequestAdd</text>

  <rect x="382" y="652" width="220" height="58" rx="9" fill="#DCE9E3" stroke="#2F6B5E"/>
  <text x="492" y="676" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">PROCESS</text>
  <text x="492" y="696" font-size="10.5" fill="#4A655F" text-anchor="middle">补位 + 业务计算 + 发起 Finish</text>

  <rect x="678" y="652" width="220" height="58" rx="9" fill="#F3E8D3" stroke="#B07D2B"/>
  <text x="788" y="676" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">FINISH</text>
  <text x="788" y="696" font-size="10.5" fill="#806541" text-anchor="middle">等待 Finish tag 后销毁</text>

  <line x1="306" y1="681" x2="382" y2="681" stroke="#5A564B" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="602" y1="681" x2="678" y2="681" stroke="#5A564B" stroke-width="2" marker-end="url(#arrow-gold)"/>

  <rect x="944" y="642" width="210" height="78" rx="9" fill="#EFEDF5" stroke="#6B5B95"/>
  <text x="1049" y="666" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">本文只枚举等待态</text>
  <text x="1049" y="688" font-size="10.5" fill="#665B78" text-anchor="middle">Requesting → Finishing</text>
  <text x="1049" y="708" font-size="10.5" fill="#665B78" text-anchor="middle">PROCESS 是事件内过渡</text>
</svg>
