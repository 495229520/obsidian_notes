<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" role="img" aria-label="负载因子与 rehash 示意" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>load_factor 与 rehash：桶变多，冲突链变短</title>
  <desc>本图延续教学函数 h(k)=7k+3。负载因子是元素数除以桶数。插入后超过阈值时，哈希表会增加桶数并重新计算每个 key 的桶下标，从而缩短冲突链。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">load_factor 与 rehash：桶变多，冲突链变短</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">冲突不能完全消失；哈希表用更多桶降低每个桶的平均元素数，换取更快的查找。</text>

  <text x="48" y="111" font-size="13" font-weight="700" fill="#4A473F">A · 负载因子：元素数 ÷ 桶数</text>
  <rect x="48" y="124" width="470" height="100" rx="10" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="283" y="158" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle">load_factor = size ÷ bucket_count</text>
  <text x="283" y="186" font-size="12" fill="#2C4460" text-anchor="middle">平均每桶元素数；越大，桶内链通常越长</text>
  <text x="283" y="209" font-size="11" fill="#2C4460" text-anchor="middle">例：5 个元素 / 5 个桶 = 1.0</text>
  <rect x="546" y="124" width="646" height="100" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="568" y="153" font-size="12" font-weight="700" fill="#4A473F">读法</text>
  <text x="568" y="180" font-size="11.5" fill="#4A473F">负载因子是“平均密度”，不是每个桶里元素数量完全相同。</text>
  <text x="568" y="204" font-size="11.5" fill="#6B675C">散列函数分布越均匀，真实桶内元素数越接近这个平均值。</text>

  <text x="48" y="262" font-size="13" font-weight="700" fill="#4A473F">B · 插入后超过 max_load_factor，触发 rehash</text>
  <rect x="48" y="275" width="224" height="66" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
  <text x="160" y="302" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">已有 5 元素 / 5 桶</text>
  <text x="160" y="325" font-size="11" fill="#6B675C" text-anchor="middle">load_factor = 1.0</text>
  <line x1="276" y1="308" x2="332" y2="308" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="340" y="275" width="200" height="66" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="440" y="302" font-size="12" font-weight="700" fill="#7A5518" text-anchor="middle">插入 key = 32</text>
  <text x="440" y="325" font-size="11" fill="#7A5518" text-anchor="middle">变成 6 元素 / 5 桶</text>
  <line x1="544" y1="308" x2="600" y2="308" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="608" y="275" width="244" height="66" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="730" y="302" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">6 / 5 = 1.2 &gt; 1.0</text>
  <text x="730" y="325" font-size="11" fill="#733428" text-anchor="middle">超过 max_load_factor</text>
  <line x1="856" y1="308" x2="912" y2="308" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="920" y="275" width="272" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1056" y="302" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">rehash：改为 11 个桶</text>
  <text x="1056" y="325" font-size="11" fill="#24473F" text-anchor="middle">所有 key 重新计算桶下标</text>

  <text x="48" y="382" font-size="13" font-weight="700" fill="#4A473F">C · 同一批 key：桶数改变后，桶下标也会改变</text>
  <rect x="48" y="395" width="496" height="206" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="422" font-size="13" font-weight="700" fill="#733428">rehash 前 · 5 个桶</text>
  <text x="68" y="446" font-size="11" fill="#6B675C">h(k) % 5：7、12、17、22、27 都等于 2</text>
  <rect x="68" y="462" width="128" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="132" y="491" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">bucket[2]</text>
  <line x1="200" y1="486" x2="246" y2="486" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="254" y="462" width="244" height="48" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="376" y="491" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">7 → 12 → 17 → 22 → 27</text>
  <text x="68" y="545" font-size="11.5" fill="#733428">一条长链：查找时可能要比较多个 key</text>
  <text x="68" y="574" font-size="11" fill="#6B675C">插入 32 后触发扩容；旧桶号不再适用。</text>

  <rect x="568" y="395" width="624" height="206" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="588" y="422" font-size="13" font-weight="700" fill="#24473F">rehash 后 · 11 个桶</text>
  <text x="588" y="446" font-size="11" fill="#6B675C">同一函数 h(k)，但取模除数改为 11；6 个 key 分散开</text>
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <rect x="588" y="462" width="170" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="673" y="486" fill="#24473F">bucket[1] · 17</text>
    <rect x="776" y="462" width="170" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="861" y="486" fill="#24473F">bucket[3] · 22</text>
    <rect x="964" y="462" width="170" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="1049" y="486" fill="#24473F">bucket[5] · 27</text>
    <rect x="588" y="514" width="170" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="673" y="538" fill="#24473F">bucket[7] · 32</text>
    <rect x="776" y="514" width="170" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="861" y="538" fill="#24473F">bucket[8] · 7</text>
    <rect x="964" y="514" width="170" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="1049" y="538" fill="#24473F">bucket[10] · 12</text>
  </g>
  <text x="588" y="579" font-size="11.5" fill="#2F6B5E">6 / 11 ≈ 0.55：链明显变短，查找更接近平均 O(1)</text>

  <rect x="48" y="620" width="1144" height="44" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="68" y="640" font-size="12" font-weight="700" fill="#6B4E28">工程权衡</text>
  <text x="170" y="640" font-size="11" fill="#6B4E28">较小的 max_load_factor：更快、更多内存；reserve(n)：提前开桶，减少 rehash 与迭代器失效。</text>
  <text x="68" y="657" font-size="11" fill="#6B4E28">rehash 需要把所有 key 重新落桶，单次 O(n)，但多次插入分摊后仍是平均 O(1)。</text>
</svg>
