<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1266" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrFaint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8574"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5B95"/>
    </marker>
  </defs>

  <title>写入路径全景：用户态内存、内核页缓存、块层与硬盘之间的数据流转</title>
  <desc>四层泳道图。① 用户态进程内存（应用 buf、stdio 库缓冲、mmap 映射区）两条路汇入 write() 陷入内核这一个入口；② 内核态先用 fd 表 → struct file → inode 定位，定位到的 inode 名下挂着两份内容：页缓存（数据，inode->i_mapping）与元数据（inode 自身 + journal），fsync 刷两份、fdatasync 主要刷数据；③ 块层 blk-mq 与驱动 DMA；④ 硬盘控制器易失缓存与持久介质。另标注三种事故下的丢失边界。</desc>

  <rect x="0" y="0" width="1240" height="1266" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">写入路径全景：一份数据在用户态内存、内核页缓存、盘上缓存与介质之间怎么走</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">每跨一层都要有人推它一把，每一层都有自己的丢失边界 —— fsync() 的职责，就是把数据一路推到最后一层</text>

  <!-- ============ 泳道背景 ============ -->
  <rect x="56" y="112" width="1128" height="152" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="136" font-size="12" font-weight="700" fill="#3D5A80">① 用户态 · 进程虚拟内存</text>

  <rect x="56" y="322" width="1128" height="254" rx="8" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="346" font-size="12" font-weight="700" fill="#2F6B5E">② 内核态 · VFS + 页缓存</text>

  <rect x="56" y="710" width="1128" height="128" rx="8" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="732" font-size="12" font-weight="700" fill="#6B5B95">③ 内核态 · 块层 blk-mq + 驱动</text>

  <rect x="56" y="908" width="1128" height="148" rx="8" fill="#F4E9E4" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="932" font-size="12" font-weight="700" fill="#A64B3C">④ 硬件 · 磁盘</text>

  <!-- ============ 泳道 1：用户态 ============ -->
  <rect x="84" y="150" width="330" height="98" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="249" y="174" font-size="13.5" font-weight="700" fill="#2C4460" text-anchor="middle">应用数据 buf[]</text>
  <text x="249" y="196" font-size="11" fill="#2C4460" text-anchor="middle">进程虚拟内存：堆 / 栈 / 全局区</text>
  <text x="249" y="216" font-size="11" fill="#2C4460" text-anchor="middle">读写它不需要任何系统调用</text>
  <text x="249" y="236" font-size="11" fill="#2C4460" text-anchor="middle">所有写操作的数据起点</text>

  <rect x="456" y="150" width="330" height="98" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="621" y="174" font-size="13.5" font-weight="700" fill="#7A5518" text-anchor="middle">stdio 库缓冲区（FILE*）</text>
  <text x="621" y="196" font-size="11" fill="#7A5518" text-anchor="middle">printf / fwrite 只是 memcpy 到这里</text>
  <text x="621" y="216" font-size="11" fill="#7A5518" text-anchor="middle">全缓冲 4096B ｜ 终端行缓冲 ｜ stderr 无缓冲</text>
  <text x="621" y="237" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">仍是用户态内存：进程被 kill 即丢</text>

  <rect x="828" y="150" width="330" height="98" rx="7" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3" stroke-dasharray="7 4"/>
  <text x="993" y="174" font-size="13.5" font-weight="700" fill="#4A473F" text-anchor="middle">mmap 映射区（旁路）</text>
  <text x="993" y="196" font-size="11" fill="#4A473F" text-anchor="middle">缺页后映射到的就是页缓存的物理页</text>
  <text x="993" y="216" font-size="11" fill="#4A473F" text-anchor="middle">写内存 = 直接改页缓存，不走 write()</text>
  <text x="993" y="236" font-size="11" fill="#4A473F" text-anchor="middle">落盘要 msync(MS_SYNC)</text>

  <!-- ============ 用户态 / 内核态 分界 + 唯一入口 ============ -->
  <line x1="56" y1="294" x2="134" y2="294" stroke="#8A8574" stroke-width="1.3" stroke-dasharray="8 5"/>
  <line x1="666" y1="294" x2="1184" y2="294" stroke="#8A8574" stroke-width="1.3" stroke-dasharray="8 5"/>
  <text x="1180" y="288" font-size="11" font-weight="700" fill="#6B675C" text-anchor="end">用户态 ↑ ｜ 内核态 ↓</text>

  <line x1="249" y1="250" x2="249" y2="274" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="258" y="267" font-size="10.5" fill="#4A473F">绕过 stdio 直接写</text>

  <line x1="621" y1="250" x2="621" y2="274" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="630" y="267" font-size="10.5" font-weight="700" fill="#8A6A3A">fflush() / 缓冲满 / 进程正常退出</text>

  <rect x="140" y="278" width="520" height="32" rx="16" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="400" y="299" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">write()：陷入内核（模式切换）+ copy_from_user 拷贝①</text>

  <line x1="340" y1="312" x2="340" y2="380" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- mmap 旁路：不经过 write() 入口，直接落在页缓存页上 -->
  <path d="M993,250 L993,332 L760,332 L760,392" fill="none" stroke="#8A8574" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#arrFaint)"/>
  <text x="985" y="324" font-size="10.5" fill="#4A473F" text-anchor="end">不经过 write()，写映射页即改页缓存</text>

  <!-- ============ 泳道 2：定位链 + inode 名下的两份内容 ============ -->
  <rect x="84" y="384" width="300" height="144" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="234" y="410" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">fd 表 → struct file → inode</text>
  <text x="234" y="436" font-size="11" fill="#24473F" text-anchor="middle">fd 只是进程内的下标</text>
  <text x="234" y="458" font-size="11" fill="#24473F" text-anchor="middle">偏移量 f_pos 存在 struct file 里</text>
  <text x="234" y="480" font-size="11" fill="#24473F" text-anchor="middle">lseek() 改的就是它</text>
  <text x="234" y="504" font-size="11" font-weight="700" fill="#2F6B5E" text-anchor="middle">dup/dup2 共享同一个 file</text>

  <rect x="430" y="358" width="728" height="200" rx="8" fill="none" stroke="#2F6B5E" stroke-width="1.3" stroke-dasharray="7 5"/>
  <text x="446" y="382" font-size="12.5" font-weight="700" fill="#24473F">同一个 inode 名下的两份内容</text>
  <text x="1142" y="382" font-size="10" fill="#6B675C" text-anchor="end">数据挂在 inode-&gt;i_mapping，元数据就是 inode 自己</text>

  <rect x="446" y="396" width="344" height="120" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="618" y="420" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">数据：页缓存 page cache</text>
  <text x="618" y="444" font-size="11" fill="#24473F" text-anchor="middle">inode-&gt;i_mapping 里的 4KB 页</text>
  <text x="618" y="464" font-size="11" fill="#24473F" text-anchor="middle">拷入后置 PG_dirty，write() 返回</text>
  <text x="618" y="484" font-size="11" fill="#24473F" text-anchor="middle">read() 命中时也只在这一层拷贝</text>
  <text x="618" y="505" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">只在内存里：内核崩溃 / 掉电即丢</text>

  <rect x="814" y="396" width="328" height="120" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="978" y="420" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">元数据：inode 自身 + journal</text>
  <text x="978" y="444" font-size="11" fill="#24473F" text-anchor="middle">文件大小 i_size、mtime、块映射</text>
  <text x="978" y="464" font-size="11" fill="#24473F" text-anchor="middle">写数据会顺带改它（文件变大）</text>
  <text x="978" y="484" font-size="11" fill="#24473F" text-anchor="middle">fdatasync 跳过不影响读取的部分</text>
  <text x="978" y="505" font-size="10.5" fill="#4A473F" text-anchor="middle">journal 保证崩溃后结构一致</text>

  <line x1="386" y1="456" x2="426" y2="456" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arrTeal)"/>
  <line x1="792" y1="456" x2="810" y2="456" stroke="#2F6B5E" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrTeal)"/>

  <text x="566" y="540" font-size="10.5" font-weight="700" fill="#733428">fsync(fd) 把这两份一起刷；fdatasync(fd) 只保证左边 + 影响读取的元数据，跳过 mtime</text>

  <!-- 页缓存 → 块层 -->
  <path d="M520,518 L520,592 L380,592 L380,742" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="368" y="622" font-size="11" fill="#4A473F" text-anchor="end">脏页被挑出来</text>
  <text x="368" y="640" font-size="11" fill="#4A473F" text-anchor="end">构造 bio 提交给块层</text>

  <!-- 回写时机说明条 -->
  <rect x="456" y="600" width="702" height="96" rx="7" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="470" y="622" font-size="12.5" font-weight="700" fill="#2B2A26">脏页什么时候真的被写下去？</text>
  <text x="1144" y="622" font-size="10" fill="#6B675C" text-anchor="end">O_DIRECT：绕过页缓存，用户 buf 与磁盘直接 DMA（仍需 fsync 保元数据）</text>
  <text x="470" y="646" font-size="10.5" fill="#4A473F">· 回写线程周期唤醒，把驻留超过 dirty_expire_centisecs（默认 30s）的脏页写出</text>
  <text x="470" y="666" font-size="10.5" fill="#4A473F">· 脏页占比超过 dirty_background_ratio 触发后台回写；超过 dirty_ratio 时写者被直接阻塞</text>
  <text x="470" y="686" font-size="10.5" font-weight="700" fill="#733428">· 应用显式调用 fsync() / fdatasync() / sync()：立刻提交并等待完成 —— 唯一可控的时机</text>

  <!-- ============ 泳道 3：块层 ============ -->
  <rect x="84" y="750" width="330" height="76" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="249" y="774" font-size="13" font-weight="700" fill="#4A3F68" text-anchor="middle">提交 bio → 通用块层</text>
  <text x="249" y="796" font-size="10.5" fill="#4A3F68" text-anchor="middle">把「哪些页写到哪些扇区」打包成请求</text>
  <text x="249" y="816" font-size="10.5" fill="#4A3F68" text-anchor="middle">数据这时仍然只在内核内存里</text>

  <rect x="456" y="750" width="330" height="76" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="621" y="774" font-size="13" font-weight="700" fill="#4A3F68" text-anchor="middle">blk-mq 队列 + IO 调度</text>
  <text x="621" y="796" font-size="10.5" fill="#4A3F68" text-anchor="middle">排队、相邻请求合并、取 tag 下发</text>
  <text x="621" y="816" font-size="10.5" fill="#4A3F68" text-anchor="middle">队列越深，单个请求排队越久</text>

  <rect x="828" y="750" width="330" height="76" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="993" y="774" font-size="13" font-weight="700" fill="#4A3F68" text-anchor="middle">驱动 + DMA 搬运</text>
  <text x="993" y="796" font-size="10.5" fill="#4A3F68" text-anchor="middle">设备主动读物理内存，不占用 CPU</text>
  <text x="993" y="816" font-size="10.5" fill="#4A3F68" text-anchor="middle">所以这一步没有第二次 CPU 拷贝</text>

  <line x1="416" y1="788" x2="452" y2="788" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="788" y1="788" x2="824" y2="788" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 内核 / 硬件 分界 -->
  <line x1="56" y1="890" x2="1184" y2="890" stroke="#8A8574" stroke-width="1.3" stroke-dasharray="8 5"/>
  <text x="1180" y="884" font-size="11" font-weight="700" fill="#6B675C" text-anchor="end">内核 ↑ ｜ 硬件 ↓</text>

  <path d="M993,828 L993,862 L249,862 L249,944" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="621" y="854" font-size="11" fill="#4A473F" text-anchor="middle">DMA：设备把页缓存对应的物理页搬走，不消耗 CPU 拷贝</text>

  <!-- ============ 泳道 4：硬盘 ============ -->
  <rect x="84" y="948" width="280" height="94" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="224" y="972" font-size="13" font-weight="700" fill="#733428" text-anchor="middle">磁盘控制器缓存（DRAM）</text>
  <text x="224" y="994" font-size="10.5" fill="#733428" text-anchor="middle">写缓存开启时数据先落这里</text>
  <text x="224" y="1014" font-size="10.5" fill="#733428" text-anchor="middle">盘会立刻回复「写完了」</text>
  <text x="224" y="1034" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">易失：断电即丢</text>

  <rect x="470" y="948" width="290" height="94" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="2"/>
  <text x="615" y="972" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">持久介质：盘片 / NAND</text>
  <text x="615" y="994" font-size="10.5" fill="#24473F" text-anchor="middle">到这里才配叫「落盘」</text>
  <text x="615" y="1014" font-size="10.5" fill="#24473F" text-anchor="middle">需 FLUSH 命令或 FUA 写才进得来</text>
  <text x="615" y="1034" font-size="10.5" font-weight="700" fill="#2F6B5E" text-anchor="middle">掉电安全</text>

  <rect x="850" y="948" width="308" height="94" rx="7" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
  <text x="1004" y="972" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">掉电保护 PLP（企业盘）</text>
  <text x="1004" y="994" font-size="10.5" fill="#4A473F" text-anchor="middle">超级电容在断电瞬间把缓存写完</text>
  <text x="1004" y="1014" font-size="10.5" fill="#4A473F" text-anchor="middle">有 PLP 才能把盘缓存视为持久</text>
  <text x="1004" y="1034" font-size="10.5" fill="#4A473F" text-anchor="middle">消费级盘通常没有，只能靠 FLUSH</text>

  <line x1="366" y1="1000" x2="466" y2="1000" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="416" y="980" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">FLUSH / FUA</text>

  <!-- ============ fsync 覆盖范围（左侧括号）============ -->
  <line x1="44" y1="322" x2="44" y2="1056" stroke="#A64B3C" stroke-width="1.8"/>
  <line x1="44" y1="322" x2="56" y2="322" stroke="#A64B3C" stroke-width="1.8"/>
  <line x1="44" y1="1056" x2="56" y2="1056" stroke="#A64B3C" stroke-width="1.8"/>
  <text x="30" y="689" transform="rotate(-90 30 689)" text-anchor="middle" font-size="11.5" font-weight="700" fill="#A64B3C">fsync()：等这一整段全部完成才返回</text>

  <!-- ============ read 反向路径（右侧）============ -->
  <path d="M1204,1042 L1204,342" fill="none" stroke="#6B5B95" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrPurple)"/>
  <text x="1216" y="690" transform="rotate(90 1216 690)" text-anchor="middle" font-size="11" fill="#6B5B95">read() 沿同一条路反着走：介质 → DMA → 页缓存 → copy_to_user</text>

  <!-- ============ 三种事故的丢失边界 ============ -->
  <text x="56" y="1092" font-size="14" font-weight="700" fill="#2B2A26">三种事故，三条丢失边界<tspan font-size="11.5" font-weight="400" fill="#6B675C">（数据停在哪一层，就有哪一种丢法）</tspan></text>

  <rect x="56" y="1104" width="366" height="70" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
  <text x="74" y="1128" font-size="12" font-weight="700" fill="#7A5518">进程崩溃（kill -9 / 段错误）</text>
  <text x="74" y="1148" font-size="10.5" fill="#4A473F">只丢 stdio 库缓冲里还没 write 出去的部分；</text>
  <text x="74" y="1166" font-size="10.5" fill="#4A473F">已进页缓存的由内核保管，之后照样落盘</text>

  <rect x="437" y="1104" width="366" height="70" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="455" y="1128" font-size="12" font-weight="700" fill="#733428">内核 panic / 突然掉电</text>
  <text x="455" y="1148" font-size="10.5" fill="#4A473F">页缓存脏页全丢；无 PLP 时盘上缓存也丢；</text>
  <text x="455" y="1166" font-size="10.5" fill="#4A473F">write() 早已成功返回也救不回来</text>

  <rect x="818" y="1104" width="366" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="836" y="1128" font-size="12" font-weight="700" fill="#24473F">fsync() 成功返回之后</text>
  <text x="836" y="1148" font-size="10.5" fill="#4A473F">数据与元数据已穿过页缓存、块层、盘缓存，</text>
  <text x="836" y="1166" font-size="10.5" fill="#4A473F">进入介质：上面两种事故都不再丢</text>

  <rect x="56" y="1194" width="1128" height="46" rx="8" fill="#F3EEE4" stroke="#B07D2B" stroke-width="1.3"/>
  <text x="76" y="1222" font-size="12.5" font-weight="700" fill="#733428">记住三句话：fflush() 只跨用户态那一层；write() 返回只代表进了内核页缓存；只有 fsync() 返回，才代表数据真正写进了介质。</text>
</svg>
