<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">一次提交之后：谁推进，谁读错，谁回收</title><desc id="desc">三个泳道分别为发送线程、provider与CQ轮询线程，展示提交后在途操作、手动进展及完成/错误分流。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">一次提交之后：谁推进，谁读错，谁回收</text>
<text x="48" y="83" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">提交 EAGAIN 是“未接受”；CQ EAGAIN 是“暂无完成”；两者不是同一个状态</text>
<rect x="48" y="123" width="1144" height="102" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="66" y="148" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">发送线程</text>
<rect x="48" y="239" width="1144" height="88" rx="8" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="66" y="264" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">Provider</text>
<rect x="48" y="342" width="1144" height="200" rx="8" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="66" y="367" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">CQ 轮询线程</text>
<rect x="207" y="147" width="170" height="53" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="292.0" y="168.55" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">fi_send / fi_write</text>
<text x="292.0" y="187.55" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle">提交一次请求</text>
<rect x="463" y="147" width="179" height="53" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="552.5" y="168.55" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">返回 0</text>
<text x="552.5" y="187.55" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle">已接受 · 进入在途</text>
<line x1="379" y1="173" x2="459" y2="173" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="727" y="147" width="257" height="53" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="855.5" y="168.55" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">保留必要资源</text>
<text x="855.5" y="187.55" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">源缓冲 / MR / context</text>
<line x1="644" y1="173" x2="723" y2="173" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="1015" y="146" width="155" height="57" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="1092.5" y="169.2" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">-FI_EAGAIN</text>
<text x="1092.5" y="188.2" font-size="12" font-weight="400" fill="#733428" text-anchor="middle">未接受，可重试</text>
<path d="M 292,145 L 292,131 L 1092,131 L 1092,142" fill="none" stroke="#A64B3C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<rect x="463" y="256" width="268" height="53" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="597.0" y="277.55" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">连接 / 匹配 / 数据传输</text>
<text x="597.0" y="296.55" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle">手动模式需要进入进展路径</text>
<line x1="552" y1="202" x2="552" y2="252" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="867" y="256" width="303" height="53" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="1018.5" y="277.55" font-size="13" font-weight="700" fill="#4F446B" text-anchor="middle">完成项或异步异常</text>
<text x="1018.5" y="296.55" font-size="13" font-weight="400" fill="#4F446B" text-anchor="middle">进入对应完成机制</text>
<line x1="733" y1="282" x2="863" y2="282" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="207" y="411" width="190" height="56" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="302.0" y="434.05" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">fi_cq_read</text>
<text x="302.0" y="453.05" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle">读取并推进关联操作</text>
<path d="M 399,439 L 438,439 L 438,368 L 477,368" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M 399,439 L 438,439 L 438,430 L 477,430" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M 399,439 L 438,439 L 438,492 L 477,492" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="480" y="349" width="245" height="38" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="602.5" y="372.55" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">-FI_EAGAIN / 暂无项</text>
<rect x="480" y="411" width="245" height="38" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="602.5" y="434.55" font-size="13" font-weight="700" fill="#733428" text-anchor="middle">-FI_EAVAIL / 有错误</text>
<rect x="480" y="473" width="245" height="38" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="602.5" y="496.55" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">返回项数 &gt; 0</text>
<rect x="815" y="349" width="356" height="38" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="993.0" y="372.55" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">等待 / 推进；不重发已接受请求</text>
<rect x="815" y="400" width="356" height="61" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="993.0" y="425.55" font-size="13" font-weight="700" fill="#733428" text-anchor="middle">fi_cq_readerr → fi_cq_strerror</text>
<text x="993.0" y="444.55" font-size="13" font-weight="400" fill="#733428" text-anchor="middle">复制错误信息，交给状态机</text>
<rect x="815" y="473" width="356" height="38" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="993.0" y="496.55" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">校验 flags / context，处理完成</text>
<line x1="727" y1="368" x2="811" y2="368" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="727" y1="430" x2="811" y2="430" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="727" y1="492" x2="811" y2="492" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M 300,409 L 300,284 L 459,284" fill="none" stroke="#6B5B95" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="313" y="320" font-size="12" font-weight="400" fill="#6B5B95" text-anchor="start">manual progress</text>
<rect x="48" y="564" width="552" height="76" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="324.0" y="596.4" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">本地资源回收</text>
<text x="324.0" y="617.4" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">达到约定完成条件；更新在途账目</text>
<rect x="624" y="564" width="568" height="76" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="908.0" y="596.4" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">目标 slot 回收</text>
<text x="908.0" y="617.4" font-size="14" font-weight="400" fill="#6B4E28" text-anchor="middle">目标消费完成；另行返还 credit</text>
<line x1="48" y1="660" x2="1192" y2="660" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="683" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start">依据：libfabric 2.7.0 CQ / MSG / RMA / progress；成功完成与异步错误都不自动替代业务状态裁决。</text>
</svg>