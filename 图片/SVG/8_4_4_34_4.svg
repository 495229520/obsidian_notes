<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">WRITE 生命周期：源缓冲与目标 slot 分别回收</title><desc id="desc">上方比较虚拟地址和零基偏移，下方分别展示源缓冲保持、目标slot占用、目标MR长期注册，以及endpoint-bound MR的关闭依赖。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">WRITE 生命周期：源缓冲与目标 slot 分别回收</text>
<text x="48" y="83" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">示例限定主机内存；源 MR 不作为远端 READ 窗口；横轴为逻辑时间，非等比例</text>
<rect x="48" y="118" width="1144" height="95" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="68" y="145" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · 对端授权必须说明地址解释</text>
<text x="71" y="180" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start">虚拟地址模式：base + offset</text>
<text x="513" y="180" font-size="15" font-weight="700" fill="#24473F" text-anchor="start">零基模式：offset</text>
<text x="843" y="180" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="start">key + length + epoch</text>
<text x="294" y="248" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">注册</text>
<line x1="294" y1="259" x2="294" y2="502" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="453" y="248" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">提交</text>
<line x1="453" y1="259" x2="453" y2="502" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="651" y="248" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">源可复用</text>
<line x1="651" y1="259" x2="651" y2="502" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="840" y="248" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">目标可见</text>
<line x1="840" y1="259" x2="840" y2="502" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="1009" y="248" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">消费结束</text>
<line x1="1009" y1="259" x2="1009" y2="502" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="1169" y="248" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">slot 可复用</text>
<line x1="1169" y1="259" x2="1169" y2="502" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="69" y="303" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">源缓冲</text>
<text x="69" y="325" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">本地 MR</text>
<rect x="294" y="280" width="357" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="472.5" y="311.9" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">保持稳定 / 不释放</text>
<rect x="663" y="280" width="507" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="916.5" y="311.9" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">满足本地完成条件后可复用源缓冲</text>
<text x="69" y="386" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">目标 slot</text>
<rect x="453" y="358" width="191" height="51" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="548.5" y="388.05" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">接收 / 写入</text>
<rect x="651" y="358" width="182" height="51" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="742.0" y="388.05" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">等待可见</text>
<rect x="840" y="358" width="162" height="51" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="921.0" y="388.05" font-size="13" font-weight="700" fill="#4F446B" text-anchor="middle">READY / 消费</text>
<rect x="1009" y="358" width="154" height="51" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1086.0" y="388.05" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">确认 / 返 credit</text>
<text x="69" y="469" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">目标 MR</text>
<rect x="294" y="442" width="876" height="53" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="732.0" y="473.4" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">长生命周期注册区：可以跨越多轮 slot 分配与回收</text>
<text x="71" y="525" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">B · 先停流、排空与隔离，再按实际依赖关闭</text>
<rect x="70" y="559" width="195" height="52" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="167.5" y="589.9" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">停止新访问</text>
<line x1="267" y1="585" x2="292" y2="585" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="296" y="559" width="195" height="52" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="393.5" y="589.9" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">解除在途引用</text>
<line x1="493" y1="585" x2="518" y2="585" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="522" y="559" width="195" height="52" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="619.5" y="589.9" font-size="14" font-weight="700" fill="#4F446B" text-anchor="middle">关闭绑定 MR</text>
<line x1="719" y1="585" x2="744" y2="585" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="748" y="559" width="195" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="845.5" y="589.9" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">关闭 Endpoint</text>
<line x1="945" y1="585" x2="970" y2="585" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="974" y="559" width="195" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1071.5" y="589.9" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">关闭 CQ 等资源</text>
<text x="72" y="641" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">此顺序中的“MR 先于 EP”针对 FI_MR_ENDPOINT；其他对象仍须检查各自依赖。</text>
<line x1="48" y1="660" x2="1192" y2="660" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="683" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start">依据：fi_mr / fi_endpoint / fi_cq；目标可见与目标业务消费是不同事件，普通本地 WRITE CQE 不替代二者。</text>
</svg>