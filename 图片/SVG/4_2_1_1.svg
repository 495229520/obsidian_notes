<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Linux播放器服务器网络模块结构图</title>
  <desc id="desc">展示客户端、监听接入层、网络事件循环、定时器、连接对象、输入输出缓冲、业务线程池、wakeup 通道和日志入口之间的关系。</desc>
  <rect x="0" y="0" width="1180" height="760" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <style>
      .title { fill: #333330; font: 600 18px "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
      .subtitle { fill: #4A4A45; font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
      .node-title { font: 600 16px "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
      .node-sub { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
      .label { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
      .box-blue { fill: #E5F1FB; stroke: #185FA5; }
      .box-gold { fill: #FAEEDB; stroke: #854F0B; }
      .box-purple { fill: #EEEDFE; stroke: #534AB7; }
      .box-green { fill: #E1F5EE; stroke: #0F6E56; }
      .box-gray { fill: #F1EFE8; stroke: #5F5E5A; }
      .stroke-blue { stroke: #185FA5; }
      .stroke-gold { stroke: #854F0B; }
      .stroke-purple { stroke: #534AB7; }
      .stroke-green { stroke: #0F6E56; }
      .stroke-gray { stroke: #5F5E5A; }
      .blue-text { fill: #0C447C; }
      .gold-text { fill: #633806; }
      .purple-text { fill: #3C3489; }
      .green-text { fill: #085041; }
      .gray-text { fill: #444441; }
      .link { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .soft-link { fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 5; }
    </style>
  </defs>

  <text x="590" y="40" class="title" text-anchor="middle" dominant-baseline="central">Linux播放器服务器网络模块结构</text>
  <text x="590" y="67" class="subtitle" text-anchor="middle" dominant-baseline="central">Reactor 统一调度网络事件，连接对象保存状态，线程池承接耗时业务，eventfd/timerfd 负责唤醒与时间事件</text>

  <!-- Top event line -->
  <rect x="55" y="126" width="170" height="64" rx="8" class="box-blue" stroke-width="0.8"/>
  <text x="140" y="151" class="node-title blue-text" text-anchor="middle" dominant-baseline="central">客户端</text>
  <text x="140" y="174" class="node-sub blue-text" text-anchor="middle" dominant-baseline="central">TCP connect / request</text>

  <rect x="285" y="126" width="200" height="64" rx="8" class="box-gold" stroke-width="0.8"/>
  <text x="385" y="151" class="node-title gold-text" text-anchor="middle" dominant-baseline="central">监听接入层</text>
  <text x="385" y="174" class="node-sub gold-text" text-anchor="middle" dominant-baseline="central">listen fd / accept4</text>

  <rect x="535" y="118" width="240" height="80" rx="10" class="box-purple" stroke-width="0.8"/>
  <text x="655" y="148" class="node-title purple-text" text-anchor="middle" dominant-baseline="central">网络事件循环</text>
  <text x="655" y="173" class="node-sub purple-text" text-anchor="middle" dominant-baseline="central">epoll_wait / Reactor</text>

  <rect x="870" y="126" width="230" height="64" rx="8" class="box-gold" stroke-width="0.8"/>
  <text x="985" y="151" class="node-title gold-text" text-anchor="middle" dominant-baseline="central">定时器模块</text>
  <text x="985" y="174" class="node-sub gold-text" text-anchor="middle" dominant-baseline="central">timerfd / 心跳 / 超时</text>

  <!-- Core connection state -->
  <rect x="465" y="280" width="260" height="82" rx="10" class="box-green" stroke-width="0.8"/>
  <text x="595" y="309" class="node-title green-text" text-anchor="middle" dominant-baseline="central">连接对象</text>
  <text x="595" y="334" class="node-sub green-text" text-anchor="middle" dominant-baseline="central">fd + 状态 + 回调 + RAII</text>

  <!-- Data line -->
  <rect x="170" y="430" width="220" height="66" rx="8" class="box-green" stroke-width="0.8"/>
  <text x="280" y="455" class="node-title green-text" text-anchor="middle" dominant-baseline="central">input buffer</text>
  <text x="280" y="479" class="node-sub green-text" text-anchor="middle" dominant-baseline="central">累积字节流 / 半包</text>

  <rect x="480" y="430" width="230" height="66" rx="8" class="box-gray" stroke-width="0.8"/>
  <text x="595" y="455" class="node-title gray-text" text-anchor="middle" dominant-baseline="central">协议解析</text>
  <text x="595" y="479" class="node-sub gray-text" text-anchor="middle" dominant-baseline="central">切出完整请求</text>

  <rect x="790" y="430" width="220" height="66" rx="8" class="box-green" stroke-width="0.8"/>
  <text x="900" y="455" class="node-title green-text" text-anchor="middle" dominant-baseline="central">output buffer</text>
  <text x="900" y="479" class="node-sub green-text" text-anchor="middle" dominant-baseline="central">待发送数据 / EPOLLOUT</text>

  <!-- Bottom thread line -->
  <rect x="70" y="610" width="230" height="76" rx="10" class="box-gold" stroke-width="0.8"/>
  <text x="185" y="638" class="node-title gold-text" text-anchor="middle" dominant-baseline="central">日志与测试入口</text>
  <text x="185" y="664" class="node-sub gold-text" text-anchor="middle" dominant-baseline="central">连接 / 读写 / 关闭可观测</text>

  <rect x="465" y="610" width="260" height="76" rx="10" class="box-purple" stroke-width="0.8"/>
  <text x="595" y="638" class="node-title purple-text" text-anchor="middle" dominant-baseline="central">业务线程池</text>
  <text x="595" y="664" class="node-sub purple-text" text-anchor="middle" dominant-baseline="central">复用 4.1 线程体系</text>

  <rect x="820" y="610" width="240" height="76" rx="10" class="box-blue" stroke-width="0.8"/>
  <text x="940" y="638" class="node-title blue-text" text-anchor="middle" dominant-baseline="central">wakeup 通道</text>
  <text x="940" y="664" class="node-sub blue-text" text-anchor="middle" dominant-baseline="central">eventfd / queueInLoop</text>

  <!-- Main top flow -->
  <path d="M225 158H285" class="link stroke-blue" marker-end="url(#arrowBlue)"/>
  <path d="M485 158H535" class="link stroke-gold" marker-end="url(#arrowGold)"/>
  <path d="M775 158H870" class="link stroke-gold" marker-end="url(#arrowGold)"/>
  <text x="255" y="138" class="label blue-text" text-anchor="middle" dominant-baseline="central">connect</text>
  <text x="510" y="138" class="label gold-text" text-anchor="middle" dominant-baseline="central">新连接事件</text>
  <text x="823" y="138" class="label gold-text" text-anchor="middle" dominant-baseline="central">timerfd 事件</text>

  <!-- Event dispatch and timer path -->
  <path d="M655 198V280" class="link stroke-purple" marker-end="url(#arrowPurple)"/>
  <text x="702" y="239" class="label purple-text" text-anchor="middle" dominant-baseline="central">read / write / close</text>

  <path d="M985 190V242H742V321H725" class="link stroke-gold" marker-end="url(#arrowGold)"/>
  <text x="864" y="224" class="label gold-text" text-anchor="middle" dominant-baseline="central">timeout / 心跳</text>

  <!-- Request data path -->
  <path d="M140 190V360C140 426 150 463 170 463" class="link stroke-blue" marker-end="url(#arrowBlue)"/>
  <text x="108" y="346" class="label blue-text" text-anchor="middle" dominant-baseline="central">请求字节流</text>

  <path d="M465 332H430V430H390" class="link stroke-green" marker-end="url(#arrowGreen)"/>
  <text x="430" y="386" class="label green-text" text-anchor="middle" dominant-baseline="central">读入</text>

  <path d="M390 463H480" class="link stroke-green" marker-end="url(#arrowGreen)"/>
  <text x="435" y="444" class="label green-text" text-anchor="middle" dominant-baseline="central">切帧</text>

  <path d="M710 463H790" class="link stroke-green" marker-end="url(#arrowGreen)"/>
  <text x="750" y="444" class="label green-text" text-anchor="middle" dominant-baseline="central">生成响应</text>

  <path d="M900 430V388H742V334H725" class="link stroke-green" marker-end="url(#arrowGreen)"/>
  <text x="812" y="382" class="label green-text" text-anchor="middle" dominant-baseline="central">响应字节流 / 续写</text>

  <!-- Business thread path -->
  <path d="M595 496V610" class="link stroke-purple" marker-end="url(#arrowPurple)"/>
  <text x="644" y="553" class="label purple-text" text-anchor="middle" dominant-baseline="central">完整请求 / 耗时业务</text>

  <path d="M725 648H820" class="link stroke-blue" marker-end="url(#arrowBlue)"/>
  <text x="772" y="629" class="label blue-text" text-anchor="middle" dominant-baseline="central">业务结果</text>

  <path d="M1060 648H1120V158H775" class="link stroke-blue" marker-end="url(#arrowBlue)"/>
  <text x="1092" y="405" class="label blue-text" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 1092 405)">eventfd 唤醒 I/O 线程</text>

  <!-- Logging path, routed outside the data boxes -->
  <path d="M465 344H120V610" class="soft-link stroke-gold" marker-end="url(#arrowGold)"/>
  <text x="166" y="390" class="label gold-text" text-anchor="middle" dominant-baseline="central">连接 / 读写 / 关闭日志</text>

  <!-- Light grouping labels -->
  <text x="55" y="108" class="label gray-text" text-anchor="start" dominant-baseline="central">事件主线</text>
  <text x="55" y="412" class="label gray-text" text-anchor="start" dominant-baseline="central">数据流</text>
  <text x="55" y="592" class="label gray-text" text-anchor="start" dominant-baseline="central">线程协作与观测</text>
</svg>
