<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="860px" viewBox="0 0 1260 860" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)" />
  <title>匿名管道 fork 后的文件描述符流向</title>
  <desc>The parent process creates a pipe, fork duplicates the descriptors, both processes close unused ends, then bytes flow from fd[1] to fd[0].</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L8 5 L2 8" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <g font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="630" y="54" text-anchor="middle" dominant-baseline="middle" fill="#2f251d" font-size="34" font-weight="800">匿名管道：pipe()、fork() 与关闭不用端</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="630" y="92" text-anchor="middle" dominant-baseline="middle" fill="#7a6a58" font-size="17" font-weight="600">示例方向：父进程写，子进程读；若方向相反，把关闭的端反过来即可</text>

    <rect x="52" y="132" width="1156" height="126" rx="24" ry="24" fill="#fff7e8" stroke="#d8ba8a" stroke-width="2" />
    <circle cx="93" cy="174" r="18" fill="#f59e0b" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="93" y="175" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="17" font-weight="800">1</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="128" y="170" fill="#6b3f14" font-size="24" font-weight="800">父进程先调用 pipe(fd)</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="128" y="206" fill="#8a5a22" font-size="16" font-weight="700">内核创建一段管道缓冲区，并给当前进程返回两个文件描述符</text>
    <rect x="788" y="154" width="170" height="78" rx="16" ry="16" fill="#fffbeb" stroke="#d9a751" stroke-width="2" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="873" y="184" text-anchor="middle" dominant-baseline="middle" fill="#51320f" font-size="20" font-weight="800">fd[0] = 3</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="873" y="211" text-anchor="middle" dominant-baseline="middle" fill="#7c5a25" font-size="14" font-weight="700">读取端</text>
    <rect x="982" y="154" width="170" height="78" rx="16" ry="16" fill="#fffbeb" stroke="#d9a751" stroke-width="2" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1067" y="184" text-anchor="middle" dominant-baseline="middle" fill="#51320f" font-size="20" font-weight="800">fd[1] = 4</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1067" y="211" text-anchor="middle" dominant-baseline="middle" fill="#7c5a25" font-size="14" font-weight="700">写入端</text>

    <path d="M630 258 L630 306" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)" />
    <rect x="540" y="292" width="180" height="58" rx="18" ry="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="630" y="323" text-anchor="middle" dominant-baseline="middle" fill="#3730a3" font-size="22" font-weight="800">fork()</text>

    <rect x="86" y="396" width="470" height="176" rx="24" ry="24" fill="#f8fafc" stroke="#64748b" stroke-width="2.2" />
    <circle cx="128" cy="438" r="18" fill="#64748b" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="128" y="439" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="17" font-weight="800">2</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="166" y="436" fill="#334155" font-size="24" font-weight="800">父进程保留同一组 fd</text>
    <rect x="142" y="480" width="150" height="58" rx="14" ry="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.8" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="217" y="511" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="18" font-weight="800">fd[0] = 3</text>
    <rect x="326" y="480" width="150" height="58" rx="14" ry="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.8" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="401" y="511" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="18" font-weight="800">fd[1] = 4</text>

    <rect x="704" y="396" width="470" height="176" rx="24" ry="24" fill="#f8fafc" stroke="#64748b" stroke-width="2.2" />
    <circle cx="746" cy="438" r="18" fill="#64748b" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="746" y="439" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="17" font-weight="800">2</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="784" y="436" fill="#334155" font-size="24" font-weight="800">子进程复制同一组 fd</text>
    <rect x="760" y="480" width="150" height="58" rx="14" ry="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.8" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="835" y="511" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="18" font-weight="800">fd[0] = 3</text>
    <rect x="944" y="480" width="150" height="58" rx="14" ry="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.8" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1019" y="511" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="18" font-weight="800">fd[1] = 4</text>
    <path d="M720 350 C650 380 530 380 462 396" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowSlate)" />
    <path d="M720 350 C790 380 912 380 980 396" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowSlate)" />

    <path d="M321 572 L321 624" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)" />
    <path d="M939 572 L939 624" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)" />

    <rect x="86" y="626" width="470" height="164" rx="24" ry="24" fill="#fff7e8" stroke="#d6a96b" stroke-width="2.4" />
    <circle cx="128" cy="668" r="18" fill="#f59e0b" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="128" y="669" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="17" font-weight="800">3</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="166" y="666" fill="#6b3f14" font-size="24" font-weight="800">父进程关闭读取端</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="166" y="696" fill="#8a5a22" font-size="15" font-weight="700">只写入，不从这个管道读</text>
    <rect x="156" y="724" width="150" height="58" rx="14" ry="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="231" y="754" text-anchor="middle" dominant-baseline="middle" fill="#991b1b" font-size="17" font-weight="800">close(fd[0])</text>
    <rect x="340" y="724" width="150" height="58" rx="14" ry="14" fill="#fffbeb" stroke="#d9a751" stroke-width="2" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="415" y="744" text-anchor="middle" dominant-baseline="middle" fill="#51320f" font-size="18" font-weight="800">fd[1] = 4</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="415" y="768" text-anchor="middle" dominant-baseline="middle" fill="#7c5a25" font-size="14" font-weight="700">write()</text>

    <rect x="704" y="626" width="470" height="164" rx="24" ry="24" fill="#eaf7ef" stroke="#74b48c" stroke-width="2.4" />
    <circle cx="746" cy="668" r="18" fill="#22c55e" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="746" y="669" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="17" font-weight="800">3</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="784" y="666" fill="#24573b" font-size="24" font-weight="800">子进程关闭写入端</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="784" y="696" fill="#4d8566" font-size="15" font-weight="700">只读取，不向这个管道写</text>
    <rect x="774" y="724" width="150" height="58" rx="14" ry="14" fill="#f0fdf4" stroke="#86c69a" stroke-width="2" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="849" y="744" text-anchor="middle" dominant-baseline="middle" fill="#174b2b" font-size="18" font-weight="800">fd[0] = 3</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="849" y="768" text-anchor="middle" dominant-baseline="middle" fill="#3b7253" font-size="14" font-weight="700">read()</text>
    <rect x="958" y="724" width="150" height="58" rx="14" ry="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1033" y="754" text-anchor="middle" dominant-baseline="middle" fill="#991b1b" font-size="17" font-weight="800">close(fd[1])</text>

    <rect x="520" y="707" width="220" height="58" rx="22" ry="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.2" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="630" y="737" text-anchor="middle" dominant-baseline="middle" fill="#075985" font-size="18" font-weight="800">管道缓冲区</text>
    <path d="M490 753 C522 753 500 736 520 736" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)" />
    <path d="M740 736 C760 736 742 753 774 753" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="630" y="816" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" font-size="18" font-weight="800">最终数据流：父进程 fd[1] 写入  ->  内核缓冲区  ->  子进程 fd[0] 读取</text>
  </g>
</svg>
