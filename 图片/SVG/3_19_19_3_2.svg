<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<title>NUMA 亲和：让一条路径在本地闭环</title>
<desc>线程、用户页、驱动接收缓冲与 PCIe 设备需要分别定位；同节点不等于必须同核。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="52" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">NUMA 亲和：让一条路径在本地闭环</text>
<text x="48" y="82" font-size="14" fill="#6B675C" text-anchor="start" data-role="subtitle">线程、用户页、驱动接收缓冲与 PCIe 设备需要分别定位；同节点不等于必须同核。</text>
<rect x="48" y="110" width="550" height="360" rx="7" fill="#F1F5F0" stroke="#ABC4B6" stroke-width="1.3"/>
<rect x="666" y="110" width="526" height="360" rx="7" fill="#F8F0EC" stroke="#D5B7AA" stroke-width="1.3"/>
<text x="68" y="142" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">NUMA node 0 · NIC 本地节点（示例）</text>
<text x="686" y="142" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">NUMA node 1 · 远端节点（示例）</text>
<rect x="73" y="178" width="126" height="63" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="136.0" y="204.26" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">NIC</text>
<text x="136.0" y="224.26" font-size="14" fill="#2C4460" text-anchor="middle" data-role="body">PCIe</text>
<rect x="264" y="178" width="274" height="63" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="401.0" y="204.26" font-size="14" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">RX Ring / 接收缓冲</text>
<text x="401.0" y="224.26" font-size="14" fill="#24473F" text-anchor="middle" data-role="body">物理页位于 node 0</text>
<path d="M202,209 L260,209" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="216" y="191" font-size="12" fill="#24473F" text-anchor="start" data-role="body">DMA</text>
<rect x="263" y="288" width="130" height="64" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="328.0" y="314.76" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">CPU 4</text>
<text x="328.0" y="334.76" font-size="14" fill="#2C4460" text-anchor="middle" data-role="body">IRQ / NAPI</text>
<rect x="426" y="288" width="144" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="498.0" y="314.76" font-size="14" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">CPU 6</text>
<text x="498.0" y="334.76" font-size="14" fill="#24473F" text-anchor="middle" data-role="body">本地 worker</text>
<path d="M329,245 L329,284" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M396,320 L422,320" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="74" y="379" width="465" height="57" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="306.5" y="401.92" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">本地应用缓冲 · node 0</text>
<text x="306.5" y="421.92" font-size="13" fill="#24473F" text-anchor="middle" data-role="body">同节点分核；减少跨 Socket 数据访问</text>
<path d="M499,355 L499,372" fill="none" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="760" y="178" width="339" height="63" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="929.5" y="203.92" font-size="13" fill="#733428" text-anchor="middle" font-weight="700" data-role="body">CPU 20 · 远端 worker</text>
<text x="929.5" y="223.92" font-size="13" fill="#733428" text-anchor="middle" data-role="body">线程跑远端，原接收页仍在 node 0</text>
<rect x="760" y="379" width="339" height="57" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="929.5" y="401.92" font-size="13" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">远端应用缓冲 · node 1</text>
<text x="929.5" y="421.92" font-size="13" fill="#6B4E28" text-anchor="middle" data-role="body">页位置独立于 IRQ / worker 位置</text>
<path d="M542,210 L756,210" fill="none" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)" stroke-dasharray="5 4"/>
<rect x="566" y="174" width="170" height="24" rx="7" fill="rgb(245, 244, 237)" stroke="#F5F4ED" stroke-width="1.3"/>
<text x="651" y="191" font-size="13" fill="#733428" text-anchor="middle" data-role="body">① 跨节点取数据</text>
<path d="M332,356 L332,367 L717,367 L717,269 L930,269 L930,245" fill="none" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)" stroke-dasharray="5 4"/>
<rect x="734" y="280" width="413" height="71" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="751" y="307" font-size="13" fill="#733428" text-anchor="start" data-role="body">② 软件交接：backlog / IPI / 缓存状态</text>
<text x="751" y="331" font-size="12" fill="#6B675C" text-anchor="start" data-role="body">不是每个包都必然经过这条路径</text>
<path d="M1103,210 L1164,210 L1164,407 L1103,407" fill="none" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)" stroke-dasharray="5 4"/>
<text x="69" y="456" font-size="12.5" fill="#24473F" text-anchor="start" data-role="body">本地路径：设备 → 本地接收页 → 本地处理</text>
<rect x="48" y="488" width="1144" height="119" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="514" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">C · 逐项核验，不把一条命令当作整个路径的保证</text>
<text x="69" y="548" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">设备</text>
<text x="69" y="573" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="body">numa_node / PCIe 拓扑</text>
<text x="349" y="548" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">CPU</text>
<text x="349" y="573" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="body">每线程 affinity / 有效 IRQ</text>
<text x="629" y="548" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">用户页</text>
<text x="629" y="573" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="body">numa_maps / first-touch</text>
<text x="909" y="548" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">内核页</text>
<text x="909" y="573" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="body">驱动缓冲 / 分配策略</text>
<path d="M48,621 L1192,621" fill="none" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="651" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="footer">边界：应用内存策略不自动迁移内核 RX 页；跨节点也可能是容量取舍。</text>
</svg>