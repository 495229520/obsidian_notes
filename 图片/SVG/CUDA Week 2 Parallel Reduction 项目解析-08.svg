<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">DeviceBuffer RAII 生命周期</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">08 DeviceBuffer：GPU 显存所有权生命周期</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“7. 基础设施：device_buffer.cuh”中，强调 Rule of Five 与异常安全</text>
<rect x="75" y="160" width="245" height="170" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="75" y="160" width="245" height="8" rx="18" fill="#2563EB" opacity="1"/>
<text x="95" y="194" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">构造</text>
<text x="95" y="224" font-size="14" font-weight="400" fill="#334155" text-anchor="start">DeviceBuffer&lt;T&gt; buf(n)</text>
<text x="95" y="245" font-size="14" font-weight="400" fill="#334155" text-anchor="start">count&gt;0 → cudaMalloc</text>
<line x1="320" y1="245" x2="375" y2="245" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="375" y="160" width="245" height="170" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="375" y="160" width="245" height="8" rx="18" fill="#7C3AED" opacity="1"/>
<text x="395" y="194" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">使用</text>
<text x="395" y="224" font-size="14" font-weight="400" fill="#334155" text-anchor="start">buf.get() 传给 cudaMemcpy / kernel</text>
<text x="395" y="245" font-size="14" font-weight="400" fill="#334155" text-anchor="start">size() / bytes()</text>
<line x1="620" y1="245" x2="675" y2="245" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="675" y="160" width="245" height="170" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="675" y="160" width="245" height="8" rx="18" fill="#F59E0B" opacity="1"/>
<text x="695" y="194" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">移动</text>
<text x="695" y="224" font-size="14" font-weight="400" fill="#334155" text-anchor="start">move 构造/赋值转移 ptr_</text>
<text x="695" y="245" font-size="14" font-weight="400" fill="#334155" text-anchor="start">other.ptr_=nullptr</text>
<line x1="920" y1="245" x2="975" y2="245" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="975" y="160" width="245" height="170" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="975" y="160" width="245" height="8" rx="18" fill="#059669" opacity="1"/>
<text x="995" y="194" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">析构</text>
<text x="995" y="224" font-size="14" font-weight="400" fill="#334155" text-anchor="start">~DeviceBuffer()</text>
<text x="995" y="245" font-size="14" font-weight="400" fill="#334155" text-anchor="start">ptr_ != nullptr → cudaFree</text>
<rect x="115" y="430" width="340" height="135" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="115" y="430" width="340" height="8" rx="18" fill="#DC2626" opacity="1"/>
<text x="135" y="464" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">禁止拷贝</text>
<text x="135" y="494" font-size="14" font-weight="400" fill="#334155" text-anchor="start">DeviceBuffer(const&amp;) = delete</text>
<text x="135" y="515" font-size="14" font-weight="400" fill="#334155" text-anchor="start">operator=(const&amp;) = delete</text>
<text x="135" y="536" font-size="14" font-weight="400" fill="#334155" text-anchor="start">避免 double free</text>
<rect x="520" y="430" width="340" height="135" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="520" y="430" width="340" height="8" rx="18" fill="#059669" opacity="1"/>
<text x="540" y="464" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">异常安全</text>
<text x="540" y="494" font-size="14" font-weight="400" fill="#334155" text-anchor="start">CUDA_CHECK 抛异常时</text>
<text x="540" y="515" font-size="14" font-weight="400" fill="#334155" text-anchor="start">栈展开会触发析构</text>
<text x="540" y="536" font-size="14" font-weight="400" fill="#334155" text-anchor="start">显存自动释放</text>
<rect x="925" y="430" width="245" height="135" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="925" y="430" width="245" height="8" rx="18" fill="#0891B2" opacity="1"/>
<text x="945" y="464" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">零元素边界</text>
<text x="945" y="494" font-size="14" font-weight="400" fill="#334155" text-anchor="start">n == 0 不 cudaMalloc</text>
<text x="945" y="515" font-size="14" font-weight="400" fill="#334155" text-anchor="start">ptr_ 保持 nullptr</text>
<text x="945" y="536" font-size="14" font-weight="400" fill="#334155" text-anchor="start">析构安全跳过</text>
</svg>
