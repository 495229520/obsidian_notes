<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">两个不能省略的交错：提前 CQE 与 postlist 部分接受</title>
  <desc id="desc">POSTING 记录先于硬件可见；返回值确定接受前缀之后，才能完成最终结算。。图中预算、序号与布局均为教学示意，不是实测结果。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="bluearr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3" />
  <text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">两个不能省略的交错：提前 CQE 与 postlist 部分接受</text>
  <text x="48" y="79" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">POSTING 记录先于硬件可见；返回值确定接受前缀之后，才能完成最终结算。</text>
  <line x1="48" y1="98" x2="1192" y2="98" stroke="#D8D5C8" stroke-width="1" />
  <text x="1192" y="658" font-size="12" fill="#8B8679" font-weight="400" text-anchor="end">8 · 4 · 18 · 3</text>
  <text x="238" y="130" font-size="15" fill="#24473F" font-weight="700" text-anchor="start">S · 提交线程</text>
  <text x="618" y="130" font-size="15" fill="#514573" font-weight="700" text-anchor="start">P · 账本 / CQ</text>
  <line x1="300" y1="151" x2="300" y2="473" stroke="#5A564B" stroke-width="1.6" stroke-dasharray="4 4" />
  <line x1="701" y1="151" x2="701" y2="473" stroke="#5A564B" stroke-width="1.6" stroke-dasharray="4 4" />
  <rect x="170" y="153" width="260" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="300.0" y="173.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">预发布稳定记录</text>
  <text x="300.0" y="197.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">状态 = POSTING</text>
  <polyline points="432,180 568,180 568,179 697,179" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="464" y="164" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">prepare</text>
  <rect x="291" y="228" width="18" height="200" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="69" y="244" font-size="14" fill="#24473F" font-weight="700" text-anchor="start">ibv_post_send()</text>
  <text x="68" y="271" font-size="13" fill="#24473F" font-weight="400" text-anchor="start">尚未返回</text>
  <rect x="936" y="235" width="250" height="66" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="1061.0" y="261.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">RNIC 已完成</text>
  <text x="1061.0" y="285.0" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle">CQE 先出现</text>
  <polyline points="932,268 705,268" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="753" y="253" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">early completion</text>
  <rect x="568" y="303" width="266" height="74" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="701.0" y="333.0" font-size="14" fill="#514573" font-weight="700" text-anchor="middle">保存完成证据</text>
  <text x="701.0" y="357.0" font-size="14" fill="#514573" font-weight="400" text-anchor="middle">不释放 POSTING 记录</text>
  <polyline points="313,417 698,417" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="361" y="401" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">PostResult：accepted prefix</text>
  <rect x="568" y="442" width="266" height="48" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="701.0" y="471.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">合并证据 → 只结算一次</text>
  <polyline points="701,422 701,438" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="902" y="330" width="284" height="147" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="918" y="357" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">账本需要两份证据</text>
  <text x="920" y="390" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">① post 接受了哪些 WR</text>
  <text x="920" y="426" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">② 已获得哪些完成证据</text>
  <text x="65" y="520" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">部分接受示例：103 立即失败，原定 signaled 标记 105 未入队</text>
  <rect x="66" y="541" width="173" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="152.5" y="563.5" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle">WR 100</text>
  <text x="152.5" y="587.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">已接受</text>
  <polyline points="241,570 250,570" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="254" y="541" width="173" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="340.5" y="563.5" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle">WR 101</text>
  <text x="340.5" y="587.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">已接受</text>
  <polyline points="429,570 438,570" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="442" y="541" width="173" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="528.5" y="563.5" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle">WR 102</text>
  <text x="528.5" y="587.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">已接受</text>
  <polyline points="617,570 626,570" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="630" y="541" width="173" height="59" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
  <text x="716.5" y="563.5" font-size="13" fill="#733428" font-weight="700" text-anchor="middle">WR 103</text>
  <text x="716.5" y="587.5" font-size="13" fill="#733428" font-weight="400" text-anchor="middle">bad_wr</text>
  <polyline points="805,570 814,570" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="818" y="541" width="173" height="59" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="904.5" y="563.5" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle">WR 104</text>
  <text x="904.5" y="587.5" font-size="13" fill="#4A473F" font-weight="400" text-anchor="middle">未接受</text>
  <polyline points="993,570 1002,570" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="1006" y="541" width="173" height="59" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="1092.5" y="563.5" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle">WR 105</text>
  <text x="1092.5" y="587.5" font-size="13" fill="#4A473F" font-weight="400" text-anchor="middle">未接受 · signaled</text>
  <text x="66" y="639" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">100—102 保留在途租约；103—105 归还预留；不能等待不存在的 105 完成。</text>
</svg>