<text x="48" y="637" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">algbw = M/T；AllReduce busbw = algbw × 2(P−1)/P。busbw 是归一化量，不是 NIC 端口直接计数。</text>
<text x="48" y="660" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">对应 8.18 §4、§7；模型计算不代表某种 GPU、NIC 或网络的实测成绩。</text>
