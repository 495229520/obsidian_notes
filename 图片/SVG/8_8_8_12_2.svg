<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<title>可见性有方向：生产完成 ≠ 网络完成 ≠ GPU 可消费</title>
<desc>先取得本次操作的完成证据，再跨越 CUDA 与 RNIC 的顺序边界</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="#F5F4ED"/>
<text x="48" y="49" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">可见性有方向：生产完成 ≠ 网络完成 ≠ GPU 可消费</text>
<text x="48" y="78" font-size="13" fill="#6B675C" text-anchor="start">先取得本次操作的完成证据，再跨越 CUDA 与 RNIC 的顺序边界</text>
<rect x="48" y="109" width="1144" height="164" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="67" y="138" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700">A · GPU 生产 → NIC 读取</text>
<rect x="78" y="171" width="230" height="69" rx="8" fill="#EDEAF3" stroke="#88749B" stroke-width="1.3"/>
<text x="193.0" y="200.5" font-size="13" fill="#6B5B95" text-anchor="middle" font-weight="700">producer kernel</text>
<text x="193.0" y="220.5" font-size="12" fill="#6B5B95" text-anchor="middle">CUDA stream</text>
<rect x="358" y="171" width="230" height="69" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="473.0" y="200.5" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700">producer 完成</text>
<text x="473.0" y="220.5" font-size="12" fill="#24473F" text-anchor="middle">stream / event sync</text>
<rect x="638" y="171" width="230" height="69" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="753.0" y="200.5" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">post_send / READ</text>
<text x="753.0" y="220.5" font-size="12" fill="#2C4460" text-anchor="middle">RNIC 开始读源区</text>
<rect x="918" y="171" width="230" height="69" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1033.0" y="200.5" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">transport completion</text>
<text x="1033.0" y="220.5" font-size="12" fill="#2C4460" text-anchor="middle">到达对应 opcode 边界</text>
<line x1="314" y1="205" x2="352" y2="205" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="594" y1="205" x2="632" y2="205" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="874" y1="205" x2="912" y2="205" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="48" y="291" width="1144" height="164" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="67" y="320" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700">B · NIC 写入 → GPU 消费</text>
<rect x="78" y="351" width="230" height="69" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="193.0" y="380.5" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">接收端完成证据</text>
<text x="193.0" y="400.5" font-size="12" fill="#2C4460" text-anchor="middle">本轮 receive / read</text>
<rect x="358" y="351" width="230" height="69" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="473.0" y="380.5" font-size="13" fill="#6B4E28" text-anchor="middle" font-weight="700">visibility gate</text>
<text x="473.0" y="400.5" font-size="12" fill="#6B4E28" text-anchor="middle">native ordering / flush</text>
<rect x="638" y="351" width="230" height="69" rx="8" fill="#EDEAF3" stroke="#88749B" stroke-width="1.3"/>
<text x="753.0" y="380.5" font-size="13" fill="#6B5B95" text-anchor="middle" font-weight="700">提交 dependent kernel</text>
<text x="753.0" y="400.5" font-size="12" fill="#6B5B95" text-anchor="middle">在完成依赖之后</text>
<rect x="918" y="351" width="230" height="69" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1033.0" y="380.5" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700">consumer 完成</text>
<text x="1033.0" y="400.5" font-size="12" fill="#24473F" text-anchor="middle">可验证 / 再发布</text>
<line x1="314" y1="385" x2="352" y2="385" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="594" y1="385" x2="632" y2="385" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="874" y1="385" x2="912" y2="385" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="48" y="477" width="1144" height="102" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="69" y="505" font-size="15" fill="#733428" text-anchor="start" font-weight="700">不能成立的捷径</text>
<text x="80" y="538" font-size="13" fill="#733428" text-anchor="start">CPU atomic fence ≠ GPU 可见性</text>
<text x="450" y="538" font-size="13" fill="#733428" text-anchor="start">record event ≠ 等待外部 RDMA</text>
<text x="825" y="538" font-size="13" fill="#733428" text-anchor="start">丢弃 CQE ≠ 撤销已提交 DMA</text>
<line x1="48" y1="619" x2="1192" y2="619" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="649" font-size="12" fill="#6B675C" text-anchor="start">8.12 / 跨设备完成链</text>
<text x="1192" y="649" font-size="12" fill="#6B675C" text-anchor="end">flush 不等待尚未发生的网络写入</text>
</svg>