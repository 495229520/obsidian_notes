<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Benchmark 数据流与统计口径</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">02 Benchmark 数据流与统计口径</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">优化替换原 02：突出 warmup、CUDA Event、correctness status 与 bandwidth 计算</text>
<rect x="60" y="145" width="165" height="165" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="60" y="145" width="165" height="8" rx="18" fill="#0891B2" opacity="1"/>
<text x="80" y="179" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">generate_input&lt;T&gt;</text>
<text x="80" y="209" font-size="14" font-weight="400" fill="#334155" text-anchor="start">固定 seed=42</text>
<text x="80" y="230" font-size="14" font-weight="400" fill="#334155" text-anchor="start">产生 host 输入</text>
<line x1="225" y1="228" x2="242" y2="228" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="250" y="145" width="165" height="165" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="250" y="145" width="165" height="8" rx="18" fill="#059669" opacity="1"/>
<text x="270" y="179" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">CPU reference</text>
<text x="270" y="209" font-size="14" font-weight="400" fill="#334155" text-anchor="start">float 用 double 累加</text>
<text x="270" y="230" font-size="14" font-weight="400" fill="#334155" text-anchor="start">int 精确累加</text>
<line x1="415" y1="228" x2="447" y2="228" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="455" y="145" width="165" height="165" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="455" y="145" width="165" height="8" rx="18" fill="#2563EB" opacity="1"/>
<text x="475" y="179" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">DeviceBuffer + H2D</text>
<text x="475" y="209" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cudaMalloc</text>
<text x="475" y="230" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cudaMemcpy H2D</text>
<line x1="620" y1="228" x2="647" y2="228" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="655" y="145" width="165" height="165" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="655" y="145" width="165" height="8" rx="18" fill="#F59E0B" opacity="1"/>
<text x="675" y="179" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">Warmup ×5</text>
<text x="675" y="209" font-size="14" font-weight="400" fill="#334155" text-anchor="start">不计时</text>
<text x="675" y="230" font-size="14" font-weight="400" fill="#334155" text-anchor="start">预热频率/cache</text>
<line x1="820" y1="228" x2="837" y2="228" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="845" y="145" width="165" height="165" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="845" y="145" width="165" height="8" rx="18" fill="#7C3AED" opacity="1"/>
<text x="865" y="179" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">Timed repeat ×20</text>
<text x="865" y="209" font-size="14" font-weight="400" fill="#334155" text-anchor="start">每次 event pair</text>
<text x="865" y="230" font-size="14" font-weight="400" fill="#334155" text-anchor="start">avg/min/max</text>
<line x1="1010" y1="228" x2="1042" y2="228" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1050" y="145" width="165" height="165" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="1050" y="145" width="165" height="8" rx="18" fill="#DC2626" opacity="1"/>
<text x="1070" y="179" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">Status + BW</text>
<text x="1070" y="209" font-size="14" font-weight="400" fill="#334155" text-anchor="start">rel_err&lt;1e-3 或 int==</text>
<text x="1070" y="230" font-size="14" font-weight="400" fill="#334155" text-anchor="start">BW=n*sizeof(T)/avg_ms</text>
<rect x="80" y="430" width="1080" height="180" rx="20" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="105" y="465" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start">输出表头与解释</text>
<rect x="105" y="485" width="1020" height="80" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="123" y="511" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">N | Kernel | Avg(ms) | Min(ms) | Max(ms) | BW(GB/s) | Status</text>
<text x="123" y="531" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">1K/1M/64M × Naive/Shared/Shuffle × float/int</text>
<text x="105" y="605" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Avg：总体水平；Min：最佳情况；Max：抖动；BW：吞吐近似；Status：防止“错得更快”。</text>
<text x="105" y="629" font-size="15" font-weight="400" fill="#334155" text-anchor="start">注意：当前计时包含 reduce host wrapper 的 kernel + sync + D2H partial + CPU final，不能误当成纯 kernel-only。</text>
</svg>
