<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>BPDU 报文格式与四元组决策链</title>
  <desc>经典 STP Configuration BPDU 的字段布局，以及交换机判定 Superior BPDU 的四元组字典序级联决策链。</desc>
  <defs>
    <marker id="arr-gray2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-blue2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect x="0" y="0" width="1200" height="620" fill="rgb(245, 244, 237)"/>

  <!-- 顶部标题区 -->
  <text x="44" y="44" font-size="20" font-weight="700" fill="#2B2A26">BPDU 报文格式与四元组决策权重</text>
  <text x="44" y="70" font-size="12.5" fill="#6B675C">交换机交互 BPDU 交换拓扑认知，按四元组字典序级联判定最优报文</text>

  <!-- ========================================================================= -->
  <!-- 上半部：BPDU 报文物理结构全览 -->
  <!-- ========================================================================= -->
  <rect x="44" y="90" width="1112" height="236" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="44" y="90" width="1112" height="32" rx="8" fill="#ECEAE2" stroke="#8C887B" stroke-width="1.2"/>
  <text x="60" y="111" font-size="12.5" font-weight="700" fill="#3A3832">Configuration BPDU 物理结构（组播 01:80:C2:00:00:00）</text>

  <!-- 协议控制字段组 -->
  <rect x="64" y="136" width="190" height="74" rx="5" fill="#F1EFE8" stroke="#8C887B" stroke-width="1"/>
  <text x="76" y="157" font-size="11" font-weight="700" fill="#2B2A26">协议标识与类型 (5B)</text>
  <text x="76" y="177" font-size="9.5" fill="#5A564B">Protocol ID: 2B (0x0000)</text>
  <text x="76" y="193" font-size="9.5" fill="#5A564B">Version: 1B | Type: 1B | Flags: 1B</text>

  <!-- 核心四元组：Root BID (8B) -->
  <rect x="268" y="136" width="220" height="74" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="280" y="157" font-size="11" font-weight="700" fill="#2C4460">① Root Bridge ID (8B)</text>
  <text x="280" y="177" font-size="9.5" fill="#3D5A80">Priority (2B) + MAC (6B)</text>
  <text x="280" y="194" font-size="9.5" font-weight="700" fill="#2C4460">全网根桥标识 · 第一裁决位</text>

  <!-- 核心四元组：Root Path Cost (4B) -->
  <rect x="502" y="136" width="170" height="74" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="514" y="157" font-size="11" font-weight="700" fill="#24473F">② Root Path Cost (4B)</text>
  <text x="514" y="177" font-size="9.5" fill="#2F6B5E">到根桥的累计链路开销</text>
  <text x="514" y="194" font-size="9.5" font-weight="700" fill="#24473F">最短路径度量 · 第二裁决位</text>

  <!-- 核心四元组：Sender Bridge ID (8B) -->
  <rect x="686" y="136" width="210" height="74" rx="5" fill="#EAE5F3" stroke="#5E4B7A" stroke-width="1.5"/>
  <text x="698" y="157" font-size="11" font-weight="700" fill="#43325B">③ Sender Bridge ID (8B)</text>
  <text x="698" y="177" font-size="9.5" fill="#5E4B7A">Priority (2B) + MAC (6B)</text>
  <text x="698" y="194" font-size="9.5" font-weight="700" fill="#43325B">发送者身份 · 第三裁决位</text>

  <!-- 核心四元组：Sender Port ID (2B) -->
  <rect x="910" y="136" width="160" height="74" rx="5" fill="#FAEFE1" stroke="#A86A24" stroke-width="1.5"/>
  <text x="922" y="157" font-size="11" font-weight="700" fill="#754713">④ Sender Port ID (2B)</text>
  <text x="922" y="177" font-size="9.5" fill="#A86A24">Port Priority (1B) + 端口号 (1B)</text>
  <text x="922" y="194" font-size="9.5" font-weight="700" fill="#754713">发送端口 · 第四裁决位</text>

  <!-- 计时器与老化参数组 -->
  <rect x="64" y="224" width="1006" height="86" rx="5" fill="#FFFFFF" stroke="#D8D5C8" stroke-width="1"/>
  <text x="78" y="246" font-size="11" font-weight="700" fill="#2B2A26">STP 计时器与生命周期参数：</text>
  
  <text x="94" y="268" font-size="10" fill="#3D5A80">Message Age (2B)：跳数老化；Hello Time (2B)：周期 2s</text>
  <text x="94" y="288" font-size="10" fill="#5A564B">Max Age (2B)：超时 20s；Forward Delay (2B)：迁移 15s</text>

  <!-- ========================================================================= -->
  <!-- 下半部：四元组字典序级联决胜链 -->
  <!-- ========================================================================= -->
  <rect x="44" y="340" width="1112" height="252" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="44" y="340" width="1112" height="32" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="60" y="361" font-size="12.5" font-weight="700" fill="#24473F">BPDU 四元组决胜链（严格字典序，数值越小越优）</text>

  <!-- Step 1: Root BID -->
  <rect x="64" y="388" width="232" height="186" rx="6" fill="#FFFFFF" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="64" y="388" width="232" height="26" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="76" y="405" font-size="10.5" font-weight="700" fill="#2C4460">第 1 阶：Root Bridge ID</text>
  <text x="76" y="427" font-size="10" font-weight="700" fill="#2B2A26">目的：确定全网谁是根桥</text>
  <text x="76" y="446" font-size="9.5" fill="#5A564B">先比 Priority（默认 32768）</text>
  <text x="76" y="462" font-size="9.5" fill="#5A564B">数值更小者优先；</text>
  <text x="76" y="478" font-size="9.5" fill="#5A564B">若 Priority 相同，再比 MAC；</text>
  <text x="76" y="496" font-size="9.5" font-weight="700" fill="#2F6B5E">✓ 胜出：BID 最小的设备当选根桥</text>
  <text x="76" y="520" font-size="9.5" fill="#8C887B">平局条件：均认可同一根桥</text>
  <text x="76" y="542" font-size="9.5" fill="#3D5A80">→ 进入第 2 阶比对</text>

  <!-- 箭头 1 -> 2 -->
  <line x1="298" y1="480" x2="330" y2="480" stroke="#3D5A80" stroke-width="2" marker-end="url(#arr-blue2)"/>

  <!-- Step 2: Path Cost -->
  <rect x="334" y="388" width="232" height="186" rx="6" fill="#FFFFFF" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="334" y="388" width="232" height="26" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="346" y="405" font-size="10.5" font-weight="700" fill="#24473F">第 2 阶：Root Path Cost</text>
  <text x="346" y="427" font-size="10" font-weight="700" fill="#2B2A26">目的：选出非根交换机的 RP</text>
  <text x="346" y="446" font-size="9.5" fill="#5A564B">比入端口收到的累计开销；</text>
  <text x="346" y="462" font-size="9.5" fill="#5A564B">高带宽链路 Cost 极小</text>
  <text x="346" y="478" font-size="9.5" fill="#5A564B">（10G=2000, 1G=20000）；</text>
  <text x="346" y="496" font-size="9.5" font-weight="700" fill="#2F6B5E">✓ 胜出：开销最小的端口当选 RP</text>
  <text x="346" y="520" font-size="9.5" fill="#8C887B">平局条件：到达根桥开销相同</text>
  <text x="346" y="542" font-size="9.5" fill="#2F6B5E">→ 进入第 3 阶比对</text>

  <!-- 箭头 2 -> 3 -->
  <line x1="568" y1="480" x2="600" y2="480" stroke="#2F6B5E" stroke-width="2" marker-end="url(#arr-blue2)"/>

  <!-- Step 3: Sender BID -->
  <rect x="604" y="388" width="232" height="186" rx="6" fill="#FFFFFF" stroke="#5E4B7A" stroke-width="1.2"/>
  <rect x="604" y="388" width="232" height="26" rx="6" fill="#EAE5F3" stroke="#5E4B7A" stroke-width="1.2"/>
  <text x="616" y="405" font-size="10.5" font-weight="700" fill="#43325B">第 3 阶：Sender Bridge ID</text>
  <text x="616" y="427" font-size="10" font-weight="700" fill="#2B2A26">目的：决胜网段上的指定端口 DP</text>
  <text x="616" y="446" font-size="9.5" fill="#5A564B">当 Segment 两端开销相同时；</text>
  <text x="616" y="462" font-size="9.5" fill="#5A564B">比较直连邻居的 Bridge ID；</text>
  <text x="616" y="478" font-size="9.5" fill="#5A564B">BID 较小的一方为本段 DP；</text>
  <text x="616" y="496" font-size="9.5" font-weight="700" fill="#2F6B5E">✓ 胜出：上游设备更优的一侧当选</text>
  <text x="616" y="520" font-size="9.5" fill="#8C887B">平局条件：连接同一台上游设备</text>
  <text x="616" y="542" font-size="9.5" fill="#5E4B7A">→ 进入第 4 阶比对</text>

  <!-- 箭头 3 -> 4 -->
  <line x1="838" y1="480" x2="870" y2="480" stroke="#5E4B7A" stroke-width="2" marker-end="url(#arr-blue2)"/>

  <!-- Step 4: Sender PID -->
  <rect x="874" y="388" width="256" height="186" rx="6" fill="#FFFFFF" stroke="#A86A24" stroke-width="1.2"/>
  <rect x="874" y="388" width="256" height="26" rx="6" fill="#FAEFE1" stroke="#A86A24" stroke-width="1.2"/>
  <text x="886" y="405" font-size="10.5" font-weight="700" fill="#754713">第 4 阶：Sender Port ID</text>
  <text x="886" y="427" font-size="10" font-weight="700" fill="#2B2A26">目的：打破多线并行互联平局</text>
  <text x="886" y="446" font-size="9.5" fill="#5A564B">两交换机间拉多根网线时出现；</text>
  <text x="886" y="462" font-size="9.5" fill="#5A564B">比较上游对端发出的物理端口号；</text>
  <text x="886" y="478" font-size="9.5" fill="#5A564B">端口编号较小（如 Gi0/1 &lt; Gi0/2）者胜；</text>
  <text x="886" y="496" font-size="9.5" font-weight="700" fill="#2F6B5E">✓ 胜出：对端小端口胜出，另一侧阻塞</text>
  <text x="886" y="520" font-size="9.5" fill="#8C887B">极端平局（接 Hub）：比本地 Port ID</text>
  <text x="886" y="542" font-size="9.5" font-weight="700" fill="#A64B3C">✘ 败者：未当选端口置为 Blocking</text>
</svg>