<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>GSO / TSO：决定在哪里分段；Scatter-Gather：决定从哪里取数据</title><desc>算例：MTU 1500，IPv4/TCP 各 20 B，无选项、无封装；5840 B payload = 4 × 1460 B。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="ctrl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="51" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">GSO / TSO：决定在哪里分段；Scatter-Gather：决定从哪里取数据</text>
<text x="48" y="80" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">算例：MTU 1500，IPv4/TCP 各 20 B，无选项、无封装；5840 B payload = 4 × 1460 B。</text>
<text x="48" y="126" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">A · 内核中的一个大 skb</text>
<rect x="48" y="148" width="201" height="70" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="148.5" y="177.0" font-size="14" font-weight="700" fill="#51416D" text-anchor="middle">GSO 元数据</text>
<text x="148.5" y="199.0" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">gso_size = 1460</text>
<rect x="310" y="148" width="220" height="70" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="420" y="178" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="middle">payload 1</text>
<text x="420" y="202" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">1460 B</text>
