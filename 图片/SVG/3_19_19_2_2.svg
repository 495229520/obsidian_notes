<text x="640" y="202" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">1460 B</text>
<rect x="750" y="148" width="220" height="70" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="860" y="178" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="middle">payload 3</text>
<text x="860" y="202" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">1460 B</text>
<rect x="970" y="148" width="220" height="70" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1080" y="178" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="middle">payload 4</text>
<text x="1080" y="202" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">1460 B</text>
<path d="M 253,184 L 306,184" fill="none" stroke="#5A564B" stroke-width="1.7"/>
<rect x="48" y="249" width="556" height="265" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="277" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · 软件分段路径</text>
<rect x="78" y="304" width="185" height="56" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="170.5" y="326.0" font-size="14" font-weight="700" fill="#51416D" text-anchor="middle">GSO 软件分段</text>
<text x="170.5" y="348.0" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">CPU 生成可发送 skb</text>
<path d="M 177,221 L 177,237 L 294,237 L 294,288 L 170,288 L 170,300" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="351" y="304" width="223" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="462.5" y="326.0" font-size="14" font-weight="700" fill="#733428" text-anchor="middle">普通驱动 / NIC</text>
<text x="462.5" y="348.0" font-size="12.5" font-weight="400" fill="#733428" text-anchor="middle">发送已分好的 segment</text>
<path d="M 267,332 L 347,332" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="79" y="410" width="32" height="45" rx="0" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
