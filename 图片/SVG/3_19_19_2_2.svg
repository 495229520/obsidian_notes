<rect x="489" y="410" width="84" height="45" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="531" y="438" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">1460</text>
<path d="M 460,364 L 460,392 L 331,392 L 331,406" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="81" y="490" font-size="13" font-weight="400" fill="#2F6B5E" text-anchor="start">线路：4 个独立 TCP segment / IP 包</text>
<rect x="630" y="249" width="562" height="265" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="650" y="277" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">C · TSO 硬件分段路径</text>
<rect x="660" y="304" width="212" height="56" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="766.0" y="326.0" font-size="14" font-weight="700" fill="#51416D" text-anchor="middle">大 skb + MSS + 头长</text>
<text x="766.0" y="348.0" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">驱动填写 offload 信息</text>
<path d="M 964,222 L 964,237 L 897,237 L 897,288 L 766,288 L 766,300" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="925" y="304" width="238" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="1044.0" y="326.0" font-size="14" font-weight="700" fill="#733428" text-anchor="middle">支持该 TSO 的 NIC</text>
<text x="1044.0" y="348.0" font-size="12.5" font-weight="400" fill="#733428" text-anchor="middle">读取数据并完成分段</text>
<path d="M 876,332 L 921,332" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="661" y="410" width="32" height="45" rx="0" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
