<text x="1055" y="438" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">头</text>
<rect x="1071" y="410" width="84" height="45" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1113" y="438" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">1460</text>
<path d="M 1040,364 L 1040,392 L 915,392 L 915,406" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="665" y="490" font-size="13" font-weight="400" fill="#2F6B5E" text-anchor="start">线路：仍是 4 个合法分段，不是一个巨帧</text>
<text x="48" y="554" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">D · Scatter-Gather 是另一条轴</text>
<rect x="65" y="576" width="195" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="162.5" y="607.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">线性区：DMA 地址 A</text>
<rect x="291" y="576" width="206" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="394.0" y="607.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">page 片段：地址 B</text>
<rect x="528" y="576" width="206" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="631.0" y="607.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">page 片段：地址 C</text>
<path d="M 737,602 L 780,602" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="790" y="576" width="385" height="52" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="982.5" y="596.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">描述符数 ≠ 线路 segment 数</text>
<text x="982.5" y="618.0" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle">内存分散、长度上限与分段参数各自决定</text>
<text x="48" y="684" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start">图中省略 Ethernet 头/FCS；TCP 头长度或路径 MTU 改变时应重算。GSO/TSO 不等于 IP fragmentation，也不保证零拷贝。</text>
</svg>