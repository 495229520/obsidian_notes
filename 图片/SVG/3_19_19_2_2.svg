<text x="279" y="438" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">1460</text>
<rect x="331" y="410" width="32" height="45" rx="0" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="347" y="438" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">头</text>
<rect x="363" y="410" width="84" height="45" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="405" y="438" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">1460</text>
