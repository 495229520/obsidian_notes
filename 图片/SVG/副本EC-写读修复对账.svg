<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统：底色 rgb(245,244,237)；泳道 #FAF9F2/#8A8574；节点 #E3EAF4/#3D5A80/#2C4460；
       校验片 #EEEDFE/#534AB7；等待/成本 #A64B3C；正常/绿色 #2F6B5E；与本库既有 SVG 同一套 -->
  <title>副本与 EC：写、读、修复对账</title>
  <desc>左列三副本的写扇出、就近读与 1 倍修复；右列 EC 4+2 的切片编码扇出、正常直读与降级读、k 倍修复；底部为空间、写网络、故障期读、修复流量、小写行为五行对账。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">副本 vs EC：同一份数据的两种放法，三本账逐条对</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">图示用 EC 4+2 便于绘制；文中 8+3 的结构性结论完全相同，分片必须跨故障域摆放</text>

  <!-- 左：三副本 -->
  <rect x="48" y="104" width="560" height="500" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="328" y="132" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" dominant-baseline="central">三副本（N=3）</text>

  <rect x="258" y="152" width="140" height="40" rx="7" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="328" y="172" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle" dominant-baseline="central">client（完整对象）</text>
  <path d="M328,192 L328,214" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="258" y="218" width="140" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="328" y="240" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">primary 落盘</text>
  <path d="M258,240 L168,286" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <path d="M398,240 L488,286" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="78" y="290" width="160" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="158" y="312" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">follower A（机架 2）</text>
  <rect x="418" y="290" width="160" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="498" y="312" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">follower B（机架 3）</text>

  <text x="328" y="360" font-size="10.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">写网络合计 3× · 确认 = 收齐回执</text>
  <text x="328" y="380" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle" dominant-baseline="central">尾延迟被最慢副本决定：P(慢) 三倍化</text>

  <rect x="78" y="408" width="500" height="48" rx="7" fill="#E3EAF4" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="328" y="424" font-size="12" font-weight="700" fill="#2F6B5E" text-anchor="middle" dominant-baseline="central">读：就近任选一份（1 次 IO）</text>
  <text x="328" y="444" font-size="10.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">副本坏了换一份读——故障期延迟几乎不变</text>

  <rect x="78" y="480" width="500" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="328" y="496" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">修复丢失 1 TB：从存活副本整份拷 1×</text>
  <text x="328" y="516" font-size="10.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">1 读 1 写，流量与参与节点都最少</text>

  <text x="328" y="568" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle" dominant-baseline="central">空间 3.0× · 容忍丢 2 个故障域</text>

  <!-- 右：EC 4+2 -->
  <rect x="632" y="104" width="560" height="500" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="912" y="132" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" dominant-baseline="central">EC k+m（图示 4+2）</text>

  <rect x="782" y="152" width="260" height="40" rx="7" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="912" y="172" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle" dominant-baseline="central">client：切 4 数据片 + 编码 2 校验片</text>

  <path d="M822,192 L700,246" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>
  <path d="M866,192 L790,246" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>
  <path d="M900,192 L876,246" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>
  <path d="M934,192 L962,246" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>
  <path d="M968,192 L1048,246" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>
  <path d="M1012,192 L1134,246" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>

  <rect x="662" y="250" width="78" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="701" y="272" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">D1</text>
  <rect x="748" y="250" width="78" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="787" y="272" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">D2</text>
  <rect x="834" y="250" width="78" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="873" y="272" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">D3</text>
  <rect x="920" y="250" width="78" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="959" y="272" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">D4</text>
  <rect x="1006" y="250" width="78" height="44" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
  <text x="1045" y="272" font-size="11.5" font-weight="700" fill="#3C3489" text-anchor="middle" dominant-baseline="central">P1</text>
  <rect x="1092" y="250" width="78" height="44" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
  <text x="1131" y="272" font-size="11.5" font-weight="700" fill="#3C3489" text-anchor="middle" dominant-baseline="central">P2</text>

  <text x="912" y="318" font-size="10.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">6 个分片 → 6 个故障域 · 写网络 (k+m)/k = 1.5× · 扇出 6 路等齐</text>
  <text x="912" y="340" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle" dominant-baseline="central">部分更新 = RMW（读旧数据+旧校验，双写须原子）——EC 死穴，工业解法：不可变对象 + 追加</text>

  <rect x="662" y="368" width="508" height="44" rx="7" fill="#E3EAF4" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="916" y="384" font-size="12" font-weight="700" fill="#2F6B5E" text-anchor="middle" dominant-baseline="central">正常读：直读数据片（systematic，明文，无需解码）</text>
  <text x="916" y="402" font-size="10.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">与副本读同量级</text>

  <rect x="662" y="428" width="508" height="44" rx="7" fill="#E3EAF4" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="916" y="444" font-size="12" font-weight="700" fill="#A64B3C" text-anchor="middle" dominant-baseline="central">降级读：分片节点坏 → 读任意 4 片 + 解码</text>
  <text x="916" y="462" font-size="10.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">1 次读变 k 次网络读 + CPU 解码——故障期 p99 跳档</text>

  <rect x="662" y="488" width="508" height="52" rx="7" fill="#E3EAF4" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="916" y="504" font-size="12" font-weight="700" fill="#A64B3C" text-anchor="middle" dominant-baseline="central">修复丢失 1 TB：读 4 × 1 TB 重建——k× 流量</text>
  <text x="916" y="526" font-size="10.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">整机故障 = 修复风暴；限速修复 ↔ 拉长丢数据窗口（durability = 冗余 × 修复速度）</text>

  <text x="912" y="568" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle" dominant-baseline="central">空间 1.5×（8+3 为 1.375×）· 容忍丢 m=2 个故障域</text>

  <!-- 对账表 -->
  <rect x="48" y="632" width="1144" height="180" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="70" y="656" font-size="12.5" font-weight="700" fill="#2B2A26" dominant-baseline="central">五行对账</text>
  <text x="430" y="656" font-size="12" font-weight="700" fill="#3D5A80" dominant-baseline="central">三副本</text>
  <text x="800" y="656" font-size="12" font-weight="700" fill="#534AB7" dominant-baseline="central">EC 8+3</text>
  <text x="70" y="684" font-size="11" fill="#4A473F" dominant-baseline="central">空间开销</text>
  <text x="430" y="684" font-size="11" fill="#4A473F" dominant-baseline="central">3.0×</text>
  <text x="800" y="684" font-size="11" fill="#4A473F" dominant-baseline="central">1.375×（容错反而更高：m=3 vs 2）</text>
  <text x="70" y="710" font-size="11" fill="#4A473F" dominant-baseline="central">写网络流量</text>
  <text x="430" y="710" font-size="11" fill="#4A473F" dominant-baseline="central">3× · 等最慢副本</text>
  <text x="800" y="710" font-size="11" fill="#4A473F" dominant-baseline="central">1.375× · 扇出 11 路等齐</text>
  <text x="70" y="736" font-size="11" fill="#4A473F" dominant-baseline="central">故障期读</text>
  <text x="430" y="736" font-size="11" fill="#4A473F" dominant-baseline="central">换一份读，几乎不变</text>
  <text x="800" y="736" font-size="11" fill="#4A473F" dominant-baseline="central">降级读 = 8 片 + 解码，p99 跳档</text>
  <text x="70" y="762" font-size="11" fill="#4A473F" dominant-baseline="central">修复流量</text>
  <text x="430" y="762" font-size="11" fill="#4A473F" dominant-baseline="central">1×</text>
  <text x="800" y="762" font-size="11" fill="#4A473F" dominant-baseline="central">8×（LRC 用少量空间专砍这笔）</text>
  <text x="70" y="788" font-size="11" fill="#4A473F" dominant-baseline="central">原地小写</text>
  <text x="430" y="788" font-size="11" fill="#4A473F" dominant-baseline="central">直接支持</text>
  <text x="800" y="788" font-size="11" fill="#4A473F" dominant-baseline="central">RMW 放大 → 用不可变对象 + 追加取缔</text>

  <text x="620" y="850" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle" dominant-baseline="central">选型：热 / 小 / 原地改 → 副本；冷 / 大 / 一次写成 → EC；写热读冷 → 先 3 副本、后台凑条带转 EC</text>
</svg>
