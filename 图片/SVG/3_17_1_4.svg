<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <title id="title">选择同步机制的决策树</title>
  <desc id="desc">先判断是否存在共享可变并发访问，否则无需同步；是则按访问特征分流到原子、自旋锁、条件变量、读写锁或互斥锁。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      .title { font: 700 26px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .q     { font: 700 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2b34; }
      .ans   { font: 700 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .ansSub{ font: 500 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #eceff1; }
      .ref   { font: 700 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .edge  { font: 600 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #546e7a; }
      .dec   { fill: #fff8e1; stroke: #c39b2e; stroke-width: 2.4; }
      .note  { font: 500 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #546e7a; }
    </style>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text class="title" x="550" y="44" text-anchor="middle">选择同步机制的决策树</text>

  <!-- edges -->
  <g stroke="#90a4ae" stroke-width="2" fill="none">
    <!-- root -> no-sync leaf -->
    <path d="M460 96 C260 96 180 130 170 156" marker-end="url(#a4)"/>
    <!-- root -> access decision -->
    <path d="M550 102 L550 178" marker-end="url(#a4)"/>
    <!-- access decision -> 5 leaves -->
    <path d="M470 226 C300 240 160 280 132 322" marker-end="url(#a4)"/>
    <path d="M505 228 C430 260 370 290 342 322" marker-end="url(#a4)"/>
    <path d="M550 230 L552 322" marker-end="url(#a4)"/>
    <path d="M595 228 C670 260 730 290 762 322" marker-end="url(#a4)"/>
    <path d="M630 226 C800 240 940 280 972 322" marker-end="url(#a4)"/>
  </g>

  <!-- edge labels -->
  <text class="edge" x="300" y="120" text-anchor="middle">否</text>
  <text class="edge" x="572" y="148" text-anchor="start">是</text>
  <text class="edge" x="150" y="290" text-anchor="middle">简单变量 / 计数</text>
  <text class="edge" x="335" y="300" text-anchor="middle">短临界区 / 多核</text>
  <text class="edge" x="552" y="290" text-anchor="middle">需等待条件</text>
  <text class="edge" x="755" y="300" text-anchor="middle">读多写少</text>
  <text class="edge" x="950" y="290" text-anchor="middle">写频繁 / 复杂</text>

  <!-- root decision -->
  <rect class="dec" x="385" y="60" width="330" height="46" rx="10"/>
  <text class="q" x="550" y="89" text-anchor="middle">存在「共享 + 可变 + 并发」访问？</text>

  <!-- no-sync leaf -->
  <rect x="40" y="156" width="270" height="62" rx="12" fill="#607d8b" stroke="#455a64" stroke-width="2"/>
  <text class="ans" x="175" y="183" text-anchor="middle">无需同步</text>
  <text class="ansSub" x="175" y="204" text-anchor="middle">不可变数据 / 线程局部 / 消息传递</text>

  <!-- access decision -->
  <rect class="dec" x="415" y="182" width="270" height="46" rx="10"/>
  <text class="q" x="550" y="211" text-anchor="middle">访问特征？</text>

  <!-- 5 leaves at y=322..410 -->
  <!-- L1 atomic -->
  <rect x="35" y="322" width="195" height="92" rx="12" fill="#b07d37" stroke="#7a5520" stroke-width="2"/>
  <text class="ans" x="132" y="352" text-anchor="middle">原子操作 / CAS</text>
  <text class="ansSub" x="132" y="374" text-anchor="middle">计数器、标志位</text>
  <text class="ansSub" x="132" y="392" text-anchor="middle">无锁结构</text>
  <text class="ref" x="132" y="409" text-anchor="middle">→ 17.5</text>

  <!-- L2 spinlock -->
  <rect x="245" y="322" width="195" height="92" rx="12" fill="#42677c" stroke="#2f4a59" stroke-width="2"/>
  <text class="ans" x="342" y="352" text-anchor="middle">自旋锁 / 互斥锁</text>
  <text class="ansSub" x="342" y="374" text-anchor="middle">临界区短</text>
  <text class="ansSub" x="342" y="392" text-anchor="middle">竞争可控</text>
  <text class="ref" x="342" y="409" text-anchor="middle">→ 17.3</text>

  <!-- L3 condvar -->
  <rect x="455" y="322" width="195" height="92" rx="12" fill="#4f7b58" stroke="#33543b" stroke-width="2"/>
  <text class="ans" x="552" y="352" text-anchor="middle">条件变量 / 信号量</text>
  <text class="ansSub" x="552" y="374" text-anchor="middle">等待—通知</text>
  <text class="ansSub" x="552" y="392" text-anchor="middle">资源计数</text>
  <text class="ref" x="552" y="409" text-anchor="middle">→ 17.4</text>

  <!-- L4 rwlock -->
  <rect x="665" y="322" width="195" height="92" rx="12" fill="#00838f" stroke="#005f66" stroke-width="2"/>
  <text class="ans" x="762" y="352" text-anchor="middle">读写锁 / RCU</text>
  <text class="ansSub" x="762" y="374" text-anchor="middle">读不互斥</text>
  <text class="ansSub" x="762" y="392" text-anchor="middle">读多写少</text>
  <text class="ref" x="762" y="409" text-anchor="middle">→ 17.3</text>

  <!-- L5 mutex -->
  <rect x="875" y="322" width="195" height="92" rx="12" fill="#c0392b" stroke="#8e2017" stroke-width="2"/>
  <text class="ans" x="972" y="352" text-anchor="middle">互斥锁</text>
  <text class="ansSub" x="972" y="374" text-anchor="middle">写频繁</text>
  <text class="ansSub" x="972" y="392" text-anchor="middle">临界区复杂</text>
  <text class="ref" x="972" y="409" text-anchor="middle">→ 17.3</text>

  <!-- footnotes -->
  <line x1="60" y1="455" x2="1040" y2="455" stroke="#cfd2c4" stroke-width="1.5"/>
  <text class="note" x="550" y="488" text-anchor="middle">通用权衡：能用不可变 / 线程局部就不加锁 → 简单变量优先原子 → 必须互斥再选锁</text>
  <text class="note" x="550" y="514" text-anchor="middle">阻塞（睡眠让出 CPU）适合长临界区；忙等（自旋）适合极短临界区 + 多核</text>
  <text class="note" x="550" y="540" text-anchor="middle">粗粒度锁简单但并发度低；细粒度锁并发度高但易死锁 —— 按需演进</text>
</svg>
