<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680"
     font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif">
  <title>Protobuf 堆对象、Protobuf Arena 与 FlatBuffers Cap'n Proto 的内存模型对比</title>
  <desc>对比三种序列化访问路径，强调 Arena 减少分配但不消除解析，FlatBuffers 和 Cap'n Proto 避免对象树物化但仍需要验证与访问成本。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#5A564B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3D5A80"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>

  <text x="48" y="40" font-size="22" font-weight="700" fill="#2B2A26">“零反序列化”真正省掉的是对象树物化</text>
  <text x="48" y="66" font-size="14" fill="#6B675C">Arena 减少分配；FlatBuffers / Cap'n Proto 避免对象树物化。</text>

  <!-- Panel A -->
  <rect x="36" y="92" width="374" height="500" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="58" y="122" font-size="15" font-weight="700" fill="#4A473F">A · Protobuf 默认堆对象</text>
  <text x="58" y="146" font-size="12" fill="#6B675C">wire bytes → eager parse → C++ object tree</text>

  <rect x="58" y="168" width="330" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="223" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4460">tag | varint | len | bytes | submessage</text>
  
  <path d="M 223 212 L 223 242" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  
  <rect x="168" y="248" width="110" height="38" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="223" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#6B4E28">Parser</text>

  <path d="M 223 286 L 223 314" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  
  <rect x="168" y="320" width="110" height="38" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="223" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4460">Root</text>

  <!-- Branching arrows from Root to Submsg A, B, String -->
  <path d="M 188 358 L 116 382" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 223 358 L 223 382" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 258 358 L 330 382" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="58" y="388" width="96" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="106" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4460">Submsg A</text>
  
  <rect x="175" y="388" width="96" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="223" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4460">Submsg B</text>
  
  <rect x="292" y="388" width="96" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="340" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#733428">string heap</text>

  <path d="M 106 432 L 106 452" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 223 432 L 223 452" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  
  <rect x="58" y="458" width="96" height="40" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.1"/>
  <text x="106" y="483" text-anchor="middle" font-size="12" fill="#4A473F">repeated[]</text>
  
  <rect x="175" y="458" width="96" height="40" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.1"/>
  <text x="223" y="483" text-anchor="middle" font-size="12" fill="#733428">string heap</text>

  <rect x="58" y="522" width="330" height="50" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="76" y="544" font-size="12" font-weight="700" fill="#733428">字段扫描 + 多次 allocation</text>
  <text x="76" y="562" font-size="12" fill="#733428">释放时遍历对象树与 free</text>

  <!-- Panel B -->
  <rect x="433" y="92" width="374" height="500" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="455" y="122" font-size="15" font-weight="700" fill="#4A473F">B · Protobuf Arena</text>
  <text x="455" y="146" font-size="12" fill="#6B675C">wire bytes → eager parse → same arena domain</text>

  <rect x="455" y="168" width="330" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="620" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4460">tag | varint | len | bytes | submessage</text>
  
  <path d="M 600 212 L 600 242" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  
  <rect x="550" y="248" width="100" height="38" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="600" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#6B4E28">Parser</text>
  
  <!-- string / unknown heap with clear spacing and arrow -->
  <path d="M 650 267 L 674 267" stroke="#A64B3C" stroke-width="1.4" marker-end="url(#arrRed)"/>
  <rect x="680" y="244" width="105" height="46" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="732" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#733428">string /</text>
  <text x="732" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#733428">unknown heap</text>

  <path d="M 600 286 L 600 312" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="455" y="318" width="330" height="180" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="475" y="344" font-size="13" font-weight="700" fill="#24473F">Arena blocks</text>
  
  <rect x="473" y="362" width="88" height="52" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="517" y="393" text-anchor="middle" font-size="12" fill="#24473F">Root</text>
  
  <rect x="576" y="362" width="88" height="52" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="620" y="393" text-anchor="middle" font-size="12" fill="#24473F">Submsg</text>
  
  <rect x="679" y="362" width="88" height="52" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="723" y="393" text-anchor="middle" font-size="12" fill="#24473F">array</text>
  
  <path d="M 473 440 L 767 440" stroke="#2F6B5E" stroke-width="2.2"/>
  <path d="M 510 430 L 546 430" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <text x="473" y="468" font-size="12" fill="#24473F">allocate ≈ pointer bump</text>

  <rect x="455" y="522" width="330" height="50" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="473" y="544" font-size="12" font-weight="700" fill="#24473F">仍然解析并写入字段</text>
  <text x="473" y="562" font-size="12" fill="#24473F">Arena Reset / 析构时批量回收</text>

  <!-- Panel C -->
  <rect x="830" y="92" width="374" height="500" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="852" y="122" font-size="15" font-weight="700" fill="#4A473F">C · FlatBuffers / Cap'n Proto</text>
  <text x="852" y="146" font-size="12" fill="#6B675C">buffer → verify / lazy checks → typed view</text>

  <!-- Wire buffer container and sub-blocks -->
  <rect x="850" y="168" width="334" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <rect x="858" y="179" width="56" height="34" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="886" y="200" text-anchor="middle" font-size="11" fill="#2C4460">root off</text>
  
  <rect x="920" y="179" width="56" height="34" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="948" y="200" text-anchor="middle" font-size="11" fill="#2C4460">vtable</text>
  
  <rect x="982" y="179" width="56" height="34" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="1010" y="200" text-anchor="middle" font-size="11" fill="#2C4460">table</text>
  
  <rect x="1044" y="179" width="62" height="34" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="1075" y="200" text-anchor="middle" font-size="11" fill="#2C4460">vector</text>
  
  <rect x="1112" y="179" width="64" height="34" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="1144" y="200" text-anchor="middle" font-size="11" fill="#2C4460">string</text>

  <!-- Verification Step (Step 1) -->
  <path d="M 1017 224 L 1017 240" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="927" y="246" width="180" height="34" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="1017" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#6B4E28">① Verifier / limits 校验</text>

  <!-- Typed View (Step 2) -->
  <path d="M 1017 280 L 1017 300" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="912" y="306" width="210" height="42" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1017" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">② Typed view (只读视图)</text>
  <text x="1017" y="339" text-anchor="middle" font-size="11" fill="#24473F">GetRoot + zero-copy accessors</text>

  <!-- Direct In-Place Access lines via clear side channels, no overlapping! -->
  <path d="M 912 327 L 886 327 L 886 230" stroke="#3D5A80" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arrBlue)"/>
  <text x="886" y="280" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3D5A80">直接寻址</text>

  <path d="M 1122 327 L 1144 327 L 1144 230" stroke="#3D5A80" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arrBlue)"/>
  <text x="1144" y="280" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3D5A80">按需切片</text>

  <!-- Panel C notes -->
  <rect x="850" y="374" width="334" height="68" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="868" y="396" font-size="12" font-weight="700" fill="#4A473F">不创建独立 C++ 对象树</text>
  <text x="868" y="416" font-size="12" fill="#4A473F">offset / pointer access，按需触达字段</text>
  <text x="868" y="434" font-size="12" fill="#4A473F">view 生命周期完全依赖原始 buffer</text>

  <rect x="850" y="456" width="334" height="52" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="868" y="477" font-size="12" font-weight="700" fill="#6B4E28">调用 UnPack / packed 解码会重新物化</text>
  <text x="868" y="495" font-size="12" fill="#6B4E28">直接访问适合只读与少改场景</text>

  <!-- Bottom summary bar -->
  <rect x="36" y="608" width="1168" height="48" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="58" y="628" font-size="12" font-weight="700" fill="#733428">直接访问 ≠ 0 CPU：网络输入仍需校验。</text>
  <text x="58" y="646" font-size="12" fill="#733428">访问仍有 offset、字节序、cache miss 与业务遍历。</text>
</svg>
