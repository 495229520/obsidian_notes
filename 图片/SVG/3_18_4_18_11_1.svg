<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680"
     font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif">
  <title>Protobuf 堆对象、Protobuf Arena 与 FlatBuffers Cap'n Proto 的内存模型对比</title>
  <desc>对比三种序列化访问路径，强调 Arena 减少分配但不消除解析，FlatBuffers 和 Cap'n Proto 避免对象树物化但仍需要验证与访问成本。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" fill="#F5F4ED"/>

  <text x="48" y="40" font-size="22" font-weight="700" fill="#2B2A26">“零反序列化”真正省掉的是对象树物化</text>
  <text x="48" y="66" font-size="14" fill="#6B675C">Arena 减少分配；FlatBuffers / Cap'n Proto 避免对象树物化。</text>

  <!-- Panel A -->
  <rect x="36" y="92" width="374" height="500" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="58" y="122" font-size="15" font-weight="700" fill="#4A473F">A · Protobuf 默认堆对象</text>
  <text x="58" y="146" font-size="12" fill="#6B675C">wire bytes → eager parse → C++ object tree</text>

  <rect x="58" y="170" width="330" height="46" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="76" y="198" font-size="13" font-weight="700" fill="#2C4460">tag | varint | len | bytes | submessage</text>
  <path d="M223 216 L223 250" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="168" y="250" width="110" height="40" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="193" y="275" font-size="13" font-weight="700" fill="#6B4E28">Parser</text>

  <path d="M223 290 L223 320" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="170" y="320" width="106" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="193" y="346" font-size="13" font-weight="700" fill="#2C4460">Root</text>

  <path d="M170 341 L112 388" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M223 362 L223 388" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M276 341 L334 388" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="64" y="388" width="96" height="46" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="86" y="416" font-size="12" font-weight="700" fill="#2C4460">Submsg A</text>
  <rect x="175" y="388" width="96" height="46" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="197" y="416" font-size="12" font-weight="700" fill="#2C4460">Submsg B</text>
  <rect x="286" y="388" width="96" height="46" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="310" y="416" font-size="12" font-weight="700" fill="#733428">string heap</text>

  <path d="M112 434 L112 458" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M223 434 L223 458" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="64" y="458" width="96" height="42" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.1"/>
  <text x="82" y="484" font-size="12" fill="#4A473F">repeated[]</text>
  <rect x="175" y="458" width="96" height="42" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.1"/>
  <text x="199" y="484" font-size="12" fill="#733428">string heap</text>

  <rect x="58" y="524" width="330" height="48" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="76" y="545" font-size="12" font-weight="700" fill="#733428">字段扫描 + 多次 allocation</text>
  <text x="76" y="563" font-size="12" fill="#733428">释放时遍历对象树与 free</text>

  <!-- Panel B -->
  <rect x="433" y="92" width="374" height="500" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="455" y="122" font-size="15" font-weight="700" fill="#4A473F">B · Protobuf Arena</text>
  <text x="455" y="146" font-size="12" fill="#6B675C">wire bytes → eager parse → same arena domain</text>

  <rect x="455" y="170" width="330" height="46" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="473" y="198" font-size="13" font-weight="700" fill="#2C4460">tag | varint | len | bytes | submessage</text>
  <path d="M620 216 L620 250" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="565" y="250" width="110" height="40" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="590" y="275" font-size="13" font-weight="700" fill="#6B4E28">Parser</text>
  <path d="M620 290 L620 318" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="469" y="318" width="302" height="178" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="487" y="344" font-size="13" font-weight="700" fill="#24473F">Arena blocks</text>
  <rect x="487" y="362" width="83" height="54" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="507" y="394" font-size="12" fill="#24473F">Root</text>
  <rect x="580" y="362" width="83" height="54" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="596" y="394" font-size="12" fill="#24473F">Submsg</text>
  <rect x="673" y="362" width="80" height="54" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="691" y="394" font-size="12" fill="#24473F">array</text>
  <path d="M487 438 L742 438" stroke="#2F6B5E" stroke-width="2.2"/>
  <path d="M520 430 L545 430" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="487" y="470" font-size="12" fill="#24473F">allocate ≈ pointer bump</text>

  <rect x="689" y="250" width="82" height="46" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="707" y="270" font-size="11" font-weight="700" fill="#733428">string /</text>
  <text x="703" y="286" font-size="11" font-weight="700" fill="#733428">unknown heap</text>
  <path d="M675 270 L689 270" stroke="#A64B3C" stroke-width="1.4" marker-end="url(#arrRed)"/>

  <rect x="455" y="524" width="330" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="473" y="545" font-size="12" font-weight="700" fill="#24473F">仍然解析并写入字段</text>
  <text x="473" y="563" font-size="12" fill="#24473F">Arena Reset / 析构时批量回收</text>

  <!-- Panel C -->
  <rect x="830" y="92" width="374" height="500" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="852" y="122" font-size="15" font-weight="700" fill="#4A473F">C · FlatBuffers / Cap'n Proto</text>
  <text x="852" y="146" font-size="12" fill="#6B675C">buffer → verify / lazy checks → typed view</text>

  <rect x="852" y="170" width="330" height="64" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <rect x="866" y="184" width="52" height="34" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="874" y="205" font-size="11" fill="#2C4460">root off</text>
  <rect x="924" y="184" width="52" height="34" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="938" y="205" font-size="11" fill="#2C4460">vtable</text>
  <rect x="982" y="184" width="52" height="34" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="995" y="205" font-size="11" fill="#2C4460">table</text>
  <rect x="1040" y="184" width="58" height="34" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="1053" y="205" font-size="11" fill="#2C4460">vector</text>
  <rect x="1104" y="184" width="64" height="34" rx="4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1"/>
  <text x="1118" y="205" font-size="11" fill="#2C4460">string</text>

  <path d="M1017 234 L1017 266" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="947" y="266" width="140" height="42" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="972" y="292" font-size="12" font-weight="700" fill="#6B4E28">Verifier / limits</text>
  <path d="M1017 308 L1017 344" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="936" y="344" width="162" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="966" y="368" font-size="13" font-weight="700" fill="#24473F">Typed view</text>
  <text x="953" y="386" font-size="11" fill="#24473F">GetRoot + accessors</text>

  <path d="M978 344 L917 244" stroke="#3D5A80" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M1017 344 L1008 238" stroke="#3D5A80" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M1058 344 L1137 238" stroke="#3D5A80" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <rect x="852" y="424" width="330" height="72" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="870" y="447" font-size="12" font-weight="700" fill="#4A473F">不创建独立 C++ 对象树</text>
  <text x="870" y="467" font-size="12" fill="#4A473F">offset / pointer access，按需触达字段</text>
  <text x="870" y="487" font-size="12" fill="#4A473F">view 生命周期完全依赖原始 buffer</text>

  <rect x="852" y="524" width="330" height="48" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="870" y="545" font-size="12" font-weight="700" fill="#6B4E28">调用 UnPack / packed 解码会重新物化</text>
  <text x="870" y="563" font-size="12" fill="#6B4E28">直接访问适合只读与少改场景</text>

  <rect x="36" y="610" width="1168" height="46" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="58" y="630" font-size="12" font-weight="700" fill="#733428">直接访问 ≠ 0 CPU：网络输入仍需校验。</text>
  <text x="58" y="649" font-size="12" fill="#733428">访问仍有 offset、字节序、cache miss 与业务遍历。</text>
</svg>
