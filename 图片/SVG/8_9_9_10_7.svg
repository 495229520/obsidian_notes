<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
<title>NIC 计数器的口径：流量证据，不是逐请求完成证明</title>
<desc>构造计数样本 · mlx5 名称需核对本机版本；方向、单位、范围和采样窗口缺一不可</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="47" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">NIC 计数器的口径：流量证据，不是逐请求完成证明</text>
<text x="48" y="77" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400">构造计数样本 · mlx5 名称需核对本机版本；方向、单位、范围和采样窗口缺一不可</text>
<rect x="48" y="121" width="284" height="81" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="190" y="155" font-size="15" fill="#24473F" text-anchor="middle" font-weight="700">逻辑请求 payload</text>
<text x="190" y="178" font-size="14" fill="#24473F" text-anchor="middle" font-weight="400">64 MiB · 唯一有效数据</text>
<rect x="363" y="121" width="305" height="81" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="515.5" y="155" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="700">两个 worker / batch</text>
<text x="515.5" y="178" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400">32 MiB + 32 MiB</text>
<rect x="749" y="121" width="443" height="81" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="970.5" y="155" font-size="15" fill="#6B4E28" text-anchor="middle" font-weight="700">端口 / vport 的 RDMA 窗口</text>
<text x="970.5" y="178" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400">Δ = 70,000,000 B · Δt = 4 ms</text>
<line x1="336" y1="160" x2="357" y2="160" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="674" y1="160" x2="743" y2="160" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="689" y="227" font-size="13" fill="#6B675C" text-anchor="middle" font-weight="400">虚线：同期相关，不是精确流量归属</text>
<rect x="48" y="251" width="386" height="37" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="61" y="276" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700">counter / 类型</text>
<rect x="434" y="251" width="377" height="37" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="447" y="276" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700">必须保留的解释</text>
<rect x="48" y="288" width="386" height="53" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="61" y="320" font-size="12.5" fill="#2B2A26" text-anchor="start" font-weight="400">rx_vport_unicast_bytes</text>
<rect x="434" y="288" width="377" height="53" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="447" y="320" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400">排除 RDMA，不能证明 KV 流量</text>
<rect x="48" y="341" width="386" height="53" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="61" y="373" font-size="12.5" fill="#2B2A26" text-anchor="start" font-weight="400">rx_vport_rdma_unicast_bytes</text>
<rect x="434" y="341" width="377" height="53" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="447" y="373" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400">RDMA 聚合字节，非 request 级</text>
<rect x="48" y="394" width="386" height="53" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="61" y="426" font-size="12.5" fill="#2B2A26" text-anchor="start" font-weight="400">rx_bytes_phy</text>
<rect x="434" y="394" width="377" height="53" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="447" y="426" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400">物理端口，含 header / FCS</text>
<rect x="48" y="447" width="386" height="53" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="61" y="479" font-size="12.5" fill="#2B2A26" text-anchor="start" font-weight="400">rx_prio[p]_pause_duration</text>
<rect x="434" y="447" width="377" height="53" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="447" y="479" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400">收到 pause → 本端 TX 暂停，μs</text>
<rect x="48" y="500" width="386" height="53" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="61" y="532" font-size="12.5" fill="#2B2A26" text-anchor="start" font-weight="400">outbound_pci_stalled_rd/wr</text>
<rect x="434" y="500" width="377" height="53" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="447" y="532" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400">最近一秒百分比；gauge，不做差分</text>
<rect x="837" y="251" width="355" height="302" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="857" y="282" font-size="16" fill="#2C4460" text-anchor="start" font-weight="700">窗口速率</text>
<text x="857" y="323" font-size="17" fill="#2C4460" text-anchor="start" font-weight="400">70,000,000 B / 0.004 s</text>
<text x="857" y="360" font-size="25" fill="#2C4460" text-anchor="start" font-weight="700">= 17.5 GB/s</text>
<text x="857" y="394" font-size="20" fill="#2C4460" text-anchor="start" font-weight="700">= 140 Gbit/s</text>
<line x1="857" y1="414" x2="1172" y2="414" stroke="#3D5A80" stroke-width="1.5"/>
<text x="857" y="447" font-size="14" fill="#2C4460" text-anchor="start" font-weight="400">不是 R-017 的专属流量</text>
<text x="857" y="476" font-size="14" fill="#2C4460" text-anchor="start" font-weight="400">不是 KV_USABLE 的时间戳</text>
<text x="857" y="505" font-size="14" fill="#2C4460" text-anchor="start" font-weight="400">不是整张 GPU 的有效工作量</text>
<text x="857" y="534" font-size="14" fill="#2C4460" text-anchor="start" font-weight="400">不是瓶颈归因的充分条件</text>
<text x="49" y="592" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700">采样线程</text>
<rect x="165" y="572" width="235" height="54" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="282.5" y="592.5" font-size="15" fill="#4A473F" text-anchor="middle" font-weight="700">monotonic_ns()</text>
<text x="282.5" y="615.5" font-size="14" fill="#4A473F" text-anchor="middle" font-weight="400">begin</text>
<rect x="452" y="572" width="360" height="54" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="632" y="592.5" font-size="15" fill="#6B4E28" text-anchor="middle" font-weight="700">subprocess.run(ethtool -S)</text>
<text x="632" y="615.5" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400">阻塞：等 ethtool 子进程</text>
<rect x="863" y="572" width="329" height="54" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1027.5" y="592.5" font-size="15" fill="#4A473F" text-anchor="middle" font-weight="700">monotonic_ns()</text>
<text x="1027.5" y="615.5" font-size="14" fill="#4A473F" text-anchor="middle" font-weight="400">end</text>
<line x1="405" y1="599" x2="445" y2="599" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="817" y1="599" x2="856" y2="599" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="48" y1="639" x2="1192" y2="639" stroke="#D8D5C8" stroke-width="1.5"/>
<text x="48" y="668" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">begin→end 是采集包络，不是请求时延；counter 重置应标记不连续，1 秒均值不能解释毫秒空窗。</text>
</svg>