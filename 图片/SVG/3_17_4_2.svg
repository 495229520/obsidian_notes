<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960px" height="540px" viewBox="0 0 960 540" version="1.1"><rect x="0" y="0" width="960" height="540" fill="rgb(245, 244, 237)" /><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><text font-size="15" font-weight="500" fill="#444441" font-family="system-ui, sans-serif" x="480" y="32" text-anchor="middle" dominant-baseline="central">条件变量 vs 信号量：内部状态与唤醒机制对比</text><rect fill="#EFF5FB" stroke="#185FA5" stroke-width="0.8" x="40" y="70" width="420" height="420" rx="10" /><text font-size="14" font-weight="500" fill="#0C447C" font-family="system-ui, sans-serif" x="250" y="96" text-anchor="middle" dominant-baseline="central">条件变量 (Condition Variable)</text><rect fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" x="70" y="120" width="360" height="56" rx="8" /><text font-size="12" fill="#3C3489" font-family="system-ui, sans-serif" x="250" y="140" text-anchor="middle" dominant-baseline="central">无内部计数器 / 状态<tspan x="250" dy="15.6">条件由外部谓词 + mutex 保护的共享变量表达</tspan></text><rect fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" x="70" y="196" width="360" height="44" rx="8" /><text font-size="12" fill="#444441" font-family="system-ui, sans-serif" x="250" y="218" text-anchor="middle" dominant-baseline="central">必须配合 mutex + while(谓词) 使用</text><rect fill="#FBE9E7" stroke="#B3261E" stroke-width="0.5" x="70" y="260" width="360" height="56" rx="8" /><text font-size="12" fill="#7A1B14" font-family="system-ui, sans-serif" x="250" y="280" text-anchor="middle" dominant-baseline="central">signal 无「记忆」：<tspan x="250" dy="15.6">若此刻没有线程在等，信号丢失</tspan></text><rect fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" x="70" y="336" width="360" height="44" rx="8" /><text font-size="12" fill="#085041" font-family="system-ui, sans-serif" x="250" y="358" text-anchor="middle" dominant-baseline="central">可表达任意复杂条件（size&gt;0 &amp;&amp; !stop）</text><rect fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" x="70" y="400" width="360" height="56" rx="8" /><text font-size="12" fill="#0C447C" font-family="system-ui, sans-serif" x="250" y="420" text-anchor="middle" dominant-baseline="central">适用场景<tspan x="250" dy="15.6">复杂等待条件、生产者-消费者、线程池</tspan></text><rect fill="#FBF6EE" stroke="#854F0B" stroke-width="0.8" x="500" y="70" width="420" height="420" rx="10" /><text font-size="14" font-weight="500" fill="#633806" font-family="system-ui, sans-serif" x="710" y="96" text-anchor="middle" dominant-baseline="central">信号量 (Semaphore)</text><rect fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" x="530" y="120" width="360" height="56" rx="8" /><text font-size="12" fill="#633806" font-family="system-ui, sans-serif" x="710" y="140" text-anchor="middle" dominant-baseline="central">内部维护一个非负整数计数器<tspan x="710" dy="15.6">P 操作 -1，V 操作 +1，到 0 时阻塞</tspan></text><rect fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" x="530" y="196" width="360" height="44" rx="8" /><text font-size="12" fill="#444441" font-family="system-ui, sans-serif" x="710" y="218" text-anchor="middle" dominant-baseline="central">无需配合 mutex（自身操作已是原子的）</text><rect fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" x="530" y="260" width="360" height="56" rx="8" /><text font-size="12" fill="#085041" font-family="system-ui, sans-serif" x="710" y="280" text-anchor="middle" dominant-baseline="central">post 有「记忆」：<tspan x="710" dy="15.6">即使没有线程在等，计数仍 +1 保留</tspan></text><rect fill="#FBE9E7" stroke="#B3261E" stroke-width="0.5" x="530" y="336" width="360" height="44" rx="8" /><text font-size="12" fill="#7A1B14" font-family="system-ui, sans-serif" x="710" y="358" text-anchor="middle" dominant-baseline="central">只能表达简单计数条件（count &gt; 0）</text><rect fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" x="530" y="400" width="360" height="56" rx="8" /><text font-size="12" fill="#633806" font-family="system-ui, sans-serif" x="710" y="420" text-anchor="middle" dominant-baseline="central">适用场景<tspan x="710" dy="15.6">资源池计数、并发槽位、简单 P-C</tspan></text><text font-size="13" font-weight="500" fill="#444441" font-family="system-ui, sans-serif" x="480" y="514" text-anchor="middle" dominant-baseline="central">关键区别：信号量有「记忆」（计数不丢），条件变量有「灵活性」（任意谓词）</text></svg>