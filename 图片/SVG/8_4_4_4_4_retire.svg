<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<title>缓存淘汰：LRU 选候选，安全门决定能否注销</title>
<desc>图示采用缓存父 MR 路线：先退休子 grant / MW，再关闭父注册。。中文教学示意；状态编号与时间间距不代表实测延迟。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="690" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="49" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">缓存淘汰：LRU 选候选，安全门决定能否注销</text>
<text x="48" y="79" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start">图示采用缓存父 MR 路线：先退休子 grant / MW，再关闭父注册。</text>
<text x="50" y="124" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">REGISTERING：注册成功后，还要复核 backing / 失效序号</text>
<rect x="50" y="166" width="163" height="72" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="131.5" y="196.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">READY / IDLE</text>
<text x="131.5" y="217.5" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle">允许合法借用</text>
<rect x="265" y="166" width="180" height="72" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="355.0" y="196.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">INVALIDATING</text>
<text x="355.0" y="217.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">摘除索引 / 关门</text>
<rect x="497" y="166" width="157" height="72" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="575.5" y="196.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">DRAINING</text>
<text x="575.5" y="217.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">等待证据</text>
<rect x="706" y="166" width="232" height="72" rx="8" fill="#EDEAF3" stroke="#82749E" stroke-width="1.3"/>
<text x="822.0" y="196.5" font-size="14" fill="#5D4F78" font-weight="700" text-anchor="middle">DEREGISTERING</text>
<text x="822.0" y="217.5" font-size="13" fill="#5D4F78" font-weight="400" text-anchor="middle">唯一回收者执行</text>
<rect x="990" y="166" width="200" height="72" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1090.0" y="196.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">DEAD</text>
<text x="1090.0" y="217.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">资源已安全结束</text>
<line x1="215" y1="202" x2="259" y2="202" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="447" y1="202" x2="491" y2="202" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="656" y1="202" x2="700" y2="202" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="940" y1="202" x2="984" y2="202" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="263" y="154" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">失效 / 淘汰</text>
<text x="705" y="154" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">守卫通过</text>
<text x="989" y="154" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">注销成功</text>
<path d="M576,241 L576,293 L647,293 L647,304" fill="none" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)" stroke-dasharray="5 4"/>
<path d="M822,241 L822,293 L739,293 L739,304" fill="none" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)" stroke-dasharray="5 4"/>
<rect x="514" y="309" width="342" height="58" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="685.0" y="332.5" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">QUARANTINED</text>
<text x="685.0" y="353.5" font-size="13" fill="#733428" font-weight="400" text-anchor="middle">超时 / 错误 / 证据缺失</text>
<text x="57" y="286" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">失效条目不复活</text>
<text x="57" y="313" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">新注册使用新身份</text>
<text x="900" y="286" font-size="14" fill="#733428" font-weight="700" text-anchor="start">注销失败不能 free</text>
<text x="900" y="313" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">保留 MR + backing</text>
<text x="51" y="411" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">B · 父 MR 的注销守卫</text>
<rect x="50" y="431" width="380" height="39" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="68" y="456" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">本地使用</text>
<rect x="430" y="431" width="380" height="39" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="448" y="456" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">子授权与窗口</text>
<rect x="810" y="431" width="380" height="39" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="828" y="456" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">传输与后端</text>
<rect x="50" y="470" width="380" height="48" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="500" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">lease_refs = 0</text>
<rect x="430" y="470" width="380" height="48" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="448" y="500" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">grant_refs = 0</text>
<rect x="810" y="470" width="380" height="48" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="828" y="500" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">backend_ops = 0</text>
<rect x="50" y="518" width="380" height="48" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="548" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">wr_refs = 0</text>
<rect x="430" y="518" width="380" height="48" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="448" y="548" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">bound_mw = 0</text>
<rect x="810" y="518" width="380" height="48" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="828" y="548" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">旧访问已排空</text>
<text x="52" y="594" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">共同前提：已摘索引、backing 仍持有、未来旧访问已关闭。</text>
<line x1="48" y1="625" x2="1192" y2="625" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="654" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">独立 MR 用 dereg 完成撤销时，授权由 retirement 独占持有；不得建立循环等待。</text>
</svg>