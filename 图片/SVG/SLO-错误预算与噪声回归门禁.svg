<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 892" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统：底色 rgb(245,244,237)；蓝框 #E3EAF4/#3D5A80/#2C4460；绿/安全 #DCE9E3/#2F6B5E/#24473F；
       红/告警 #F0E0DB/#A64B3C/#733428；中性 #F1EFE8/#D8D5C8/#4A473F；与库内既有 SVG 同一套 -->
  <title>SLO 与性能回归：错误预算控制环与噪声回归门禁</title>
  <desc>上半部分是 SLO 控制环——SLI 测量、SLO 目标、错误预算 = 1 − SLO、以及多窗口多燃尽率告警（快烧 page、慢烧工单）与错误预算燃尽曲线；下半部分是性能回归门禁——基线与候选两条噪声分布重叠，说明单点对比会假阳性泛滥，须用分布对比（Mann-Whitney / bootstrap 置信区间 + 效应量），并列出噪声来源与锁定对策。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="892" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">SLO 与性能回归：把「多快才算好」变成契约，把「悄悄变慢」挡在门外</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">左脑：错误预算是可以花的风险；右脑：存储基准天生有噪声，单点对比必然假阳性泛滥</text>

  <!-- ============ Panel A：SLO 控制环 ============ -->
  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">A · SLO 控制环：SLI（测量）→ SLO（目标）→ 错误预算（= 1 − SLO）→ 燃尽率告警</text>

  <rect x="48" y="124" width="352" height="76" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="224" y="148" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">SLI · 服务等级指标（测量值）</text>
  <text x="224" y="169" font-size="10.5" fill="#2C4460" text-anchor="middle">p99 读延迟 / 可用性 = 好请求 / 总请求</text>
  <text x="224" y="187" font-size="10.5" fill="#2C4460" text-anchor="middle">在 client 侧端到端量（9.1 的 clat 已含网络 + 服务端）</text>
  <path d="M400,162 L426,162" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="428" y="124" width="336" height="76" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="596" y="148" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">SLO · 目标（在一个窗口内）</text>
  <text x="596" y="169" font-size="10.5" fill="#2C4460" text-anchor="middle">例：30 天内 p99 &lt; 500 μs 且 可用性 ≥ 99.9%</text>
  <text x="596" y="187" font-size="10.5" fill="#2C4460" text-anchor="middle">用分位数不用均值（9.1 §5.2 / 9.5）</text>
  <path d="M764,162 L790,162" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="792" y="124" width="400" height="76" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="992" y="148" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">错误预算 = 1 − SLO</text>
  <text x="992" y="169" font-size="10.5" fill="#24473F" text-anchor="middle">99.9% → 0.1% ≈ 43 min / 月「允许不达标」</text>
  <text x="992" y="187" font-size="10.5" fill="#24473F" text-anchor="middle">预算 = 可花的风险：发布、演练（9.6）、实验</text>

  <!-- 燃尽曲线 + 告警逻辑 -->
  <text x="48" y="230" font-size="12.5" font-weight="700" fill="#4A473F">错误预算燃尽率：多窗口多燃尽率告警——快烧 page，慢烧开工单</text>

  <!-- 燃尽曲线 -->
  <rect x="48" y="242" width="560" height="176" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="264" font-size="11" font-weight="700" fill="#4A473F">错误预算余量随时间燃尽</text>
  <!-- 轴 -->
  <line x1="104" y1="284" x2="104" y2="392" stroke="#8A8574" stroke-width="1.3"/>
  <line x1="104" y1="392" x2="584" y2="392" stroke="#8A8574" stroke-width="1.3"/>
  <text x="98" y="288" font-size="9.5" fill="#6B675C" text-anchor="end">100%</text>
  <text x="98" y="395" font-size="9.5" fill="#6B675C" text-anchor="end">0%</text>
  <text x="584" y="408" font-size="9.5" fill="#6B675C" text-anchor="end">30 天窗口</text>
  <!-- 理想匀速线（虚线） -->
  <path d="M104,284 L584,392" fill="none" stroke="#2F6B5E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="470" y="330" font-size="9.5" fill="#2F6B5E">匀速：预算刚好用满一窗</text>
  <!-- 实际：慢烧 + 快烧悬崖 -->
  <path d="M104,284 L250,318 L330,336" fill="none" stroke="#3D5A80" stroke-width="2.2"/>
  <path d="M330,336 L392,392" fill="none" stroke="#A64B3C" stroke-width="2.6"/>
  <circle cx="392" cy="392" r="3.5" fill="#A64B3C"/>
  <text x="150" y="308" font-size="9.5" fill="#3D5A80">慢烧：6h 烧 5% → 开工单</text>
  <text x="345" y="360" font-size="9.5" font-weight="700" fill="#A64B3C">快烧：1h 烧 2%</text>
  <text x="345" y="375" font-size="9.5" font-weight="700" fill="#A64B3C">→ 立即 page</text>

  <!-- 告警逻辑 -->
  <rect x="628" y="242" width="564" height="176" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="648" y="264" font-size="11.5" font-weight="700" fill="#24473F">多窗口多燃尽率（Google SRE 做法）</text>
  <text x="648" y="286" font-size="10.5" fill="#24473F">燃尽率 burn rate = 实际错误率 ÷ (1 − SLO)</text>
  <text x="648" y="304" font-size="10.5" fill="#24473F">= 1 → 恰好一个窗口用完预算；= 14.4 → 1h 烧掉 2%</text>
  <line x1="648" y1="316" x2="1172" y2="316" stroke="#9FBDB2" stroke-width="1"/>
  <text x="648" y="335" font-size="10.5" font-weight="700" fill="#24473F">长窗 + 短窗</text>
  <text x="820" y="335" font-size="10.5" font-weight="700" fill="#24473F">燃尽率阈值</text>
  <text x="1000" y="335" font-size="10.5" font-weight="700" fill="#24473F">动作</text>
  <text x="648" y="356" font-size="10.5" fill="#733428">1h &amp; 5m</text>
  <text x="820" y="356" font-size="10.5" fill="#733428">&gt; 14.4</text>
  <text x="1000" y="356" font-size="10.5" font-weight="700" fill="#733428">立即 page（快烧）</text>
  <text x="648" y="376" font-size="10.5" fill="#24473F">6h &amp; 30m</text>
  <text x="820" y="376" font-size="10.5" fill="#24473F">&gt; 6</text>
  <text x="1000" y="376" font-size="10.5" fill="#24473F">开工单（慢烧）</text>
  <line x1="648" y1="388" x2="1172" y2="388" stroke="#9FBDB2" stroke-width="1"/>
  <text x="648" y="406" font-size="10" fill="#24473F">双窗同时超才告警：短窗抓突发、长窗滤抖动 → 少误报、快恢复</text>

  <!-- ============ Panel B：回归门禁 ============ -->
  <text x="48" y="452" font-size="13" font-weight="700" fill="#4A473F">B · 性能回归门禁：基准有噪声，单点对比必然假阳性泛滥——要比分布，不要比一个数</text>

  <!-- 分布图 -->
  <rect x="48" y="464" width="712" height="404" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="488" font-size="11" font-weight="700" fill="#4A473F">同一负载各跑 N 次的 p99 分布（越左越好）</text>

  <!-- 噪声重叠带 -->
  <rect x="300" y="520" width="150" height="250" fill="#EFE7DA" stroke="none"/>
  <text x="375" y="512" font-size="10" fill="#8A6A3A" text-anchor="middle">噪声重叠带</text>

  <!-- 轴 -->
  <line x1="96" y1="770" x2="732" y2="770" stroke="#8A8574" stroke-width="1.3"/>
  <text x="732" y="792" font-size="10" fill="#6B675C" text-anchor="end">p99 延迟 →（右 = 更慢 = 回归方向）</text>

  <!-- 基线分布（绿） -->
  <path d="M110,770 C210,770 218,560 300,560 C382,560 390,770 470,770" fill="none" stroke="#2F6B5E" stroke-width="2.4"/>
  <text x="250" y="548" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">基线分布（N 次）</text>
  <line x1="300" y1="560" x2="300" y2="770" stroke="#2F6B5E" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="300" y="786" font-size="9.5" fill="#2F6B5E" text-anchor="middle">中位数</text>

  <!-- 候选分布（红，右移 + 更胖 = 更大方差） -->
  <path d="M300,770 C405,770 414,588 500,588 C590,588 600,770 700,770" fill="none" stroke="#A64B3C" stroke-width="2.4"/>
  <text x="560" y="576" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">候选分布（N 次）</text>
  <line x1="500" y1="588" x2="500" y2="770" stroke="#A64B3C" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="500" y="786" font-size="9.5" fill="#733428" text-anchor="middle">中位数右移 = 真信号</text>

  <!-- 单点样本 -->
  <circle cx="360" cy="758" r="4" fill="#2F6B5E"/>
  <text x="360" y="748" font-size="9" fill="#2F6B5E" text-anchor="middle">昨天一次</text>
  <circle cx="330" cy="758" r="4" fill="#A64B3C"/>
  <text x="318" y="726" font-size="9" fill="#A64B3C" text-anchor="middle">今天一次</text>
  <text x="150" y="700" font-size="10" fill="#733428">单点对比：今天 &lt; 昨天，</text>
  <text x="150" y="716" font-size="10" fill="#733428">却把「更慢」判成「更快」——</text>
  <text x="150" y="732" font-size="10" fill="#733428">噪声带里的一次采样毫无意义</text>

  <!-- 判据 -->
  <rect x="68" y="806" width="672" height="50" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="84" y="826" font-size="10.5" font-weight="700" fill="#24473F">判回归的正确条件（两条都要满足）：</text>
  <text x="84" y="845" font-size="10.5" fill="#24473F">① 分布差异统计显著（Mann-Whitney U / bootstrap 置信区间）　② 效应量 &gt; 噪声带宽（否则只是抖动）</text>

  <!-- 噪声来源 -->
  <rect x="776" y="464" width="416" height="404" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="796" y="488" font-size="11.5" font-weight="700" fill="#2B2A26">噪声来源（每一项都要在基准里锁死）</text>
  <text x="796" y="514" font-size="10.5" fill="#4A473F">· SSD 稳态 / GC 抖动（3.6 / 3.5）</text>
  <text x="796" y="536" font-size="10.5" fill="#4A473F">· Page Cache 冷热（1.2）</text>
  <text x="796" y="558" font-size="10.5" fill="#4A473F">· 邻居干扰（同机 / 同盘 / 同网卡）</text>
  <text x="796" y="580" font-size="10.5" fill="#4A473F">· 温控降频、盘温漂移</text>
  <text x="796" y="602" font-size="10.5" fill="#4A473F">· 内核 / 固件 / fio 版本变化</text>
  <line x1="796" y1="618" x2="1172" y2="618" stroke="#C9C5B6" stroke-width="1"/>
  <text x="796" y="640" font-size="10.5" font-weight="700" fill="#2B2A26">对策：让基准可复现（9.1 清单）</text>
  <text x="796" y="662" font-size="10.5" fill="#4A473F">固定硬件 + 预处理到稳态 + 预热</text>
  <text x="796" y="684" font-size="10.5" fill="#4A473F">+ 绑核 / NUMA（3.8）+ 版本钉死</text>
  <line x1="796" y1="700" x2="1172" y2="700" stroke="#C9C5B6" stroke-width="1"/>
  <rect x="792" y="712" width="384" height="60" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="808" y="732" font-size="10.5" font-weight="700" fill="#733428">别用绝对阈值当门禁</text>
  <text x="808" y="750" font-size="10" fill="#733428">硬件 / 固件一换，绝对值就漂移失效；</text>
  <text x="808" y="765" font-size="10" fill="#733428">比「相对滚动基线的回归 %」才稳</text>
  <text x="796" y="800" font-size="10.5" font-weight="700" fill="#2B2A26">跑在哪：StorageBenchmark Operator（10.4）</text>
  <text x="796" y="822" font-size="10" fill="#4A473F">基准矩阵（9.1）是负载，SLO 是门槛，</text>
  <text x="796" y="840" font-size="10" fill="#4A473F">回归门禁是定时控制面作业，产出可比对象</text>
</svg>
