<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540">
  <rect x="0" y="0" width="820" height="540" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>死锁的循环等待：资源分配图中出现环</title>
  <desc>线程 A 持有锁1 并等待锁2，线程 B 持有锁2 并等待锁1，请求与持有边构成环，谁都无法前进。</desc>

  <text x="410" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    死锁的循环等待：资源分配图中出现环
  </text>
  <text x="410" y="56" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">
    实线 = 已持有，虚线 = 正在等待；A → 锁2 → B → 锁1 → A 形成环
  </text>

  <!-- Thread A -->
  <rect x="100" y="110" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="200" y="130" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">线程 A</text>
  <text x="200" y="150" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">lock(锁1) → lock(锁2)</text>

  <!-- Thread B -->
  <rect x="520" y="110" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="620" y="130" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">线程 B</text>
  <text x="620" y="150" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">lock(锁2) → lock(锁1)</text>

  <!-- Lock 1 -->
  <rect x="100" y="360" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="200" y="380" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">锁 1 (mutex1)</text>
  <text x="200" y="400" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#085041">当前持有者：A</text>

  <!-- Lock 2 -->
  <rect x="520" y="360" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="620" y="380" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">锁 2 (mutex2)</text>
  <text x="620" y="400" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#3C3489">当前持有者：B</text>

  <!-- 锁1 已分配给 A (solid, up) -->
  <path d="M180 360 L180 166" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="148" y="263" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#0F6E56">持有</text>

  <!-- 锁2 已分配给 B (solid, up) -->
  <path d="M640 360 L640 166" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="672" y="263" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#534AB7">持有</text>

  <!-- A 等待 锁2 (dashed, diagonal) -->
  <path d="M280 158 L532 360" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="356" y="240" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">A 等待锁2</text>

  <!-- B 等待 锁1 (dashed, diagonal) -->
  <path d="M540 158 L288 360" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="466" y="240" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#854F0B">B 等待锁1</text>

  <text x="410" y="468" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">
    请求边与持有边构成有向环 → 双方各持一锁、各等对方 → 永久阻塞
  </text>
  <text x="410" y="500" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#5F5E5A">
    破环之道：让所有线程按同一全局顺序申请锁（锁1 先于 锁2）
  </text>
</svg>
