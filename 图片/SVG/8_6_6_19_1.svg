<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>WiscKey 与 BlobDB：Key-Value 分离、vLog GC 与并行范围读取</title>
  <desc>上面对比传统 LSM 内联与 KV 分离的写放大；中间展示在线 GC 判活与搬迁流水线；下面展示范围扫描依靠有界队列、并发随机读与重排缓冲恢复键序。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/>
    </marker>
    <pattern id="garbage-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FBF3EB"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D9A377" stroke-width="2.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1240" height="780" fill="rgb(245, 244, 237)"/>

  <!-- 主副标题 -->
  <text x="48" y="44" font-size="22" font-weight="700" fill="#2B2A26">WiscKey 与 BlobDB：只排序 Key，把大 Value 从 Compaction 搬运热路径移走</text>
  <text x="48" y="72" font-size="13" fill="#6B675C">写放大红利来自 Value 零重复归并；代价转移至点查间接读、Blob 在线 GC、空间碎片与范围扫描乱序</text>

  <!-- ================= PANEL A ================= -->
  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 数据布局：传统 LSM 随层级重复搬运 Value；分离后 Compaction 仅重写 Key + Ref</text>
  
  <!-- Left Box: Traditional LSM -->
  <rect x="48" y="126" width="556" height="196" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="64" y="140" width="180" height="24" rx="4" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1"/>
  <text x="154" y="156" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">传统内联 LSM · Value 驻留 SST</text>
  <text x="256" y="156" font-size="11" fill="#6B675C">同一大 Value 随层间归并重复读写</text>

  <!-- L0 -->
  <text x="68" y="190" font-size="11" font-weight="700" fill="#4A473F">L0</text>
  <rect x="96" y="174" width="40" height="26" rx="4" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="116" y="191" font-size="10" font-weight="700" fill="#4A3F68" text-anchor="middle">Key</text>
  <rect x="140" y="174" width="130" height="26" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="205" y="191" font-size="10" fill="#733428" text-anchor="middle">Value 4KB (99% 字节)</text>
  
  <line x1="280" y1="187" x2="314" y2="187" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- L1 -->
  <text x="68" y="228" font-size="11" font-weight="700" fill="#4A473F">L1</text>
  <rect x="96" y="212" width="40" height="26" rx="4" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="116" y="229" font-size="10" font-weight="700" fill="#4A3F68" text-anchor="middle">Key</text>
  <rect x="140" y="212" width="220" height="26" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="250" y="229" font-size="10" fill="#733428" text-anchor="middle">Value 4KB + 重叠范围数据 (再次搬运)</text>

  <line x1="370" y1="225" x2="404" y2="225" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- L2 -->
  <text x="68" y="266" font-size="11" font-weight="700" fill="#4A473F">L2</text>
  <rect x="96" y="250" width="40" height="26" rx="4" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="116" y="267" font-size="10" font-weight="700" fill="#4A3F68" text-anchor="middle">Key</text>
  <rect x="140" y="250" width="310" height="26" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="295" y="267" font-size="10" fill="#733428" text-anchor="middle">Value 4KB 随更深层级 Compaction 第 3 次搬运...</text>

  <rect x="64" y="288" width="524" height="24" rx="4" fill="#F1EFE8"/>
  <text x="74" y="304" font-size="10.5" fill="#4A473F">写放大：<tspan font-weight="700" fill="#A64B3C">WA_inline ≈ A_lsm (10~30×)</tspan></text>
  <text x="320" y="304" font-size="10.5" fill="#6B675C">99% 搬运字节为冗余大 Value</text>

  <!-- Right Box: Key-Value Separation -->
  <rect x="620" y="126" width="572" height="196" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="636" y="140" width="200" height="24" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="736" y="156" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">Key-Value 分离 · LSM + Blob/vLog</text>
  <text x="848" y="156" font-size="11" fill="#6B675C">SST 仅存索引引用；大 Value 顺序写入外部日志</text>

  <!-- LSM Structure -->
  <text x="636" y="190" font-size="11" font-weight="700" fill="#2C4460">LSM 索引</text>
  <rect x="702" y="174" width="48" height="26" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="726" y="191" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">Key</text>
  <rect x="754" y="174" width="180" height="26" rx="4" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="844" y="191" font-size="10" fill="#4A3F68" text-anchor="middle">BlobIndex (file · offset · size)</text>
  <text x="946" y="191" font-size="10.5" fill="#2F6B5E">← Compaction 仅搬迁 ~48B 索引项！</text>

  <!-- Arrow pointing from BlobIndex down to Blob File -->
  <path d="M844,202 V216" fill="none" stroke="#6B5B95" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Blob / vLog File -->
  <text x="636" y="238" font-size="11" font-weight="700" fill="#4A473F">Blob/vLog</text>
  <rect x="702" y="222" width="474" height="34" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="706" y="226" width="94" height="26" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="753" y="243" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">Value A (4KB)</text>
  <rect x="804" y="226" width="94" height="26" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="851" y="243" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">Value B (4KB)</text>
  <rect x="902" y="226" width="86" height="26" rx="3" fill="url(#garbage-hatch)" stroke="#B07D2B" stroke-width="1"/>
  <text x="945" y="243" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">旧 Val (垃圾)</text>
  <rect x="992" y="226" width="94" height="26" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="1039" y="243" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">Value C (4KB)</text>
  <rect x="1090" y="226" width="82" height="26" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="1131" y="243" font-size="10" fill="#2C4460" text-anchor="middle">append →</text>

  <rect x="636" y="288" width="540" height="24" rx="4" fill="#F1EFE8"/>
  <text x="646" y="304" font-size="10.5" fill="#4A473F">写放大：<tspan font-weight="700" fill="#2F6B5E">WA_sep ≈ [A_idx(K+R) + A_blob·V] ÷ (K+V)</tspan></text>
  <text x="1010" y="304" font-size="10.5" font-weight="700" fill="#2F6B5E">省下 Value 层间搬运</text>

  <!-- ================= PANEL B ================= -->
  <text x="48" y="348" font-size="14" font-weight="700" fill="#4A473F">B · 在线 GC：以 LSM 最新引用为活性判据；仅搬迁存活 Value 并原子推进 tail</text>
  <rect x="48" y="362" width="1144" height="182" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <!-- Tail & Head Markers -->
  <text x="70" y="386" font-size="11.5" font-weight="700" fill="#6B4E28">tail（待清理旧段起点）</text>
  <path d="M120,392 V404" fill="none" stroke="#B07D2B" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  
  <text x="1040" y="386" font-size="11.5" font-weight="700" fill="#24473F">head（新追加与搬迁终点）</text>
  <path d="M1096,392 V404" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- vLog Stream -->
  <rect x="70" y="408" width="1100" height="38" rx="5" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  
  <rect x="74" y="412" width="120" height="30" rx="3" fill="url(#garbage-hatch)" stroke="#B07D2B" stroke-width="1"/>
  <text x="134" y="431" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">旧记录 A（已覆盖）</text>
  
  <rect x="198" y="412" width="130" height="30" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="263" y="431" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">活记录 B（当前引用）</text>

  <rect x="332" y="412" width="120" height="30" rx="3" fill="url(#garbage-hatch)" stroke="#B07D2B" stroke-width="1"/>
  <text x="392" y="431" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">旧记录 C（已删除）</text>

  <rect x="456" y="412" width="130" height="30" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="521" y="431" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">活记录 D（当前引用）</text>

  <rect x="590" y="412" width="130" height="30" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="655" y="431" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">活记录 E（当前引用）</text>

  <rect x="724" y="412" width="120" height="30" rx="3" fill="url(#garbage-hatch)" stroke="#B07D2B" stroke-width="1"/>
  <text x="784" y="431" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">旧记录 F（已覆盖）</text>

  <rect x="848" y="412" width="140" height="30" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="918" y="431" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">活记录 G（当前引用）</text>

  <rect x="992" y="412" width="174" height="30" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="1079" y="431" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">前台写入 / GC 搬入区 →</text>

  <!-- 5-Step GC Pipeline -->
  <rect x="70" y="458" width="194" height="44" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="167" y="476" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">① 顺序读 tail chunk</text>
  <text x="167" y="493" font-size="9.5" fill="#2C4460" text-anchor="middle">2MB 大块预读，吞吐高</text>
  <line x1="266" y1="480" x2="292" y2="480" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="294" y="458" width="220" height="44" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="404" y="476" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">② 查 LSM 判定活性</text>
  <text x="404" y="493" font-size="9.5" fill="#6B4E28" text-anchor="middle">判据：Lookup(K) == old_ref</text>
  <line x1="516" y1="480" x2="542" y2="480" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="544" y="458" width="206" height="44" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="647" y="476" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">③ 活 Value 追加至 head</text>
  <text x="647" y="493" font-size="9.5" fill="#24473F" text-anchor="middle">仅复制存活对象，丢弃垃圾</text>
  <line x1="752" y1="480" x2="778" y2="480" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="780" y="458" width="206" height="44" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="883" y="476" font-size="11" font-weight="700" fill="#4A3F68" text-anchor="middle">④ 持久化新 Ref 与 tail</text>
  <text x="883" y="493" font-size="9.5" fill="#4A3F68" text-anchor="middle">fsync / Version 提交新引用</text>
  <line x1="988" y1="480" x2="1014" y2="480" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="1016" y="458" width="154" height="44" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1093" y="476" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">⑤ Reclaim 旧段</text>
  <text x="1093" y="493" font-size="9.5" fill="#733428" text-anchor="middle">punch hole / 推进 tail</text>

  <!-- Bottom rule strip -->
  <text x="70" y="528" font-size="10.5" fill="#4A473F">段活率 u = 活数据 ÷ 总量；单位回收搬迁量 = u/(1-u)</text>
  <text x="460" y="528" font-size="10.5" fill="#6B675C">u=0.2 搬 0.25B；u=0.8 搬 4B (优先清低活率段)</text>
  <text x="820" y="528" font-size="10.5" font-weight="700" fill="#A64B3C">崩溃红线：新数据与引用持久化后方可释放旧空间</text>

  <!-- ================= PANEL C ================= -->
  <text x="48" y="570" font-size="14" font-weight="700" fill="#4A473F">C · 范围扫描：Key 有序但 Value 物理离散；有界队列 + SSD 并发异步读 + 按序号重排</text>
  <rect x="48" y="584" width="1144" height="172" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <!-- 5-Step Range Pipeline -->
  <rect x="68" y="602" width="190" height="66" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="163" y="622" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">① LSM 顺序迭代</text>
  <text x="163" y="641" font-size="10" fill="#2C4460" text-anchor="middle">顺序产出 (seq, K, Ref)</text>
  <text x="163" y="657" font-size="10" fill="#2C4460" text-anchor="middle">保持 Key 逻辑有序</text>
  <line x1="260" y1="635" x2="288" y2="635" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="290" y="602" width="190" height="66" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="385" y="622" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">② 有界地址队列</text>
  <text x="385" y="641" font-size="10" fill="#4A473F" text-anchor="middle">限制预取窗口 W · 背压</text>
  <text x="385" y="657" font-size="10" fill="#4A473F" text-anchor="middle">防内存暴涨与缓存污染</text>
  <line x1="482" y1="635" x2="510" y2="635" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="512" y="602" width="224" height="66" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="624" y="622" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">③ SSD 并发读 (QD &gt; 1)</text>
  <text x="624" y="641" font-size="10" fill="#24473F" text-anchor="middle">io_uring / 多线程 pread</text>
  <text x="624" y="657" font-size="10" fill="#24473F" text-anchor="middle">分散至多 Channel/LUN 并行</text>
  <line x1="738" y1="635" x2="766" y2="635" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="768" y="602" width="196" height="66" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="866" y="622" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">④ 乱序接收与重排</text>
  <text x="866" y="641" font-size="10" fill="#6B4E28" text-anchor="middle">seq → Value 缓冲暂存</text>
  <text x="866" y="657" font-size="10" fill="#6B4E28" text-anchor="middle">缺口未完成则等待 next_seq</text>
  <line x1="966" y1="635" x2="994" y2="635" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="996" y="602" width="180" height="66" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="1086" y="622" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">⑤ 按 Key 顺序提交</text>
  <text x="1086" y="641" font-size="10" fill="#4A3F68" text-anchor="middle">Iterator 语义严格保真</text>
  <text x="1086" y="657" font-size="10" fill="#4A3F68" text-anchor="middle">平滑交付前台业务读取</text>

  <!-- Bottom alerts -->
  <rect x="68" y="682" width="1108" height="58" rx="5" fill="#F1EFE8"/>
  <text x="80" y="704" font-size="10.5" fill="#4A473F"><tspan font-weight="700" fill="#2F6B5E">性能分水岭：</tspan>大 Value + 高 QD + 多通道 NVMe 上并行随机读可接近顺序读；低 QD 或 HDD 上退化严重</text>
  <text x="80" y="726" font-size="10.5" fill="#4A473F"><tspan font-weight="700" fill="#A64B3C">头部阻塞防线：</tspan>慢 I/O 阻塞 next_seq 会拉高 P999 尾延迟；预取窗口 W 应结合并发度与内存预算动态调节</text>
</svg>
