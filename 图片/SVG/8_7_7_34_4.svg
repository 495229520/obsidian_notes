<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<title>发现损坏以后：先停止危险输出，再重建信任</title><desc>检测、隔离、建立来源、重构验证、持久化的状态流，配合按故障范围禁止动作的表，以及发布失败不能直接恢复健康的分支。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A64B3C"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6B5E"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5A80"/></marker>
</defs>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">发现损坏以后：先停止危险输出，再重建信任</text>
<text x="48" y="82" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">下面是一种保守的工程状态机；检测器、可信来源与发布权限必须仍在假设范围内。</text>
<rect x="48" y="156" width="200" height="100" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="148.0" y="199.1" font-size="15" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">检测异常</text>
<text x="148.0" y="223.1" font-size="15" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">记录身份与证据</text>
<line x1="248" y1="206" x2="278" y2="206" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="284" y="156" width="200" height="100" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="384.0" y="199.1" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">隔离故障范围</text>
<text x="384.0" y="223.1" font-size="15" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">阻止继续扩散</text>
<line x1="484" y1="206" x2="514" y2="206" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="520" y="156" width="200" height="100" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="620.0" y="199.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">建立可信来源</text>
<text x="620.0" y="223.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">同版本 / 可验证</text>
<line x1="720" y1="206" x2="750" y2="206" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="756" y="156" width="200" height="100" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="856.0" y="199.1" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">重构并复验</text>
<text x="856.0" y="223.1" font-size="15" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">对照原始期望</text>
<line x1="956" y1="206" x2="986" y2="206" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="992" y="156" width="200" height="100" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1092.0" y="199.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">持久化候选</text>
<text x="1092.0" y="223.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">尚未宣告健康</text>
<text x="48" y="298" font-size="15" font-weight="400" fill="#6B675C" text-anchor="start" data-role="section">只有在错误尚未越过关口、检测与拒绝路径仍可信时，隔离才能收缩故障影响。</text>
<text x="48" y="342" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">隔离粒度由损坏对象决定</text>
<rect x="48" y="362" width="678" height="242" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="48" y="362" width="678" height="43" rx="8" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="390" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">故障范围</text>
<text x="247" y="390" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">必须停止的危险动作</text>
<text x="507" y="390" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">重新建立的依据</text>
<line x1="48" y1="405" x2="726" y2="405" stroke="#D8D5C8" stroke-width="1"/>
<text x="65" y="429" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">单个块 / shard</text>
<text x="247" y="429" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">返回坏范围</text>
<text x="247" y="452" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">将其作为修复源</text>
<text x="507" y="429" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">可信内容与版本</text>
<line x1="48" y1="471" x2="726" y2="471" stroke="#D8D5C8" stroke-width="1"/>
<text x="65" y="495" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">日志 / 任期 / 投票</text>
<text x="247" y="495" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">按未知历史应用</text>
<text x="247" y="518" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">授票或确认持久化</text>
<text x="507" y="495" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">协议历史与身份</text>
<line x1="48" y1="537" x2="726" y2="537" stroke="#D8D5C8" stroke-width="1"/>
<text x="65" y="561" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">整个节点不可信</text>
<text x="247" y="561" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">依赖其自报校验</text>
<text x="247" y="584" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">无条件接受成功 ACK</text>
<text x="507" y="561" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">更强的信任模型</text>
<path d="M1092,256 L1092,339" fill="none" stroke="#3D5A80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="782" y="342" width="410" height="74" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="987.0" y="372.1" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">条件发布：generation / epoch 仍有效</text>
<text x="987.0" y="396.1" font-size="15" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">来源、内容、权限均通过</text>
<line x1="985" y1="416" x2="985" y2="447" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#green)"/>
<rect x="782" y="450" width="410" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="987.0" y="482.6" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">发布成功 → 冗余恢复 / 受控重新加入</text>
<rect x="782" y="537" width="410" height="67" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="987.0" y="563.6" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">证据不足：保持不可用</text>
<text x="987.0" y="587.6" font-size="15" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">版本已变：重新规划，不越权发布</text>
<line x1="48" y1="643" x2="1192" y2="643" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="671" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">重启成功不等于数据健康；一旦承诺已经遗忘或错误已经扩散，“现在退出”不能追溯恢复安全。</text>
</svg>