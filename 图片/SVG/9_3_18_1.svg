<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect x="0" y="0" width="1200" height="520" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .amber { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .rose { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="60" y="55" class="title">Week 14：把 GEMM baseline 从 cuBLAS 推到 cuBLASLt</text>
  <text x="60" y="88" class="small">advanced vendor baseline 关注可解释配置：layout、algorithm、workspace、epilogue。</text>

  <rect x="60" y="135" width="210" height="170" class="box"/>
  <text x="88" y="172" class="label">普通 cuBLAS</text>
  <text x="88" y="207" class="small">simple SGEMM</text>
  <text x="88" y="234" class="small">GemmEx / HGEMM</text>
  <text x="88" y="261" class="small">stable baseline</text>

  <path d="M280 220 H362" class="line"/>

  <rect x="380" y="115" width="250" height="210" class="blue"/>
  <text x="410" y="153" class="label">cuBLASLt</text>
  <text x="410" y="189" class="small">operation descriptor</text>
  <text x="410" y="216" class="small">matrix layout</text>
  <text x="410" y="243" class="small">preference / workspace</text>
  <text x="410" y="270" class="small">heuristic algorithm</text>

  <path d="M640 220 H722" class="line"/>

  <rect x="740" y="95" width="240" height="250" class="green"/>
  <text x="770" y="133" class="label">advanced baseline</text>
  <text x="770" y="169" class="small">same shape</text>
  <text x="770" y="196" class="small">same dtype口径</text>
  <text x="770" y="223" class="small">algorithm log</text>
  <text x="770" y="250" class="small">workspace log</text>
  <text x="770" y="277" class="small">epilogue notes</text>

  <path d="M990 220 H1072" class="line"/>

  <rect x="60" y="375" width="1080" height="88" class="amber"/>
  <text x="92" y="412" class="label">报告里的定位</text>
  <text x="92" y="444" class="small">cuBLASLt 用于校准和解释差距，不写成手写 CUDA / Triton / CUTLASS 的自研优化成果。</text>

  <rect x="1090" y="170" width="50" height="100" class="rose"/>
  <text x="1058" y="150" class="small">comparison</text>
  <text x="1032" y="295" class="tiny">cuBLAS / cuBLASLt / CUTLASS / Triton / CUDA</text>
</svg>
