<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 730" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <!-- 标题 -->
  <text x="490" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#2c3e50">43. 字符串相乘 · 高精度乘法</text>
  <text x="490" y="66" text-anchor="middle" font-size="15" fill="#7f8c8d">示例：num1 = "12" ， num2 = "34" → 结果 "408"</text>

  <!-- ===== 第一步：位置映射规律 ===== -->
  <rect x="30" y="80" width="920" height="168" rx="8" fill="#ffffff" stroke="#cfcabb" stroke-width="1.5"/>
  <text x="46" y="108" font-size="16" font-weight="700" fill="#34495e">① 核心规律：结果数组长度 = n + m，num1[i] × num2[j] 落在两个相邻位置</text>
  <text x="46" y="134" font-size="13" fill="#555">res 按正常顺序存放（高位在前，初始全 0）。乘积个位写入 res[i+j+1]，十位（进位）累加到 res[i+j]。</text>

  <!-- num1 -->
  <text x="162" y="170" text-anchor="middle" font-size="13" fill="#555">num1 = "12"</text>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="120" y="178" width="40" height="40" rx="5" fill="#eaf2fb" stroke="#5b8fd6"/><text x="140" y="205" fill="#2c3e50">1</text>
    <rect x="164" y="178" width="40" height="40" rx="5" fill="#eaf2fb" stroke="#5b8fd6"/><text x="184" y="205" fill="#2c3e50">2</text>
  </g>
  <text x="140" y="234" text-anchor="middle" font-size="11" fill="#999">i=0</text>
  <text x="184" y="234" text-anchor="middle" font-size="11" fill="#999">i=1</text>

  <!-- × -->
  <text x="224" y="205" text-anchor="middle" font-size="22" fill="#555">×</text>

  <!-- num2 -->
  <text x="302" y="170" text-anchor="middle" font-size="13" fill="#555">num2 = "34"</text>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="260" y="178" width="40" height="40" rx="5" fill="#f3ecf9" stroke="#9b6fc6"/><text x="280" y="205" fill="#2c3e50">3</text>
    <rect x="304" y="178" width="40" height="40" rx="5" fill="#f3ecf9" stroke="#9b6fc6"/><text x="324" y="205" fill="#2c3e50">4</text>
  </g>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="#999">j=0</text>
  <text x="324" y="234" text-anchor="middle" font-size="11" fill="#999">j=1</text>

  <!-- ⟹ -->
  <text x="378" y="205" text-anchor="middle" font-size="24" fill="#7f8c8d">⟹</text>

  <!-- res -->
  <text x="516" y="170" text-anchor="middle" font-size="13" fill="#555">res（长度 n+m = 4，初始全 0）</text>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="430" y="178" width="40" height="40" rx="5" fill="#ffffff" stroke="#bbbbbb"/><text x="450" y="205" fill="#999">0</text>
    <rect x="474" y="178" width="40" height="40" rx="5" fill="#ffffff" stroke="#bbbbbb"/><text x="494" y="205" fill="#999">0</text>
    <rect x="518" y="178" width="40" height="40" rx="5" fill="#ffffff" stroke="#bbbbbb"/><text x="538" y="205" fill="#999">0</text>
    <rect x="562" y="178" width="40" height="40" rx="5" fill="#ffffff" stroke="#bbbbbb"/><text x="582" y="205" fill="#999">0</text>
  </g>
  <text x="450" y="234" text-anchor="middle" font-size="10" fill="#999">res[0]</text>
  <text x="494" y="234" text-anchor="middle" font-size="10" fill="#999">res[1]</text>
  <text x="538" y="234" text-anchor="middle" font-size="10" fill="#999">res[2]</text>
  <text x="582" y="234" text-anchor="middle" font-size="10" fill="#999">res[3]</text>

  <!-- 右侧说明 -->
  <text x="640" y="186" font-size="12" fill="#777">遍历：i、j 都从末位（最低位）起</text>
  <text x="640" y="208" font-size="12" fill="#777">写入：res[i+j+1] = sum % 10</text>
  <text x="640" y="230" font-size="12" fill="#777">进位：res[i+j] += sum / 10</text>

  <!-- ===== 第二步：逐位相乘累加表 ===== -->
  <text x="46" y="278" font-size="16" font-weight="700" fill="#34495e">② 逐位相乘并累加（sum = num1[i]·num2[j] + res[i+j+1]，按 i、j 从低位到高位）</text>

  <!-- 行底色 -->
  <rect x="30" y="292" width="920" height="58" fill="#e8eef6"/>
  <rect x="30" y="396" width="920" height="48" fill="#fbeede"/>
  <rect x="30" y="490" width="920" height="54" fill="#e3f1e3"/>

  <!-- 网格线 -->
  <g stroke="#c9c3b4" stroke-width="1">
    <line x1="30" y1="292" x2="950" y2="292"/>
    <line x1="30" y1="350" x2="950" y2="350"/>
    <line x1="30" y1="396" x2="950" y2="396"/>
    <line x1="30" y1="444" x2="950" y2="444"/>
    <line x1="30" y1="490" x2="950" y2="490"/>
    <line x1="30" y1="544" x2="950" y2="544"/>
    <line x1="30" y1="292" x2="30" y2="544"/>
    <line x1="180" y1="292" x2="180" y2="544"/>
    <line x1="373" y1="292" x2="373" y2="544"/>
    <line x1="565" y1="292" x2="565" y2="544"/>
    <line x1="757" y1="292" x2="757" y2="544"/>
    <line x1="950" y1="292" x2="950" y2="544"/>
  </g>

  <!-- 行标签 -->
  <g font-size="13" fill="#555" text-anchor="start">
    <text x="44" y="316">步骤</text>
    <text x="44" y="378">a × b</text>
    <text x="44" y="420" font-size="12">sum = a·b</text>
    <text x="44" y="436" font-size="12">  + res[i+j+1]</text>
    <text x="44" y="470">写入 / 进位</text>
    <text x="44" y="521">res 数组</text>
  </g>
  <text x="44" y="336" font-size="11.5" fill="#8a93a0">(i, j) → 落点</text>

  <!-- 列表头 -->
  <g text-anchor="middle">
    <g font-size="15" font-weight="700" fill="#2c3e50">
      <text x="277" y="316">步骤 1</text>
      <text x="469" y="316">步骤 2</text>
      <text x="661" y="316">步骤 3</text>
      <text x="854" y="316">步骤 4</text>
    </g>
    <g font-size="11.5" fill="#7f8c8d">
      <text x="277" y="336">i=1, j=1 → res[3], res[2]</text>
      <text x="469" y="336">i=1, j=0 → res[2], res[1]</text>
      <text x="661" y="336">i=0, j=1 → res[2], res[1]</text>
      <text x="854" y="336">i=0, j=0 → res[1], res[0]</text>
    </g>
  </g>

  <!-- a × b 行 -->
  <g font-size="18" font-weight="700" fill="#3a6bb0" text-anchor="middle">
    <text x="277" y="378">2 × 4 = 8</text>
    <text x="469" y="378">2 × 3 = 6</text>
    <text x="661" y="378">1 × 4 = 4</text>
    <text x="854" y="378">1 × 3 = 3</text>
  </g>

  <!-- sum 行 -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <text x="277" y="426" fill="#444">8 + 0 = 8</text>
    <text x="469" y="426" fill="#444">6 + 0 = 6</text>
    <text x="661" y="426" fill="#c0392b">4 + 6 = 10</text>
    <text x="854" y="426" fill="#444">3 + 1 = 4</text>
  </g>

  <!-- 写入 / 进位 行 -->
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="277" y="470" fill="#27795b">res[3]=8，进位 0</text>
    <text x="469" y="470" fill="#27795b">res[2]=6，进位 0</text>
    <text x="661" y="470" fill="#c0392b">res[2]=0，进位 1</text>
    <text x="854" y="470" fill="#27795b">res[1]=4，进位 0</text>
  </g>

  <!-- res 快照 行 -->
  <g font-size="16" font-weight="700" fill="#2c3e50" text-anchor="middle">
    <text x="277" y="521">[0, 0, 0, 8]</text>
    <text x="469" y="521">[0, 0, 6, 8]</text>
    <text x="661" y="521">[0, 1, 0, 8]</text>
    <text x="854" y="521">[0, 4, 0, 8]</text>
  </g>

  <!-- ===== 第三步：去前导零输出 ===== -->
  <rect x="30" y="560" width="920" height="150" rx="8" fill="#ffffff" stroke="#cfcabb" stroke-width="1.5"/>
  <text x="46" y="586" font-size="16" font-weight="700" fill="#34495e">③ res = [0, 4, 0, 8]，跳过开头的前导零，逐位拼成结果字符串</text>

  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="80" y="606" width="40" height="40" rx="5" fill="#f0eee8" stroke="#cccccc"/><text x="100" y="633" fill="#b0b0b0">0</text>
    <rect x="124" y="606" width="40" height="40" rx="5" fill="#e3f1e3" stroke="#4f9e6f"/><text x="144" y="633" fill="#2c3e50">4</text>
    <rect x="168" y="606" width="40" height="40" rx="5" fill="#e3f1e3" stroke="#4f9e6f"/><text x="188" y="633" fill="#2c3e50">0</text>
    <rect x="212" y="606" width="40" height="40" rx="5" fill="#e3f1e3" stroke="#4f9e6f"/><text x="232" y="633" fill="#2c3e50">8</text>
  </g>
  <text x="100" y="664" text-anchor="middle" font-size="10" fill="#999">res[0]</text>
  <text x="144" y="664" text-anchor="middle" font-size="10" fill="#999">res[1]</text>
  <text x="188" y="664" text-anchor="middle" font-size="10" fill="#999">res[2]</text>
  <text x="232" y="664" text-anchor="middle" font-size="10" fill="#999">res[3]</text>
  <text x="100" y="682" text-anchor="middle" font-size="10" fill="#c0392b">前导零→跳过</text>
  <text x="188" y="682" text-anchor="middle" font-size="10" fill="#777">内部 0 保留</text>

  <text x="300" y="636" text-anchor="middle" font-size="26" fill="#7f8c8d">⟹</text>

  <text x="400" y="646" font-size="34" font-weight="700" fill="#c0392b">408</text>
  <text x="510" y="630" font-size="15" fill="#555">res = "408" ，即 12 × 34 = 408</text>
  <text x="510" y="658" font-size="12" fill="#888">特例：任一乘数为 "0" 时，直接返回 "0"</text>
</svg>
