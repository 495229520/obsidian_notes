<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1000" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统：底色 rgb(245,244,237)；面板 #FAF9F2/#8A8574；框 #E3EAF4/#3D5A80/#2C4460；
       专色 #EFE7D6/#8A6D3B；提交/收益 #E2EFE9/#2F6B5E；等待点 #F4E3DE/#B0503F -->
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0503F"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1000" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">JuiceFS 写路径：FUSE 桥 → 客户端攒批 → 并发 PUT → 元数据发布</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">write 返回快是缓冲的功劳；真实持久化延迟看 fsync —— 五个等待点 F1~F5，三次主要拷贝 C1~C3</text>

  <!-- ═══ 泳道面板 ═══ -->
  <rect x="48" y="104" width="1144" height="560" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>

  <!-- 泳道标题 -->
  <text x="180" y="136" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">应用＋内核（FUSE 桥）</text>
  <text x="520" y="136" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">JuiceFS client（用户态进程）</text>
  <text x="945" y="136" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">远端：对象存储＋元数据引擎</text>
  <path d="M350,144 L350,640" stroke="#8A8574" stroke-width="0.8" stroke-dasharray="4,4"/>
  <path d="M710,144 L710,640" stroke="#8A8574" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- ① 应用 write -->
  <rect x="76" y="156" width="240" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="196" y="178" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">① 应用 write() 陷入内核</text>
  <text x="196" y="198" font-size="10.5" fill="#2C4460" text-anchor="middle">VFS 不找 ext4，转给 FUSE 模块</text>

  <rect x="76" y="240" width="240" height="72" rx="7" fill="#F4E3DE" stroke="#B0503F" stroke-width="1.5"/>
  <text x="196" y="262" font-size="11.5" font-weight="700" fill="#B0503F" text-anchor="middle">F1：FUSE 往返</text>
  <text x="196" y="282" font-size="10" fill="#B0503F" text-anchor="middle">请求经 /dev/fuse 到用户态进程：</text>
  <text x="196" y="300" font-size="10" fill="#B0503F" text-anchor="middle">2 次额外切换＋唤醒，几十 μs 级</text>
  <path d="M196,212 L196,236" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <path d="M316,276 L396,276" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <text x="322" y="262" font-size="9.5" font-weight="700" fill="#8A6D3B">C1 拷贝</text>

  <!-- ② client 缓冲 -->
  <rect x="400" y="240" width="280" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="540" y="262" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">② 数据进客户端写缓冲（按 slice 组织）</text>
  <text x="540" y="282" font-size="10" fill="#2C4460" text-anchor="middle">write 到此即返回（异步回写）</text>
  <text x="540" y="300" font-size="10" font-weight="700" fill="#B0503F" text-anchor="middle">F2：缓冲满 ＝ 背压，上游 write 被卡</text>

  <!-- ③ 切 block 并发 PUT -->
  <path d="M540,312 L540,344" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <rect x="400" y="348" width="280" height="64" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="540" y="370" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">③ slice 切成 4 MiB block</text>
  <text x="540" y="390" font-size="10" fill="#2C4460" text-anchor="middle">并发 PUT，用多流摊薄单次 RTT</text>
  <text x="540" y="405" font-size="9.5" font-weight="700" fill="#8A6D3B" text-anchor="middle">C2：client → 内核 TCP 栈（TLS 再加密一遍）</text>

  <!-- 三条并发 PUT 箭头 -->
  <path d="M680,362 L756,352" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arrn)"/>
  <path d="M680,380 L756,392" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arrn)"/>
  <path d="M680,398 L756,432" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arrn)"/>

  <rect x="760" y="332" width="406" height="120" rx="7" fill="#F4E3DE" stroke="#B0503F" stroke-width="1.5"/>
  <text x="963" y="354" font-size="11.5" font-weight="700" fill="#B0503F" text-anchor="middle">F3：每个 PUT 一次 HTTP(S) 往返 —— 几十 ms 量级</text>
  <rect x="780" y="366" width="110" height="30" rx="5" fill="#FAF9F2" stroke="#B0503F" stroke-width="1.1"/>
  <text x="835" y="385" font-size="10" fill="#B0503F" text-anchor="middle">PUT block#1</text>
  <rect x="908" y="366" width="110" height="30" rx="5" fill="#FAF9F2" stroke="#B0503F" stroke-width="1.1"/>
  <text x="963" y="385" font-size="10" fill="#B0503F" text-anchor="middle">PUT block#2</text>
  <rect x="1036" y="366" width="110" height="30" rx="5" fill="#FAF9F2" stroke="#B0503F" stroke-width="1.1"/>
  <text x="1091" y="385" font-size="10" fill="#B0503F" text-anchor="middle">PUT block#3 …</text>
  <text x="963" y="420" font-size="10" fill="#B0503F" text-anchor="middle">④ 对象存储内部三副本/EC（7.1）后返回 200</text>
  <text x="963" y="438" font-size="10" fill="#6B675C" text-anchor="middle">block ＝ 不可变对象：随机改写不改旧对象，追加新 slice 压住旧的（6.6 同款）</text>

  <!-- ⑤ 元数据提交 -->
  <path d="M540,412 L540,486 L756,506" fill="none" stroke="#5A564B" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrn)"/>
  <text x="560" y="470" font-size="10" fill="#6B675C">全部 block 确认后才提交</text>
  <rect x="760" y="476" width="406" height="72" rx="7" fill="#E2EFE9" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="963" y="498" font-size="11.5" font-weight="700" fill="#2F6B5E" text-anchor="middle">⑤ 元数据引擎事务：「chunk X 新增 slice」</text>
  <text x="963" y="518" font-size="10" fill="#2F6B5E" text-anchor="middle">F4：一次 KV/DB 事务往返（7.2 的 M 段）</text>
  <text x="963" y="536" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle">提交点在这里 —— 数据上传完不算数，事务发布才成为文件</text>

  <!-- ⑥ fsync -->
  <rect x="76" y="560" width="604" height="72" rx="7" fill="#EFE7D6" stroke="#8A6D3B" stroke-width="1.5"/>
  <text x="378" y="584" font-size="11.5" font-weight="700" fill="#5C4A28" text-anchor="middle">⑥ fsync() 返回 ＝ F5 汇合屏障：等全部 PUT ＋ 元数据事务</text>
  <text x="378" y="604" font-size="10" fill="#5C4A28" text-anchor="middle">延迟 ＝ max(各并发 PUT) ＋ F4 —— 尾延迟由最慢 block 决定（fan-out 等齐，同 7.1）</text>
  <text x="378" y="622" font-size="10" font-weight="700" fill="#B0503F" text-anchor="middle">几十 ms 起步：对象存储 RTT 是物理地板 —— 不适合做低延迟 WAL 宿主</text>
  <path d="M760,532 C720,560 700,572 684,580" fill="none" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arrg)"/>

  <!-- ═══ 数据组织与读路径 ═══ -->
  <rect x="48" y="688" width="1144" height="290" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="72" y="716" font-size="14" font-weight="700" fill="#4A473F">数据组织三层 与 读路径的三级单价</text>

  <!-- chunk/slice/block -->
  <rect x="76" y="734" width="540 " height="70" rx="7" fill="#F3F1E8" stroke="#8A8574" stroke-width="1.2"/>
  <rect x="92" y="746" width="220" height="22" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="202" y="761" font-size="9.5" fill="#2C4460" text-anchor="middle">chunk：固定 64 MiB，offset ÷ 64 MiB 即定位</text>
  <rect x="132" y="772" width="120" height="18" rx="4" fill="#E2EFE9" stroke="#2F6B5E" stroke-width="1.1"/>
  <rect x="196" y="776" width="140" height="18" rx="4" fill="#E2EFE9" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="266" y="789" font-size="9" fill="#2F6B5E" text-anchor="middle">slice：一次连续写；新压旧，可重叠</text>
  <rect x="360" y="746" width="240" height="48" rx="4" fill="#EFE7D6" stroke="#8A6D3B" stroke-width="1.1"/>
  <text x="480" y="765" font-size="9.5" fill="#5C4A28" text-anchor="middle">block：默认 4 MiB，不可变对象</text>
  <text x="480" y="782" font-size="9" fill="#5C4A28" text-anchor="middle">slice 堆叠多了后台合并 ＝ 同名 compaction</text>

  <text x="76" y="828" font-size="10.5" fill="#6B675C">读 ＝ 元数据拿 slice 布局 → 按补丁栈「取每个位置最新一层」→ 定位 block → GET</text>

  <!-- 三级缓存 -->
  <rect x="640" y="734" width="526" height="94" rx="7" fill="#F3F1E8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="660" y="756" font-size="11" font-weight="700" fill="#4A473F">读延迟 ＝ 缓存命中层级的函数：</text>
  <text x="660" y="778" font-size="10.5" fill="#2F6B5E">内核 page cache 命中 → μs 级（FUSE 都不穿越）</text>
  <text x="660" y="798" font-size="10.5" fill="#5C4A28">客户端本地盘缓存 → 百 μs~ms（穿 FUSE，读本地 SSD）</text>
  <text x="660" y="818" font-size="10.5" fill="#B0503F">对象存储 GET → 几十~百 ms（排障先看三级命中率）</text>

  <rect x="76" y="852" width="1090" height="104" rx="8" fill="#E2EFE9" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="620" y="880" font-size="12" font-weight="700" fill="#2F6B5E" text-anchor="middle">拼装哲学：元数据 → 事务 KV，数据 → 对象存储，自己只剩客户端 —— 每一层都是现成组件，代价全在路径上</text>
  <text x="620" y="904" font-size="10.5" fill="#2F6B5E" text-anchor="middle">FUSE 与 SPDK 同一「搬出内核」动机、相反的性能方向：SPDK 搬热路径驱动省切换，FUSE 搬复杂策略逻辑多付切换</text>
  <text x="620" y="926" font-size="10.5" fill="#4A473F" text-anchor="middle">一致性 ＝ close-to-open：并发写同文件无仲裁；持久化承诺只看 fsync/close 返回</text>
  <text x="620" y="946" font-size="10.5" fill="#6B675C" text-anchor="middle">适用画像：大文件、吞吐型、容量弹性优先 —— 不是低延迟小 IO 的家</text>
</svg>
