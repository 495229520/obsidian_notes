<svg xmlns="http://www.w3.org/2000/svg" width="940" height="654" viewBox="0 0 940 654" role="img" aria-labelledby="t2 d2">
  <title id="t2">LeetCode 523 同余即区间和为 k 倍数的原理</title>
  <desc id="d2">把数轴按 k 切成等宽块，prefix[i] 与 prefix[j] 落在块内相同偏移（余数 r）时，二者距离恰为整数个块，故差能被 k 整除。</desc>
  <rect width="940" height="654" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;}
      text:not([text-anchor]){text-anchor:middle;}
      .t-title{font-size:21px;font-weight:700;}
      .t-sub{font-size:13px;}
      .t-mark{font-size:14px;font-weight:700;}
      .t-tick{font-size:12px;}
      .t-note{font-size:13px;}
      .t-body{font-size:14px;}
    </style>
  </defs>

  <text class="t-title" x="40" y="44" fill="#444441" dominant-baseline="central" text-anchor="start">核心结论：前缀和对 k 同余 ⇒ 中间区间和是 k 的倍数</text>
  <text class="t-sub" x="40" y="72" fill="#5F5E5A" dominant-baseline="central" text-anchor="start">把数轴按 k 切成等宽块；prefix[i] 与 prefix[j] 落在块内相同偏移（余数 r）时，二者距离恰为整数个块</text>

  <!-- k 块背景条带（偶数块着色） -->
  <path d="M120 168 h96 v42 h-96 Z" fill="#F1EFE8" stroke="none"/>
  <path d="M312 168 h96 v42 h-96 Z" fill="#F1EFE8" stroke="none"/>
  <path d="M504 168 h96 v42 h-96 Z" fill="#F1EFE8" stroke="none"/>
  <path d="M696 168 h96 v42 h-96 Z" fill="#F1EFE8" stroke="none"/>

  <!-- 顶部差值花括号 -->
  <path d="M488 116 v-6 h96 v6 M536 110 v-12" fill="none" stroke="#854F0B" stroke-width="1.5"/>
  <text class="t-mark" x="536" y="92" fill="#633806" dominant-baseline="central">prefix[j] − prefix[i] = 6 = 1 × k  ✓</text>

  <!-- 两个前缀和标记线 -->
  <path d="M488 122 V210" fill="none" stroke="#0F6E56" stroke-width="2"/>
  <circle cx="488" cy="210" r="4" fill="#0F6E56" stroke="none"/>
  <text class="t-mark" x="476" y="148" fill="#085041" dominant-baseline="central" text-anchor="end">prefix[i] = 23</text>
  <path d="M584 122 V210" fill="none" stroke="#185FA5" stroke-width="2"/>
  <circle cx="584" cy="210" r="4" fill="#185FA5" stroke="none"/>
  <text class="t-mark" x="596" y="148" fill="#0C447C" dominant-baseline="central" text-anchor="start">prefix[j] = 29</text>

  <!-- 数轴 -->
  <path d="M104 210 H812" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 刻度线 -->
  <path d="M120 204 V216 M216 204 V216 M312 204 V216 M408 204 V216 M504 204 V216 M600 204 V216 M696 204 V216 M792 204 V216" fill="none" stroke="#5F5E5A" stroke-width="1"/>
  <!-- 刻度值（k 的倍数边界） -->
  <text class="t-tick" x="120" y="230" fill="#5F5E5A" dominant-baseline="central">0</text>
  <text class="t-tick" x="216" y="230" fill="#5F5E5A" dominant-baseline="central">6</text>
  <text class="t-tick" x="312" y="230" fill="#5F5E5A" dominant-baseline="central">12</text>
  <text class="t-tick" x="408" y="230" fill="#5F5E5A" dominant-baseline="central">18</text>
  <text class="t-tick" x="504" y="230" fill="#5F5E5A" dominant-baseline="central">24</text>
  <text class="t-tick" x="600" y="230" fill="#5F5E5A" dominant-baseline="central">30</text>
  <text class="t-tick" x="696" y="230" fill="#5F5E5A" dominant-baseline="central">36</text>
  <text class="t-tick" x="792" y="230" fill="#5F5E5A" dominant-baseline="central">42</text>

  <!-- 偏移括号：两处余数都是 5 -->
  <path d="M408 250 v6 h80 v-6 M448 256 v6" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
  <text class="t-note" x="448" y="276" fill="#085041" dominant-baseline="central">余数 = 5</text>
  <path d="M504 250 v6 h80 v-6 M544 256 v6" fill="none" stroke="#185FA5" stroke-width="1.5"/>
  <text class="t-note" x="544" y="276" fill="#0C447C" dominant-baseline="central">余数 = 5</text>

  <!-- 代数推导面板 -->
  <path d="M50 320 L890 320 Q900 320 900 330 L900 410 Q900 420 890 420 L50 420 Q40 420 40 410 L40 330 Q40 320 50 320 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-body" x="60" y="348" fill="#0C447C" dominant-baseline="central" text-anchor="start">prefix[i] = q_i · k + r          例：23 = 3 · 6 + 5</text>
  <text class="t-body" x="60" y="374" fill="#0C447C" dominant-baseline="central" text-anchor="start">prefix[j] = q_j · k + r          例：29 = 4 · 6 + 5</text>
  <text class="t-body" x="60" y="400" fill="#0C447C" dominant-baseline="central" text-anchor="start">⇒  prefix[j] − prefix[i] = (q_j − q_i) · k          ⇒  能被 k 整除</text>

  <!-- 结论面板 -->
  <path d="M50 482 L890 482 Q900 482 900 492 L900 570 Q900 580 890 580 L50 580 Q40 580 40 570 L40 492 Q40 482 50 482 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="t-body" x="60" y="510" fill="#085041" dominant-baseline="central" text-anchor="start">结论：prefix[i] ≡ prefix[j] (mod k)  ⟺  子数组 (i, j] 的和是 k 的倍数。</text>
  <text class="t-body" x="60" y="536" fill="#085041" dominant-baseline="central" text-anchor="start">应用：遍历到 j 时，若之前出现过相同余数且下标间隔 ≥ 2，立即得到一个合法子数组。</text>
  <text class="t-body" x="60" y="562" fill="#085041" dominant-baseline="central" text-anchor="start">特例 r = 0：该前缀和本身就是 k 的倍数，用哨兵位置 −1 代表“空前缀”。</text>

  <text class="t-note" x="40" y="610" fill="#5F5E5A" dominant-baseline="central" text-anchor="start">直觉：相同余数 = 块内相同偏移，于是两点间距离恰好是整块数 → 差能被 k 整除。</text>
</svg>
