<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <title>TCP 套接字的一对内核缓冲区</title>
  <desc>每个 TCP 套接字自带输入缓冲与输出缓冲，两个方向各走各的路径；write 只碰输出缓冲，read 只碰输入缓冲。并列出缓冲区的四条性质及其实际后果。</desc>

  <rect x="0" y="0" width="1240" height="710" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">每个 TCP 套接字自带一对内核缓冲区</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">全双工意味着两个方向各走各的：write 只碰输出缓冲，read 只碰输入缓冲，一个方向堵住不影响另一个</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="104" width="1144" height="340" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="15" font-weight="700" fill="#4A473F">A · 两台主机、四个缓冲区、两条独立路径</text>

  <!-- host A -->
  <rect x="72" y="150" width="420" height="210" rx="8" fill="#F3F2EB" stroke="#9B968A" stroke-width="1.2"/>
  <text x="92" y="174" font-size="13" font-weight="700" fill="#4A473F">主机 A</text>

  <rect x="92" y="184" width="380" height="42" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="282" y="210" font-size="12" font-weight="700" fill="#6B5B95" text-anchor="middle">应用进程　用户空间</text>

  <path d="M182 284 L182 230" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="176" y="258" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="end">read()</text>
  <path d="M382 230 L382 284" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrB)"/>
  <text x="390" y="258" font-size="11.5" font-weight="700" fill="#2C4460">write()</text>

  <rect x="92" y="286" width="180" height="62" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="182" y="310" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">输入缓冲</text>
  <text x="182" y="330" font-size="10.5" fill="#24473F" text-anchor="middle">收到的数据在这里等人读</text>

  <rect x="292" y="286" width="180" height="62" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="382" y="310" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">输出缓冲</text>
  <text x="382" y="330" font-size="10.5" fill="#2C4460" text-anchor="middle">等 ACK 的数据在这里留底</text>

  <!-- host B -->
  <rect x="748" y="150" width="420" height="210" rx="8" fill="#F3F2EB" stroke="#9B968A" stroke-width="1.2"/>
  <text x="768" y="174" font-size="13" font-weight="700" fill="#4A473F">主机 B</text>

  <rect x="768" y="184" width="380" height="42" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="958" y="210" font-size="12" font-weight="700" fill="#6B5B95" text-anchor="middle">应用进程　用户空间</text>

  <path d="M858 284 L858 230" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="852" y="258" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="end">read()</text>
  <path d="M1058 230 L1058 284" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrB)"/>
  <text x="1066" y="258" font-size="11.5" font-weight="700" fill="#2C4460">write()</text>

  <rect x="768" y="286" width="180" height="62" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="858" y="310" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">输入缓冲</text>
  <text x="858" y="330" font-size="10.5" fill="#24473F" text-anchor="middle">空余量就是通告窗口</text>

  <rect x="968" y="286" width="180" height="62" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="1058" y="310" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">输出缓冲</text>
  <text x="1058" y="330" font-size="10.5" fill="#2C4460" text-anchor="middle">重传时从这里取数据</text>

  <!-- A -> B -->
  <path d="M476 300 L760 300" stroke="#3D5A80" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="618" y="270" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">网络</text>
  <text x="618" y="292" font-size="10.5" fill="#2C4460" text-anchor="middle">A 发给 B</text>

  <!-- B -> A (routed below) -->
  <path d="M1058 352 L1058 408 L186 408 L186 356" stroke="#2F6B5E" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <text x="618" y="400" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">B 发给 A　同一条连接，另一个方向</text>

  <text x="72" y="434" font-size="11.5" font-weight="700" fill="#733428">两个方向的缓冲区互不相干：对端读得慢只会堵住一个方向，另一个方向照常走</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="460" width="1144" height="190" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="490" font-size="15" font-weight="700" fill="#4A473F">B · 四条性质，以及它们各自意味着什么</text>

  <text x="88" y="516" font-size="11" font-weight="700" fill="#6B675C">性质</text>
  <text x="360" y="516" font-size="11" font-weight="700" fill="#6B675C">含义</text>
  <text x="740" y="516" font-size="11" font-weight="700" fill="#6B675C">对写代码的影响</text>
  <path d="M72 524 L1168 524" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="72" y="530" width="1096" height="28" fill="#F1EFE8"/>
  <text x="88" y="549" font-size="11.5" font-weight="700" fill="#4A473F">每个套接字独立一对</text>
  <text x="360" y="549" font-size="11" fill="#4A473F">缓冲区属于连接，不属于进程</text>
  <text x="740" y="549" font-size="11" fill="#4A473F">一条连接堵住不会波及另一条</text>

  <rect x="72" y="560" width="1096" height="28" fill="#EDEBE3"/>
  <text x="88" y="579" font-size="11.5" font-weight="700" fill="#4A473F">随套接字自动生灭</text>
  <text x="360" y="579" font-size="11" fill="#4A473F">不用 malloc，也不用 free</text>
  <text x="740" y="579" font-size="11" fill="#4A473F">大小用 SO_SNDBUF / SO_RCVBUF 调</text>

  <rect x="72" y="590" width="1096" height="28" fill="#DCE9E3"/>
  <text x="88" y="609" font-size="11.5" font-weight="700" fill="#24473F">close 后输出缓冲照发</text>
  <text x="360" y="609" font-size="11" fill="#24473F">内核接管，进程退出也发得完</text>
  <text x="740" y="609" font-size="11" fill="#24473F">close 不代表数据丢了</text>

  <rect x="72" y="620" width="1096" height="28" fill="#F0E0DB"/>
  <text x="88" y="639" font-size="11.5" font-weight="700" fill="#733428">close 后输入缓冲丢弃</text>
  <text x="360" y="639" font-size="11" fill="#733428">还没 read 走的数据没人要了</text>
  <text x="740" y="639" font-size="11" fill="#733428">这时内核会给对端回 RST</text>

  <text x="48" y="686" font-size="12" fill="#6B675C">口径：图中「输入缓冲空余量就是通告窗口」是简化说法，实际还受接收窗口缩放与延迟确认影响，详见 8.8 流控制</text>
</svg>
