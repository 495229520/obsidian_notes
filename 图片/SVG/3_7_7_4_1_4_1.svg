<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>io_uring 非阻塞 RPC 的双重关联</title>
  <desc>展示 SQE user_data 关联本地 I/O，request_id 关联线路 RPC，以及发送与接收完成如何推进状态机。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect width="1240" height="700" fill="#F5F4ED"/>
  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">io_uring 非阻塞 RPC：SQE/CQE 推进两条状态机</text>
  <text x="48" y="82" font-size="13.5" fill="#6B675C">user_data 只关联本机 I/O；响应仍必须解码 request_id 才能完成远程调用</text>

  <rect x="742" y="34" width="202" height="54" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="843" y="55" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">user_data = token</text>
  <text x="843" y="75" font-size="10.5" fill="#4A3F68" text-anchor="middle">SQE ↔ CQE · 本地关联</text>
  <rect x="962" y="34" width="222" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1073" y="55" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">request_id = 42</text>
  <text x="1073" y="75" font-size="10.5" fill="#24473F" text-anchor="middle">Request ↔ Response · 线路关联</text>

  <!-- main panel -->
  <rect x="56" y="112" width="1128" height="414" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <!-- column headers -->
  <rect x="76" y="132" width="186" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80"/>
  <text x="169" y="158" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">RPC 状态</text>
  <rect x="286" y="132" width="206" height="42" rx="7" fill="#EDEAF3" stroke="#6B5B95"/>
  <text x="389" y="158" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">UringOp 生命周期</text>
  <rect x="516" y="132" width="190" height="42" rx="7" fill="#EFE7DA" stroke="#8A6A3A"/>
  <text x="611" y="158" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">Submission Queue</text>
  <rect x="730" y="132" width="194" height="42" rx="7" fill="#F0E0DB" stroke="#A64B3C"/>
  <text x="827" y="158" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">内核 TCP 路径</text>
  <rect x="948" y="132" width="216" height="42" rx="7" fill="#DCE9E3" stroke="#2F6B5E"/>
  <text x="1056" y="158" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">Completion Queue</text>

  <!-- send row label -->
  <text x="76" y="210" font-size="14" font-weight="700" fill="#3D5A80">A · 发送方向</text>
  <rect x="76" y="226" width="186" height="72" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="169" y="249" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">FrameQueue</text>
  <text x="169" y="269" font-size="10.5" fill="#2C4460" text-anchor="middle">Request(id=42) · 22 B</text>
  <text x="169" y="286" font-size="10.5" fill="#2C4460" text-anchor="middle">按整帧顺序排队</text>

  <rect x="286" y="226" width="206" height="72" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="389" y="247" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">SendOp</text>
  <text x="389" y="267" font-size="10.5" fill="#4A3F68" text-anchor="middle">buffer + offset + token</text>
  <text x="389" y="284" font-size="10.5" fill="#4A3F68" text-anchor="middle">buffer 活到最终 CQE</text>

  <rect x="516" y="226" width="190" height="72" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="611" y="247" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">SQE · IORING_OP_SEND</text>
  <text x="611" y="267" font-size="10.5" fill="#6B4E28" text-anchor="middle">addr = remaining.data()</text>
  <text x="611" y="284" font-size="10.5" fill="#6B4E28" text-anchor="middle">user_data = token</text>

  <rect x="730" y="226" width="194" height="72" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="827" y="247" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">sendmsg / TCP sendbuf</text>
  <text x="827" y="267" font-size="10.5" fill="#733428" text-anchor="middle">可能只接受部分字节</text>
  <text x="827" y="284" font-size="10.5" fill="#733428" text-anchor="middle">不代表远端业务成功</text>

  <rect x="948" y="226" width="216" height="72" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1056" y="247" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">CQE { token, res }</text>
  <text x="1056" y="267" font-size="10.5" fill="#24473F" text-anchor="middle">res &gt; 0：offset += res</text>
  <text x="1056" y="284" font-size="10.5" fill="#24473F" text-anchor="middle">未完成则重新提交</text>

  <!-- send arrows -->
  <line x1="266" y1="262" x2="282" y2="262" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="496" y1="262" x2="512" y2="262" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="710" y1="262" x2="726" y2="262" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="928" y1="262" x2="944" y2="262" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M1056 302 L1056 318 L389 318 L389 302" fill="none" stroke="#6B5B95" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="722" y="313" font-size="9.8" fill="#6B5B95" text-anchor="middle">短发送：保留 op，再发 remaining</text>

  <!-- receive row -->
  <text x="76" y="352" font-size="14" font-weight="700" fill="#2F6B5E">B · 接收方向</text>
  <rect x="286" y="368" width="206" height="76" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="389" y="390" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">RecvOp</text>
  <text x="389" y="410" font-size="10.5" fill="#4A3F68" text-anchor="middle">scratch buffer + token</text>
  <text x="389" y="428" font-size="10.5" fill="#4A3F68" text-anchor="middle">同方向只保留一个 recv</text>

  <rect x="516" y="368" width="190" height="76" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="611" y="390" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">SQE · IORING_OP_RECV</text>
  <text x="611" y="410" font-size="10.5" fill="#6B4E28" text-anchor="middle">等待任意 TCP 字节</text>
  <text x="611" y="428" font-size="10.5" fill="#6B4E28" text-anchor="middle">user_data = recv token</text>

  <rect x="730" y="368" width="194" height="76" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="827" y="390" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">TCP 字节到达</text>
  <text x="827" y="410" font-size="10.5" fill="#733428" text-anchor="middle">头、体可任意分节</text>
  <text x="827" y="428" font-size="10.5" fill="#733428" text-anchor="middle">内核完成一次 recv</text>

  <rect x="948" y="368" width="216" height="76" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1056" y="390" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">CQE { recv token, res }</text>
  <text x="1056" y="410" font-size="10.5" fill="#24473F" text-anchor="middle">res = 0：EOF</text>
  <text x="1056" y="428" font-size="10.5" fill="#24473F" text-anchor="middle">res &lt; 0：-errno</text>

  <rect x="76" y="368" width="186" height="76" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="169" y="388" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">FrameDecoder</text>
  <text x="169" y="407" font-size="10.5" fill="#24473F" text-anchor="middle">Feed(res bytes)</text>
  <text x="169" y="424" font-size="10.5" fill="#24473F" text-anchor="middle">Response id=42 → pending</text>
  <text x="169" y="439" font-size="10" fill="#24473F" text-anchor="middle">这里才完成 RPC</text>

  <!-- receive arrows right-to-left then decoder -->
  <line x1="496" y1="406" x2="512" y2="406" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="710" y1="406" x2="726" y2="406" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="928" y1="406" x2="944" y2="406" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M1056 448 L1056 470 L169 470 L169 448" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <text x="620" y="486" font-size="10.3" fill="#2F6B5E" text-anchor="middle">CQE 只给本次 recv 结果；帧解析后再按 request_id 唤醒调用者</text>

  <!-- bottom cards -->
  <text x="56" y="560" font-size="14.5" font-weight="700" fill="#2B2A26">工程边界</text>
  <rect x="56" y="578" width="266" height="74" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="76" y="602" font-size="12" font-weight="700" fill="#A64B3C">SQ 没位置</text>
  <text x="76" y="623" font-size="10.7" fill="#4A473F">暂缓提交，不丢 op</text>
  <text x="76" y="641" font-size="10.7" fill="#4A473F">把压力传回发送队列</text>

  <rect x="338" y="578" width="266" height="74" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="358" y="602" font-size="12" font-weight="700" fill="#6B5B95">buffer 生命周期</text>
  <text x="358" y="623" font-size="10.7" fill="#4A473F">内核仍引用 addr 时不可移动</text>
  <text x="358" y="641" font-size="10.7" fill="#4A473F">最终 CQE 后才能释放</text>

  <rect x="620" y="578" width="266" height="74" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="640" y="602" font-size="12" font-weight="700" fill="#3D5A80">方向内串行</text>
  <text x="640" y="623" font-size="10.7" fill="#4A473F">一个 active send</text>
  <text x="640" y="641" font-size="10.7" fill="#4A473F">一个 active recv</text>

  <rect x="902" y="578" width="282" height="74" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="922" y="602" font-size="12" font-weight="700" fill="#2F6B5E">完成层次</text>
  <text x="922" y="623" font-size="10.7" fill="#4A473F">CQE：本地 I/O 结束</text>
  <text x="922" y="641" font-size="10.7" fill="#4A473F">Response OK：远端调用成功</text>
</svg>
