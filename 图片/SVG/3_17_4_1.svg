<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960px" height="520px" viewBox="0 0 960 520" version="1.1"><rect x="0" y="0" width="960" height="520" fill="rgb(245, 244, 237)" /><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><text font-size="15" font-weight="500" fill="#444441" font-family="system-ui, sans-serif" x="480" y="32" text-anchor="middle" dominant-baseline="central">pthread_cond_wait 内部三步原子操作</text><text font-size="12" font-weight="400" fill="#444441" font-family="system-ui, sans-serif" x="480" y="54" text-anchor="middle" dominant-baseline="central">释放锁 → 进入睡眠 → 被唤醒后重新加锁</text><rect fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" x="60" y="90" width="300" height="40" rx="8" /><text font-size="14" font-weight="500" fill="#0C447C" font-family="system-ui, sans-serif" x="210" y="110" text-anchor="middle" dominant-baseline="central">调用线程</text><rect fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" x="600" y="90" width="300" height="40" rx="8" /><text font-size="14" font-weight="500" fill="#633806" font-family="system-ui, sans-serif" x="750" y="110" text-anchor="middle" dominant-baseline="central">通知线程</text><line stroke="#BBBAB2" stroke-width="1.5" stroke-dasharray="4 4" x1="210" y1="130" x2="210" y2="470" /><line stroke="#BBBAB2" stroke-width="1.5" stroke-dasharray="4 4" x1="750" y1="130" x2="750" y2="470" /><rect fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" x="80" y="150" width="260" height="44" rx="8" /><text font-size="12" fill="#085041" font-family="system-ui, sans-serif" x="210" y="164" text-anchor="middle" dominant-baseline="central">① 持有 mutex<tspan x="210" dy="15.6">pthread_cond_wait(&amp;cond, &amp;mutex)</tspan></text><rect fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" x="80" y="216" width="260" height="44" rx="8" /><text font-size="12" fill="#3C3489" font-family="system-ui, sans-serif" x="210" y="230" text-anchor="middle" dominant-baseline="central">② 原子地释放 mutex<tspan x="210" dy="15.6">线程进入睡眠等待队列</tspan></text><rect fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" x="620" y="290" width="260" height="44" rx="8" /><text font-size="12" fill="#633806" font-family="system-ui, sans-serif" x="750" y="304" text-anchor="middle" dominant-baseline="central">修改共享状态<tspan x="750" dy="15.6">pthread_cond_signal(&amp;cond)</tspan></text><path fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)" d="M620 312 C520 312 460 312 340 312" /><text font-size="11" fill="#854F0B" font-family="system-ui, sans-serif" x="480" y="300" text-anchor="middle" dominant-baseline="central">唤醒信号</text><rect fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" x="80" y="346" width="260" height="44" rx="8" /><text font-size="12" fill="#3C3489" font-family="system-ui, sans-serif" x="210" y="360" text-anchor="middle" dominant-baseline="central">③ 被唤醒，竞争并重新获得 mutex<tspan x="210" dy="15.6">返回 pthread_cond_wait</tspan></text><rect fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" x="80" y="412" width="260" height="44" rx="8" /><text font-size="12" fill="#085041" font-family="system-ui, sans-serif" x="210" y="426" text-anchor="middle" dominant-baseline="central">④ while 重新检查谓词<tspan x="210" dy="15.6">条件满足 → 继续执行</tspan></text><text font-size="12" fill="#444441" font-family="system-ui, sans-serif" x="480" y="494" text-anchor="middle" dominant-baseline="central">②中「释放 mutex + 进入睡眠」是原子的——不存在『解了锁却还没睡』的窗口</text></svg>