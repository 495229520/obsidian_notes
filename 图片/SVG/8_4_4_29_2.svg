<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>微突发：低频 gauge 为零，不等于没有排队</title>
<desc>左图使用秒级采集；右图放大一个 20 μs 教学突发，两幅横轴尺度不同</desc>
<defs>
<marker id="arr_n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5A564B"/></marker>
<marker id="arr_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3D5A80"/></marker>
<marker id="arr_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6B5E"/></marker>
<marker id="arr_r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="690" fill="rgb(245, 244, 237)"/>
<text x="48" y="43" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="title">微突发：低频 gauge 为零，不等于没有排队</text>
<text x="48" y="72" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="subtitle">左图使用秒级采集；右图放大一个 20 μs 教学突发，两幅横轴尺度不同</text>
<rect x="48" y="109" width="785" height="327" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="135" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">A · 秒级采集：三个读点都可能很低</text>
<polyline points="148,166 148,355 800,355" fill="none" stroke="#5A564B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="164" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">占用</text>
<polyline points="190,334 450,334 452,334 453,211 457,211 458,334 770,334" fill="none" stroke="#A64B3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="190,160 190,356" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<circle cx="190" cy="334" r="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.6"/>
<text x="190" y="384" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">0 s</text>
<polyline points="480,160 480,356" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<circle cx="480" cy="334" r="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.6"/>
<text x="480" y="384" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">1 s</text>
<polyline points="770,160 770,356" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<circle cx="770" cy="334" r="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.6"/>
<text x="770" y="384" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">2 s</text>
<text x="190" y="408" font-size="13" fill="#2C4460" font-weight="400" text-anchor="start" data-role="body">● 轮询读点</text>
<text x="432" y="192" font-size="14" fill="#733428" font-weight="400" text-anchor="start" data-role="body">微突发</text>
<rect x="865" y="109" width="327" height="327" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="881" y="135" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">B · 局部放大：持续时间不同</text>
<polyline points="899,355 1160,355" fill="none" stroke="#5A564B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="909,335 935,335 935,208 1117,208 1117,335 1156,335" fill="none" stroke="#A64B3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="935" y="384" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">0 μs</text>
<text x="1117" y="384" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">20 μs</text>
<text x="1029" y="287" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle" data-role="body">gauge 读点可能不在其中</text>
<text x="48" y="475" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">C · 三种观察：互补，但都不是完整事件历史</text>
<rect x="48" y="495" width="186" height="33" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="141.0" y="516.4" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body" data-region="54,499,174,25">Gauge</text>
<text x="262" y="518" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">读取时是否仍拥塞</text>
<text x="776" y="518" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">没有历史保障</text>
<rect x="48" y="539" width="186" height="33" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="141.0" y="560.4" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body" data-region="54,543,174,25">Watermark</text>
<text x="262" y="562" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">窗口内最高达到哪里</text>
<text x="776" y="562" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">缺少持续时间</text>
<rect x="48" y="583" width="186" height="33" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="141.0" y="604.4" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body" data-region="54,587,174,25">Histogram</text>
<text x="262" y="606" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">各深度区间的采样频度</text>
<text x="776" y="606" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">通常缺少先后顺序</text>
<text x="48" y="665" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">硬件采样间隔、驱动缓存、收集周期与导出周期分别记录；此图不展示任何实测 queue occupancy。</text>
</svg>