<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#4f6f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .subtitle { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .box-title { font: 700 17px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .box-text { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #31465a; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .create { fill: #fff8e8; stroke: #d49b38; stroke-width: 2; rx: 18; }
      .active { fill: #f0f6ff; stroke: #2f7ab8; stroke-width: 2; rx: 18; }
      .closing { fill: #fff0f0; stroke: #c96b6b; stroke-width: 2; rx: 18; }
      .destroy { fill: #edf7ed; stroke: #4f8f55; stroke-width: 2.2; rx: 18; }
      .note { fill: #fffdf5; stroke: #c6b178; stroke-width: 1.5; rx: 14; }
      .line { stroke: #4f6f8f; stroke-width: 2.2; fill: none; marker-end: url(#arrow-hollow); }
      .soft-line { stroke: #7b8b9b; stroke-width: 1.8; fill: none; marker-end: url(#arrow-hollow); }
    </style>
  </defs>

  <text x="550" y="48" text-anchor="middle" class="title">TcpConnection 生命周期：从 accept 到 RAII 释放</text>
  <text x="550" y="76" text-anchor="middle" class="subtitle">关闭连接不是只 close(fd)，还要处理 epoll、连接表、回调和对象析构顺序</text>

  <rect x="60" y="140" width="170" height="92" class="create"/>
  <text x="145" y="171" text-anchor="middle" class="box-title">accept4()</text>
  <text x="145" y="196" text-anchor="middle" class="box-text">得到 conn_fd</text>
  <text x="145" y="216" text-anchor="middle" class="small">NONBLOCK / CLOEXEC</text>

  <rect x="285" y="140" width="180" height="92" class="create"/>
  <text x="375" y="171" text-anchor="middle" class="box-title">创建连接对象</text>
  <text x="375" y="196" text-anchor="middle" class="box-text">TcpConnection</text>
  <text x="375" y="216" text-anchor="middle" class="small">Socket + Channel + Buffer</text>

  <rect x="520" y="140" width="180" height="92" class="active"/>
  <text x="610" y="171" text-anchor="middle" class="box-title">加入连接表</text>
  <text x="610" y="196" text-anchor="middle" class="box-text">shared_ptr 保存</text>
  <text x="610" y="216" text-anchor="middle" class="small">生命周期可被回调共享</text>

  <rect x="755" y="140" width="190" height="92" class="active"/>
  <text x="850" y="171" text-anchor="middle" class="box-title">注册 Channel</text>
  <text x="850" y="196" text-anchor="middle" class="box-text">epoll_ctl(ADD)</text>
  <text x="850" y="216" text-anchor="middle" class="small">开始关注读事件</text>

  <path d="M 230 186 L 283 186" class="line"/>
  <path d="M 465 186 L 518 186" class="line"/>
  <path d="M 700 186 L 753 186" class="line"/>

  <rect x="110" y="338" width="190" height="92" class="active"/>
  <text x="205" y="369" text-anchor="middle" class="box-title">事件活跃期</text>
  <text x="205" y="394" text-anchor="middle" class="box-text">read / write</text>
  <text x="205" y="414" text-anchor="middle" class="small">input / output buffer</text>

  <rect x="362" y="338" width="190" height="92" class="closing"/>
  <text x="457" y="369" text-anchor="middle" class="box-title">关闭或错误</text>
  <text x="457" y="394" text-anchor="middle" class="box-text">close callback</text>
  <text x="457" y="414" text-anchor="middle" class="small">回到所属 EventLoop</text>

  <rect x="614" y="338" width="190" height="92" class="closing"/>
  <text x="709" y="369" text-anchor="middle" class="box-title">移除事件</text>
  <text x="709" y="394" text-anchor="middle" class="box-text">disableAll + DEL</text>
  <text x="709" y="414" text-anchor="middle" class="small">epoll 不再持有旧指针</text>

  <rect x="866" y="338" width="190" height="92" class="destroy"/>
  <text x="961" y="369" text-anchor="middle" class="box-title">RAII 析构</text>
  <text x="961" y="394" text-anchor="middle" class="box-text">Socket close(fd)</text>
  <text x="961" y="414" text-anchor="middle" class="small">最后一个 shared_ptr 释放</text>

  <path d="M 850 232 C 850 288 205 282 205 336" class="soft-line"/>
  <path d="M 300 384 L 360 384" class="line"/>
  <path d="M 552 384 L 612 384" class="line"/>
  <path d="M 804 384 L 864 384" class="line"/>

  <rect x="168" y="488" width="330" height="64" class="note"/>
  <text x="333" y="516" text-anchor="middle" class="box-title">安全顺序</text>
  <text x="333" y="539" text-anchor="middle" class="small">先从 epoll / 连接表脱离，再允许对象析构</text>

  <rect x="604" y="488" width="330" height="64" class="note"/>
  <text x="769" y="516" text-anchor="middle" class="box-title">危险顺序</text>
  <text x="769" y="539" text-anchor="middle" class="small">先释放对象，epoll_event.data.ptr 可能变成悬空指针</text>
</svg>
