<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>gRPC Completion Queue 的分层完成事件模型</title>
  <desc>展示 AddAsync 从业务消息到生成 API、Call 对象、CompletionQueue、gRPC runtime 与 TCP 的分层，以及 tag、ok、grpc Status 和对象所有权的边界。</desc>

  <defs>
    <marker id="arr-down" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3D5A80"/>
    </marker>
    <marker id="arr-up" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8A6A3A"/>
    </marker>
  </defs>

  <!-- 全局浅米色底 -->
  <rect width="1240" height="860" fill="#F5F4ED"/>

  <!-- 顶部主副标题区 -->
  <text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26">
    gRPC Completion Queue：runtime 推进传输，应用恢复 Call 状态机
  </text>
  <text x="48" y="74" font-size="13.5" fill="#6B675C">
    CQ 返回的是“某个异步操作已完成”的 tag + ok，而不是 socket 可读写事件
  </text>

  <!-- ======================== Panel A: 分层数据与完成路径 ======================== -->
  <rect x="48" y="98" width="798" height="544" rx="10"
        fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="70" y="126" font-size="14.5" font-weight="700" fill="#4A473F">
    A · Add(3, 4) 的提交路径与完成路径
  </text>

  <!-- 表头 -->
  <rect x="70" y="142" width="116" height="26" rx="5" fill="#ECEAE0"/>
  <text x="128" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5A564B">层次</text>

  <rect x="204" y="142" width="190" height="26" rx="5" fill="#E3EAF4"/>
  <text x="299" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2C4460">提交操作 ↓</text>

  <rect x="412" y="142" width="230" height="26" rx="5" fill="#EDEAF3"/>
  <text x="527" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A3F68">长期对象 / runtime 责任</text>

  <rect x="660" y="142" width="168" height="26" rx="5" fill="#DCE9E3"/>
  <text x="744" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#24473F">完成事件 ↑</text>

  <!-- Row 1: ① 业务 -->
  <rect x="70" y="178" width="116" height="48" rx="7" fill="#3D5A80"/>
  <text x="128" y="207" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">① 业务</text>

  <rect x="204" y="178" width="190" height="48" rx="7" fill="#E3EAF4" stroke="#B7C6DA" stroke-width="1.2"/>
  <text x="299" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4460">AddAsync(3, 4)</text>
  <text x="299" y="217" text-anchor="middle" font-size="10.5" fill="#53677E">deadline + callback</text>

  <rect x="412" y="178" width="230" height="48" rx="7" fill="#F1EEF6" stroke="#D3CBE1" stroke-width="1.2"/>
  <text x="527" y="199" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A3F68">业务契约</text>
  <text x="527" y="217" text-anchor="middle" font-size="10.5" fill="#665B78">输入、溢出、幂等性</text>

  <rect x="660" y="178" width="168" height="48" rx="7" fill="#DCE9E3" stroke="#B9D0C5" stroke-width="1.2"/>
  <text x="744" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">callback(7)</text>

  <!-- Row 2: ② 消息 -->
  <rect x="70" y="240" width="116" height="48" rx="7" fill="#6B5B95"/>
  <text x="128" y="269" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">② 消息</text>

  <rect x="204" y="240" width="190" height="48" rx="7" fill="#EDEAF3" stroke="#C9C0D8" stroke-width="1.2"/>
  <text x="299" y="261" text-anchor="middle" font-size="12" font-weight="700" fill="#4A3F68">AddRequest</text>
  <text x="299" y="279" text-anchor="middle" font-size="10.5" fill="#665B78">set_a / set_b</text>

  <rect x="412" y="240" width="230" height="48" rx="7" fill="#F1EEF6" stroke="#D3CBE1" stroke-width="1.2"/>
  <text x="527" y="261" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A3F68">protobuf schema</text>
  <text x="527" y="279" text-anchor="middle" font-size="10.5" fill="#665B78">字段号与消息类型</text>

  <rect x="660" y="240" width="168" height="48" rx="7" fill="#DCE9E3" stroke="#B9D0C5" stroke-width="1.2"/>
  <text x="744" y="261" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">AddReply</text>
  <text x="744" y="279" text-anchor="middle" font-size="10.5" fill="#4A655F">reply.sum()</text>

  <!-- Row 3: ③ 生成 API -->
  <rect x="70" y="302" width="116" height="48" rx="7" fill="#A64B3C"/>
  <text x="128" y="331" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">③ 生成 API</text>

  <rect x="204" y="302" width="190" height="48" rx="7" fill="#F0E0DB" stroke="#D5B2A9" stroke-width="1.2"/>
  <text x="299" y="323" text-anchor="middle" font-size="11.5" font-weight="700" fill="#733428">AsyncAdd / RequestAdd</text>
  <text x="299" y="341" text-anchor="middle" font-size="10.5" fill="#8A5148">提交异步操作</text>

  <rect x="412" y="302" width="230" height="48" rx="7" fill="#F5E8E4" stroke="#DFC6BF" stroke-width="1.2"/>
  <text x="527" y="323" text-anchor="middle" font-size="11.5" font-weight="700" fill="#733428">Stub / AsyncService</text>
  <text x="527" y="341" text-anchor="middle" font-size="10.5" fill="#8A5148">生成接口，不暴露 socket</text>

  <rect x="660" y="302" width="168" height="48" rx="7" fill="#E9F1ED" stroke="#B9D0C5" stroke-width="1.2"/>
  <text x="744" y="331" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">Finish 完成</text>

  <!-- Row 4: ④ Call 对象 -->
  <rect x="70" y="364" width="116" height="48" rx="7" fill="#9A6C1F"/>
  <text x="128" y="393" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">④ Call 对象</text>

  <rect x="204" y="364" width="190" height="48" rx="7" fill="#F3E8D3" stroke="#D8BE90" stroke-width="1.2"/>
  <text x="299" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#6B4E28">tag = call.get()</text>
  <text x="299" y="403" text-anchor="middle" font-size="10.5" fill="#806541">非拥有身份</text>

  <rect x="412" y="364" width="230" height="48" rx="7" fill="#F6EEDC" stroke="#E1CEA8" stroke-width="1.2"/>
  <text x="527" y="385" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B4E28">ClientCall / AddCall</text>
  <text x="527" y="403" text-anchor="middle" font-size="10.5" fill="#806541">context + message + state</text>

  <rect x="660" y="364" width="168" height="48" rx="7" fill="#E9F1ED" stroke="#B9D0C5" stroke-width="1.2"/>
  <text x="744" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">OnCompletion</text>
  <text x="744" y="403" text-anchor="middle" font-size="10.5" fill="#4A655F">继续或退役</text>

  <!-- Row 5: ⑤ CQ -->
  <rect x="70" y="426" width="116" height="48" rx="7" fill="#6B5B95"/>
  <text x="128" y="455" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">⑤ CQ</text>

  <rect x="204" y="426" width="190" height="48" rx="7" fill="#EDEAF3" stroke="#C9C0D8" stroke-width="1.2"/>
  <text x="299" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#4A3F68">登记 tag</text>
  <text x="299" y="465" text-anchor="middle" font-size="10.5" fill="#665B78">操作完成后投递</text>

  <rect x="412" y="426" width="230" height="48" rx="7" fill="#F1EEF6" stroke="#D3CBE1" stroke-width="1.2"/>
  <text x="527" y="447" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A3F68">CompletionQueue</text>
  <text x="527" y="465" text-anchor="middle" font-size="10.5" fill="#665B78">统一等待多个操作</text>

  <rect x="660" y="426" width="168" height="48" rx="7" fill="#DCE9E3" stroke="#B9D0C5" stroke-width="1.2"/>
  <text x="744" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">Next(tag, ok)</text>
  <text x="744" y="465" text-anchor="middle" font-size="10.5" fill="#4A655F">恢复应用对象</text>

  <!-- Row 6: ⑥ Runtime -->
  <rect x="70" y="488" width="116" height="48" rx="7" fill="#2F6B5E"/>
  <text x="128" y="517" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">⑥ Runtime</text>

  <rect x="204" y="488" width="190" height="48" rx="7" fill="#DCE9E3" stroke="#B9D0C5" stroke-width="1.2"/>
  <text x="299" y="509" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">call / stream / deadline</text>
  <text x="299" y="527" text-anchor="middle" font-size="10.5" fill="#4A655F">后台推进</text>

  <rect x="412" y="488" width="230" height="48" rx="7" fill="#E9F1ED" stroke="#C6D9D0" stroke-width="1.2"/>
  <text x="527" y="509" text-anchor="middle" font-size="11.5" font-weight="700" fill="#24473F">protobuf + HTTP/2</text>
  <text x="527" y="527" text-anchor="middle" font-size="10.5" fill="#4A655F">半包、短写、流控由库维护</text>

  <rect x="660" y="488" width="168" height="48" rx="7" fill="#DCE9E3" stroke="#B9D0C5" stroke-width="1.2"/>
  <text x="744" y="509" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">操作完成</text>
  <text x="744" y="527" text-anchor="middle" font-size="10.5" fill="#4A655F">向 CQ 投递</text>

  <!-- Row 7: ⑦ TCP -->
  <rect x="70" y="550" width="116" height="48" rx="7" fill="#5A564B"/>
  <text x="128" y="579" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">⑦ TCP</text>

  <rect x="204" y="550" width="190" height="48" rx="7" fill="#ECEAE0" stroke="#D3CFC2" stroke-width="1.2"/>
  <text x="299" y="579" text-anchor="middle" font-size="12" font-weight="700" fill="#4A473F">HTTP/2 字节</text>

  <rect x="412" y="550" width="230" height="48" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="527" y="571" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A473F">可靠有序字节流</text>
  <text x="527" y="589" text-anchor="middle" font-size="10.5" fill="#6B675C">应用不直接维护 fd 兴趣集</text>

  <rect x="660" y="550" width="168" height="48" rx="7" fill="#ECEAE0" stroke="#D3CFC2" stroke-width="1.2"/>
  <text x="744" y="579" text-anchor="middle" font-size="12" font-weight="700" fill="#4A473F">连接结果</text>

  <!-- 纵向箭头：留有 14px 充足间距 -->
  <path d="M299 226 V238" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-down)"/>
  <path d="M299 288 V300" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-down)"/>
  <path d="M299 350 V362" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-down)"/>
  <path d="M299 412 V424" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-down)"/>
  <path d="M299 474 V486" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-down)"/>
  <path d="M299 536 V548" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-down)"/>

  <path d="M744 550 V538" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-up)"/>
  <path d="M744 488 V476" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-up)"/>
  <path d="M744 426 V414" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-up)"/>
  <path d="M744 364 V352" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-up)"/>
  <path d="M744 302 V290" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-up)"/>
  <path d="M744 240 V228" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-up)"/>


  <!-- ======================== Panel B: 三个结果层次 ======================== -->
  <rect x="866" y="98" width="326" height="544" rx="10"
        fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="888" y="126" font-size="14.5" font-weight="700" fill="#4A473F">
    B · 三个结果层次不能混用
  </text>

  <!-- Tag 卡片 -->
  <rect x="886" y="144" width="286" height="66" rx="8"
        fill="#E3EAF4" stroke="#B7C6DA" stroke-width="1.2"/>
  <text x="906" y="169" font-size="12.5" font-weight="700" fill="#2C4460">tag</text>
  <text x="906" y="188" font-size="11" fill="#53677E">哪一个异步操作 / Call 对象？</text>
  <text x="906" y="202" font-size="10" fill="#6B675C">身份，不是所有权</text>

  <path d="M1029 210 V220" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arr-gold)"/>

  <!-- Ok 卡片 -->
  <rect x="886" y="222" width="286" height="66" rx="8"
        fill="#F3E8D3" stroke="#D8BE90" stroke-width="1.2"/>
  <text x="906" y="247" font-size="12.5" font-weight="700" fill="#6B4E28">ok</text>
  <text x="906" y="266" font-size="11" fill="#806541">当前操作是否正常完成？</text>
  <text x="906" y="280" font-size="10" fill="#6B675C">不是 Add 业务成功</text>

  <path d="M1029 288 V298" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arr-gold)"/>

  <!-- Status 卡片 -->
  <rect x="886" y="300" width="286" height="66" rx="8"
        fill="#DCE9E3" stroke="#B9D0C5" stroke-width="1.2"/>
  <text x="906" y="325" font-size="12.5" font-weight="700" fill="#24473F">grpc::Status + reply</text>
  <text x="906" y="344" font-size="11" fill="#4A655F">整次 RPC 与业务结果</text>
  <text x="906" y="358" font-size="10" fill="#6B675C">最后一层才读取 sum</text>

  <!-- 粒度对比区 -->
  <text x="888" y="396" font-size="13" font-weight="700" fill="#4A473F">
    事件粒度对照
  </text>

  <rect x="886" y="412" width="136" height="96" rx="8"
        fill="#F0E0DB" stroke="#D5B2A9" stroke-width="1.2"/>
  <text x="954" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#733428">epoll</text>
  <text x="954" y="458" text-anchor="middle" font-size="10.5" fill="#8A5148">fd 可读 / 可写</text>
  <text x="954" y="478" text-anchor="middle" font-size="10.5" fill="#8A5148">应用维护 buffer</text>
  <text x="954" y="496" text-anchor="middle" font-size="10" fill="#6B675C">就绪事件</text>

  <rect x="1036" y="412" width="136" height="96" rx="8"
        fill="#EDEAF3" stroke="#C9C0D8" stroke-width="1.2"/>
  <text x="1104" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#4A3F68">CQ</text>
  <text x="1104" y="458" text-anchor="middle" font-size="10.5" fill="#665B78">Request / Finish</text>
  <text x="1104" y="478" text-anchor="middle" font-size="10.5" fill="#665B78">runtime 维护传输</text>
  <text x="1104" y="496" text-anchor="middle" font-size="10" fill="#6B675C">完成事件</text>

  <rect x="886" y="524" width="286" height="54" rx="7"
        fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="1029" y="546" text-anchor="middle" font-size="11" font-weight="700" fill="#4A473F">CQ 不拥有 tag 指向的对象</text>
  <text x="1029" y="564" text-anchor="middle" font-size="10" fill="#6B675C">registry 持有到最终完成事件 drain</text>


  <!-- ======================== Panel C: 应用仍需维护的状态 ======================== -->
  <rect x="48" y="654" width="1144" height="126" rx="10"
        fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="70" y="682" font-size="14.5" font-weight="700" fill="#4A473F">
    C · 应用仍然必须维护的状态与不变量
  </text>
  <text x="70" y="708" font-size="11.5" fill="#5A564B">
    1. Call 阶段（Requesting/Finishing）、所有权与执行线程归属。
  </text>
  <text x="70" y="730" font-size="11.5" fill="#5A564B">
    2. deadline 超时、in-flight 上限与 shutdown 顺序。
  </text>
  <text x="70" y="752" font-size="11.5" fill="#5A564B">
    3. 裸指针仅作稳定 tag 身份，生命期由 registry 唯一持有。
  </text>

  <!-- 底部核心结论 -->
  <text x="48" y="812" font-size="13" font-weight="700" fill="#2B2A26">
    结论：gRPC 接管“怎样传输”，但应用仍要回答“完成事件回来时恢复谁，以及何时才能销毁它”。
  </text>
  <text x="48" y="834" font-size="12" fill="#5A564B">
    Completion Queue 以完成事件解耦传输，应用通过状态机与 registry 保证资源安全。
  </text>
</svg>
