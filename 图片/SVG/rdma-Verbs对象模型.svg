<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A3F68"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">Verbs 对象模型：控制路径建资源，数据路径转两个环</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">verbs 不是 socket 的替代品，而是把网卡当可编程 DMA 引擎的指令集；贵操作走内核，热路径 0 系统调用</text>

  <!-- 用户态容器 -->
  <rect x="48" y="106" width="640" height="520" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="68" y="132" font-size="13" font-weight="700" fill="#4A473F">用户态进程</text>

  <rect x="76" y="148" width="340" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="246" y="169" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">应用线程（存储客户端 / 服务端）</text>
  <text x="246" y="187" font-size="10.5" fill="#2C4460" text-anchor="middle">post_send / post_recv / poll_cq 都在这里发生</text>

  <!-- Context 容器 -->
  <rect x="76" y="224" width="560" height="288" rx="8" fill="#FBFAF5" stroke="#B9B4A4" stroke-width="1.2"/>
  <text x="92" y="248" font-size="12" font-weight="700" fill="#6B675C">ibv_context：打开设备后的句柄，一切资源的根</text>

  <!-- PD 虚线圈 -->
  <rect x="96" y="262" width="380" height="234" rx="8" fill="none" stroke="#2F6B5E" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="112" y="286" font-size="11.5" font-weight="700" fill="#24473F">PD 保护域：QP 只能引用同域的 MR</text>

  <rect x="116" y="300" width="160" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="196" y="322" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">MR 内存区域</text>
  <text x="196" y="342" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">lkey / rkey（4.4）</text>

  <rect x="296" y="300" width="160" height="88" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="376" y="322" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">QP（SQ＋RQ）</text>
  <text x="376" y="342" font-size="10.5" fill="#24473F" text-anchor="middle">两个工作队列环</text>
  <text x="376" y="360" font-size="10.5" fill="#24473F" text-anchor="middle">深度 max_send/recv_wr</text>
  <text x="376" y="378" font-size="10.5" fill="#24473F" text-anchor="middle">状态机见 4.3</text>

  <rect x="496" y="300" width="120" height="88" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="556" y="322" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">CQ</text>
  <text x="556" y="342" font-size="10.5" fill="#24473F" text-anchor="middle">完成队列</text>
  <text x="556" y="360" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">CQE=ibv_wc</text>

  <line x1="456" y1="330" x2="492" y2="330" stroke="#2F6B5E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <text x="474" y="320" font-size="9.5" fill="#24473F" text-anchor="middle">完成落点</text>

  <!-- 数据 buffer -->
  <rect x="116" y="420" width="160" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="196" y="442" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">数据 buffer</text>
  <text x="196" y="460" font-size="10" fill="#2C4460" text-anchor="middle">注册后可被网卡 DMA</text>
  <line x1="196" y1="368" x2="196" y2="416" stroke="#2F6B5E" stroke-width="1.3" marker-end="url(#arrG)"/>
  <text x="206" y="398" font-size="9.5" fill="#24473F">描述并授权</text>

  <!-- 数据路径箭头（应用 ↔ 环） -->
  <line x1="376" y1="196" x2="376" y2="296" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="388" y="232" font-size="10.5" fill="#24473F">ibv_post_send / recv：填 WQE（纯用户态）</text>
  <polyline points="556,296 556,172 420,172" fill="none" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="470" y="214" font-size="10.5" fill="#24473F">ibv_poll_cq：收 CQE（纯用户态）</text>

  <!-- 内核容器 -->
  <rect x="720" y="106" width="472" height="180" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="740" y="132" font-size="13" font-weight="700" fill="#4A473F">内核（RDMA core + 驱动）——只在控制路径出场</text>
  <rect x="744" y="148" width="424" height="56" rx="7" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="956" y="170" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#733428" text-anchor="middle">ibv_open_device / alloc_pd / reg_mr / create_cq·qp / modify_qp</text>
  <text x="956" y="190" font-size="10.5" fill="#733428" text-anchor="middle">系统调用：验证权限、pin 页、配置网卡——慢，但只在初始化与连接期</text>
  <text x="744" y="238" font-size="10.5" fill="#6B675C">创建成功后把环与 doorbell 页 mmap 给用户态，</text>
  <text x="744" y="256" font-size="10.5" fill="#6B675C">此后数据路径不再进内核——3.3「控制面搭台」的网络版</text>

  <!-- 控制路径箭头 -->
  <polyline points="636,270 700,270 700,196 716,196" fill="none" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="648" y="258" font-size="10" fill="#733428">建资源</text>

  <!-- RNIC 容器 -->
  <rect x="720" y="320" width="472" height="306" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="740" y="346" font-size="13" font-weight="700" fill="#4A473F">RDMA 网卡（RNIC）</text>

  <rect x="744" y="362" width="200" height="60" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="844" y="384" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">QP 上下文缓存</text>
  <text x="844" y="402" font-size="10" fill="#4A3F68" text-anchor="middle">连接状态在卡上（容量有限）</text>

  <rect x="968" y="362" width="200" height="60" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="1068" y="384" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">MTT 地址翻译表</text>
  <text x="1068" y="402" font-size="10" fill="#4A3F68" text-anchor="middle">MR 的 VA→PA 映射</text>

  <rect x="744" y="442" width="200" height="60" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="844" y="464" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">硬件传输层</text>
  <text x="844" y="482" font-size="10" fill="#4A3F68" text-anchor="middle">分段·确认·重传·拥塞</text>

  <rect x="968" y="442" width="200" height="60" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="1068" y="464" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">DMA 引擎</text>
  <text x="1068" y="482" font-size="10" fill="#4A3F68" text-anchor="middle">直读直写用户 buffer</text>

  <rect x="744" y="540" width="200" height="48" rx="7" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="844" y="560" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">Doorbell 寄存器</text>
  <text x="844" y="578" font-size="10" fill="#733428" text-anchor="middle">MMIO：热路径唯一出境写</text>

  <!-- 数据路径：doorbell 与 CQE -->
  <polyline points="456,344 700,344 700,564 740,564" fill="none" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="470" y="336" font-size="10.5" fill="#24473F">doorbell：一次 MMIO 写 ≈ release 发布（3.2）</text>
  <polyline points="720,470 556,470 556,392" fill="none" stroke="#2F6B5E" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <text x="566" y="462" font-size="10" fill="#24473F">CQE：网卡 DMA 写回主机内存</text>
  <polyline points="1068,506 1068,604 196,604 196,480" fill="none" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="400" y="596" font-size="10.5" fill="#24473F">数据：DMA 直达用户 buffer（零拷贝，CPU 不参与）</text>

  <!-- 五个对象速查 -->
  <text x="48" y="662" font-size="13" font-weight="700" fill="#2B2A26">五个对象，一句话职责</text>

  <rect x="48" y="676" width="96" height="28" rx="6" fill="#FBFAF5" stroke="#B9B4A4" stroke-width="1.2"/>
  <text x="96" y="695" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#4A473F" text-anchor="middle">Context</text>
  <text x="164" y="695" font-size="11" fill="#4A473F">打开设备的句柄；一切资源的根（控制路径创建）</text>

  <rect x="48" y="714" width="96" height="28" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="96" y="733" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">PD</text>
  <text x="164" y="733" font-size="11" fill="#4A473F">保护域：QP 与 MR 的访问控制圈，越域访问被网卡硬件拒绝</text>

  <rect x="48" y="752" width="96" height="28" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="96" y="771" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">MR</text>
  <text x="164" y="771" font-size="11" fill="#4A473F">注册过的内存：已 pin ＋ 网卡可翻译 ＋ lkey/rkey 两把钥匙（4.4）</text>

  <rect x="48" y="790" width="96" height="28" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="96" y="809" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">QP</text>
  <text x="164" y="809" font-size="11" fill="#4A473F">一条连接的 SQ＋RQ 两个工作队列环；显式状态机驱动（4.3）</text>

  <rect x="48" y="828" width="96" height="28" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="96" y="847" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">CQ</text>
  <text x="164" y="847" font-size="11" fill="#4A473F">完成队列：一切异步结果的落点，wr_id 对号（可多 QP 共享）</text>

  <!-- 右下备注 -->
  <rect x="760" y="676" width="432" height="180" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="780" y="704" font-size="12.5" font-weight="700" fill="#4A473F">API 的两副面孔</text>
  <text x="780" y="732" font-size="10.5" fill="#4A473F">控制路径：ibv_create_* / reg_mr / modify_qp——系统调用，</text>
  <text x="780" y="752" font-size="10.5" fill="#4A473F">毫秒级也无妨，全部发生在初始化与连接建立期。</text>
  <text x="780" y="780" font-size="10.5" fill="#4A473F">数据路径：post_send / post_recv / poll_cq——普通函数，</text>
  <text x="780" y="800" font-size="10.5" fill="#4A473F">直接操作 mmap 进来的环与 doorbell，0 系统调用。</text>
  <text x="780" y="828" font-size="10.5" fill="#6B675C">「贵操作滚去初始化」——与 NVMe Admin/IO 分工同一张图纸。</text>
</svg>
