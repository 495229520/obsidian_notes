<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<title>enable_shared_from_this：复用已有的所有权</title><desc>左侧两个独立控制块管理同一对象，右侧两个 shared_ptr 共享一个控制块。对象内 weak_this 以虚线关联已有控制块。下方比较引用释放，并注明 shared_from_this 与 weak_ptr::lock 的失败行为不同。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3D5A80"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A64B3C"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6B5E"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6B675C"/></marker>
</defs><rect width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="43" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">enable_shared_from_this：复用已有的所有权</text>
<text x="48" y="72" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">同一个对象地址，可能对应不同控制块；shared_from_this() 沿内置弱引用找到已有控制块。</text>
<rect x="48" y="98" width="550" height="396" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<rect x="622" y="98" width="570" height="396" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="70" y="128" font-size="16" fill="#733428" font-weight="700" text-anchor="start">A · 裸指针重新托管</text>
<text x="574" y="128" font-size="13" fill="#A64B3C" font-weight="600" text-anchor="end">2 个控制块</text>
<text x="644" y="128" font-size="16" fill="#24473F" font-weight="700" text-anchor="start">B · shared_from_this() 共享所有权</text>
<text x="1170" y="128" font-size="13" fill="#2F6B5E" font-weight="600" text-anchor="end">1 个控制块</text>
<rect x="72" y="153" width="214" height="62" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="88" y="178" font-size="15" fill="#2C4460" font-weight="600" text-anchor="start">sp1 · 外部持有</text>
<text x="88" y="200" font-size="13" fill="#2C4460" font-weight="400" text-anchor="start">shared_ptr&lt;T&gt;</text>
<rect x="360" y="153" width="214" height="62" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="376" y="178" font-size="15" fill="#733428" font-weight="600" text-anchor="start">sp2 · 从 this 构造</text>
<text x="376" y="200" font-size="13" fill="#733428" font-weight="400" text-anchor="start">shared_ptr&lt;T&gt;(this)</text>
<path d="M179 215 V252" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#blue)"/>
<path d="M467 215 V252" fill="none" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#red)"/>
<rect x="72" y="252" width="214" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="88" y="277" font-size="15" fill="#2C4460" font-weight="600" text-anchor="start">控制块 A</text>
<text x="88" y="299" font-size="13" fill="#2C4460" font-weight="400" text-anchor="start">强引用 = 1</text>
<rect x="360" y="252" width="214" height="64" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="376" y="277" font-size="15" fill="#733428" font-weight="600" text-anchor="start">控制块 B</text>
<text x="376" y="299" font-size="13" fill="#733428" font-weight="400" text-anchor="start">强引用 = 1</text>
<text x="323" y="278" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle">独立</text>
<text x="323" y="299" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle">计数</text>
<path d="M179 316 V345 H260 V373" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#blue)"/>
<path d="M467 316 V345 H386 V373" fill="none" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#red)"/>
<rect x="175" y="373" width="296" height="65" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="191" y="398" font-size="15" fill="#4A473F" font-weight="600" text-anchor="start">同一个 T 对象</text>
<text x="191" y="420" font-size="13" fill="#4A473F" font-weight="400" text-anchor="start">两份独立的销毁责任</text>
<text x="72" y="473" font-size="14" fill="#A64B3C" font-weight="600" text-anchor="start">风险：悬空访问 / 重复释放 / 未定义行为</text>
<rect x="646" y="153" width="216" height="62" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="662" y="178" font-size="15" fill="#2C4460" font-weight="600" text-anchor="start">sp1 · 外部持有</text>
<text x="662" y="200" font-size="13" fill="#2C4460" font-weight="400" text-anchor="start">shared_ptr&lt;T&gt;</text>
<rect x="952" y="153" width="216" height="62" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="968" y="178" font-size="15" fill="#24473F" font-weight="600" text-anchor="start">sp2 · 从成员函数取得</text>
<text x="968" y="200" font-size="13" fill="#24473F" font-weight="400" text-anchor="start">shared_from_this()</text>
<path d="M754 215 V233 H840 V252" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#blue)"/>
<path d="M1060 215 V233 H974 V252" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#green)"/>
<rect x="780" y="252" width="254" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="796" y="277" font-size="15" fill="#24473F" font-weight="600" text-anchor="start">同一个控制块</text>
<text x="796" y="299" font-size="13" fill="#24473F" font-weight="400" text-anchor="start">强引用：1 → 2</text>
<path d="M838 316 V361" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#green)"/>
<text x="848" y="343" font-size="12" fill="#2F6B5E" font-weight="400" text-anchor="start">管理对象</text>
<rect x="742" y="361" width="326" height="94" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="758" y="386" font-size="15" fill="#2B2A26" font-weight="600" text-anchor="start">T 对象</text>
<rect x="758" y="397" width="294" height="42" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="774" y="423" font-size="14" fill="#2C4460" font-weight="400" text-anchor="start">weak_this · 内置 weak_ptr&lt;T&gt;</text>
<path d="M1052 418 H1138 V285 H1034" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#blue)"/>
<text x="1127" y="344" font-size="12" fill="#3D5A80" font-weight="400" text-anchor="end">弱关联</text>
<text x="1127" y="365" font-size="12" fill="#3D5A80" font-weight="400" text-anchor="end">强计数不变</text>
<text x="646" y="473" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">首次托管时绑定 weak_this；成员名仅作示意</text>
<text x="48" y="523" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">释放时，计数如何变化</text>
<text x="1192" y="523" font-size="12" fill="#6B675C" font-weight="400" text-anchor="end">假设仅有 sp1、sp2 两个强引用</text>
<rect x="48" y="538" width="1144" height="88" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<path d="M48 582 H1192 M236 538 V626 M592 538 V626" fill="none" stroke="#D8D5C8"/>
<text x="68" y="566" font-size="13" fill="#6B675C" font-weight="600" text-anchor="start">释放顺序</text>
<text x="256" y="566" font-size="14" fill="#733428" font-weight="600" text-anchor="start">A · 两套计数各自归零</text>
<text x="612" y="566" font-size="14" fill="#24473F" font-weight="600" text-anchor="start">B · 共用一套计数</text>
<text x="68" y="610" font-size="14" fill="#4A473F" font-weight="400" text-anchor="start">先 sp2，后 sp1</text>
<text x="256" y="610" font-size="14" fill="#733428" font-weight="400" text-anchor="start">B：1 → 0；A：仍为 1</text>
<text x="612" y="610" font-size="14" fill="#24473F" font-weight="400" text-anchor="start">2 → 1：存活</text>
<path d="M766 605 H815" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#green)"/>
<text x="839" y="610" font-size="14" fill="#24473F" font-weight="400" text-anchor="start">1 → 0：销毁对象一次</text>
<text x="48" y="653" font-size="13" fill="#4A473F" font-weight="400" text-anchor="start">前提：public、无歧义继承；调用前已被 shared_ptr 托管。构造期间不可调用 shared_from_this()。</text>
<text x="48" y="678" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">C++17 起：未绑定时 shared_from_this() 抛 bad_weak_ptr；weak_ptr::lock() 失败返回空指针。</text>
</svg>
