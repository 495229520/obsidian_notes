<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>银行家算法：状态关系与三道请求门</title>
  <desc>左侧用状态空间说明死锁状态属于非安全状态；右侧用三道门展示合法性、可用性与安全性检查，并以提交或回滚结束。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="800" fill="rgb(245, 244, 237)"/>
  <text x="48" y="52" font-size="22" fill="#2B2A26" font-weight="700">银行家算法：资源请求必须过三道门</text>
  <text x="48" y="80" font-size="13.5" fill="#6B675C">局部“拿得到”只是前提；试分配后仍能覆盖全部进程，才允许提交</text>
  <rect x="48" y="110" width="420" height="610" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="72" y="145" font-size="15" fill="#4A473F" font-weight="700">A · 状态空间：Deadlock ⊂ Unsafe</text>
  <text x="72" y="169" font-size="12" fill="#6B675C">安全性问未来保证；死锁问当前是否还能推进</text>
  <rect x="72" y="194" width="372" height="390" rx="9" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.1"/>
  <text x="90" y="217" font-size="11.5" fill="#6B675C" font-weight="700">系统状态空间</text>
  <rect x="88" y="232" width="148" height="302" rx="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="162" y="264" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle">安全状态</text>
  <text x="162" y="291" font-size="12.5" fill="#24473F" font-weight="700" text-anchor="middle">∃ 完整安全序列</text>
  <text x="162" y="317" font-size="11.5" fill="#4A675F" text-anchor="middle">Need ≤ Work</text>
  <circle cx="116" cy="374" r="18" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.3"/>
  <circle cx="162" cy="374" r="18" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.3"/>
  <circle cx="208" cy="374" r="18" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.3"/>
  <line x1="134" y1="374" x2="143" y2="374" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="180" y1="374" x2="189" y2="374" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="116" y="379" font-size="11.5" fill="#24473F" font-weight="700" text-anchor="middle">P₁</text>
  <text x="162" y="379" font-size="11.5" fill="#24473F" font-weight="700" text-anchor="middle">P₂</text>
  <text x="208" y="379" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle">…</text>
  <text x="162" y="420" font-size="11" fill="#4A675F" text-anchor="middle">完成 → 释放 Allocation</text>
  <text x="162" y="446" font-size="11.5" fill="#24473F" font-weight="700" text-anchor="middle">Work 单调不减</text>
  <path d="M112,474 C135,490 186,490 210,474" fill="none" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <text x="162" y="506" font-size="11" fill="#4A675F" text-anchor="middle">最终覆盖全部进程</text>
  <rect x="248" y="232" width="180" height="302" rx="10" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="338" y="264" font-size="16" fill="#6B4E28" font-weight="700" text-anchor="middle">非安全状态</text>
  <text x="338" y="291" font-size="12.5" fill="#6B4E28" font-weight="700" text-anchor="middle">¬∃ 保证完成序列</text>
  <rect x="270" y="324" width="136" height="58" rx="8" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="338" y="347" font-size="11.5" fill="#6B4E28" font-weight="700" text-anchor="middle">仍可能继续运行</text>
  <text x="338" y="368" font-size="10.8" fill="#7B6342" text-anchor="middle">但无法保证完成</text>
  <path d="M338,382 V410" fill="none" stroke="#8A6A3A" stroke-width="1.4" marker-end="url(#arr-amber)" stroke-dasharray="5 4"/>
  <text x="351" y="402" font-size="9.8" fill="#8A6A3A">可能演化</text>
  <rect x="276" y="416" width="124" height="88" rx="9" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="338" y="446" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">死锁状态</text>
  <text x="338" y="470" font-size="11" fill="#733428" text-anchor="middle">无进程可推进</text>
  <text x="338" y="490" font-size="10.5" fill="#733428" text-anchor="middle">互相等待</text>
  <rect x="72" y="604" width="178" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="161" y="633" font-size="12.0" fill="#2C4460" font-weight="700" text-anchor="middle">State = Safe ∪ Unsafe</text>
  <rect x="266" y="604" width="178" height="46" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="355" y="633" font-size="12.5" fill="#733428" font-weight="700" text-anchor="middle">Deadlock ⊂ Unsafe</text>
  <rect x="72" y="665" width="372" height="38" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.0"/>
  <text x="258" y="689" font-size="10.9" fill="#4A473F" font-weight="700" text-anchor="middle">Safe ∩ Unsafe = ∅；Unsafe ≠ Deadlock（未必已卡死）</text>
  <rect x="492" y="110" width="700" height="610" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="516" y="145" font-size="15" fill="#4A473F" font-weight="700">B · Resource-Request Algorithm：三道门 + 一次事务</text>
  <text x="516" y="169" font-size="12" fill="#6B675C">① 不越界　② 当前可供给　③ 试分配后仍安全</text>
  <line x1="548" y1="235" x2="548" y2="620" fill="none" stroke="#D8D5C8" stroke-width="2.0"/>
  <circle cx="548" cy="298" r="15" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="548" y="303" font-size="11.5" fill="#6B4E28" font-weight="700" text-anchor="middle">1</text>
  <circle cx="548" cy="388" r="15" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="548" y="393" font-size="11.5" fill="#6B4E28" font-weight="700" text-anchor="middle">2</text>
  <circle cx="548" cy="574" r="15" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="548" y="579" font-size="11.5" fill="#2C4460" font-weight="700" text-anchor="middle">3</text>
  <rect x="640" y="194" width="240" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="760" y="216" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Requestᵢ</text>
  <text x="760" y="236" font-size="10.8" fill="#2C4460" text-anchor="middle">进程 i 的本次请求向量</text>
  <line x1="760" y1="246" x2="760" y2="262" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <polygon points="760,262 892,298 760,334 628,298" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="760" y="294" font-size="12.5" fill="#6B4E28" font-weight="700" text-anchor="middle">Requestᵢ ≤ Needᵢ ?</text>
  <text x="760" y="313" font-size="10.5" fill="#7B6342" text-anchor="middle">不超过已声明 Max</text>
  <line x1="892" y1="298" x2="958" y2="298" fill="none" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <text x="916" y="287" font-size="10.5" fill="#A64B3C" font-weight="700">否</text>
  <rect x="960" y="270" width="204" height="56" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="1062" y="292" font-size="12.3" fill="#733428" font-weight="700" text-anchor="middle">拒绝：越界请求</text>
  <text x="1062" y="313" font-size="10.5" fill="#733428" text-anchor="middle">违反最大需求声明</text>
  <line x1="760" y1="334" x2="760" y2="352" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="773" y="348" font-size="10.3" fill="#4A473F" font-weight="700">是</text>
  <polygon points="760,352 892,388 760,424 628,388" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="760" y="384" font-size="12.5" fill="#6B4E28" font-weight="700" text-anchor="middle">Requestᵢ ≤ Available ?</text>
  <text x="760" y="403" font-size="10.5" fill="#7B6342" text-anchor="middle">当前资源是否够</text>
  <line x1="892" y1="388" x2="958" y2="388" fill="none" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <text x="916" y="377" font-size="10.5" fill="#8A6A3A" font-weight="700">否</text>
  <rect x="960" y="360" width="204" height="56" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="1062" y="382" font-size="12.3" fill="#6B4E28" font-weight="700" text-anchor="middle">等待：暂时不可用</text>
  <text x="1062" y="403" font-size="10.5" fill="#6B4E28" text-anchor="middle">状态不变，稍后重试</text>
  <line x1="760" y1="424" x2="760" y2="442" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="773" y="438" font-size="10.3" fill="#4A473F" font-weight="700">是</text>
  <rect x="618" y="444" width="284" height="90" rx="9" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="760" y="467" font-size="12.8" fill="#2C4460" font-weight="700" text-anchor="middle">试分配（tentative update）</text>
  <text x="760" y="489" font-size="10.8" fill="#2C4460" text-anchor="middle">Available −= Requestᵢ</text>
  <text x="760" y="507" font-size="10.8" fill="#2C4460" text-anchor="middle">Allocationᵢ += Requestᵢ</text>
  <text x="760" y="525" font-size="10.8" fill="#2C4460" text-anchor="middle">Needᵢ −= Requestᵢ</text>
  <line x1="760" y1="534" x2="760" y2="548" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <polygon points="760,548 902,588 760,628 618,588" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="760" y="582" font-size="12.5" fill="#2C4460" font-weight="700" text-anchor="middle">Safety(试分配后状态) ?</text>
  <text x="760" y="602" font-size="10.5" fill="#2C4460" text-anchor="middle">是否覆盖全部进程</text>
  <path d="M618,588 H584 V650" fill="none" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arr-green)"/>
  <text x="596" y="578" font-size="10.5" fill="#2F6B5E" font-weight="700">是</text>
  <rect x="516" y="652" width="194" height="50" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="613" y="674" font-size="12.5" fill="#24473F" font-weight="700" text-anchor="middle">COMMIT · 批准请求</text>
  <text x="613" y="693" font-size="10.3" fill="#24473F" text-anchor="middle">保留试分配结果</text>
  <path d="M902,588 H954 V650" fill="none" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#arr-red)"/>
  <text x="920" y="578" font-size="10.5" fill="#A64B3C" font-weight="700">否</text>
  <rect x="956" y="652" width="208" height="50" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1060" y="674" font-size="12.5" fill="#733428" font-weight="700" text-anchor="middle">ROLLBACK · 推迟请求</text>
  <text x="1060" y="693" font-size="10.3" fill="#733428" text-anchor="middle">完整撤销三项更新</text>
  <rect x="48" y="744" width="1144" height="34" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="620" y="766" font-size="12.3" fill="#2C4460" font-weight="700" text-anchor="middle">批准条件：Requestᵢ ≤ Needᵢ ∧ Requestᵢ ≤ Available ∧ Safety(trial_state) = true</text>
</svg>