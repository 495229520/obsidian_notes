<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="880px" height="470px" viewBox="0 0 880 470" version="1.1">
  <rect x="0" y="0" width="880" height="470" fill="rgb(245, 244, 237)" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#666" />
    </marker>
  </defs>

  <text fill="#222" font-size="22" font-weight="700" font-family="system-ui, sans-serif" x="440" y="34" text-anchor="middle">166. 分数到小数：竖式除法 + 余数记忆</text>
  <text fill="#666" font-size="14" font-family="system-ui, sans-serif" x="440" y="60" text-anchor="middle">整数部分直接相除，小数部分模拟竖式；同一个余数再次出现，就是循环节的开始</text>
  <line stroke="#d9d5c9" stroke-width="1" x1="36" y1="84" x2="844" y2="84" />

  <!-- Step 1 -->
  <rect fill="#eef2f7" stroke="#b9c8da" stroke-width="1.4" x="40" y="108" width="240" height="124" rx="10" />
  <text fill="#2c5070" font-size="16" font-weight="700" font-family="system-ui, sans-serif" x="160" y="136" text-anchor="middle">① 处理符号</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="160" y="166" text-anchor="middle">(a &lt; 0) ^ (b &lt; 0)</text>
  <text fill="#555" font-size="13" font-family="system-ui, sans-serif" x="160" y="192" text-anchor="middle">一正一负 → 结果为负</text>
  <text fill="#888" font-size="12" font-family="system-ui, sans-serif" x="160" y="214" text-anchor="middle">再用 llabs 转正，防溢出</text>

  <!-- Step 2 -->
  <rect fill="#eef2f7" stroke="#b9c8da" stroke-width="1.4" x="320" y="108" width="240" height="124" rx="10" />
  <text fill="#2c5070" font-size="16" font-weight="700" font-family="system-ui, sans-serif" x="440" y="136" text-anchor="middle">② 整数部分</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="440" y="166" text-anchor="middle">ans += a / b</text>
  <text fill="#555" font-size="13" font-family="system-ui, sans-serif" x="440" y="192" text-anchor="middle">余数 rem = a % b</text>
  <text fill="#888" font-size="12" font-family="system-ui, sans-serif" x="440" y="214" text-anchor="middle">rem == 0 直接结束</text>

  <!-- Step 3 -->
  <rect fill="#e4f2e8" stroke="#78b887" stroke-width="1.6" x="600" y="108" width="240" height="124" rx="10" />
  <text fill="#246b45" font-size="16" font-weight="700" font-family="system-ui, sans-serif" x="720" y="136" text-anchor="middle">③ 小数部分</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="720" y="166" text-anchor="middle">rem ×10, 取商作下一位</text>
  <text fill="#555" font-size="13" font-family="system-ui, sans-serif" x="720" y="192" text-anchor="middle">记录每个余数的位置</text>
  <text fill="#888" font-size="12" font-family="system-ui, sans-serif" x="720" y="214" text-anchor="middle">循环模拟竖式除法</text>

  <line stroke="#666" stroke-width="1.6" marker-end="url(#arrow)" x1="282" y1="170" x2="316" y2="170" />
  <line stroke="#666" stroke-width="1.6" marker-end="url(#arrow)" x1="562" y1="170" x2="596" y2="170" />

  <!-- Insight panel -->
  <rect fill="#fff8ec" stroke="#e3c890" stroke-width="1.4" x="40" y="262" width="800" height="178" rx="10" />
  <text fill="#9a6b1e" font-size="17" font-weight="700" font-family="system-ui, sans-serif" x="64" y="294">核心洞察：余数决定一切</text>

  <text fill="#444" font-size="14.5" font-family="system-ui, sans-serif" x="64" y="326">竖式除法里，下一位商完全由「当前余数」决定。所以只要某个余数第二次出现，</text>
  <text fill="#444" font-size="14.5" font-family="system-ui, sans-serif" x="64" y="350">后面的数字必然原样重复 —— 这一段就是循环节。</text>

  <rect fill="#ffffff" stroke="#d8c49a" stroke-width="1.2" x="64" y="368" width="752" height="56" rx="8" />
  <text fill="#333" font-size="14" font-family="system-ui, sans-serif" x="80" y="392">做法：用哈希表记录</text>
  <text fill="#b03b2e" font-size="14" font-weight="700" font-family="ui-monospace, monospace" x="208" y="392">余数 → 它在结果串中的位置</text>
  <text fill="#333" font-size="14" font-family="system-ui, sans-serif" x="80" y="414">余数重复时，在记录的位置插入 "(" ，并在末尾补上 ")" ，循环节就被括起来了。</text>
</svg>
