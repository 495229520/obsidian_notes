<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>ICMP 差错报文的结构与常见 Type Code</title>
  <desc>上半部分拆开一个 ICMP 差错报文的四段结构，并把 ICMP 首部和回带的原始数据前八字节分别放大，说明那八字节里为什么一定包含源端口和目的端口；下半部分并列列出常见的 ICMPv4 与 ICMPv6 类型。</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">ICMP 差错报文为什么要回带原报文的前 8 字节</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">那 8 字节里一定装着源端口和目的端口，内核靠它把差错投递回出错的那个 socket</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="102" width="1144" height="310" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 路由器发回来的这一坨，一共四段</text>

  <rect x="92" y="152" width="200" height="50" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="192" y="173" font-size="12" fill="#4A473F" text-anchor="middle">新 IP 首部</text>
  <text x="192" y="191" font-size="11" fill="#6B675C" text-anchor="middle">路由器 → 发起方</text>

  <rect x="292" y="152" width="200" height="50" rx="4" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="392" y="173" font-size="12" fill="#6B4E28" text-anchor="middle">ICMP 首部</text>
  <text x="392" y="191" font-size="11" fill="#6B4E28" text-anchor="middle">8 字节</text>

  <rect x="492" y="152" width="280" height="50" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="632" y="173" font-size="12" fill="#2C4460" text-anchor="middle">出错那个报文的 IP 首部</text>
  <text x="632" y="191" font-size="11" fill="#2C4460" text-anchor="middle">原样抄回来</text>

  <rect x="772" y="152" width="380" height="50" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="962" y="173" font-size="12" fill="#24473F" text-anchor="middle">出错那个报文的前 8 字节数据</text>
  <text x="962" y="191" font-size="11" fill="#24473F" text-anchor="middle">关键就在这一段</text>

  <line x1="392" y1="202" x2="392" y2="236" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="962" y1="202" x2="962" y2="236" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="92" y="256" font-size="11.5" font-weight="700" fill="#6B4E28">ICMP 首部展开</text>
  <rect x="92" y="264" width="90" height="40" rx="4" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="137" y="288" font-size="11" fill="#6B4E28" text-anchor="middle">Type 1</text>
  <rect x="182" y="264" width="90" height="40" rx="4" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="227" y="288" font-size="11" fill="#6B4E28" text-anchor="middle">Code 1</text>
  <rect x="272" y="264" width="110" height="40" rx="4" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="327" y="288" font-size="11" fill="#6B4E28" text-anchor="middle">Checksum 2</text>
  <rect x="382" y="264" width="110" height="40" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="437" y="288" font-size="11" fill="#4A473F" text-anchor="middle">随类型而定 4</text>
  <text x="92" y="330" font-size="11" fill="#6B675C">Type 3 Code 4 就把下一跳 MTU 放在最后那 4 字节里</text>

  <text x="772" y="256" font-size="11.5" font-weight="700" fill="#24473F">上层是 UDP 时，这 8 字节正好是整个 UDP 首部</text>
  <rect x="772" y="264" width="95" height="40" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="819" y="288" font-size="11" fill="#24473F" text-anchor="middle">源端口 2</text>
  <rect x="867" y="264" width="95" height="40" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="914" y="288" font-size="11" fill="#24473F" text-anchor="middle">目的端口 2</text>
  <rect x="962" y="264" width="95" height="40" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1009" y="288" font-size="11" fill="#4A473F" text-anchor="middle">长度 2</text>
  <rect x="1057" y="264" width="95" height="40" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1104" y="288" font-size="11" fill="#4A473F" text-anchor="middle">校验和 2</text>

  <text x="772" y="330" font-size="11.5" font-weight="700" fill="#24473F">上层是 TCP 时，够到源端口、目的端口和序号</text>
  <rect x="772" y="338" width="95" height="40" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="819" y="362" font-size="11" fill="#24473F" text-anchor="middle">源端口 2</text>
  <rect x="867" y="338" width="95" height="40" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="914" y="362" font-size="11" fill="#24473F" text-anchor="middle">目的端口 2</text>
  <rect x="962" y="338" width="190" height="40" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1057" y="362" font-size="11" fill="#4A473F" text-anchor="middle">序号 4</text>

  <text x="92" y="362" font-size="12" font-weight="700" fill="#733428">两个端口一到手，四元组就齐了</text>
  <text x="92" y="386" font-size="11.5" fill="#4A473F">内核据此找到那条连接，把错误交给正在等的 send 或 recv</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="430" width="1144" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="458" font-size="15" font-weight="700" fill="#4A473F">B · 认这几个 Type 就够用了</text>

  <text x="72" y="488" font-size="11" font-weight="700" fill="#3D5A80">ICMPv4　Type / Code</text>
  <text x="240" y="488" font-size="11" font-weight="700" fill="#6B675C">含义</text>
  <text x="640" y="488" font-size="11" font-weight="700" fill="#2F6B5E">ICMPv6　Type</text>
  <text x="790" y="488" font-size="11" font-weight="700" fill="#6B675C">含义</text>
  <line x1="72" y1="496" x2="1168" y2="496" stroke="#D8D5C8" stroke-width="1"/>

  <text x="72" y="522" font-size="11.5" fill="#2B2A26">8 / 0</text>
  <text x="240" y="522" font-size="11.5" fill="#4A473F">Echo Request，ping 发出去的那个</text>
  <text x="640" y="522" font-size="11.5" fill="#2B2A26">128 / 129</text>
  <text x="790" y="522" font-size="11.5" fill="#4A473F">Echo Request / Reply</text>

  <text x="72" y="548" font-size="11.5" fill="#2B2A26">0 / 0</text>
  <text x="240" y="548" font-size="11.5" fill="#4A473F">Echo Reply</text>
  <text x="640" y="548" font-size="11.5" fill="#2B2A26">1</text>
  <text x="790" y="548" font-size="11.5" fill="#4A473F">目的不可达</text>

  <text x="72" y="574" font-size="11.5" fill="#2B2A26">3 / 3</text>
  <text x="240" y="574" font-size="11.5" fill="#4A473F">端口不可达，UDP traceroute 的终点信号</text>
  <text x="640" y="574" font-size="11.5" fill="#2B2A26">2</text>
  <text x="790" y="574" font-size="11.5" fill="#733428">Packet Too Big，PMTUD 全靠它</text>

  <text x="72" y="600" font-size="11.5" fill="#2B2A26">3 / 4</text>
  <text x="240" y="600" font-size="11.5" fill="#733428">要分片但设了 DF，后 4 字节带下一跳 MTU</text>
  <text x="640" y="600" font-size="11.5" fill="#2B2A26">3</text>
  <text x="790" y="600" font-size="11.5" fill="#4A473F">Hop Limit 耗尽</text>

  <text x="72" y="626" font-size="11.5" fill="#2B2A26">11 / 0</text>
  <text x="240" y="626" font-size="11.5" fill="#4A473F">TTL 耗尽，traceroute 靠它逼出每一跳</text>
  <text x="640" y="626" font-size="11.5" fill="#2B2A26">135 / 136</text>
  <text x="790" y="626" font-size="11.5" fill="#4A473F">邻居请求 / 通告，取代 ARP</text>

  <text x="72" y="652" font-size="11.5" fill="#2B2A26">5</text>
  <text x="240" y="652" font-size="11.5" fill="#4A473F">Redirect，网关说有更近的下一跳</text>
  <text x="640" y="652" font-size="11.5" fill="#2B2A26">133 / 134</text>
  <text x="790" y="652" font-size="11.5" fill="#4A473F">路由器请求 / 通告，地址自动配置</text>

  <text x="48" y="706" font-size="11.5" fill="#6B675C">ICMPv6 把 1～127 定为差错、128～255 定为信息，看 Type 的最高位就知道出没出错</text>
</svg>
