<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 684" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <title>回声服务器的两层循环</title>
  <desc>回声服务器的外层循环换客户端、内层循环换消息；配一次完整会话的时序，以及 recv 返回值的四种分支各自的正确处理方式。</desc>

  <rect x="0" y="0" width="1240" height="684" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">回声服务器的两层循环：外层换客户端，内层换消息</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">少写内层循环，一条连接只能收发一次；内层的退出条件写错，服务器会卡在死循环里再也不 accept</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="104" width="560" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="15" font-weight="700" fill="#4A473F">A · 循环的嵌套关系</text>

  <rect x="72" y="148" width="488" height="238" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="90" y="172" font-size="12.5" font-weight="700" fill="#6B4E28">外层 while(1)　一次一个客户端</text>

  <rect x="92" y="182" width="448" height="34" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="316" y="204" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">connfd = accept(listenfd, ...)</text>

  <rect x="92" y="224" width="448" height="110" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="110" y="246" font-size="12" font-weight="700" fill="#24473F">内层 while(1)　同一条连接上的多条消息</text>

  <rect x="112" y="256" width="188" height="32" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="206" y="277" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">recv(connfd, ...)</text>
  <path d="M304 272 L328 272" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="332" y="256" width="188" height="32" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="426" y="277" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">send(connfd, ...)</text>

  <text x="112" y="312" font-size="11" font-weight="700" fill="#733428">recv 返回 0 或 −1 时 break，跳出的是内层</text>
  <text x="112" y="328" font-size="11" fill="#24473F">每轮发完要把 read_len 归零，准备下一条</text>

  <rect x="92" y="342" width="448" height="32" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="316" y="363" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">close(connfd)　然后回到外层再 accept</text>

  <!-- ============ Panel B ============ -->
  <rect x="624" y="104" width="568" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="648" y="134" font-size="15" font-weight="700" fill="#4A473F">B · 一次会话的往返</text>

  <text x="712" y="160" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">客户端</text>
  <text x="1072" y="160" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">服务器</text>
  <path d="M712 170 L712 378" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M1072 170 L1072 378" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="4 4"/>

  <path d="M712 196 L1068 196" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="890" y="190" font-size="11" fill="#4A473F" text-anchor="middle">connect() 三次握手</text>

  <path d="M712 232 L1068 232" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="890" y="226" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">send("Hello, Echo Server!")</text>
  <text x="1084" y="252" font-size="10.5" fill="#24473F">recv 返回 19</text>

  <path d="M1068 282 L716 282" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="890" y="276" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">send(buf, 19) 原样回传</text>
  <text x="648" y="302" font-size="10.5" fill="#2C4460">打印 Echo received</text>

  <path d="M712 334 L1068 334" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrR)"/>
  <text x="890" y="328" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">close() 发出 FIN</text>
  <text x="1084" y="354" font-size="10.5" font-weight="700" fill="#733428">recv 返回 0</text>
  <text x="1084" y="371" font-size="10.5" font-weight="700" fill="#733428">跳出内层</text>

  <!-- ============ Panel C ============ -->
  <rect x="48" y="420" width="1144" height="204" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="450" font-size="15" font-weight="700" fill="#4A473F">C · recv 的返回值有四种分支，只处理一种就是 bug</text>

  <text x="88" y="476" font-size="11" font-weight="700" fill="#6B675C">返回值</text>
  <text x="250" y="476" font-size="11" font-weight="700" fill="#6B675C">含义</text>
  <text x="600" y="476" font-size="11" font-weight="700" fill="#6B675C">正确处理</text>
  <path d="M72 484 L1168 484" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="72" y="490" width="1096" height="30" fill="#DCE9E3"/>
  <text x="88" y="510" font-size="11.5" font-weight="700" fill="#24473F">&gt; 0</text>
  <text x="250" y="510" font-size="11.5" fill="#24473F">这次拷进来这么多字节</text>
  <text x="600" y="510" font-size="11.5" fill="#24473F">累加进 read_len，继续判断收够了没</text>

  <rect x="72" y="522" width="1096" height="30" fill="#E3EAF4"/>
  <text x="88" y="542" font-size="11.5" font-weight="700" fill="#2C4460">== 0</text>
  <text x="250" y="542" font-size="11.5" fill="#2C4460">对端有序关闭，发来了 FIN</text>
  <text x="600" y="542" font-size="11.5" fill="#2C4460">正常路径，break 出内层并 close(connfd)</text>

  <rect x="72" y="554" width="1096" height="30" fill="#EFE7DA"/>
  <text x="88" y="574" font-size="11.5" font-weight="700" fill="#6B4E28">−1，EINTR</text>
  <text x="250" y="574" font-size="11.5" fill="#6B4E28">被信号打断</text>
  <text x="600" y="574" font-size="11.5" fill="#6B4E28">重试，不能当成连接断了</text>

  <rect x="72" y="586" width="1096" height="30" fill="#F0E0DB"/>
  <text x="88" y="606" font-size="11.5" font-weight="700" fill="#733428">−1，其他</text>
  <text x="250" y="606" font-size="11.5" fill="#733428">ECONNRESET 等真错误</text>
  <text x="600" y="606" font-size="11.5" fill="#733428">记 errno 后关闭连接，别继续用这个 fd</text>

  <text x="48" y="660" font-size="12" fill="#6B675C">口径：以阻塞套接字为准。非阻塞模式下 −1 还会带 EAGAIN / EWOULDBLOCK，表示「暂时没数据」，也不是错误</text>
</svg>
