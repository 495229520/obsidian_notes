<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680"
     font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif">
  <title>iovec 与 MSG_ZEROCOPY 的发送路径和生命周期</title>
  <desc>展示 iovec 省去用户态拼接，MSG_ZEROCOPY 尝试省去用户到内核的数据拷贝，并强调错误队列完成通知才允许复用缓冲区。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" fill="#F5F4ED"/>

  <text x="48" y="40" font-size="22" font-weight="700" fill="#2B2A26">从 iovec 到 MSG_ZEROCOPY：减少的是两次不同的拷贝</text>
  <text x="48" y="66" font-size="14" fill="#6B675C">iovec 避免用户态拼接；MSG_ZEROCOPY 追加发送页完成账本。</text>

  <!-- user space -->
  <rect x="36" y="92" width="1168" height="190" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="58" y="122" font-size="15" font-weight="700" fill="#4A473F">A · 用户态：保持原有分段，不先 memcpy 成一个大 buffer</text>

  <rect x="62" y="150" width="122" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="91" y="174" font-size="13" font-weight="700" fill="#2C4460">RPC header</text>
  <text x="100" y="192" font-size="11" fill="#2C4460">owned</text>
  <rect x="198" y="150" width="122" height="54" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="224" y="174" font-size="13" font-weight="700" fill="#6B5B95">metadata</text>
  <text x="236" y="192" font-size="11" fill="#6B5B95">owned</text>
  <rect x="334" y="150" width="190" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="384" y="174" font-size="13" font-weight="700" fill="#24473F">large payload</text>
  <text x="391" y="192" font-size="11" fill="#24473F">shared / pooled</text>

  <path d="M184 177 L198 177" stroke="#5A564B" stroke-width="1.4"/>
  <path d="M320 177 L334 177" stroke="#5A564B" stroke-width="1.4"/>

  <path d="M524 177 L590 177" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="590" y="142" width="160" height="70" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="623" y="167" font-size="13" font-weight="700" fill="#6B4E28">iovec[0..2]</text>
  <text x="611" y="187" font-size="12" fill="#6B4E28">base + len views</text>
  <text x="618" y="203" font-size="11" fill="#6B4E28">descriptor 可临时</text>

  <path d="M750 177 L818 177" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="818" y="142" width="142" height="70" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="850" y="168" font-size="13" font-weight="700" fill="#2C4460">sendmsg()</text>
  <text x="839" y="188" font-size="11" fill="#2C4460">normal / ZC flag</text>
  <text x="847" y="204" font-size="11" fill="#2C4460">可能短发送</text>

  <rect x="982" y="132" width="196" height="91" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1000" y="155" font-size="12" font-weight="700" fill="#4A473F">共同约束</text>
  <text x="1000" y="176" font-size="11" fill="#4A473F">TCP 不保留消息边界</text>
  <text x="1000" y="194" font-size="11" fill="#4A473F">短发送按已接受字节续传</text>
  <text x="1000" y="212" font-size="11" fill="#4A473F">iov 数量受 IOV_MAX 限制</text>

  <rect x="62" y="226" width="1092" height="44" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="82" y="244" font-size="12" fill="#6B4E28">iovec 只描述分段，不拥有字节；EAGAIN 后可重建 descriptor。</text>
  <text x="82" y="262" font-size="12" fill="#6B4E28">原始三段 buffer 仍须保持地址稳定。</text>

  <!-- kernel paths -->
  <rect x="36" y="302" width="1168" height="224" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="58" y="332" font-size="15" font-weight="700" fill="#4A473F">B · 内核发送侧：普通 copy 路径与 MSG_ZEROCOPY 路径</text>

  <!-- normal path -->
  <rect x="62" y="356" width="500" height="142" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="82" y="382" font-size="13" font-weight="700" fill="#2C4460">普通 sendmsg</text>
  <rect x="84" y="406" width="124" height="50" rx="7" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="107" y="428" font-size="12" fill="#2C4460">user bytes</text>
  <text x="107" y="445" font-size="11" fill="#2C4460">可在返回后复用</text>
  <path d="M208 431 L286 431" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="225" y="418" font-size="11" fill="#2C4460">memcpy</text>
  <rect x="286" y="406" width="114" height="50" rx="7" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="313" y="428" font-size="12" fill="#2C4460">kernel skb</text>
  <text x="319" y="445" font-size="11" fill="#2C4460">private copy</text>
  <path d="M400 431 L468 431" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <rect x="468" y="406" width="72" height="50" rx="7" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="488" y="436" font-size="12" fill="#2C4460">NIC</text>
  <text x="84" y="480" font-size="11" fill="#2C4460">代价：按字节复制；优点：syscall 返回后不再借用用户 buffer。</text>

  <!-- zero-copy path -->
  <rect x="584" y="356" width="594" height="142" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="604" y="382" font-size="13" font-weight="700" fill="#6B4E28">MSG_ZEROCOPY（hint，不是保证）</text>
  <rect x="606" y="406" width="126" height="50" rx="7" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="628" y="428" font-size="12" fill="#6B4E28">user pages</text>
  <text x="622" y="445" font-size="11" fill="#A64B3C">不可改写 / 释放</text>
  <path d="M732 431 L812 431" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="748" y="418" font-size="11" fill="#6B4E28">pin / ref</text>
  <rect x="812" y="406" width="114" height="50" rx="7" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="837" y="428" font-size="12" fill="#6B4E28">TCP stack</text>
  <text x="835" y="445" font-size="11" fill="#6B4E28">may defer copy</text>
  <path d="M926 431 L986 431" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="986" y="406" width="70" height="50" rx="7" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="1005" y="436" font-size="12" fill="#6B4E28">NIC</text>
  <path d="M869 456 L869 471 L1058 471" stroke="#A64B3C" stroke-width="1.6" fill="none" marker-end="url(#arrRed)"/>
  <text x="924" y="466" font-size="10.5" fill="#733428">release hold</text>
  <rect x="1064" y="458" width="96" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.1"/>
  <text x="1077" y="476" font-size="11" fill="#733428">ERRQUEUE range</text>
  <text x="606" y="480" font-size="11" fill="#6B4E28">完成通知只表示可复用共享页；不表示已发完，更不表示远端 RPC 成功。</text>

  <!-- lifecycle -->
  <rect x="36" y="546" width="1168" height="104" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="58" y="575" font-size="15" font-weight="700" fill="#4A473F">C · RPC 框架必须维护的 buffer 生命周期账本</text>

  <rect x="66" y="594" width="142" height="38" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="106" y="618" font-size="12" font-weight="700" fill="#24473F">Owned</text>
  <path d="M208 613 L270 613" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="270" y="594" width="142" height="38" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="306" y="618" font-size="12" font-weight="700" fill="#2C4460">Submitted</text>
  <path d="M412 613 L474 613" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="474" y="586" width="204" height="54" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="520" y="608" font-size="12" font-weight="700" fill="#733428">In flight / immutable</text>
  <text x="511" y="627" font-size="11" fill="#733428">sendmsg 已返回也不能复用</text>
  <path d="M678 613 L740 613" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="740" y="594" width="190" height="38" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="770" y="618" font-size="12" font-weight="700" fill="#6B4E28">ZC completion [a,b]</text>
  <path d="M930 613 L992 613" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="992" y="594" width="166" height="38" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1034" y="618" font-size="12" font-weight="700" fill="#24473F">Reusable</text>
</svg>
