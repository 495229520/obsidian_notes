<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680"
     font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif">
  <title>iovec 与 MSG_ZEROCOPY 的发送路径和生命周期</title>
  <desc>展示 iovec 省去用户态拼接，MSG_ZEROCOPY 尝试省去用户到内核的数据拷贝，并强调错误队列完成通知才允许复用缓冲区。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#5A564B"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#A64B3C"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>

  <text x="48" y="40" font-size="22" font-weight="700" fill="#2B2A26">从 iovec 到 MSG_ZEROCOPY：减少的是两次不同的拷贝</text>
  <text x="48" y="66" font-size="14" fill="#6B675C">iovec 避免用户态拼接；MSG_ZEROCOPY 追加发送页完成账本。</text>

  <!-- Panel A: User space -->
  <rect x="36" y="92" width="1168" height="190" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="58" y="122" font-size="15" font-weight="700" fill="#4A473F">A · 用户态：保持原有分段，不先 memcpy 成一个大 buffer</text>

  <!-- Three independent segments -->
  <rect x="62" y="148" width="118" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="121" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4460">RPC header</text>
  <text x="121" y="190" text-anchor="middle" font-size="11" fill="#2C4460">owned</text>

  <rect x="196" y="148" width="118" height="54" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="255" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5B95">metadata</text>
  <text x="255" y="190" text-anchor="middle" font-size="11" fill="#6B5B95">owned</text>

  <rect x="330" y="148" width="180" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="420" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#24473F">large payload</text>
  <text x="420" y="190" text-anchor="middle" font-size="11" fill="#24473F">shared / pooled</text>

  <!-- Segment gathering arrow into iovec -->
  <path d="M 510 175 L 576 175" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- iovec descriptor -->
  <rect x="582" y="140" width="160" height="70" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="662" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#6B4E28">iovec[0..2]</text>
  <text x="662" y="185" text-anchor="middle" font-size="12" fill="#6B4E28">base + len views</text>
  <text x="662" y="201" text-anchor="middle" font-size="11" fill="#6B4E28">descriptor 可临时</text>

  <path d="M 742 175 L 804 175" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- sendmsg box -->
  <rect x="810" y="140" width="150" height="70" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="885" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4460">sendmsg()</text>
  <text x="885" y="186" text-anchor="middle" font-size="11" fill="#2C4460">normal / ZC flag</text>
  <text x="885" y="202" text-anchor="middle" font-size="11" fill="#2C4460">可能短发送</text>

  <!-- Common constraints -->
  <rect x="980" y="134" width="204" height="82" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="998" y="154" font-size="12" font-weight="700" fill="#4A473F">共同约束</text>
  <text x="998" y="173" font-size="11" fill="#4A473F">TCP 不保留消息边界</text>
  <text x="998" y="190" font-size="11" fill="#4A473F">短发送按已接受字节续传</text>
  <text x="998" y="207" font-size="11" fill="#4A473F">iov 数量受 IOV_MAX 限制</text>

  <!-- Panel A bottom notice -->
  <rect x="62" y="228" width="1122" height="42" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="82" y="245" font-size="12" fill="#6B4E28">iovec 只描述分段，不拥有字节；EAGAIN 后可重建 descriptor。</text>
  <text x="82" y="261" font-size="12" fill="#6B4E28">原始三段 buffer 仍须保持地址稳定。</text>

  <!-- Panel B: Kernel sending paths -->
  <rect x="36" y="298" width="1168" height="226" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="58" y="328" font-size="15" font-weight="700" fill="#4A473F">B · 内核发送侧：普通 copy 路径与 MSG_ZEROCOPY 路径</text>

  <!-- Normal sendmsg subpanel -->
  <rect x="62" y="348" width="490" height="158" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="82" y="374" font-size="13" font-weight="700" fill="#2C4460">普通 sendmsg</text>

  <rect x="82" y="394" width="116" height="50" rx="7" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="140" y="416" text-anchor="middle" font-size="12" fill="#2C4460">user bytes</text>
  <text x="140" y="433" text-anchor="middle" font-size="11" fill="#2C4460">可在返回后复用</text>

  <path d="M 198 419 L 268 419" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="236" y="408" text-anchor="middle" font-size="11" fill="#2C4460">memcpy</text>

  <rect x="274" y="394" width="116" height="50" rx="7" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="332" y="416" text-anchor="middle" font-size="12" fill="#2C4460">kernel skb</text>
  <text x="332" y="433" text-anchor="middle" font-size="11" fill="#2C4460">private copy</text>

  <path d="M 390 419 L 448 419" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrBlue)"/>

  <rect x="454" y="394" width="76" height="50" rx="7" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="492" y="424" text-anchor="middle" font-size="12" fill="#2C4460">NIC</text>

  <text x="82" y="482" font-size="11" fill="#2C4460">代价：按字节复制；优点：syscall 返回后不再借用用户 buffer。</text>

  <!-- Zero-copy subpanel -->
  <rect x="572" y="348" width="612" height="158" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="592" y="374" font-size="13" font-weight="700" fill="#6B4E28">MSG_ZEROCOPY（hint，不是保证）</text>

  <rect x="592" y="392" width="122" height="50" rx="7" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="653" y="414" text-anchor="middle" font-size="12" fill="#6B4E28">user pages</text>
  <text x="653" y="431" text-anchor="middle" font-size="11" font-weight="700" fill="#A64B3C">不可改写 / 释放</text>

  <path d="M 714 417 L 774 417" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <text x="744" y="406" text-anchor="middle" font-size="11" fill="#6B4E28">pin / ref</text>

  <rect x="780" y="392" width="118" height="50" rx="7" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="839" y="414" text-anchor="middle" font-size="12" fill="#6B4E28">TCP stack</text>
  <text x="839" y="431" text-anchor="middle" font-size="11" fill="#6B4E28">may defer copy</text>

  <path d="M 898 417 L 948 417" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrAmber)"/>

  <rect x="954" y="392" width="68" height="50" rx="7" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="988" y="424" text-anchor="middle" font-size="12" fill="#6B4E28">NIC</text>

  <!-- Clear ERRQUEUE box and release hold notification path -->
  <rect x="1054" y="392" width="114" height="50" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1111" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#733428">ERRQUEUE</text>
  <text x="1111" y="431" text-anchor="middle" font-size="11" fill="#733428">release hold 通知</text>

  <!-- Asynchronous notification flow with ample space -->
  <path d="M 839 442 L 839 460 L 1111 460 L 1111 448" stroke="#A64B3C" stroke-width="1.5" fill="none" marker-end="url(#arrRed)"/>
  <text x="975" y="456" text-anchor="middle" font-size="10.5" font-weight="700" fill="#733428">异步完成通知（release hold）</text>

  <text x="592" y="490" font-size="11" fill="#6B4E28">完成通知只表示内核已释放页引用；不表示已发完，更不表示远端 RPC 成功。</text>

  <!-- Panel C: Lifecycle -->
  <rect x="36" y="540" width="1168" height="110" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="58" y="568" font-size="15" font-weight="700" fill="#4A473F">C · RPC 框架必须维护的 buffer 生命周期账本</text>

  <rect x="62" y="584" width="130" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="127" y="611" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">Owned</text>

  <path d="M 192 606 L 246 606" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="252" y="584" width="140" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="322" y="611" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4460">Submitted</text>

  <path d="M 392 606 L 448 606" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="454" y="576" width="220" height="58" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="564" y="600" text-anchor="middle" font-size="12" font-weight="700" fill="#733428">In flight / immutable</text>
  <text x="564" y="620" text-anchor="middle" font-size="11" fill="#733428">sendmsg 已返回也不能复用</text>

  <path d="M 674 606 L 730 606" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="736" y="584" width="200" height="44" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="836" y="611" text-anchor="middle" font-size="12" font-weight="700" fill="#6B4E28">ZC completion [a,b]</text>

  <path d="M 936 606 L 992 606" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="998" y="584" width="186" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1091" y="611" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">Reusable</text>
</svg>
