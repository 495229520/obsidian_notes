<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>Split 的两种提升：叶页 copy-up，内部页 push-up</title>
<desc>先看提升键留在哪里，再检查右页的第一个 child 是否仍然存在</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3" />
<text x="48" y="52" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">Split 的两种提升：叶页 copy-up，内部页 push-up</text>
<text x="48" y="82" font-size="14" fill="#6B675C" text-anchor="start">先看提升键留在哪里，再检查右页的第一个 child 是否仍然存在</text>
<rect x="48" y="112" width="1144" height="246" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<rect x="48" y="378" width="1144" height="258" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="72" y="143" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700">A · 叶页：30 仍是右叶页中的记录</text>
<text x="80" y="188" font-size="14" fill="#6B675C" text-anchor="start">逻辑重排序列</text>
<rect x="80" y="209" width="71" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="115.5" y="236.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">10</text>
<rect x="154" y="209" width="71" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="189.5" y="236.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">20</text>
<rect x="228" y="209" width="71" height="44" rx="4" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="263.5" y="236.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">30</text>
<rect x="302" y="209" width="71" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="337.5" y="236.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">40</text>
<rect x="376" y="209" width="71" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="411.5" y="236.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">50</text>
<text x="80" y="292" font-size="13" fill="#6B675C" text-anchor="start">并非向容量 4 的真实数组写入第 5 项</text>
<path d="M470,232 H552" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="510" y="215" font-size="13" fill="#2B2A26" text-anchor="middle">分发</text>
<text x="825" y="169" font-size="13" fill="#6B675C" text-anchor="middle">父页增加边界</text>
<rect x="748" y="180" width="154" height="38" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="825.0" y="204.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">… | 30 | …</text>
<rect x="586" y="273" width="75" height="40" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="623.5" y="298.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">10</text>
<rect x="664" y="273" width="75" height="40" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="701.5" y="298.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">20</text>
<rect x="886" y="273" width="75" height="40" rx="4" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="923.5" y="298.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">30</text>
<rect x="964" y="273" width="75" height="40" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="1001.5" y="298.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">40</text>
<rect x="1042" y="273" width="75" height="40" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="1079.5" y="298.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">50</text>
<text x="663" y="333" font-size="13" fill="#6B675C" text-anchor="middle">左叶 L</text>
<text x="1002" y="333" font-size="13" fill="#6B675C" text-anchor="middle">右叶 R</text>
<path d="M778,220 V235 H665 V269" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M875,220 V235 H1002 V269" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M925,273 V246 H826 V218" fill="none" stroke="#B07D2B" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="1095" y="232" font-size="13" fill="#8A6A3A" text-anchor="middle">copy-up</text>
<text x="72" y="338" font-size="14" fill="#6B675C" text-anchor="start">叶记录不能丢；父 key 只是路标的副本。</text>
<text x="72" y="409" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700">B · 内部页：40 只在父层有效，C2 成为右页 child[0]</text>
<text x="80" y="455" font-size="14" fill="#6B675C" text-anchor="start">key / child 的逻辑配对</text>
<rect x="80" y="471" width="71" height="38" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="115.5" y="495.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">⊥</text>
<rect x="154" y="471" width="71" height="38" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="189.5" y="495.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">20</text>
<rect x="228" y="471" width="71" height="38" rx="4" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="263.5" y="495.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">40</text>
<rect x="302" y="471" width="71" height="38" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="337.5" y="495.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">60</text>
<rect x="376" y="471" width="71" height="38" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="411.5" y="495.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">80</text>
<rect x="80" y="515" width="71" height="38" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="115.5" y="539.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">C0</text>
<rect x="154" y="515" width="71" height="38" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="189.5" y="539.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">C1</text>
<rect x="228" y="515" width="71" height="38" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="263.5" y="539.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">C2</text>
<rect x="302" y="515" width="71" height="38" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="337.5" y="539.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">C3</text>
<rect x="376" y="515" width="71" height="38" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="411.5" y="539.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">C4</text>
<path d="M470,516 H552" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="510" y="498" font-size="13" fill="#2B2A26" text-anchor="middle">分发</text>
<rect x="748" y="444" width="154" height="38" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="825.0" y="468.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">… | 40 | …</text>
<rect x="586" y="529" width="75" height="36" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="623.5" y="552.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">⊥</text>
<rect x="664" y="529" width="75" height="36" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="701.5" y="552.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">20</text>
<rect x="586" y="571" width="75" height="36" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="623.5" y="594.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">C0</text>
<rect x="664" y="571" width="75" height="36" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="701.5" y="594.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">C1</text>
<rect x="886" y="529" width="75" height="36" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="923.5" y="552.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">⊥</text>
<rect x="964" y="529" width="75" height="36" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="1001.5" y="552.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">60</text>
<rect x="1042" y="529" width="75" height="36" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="1079.5" y="552.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">80</text>
<rect x="886" y="571" width="75" height="36" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="923.5" y="594.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">C2</text>
<rect x="964" y="571" width="75" height="36" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="1001.5" y="594.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">C3</text>
<rect x="1042" y="571" width="75" height="36" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="1079.5" y="594.0" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="700">C4</text>
<path d="M778,484 V505 H665 V525" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M875,484 V505 H1002 V525" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1095" y="473" font-size="13" fill="#8A6A3A" text-anchor="middle">push-up</text>
<text x="72" y="594" font-size="14" fill="#6B675C" text-anchor="start">40 不再是右页有效 separator。</text>
<text x="72" y="617" font-size="14" fill="#6B675C" text-anchor="start">删除提升键，不代表删除对应的 C2。</text>
<text x="48" y="669" font-size="14" fill="#6B675C" text-anchor="start">图中的列表是逻辑表示；实际页数组的移位、容量、guard 与父页传播需要分别维护。</text>
</svg>
