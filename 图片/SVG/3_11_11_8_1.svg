<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>多进程并发服务器的主循环：accept 之后 fork，父子各关掉一个 fd</title>
  <desc>上半是两条泳道。父进程泳道走 socket/bind/listen、accept 阻塞、fork、close(conn_fd)，然后回到 accept；最右是 SIGCHLD 处理函数。子进程泳道从 fork 的另一支分出，关掉 listen_fd，在 conn_fd 上读写，最后 close 加 exit。下半是三个客户端同时在线时的进程与文件描述符快照，说明三个子进程的 conn_fd 编号相同但指向不同的 socket。</desc>
  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="s2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">一次 accept 之后，两条执行流各干什么</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">父进程从头到尾只做接连接和派活，真正跟客户端说话的永远是子进程</text>

  <text x="56" y="118" font-size="13" font-weight="700" fill="#4A473F">A · 主循环：accept 拿到连接就 fork，父进程立刻回去 accept</text>

  <!-- 父进程泳道 -->
  <rect x="48" y="132" width="1144" height="168" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="64" y="228" font-size="13" font-weight="700" fill="#4A473F">父进程</text>
  <text x="64" y="250" font-size="10.5" fill="#6B675C">只握 listen_fd</text>

  <rect x="164" y="186" width="164" height="90" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="180" y="214" font-size="11.5" font-weight="700" fill="#2C4460">① socket/bind/listen</text>
  <text x="180" y="236" font-size="10.5" fill="#2C4460">得到 listen_fd</text>
  <text x="180" y="256" font-size="10.5" fill="#2C4460">backlog 队列开始收连接</text>

  <rect x="364" y="186" width="180" height="90" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="382" y="214" font-size="11.5" font-weight="700" fill="#2C4460">② accept() 阻塞</text>
  <text x="382" y="236" font-size="10.5" fill="#2C4460">取一个握好手的连接</text>
  <text x="382" y="256" font-size="10.5" fill="#2C4460">返回新的 conn_fd</text>

  <rect x="580" y="186" width="180" height="90" rx="7" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.6"/>
  <text x="598" y="214" font-size="11.5" font-weight="700" fill="#6B4E28">③ fork()</text>
  <text x="598" y="236" font-size="10.5" fill="#6B4E28">父返回子 PID，子返回 0</text>
  <text x="598" y="256" font-size="10.5" fill="#6B4E28">两个 fd 都被复制一份</text>

  <rect x="796" y="186" width="180" height="90" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="814" y="214" font-size="11.5" font-weight="700" fill="#24473F">④ close(conn_fd)</text>
  <text x="814" y="236" font-size="10.5" fill="#24473F">这条连接归子进程了</text>
  <text x="814" y="256" font-size="10.5" fill="#24473F">父进程不再碰它</text>

  <rect x="1012" y="186" width="168" height="90" rx="7" fill="#EDEBE3" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="1028" y="214" font-size="11.5" font-weight="700" fill="#4A473F">SIGCHLD 处理函数</text>
  <text x="1028" y="236" font-size="10.5" fill="#4A473F">waitpid(WNOHANG) 循环收</text>
  <text x="1028" y="256" font-size="10.5" fill="#4A473F">收干净才不漏僵尸</text>

  <line x1="328" y1="231" x2="360" y2="231" stroke="#5A564B" stroke-width="1.6" marker-end="url(#s1)"/>
  <line x1="544" y1="231" x2="576" y2="231" stroke="#5A564B" stroke-width="1.6" marker-end="url(#s1)"/>
  <line x1="760" y1="231" x2="792" y2="231" stroke="#5A564B" stroke-width="1.6" marker-end="url(#s1)"/>

  <path d="M886,186 L886,160 L454,160 L454,182" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="670" y="154" font-size="10.5" fill="#4A473F" text-anchor="middle">关掉就回来接下一个</text>

  <!-- 子进程泳道 -->
  <rect x="48" y="340" width="1144" height="160" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="64" y="420" font-size="13" font-weight="700" fill="#4A473F">子进程</text>
  <text x="64" y="442" font-size="10.5" fill="#6B675C">各握一个 conn_fd</text>

  <rect x="580" y="376" width="180" height="96" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="598" y="404" font-size="11.5" font-weight="700" fill="#24473F">⑤ close(listen_fd)</text>
  <text x="598" y="426" font-size="10.5" fill="#24473F">子进程不接新连接</text>
  <text x="598" y="448" font-size="10.5" fill="#24473F">手里只剩 conn_fd</text>

  <rect x="796" y="376" width="180" height="96" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="814" y="404" font-size="11.5" font-weight="700" fill="#2C4460">⑥ read / write 循环</text>
  <text x="814" y="426" font-size="10.5" fill="#2C4460">慢 I/O 只卡住自己</text>
  <text x="814" y="448" font-size="10.5" fill="#2C4460">read 返回 0 即对端关闭</text>

  <rect x="1012" y="376" width="168" height="96" rx="7" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="1028" y="404" font-size="11.5" font-weight="700" fill="#6B4E28">⑦ close 后 exit(0)</text>
  <text x="1028" y="426" font-size="10.5" fill="#6B4E28">四次挥手在这里走完</text>
  <text x="1028" y="448" font-size="10.5" fill="#6B4E28">随即进入僵尸态</text>

  <line x1="670" y1="276" x2="670" y2="372" stroke="#5A564B" stroke-width="1.8" marker-end="url(#s1)"/>
  <text x="680" y="328" font-size="10.5" fill="#4A473F">fork 返回 0 的那一支</text>

  <line x1="760" y1="424" x2="792" y2="424" stroke="#5A564B" stroke-width="1.6" marker-end="url(#s1)"/>
  <line x1="976" y1="424" x2="1008" y2="424" stroke="#5A564B" stroke-width="1.6" marker-end="url(#s1)"/>

  <line x1="1096" y1="372" x2="1096" y2="280" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#s2)"/>
  <text x="1082" y="328" font-size="10.5" fill="#733428" text-anchor="end">exit 后内核发 SIGCHLD</text>

  <!-- B 区 -->
  <text x="56" y="528" font-size="13" font-weight="700" fill="#4A473F">B · 三个客户端同时在线时，进程与 fd 的快照</text>

  <rect x="48" y="556" width="190" height="76" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="66" y="580" font-size="11.5" font-weight="700" fill="#2C4460">父进程 PID 4810</text>
  <text x="66" y="602" font-size="10.5" fill="#2C4460">fd 3 → listen_fd</text>
  <text x="66" y="622" font-size="10.5" fill="#2C4460">没有任何 conn_fd</text>

  <line x1="246" y1="594" x2="336" y2="594" stroke="#5A564B" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="291" y="580" font-size="10.5" fill="#4A473F" text-anchor="middle">fork() ×3</text>

  <rect x="340" y="556" width="272" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="358" y="580" font-size="11.5" font-weight="700" fill="#24473F">子进程 PID 4821</text>
  <text x="358" y="602" font-size="10.5" fill="#24473F">fd 3 → 已关闭</text>
  <text x="358" y="622" font-size="10.5" fill="#24473F">fd 4 → 客户端 A 的连接</text>

  <rect x="628" y="556" width="272" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="646" y="580" font-size="11.5" font-weight="700" fill="#24473F">子进程 PID 4822</text>
  <text x="646" y="602" font-size="10.5" fill="#24473F">fd 3 → 已关闭</text>
  <text x="646" y="622" font-size="10.5" fill="#24473F">fd 4 → 客户端 B 的连接</text>

  <rect x="916" y="556" width="272" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="934" y="580" font-size="11.5" font-weight="700" fill="#24473F">子进程 PID 4823</text>
  <text x="934" y="602" font-size="10.5" fill="#24473F">fd 3 → 已关闭</text>
  <text x="934" y="622" font-size="10.5" fill="#24473F">fd 4 → 客户端 C 的连接</text>

  <text x="68" y="668" font-size="11.5" fill="#4A473F">三个子进程的 conn_fd 编号都是 4，但每个进程有自己的 fd 表，这三个 4 号槽位指向的是三个不同的 socket。</text>
  <text x="68" y="692" font-size="11.5" fill="#4A473F">父进程手里只剩 3 号 listen_fd，它拿不到任何客户端的数据，也就不可能读错人。</text>
</svg>
