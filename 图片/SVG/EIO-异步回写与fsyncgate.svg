<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#F5F4ED"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">fsyncgate：write 说成功，fsync 先说失败、再说成功——数据其实早没了</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">错误发生在异步回写里，与任何一次系统调用都不同步；错误标志被消费一次后，重试读到的是假平安</text>

  <!-- ======== 时间轴 ======== -->
  <line x1="70" y1="240" x2="1180" y2="240" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1176" y="226" font-size="11" fill="#6B675C" text-anchor="end">时间</text>

  <!-- ① write -->
  <rect x="80" y="130" width="180" height="76" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="170" y="155" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① write() 返回成功</text>
  <text x="170" y="174" font-size="10.5" fill="#2C4460" text-anchor="middle">数据进页缓存成为脏页</text>
  <text x="170" y="192" font-size="10.5" fill="#2C4460" text-anchor="middle">此刻没有任何持久化承诺</text>

  <!-- ② writeback EIO -->
  <rect x="300" y="130" width="200" height="76" rx="8" fill="#F5E5E0" stroke="#A64B3C" stroke-width="1.8"/>
  <text x="400" y="155" font-size="12.5" font-weight="700" fill="#A64B3C" text-anchor="middle">② 后台回写遇 EIO</text>
  <text x="400" y="174" font-size="10.5" fill="#A64B3C" text-anchor="middle">坏块 / 链路 / thin 卷写不进</text>
  <text x="400" y="192" font-size="10.5" fill="#A64B3C" text-anchor="middle">没有任何系统调用在等这个结果</text>

  <!-- ③ 内核记账 -->
  <rect x="540" y="130" width="220" height="76" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="650" y="152" font-size="12.5" font-weight="700" fill="#7A5518" text-anchor="middle">③ 内核记下错误标志</text>
  <text x="650" y="171" font-size="10.5" fill="#7A5518" text-anchor="middle">errseq_t 挂在 address_space 上</text>
  <text x="650" y="190" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">脏页被标成「干净」→ 数据此刻已丢</text>

  <!-- ④ fsync #1 -->
  <rect x="800" y="130" width="170" height="76" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="885" y="155" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">④ fsync 第一次</text>
  <text x="885" y="174" font-size="10.5" fill="#4A3F68" text-anchor="middle">返回 −1，errno = EIO</text>
  <text x="885" y="192" font-size="10.5" fill="#4A3F68" text-anchor="middle">错误标志被消费掉</text>

  <!-- ⑤ fsync #2 -->
  <rect x="1010" y="130" width="170" height="76" rx="8" fill="#F5E5E0" stroke="#A64B3C" stroke-width="1.8"/>
  <text x="1095" y="155" font-size="12.5" font-weight="700" fill="#A64B3C" text-anchor="middle">⑤ 重试 fsync</text>
  <text x="1095" y="174" font-size="10.5" fill="#A64B3C" text-anchor="middle">返回 0——「成功」</text>
  <text x="1095" y="192" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">但没有任何脏页可刷</text>

  <!-- 连接线 -->
  <line x1="260" y1="168" x2="298" y2="168" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="168" x2="538" y2="168" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <line x1="760" y1="168" x2="798" y2="168" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="970" y1="168" x2="1008" y2="168" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 核心结论条 -->
  <rect x="70" y="264" width="1110" height="52" rx="8" fill="#F5E5E0" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="625" y="286" font-size="13" font-weight="700" fill="#A64B3C" text-anchor="middle">铁律：fsync 一旦失败，该文件在盘上的状态未知——「重试成功」证明不了任何事</text>
  <text x="625" y="306" font-size="11.5" fill="#A64B3C" text-anchor="middle">丢的数据在 ③ 就丢了；④ 是唯一一次说真话的机会，错过（或吞掉）它，后面全是假平安</text>

  <!-- ======== 三种工程反应 ======== -->
  <text x="48" y="368" font-size="15" font-weight="700" fill="#2B2A26">三种正确的工程反应（都不包含「重试」）</text>

  <rect x="70" y="390" width="350" height="200" rx="8" fill="#E9EFDA" stroke="#48562B" stroke-width="1.5"/>
  <text x="245" y="418" font-size="13" font-weight="700" fill="#48562B" text-anchor="middle">A. 当场自杀，从日志重建</text>
  <text x="245" y="442" font-size="11" fill="#48562B" text-anchor="middle">PANIC → 进程退出 → 重启后</text>
  <text x="245" y="460" font-size="11" fill="#48562B" text-anchor="middle">WAL redo 恢复（PostgreSQL 的最终修复）</text>
  <text x="245" y="490" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">前提：WAL 在另一个健康设备上</text>
  <text x="245" y="514" font-size="11" fill="#6B675C" text-anchor="middle">代价：一次崩溃恢复的不可用窗口，</text>
  <text x="245" y="532" font-size="11" fill="#6B675C" text-anchor="middle">恢复时长 = checkpoint 以来的日志量</text>
  <text x="245" y="562" font-size="10.5" fill="#6B675C" text-anchor="middle">适用：单机引擎、错误极罕见</text>

  <rect x="450" y="390" width="350" height="200" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="625" y="418" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">B. 绕开页缓存，让错误同步化</text>
  <text x="625" y="442" font-size="11" fill="#2C4460" text-anchor="middle">O_DIRECT：写请求直达设备，</text>
  <text x="625" y="460" font-size="11" fill="#2C4460" text-anchor="middle">EIO 在本次调用里当场返回给你</text>
  <text x="625" y="490" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">错误与调用重新绑定，没有异步陷阱</text>
  <text x="625" y="514" font-size="11" fill="#6B675C" text-anchor="middle">代价：自己管缓存、对齐、预读</text>
  <text x="625" y="532" font-size="11" fill="#6B675C" text-anchor="middle">（InnoDB / RocksDB direct IO 之路）</text>
  <text x="625" y="562" font-size="10.5" fill="#6B675C" text-anchor="middle">适用：本来就自带缓存层的引擎</text>

  <rect x="830" y="390" width="350" height="200" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="1005" y="418" font-size="13" font-weight="700" fill="#4A3F68" text-anchor="middle">C. 摘盘摘节点，副本兜底</text>
  <text x="1005" y="442" font-size="11" fill="#4A3F68" text-anchor="middle">把整块盘 / 整个节点标坏下线，</text>
  <text x="1005" y="460" font-size="11" fill="#4A3F68" text-anchor="middle">读写切到其他副本（分布式标准动作）</text>
  <text x="1005" y="490" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">单盘状态未知没关系——数据不止一份</text>
  <text x="1005" y="514" font-size="11" fill="#6B675C" text-anchor="middle">代价：重建副本的网络/磁盘流量，</text>
  <text x="1005" y="532" font-size="11" fill="#6B675C" text-anchor="middle">与前台请求抢带宽 → 尾延迟上升</text>
  <text x="1005" y="562" font-size="10.5" fill="#6B675C" text-anchor="middle">适用：多副本系统（第 7 章）</text>

  <text x="70" y="640" font-size="11.5" fill="#6B675C">共同点：都承认「这块盘上这个文件的状态已不可信」，把可信状态寄托在别处——WAL、自管缓冲、或另一台机器的副本。</text>
  <text x="70" y="662" font-size="11.5" fill="#6B675C">贯穿负载视角：方案 A 换来分钟级恢复窗口；方案 C 换来 100 GiB 级重建流量在网络上跑几分钟——错误处理策略直接决定 p99 与可用性的形状。</text>
</svg>
