<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200px" height="760px" viewBox="0 0 1200 760" version="1.1">
  <title>Week 5 serving benchmark harness concept map</title>
  <desc>Concept map from kernel benchmark to LLM serving benchmark harness.</desc>
  <rect x="0" y="0" width="1200" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#42545a"/>
    </marker>
  </defs>
  <text x="600" y="44" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#263238">Week 5：Serving Benchmark Harness</text>
  <text x="600" y="82" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#455a64">从单个 kernel，转向请求压力下的系统稳定性与可复现性</text>

  <rect x="50" y="150" width="250" height="420" rx="16" ry="16" fill="#fffaf0" stroke="#c8bea7" stroke-width="2"/>
  <text x="175" y="190" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2f3b3f">Kernel Benchmark</text>
  <rect x="84" y="238" width="182" height="58" rx="10" ry="10" fill="#eef3ef" stroke="#8fa6a0" stroke-width="1.5"/>
  <text x="175" y="272" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#1d5c63">time / TFLOPS</text>
  <rect x="84" y="326" width="182" height="58" rx="10" ry="10" fill="#fff1dc" stroke="#d48b2a" stroke-width="1.5"/>
  <text x="175" y="360" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#7a4a16">shape / dtype</text>
  <rect x="84" y="414" width="182" height="58" rx="10" ry="10" fill="#eee7f5" stroke="#b09cc7" stroke-width="1.5"/>
  <text x="175" y="448" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#5c4770">Nsight evidence</text>
  <text x="175" y="526" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">关注点：单个 kernel</text>

  <path d="M304 360 L406 360" fill="none" stroke="#42545a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="355" y="332" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#8a5f22">系统化</text>

  <rect x="410" y="124" width="380" height="474" rx="18" ry="18" fill="#f8fbff" stroke="#b8c4d6" stroke-width="2"/>
  <text x="600" y="164" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2f3b3f">Serving Benchmark Harness</text>
  <rect x="454" y="214" width="292" height="56" rx="10" ry="10" fill="#eef3ef" stroke="#8fa6a0" stroke-width="1.5"/>
  <text x="600" y="247" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#33464b">workload: rate / concurrency / length</text>
  <rect x="454" y="294" width="292" height="56" rx="10" ry="10" fill="#fff1dc" stroke="#d48b2a" stroke-width="1.5"/>
  <text x="600" y="327" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#6b4719">metrics: TTFT / TPOT / TPS / p95</text>
  <rect x="454" y="374" width="292" height="56" rx="10" ry="10" fill="#eee7f5" stroke="#b09cc7" stroke-width="1.5"/>
  <text x="600" y="407" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5c4770">raw data: CSV / JSON / logs</text>
  <rect x="454" y="454" width="292" height="56" rx="10" ry="10" fill="#f7eadc" stroke="#d6ad86" stroke-width="1.5"/>
  <text x="600" y="487" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#734821">report: conclusion with evidence</text>
  <text x="600" y="552" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">关注点：端到端请求生命周期</text>

  <path d="M794 360 L898 360" fill="none" stroke="#42545a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="846" y="332" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#8a5f22">解释权衡</text>

  <rect x="902" y="150" width="248" height="420" rx="16" ry="16" fill="#fffaf0" stroke="#c8bea7" stroke-width="2"/>
  <text x="1026" y="190" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2f3b3f">Tradeoff</text>
  <circle cx="968" cy="266" r="42" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="2"/>
  <text x="968" y="272" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1d5c63">Latency</text>
  <circle cx="1084" cy="266" r="42" fill="#fff1dc" stroke="#d48b2a" stroke-width="2"/>
  <text x="1084" y="272" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#7a4a16">TPS</text>
  <circle cx="1026" cy="378" r="42" fill="#eee7f5" stroke="#b09cc7" stroke-width="2"/>
  <text x="1026" y="384" text-anchor="middle" dominant-baseline="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#5c4770">Cost</text>
  <line x1="1002" y1="285" x2="1060" y2="285" stroke="#607077" stroke-width="2"/>
  <line x1="984" y1="300" x2="1010" y2="344" stroke="#607077" stroke-width="2"/>
  <line x1="1068" y1="300" x2="1042" y2="344" stroke="#607077" stroke-width="2"/>
  <text x="1026" y="492" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">低延迟、高吞吐、低成本</text>
  <text x="1026" y="518" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">通常需要取舍</text>

  <rect x="230" y="656" width="740" height="48" rx="12" ry="12" fill="#eef3ef" stroke="#afbeb6" stroke-width="1.5"/>
  <text x="600" y="684" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#33464b">可信链路：config -> command -> raw data -> analysis -> report</text>
</svg>
