<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<title>随机指针复制：副本位置就是临时地址映射</title>
<desc>示例只画 A.random → C；实线箭头为 next，红色折线为 random。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect width="1240" height="690" fill="rgb(245, 244, 237)"/>
<text x="48" y="50" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">随机指针复制：副本位置就是临时地址映射</text>
<text x="48" y="80" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400">示例只画 A.random → C；实线箭头为 next，红色折线为 random。</text>
<text x="48" y="125" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700">A · 原链</text>
<rect x="300" y="170" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="333.0" y="196" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">A</text>
<path d="M369,190 L553,190" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="560" y="170" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="593.0" y="196" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">B</text>
<path d="M629,190 L813,190" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="820" y="170" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="853.0" y="196" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">C</text>
<path d="M889,190 L919,190" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="926" y="195" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">null</text>
<path d="M333,169 V142 H853 V169" fill="none" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="590" y="134" font-size="14" fill="#A64B3C" text-anchor="middle" font-weight="400">A.random = C</text>
<text x="48" y="269" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700">B · 插入所有副本</text>
<rect x="230" y="309" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="263.0" y="335" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">A</text>
<path d="M299,329 L378,329" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="385" y="309" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="418.0" y="335" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">A′</text>
<path d="M454,329 L533,329" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="540" y="309" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="573.0" y="335" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">B</text>
<path d="M609,329 L688,329" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="695" y="309" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="728.0" y="335" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">B′</text>
<path d="M764,329 L843,329" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="850" y="309" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="883.0" y="335" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">C</text>
<path d="M919,329 L998,329" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="1005" y="309" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="1038.0" y="335" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">C′</text>
<path d="M1074,329 L1104,329" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="1111" y="334" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">null</text>
<path d="M263,307 V284 H883 V307" fill="none" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="575" y="278" font-size="14" fill="#A64B3C" text-anchor="middle" font-weight="400">原 random</text>
<path d="M418,351 V391 H1038 V351" fill="none" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="728" y="417" font-size="16" fill="#A64B3C" text-anchor="middle" font-weight="400">A′.random = A.random-&gt;next = C′</text>
<text x="48" y="474" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700">C · 拆开并恢复原链</text>
<rect x="130" y="522" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="163.0" y="548" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">A</text>
<path d="M199,542 L248,542" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="255" y="522" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="288.0" y="548" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">B</text>
<path d="M324,542 L373,542" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="380" y="522" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="413.0" y="548" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">C</text>
<path d="M449,542 L479,542" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="486" y="547" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">null</text>
<rect x="755" y="522" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="788.0" y="548" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">A′</text>
<path d="M824,542 L873,542" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="880" y="522" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="913.0" y="548" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">B′</text>
<path d="M949,542 L998,542" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="1005" y="522" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="1038.0" y="548" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">C′</text>
<path d="M1074,542 L1104,542" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="1111" y="547" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">null</text>
<text x="285" y="599" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="400">原链 next 恢复</text>
<text x="913" y="599" font-size="15" fill="#2B2A26" text-anchor="middle" font-weight="400">副本 next / random 只连副本</text>
<text x="48" y="655" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="400">三轮遍历：插副本 → 填 random → 拆分。O(1) 辅助空间不包含新建的 n 个结果节点。</text>
</svg>