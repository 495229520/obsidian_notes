<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>元数据服务故障切换时间线</title>
  <desc>四条泳道（旧主 MDS、Monitor 多数派、新主 MDS、客户端）展示从宕机到恢复服务的五个阶段：检测窗口、选主与围栏、日志回放、租约/会话重建、恢复服务；底部为 RTO 预算条。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">元数据服务故障切换：从主宕机到恢复服务的时间线</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">RTO = 检测 + 选主/围栏 + 日志回放 + 租约等待 —— 每段有独立旋钮与下限；安全靠围栏，不靠"确认它真死了"</text>

  <!-- 泳道背景 -->
  <rect x="56" y="112" width="1128" height="96" rx="8" fill="#F4E9E4" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="134" font-size="12" font-weight="700" fill="#A64B3C">旧主 MDS</text>
  <rect x="56" y="218" width="1128" height="96" rx="8" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="240" font-size="12" font-weight="700" fill="#6B5B95">Monitor · 多数派裁判</text>
  <rect x="56" y="324" width="1128" height="104" rx="8" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="346" font-size="12" font-weight="700" fill="#2F6B5E">备 MDS → 新主</text>
  <rect x="56" y="438" width="1128" height="150" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="460" font-size="12" font-weight="700" fill="#3D5A80">客户端</text>

  <!-- 阶段分界虚线 -->
  <line x1="230" y1="108" x2="230" y2="622" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="420" y1="108" x2="420" y2="622" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="560" y1="108" x2="560" y2="622" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="760" y1="108" x2="760" y2="622" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="980" y1="108" x2="980" y2="622" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 旧主 -->
  <rect x="80" y="150" width="142" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="151" y="169" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">主：正常服务</text>
  <text x="151" y="185" font-size="10.5" fill="#24473F" text-anchor="middle">心跳 · 租约 · 写 WAL</text>
  <rect x="236" y="150" width="178" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="325" y="169" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">宕机 / 网络分区</text>
  <text x="325" y="185" font-size="10.5" fill="#733428" text-anchor="middle">对外表现相同：心跳静默</text>
  <text x="570" y="169" font-size="10.5" fill="#733428">若它只是"慢"而未死、事后复活：写请求带着旧 epoch，</text>
  <text x="570" y="186" font-size="10.5" fill="#733428">被存储层/KV 拒绝 —— 围栏(fencing)兜底，双主写不进去（7.12 / 7.14）</text>

  <!-- Monitor -->
  <rect x="236" y="256" width="178" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="325" y="275" font-size="12" font-weight="700" fill="#7A5518" text-anchor="middle">心跳静默：计数中</text>
  <text x="325" y="291" font-size="10.5" fill="#7A5518" text-anchor="middle">等 k 次超时：快则误判，慢则拖 RTO</text>
  <rect x="426" y="256" width="128" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="490" y="275" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">多数派判死</text>
  <text x="490" y="291" font-size="10.5" fill="#2C4460" text-anchor="middle">提升备 · epoch+1</text>

  <!-- 新主 -->
  <rect x="80" y="362" width="334" height="44" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="247" y="381" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">备：持续接收复制日志</text>
  <text x="247" y="397" font-size="10.5" fill="#6B675C" text-anchor="middle">同步复制 → RPO=0；异步复制 → 可能丢尾部</text>
  <rect x="426" y="362" width="128" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="490" y="381" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">接受任命</text>
  <text x="490" y="397" font-size="10.5" fill="#2C4460" text-anchor="middle">持新 epoch 上岗</text>
  <rect x="566" y="362" width="188" height="44" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="660" y="381" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">回放日志到最新</text>
  <text x="660" y="397" font-size="10.5" fill="#4A3F68" text-anchor="middle">时长 ∝ 积压量，checkpoint 压短</text>
  <rect x="766" y="362" width="208" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="870" y="381" font-size="12" font-weight="700" fill="#7A5518" text-anchor="middle">冻结窗口：会话/租约重建</text>
  <text x="870" y="397" font-size="10.5" fill="#7A5518" text-anchor="middle">等旧租约到期或 client 主动 reclaim</text>
  <rect x="986" y="362" width="178" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1075" y="381" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">全量服务</text>
  <text x="1075" y="397" font-size="10.5" fill="#24473F" text-anchor="middle">发放新世代租约</text>

  <!-- Monitor → 新主 提升箭头 -->
  <line x1="490" y1="304" x2="490" y2="358" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrb)"/>

  <!-- 客户端 两行 -->
  <rect x="80" y="470" width="142" height="40" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="151" y="495" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">正常读写</text>
  <rect x="236" y="470" width="518" height="40" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="495" y="487" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">租约有效期内：本地缓存的路径/布局照常命中，读几乎无感</text>
  <text x="495" y="503" font-size="10.5" fill="#24473F" text-anchor="middle">切换"半透明"的来源 —— 客户端缓存吸收了大部分读</text>
  <rect x="236" y="522" width="740" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="606" y="541" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">元数据写与缓存未命中：RPC 超时 → 指数退避重试（幂等 request id，7.13）—— 应用侧表现为 open/create 卡住</text>
  <text x="606" y="558" font-size="10.5" fill="#733428" text-anchor="middle">在途请求不知死活：唯一安全解法是"带同一 id 重发给新主"，由服务端去重</text>
  <rect x="986" y="486" width="178" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="1075" y="507" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">重连新主</text>
  <text x="1075" y="523" font-size="10.5" fill="#2C4460" text-anchor="middle">验 epoch · reclaim 会话</text>
  <text x="1075" y="537" font-size="10.5" fill="#2C4460" text-anchor="middle">重放在途请求</text>

  <!-- 时间轴 -->
  <line x1="80" y1="622" x2="1180" y2="622" stroke="#8A8574" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="230" y="644" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">T0 宕机</text>
  <text x="420" y="644" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">T1 判死</text>
  <text x="560" y="644" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">T2 开始回放</text>
  <text x="760" y="644" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">T3 可接会话</text>
  <text x="980" y="644" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">T4 完全恢复</text>
  <text x="1150" y="644" font-size="11" fill="#6B675C">时间 →</text>

  <!-- RTO 预算条 -->
  <text x="68" y="692" font-size="14" font-weight="700" fill="#2B2A26">RTO 预算<tspan font-size="11.5" fill="#6B675C" font-weight="400">（宽度示意；哪段最长，优化就花在哪段）</tspan></text>
  <rect x="80" y="706" width="240" height="34" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="200" y="727" font-size="10.5" fill="#7A5518" text-anchor="middle">检测：k × 心跳周期，秒级（误判 vs 速度）</text>
  <rect x="320" y="706" width="150" height="34" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="395" y="727" font-size="10.5" fill="#2C4460" text-anchor="middle">选主+围栏：亚秒~秒</text>
  <rect x="470" y="706" width="330" height="34" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="635" y="727" font-size="10.5" font-weight="700" fill="#4A3F68" text-anchor="middle">日志回放：∝ 未 checkpoint 的积压 —— 常见大头，且平时看不见</text>
  <rect x="800" y="706" width="300" height="34" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="950" y="727" font-size="10.5" fill="#7A5518" text-anchor="middle">租约等待：下限 = 租期（平时免 RTT vs 切换等多久）</text>

  <text x="80" y="782" font-size="11.5" fill="#4A473F">两个口径别混：RTO（多久恢复服务）由上面四段相加；RPO（丢多少数据）只由复制方式决定 —— 同步复制 RPO=0，与切换快慢无关。</text>
  <text x="80" y="806" font-size="11.5" fill="#4A473F">检测允许误判（旧主可能没死），正确性靠 epoch/fencing 让旧主的写作废；「先围栏、再上岗」的顺序不可颠倒，否则回放的终点可能被旧主继续改写。</text>
  <text x="80" y="830" font-size="11.5" fill="#4A473F">客户端视角的可用性 = 读靠租约缓存续命（T0~租约到期），写从 T0 卡到 T4 —— 压缩写不可用窗口的三个抓手：调快检测、勤做 checkpoint、缩短租期。</text>
</svg>
