<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Manifest 与 Version：SST 的户口系统</title>
  <desc>内存 Version 链、磁盘 MANIFEST/CURRENT 文件、提交与恢复流程</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">Manifest 与 Version：SST 的户口系统</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">内存里是引用计数串起的不可变 Version 链，盘上是给元数据配的 WAL —— 两边靠「先追加 fsync、再切指针」缝合</text>

  <!-- Panel A：内存 -->
  <rect x="56" y="104" width="1128" height="252" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="126" font-size="13" font-weight="700" fill="#3D5A80">A · 内存 · VersionSet：不可变 Version 链（读者按引用计数持有）</text>

  <!-- V46 -->
  <rect x="90" y="150" width="230" height="140" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="104" y="174" font-size="13" font-weight="700" fill="#4A473F">Version 46（旧）</text>
  <text x="104" y="198" font-size="11.5" fill="#4A473F">L0：07.sst  09.sst</text>
  <text x="104" y="218" font-size="11.5" fill="#4A473F">L1：03.sst  05.sst</text>
  <text x="104" y="248" font-size="10.5" font-weight="700" fill="#8A6A3A">refs = 1</text>
  <text x="104" y="266" font-size="10" fill="#6B675C">被一个长命迭代器钉住</text>

  <!-- V47 -->
  <rect x="440" y="150" width="230" height="140" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="454" y="174" font-size="13" font-weight="700" fill="#4A473F">Version 47</text>
  <text x="454" y="198" font-size="11.5" fill="#4A473F">L0：07  09  12.sst</text>
  <text x="454" y="218" font-size="11.5" fill="#4A473F">L1：03.sst  05.sst</text>
  <text x="454" y="248" font-size="10.5" font-weight="700" fill="#4A473F">refs = 0</text>
  <text x="454" y="266" font-size="10" fill="#6B675C">无人引用 → 本版本可回收</text>

  <!-- V48 current -->
  <text x="790" y="144" font-size="10.5" font-weight="700" fill="#2F6B5E">VersionSet::current ─▶</text>
  <rect x="790" y="150" width="310" height="140" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="2"/>
  <text x="804" y="174" font-size="13" font-weight="700" fill="#24473F">Version 48（current）</text>
  <text x="804" y="198" font-size="11.5" fill="#24473F">L0：12.sst</text>
  <text x="804" y="218" font-size="11.5" fill="#24473F">L1：03.sst  05.sst  13.sst</text>
  <text x="804" y="248" font-size="10.5" font-weight="700" fill="#24473F">refs = 2</text>
  <text x="804" y="266" font-size="10" fill="#6B675C">每个进行中的读请求各 +1</text>

  <!-- apply arrows -->
  <line x1="324" y1="220" x2="436" y2="220" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="380" y="206" font-size="10" fill="#4A473F" text-anchor="middle">apply edit</text>
  <text x="380" y="244" font-size="9.5" fill="#6B675C" text-anchor="middle">flush 完成：</text>
  <text x="380" y="259" font-size="9.5" fill="#6B675C" text-anchor="middle">+12.sst@L0</text>

  <line x1="674" y1="220" x2="786" y2="220" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="730" y="206" font-size="10" fill="#4A473F" text-anchor="middle">apply edit</text>
  <text x="730" y="244" font-size="9.5" fill="#6B675C" text-anchor="middle">compaction 完成：</text>
  <text x="730" y="259" font-size="9.5" fill="#6B675C" text-anchor="middle">−07 −09@L0 → +13@L1</text>

  <text x="76" y="326" font-size="10.5" fill="#4A473F">Version 一经创建不可变；任何变更 = 基于旧版本造一个新版本，再原子切换 current 指针 —— copy-on-write + 引用计数，读端全程无锁</text>

  <!-- 提交/恢复箭头 -->
  <line x1="470" y1="356" x2="470" y2="414" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="482" y="380" font-size="10" font-weight="700" fill="#4A473F">提交：① 追加 edit 记录 + fsync MANIFEST</text>
  <text x="482" y="396" font-size="10" fill="#6B675C">② 才在内存安装新 Version —— 先盘后内存</text>

  <line x1="880" y1="414" x2="880" y2="356" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="892" y="380" font-size="10" font-weight="700" fill="#4A473F">恢复：逐条重放 edit，</text>
  <text x="892" y="396" font-size="10" fill="#6B675C">在内存重建出 current Version</text>

  <!-- Panel B：磁盘 -->
  <rect x="56" y="376" width="1128" height="210" rx="8" fill="#F5F1E6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="398" font-size="13" font-weight="700" fill="#8A6A3A">B · 磁盘 · 元数据文件</text>

  <rect x="90" y="430" width="200" height="112" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="104" y="452" font-size="12.5" font-weight="700" fill="#2C4460">CURRENT</text>
  <text x="104" y="472" font-size="10" fill="#2C4460">内容只有一行：</text>
  <text x="104" y="490" font-size="11" font-weight="700" fill="#2C4460">MANIFEST-000012</text>
  <text x="104" y="510" font-size="9.5" fill="#2C4460">更新方式：写临时文件</text>
  <text x="104" y="526" font-size="9.5" fill="#2C4460">→ fsync → rename（1.11）</text>

  <line x1="294" y1="482" x2="336" y2="482" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="340" y="418" width="580" height="128" rx="7" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="356" y="440" font-size="12" font-weight="700" fill="#6B4E28">MANIFEST-000012 · 追加写日志（每条记录带 CRC，与 WAL 同格式）</text>
  <rect x="356" y="454" width="170" height="56" rx="5" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="370" y="477" font-size="10.5" font-weight="700" fill="#6B4E28">快照记录</text>
  <text x="370" y="495" font-size="9.5" fill="#6B4E28">写此文件时的全量清单</text>
  <rect x="534" y="454" width="50" height="56" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="559" y="487" font-size="11" fill="#6B675C" text-anchor="middle">……</text>
  <rect x="592" y="454" width="150" height="56" rx="5" fill="#EDEBE3" stroke="#4A473F" stroke-width="1.1"/>
  <text x="606" y="477" font-size="10" font-weight="700" fill="#4A473F">edit（flush 完成）</text>
  <text x="606" y="495" font-size="9.5" fill="#4A473F">+12.sst@L0</text>
  <rect x="750" y="454" width="155" height="56" rx="5" fill="#EDEBE3" stroke="#4A473F" stroke-width="1.1"/>
  <text x="762" y="477" font-size="10" font-weight="700" fill="#4A473F">edit（compaction）</text>
  <text x="762" y="495" font-size="9.5" fill="#4A473F">−07 −09 → +13@L1</text>
  <text x="356" y="534" font-size="10" fill="#6B675C">只追加、不改写 —— 元数据自己的 WAL（6.1 的全部结论适用）</text>

  <rect x="960" y="418" width="200" height="128" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="974" y="440" font-size="12" font-weight="700" fill="#6B4E28">文件长大后切新</text>
  <text x="974" y="462" font-size="9.5" fill="#6B4E28">① 写 MANIFEST-000013，</text>
  <text x="974" y="478" font-size="9.5" fill="#6B4E28">　首条 = 当前全量快照</text>
  <text x="974" y="494" font-size="9.5" fill="#6B4E28">② fsync 新文件</text>
  <text x="974" y="510" font-size="9.5" fill="#6B4E28">③ rename 更新 CURRENT</text>
  <text x="974" y="530" font-size="9.5" font-weight="700" fill="#6B4E28">崩在中途仍指旧文件，安全</text>

  <!-- Panel C：恢复流程条 -->
  <rect x="56" y="606" width="1128" height="130" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="628" font-size="13" font-weight="700" fill="#4A473F">C · 开库恢复五步（详见 6.17 Recovery 路径）</text>

  <rect x="76" y="642" width="196" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="90" y="666" font-size="10.5" font-weight="700" fill="#2C4460">① 读 CURRENT</text>
  <text x="90" y="686" font-size="9.5" fill="#2C4460">定位活跃 MANIFEST</text>

  <rect x="299" y="642" width="196" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="313" y="666" font-size="10.5" font-weight="700" fill="#2C4460">② 逐条重放 edit</text>
  <text x="313" y="686" font-size="9.5" fill="#2C4460">CRC 校验每条记录</text>
  <text x="313" y="702" font-size="9.5" fill="#2C4460">坏尾截断（6.4）</text>

  <rect x="522" y="642" width="196" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="536" y="666" font-size="10.5" font-weight="700" fill="#24473F">③ 建出 current Version</text>
  <text x="536" y="686" font-size="9.5" fill="#24473F">各层文件清单就位</text>

  <rect x="745" y="642" width="196" height="72" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="759" y="666" font-size="10.5" font-weight="700" fill="#6B4E28">④ 目录对账</text>
  <text x="759" y="686" font-size="9.5" fill="#6B4E28">无主 *.sst、旧 MANIFEST</text>
  <text x="759" y="702" font-size="9.5" fill="#6B4E28">一律删除</text>

  <rect x="968" y="642" width="196" height="72" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="982" y="666" font-size="10.5" font-weight="700" fill="#444441">⑤ 回放 WAL</text>
  <text x="982" y="686" font-size="9.5" fill="#444441">重建 memtable</text>
  <text x="982" y="702" font-size="9.5" fill="#444441">（6.17 / 6.18）</text>

  <line x1="272" y1="678" x2="295" y2="678" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="495" y1="678" x2="518" y2="678" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="718" y1="678" x2="741" y2="678" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="941" y1="678" x2="964" y2="678" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
</svg>
