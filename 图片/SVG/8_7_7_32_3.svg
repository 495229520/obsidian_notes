<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">修复源选择：可信承诺优先于二对一多数</title>
  <desc id="desc">目标固定为对象 X、Generation 7 与期望摘要 h*；性能调度只能发生在资格筛选之后。。原创教学示意图，非真实产品内部拓扑或性能实测。</desc>
  <defs>
    <marker id="arr-base" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B968A" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5B95" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="700" fill="#F5F4ED" stroke="none" rx="0" stroke-width="1.3" />
  <text x="48" y="53" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="title">修复源选择：可信承诺优先于二对一多数</text>
  <text x="48" y="82" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="subtitle">目标固定为对象 X、Generation 7 与期望摘要 h*；性能调度只能发生在资格筛选之后。</text>
  <rect x="63" y="115" width="1114" height="57" fill="#EDEAF3" stroke="#6B5B95" rx="8" stroke-width="1.3" />
  <text x="620.0" y="149.26" font-size="16" fill="#544673" font-weight="700" text-anchor="middle" data-role="body">可信版本记录：X  /  generation = 7  /  expected = h*</text>
  <rect x="48" y="193" width="572" height="350" fill="#FBFBF6" stroke="#D8D5C8" rx="8" stroke-width="1.3" />
  <text x="66" y="221" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">A · 候选副本的三种观测</text>
  <text x="88" y="266" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">候选</text>
  <text x="214" y="266" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">版本</text>
  <text x="355" y="266" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">本地自洽</text>
  <text x="493" y="266" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">匹配 h*</text>
  <rect x="71" y="277" width="525" height="53" fill="#F0E0DB" stroke="none" rx="4" stroke-width="1.3" />
  <text x="95" y="310" font-size="16" fill="#733428" font-weight="700" text-anchor="start" data-role="body">A</text>
  <text x="221" y="310" font-size="16" fill="#733428" font-weight="700" text-anchor="start" data-role="body">7</text>
  <text x="362" y="310" font-size="16" fill="#733428" font-weight="700" text-anchor="start" data-role="body">是</text>
  <text x="500" y="310" font-size="16" fill="#733428" font-weight="700" text-anchor="start" data-role="body">否</text>
  <rect x="71" y="347" width="525" height="53" fill="#F0E0DB" stroke="none" rx="4" stroke-width="1.3" />
  <text x="95" y="380" font-size="16" fill="#733428" font-weight="700" text-anchor="start" data-role="body">B</text>
  <text x="221" y="380" font-size="16" fill="#733428" font-weight="700" text-anchor="start" data-role="body">7</text>
  <text x="362" y="380" font-size="16" fill="#733428" font-weight="700" text-anchor="start" data-role="body">是</text>
  <text x="500" y="380" font-size="16" fill="#733428" font-weight="700" text-anchor="start" data-role="body">否</text>
  <rect x="71" y="417" width="525" height="53" fill="#DCE9E3" stroke="none" rx="4" stroke-width="1.3" />
  <text x="95" y="450" font-size="16" fill="#24473F" font-weight="700" text-anchor="start" data-role="body">C</text>
  <text x="221" y="450" font-size="16" fill="#24473F" font-weight="700" text-anchor="start" data-role="body">7</text>
  <text x="362" y="450" font-size="16" fill="#24473F" font-weight="700" text-anchor="start" data-role="body">是</text>
  <text x="500" y="450" font-size="16" fill="#24473F" font-weight="700" text-anchor="start" data-role="body">是</text>
  <text x="84" y="519" font-size="14.5" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">A、B 内容相同；C 才符合原承诺</text>
  <rect x="644" y="193" width="548" height="350" fill="#FBFBF6" stroke="#D8D5C8" rx="8" stroke-width="1.3" />
  <text x="662" y="221" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">B · 筛选门槛</text>
  <rect x="703" y="252" width="214" height="52" fill="#E3EAF4" stroke="#3D5A80" rx="8" stroke-width="1.3" />
  <text x="810.0" y="283.22" font-size="14.5" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">目标版本一致？</text>
  <polyline points="917,278 1074,278 1074,322" fill="none" stroke="#9B968A" stroke-width="1.8" marker-end="url(#arr-gray)" stroke-linejoin="round" />
  <text x="969" y="267" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">否</text>
  <rect x="990" y="325" width="166" height="49" fill="#F1EFE8" stroke="#9B968A" rx="8" stroke-width="1.3" />
  <text x="1073.0" y="354.54" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">其它版本</text>
  <polyline points="810,304 810,347" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-blue)" stroke-linejoin="round" />
  <text x="826" y="333" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">是</text>
  <rect x="701" y="350" width="218" height="56" fill="#F3E8D3" stroke="#8A6A3A" rx="8" stroke-width="1.3" />
  <text x="810.0" y="383.22" font-size="14.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">重算是否匹配 h*？</text>
  <polyline points="917,379 1074,379 1074,445" fill="none" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arr-red)" stroke-linejoin="round" />
  <text x="970" y="399" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">否</text>
  <polyline points="810,406 810,445" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-green)" stroke-linejoin="round" />
  <text x="826" y="433" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">是</text>
  <rect x="701" y="448" width="218" height="48" fill="#DCE9E3" stroke="#2F6B5E" rx="8" stroke-width="1.3" />
  <text x="810.0" y="477.4" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">合格源</text>
  <rect x="990" y="448" width="166" height="48" fill="#F0E0DB" stroke="#A64B3C" rx="8" stroke-width="1.3" />
  <text x="1073.0" y="477.04" font-size="14" fill="#733428" font-weight="700" text-anchor="middle" data-role="body">排除并留证</text>
  <rect x="65" y="565" width="532" height="57" fill="#DCE9E3" stroke="#2F6B5E" rx="8" stroke-width="1.3" />
  <text x="331.0" y="598.9" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">本例选 C → 暂存 → 安装门禁</text>
  <rect x="645" y="565" width="532" height="57" fill="#F0E0DB" stroke="#A64B3C" rx="8" stroke-width="1.3" />
  <text x="911.0" y="598.9" font-size="15" fill="#733428" font-weight="700" text-anchor="middle" data-role="body">无合格源 → 停止自动覆盖</text>
  <line x1="48" y1="649" x2="1192" y2="649" stroke="#D8D5C8" stroke-width="1" />
  <text x="48" y="678" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">没有可信摘要或可判定的权威版本关系时，应隔离、保留证据并寻求日志/备份/业务核对，而不是猜。</text>
</svg>