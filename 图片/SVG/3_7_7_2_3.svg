<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>广播风暴：成因与防治</title>
  <desc>二层环路使广播帧指数复制，以太网帧头无 TTL 无法自然消亡；三类成因与 STP / VLAN / storm-control 三种防治手段对照。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">广播风暴：二层没有 TTL，环路里的广播帧不会自己消亡</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">交换机对广播帧向除入口外的所有端口泛洪；一旦拓扑成环，帧数每绕一圈翻倍，且没有任何字段能让它衰减</text>

  <!-- ===== Panel A ===== -->
  <rect x="48" y="104" width="700" height="290" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="64" y="130" font-size="14" font-weight="700" fill="#4A473F">A · 一个广播帧进入环路后，帧数怎么变</text>

  <!-- 拓扑 -->
  <rect x="96" y="148" width="96" height="30" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="144" y="168" font-size="11" fill="#2C4460" text-anchor="middle">PC 发广播帧</text>
  <line x1="144" y1="178" x2="144" y2="196" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="96" y="200" width="96" height="34" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.3"/>
  <text x="144" y="222" font-size="11.5" fill="#2B2A26" text-anchor="middle">交换机 A</text>
  <rect x="268" y="200" width="96" height="34" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.3"/>
  <text x="316" y="222" font-size="11.5" fill="#2B2A26" text-anchor="middle">交换机 B</text>
  <rect x="182" y="298" width="96" height="34" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.3"/>
  <text x="230" y="320" font-size="11.5" fill="#2B2A26" text-anchor="middle">交换机 C</text>

  <line x1="192" y1="217" x2="262" y2="217" stroke="#B07D2B" stroke-width="1.8" marker-end="url(#arrm)"/>
  <line x1="306" y1="234" x2="258" y2="294" stroke="#B07D2B" stroke-width="1.8" marker-end="url(#arrm)"/>
  <line x1="200" y1="298" x2="158" y2="238" stroke="#B07D2B" stroke-width="1.8" marker-end="url(#arrm)"/>
  <text x="227" y="208" font-size="10" fill="#6B4E28" text-anchor="middle">复制一份</text>
  <text x="316" y="272" font-size="10" fill="#6B4E28">再复制</text>
  <text x="126" y="274" font-size="10" fill="#6B4E28" text-anchor="end">又回到 A</text>

  <text x="70" y="356" font-size="11" fill="#4A473F">泛洪规则 · 除入口外，每个端口各复制一份</text>
  <text x="70" y="376" font-size="11" fill="#4A473F">环路里没有出口，复制也就没有终点</text>

  <!-- 帧数增长 -->
  <text x="404" y="154" font-size="11" fill="#4A473F">网段内广播帧份数（每绕一圈翻倍）</text>
  <line x1="404" y1="340" x2="726" y2="340" stroke="#9B968A" stroke-width="1.2"/>

  <rect x="412" y="328" width="34" height="12" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="429" y="320" font-size="10" fill="#6B4E28" text-anchor="middle">1</text>
  <rect x="464" y="318" width="34" height="22" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="481" y="310" font-size="10" fill="#6B4E28" text-anchor="middle">2</text>
  <rect x="516" y="300" width="34" height="40" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="533" y="292" font-size="10" fill="#6B4E28" text-anchor="middle">4</text>
  <rect x="568" y="268" width="34" height="72" rx="3" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="585" y="260" font-size="10" fill="#733428" text-anchor="middle">8</text>
  <rect x="620" y="222" width="34" height="118" rx="3" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="637" y="214" font-size="10" fill="#733428" text-anchor="middle">16</text>
  <rect x="672" y="172" width="34" height="168" rx="3" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="689" y="164" font-size="10" fill="#733428" text-anchor="middle">32</text>

  <text x="429" y="356" font-size="9.5" fill="#6B675C" text-anchor="middle">t0</text>
  <text x="481" y="356" font-size="9.5" fill="#6B675C" text-anchor="middle">t1</text>
  <text x="533" y="356" font-size="9.5" fill="#6B675C" text-anchor="middle">t2</text>
  <text x="585" y="356" font-size="9.5" fill="#6B675C" text-anchor="middle">t3</text>
  <text x="637" y="356" font-size="9.5" fill="#6B675C" text-anchor="middle">t4</text>
  <text x="689" y="356" font-size="9.5" fill="#6B675C" text-anchor="middle">t5</text>
  <text x="404" y="376" font-size="11" fill="#733428">没有衰减项，这根柱子不会自己停下来</text>

  <!-- ===== Panel B ===== -->
  <rect x="772" y="104" width="420" height="290" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="788" y="130" font-size="14" font-weight="700" fill="#4A473F">B · 对照：三层为什么不会这样</text>

  <text x="788" y="158" font-size="11.5" fill="#4A473F">以太网帧头（部分字段）</text>
  <rect x="788" y="168" width="76" height="32" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="826" y="188" font-size="10" fill="#4A473F" text-anchor="middle">目的 MAC</text>
  <rect x="864" y="168" width="76" height="32" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="902" y="188" font-size="10" fill="#4A473F" text-anchor="middle">源 MAC</text>
  <rect x="940" y="168" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="968" y="188" font-size="10" fill="#4A473F" text-anchor="middle">类型</text>
  <rect x="996" y="168" width="112" height="32" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1052" y="188" font-size="10" fill="#4A473F" text-anchor="middle">载荷</text>
  <rect x="1108" y="168" width="68" height="32" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1142" y="188" font-size="10" fill="#4A473F" text-anchor="middle">FCS</text>
  <text x="788" y="220" font-size="11" fill="#733428">整个帧头里没有可递减的计数器</text>

  <text x="788" y="250" font-size="11.5" fill="#4A473F">IPv4 首部（部分字段）</text>
  <rect x="788" y="260" width="70" height="32" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="823" y="280" font-size="10" fill="#4A473F" text-anchor="middle">版本/IHL</text>
  <rect x="858" y="260" width="66" height="32" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="891" y="280" font-size="10" fill="#4A473F" text-anchor="middle">总长度</text>
  <rect x="924" y="260" width="88" height="32" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="968" y="280" font-size="10" fill="#4A473F" text-anchor="middle">标识+分片</text>
  <rect x="1012" y="260" width="54" height="32" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1039" y="280" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">TTL</text>
  <rect x="1066" y="260" width="52" height="32" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1092" y="280" font-size="10" fill="#4A473F" text-anchor="middle">协议</text>
  <rect x="1118" y="260" width="58" height="32" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1147" y="280" font-size="10" fill="#4A473F" text-anchor="middle">校验和</text>
  <text x="788" y="312" font-size="11" fill="#24473F">每经一跳 −1，减到 0 立即丢弃</text>

  <text x="788" y="346" font-size="11.5" font-weight="700" fill="#2B2A26">同一个环路：三层自己收敛，二层不会</text>
  <text x="788" y="368" font-size="11.5" fill="#4A473F">所以二层必须靠外部协议阻断链路</text>

  <!-- ===== Panel C ===== -->
  <rect x="48" y="414" width="1144" height="176" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="64" y="440" font-size="14" font-weight="700" fill="#4A473F">C · 三类成因：谁在制造广播帧</text>

  <rect x="68" y="452" width="356" height="124" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="84" y="478" font-size="12.5" font-weight="700" fill="#733428">① 二层环路 · 最严重</text>
  <text x="84" y="504" font-size="11" fill="#733428">触发 · 冗余链路成环，STP 未生效</text>
  <text x="84" y="528" font-size="11" fill="#733428">机制 · 每绕一圈复制翻倍，无衰减</text>
  <text x="84" y="552" font-size="11" fill="#733428">后果 · 秒级打满链路，网段瘫痪</text>

  <rect x="444" y="452" width="356" height="124" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
  <text x="460" y="478" font-size="12.5" font-weight="700" fill="#6B4E28">② ARP 泛滥</text>
  <text x="460" y="504" font-size="11" fill="#6B4E28">触发 · 主机数量过多或遭 ARP 欺骗</text>
  <text x="460" y="528" font-size="11" fill="#6B4E28">机制 · ARP 请求本身就是广播帧</text>
  <text x="460" y="552" font-size="11" fill="#6B4E28">后果 · 挤占正常单播的带宽</text>

  <rect x="820" y="452" width="352" height="124" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="836" y="478" font-size="12.5" font-weight="700" fill="#2C4460">③ 主机处理负担</text>
  <text x="836" y="504" font-size="11" fill="#2C4460">触发 · 广播帧网卡无法硬件过滤</text>
  <text x="836" y="528" font-size="11" fill="#2C4460">机制 · 每帧都中断 CPU 进协议栈</text>
  <text x="836" y="552" font-size="11" fill="#2C4460">后果 · 全网段 CPU 都在做无用功</text>

  <!-- ===== Panel D ===== -->
  <rect x="48" y="610" width="1144" height="214" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="64" y="636" font-size="14" font-weight="700" fill="#4A473F">D · 三种防治：各自砍在哪一环</text>

  <rect x="76" y="648" width="1080" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="266" y1="648" x2="266" y2="810" stroke="#9B968A" stroke-width="1"/>
  <line x1="426" y1="648" x2="426" y2="810" stroke="#9B968A" stroke-width="1"/>
  <line x1="776" y1="648" x2="776" y2="810" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="678" width="1080" height="132" fill="none" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="76" y1="722" x2="1156" y2="722" stroke="#9B968A" stroke-width="1"/>
  <line x1="76" y1="766" x2="1156" y2="766" stroke="#9B968A" stroke-width="1"/>

  <text x="90" y="668" font-size="11.5" font-weight="700" fill="#2B2A26">手段</text>
  <text x="280" y="668" font-size="11.5" font-weight="700" fill="#2B2A26">作用位置</text>
  <text x="440" y="668" font-size="11.5" font-weight="700" fill="#2B2A26">直接砍掉什么</text>
  <text x="790" y="668" font-size="11.5" font-weight="700" fill="#2B2A26">局限</text>

  <rect x="77" y="679" width="188" height="42" fill="#DCE9E3"/>
  <text x="90" y="705" font-size="11.5" font-weight="700" fill="#24473F">STP / RSTP</text>
  <text x="280" y="705" font-size="11.5" fill="#4A473F">交换机之间</text>
  <text x="440" y="705" font-size="11.5" fill="#2B2A26">逻辑阻断冗余链路，环路消失</text>
  <text x="790" y="705" font-size="11.5" fill="#4A473F">收敛期间仍可能短暂成环</text>

  <rect x="77" y="723" width="188" height="42" fill="#E3EAF4"/>
  <text x="90" y="749" font-size="11.5" font-weight="700" fill="#2C4460">划分 VLAN</text>
  <text x="280" y="749" font-size="11.5" fill="#4A473F">交换机端口</text>
  <text x="440" y="749" font-size="11.5" fill="#2B2A26">广播域切小，爆炸半径收缩</text>
  <text x="790" y="749" font-size="11.5" fill="#4A473F">跨 VLAN 通信要走三层</text>

  <rect x="77" y="767" width="188" height="42" fill="#F3E8D3"/>
  <text x="90" y="793" font-size="11.5" font-weight="700" fill="#6B4E28">storm-control</text>
  <text x="280" y="793" font-size="11.5" fill="#4A473F">单个端口</text>
  <text x="440" y="793" font-size="11.5" fill="#2B2A26">广播帧速率超阈值即丢弃</text>
  <text x="790" y="793" font-size="11.5" fill="#4A473F">治标，阈值过低会误伤</text>

  <text x="48" y="852" font-size="12" fill="#6B675C">环路是根因，STP 治本；VLAN 缩小爆炸半径；storm-control 只做兜底限速</text>
</svg>
