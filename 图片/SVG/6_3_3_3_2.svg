<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>同意机制的三层默认安全策略</title>
  <desc>主动操作默认 Allow、被动超时默认 Deny、异常路径默认 Denied，构成安全纵深</desc>
  <rect x="0" y="0" width="760" height="480" fill="rgb(245, 244, 237)"/>

  <text x="380" y="28" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#3C3489">安全纵深 · 三层默认策略</text>

  <!-- 列标题 -->
  <text x="140" y="62" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">触发条件</text>
  <text x="370" y="62" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">默认动作</text>
  <text x="610" y="62" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">实现机制</text>

  <!-- Row 1: 主动 (Blue) -->
  <rect x="40" y="88" width="200" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="140" y="118" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">用户在场且主动</text>
  <rect x="300" y="88" width="140" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="370" y="118" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">Allow</text>
  <rect x="500" y="88" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="610" y="110" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">Enter 键 → DEFPUSHBUTTON</text>
  <text x="610" y="128" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">方便用户快速响应</text>
  <polyline points="240,118 300,118" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="440,118 500,118" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: 超时 (Amber) -->
  <rect x="40" y="208" width="200" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="140" y="238" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">用户不在场</text>
  <rect x="300" y="208" width="140" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="370" y="238" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">Deny</text>
  <rect x="500" y="208" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="610" y="230" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">30 秒 → EndDialog(IDCANCEL)</text>
  <text x="610" y="248" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">无人值守时安全兜底</text>
  <polyline points="240,238 300,238" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="440,238 500,238" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 3: 异常 (Gray) -->
  <rect x="40" y="328" width="200" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="140" y="358" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441">系统异常路径</text>
  <rect x="300" y="328" width="140" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="370" y="358" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441">Denied</text>
  <rect x="500" y="328" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="610" y="350" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">result 初始值 = Denied</text>
  <text x="610" y="368" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">fail-safe 不会误授权</text>
  <polyline points="240,358 300,358" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="440,358 500,358" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="380" y="430" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">三层默认值层层兜底：主动可快速放行，无人值守自动拒绝，异常路径绝不误授权</text>
</svg>
