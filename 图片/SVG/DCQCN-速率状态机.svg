<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统:背景 #F5F4ED;曲线蓝 #3D5A80;CNP 红 #A05248;
       阶段条:①中性 #F0EFE8 ②绿 #DCE9E3 ③琥珀 #F0E3D3 ④蓝 #E3EAF4 -->
  <rect x="0" y="0" width="1240" height="660" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">DCQCN 反应点(RP)的速率状态机:一刀砍,三段涨</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">每条流的 {RC 当前速率, RT 目标速率, α 拥塞估计} 都住在网卡里 —— CPU 全程不知情</text>

  <!-- 坐标轴 -->
  <text x="52" y="122" font-size="10.5" fill="#6B675C">发送速率 ↑</text>
  <line x1="90" y1="130" x2="90" y2="430" stroke="#5A564B" stroke-width="1.4"/>
  <line x1="90" y1="430" x2="750" y2="430" stroke="#5A564B" stroke-width="1.4"/>
  <text x="754" y="434" font-size="10.5" fill="#6B675C">时间 →</text>

  <!-- 线速与 RT 参考线 -->
  <line x1="90" y1="150" x2="750" y2="150" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="700" y="144" font-size="10" fill="#6B675C">线速</text>
  <line x1="250" y1="170" x2="500" y2="170" stroke="#2F6B5E" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="506" y="174" font-size="10" fill="#24473F">RT = 砍前速率(恢复锚点)</text>

  <!-- CNP 事件 -->
  <line x1="250" y1="130" x2="250" y2="430" stroke="#A05248" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="250" y="122" font-size="11" font-weight="700" fill="#A05248" text-anchor="middle">收到 CNP</text>
  <text x="262" y="330" font-size="10" fill="#A05248">RT←RC;RC←RC×(1−α/2)</text>
  <text x="262" y="348" font-size="10" fill="#A05248">α←(1−g)α+g(拥塞估计上调)</text>

  <!-- 速率曲线 -->
  <polyline points="90,170 250,170 252,300 307,235 362,202 417,186 472,178 590,166 670,152 750,152"
            fill="none" stroke="#3D5A80" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 阶段条 -->
  <rect x="90" y="444" width="160" height="10" fill="#F0EFE8" stroke="#9B968A" stroke-width="0.8"/>
  <rect x="252" y="444" width="220" height="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="0.8"/>
  <rect x="472" y="444" width="118" height="10" fill="#F0E3D3" stroke="#B07A3E" stroke-width="0.8"/>
  <rect x="590" y="444" width="160" height="10" fill="#E3EAF4" stroke="#3D5A80" stroke-width="0.8"/>
  <text x="170" y="472" font-size="10.5" fill="#6B675C" text-anchor="middle">① 满速</text>
  <text x="362" y="472" font-size="10.5" fill="#24473F" text-anchor="middle">② 快速恢复</text>
  <text x="531" y="472" font-size="10.5" fill="#7A5426" text-anchor="middle">③ 加性增</text>
  <text x="670" y="472" font-size="10.5" fill="#2C4460" text-anchor="middle">④ 超增</text>

  <!-- 阶段图例 -->
  <rect x="90" y="494" width="14" height="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="0.8"/>
  <text x="112" y="503" font-size="11" fill="#2B2A26">② 快速恢复:连续若干个"安静周期",每周期 RC←(RC+RT)/2 —— 指数逼近砍前速率【实现】</text>
  <rect x="90" y="518" width="14" height="10" fill="#F0E3D3" stroke="#B07A3E" stroke-width="0.8"/>
  <text x="112" y="527" font-size="11" fill="#2B2A26">③ 加性增:RT += R_AI,小步试探网络还有没有余量</text>
  <rect x="90" y="542" width="14" height="10" fill="#E3EAF4" stroke="#3D5A80" stroke-width="0.8"/>
  <text x="112" y="551" font-size="11" fill="#2B2A26">④ 超增:长期无 CNP,RT += i×R_HAI,大步冲向线速</text>
  <rect x="90" y="566" width="14" height="10" fill="#EDDCD8" stroke="#A05248" stroke-width="0.8"/>
  <text x="112" y="575" font-size="11" fill="#2B2A26">α 动力学:有 CNP 的周期 α←(1−g)α+g(下一刀更狠);安静周期 α←(1−g)α(下一刀变轻)</text>

  <!-- 右侧:每流状态卡 -->
  <rect x="800" y="130" width="380" height="168" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="820" y="158" font-size="12.5" font-weight="700" fill="#1F4A3E">每流状态,住在网卡上下文里【实现】</text>
  <text x="820" y="184" font-size="10.5" fill="#24473F">RC:当前速率 —— 发包整形器直接执行它</text>
  <text x="820" y="204" font-size="10.5" fill="#24473F">RT:目标速率 —— 恢复阶段的锚点</text>
  <text x="820" y="224" font-size="10.5" fill="#24473F">α:拥塞程度的 EWMA 估计 —— 决定下刀深浅</text>
  <text x="820" y="244" font-size="10.5" fill="#24473F">定时器 + 字节计数:两路"安静周期"时钟,</text>
  <text x="820" y="262" font-size="10.5" fill="#24473F">谁先到谁触发一次涨速</text>
  <text x="820" y="286" font-size="10.5" font-weight="700" fill="#1F4A3E">收 CNP、更新 α、调速率:全程 0 CPU 参与【事实】</text>

  <!-- 右侧:与 TCP 对账卡 -->
  <rect x="800" y="318" width="380" height="140" rx="8" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="820" y="346" font-size="12.5" font-weight="700" fill="#2B2A26">与 TCP 拥塞控制对账</text>
  <text x="820" y="372" font-size="10.5" fill="#6B675C">同:乘性减 + 加性增,AIMD 一族的思想</text>
  <text x="820" y="392" font-size="10.5" fill="#6B675C">异① 信号:交换机显式标记(CE→CNP),不等丢包</text>
  <text x="820" y="412" font-size="10.5" fill="#6B675C">异② 执行:网卡硬件里跑,不经内核协议栈</text>
  <text x="820" y="432" font-size="10.5" fill="#6B675C">异③ 对象:直接整形发送速率,不是滑动窗口</text>

  <!-- 底部要点 -->
  <rect x="48" y="596" width="1132" height="1.2" fill="#D8D5C8"/>
  <text x="48" y="622" font-size="10.5" fill="#6B675C">NP 侧限频:同一条流微秒级至多回一个 CNP —— 信令量有界【实现】;CNP 走独立高优先级 TC,决不能与数据同队列被一起堵死【实践】</text>
  <text x="48" y="644" font-size="10.5" fill="#7A392F">DCQCN 的收敛依赖全网参数一致(g、R_AI、ECN 阈值):半个网配错,表现为速率锯齿与吞吐塌陷【实践】</text>
</svg>
