<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<title id="title">一次 READ 的全路径：从注册到可回收终态</title>
<desc id="desc">四条泳道展示应用、引擎与元数据、RDMA worker、RNIC之间的调用与完成。提交返回发生在硬件完成之前。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">一次 READ 的全路径：从注册到可回收终态</text>
<text x="48" y="76" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">Mooncake classic · 97030cacfbf8 · CPU 内存</text>
<line x1="48" y1="96" x2="1192" y2="96" stroke="#D8D5C8" stroke-width="1"/>
<rect x="56" y="114" width="1128" height="104" rx="8" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="70" y="135" font-size="12" fill="#3D5A80" text-anchor="start" font-weight="700" data-role="body">应用线程</text>
<rect x="56" y="228" width="1128" height="104" rx="8" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="70" y="249" font-size="12" fill="#2F6B5E" text-anchor="start" font-weight="700" data-role="body">引擎 / 元数据</text>
<rect x="56" y="342" width="1128" height="104" rx="8" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="70" y="363" font-size="12" fill="#6B5B95" text-anchor="start" font-weight="700" data-role="body">RDMA WorkerPool</text>
<rect x="56" y="456" width="1128" height="104" rx="8" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="70" y="477" font-size="12" fill="#A64B3C" text-anchor="start" font-weight="700" data-role="body">RNIC / DMA</text>
<rect x="74" y="146" width="200" height="55" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="174.0" y="167.05" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">① 注册 / openSegment</text>
<text x="174.0" y="189.05" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">获得有效目标描述</text>
<rect x="310" y="146" width="215" height="55" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="417.5" y="167.05" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">② allocateBatchID</text>
<text x="417.5" y="189.05" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">submitTransfer</text>
<rect x="564" y="151" width="410" height="45" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="769.0" y="178.05" font-size="13" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">提交返回；buffer 与 request 继续存活</text>
<rect x="1004" y="146" width="164" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1086.0" y="167.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">⑪ 查询终态</text>
<text x="1086.0" y="189.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">再回收 batch</text>
<rect x="74" y="262" width="200" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="174.0" y="283.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">描述发布 / 查找</text>
<text x="174.0" y="305.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">不是数据中转站</text>
<rect x="310" y="262" width="215" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="417.5" y="283.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">③ MultiTransport</text>
<text x="417.5" y="305.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">选 transport / 建 task</text>
<rect x="568" y="262" width="198" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="667.0" y="283.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">④ 切分 slices</text>
<text x="667.0" y="305.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">本地 MR / lkey</text>
<rect x="1004" y="262" width="164" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1086.0" y="283.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">⑩ 聚合计数</text>
<text x="1086.0" y="305.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">成功数 + 失败数</text>
<rect x="568" y="376" width="198" height="55" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="667.0" y="397.05" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">⑤ 目标 MR / rkey</text>
<text x="667.0" y="419.05" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="400" data-role="body">选择 peer NIC</text>
<rect x="796" y="376" width="186" height="55" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="889.0" y="397.05" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">⑥ 建连 / ready</text>
<text x="889.0" y="419.05" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="400" data-role="body">submitPostSend</text>
<rect x="1004" y="376" width="164" height="55" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="1086.0" y="397.05" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">⑨ CQ 完成处理</text>
<text x="1086.0" y="419.05" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="400" data-role="body">成功或重派</text>
<rect x="796" y="490" width="186" height="55" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="889.0" y="511.05" font-size="13" fill="#733428" text-anchor="middle" font-weight="700" data-role="body">⑦ ibv_post_send</text>
<text x="889.0" y="533.05" font-size="13" fill="#733428" text-anchor="middle" font-weight="400" data-role="body">SGE / WR 链</text>
<rect x="1004" y="490" width="164" height="55" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="1086.0" y="511.05" font-size="13" fill="#733428" text-anchor="middle" font-weight="700" data-role="body">⑧ RDMA READ</text>
<text x="1086.0" y="533.05" font-size="13" fill="#733428" text-anchor="middle" font-weight="400" data-role="body">B → A 本地内存</text>
