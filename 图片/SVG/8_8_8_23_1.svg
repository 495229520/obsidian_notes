<line x1="1086" y1="259" x2="1086" y2="204" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="74" y="596" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">观察点：submit_return ≠ last_CQE ≠ 应用验证完成</text>
<line x1="48" y1="630" x2="1192" y2="630" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="656" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">冷路径：注册、描述发现、首次握手可被后续传输复用。箭头表示顺序，不按耗时比例。</text>
<text x="48" y="677" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">范围：classic RDMA，非 USE_TENT；其他后端另论。</text>
</svg>