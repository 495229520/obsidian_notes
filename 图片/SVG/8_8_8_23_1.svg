<line x1="527" y1="288" x2="565" y2="288" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="667" y1="319" x2="667" y2="373" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="768" y1="403" x2="793" y2="403" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="889" y1="433" x2="889" y2="487" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="984" y1="517" x2="1001" y2="517" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
