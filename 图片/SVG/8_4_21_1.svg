<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<title id="title">One-Sided KV：地址、布局与所有权</title>
<desc id="desc">教学布局。客户端通过 RDMA 操作远端注册内存。64 字节 Bucket 包括 8 字节 owner、4 字节 used、4 字节 flags 和三个 16 字节 Slot。Slot 包含 fingerprint 和相对偏移。64 字节 Record 包括 8 字节 version、16 字节 key、4 字节 value_len、4 字节 flags 和32字节 value。CAS 的目标是 owner，整个记录不因此成为原子快照。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" font-weight="700" text-anchor="start" fill="#2B2A26">One-Sided KV：地址、布局与所有权</text>
<text x="48" y="76" font-size="13" font-weight="400" text-anchor="start" fill="#6B675C">教学布局 · key 16 B / value ≤ 32 B · 非 HERD 源码布局</text>
