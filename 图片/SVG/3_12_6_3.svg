<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>持锁做阻塞 write：临界区时长由最慢的客户端决定</title>
  <desc>上半是广播线程与两个工作线程的时间线，下半是三级改法的对照表，每一级列出做法、临界区内容与遗留问题。</desc>
  <defs>
    <marker id="k1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="660" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">持锁做阻塞 write：临界区时长由最慢的客户端决定</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">锁本身是对的，没有数据竞争；问题是临界区里放了一个时长不受自己控制的操作</text>

  <text x="56" y="118" font-size="13" font-weight="700" fill="#4A473F">A · 一个不 read 的客户端出现时</text>

  <rect x="56" y="130" width="1128" height="182" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <text x="76" y="172" font-size="12" font-weight="700" fill="#2C4460">广播线程</text>
  <rect x="176" y="156" width="58" height="30" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="205" y="176" font-size="11.5" fill="#2C4460" text-anchor="middle">lock</text>
  <rect x="240" y="156" width="92" height="30" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="286" y="176" font-size="11.5" fill="#24473F" text-anchor="middle">write fd 7</text>
  <rect x="338" y="156" width="92" height="30" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="384" y="176" font-size="11.5" fill="#24473F" text-anchor="middle">write fd 8</text>
  <rect x="436" y="156" width="592" height="30" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.8"/>
  <text x="732" y="176" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">write fd 9 阻塞：对端不 read，发送缓冲区已满</text>
  <rect x="1034" y="156" width="66" height="30" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="1067" y="176" font-size="11.5" fill="#2C4460" text-anchor="middle">unlock</text>

  <text x="76" y="216" font-size="12" font-weight="700" fill="#4A473F">工作线程 2</text>
  <text x="76" y="230" font-size="10.5" fill="#6B675C">新连接要 insert</text>
  <rect x="240" y="200" width="788" height="30" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="634" y="220" font-size="11.5" fill="#733428" text-anchor="middle">堵在 lock：客户端连上了，进不了 client_users</text>

  <text x="76" y="260" font-size="12" font-weight="700" fill="#4A473F">工作线程 3</text>
  <text x="76" y="274" font-size="10.5" fill="#6B675C">断开要 erase</text>
  <rect x="338" y="244" width="690" height="30" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="683" y="264" font-size="11.5" fill="#733428" text-anchor="middle">堵在 lock：fd 不能 close，连接半关闭</text>

  <line x1="176" y1="288" x2="1100" y2="288" stroke="#9B968A" stroke-width="1" marker-end="url(#k1)"/>
  <text x="620" y="304" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">临界区总时长 = 最慢那个 write，可到 TCP 超时</text>

  <text x="56" y="348" font-size="13" font-weight="700" fill="#4A473F">B · 三级改法：每一级解决上一级，又暴露下一个问题</text>

  <rect x="56" y="360" width="1128" height="34" rx="6" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="76" y="382" font-size="11.5" font-weight="700" fill="#4A473F">级别</text>
  <text x="220" y="382" font-size="11.5" font-weight="700" fill="#4A473F">做法</text>
  <text x="520" y="382" font-size="11.5" font-weight="700" fill="#4A473F">临界区里剩什么</text>
  <text x="760" y="382" font-size="11.5" font-weight="700" fill="#4A473F">遗留问题</text>

  <rect x="56" y="398" width="1128" height="52" rx="6" fill="#F6F0E4" stroke="#D8D5C8" stroke-width="1"/>
  <text x="76" y="420" font-size="11.5" font-weight="700" fill="#8A6A3A">① 快照</text>
  <text x="76" y="438" font-size="10.5" fill="#6B675C">最小改动</text>
  <text x="220" y="420" font-size="11.5" fill="#4A473F">锁内复制列表，锁外 write</text>
  <text x="220" y="438" font-size="10.5" fill="#6B675C">两行就能改完</text>
  <text x="520" y="429" font-size="11.5" fill="#4A473F">一次内存拷贝</text>
  <text x="760" y="420" font-size="11.5" font-weight="700" fill="#733428">快照里的 fd 可能已被 close</text>
  <text x="760" y="438" font-size="10.5" fill="#733428">号码被复用则发给错误的客户端</text>

  <rect x="56" y="454" width="1128" height="52" rx="6" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1"/>
  <text x="76" y="476" font-size="11.5" font-weight="700" fill="#2C4460">② 入队</text>
  <text x="76" y="494" font-size="10.5" fill="#6B675C">改数据结构</text>
  <text x="220" y="476" font-size="11.5" fill="#4A473F">广播只入队，各连接自己发</text>
  <text x="220" y="494" font-size="10.5" fill="#6B675C">连接对象引用计数，不传裸 fd</text>
  <text x="520" y="485" font-size="11.5" fill="#4A473F">纯内存追加</text>
  <text x="760" y="476" font-size="11.5" font-weight="700" fill="#733428">慢客户端的队列一直涨</text>
  <text x="760" y="494" font-size="10.5" fill="#733428">不设上限就是内存被撑爆</text>

  <rect x="56" y="510" width="1128" height="52" rx="6" fill="#E9F1EC" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="76" y="532" font-size="11.5" font-weight="700" fill="#24473F">③ 背压</text>
  <text x="76" y="550" font-size="10.5" fill="#6B675C">Reactor 做法</text>
  <text x="220" y="532" font-size="11.5" fill="#4A473F">非阻塞 fd + 有界队列</text>
  <text x="220" y="550" font-size="10.5" fill="#6B675C">EAGAIN 就留队列，等 epoll 报可写</text>
  <text x="520" y="541" font-size="11.5" fill="#4A473F">纯内存追加</text>
  <text x="760" y="532" font-size="11.5" font-weight="700" fill="#24473F">超上限时丢旧消息或断开</text>
  <text x="760" y="550" font-size="10.5" fill="#4A473F">muduo 的 outputBuffer + 高水位回调</text>

  <text x="48" y="600" font-size="12" fill="#6B675C">log_message 是同一个毛病换了个慢的东西：fopen / fclose 在锁内，磁盘忙时 log_mutex 一直握着。</text>
  <text x="48" y="622" font-size="12" fill="#6B675C">推理服务里的同一条规则：不要在持锁时调 cudaDeviceSynchronize()、等推理结果、或写日志。</text>
</svg>
