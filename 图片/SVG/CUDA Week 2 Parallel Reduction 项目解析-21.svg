<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">模板声明与显式实例化</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">21 模板 API：.cuh 声明 + .cu 定义 + 显式实例化</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“9.3 声明与实现分离”后</text>
<rect x="90" y="155" width="330" height="170" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="108" y="183" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="start">.cuh：只暴露声明</text>
<text x="108" y="210" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">// reduce_naive.cuh</text>
<text x="108" y="230" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">template &lt;typename T&gt;</text>
<text x="108" y="250" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">T reduce_naive(const T* d_input,</text>
<text x="108" y="270" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">               int n, int threads_per_block=256);</text>
<rect x="490" y="155" width="330" height="220" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="508" y="183" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="start">.cu：实现 host wrapper + kernel</text>
<text x="508" y="210" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">// reduce_naive.cu</text>
<text x="508" y="230" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">template &lt;typename T&gt;</text>
<text x="508" y="250" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">T reduce_naive(...) {</text>
<text x="508" y="270" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">  launch kernel;</text>
<text x="508" y="290" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">  copy partials;</text>
<text x="508" y="310" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">  CPU final sum;</text>
<text x="508" y="330" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">}</text>
<rect x="890" y="155" width="330" height="170" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="908" y="183" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="start">.cu 底部：显式实例化</text>
<text x="908" y="210" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">template float reduce_naive&lt;float&gt;(const float*, int, int);</text>
<text x="908" y="230" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">template int reduce_naive&lt;int&gt;(const int*, int, int);</text>
<line x1="420" y1="240" x2="490" y2="240" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="820" y1="240" x2="890" y2="240" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180" y="480" width="940" height="110" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="180" y="480" width="940" height="8" rx="18" fill="#7C3AED" opacity="1"/>
<text x="200" y="514" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">为什么这样做</text>
<text x="200" y="544" font-size="14" font-weight="400" fill="#334155" text-anchor="start">编译隔离：测试文件不需要看到 kernel 实现</text>
<text x="200" y="565" font-size="14" font-weight="400" fill="#334155" text-anchor="start">类型控制：当前只保证 float / int</text>
<text x="200" y="586" font-size="14" font-weight="400" fill="#334155" text-anchor="start">扩展 double 时必须补显式实例化 + 测试 + benchmark</text>
</svg>
