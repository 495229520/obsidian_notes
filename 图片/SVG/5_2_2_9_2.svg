<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<title>K 个一组翻转：保存前后边界，再接回整链</title>
<desc>示例 k = 3；绿色标出组外边界，琥珀色标出正在处理的三个节点。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect width="1240" height="620" fill="rgb(245, 244, 237)"/>
<text x="48" y="50" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">K 个一组翻转：保存前后边界，再接回整链</text>
<text x="48" y="80" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400">示例 k = 3；绿色标出组外边界，琥珀色标出正在处理的三个节点。</text>
<text x="48" y="125" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700">A · 找满一组，记录 groupNext</text>
<rect x="240" y="173" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="273.0" y="199" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">D</text>
<path d="M309,193 L381,193" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="388" y="173" width="66" height="40" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
<text x="421.0" y="199" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">1</text>
<path d="M457,193 L529,193" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="536" y="173" width="66" height="40" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
<text x="569.0" y="199" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">2</text>
<path d="M605,193 L677,193" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="684" y="173" width="66" height="40" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
<text x="717.0" y="199" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">3</text>
<path d="M753,193 L825,193" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="832" y="173" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="865.0" y="199" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">4</text>
<path d="M901,193 L973,193" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="980" y="173" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="1013.0" y="199" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">5</text>
<path d="M1049,193 L1079,193" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="1086" y="198" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">null</text>
<text x="273" y="156" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="400">groupPrev</text>
<text x="421" y="156" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="400">oldFirst</text>
<text x="717" y="156" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="400">kth</text>
<text x="865" y="156" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="400">groupNext</text>
<text x="48" y="272" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="700">B · 翻转并重连</text>
<rect x="240" y="320" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="273.0" y="346" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">D</text>
<path d="M309,340 L381,340" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="388" y="320" width="66" height="40" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
<text x="421.0" y="346" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">3</text>
<path d="M457,340 L529,340" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="536" y="320" width="66" height="40" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
<text x="569.0" y="346" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">2</text>
<path d="M605,340 L677,340" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="684" y="320" width="66" height="40" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
<text x="717.0" y="346" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">1</text>
<path d="M753,340 L825,340" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="832" y="320" width="66" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="865.0" y="346" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">4</text>
<path d="M901,340 L973,340" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="980" y="320" width="66" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="1013.0" y="346" font-size="17" fill="#2B2A26" text-anchor="middle" font-weight="400">5</text>
<path d="M1049,340 L1079,340" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="1086" y="345" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">null</text>
<text x="273" y="304" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="400">原 groupPrev</text>
<text x="421" y="304" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="400">新组头 kth</text>
<text x="717" y="304" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="400">新组尾 oldFirst</text>
<text x="865" y="304" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="400">groupNext</text>
<text x="717" y="391" font-size="14" fill="#2F6B5E" text-anchor="middle" font-weight="400">下一轮 groupPrev</text>
<rect x="48" y="430" width="1144" height="112" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text x="70" y="460" font-size="16" fill="#2F6B5E" text-anchor="start" font-weight="400">prev = groupNext</text>
<text x="405" y="460" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="400">groupPrev-&gt;next = kth</text>
<text x="810" y="460" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="400">groupPrev = oldFirst</text>
<text x="70" y="496" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="400">原首节点先接好后段</text>
<text x="405" y="496" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="400">组前驱接新组头</text>
<text x="810" y="496" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="400">从新组尾开始找下一组</text>
<text x="48" y="587" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="400">剩余 4 → 5 不足 3 个节点：查组长时退出，保留原序。24 题对应 k = 2。</text>
</svg>