<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">CUDA Host-Device Transfer Bottleneck and Process Thread Roles</title>
  <desc id="desc">Diagram showing OS process, CPU threads, CUDA Runtime, PCIe or NVLink transfer path, GPU device memory, copy engine, and CUDA threads.</desc>

  <defs>
    <style>
      .bg { fill: rgb(245, 244, 237); }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .host { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .runtime { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .bus { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .gpu { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .note { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .title { font: 700 28px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .h2 { font: 700 20px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .text { font: 500 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 14px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .muted { font: 500 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .warn { font: 700 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #b91c1c; }
      .transfer-label { font: 600 14px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #b91c1c; }
      .arrow { fill: none; stroke: #0f172a; stroke-width: 2.5; marker-end: url(#arrowhead); }
      .arrow-red { fill: none; stroke: #dc2626; stroke-width: 3; marker-end: url(#arrowhead-red); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrowhead-blue); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 2.5; marker-end: url(#arrowhead-green); }
      .dash { stroke-dasharray: 8 7; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L6,3.5 L1,6" fill="none" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrowhead-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L6,3.5 L1,6" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L6,3.5 L1,6" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrowhead-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L6,3.5 L1,6" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="780" rx="0" />
  <text class="title" x="44" y="52">CUDA Host-Device 数据传输瓶颈与进程/线程角色</text>
  <text class="small" x="46" y="82">进程拥有资源和上下文，CPU 线程提交拷贝与 kernel，CUDA 线程在 GPU 上执行计算。</text>

  <rect class="lane" x="40" y="115" width="1180" height="635" rx="22" />

  <rect class="host" x="70" y="150" width="300" height="435" rx="18" />
  <text class="h2" x="95" y="188">OS Process / Host Program</text>
  <text class="small" x="95" y="216">拥有 host 地址空间与 CUDA context</text>

  <rect class="note" x="95" y="245" width="230" height="72" rx="12" />
  <text class="text" x="117" y="276">Host Address Space</text>
  <text class="muted" x="117" y="300">std::vector / heap / stack</text>

  <rect class="note" x="95" y="340" width="230" height="72" rx="12" />
  <text class="text" x="117" y="371">Pageable Host Memory</text>
  <text class="muted" x="117" y="395">普通 CPU 内存</text>

  <rect class="note" x="95" y="435" width="230" height="72" rx="12" />
  <text class="text" x="117" y="466">Pinned Host Memory</text>
  <text class="muted" x="117" y="490">page-locked，利于 async copy</text>

  <rect class="runtime" x="435" y="150" width="275" height="435" rx="18" />
  <text class="h2" x="465" y="188">CPU Threads / Runtime</text>
  <text class="small" x="465" y="216">发命令、排队、同步，不执行 kernel body</text>

  <rect class="note" x="465" y="245" width="215" height="64" rx="12" />
  <text class="text" x="485" y="273">Main CPU Thread</text>
  <text class="muted" x="485" y="295">host code orchestration</text>

  <rect class="note" x="465" y="330" width="215" height="64" rx="12" />
  <text class="text" x="485" y="358">Worker CPU Thread</text>
  <text class="muted" x="485" y="380">prepare next batch</text>

  <rect class="note" x="465" y="415" width="215" height="104" rx="12" />
  <text class="text" x="485" y="445">CUDA Runtime API</text>
  <text class="muted" x="485" y="471">cudaMemcpy / Async</text>
  <text class="muted" x="485" y="493">kernel launch / stream</text>

  <rect class="bus" x="755" y="225" width="170" height="280" rx="20" />
  <text class="h2" x="786" y="265">PCIe / NVLink</text>
  <text class="small" x="792" y="292">Host ↔ Device</text>
  <text class="warn" x="789" y="342">Bottleneck</text>
  <text class="warn" x="797" y="366">often here</text>
  <text class="muted" x="784" y="418">带宽 + 延迟</text>
  <text class="muted" x="780" y="444">小而频繁 copy 更差</text>

  <rect class="gpu" x="975" y="150" width="220" height="435" rx="18" />
  <text class="h2" x="1006" y="188">GPU Device</text>
  <text class="small" x="1003" y="216">数据到达后才由 CUDA 线程计算</text>

  <rect class="note" x="1005" y="245" width="160" height="64" rx="12" />
  <text class="text" x="1025" y="273">Copy Engine</text>
  <text class="muted" x="1025" y="295">DMA transfer</text>

  <rect class="note" x="1005" y="330" width="160" height="72" rx="12" />
  <text class="text" x="1025" y="360">Device Memory</text>
  <text class="muted" x="1025" y="384">global memory</text>

  <rect class="note" x="1005" y="430" width="160" height="88" rx="12" />
  <text class="text" x="1025" y="460">SMs</text>
  <text class="muted" x="1025" y="484">many CUDA threads</text>
  <text class="muted" x="1025" y="506">execute kernel</text>

  <path class="arrow-blue" d="M325 376 C372 376, 410 376, 465 448" />
  <text class="small" x="350" y="353">host pointer</text>

  <path class="arrow-red" d="M680 455 C715 455, 725 365, 755 365" />
  <text class="small" x="692" y="430">H2D / D2H</text>

  <path class="arrow-red" d="M925 365 C948 365, 970 365, 1005 365" />
  <text class="small" x="935" y="345">to device memory</text>

  <path class="arrow-red dash" d="M1005 391 C955 560, 520 592, 330 510" />
  <rect class="bus" x="730" y="520" width="235" height="38" rx="10" />
  <text class="transfer-label" x="748" y="544">D2H result copy via PCIe / NVLink</text>

  <path class="arrow-green" d="M680 468 C790 555, 920 555, 1005 474" />
  <text class="small" x="780" y="584">kernel launch control path</text>

  <path class="arrow-green" d="M1085 402 L1085 430" />

  <rect class="note" x="120" y="665" width="320" height="55" rx="12" />
  <text class="small" x="142" y="691">Pinned memory helps async copy / overlap</text>
  <text class="muted" x="142" y="711">但不是越多越好，会影响系统内存管理</text>

  <rect class="note" x="495" y="665" width="300" height="55" rx="12" />
  <text class="small" x="517" y="691">CPU threads issue commands</text>
  <text class="muted" x="517" y="711">更多 CPU 线程不等于更高总线带宽</text>

  <rect class="note" x="850" y="665" width="310" height="55" rx="12" />
  <text class="small" x="872" y="691">Not the same as memory coalescing</text>
  <text class="muted" x="872" y="711">coalescing 是 GPU 内部访存模式问题</text>
</svg>
