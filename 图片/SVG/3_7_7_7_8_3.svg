<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">QinQ：客户编号复用，运营方服务上下文隔离</title>
<desc id="desc">教学场景：保留 C-Tag，只在运营网边界 push / pop S-Tag；不配置 VLAN translation。</desc>
<defs>
<marker id="arr-bs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-gs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/></marker>
<marker id="arr-rs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-ns" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8574"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="660" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="46" font-size="23" fill="#2B2A26" font-weight="700" text-anchor="start">QinQ：客户编号复用，运营方服务上下文隔离</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">教学场景：保留 C-Tag，只在运营网边界 push / pop S-Tag；不配置 VLAN translation。</text>
<rect x="318" y="118" width="594" height="414" rx="8" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="336" y="145" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">运营方网络：按服务上下文转发</text>
<text x="48" y="145" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">客户接入</text>
<text x="964" y="145" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">客户交付</text>
<rect x="48" y="180" width="220" height="76" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="158.0" y="211.5" font-size="16" fill="#2C4460" font-weight="700" text-anchor="middle">客户甲</text>
<text x="158.0" y="234.5" font-size="16" fill="#2C4460" font-weight="400" text-anchor="middle">C-VLAN 10</text>
<line x1="272" y1="218" x2="338" y2="218" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)"/>
<rect x="342" y="180" width="144" height="76" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="414.0" y="211.5" font-size="15" fill="#73531F" font-weight="700" text-anchor="middle">Push</text>
<text x="414.0" y="234.5" font-size="15" fill="#73531F" font-weight="400" text-anchor="middle">S=100</text>
<line x1="490" y1="218" x2="526" y2="218" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)"/>
<rect x="532" y="180" width="152" height="76" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="608.0" y="211.5" font-size="16" fill="#2C4460" font-weight="700" text-anchor="middle">S=100</text>
<text x="608.0" y="234.5" font-size="16" fill="#2C4460" font-weight="400" text-anchor="middle">C=10</text>
<line x1="688" y1="218" x2="726" y2="218" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)"/>
<rect x="732" y="180" width="144" height="76" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="804.0" y="211.5" font-size="15" fill="#73531F" font-weight="700" text-anchor="middle">Pop</text>
<text x="804.0" y="234.5" font-size="15" fill="#73531F" font-weight="400" text-anchor="middle">只移除 S</text>
<line x1="880" y1="218" x2="956" y2="218" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)"/>
<rect x="962" y="180" width="230" height="76" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1077.0" y="211.5" font-size="16" fill="#2C4460" font-weight="700" text-anchor="middle">客户甲</text>
<text x="1077.0" y="234.5" font-size="16" fill="#2C4460" font-weight="400" text-anchor="middle">C-VLAN 10</text>
<text x="346" y="292" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">DA / SA 不因普通标签堆叠而多一套</text>
<rect x="48" y="354" width="220" height="76" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="158.0" y="385.5" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle">客户乙</text>
<text x="158.0" y="408.5" font-size="16" fill="#24473F" font-weight="400" text-anchor="middle">C-VLAN 10</text>
<line x1="272" y1="392" x2="338" y2="392" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-gs)"/>
<rect x="342" y="354" width="144" height="76" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="414.0" y="385.5" font-size="15" fill="#73531F" font-weight="700" text-anchor="middle">Push</text>
<text x="414.0" y="408.5" font-size="15" fill="#73531F" font-weight="400" text-anchor="middle">S=200</text>
<line x1="490" y1="392" x2="526" y2="392" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-gs)"/>
<rect x="532" y="354" width="152" height="76" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="608.0" y="385.5" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle">S=200</text>
<text x="608.0" y="408.5" font-size="16" fill="#24473F" font-weight="400" text-anchor="middle">C=10</text>
<line x1="688" y1="392" x2="726" y2="392" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-gs)"/>
<rect x="732" y="354" width="144" height="76" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="804.0" y="385.5" font-size="15" fill="#73531F" font-weight="700" text-anchor="middle">Pop</text>
<text x="804.0" y="408.5" font-size="15" fill="#73531F" font-weight="400" text-anchor="middle">只移除 S</text>
<line x1="880" y1="392" x2="956" y2="392" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-gs)"/>
<rect x="962" y="354" width="230" height="76" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1077.0" y="385.5" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle">客户乙</text>
<text x="1077.0" y="408.5" font-size="16" fill="#24473F" font-weight="400" text-anchor="middle">C-VLAN 10</text>
<text x="346" y="466" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">DA / SA 不因普通标签堆叠而多一套</text>
<line x1="334" y1="330" x2="896" y2="330" stroke="#8A8574" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="50" y="563" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">隔离键有层次：S=100 与 S=200 不合并；两个 C=10 不需要在客户之间统一规划。</text>
<text x="50" y="598" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">同 S-VLAN 内的客户隔离仍要核对服务模型；两个 12-bit 不等于一个统一 24-bit VLAN。</text>
<text x="50" y="625" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">QinQ 仍是以太网服务承载；它不会让中间普通 IP 路由器自动成为二层隧道端点。</text>
</svg>