<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>会话、进程组、控制终端的三层结构，以及 PID/PGID/SID 三个标识的来源与可变性</title>
  <desc>上半画一个终端会话的完整结构：控制终端、会话首进程 bash、唯一的前台进程组和若干后台进程组，前台组用一条三段管道作为例子；下半是 PID、PGID、SID 三个标识分别从哪来、谁能改、什么情况下改不动的对照表。</desc>
  <defs>
    <marker id="g1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">一条命令行为什么要三层身份：PID、PGID、SID</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">ls | grep foo | wc -l 是三个进程，按 Ctrl+C 要三个一起停，靠的就是它们共用一个 PGID</text>

  <text x="56" y="118" font-size="13" font-weight="700" fill="#4A473F">A · 一个终端会话的完整结构</text>

  <rect x="56" y="132" width="1128" height="266" rx="8" fill="#FBFBF6" stroke="#8A8574" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="76" y="152" font-size="12" font-weight="700" fill="#4A473F">会话 Session · SID = 4501 · 会话首进程是 bash</text>

  <rect x="76" y="166" width="190" height="90" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="171" y="192" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">控制终端</text>
  <text x="171" y="214" font-size="11" fill="#4A3F68" text-anchor="middle">/dev/pts/0</text>
  <text x="171" y="236" font-size="10.5" fill="#4A3F68" text-anchor="middle">一个会话最多挂一个</text>

  <rect x="76" y="272" width="190" height="90" rx="7" fill="#EDEBE3" stroke="#8A8574" stroke-width="1.5"/>
  <text x="171" y="298" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">bash：会话首进程</text>
  <text x="171" y="320" font-size="11" fill="#4A473F" text-anchor="middle">PID = PGID = SID = 4501</text>
  <text x="171" y="342" font-size="10.5" fill="#4A473F" text-anchor="middle">右边的组都是它 fork 的</text>

  <rect x="286" y="166" width="424" height="196" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="2"/>
  <text x="302" y="190" font-size="12" font-weight="700" fill="#2C4460">前台进程组 · PGID 4712</text>
  <text x="302" y="208" font-size="10.5" fill="#2C4460">一条管道就是一个作业，同一时刻只有一个组在前台</text>

  <rect x="300" y="218" width="130" height="62" rx="6" fill="#D3E0F0" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="365" y="242" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">ls</text>
  <text x="365" y="262" font-size="10.5" fill="#2C4460" text-anchor="middle">PID 4712 · 组长</text>
  <rect x="440" y="218" width="130" height="62" rx="6" fill="#D3E0F0" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="505" y="242" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">grep foo</text>
  <text x="505" y="262" font-size="10.5" fill="#2C4460" text-anchor="middle">PID 4713</text>
  <rect x="580" y="218" width="118" height="62" rx="6" fill="#D3E0F0" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="639" y="242" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">wc -l</text>
  <text x="639" y="262" font-size="10.5" fill="#2C4460" text-anchor="middle">PID 4714</text>

  <text x="302" y="304" font-size="11" fill="#2C4460">PGID 就是组长的 PID，组长死了 PGID 也不换</text>
  <text x="302" y="326" font-size="11" font-weight="700" fill="#2C4460">Ctrl+C 打断的就是这一组，三个一起收到</text>
  <text x="302" y="348" font-size="11" fill="#2C4460">只有前台组能自由读写控制终端</text>

  <rect x="726" y="166" width="210" height="196" rx="7" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="742" y="190" font-size="12" font-weight="700" fill="#6B4E28">后台组 · PGID 4720</text>
  <text x="742" y="208" font-size="10.5" fill="#6B4E28">sleep 100 &amp;</text>
  <rect x="740" y="218" width="182" height="62" rx="6" fill="#E8DBC2" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="831" y="242" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">sleep</text>
  <text x="831" y="262" font-size="10.5" fill="#6B4E28" text-anchor="middle">PID 4720 · 组长</text>
  <text x="742" y="304" font-size="11" fill="#6B4E28">读终端会被 SIGTTIN 停住</text>
  <text x="742" y="326" font-size="11" fill="#6B4E28">Ctrl+C 与它无关</text>
  <text x="742" y="348" font-size="11" fill="#6B4E28">fg %1 可以换到前台</text>

  <rect x="952" y="166" width="216" height="196" rx="7" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="968" y="190" font-size="12" font-weight="700" fill="#6B4E28">后台组 · PGID 4733</text>
  <text x="968" y="208" font-size="10.5" fill="#6B4E28">make -j4 &amp;</text>
  <rect x="966" y="218" width="188" height="28" rx="5" fill="#E8DBC2" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="1060" y="237" font-size="10.5" fill="#6B4E28" text-anchor="middle">make · PID 4733 · 组长</text>
  <rect x="966" y="252" width="188" height="28" rx="5" fill="#E8DBC2" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="1060" y="271" font-size="10.5" fill="#6B4E28" text-anchor="middle">cc1 · PID 4741</text>
  <text x="968" y="304" font-size="11" fill="#6B4E28">两个后台作业互不影响</text>
  <text x="968" y="326" font-size="11" fill="#6B4E28">kill -4733 只打中这一组</text>
  <text x="968" y="348" font-size="11" fill="#6B4E28">组内进程仍各自有 PID</text>

  <line x1="270" y1="211" x2="282" y2="211" stroke="#5A564B" stroke-width="1.8" marker-end="url(#g1)"/>

  <text x="56" y="430" font-size="13" font-weight="700" fill="#4A473F">B · 三个标识从哪来，谁能改，什么时候改不动</text>

  <rect x="56" y="444" width="1128" height="30" rx="6" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="72" y="464" font-size="11.5" font-weight="700" fill="#4A473F">标识</text>
  <text x="258" y="464" font-size="11.5" font-weight="700" fill="#4A473F">从哪来</text>
  <text x="554" y="464" font-size="11.5" font-weight="700" fill="#4A473F">谁能改</text>
  <text x="860" y="464" font-size="11.5" font-weight="700" fill="#4A473F">什么时候改不动</text>

  <rect x="56" y="480" width="180" height="52" rx="6" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="72" y="502" font-size="11.5" font-weight="700" fill="#4A473F">PID</text>
  <text x="72" y="520" font-size="10.5" fill="#6B675C">进程标识符</text>
  <rect x="242" y="480" width="290" height="52" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="258" y="502" font-size="11.5" fill="#4A473F">fork() 时由内核分配</text>
  <text x="258" y="520" font-size="10.5" fill="#6B675C">全系统唯一，进程消失后可被复用</text>
  <rect x="538" y="480" width="300" height="52" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="554" y="502" font-size="11.5" fill="#4A473F">谁都改不了</text>
  <text x="554" y="520" font-size="10.5" fill="#6B675C">没有对应的 setpid()</text>
  <rect x="844" y="480" width="340" height="52" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="860" y="502" font-size="11.5" fill="#4A473F">一直不变</text>
  <text x="860" y="520" font-size="10.5" fill="#6B675C">exec 换掉整个程序，PID 照旧</text>

  <rect x="56" y="538" width="180" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="72" y="560" font-size="11.5" font-weight="700" fill="#2C4460">PGID</text>
  <text x="72" y="578" font-size="10.5" fill="#2C4460">进程组标识符</text>
  <rect x="242" y="538" width="290" height="52" rx="6" fill="#EEF3F9" stroke="#D8D5C8" stroke-width="1"/>
  <text x="258" y="560" font-size="11.5" fill="#2C4460">fork() 从父进程继承</text>
  <text x="258" y="578" font-size="10.5" fill="#6B675C">所以管道里的进程天然同组</text>
  <rect x="538" y="538" width="300" height="52" rx="6" fill="#EEF3F9" stroke="#D8D5C8" stroke-width="1"/>
  <text x="554" y="560" font-size="11.5" fill="#2C4460">setpgid(pid, pgid)</text>
  <text x="554" y="578" font-size="10.5" fill="#6B675C">只能改自己或自己的子进程</text>
  <rect x="844" y="538" width="340" height="52" rx="6" fill="#EEF3F9" stroke="#D8D5C8" stroke-width="1"/>
  <text x="860" y="560" font-size="11.5" fill="#2C4460">子进程一旦 exec 就改不动了</text>
  <text x="860" y="578" font-size="10.5" fill="#6B675C">父进程再调会拿到 EACCES</text>

  <rect x="56" y="596" width="180" height="52" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="72" y="618" font-size="11.5" font-weight="700" fill="#4A3F68">SID</text>
  <text x="72" y="636" font-size="10.5" fill="#4A3F68">会话标识符</text>
  <rect x="242" y="596" width="290" height="52" rx="6" fill="#F2F0F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="258" y="618" font-size="11.5" fill="#4A3F68">fork() 从父进程继承</text>
  <text x="258" y="636" font-size="10.5" fill="#6B675C">整个终端下的进程共用一个</text>
  <rect x="538" y="596" width="300" height="52" rx="6" fill="#F2F0F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="554" y="618" font-size="11.5" fill="#4A3F68">setsid()，只能改自己</text>
  <text x="554" y="636" font-size="10.5" fill="#6B675C">一次同时新建会话和新建组</text>
  <rect x="844" y="596" width="340" height="52" rx="6" fill="#F2F0F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="860" y="618" font-size="11.5" fill="#4A3F68">调用者已经是组长就失败</text>
  <text x="860" y="636" font-size="10.5" fill="#6B675C">返回 -1 并置 EPERM，所以要先 fork</text>

  <text x="68" y="700" font-size="11.5" fill="#4A473F">三个标识的作用域是层层放大的：PID 认一个进程，PGID 认一个作业，SID 认一次登录。信号能一次打中一组，靠的是中间这层。</text>
  <text x="68" y="724" font-size="11.5" fill="#4A473F">setsid() 之后进程脱离原会话，也就丢掉了控制终端，从此收不到 Ctrl+C 和 SIGHUP。守护进程就是这么造出来的。</text>
</svg>
