<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">AEAD 的输入、输出与明文释放边界</title><desc id="desc">nonce 可以公开；AAD 被认证但不加密；key 必须留在授权边界内。。教学示意图，不代表实测数据。</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#345AC9"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127B6A"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#AE4247"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#586375"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A641B"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="870" rx="0" fill="rgb(245, 244, 237)"/>
<text x="42" y="35" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" text-anchor="start">8 · 9 · 9 · 13 · 3</text>
<text x="42" y="81" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" text-anchor="start">AEAD 的输入、输出与明文释放边界</text>
<text x="42" y="119" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">nonce 可以公开；AAD 被认证但不加密；key 必须留在授权边界内。</text>
<path d="M42 141 L1158 141" fill="none" stroke="#D1D7DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="42" y="176" width="300" height="113" rx="14" fill="#E8EDF9" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="58" y="196" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="74" y="219" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">明文 P</text>
<text x="64" y="256" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">需要隐藏的 chunk 字节</text>
<rect x="42" y="325" width="300" height="139" rx="14" fill="#E7F1EC" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="58" y="345" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="74" y="368" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">关联数据 AAD</text>
<text x="64" y="405" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">对象、版本、索引、长度</text>
<text x="64" y="434" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">公开，但参与认证</text>
<rect x="416" y="207" width="326" height="235" rx="14" fill="#19263D"/>
<text x="579" y="251" fill="#FFFFFF" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Seal(K, N, P, A)</text>
<text x="579" y="299" fill="#FFFFFF" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" text-anchor="middle">AES-GCM</text>
<text x="579" y="344" fill="#D9E2F3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">加密 + 认证</text>
<text x="579" y="393" fill="#D9E2F3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">调用成熟 AEAD 库</text>
<path d="M346 234 L411 234" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M346 387 L411 387" fill="none" stroke="#127B6A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="816" y="207" width="342" height="118" rx="14" fill="#E8EDF9" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="832" y="227" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="848" y="250" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">输出：C + T</text>
<text x="838" y="287" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">密文 + 完整 16-byte tag</text>
<path d="M747 265 L810 265" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="816" y="351" width="342" height="113" rx="14" fill="#F8EEDB" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="832" y="371" width="4" height="28" rx="2" fill="#9A641B"/>
<text x="848" y="394" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">另保存 nonce</text>
<text x="838" y="431" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">12 字节；同 key 加密不重复</text>
<rect x="416" y="473" width="326" height="69" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<text x="579" y="503" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">授权 key K + 唯一 nonce N</text>
<text x="579" y="528" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle">key 不随密文公开</text>
<path d="M579 471 L579 448" fill="none" stroke="#9A641B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<path d="M42 565 L1158 565" fill="none" stroke="#D1D7DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="42" y="601" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">接收侧：先认证，再释放明文</text>
<rect x="42" y="624" width="340" height="111" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="58" y="644" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="74" y="667" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">输入验证上下文</text>
<text x="64" y="704" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">K、N、C、T、预期 AAD</text>
<rect x="440" y="624" width="285" height="111" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="456" y="644" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="472" y="667" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">Open → 校验 tag</text>
<text x="462" y="704" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">上下文也必须符合策略</text>
<path d="M386 679 L434 679" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M729 679 L769 679 L769 649 L810 649" fill="none" stroke="#127B6A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M769 679 L769 716 L810 716" fill="none" stroke="#AE4247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<rect x="817" y="623" width="341" height="52" rx="14" fill="#E7F1EC"/>
<text x="839" y="657" fill="#127B6A" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">通过 → 允许使用明文 P</text>
<rect x="817" y="690" width="341" height="52" rx="14" fill="#F7E8E5"/>
<text x="839" y="724" fill="#AE4247" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="700" text-anchor="start">失败 → FAIL，不交付临时输出</text>
<text x="42" y="791" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">高层 API 可延迟返回；低层流式输出在最终认证前必须隔离。</text>
<path d="M42 821 L1158 821" fill="none" stroke="#D1D7DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="42" y="847" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" text-anchor="start">高性能存储 · P1  /  与正文配合阅读：前提、成本、失败边界</text>
<text x="1158" y="847" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" text-anchor="end">2026-09-16</text>
</svg>