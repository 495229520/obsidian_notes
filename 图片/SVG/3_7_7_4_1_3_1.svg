<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>C++ Coroutine 非阻塞 RPC 调用链与双重标识解耦</title>
  <desc>展示本地 coroutine_handle 与网络 request_id 的映射机制、全链路推进状态机及三项核心工程不变量。</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1240" height="760" fill="#F5F4ED"/>

  <!-- Title & Subtitle -->
  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">C++ Coroutine 非阻塞 RPC：从 co_await 到 request_id 恢复</text>
  <text x="48" y="78" font-size="13.5" fill="#6B675C">本地协程句柄与网络 request_id 精确映射 · 事件循环推进状态机与三大工程不变量</text>

  <!-- Top Right Identity Badges -->
  <rect x="705" y="32" width="235" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="822" y="54" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">request_id = 42 (协议层)</text>
  <text x="822" y="73" font-size="10.5" fill="#24473F" text-anchor="middle">14 B 帧头字段 · 跨网络回显关联</text>

  <rect x="955" y="32" width="235" height="54" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="1072" y="54" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">coroutine_handle&lt;&gt; (本地层)</text>
  <text x="1072" y="73" font-size="10.5" fill="#4A3F68" text-anchor="middle">指向协程帧内存 · 绝不写入网络帧</text>

  <!-- Swinlane 1: User / Coroutine -->
  <rect x="48" y="106" width="1144" height="106" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="62" y="116" width="120" height="22" rx="4" fill="#3D5A80"/>
  <text x="122" y="131" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">用户态 · 业务协程</text>

  <!-- Swinlane 2: Middleware / Awaiter & Pending -->
  <rect x="48" y="222" width="1144" height="106" rx="8" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="62" y="232" width="120" height="22" rx="4" fill="#6B5B95"/>
  <text x="122" y="247" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">中间件 · Awaiter/表</text>

  <!-- Swinlane 3: Transport / EventLoop & TCP -->
  <rect x="48" y="338" width="1144" height="106" rx="8" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="62" y="348" width="120" height="22" rx="4" fill="#2F6B5E"/>
  <text x="122" y="363" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">传输层 · EventLoop</text>

  <!-- Swinlane 4: Remote Server -->
  <rect x="48" y="454" width="1144" height="106" rx="8" fill="#F4E9E4" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="62" y="464" width="120" height="22" rx="4" fill="#A64B3C"/>
  <text x="122" y="479" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">远端 · RPC 服务端</text>

  <!-- Lane 1 Step Cards & Suspension Box -->
  <rect x="195" y="132" width="170" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="280" y="153" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">① co_await CallAsync</text>
  <text x="280" y="172" font-size="10.5" fill="#2C4460" text-anchor="middle">准备 Add(3, 4) 业务入参</text>

  <rect x="385" y="138" width="550" height="42" rx="6" fill="#ECEAE0" stroke="#8A8574" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="660" y="164" font-size="11.5" fill="#4A473F" text-anchor="middle">coroutine 挂起 · 栈帧保留现场 · EventLoop 线程继续调度</text>

  <rect x="955" y="132" width="170" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="1040" y="153" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">⑩ await_resume()</text>
  <text x="1040" y="172" font-size="10.5" fill="#2C4460" text-anchor="middle">取 reply 解码 sum=7 返回</text>

  <!-- Lane 2 Step Cards -->
  <rect x="195" y="248" width="170" height="54" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="280" y="269" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">② await_suspend(h)</text>
  <text x="280" y="288" font-size="10.5" fill="#4A3F68" text-anchor="middle">保存 h，分配 id = 42</text>

  <rect x="385" y="248" width="170" height="54" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="470" y="269" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">③ pending_[42] = call</text>
  <text x="470" y="288" font-size="10.5" fill="#4A3F68" text-anchor="middle">先登记映射，后允许发送</text>

  <rect x="765" y="248" width="170" height="54" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="850" y="269" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">⑧ extract pending_[42]</text>
  <text x="850" y="288" font-size="10.5" fill="#4A3F68" text-anchor="middle">先弹出条目，清空句柄</text>

  <rect x="955" y="248" width="170" height="54" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="1040" y="269" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">⑨ loop.Post([h] { resume })</text>
  <text x="1040" y="288" font-size="10.5" fill="#4A3F68" text-anchor="middle">写入 reply，排入就绪队列</text>

  <!-- Lane 3 Step Cards -->
  <rect x="385" y="364" width="170" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="470" y="385" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">④ EnqueueFrame()</text>
  <text x="470" y="404" font-size="10.5" fill="#24473F" text-anchor="middle">22 B 完整 Request 帧入队</text>

  <rect x="575" y="364" width="170" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="660" y="385" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">⑤ 非阻塞 send(fd)</text>
  <text x="660" y="404" font-size="10.5" fill="#24473F" text-anchor="middle">EAGAIN 存 offset 等可写</text>

  <rect x="765" y="364" width="170" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="850" y="385" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">⑦ FrameDecoder</text>
  <text x="850" y="404" font-size="10.5" fill="#24473F" text-anchor="middle">recv 到 EAGAIN · 解析 id=42</text>

  <!-- Lane 4 Step Cards (Server) -->
  <rect x="575" y="480" width="360" height="54" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="755" y="501" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">⑥ Server 处理与回显 (Add 3 + 4)</text>
  <text x="755" y="520" font-size="10.5" fill="#733428" text-anchor="middle">计算 3+4=7 · 组装 18 B Response(id=42, OK)</text>

  <!-- Control & Data Flow Arrows (All Orthogonal & Centered) -->
  <line x1="280" y1="186" x2="280" y2="248" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="365" y1="275" x2="385" y2="275" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="470" y1="302" x2="470" y2="364" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="555" y1="391" x2="575" y2="391" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Network Wire Transmission Paths & Badges -->
  <line x1="660" y1="418" x2="660" y2="480" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <rect x="585" y="438" width="150" height="22" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="660" y="453" font-size="10.2" font-weight="700" fill="#2C4460" text-anchor="middle">Request Frame (22 B)</text>

  <line x1="850" y1="480" x2="850" y2="418" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <rect x="775" y="438" width="150" height="22" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="850" y="453" font-size="10.2" font-weight="700" fill="#24473F" text-anchor="middle">Response Frame (18 B)</text>

  <line x1="850" y1="364" x2="850" y2="302" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="935" y1="275" x2="955" y2="275" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="1040" y1="248" x2="1040" y2="186" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Invariant Section Header -->
  <text x="48" y="596" font-size="14.5" font-weight="700" fill="#2B2A26">三大核心工程不变量（防竞态 · 防死锁 · 防泄漏）</text>

  <!-- Invariant Card A -->
  <rect x="48" y="612" width="364" height="124" rx="8" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="62" y="624" width="140" height="22" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="132" y="639" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">A · 先登记，后允许发送</text>
  <text x="62" y="666" font-size="10.8" fill="#2B2A26">• 请求入队前必须已写入 pending_[id] 映射</text>
  <text x="62" y="688" font-size="10.5" fill="#6B675C">• 规避极快本地回环响应先于登记到达的未知 ID 误判</text>
  <text x="62" y="710" font-size="10.5" fill="#6B675C">• 入队异常时必须 catch 并回滚清除 map 条目</text>

  <!-- Invariant Card B -->
  <rect x="438" y="612" width="364" height="124" rx="8" fill="#FBFBF6" stroke="#6B5B95" stroke-width="1.2"/>
  <rect x="452" y="624" width="140" height="22" rx="4" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="522" y="639" font-size="11" font-weight="700" fill="#4A3F68" text-anchor="middle">B · 先移除，再排队恢复</text>
  <text x="452" y="666" font-size="10.8" fill="#2B2A26">• 解码完整帧后，先从 pending_ extract 节点</text>
  <text x="452" y="688" font-size="10.5" fill="#6B675C">• std::exchange 清空句柄后再 loop.Post(resume)</text>
  <text x="452" y="710" font-size="10.5" fill="#6B675C">• 消除业务恢复后立即发起新 RPC 或析构客户端的重入死锁</text>

  <!-- Invariant Card C -->
  <rect x="828" y="612" width="364" height="124" rx="8" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="842" y="624" width="144" height="22" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="914" y="639" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">C · 终态竞争单次有效</text>
  <text x="842" y="666" font-size="10.8" fill="#2B2A26">• 正常响应、超时、主动取消与断线仅首次转换生效</text>
  <text x="842" y="688" font-size="10.5" fill="#6B675C">• 晚到响应命中 tombstone 丢弃，真正未知 ID 报错</text>
  <text x="842" y="710" font-size="10.5" fill="#6B675C">• 断线时原子批量 extract 全部 pending_ 注入传输异常</text>
</svg>
