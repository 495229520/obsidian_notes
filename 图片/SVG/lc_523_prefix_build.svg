<svg xmlns="http://www.w3.org/2000/svg" width="940" height="584" viewBox="0 0 940 584" role="img" aria-labelledby="t1 d1">
  <title id="t1">LeetCode 523 前缀和与取模数组的构建</title>
  <desc id="d1">展示 nums=[23,2,4,6,7], k=6 的累计前缀和 sum 与 sum%k 的逐列构建过程，并标出余数相同的关键单元。</desc>
  <rect width="940" height="584" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;}
      text:not([text-anchor]){text-anchor:middle;}
      .t-title{font-size:21px;font-weight:700;}
      .t-sub{font-size:13px;}
      .t-lbl{font-size:14px;font-weight:600;}
      .t-cell{font-size:17px;font-weight:700;}
      .t-head{font-size:13px;font-weight:600;}
      .t-note{font-size:13px;}
    </style>
  </defs>

  <text class="t-title" x="40" y="44" fill="#444441" dominant-baseline="central" text-anchor="start">523. 连续的子数组和 — 前缀和与取模数组的构建</text>
  <text class="t-sub" x="40" y="72" fill="#5F5E5A" dominant-baseline="central" text-anchor="start">nums = [23, 2, 4, 6, 7]，k = 6；sum 为累计前缀和，r = sum % k（琥珀色 = 余数相同的关键单元）</text>

  <!-- 行标签 -->
  <text class="t-lbl" x="32" y="110" fill="#444441" dominant-baseline="central" text-anchor="start">下标 i</text>
  <text class="t-lbl" x="32" y="152" fill="#444441" dominant-baseline="central" text-anchor="start">nums[i]</text>
  <text class="t-lbl" x="32" y="250" fill="#444441" dominant-baseline="central" text-anchor="start">sum</text>
  <text class="t-lbl" x="32" y="326" fill="#444441" dominant-baseline="central" text-anchor="start">r = sum%k</text>

  <!-- 下标表头 -->
  <text class="t-head" x="224" y="110" fill="#5F5E5A" dominant-baseline="central">−1</text>
  <text class="t-head" x="344" y="110" fill="#5F5E5A" dominant-baseline="central">0</text>
  <text class="t-head" x="464" y="110" fill="#5F5E5A" dominant-baseline="central">1</text>
  <text class="t-head" x="584" y="110" fill="#5F5E5A" dominant-baseline="central">2</text>
  <text class="t-head" x="704" y="110" fill="#5F5E5A" dominant-baseline="central">3</text>
  <text class="t-head" x="824" y="110" fill="#5F5E5A" dominant-baseline="central">4</text>

  <!-- nums 行 -->
  <path d="M168 126 h112 v52 h-112 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="224" y="152" fill="#444441" dominant-baseline="central">∅</text>
  <path d="M288 126 h112 v52 h-112 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="344" y="152" fill="#0C447C" dominant-baseline="central">23</text>
  <path d="M408 126 h112 v52 h-112 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="t-cell" x="464" y="152" fill="#633806" dominant-baseline="central">2</text>
  <path d="M528 126 h112 v52 h-112 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="t-cell" x="584" y="152" fill="#633806" dominant-baseline="central">4</text>
  <path d="M648 126 h112 v52 h-112 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="704" y="152" fill="#0C447C" dominant-baseline="central">6</text>
  <path d="M768 126 h112 v52 h-112 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="824" y="152" fill="#0C447C" dominant-baseline="central">7</text>

  <!-- nums 答案子数组花括号 -->
  <path d="M408 184 v6 h232 v-6 M524 190 v8" fill="none" stroke="#854F0B" stroke-width="1.5"/>
  <text class="t-note" x="524" y="208" fill="#633806" dominant-baseline="central">子数组 [2, 4]，和 = 6 = 1×k</text>

  <!-- sum 行 -->
  <path d="M168 224 h112 v52 h-112 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="224" y="250" fill="#444441" dominant-baseline="central">0</text>
  <path d="M288 224 h112 v52 h-112 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="344" y="250" fill="#0C447C" dominant-baseline="central">23</text>
  <path d="M408 224 h112 v52 h-112 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="464" y="250" fill="#0C447C" dominant-baseline="central">25</text>
  <path d="M528 224 h112 v52 h-112 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="584" y="250" fill="#0C447C" dominant-baseline="central">29</text>
  <path d="M648 224 h112 v52 h-112 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="704" y="250" fill="#0C447C" dominant-baseline="central">35</text>
  <path d="M768 224 h112 v52 h-112 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="824" y="250" fill="#0C447C" dominant-baseline="central">42</text>

  <!-- r 行 -->
  <path d="M168 300 h112 v52 h-112 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="224" y="326" fill="#444441" dominant-baseline="central">0</text>
  <path d="M288 300 h112 v52 h-112 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="t-cell" x="344" y="326" fill="#633806" dominant-baseline="central">5</text>
  <path d="M408 300 h112 v52 h-112 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="464" y="326" fill="#444441" dominant-baseline="central">1</text>
  <path d="M528 300 h112 v52 h-112 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="t-cell" x="584" y="326" fill="#633806" dominant-baseline="central">5</text>
  <path d="M648 300 h112 v52 h-112 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="t-cell" x="704" y="326" fill="#633806" dominant-baseline="central">5</text>
  <path d="M768 300 h112 v52 h-112 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="824" y="326" fill="#444441" dominant-baseline="central">0</text>

  <!-- 相等余数连接箭头 c0 -> c2 -->
  <path d="M344 352 Q 464 392 584 352" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="t-note" x="466" y="378" fill="#444441" dominant-baseline="central">最早的 5 在下标 0：i − mp[5] = 2 − 0 = 2 ≥ 2  ✓</text>

  <!-- 递推面板 -->
  <path d="M50 410 L 890 410 Q 900 410 900 420 L 900 470 Q 900 480 890 480 L 50 480 Q 40 480 40 470 L 40 420 Q 40 410 50 410 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="t-note" x="60" y="436" fill="#085041" dominant-baseline="central" text-anchor="start">递推构建：sum_i = sum_(i−1) + nums[i]；例如 sum_2 = 25 + 4 = 29，sum_4 = 35 + 7 = 42。</text>
  <text class="t-note" x="60" y="462" fill="#085041" dominant-baseline="central" text-anchor="start">哨兵：空前缀的和为 0（余数 0），记在位置 −1；区间 (i, j] 的和 = sum_j − sum_i。</text>

  <text class="t-note" x="40" y="516" fill="#5F5E5A" dominant-baseline="central" text-anchor="start">一次遍历 O(n) 完成构建。观察 r 行：下标 0、2、3 的余数都是 5 —— 相等余数之间的子数组和必为 k 的倍数。</text>
  <text class="t-note" x="40" y="540" fill="#5F5E5A" dominant-baseline="central" text-anchor="start">下一张图解释“为什么相等余数 ⇒ k 的倍数”。</text>
</svg>
