<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <rect x="0" y="0" width="960" height="580" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    可见性的硬件根源：Store Buffer 与 Invalidate Queue
  </text>
  <text x="480" y="56" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">
    写不会立刻落到缓存/内存，失效也不会立刻处理 → 另一核暂时看不到最新值
  </text>

  <!-- CPU0 -->
  <rect x="50" y="90" width="360" height="300" rx="10" fill="#EFF5FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="230" y="112" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">CPU 0（写者）</text>

  <rect x="80" y="132" width="300" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="230" y="154" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#0C447C">执行单元：x = 1; flag = 1;</text>

  <rect x="80" y="200" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="230" y="220" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">Store Buffer</text>
  <text x="230" y="240" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">写先排队于此，稍后才刷入缓存</text>

  <rect x="80" y="290" width="300" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="230" y="312" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">L1 Cache</text>
  <text x="230" y="334" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#444441">x = 0   flag = 0</text>
  <text x="230" y="352" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#888">（尚未收到新值）</text>

  <!-- CPU1 -->
  <rect x="550" y="90" width="360" height="300" rx="10" fill="#FBF6EE" stroke="#854F0B" stroke-width="0.8"/>
  <text x="730" y="112" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">CPU 1（读者）</text>

  <rect x="580" y="132" width="300" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="730" y="154" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#633806">执行单元：while(flag==0); read x;</text>

  <rect x="580" y="200" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="730" y="220" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3C3489">Invalidate Queue</text>
  <text x="730" y="240" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#3C3489">失效消息先排队，缓存暂未更新</text>

  <rect x="580" y="290" width="300" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="730" y="312" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">L1 Cache（旧副本）</text>
  <text x="730" y="334" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#444441">x = 0   flag = 0</text>
  <text x="730" y="352" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#888">（仍读到旧值）</text>

  <!-- shared memory bus -->
  <rect x="300" y="440" width="360" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="480" y="462" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">主存 / 末级缓存（MESI 一致性域）</text>
  <text x="480" y="484" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#085041">缓存间通过总线交换 Read / Invalidate 消息</text>

  <!-- arrows -->
  <path d="M230 176 L230 200" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M230 256 L230 290" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="290" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#854F0B">延迟刷入</text>

  <path d="M730 256 L730 290" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="790" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#534AB7">延迟失效</text>
  <path d="M880 154 L900 154 L900 220 L880 220" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M230 370 L300 450" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M660 460 L580 360" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="480" y="540" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    内存屏障的作用：强制排空 Store Buffer / Invalidate Queue，使写对其他核可见
  </text>
</svg>
