<rect x="794" y="307" width="27" height="25" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="828" y="307" width="27" height="25" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="48" y="330" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">物理口 / function</text>
<text x="987" y="330" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">RoCEv2 CE 包</text>
<text x="48" y="382" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">PFC · 逐跳反馈</text>
<polyline points="454,421 159,421" fill="none" stroke="#A64B3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_r)"/>
<text x="306.5" y="448" font-size="13" fill="#733428" font-weight="400" text-anchor="middle" data-role="body">左端 RX pause · 右端 TX pause</text>
<polyline points="767,421 472,421" fill="none" stroke="#A64B3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_r)"/>
<text x="619.5" y="448" font-size="13" fill="#733428" font-weight="400" text-anchor="middle" data-role="body">左端 RX pause · 右端 TX pause</text>
<polyline points="1080,421 785,421" fill="none" stroke="#A64B3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_r)"/>
<text x="932.5" y="448" font-size="13" fill="#733428" font-weight="400" text-anchor="middle" data-role="body">左端 RX pause · 右端 TX pause</text>
<text x="48" y="487" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">CNP · 端到端反馈</text>
<polyline points="1089,516 1089,544 150,544 150,516" fill="none" stroke="#2F6B5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_g)" stroke-dasharray="6 4"/>
<text x="1089" y="510" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">NP 发送</text>
<text x="150" y="510" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">RP 处理</text>
<text x="620" y="571" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">CNP 数量不要求与每跳 ECN marking 事件一一相等</text>
<rect x="48" y="598" width="1144" height="38" rx="5" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="69" y="623" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">对齐：物理邻接</text>
<text x="363" y="623" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">区分：PG / TC / priority</text>
<text x="718" y="623" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">保留：窗口、单位、reset 与缺失状态</text>
<text x="48" y="665" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">这是观察位置与信号方向图，不表示每条链路始终都在发送 PFC，也不保证所有实现暴露同名字段。</text>
</svg>