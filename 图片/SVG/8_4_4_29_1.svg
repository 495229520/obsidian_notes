<rect x="413" y="307" width="27" height="25" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<rect x="447" y="307" width="27" height="25" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
