<rect x="987" y="118" width="205" height="163" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1089.5" y="183.4" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body" data-region="993,122,193,155">主机 B / RNIC</text>
<text x="1089.5" y="204.4" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body" data-region="993,122,193,155">接收侧 NP</text>
<text x="1089.5" y="225.4" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body" data-region="993,122,193,155">RX CE / np_cnp_sent</text>
