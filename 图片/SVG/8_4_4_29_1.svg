<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>先定位计数点，再解释 PFC 与 CNP</title>
<desc>示意数据方向 A → B；链路 RX/TX 相对本端定义，反馈返回路径可能不同</desc>
<defs>
<marker id="arr_n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5A564B"/></marker>
<marker id="arr_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3D5A80"/></marker>
<marker id="arr_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6B5E"/></marker>
<marker id="arr_r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="690" fill="rgb(245, 244, 237)"/>
<text x="48" y="43" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="title">先定位计数点，再解释 PFC 与 CNP</text>
<text x="48" y="72" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="subtitle">示意数据方向 A → B；链路 RX/TX 相对本端定义，反馈返回路径可能不同</text>
<rect x="48" y="118" width="205" height="163" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="150.5" y="172.9" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body" data-region="54,122,193,155">主机 A / RNIC</text>
<text x="150.5" y="193.9" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body" data-region="54,122,193,155">发送侧 RP</text>
<text x="150.5" y="214.9" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body" data-region="54,122,193,155">TX 数据</text>
<text x="150.5" y="235.9" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body" data-region="54,122,193,155">rp_cnp_handled</text>
<polyline points="259,199 354,199" fill="none" stroke="#3D5A80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_b)"/>
<text x="305" y="180" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">数据</text>
<rect x="361" y="118" width="205" height="163" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="463.5" y="183.4" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body" data-region="367,122,193,155">交换机 S1</text>
<text x="463.5" y="204.4" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle" data-role="body" data-region="367,122,193,155">入口 PG / 出口 TC</text>
<text x="463.5" y="225.4" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle" data-role="body" data-region="367,122,193,155">端口与队列计数</text>
<polyline points="572,199 667,199" fill="none" stroke="#3D5A80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_b)"/>
<text x="618" y="180" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">数据</text>
<rect x="674" y="118" width="205" height="163" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="776.5" y="183.4" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body" data-region="680,122,193,155">交换机 S2 / CP</text>
<text x="776.5" y="204.4" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body" data-region="680,122,193,155">拥塞观察点</text>
<text x="776.5" y="225.4" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body" data-region="680,122,193,155">ECN Mark / Drop</text>
<polyline points="885,199 980,199" fill="none" stroke="#3D5A80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_b)"/>
