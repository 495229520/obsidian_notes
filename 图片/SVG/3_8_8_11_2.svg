<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>close 与 shutdown：一个走引用计数，一个直接动连接</title>
  <desc>以 fork 之后父子进程各持有一个 fd 为例，对比 close 只减引用计数、计数归零才发 FIN，与 shutdown 无视引用计数立刻发 FIN 并影响同一 socket 上所有 fd。</desc>

  <rect x="0" y="0" width="1240" height="620" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">close 和 shutdown 差在哪：一个减引用，一个动连接</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">场景相同：一个进程 fork 之后，父子各持有一个指向同一 socket 的 fd</text>

  <!-- ===================== Panel A ===================== -->
  <rect x="48" y="104" width="560" height="380" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="14" font-weight="700" fill="#4A473F">① close(fd)：先减引用计数</text>

  <rect x="88" y="156" width="170" height="48" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="173" y="176" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">父进程</text>
  <text x="173" y="194" font-size="10.5" fill="#6B675C" text-anchor="middle">fd = 5</text>
  <rect x="398" y="156" width="170" height="48" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="483" y="176" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">子进程（fork 来的）</text>
  <text x="483" y="194" font-size="10.5" fill="#6B675C" text-anchor="middle">fd = 5</text>

  <line x1="173" y1="208" x2="280" y2="250" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrN)"/>
  <line x1="483" y1="208" x2="376" y2="250" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrN)"/>

  <rect x="198" y="256" width="260" height="60" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="328" y="278" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">同一条 TCP 连接</text>
  <text x="328" y="300" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">引用计数 = 2</text>

  <text x="72" y="348" font-size="11" font-weight="700" fill="#4A473F">① 父进程 close(5)</text>
  <text x="248" y="348" font-size="11" fill="#6B675C">计数 2 → 1</text>
  <text x="368" y="348" font-size="11" font-weight="700" fill="#733428">不发 FIN，连接照常</text>
  <text x="72" y="376" font-size="11" font-weight="700" fill="#4A473F">② 子进程 close(5)</text>
  <text x="248" y="376" font-size="11" fill="#6B675C">计数 1 → 0</text>
  <text x="368" y="376" font-size="11" font-weight="700" fill="#24473F">到这一步才发 FIN</text>

  <line x1="72" y1="396" x2="584" y2="396" stroke="#E3E0D6" stroke-width="1"/>
  <text x="72" y="422" font-size="11" fill="#4A473F">所以 fork 之后忘了在另一个进程里 close，这边 close 多少次</text>
  <text x="72" y="442" font-size="11" fill="#4A473F">连接也不会断——这是 fd 泄漏和 CLOSE_WAIT 里最隐蔽的一种成因</text>
  <text x="72" y="464" font-size="10.5" fill="#8A8578">同理还有 dup / dup2、以及把 fd 传给了别的线程或对象却没有统一释放</text>

  <!-- ===================== Panel B ===================== -->
  <rect x="632" y="104" width="560" height="380" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="656" y="132" font-size="14" font-weight="700" fill="#4A473F">② shutdown(fd, SHUT_WR)：直接动连接</text>

  <rect x="672" y="156" width="170" height="48" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="757" y="176" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">父进程</text>
  <text x="757" y="194" font-size="10.5" fill="#6B675C" text-anchor="middle">fd = 5</text>
  <rect x="982" y="156" width="170" height="48" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1067" y="176" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">子进程（fork 来的）</text>
  <text x="1067" y="194" font-size="10.5" fill="#6B675C" text-anchor="middle">fd = 5</text>

  <line x1="757" y1="208" x2="864" y2="250" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrN)"/>
  <line x1="1067" y1="208" x2="960" y2="250" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrN)"/>

  <rect x="782" y="256" width="260" height="60" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="912" y="278" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">同一条 TCP 连接</text>
  <text x="912" y="300" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">写方向已关闭</text>

  <text x="656" y="348" font-size="11" font-weight="700" fill="#4A473F">父进程 shutdown(5, SHUT_WR)</text>
  <text x="960" y="348" font-size="11" font-weight="700" fill="#733428">立刻发出 FIN</text>
  <text x="656" y="376" font-size="11" fill="#6B675C">引用计数不变，还是 2</text>
  <text x="960" y="376" font-size="11" font-weight="700" fill="#733428">子进程也写不了了</text>

  <line x1="656" y1="396" x2="1168" y2="396" stroke="#E3E0D6" stroke-width="1"/>
  <text x="656" y="422" font-size="11" fill="#4A473F">shutdown 改的是连接本身的状态，跟有几个 fd 指着它无关，</text>
  <text x="656" y="442" font-size="11" fill="#4A473F">所以同一个 socket 上的所有 fd 都会一起受影响</text>
  <text x="656" y="464" font-size="10.5" fill="#8A8578">注意 fd 本身还在，还得再 close 一次才会被回收，否则照样是 fd 泄漏</text>

  <!-- card -->
  <rect x="48" y="504" width="1144" height="76" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="528" font-size="13" font-weight="700" fill="#4A473F">顺带一提：shutdown(fd, SHUT_RD) 基本没有用</text>
  <text x="72" y="550" font-size="11" fill="#4A473F">它不会在线路上产生任何 TCP 报文，对端完全不知道你关了读方向；效果只是本端之后的 read() 直接返回 0。</text>
  <text x="72" y="570" font-size="11" fill="#4A473F">之后再到达的数据怎么处理，各平台行为并不一致，POSIX 也没有明确规定。想表达"我不收了"，TCP 层没有这种语义，只能靠应用层协议约定。</text>

  <text x="48" y="604" font-size="11" fill="#6B675C">一句话记：close 说的是"我不用这个 fd 了"，shutdown 说的是"这条连接的这个方向到此为止"</text>
</svg>
