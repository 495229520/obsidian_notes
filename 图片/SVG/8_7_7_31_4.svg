<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">发布新 Root：数据先就绪，业务指针后可见</title>
  <desc id="desc">接口名为教学契约示例；网络完成、持久确认和版本发布是不同的完成点。。原创教学示意图，非真实产品内部拓扑或性能实测。</desc>
  <defs>
    <marker id="arr-base" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B968A" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5B95" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="700" fill="#F5F4ED" stroke="none" rx="0" stroke-width="1.3" />
  <text x="48" y="53" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="title">发布新 Root：数据先就绪，业务指针后可见</text>
  <text x="48" y="82" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="subtitle">接口名为教学契约示例；网络完成、持久确认和版本发布是不同的完成点。</text>
  <rect x="100" y="116" width="170" height="46" fill="#E3EAF4" stroke="#3D5A80" rx="8" stroke-width="1.3" />
  <text x="185.0" y="144.04" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">发布者</text>
  <line x1="185" y1="164" x2="185" y2="566" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="5 5" />
  <rect x="430" y="116" width="170" height="46" fill="#E3EAF4" stroke="#3D5A80" rx="8" stroke-width="1.3" />
  <text x="515.0" y="144.04" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">Chunk / Manifest 层</text>
  <line x1="515" y1="164" x2="515" y2="566" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="5 5" />
  <rect x="770" y="116" width="170" height="46" fill="#EDEAF3" stroke="#6B5B95" rx="8" stroke-width="1.3" />
  <text x="855.0" y="144.04" font-size="14" fill="#544673" font-weight="700" text-anchor="middle" data-role="body">版本元数据服务</text>
  <line x1="855" y1="164" x2="855" y2="566" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="5 5" />
  <rect x="1025" y="116" width="170" height="46" fill="#E3EAF4" stroke="#3D5A80" rx="8" stroke-width="1.3" />
  <text x="1110.0" y="144.04" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">读取者</text>
  <line x1="1110" y1="164" x2="1110" y2="566" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="5 5" />
  <rect x="174" y="203" width="22" height="95" fill="#F3E8D3" stroke="#8A6A3A" rx="3" stroke-width="1.3" />
  <polyline points="196,205 510,205" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr-base)" stroke-linejoin="round" />
  <text x="280" y="195" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">put_chunks()</text>
  <rect x="266" y="223" width="173" height="38" fill="#F3E8D3" stroke="#8A6A3A" rx="8" stroke-width="1.3" />
  <text x="352.5" y="246.86" font-size="13.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">等待持久条件</text>
  <polyline points="510,291 198,291" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-green)" stroke-linejoin="round" stroke-dasharray="5 4" />
  <text x="278" y="282" font-size="14" fill="#24473F" font-weight="400" text-anchor="start" data-role="body">durability_ack</text>
  <rect x="174" y="327" width="22" height="46" fill="#F3E8D3" stroke="#8A6A3A" rx="3" stroke-width="1.3" />
  <polyline points="196,329 509,329" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr-base)" stroke-linejoin="round" />
  <text x="278" y="320" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">put_manifest()</text>
  <polyline points="510,372 198,372" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-green)" stroke-linejoin="round" stroke-dasharray="5 4" />
  <text x="279" y="362" font-size="14" fill="#24473F" font-weight="400" text-anchor="start" data-role="body">manifest_ready</text>
  <rect x="174" y="422" width="22" height="47" fill="#EDEAF3" stroke="#6B5B95" rx="3" stroke-width="1.3" />
  <polyline points="196,424 849,424" fill="none" stroke="#6B5B95" stroke-width="1.8" marker-end="url(#arr-purple)" stroke-linejoin="round" />
  <text x="440" y="413" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">compare_and_swap(g, R1)</text>
  <rect x="844" y="410" width="22" height="58" fill="#EDEAF3" stroke="#6B5B95" rx="3" stroke-width="1.3" />
  <polyline points="842,468 198,468" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-green)" stroke-linejoin="round" stroke-dasharray="5 4" />
  <text x="473" y="458" font-size="14" fill="#24473F" font-weight="400" text-anchor="start" data-role="body">committed(g + 1)</text>
  <polyline points="1105,506 867,506" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr-base)" stroke-linejoin="round" />
  <text x="941" y="495" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">pin_root()</text>
  <polyline points="868,546 1103,546" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-green)" stroke-linejoin="round" stroke-dasharray="5 4" />
  <text x="937" y="536" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">固定 R1 读取</text>
  <text x="70" y="594" font-size="14.5" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">崩溃边界</text>
  <rect x="197" y="575" width="407" height="48" fill="#F1EFE8" stroke="#9B968A" rx="8" stroke-width="1.3" />
  <text x="400.5" y="604.04" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">发布前失败 → 受保护的孤儿对象</text>
  <rect x="646" y="575" width="516" height="48" fill="#F0E0DB" stroke="#A64B3C" rx="8" stroke-width="1.3" />
  <text x="904.0" y="604.04" font-size="14" fill="#733428" font-weight="700" text-anchor="middle" data-role="body">先发布再补数据 → 悬空引用风险</text>
  <line x1="48" y1="649" x2="1192" y2="649" stroke="#D8D5C8" stroke-width="1" />
  <text x="48" y="678" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">GC 根集合需覆盖保留版本、活跃读取与在途发布；比较并交换指针不会自动提供跨层事务。</text>
</svg>