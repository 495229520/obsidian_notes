<text x="77" y="150" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">块编号在阶段间保持一致</text>
<line x1="705.0" y1="420" x2="705.0" y2="458" stroke="#2F6B5E" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="705.0" y="447" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">15</text>
<text x="838" y="151" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">三阶段理想流水</text>
<text x="838" y="188" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">p + q + r + (K − 1) × max</text>
<text x="838" y="217" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start">其中 max = max(p, q, r)</text>
<rect x="838" y="242" width="331" height="57" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1003.5" y="275.4" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">2 + 3 + 1 + 3 × 3 = 15 μs</text>
<text x="838" y="329" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">串行：K × (p + q + r)</text>
<rect x="838" y="350" width="331" height="47" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="1003.5" y="378.75" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle">4 × 6 = 24 μs</text>
<text x="838" y="428" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">假设：资源可重叠、窗口足够</text>
<text x="838" y="458" font-size="13" font-weight="400" fill="#733428" text-anchor="start">同核 / 同链路竞争 → 收益缩水</text>
<rect x="48" y="528" width="671" height="116" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="68" y="557" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · 窗口填充量级</text>
<text x="69" y="592" font-size="18" font-weight="700" fill="#2C4460" text-anchor="start">Wc ≳ B × L_credit</text>
<text x="383" y="586" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start">L_credit 包含消费与确认</text>
<text x="69" y="625" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start">示例：25 GB/s × 8 μs = 200,000 B；64 KiB 块需至少 4 块</text>
<rect x="739" y="528" width="453" height="116" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="759" y="557" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · 回收与提交边界</text>
<text x="759" y="589" font-size="14" font-weight="700" fill="#733428" text-anchor="start">块完成 ≠ 整个请求提交</text>
<text x="759" y="620" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start">MR 有效期覆盖访问；保留控制进展预算</text>
<line x1="48" y1="660" x2="1192" y2="660" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="683" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start">原创教学时间模型；注册若已在 setup 完成，不可再把“逐块注册重叠”重复计入收益。</text>
</svg>