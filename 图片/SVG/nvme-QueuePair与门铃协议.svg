<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A3F68"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">Queue Pair 与 Doorbell：四个指针、两次门铃、零次 MMIO 读</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">SQ + CQ = 一条信道；环在主机 DRAM，门铃在设备 BAR0；协议 = 先发布数据、再发布信号 ≈ release / acquire</text>

  <!-- 主机容器 -->
  <rect x="48" y="106" width="640" height="472" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="68" y="132" font-size="13" font-weight="700" fill="#4A473F">主机侧</text>

  <rect x="76" y="148" width="280" height="50" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="216" y="169" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">CPU · 驱动</text>
  <text x="216" y="187" font-size="10.5" fill="#2C4460" text-anchor="middle">生产 SQE，消费 CQE</text>

  <rect x="76" y="226" width="584" height="328" rx="8" fill="#FBFAF5" stroke="#B9B4A4" stroke-width="1.2"/>
  <text x="92" y="250" font-size="12" font-weight="700" fill="#6B675C">主机 DRAM</text>

  <!-- SQ 环 -->
  <text x="92" y="282" font-size="11.5" font-weight="700" fill="#24473F">SQ 提交环（主机 → 设备的待办单）</text>
  <rect x="92"  y="292" width="56" height="40" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="148" y="292" width="56" height="40" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="204" y="292" width="56" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="260" y="292" width="56" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="316" y="292" width="56" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="372" y="292" width="56" height="40" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="428" y="292" width="56" height="40" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="484" y="292" width="56" height="40" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="232" y="316" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SQE</text>
  <text x="288" y="316" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SQE</text>
  <text x="344" y="316" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SQE</text>
  <line x1="232" y1="340" x2="232" y2="332" stroke="#4A3F68" stroke-width="1.6"/>
  <text x="232" y="354" font-size="10" font-weight="700" fill="#4A3F68" text-anchor="middle">head</text>
  <line x1="400" y1="340" x2="400" y2="332" stroke="#2C4460" stroke-width="1.6"/>
  <text x="400" y="354" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">tail</text>
  <text x="92" y="374" font-size="10" fill="#6B675C">head：设备消费进度，经 CQE 的 SQ Head 字段捎带回主机 ｜ tail：主机推进，经门铃发布</text>

  <!-- CQ 环 -->
  <text x="92" y="408" font-size="11.5" font-weight="700" fill="#24473F">CQ 完成环（设备 → 主机的回执单）——每槽自带相位位 P</text>
  <rect x="92"  y="418" width="56" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="148" y="418" width="56" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="204" y="418" width="56" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="260" y="418" width="56" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="316" y="418" width="56" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="372" y="418" width="56" height="40" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="428" y="418" width="56" height="40" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="484" y="418" width="56" height="40" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="120" y="442" font-size="9.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">P=1</text>
  <text x="176" y="442" font-size="9.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">P=1</text>
  <text x="232" y="442" font-size="9.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">P=1</text>
  <text x="288" y="442" font-size="9.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">P=1</text>
  <text x="344" y="442" font-size="9.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">P=1</text>
  <text x="400" y="442" font-size="9.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#9B968A" text-anchor="middle">P=0</text>
  <text x="456" y="442" font-size="9.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#9B968A" text-anchor="middle">P=0</text>
  <text x="512" y="442" font-size="9.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#9B968A" text-anchor="middle">P=0</text>
  <line x1="260" y1="466" x2="260" y2="458" stroke="#2C4460" stroke-width="1.6"/>
  <text x="260" y="480" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">head</text>
  <text x="92" y="504" font-size="10" fill="#4A473F">⑥ 主机判新：读下一槽的 P 位 ≟ 本圈期望值——只读自家 DRAM，0 次 MMIO 读 ≈ load-acquire</text>
  <text x="92" y="522" font-size="10" fill="#6B675C">收割后推进 head，攒一批再敲 CQ Head Doorbell 归还槽位；每绕一圈，期望相位翻转</text>

  <!-- 设备容器 -->
  <rect x="736" y="106" width="456" height="472" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="756" y="132" font-size="13" font-weight="700" fill="#4A473F">NVMe 控制器</text>

  <rect x="764" y="150" width="300" height="92" rx="7" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="914" y="174" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">BAR0 门铃寄存器（MMIO 空间）</text>
  <text x="914" y="198" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#733428" text-anchor="middle">SQ Tail Doorbell ← ②</text>
  <text x="914" y="220" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#733428" text-anchor="middle">CQ Head Doorbell ← ⑦</text>

  <rect x="764" y="282" width="300" height="92" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="914" y="306" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">设备私有指针（主机不可见）</text>
  <text x="914" y="330" font-size="10.5" fill="#4A3F68" text-anchor="middle">SQ head：自己消费自己记</text>
  <text x="914" y="350" font-size="10.5" fill="#4A3F68" text-anchor="middle">CQ tail：自己生产自己记</text>

  <rect x="764" y="414" width="300" height="56" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="914" y="436" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">取命令 → 通道×裸片执行 → 写回执</text>
  <text x="914" y="454" font-size="10.5" fill="#4A3F68" text-anchor="middle">并行乱序，先完成先回</text>

  <!-- ① 填 SQE -->
  <line x1="300" y1="198" x2="398" y2="286" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="310" y="244" font-size="11" fill="#4A473F">① 在 tail 处填 SQE：普通写，可被重排</text>

  <!-- ② SQ Tail 门铃 -->
  <polyline points="356,166 714,166 714,194 760,194" fill="none" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="380" y="158" font-size="11" fill="#733428">② wmb ＋ MMIO 写 SQ Tail Doorbell ≈ store-release</text>

  <!-- ⑦ CQ Head 门铃 -->
  <polyline points="356,186 690,186 690,216 760,216" fill="none" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="380" y="206" font-size="11" fill="#733428">⑦ 收割后合批写 CQ Head Doorbell 归还</text>

  <!-- ③ DMA 取 SQE -->
  <line x1="544" y1="308" x2="760" y2="304" stroke="#4A3F68" stroke-width="1.5" marker-start="url(#arrP)"/>
  <text x="576" y="296" font-size="11" fill="#4A3F68">③ DMA 取 SQE（head 推进）</text>

  <!-- ④ DMA 写 CQE -->
  <line x1="760" y1="438" x2="548" y2="440" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrP)"/>
  <text x="556" y="470" font-size="11" fill="#24473F">④ 整条 16 B CQE 一次 DMA 写入（数据先行）</text>

  <!-- ⑤ MSI-X -->
  <polyline points="960,150 960,128 300,128 300,146" fill="none" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="430" y="121" font-size="10.5" fill="#733428">⑤ MSI-X 中断（信号后至：PCIe 保证排在 ④ 之后到达）</text>

  <!-- ⑥ 收割路径 -->
  <polyline points="76,180 62,180 62,438 88,438" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 底部：四个指针 -->
  <text x="48" y="618" font-size="13" font-weight="700" fill="#2B2A26">四个指针：谁推进、怎么发布</text>

  <rect x="48" y="632" width="96" height="36" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="96" y="655" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2C4460" text-anchor="middle">SQ tail</text>
  <text x="160" y="655" font-size="11" fill="#4A473F">主机推进</text>
  <text x="248" y="655" font-size="11" fill="#4A473F">显式发布：MMIO 写 SQ Tail Doorbell（②）</text>

  <rect x="48" y="682" width="96" height="36" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.2"/>
  <text x="96" y="705" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#4A3F68" text-anchor="middle">SQ head</text>
  <text x="160" y="705" font-size="11" fill="#4A473F">设备推进</text>
  <text x="248" y="705" font-size="11" fill="#4A473F">捎带回传：写进每条 CQE 的 SQ Head 字段——主机判「SQ 满」的依据</text>

  <rect x="48" y="732" width="96" height="36" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.2"/>
  <text x="96" y="755" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#4A3F68" text-anchor="middle">CQ tail</text>
  <text x="160" y="755" font-size="11" fill="#4A473F">设备推进</text>
  <text x="248" y="755" font-size="11" fill="#4A473F">不发布：主机靠相位位 P 自行发现新 CQE（⑥）</text>

  <rect x="48" y="782" width="96" height="36" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="96" y="805" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2C4460" text-anchor="middle">CQ head</text>
  <text x="160" y="805" font-size="11" fill="#4A473F">主机推进</text>
  <text x="248" y="805" font-size="11" fill="#4A473F">显式发布：MMIO 写 CQ Head Doorbell，归还槽位（⑦）</text>

  <!-- 右侧卡片 -->
  <rect x="880" y="604" width="312" height="240" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="900" y="632" font-size="12.5" font-weight="700" fill="#4A473F">为什么 0 次 MMIO 读</text>
  <text x="900" y="660" font-size="10.5" fill="#4A473F">MMIO 读要跨 PCIe 一来一回：</text>
  <text x="900" y="680" font-size="10.5" fill="#4A473F">~1 μs 量级，且 CPU 全程停等【量级】；</text>
  <text x="900" y="700" font-size="10.5" fill="#4A473F">MMIO 写是 posted：发出即走，不等回应。</text>
  <text x="900" y="728" font-size="10.5" fill="#4A473F">于是协议把设备 → 主机的所有信息</text>
  <text x="900" y="748" font-size="10.5" fill="#4A473F">（CQE、SQ head、相位位）全部改成</text>
  <text x="900" y="768" font-size="10.5" fill="#4A473F">设备 DMA 写进主机 DRAM——</text>
  <text x="900" y="788" font-size="10.5" fill="#4A473F">主机永远只读自己的内存。</text>
  <text x="900" y="816" font-size="10.5" fill="#6B675C">每个指针都只有一个写者：SPSC，无锁。</text>
</svg>
