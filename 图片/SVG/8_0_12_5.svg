<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">P99 毛刺归因：先对齐时间，再做单变量 A/B</title><desc id="desc">左图用合成示意展示业务毛刺、IRQ 与运行线程的时间对齐，右图列出逐步验证闭环。所有轨迹没有真实测量单位。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">P99 毛刺归因：先对齐时间，再做单变量 A/B</text>
<text x="48" y="77" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">相关性提供假设；恢复配置并复现，才让因果判断更有说服力。</text>
<rect x="40" y="107" width="752" height="403" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="135" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 合成示意轨迹（不是实测数据）</text>
<text x="62" y="180" font-size="13" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">业务延迟</text>
<text x="62" y="281" font-size="13" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">IRQ 活动</text>
<text x="62" y="377" font-size="13" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">CPU 执行</text>
<line x1="250" y1="147" x2="250" y2="458" stroke="#D8D5C8" stroke-width="1.6" stroke-dasharray="4 5"/>
<line x1="450" y1="147" x2="450" y2="458" stroke="#D8D5C8" stroke-width="1.6" stroke-dasharray="4 5"/>
<line x1="650" y1="147" x2="650" y2="458" stroke="#D8D5C8" stroke-width="1.6" stroke-dasharray="4 5"/>
<rect x="431" y="151" width="56" height="294" rx="0" fill="#F0E0DB" stroke="none" stroke-width="1.3"/>
<path d="M 176,204 L 216,202 L 245,206 L 289,204 L 330,205 L 380,200 L 417,204 L 444,160 L 459,155 L 480,203 L 517,206 L 557,204 L 598,203 L 649,206 L 688,202 L 746,205" fill="none" stroke="#3D5A80" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="172" y1="308" x2="750" y2="308" stroke="#AAA69A" stroke-width="1"/>
<line x1="220" y1="309" x2="220" y2="291" stroke="#8A6A3A" stroke-width="5"/>
<line x1="323" y1="309" x2="323" y2="291" stroke="#8A6A3A" stroke-width="5"/>
<line x1="441" y1="309" x2="441" y2="263" stroke="#8A6A3A" stroke-width="5"/>
<line x1="453" y1="309" x2="453" y2="263" stroke="#8A6A3A" stroke-width="5"/>
<line x1="465" y1="309" x2="465" y2="263" stroke="#8A6A3A" stroke-width="5"/>
<line x1="573" y1="309" x2="573" y2="291" stroke="#8A6A3A" stroke-width="5"/>
<line x1="690" y1="309" x2="690" y2="291" stroke="#8A6A3A" stroke-width="5"/>
<rect x="173" y="387" width="257" height="44" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="301.5" y="414.0" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">worker</text>
<rect x="432" y="387" width="71" height="44" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="467.5" y="414.0" font-size="15" font-weight="600" fill="#6B4E28" text-anchor="middle" data-role="body">IRQ</text>
<rect x="505" y="387" width="243" height="44" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="626.5" y="414.0" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">worker</text>
<text x="198" y="469" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">同一时间戳窗口</text>
<text x="483" y="469" font-size="13" font-weight="600" fill="#733428" text-anchor="start" data-role="body">重合 ≠ 已证明因果</text>
<rect x="815" y="107" width="385" height="403" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="833" y="135" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 最小验证闭环</text>
<rect x="837" y="157" width="341" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1007.5" y="186.0" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">① 写出可反驳假设</text>
<text x="1007.5" y="208.0" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">管理 IRQ 打断 poller？</text>
<line x1="1008" y1="223" x2="1008" y2="235" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="837" y="239" width="341" height="64" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="1007.5" y="268.0" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">② 只改一项策略</text>
<text x="1007.5" y="290.0" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">保持到达率 / 队列 / NUMA</text>
<line x1="1008" y1="305" x2="1008" y2="317" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="837" y="321" width="341" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1007.5" y="350.0" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">③ A → B → A</text>
<text x="1007.5" y="372.0" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">改善后恢复，检查可复现性</text>
<line x1="1008" y1="387" x2="1008" y2="399" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="837" y="403" width="341" height="64" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1007.5" y="432.0" font-size="15" font-weight="700" fill="#4A3F68" text-anchor="middle" data-role="body">④ 同时守住门槛</text>
<text x="1007.5" y="454.0" font-size="12.5" font-weight="400" fill="#4A3F68" text-anchor="middle" data-role="body">错误 / 丢包 / 吞吐 / 热稳态</text>
<rect x="45" y="539" width="361" height="53" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="225.5" y="570.5" font-size="15" font-weight="600" fill="#733428" text-anchor="middle" data-role="body">业务延迟 ≠ timerlat</text>
<rect x="439" y="539" width="361" height="53" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="619.5" y="570.5" font-size="15" font-weight="600" fill="#6B4E28" text-anchor="middle" data-role="body">探针本身也会制造负载</text>
<rect x="833" y="539" width="365" height="53" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1015.5" y="570.5" font-size="15" font-weight="600" fill="#24473F" text-anchor="middle" data-role="body">测量结果必须带配置快照</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="642" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">timerlat / osnoise 与业务压测分开设计；不要无意中给单 runnable 的关键 CPU 新增一个测试线程。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">固定到达率、样本量与预热条件；无 IRQ 记录的大间隙不能直接归因于 SMI，需进一步的平台证据。</text>
</svg>