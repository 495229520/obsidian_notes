<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 790" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <title>API 调用、TCP 状态与报文的对应关系</title>
  <desc>一条 TCP 连接从建立到关闭的完整过程，中间是网络上实际传的报文，两侧的竖线是客户端与服务端的 TCP 状态，最外侧是应用调用的每个函数。</desc>

  <rect x="0" y="0" width="1240" height="790" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">你调的函数、内核的状态、网线上的报文，一一对上</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">connect 和 accept 返回的时刻并不相同：客户端在收到 SYN+ACK 时就返回了，服务端要等最后那个 ACK</text>

  <rect x="48" y="104" width="1144" height="612" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 一条连接的一生</text>

  <text x="200" y="158" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">客户端应用</text>
  <text x="420" y="158" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">客户端 TCP</text>
  <text x="620" y="158" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">网线上的报文</text>
  <text x="820" y="158" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">服务端 TCP</text>
  <text x="1040" y="158" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">服务端应用</text>

  <line x1="420" y1="172" x2="420" y2="700" stroke="#C8C4B6" stroke-width="1.5"/>
  <line x1="820" y1="172" x2="820" y2="700" stroke="#C8C4B6" stroke-width="1.5"/>

  <!-- r1 -->
  <rect x="360" y="176" width="120" height="28" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
  <text x="420" y="195" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">CLOSED</text>
  <rect x="760" y="176" width="120" height="28" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
  <text x="820" y="195" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">CLOSED</text>
  <text x="345" y="195" font-size="11.5" fill="#2C4460" text-anchor="end">socket()</text>
  <text x="895" y="195" font-size="11.5" fill="#2C4460">socket() → bind()</text>

  <!-- r2 -->
  <rect x="760" y="220" width="120" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="820" y="239" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">LISTEN</text>
  <text x="895" y="239" font-size="11.5" fill="#2C4460">listen(fd, backlog)</text>

  <!-- r3 SYN -->
  <rect x="360" y="268" width="120" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="420" y="287" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">SYN_SENT</text>
  <rect x="760" y="268" width="120" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="820" y="287" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">SYN_RCVD</text>
  <line x1="484" y1="284" x2="756" y2="284" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#aB)"/>
  <text x="620" y="277" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">SYN　seq = x</text>
  <text x="345" y="287" font-size="11.5" fill="#2C4460" text-anchor="end">connect() 阻塞</text>
  <text x="895" y="287" font-size="11.5" fill="#2C4460">accept() 阻塞</text>

  <!-- r4 SYN+ACK -->
  <line x1="756" y1="330" x2="484" y2="330" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#aB)"/>
  <text x="620" y="323" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">SYN + ACK　seq = y, ack = x+1</text>
  <text x="345" y="334" font-size="10.5" fill="#6B675C" text-anchor="end">收到就返回，不等第三次</text>

  <!-- r5 ACK -->
  <rect x="360" y="364" width="120" height="28" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="420" y="383" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">ESTABLISHED</text>
  <rect x="760" y="364" width="120" height="28" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="820" y="383" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">ESTABLISHED</text>
  <line x1="484" y1="380" x2="756" y2="380" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#aB)"/>
  <text x="620" y="373" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">ACK　ack = y+1</text>
  <text x="345" y="383" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="end">connect() 返回</text>
  <text x="895" y="383" font-size="11.5" font-weight="700" fill="#24473F">accept() 返回 connfd</text>

  <!-- r6 数据 -->
  <line x1="484" y1="424" x2="756" y2="424" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="620" y="417" font-size="11" fill="#24473F" text-anchor="middle">应用数据</text>
  <line x1="756" y1="452" x2="484" y2="452" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="620" y="445" font-size="11" fill="#24473F" text-anchor="middle">ACK + 应用数据</text>
  <text x="345" y="431" font-size="11.5" fill="#24473F" text-anchor="end">write() / read()</text>
  <text x="345" y="449" font-size="10.5" fill="#6B675C" text-anchor="end">循环多次</text>
  <text x="895" y="431" font-size="11.5" fill="#24473F">read() / write()</text>
  <text x="895" y="449" font-size="10.5" fill="#6B675C">循环多次</text>

  <!-- r7 FIN -->
  <rect x="360" y="478" width="120" height="28" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="420" y="497" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">FIN_WAIT_1</text>
  <rect x="760" y="478" width="120" height="28" rx="5" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="820" y="497" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">CLOSE_WAIT</text>
  <line x1="484" y1="494" x2="756" y2="494" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#aR)"/>
  <text x="620" y="487" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">FIN　seq = u</text>
  <text x="345" y="497" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="end">close(fd)</text>
  <text x="895" y="497" font-size="11.5" font-weight="700" fill="#4A3F68">read() 返回 0</text>

  <!-- r8 ACK -->
  <rect x="360" y="522" width="120" height="28" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="420" y="541" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">FIN_WAIT_2</text>
  <line x1="756" y1="538" x2="484" y2="538" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#aR)"/>
  <text x="620" y="531" font-size="11" fill="#733428" text-anchor="middle">ACK　ack = u+1</text>
  <text x="895" y="541" font-size="10.5" fill="#6B675C">这期间还能继续发数据</text>

  <!-- r9 FIN 回 -->
  <rect x="360" y="566" width="120" height="28" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="420" y="585" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">TIME_WAIT</text>
  <rect x="760" y="566" width="120" height="28" rx="5" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="820" y="585" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">LAST_ACK</text>
  <line x1="756" y1="582" x2="484" y2="582" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#aR)"/>
  <text x="620" y="575" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">FIN　seq = w</text>
  <text x="895" y="585" font-size="11.5" font-weight="700" fill="#4A3F68">close(connfd)</text>

  <!-- r10 最后 ACK -->
  <rect x="760" y="610" width="120" height="28" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
  <text x="820" y="629" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">CLOSED</text>
  <line x1="484" y1="626" x2="756" y2="626" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#aR)"/>
  <text x="620" y="619" font-size="11" fill="#733428" text-anchor="middle">ACK　ack = w+1</text>

  <!-- r11 -->
  <rect x="360" y="658" width="120" height="28" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
  <text x="420" y="677" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">CLOSED</text>
  <text x="345" y="677" font-size="11.5" fill="#733428" text-anchor="end">再等 2MSL 才真正释放</text>

  <text x="48" y="748" font-size="11.5" fill="#4A473F">中间四步为什么不能合并成三步：服务端的 ACK 是内核立刻回的，而它的 FIN 要等应用调 close，两件事之间可能隔着很久的业务处理。</text>
  <text x="48" y="770" font-size="11.5" fill="#4A473F">这段间隔就是 CLOSE_WAIT 状态。间隔为零时，内核会把 ACK 和 FIN 合并成一个包，四次挥手就变成了三次。</text>
</svg>
