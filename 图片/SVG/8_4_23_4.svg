<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">两种 HOL：内部 FIFO 与共享链路的优先级暂停</title><desc id="desc">VOQ 拆开目的出口等待，但不能自动解除另一条链路上的 PFC。</desc>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<defs>
<marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A26"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5B95"/></marker>
</defs>
<text x="48" y="51" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">两种 HOL：内部 FIFO 与共享链路的优先级暂停</text>
<text x="48" y="80" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">VOQ 拆开目的出口等待，但不能自动解除另一条链路上的 PFC。</text>
<rect x="40" y="111" width="1160" height="158" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="40" y="284" width="1160" height="158" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="40" y="457" width="1160" height="158" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="62" y="143" font-size="15" fill="#A64B3C" text-anchor="start" font-weight="700" data-role="body">① 输入 FIFO</text>
<text x="62" y="169" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">E 空闲，B 仍等待</text>
<rect x="281" y="163" width="339" height="57" rx="3" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<rect x="300" y="174" width="91" height="34" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="345.5" y="196.0" font-size="12" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">B → E</text>
<rect x="405" y="174" width="91" height="34" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="450.5" y="196.0" font-size="12" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">B → E</text>
<rect x="510" y="174" width="91" height="34" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="555.5" y="196.0" font-size="12" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">A → D</text>
<line x1="625" y1="191" x2="914" y2="177" stroke="#A64B3C" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arr-red)"/>
<line x1="840" y1="166" x2="840" y2="192" stroke="#A64B3C" stroke-width="4" stroke-linecap="round" opacity="1"/>
<rect x="927" y="155" width="235" height="40" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="1044.5" y="180.0" font-size="13" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">D 忙 / 不可服务</text>
<rect x="927" y="213" width="235" height="40" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1044.5" y="238.0" font-size="13" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">E 空闲</text>
<text x="550" y="242" font-size="12" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">队头</text>
<text x="735" y="241" font-size="13" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">B 不能绕过 A</text>
<text x="62" y="316" font-size="15" fill="#2F6B5E" text-anchor="start" font-weight="700" data-role="body">② VOQ</text>
<text x="62" y="342" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">按目的出口拆开</text>
<rect x="281" y="323" width="339" height="40" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="450.5" y="348.0" font-size="13" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">去 D 的队列</text>
<line x1="625" y1="343" x2="914" y2="343" stroke="#A64B3C" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arr-red)"/>
<rect x="927" y="323" width="235" height="40" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="1044.5" y="348.0" font-size="13" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">D 忙 / 不可服务</text>
<rect x="281" y="386" width="339" height="40" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="450.5" y="411.0" font-size="13" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">去 E 的队列</text>
<line x1="625" y1="406" x2="914" y2="406" stroke="#2F6B5E" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arr-green)"/>
<rect x="927" y="386" width="235" height="40" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1044.5" y="411.0" font-size="13" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">E 可服务</text>
<line x1="840" y1="330" x2="840" y2="356" stroke="#A64B3C" stroke-width="4" stroke-linecap="round" opacity="1"/>
<text x="738" y="424" font-size="12" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">B 可以前进</text>
<text x="62" y="490" font-size="15" fill="#A64B3C" text-anchor="start" font-weight="700" data-role="body">③ PFC priority 3</text>
<text x="62" y="516" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">暂停作用于共享链路</text>
<rect x="281" y="529" width="280" height="49" rx="3" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<rect x="294" y="537" width="118" height="33" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="353.0" y="558.5" font-size="12" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">A → D</text>
<rect x="423" y="537" width="124" height="33" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="485.0" y="558.5" font-size="12" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">B → E</text>
<line x1="566" y1="554" x2="836" y2="554" stroke="#9B968A" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arr-gray)"/>
<line x1="690" y1="540" x2="690" y2="568" stroke="#A64B3C" stroke-width="5" stroke-linecap="round" opacity="1"/>
<path d="M841,554 H878 V513 H921" fill="none" stroke="#9B968A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-gray)"/>
<path d="M841,554 H878 V585 H921" fill="none" stroke="#9B968A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-gray)"/>
<rect x="927" y="494" width="235" height="40" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="1044.5" y="519.0" font-size="13" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">D 拥塞</text>
<rect x="927" y="566" width="235" height="40" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1044.5" y="591.0" font-size="13" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">E 空闲，B 仍受阻</text>
<line x1="835" y1="501" x2="578" y2="501" stroke="#A64B3C" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arr-red)"/>
<text x="700" y="490" font-size="12" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">PFC p=3</text>
<text x="283" y="602" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">A、B 映射到相同暂停优先级</text>
<text x="48" y="658" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">同一目的出口持续过载是出口竞争；不要把所有排队都叫 HOL。</text>
</svg>