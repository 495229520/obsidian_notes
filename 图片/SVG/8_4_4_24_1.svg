<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>先定方向：PFC 是逐跳背压，CNP 是端到端反馈</title>
<desc>实际 payload 决定上下游；RX / TX 永远以正在读取的本端口为准。</desc>
<defs>
<marker id="8_4_4_24_1-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="8_4_4_24_1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="8_4_4_24_1-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="8_4_4_24_1-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="45" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">先定方向：PFC 是逐跳背压，CNP 是端到端反馈</text>
<text x="48" y="74" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">实际 payload 决定上下游；RX / TX 永远以正在读取的本端口为准。</text>
<text x="48" y="112" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 数据正向：A → B（以 WRITE 为例）</text>
<rect x="60" y="137" width="250" height="86" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="185.0" y="174.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">NIC A · 数据发送端</text>
<text x="185.0" y="196.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">RP：处理 CNP</text>
<rect x="350" y="137" width="250" height="86" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="475.0" y="174.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">Leaf A</text>
<text x="475.0" y="196.0" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">入口 PG / 出口 TC</text>
<rect x="640" y="137" width="250" height="86" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="765.0" y="174.0" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">Leaf B · 拥塞点 CP</text>
<text x="765.0" y="196.0" font-size="14" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">数据包标记 CE</text>
<rect x="930" y="137" width="250" height="86" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="1055.0" y="174.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">NIC B · 数据接收端</text>
<text x="1055.0" y="196.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">NP：收到 CE</text>
<line x1="310" y1="177" x2="346" y2="177" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_1-arr)"/>
<line x1="600" y1="177" x2="636" y2="177" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_1-arr)"/>
<line x1="890" y1="177" x2="926" y2="177" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_1-arr)"/>
<text x="48" y="265" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 逐跳 PFC：传播的是背压，不是同一帧</text>
<line x1="465" y1="311" x2="195" y2="311" stroke="#A64B3C" stroke-width="2" marker-end="url(#8_4_4_24_1-red)"/>
<text x="185" y="292" font-size="13" font-weight="400" fill="#A64B3C" text-anchor="middle" data-role="body">RX pause</text>
<text x="451" y="337" font-size="13" font-weight="400" fill="#A64B3C" text-anchor="end" data-role="body">TX pause</text>
<line x1="755" y1="311" x2="485" y2="311" stroke="#A64B3C" stroke-width="2" marker-end="url(#8_4_4_24_1-red)"/>
<text x="475" y="292" font-size="13" font-weight="400" fill="#A64B3C" text-anchor="middle" data-role="body">RX pause</text>
<text x="741" y="337" font-size="13" font-weight="400" fill="#A64B3C" text-anchor="end" data-role="body">TX pause</text>
<line x1="1045" y1="311" x2="775" y2="311" stroke="#A64B3C" stroke-width="2" marker-end="url(#8_4_4_24_1-red)"/>
<text x="765" y="292" font-size="13" font-weight="400" fill="#A64B3C" text-anchor="middle" data-role="body">RX pause</text>
<text x="1031" y="337" font-size="13" font-weight="400" fill="#A64B3C" text-anchor="end" data-role="body">TX pause</text>
<text x="60" y="366" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">被要求停发</text>
<text x="492" y="366" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">各跳检查 PG 占用与出队</text>
<text x="996" y="366" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">请求上游停发</text>
<text x="48" y="408" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">C · 端到端 CNP：必须验证实际回程</text>
<polyline points="1055,421 1055,457 185,457 185,421" fill="none" stroke="#3D5A80" stroke-width="2" stroke-linejoin="round" marker-end="url(#8_4_4_24_1-blue)"/>
<rect x="433" y="434" width="374" height="47" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="620.0" y="462.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">CNP：接收端 NP → 原发送端 RP</text>
<text x="48" y="526" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">D · 两个方向，两个不同的排查起点</text>
<rect x="48" y="544" width="205" height="32" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="565.0" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">本端观测</text>
<rect x="253" y="544" width="435" height="32" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="265" y="565.0" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">直接含义</text>
<rect x="688" y="544" width="504" height="32" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="700" y="565.0" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">后续证据</text>
<rect x="48" y="576" width="205" height="32" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="597.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">RX pause ↑</text>
<rect x="253" y="576" width="435" height="32" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="265" y="597.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">对端要求本端停止该优先级发送</text>
<rect x="688" y="576" width="504" height="32" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="700" y="597.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">沿数据 TX 方向追对端</text>
<rect x="48" y="608" width="205" height="32" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="629.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">TX pause ↑</text>
<rect x="253" y="608" width="435" height="32" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="265" y="629.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">本端请求对端暂缓输入</text>
<rect x="688" y="608" width="504" height="32" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="700" y="629.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">查本端吸收与更下游阻塞</text>
<text x="48" y="670" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">箭头表示可能的信号方向，并非每跳必发 PFC；CNP 可走不同回程，priority 编号以实际配置为准。</text>
</svg>