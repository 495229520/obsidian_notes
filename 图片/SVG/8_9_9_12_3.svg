<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">三种“分块”：SHA 链、BLAKE3 内部树、应用 Chunk</title><desc id="desc">分块的层次不同，摘要的定义就不同；不要自行拼接局部输出冒充标准整文件 Hash。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">三种“分块”：SHA 链、BLAKE3 内部树、应用 Chunk</text>
<text x="48" y="80" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">分块的层次不同，摘要的定义就不同；不要自行拼接局部输出冒充标准整文件 Hash。</text>
<rect x="48" y="108" width="1144" height="148" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="136" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">A · SHA-256：64 B block 的顺序压缩链（含规定填充）</text>
<rect x="70" y="184" width="105" height="45" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
<text x="122.5" y="211.5" font-size="14" fill="#4A473F" font-weight="600" text-anchor="middle">IV</text>
<text x="352" y="162" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="middle">Block 0 · 64 B</text>
<line x1="352" y1="166" x2="352" y2="180" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="260" y="184" width="184" height="45" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="352.0" y="211.5" font-size="14" fill="#2C4460" font-weight="600" text-anchor="middle">压缩 C0</text>
<text x="628" y="162" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="middle">Block 1 · 64 B</text>
<line x1="628" y1="166" x2="628" y2="180" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="536" y="184" width="184" height="45" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="628.0" y="211.5" font-size="14" fill="#2C4460" font-weight="600" text-anchor="middle">压缩 C1</text>
<text x="904" y="162" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="middle">Block 2 · 64 B</text>
<line x1="904" y1="166" x2="904" y2="180" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="812" y="184" width="184" height="45" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="904.0" y="211.5" font-size="14" fill="#2C4460" font-weight="600" text-anchor="middle">压缩 C2</text>
<rect x="1080" y="184" width="94" height="45" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1127.0" y="211.5" font-size="13" fill="#24473F" font-weight="600" text-anchor="middle">256 bit</text>
<line x1="180" y1="207" x2="254" y2="207" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="449" y1="207" x2="530" y2="207" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="1001" y1="207" x2="1074" y2="207" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="725" y1="207" x2="806" y2="207" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="48" y="272" width="1144" height="231" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="300" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">B · BLAKE3：内部树（4 个完整 chunk 的结构示意）</text>
<rect x="85" y="325" width="169" height="56" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="169.5" y="350.0" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle">Chunk 0 → CV0</text>
<text x="169.5" y="372.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle">1024 B / chunk</text>
<rect x="325" y="325" width="169" height="56" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="409.5" y="350.0" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle">Chunk 1 → CV1</text>
<text x="409.5" y="372.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle">1024 B / chunk</text>
<rect x="745" y="325" width="169" height="56" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="829.5" y="350.0" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle">Chunk 2 → CV2</text>
<text x="829.5" y="372.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle">1024 B / chunk</text>
<rect x="985" y="325" width="169" height="56" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="1069.5" y="350.0" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle">Chunk 3 → CV3</text>
<text x="1069.5" y="372.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle">1024 B / chunk</text>
<rect x="229" y="402" width="240" height="36" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="349.0" y="425.0" font-size="12.5" fill="#4A3F68" font-weight="600" text-anchor="middle">PARENT → 中间 CV</text>
<rect x="774" y="402" width="240" height="36" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="894.0" y="425.0" font-size="12.5" fill="#4A3F68" font-weight="600" text-anchor="middle">PARENT → 中间 CV</text>
<path d="M 169,383 L 169,392 L 349,392 L 349,399" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 409,383 L 409,392 L 349,392 L 349,399" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 829,383 L 829,392 L 894,392 L 894,399" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1069,383 L 1069,392 L 894,392 L 894,399" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="497" y="457" width="249" height="34" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="621.5" y="479.0" font-size="13" fill="#24473F" font-weight="600" text-anchor="middle">ROOT 标志 → 最终输出</text>
<path d="M 349,440 L 349,474 L 491,474" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 894,440 L 894,474 L 752,474" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="618" y="345" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="middle">counter</text>
<text x="618" y="369" font-size="12" fill="#6B4E28" font-weight="600" text-anchor="middle">+ 节点 / 模式 flags</text>
<text x="70" y="481" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">chunk 内 block：64 B</text>
<text x="1167" y="481" font-size="12" fill="#6B675C" font-weight="400" text-anchor="end">普通 C update：单线程，可用 SIMD</text>
<rect x="48" y="519" width="1144" height="96" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="546" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">C · 应用存储格式：例如 4 MiB chunk + 外层 manifest</text>
<rect x="70" y="564" width="405" height="33" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="272.5" y="585.5" font-size="13" fill="#2C4460" font-weight="600" text-anchor="middle">标准 H(chunk) → 每块独立摘要 d_i</text>
<line x1="481" y1="580" x2="680" y2="580" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="580" y="569" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">无歧义编码</text>
<rect x="687" y="559" width="484" height="42" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="929.0" y="585.0" font-size="13" fill="#24473F" font-weight="600" text-anchor="middle">有序描述符 + d_i → 自定义 manifest root</text>
<text x="48" y="638" font-size="13" fill="#2B2A26" font-weight="500" text-anchor="start">外层 Merkle root 不是标准 SHA256(file)，也不是标准 BLAKE3(file)。</text>
<text x="48" y="660" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="start">BLAKE3 内部 CV、counter 与 ROOT/PARENT 标志，不能用独立 chunk 的公开摘要直接替代。</text>
</svg>
