<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<title id="title">线程模型与退出顺序：先消除引用，再拆除容器</title>
<desc id="desc">上部对比独占worker、外部串行化和多线程共享worker，下部展示flush、rkey、endpoint关闭、worker与context清理的依赖。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="760" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">线程模型与退出顺序：先消除引用，再拆除容器</text>
<text x="48" y="76" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">SINGLE / SERIALIZED / MULTI 是访问契约，不是线程数</text>
<line x1="48" y1="96" x2="1192" y2="96" stroke="#D8D5C8" stroke-width="1"/>
<rect x="66" y="133" width="340" height="296" rx="8" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.2"/>
<text x="236" y="163" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">SINGLE · 固定拥有线程</text>
<rect x="450" y="133" width="340" height="296" rx="8" fill="#FBFBF6" stroke="#B07D2B" stroke-width="1.2"/>
<text x="620" y="163" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">SERIALIZED · 外部串行化</text>
<rect x="834" y="133" width="340" height="296" rx="8" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1004" y="163" font-size="14" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">MULTI · 检查实际支持</text>
<rect x="101" y="197" width="270" height="48" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="236.0" y="225.9" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">通信线程</text>
<rect x="101" y="304" width="270" height="61" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="236.0" y="328.05" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">Worker</text>
<text x="236.0" y="350.05" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">submit / progress / callback</text>
<line x1="236" y1="247" x2="236" y2="301" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="236" y="399" font-size="12" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">业务线程只通过队列交付工作</text>
<rect x="473" y="197" width="139" height="44" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
<text x="542.5" y="223.55" font-size="13" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">线程 A</text>
<rect x="629" y="197" width="139" height="44" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
<text x="698.5" y="223.55" font-size="13" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">线程 B</text>
<rect x="483" y="267" width="275" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="620.5" y="291.55" font-size="13" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">应用锁 / 串行调度</text>
<polyline points="542,243 542,264" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="698,243 698,264" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="483" y="337" width="275" height="43" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
<text x="620.5" y="363.4" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">Worker</text>
<line x1="620" y1="309" x2="620" y2="334" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="620" y="409" font-size="12" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body">不能依赖库自动替你串行化</text>
<rect x="857" y="197" width="139" height="44" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="926.5" y="223.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">线程 A</text>
<rect x="1013" y="197" width="139" height="44" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1082.5" y="223.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">线程 B</text>
<rect x="873" y="304" width="270" height="61" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1008.0" y="328.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">Worker</text>
<text x="1008.0" y="350.05" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">允许相应的并发访问</text>
<line x1="926" y1="243" x2="957" y2="301" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="1082" y1="243" x2="1055" y2="301" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1004" y="399" font-size="12" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">用户状态 / buffer 池仍需同步</text>
<text x="68" y="470" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">正常退出的关键依赖（涉及 RMA 时先处理 flush 与 rkey）</text>
<rect x="68" y="509" width="166" height="58" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="151.0" y="542.2" font-size="12" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">停止新提交</text>
<line x1="236" y1="538" x2="252" y2="538" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="255" y="509" width="166" height="58" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="338.0" y="542.2" font-size="12" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">请求 / flush 终结</text>
<line x1="423" y1="538" x2="439" y2="538" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="442" y="509" width="166" height="58" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="525.0" y="542.2" font-size="12" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">rkey_destroy</text>
<line x1="610" y1="538" x2="626" y2="538" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="629" y="509" width="166" height="58" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="712.0" y="542.2" font-size="12" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">close_nbx 完成</text>
<line x1="797" y1="538" x2="813" y2="538" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="816" y="509" width="166" height="58" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="899.0" y="542.2" font-size="12" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">worker_destroy</text>
<line x1="984" y1="538" x2="1000" y2="538" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="1003" y="509" width="166" height="58" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="1086.0" y="542.2" font-size="12" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">ucp_cleanup</text>
<rect x="68" y="602" width="536" height="54" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
<text x="336.0" y="633.55" font-size="13" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">buffer / memh：还须证明 peer 不再访问</text>
<rect x="636" y="602" width="536" height="54" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="904.0" y="633.55" font-size="13" fill="#733428" text-anchor="middle" font-weight="700" data-role="body">close request 仍在途时，worker 必须存活</text>
<line x1="48" y1="690" x2="1192" y2="690" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="716" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">跨线程共享 context：还需检查 mt_workers_shared。</text>
<text x="48" y="737" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">先销毁 rkey，后关闭 endpoint；强制关闭不保证可靠送达。</text>
</svg>