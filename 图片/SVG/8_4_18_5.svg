<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">关闭与迁移：原子开关不等于停止提交的确认</title>
  <desc id="desc">关闸是状态转换；quiesced 才是所有旧 post 调用退出后的交接证据。。图中预算、序号与布局均为教学示意，不是实测结果。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="bluearr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3" />
  <text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">关闭与迁移：原子开关不等于停止提交的确认</text>
  <text x="48" y="79" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">关闸是状态转换；quiesced 才是所有旧 post 调用退出后的交接证据。</text>
  <line x1="48" y1="98" x2="1192" y2="98" stroke="#D8D5C8" stroke-width="1" />
  <text x="1192" y="658" font-size="12" fill="#8B8679" font-weight="400" text-anchor="end">8 · 4 · 18 · 5</text>
  <rect x="48" y="117" width="548" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="64" y="144" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">A · 错误交错：检查与使用之间</text>
  <text x="79" y="182" font-size="14" fill="#2C4460" font-weight="700" text-anchor="start">提交线程</text>
  <text x="79" y="283" font-size="14" fill="#733428" font-weight="700" text-anchor="start">恢复线程</text>
  <line x1="188" y1="192" x2="571" y2="192" stroke="#5A564B" stroke-width="1.6" />
  <line x1="188" y1="294" x2="571" y2="294" stroke="#5A564B" stroke-width="1.6" />
  <rect x="205" y="160" width="151" height="60" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="280.5" y="183.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">读到 READY</text>
  <text x="280.5" y="207.0" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">检查通过</text>
  <rect x="402" y="263" width="167" height="60" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
  <text x="485.5" y="286.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">销毁旧 QP</text>
  <text x="485.5" y="310.0" font-size="14" fill="#733428" font-weight="400" text-anchor="middle">未等 post 退出</text>
  <rect x="405" y="160" width="165" height="60" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
  <text x="487.5" y="183.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">继续 post</text>
  <text x="487.5" y="207.0" font-size="14" fill="#733428" font-weight="400" text-anchor="middle">访问旧指针</text>
  <polyline points="282,224 282,247 482,247 482,258" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#redarr)" />
  <polyline points="548,259 579,259 579,221 557,221" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#redarr)" />
  <text x="74" y="347" font-size="14" fill="#733428" font-weight="400" text-anchor="start">一次 acquire 读取不能保护后续整段调用。</text>
  <rect x="624" y="117" width="568" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="640" y="144" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">B · 静默确认必须覆盖</text>
  <circle cx="654" cy="168" r="14" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="654" y="173" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">1</text>
  <text x="682" y="173" font-size="14" fill="#24473F" font-weight="700" text-anchor="start">调用</text>
  <text x="744" y="173" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">所有旧代际 post 已返回</text>
  <circle cx="654" cy="216" r="14" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="654" y="221" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">2</text>
  <text x="682" y="221" font-size="14" fill="#24473F" font-weight="700" text-anchor="start">账本</text>
  <text x="744" y="221" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">最后 PostResult 已对账</text>
  <circle cx="654" cy="264" r="14" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="654" y="269" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">3</text>
  <text x="682" y="269" font-size="14" fill="#24473F" font-weight="700" text-anchor="start">路由</text>
  <text x="744" y="269" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">晚到命令不会绕过 owner</text>
  <circle cx="654" cy="312" r="14" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="654" y="317" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">4</text>
  <text x="682" y="317" font-size="14" fill="#24473F" font-weight="700" text-anchor="start">引用</text>
  <text x="744" y="317" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">旧资源使用者与租约可枚举</text>
  <text x="48" y="411" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">C · 正确交接链：任何一步未满足，都不能跳到销毁或复用</text>
  <rect x="48" y="447" width="213" height="86" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="154.5" y="483.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Close(g)</text>
  <text x="154.5" y="507.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">Owner 关闸</text>
  <polyline points="264,490 275,490" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="279" y="447" width="213" height="86" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="385.5" y="483.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">PostReturn</text>
  <text x="385.5" y="507.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">所有调用退出</text>
  <polyline points="495,490 506,490" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="510" y="447" width="213" height="86" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="616.5" y="483.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Reconciled</text>
  <text x="616.5" y="507.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">提交结果对账</text>
  <polyline points="726,490 737,490" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="741" y="447" width="213" height="86" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="847.5" y="483.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Quiesced</text>
  <text x="847.5" y="507.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">无未来旧提交</text>
  <polyline points="957,490 968,490" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="972" y="447" width="213" height="86" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="1078.5" y="483.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">Retire / Move</text>
  <text x="1078.5" y="507.0" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle">退休或迁移</text>
  <text x="67" y="572" font-size="15" fill="#733428" font-weight="700" text-anchor="start">取消调用者等待 ≠ 撤回 WR</text>
  <text x="646" y="572" font-size="15" fill="#514573" font-weight="700" text-anchor="start">新旧 Owner 不能重叠使用单线程域</text>
  <rect x="48" y="612" width="1144" height="47" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="66" y="641" font-size="14" fill="#4A473F" font-weight="700" text-anchor="start">迁移</text>
  <text x="114" y="641" font-size="14" fill="#4A473F" font-weight="400" text-anchor="start">队列、账本、定时器与资源访问权一起交接；收到旧 CQE 仍需结算旧账。</text>
</svg>