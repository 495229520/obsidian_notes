<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#F5F4ED"/>

  <text x="48" y="56" font-size="22" font-weight="700" fill="#2B2A26">高性能存储专题 · 数据路径全景</text>
  <text x="48" y="84" font-size="13" fill="#6B675C">一份数据从介质到 CPU / GPU 要走的三类路径；括号中的标号对应本专题章节</text>

  <line x1="418" y1="118" x2="418" y2="660" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="816" y1="118" x2="816" y2="660" stroke="#D8D5C8" stroke-width="1"/>

  <!-- ===== 路径一：经典内核路径 ===== -->
  <text x="72" y="132" font-size="14" font-weight="700" fill="#2B2A26">路径一 · 经典内核路径<tspan fill="#6B675C" font-weight="400">（第1 · 3章）</tspan></text>

  <rect x="72" y="148" width="312" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="228" y="170" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle">应用进程（用户态）</text>
  <text x="228" y="190" font-size="11.5" fill="#2C4460" text-anchor="middle">训练 DataLoader · RocksDB（第6章）· fio</text>

  <text x="72" y="216" font-size="11" fill="#A64B3C">系统调用边界：模式切换（1.1）</text>
  <line x1="64" y1="222" x2="392" y2="222" stroke="#A64B3C" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="228" y1="204" x2="228" y2="233" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="72" y="238" width="312" height="50" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="228" y="259" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle">VFS 虚拟文件系统（1.1）</text>
  <text x="228" y="278" font-size="11.5" fill="#24473F" text-anchor="middle">统一文件抽象：fd → file → inode</text>
  <line x1="228" y1="290" x2="228" y2="303" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="72" y="308" width="312" height="50" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="228" y="329" font-size="15" font-weight="700" fill="#7A5518" text-anchor="middle">Page Cache 页缓存（1.2）</text>
  <text x="228" y="348" font-size="11.5" fill="#7A5518" text-anchor="middle">命中 μs 级返回；未命中才向下走</text>
  <line x1="228" y1="360" x2="228" y2="373" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="72" y="378" width="312" height="50" rx="8" fill="#E9EFDA" stroke="#6A7F3F" stroke-width="1.5"/>
  <text x="228" y="399" font-size="15" font-weight="700" fill="#48562B" text-anchor="middle">文件系统 ext4 / xfs（1.3–1.6）</text>
  <text x="228" y="418" font-size="11.5" fill="#48562B" text-anchor="middle">O_DIRECT · fsync · mmap · 预读</text>
  <line x1="228" y1="430" x2="228" y2="443" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="72" y="448" width="312" height="50" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="228" y="469" font-size="15" font-weight="700" fill="#4A3F68" text-anchor="middle">块层 blk-mq（1.7）</text>
  <text x="228" y="488" font-size="11.5" fill="#4A3F68" text-anchor="middle">请求合并 · 多队列 · IO 调度器</text>
  <line x1="228" y1="500" x2="228" y2="513" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="72" y="518" width="312" height="50" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="228" y="539" font-size="15" font-weight="700" fill="#4A3F68" text-anchor="middle">NVMe 驱动（第3章）</text>
  <text x="228" y="558" font-size="11.5" fill="#4A3F68" text-anchor="middle">SQ / CQ 队列对 · Doorbell 门铃</text>
  <line x1="228" y1="570" x2="228" y2="595" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="240" y="587" font-size="11" fill="#6B675C">PCIe</text>

  <rect x="72" y="600" width="312" height="54" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="228" y="622" font-size="15" font-weight="700" fill="#733428" text-anchor="middle">NVMe SSD</text>
  <text x="228" y="642" font-size="11.5" fill="#733428" text-anchor="middle">FTL 映射 · GC · 写放大（第3章）</text>

  <!-- ===== 路径二：异步与内核旁路 ===== -->
  <text x="452" y="132" font-size="14" font-weight="700" fill="#2B2A26">路径二 · 异步与内核旁路<tspan fill="#6B675C" font-weight="400">（第2 · 5章）</tspan></text>

  <rect x="452" y="148" width="330" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="617" y="170" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle">io_uring：异步系统调用（第2章）</text>
  <text x="617" y="190" font-size="11.5" fill="#2C4460" text-anchor="middle">SQ / CQ 共享内存环，批量提交</text>
  <line x1="617" y1="204" x2="617" y2="233" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="452" y="238" width="330" height="50" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="617" y="259" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle">内核异步执行：仍走 VFS 与块层</text>
  <text x="617" y="278" font-size="11.5" fill="#24473F" text-anchor="middle">一次陷入提交一批 IO（2.3）</text>
  <line x1="617" y1="290" x2="617" y2="303" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="452" y="308" width="330" height="50" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="617" y="329" font-size="15" font-weight="700" fill="#733428" text-anchor="middle">完成事件回填 CQ，应用收割</text>
  <text x="617" y="348" font-size="11.5" fill="#733428" text-anchor="middle">少陷入 · 深队列，喂满 NVMe 的并行度</text>

  <line x1="452" y1="392" x2="782" y2="392" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="452" y="418" width="330" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="617" y="440" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle">SPDK：驱动搬进用户态（第5章）</text>
  <text x="617" y="460" font-size="11.5" fill="#2C4460" text-anchor="middle">轮询代替中断，零系统调用</text>
  <line x1="617" y1="474" x2="617" y2="503" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="452" y="508" width="330" height="50" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="617" y="529" font-size="15" font-weight="700" fill="#4A3F68" text-anchor="middle">用户态直接操作 NVMe SQ / CQ</text>
  <text x="617" y="548" font-size="11.5" fill="#4A3F68" text-anchor="middle">每核独占队列：无锁、无切换、无中断</text>
  <line x1="617" y1="560" x2="617" y2="589" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="452" y="594" width="330" height="54" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="617" y="616" font-size="15" font-weight="700" fill="#733428" text-anchor="middle">NVMe SSD</text>
  <text x="617" y="636" font-size="11.5" fill="#733428" text-anchor="middle">同一块盘，两种软件路径的延迟差（5.7）</text>

  <!-- ===== 路径三：跨网络与 GPU ===== -->
  <text x="852" y="132" font-size="14" font-weight="700" fill="#2B2A26">路径三 · 跨网络与 GPU<tspan fill="#6B675C" font-weight="400">（第4 · 5 · 7 · 8章）</tspan></text>

  <rect x="852" y="148" width="316" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="1010" y="170" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle">训练进程 + 分布式FS客户端</text>
  <text x="1010" y="190" font-size="11.5" fill="#2C4460" text-anchor="middle">JuiceFS · 3FS · 对象存储（第7章）</text>
  <line x1="1010" y1="204" x2="1010" y2="233" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="852" y="238" width="316" height="50" rx="8" fill="#E2E9ED" stroke="#4E6E81" stroke-width="1.5"/>
  <text x="1010" y="259" font-size="15" font-weight="700" fill="#33505F" text-anchor="middle">网络：内核 TCP 栈 或 RDMA</text>
  <text x="1010" y="278" font-size="11.5" fill="#33505F" text-anchor="middle">RDMA：网卡直写内存，内核旁路（第4章）</text>
  <line x1="1010" y1="290" x2="1010" y2="303" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="852" y="308" width="316" height="50" rx="8" fill="#E2E9ED" stroke="#4E6E81" stroke-width="1.5"/>
  <text x="1010" y="329" font-size="15" font-weight="700" fill="#33505F" text-anchor="middle">远端存储节点（第5 · 7章）</text>
  <text x="1010" y="348" font-size="11.5" fill="#33505F" text-anchor="middle">NVMe-oF Target · 副本 / EC（7.1）</text>
  <line x1="1010" y1="360" x2="1010" y2="373" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="852" y="378" width="316" height="50" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="1010" y="399" font-size="15" font-weight="700" fill="#733428" text-anchor="middle">远端 NVMe SSD</text>
  <text x="1010" y="418" font-size="11.5" fill="#733428" text-anchor="middle">延迟 = 网络 RTT + 远端栈 + 介质（5.4）</text>

  <line x1="852" y1="452" x2="1168" y2="452" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="852" y="478" width="316" height="54" rx="8" fill="#E9EFDA" stroke="#6A7F3F" stroke-width="1.5"/>
  <text x="1010" y="500" font-size="15" font-weight="700" fill="#48562B" text-anchor="middle">GPU 直连数据路径（第8章）</text>
  <text x="1010" y="520" font-size="11.5" fill="#48562B" text-anchor="middle">GDS / cuFile：SSD → 显存 P2P DMA</text>
  <line x1="1010" y1="536" x2="1010" y2="559" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="852" y="564" width="316" height="54" rx="8" fill="#E9EFDA" stroke="#6A7F3F" stroke-width="1.5"/>
  <text x="1010" y="586" font-size="15" font-weight="700" fill="#48562B" text-anchor="middle">跳过 CPU 内存中转（8.3）</text>
  <text x="1010" y="606" font-size="11.5" fill="#48562B" text-anchor="middle">数据供给速度决定 GPU 利用率（8.7）</text>

  <!-- ===== 横切章节 ===== -->
  <rect x="72" y="700" width="520" height="58" rx="8" fill="#ECEAE0" stroke="#8A8574" stroke-width="1.5"/>
  <text x="332" y="723" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="middle">第9章 · 性能观测与可靠性 —— 贯穿所有层</text>
  <text x="332" y="744" font-size="11.5" fill="#6B675C" text-anchor="middle">fio · iostat · blktrace · eBPF · p99 毛刺定位 · 故障注入</text>

  <rect x="620" y="700" width="548" height="58" rx="8" fill="#ECEAE0" stroke="#8A8574" stroke-width="1.5"/>
  <text x="894" y="723" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="middle">第10章 · 控制面 —— 编排数据面</text>
  <text x="894" y="744" font-size="11.5" fill="#6B675C" text-anchor="middle">K8s Operator · CRD / Reconcile · 拓扑亲和 · 故障摘除</text>
</svg>
