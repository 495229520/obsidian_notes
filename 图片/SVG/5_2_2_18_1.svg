<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="title desc">
  <title id="title">回溯算法通用流程</title>
  <desc id="desc">展示回溯算法从当前路径和选择列表出发，判断结束条件，做选择，递归深入，再撤销选择回到上一层。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#33495c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 27px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .label { font: 700 17px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .small { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4b5b6b; }
      .tiny { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5b6976; }
      .path { fill: #e6f0f7; stroke: #4d7fa3; stroke-width: 1.8; rx: 8; }
      .choice { fill: #f8e7ae; stroke: #c28a1d; stroke-width: 1.8; rx: 8; }
      .end { fill: #d8ead8; stroke: #4f9a68; stroke-width: 1.8; rx: 8; }
      .undo { fill: #f4d6cf; stroke: #c65d52; stroke-width: 1.8; rx: 8; }
      .card { fill: #fbfaf4; stroke: #d8cfbf; stroke-width: 1.4; rx: 8; }
      .line { stroke: #33495c; stroke-width: 1.9; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #7b6970; stroke-width: 1.8; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 6; }
      .tree { stroke: #7b6970; stroke-width: 1.6; fill: none; }
      .dot { fill: #fffaf0; stroke: #7b6970; stroke-width: 1.4; }
    </style>
  </defs>

  <text x="470" y="45" text-anchor="middle" class="title">回溯框架：选择、深入、撤销</text>
  <text x="470" y="74" text-anchor="middle" class="small">本质是在一棵选择树上做 DFS，每次递归只维护当前路径和剩余选择</text>

  <g transform="translate(64 112)">
    <rect x="0" y="0" width="220" height="78" class="path"/>
    <text x="110" y="28" text-anchor="middle" class="label">当前路径 path</text>
    <text x="110" y="52" text-anchor="middle" class="small">已经做出的选择</text>
  </g>

  <g transform="translate(356 112)">
    <rect x="0" y="0" width="220" height="78" class="choice"/>
    <text x="110" y="28" text-anchor="middle" class="label">选择列表 choices</text>
    <text x="110" y="52" text-anchor="middle" class="small">当前层还能尝试什么</text>
  </g>

  <g transform="translate(648 112)">
    <rect x="0" y="0" width="220" height="78" class="end"/>
    <text x="110" y="28" text-anchor="middle" class="label">结束条件</text>
    <text x="110" y="52" text-anchor="middle" class="small">路径合法时记录答案</text>
  </g>

  <path d="M 286 151 C 310 151, 330 151, 352 151" class="line"/>
  <path d="M 578 151 C 602 151, 622 151, 644 151" class="line"/>

  <g transform="translate(98 250)">
    <rect x="0" y="0" width="180" height="70" class="choice"/>
    <text x="90" y="27" text-anchor="middle" class="label">做选择</text>
    <text x="90" y="50" text-anchor="middle" class="small">path.push</text>
  </g>

  <g transform="translate(380 250)">
    <rect x="0" y="0" width="180" height="70" class="card"/>
    <text x="90" y="27" text-anchor="middle" class="label">递归深入</text>
    <text x="90" y="50" text-anchor="middle" class="small">backtrack(next)</text>
  </g>

  <g transform="translate(662 250)">
    <rect x="0" y="0" width="180" height="70" class="undo"/>
    <text x="90" y="27" text-anchor="middle" class="label">撤销选择</text>
    <text x="90" y="50" text-anchor="middle" class="small">path.pop</text>
  </g>

  <path d="M 280 285 C 312 285, 344 285, 376 285" class="line"/>
  <path d="M 562 285 C 594 285, 626 285, 658 285" class="line"/>
  <path d="M 752 248 C 760 216, 746 197, 722 190" class="loop"/>

  <g transform="translate(112 372)">
    <circle cx="0" cy="0" r="17" class="dot"/>
    <circle cx="90" cy="0" r="17" class="dot"/>
    <circle cx="180" cy="0" r="17" class="dot"/>
    <path d="M 17 0 L 73 0" class="tree"/>
    <path d="M 107 0 L 163 0" class="tree"/>
    <text x="0" y="5" text-anchor="middle" class="tiny">1</text>
    <text x="90" y="5" text-anchor="middle" class="tiny">2</text>
    <text x="180" y="5" text-anchor="middle" class="tiny">3</text>
    <text x="90" y="42" text-anchor="middle" class="small">path 随递归增长，随回溯恢复</text>
  </g>

  <g transform="translate(570 372)">
    <rect x="0" y="-24" width="260" height="68" class="card"/>
    <text x="130" y="2" text-anchor="middle" class="label">核心不变量</text>
    <text x="130" y="27" text-anchor="middle" class="small">离开当前层前，状态必须恢复</text>
  </g>
</svg>
