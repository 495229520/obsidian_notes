<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <rect x="0" y="0" width="1200" height="580" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .cell { fill: #ffffff; stroke: #64748b; stroke-width: 1.3; }
      .row { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .col { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">layout / op / leading dimension：cuBLASLt 可复现性的核心</text>
  <text x="56" y="88" class="small">同一个内存缓冲区，如果 layout 和 op 解释不同，得到的 GEMM 语义就不同。</text>

  <rect x="70" y="130" width="430" height="285" class="panel"/>
  <text x="100" y="170" class="label">row-major 项目视角</text>
  <g transform="translate(105 200)">
    <rect x="0" y="0" width="62" height="42" class="row"/><rect x="62" y="0" width="62" height="42" class="row"/><rect x="124" y="0" width="62" height="42" class="row"/><rect x="186" y="0" width="62" height="42" class="row"/>
    <rect x="0" y="42" width="62" height="42" class="cell"/><rect x="62" y="42" width="62" height="42" class="cell"/><rect x="124" y="42" width="62" height="42" class="cell"/><rect x="186" y="42" width="62" height="42" class="cell"/>
    <rect x="0" y="84" width="62" height="42" class="cell"/><rect x="62" y="84" width="62" height="42" class="cell"/><rect x="124" y="84" width="62" height="42" class="cell"/><rect x="186" y="84" width="62" height="42" class="cell"/>
    <path d="M0 155 H248" class="line"/>
    <text x="72" y="185" class="small">连续内存沿着 row 前进</text>
  </g>
  <text x="100" y="385" class="tiny">A[row, col] = A[row * stride + col]</text>

  <path d="M520 270 H640" class="line"/>

  <rect x="660" y="130" width="430" height="285" class="panel"/>
  <text x="690" y="170" class="label">descriptor 必须显式说明</text>
  <g transform="translate(695 200)">
    <rect x="0" y="0" width="62" height="42" class="col"/><rect x="62" y="0" width="62" height="42" class="cell"/><rect x="124" y="0" width="62" height="42" class="cell"/><rect x="186" y="0" width="62" height="42" class="cell"/>
    <rect x="0" y="42" width="62" height="42" class="col"/><rect x="62" y="42" width="62" height="42" class="cell"/><rect x="124" y="42" width="62" height="42" class="cell"/><rect x="186" y="42" width="62" height="42" class="cell"/>
    <rect x="0" y="84" width="62" height="42" class="col"/><rect x="62" y="84" width="62" height="42" class="cell"/><rect x="124" y="84" width="62" height="42" class="cell"/><rect x="186" y="84" width="62" height="42" class="cell"/>
    <text x="285" y="20" class="small">order</text>
    <text x="285" y="50" class="small">opA/opB</text>
    <text x="285" y="80" class="small">lda/ldb/ldc/ldd</text>
    <text x="285" y="110" class="small">D layout</text>
  </g>
  <text x="690" y="385" class="tiny">report 不写 layout，就无法判断到底算的是哪一个矩阵乘法。</text>

  <rect x="70" y="455" width="1020" height="64" class="warn"/>
  <text x="100" y="493" class="small">Week14 的 benchmark 行必须包含 A/B/C/D order、opA/opB、leading dimension 和 correctness 口径。</text>
</svg>
