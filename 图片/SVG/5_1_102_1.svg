<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a5568"/>
    </marker>
    <style>
      .title { font: 700 26px 'Arial', 'Microsoft YaHei', sans-serif; fill: #1f2937; }
      .label { font: 600 18px 'Arial', 'Microsoft YaHei', sans-serif; fill: #374151; }
      .small { font: 15px 'Arial', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
      .nodeText { font: 700 18px 'Arial', 'Microsoft YaHei', sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .boxText { font: 700 17px 'Arial', 'Microsoft YaHei', sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #374151; stroke-width: 3; fill: none; }
      .arrow { stroke: #4a5568; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="450" y="38" class="title" text-anchor="middle">LeetCode 102：队列实现二叉树层序遍历</text>

  <!-- Tree -->
  <text x="185" y="82" class="label" text-anchor="middle">示例二叉树</text>
  <line x1="185" y1="125" x2="125" y2="195" class="line"/>
  <line x1="185" y1="125" x2="245" y2="195" class="line"/>
  <line x1="245" y1="235" x2="205" y2="315" class="line"/>
  <line x1="245" y1="235" x2="285" y2="315" class="line"/>

  <circle cx="185" cy="115" r="30" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
  <text x="185" y="115" class="nodeText">3</text>
  <circle cx="125" cy="210" r="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="125" y="210" class="nodeText">9</text>
  <circle cx="245" cy="210" r="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="245" y="210" class="nodeText">20</text>
  <circle cx="205" cy="330" r="30" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="205" y="330" class="nodeText">15</text>
  <circle cx="285" cy="330" r="30" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="285" y="330" class="nodeText">7</text>

  <text x="185" y="420" class="small" text-anchor="middle">输出：[[3], [9,20], [15,7]]</text>

  <!-- Process blocks -->
  <text x="580" y="82" class="label" text-anchor="middle">BFS 队列过程</text>

  <rect x="395" y="105" width="370" height="60" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="580" y="128" class="boxText">1. root 入队：queue = [3]</text>
  <text x="580" y="150" class="small" text-anchor="middle">先从根节点开始，队列保存“待访问节点”</text>

  <path d="M580 168 L580 198" class="arrow"/>

  <rect x="395" y="205" width="370" height="70" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="580" y="229" class="boxText">2. 取出 3，加入结果第 1 层</text>
  <text x="580" y="253" class="small" text-anchor="middle">把 3 的左右孩子 9、20 入队：queue = [9,20]</text>

  <path d="M580 278 L580 308" class="arrow"/>

  <rect x="395" y="315" width="370" height="78" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="339" class="boxText">3. 固定当前层 size = 2</text>
  <text x="580" y="363" class="small" text-anchor="middle">依次取出 9、20，得到 [9,20]</text>
  <text x="580" y="384" class="small" text-anchor="middle">20 的孩子 15、7 入队：queue = [15,7]</text>

  <path d="M580 396 L580 426" class="arrow"/>

  <rect x="395" y="433" width="370" height="58" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="580" y="456" class="boxText">4. 再处理下一层，得到 [15,7]</text>
  <text x="580" y="478" class="small" text-anchor="middle">队列为空，遍历结束</text>

  <!-- Key reminder -->
  <rect x="50" y="455" width="280" height="42" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="190" y="481" class="small" text-anchor="middle">关键：每轮先记录 size，分清当前层</text>
</svg>
