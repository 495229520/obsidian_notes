<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
    <marker id="eventArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1f2933; }
      .h2 { font: 700 21px Arial, sans-serif; fill: #263238; }
      .h3 { font: 700 17px Arial, sans-serif; fill: #263238; }
      .text { font: 15px Arial, sans-serif; fill: #37474f; }
      .small { font: 13px Arial, sans-serif; fill: #455a64; }
      .tiny { font: 12px Arial, sans-serif; fill: #546e7a; }
      .host { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2.2; rx: 16; }
      .device { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2.2; rx: 16; }
      .panel { fill: #ffffff; stroke: #607d8b; stroke-width: 1.8; rx: 13; }
      .note { fill: #f5f5f5; stroke: #b0bec5; stroke-width: 1.5; rx: 10; }
      .copy { fill: #f3e5f5; stroke: #8e24aa; stroke-width: 2; rx: 10; }
      .event { fill: #ffebee; stroke: #c62828; stroke-width: 2.2; rx: 10; }
      .kernel { fill: #fff8e1; stroke: #f9a825; stroke-width: 2.2; rx: 10; }
      .block { fill: #fffde7; stroke: #fbc02d; stroke-width: 2; rx: 9; }
      .thread { fill: #ffffff; stroke: #8d6e63; stroke-width: 1.25; rx: 4; }
      .pill { fill: #ffffff; stroke: #b0bec5; stroke-width: 1.4; rx: 18; }
      .arrow { stroke: #455a64; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .eventLine { stroke: #c62828; stroke-width: 2.2; fill: none; stroke-dasharray: 7 6; marker-end: url(#eventArrow); }
      .softLine { stroke: #78909c; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1180" height="720" fill="rgb(245, 244, 237)"/>
  <text x="42" y="54" class="title">CUDA 中 device、stream、event 与 block 的关系</text>

  <rect x="42" y="94" width="290" height="500" class="host"/>
  <text x="72" y="136" class="h2">Host / CPU</text>
  <text x="72" y="174" class="text">1. 创建 stream / event</text>
  <text x="72" y="206" class="text">2. 提交 H2D copy</text>
  <text x="72" y="238" class="text">3. 提交 kernel launch</text>
  <text x="72" y="270" class="text">4. 提交 D2H copy</text>
  <text x="72" y="302" class="text">5. 等待 event 或 stream 完成</text>

  <rect x="72" y="350" width="230" height="138" class="note"/>
  <text x="98" y="382" class="h3">分清执行主体</text>
  <text x="98" y="414" class="small">CPU 线程：提交 CUDA 任务</text>
  <text x="98" y="442" class="small">Device：执行任务和管理显存</text>
  <text x="98" y="470" class="small">CUDA thread：只在 kernel 内执行</text>

  <rect x="78" y="520" width="218" height="44" class="panel"/>
  <text x="101" y="548" class="small">cudaEventSynchronize(Event A)</text>

  <rect x="430" y="94" width="690" height="500" class="device"/>
  <text x="464" y="136" class="h2">Device / GPU</text>
  <text x="464" y="166" class="text">device 是 GPU 执行资源和显存所在的位置；stream 是提交到 device 的任务队列。</text>

  <path d="M332 238 C372 238, 386 238, 430 238" class="arrow"/>
  <text x="350" y="218" class="small">提交任务到 stream</text>

  <rect x="464" y="198" width="622" height="140" class="panel"/>
  <text x="492" y="230" class="h3">Stream 0：队列内按提交顺序执行</text>
  <text x="492" y="256" class="small">同一 stream 中，后面的任务会等待前面的任务完成。</text>

  <rect x="505" y="282" width="112" height="42" class="copy"/>
  <text x="535" y="308" class="small">H2D copy</text>
  <rect x="658" y="282" width="112" height="42" class="event"/>
  <text x="687" y="308" class="small">Event A</text>
  <rect x="811" y="282" width="112" height="42" class="kernel"/>
  <text x="844" y="308" class="small">Kernel</text>
  <rect x="964" y="282" width="92" height="42" class="copy"/>
  <text x="986" y="308" class="small">D2H</text>

  <path d="M617 303 L655 303" class="arrow"/>
  <path d="M770 303 L808 303" class="arrow"/>
  <path d="M923 303 L961 303" class="arrow"/>

  <path d="M714 282 C650 210, 298 208, 296 519" class="eventLine"/>
  <text x="500" y="196" class="small">Host 可以等待 event；event 也可作为 GPU 计时点</text>

  <path d="M867 324 C867 356, 833 372, 786 388" class="arrow"/>
  <text x="884" y="365" class="small">kernel 执行时展开为 grid</text>

  <rect x="464" y="388" width="622" height="154" class="panel"/>
  <text x="492" y="422" class="h3">Grid：一次 kernel launch 产生的所有 block</text>

  <rect x="502" y="452" width="138" height="52" class="block"/>
  <text x="546" y="483" class="small">Block 0</text>
  <rect x="681" y="452" width="138" height="52" class="block"/>
  <text x="725" y="483" class="small">Block 1</text>
  <rect x="860" y="452" width="138" height="52" class="block"/>
  <text x="917" y="483" class="small">...</text>

  <rect x="518" y="514" width="20" height="20" class="thread"/>
  <rect x="544" y="514" width="20" height="20" class="thread"/>
  <rect x="570" y="514" width="20" height="20" class="thread"/>
  <text x="604" y="530" class="tiny">每个 block 内有很多 CUDA thread，可用 __syncthreads() 做 block 内协作</text>

  <path d="M571 452 L571 432" class="softLine"/>
  <path d="M750 452 L750 432" class="softLine"/>
  <path d="M929 452 L929 432" class="softLine"/>

  <rect x="42" y="626" width="1092" height="58" class="note"/>
  <rect x="70" y="643" width="238" height="24" class="pill"/>
  <text x="88" y="661" class="tiny">Host：提交 copy / kernel / sync</text>
  <rect x="326" y="643" width="238" height="24" class="pill"/>
  <text x="344" y="661" class="tiny">Stream：device 上的有序任务队列</text>
  <rect x="582" y="643" width="238" height="24" class="pill"/>
  <text x="600" y="661" class="tiny">Event：stream 时间线上的标记点</text>
  <rect x="838" y="643" width="268" height="24" class="pill"/>
  <text x="856" y="661" class="tiny">Block：kernel 内部的线程组织单元</text>
</svg>
