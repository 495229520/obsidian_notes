<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 19px; font-weight: 700; }
      .cell { font-size: 13px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
      .body { font-size: 14px; fill: #435363; }
      .label { font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <text x="56" y="54" class="title">naive 重复读取 vs shared memory tile 复用</text>
  <text x="56" y="83" class="subtitle">GEMM 的第一层优化：把会被重复使用的 A/B 数据搬到 block 内</text>

  <rect x="62" y="122" width="456" height="410" rx="8" fill="#f7e8e5" stroke="#c98e83" stroke-width="2"/>
  <text x="92" y="160" class="head">naive CUDA</text>
  <text x="92" y="190" class="body">每个线程自己从 global memory 读取 A/B</text>
  <text x="92" y="214" class="body">同一行 A 和同一列 B 会被反复取用</text>

  <rect x="100" y="258" width="118" height="118" fill="#dbeafe" stroke="#5b8fc2"/>
  <rect x="252" y="258" width="118" height="118" fill="#fde68a" stroke="#b89a3b"/>
  <rect x="404" y="258" width="66" height="118" fill="#e8f3e3" stroke="#7fa26a"/>
  <text x="159" y="317" class="cell">A row</text>
  <text x="311" y="317" class="cell">B col</text>
  <text x="437" y="317" class="cell">C</text>
  <line x1="222" y1="317" x2="244" y2="317" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="374" y1="317" x2="396" y2="317" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M146 396 C126 430, 122 456, 154 480" fill="none" stroke="#b94a48" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M296 396 C276 430, 272 456, 304 480" fill="none" stroke="#b94a48" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="116" y="506" class="label">重复 global load</text>
  <text x="92" y="554" class="body">清楚但浪费：数据复用留在慢速 global memory</text>

  <rect x="602" y="122" width="456" height="410" rx="8" fill="#e7efe3" stroke="#83a96d" stroke-width="2"/>
  <text x="632" y="160" class="head">shared memory tiled</text>
  <text x="632" y="190" class="body">一个 block 先加载 A tile 和 B tile</text>
  <text x="632" y="214" class="body">同步后，多个线程复用 shared memory 数据</text>

  <rect x="654" y="256" width="108" height="108" fill="#dbeafe" stroke="#5b8fc2"/>
  <rect x="804" y="256" width="108" height="108" fill="#fde68a" stroke="#b89a3b"/>
  <rect x="706" y="416" width="156" height="62" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="708" y="310" class="cell">A tile</text>
  <text x="858" y="310" class="cell">B tile</text>
  <text x="784" y="447" class="cell">shared memory</text>
  <line x1="708" y1="369" x2="750" y2="407" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="858" y1="369" x2="819" y2="407" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="867" y1="447" x2="932" y2="447" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="944" y="416" width="68" height="62" fill="#dcfce7" stroke="#7da66d"/>
  <text x="978" y="447" class="cell">C tile</text>

  <text x="632" y="554" class="body">核心收益：同一块 A/B tile 在 block 内被多次使用</text>
</svg>
