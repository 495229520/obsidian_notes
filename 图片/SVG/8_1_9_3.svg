<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>ext4 三种 data= 模式：数据与元数据路径</title>
  <desc>对照 ordered / writeback / journal 三种模式下文件数据与元数据如何进入日志或正式位置，以及 commit 前顺序约束。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">ext4 `data=` 三模式：日志记什么，commit 前约束什么</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">模式描述「如何组织日志与顺序」· 不等于 write() 已断电持久 · 仍需 fsync + 设备协议</text>

  <!-- shared layers label -->
  <text x="48" y="108" font-size="12" font-weight="700" fill="#6B675C">公共层：应用 write → page cache · 元数据进 JBD2</text>

  <!-- ========== ORDERED ========== -->
  <rect x="48" y="124" width="370" height="420" rx="10" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.8"/>
  <rect x="48" y="124" width="370" height="40" rx="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <rect x="48" y="152" width="370" height="12" fill="#DCE9E3"/>
  <text x="68" y="150" font-size="14" font-weight="700" fill="#24473F">data=ordered · 常见默认</text>

  <!-- memory -->
  <text x="68" y="190" font-size="11" font-weight="700" fill="#4A473F">内存</text>
  <rect x="68" y="200" width="150" height="48" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="143" y="222" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">脏数据页</text>
  <text x="143" y="238" font-size="10" fill="#8A6A3A" text-anchor="middle">page cache</text>

  <rect x="238" y="200" width="150" height="48" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="313" y="222" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">脏元数据</text>
  <text x="313" y="238" font-size="10" fill="#3D5A80" text-anchor="middle">进 JBD2 Tx</text>

  <!-- order constraint -->
  <rect x="68" y="268" width="320" height="44" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="228" y="288" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">① 相关新数据先写正式数据块</text>
  <text x="228" y="304" font-size="10" fill="#2F6B5E" text-anchor="middle">commit 元数据前的 ordered 约束</text>

  <path d="M228,312 L228,330" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arrg)"/>

  <rect x="68" y="336" width="320" height="44" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="228" y="356" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">② 元数据 → journal + commit</text>
  <text x="228" y="372" font-size="10" fill="#3D5A80" text-anchor="middle">数据通常不复制进日志</text>

  <path d="M228,380 L228,398" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="68" y="404" width="150" height="52" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="143" y="426" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">home data</text>
  <text x="143" y="444" font-size="10" fill="#8A6A3A" text-anchor="middle">正式数据块</text>

  <rect x="238" y="404" width="150" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="313" y="426" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">journal</text>
  <text x="313" y="444" font-size="10" fill="#3D5A80" text-anchor="middle">仅元数据</text>

  <text x="68" y="482" font-size="11" fill="#24473F">避免：新范围指向未写入/旧内容块</text>
  <text x="68" y="502" font-size="11" fill="#6B675C">≠ 全部脏页按应用顺序持久化</text>
  <text x="68" y="522" font-size="11" fill="#6B675C">≠ 业务 WAL / 跨文件原子</text>

  <!-- ========== WRITEBACK ========== -->
  <rect x="434" y="124" width="370" height="420" rx="10" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.8"/>
  <rect x="434" y="124" width="370" height="40" rx="10" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.8"/>
  <rect x="434" y="152" width="370" height="12" fill="#EFE7DA"/>
  <text x="454" y="150" font-size="14" font-weight="700" fill="#6B4E28">data=writeback · 更弱数据语义</text>

  <text x="454" y="190" font-size="11" font-weight="700" fill="#4A473F">内存</text>
  <rect x="454" y="200" width="150" height="48" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="529" y="222" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">脏数据页</text>
  <text x="529" y="238" font-size="10" fill="#8A6A3A" text-anchor="middle">异步 writeback</text>

  <rect x="624" y="200" width="150" height="48" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="699" y="222" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">脏元数据</text>
  <text x="699" y="238" font-size="10" fill="#3D5A80" text-anchor="middle">进 JBD2 Tx</text>

  <rect x="454" y="268" width="320" height="44" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="614" y="288" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">无 ordered 的数据-元数据顺序</text>
  <text x="614" y="304" font-size="10" fill="#A64B3C" text-anchor="middle">元数据可先 commit</text>

  <path d="M614,312 L614,330" fill="none" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arrr)"/>

  <rect x="454" y="336" width="320" height="44" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="614" y="356" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">元数据 → journal + commit</text>
  <text x="614" y="372" font-size="10" fill="#3D5A80" text-anchor="middle">数据不进日志</text>

  <path d="M529,380 L529,398" fill="none" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arra)"/>
  <path d="M699,380 L699,398" fill="none" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrb)"/>

  <rect x="454" y="404" width="150" height="52" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="529" y="426" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">home data</text>
  <text x="529" y="444" font-size="10" fill="#8A6A3A" text-anchor="middle">可滞后 / 乱序</text>

  <rect x="624" y="404" width="150" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="699" y="426" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">journal</text>
  <text x="699" y="444" font-size="10" fill="#3D5A80" text-anchor="middle">仅元数据</text>

  <text x="454" y="482" font-size="11" fill="#6B4E28">FS 结构可一致 · 文件内容语义更弱</text>
  <text x="454" y="502" font-size="11" fill="#6B675C">崩溃后可能见旧数据或未更新范围</text>
  <text x="454" y="522" font-size="11" fill="#6B675C">「元数据已提交」≠「内容已持久」</text>

  <!-- ========== JOURNAL ========== -->
  <rect x="820" y="124" width="372" height="420" rx="10" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.8"/>
  <rect x="820" y="124" width="372" height="40" rx="10" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.8"/>
  <rect x="820" y="152" width="372" height="12" fill="#E3EAF4"/>
  <text x="840" y="150" font-size="14" font-weight="700" fill="#2C4460">data=journal · 数据也走日志</text>

  <text x="840" y="190" font-size="11" font-weight="700" fill="#4A473F">内存</text>
  <rect x="840" y="200" width="150" height="48" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="915" y="222" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">脏数据页</text>
  <text x="915" y="238" font-size="10" fill="#8A6A3A" text-anchor="middle">纳入日志管理</text>

  <rect x="1010" y="200" width="150" height="48" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1085" y="222" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">脏元数据</text>
  <text x="1085" y="238" font-size="10" fill="#3D5A80" text-anchor="middle">进 JBD2 Tx</text>

  <path d="M915,252 L915,268" fill="none" stroke="#3D5A80" stroke-width="1.4" marker-end="url(#arrb)"/>
  <path d="M1085,252 L1085,268" fill="none" stroke="#3D5A80" stroke-width="1.4" marker-end="url(#arrb)"/>

  <rect x="840" y="274" width="320" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="1000" y="296" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">① 数据 + 元数据 → journal</text>
  <text x="1000" y="314" font-size="10" fill="#3D5A80" text-anchor="middle">同一事务覆盖后 commit</text>

  <path d="M1000,326 L1000,344" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arrg)"/>

  <rect x="840" y="350" width="320" height="44" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1000" y="370" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">② checkpoint → 正式位置</text>
  <text x="1000" y="386" font-size="10" fill="#2F6B5E" text-anchor="middle">数据与元数据均可异步写回</text>

  <rect x="840" y="414" width="150" height="42" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="915" y="440" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">home data</text>

  <rect x="1010" y="414" width="150" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1085" y="440" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">home meta</text>

  <text x="840" y="482" font-size="11" fill="#2C4460">三种中最强的文件数据日志语义</text>
  <text x="840" y="502" font-size="11" fill="#6B675C">代价：写放大 · 日志空间 · 路径变化</text>
  <text x="840" y="522" font-size="11" fill="#6B675C">仍非跨文件业务事务</text>

  <!-- ========== comparison bar ========== -->
  <rect x="48" y="566" width="1144" height="140" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
  <text x="72" y="598" font-size="13" font-weight="700" fill="#4A473F">对照要点</text>

  <!-- mini table headers -->
  <text x="72" y="630" font-size="11" font-weight="700" fill="#6B675C">模式</text>
  <text x="220" y="630" font-size="11" font-weight="700" fill="#6B675C">元数据进日志</text>
  <text x="400" y="630" font-size="11" font-weight="700" fill="#6B675C">普通数据进日志</text>
  <text x="600" y="630" font-size="11" font-weight="700" fill="#6B675C">commit 前数据顺序</text>
  <text x="860" y="630" font-size="11" font-weight="700" fill="#6B675C">主要取舍</text>

  <line x1="72" y1="640" x2="1160" y2="640" stroke="#D8D5C8" stroke-width="1"/>

  <text x="72" y="662" font-size="12" fill="#24473F">ordered</text>
  <text x="220" y="662" font-size="12" fill="#2B2A26">是</text>
  <text x="400" y="662" font-size="12" fill="#2B2A26">通常否</text>
  <text x="600" y="662" font-size="12" fill="#2B2A26">相关新数据有约束</text>
  <text x="860" y="662" font-size="12" fill="#2B2A26">常见折中（须核实挂载）</text>

  <text x="72" y="686" font-size="12" fill="#6B4E28">writeback</text>
  <text x="220" y="686" font-size="12" fill="#2B2A26">是</text>
  <text x="400" y="686" font-size="12" fill="#2B2A26">否</text>
  <text x="600" y="686" font-size="12" fill="#2B2A26">不提供 ordered 保证</text>
  <text x="860" y="686" font-size="12" fill="#2B2A26">约束少 · 内容语义更弱</text>

  <!-- bottom warning -->
  <rect x="48" y="726" width="1144" height="164" rx="10" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="72" y="758" font-size="13" font-weight="700" fill="#733428">边界提醒 · 模式名不是持久化 API</text>

  <rect x="72" y="778" width="350" height="88" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="92" y="808" font-size="12" font-weight="700" fill="#733428">write() 成功</text>
  <text x="92" y="830" font-size="11" fill="#733428">只说明内核接受字节</text>
  <text x="92" y="848" font-size="11" fill="#733428">可能仍在 page cache</text>

  <rect x="442" y="778" width="350" height="88" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="462" y="808" font-size="12" font-weight="700" fill="#6B4E28">data= 模式</text>
  <text x="462" y="830" font-size="11" fill="#6B4E28">约束日志组织与顺序</text>
  <text x="462" y="848" font-size="11" fill="#6B4E28">不替代同步接口</text>

  <rect x="812" y="778" width="350" height="88" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="832" y="808" font-size="12" font-weight="700" fill="#24473F">fsync / fdatasync</text>
  <text x="832" y="830" font-size="11" fill="#24473F">请求达到持久化点</text>
  <text x="832" y="848" font-size="11" fill="#24473F">+ flush / FUA / 可信设备</text>
</svg>
