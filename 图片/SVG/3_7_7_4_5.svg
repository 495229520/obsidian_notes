<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 664" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>DNS 报文结构：12 字节定长头与四个记录区</title>
  <desc>左侧按每行十六位展开 DNS 的十二字节固定头部，包含事务标识、标志位以及四个计数字段；右侧展示头部之后的问题区、回答区、授权区和附加区，其条目数由对应计数字段决定；底部对照 DNS 走 UDP 与走 TCP 时消息边界的不同处理方式。</desc>

  <rect x="0" y="0" width="1240" height="664" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">DNS：12 字节定长头 + 四个记录区</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">头部长度是死的，四个计数字段告诉接收方后面还要解析几条记录</text>

  <!-- ============ Panel A: 头部位图 ============ -->
  <rect x="48" y="104" width="680" height="326" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 头部 12 字节，每行 16 位</text>

  <text x="76" y="160" font-size="9.5" fill="#9B968A">bit 0</text>
  <text x="692" y="160" font-size="9.5" fill="#9B968A" text-anchor="end">bit 15</text>

  <rect x="72" y="168" width="624" height="30" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="384" y="188" font-size="11.5" fill="#4A473F" text-anchor="middle">ID　事务标识，用来把响应配回请求</text>

  <rect x="72" y="202" width="39" height="30" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="91" y="222" font-size="9.5" fill="#6B5B95" text-anchor="middle">QR</text>
  <rect x="111" y="202" width="156" height="30" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="189" y="222" font-size="9.5" fill="#6B5B95" text-anchor="middle">Opcode</text>
  <rect x="267" y="202" width="39" height="30" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="286" y="222" font-size="9.5" fill="#6B5B95" text-anchor="middle">AA</text>
  <rect x="306" y="202" width="39" height="30" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="325" y="222" font-size="9.5" font-weight="700" fill="#733428" text-anchor="middle">TC</text>
  <rect x="345" y="202" width="39" height="30" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="364" y="222" font-size="9.5" fill="#6B5B95" text-anchor="middle">RD</text>
  <rect x="384" y="202" width="39" height="30" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="403" y="222" font-size="9.5" fill="#6B5B95" text-anchor="middle">RA</text>
  <rect x="423" y="202" width="117" height="30" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="481" y="222" font-size="9.5" fill="#6B5B95" text-anchor="middle">Z · AD · CD</text>
  <rect x="540" y="202" width="156" height="30" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1"/>
  <text x="618" y="222" font-size="9.5" fill="#6B5B95" text-anchor="middle">RCODE</text>

  <rect x="72" y="236" width="624" height="30" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="384" y="256" font-size="11.5" fill="#2C4460" text-anchor="middle">QDCOUNT　问题区有几条</text>

  <rect x="72" y="270" width="624" height="30" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="384" y="290" font-size="11.5" fill="#24473F" text-anchor="middle">ANCOUNT　回答区有几条</text>

  <rect x="72" y="304" width="624" height="30" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="384" y="324" font-size="11.5" fill="#6B4E28" text-anchor="middle">NSCOUNT　授权区有几条</text>

  <rect x="72" y="338" width="624" height="30" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="384" y="358" font-size="11.5" fill="#4A473F" text-anchor="middle">ARCOUNT　附加区有几条</text>

  <text x="72" y="390" font-size="11.5" font-weight="700" fill="#733428">TC = 1 表示响应装不下被截断了，客户端要改用 TCP 重问一次</text>
  <text x="72" y="412" font-size="11" fill="#4A473F">RFC 1035 里 Z 是 3 个保留位，后来其中两位被拿去做了 AD 和 CD</text>

  <!-- ============ Panel B: 报文整体 ============ -->
  <rect x="752" y="104" width="440" height="326" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="776" y="132" font-size="15" font-weight="700" fill="#4A473F">B · 头部之后的四个区</text>
  <text x="776" y="154" font-size="11" fill="#6B675C">条数由左边对应的计数字段决定</text>

  <rect x="776" y="168" width="392" height="40" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.4"/>
  <text x="972" y="193" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">头部　固定 12 字节</text>

  <rect x="776" y="218" width="392" height="40" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="972" y="243" font-size="11.5" fill="#2C4460" text-anchor="middle">问题区　查什么名字、什么类型</text>

  <rect x="776" y="268" width="392" height="40" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="972" y="293" font-size="11.5" fill="#24473F" text-anchor="middle">回答区　A / AAAA / CNAME 记录</text>

  <rect x="776" y="318" width="392" height="40" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="972" y="343" font-size="11.5" fill="#6B4E28" text-anchor="middle">授权区　该找哪台权威服务器</text>

  <rect x="776" y="368" width="392" height="40" rx="6" fill="#F4F2EA" stroke="#9B968A" stroke-width="1.2"/>
  <text x="972" y="393" font-size="11.5" fill="#4A473F" text-anchor="middle">附加区　顺带给出的胶水记录</text>

  <!-- ============ Panel C: UDP vs TCP ============ -->
  <rect x="48" y="454" width="1144" height="170" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="482" font-size="15" font-weight="700" fill="#4A473F">C · 同一个协议，换了传输层就得换边界办法</text>

  <rect x="72" y="498" width="536" height="86" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="88" y="520" font-size="12.5" font-weight="700" fill="#24473F">走 UDP：不需要长度字段</text>
  <text x="88" y="542" font-size="11" fill="#24473F">一个数据报就是一条完整消息</text>
  <text x="88" y="564" font-size="10.5" fill="#2F6B5E">传统上限 512 字节，EDNS0 可协商更大</text>

  <rect x="632" y="498" width="536" height="86" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="648" y="520" font-size="12.5" font-weight="700" fill="#2C4460">走 TCP：报文前面加 2 字节长度</text>
  <text x="648" y="542" font-size="11" fill="#2C4460">响应被截断、或做区域传送时改走这条</text>
  <text x="648" y="564" font-size="10.5" fill="#3D5A80">字节流不带边界，只能自己补一个</text>

  <text x="72" y="606" font-size="11.5" fill="#4A473F">这一对照最能说明问题：边界是每个协议都躲不掉的，躲不掉的东西挪个位置还是要还</text>
</svg>
