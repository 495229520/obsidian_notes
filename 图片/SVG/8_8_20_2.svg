<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
<title>NET/IB 不等于 GDR：网络相同，内存目标可以不同</title><desc>上路 NIC 访问 GPU 缓冲区；下路先经过两端主机中转。虚线是 CPU 控制，不是 payload。。原创教学示意；数字不是硬件实测；详细条件与出处见对应 Markdown 笔记。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="52" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">NET/IB 不等于 GDR：网络相同，内存目标可以不同</text>
<text x="48" y="81" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">上路 NIC 访问 GPU 缓冲区；下路先经过两端主机中转。虚线是 CPU 控制，不是 payload。</text>
<rect x="48" y="110" width="1144" height="214" rx="8" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="48" y="344" width="1144" height="244" rx="8" fill="#F3E8D3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="137" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">A · GDR：省去 host staging</text>
<rect x="321" y="151" width="198" height="40" rx="8" fill="#EDEAF3" stroke="#82709B" stroke-width="1.3"/>
<text x="420.0" y="176.0" font-size="14" fill="#625476" font-weight="700" text-anchor="middle">CPU Proxy A</text>
<rect x="818" y="151" width="198" height="40" rx="8" fill="#EDEAF3" stroke="#82709B" stroke-width="1.3"/>
<text x="917.0" y="176.0" font-size="14" fill="#625476" font-weight="700" text-anchor="middle">CPU Proxy B</text>
<line x1="390" y1="194" x2="390" y2="228" stroke="#82709B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<line x1="887" y1="194" x2="887" y2="228" stroke="#82709B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<rect x="64" y="232" width="170" height="65" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="149.0" y="258.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU buffer A</text>
<text x="149.0" y="280.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">内部或用户缓冲</text>
<rect x="322" y="232" width="145" height="65" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="394.5" y="258.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">NIC A</text>
<text x="394.5" y="280.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">PCIe / GDR</text>
<rect x="551" y="232" width="174" height="65" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="638.0" y="258.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">Fabric</text>
<text x="638.0" y="280.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">IB / RoCE</text>
<rect x="809" y="232" width="145" height="65" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="881.5" y="258.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">NIC B</text>
<text x="881.5" y="280.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">PCIe / GDR</text>
<rect x="1038" y="232" width="138" height="65" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1107.0" y="258.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU buffer B</text>
<text x="1107.0" y="280.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">归约 / 消费</text>
<line x1="238" y1="264" x2="316" y2="264" stroke="#2F6B5E" stroke-width="3" marker-end="url(#green)"/>
<line x1="471" y1="264" x2="545" y2="264" stroke="#2F6B5E" stroke-width="3" marker-end="url(#green)"/>
<line x1="729" y1="264" x2="803" y2="264" stroke="#2F6B5E" stroke-width="3" marker-end="url(#green)"/>
<line x1="958" y1="264" x2="1032" y2="264" stroke="#2F6B5E" stroke-width="3" marker-end="url(#green)"/>
<text x="64" y="374" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">B · Host staging：NIC 仍可使用 RDMA，但访问的是主机缓冲</text>
<rect x="64" y="426" width="110" height="78" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="119.0" y="459.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU A</text>
<text x="119.0" y="481.0" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">显存</text>
<rect x="211" y="426" width="148" height="78" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="285.0" y="459.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">Pinned DRAM</text>
<text x="285.0" y="481.0" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">源端中转</text>
<rect x="397" y="426" width="121" height="78" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="457.5" y="459.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">NIC A</text>
<text x="457.5" y="481.0" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">Host MR</text>
<rect x="556" y="426" width="146" height="78" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="629.0" y="459.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">Fabric</text>
<text x="629.0" y="481.0" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">IB / RoCE</text>
<rect x="740" y="426" width="121" height="78" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="800.5" y="459.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">NIC B</text>
<text x="800.5" y="481.0" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">Host MR</text>
<rect x="899" y="426" width="148" height="78" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="973.0" y="459.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">Pinned DRAM</text>
<text x="973.0" y="481.0" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">远端中转</text>
<rect x="1082" y="426" width="95" height="78" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1129.5" y="459.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU B</text>
<text x="1129.5" y="481.0" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">显存</text>
<line x1="178" y1="465" x2="206" y2="465" stroke="#8A6A3A" stroke-width="2.5" marker-end="url(#amber)"/>
<line x1="363" y1="465" x2="392" y2="465" stroke="#8A6A3A" stroke-width="2.5" marker-end="url(#amber)"/>
<line x1="522" y1="465" x2="551" y2="465" stroke="#8A6A3A" stroke-width="2.5" marker-end="url(#amber)"/>
<line x1="706" y1="465" x2="735" y2="465" stroke="#8A6A3A" stroke-width="2.5" marker-end="url(#amber)"/>
<line x1="865" y1="465" x2="894" y2="465" stroke="#8A6A3A" stroke-width="2.5" marker-end="url(#amber)"/>
<line x1="1051" y1="465" x2="1077" y2="465" stroke="#8A6A3A" stroke-width="2.5" marker-end="url(#amber)"/>
<text x="64" y="542" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="start">新增主机缓冲、内存与本地互联开销</text>
<text x="650" y="542" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="start">中转未必由 CPU 执行逐字节 memcpy</text>
<text x="64" y="570" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">GDR 也不保证直接使用应用原始缓冲区；NCCL 内部显存 buffer 可能仍参与。</text>
<line x1="48" y1="609" x2="1192" y2="609" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="637" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">CPU Proxy 参与不代表 payload 经过 CPU；判断回退要组合 transport、注册、连接信息与对照实验。</text>
<text x="48" y="660" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">对应 8.20 §4；具体数据访问、拷贝与可见性处理以所用 Protocol、插件和平台为准。</text>
</svg>