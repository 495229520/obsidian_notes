<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470">
  <rect x="0" y="0" width="940" height="470" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>RAII 锁的异常安全：手动 lock/unlock vs lock_guard</title>
  <desc>手动解锁在异常路径上会被跳过导致死锁；lock_guard 把解锁绑定到析构，栈展开时自动释放。</desc>

  <text x="470" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    RAII 为什么能保证锁的异常安全
  </text>
  <text x="470" y="54" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">
    临界区抛异常时，手动 unlock 被跳过，RAII 析构却照常执行
  </text>

  <line x1="470" y1="78" x2="470" y2="402" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>

  <text x="260" y="90" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">手动 lock / unlock</text>
  <text x="680" y="90" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">std::lock_guard（RAII）</text>

  <!-- 左列 -->
  <rect x="120" y="110" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="260" y="138" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">① mtx.lock()</text>
  <rect x="120" y="226" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="260" y="254" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">② 临界区抛出异常</text>
  <rect x="120" y="342" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="260" y="370" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">③ unlock() 被跳过 → 死锁 ✗</text>
  <path d="M260 166 L260 226" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M260 282 L260 342" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 右列 -->
  <rect x="540" y="110" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="680" y="138" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">① 构造即 lock()</text>
  <rect x="540" y="226" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="680" y="254" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">② 临界区抛出异常</text>
  <rect x="540" y="342" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="680" y="370" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">③ 栈展开，析构自动 unlock() ✓</text>
  <path d="M680 166 L680 226" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M680 282 L680 342" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="470" y="430" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    RAII 把"解锁"绑定到对象析构：无论正常返回还是异常退出都自动释放，这是锁包装器的核心价值
  </text>
</svg>
