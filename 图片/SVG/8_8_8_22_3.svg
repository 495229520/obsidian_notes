<text x="1005" y="548" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">Step 吞吐</text>
<line x1="48" y1="606" x2="1192" y2="606" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="48" y="626" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">小 bucket 例：ready=[2,5,8]，服务时间均为 3 ms，完成=[5,8,11]；宽度对应这些假设数值。</text>
<text x="48" y="649" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start">真实系统可在所有 rank 到达前发生部分进展；并发资源争用也会改变各 bucket 的服务时间。</text>
