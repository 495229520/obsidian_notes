<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统：底色 rgb(245,244,237)；蓝 #E3EAF4/#3D5A80/#2C4460；绿 #DCE9E3/#2F6B5E/#24473F；
       琥珀 #EFE7DA/#8A6A3A/#6B4E28；中性 #F1EFE8/#D8D5C8/#4A473F -->
  <title>合成远期：买入看涨 + 卖出看跌 = 远期多头</title>
  <desc>三幅收益图并列。左：买入看涨期权，行权价 K 左侧为固定亏损（权利金 C），右侧斜率 +1。中：卖出看跌期权，K 左侧斜率 +1，右侧为固定收益（权利金 P）。右：两者相加，K 两侧斜率都是 +1，合成一条贯穿全程的 45 度直线，等价于远期多头。三图纵坐标严格相加：K 左侧 1+0，K 右侧 0+1，处处为 1。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="rgb(245, 244, 237)"/>

  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">合成远期：为什么「买看涨 + 卖看跌」就是远期多头</text>
  <text x="48" y="76" font-size="14" fill="#6B675C">看两段斜率怎么拼：行权价 K 左侧 1+0，右侧 0+1 —— 处处为 1，于是折线拉直成一条 45° 直线。</text>

  <!-- ============ Panel A : 买入看涨期权 ============ -->
  <rect x="56" y="106" width="320" height="346" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="13" font-weight="700" fill="#2C4460">① 买入看涨期权</text>
  <text x="72" y="150" font-size="10.5" fill="#6B675C">Long Call · 付出权利金 C</text>

  <!-- axes -->
  <line x1="102" y1="156" x2="102" y2="414" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="86" y1="300" x2="348" y2="300" stroke="#9B968A" stroke-width="1.2" marker-end="url(#arrn)"/>
  <line x1="206" y1="170" x2="206" y2="414" stroke="#B07D2B" stroke-width="1.1" stroke-dasharray="4 4"/>
  <text x="112" y="166" font-size="10.5" fill="#6B675C">收益</text>
  <text x="348" y="322" font-size="10.5" fill="#6B675C" text-anchor="end">股价 S_T</text>
  <text x="94" y="304" font-size="10" fill="#6B675C" text-anchor="end">0</text>
  <text x="206" y="332" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">K</text>

  <!-- payoff: flat at -C, then slope +1 -->
  <path d="M102,340 L206,340 L342,204" fill="none" stroke="#3D5A80" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="206" cy="340" r="3.4" fill="#3D5A80"/>
  <circle cx="246" cy="300" r="3.4" fill="#FBFBF6" stroke="#3D5A80" stroke-width="2"/>
  <text x="128" y="358" font-size="10.5" fill="#2C4460">−C</text>
  <text x="252" y="288" font-size="10" fill="#6B675C">盈亏平衡</text>
  <text x="298" y="238" font-size="10.5" font-weight="700" fill="#2C4460">斜率 +1</text>
  <text x="132" y="322" font-size="10.5" font-weight="700" fill="#6B675C">斜率 0</text>

  <text x="72" y="436" font-size="11" fill="#4A473F">K 左：亏定权利金 C；K 右：跟涨</text>

  <!-- ============ operator + ============ -->
  <text x="423" y="312" font-size="30" font-weight="700" fill="#4A473F" text-anchor="middle">+</text>

  <!-- ============ Panel B : 卖出看跌期权 ============ -->
  <rect x="470" y="106" width="320" height="346" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="486" y="132" font-size="13" font-weight="700" fill="#24473F">② 卖出看跌期权</text>
  <text x="486" y="150" font-size="10.5" fill="#6B675C">Short Put · 收取权利金 P</text>

  <line x1="516" y1="156" x2="516" y2="414" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="500" y1="300" x2="762" y2="300" stroke="#9B968A" stroke-width="1.2" marker-end="url(#arrn)"/>
  <line x1="620" y1="170" x2="620" y2="414" stroke="#B07D2B" stroke-width="1.1" stroke-dasharray="4 4"/>
  <text x="526" y="166" font-size="10.5" fill="#6B675C">收益</text>
  <text x="762" y="322" font-size="10.5" fill="#6B675C" text-anchor="end">股价 S_T</text>
  <text x="508" y="304" font-size="10" fill="#6B675C" text-anchor="end">0</text>
  <text x="620" y="332" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">K</text>

  <!-- payoff: slope +1 up to K, then flat at +P -->
  <path d="M516,364 L620,260 L756,260" fill="none" stroke="#2F6B5E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="620" cy="260" r="3.4" fill="#2F6B5E"/>
  <circle cx="580" cy="300" r="3.4" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="2"/>
  <text x="676" y="250" font-size="10.5" fill="#24473F">+P</text>
  <text x="528" y="382" font-size="10" fill="#733428">跌得越多亏越多</text>
  <text x="536" y="292" font-size="10.5" font-weight="700" fill="#24473F">斜率 +1</text>
  <text x="690" y="284" font-size="10.5" font-weight="700" fill="#6B675C">斜率 0</text>

  <text x="486" y="436" font-size="11" fill="#4A473F">K 左：跟跌；K 右：赚定权利金 P</text>

  <!-- ============ operator = ============ -->
  <text x="837" y="312" font-size="30" font-weight="700" fill="#4A473F" text-anchor="middle">=</text>

  <!-- ============ Panel C : 合成远期多头 ============ -->
  <rect x="884" y="106" width="320" height="346" rx="8" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="900" y="132" font-size="13" font-weight="700" fill="#6B4E28">③ 合成远期多头</text>
  <text x="900" y="150" font-size="10.5" fill="#6B675C">Synthetic Long Forward</text>

  <line x1="930" y1="156" x2="930" y2="414" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="914" y1="300" x2="1176" y2="300" stroke="#9B968A" stroke-width="1.2" marker-end="url(#arrn)"/>
  <line x1="1034" y1="170" x2="1034" y2="414" stroke="#B07D2B" stroke-width="1.1" stroke-dasharray="4 4"/>
  <text x="940" y="166" font-size="10.5" fill="#6B675C">收益</text>
  <text x="1176" y="322" font-size="10.5" fill="#6B675C" text-anchor="end">股价 S_T</text>
  <text x="922" y="304" font-size="10" fill="#6B675C" text-anchor="end">0</text>
  <text x="1034" y="332" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">K</text>

  <!-- payoff: one straight 45-degree line through K -->
  <path d="M930,404 L1170,164" fill="none" stroke="#A64B3C" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="1034" cy="300" r="3.8" fill="#A64B3C"/>
  <text x="1044" y="288" font-size="10" fill="#733428">交割价 K</text>
  <text x="1092" y="216" font-size="10.5" font-weight="700" fill="#733428">全程斜率 +1</text>
  <text x="944" y="392" font-size="10" fill="#6B675C">无拐点</text>

  <text x="900" y="436" font-size="11" fill="#4A473F">一条直线 —— 就是远期多头</text>

  <!-- ============ bottom strip ============ -->
  <rect x="56" y="474" width="1148" height="60" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="76" y="498" font-size="13" font-weight="700" fill="#2C4460">C − P = S<tspan font-size="9" dy="3">0</tspan><tspan dy="-3"> − Ke</tspan><tspan font-size="9" dy="-5">−rT</tspan></text>
  <text x="240" y="498" font-size="11.5" fill="#2C4460">把平价式移项，左边是「买看涨 + 卖看跌」，右边就是一份远期多头的价值。</text>
  <text x="76" y="521" font-size="11.5" fill="#4A473F">读法：拐点方向相反的两条折线相加，凸角与凹角互相抵消，只剩一条斜率恒为 1 的直线；这就是平价关系的几何解释。</text>
</svg>
