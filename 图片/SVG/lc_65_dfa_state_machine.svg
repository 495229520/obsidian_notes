<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .title { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: bold; }
      .sub { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; }
      .node-num { font-family: "JetBrains Mono", Consolas, monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .node-desc { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 10.5px; text-anchor: middle; }
      .edge-t { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .card-h { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; font-weight: bold; }
      .card-c { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10.5px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <!-- 根背景 -->
  <rect x="0" y="0" width="960" height="520" fill="rgb(245, 244, 237)"/>

  <!-- 头部信息 -->
  <text x="36" y="28" class="title" fill="#0C447C" dominant-baseline="central">LeetCode 65. 有效数字 — 确定有限状态自动机 (DFA)</text>
  <text x="36" y="48" class="sub" fill="#5F5E5A" dominant-baseline="central">双圈为合法终止态（状态 2, 4, 5, 8）· 其他字符转移至非法状态</text>

  <!-- 图例 -->
  <circle cx="700" cy="38" r="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="718" y="38" class="sub" fill="#444441" dominant-baseline="central">过渡状态</text>
  <circle cx="790" cy="38" r="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <circle cx="790" cy="38" r="7.5" fill="none" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="808" y="38" class="sub" fill="#085041" dominant-baseline="central">接受终止态</text>

  <!-- 连线路径 -->
  <!-- 0 -> 1 (+/-) -->
  <path d="M 80 190 C 98 150, 130 126, 162 120" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 0 -> 2 (0-9) -->
  <line x1="94" y1="210" x2="276" y2="210" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 0 -> 3 (.) -->
  <path d="M 80 230 C 98 270, 130 294, 162 300" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 1 -> 2 (0-9) -->
  <path d="M 216 126 C 242 148, 264 176, 282 196" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 1 -> 3 (.) -->
  <path d="M 190 144 L 190 274" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 2 自环 (0-9) -->
  <path d="M 292 184 C 285 148, 325 148, 318 184" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 2 -> 5 (.) -->
  <path d="M 326 196 C 354 168, 386 144, 420 132" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 2 -> 6 (e/E) -->
  <line x1="334" y1="210" x2="556" y2="210" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 3 -> 4 (0-9) -->
  <line x1="218" y1="300" x2="418" y2="300" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 5 -> 4 (0-9) -->
  <path d="M 444 144 L 444 274" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 5 -> 6 (e/E) -->
  <path d="M 464 130 C 498 146, 532 172, 564 198" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 4 自环 (0-9) -->
  <path d="M 432 326 C 425 362, 465 362, 458 326" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 4 -> 6 (e/E) -->
  <path d="M 464 288 C 498 270, 532 246, 564 222" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 6 -> 7 (+/-) -->
  <path d="M 606 196 C 632 168, 664 144, 700 130" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 6 -> 8 (0-9) -->
  <line x1="614" y1="210" x2="824" y2="210" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 7 -> 8 (0-9) -->
  <path d="M 738 132 C 768 150, 796 178, 830 196" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- 8 自环 (0-9) -->
  <path d="M 842 184 C 835 148, 875 148, 868 184" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 连线文字标签 -->
  <text x="116" y="140" class="edge-t" fill="#854F0B" dominant-baseline="central">+ / -</text>
  <text x="185" y="202" class="edge-t" fill="#185FA5" dominant-baseline="central">0–9</text>
  <text x="116" y="280" class="edge-t" fill="#534AB7" dominant-baseline="central">.</text>

  <text x="256" y="162" class="edge-t" fill="#185FA5" dominant-baseline="central">0–9</text>
  <text x="180" y="210" class="edge-t" fill="#534AB7" dominant-baseline="central">.</text>

  <text x="306" y="138" class="edge-t" fill="#185FA5" dominant-baseline="central">0–9</text>
  <text x="382" y="152" class="edge-t" fill="#534AB7" dominant-baseline="central">.</text>
  <text x="450" y="202" class="edge-t" fill="#854F0B" dominant-baseline="central">e / E</text>

  <text x="318" y="292" class="edge-t" fill="#185FA5" dominant-baseline="central">0–9</text>

  <text x="432" y="210" class="edge-t" fill="#185FA5" dominant-baseline="central">0–9</text>
  <text x="522" y="152" class="edge-t" fill="#854F0B" dominant-baseline="central">e / E</text>

  <text x="444" y="374" class="edge-t" fill="#185FA5" dominant-baseline="central">0–9</text>
  <text x="522" y="266" class="edge-t" fill="#854F0B" dominant-baseline="central">e / E</text>

  <text x="660" y="152" class="edge-t" fill="#854F0B" dominant-baseline="central">+ / -</text>
  <text x="720" y="202" class="edge-t" fill="#185FA5" dominant-baseline="central">0–9</text>
  <text x="796" y="152" class="edge-t" fill="#185FA5" dominant-baseline="central">0–9</text>
  <text x="856" y="138" class="edge-t" fill="#185FA5" dominant-baseline="central">0–9</text>

  <!-- 节点组 (Nodes) -->
  <!-- 0: 初始 -->
  <circle cx="68" cy="210" r="26" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="68" y="204" class="node-num" fill="#444441" dominant-baseline="central">0</text>
  <text x="68" y="222" class="node-desc" fill="#5F5E5A" dominant-baseline="central">初始</text>

  <!-- 1: 底数符号 -->
  <circle cx="190" cy="118" r="26" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="190" y="112" class="node-num" fill="#444441" dominant-baseline="central">1</text>
  <text x="190" y="130" class="node-desc" fill="#5F5E5A" dominant-baseline="central">符号</text>

  <!-- 2: 底数整数 [接受] -->
  <circle cx="306" cy="210" r="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <circle cx="306" cy="210" r="22" fill="none" stroke="#0F6E56" stroke-width="1"/>
  <text x="306" y="204" class="node-num" fill="#085041" dominant-baseline="central">2</text>
  <text x="306" y="222" class="node-desc" fill="#085041" dominant-baseline="central">整数</text>

  <!-- 3: 小数点(前无整数) -->
  <circle cx="190" cy="300" r="26" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="190" y="294" class="node-num" fill="#444441" dominant-baseline="central">3</text>
  <text x="190" y="312" class="node-desc" fill="#5F5E5A" dominant-baseline="central">无前点</text>

  <!-- 5: 小数点(前有整数) [接受] -->
  <circle cx="444" cy="118" r="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <circle cx="444" cy="118" r="22" fill="none" stroke="#0F6E56" stroke-width="1"/>
  <text x="444" y="112" class="node-num" fill="#085041" dominant-baseline="central">5</text>
  <text x="444" y="130" class="node-desc" fill="#085041" dominant-baseline="central">有前点</text>

  <!-- 4: 小数部分 [接受] -->
  <circle cx="444" cy="300" r="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <circle cx="444" cy="300" r="22" fill="none" stroke="#0F6E56" stroke-width="1"/>
  <text x="444" y="294" class="node-num" fill="#085041" dominant-baseline="central">4</text>
  <text x="444" y="312" class="node-desc" fill="#085041" dominant-baseline="central">小数</text>

  <!-- 6: 指数符号 -->
  <circle cx="586" cy="210" r="26" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="586" y="204" class="node-num" fill="#444441" dominant-baseline="central">6</text>
  <text x="586" y="222" class="node-desc" fill="#5F5E5A" dominant-baseline="central">指数</text>

  <!-- 7: 指数符号位 -->
  <circle cx="720" cy="118" r="26" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="720" y="112" class="node-num" fill="#444441" dominant-baseline="central">7</text>
  <text x="720" y="130" class="node-desc" fill="#5F5E5A" dominant-baseline="central">阶符</text>

  <!-- 8: 指数部分数字 [接受] -->
  <circle cx="854" cy="210" r="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <circle cx="854" cy="210" r="22" fill="none" stroke="#0F6E56" stroke-width="1"/>
  <text x="854" y="204" class="node-num" fill="#085041" dominant-baseline="central">8</text>
  <text x="854" y="222" class="node-desc" fill="#085041" dominant-baseline="central">阶数</text>

  <!-- 底部两块卡片 -->
  <rect x="40" y="415" width="410" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="56" y="433" class="card-h" fill="#0C447C" dominant-baseline="central">典型接受路径</text>
  <text x="56" y="457" class="card-c" fill="#085041" dominant-baseline="central">3. (0-2-5) · -.9 (0-1-3-4) · 2e10 (0-2-6-8)</text>

  <rect x="510" y="415" width="410" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="526" y="433" class="card-h" fill="#633806" dominant-baseline="central">典型拒绝路径</text>
  <text x="526" y="457" class="card-c" fill="#854F0B" dominant-baseline="central">. (停在3) · 1e (停在6) · 99e2.5 (指数含点)</text>
</svg>