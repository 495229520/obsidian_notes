<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 630" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>ARP 报文格式与请求应答的字段填法对照</title>
  <desc>上半部分按字节顺序画出 ARP 报文的九个字段共 28 字节，标出前八字节固定描述地址类型、后二十字节分成发送方与目标两组；下半部分用表格对照 ARP 请求与 ARP 应答在帧头和各字段上的差异。</desc>

  <rect x="0" y="0" width="1240" height="630" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">ARP 报文 28 字节：请求和应答只差几个字段</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">前 8 字节说清「解析什么到什么」，后 20 字节分成发送方和目标两组地址</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="102" width="1144" height="190" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 九个字段，宽度未按字节比例</text>

  <rect x="92" y="150" width="108" height="56" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="146" y="174" font-size="12" fill="#4A473F" text-anchor="middle">HTYPE</text>
  <text x="146" y="193" font-size="11" fill="#6B675C" text-anchor="middle">2 · 恒为 1</text>

  <rect x="200" y="150" width="108" height="56" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="254" y="174" font-size="12" fill="#4A473F" text-anchor="middle">PTYPE</text>
  <text x="254" y="193" font-size="11" fill="#6B675C" text-anchor="middle">2 · 0x0800</text>

  <rect x="308" y="150" width="74" height="56" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="345" y="174" font-size="12" fill="#4A473F" text-anchor="middle">HLEN</text>
  <text x="345" y="193" font-size="11" fill="#6B675C" text-anchor="middle">1 · 6</text>

  <rect x="382" y="150" width="74" height="56" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="419" y="174" font-size="12" fill="#4A473F" text-anchor="middle">PLEN</text>
  <text x="419" y="193" font-size="11" fill="#6B675C" text-anchor="middle">1 · 4</text>

  <rect x="456" y="150" width="108" height="56" rx="4" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="510" y="174" font-size="12" fill="#6B4E28" text-anchor="middle">OPER</text>
  <text x="510" y="193" font-size="11" fill="#6B4E28" text-anchor="middle">2 · 1 或 2</text>

  <rect x="564" y="150" width="158" height="56" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="643" y="174" font-size="12.5" fill="#2C4460" text-anchor="middle">发送方 MAC</text>
  <text x="643" y="193" font-size="11" fill="#2C4460" text-anchor="middle">SHA · 6 字节</text>

  <rect x="722" y="150" width="136" height="56" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="790" y="174" font-size="12.5" fill="#2C4460" text-anchor="middle">发送方 IPv4</text>
  <text x="790" y="193" font-size="11" fill="#2C4460" text-anchor="middle">SPA · 4 字节</text>

  <rect x="858" y="150" width="158" height="56" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="937" y="174" font-size="12.5" fill="#24473F" text-anchor="middle">目标 MAC</text>
  <text x="937" y="193" font-size="11" fill="#24473F" text-anchor="middle">THA · 6 字节</text>

  <rect x="1016" y="150" width="136" height="56" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1084" y="174" font-size="12.5" fill="#24473F" text-anchor="middle">目标 IPv4</text>
  <text x="1084" y="193" font-size="11" fill="#24473F" text-anchor="middle">TPA · 4 字节</text>

  <path d="M92,224 L92,230 L564,230 L564,224" fill="none" stroke="#9B968A" stroke-width="1.3"/>
  <text x="328" y="250" font-size="12" fill="#4A473F" text-anchor="middle">固定描述「IPv4 over Ethernet」，实现里基本不用看</text>

  <path d="M564,224 L564,230 L858,230 L858,224" fill="none" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="711" y="250" font-size="12" fill="#2C4460" text-anchor="middle">发送方：我是谁</text>

  <path d="M858,224 L858,230 L1152,230 L1152,224" fill="none" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1005" y="250" font-size="12" fill="#24473F" text-anchor="middle">目标：我要问谁</text>

  <text x="92" y="278" font-size="11.5" fill="#6B675C">请求里 THA 全 0，因为要问的就是它；应答把它填上，报文其余部分几乎原样返回</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="310" width="1144" height="270" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="338" font-size="15" font-weight="700" fill="#4A473F">B · A（10.0.0.10 · aa:aa）问 B（10.0.0.20 · bb:bb）时，两个报文各填什么</text>

  <text x="72" y="368" font-size="11" font-weight="700" fill="#6B675C">字段</text>
  <text x="420" y="368" font-size="11" font-weight="700" fill="#8A6A3A">ARP Request（OPER = 1）</text>
  <text x="800" y="368" font-size="11" font-weight="700" fill="#2F6B5E">ARP Reply（OPER = 2）</text>
  <line x1="72" y1="376" x2="1168" y2="376" stroke="#D8D5C8" stroke-width="1"/>

  <text x="72" y="404" font-size="11.5" fill="#2B2A26">Ethernet 目的 MAC</text>
  <text x="420" y="404" font-size="11.5" fill="#4A473F">ff:ff:ff:ff:ff:ff（广播）</text>
  <text x="800" y="404" font-size="11.5" fill="#4A473F">aa:aa（单播回给 A）</text>

  <text x="72" y="434" font-size="11.5" fill="#2B2A26">Ethernet EtherType</text>
  <text x="420" y="434" font-size="11.5" fill="#4A473F">0x0806</text>
  <text x="800" y="434" font-size="11.5" fill="#4A473F">0x0806</text>

  <text x="72" y="464" font-size="11.5" fill="#2B2A26">SHA / SPA</text>
  <text x="420" y="464" font-size="11.5" fill="#4A473F">aa:aa / 10.0.0.10</text>
  <text x="800" y="464" font-size="11.5" fill="#4A473F">bb:bb / 10.0.0.20</text>

  <text x="72" y="494" font-size="11.5" fill="#2B2A26">THA</text>
  <text x="420" y="494" font-size="11.5" fill="#4A473F">00:00:00:00:00:00</text>
  <text x="800" y="494" font-size="11.5" fill="#4A473F">aa:aa</text>

  <text x="72" y="524" font-size="11.5" fill="#2B2A26">TPA</text>
  <text x="420" y="524" font-size="11.5" fill="#4A473F">10.0.0.20</text>
  <text x="800" y="524" font-size="11.5" fill="#4A473F">10.0.0.10</text>

  <text x="72" y="556" font-size="11.5" fill="#2B2A26">谁会收到</text>
  <text x="420" y="556" font-size="11.5" fill="#733428">本链路所有主机，只有 B 应答</text>
  <text x="800" y="556" font-size="11.5" fill="#733428">只有 A</text>

  <text x="48" y="606" font-size="11.5" fill="#6B675C">帧长口径：14 + 28 = 42 字节，不到 60，链路层要补 18 个 0 才凑够最小帧长</text>
</svg>
