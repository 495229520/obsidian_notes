<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>同窗对齐：把反馈、暂停和业务进展放在一起</title>
<desc>示意曲线，不是实测；低分辨率采样只能支持相关性，不能证明微秒级先后。</desc>
<defs>
<marker id="8_4_4_24_2-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="8_4_4_24_2-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="8_4_4_24_2-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="8_4_4_24_2-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="45" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">同窗对齐：把反馈、暂停和业务进展放在一起</text>
<text x="48" y="74" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">示意曲线，不是实测；低分辨率采样只能支持相关性，不能证明微秒级先后。</text>
<text x="48" y="112" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 同一时间窗内观察四条信号</text>
<rect x="48" y="129" width="720" height="320" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<rect x="322" y="151" width="166" height="264" rx="0" fill="#F3E8D3" stroke="#F3E8D3" stroke-width="1.3" />
<text x="65" y="179" font-size="14" font-weight="700" fill="#B07D2B" text-anchor="start" data-role="body">出口队列</text>
<line x1="182" y1="198" x2="738" y2="198" stroke="#D8D5C8" stroke-width="1"/>
<polyline points="182,194 270,194 323,182 360,161 427,161 488,184 540,194 737,194" fill="none" stroke="#B07D2B" stroke-width="2.2" stroke-linejoin="round"/>
<text x="65" y="249" font-size="14" font-weight="700" fill="#3D5A80" text-anchor="start" data-role="body">CE / CNP</text>
<line x1="182" y1="268" x2="738" y2="268" stroke="#D8D5C8" stroke-width="1"/>
<polyline points="182,265 310,265 340,242 370,250 400,236 438,250 477,252 518,265 737,265" fill="none" stroke="#3D5A80" stroke-width="2.2" stroke-linejoin="round"/>
<text x="65" y="319" font-size="14" font-weight="700" fill="#A64B3C" text-anchor="start" data-role="body">RX pause</text>
<line x1="182" y1="338" x2="738" y2="338" stroke="#D8D5C8" stroke-width="1"/>
<polyline points="182,336 349,336 349,303 385,303 385,336 412,336 412,305 460,305 460,336 737,336" fill="none" stroke="#A64B3C" stroke-width="2.2" stroke-linejoin="round"/>
<text x="65" y="389" font-size="14" font-weight="700" fill="#2F6B5E" text-anchor="start" data-role="body">业务 p99</text>
<line x1="182" y1="408" x2="738" y2="408" stroke="#D8D5C8" stroke-width="1"/>
<polyline points="182,408 333,408 367,371 388,393 424,375 457,391 499,408 737,408" fill="none" stroke="#2F6B5E" stroke-width="2.2" stroke-linejoin="round"/>
<text x="325" y="438" font-size="12" font-weight="400" fill="#6B4E28" text-anchor="start" data-role="body">故障观察窗口</text>
<text x="680" y="438" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">时间 →</text>
<text x="805" y="112" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 看组合，不看单一阈值</text>
<rect x="800" y="130" width="169" height="43" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="812" y="156.5" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">观测组合</text>
<rect x="969" y="130" width="223" height="43" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="981" y="156.5" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">优先验证</text>
<rect x="800" y="173" width="169" height="43" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="812" y="199.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">CE ↑ / 有进展</text>
<rect x="969" y="173" width="223" height="43" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="981" y="199.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">正常拥塞反馈</text>
<rect x="800" y="216" width="169" height="43" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="812" y="242.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">暂停长 / 少进展</text>
<rect x="969" y="216" width="223" height="43" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="981" y="242.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">持续 PFC 阻塞</text>
<rect x="800" y="259" width="169" height="43" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="812" y="285.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">CE ↑ / RP 无变化</text>
<rect x="969" y="259" width="223" height="43" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="981" y="285.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">反馈路径或口径</text>
<rect x="800" y="302" width="169" height="43" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="812" y="328.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">CRC ↑ / retry ↑</text>
<rect x="969" y="302" width="223" height="43" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="981" y="328.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">物理链路问题</text>
<rect x="800" y="345" width="169" height="43" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="812" y="371.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">PCIe stall ↑</text>
<rect x="969" y="345" width="223" height="43" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="981" y="371.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">接收端吸收瓶颈</text>
<rect x="800" y="388" width="169" height="43" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="812" y="414.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">RNR ↑ / RQ 缺</text>
<rect x="969" y="388" width="223" height="43" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="981" y="414.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">接收资源不足</text>
<text x="48" y="491" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">C · 先确认指标类型，再做运算</text>
<rect x="48" y="513" width="350" height="100" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="223.0" y="546.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Counter · 累计量</text>
<text x="223.0" y="568.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">ΔC / 实际 Δt</text>
<text x="223.0" y="590.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">重置 / 回绕窗口作废</text>
<rect x="444" y="513" width="350" height="100" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="619.0" y="546.0" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">Gauge · 当前或周期值</text>
<text x="619.0" y="568.0" font-size="14" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">队列当前占用 / PCIe %</text>
<text x="619.0" y="590.0" font-size="14" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">不要再次计算累计增量</text>
<rect x="840" y="513" width="352" height="100" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="1016.0" y="546.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">Watermark · 历史峰值</text>
<text x="1016.0" y="568.0" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">先核对保留 / 清零范围</text>
<text x="1016.0" y="590.0" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">峰值不一定属于此窗口</text>
<text x="48" y="670" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">RX pause 占比 = Δ停发微秒 / (10⁶ × Δt 秒)；不同优先级不能简单求和当成整端口停发。</text>
</svg>