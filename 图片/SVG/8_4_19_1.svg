<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">先收口故障，再划定影响范围</title>
  <desc id="desc">不同通道没有天然的全局因果顺序；记录 first_observed_fault，而不是猜唯一根因。。图中预算、序号与布局均为教学示意，不是实测结果。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="bluearr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3" />
  <text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">先收口故障，再划定影响范围</text>
  <text x="48" y="79" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">不同通道没有天然的全局因果顺序；记录 first_observed_fault，而不是猜唯一根因。</text>
  <line x1="48" y1="98" x2="1192" y2="98" stroke="#D8D5C8" stroke-width="1" />
  <text x="1192" y="658" font-size="12" fill="#8B8679" font-weight="400" text-anchor="end">8 · 4 · 19 · 1</text>
  <rect x="49" y="126" width="299" height="82" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="198.5" y="160.0" font-size="14" fill="#514573" font-weight="700" text-anchor="middle">CQ</text>
  <text x="198.5" y="184.0" font-size="14" fill="#514573" font-weight="400" text-anchor="middle">工作完成 / poll 错误</text>
  <polyline points="352,167 405,167 405,330 451,330" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="49" y="234" width="299" height="82" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
  <text x="198.5" y="268.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">Async</text>
  <text x="198.5" y="292.0" font-size="14" fill="#733428" font-weight="400" text-anchor="middle">QP / CQ / 设备事件</text>
  <polyline points="352,275 405,275 405,330 451,330" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="49" y="342" width="299" height="82" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="198.5" y="376.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">CM</text>
  <text x="198.5" y="400.0" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">连接 / 路径相关事件</text>
  <polyline points="352,383 405,383 405,330 451,330" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="49" y="450" width="299" height="82" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="198.5" y="484.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">Watchdog</text>
  <text x="198.5" y="508.0" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle">deadline / 进度停顿</text>
  <polyline points="352,491 405,491 405,330 451,330" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="455" y="244" width="303" height="172" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="606.5" y="299.0" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">生命周期 Owner</text>
  <text x="606.5" y="323.0" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">FaultSnapshot(g)</text>
  <text x="606.5" y="347.0" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">同一 episode 只恢复一次</text>
  <text x="606.5" y="371.0" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">保留后续关联证据</text>
  <polyline points="762,330 795,330 795,175 827,175" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <polyline points="762,330 827,330" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <polyline points="762,330 795,330 795,501 827,501" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="831" y="122" width="360" height="103" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="847" y="149" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">QP 故障域</text>
  <rect x="852" y="163" width="103" height="41" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
  <text x="903.5" y="188.5" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">QP X</text>
  <text x="973" y="189" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">其他连接继续服务</text>
  <rect x="831" y="257" width="360" height="153" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="847" y="284" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">CQ 故障域</text>
  <rect x="851" y="301" width="319" height="40" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
  <text x="1010.5" y="326.0" font-size="13" fill="#733428" font-weight="700" text-anchor="middle">CQ_ERR：完成不再保证可取全</text>
  <rect x="852" y="355" width="102" height="35" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="903.0" y="377.5" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="middle">QP 0</text>
  <rect x="961" y="355" width="102" height="35" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="1012.0" y="377.5" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="middle">QP 1</text>
  <rect x="1070" y="355" width="102" height="35" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="1121.0" y="377.5" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="middle">QP 2</text>
  <rect x="831" y="442" width="360" height="140" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="847" y="469" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">设备 / context 故障域</text>
  <text x="850" y="498" font-size="15" fill="#733428" font-weight="700" text-anchor="start">QP + CQ + MR 重新评估</text>
  <text x="850" y="537" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">可能升级到设备或进程级恢复</text>
  <rect x="48" y="612" width="1144" height="47" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="66" y="641" font-size="14" fill="#4A473F" font-weight="700" text-anchor="start">事件寿命</text>
  <text x="142" y="641" font-size="14" fill="#4A473F" font-weight="400" text-anchor="start">复制必要数据并保留稳定句柄；get/ack 配对，关闭时不能先停掉 ack 服务。</text>
</svg>