<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">generation 过滤不等于硬件权限撤销</title>
  <desc id="desc">RNIC 不会读取业务 payload 中的 epoch 来替应用判断一次普通 RDMA WRITE 是否过期。。图中预算、序号与布局均为教学示意，不是实测结果。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="bluearr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3" />
  <text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">generation 过滤不等于硬件权限撤销</text>
  <text x="48" y="79" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">RNIC 不会读取业务 payload 中的 epoch 来替应用判断一次普通 RDMA WRITE 是否过期。</text>
  <line x1="48" y1="98" x2="1192" y2="98" stroke="#D8D5C8" stroke-width="1" />
  <text x="1192" y="658" font-size="12" fill="#8B8679" font-weight="400" text-anchor="end">8 · 4 · 19 · 4</text>
  <rect x="48" y="119" width="1144" height="202" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="64" y="146" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">A · 反例：只换逻辑代际，旧 rkey 仍覆盖整个池</text>
  <rect x="69" y="194" width="234" height="82" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
  <text x="186.0" y="228.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">旧写者</text>
  <text x="186.0" y="252.0" font-size="14" fill="#733428" font-weight="400" text-anchor="middle">仍持有有效 rkey</text>
  <rect x="599" y="168" width="562" height="122" rx="5" fill="#FBFBF6" stroke="#A64B3C" stroke-width="2" />
  <text x="616" y="191" font-size="14" fill="#733428" font-weight="700" text-anchor="start">旧 MR 授权范围</text>
  <rect x="618" y="208" width="234" height="62" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="735.0" y="244.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">旧区域 g</text>
  <rect x="876" y="208" width="266" height="62" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="1009.0" y="244.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">新逻辑区域 g+1</text>
  <polyline points="307,235 514,235 514,299 1012,299 1012,274" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#redarr)" />
  <text x="330" y="220" font-size="14" fill="#733428" font-weight="700" text-anchor="start">应用换 epoch</text>
  <text x="329" y="252" font-size="13" fill="#733428" font-weight="400" text-anchor="start">并未缩小旧授权</text>
  <rect x="48" y="344" width="1144" height="239" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="64" y="371" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">B · 可验证隔离：撤销旧能力，或新旧授权范围真正分离</text>
  <rect x="69" y="422" width="234" height="73" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="186.0" y="451.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">旧写者</text>
  <text x="186.0" y="475.5" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle">旧能力只能到旧区</text>
  <rect x="430" y="414" width="279" height="103" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="569.5" y="458.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">旧区域 / 旧 MR</text>
  <text x="569.5" y="482.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">保留到访问边界终止</text>
  <polyline points="307,459 426,459" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#redarr)" />
  <rect x="794" y="408" width="371" height="117" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="2" />
  <text x="979" y="443" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle">新区域 / 独立授权</text>
  <text x="979" y="478" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">新 session + 区域代际 + 权限</text>
  <text x="979" y="508" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">只向已验证的新会话发布</text>
  <line x1="748" y1="407" x2="748" y2="526" stroke="#A64B3C" stroke-width="2.2" stroke-dasharray="6 5" />
  <text x="748" y="553" font-size="13" fill="#733428" font-weight="700" text-anchor="middle">授权边界</text>
  <rect x="48" y="612" width="1144" height="47" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="66" y="641" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="start">范围检查</text>
  <text x="142" y="641" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="start">新 offset 若仍在旧 MR 的授权范围内，就没有建立真正的远端写入隔离。</text>
</svg>