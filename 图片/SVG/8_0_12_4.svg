<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">电源策略：减少唤醒毛刺，也要守住热稳态</title><desc id="desc">左边展示请求到达后退出 idle 和处理，右边是定性的持续性能变化曲线；下方把 PM QoS 与 governor 的职责分开。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">电源策略：减少唤醒毛刺，也要守住热稳态</text>
<text x="48" y="77" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">C-State 管空闲退出；P-State / CPUFreq 管运行性能，两者都不是端到端延迟承诺。</text>
<rect x="40" y="107" width="566" height="339" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="135" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · C-State：空闲后的第一批请求</text>
<text x="73" y="175" font-size="14" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">请求到达</text>
<line x1="200" y1="160" x2="200" y2="206" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#red)"/>
<rect x="70" y="216" width="126" height="54" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="133.0" y="248.0" font-size="15" font-weight="600" fill="#4A473F" text-anchor="middle" data-role="body">空闲</text>
<rect x="199" y="216" width="153" height="54" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="275.5" y="248.0" font-size="15" font-weight="600" fill="#6B4E28" text-anchor="middle" data-role="body">idle exit</text>
<rect x="355" y="216" width="212" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="461.0" y="248.0" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">请求处理</text>
<line x1="200" y1="290" x2="352" y2="290" stroke="#8A6A3A" stroke-width="2"/>
<line x1="200" y1="282" x2="200" y2="298" stroke="#8A6A3A" stroke-width="1.6"/>
<line x1="352" y1="282" x2="352" y2="298" stroke="#8A6A3A" stroke-width="1.6"/>
<text x="276" y="320" font-size="14" font-weight="600" fill="#6B4E28" text-anchor="middle" data-role="body">退出延迟</text>
<text x="75" y="365" font-size="14" font-weight="400" fill="#24473F" text-anchor="start" data-role="body">深度限制：更快退出的候选方案</text>
<text x="75" y="397" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">持续 busy poll：先确认是否真的进 idle</text>
<rect x="633" y="107" width="567" height="339" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="651" y="135" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 运行性能：不要只测冷机瞬间</text>
<line x1="699" y1="368" x2="1151" y2="368" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="699" y1="368" x2="699" y2="180" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="711" y="177" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">有效服务能力</text>
<text x="1072" y="397" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">持续负载</text>
<path d="M 716,228 L 784,224 L 850,228 L 910,263 L 980,292 L 1048,297 L 1137,298" fill="none" stroke="#A64B3C" stroke-width="3" stroke-linejoin="round"/>
<line x1="910" y1="192" x2="910" y2="363" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 4"/>
<text x="740" y="210" font-size="13" font-weight="400" fill="#24473F" text-anchor="start" data-role="body">短时提升</text>
<text x="934" y="220" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">热 / 功率约束</text>
<text x="948" y="329" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">可能改变稳态性能</text>
<text x="702" y="421" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">定性示意：不是所有平台都会出现此曲线</text>
<rect x="43" y="478" width="362" height="64" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="224.0" y="507.0" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">PM QoS</text>
<text x="224.0" y="529.0" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">fd 持有期间提出 idle latency 约束</text>
<rect x="439" y="478" width="362" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="620.0" y="507.0" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Governor / Driver</text>
<text x="620.0" y="529.0" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">请求策略 ≠ 实时固定 GHz</text>
<rect x="835" y="478" width="362" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1016.0" y="507.0" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">验收证据</text>
<text x="1016.0" y="529.0" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">尾延迟 + 温度 + 功耗 + 吞吐</text>
<text x="63" y="583" font-size="14" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">只改一个策略，测量从空闲到突发、再到热稳定后的完整负载阶段。</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="642" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">/dev/cpu_dma_latency 是 CPU 空闲延迟 QoS 接口，不是设置 PCIe DMA 的传输时间。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">真实 idle state、policy 范围与频率行为依硬件、驱动、固件与约束而定；本图不提供通用阈值。</text>
</svg>