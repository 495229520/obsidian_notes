<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#202124">register blocking：1 个线程的 4×4 micro-tile 外积</text>
  <text x="450" y="52" text-anchor="middle" font-size="12.5" fill="#5f6368">内层每个 kk：读 4 个 A + 4 个 B（8 次 shared load）→ 做 16 次 FMA（计算/访存 = 2:1）</text>

  <!-- regB 横向向量（来自 Bs[kk]） -->
  <text x="500" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#137333">regB[j] = Bs[kk][col_in_block + j]   (一行 B)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="340" y="104" width="80" height="46" rx="5" fill="#e6f4ea" stroke="#34a853"/><text x="380" y="132" fill="#137333">regB[0]</text>
    <rect x="420" y="104" width="80" height="46" rx="5" fill="#e6f4ea" stroke="#34a853"/><text x="460" y="132" fill="#137333">regB[1]</text>
    <rect x="500" y="104" width="80" height="46" rx="5" fill="#e6f4ea" stroke="#34a853"/><text x="540" y="132" fill="#137333">regB[2]</text>
    <rect x="580" y="104" width="80" height="46" rx="5" fill="#e6f4ea" stroke="#34a853"/><text x="620" y="132" fill="#137333">regB[3]</text>
  </g>

  <!-- regA 纵向向量（来自 As[kk]） -->
  <g font-size="13" text-anchor="middle">
    <rect x="170" y="174" width="80" height="64" rx="5" fill="#fce8e6" stroke="#ea4335"/><text x="210" y="210" fill="#c5221f">regA[0]</text>
    <rect x="170" y="238" width="80" height="64" rx="5" fill="#fce8e6" stroke="#ea4335"/><text x="210" y="274" fill="#c5221f">regA[1]</text>
    <rect x="170" y="302" width="80" height="64" rx="5" fill="#fce8e6" stroke="#ea4335"/><text x="210" y="338" fill="#c5221f">regA[2]</text>
    <rect x="170" y="366" width="80" height="64" rx="5" fill="#fce8e6" stroke="#ea4335"/><text x="210" y="402" fill="#c5221f">regA[3]</text>
  </g>
  <text x="120" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c5221f" transform="rotate(-90 120 306)">regA[i] = As[kk][row_in_block + i]   (一列 A)</text>

  <!-- acc[4][4] 网格 -->
  <g font-size="11.5" text-anchor="middle">
    <!-- 行 0 -->
    <rect x="340" y="174" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="380" y="200" fill="#5f4200">acc[0][0]</text><text x="380" y="220" fill="#b06000" font-size="10">A0·B0</text>
    <rect x="420" y="174" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="460" y="200" fill="#5f4200">acc[0][1]</text><text x="460" y="220" fill="#b06000" font-size="10">A0·B1</text>
    <rect x="500" y="174" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="540" y="200" fill="#5f4200">acc[0][2]</text><text x="540" y="220" fill="#b06000" font-size="10">A0·B2</text>
    <rect x="580" y="174" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="620" y="200" fill="#5f4200">acc[0][3]</text><text x="620" y="220" fill="#b06000" font-size="10">A0·B3</text>
    <!-- 行 1 -->
    <rect x="340" y="238" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="380" y="264" fill="#5f4200">acc[1][0]</text><text x="380" y="284" fill="#b06000" font-size="10">A1·B0</text>
    <rect x="420" y="238" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="460" y="264" fill="#5f4200">acc[1][1]</text><text x="460" y="284" fill="#b06000" font-size="10">A1·B1</text>
    <rect x="500" y="238" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="540" y="264" fill="#5f4200">acc[1][2]</text><text x="540" y="284" fill="#b06000" font-size="10">A1·B2</text>
    <rect x="580" y="238" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="620" y="264" fill="#5f4200">acc[1][3]</text><text x="620" y="284" fill="#b06000" font-size="10">A1·B3</text>
    <!-- 行 2 -->
    <rect x="340" y="302" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="380" y="328" fill="#5f4200">acc[2][0]</text><text x="380" y="348" fill="#b06000" font-size="10">A2·B0</text>
    <rect x="420" y="302" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="460" y="328" fill="#5f4200">acc[2][1]</text><text x="460" y="348" fill="#b06000" font-size="10">A2·B1</text>
    <rect x="500" y="302" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="540" y="328" fill="#5f4200">acc[2][2]</text><text x="540" y="348" fill="#b06000" font-size="10">A2·B2</text>
    <rect x="580" y="302" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="620" y="328" fill="#5f4200">acc[2][3]</text><text x="620" y="348" fill="#b06000" font-size="10">A2·B3</text>
    <!-- 行 3 -->
    <rect x="340" y="366" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="380" y="392" fill="#5f4200">acc[3][0]</text><text x="380" y="412" fill="#b06000" font-size="10">A3·B0</text>
    <rect x="420" y="366" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="460" y="392" fill="#5f4200">acc[3][1]</text><text x="460" y="412" fill="#b06000" font-size="10">A3·B1</text>
    <rect x="500" y="366" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="540" y="392" fill="#5f4200">acc[3][2]</text><text x="540" y="412" fill="#b06000" font-size="10">A3·B2</text>
    <rect x="580" y="366" width="80" height="64" fill="#fef7e0" stroke="#b06000"/><text x="620" y="392" fill="#5f4200">acc[3][3]</text><text x="620" y="412" fill="#b06000" font-size="10">A3·B3</text>
  </g>

  <!-- 投影虚线 -->
  <g stroke="#9aa0a6" stroke-width="1" stroke-dasharray="3 3">
    <line x1="380" y1="150" x2="380" y2="174"/>
    <line x1="250" y1="206" x2="340" y2="206"/>
  </g>

  <!-- 说明 -->
  <text x="450" y="470" text-anchor="middle" font-size="12.5" fill="#3c4043">acc[i][j] += regA[i] · regB[j]   —— 每个 regA/regB 值在 4 次乘加里被复用，shared 带宽不再是瓶颈</text>
  <text x="450" y="494" text-anchor="middle" font-size="12.5" fill="#3c4043">代价：累加器 + 临时寄存器占用增多 → reg/thread ↑ (64) → occupancy ↓ (92%)，复用收益与 occupancy 之间存在平衡点</text>
</svg>
