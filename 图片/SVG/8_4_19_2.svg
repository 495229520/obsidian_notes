<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">两本账，不同答案：能否回收？是否执行？</title>
  <desc id="desc">资源退休由访问终结证据决定；业务结果由操作语义与远端提交协议决定。。图中预算、序号与布局均为教学示意，不是实测结果。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="bluearr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3" />
  <text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">两本账，不同答案：能否回收？是否执行？</text>
  <text x="48" y="79" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">资源退休由访问终结证据决定；业务结果由操作语义与远端提交协议决定。</text>
  <line x1="48" y1="98" x2="1192" y2="98" stroke="#D8D5C8" stroke-width="1" />
  <text x="1192" y="658" font-size="12" fill="#8B8679" font-weight="400" text-anchor="end">8 · 4 · 19 · 2</text>
  <text x="67" y="132" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">观察到的证据</text>
  <text x="539" y="132" font-size="15" fill="#24473F" font-weight="700" text-anchor="start">本地资源账本</text>
  <text x="906" y="132" font-size="15" fill="#2C4460" font-weight="700" text-anchor="start">业务结果账本</text>
  <rect x="66" y="151" width="337" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="234.5" y="176.0" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle">NOT_ACCEPTED</text>
  <text x="234.5" y="200.0" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle">确定本次未接受</text>
  <polyline points="407,183 486,183" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="493" y="151" width="308" height="64" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="647" y="190" font-size="14" fill="#24473F" font-weight="500" text-anchor="middle">退还本次预留</text>
  <rect x="820" y="151" width="370" height="64" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="1005" y="190" font-size="14" fill="#2C4460" font-weight="500" text-anchor="middle">核对是否有其他 attempt</text>
  <rect x="78" y="231" width="337" height="64" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="246.5" y="256.0" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="middle">POSTING</text>
  <text x="246.5" y="280.0" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">post 返回尚未交接</text>
  <polyline points="419,263 486,263" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="493" y="231" width="308" height="64" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="647" y="270" font-size="14" fill="#24473F" font-weight="500" text-anchor="middle">保留记录与 lease</text>
  <rect x="820" y="231" width="370" height="64" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="1005" y="270" font-size="14" fill="#2C4460" font-weight="500" text-anchor="middle">不猜接受数量</text>
  <rect x="90" y="311" width="337" height="64" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
  <text x="258.5" y="336.0" font-size="13" fill="#733428" font-weight="700" text-anchor="middle">ACCEPTED / UNKNOWN</text>
  <text x="258.5" y="360.0" font-size="13" fill="#733428" font-weight="400" text-anchor="middle">缺少终结证据</text>
  <polyline points="431,343 486,343" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="493" y="311" width="308" height="64" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="647" y="350" font-size="14" fill="#24473F" font-weight="500" text-anchor="middle">继续持有设备借用</text>
  <rect x="820" y="311" width="370" height="64" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="1005" y="350" font-size="14" fill="#2C4460" font-weight="500" text-anchor="middle">可能有副作用</text>
  <rect x="102" y="391" width="337" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="270.5" y="416.0" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle">LOCAL_DONE</text>
  <text x="270.5" y="440.0" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">本地完成证据成立</text>
  <polyline points="443,423 486,423" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="493" y="391" width="308" height="64" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="647" y="430" font-size="14" fill="#24473F" font-weight="500" text-anchor="middle">设备借用可结束</text>
  <rect x="820" y="391" width="370" height="64" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="1005" y="430" font-size="14" fill="#2C4460" font-weight="500" text-anchor="middle">不等于远端业务提交</text>
  <rect x="114" y="471" width="337" height="64" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="282.5" y="496.0" font-size="13" fill="#514573" font-weight="700" text-anchor="middle">APP_COMMITTED</text>
  <text x="282.5" y="520.0" font-size="13" fill="#514573" font-weight="400" text-anchor="middle">有效业务提交回执</text>
  <polyline points="455,503 486,503" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="493" y="471" width="308" height="64" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="647" y="510" font-size="14" fill="#24473F" font-weight="500" text-anchor="middle">仍核对其他访问引用</text>
  <rect x="820" y="471" width="370" height="64" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="1005" y="510" font-size="14" fill="#2C4460" font-weight="500" text-anchor="middle">按协议返回已记录结果</text>
  <text x="67" y="588" font-size="15" fill="#733428" font-weight="700" text-anchor="start">调用者超时：等待可以结束，设备 lease 仍可能存在。</text>
  <rect x="48" y="612" width="1144" height="47" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="66" y="641" font-size="14" fill="#4A473F" font-weight="700" text-anchor="start">身份</text>
  <text x="114" y="641" font-size="14" fill="#4A473F" font-weight="400" text-anchor="start">business_id 跨重试不变；attempt/token 与连接 generation 区分每次真实提交。</text>
</svg>