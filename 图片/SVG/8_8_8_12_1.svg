<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<title>显存注册：先选择路径，再建立 MR</title>
<desc>同样叫 MR，背后的 exporter、映射与生命周期并不相同</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="660" fill="#F5F4ED"/>
<text x="48" y="49" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">显存注册：先选择路径，再建立 MR</text>
<text x="48" y="78" font-size="13" fill="#6B675C" text-anchor="start">同样叫 MR，背后的 exporter、映射与生命周期并不相同</text>
<rect x="48" y="111" width="1144" height="127" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="135" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700">A · 主机对照</text>
