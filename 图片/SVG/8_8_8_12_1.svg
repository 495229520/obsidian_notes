<text x="195.0" y="487.0" font-size="12" fill="#24473F" text-anchor="middle">支持导出 + page 对齐</text>
<rect x="360" y="441" width="230" height="62" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="475.0" y="467.0" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700">导出 DMA-BUF fd</text>
<text x="475.0" y="487.0" font-size="12" fill="#24473F" text-anchor="middle">本机 fd，不是远端地址</text>
<rect x="640" y="441" width="230" height="62" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="755.0" y="467.0" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700">ibv_reg_dmabuf_mr</text>
<text x="755.0" y="487.0" font-size="12" fill="#24473F" text-anchor="middle">offset / iova / length</text>
<rect x="920" y="441" width="230" height="62" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1035.0" y="467.0" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700">RNIC MR</text>
<text x="1035.0" y="487.0" font-size="12" fill="#24473F" text-anchor="middle">MR 先于 backing 释放</text>
