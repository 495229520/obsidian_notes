<text x="195.0" y="322.0" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">GPU allocation</text>
<text x="195.0" y="342.0" font-size="12" fill="#2C4460" text-anchor="middle">普通 device memory</text>
<rect x="360" y="296" width="230" height="62" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="475.0" y="322.0" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">ibv_reg_mr</text>
<text x="475.0" y="342.0" font-size="12" fill="#2C4460" text-anchor="middle">GPU VA · 条件成立时</text>
<rect x="640" y="296" width="230" height="62" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="755.0" y="322.0" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">peer-memory 映射</text>
<text x="755.0" y="342.0" font-size="12" fill="#2C4460" text-anchor="middle">GPU driver + RDMA 栈</text>
<rect x="920" y="296" width="230" height="62" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1035.0" y="322.0" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">RNIC MR</text>
<text x="1035.0" y="342.0" font-size="12" fill="#2C4460" text-anchor="middle">allocation 仍需保留</text>
