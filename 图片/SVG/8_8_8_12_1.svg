<text x="195.0" y="177.0" font-size="13" fill="#4A473F" text-anchor="middle" font-weight="700">pinned host buffer</text>
<text x="195.0" y="197.0" font-size="12" fill="#4A473F" text-anchor="middle">CPU VA</text>
<rect x="360" y="151" width="230" height="62" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="475.0" y="177.0" font-size="13" fill="#4A473F" text-anchor="middle" font-weight="700">ibv_reg_mr</text>
<text x="475.0" y="197.0" font-size="12" fill="#4A473F" text-anchor="middle">host pointer</text>
<rect x="640" y="151" width="230" height="62" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="755.0" y="177.0" font-size="13" fill="#4A473F" text-anchor="middle" font-weight="700">主机页映射</text>
<text x="755.0" y="197.0" font-size="12" fill="#4A473F" text-anchor="middle">DRAM</text>
<rect x="920" y="151" width="230" height="62" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1035.0" y="177.0" font-size="13" fill="#4A473F" text-anchor="middle" font-weight="700">RNIC MR</text>
<text x="1035.0" y="197.0" font-size="12" fill="#4A473F" text-anchor="middle">lkey / rkey</text>
