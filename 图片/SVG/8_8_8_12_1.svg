<text x="65" y="280" font-size="15" fill="#2C4460" text-anchor="start" font-weight="700">B · Peer-memory</text>
<rect x="48" y="401" width="1144" height="127" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="425" font-size="15" fill="#24473F" text-anchor="start" font-weight="700">C · DMA-BUF</text>
