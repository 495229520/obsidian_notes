<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect x="0" y="0" width="1200" height="620" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 19px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 14px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .amber { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .rose { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">gemm_profiling_report.md 的写作骨架</text>
  <text x="56" y="88" class="small">报告不是截图集合，而是一条从实验设置到 limitations 的可追溯叙事。</text>

  <rect x="70" y="135" width="210" height="100" class="card"/>
  <text x="98" y="173" class="label">Experiment setup</text>
  <text x="98" y="203" class="small">GPU / driver / CUDA</text>

  <path d="M290 185 H350" class="line"/>

  <rect x="365" y="135" width="210" height="100" class="blue"/>
  <text x="395" y="173" class="label">Benchmark matrix</text>
  <text x="395" y="203" class="small">shape / impl / dtype</text>

  <path d="M585 185 H645" class="line"/>

  <rect x="660" y="135" width="210" height="100" class="green"/>
  <text x="690" y="173" class="label">Raw data links</text>
  <text x="690" y="203" class="small">CSV / JSON / ncu</text>

  <path d="M880 185 H940" class="line"/>

  <rect x="955" y="135" width="175" height="100" class="amber"/>
  <text x="984" y="173" class="label">Summary</text>
  <text x="984" y="203" class="small">tables / charts</text>

  <rect x="120" y="320" width="260" height="120" class="blue"/>
  <text x="155" y="358" class="label">Finding</text>
  <text x="155" y="388" class="small">what changed?</text>
  <text x="155" y="415" class="small">which shape / dtype?</text>

  <path d="M390 380 H470" class="line"/>

  <rect x="490" y="320" width="260" height="120" class="green"/>
  <text x="525" y="358" class="label">Evidence</text>
  <text x="525" y="388" class="small">benchmark row</text>
  <text x="525" y="415" class="small">Nsight metric path</text>

  <path d="M760 380 H840" class="line"/>

  <rect x="860" y="320" width="260" height="120" class="rose"/>
  <text x="895" y="358" class="label">Limitation</text>
  <text x="895" y="388" class="small">what is not proven?</text>
  <text x="895" y="415" class="small">where not to extrapolate?</text>

  <text x="95" y="525" class="tiny">最低要求：至少 3 个 finding；每个 finding 都能回到 CSV / profiler / 环境记录；FP32 和 mixed precision 分组解释。</text>
</svg>
