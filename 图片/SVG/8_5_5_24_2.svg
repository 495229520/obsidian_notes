<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>写盘用 RDMA READ，读盘用 RDMA WRITE</title><desc>左右两个时序面板分别展示 out-of-capsule 写与普通读。明确 Target 发起方向和 Host 完成边界。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs><rect width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="47" font-size="22" fill="#2B2A26" font-weight="700">写盘用 RDMA READ，读盘用 RDMA WRITE</text>
<text x="48" y="77" font-size="14" fill="#6B675C">按依赖顺序阅读；纵向距离不是时间比例，示意不含故障重试</text>
<rect x="48" y="111" width="556" height="450" rx="7" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<text x="64" y="138" font-size="15" fill="#2B2A26" font-weight="700">A · NVMe Write（out-of-capsule）</text>
<rect x="63" y="153" width="74" height="33" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="100.0" y="174.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Host</text>
<line x1="100" y1="187" x2="100" y2="537" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="289" y="153" width="74" height="33" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="326.0" y="174.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Target</text>
<line x1="326" y1="187" x2="326" y2="537" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="515" y="153" width="74" height="33" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="552.0" y="174.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">SSD</text>
<line x1="552" y1="187" x2="552" y2="537" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="116" y="236" width="19" height="224" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="149" y="427" font-size="12" fill="#6B675C">等待完成</text>
<line x1="100" y1="208" x2="326" y2="208" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="159" y="200" font-size="13" fill="#2B2A26">① SEND 命令</text>
<line x1="326" y1="253" x2="100" y2="253" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="151" y="244" font-size="13" fill="#2B2A26">② RDMA READ 请求</text>
<line x1="100" y1="293" x2="326" y2="293" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="153" y="285" font-size="13" fill="#2B2A26">③ 数据 H → T</text>
<rect x="243" y="311" width="166" height="31" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="326.0" y="331.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">数据就绪</text>
<line x1="326" y1="366" x2="552" y2="366" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="371" y="357" font-size="13" fill="#2B2A26">④ bdev 写</text>
<line x1="552" y1="410" x2="326" y2="410" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="382" y="401" font-size="13" fill="#2B2A26">⑤ 后端完成</text>
<line x1="326" y1="455" x2="100" y2="455" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="156" y="445" font-size="13" fill="#2B2A26">响应 SEND</text>
<rect x="60" y="472" width="82" height="30" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="101.0" y="492.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Host 完成</text>
<text x="319" y="524" font-size="12" fill="#6B675C">本地发送完成 → 回收</text>
<rect x="636" y="111" width="556" height="450" rx="7" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<text x="652" y="138" font-size="15" fill="#2B2A26" font-weight="700">B · NVMe Read</text>
<rect x="651" y="153" width="74" height="33" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="688.0" y="174.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Host</text>
<line x1="688" y1="187" x2="688" y2="537" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="877" y="153" width="74" height="33" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="914.0" y="174.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Target</text>
<line x1="914" y1="187" x2="914" y2="537" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="1103" y="153" width="74" height="33" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1140.0" y="174.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">SSD</text>
<line x1="1140" y1="187" x2="1140" y2="537" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="704" y="236" width="19" height="224" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="737" y="427" font-size="12" fill="#6B675C">等待完成</text>
<line x1="688" y1="208" x2="914" y2="208" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="747" y="200" font-size="13" fill="#2B2A26">① SEND 命令</text>
<line x1="914" y1="253" x2="1140" y2="253" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="969" y="244" font-size="13" fill="#2B2A26">② bdev 读</text>
<line x1="1140" y1="293" x2="914" y2="293" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="937" y="285" font-size="13" fill="#2B2A26">③ 数据 DMA / 完成</text>
<rect x="831" y="311" width="166" height="31" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="914.0" y="331.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">数据就绪</text>
<line x1="914" y1="374" x2="688" y2="374" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="738" y="365" font-size="13" fill="#2B2A26">④ RDMA WRITE</text>
<text x="749" y="404" font-size="13" fill="#2C4460">数据 T → H</text>
<line x1="914" y1="455" x2="688" y2="455" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="744" y="445" font-size="13" fill="#2B2A26">响应 SEND</text>
<rect x="648" y="472" width="82" height="30" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="689.0" y="492.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Host 完成</text>
<text x="907" y="524" font-size="12" fill="#6B675C">本地发送完成 → 回收</text>
<rect x="48" y="583" width="556" height="39" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="64" y="608" font-size="13" fill="#6B4E28">小写可能携带 in-capsule data，省去单独拉取。</text>
<rect x="636" y="583" width="556" height="39" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="652" y="608" font-size="13" fill="#6B4E28">数据与响应有排序要求；数据到达 ≠ 应用完成。</text>
<line x1="48" y1="646" x2="1192" y2="646" stroke="#5A564B" stroke-width="1.6"/>
<text x="48" y="674" font-size="13" fill="#6B675C">持久化取决于设备缓存、FUA/Flush 与后端语义；Host 完成不等于 Target 对象已经回池。</text>
</svg>