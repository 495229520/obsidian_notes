<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">控制面与数据面：两条 SLA 完全不同的路径</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">数据面搬数据（μs 级、百万 QPS）；控制面定规则（ms~s 级、每秒几次）—— 谁也不该等谁</text>

  <!-- 控制面容器 -->
  <rect x="80" y="120" width="760" height="180" rx="10" fill="#E6EFEA" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="100" y="148" font-size="14" font-weight="700" fill="#24473F">控制面 · 决定谁在哪、怎么配、坏了怎么办</text>

  <rect x="100" y="168" width="230" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="215" y="194" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">API Server + etcd</text>
  <text x="215" y="214" font-size="10.5" fill="#24473F" text-anchor="middle">期望状态的唯一数据库</text>

  <rect x="350" y="168" width="230" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="465" y="194" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">Operator / 控制器</text>
  <text x="465" y="214" font-size="10.5" fill="#24473F" text-anchor="middle">收敛循环（10.2 / 10.3）</text>

  <rect x="600" y="168" width="220" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="710" y="194" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">CSI Controller</text>
  <text x="710" y="214" font-size="10.5" fill="#24473F" text-anchor="middle">建卷 · 扩容 · 摘除的决策</text>

  <text x="100" y="272" font-size="11" fill="#6B675C">变更类操作全在这层：挂载一个卷、扩一个副本、摘一个坏节点 —— 慢一点没关系，错了才要命</text>

  <!-- 通道 -->
  <line x1="300" y1="304" x2="300" y2="426" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrt)"/>
  <text x="312" y="346" font-size="12" font-weight="700" fill="#24473F">配置 / 意图下发</text>
  <text x="312" y="366" font-size="10.5" fill="#6B675C">低频：挂载、扩容、限流参数</text>
  <text x="312" y="384" font-size="10.5" fill="#6B675C">版本化 · 整体替换 · 原子切换</text>

  <line x1="620" y1="426" x2="620" y2="304" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrb)"/>
  <text x="634" y="346" font-size="12" font-weight="700" fill="#2C4460">状态 / 指标上报</text>
  <text x="634" y="366" font-size="10.5" fill="#6B675C">心跳 · 容量 · 延迟直方图</text>
  <text x="634" y="384" font-size="10.5" fill="#6B675C">控制面靠它做决策与告警</text>

  <!-- 数据面容器 -->
  <rect x="80" y="430" width="760" height="190" rx="10" fill="#EDF1F7" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="100" y="458" font-size="14" font-weight="700" fill="#2C4460">数据面 · IO 请求真正走的路（第 1–8 章的全部内容）</text>

  <rect x="100" y="482" width="210" height="64" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="205" y="508" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">应用 read / write</text>
  <text x="205" y="528" font-size="10.5" fill="#2C4460" text-anchor="middle">训练 DataLoader · 数据库</text>

  <rect x="350" y="482" width="210" height="64" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="455" y="508" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">内核 IO 栈（第1章）</text>
  <text x="455" y="528" font-size="10.5" fill="#2C4460" text-anchor="middle">页缓存 · 块层 · 驱动</text>

  <rect x="600" y="482" width="220" height="64" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="710" y="508" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">本地 / 远端设备</text>
  <text x="710" y="528" font-size="10.5" fill="#2C4460" text-anchor="middle">NVMe · NVMe-oF（第3–5章）</text>

  <line x1="314" y1="514" x2="346" y2="514" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="564" y1="514" x2="596" y2="514" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="100" y="592" font-size="11" fill="#6B675C">每秒百万次、微秒级返回：这条路上不允许出现控制面的任何组件 —— 不查 API、不等锁、不做决策</text>

  <!-- 右侧卡片 -->
  <rect x="880" y="120" width="312" height="200" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="900" y="148" font-size="13.5" font-weight="700" fill="#2B2A26">频率与延迟：差 5 个数量级</text>
  <text x="900" y="178" font-size="11.5" fill="#4A473F">数据面：延迟 μs · QPS 10⁵–10⁶</text>
  <text x="900" y="198" font-size="11.5" fill="#4A473F">失败 = 线上事故，立即可见</text>
  <text x="900" y="228" font-size="11.5" fill="#4A473F">控制面：延迟 ms–s · QPS 10⁰–10¹</text>
  <text x="900" y="248" font-size="11.5" fill="#4A473F">失败 = 暂时不能"变更"</text>
  <text x="900" y="284" font-size="11" fill="#6B675C">量级悬殊 → 两条路径必须解耦，</text>
  <text x="900" y="302" font-size="11" fill="#6B675C">否则慢的一方拖死快的一方</text>

  <rect x="880" y="344" width="312" height="170" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="900" y="372" font-size="13.5" font-weight="700" fill="#2B2A26">C++ 对应：热路径无锁</text>
  <text x="900" y="400" font-size="11.5" fill="#4A473F">数据面线程：atomic load 读配置快照</text>
  <text x="900" y="422" font-size="11.5" fill="#4A473F">控制面线程：构造新 Config 整体发布</text>
  <text x="900" y="444" font-size="11.5" fill="#4A473F">旧快照靠 shared_ptr 计数自然回收</text>
  <text x="900" y="472" font-size="11" fill="#6B675C">= RCU 式热更新（正文有最小实现）</text>
  <text x="900" y="492" font-size="11" fill="#6B675C">改配置永不加锁在读路径上</text>

  <rect x="880" y="536" width="312" height="140" rx="8" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="900" y="564" font-size="13.5" font-weight="700" fill="#733428">铁律：控制面故障 ≠ 数据面停摆</text>
  <text x="900" y="592" font-size="11.5" fill="#733428">已建立的 IO 路径必须继续工作，</text>
  <text x="900" y="612" font-size="11.5" fill="#733428">只是暂时不能做新的变更</text>
  <text x="900" y="640" font-size="11" fill="#733428">验证实验见正文：停 API Server，</text>
  <text x="900" y="658" font-size="11" fill="#733428">已挂载卷照常读写，新 PVC 卡 Pending</text>
</svg>
