<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>经典 STP 计时器收敛 vs RSTP 协商握手快速收敛</title>
  <desc>对比 802.1D 基于 Forward Delay/Max Age 的被动等待收敛，与 802.1w 基于 Proposal/Agreement 握手与 Sync 的快速收敛机制。</desc>
  <defs>
    <marker id="arr-gray3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-red3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arr-green3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-blue3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect x="0" y="0" width="1200" height="620" fill="rgb(245, 244, 237)"/>

  <!-- 顶部标题区 -->
  <text x="44" y="44" font-size="20" font-weight="700" fill="#2B2A26">经典 STP 计时器收敛 vs RSTP 握手协商机制</text>
  <text x="44" y="70" font-size="12.5" fill="#6B675C">802.1D 依赖保守 Timer 逐级收敛（30~50s）；802.1w 依靠 Proposal / Agreement 显式握手实现快速收敛</text>

  <!-- ========================================================================= -->
  <!-- 左卡片：A · 经典 STP (802.1D) 计时器被动收敛 -->
  <!-- ========================================================================= -->
  <rect x="44" y="90" width="536" height="500" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="44" y="90" width="536" height="34" rx="8" fill="#ECEAE2" stroke="#8C887B" stroke-width="1.2"/>
  <text x="60" y="112" font-size="13" font-weight="700" fill="#3A3832">A · 经典 STP (802.1D) · 计时器等待（30~50 秒）</text>

  <!-- 五状态迁移流水 -->
  <rect x="64" y="140" width="92" height="40" rx="5" fill="#EAE8DF" stroke="#8C887B" stroke-width="1"/>
  <text x="110" y="158" font-size="10" font-weight="700" fill="#2B2A26" text-anchor="middle">Blocking</text>
  <text x="110" y="172" font-size="9.5" fill="#6B675C" text-anchor="middle">听BPDU/不发</text>

  <line x1="156" y1="160" x2="188" y2="160" stroke="#8C887B" stroke-width="1.5" marker-end="url(#arr-gray3)"/>

  <rect x="190" y="140" width="102" height="40" rx="5" fill="#F4EAE6" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="241" y="158" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">Listening</text>
  <text x="241" y="172" font-size="9.5" fill="#A64B3C" text-anchor="middle">停 15s / 参与选举</text>

  <line x1="292" y1="160" x2="324" y2="160" stroke="#8C887B" stroke-width="1.5" marker-end="url(#arr-gray3)"/>

  <rect x="326" y="140" width="102" height="40" rx="5" fill="#FAEFE1" stroke="#A86A24" stroke-width="1.2"/>
  <text x="377" y="158" font-size="10" font-weight="700" fill="#754713" text-anchor="middle">Learning</text>
  <text x="377" y="172" font-size="9.5" fill="#A86A24" text-anchor="middle">停 15s / 学MAC</text>

  <line x1="428" y1="160" x2="460" y2="160" stroke="#8C887B" stroke-width="1.5" marker-end="url(#arr-gray3)"/>

  <rect x="462" y="140" width="98" height="40" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="511" y="158" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">Forwarding</text>
  <text x="511" y="172" font-size="9.5" fill="#2F6B5E" text-anchor="middle">正常双向转发</text>

  <!-- 故障恢复时间分解条 -->
  <rect x="64" y="200" width="496" height="150" rx="6" fill="#FFFFFF" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="224" font-size="11" font-weight="700" fill="#2B2A26">收敛耗时分析：为什么经典 STP 极慢？</text>

  <!-- 直接故障 -->
  <text x="80" y="250" font-size="10" font-weight="700" fill="#733428">场景 1：直接链路故障（本地感知 Link Down）</text>
  <rect x="80" y="260" width="190" height="22" fill="#F4EAE6" stroke="#A64B3C" stroke-width="1"/>
  <text x="175" y="275" font-size="9.5" fill="#733428" text-anchor="middle">Listening (15 秒)</text>
  <rect x="270" y="260" width="190" height="22" fill="#FAEFE1" stroke="#A86A24" stroke-width="1"/>
  <text x="365" y="275" font-size="9.5" fill="#754713" text-anchor="middle">Learning (15 秒)</text>
  <text x="470" y="276" font-size="10" font-weight="700" fill="#A64B3C">共 30 秒</text>

  <!-- 间接故障 -->
  <text x="80" y="306" font-size="10" font-weight="700" fill="#733428">场景 2：间接链路故障（远端设备失联，需超时重算）</text>
  <rect x="80" y="316" width="130" height="22" fill="#EDE9DF" stroke="#8C887B" stroke-width="1"/>
  <text x="145" y="331" font-size="9.5" fill="#5A564B" text-anchor="middle">Max Age (20 秒)</text>
  <rect x="210" y="316" width="125" height="22" fill="#F4EAE6" stroke="#A64B3C" stroke-width="1"/>
  <text x="272" y="331" font-size="9.5" fill="#733428" text-anchor="middle">Listening (15s)</text>
  <rect x="335" y="316" width="125" height="22" fill="#FAEFE1" stroke="#A86A24" stroke-width="1"/>
  <text x="397" y="331" font-size="9.5" fill="#754713" text-anchor="middle">Learning (15s)</text>
  <text x="470" y="332" font-size="10" font-weight="700" fill="#A64B3C">约 50 秒</text>

  <!-- 根本原因总结 -->
  <rect x="64" y="364" width="496" height="206" rx="6" fill="#FFFFFF" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="390" font-size="11" font-weight="700" fill="#2B2A26">经典机制的技术局限：</text>

  <text x="80" y="416" font-size="10" font-weight="700" fill="#2B2A26">1. 缺乏双向握手协商</text>
  <text x="96" y="434" font-size="9.5" fill="#5A564B">BPDU 仅由根桥下发，交换机无法确认对端同步状态。</text>

  <text x="80" y="464" font-size="10" font-weight="700" fill="#2B2A26">2. 被动依赖时间赌安全</text>
  <text x="96" y="482" font-size="9.5" fill="#5A564B">为防瞬时环路，死板等待两个 Forward Delay（30秒）。</text>

  <text x="80" y="512" font-size="10" font-weight="700" fill="#2B2A26">3. 终端接入盲等 30 秒</text>
  <text x="96" y="530" font-size="9.5" fill="#5A564B">PC 开机不能直接通信，极易导致 DHCP 请求超时。</text>

  <!-- ========================================================================= -->
  <!-- 右卡片：B · 快速生成树 (802.1w RSTP) 握手驱动收敛 -->
  <!-- ========================================================================= -->
  <rect x="620" y="90" width="536" height="500" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="620" y="90" width="536" height="34" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="636" y="112" font-size="13" font-weight="700" fill="#24473F">B · 快速生成树 (802.1w RSTP) · 握手协商（毫秒级）</text>

  <!-- Proposal / Agreement 握手序列图 -->
  <rect x="640" y="140" width="496" height="210" rx="6" fill="#FFFFFF" stroke="#D8D5C8" stroke-width="1"/>
  <text x="656" y="164" font-size="11" font-weight="700" fill="#2F6B5E">Proposal / Agreement 显式点到点握手流程：</text>

  <!-- 交换机节点标题 -->
  <text x="730" y="188" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">上游交换机 SW1 (DP)</text>
  <text x="1050" y="188" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">下游交换机 SW2 (RP)</text>

  <!-- 两条垂直基线 -->
  <line x1="730" y1="196" x2="730" y2="330" stroke="#8C887B" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="1050" y1="196" x2="1050" y2="330" stroke="#8C887B" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Step 1: Proposal -->
  <line x1="730" y1="216" x2="1040" y2="216" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-blue3)"/>
  <text x="890" y="210" font-size="9.5" font-weight="700" fill="#3D5A80" text-anchor="middle">① Proposal 提议 ("提议将本段置为转发")</text>

  <!-- Step 2: Sync 内部动作 -->
  <rect x="980" y="232" width="140" height="24" rx="4" fill="#F4EAE6" stroke="#A64B3C" stroke-width="1"/>
  <text x="1050" y="248" font-size="9.5" font-weight="700" fill="#733428" text-anchor="middle">② Sync (防瞬时环路)</text>

  <!-- Step 3: Agreement -->
  <line x1="1050" y1="276" x2="740" y2="276" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-green3)"/>
  <text x="890" y="270" font-size="9.5" font-weight="700" fill="#2F6B5E" text-anchor="middle">③ Agreement 应答 ("同步完成，同意！")</text>

  <!-- Step 4: 立即双向进入 Forwarding -->
  <rect x="760" y="296" width="260" height="24" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="890" y="312" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">④ 双方立即进入 Forwarding 状态</text>

  <!-- RSTP 核心改进说明卡片 -->
  <rect x="640" y="364" width="496" height="206" rx="6" fill="#FFFFFF" stroke="#D8D5C8" stroke-width="1"/>
  <text x="656" y="390" font-size="11" font-weight="700" fill="#2F6B5E">RSTP 快速收敛的三大核心技术：</text>

  <text x="656" y="416" font-size="10" font-weight="700" fill="#2B2A26">1. 状态机精简与角色解耦</text>
  <text x="672" y="434" font-size="9.5" fill="#5A564B">仅保留 Discarding、Learning、Forwarding 三种状态。</text>

  <text x="656" y="464" font-size="10" font-weight="700" fill="#2B2A26">2. 预备 Alternate 端口备用</text>
  <text x="672" y="482" font-size="9.5" fill="#5A564B">提前算好备用 Root 路径，主 RP 中断时毫秒级替补。</text>

  <text x="656" y="512" font-size="10" font-weight="700" fill="#2B2A26">3. 边缘端口 Edge Port (PortFast)</text>
  <text x="672" y="530" font-size="9.5" fill="#5A564B">直连 PC 端口开机直接 Forwarding，杜绝 DHCP 超时。</text>
</svg>