<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 15px; fill: #334155; }
      .code { font-size: 14px; fill: #0f172a; }
      .token { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <text font-family="Inter, Arial, sans-serif" x="70" y="70" class="title">KV Cache Lifecycle: Prefill Writes, Decode Reuses</text>
  <text font-family="Inter, Arial, sans-serif" x="70" y="105" class="subtitle">长 prompt 影响 TTFT，长 output 持续读取 KV cache 并影响 TPOT / ITL</text>
  <rect x="85" y="185" width="470" height="170" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="120" y="230" class="label">Prefill phase</text>
  <text font-family="Inter, Arial, sans-serif" x="120" y="265" class="text">process full prompt and write K/V per layer</text>
  <rect x="120" y="292" width="58" height="36" rx="8" fill="#2563eb"/>
  <rect x="190" y="292" width="58" height="36" rx="8" fill="#2563eb"/>
  <rect x="260" y="292" width="58" height="36" rx="8" fill="#2563eb"/>
  <rect x="330" y="292" width="58" height="36" rx="8" fill="#2563eb"/>
  <text font-family="Inter, Arial, sans-serif" x="139" y="316" class="token">t0</text>
  <text font-family="Inter, Arial, sans-serif" x="209" y="316" class="token">t1</text>
  <text font-family="Inter, Arial, sans-serif" x="279" y="316" class="token">t2</text>
  <text font-family="Inter, Arial, sans-serif" x="349" y="316" class="token">t3</text>
  <rect x="725" y="185" width="470" height="170" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="760" y="230" class="label">Decode phase</text>
  <text font-family="Inter, Arial, sans-serif" x="760" y="265" class="text">new Q reads previous K/V, then appends new K/V</text>
  <rect x="760" y="292" width="58" height="36" rx="8" fill="#16a34a"/>
  <rect x="830" y="292" width="58" height="36" rx="8" fill="#16a34a"/>
  <rect x="900" y="292" width="58" height="36" rx="8" fill="#16a34a"/>
  <text font-family="Inter, Arial, sans-serif" x="777" y="316" class="token">t4</text>
  <text font-family="Inter, Arial, sans-serif" x="847" y="316" class="token">t5</text>
  <text font-family="Inter, Arial, sans-serif" x="917" y="316" class="token">t6</text>
  <path d="M555 270 H705" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="230" y="465" width="820" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="275" y="512" class="label">KV cache per layer</text>
  <text font-family="Menlo, Consolas, monospace" x="275" y="548" class="code">K/V[t0..t3] written during prefill; K/V[t4..t6] appended during decode</text>
  <text font-family="Inter, Arial, sans-serif" x="275" y="580" class="text">TTFT includes prefill. TPOT / ITL depends on repeated reads of cached K/V during decode.</text>
  <path d="M320 355 V445" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M960 355 V445" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
