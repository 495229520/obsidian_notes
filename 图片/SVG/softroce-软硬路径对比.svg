<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">soft-RoCE：同一套 Verbs，下面换成了软件</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">rxe 把 RoCE v2 状态机搬进内核、包走普通协议栈——API 一致保住正确性，4.1 的三根柱子逐根塌掉</text>

  <!-- 共同的 API 层 -->
  <rect x="70" y="110" width="1100" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="620" y="134" font-size="13.5" font-weight="700" fill="#2C4460" text-anchor="middle">应用 + libibverbs：完全相同的 Verbs API（QP / MR / CQ）</text>
  <text x="620" y="158" font-size="10.5" fill="#2C4460" text-anchor="middle">同一份代码不改一行，两边都能跑——这就是 rxe 能当开发环境的原因</text>

  <path d="M330,174 L330,206" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrb)"/>
  <path d="M910,174 L910,206" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrb)"/>

  <!-- 硬件泳道 -->
  <rect x="70" y="210" width="520" height="380" rx="10" fill="#E7F1EC" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="90" y="238" font-size="14" font-weight="700" fill="#1F4A3E">硬件 RoCE 网卡</text>

  <rect x="130" y="252" width="400" height="56" rx="7" fill="#E3EFE9" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="330" y="272" font-size="12.5" font-weight="700" fill="#1F4A3E" text-anchor="middle">填 WQE → 写硬件 doorbell</text>
  <text x="330" y="292" font-size="10.5" fill="#2F6B5E" text-anchor="middle">MMIO 一次：0 系统调用</text>

  <path d="M330,308 L330,328" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrt)"/>

  <rect x="130" y="332" width="400" height="56" rx="7" fill="#E3EFE9" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="330" y="352" font-size="12.5" font-weight="700" fill="#1F4A3E" text-anchor="middle">NIC 硬件传输层</text>
  <text x="330" y="372" font-size="10.5" fill="#2F6B5E" text-anchor="middle">分段 / ACK / 重传都在网卡里</text>

  <path d="M330,388 L330,408" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrt)"/>

  <rect x="130" y="412" width="400" height="56" rx="7" fill="#E3EFE9" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="330" y="432" font-size="12.5" font-weight="700" fill="#1F4A3E" text-anchor="middle">NIC DMA 直读 / 直写 MR</text>
  <text x="330" y="452" font-size="10.5" fill="#2F6B5E" text-anchor="middle">0 次 CPU 拷贝；完成可轮询：0 中断</text>

  <path d="M330,468 L330,488" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrt)"/>

  <rect x="130" y="492" width="400" height="56" rx="7" fill="#E3EFE9" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="330" y="512" font-size="12.5" font-weight="700" fill="#1F4A3E" text-anchor="middle">RoCE v2 包上网线</text>
  <text x="330" y="532" font-size="10.5" fill="#2F6B5E" text-anchor="middle">ICRC 校验也由网卡计算</text>

  <!-- rxe 泳道 -->
  <rect x="650" y="210" width="520" height="380" rx="10" fill="#F6EFDD" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="670" y="238" font-size="14" font-weight="700" fill="#7A5518">soft-RoCE（rxe 内核模块）</text>

  <rect x="710" y="252" width="400" height="56" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="910" y="272" font-size="12.5" font-weight="700" fill="#7A5518" text-anchor="middle">填 WQE → 提交进内核</text>
  <text x="910" y="292" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">没有硬件 doorbell 可映射：陷入【等待点】</text>

  <path d="M910,308 L910,328" fill="none" stroke="#B07D2B" stroke-width="1.8" marker-end="url(#arra)"/>

  <rect x="710" y="332" width="400" height="56" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="910" y="352" font-size="12.5" font-weight="700" fill="#7A5518" text-anchor="middle">rxe 软件状态机（内核执行）</text>
  <text x="910" y="372" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">分段 / ACK / 重传定时器全烧 CPU</text>

  <path d="M910,388 L910,408" fill="none" stroke="#B07D2B" stroke-width="1.8" marker-end="url(#arra)"/>

  <rect x="710" y="412" width="400" height="56" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="910" y="432" font-size="12.5" font-weight="700" fill="#7A5518" text-anchor="middle">封装 RoCEv2/UDP + 软件算 ICRC</text>
  <text x="910" y="452" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">CPU 至少把每个字节读一遍</text>

  <path d="M910,468 L910,488" fill="none" stroke="#B07D2B" stroke-width="1.8" marker-end="url(#arra)"/>

  <rect x="710" y="492" width="400" height="56" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="910" y="512" font-size="12.5" font-weight="700" fill="#7A5518" text-anchor="middle">普通网卡驱动：skb → 网线</text>
  <text x="910" y="532" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">对端还要中断 + softirq 才能收包</text>

  <!-- 三根柱子对账 -->
  <rect x="70" y="620" width="1100" height="216" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="94" y="650" font-size="13.5" font-weight="700" fill="#2B2A26">三根柱子对账</text>
  <text x="94" y="682" font-size="11.5" font-weight="700" fill="#4A473F">内核旁路</text>
  <text x="230" y="682" font-size="11.5" fill="#1F4A3E">硬件：数据路径 0 陷入</text>
  <text x="640" y="682" font-size="11.5" fill="#A64B3C">rxe：提交与完成都要经过内核</text>
  <text x="94" y="710" font-size="11.5" font-weight="700" fill="#4A473F">传输卸载</text>
  <text x="230" y="710" font-size="11.5" fill="#1F4A3E">硬件：状态机在网卡里跑</text>
  <text x="640" y="710" font-size="11.5" fill="#A64B3C">rxe：状态机在内核里跑，按包烧 CPU</text>
  <text x="94" y="738" font-size="11.5" font-weight="700" fill="#4A473F">零拷贝</text>
  <text x="230" y="738" font-size="11.5" fill="#1F4A3E">硬件：数据只被 DMA 碰</text>
  <text x="640" y="738" font-size="11.5" fill="#A64B3C">rxe：封装与 ICRC 让 CPU 每字节过手</text>
  <text x="94" y="766" font-size="11.5" font-weight="700" fill="#4A473F">单边操作</text>
  <text x="230" y="766" font-size="11.5" fill="#1F4A3E">硬件：远端 CPU 全程不参与</text>
  <text x="640" y="766" font-size="11.5" fill="#A64B3C">rxe：远端应用不参与，远端内核照常忙</text>
  <text x="94" y="802" font-size="12" font-weight="700" fill="#A64B3C">性能与内核 UDP 同量级——soft-RoCE 验证的是正确性，不是速度</text>
</svg>
