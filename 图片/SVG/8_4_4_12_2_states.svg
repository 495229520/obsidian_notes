<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<title>授权状态机：状态改变必须伴随可审计证据</title>
<desc>RETIRED 是旧 grant 的终点；新授权创建新记录，不把旧记录复活。。中文教学示意；状态编号与时间间距不代表实测延迟。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="690" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="49" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">授权状态机：状态改变必须伴随可审计证据</text>
<text x="48" y="79" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start">RETIRED 是旧 grant 的终点；新授权创建新记录，不把旧记录复活。</text>
<rect x="50" y="166" width="184" height="75" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="142.0" y="198.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">LOCAL_READY</text>
<text x="142.0" y="219.0" font-size="13" fill="#4A473F" font-weight="400" text-anchor="middle">仅本端可用</text>
<rect x="300" y="166" width="184" height="75" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="392.0" y="198.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">PUBLISHING</text>
<text x="392.0" y="219.0" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">先登记授权引用</text>
<rect x="550" y="166" width="184" height="75" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="642.0" y="198.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">ACTIVE</text>
<text x="642.0" y="219.0" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">允许合法提交</text>
<rect x="852" y="166" width="290" height="75" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="997.0" y="198.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">QUIESCING</text>
<text x="997.0" y="219.0" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">关门 / 等待旧请求</text>
<line x1="237" y1="204" x2="294" y2="204" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="487" y1="204" x2="544" y2="204" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="737" y1="204" x2="846" y2="204" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="303" y="151" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">生效后才能激活</text>
<text x="808" y="151" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">撤权 / 重连</text>
<path d="M998,245 L998,308" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="1024" y="284" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">排空或隔离证据</text>
<rect x="852" y="317" width="290" height="70" rx="8" fill="#EDEAF3" stroke="#82749E" stroke-width="1.3"/>
<text x="997.0" y="346.5" font-size="14" fill="#5D4F78" font-weight="700" text-anchor="middle">REVOKING</text>
<text x="997.0" y="367.5" font-size="13" fill="#5D4F78" font-weight="400" text-anchor="middle">等待适用撤销完成</text>
<rect x="550" y="317" width="184" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="642.0" y="346.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">RETIRED</text>
<text x="642.0" y="367.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">旧 grant 终结</text>
<line x1="846" y1="352" x2="740" y2="352" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="793" y="307" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle">撤销已完成</text>
<rect x="851" y="427" width="291" height="61" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="996.5" y="452.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">QUARANTINED</text>
<text x="996.5" y="473.0" font-size="13" fill="#733428" font-weight="400" text-anchor="middle">未知状态：禁止复用</text>
<line x1="998" y1="391" x2="998" y2="421" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)" stroke-dasharray="5 4"/>
<text x="1018" y="413" font-size="12" fill="#733428" font-weight="400" text-anchor="start">失败 / 超时</text>
<rect x="50" y="294" width="434" height="187" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="70" y="322" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">必须独立成立的条件</text>
<text x="70" y="354" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">① 不再接纳新提交</text>
<text x="70" y="386" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">② 已接受访问已排空 / 终止</text>
<text x="70" y="418" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">③ 适用硬件权限已撤销</text>
<text x="70" y="451" font-size="14" fill="#733428" font-weight="400" text-anchor="start">未知条件不能用定时器补成真</text>
<text x="50" y="522" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">接收方状态：收到元数据，并不等于允许提交</text>
<rect x="50" y="546" width="242" height="49" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="171.0" y="575.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">CACHED</text>
<rect x="349" y="546" width="242" height="49" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="470.0" y="575.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">ACTIVE</text>
<rect x="648" y="546" width="242" height="49" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="769.0" y="575.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">FROZEN</text>
<rect x="947" y="546" width="242" height="49" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1068.0" y="575.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">RETIRED</text>
<line x1="295" y1="571" x2="343" y2="571" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="594" y1="571" x2="642" y2="571" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="893" y1="571" x2="941" y2="571" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="48" y1="625" x2="1192" y2="625" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="654" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">检查身份之外，还必须检查会话 READY 与 grant ACTIVE；未变 generation 的冻结对象也要拒绝。</text>
</svg>