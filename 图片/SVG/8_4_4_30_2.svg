<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>Incast：同时运行的进程，不一定形成同时汇聚的数据</title>
<desc>上半部区分发送主机与共享出口；下半部只对真正重叠的窗口计算稳态结果</desc>
<defs>
<marker id="arr_n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5A564B"/></marker>
<marker id="arr_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3D5A80"/></marker>
<marker id="arr_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6B5E"/></marker>
<marker id="arr_r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="690" fill="rgb(245, 244, 237)"/>
<text x="48" y="43" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="title">Incast：同时运行的进程，不一定形成同时汇聚的数据</text>
<text x="48" y="72" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="subtitle">上半部区分发送主机与共享出口；下半部只对真正重叠的窗口计算稳态结果</text>
<rect x="62" y="114" width="171" height="39" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="147.5" y="138.4" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body" data-region="68,118,159,31">发送主机 1</text>
<polyline points="240,133 337,133 337,216 431,216" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_b)"/>
<rect x="62" y="169" width="171" height="39" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="147.5" y="193.4" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body" data-region="68,173,159,31">发送主机 2</text>
<polyline points="240,188 337,188 337,216 431,216" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_b)"/>
<rect x="62" y="224" width="171" height="39" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="147.5" y="248.4" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body" data-region="68,228,159,31">发送主机 3</text>
<polyline points="240,243 337,243 337,216 431,216" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_b)"/>
<rect x="62" y="279" width="171" height="39" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="147.5" y="303.4" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body" data-region="68,283,159,31">发送主机 4</text>
<polyline points="240,298 337,298 337,216 431,216" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_b)"/>
<rect x="443" y="157" width="243" height="118" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="564.5" y="199.9" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body" data-region="449,161,231,110">交换机汇聚</text>
<text x="564.5" y="220.9" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body" data-region="449,161,231,110">明确 ingress 与 egress</text>
<text x="564.5" y="241.9" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body" data-region="449,161,231,110">queue / PG / TC</text>
<polyline points="692,216 950,216" fill="none" stroke="#A64B3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_r)"/>
<text x="820" y="192" font-size="14" fill="#733428" font-weight="400" text-anchor="middle" data-role="body">共享出口 / 瓶颈候选</text>
<rect x="957" y="159" width="232" height="114" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1073.0" y="199.9" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body" data-region="963,163,220,106">接收主机</text>
<text x="1073.0" y="220.9" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body" data-region="963,163,220,106">RNIC · PCIe · 内存</text>
<text x="1073.0" y="241.9" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body" data-region="963,163,220,106">CQ / SRQ / CPU</text>
<text x="458" y="316" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">READ incast：画 response 的数据方向</text>
<text x="64" y="353" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">多个 QP ≠ 多个发送主机；独立控制端口 ≠ 数据面路径熵</text>
<text x="48" y="398" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">实际开始偏差与共同测量窗口</text>
<rect x="413" y="420" width="548" height="189" rx="2" fill="#DCE9E3" stroke="none" stroke-width="1.3" opacity="0.55"/>
<text x="66" y="451" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">Sender 1</text>
<rect x="220" y="432" width="193" height="25" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="413" y="432" width="548" height="25" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<rect x="961" y="432" width="177" height="25" rx="3" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="66" y="494" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">Sender 2</text>
<rect x="242" y="475" width="171" height="25" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="413" y="475" width="548" height="25" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<rect x="961" y="475" width="168" height="25" rx="3" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="66" y="537" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">Sender 3</text>
<rect x="257" y="518" width="156" height="25" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="413" y="518" width="548" height="25" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<rect x="961" y="518" width="159" height="25" rx="3" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="66" y="580" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">Sender 4</text>
<rect x="278" y="561" width="135" height="25" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="413" y="561" width="548" height="25" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<rect x="961" y="561" width="150" height="25" rx="3" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="291" y="629" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body">warm-up / 实际开始</text>
<text x="687" y="629" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">共同 measure 窗口</text>
<text x="1050" y="629" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">有界 drain</text>
<text x="48" y="665" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">时间条是编排合同示意；微秒级 burst 需要专用生成器与开始偏差测量，SSH 启动不能充当精确屏障。</text>
</svg>