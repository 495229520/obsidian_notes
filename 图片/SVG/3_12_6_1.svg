<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">多线程并发 TCP 服务器架构</title>
  <desc id="desc">主线程依次执行 socket、bind、listen，然后在 accept 循环中阻塞等待新连接；每个新连接交给独立工作线程处理。</desc>
  <rect width="1180" height="720" fill="rgb(245, 244, 237)" />

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#b6502a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#3b728f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <style>
      text {
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
        fill: #2d2a24;
        letter-spacing: 0;
      }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #6f675c; }
      .section { font-size: 20px; font-weight: 700; fill: #9d4425; }
      .box-title { font-size: 20px; font-weight: 700; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 19px; }
      .small { font-size: 15px; fill: #625c52; }
      .thread { font-size: 18px; font-weight: 700; }
      .client { font-size: 16px; fill: #5d584f; }
      .badge { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <text x="590" y="48" text-anchor="middle" class="title">每连接一线程的并发 TCP 服务器</text>
  <text x="590" y="76" text-anchor="middle" class="subtitle">主线程只负责监听和 accept，新连接到来后创建独立工作线程处理客户端通信</text>

  <rect x="58" y="112" width="1064" height="548" rx="18" fill="#fffaf1" stroke="#c97950" stroke-width="2.2" stroke-dasharray="9 8" />
  <text x="590" y="148" text-anchor="middle" class="section">主线程</text>

  <rect x="112" y="190" width="162" height="78" rx="10" fill="#fffdf8" stroke="#bf5b35" stroke-width="2" />
  <text x="193" y="238" text-anchor="middle" class="code">socket()</text>

  <rect x="360" y="190" width="162" height="78" rx="10" fill="#fffdf8" stroke="#bf5b35" stroke-width="2" />
  <text x="441" y="238" text-anchor="middle" class="code">bind()</text>

  <rect x="608" y="190" width="246" height="78" rx="10" fill="#fffdf8" stroke="#bf5b35" stroke-width="2" />
  <text x="731" y="238" text-anchor="middle" class="code">listen()</text>

  <path d="M 274 229 L 360 229" fill="none" stroke="#b6502a" stroke-width="2.2" marker-end="url(#arrow)" />
  <path d="M 522 229 L 608 229" fill="none" stroke="#b6502a" stroke-width="2.2" marker-end="url(#arrow)" />

  <path d="M 731 268 L 731 326" fill="none" stroke="#b6502a" stroke-width="2.2" marker-end="url(#arrow)" />

  <rect x="560" y="326" width="342" height="104" rx="12" fill="#fffdf8" stroke="#bf5b35" stroke-width="2" />
  <text x="731" y="370" text-anchor="middle" class="box-title">accept() 循环</text>
  <text x="731" y="400" text-anchor="middle" class="small">阻塞等待新连接</text>

  <path d="M 731 430 L 731 492" fill="none" stroke="#3b728f" stroke-width="2.2" marker-end="url(#arrow-blue)" />
  <path d="M 262 492 L 988 492" fill="none" stroke="#3b728f" stroke-width="2.2" />
  <path d="M 262 492 L 262 526" fill="none" stroke="#3b728f" stroke-width="2.2" marker-end="url(#arrow-blue)" />
  <path d="M 590 492 L 590 526" fill="none" stroke="#3b728f" stroke-width="2.2" marker-end="url(#arrow-blue)" />
  <path d="M 988 492 L 988 526" fill="none" stroke="#3b728f" stroke-width="2.2" marker-end="url(#arrow-blue)" />

  <rect x="144" y="526" width="236" height="96" rx="12" fill="#eef7f9" stroke="#6da2ba" stroke-width="2" />
  <text x="262" y="565" text-anchor="middle" class="thread">工作线程 1</text>
  <text x="262" y="595" text-anchor="middle" class="client">处理客户端 A</text>

  <rect x="472" y="526" width="236" height="96" rx="12" fill="#eef7f9" stroke="#6da2ba" stroke-width="2" />
  <text x="590" y="565" text-anchor="middle" class="thread">工作线程 2</text>
  <text x="590" y="595" text-anchor="middle" class="client">处理客户端 B</text>

  <rect x="868" y="526" width="240" height="96" rx="12" fill="#eef7f9" stroke="#6da2ba" stroke-width="2" />
  <text x="988" y="565" text-anchor="middle" class="thread">...</text>
  <text x="988" y="595" text-anchor="middle" class="client">更多客户端连接</text>

  <circle cx="731" cy="492" r="18" fill="#3b728f" />
  <text x="731" y="497" text-anchor="middle" class="badge">分</text>
  <text x="760" y="499" class="small">每次 accept 成功后创建或分配一个工作线程</text>

  <rect x="80" y="672" width="1020" height="34" rx="17" fill="#f4eadb" stroke="#d3b28c" stroke-width="1.4" />
  <text x="590" y="694" text-anchor="middle" class="small">教学模型重点：主线程不处理具体业务，工作线程独占一个客户端连接并阻塞 read/write</text>
</svg>
