<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect width="980" height="520" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .cell { fill: #eef6fb; stroke: #6f94b3; stroke-width: 1.4; rx: 6; }
      .window { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2; rx: 6; }
      .out { fill: #fde2df; stroke: #d36b5f; stroke-width: 2; rx: 6; }
      .in { fill: #dff0ea; stroke: #45907a; stroke-width: 2; rx: 6; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .note { fill: #edf4f1; stroke: #9db7aa; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">Rabin-Karp：滚动更新窗口哈希</text>
  <text x="40" y="76" class="subtitle">窗口右移一位时，删除最高位字符，整体乘 base，再加入新字符。</text>

  <rect x="58" y="118" width="864" height="184" class="panel"/>
  <text x="86" y="152" class="label">文本窗口右移</text>
  <g transform="translate(96,190)">
    <rect x="0" y="0" width="58" height="46" class="out"/><text x="29" y="29" text-anchor="middle" class="mono">a</text>
    <rect x="68" y="0" width="58" height="46" class="window"/><text x="97" y="29" text-anchor="middle" class="mono">b</text>
    <rect x="136" y="0" width="58" height="46" class="window"/><text x="165" y="29" text-anchor="middle" class="mono">c</text>
    <rect x="204" y="0" width="58" height="46" class="window"/><text x="233" y="29" text-anchor="middle" class="mono">d</text>
    <rect x="272" y="0" width="58" height="46" class="in"/><text x="301" y="29" text-anchor="middle" class="mono">e</text>
    <rect x="340" y="0" width="58" height="46" class="cell"/><text x="369" y="29" text-anchor="middle" class="mono">f</text>
  </g>
  <path d="M 206 258 L 386 258" class="arrow"/>
  <text x="430" y="244" class="mono">旧窗口: a b c d</text>
  <text x="430" y="274" class="mono">新窗口: b c d e</text>

  <rect x="58" y="334" width="864" height="104" class="panel"/>
  <text x="86" y="368" class="label">滚动公式</text>
  <text x="86" y="402" class="mono">hash = (hash - old * base^(m-1)) * base + new</text>
  <text x="540" y="402" class="small">实际实现中每一步都要取 mod 并处理负数</text>

  <rect x="174" y="466" width="632" height="34" class="note"/>
  <text x="490" y="488" text-anchor="middle" class="small">哈希相等只是候选匹配；为保证正确性，命中后仍要比较原始子串。</text>
</svg>
