<svg xmlns="http://www.w3.org/2000/svg" width="740" height="270" viewBox="0 0 740 270">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>CPacket 二进制帧格式与字节偏移</title>
  <desc>帧由 Header（Magic+BodyLen，6 字节）与 Body（Command+Payload+Checksum）组成，BodyLen = N + 4。</desc>
  <rect x="0" y="0" width="740" height="270" fill="rgb(245, 244, 237)"/>

  <text x="70" y="58" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="160" y="58" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="310" y="58" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="420" y="58" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">8</text>
  <text x="560" y="58" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">8+N</text>
  <text x="670" y="58" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">8+N+2</text>

  <rect x="70" y="78" width="600" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <line x1="160" y1="78" x2="160" y2="138" stroke="#185FA5" stroke-width="1"/>
  <line x1="310" y1="78" x2="310" y2="138" stroke="#185FA5" stroke-width="1"/>
  <line x1="420" y1="78" x2="420" y2="138" stroke="#185FA5" stroke-width="1"/>
  <line x1="560" y1="78" x2="560" y2="138" stroke="#185FA5" stroke-width="1"/>

  <text x="115" y="100" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Magic</text>
  <text x="115" y="120" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">0xFEFF · 2B</text>
  <text x="235" y="100" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">BodyLen</text>
  <text x="235" y="120" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">DWORD · 4B</text>
  <text x="365" y="100" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Command</text>
  <text x="365" y="120" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">WORD · 2B</text>
  <text x="490" y="100" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Payload</text>
  <text x="490" y="120" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">N 字节</text>
  <text x="615" y="100" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Checksum</text>
  <text x="615" y="120" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">WORD · 2B</text>

  <path d="M70 158 L70 164 L310 164 L310 158" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="190" y="180" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">Header（6 字节）</text>
  <path d="M310 158 L310 164 L670 164 L670 158" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="490" y="180" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">Body = BodyLen 字节</text>

  <text x="370" y="226" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">BodyLen = Command(2) + Payload(N) + Checksum(2) = N + 4</text>
</svg>
