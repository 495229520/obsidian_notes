<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<title>Repair 的两份账：读写放大与安全发布</title><desc>源读取 64 TiB、目标写入 8 TiB 的比例条，配合目标和源吞吐给出的时间下界；底部强调解码、验证、持久化、发布四个不同状态。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A64B3C"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6B5E"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5A80"/></marker>
</defs>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">Repair 的两份账：读写放大与安全发布</text>
<text x="48" y="82" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">基线算例：传统整片 RS(8,3)，每条带修复一片，缺失目标共 8 TiB；不含额外 I/O。</text>
<rect x="48" y="120" width="710" height="288" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="153" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 修复字节：分母都是 8 TiB 缺失目标</text>
<text x="68" y="210" font-size="16" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">源读取</text>
<rect x="180" y="180" width="480" height="45" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<line x1="240" y1="180" x2="240" y2="225" stroke="#3D5A80" stroke-width="1"/>
<line x1="300" y1="180" x2="300" y2="225" stroke="#3D5A80" stroke-width="1"/>
<line x1="360" y1="180" x2="360" y2="225" stroke="#3D5A80" stroke-width="1"/>
<line x1="420" y1="180" x2="420" y2="225" stroke="#3D5A80" stroke-width="1"/>
<line x1="480" y1="180" x2="480" y2="225" stroke="#3D5A80" stroke-width="1"/>
<line x1="540" y1="180" x2="540" y2="225" stroke="#3D5A80" stroke-width="1"/>
<line x1="600" y1="180" x2="600" y2="225" stroke="#3D5A80" stroke-width="1"/>
<text x="674" y="208" font-size="16" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">64 TiB</text>
<text x="68" y="278" font-size="16" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">目标写入</text>
<rect x="180" y="247" width="60" height="45" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="260" y="275" font-size="16" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">8 TiB</text>
<text x="68" y="333" font-size="16" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">源读放大 = 8×；读写总量倍率 = 9×</text>
<text x="68" y="367" font-size="16" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">网络量取决于解码位置、helper 共置与统计口径</text>
<rect x="786" y="120" width="406" height="288" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="806" y="153" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 吞吐给出的时间下界</text>
<text x="806" y="204" font-size="30" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="body">≥ 5.83 h</text>
<text x="806" y="240" font-size="16" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">目标有效产出：400 MiB/s</text>
<text x="806" y="270" font-size="16" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">对应源读需求：3200 MiB/s</text>
<line x1="806" y1="288" x2="1172" y2="288" stroke="#B07D2B" stroke-width="1"/>
<text x="806" y="321" font-size="16" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">若源读预算仅为 1 GiB/s</text>
<text x="806" y="353" font-size="16" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">则源读约束变为 ≥ 18.20 h</text>
<text x="48" y="452" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">C · 冗余恢复以条件发布成功为准，不以“解码器返回成功”为准</text>
<rect x="48" y="481" width="250" height="85" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="173.0" y="516.94" font-size="16" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Reconstructed</text>
<text x="173.0" y="540.94" font-size="16" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">得到候选字节</text>
<line x1="298" y1="523" x2="340" y2="523" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="346" y="481" width="250" height="85" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="471.0" y="516.94" font-size="16" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">Verified</text>
<text x="471.0" y="540.94" font-size="16" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">匹配可信期望值</text>
<line x1="596" y1="523" x2="638" y2="523" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="644" y="481" width="250" height="85" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="769.0" y="516.94" font-size="16" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Durable</text>
<text x="769.0" y="540.94" font-size="16" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">满足持久化契约</text>
<line x1="894" y1="523" x2="936" y2="523" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="942" y="481" width="250" height="85" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1067.0" y="516.94" font-size="16" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">Published</text>
<text x="1067.0" y="540.94" font-size="16" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">版本 / 放置仍有效</text>
<text x="48" y="608" font-size="16" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="body">generation / epoch 已变 → 拒绝旧任务发布；重新规划或回收未发布候选。</text>
<line x1="48" y1="643" x2="1192" y2="643" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="671" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">时间均为给定吞吐下的算术下界；排队、校验、网络、竞争与额外回读会延长恢复窗口。</text>
</svg>