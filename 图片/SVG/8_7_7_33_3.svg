<text x="338" y="317" fill="#AE4247" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="700" text-anchor="start">1 块不可提供</text>
<text x="338" y="359" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">正式总体可很大</text>
<text x="338" y="399" fill="#127B6A" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="700" text-anchor="start">关注比例 f</text>
<text x="64" y="528" fill="#345AC9" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="700" text-anchor="start">P(miss) ≤ (1 − f)^s</text>
<text x="64" y="575" fill="#127B6A" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="33" font-weight="700" text-anchor="start">s = 688</text>
<text x="64" y="617" fill="#127B6A" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" text-anchor="start">检出概率下界 ≈ 99.900685%</text>
<text x="643" y="266" fill="#345AC9" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" text-anchor="start">1 PiB / 4 MiB</text>
<text x="643" y="313" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="700" text-anchor="start">N = 268,435,456 块</text>
<text x="643" y="374" fill="#AE4247" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">P(detect) = s / N</text>
<text x="643" y="430" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">仍然只抽 688 个不同块</text>
<text x="643" y="485" fill="#AE4247" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="700" text-anchor="start">检出概率 ≈ 0.0002563%</text>
<text x="643" y="546" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">要以 99% 概率找到唯一坏块：</text>
<text x="643" y="591" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">必须抽至少 99% 的总体。</text>
<rect x="42" y="708" width="1116" height="78" rx="12" fill="#F8EEDB"/>
<text x="64" y="738" fill="#9A641B" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">通过一轮审计 ≠ 文件有 99.9% 的概率完全无损。</text>
<text x="64" y="765" fill="#9A641B" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">条件检出概率、密码学 soundness 与可提取性是不同的结论。</text>
