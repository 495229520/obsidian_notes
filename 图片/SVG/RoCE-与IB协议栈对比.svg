<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1240" height="660" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">同一套 Verbs，三种承载：InfiniBand、RoCE v1 / v2、iWARP</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">应用代码不变，变的是下面的网络栈——以及"不丢包"由谁来保证</text>

  <!-- Verbs 公共层 -->
  <rect x="48" y="106" width="1132" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="614" y="133" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">应用 · libibverbs / rdma_cm —— Verbs API 与 QP / CQ / MR 模型完全不变</text>

  <!-- 列标题 -->
  <text x="185" y="180" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">InfiniBand</text>
  <text x="471" y="180" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">RoCE v1</text>
  <text x="757" y="180" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">RoCE v2</text>
  <text x="1043" y="180" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">iWARP</text>

  <!-- IB 列 -->
  <rect x="48" y="192" width="274" height="64" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="185" y="216" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">IB 传输层（网卡硬件）</text>
  <text x="185" y="236" font-size="10" fill="#24473F" text-anchor="middle">RC/UD · PSN · ACK/NAK · 硬件重传</text>
  <rect x="48" y="264" width="274" height="64" rx="6" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="185" y="288" font-size="11.5" font-weight="700" fill="#2B2A26" text-anchor="middle">IB 网络层</text>
  <text x="185" y="308" font-size="10" fill="#6B675C" text-anchor="middle">LID 寻址 · Subnet Manager 集中算路</text>
  <rect x="48" y="336" width="274" height="76" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="185" y="360" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">IB 链路层：credit 流控</text>
  <text x="185" y="380" font-size="10" fill="#24473F" text-anchor="middle">收端有 credit 才发 → 天生无损</text>
  <text x="185" y="398" font-size="10" fill="#24473F" text-anchor="middle">专用交换机 / 线缆</text>

  <!-- RoCE v1 列 -->
  <rect x="334" y="192" width="274" height="64" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="471" y="216" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">IB 传输层（网卡硬件）</text>
  <text x="471" y="236" font-size="10" fill="#24473F" text-anchor="middle">与 IB 完全相同</text>
  <rect x="334" y="264" width="274" height="64" rx="6" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.3"/>
  <text x="471" y="288" font-size="11.5" font-weight="700" fill="#7A5426" text-anchor="middle">—— 无网络层</text>
  <text x="471" y="308" font-size="10" fill="#7A5426" text-anchor="middle">EtherType 0x8915，出不了二层，不可路由</text>
  <rect x="334" y="336" width="274" height="76" rx="6" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="471" y="360" font-size="11.5" font-weight="700" fill="#2B2A26" text-anchor="middle">以太网 L2 + PFC</text>
  <text x="471" y="380" font-size="10" fill="#6B675C" text-anchor="middle">"无损"要自己配出来（4.7）</text>

  <!-- RoCE v2 列 -->
  <rect x="620" y="192" width="274" height="64" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="757" y="216" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">IB 传输层（网卡硬件）</text>
  <text x="757" y="236" font-size="10" fill="#24473F" text-anchor="middle">与 IB 完全相同</text>
  <rect x="620" y="264" width="274" height="64" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="757" y="288" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">UDP:4791 / IP → 可路由</text>
  <text x="757" y="308" font-size="10" fill="#2C4460" text-anchor="middle">UDP 源端口当 ECMP 熵，走三层组网</text>
  <rect x="620" y="336" width="274" height="76" rx="6" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="757" y="360" font-size="11.5" font-weight="700" fill="#2B2A26" text-anchor="middle">以太网 + PFC / ECN + DCQCN</text>
  <text x="757" y="380" font-size="10" fill="#6B675C" text-anchor="middle">近无损靠运维建出来（4.7）</text>
  <text x="757" y="398" font-size="10" fill="#6B675C" text-anchor="middle">复用现有以太网设备</text>

  <!-- iWARP 列 -->
  <rect x="906" y="192" width="274" height="64" rx="6" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1043" y="216" font-size="11.5" font-weight="700" fill="#2B2A26" text-anchor="middle">RDMA（DDP / MPA 分层）</text>
  <text x="1043" y="236" font-size="10" fill="#6B675C" text-anchor="middle">另一分支，与 IB 传输层不同</text>
  <rect x="906" y="264" width="274" height="64" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="1043" y="288" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">TCP / IP → 可路由</text>
  <text x="1043" y="308" font-size="10" fill="#2C4460" text-anchor="middle">重传 / 拥塞由 TCP 状态机负责</text>
  <rect x="906" y="336" width="274" height="76" rx="6" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1043" y="360" font-size="11.5" font-weight="700" fill="#2B2A26" text-anchor="middle">任意以太网</text>
  <text x="1043" y="380" font-size="10" fill="#6B675C" text-anchor="middle">不要求无损，容忍丢包</text>

  <!-- 汇总 -->
  <rect x="48" y="436" width="1132" height="64" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="64" y="461" font-size="11" fill="#2B2A26">寻址：IB = LID（SM 分配）· RoCE = GID（由 IP/MAC 派生，v2 的 GID 就是 IP）· iWARP = 普通 IP</text>
  <text x="64" y="485" font-size="11" fill="#2B2A26">不丢包由谁保证：IB = 链路层 credit（天生）· RoCE v1 = PFC · RoCE v2 = PFC + ECN/DCQCN（建出来）· iWARP = 不需要（TCP 容忍丢包）</text>

  <rect x="48" y="516" width="1132" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="64" y="548" font-size="11.5" font-weight="700" fill="#24473F">选型【取舍】：大规模训练集群 → IB（开箱无损、SHARP 在网聚合）；云与存储网络 → RoCE v2（复用以太网运维与设备）；iWARP 生态小众</text>

  <text x="48" y="602" font-size="10.5" fill="#6B675C">验证手上是谁：ibv_devinfo 看 link_layer；show_gids 看 GID 类型（v1 / v2）；tcpdump udp port 4791 能抓到 RoCE v2</text>
</svg>
