<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>GDS 直通路径的闸门与回退</title>
  <desc>一次 cuFileRead 要连续通过五道闸门才走直通路径：驱动、文件系统、IO 形状、拓扑与 IOMMU、BAR1 资源；任一闸门失败即静默切入 compat 回退路径（经主存 bounce）。下方给出三种结果的观测手段与验证三步流程。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="800" fill="rgb(245, 244, 237)"/>

  <text x="48" y="42" font-size="22" font-weight="700" fill="#2B2A26">GDS 直通路径的闸门：一次 cuFileRead 的判定链与回退去向</text>
  <text x="48" y="66" font-size="13" fill="#6B675C">判断准则：闸门失败不报错——静默切 compat 回退，API 照样返回成功；「跑没跑在直通路径上」只有 nvidia-fs 计数器能证明</text>

  <!-- A · 五道闸门 -->
  <text x="48" y="100" font-size="13" font-weight="700" fill="#4A473F">A · 五道闸门（任何一道失败 → 掉进下方回退车道）</text>

  <!-- 直通车道（顶部结果条） -->
  <rect x="48" y="114" width="1144" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="620" y="136" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">全部通过 → 直通路径：盘 DMA → PCIe Switch → 显存 BAR1（主存 0 次穿越、CPU 0 拷贝）</text>
  <text x="620" y="151" font-size="10" fill="#24473F" text-anchor="middle">证据：/proc/driver/nvidia-fs/stats 的 Reads/Writes 字节数随负载增长</text>

  <!-- 闸门链 -->
  <g>
    <rect x="48" y="196" width="200" height="112" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
    <text x="148" y="218" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 驱动闸门</text>
    <text x="148" y="238" font-size="10.5" fill="#2C4460" text-anchor="middle">nvidia-fs.ko 已加载？</text>
    <text x="148" y="254" font-size="10.5" fill="#2C4460" text-anchor="middle">cuFileDriverOpen 拿到</text>
    <text x="148" y="270" font-size="10.5" fill="#2C4460" text-anchor="middle">内核支持？</text>
    <text x="148" y="292" font-size="9.5" fill="#6B675C" text-anchor="middle">查：gdscheck.py -p</text>

    <rect x="284" y="196" width="200" height="112" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
    <text x="384" y="218" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">② 文件系统闸门</text>
    <text x="384" y="238" font-size="10.5" fill="#2C4460" text-anchor="middle">ext4 / xfs（O_DIRECT）</text>
    <text x="384" y="254" font-size="10.5" fill="#2C4460" text-anchor="middle">或适配过的分布式 FS？</text>
    <text x="384" y="270" font-size="10.5" fill="#2C4460" text-anchor="middle">FUSE / NFS 常不支持</text>
    <text x="384" y="292" font-size="9.5" fill="#6B675C" text-anchor="middle">查：gdscheck 支持矩阵</text>

    <rect x="520" y="196" width="200" height="112" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
    <text x="620" y="218" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">③ IO 形状闸门</text>
    <text x="620" y="238" font-size="10.5" fill="#2C4460" text-anchor="middle">fd 带 O_DIRECT？</text>
    <text x="620" y="254" font-size="10.5" fill="#2C4460" text-anchor="middle">偏移 / 长度 / 缓冲区</text>
    <text x="620" y="270" font-size="10.5" fill="#2C4460" text-anchor="middle">4 KiB 对齐？</text>
    <text x="620" y="292" font-size="9.5" fill="#6B675C" text-anchor="middle">违反：轻则回退重则 EINVAL</text>

    <rect x="756" y="196" width="200" height="112" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
    <text x="856" y="218" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">④ 拓扑与 IOMMU 闸门</text>
    <text x="856" y="238" font-size="10.5" fill="#2C4460" text-anchor="middle">GPU↔盘 PIX / PXB？</text>
    <text x="856" y="254" font-size="10.5" fill="#2C4460" text-anchor="middle">IOMMU 关闭或</text>
    <text x="856" y="270" font-size="10.5" fill="#2C4460" text-anchor="middle">passthrough？</text>
    <text x="856" y="292" font-size="9.5" fill="#6B675C" text-anchor="middle">查：nvidia-smi topo -m</text>

    <rect x="992" y="196" width="200" height="112" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
    <text x="1092" y="218" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">⑤ 资源闸门</text>
    <text x="1092" y="238" font-size="10.5" fill="#2C4460" text-anchor="middle">BAR1 窗口还有余量？</text>
    <text x="1092" y="254" font-size="10.5" fill="#2C4460" text-anchor="middle">cuFileBufRegister</text>
    <text x="1092" y="270" font-size="10.5" fill="#2C4460" text-anchor="middle">成功？</text>
    <text x="1092" y="292" font-size="9.5" fill="#6B675C" text-anchor="middle">查：nvidia-smi -q 的 BAR1</text>
  </g>

  <!-- 闸门间通过箭头 -->
  <line x1="248" y1="252" x2="282" y2="252" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <line x1="484" y1="252" x2="518" y2="252" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <line x1="720" y1="252" x2="754" y2="252" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <line x1="956" y1="252" x2="990" y2="252" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <!-- 全过 → 直通车道 -->
  <line x1="1192" y1="252" x2="1216" y2="252" stroke="#2F6B5E" stroke-width="1.8"/>
  <line x1="1216" y1="252" x2="1216" y2="136" stroke="#2F6B5E" stroke-width="1.8"/>
  <line x1="1216" y1="136" x2="1196" y2="136" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <!-- 失败下坠箭头 -->
  <line x1="148" y1="308" x2="148" y2="356" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <line x1="384" y1="308" x2="384" y2="356" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <line x1="620" y1="308" x2="620" y2="356" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <line x1="856" y1="308" x2="856" y2="356" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <line x1="1092" y1="308" x2="1092" y2="356" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <text x="620" y="345" font-size="10" fill="#A64B3C" text-anchor="middle">失败（静默，不报错）</text>

  <!-- 回退车道 -->
  <rect x="48" y="360" width="1144" height="66" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="620" y="384" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">compat mode 回退路径：盘 DMA → 主存 bounce buffer → CPU 提交 H2D 拷贝 → 显存</text>
  <text x="620" y="402" font-size="10.5" fill="#6B4E28" text-anchor="middle">就是 8.1 §3 的传统路径——主存总线重新上账、CPU 重新参与搬运；cuFileRead 返回值与直通完全一样</text>
  <text x="620" y="418" font-size="10" fill="#8A6A3A" text-anchor="middle">证据：负载在跑、nvidia-fs 计数器纹丝不动</text>

  <!-- B · 三种结果 -->
  <text x="48" y="462" font-size="13" font-weight="700" fill="#4A473F">B · 三种结果对照——最危险的是中间那种</text>
  <g>
    <rect x="48" y="476" width="368" height="120" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
    <text x="232" y="500" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">直通成功</text>
    <text x="232" y="522" font-size="10.5" fill="#24473F" text-anchor="middle">返回读到的字节数</text>
    <text x="232" y="540" font-size="10.5" fill="#24473F" text-anchor="middle">计数器随字节数增长</text>
    <text x="232" y="564" font-size="10" fill="#4A473F" text-anchor="middle">观测：吞吐高、主机 CPU 与主存带宽</text>
    <text x="232" y="580" font-size="10" fill="#4A473F" text-anchor="middle">占用几乎为零</text>

    <rect x="436" y="476" width="368" height="120" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.6"/>
    <text x="620" y="500" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">静默回退（compat）⚠ 测试陷阱</text>
    <text x="620" y="522" font-size="10.5" fill="#6B4E28" text-anchor="middle">返回值与直通完全一样</text>
    <text x="620" y="540" font-size="10.5" fill="#6B4E28" text-anchor="middle">计数器不涨、CPU 与主存带宽被吃</text>
    <text x="620" y="564" font-size="10" fill="#6B4E28" text-anchor="middle">「装了 GDS」≠「跑在 GDS 上」：</text>
    <text x="620" y="580" font-size="10" fill="#6B4E28" text-anchor="middle">对比实验先验伪，否则两组测同一条路</text>

    <rect x="824" y="476" width="368" height="120" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
    <text x="1008" y="500" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">硬失败（返回负值）</text>
    <text x="1008" y="522" font-size="10.5" fill="#733428" text-anchor="middle">-22（EINVAL）：九成是没开 O_DIRECT</text>
    <text x="1008" y="540" font-size="10.5" fill="#733428" text-anchor="middle">或偏移 / 长度 / 缓冲没 4 KiB 对齐</text>
    <text x="1008" y="564" font-size="10" fill="#4A473F" text-anchor="middle">反而是最好处理的一种：</text>
    <text x="1008" y="580" font-size="10" fill="#4A473F" text-anchor="middle">错误可见，当场能修</text>
  </g>

  <!-- 底部流程条 -->
  <rect x="48" y="632" width="1144" height="128" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="64" y="658" font-size="12.5" font-weight="700" fill="#4A473F">上线前验证三步（顺序不可反：先证「在直通上」，再证「物理路径没打折」，最后才调参数）</text>
  <g>
    <rect x="64" y="674" width="330" height="66" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="229" y="698" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">① 支持矩阵体检</text>
    <text x="229" y="716" font-size="10" fill="#2C4460" text-anchor="middle">gdscheck.py -p 逐项看 Supported</text>
    <text x="229" y="730" font-size="10" fill="#2C4460" text-anchor="middle">驱动 / 文件系统 / IOMMU 状态</text>

    <rect x="444" y="674" width="330" height="66" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="609" y="698" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">② 拓扑核对</text>
    <text x="609" y="716" font-size="10" fill="#2C4460" text-anchor="middle">nvidia-smi topo -m：GPU↔盘要 PIX/PXB</text>
    <text x="609" y="730" font-size="10" fill="#2C4460" text-anchor="middle">PHB 打折、SYS 基本无收益</text>

    <rect x="824" y="674" width="330" height="66" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="989" y="698" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">③ 真伪核对（每轮实验都做）</text>
    <text x="989" y="716" font-size="10" fill="#24473F" text-anchor="middle">跑 gdsio / 业务负载后</text>
    <text x="989" y="730" font-size="10" fill="#24473F" text-anchor="middle">cat /proc/driver/nvidia-fs/stats 看计数器涨没涨</text>
  </g>
  <line x1="394" y1="707" x2="442" y2="707" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="774" y1="707" x2="822" y2="707" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
