<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>读一条 Type-2：主机 IP 不等于 VTEP Next Hop</title>
<desc>左侧 Type-2 NLRI 包括端点字段，右侧显示 MP_REACH Next Hop、Route Target 和封装属性，下部映射到 FDB、代理缓存与承载路由。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">读一条 Type-2：主机 IP 不等于 VTEP Next Hop</text>
<text x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">同一条通告提供多种输入；收到通告并不保证各张表都已经安装。</text>
<text x="48" y="119" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · EVPN NLRI：Type-2</text>
<rect x="48" y="134" width="560" height="315" rx="6" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="48" y="134" width="560" height="45" rx="6" fill="#EDEBE3" stroke="none" stroke-width="1.3"/>
<text x="64" y="161.5" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">字段</text>
<text x="274" y="161.5" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">教学示例值</text>
<path d="M258,134 L258,449" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,179 L608,179" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="64" y="206.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">RD</text>
<text x="274" y="206.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">10.255.0.2:100</text>
<path d="M258,134 L258,449" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,224 L608,224" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="64" y="251.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">ESI</text>
<text x="274" y="251.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">全零：单归属</text>
<path d="M258,134 L258,449" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,269 L608,269" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="64" y="296.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">Ethernet Tag ID</text>
<text x="274" y="296.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">0：本文服务模型</text>
<path d="M258,134 L258,449" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,314 L608,314" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="64" y="341.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">MAC / 长度</text>
<text x="274" y="341.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">02:00:00:00:00:22 / 48 bit</text>
<path d="M258,134 L258,449" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,359 L608,359" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="64" y="386.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">IP / 长度</text>
<text x="274" y="386.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">192.168.100.22 / 32 bit</text>
<path d="M258,134 L258,449" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,404 L608,404" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="64" y="431.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">Label 1 → VNI</text>
<text x="274" y="431.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">10100：VXLAN 映射</text>
<path d="M258,134 L258,449" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="656" y="119" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · MP_REACH 与其他路径属性</text>
<rect x="656" y="134" width="536" height="212" rx="6" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="656" y="134" width="536" height="53" rx="6" fill="#EDEBE3" stroke="none" stroke-width="1.3"/>
<text x="672" y="165.5" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">字段</text>
<text x="892" y="165.5" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">教学示例值</text>
<path d="M876,134 L876,346" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M656,187 L1192,187" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="672" y="218.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">BGP Next Hop</text>
<text x="892" y="218.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">10.255.0.2</text>
<path d="M876,134 L876,346" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M656,240 L1192,240" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="672" y="271.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">Route Target</text>
<text x="892" y="271.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">65000:10100</text>
<path d="M876,134 L876,346" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M656,293 L1192,293" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="672" y="324.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">Encapsulation</text>
<text x="892" y="324.5" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">VXLAN</text>
<path d="M876,134 L876,346" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<rect x="656" y="381" width="536" height="103" rx="8" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="677" y="411" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">RD：区分通告     RT：服务导入</text>
<text x="677" y="442" font-size="14" font-weight="400" fill="#2C4460" text-anchor="start">VNI：数据面上下文</text>
<text x="677" y="468" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">Label 字段的名字 ≠ 数据包带 MPLS 头</text>
<path d="M48,337 L32,337 L32,526 L190,526 L190,548" fill="none" stroke="#2F6B5E" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="208" y="508" font-size="13" font-weight="400" fill="#24473F" text-anchor="start">MAC + 位置</text>
<path d="M608,382 L632,382 L632,522 L620,522 L620,548" fill="none" stroke="#8A6A3A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="508" y="505" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="start">主机 IP + MAC</text>
<path d="M1192,213 L1210,213 L1210,525 L1040,525 L1040,548" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="1085" y="516" font-size="13" font-weight="400" fill="#2C4460" text-anchor="start">VTEP IP</text>
<rect x="48" y="554" width="340" height="82" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="218.0" y="578.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">远端 FDB</text>
<text x="218.0" y="600.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">BD + H2 MAC → VTEP-B</text>
<text x="218.0" y="622.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">二层目的位置</text>
<rect x="450" y="554" width="340" height="82" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="620.0" y="578.0" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">Proxy ARP / ND 状态</text>
<text x="620.0" y="600.0" font-size="14" font-weight="400" fill="#6B4E28" text-anchor="middle">H2 IP → H2 MAC</text>
<text x="620.0" y="622.0" font-size="14" font-weight="400" fill="#6B4E28" text-anchor="middle">须有有效绑定与适当策略</text>
<rect x="852" y="554" width="340" height="82" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1022.0" y="578.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">Underlay 路由解析</text>
<text x="1022.0" y="600.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">10.255.0.2 → 下一跳</text>
<text x="1022.0" y="622.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">再解析当前链路 MAC</text>
<path d="M48,655 L1192,655" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="48" y="680" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">MAC-only Type-2 的 IP 长度为 0：可以提供 MAC 位置，但不能凭空生成目标 IP 的代理绑定。示例不是设备实测输出。</text>
</svg>
