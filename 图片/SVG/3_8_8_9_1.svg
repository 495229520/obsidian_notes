<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>粘包与拆包：同一条字节流的四种切法</title>
  <desc>上半部分展示三次 send 汇成一条 13 字节的 TCP 字节流；下半部分在同一条字节流上画出正常、粘包、半包、粘包加半包四种 recv 切分结果。</desc>

  <rect x="0" y="0" width="1240" height="690" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">粘包与拆包：同一条字节流，四种切法</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">三次 send 发出 "AAAA"、"BBBBBB"、"CCC"，一共 13 字节。接收方能拿到哪几段，取决于它什么时候调用 recv</text>

  <!-- ===================== Panel A ===================== -->
  <rect x="48" y="104" width="1144" height="246" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 三次 send 进去，TCP 那一头只剩一条字节流</text>

  <rect x="300" y="152" width="220" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="410" y="171" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">send("AAAA")</text>
  <text x="410" y="188" font-size="9.5" fill="#6B675C" text-anchor="middle">4 字节</text>
  <rect x="520" y="152" width="330" height="44" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="685" y="171" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">send("BBBBBB")</text>
  <text x="685" y="188" font-size="9.5" fill="#6B675C" text-anchor="middle">6 字节</text>
  <rect x="850" y="152" width="165" height="44" rx="4" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="932" y="171" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">send("CCC")</text>
  <text x="932" y="188" font-size="9.5" fill="#6B675C" text-anchor="middle">3 字节</text>

  <line x1="410" y1="200" x2="410" y2="240" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arrN)"/>
  <line x1="685" y1="200" x2="685" y2="240" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arrN)"/>
  <line x1="932" y1="200" x2="932" y2="240" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arrN)"/>

  <text x="72" y="276" font-size="12" font-weight="700" fill="#4A473F">TCP 字节流</text>
  <rect x="300" y="246" width="715" height="50" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="355" y1="246" x2="355" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="410" y1="246" x2="410" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="465" y1="246" x2="465" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="520" y1="246" x2="520" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="575" y1="246" x2="575" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="630" y1="246" x2="630" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="685" y1="246" x2="685" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="740" y1="246" x2="740" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="795" y1="246" x2="795" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="850" y1="246" x2="850" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="905" y1="246" x2="905" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="960" y1="246" x2="960" y2="296" stroke="#C9C5B8" stroke-width="0.8"/>
  <text x="327" y="277" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">A</text>
  <text x="382" y="277" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">A</text>
  <text x="437" y="277" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">A</text>
  <text x="492" y="277" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">A</text>
  <text x="547" y="277" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">B</text>
  <text x="602" y="277" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">B</text>
  <text x="657" y="277" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">B</text>
  <text x="712" y="277" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">B</text>
  <text x="767" y="277" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">B</text>
  <text x="822" y="277" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">B</text>
  <text x="877" y="277" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">C</text>
  <text x="932" y="277" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">C</text>
  <text x="987" y="277" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">C</text>
  <text x="327" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">0</text>
  <text x="382" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">1</text>
  <text x="437" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">2</text>
  <text x="492" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">3</text>
  <text x="547" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">4</text>
  <text x="602" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">5</text>
  <text x="657" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">6</text>
  <text x="712" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">7</text>
  <text x="767" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">8</text>
  <text x="822" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">9</text>
  <text x="877" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">10</text>
  <text x="932" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">11</text>
  <text x="987" y="312" font-size="9.5" fill="#8A8578" text-anchor="middle">12</text>

  <text x="72" y="338" font-size="11" fill="#6B675C">注意这条流上已经没有任何分隔记号了。TCP 只保证这 13 个字节按序、完整地到达；哪两个字节之间是一条消息的结尾，它一无所知</text>

  <!-- ===================== Panel B ===================== -->
  <rect x="48" y="370" width="1144" height="270" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="398" font-size="15" font-weight="700" fill="#4A473F">B · 同一条字节流，recv() 可能这样切</text>

  <!-- row 1 : normal -->
  <rect x="300" y="420" width="220" height="32" fill="#E3EAF4" stroke="none"/>
  <rect x="520" y="420" width="330" height="32" fill="#DCE9E3" stroke="none"/>
  <rect x="850" y="420" width="165" height="32" fill="#F3E8D3" stroke="none"/>
  <rect x="300" y="420" width="220" height="32" rx="3" fill="none" stroke="#5A564B" stroke-width="1.8"/>
  <rect x="520" y="420" width="330" height="32" rx="3" fill="none" stroke="#5A564B" stroke-width="1.8"/>
  <rect x="850" y="420" width="165" height="32" rx="3" fill="none" stroke="#5A564B" stroke-width="1.8"/>
  <path d="M514,412 L526,412 L520,419 z" fill="#A64B3C"/>
  <path d="M844,412 L856,412 L850,419 z" fill="#A64B3C"/>
  <text x="72" y="441" font-size="12" font-weight="700" fill="#24473F">① 正常</text>
  <text x="1035" y="436" font-size="11" font-weight="700" fill="#4A473F">recv 3 次</text>
  <text x="1035" y="450" font-size="9.5" fill="#8A8578">每次恰好一条</text>

  <!-- row 2 : sticky -->
  <rect x="300" y="470" width="220" height="32" fill="#E3EAF4" stroke="none"/>
  <rect x="520" y="470" width="330" height="32" fill="#DCE9E3" stroke="none"/>
  <rect x="850" y="470" width="165" height="32" fill="#F3E8D3" stroke="none"/>
  <rect x="300" y="470" width="715" height="32" rx="3" fill="none" stroke="#5A564B" stroke-width="1.8"/>
  <text x="72" y="491" font-size="12" font-weight="700" fill="#733428">② 粘包</text>
  <text x="1035" y="486" font-size="11" font-weight="700" fill="#4A473F">recv 1 次</text>
  <text x="1035" y="500" font-size="9.5" fill="#8A8578">三条黏成一坨</text>

  <!-- row 3 : split -->
  <rect x="300" y="520" width="220" height="32" fill="#E3EAF4" stroke="none"/>
  <rect x="520" y="520" width="330" height="32" fill="#DCE9E3" stroke="none"/>
  <rect x="850" y="520" width="165" height="32" fill="#F3E8D3" stroke="none"/>
  <rect x="300" y="520" width="275" height="32" rx="3" fill="none" stroke="#5A564B" stroke-width="1.8"/>
  <rect x="575" y="520" width="440" height="32" rx="3" fill="none" stroke="#5A564B" stroke-width="1.8"/>
  <path d="M569,512 L581,512 L575,519 z" fill="#A64B3C"/>
  <text x="72" y="541" font-size="12" font-weight="700" fill="#733428">③ 半包（拆包）</text>
  <text x="1035" y="536" font-size="11" font-weight="700" fill="#4A473F">recv 2 次</text>
  <text x="1035" y="550" font-size="9.5" fill="#8A8578">B 被劈成两半</text>

  <!-- row 4 : both -->
  <rect x="300" y="570" width="220" height="32" fill="#E3EAF4" stroke="none"/>
  <rect x="520" y="570" width="330" height="32" fill="#DCE9E3" stroke="none"/>
  <rect x="850" y="570" width="165" height="32" fill="#F3E8D3" stroke="none"/>
  <rect x="300" y="570" width="330" height="32" rx="3" fill="none" stroke="#5A564B" stroke-width="1.8"/>
  <rect x="630" y="570" width="385" height="32" rx="3" fill="none" stroke="#5A564B" stroke-width="1.8"/>
  <path d="M624,562 L636,562 L630,569 z" fill="#A64B3C"/>
  <text x="72" y="591" font-size="12" font-weight="700" fill="#733428">④ 粘包 + 半包</text>
  <text x="1035" y="586" font-size="11" font-weight="700" fill="#4A473F">recv 2 次</text>
  <text x="1035" y="600" font-size="9.5" fill="#8A8578">又黏又劈</text>

  <text x="72" y="626" font-size="11" fill="#6B675C">粗黑框 = 一次 recv() 返回的内容，红色小三角 = 这次切在了哪里。四行的底层字节流完全相同，差别只在应用层什么时候来取</text>

  <text x="48" y="666" font-size="11" fill="#6B675C">TCP 这一层压根没有"包"这个东西，所以消息边界只能由应用层协议自己定义——固定长度、分隔符，或者长度前缀</text>
</svg>
