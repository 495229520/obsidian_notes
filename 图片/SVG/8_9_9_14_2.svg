<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">信封加密：大数据留在数据路径，KMS 只处理小密钥对象</title>
<desc id="desc">左侧为客户端写入和读取的两条数据路径，右侧为KMS保护边界。写入前生成数据密钥并获得包装副本；读取时先通过KMS解包，再校验解密。KMS不承载大对象。</desc>
<defs>
<marker id="arr-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A7EA4"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<text id="t0" x="48" y="49" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">信封加密：大数据留在数据路径，KMS 只处理小密钥对象</text>
<text id="t1" x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">示例采用 GenerateDataKey 风格接口；KEK 保留在 KMS 保护边界，明文 DEK 短暂存在于获授权客户端。</text>
<rect x="48" y="112" width="811" height="212" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t2" x="64" y="138" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start" data-role="section">A · 写入：先取得 DEK，再处理载荷</text>
<rect x="48" y="338" width="811" height="248" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t3" x="64" y="364" font-size="15" font-weight="700" fill="#24473F" text-anchor="start" data-role="section">B · 读取：先取得可信上下文，再解包与认证</text>
<rect x="879" y="112" width="313" height="474" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t4" x="895" y="138" font-size="15" font-weight="700" fill="#6B5B95" text-anchor="start" data-role="section">KMS 保护边界</text>
<rect x="908" y="165" width="254" height="71" rx="8" fill="#EDEAF3" stroke="#8A7EA4" stroke-width="1.2"/>
<text id="t5" x="1035.0" y="196.5" font-size="15" font-weight="700" fill="#6B5B95" text-anchor="middle" data-role="body">KEK · 版本 k7</text>
<text id="t6" x="1035.0" y="218.5" font-size="13" font-weight="400" fill="#6B5B95" text-anchor="middle" data-role="body">策略 / 审计 / 软件或 HSM</text>
<line x1="1035" y1="239" x2="1035" y2="269" stroke="#8A7EA4" stroke-width="1.7" marker-end="url(#arr-purple)"/>
<rect x="908" y="273" width="254" height="68" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t7" x="1035.0" y="303.0" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">GenerateDataKey</text>
<text id="t8" x="1035.0" y="325.0" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">返回：DEK + W</text>
<rect x="908" y="407" width="254" height="68" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text id="t9" x="1035.0" y="437.0" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">Decrypt(W, context)</text>
<text id="t10" x="1035.0" y="459.0" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">返回：明文 DEK</text>
<line x1="1035" y1="341" x2="1035" y2="403" stroke="#8A7EA4" stroke-width="1.7" stroke-dasharray="5 4"/>
<text id="t11" x="1035" y="371" font-size="13" font-weight="400" fill="#6B5B95" text-anchor="middle" data-role="body">同一密钥管理体系</text>
<text id="t12" x="907" y="513" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">W = 包装后的 DEK</text>
<text id="t13" x="907" y="539" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">权限 + context 决定是否放行</text>
<text id="t14" x="907" y="563" font-size="14" font-weight="700" fill="#733428" text-anchor="start" data-role="body">大对象 C 不经过此处</text>
<line x1="821" y1="155" x2="904" y2="155" stroke="#3D5A80" stroke-width="1.7" marker-end="url(#arr-blue)"/>
<text id="t15" x="763" y="160" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">① 请求</text>
<path d="M904,306 L878,306 L878,190 L453,190" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text id="t16" x="644" y="180" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">② DEK + W</text>
<rect x="68" y="218" width="129" height="61" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text id="t17" x="132.5" y="244.5" font-size="15" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">明文 P</text>
<text id="t18" x="132.5" y="266.5" font-size="13" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">Checkpoint</text>
<rect x="278" y="212" width="178" height="73" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text id="t19" x="367.0" y="244.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">③ AEAD.Encrypt</text>
<text id="t20" x="367.0" y="266.5" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">DEK / nonce / AAD</text>
<rect x="544" y="211" width="285" height="75" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text id="t21" x="686.5" y="244.5" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">④ 存储对象</text>
<text id="t22" x="686.5" y="266.5" font-size="13" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">C · tag · W · 版本元数据</text>
<line x1="201" y1="248" x2="274" y2="248" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr-neutral)"/>
<line x1="460" y1="248" x2="540" y2="248" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arr-green)"/>
<path d="M454,190 L454,202 L367,202 L367,208" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<line x1="718" y1="190" x2="718" y2="207" stroke="#3D5A80" stroke-width="1.7" marker-end="url(#arr-blue)"/>
<text id="t23" x="735" y="205" font-size="12" font-weight="400" fill="#2C4460" text-anchor="start" data-role="body">W</text>
<text id="t24" x="72" y="305" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="start" data-role="body">等待区间：密钥请求发出 → 明文 DEK 返回</text>
<rect x="68" y="435" width="156" height="69" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text id="t25" x="146.0" y="465.5" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">① 取回对象</text>
<text id="t26" x="146.0" y="487.5" font-size="13" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">密文 + 包装元数据</text>
<rect x="306" y="435" width="224" height="69" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text id="t27" x="418.0" y="465.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">③ AEAD.Decrypt</text>
<text id="t28" x="418.0" y="487.5" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">DEK + 期望的 AAD</text>
<rect x="648" y="435" width="180" height="69" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text id="t29" x="738.0" y="465.5" font-size="15" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">④ 释放明文 P</text>
<text id="t30" x="738.0" y="487.5" font-size="13" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">认证成功之后</text>
<line x1="228" y1="470" x2="302" y2="470" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr-neutral)"/>
<line x1="534" y1="470" x2="644" y2="470" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arr-green)"/>
<text id="t31" x="590" y="454" font-size="12" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">tag 通过</text>
<path d="M147,431 L147,390 L892,390 L892,440 L904,440" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text id="t32" x="259" y="380" font-size="13" font-weight="400" fill="#2C4460" text-anchor="start" data-role="body">② W + context → 授权解包</text>
<path d="M904,463 L876,463 L876,527 L418,527 L418,508" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-green)"/>
<text id="t33" x="693" y="551" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">返回 DEK；校验失败则停止</text>
<text id="t34" x="71" y="550" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">AAD：绑定租户 / 对象 / 代次 / 分块语义</text>
<text id="t35" x="71" y="573" font-size="12" font-weight="400" fill="#733428" text-anchor="start" data-role="body">读取对端提供的字段，不等于已信任该字段</text>
<rect x="48" y="618" width="1144" height="54" rx="7" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t36" x="64" y="641" font-size="14" font-weight="700" fill="#4A473F" text-anchor="start" data-role="footer">密钥生命周期：按需获取 → 最小作用域使用 → 有界缓存 → 清除；绝不把明文 DEK 当对象元数据落盘。</text>
<text id="t37" x="64" y="662" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">教学模型 · Wrap/Decrypt 为机制抽象，实际 API 与包装格式依 KMS 而异 · 对应笔记 §3、§4、§6</text>
</svg>