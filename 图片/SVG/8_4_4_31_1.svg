<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<title id="title">UCX 的层次与对象：Worker 不是线程，Endpoint 不是 QP</title>
<desc id="desc">左侧展示UCP Context内两个Worker及其Endpoint，再到UCT和UCS；右侧分开通信地址交换与RMA地址key交换。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="720" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">UCX 的层次与对象：Worker 不是线程，Endpoint 不是 QP</text>
<text x="48" y="76" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">UCX v1.19.0 · e4636149592d · 显式进度</text>
<line x1="48" y1="96" x2="1192" y2="96" stroke="#D8D5C8" stroke-width="1"/>
<text x="68" y="126" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">A · 本地进程的对象归属</text>
<text x="842" y="126" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">B · 两类地址交换</text>
<rect x="66" y="145" width="704" height="267" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="84" y="175" font-size="16" fill="#2C4460" text-anchor="start" font-weight="700" data-role="body">UCP Context</text>
<text x="255" y="175" font-size="13" fill="#2C4460" text-anchor="start" font-weight="400" data-role="body">features / 配置 / 共享资源</text>
<rect x="90" y="196" width="318" height="190" rx="8" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.2"/>
<text x="110" y="226" font-size="15" fill="#2C4460" text-anchor="start" font-weight="700" data-role="body">Worker A</text>
<text x="110" y="252" font-size="13" fill="#2C4460" text-anchor="start" font-weight="400" data-role="body">进度状态 / 请求 / 资源</text>
<rect x="112" y="277" width="274" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="249.0" y="304.55" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">Endpoint → 远端 worker</text>
<text x="112" y="360" font-size="13" fill="#3D5A80" text-anchor="start" font-weight="400" data-role="body">lane 0 / lane 1 / …</text>
<rect x="426" y="196" width="318" height="190" rx="8" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.2"/>
<text x="446" y="226" font-size="15" fill="#2C4460" text-anchor="start" font-weight="700" data-role="body">Worker B</text>
<text x="446" y="252" font-size="13" fill="#2C4460" text-anchor="start" font-weight="400" data-role="body">进度状态 / 请求 / 资源</text>
<rect x="448" y="277" width="274" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="585.0" y="304.55" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">Endpoint → 远端 worker</text>
<text x="448" y="360" font-size="13" fill="#3D5A80" text-anchor="start" font-weight="400" data-role="body">lane 0 / lane 1 / …</text>
<rect x="844" y="153" width="324" height="86" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="1006.0" y="178.9" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">worker address</text>
<text x="1006.0" y="200.9" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">带外交换 → ucp_ep_create</text>
<text x="1006.0" y="222.9" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">用于通信连接</text>
<rect x="844" y="293" width="324" height="112" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1006.0" y="320.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">远端内存描述</text>
<text x="1006.0" y="342.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">address + length + packed rkey</text>
<text x="1006.0" y="364.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">ucp_ep_rkey_unpack</text>
<text x="1006.0" y="386.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">用于 RMA 访问</text>
<polyline points="744,300 805,300 805,197 841,197" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="66" y="444" width="704" height="98" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="84" y="471" font-size="15" fill="#24473F" text-anchor="start" font-weight="700" data-role="body">UCT · 传输原语与具体能力</text>
<rect x="86" y="484" width="148" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="160.0" y="508.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">RDMA</text>
<rect x="251" y="484" width="148" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="325.0" y="508.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">TCP</text>
<rect x="416" y="484" width="148" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="490.0" y="508.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">共享内存</text>
<rect x="581" y="484" width="167" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="664.5" y="508.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">设备 / transport</text>
<line x1="247" y1="413" x2="247" y2="440" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="585" y1="413" x2="585" y2="440" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="66" y="568" width="704" height="52" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="418.0" y="598.9" font-size="14" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">UCS · 内存池 / 配置 / 锁 / 基础异步事件</text>
<rect x="844" y="461" width="324" height="129" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
<text x="1006.0" y="508.4" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">应用安排线程与 progress</text>
<text x="1006.0" y="530.4" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body">UCP 选择协议 / lanes</text>
<text x="1006.0" y="552.4" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body">底层不必只有 RDMA</text>
<line x1="48" y1="650" x2="1192" y2="650" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="676" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">一对多：context → workers；endpoint → lanes。</text>
<text x="48" y="697" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">地址与 key 各司其职；辅助事件不提供通用后台进度保证。</text>
</svg>