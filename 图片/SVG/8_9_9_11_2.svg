<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">NVMe PI 与应用摘要：内容、位置、身份分别检查</title><desc id="desc">上半部对照传统 PI 和应用对象封装；下半部说明每项证据不能替代什么。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">NVMe PI 与应用摘要：内容、位置、身份分别检查</text>
<text x="48" y="80" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">上半部对照传统 PI 和应用对象封装；下半部说明每项证据不能替代什么。</text>
<rect x="48" y="108" width="600" height="285" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="66" y="137" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">A · 传统 PI：8 字节 / 16-bit Guard</text>
<rect x="70" y="157" width="553" height="40" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
<text x="346.5" y="182.0" font-size="14" fill="#4A473F" font-weight="600" text-anchor="middle">受保护的数据块（与对应 PI 关联）</text>
<rect x="70" y="215" width="138" height="68" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="139.0" y="242" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Guard</text>
<text x="139.0" y="265" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle">16 bit</text>
<rect x="208" y="215" width="138" height="68" rx="0" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="277.0" y="242" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">Application</text>
<text x="277.0" y="265" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">16 bit</text>
<rect x="346" y="215" width="277" height="68" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="484.5" y="242" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Reference</text>
<text x="484.5" y="265" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">32 bit</text>
<text x="139" y="309" font-size="13" fill="#2C4460" font-weight="600" text-anchor="middle">内容检查</text>
<text x="277" y="309" font-size="13" fill="#6B4E28" font-weight="600" text-anchor="middle">上层标签</text>
<text x="484" y="309" font-size="13" fill="#24473F" font-weight="600" text-anchor="middle">位置 / 顺序（依模式）</text>
<line x1="484" y1="316" x2="484" y2="334" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="360" y="337" width="245" height="34" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="482.5" y="359.0" font-size="12.5" fill="#24473F" font-weight="600" text-anchor="middle">对照本次 I/O 的期望位置</text>
<text x="70" y="365" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">不是所有 PI 格式都长这样</text>
<rect x="672" y="108" width="520" height="285" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="690" y="137" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">B · 应用对象：绑定内容与身份</text>
<rect x="694" y="160" width="225" height="46" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="806.5" y="188.0" font-size="13" fill="#6B4E28" font-weight="600" text-anchor="middle">job / epoch / tensor</text>
<rect x="935" y="160" width="235" height="46" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="1052.5" y="188.0" font-size="12.5" fill="#6B4E28" font-weight="600" text-anchor="middle">shard / index / offset / len</text>
<rect x="694" y="225" width="476" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="932.0" y="253.0" font-size="14" fill="#2C4460" font-weight="600" text-anchor="middle">d = H(稳定的存储字节)</text>
<path d="M 806,208 L 806,216 L 680,216 L 680,324 L 701,324" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1050,208 L 1050,216 L 1180,216 L 1180,324 L 1169,324" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<line x1="932" y1="273" x2="932" y2="299" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="706" y="300" width="452" height="48" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="932.0" y="329.0" font-size="14" fill="#24473F" font-weight="600" text-anchor="middle">Leaf = H(域 + 描述符 + d)</text>
<text x="932" y="376" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle">再由受信 manifest 规定完整集合与版本</text>
<text x="65" y="428" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">通过了什么</text>
<text x="350" y="428" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">增加的证据</text>
<text x="777" y="428" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">仍然不能推出</text>
<line x1="55" y1="439" x2="1185" y2="439" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="466" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">Guard 检查</text>
<text x="350" y="466" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">数据与 Guard 自洽</text>
<text x="777" y="466" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">LBA / epoch 一定正确</text>
<line x1="55" y1="485" x2="1185" y2="485" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="512" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">Reference 检查</text>
<text x="350" y="512" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">符合本次块位置期望</text>
<text x="777" y="512" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">软件原始地址意图一定正确</text>
<line x1="55" y1="531" x2="1185" y2="531" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="558" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">应用绑定 + 受信 manifest</text>
<text x="350" y="558" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">内容、身份与预期集合匹配</text>
<text x="777" y="558" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">已经持久化 / 计算本身正确</text>
<text x="48" y="638" font-size="13" fill="#2B2A26" font-weight="500" text-anchor="start">增强 PI 可采用 16 字节格式及 32/64-bit Guard；“16 字节 PI”不是“16-bit Guard”。</text>
<text x="48" y="660" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="start">能力、当前格式、metadata 传递和命令检查开关，必须分别核对。</text>
</svg>
