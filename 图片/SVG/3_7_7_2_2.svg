<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>CIDR 与子网掩码：网络位由掩码决定</title>
  <desc>用 192.168.10.130/26 演算一次 IP 与掩码的按位与，得出网络号、可用主机范围与广播地址；再用同一掩码判断两台主机是否同网段，并给出前缀长度、点分掩码与可用主机数的对照表。</desc>

  <rect x="0" y="0" width="1240" height="740" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">CIDR：网络位有多长，由掩码说了算</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">首字节只决定历史上的类别；今天判断同网段，靠 IP 与子网掩码按位与</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="316" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 一次按位与的完整演算：192.168.10.130/26</text>

  <text x="364" y="162" font-size="10.5" fill="#6B675C" text-anchor="middle">第 1 字节</text>
  <text x="588" y="162" font-size="10.5" fill="#6B675C" text-anchor="middle">第 2 字节</text>
  <text x="812" y="162" font-size="10.5" fill="#6B675C" text-anchor="middle">第 3 字节</text>
  <text x="1036" y="162" font-size="10.5" fill="#6B675C" text-anchor="middle">第 4 字节</text>

  <!-- /26 边界 -->
  <line x1="984" y1="170" x2="984" y2="344" stroke="#A64B3C" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="1062" y="356" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">↑ 主机位 6 位</text>
  <text x="944" y="356" font-size="10.5" font-weight="700" fill="#4A3F68" text-anchor="end">网络位 26 位 ↑</text>

  <!-- r1 IP -->
  <text x="76" y="191" font-size="11.5" font-weight="700" fill="#2C4460">IP 地址</text>
  <text x="76" y="206" font-size="11" fill="#4A473F">192.168.10.130</text>
  <rect x="260" y="176" width="208" height="34" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="364" y="198" font-size="12" fill="#4A3F68" text-anchor="middle">1 1 0 0 0 0 0 0</text>
  <rect x="484" y="176" width="208" height="34" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="588" y="198" font-size="12" fill="#4A3F68" text-anchor="middle">1 0 1 0 1 0 0 0</text>
  <rect x="708" y="176" width="208" height="34" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="812" y="198" font-size="12" fill="#4A3F68" text-anchor="middle">0 0 0 0 1 0 1 0</text>
  <rect x="932" y="176" width="52" height="34" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="958" y="198" font-size="12" fill="#4A3F68" text-anchor="middle">1 0</text>
  <rect x="984" y="176" width="156" height="34" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1062" y="198" font-size="12" fill="#2C4460" text-anchor="middle">0 0 0 0 1 0</text>

  <!-- r2 掩码 -->
  <text x="76" y="233" font-size="11.5" font-weight="700" fill="#24473F">子网掩码 /26</text>
  <text x="76" y="248" font-size="11" fill="#4A473F">255.255.255.192</text>
  <rect x="260" y="218" width="208" height="34" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="364" y="240" font-size="12" fill="#24473F" text-anchor="middle">1 1 1 1 1 1 1 1</text>
  <rect x="484" y="218" width="208" height="34" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="588" y="240" font-size="12" fill="#24473F" text-anchor="middle">1 1 1 1 1 1 1 1</text>
  <rect x="708" y="218" width="208" height="34" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="812" y="240" font-size="12" fill="#24473F" text-anchor="middle">1 1 1 1 1 1 1 1</text>
  <rect x="932" y="218" width="52" height="34" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="958" y="240" font-size="12" fill="#24473F" text-anchor="middle">1 1</text>
  <rect x="984" y="218" width="156" height="34" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1062" y="240" font-size="12" fill="#4A473F" text-anchor="middle">0 0 0 0 0 0</text>

  <!-- r3 网络号 -->
  <text x="76" y="275" font-size="11.5" font-weight="700" fill="#733428">按位与 = 网络号</text>
  <text x="76" y="290" font-size="11" fill="#4A473F">192.168.10.128</text>
  <rect x="260" y="260" width="208" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="364" y="282" font-size="12" fill="#6B4E28" text-anchor="middle">1 1 0 0 0 0 0 0</text>
  <rect x="484" y="260" width="208" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="588" y="282" font-size="12" fill="#6B4E28" text-anchor="middle">1 0 1 0 1 0 0 0</text>
  <rect x="708" y="260" width="208" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="812" y="282" font-size="12" fill="#6B4E28" text-anchor="middle">0 0 0 0 1 0 1 0</text>
  <rect x="932" y="260" width="52" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="958" y="282" font-size="12" fill="#6B4E28" text-anchor="middle">1 0</text>
  <rect x="984" y="260" width="156" height="34" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1062" y="282" font-size="12" fill="#4A473F" text-anchor="middle">0 0 0 0 0 0</text>

  <!-- r4 广播 -->
  <text x="76" y="317" font-size="11.5" font-weight="700" fill="#733428">主机位置全 1</text>
  <text x="76" y="332" font-size="11" fill="#4A473F">192.168.10.191</text>
  <rect x="260" y="302" width="208" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="364" y="324" font-size="12" fill="#6B4E28" text-anchor="middle">1 1 0 0 0 0 0 0</text>
  <rect x="484" y="302" width="208" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="588" y="324" font-size="12" fill="#6B4E28" text-anchor="middle">1 0 1 0 1 0 0 0</text>
  <rect x="708" y="302" width="208" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="812" y="324" font-size="12" fill="#6B4E28" text-anchor="middle">0 0 0 0 1 0 1 0</text>
  <rect x="932" y="302" width="52" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="958" y="324" font-size="12" fill="#6B4E28" text-anchor="middle">1 0</text>
  <rect x="984" y="302" width="156" height="34" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1062" y="324" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">1 1 1 1 1 1</text>

  <!-- 结果条 -->
  <rect x="76" y="372" width="340" height="32" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="246" y="393" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">网络号 192.168.10.128</text>
  <rect x="424" y="372" width="400" height="32" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="624" y="393" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">可用 .129 – .190，共 2⁶ − 2 = 62 台</text>
  <rect x="832" y="372" width="332" height="32" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="998" y="393" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">广播 192.168.10.191</text>

  <!-- ================= Panel B ================= -->
  <rect x="48" y="436" width="552" height="212" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="462" font-size="15" font-weight="700" fill="#4A473F">B · 两台主机在不在同一网段</text>

  <rect x="72" y="476" width="504" height="30" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="88" y="496" font-size="11.5" fill="#2C4460">主机 A　192.168.10.130/26　→　网络号 .128</text>
  <rect x="72" y="512" width="504" height="30" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="88" y="532" font-size="11.5" fill="#2C4460">主机 B　192.168.10.200/26　→　网络号 .192</text>

  <rect x="72" y="552" width="504" height="72" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="88" y="574" font-size="12" font-weight="700" fill="#733428">两个网络号不同 → 不在同一网段</text>
  <text x="88" y="596" font-size="11.5" fill="#733428">A 发给 B 的包要先交给默认网关</text>
  <text x="88" y="616" font-size="11.5" fill="#733428">点分十进制看着只差 70，位上却跨段了</text>

  <!-- ================= Panel C ================= -->
  <rect x="616" y="436" width="576" height="212" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="640" y="462" font-size="15" font-weight="700" fill="#4A473F">C · 前缀长度与可用主机数</text>

  <rect x="640" y="476" width="528" height="26" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="640" y="502" width="528" height="26" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="640" y="528" width="528" height="26" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="640" y="554" width="528" height="26" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <rect x="640" y="580" width="528" height="26" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="640" y="606" width="528" height="26" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <line x1="740" y1="476" x2="740" y2="632" stroke="#9B968A" stroke-width="1"/>
  <line x1="980" y1="476" x2="980" y2="632" stroke="#9B968A" stroke-width="1"/>

  <text x="690" y="494" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">前缀</text>
  <text x="860" y="494" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">点分掩码</text>
  <text x="1074" y="494" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">可用主机数</text>

  <text x="690" y="520" font-size="11" fill="#4A473F" text-anchor="middle">/24</text>
  <text x="860" y="520" font-size="11" fill="#4A473F" text-anchor="middle">255.255.255.0</text>
  <text x="1074" y="520" font-size="11" fill="#4A473F" text-anchor="middle">254</text>

  <text x="690" y="546" font-size="11" fill="#4A473F" text-anchor="middle">/25</text>
  <text x="860" y="546" font-size="11" fill="#4A473F" text-anchor="middle">255.255.255.128</text>
  <text x="1074" y="546" font-size="11" fill="#4A473F" text-anchor="middle">126</text>

  <text x="690" y="572" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">/26</text>
  <text x="860" y="572" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">255.255.255.192</text>
  <text x="1074" y="572" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">62</text>

  <text x="690" y="598" font-size="11" fill="#4A473F" text-anchor="middle">/27</text>
  <text x="860" y="598" font-size="11" fill="#4A473F" text-anchor="middle">255.255.255.224</text>
  <text x="1074" y="598" font-size="11" fill="#4A473F" text-anchor="middle">30</text>

  <text x="690" y="624" font-size="11" fill="#4A473F" text-anchor="middle">/30</text>
  <text x="860" y="624" font-size="11" fill="#4A473F" text-anchor="middle">255.255.255.252</text>
  <text x="1074" y="624" font-size="11" fill="#4A473F" text-anchor="middle">2</text>

  <text x="48" y="678" font-size="11.5" fill="#4A473F">掩码必须是「前面连续一串 1，后面全 0」，所以只有 33 种合法掩码，写成 /0 到 /32；255.255.0.255 这种交错的形式不合法。</text>
  <text x="48" y="700" font-size="11.5" fill="#4A473F">/30 只剩 2 个可用地址，正好够一条点对点链路的两端，是路由器互联口的常用配置。</text>
</svg>
