<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#4f6f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .subtitle { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .box-title { font: 700 17px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .box-text { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #31465a; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .kernel { fill: #fff8e8; stroke: #d49b38; stroke-width: 2; rx: 18; }
      .fd { fill: #fff0f0; stroke: #c96b6b; stroke-width: 2; rx: 18; }
      .poller { fill: #f0f6ff; stroke: #2f7ab8; stroke-width: 2.2; rx: 18; }
      .loop { fill: #edf7ed; stroke: #4f8f55; stroke-width: 2.4; rx: 20; }
      .note { fill: #fffdf5; stroke: #c6b178; stroke-width: 1.5; rx: 14; }
      .line { stroke: #4f6f8f; stroke-width: 2.2; fill: none; marker-end: url(#arrow-hollow); }
      .soft-line { stroke: #7b8b9b; stroke-width: 1.8; fill: none; marker-end: url(#arrow-hollow); }
      .dash { stroke: #8a98a8; stroke-width: 1.6; stroke-dasharray: 7 7; fill: none; }
    </style>
  </defs>

  <text x="500" y="48" text-anchor="middle" class="title">timerfd：把定时器到期纳入 epoll</text>
  <text x="500" y="76" text-anchor="middle" class="subtitle">时间事件先让 timerfd 可读，再由 EventLoop 读取到期次数并执行回调</text>

  <rect x="80" y="132" width="230" height="94" class="loop"/>
  <text x="195" y="164" text-anchor="middle" class="box-title">设置定时任务</text>
  <text x="195" y="188" text-anchor="middle" class="box-text">timerfd_settime()</text>
  <text x="195" y="209" text-anchor="middle" class="small">一次性或周期触发</text>

  <rect x="386" y="132" width="230" height="94" class="kernel"/>
  <text x="501" y="164" text-anchor="middle" class="box-title">内核定时器</text>
  <text x="501" y="188" text-anchor="middle" class="box-text">CLOCK_MONOTONIC</text>
  <text x="501" y="209" text-anchor="middle" class="small">按到期时间计数</text>

  <rect x="690" y="132" width="230" height="94" class="fd"/>
  <text x="805" y="164" text-anchor="middle" class="box-title">timerfd 可读</text>
  <text x="805" y="188" text-anchor="middle" class="box-text">expirations += n</text>
  <text x="805" y="209" text-anchor="middle" class="small">到期次数累加</text>

  <path d="M 310 179 L 384 179" class="line"/>
  <path d="M 616 179 L 688 179" class="line"/>

  <rect x="116" y="318" width="210" height="94" class="poller"/>
  <text x="221" y="350" text-anchor="middle" class="box-title">epoll_wait()</text>
  <text x="221" y="374" text-anchor="middle" class="box-text">返回 EPOLLIN</text>
  <text x="221" y="395" text-anchor="middle" class="small">timerfd 进入就绪列表</text>

  <rect x="395" y="318" width="210" height="94" class="fd"/>
  <text x="500" y="350" text-anchor="middle" class="box-title">read(timerfd)</text>
  <text x="500" y="374" text-anchor="middle" class="box-text">读取 uint64_t</text>
  <text x="500" y="395" text-anchor="middle" class="small">得到累计到期次数</text>

  <rect x="674" y="318" width="210" height="94" class="loop"/>
  <text x="779" y="350" text-anchor="middle" class="box-title">timer callback</text>
  <text x="779" y="374" text-anchor="middle" class="box-text">执行到期任务</text>
  <text x="779" y="395" text-anchor="middle" class="small">必要时重新设置 timerfd</text>

  <path d="M 805 226 C 805 276 221 266 221 316" class="line"/>
  <path d="M 326 365 L 393 365" class="line"/>
  <path d="M 605 365 L 672 365" class="line"/>

  <path d="M 779 412 C 805 472 605 502 520 430" class="soft-line"/>
  <text x="690" y="488" text-anchor="middle" class="small">周期任务或最近到期时间变化时，重新 arm timerfd</text>

  <rect x="95" y="482" width="380" height="76" class="note"/>
  <text x="285" y="512" text-anchor="middle" class="box-title">timerfd 负责“最近一次唤醒”</text>
  <text x="285" y="537" text-anchor="middle" class="small">多个业务定时任务仍需要 timer queue / 最小堆 / 时间轮管理</text>

  <rect x="560" y="482" width="345" height="76" class="note"/>
  <text x="732" y="512" text-anchor="middle" class="box-title">必须读取到期次数</text>
  <text x="732" y="537" text-anchor="middle" class="small">read 后 fd 才不再持续保持可读</text>

  <path d="M 501 226 C 501 260 500 284 500 316" class="dash"/>
</svg>
