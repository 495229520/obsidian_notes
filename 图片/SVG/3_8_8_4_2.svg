<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 706" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>一次完整会话的三层泳道</title>
  <desc>把服务器进程、内核、客户端进程三条泳道并排，按六个阶段推进一次迭代服务器会话；并给出四个阻塞调用各自的返回时机与返回值检查要点。</desc>

  <rect x="0" y="0" width="1240" height="706" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">一次完整会话：谁在阻塞，内核在干什么</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">三次握手由内核独立完成，与服务器进程是否调用 accept 无关；服务器只是从队列里取结果</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="104" width="1144" height="340" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="15" font-weight="700" fill="#4A473F">A · 六个阶段横向推进</text>

  <text x="276" y="158" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">① 建立监听</text>
  <text x="436" y="158" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">② 等连接</text>
  <text x="596" y="158" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">③ 三次握手</text>
  <text x="756" y="158" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">④ 取出连接</text>
  <text x="916" y="158" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">⑤ 收发数据</text>
  <text x="1076" y="158" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">⑥ 关闭</text>

  <!-- lane: server -->
  <rect x="72" y="168" width="1080" height="68" rx="6" fill="#F3F2EB"/>
  <text x="88" y="196" font-size="12" font-weight="700" fill="#4A473F">服务器</text>
  <text x="88" y="214" font-size="12" font-weight="700" fill="#4A473F">进程</text>

  <rect x="200" y="176" width="152" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="276" y="197" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">socket / bind</text>
  <text x="276" y="215" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">listen</text>

  <rect x="360" y="176" width="312" height="52" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="516" y="197" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">accept() 阻塞</text>
  <text x="516" y="215" font-size="10.5" fill="#6B4E28" text-anchor="middle">进程睡眠，不占 CPU</text>

  <rect x="680" y="176" width="152" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="756" y="197" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">accept 返回</text>
  <text x="756" y="215" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">connfd</text>

  <rect x="840" y="176" width="152" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="916" y="197" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">recv() / send()</text>
  <text x="916" y="215" font-size="10.5" fill="#24473F" text-anchor="middle">走 connfd</text>

  <rect x="1000" y="176" width="152" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1076" y="197" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">close(connfd)</text>
  <text x="1076" y="215" font-size="10.5" fill="#24473F" text-anchor="middle">回到 ②</text>

  <!-- lane: kernel -->
  <rect x="72" y="244" width="1080" height="86" rx="6" fill="#EDEAF3"/>
  <text x="88" y="282" font-size="12" font-weight="700" fill="#6B5B95">内核</text>
  <text x="88" y="300" font-size="12" font-weight="700" fill="#6B5B95">TCP 栈</text>

  <rect x="200" y="252" width="152" height="70" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="276" y="274" font-size="11" fill="#4A473F" text-anchor="middle">监听 fd 就位</text>
  <text x="276" y="294" font-size="11" fill="#4A473F" text-anchor="middle">两个队列建好</text>
  <text x="276" y="312" font-size="10.5" fill="#6B675C" text-anchor="middle">状态 LISTEN</text>

  <rect x="360" y="252" width="152" height="70" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="436" y="284" font-size="11" fill="#4A473F" text-anchor="middle">队列空</text>
  <text x="436" y="304" font-size="11" fill="#4A473F" text-anchor="middle">没有可唤醒的</text>

  <rect x="520" y="252" width="152" height="70" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="596" y="274" font-size="11" font-weight="700" fill="#6B5B95" text-anchor="middle">SYN → SYN+ACK</text>
  <text x="596" y="294" font-size="11" font-weight="700" fill="#6B5B95" text-anchor="middle">→ ACK</text>
  <text x="596" y="312" font-size="10.5" fill="#6B5B95" text-anchor="middle">入全连接队列</text>

  <rect x="680" y="252" width="152" height="70" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="756" y="284" font-size="11" fill="#4A473F" text-anchor="middle">出队一项</text>
  <text x="756" y="304" font-size="11" fill="#4A473F" text-anchor="middle">分配新 fd</text>

  <rect x="840" y="252" width="152" height="70" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="916" y="284" font-size="11" fill="#4A473F" text-anchor="middle">收发缓冲区</text>
  <text x="916" y="304" font-size="11" fill="#4A473F" text-anchor="middle">中转、重传、排序</text>

  <rect x="1000" y="252" width="152" height="70" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="1076" y="284" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">四次挥手</text>
  <text x="1076" y="304" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">主动方进 TIME_WAIT</text>

  <!-- lane: client -->
  <rect x="72" y="338" width="1080" height="68" rx="6" fill="#F3F2EB"/>
  <text x="88" y="366" font-size="12" font-weight="700" fill="#4A473F">客户端</text>
  <text x="88" y="384" font-size="12" font-weight="700" fill="#4A473F">进程</text>

  <rect x="520" y="346" width="152" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="596" y="367" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">socket()</text>
  <text x="596" y="385" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">connect() 阻塞</text>

  <rect x="680" y="346" width="152" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="756" y="376" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">connect 返回</text>

  <rect x="840" y="346" width="152" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="916" y="376" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">send() / recv()</text>

  <rect x="1000" y="346" width="152" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1076" y="376" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">close()</text>

  <path d="M596 340 L596 328" stroke="#6B5B95" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M756 250 L756 234" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="72" y="428" font-size="11.5" font-weight="700" fill="#2C4460">③ 处 connect 已返回成功，而服务器进程仍停在 accept 上没醒</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="460" width="1144" height="190" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="490" font-size="15" font-weight="700" fill="#4A473F">B · 四个阻塞点，返回值该怎么读</text>

  <text x="88" y="514" font-size="11" font-weight="700" fill="#6B675C">调用</text>
  <text x="230" y="514" font-size="11" font-weight="700" fill="#6B675C">什么时候返回</text>
  <text x="560" y="514" font-size="11" font-weight="700" fill="#6B675C">返回值必须检查什么</text>
  <path d="M72 522 L1168 522" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="72" y="528" width="1096" height="28" fill="#EFE7DA"/>
  <text x="88" y="547" font-size="11.5" font-weight="700" fill="#6B4E28">accept()</text>
  <text x="230" y="547" font-size="11" fill="#6B4E28">全连接队列非空</text>
  <text x="560" y="547" font-size="11" fill="#6B4E28">返回 −1 且 errno 为 EINTR 时要重试，不能当致命错误</text>

  <rect x="72" y="558" width="1096" height="28" fill="#E3EAF4"/>
  <text x="88" y="577" font-size="11.5" font-weight="700" fill="#2C4460">recv()</text>
  <text x="230" y="577" font-size="11" fill="#2C4460">接收缓冲区有数据</text>
  <text x="560" y="577" font-size="11" fill="#2C4460">返回 0 是对端已关闭；返回值可能小于请求长度</text>

  <rect x="72" y="588" width="1096" height="28" fill="#E3EAF4"/>
  <text x="88" y="607" font-size="11.5" font-weight="700" fill="#2C4460">send()</text>
  <text x="230" y="607" font-size="11" fill="#2C4460">数据拷进发送缓冲区</text>
  <text x="560" y="607" font-size="11" fill="#2C4460">返回值可能小于 len，剩下的要继续发，不是发完了</text>

  <rect x="72" y="618" width="1096" height="28" fill="#F0E0DB"/>
  <text x="88" y="637" font-size="11.5" font-weight="700" fill="#733428">close()</text>
  <text x="230" y="637" font-size="11" fill="#733428">立即</text>
  <text x="560" y="637" font-size="11" fill="#733428">输出缓冲区内核继续发完，输入缓冲区里没读的直接丢弃</text>

  <text x="48" y="682" font-size="12" fill="#6B675C">口径：以阻塞式套接字为准。非阻塞模式下这四个调用都可能立刻返回 EAGAIN / EINPROGRESS，处理方式见 8.12</text>
</svg>
