<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1240" height="820" fill="rgb(245, 244, 237)"/>

  <!-- Page Title & Subtitle -->
  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">一次完整会话：谁在阻塞，内核在干什么</text>
  <text x="48" y="76" font-size="13" fill="#6B675C">三次握手由内核异步完成，客户端 connect() 先行就绪；服务端阻塞在 accept()，连接移入全连接队列后才被唤醒</text>

  <!-- ============ Panel A: 泳道图 ============ -->
  <rect x="48" y="98" width="1144" height="436" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="126" font-size="15" font-weight="700" fill="#4A473F">A · 六个阶段推进（客户端 / 内核 / 服务端泳道交互）</text>

  <!-- Phase Chips -->
  <rect x="235" y="138" width="110" height="24" rx="12" fill="#EAE7DC"/>
  <text x="290" y="154" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">① 建立监听</text>

  <rect x="395" y="138" width="110" height="24" rx="12" fill="#EAE7DC"/>
  <text x="450" y="154" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">② 等待连接</text>

  <rect x="555" y="138" width="110" height="24" rx="12" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1"/>
  <text x="610" y="154" font-size="11.5" font-weight="700" fill="#8A5A00" text-anchor="middle">③ 内核异步握手</text>

  <rect x="715" y="138" width="110" height="24" rx="12" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="770" y="154" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">④ 取出连接就绪</text>

  <rect x="875" y="138" width="110" height="24" rx="12" fill="#EAE7DC"/>
  <text x="930" y="154" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">⑤ 收发业务数据</text>

  <rect x="1035" y="138" width="110" height="24" rx="12" fill="#EAE7DC"/>
  <text x="1090" y="154" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">⑥ 挥手关闭连接</text>

  <!-- Vertical Phase Column Separators -->
  <line x1="370" y1="168" x2="370" y2="462" stroke="#E5E2D6" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="530" y1="168" x2="530" y2="462" stroke="#E5E2D6" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="690" y1="168" x2="690" y2="462" stroke="#E5E2D6" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="850" y1="168" x2="850" y2="462" stroke="#E5E2D6" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1010" y1="168" x2="1010" y2="462" stroke="#E5E2D6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Swimlane 1: 服务端进程 (用户态) -->
  <rect x="68" y="174" width="1104" height="80" rx="6" fill="#F4F2EC" stroke="#DCD9CD" stroke-width="1"/>
  <text x="134" y="210" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">服务端进程</text>
  <text x="134" y="230" font-size="11" fill="#6B675C" text-anchor="middle">用户空间</text>

  <rect x="218" y="186" width="144" height="56" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="290" y="210" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">socket / bind / listen</text>
  <text x="290" y="228" font-size="11" fill="#4A6572" text-anchor="middle">创建并初始化监听 fd</text>

  <rect x="378" y="186" width="304" height="56" rx="6" fill="#FAF6EE" stroke="#B07D2B" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="530" y="210" font-size="12.5" font-weight="700" fill="#8A5A00" text-anchor="middle">accept() 阻塞睡眠 (TASK_INTERRUPTIBLE)</text>
  <text x="530" y="228" font-size="11" fill="#6B4E28" text-anchor="middle">全连接队列暂空 · 进程让出 CPU · 期间客户端握手对其完全透明</text>

  <rect x="698" y="186" width="144" height="56" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="770" y="210" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">accept() 唤醒返回</text>
  <text x="770" y="228" font-size="11" fill="#24473F" text-anchor="middle">分配并返回 connfd</text>

  <rect x="858" y="186" width="144" height="56" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="930" y="210" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">recv() / send()</text>
  <text x="930" y="228" font-size="11" fill="#24473F" text-anchor="middle">读写业务数据 (走 connfd)</text>

  <rect x="1018" y="186" width="144" height="56" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1090" y="210" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">close(connfd)</text>
  <text x="1090" y="228" font-size="11" fill="#733428" text-anchor="middle">断开连接，循环回 ②</text>

  <!-- Swimlane 2: 内核 TCP 协议栈 -->
  <rect x="68" y="262" width="1104" height="110" rx="6" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="134" y="312" font-size="13" font-weight="700" fill="#6B5B95" text-anchor="middle">内核 TCP 栈</text>
  <text x="134" y="332" font-size="11" fill="#6B5B95" text-anchor="middle">协议栈与收发队列</text>

  <rect x="218" y="274" width="144" height="86" rx="6" fill="#FFFFFF" stroke="#9B968A" stroke-width="1.2"/>
  <text x="290" y="298" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">状态: LISTEN</text>
  <text x="290" y="319" font-size="11" fill="#4A473F" text-anchor="middle">创建半连接队列</text>
  <text x="290" y="337" font-size="11" fill="#4A473F" text-anchor="middle">创建全连接队列</text>

  <rect x="378" y="274" width="144" height="86" rx="6" fill="#FFFFFF" stroke="#9B968A" stroke-width="1.2"/>
  <text x="450" y="298" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">全连接队列: 空</text>
  <text x="450" y="319" font-size="11" fill="#4A473F" text-anchor="middle">暂无就绪连接</text>
  <text x="450" y="337" font-size="11" fill="#6B675C" text-anchor="middle">挂入等待队列睡眠</text>

  <rect x="538" y="274" width="144" height="86" rx="6" fill="#F7F5FC" stroke="#6B5B95" stroke-width="1.6"/>
  <text x="610" y="295" font-size="12" font-weight="700" fill="#6B5B95" text-anchor="middle">三次握手 (内核自主)</text>
  <text x="610" y="314" font-size="11" fill="#4A3F68" text-anchor="middle">收 SYN → 入半连接队列</text>
  <text x="610" y="331" font-size="11" fill="#4A3F68" text-anchor="middle">回送 SYN+ACK 报文</text>
  <text x="610" y="348" font-size="11" font-weight="700" fill="#2F6B5E" text-anchor="middle">收 ACK → 移入全连接队列</text>

  <rect x="698" y="274" width="144" height="86" rx="6" fill="#FFFFFF" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="770" y="298" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">全连接队列出队</text>
  <text x="770" y="319" font-size="11" fill="#4A473F" text-anchor="middle">取出 ESTABLISHED 项</text>
  <text x="770" y="337" font-size="11" font-weight="700" fill="#2F6B5E" text-anchor="middle">唤醒服务端进程</text>

  <rect x="858" y="274" width="144" height="86" rx="6" fill="#FFFFFF" stroke="#9B968A" stroke-width="1.2"/>
  <text x="930" y="298" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">TCP 收发缓冲区</text>
  <text x="930" y="319" font-size="11" fill="#4A473F" text-anchor="middle">滑动窗口流量控制</text>
  <text x="930" y="337" font-size="11" fill="#4A473F" text-anchor="middle">内核负责重传与保序</text>

  <rect x="1018" y="274" width="144" height="86" rx="6" fill="#FFFFFF" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="1090" y="298" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">四次挥手协议执行</text>
  <text x="1090" y="319" font-size="11" fill="#733428" text-anchor="middle">传输 FIN / ACK 报文</text>
  <text x="1090" y="337" font-size="11" fill="#733428" text-anchor="middle">主动关闭方进 TIME_WAIT</text>

  <!-- Swimlane 3: 客户端进程 (用户态) -->
  <rect x="68" y="380" width="1104" height="80" rx="6" fill="#F4F2EC" stroke="#DCD9CD" stroke-width="1"/>
  <text x="134" y="416" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">客户端进程</text>
  <text x="134" y="436" font-size="11" fill="#6B675C" text-anchor="middle">用户空间</text>

  <rect x="218" y="392" width="304" height="56" rx="6" fill="#FAF9F5" stroke="#D8D5C8" stroke-dasharray="3 3"/>
  <text x="370" y="425" font-size="11.5" fill="#8C887B" text-anchor="middle">客户端尚未运行 / 准备建立连接</text>

  <rect x="538" y="392" width="144" height="56" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="610" y="416" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">socket() / connect()</text>
  <text x="610" y="434" font-size="11" fill="#2C4460" text-anchor="middle">发起 SYN，阻塞等待握手</text>

  <rect x="698" y="392" width="144" height="56" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="770" y="416" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">connect() 成功返回</text>
  <text x="770" y="434" font-size="11" fill="#24473F" text-anchor="middle">进入 ESTABLISHED</text>

  <rect x="858" y="392" width="144" height="56" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="930" y="416" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">send() / recv()</text>
  <text x="930" y="434" font-size="11" fill="#24473F" text-anchor="middle">发送请求并接收响应</text>

  <rect x="1018" y="392" width="144" height="56" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1090" y="416" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">close(fd)</text>
  <text x="1090" y="434" font-size="11" fill="#733428" text-anchor="middle">主动/被动关闭套接字</text>

  <!-- Dynamic Interaction Arrows -->
  <line x1="290" y1="242" x2="290" y2="270" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="450" y1="242" x2="450" y2="270" stroke="#8A6A3A" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="610" y1="392" x2="610" y2="364" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <path d="M635 360 L694 394" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="770" y1="274" x2="770" y2="246" stroke="#2F6B5E" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="915" y1="392" x2="915" y2="364" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="915" y1="274" x2="915" y2="246" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="945" y1="242" x2="945" y2="270" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="945" y1="364" x2="945" y2="392" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="1090" y1="242" x2="1090" y2="270" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arr-red)"/>

  <!-- Key Insight Callout Banner -->
  <rect x="68" y="474" width="1104" height="44" rx="6" fill="#FDF8ED" stroke="#D9A74A" stroke-width="1.2"/>
  <text x="88" y="501" font-size="12" font-weight="700" fill="#8A5A00">关键时序纠偏：</text>
  <text x="175" y="494" font-size="11.5" fill="#5C420B">③ 握手由内核独立完成，客户端 connect() 立即成功返回 (ESTABLISHED)</text>
  <text x="175" y="510" font-size="11.5" fill="#5C420B">服务端此时仍阻塞睡眠，直至连接移入全连接队列才在 ④ 被唤醒并分配 connfd</text>

  <!-- ============ Panel B: 四个阻塞点表格 ============ -->
  <rect x="48" y="550" width="1144" height="224" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="578" font-size="15" font-weight="700" fill="#4A473F">B · 四个阻塞系统调用的关键行为与返回值检查清单</text>

  <!-- Table Header -->
  <rect x="68" y="592" width="1104" height="26" fill="#EDE9DF" rx="4"/>
  <text x="88" y="609" font-size="11.5" font-weight="700" fill="#5C574F">系统调用 (API)</text>
  <text x="240" y="609" font-size="11.5" font-weight="700" fill="#5C574F">阻塞时机与解除唤醒条件 (When Unblocks)</text>
  <text x="560" y="609" font-size="11.5" font-weight="700" fill="#5C574F">返回值关键检查与工程防御陷阱 (Return Value Checklist)</text>

  <!-- Row 1: accept -->
  <rect x="68" y="624" width="1104" height="32" fill="#FAF6EE" rx="4"/>
  <rect x="80" y="628" width="104" height="24" rx="4" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1"/>
  <text x="132" y="644" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">accept()</text>
  <text x="240" y="644" font-size="11.5" fill="#4A473F">全连接队列非空（至少有 1 条完成三次握手的连接就绪）</text>
  <text x="560" y="644" font-size="11.5" fill="#2B2A26">返回 -1 且 errno==EINTR 需重试（信号打断）；全连接队列满时新连接将被丢弃</text>

  <!-- Row 2: recv -->
  <rect x="68" y="660" width="1104" height="32" fill="#F4F8FA" rx="4"/>
  <rect x="80" y="664" width="104" height="24" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="132" y="680" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">recv()</text>
  <text x="240" y="680" font-size="11.5" fill="#4A473F">内核接收缓冲区有数据到达，或收到对端 FIN</text>
  <text x="560" y="680" font-size="11.5" fill="#2B2A26">返回 0 表示对端有序关闭（收到 FIN，非空数据）；返回值可能小于期望长度需循环读</text>

  <!-- Row 3: send -->
  <rect x="68" y="696" width="1104" height="32" fill="#F4F8FA" rx="4"/>
  <rect x="80" y="700" width="104" height="24" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="132" y="716" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">send()</text>
  <text x="240" y="716" font-size="11.5" fill="#4A473F">内核发送缓冲区有可用空闲空间，成功写入</text>
  <text x="560" y="716" font-size="11.5" fill="#2B2A26">成功只代表拷入内核缓冲；返回值可能小于 len 需续发；写断开连接必须防范 SIGPIPE</text>

  <!-- Row 4: close -->
  <rect x="68" y="732" width="1104" height="32" fill="#FAF4F2" rx="4"/>
  <rect x="80" y="736" width="104" height="24" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="132" y="752" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">close()</text>
  <text x="240" y="752" font-size="11.5" fill="#4A473F">系统调用立即返回，由内核接管并异步执行四次挥手</text>
  <text x="560" y="752" font-size="11.5" fill="#2B2A26">发送缓冲区剩余数据尽量发完；若接收缓冲区仍有未读数据则直接丢弃并向对端回送 RST</text>

  <!-- Footer Note -->
  <text x="48" y="798" font-size="12" fill="#6B675C">口径说明：以上为阻塞模式标准行为。非阻塞模式下未就绪将立即返回 -1 并置 EAGAIN / EWOULDBLOCK / EINPROGRESS（详见 8.12 与 8.13）。</text>
</svg>