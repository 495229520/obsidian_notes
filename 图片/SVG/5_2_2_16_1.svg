<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <rect width="980" height="560" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .box { fill: #eef6fb; stroke: #6f94b3; stroke-width: 1.6; rx: 8; }
      .hot { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2; rx: 8; }
      .cold { fill: #fde2df; stroke: #d36b5f; stroke-width: 2; rx: 8; }
      .freq { fill: #dff0ea; stroke: #45907a; stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .note { fill: #edf4f1; stroke: #9db7aa; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">LRU 与 LFU：哈希表负责定位，链表负责顺序</text>
  <text x="40" y="76" class="subtitle">设计题的关键是让每个接口都能直达要修改的节点，避免线性扫描。</text>

  <rect x="54" y="118" width="404" height="330" class="panel"/>
  <text x="82" y="152" class="label">LRU Cache</text>
  <text x="82" y="178" class="small">key -> list iterator，链表头部是最近使用</text>
  <rect x="92" y="220" width="110" height="46" class="box"/><text x="147" y="249" text-anchor="middle" class="mono">map[3]</text>
  <rect x="92" y="286" width="110" height="46" class="box"/><text x="147" y="315" text-anchor="middle" class="mono">map[1]</text>
  <rect x="252" y="202" width="126" height="42" class="hot"/><text x="315" y="228" text-anchor="middle" class="mono">3:30 MRU</text>
  <rect x="252" y="258" width="126" height="42" class="box"/><text x="315" y="284" text-anchor="middle" class="mono">1:10</text>
  <rect x="252" y="314" width="126" height="42" class="cold"/><text x="315" y="340" text-anchor="middle" class="mono">2:20 LRU</text>
  <path d="M 202 243 L 252 224" class="arrow"/>
  <path d="M 202 309 L 252 280" class="arrow"/>
  <text x="100" y="398" class="small">淘汰尾部，访问后移动到头部</text>

  <rect x="522" y="118" width="404" height="330" class="panel"/>
  <text x="550" y="152" class="label">LFU Cache</text>
  <text x="550" y="178" class="small">keyMap 定位节点，freqMap 维护每个频次内的 LRU</text>
  <rect x="560" y="220" width="126" height="46" class="box"/><text x="623" y="249" text-anchor="middle" class="mono">keyMap</text>
  <rect x="736" y="198" width="132" height="42" class="freq"/><text x="802" y="224" text-anchor="middle" class="mono">freq=1: [4]</text>
  <rect x="736" y="254" width="132" height="42" class="freq"/><text x="802" y="280" text-anchor="middle" class="mono">freq=2: [1,3]</text>
  <rect x="736" y="310" width="132" height="42" class="freq"/><text x="802" y="336" text-anchor="middle" class="mono">freq=3: [2]</text>
  <path d="M 686 243 L 736 220" class="arrow"/>
  <path d="M 686 243 L 736 276" class="arrow"/>
  <text x="560" y="398" class="mono">minFreq = 1</text>
  <text x="560" y="424" class="small">淘汰 freq 最小链表的尾部 key</text>

  <rect x="144" y="486" width="692" height="38" class="note"/>
  <text x="490" y="510" text-anchor="middle" class="small">LRU 只有时间维度；LFU 多了频次维度，每个频次内部仍要维护最近使用顺序。</text>
</svg>
