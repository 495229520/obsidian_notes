<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">可以统一存储模型，不能抹平业务正确性</title>
  <desc id="desc">对象存储、Checkpoint 与 KV Prefix 都能引用不可变 Blob，但接受条件不同。。原创教学示意图，非真实产品内部拓扑或性能实测。</desc>
  <defs>
    <marker id="arr-base" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B968A" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5B95" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="700" fill="#F5F4ED" stroke="none" rx="0" stroke-width="1.3" />
  <text x="48" y="53" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="title">可以统一存储模型，不能抹平业务正确性</text>
  <text x="48" y="82" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="subtitle">对象存储、Checkpoint 与 KV Prefix 都能引用不可变 Blob，但接受条件不同。</text>
  <rect x="60" y="118" width="224" height="58" fill="#F1EFE8" stroke="#D8D5C8" rx="0" stroke-width="1.3" />
  <rect x="284" y="118" width="299" height="58" fill="#E3EAF4" stroke="#D8D5C8" rx="0" stroke-width="1.3" />
  <rect x="583" y="118" width="299" height="58" fill="#E3EAF4" stroke="#D8D5C8" rx="0" stroke-width="1.3" />
  <rect x="882" y="118" width="298" height="58" fill="#E3EAF4" stroke="#D8D5C8" rx="0" stroke-width="1.3" />
  <text x="172.0" y="153" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">检查层</text>
  <text x="433.5" y="153" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">对象存储</text>
  <text x="732.5" y="153" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">Checkpoint</text>
  <text x="1031.0" y="153" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">KV Prefix</text>
  <rect x="60" y="176" width="1120" height="64" fill="#FBFBF6" stroke="#D8D5C8" rx="0" stroke-width="1.3" />
  <text x="172.0" y="215" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">业务入口</text>
  <text x="433.5" y="215" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">Key / Version</text>
  <text x="732.5" y="215" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">run / step / generation</text>
  <text x="1031.0" y="215" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">tokens + parent + context</text>
  <line x1="284" y1="176" x2="284" y2="240" stroke="#D8D5C8" stroke-width="1" />
  <line x1="583" y1="176" x2="583" y2="240" stroke="#D8D5C8" stroke-width="1" />
  <line x1="882" y1="176" x2="882" y2="240" stroke="#D8D5C8" stroke-width="1" />
  <line x1="60" y1="240" x2="1180" y2="240" stroke="#D8D5C8" stroke-width="1" />
  <rect x="60" y="240" width="1120" height="64" fill="#F1EFE8" stroke="#D8D5C8" rx="0" stroke-width="1.3" />
  <text x="172.0" y="279" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">复用依据</text>
  <text x="433.5" y="279" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">内容 ID</text>
  <text x="732.5" y="279" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">未变化的 Shard / 子图</text>
  <text x="1031.0" y="279" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">合法且兼容的前缀</text>
  <line x1="284" y1="240" x2="284" y2="304" stroke="#D8D5C8" stroke-width="1" />
  <line x1="583" y1="240" x2="583" y2="304" stroke="#D8D5C8" stroke-width="1" />
  <line x1="882" y1="240" x2="882" y2="304" stroke="#D8D5C8" stroke-width="1" />
  <line x1="60" y1="304" x2="1180" y2="304" stroke="#D8D5C8" stroke-width="1" />
  <rect x="60" y="304" width="1120" height="64" fill="#FBFBF6" stroke="#D8D5C8" rx="0" stroke-width="1.3" />
  <text x="172.0" y="343" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">字节校验</text>
  <text x="433.5" y="343" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">对象 / Chunk 摘要</text>
  <text x="732.5" y="343" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">Shard 摘要 + Manifest</text>
  <text x="1031.0" y="343" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">实际 KV Blob 摘要</text>
  <line x1="284" y1="304" x2="284" y2="368" stroke="#D8D5C8" stroke-width="1" />
  <line x1="583" y1="304" x2="583" y2="368" stroke="#D8D5C8" stroke-width="1" />
  <line x1="882" y1="304" x2="882" y2="368" stroke="#D8D5C8" stroke-width="1" />
  <line x1="60" y1="368" x2="1180" y2="368" stroke="#D8D5C8" stroke-width="1" />
  <rect x="60" y="368" width="1120" height="64" fill="#F1EFE8" stroke="#D8D5C8" rx="0" stroke-width="1.3" />
  <text x="172.0" y="407" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">语义门槛</text>
  <text x="433.5" y="407" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">授权与版本可见性</text>
  <text x="732.5" y="407" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">一致切面 + 状态完整</text>
  <text x="1031.0" y="407" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">模型 / 位置 / 表示</text>
  <line x1="284" y1="368" x2="284" y2="432" stroke="#D8D5C8" stroke-width="1" />
  <line x1="583" y1="368" x2="583" y2="432" stroke="#D8D5C8" stroke-width="1" />
  <line x1="882" y1="368" x2="882" y2="432" stroke="#D8D5C8" stroke-width="1" />
  <line x1="60" y1="432" x2="1180" y2="432" stroke="#D8D5C8" stroke-width="1" />
  <rect x="60" y="432" width="1120" height="64" fill="#FBFBF6" stroke="#D8D5C8" rx="0" stroke-width="1.3" />
  <text x="172.0" y="471" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">不能单靠 Hash</text>
  <text x="433.5" y="471" font-size="14" fill="#733428" font-weight="400" text-anchor="middle" data-role="body">判断是否最新</text>
  <text x="732.5" y="471" font-size="14" fill="#733428" font-weight="400" text-anchor="middle" data-role="body">保证训练可恢复</text>
  <text x="1031.0" y="471" font-size="14" fill="#733428" font-weight="400" text-anchor="middle" data-role="body">保证运行时可复用</text>
  <line x1="284" y1="432" x2="284" y2="496" stroke="#D8D5C8" stroke-width="1" />
  <line x1="583" y1="432" x2="583" y2="496" stroke="#D8D5C8" stroke-width="1" />
  <line x1="882" y1="432" x2="882" y2="496" stroke="#D8D5C8" stroke-width="1" />
  <line x1="60" y1="496" x2="1180" y2="496" stroke="#D8D5C8" stroke-width="1" />
  <rect x="87" y="530" width="489" height="69" fill="#EDEAF3" stroke="#6B5B95" rx="8" stroke-width="1.3" />
  <text x="331.5" y="560.5" font-size="16" fill="#544673" font-weight="700" text-anchor="middle" data-role="body">语义身份检查</text>
  <text x="331.5" y="581.5" font-size="13.5" fill="#544673" font-weight="400" text-anchor="middle" data-role="body">这是哪份业务状态 / 计算输入？</text>
  <rect x="664" y="530" width="489" height="69" fill="#DCE9E3" stroke="#2F6B5E" rx="8" stroke-width="1.3" />
  <text x="908.5" y="560.5" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">实际内容检查</text>
  <text x="908.5" y="581.5" font-size="13.5" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">返回的字节是否匹配可信承诺？</text>
  <polyline points="579,563 659,563" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr-base)" stroke-linejoin="round" />
  <text x="417" y="626" font-size="14.5" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">通过语义门槛，再使用并校验对应内容</text>
  <line x1="48" y1="649" x2="1192" y2="649" stroke="#D8D5C8" stroke-width="1" />
  <text x="48" y="678" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">Prefix Key 可以来自输入哈希链；它不是实际 KV 字节的完整性证明，也不能替代模型与布局兼容检查。</text>
</svg>