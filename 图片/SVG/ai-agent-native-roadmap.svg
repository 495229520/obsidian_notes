<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Native AI Infra GPU Performance Engineer 路线总图</title>
  <desc id="desc">按阶段重绘的学习路线图，包含起点、三个阶段以及最终目标岗位。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2937; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .phaseTitle { font-size: 24px; font-weight: 700; fill: #ffffff; }
      .phaseSub { font-size: 15px; fill: #e2e8f0; }
      .cardTitle { font-size: 18px; font-weight: 700; }
      .cardText { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .goalText { font-size: 24px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1500" height="1100" fill="#f8fafc"/>

  <text class="title" x="60" y="58">AI Agent-native AI Infra / GPU Performance Engineer 路线总图</text>
  <text class="subtitle" x="60" y="88">把原来的交叉连线 Mermaid 改成按阶段分组的路线图，阅读时先看阶段，再看每阶段的重点能力。</text>

  <rect x="500" y="116" width="500" height="74" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="750" y="147" text-anchor="middle" class="cardTitle">当前起点</text>
  <text x="750" y="172" text-anchor="middle" class="cardText">C++ / Linux / AI Agent 基础</text>

  <line x1="750" y1="190" x2="750" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="220" width="1380" height="220" rx="24" fill="#eef4ff" stroke="#c7d7fe" stroke-width="2"/>
  <rect x="60" y="220" width="1380" height="64" rx="24" fill="#2563eb"/>
  <text class="phaseTitle" x="92" y="258">阶段一 · 2026-05 ~ 2026-07</text>
  <text class="phaseSub" x="430" y="258">目标：拿到暑期 AI Infra 面试</text>

  <rect x="92" y="308" width="300" height="104" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="cardTitle" x="112" y="338">CUDA 基础 kernel</text>
  <text class="cardText" x="112" y="364">vector add / reduce / transpose</text>
  <text class="cardText" x="112" y="385">matmul / softmax</text>

  <rect x="425" y="308" width="300" height="104" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="cardTitle" x="445" y="338">Triton 入门</text>
  <text class="cardText" x="445" y="364">fused softmax / matmul</text>
  <text class="cardText" x="445" y="385">RMSNorm</text>

  <rect x="758" y="308" width="300" height="104" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="cardTitle" x="778" y="338">推理成本入门</text>
  <text class="cardText" x="778" y="364">TTFT / TPOT / TPS</text>
  <text class="cardText" x="778" y="385">cost</text>

  <rect x="1091" y="308" width="300" height="104" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="cardTitle" x="1111" y="338">Agent workflow</text>
  <text class="cardText" x="1111" y="364">脚手架 / 测试</text>
  <text class="cardText" x="1111" y="385">benchmark / review</text>

  <line x1="750" y1="440" x2="750" y2="470" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="470" width="1380" height="220" rx="24" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <rect x="60" y="470" width="1380" height="64" rx="24" fill="#0f766e"/>
  <text class="phaseTitle" x="92" y="508">阶段二 · 2026-07 ~ 2027-03</text>
  <text class="phaseSub" x="430" y="508">目标：形成转正实习竞争力</text>

  <rect x="92" y="558" width="300" height="104" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text class="cardTitle" x="112" y="588">GEMM 深入</text>
  <text class="cardText" x="112" y="614">tiling / register blocking</text>
  <text class="cardText" x="112" y="635">Tensor Core / CUTLASS</text>

  <rect x="425" y="558" width="300" height="104" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text class="cardTitle" x="445" y="588">LLM 小算子</text>
  <text class="cardText" x="445" y="614">RMSNorm / RoPE / SwiGLU</text>
  <text class="cardText" x="445" y="635">sampling / dequant</text>

  <rect x="758" y="558" width="300" height="104" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text class="cardTitle" x="778" y="588">推理系统</text>
  <text class="cardText" x="778" y="614">prefill / decode / KV cache</text>
  <text class="cardText" x="778" y="635">batching / quantization</text>

  <rect x="1091" y="558" width="300" height="104" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text class="cardTitle" x="1111" y="588">多 Agent 协作</text>
  <text class="cardText" x="1111" y="614">Kernel / Benchmark / Profiler</text>
  <text class="cardText" x="1111" y="635">Reviewer / Doc</text>

  <line x1="750" y1="690" x2="750" y2="720" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="720" width="1380" height="220" rx="24" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <rect x="60" y="720" width="1380" height="64" rx="24" fill="#7c3aed"/>
  <text class="phaseTitle" x="92" y="758">阶段三 · 2027-03 ~ 2027-09</text>
  <text class="phaseSub" x="430" y="758">目标：秋招作品集与正式 offer</text>

  <rect x="92" y="808" width="300" height="104" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="cardTitle" x="112" y="838">统一 kernel benchmark suite</text>
  <text class="cardText" x="112" y="864">沉淀 CUDA / Triton / profiling</text>
  <text class="cardText" x="112" y="885">的统一展示面</text>

  <rect x="425" y="808" width="300" height="104" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="cardTitle" x="445" y="838">mini vLLM-style KV cache</text>
  <text class="cardText" x="445" y="864">做出 toy engine</text>
  <text class="cardText" x="445" y="885">展示推理系统理解</text>

  <rect x="758" y="808" width="300" height="104" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="cardTitle" x="778" y="838">agentic infra workflow 模板</text>
  <text class="cardText" x="778" y="864">把工程化、测试、review</text>
  <text class="cardText" x="778" y="885">流程固化下来</text>

  <rect x="1091" y="808" width="300" height="104" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="cardTitle" x="1111" y="838">开源 issue / PR / 报告</text>
  <text class="cardText" x="1111" y="864">补齐外部证明材料</text>
  <text class="cardText" x="1111" y="885">增强秋招说服力</text>

  <line x1="750" y1="940" x2="750" y2="968" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="310" y="968" width="880" height="60" rx="20" fill="#0f172a"/>
  <text class="goalText" x="750" y="1006" text-anchor="middle">目标人设：AI Agent-native AI Infra / GPU Performance Engineer</text>

  <text class="small" x="60" y="1054">阅读顺序：先看阶段目标，再看每阶段的四个重点模块。</text>
  <text class="small" x="60" y="1076">这样比原始 Mermaid 更容易把“阶段推进”和“能力建设”分开理解。</text>
</svg>
