<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">CPU 隔离：给维护工作一个明确的去处</title><desc id="desc">八个 CPU 方块映射到两类区域：CPU 0-1 是维护核，2-7 是隔离数据面。CPU 6 是被测 worker，设备 DMA 访问本地队列。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">CPU 隔离：给维护工作一个明确的去处</text>
<text x="48" y="77" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">先规划物理核心与 NUMA，再限制线程、IRQ、tick 与后台执行路径。</text>
<rect x="40" y="106" width="1160" height="328" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="134" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 单 NUMA、8 核、SMT 已关闭：仅为实验编号</text>
<rect x="63" y="155" width="283" height="254" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<rect x="369" y="155" width="807" height="254" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="81" y="184" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="body">Housekeeping · CPU 0–1</text>
<text x="391" y="184" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">数据面分区 · CPU 2–7</text>
<rect x="83" y="206" width="105" height="77" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="135.5" y="241.5" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">CPU 0</text>
<text x="135.5" y="263.5" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">维护任务</text>
<rect x="213" y="206" width="105" height="77" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="265.5" y="241.5" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">CPU 1</text>
<text x="265.5" y="263.5" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">维护任务</text>
<rect x="391" y="206" width="105" height="77" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="443.5" y="241.5" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">CPU 2</text>
<text x="443.5" y="263.5" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">按需分配</text>
<rect x="518" y="206" width="105" height="77" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="570.5" y="241.5" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">CPU 3</text>
<text x="570.5" y="263.5" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">按需分配</text>
<rect x="645" y="206" width="105" height="77" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="697.5" y="241.5" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">CPU 4</text>
<text x="697.5" y="263.5" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">按需分配</text>
<rect x="772" y="206" width="105" height="77" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="824.5" y="241.5" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">CPU 5</text>
<text x="824.5" y="263.5" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">按需分配</text>
<rect x="899" y="206" width="105" height="77" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="951.5" y="241.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">CPU 6</text>
<text x="951.5" y="263.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">worker</text>
<rect x="1026" y="206" width="105" height="77" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1078.5" y="241.5" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">CPU 7</text>
<text x="1078.5" y="263.5" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">按需分配</text>
<text x="82" y="316" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="start" data-role="body">设备管理 IRQ · RCU 回调</text>
<text x="82" y="345" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="start" data-role="body">日志 · 指标 · 系统维护</text>
<text x="82" y="385" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">预算不足 → 后台依赖排队</text>
<rect x="391" y="311" width="761" height="74" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="412" y="339" font-size="15" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">局部队列 / 本地 buffer</text>
<text x="412" y="366" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">先分配、首次触碰与预热，再进入稳态</text>
<line x1="944" y1="284" x2="944" y2="309" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#green)"/>
<rect x="69" y="479" width="258" height="73" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="198.0" y="512.5" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">可迁移维护工作</text>
<text x="198.0" y="534.5" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">按策略迁到 housekeeping</text>
<line x1="194" y1="479" x2="194" y2="435" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#amber)"/>
<rect x="398" y="479" width="357" height="73" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="576.5" y="512.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">NIC / NVMe 数据路径</text>
<text x="576.5" y="534.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">DMA 不等于维护核执行拷贝</text>
<line x1="577" y1="479" x2="577" y2="435" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#green)"/>
<rect x="826" y="479" width="349" height="73" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="1000.5" y="512.5" font-size="15" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">残余共享资源</text>
<text x="1000.5" y="534.5" font-size="12.5" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">SMT · LLC · 内存带宽 · 固件</text>
<text x="400" y="587" font-size="14" font-weight="600" fill="#733428" text-anchor="start" data-role="body">线程绑到 CPU 6，不自动阻止其他执行者或硬件争用。</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="642" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">真实 CPU 编号必须由 lscpu / topology sysfs 确认；SMT sibling 与 NUMA 节点不能凭数字推断。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">本图的两颗维护核不是通用配额：按 IRQ、回调、后台负载和每个 NUMA 节点的容量规划。</text>
</svg>