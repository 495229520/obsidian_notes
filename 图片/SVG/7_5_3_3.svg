<text x="300.0" y="334" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">三阶差商 = 相邻两个二阶差商之差 ÷ 跨度 (x₃−x₀)</text>
<text x="300.0" y="355" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">f[x₀,x₁,x₂,x₃] = ( f[x₁,x₂,x₃] − f[x₀,x₁,x₂] ) / (x₃ − x₀)</text>
<text x="30" y="400" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">③ 只看前一列（二阶）相邻两格，分母用首尾两节点 x₃−x₀；逐阶递推到只剩一个为止</text>
</svg>