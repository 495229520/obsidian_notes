<path d="M420,249 h140 a8,8 0 0 1 8,8 v32 a8,8 0 0 1 -8,8 h-140 a8,8 0 0 1 -8,-8 v-32 a8,8 0 0 1 8,-8 z" fill="none" stroke="#0F6E56" stroke-width="2"/>
