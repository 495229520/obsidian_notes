<text x="60" y="117" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">x₀</text>
<text x="120" y="117" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">y₀</text>
<text x="60" y="169" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">x₁</text>
<text x="120" y="169" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">y₁</text>
<text x="210" y="169" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">f[x₀,x₁]</text>
<text x="60" y="221" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">x₂</text>
