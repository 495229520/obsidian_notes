<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">恢复状态机：每一步都需要证据，不能只看 connected</title>
  <desc id="desc">旧代际静默 → 资源退休 → 新传输 → 应用协商 → 业务结果对账。。图中预算、序号与布局均为教学示意，不是实测结果。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="bluearr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3" />
  <text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">恢复状态机：每一步都需要证据，不能只看 connected</text>
  <text x="48" y="79" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">旧代际静默 → 资源退休 → 新传输 → 应用协商 → 业务结果对账。</text>
  <line x1="48" y1="98" x2="1192" y2="98" stroke="#D8D5C8" stroke-width="1" />
  <text x="1192" y="658" font-size="12" fill="#8B8679" font-weight="400" text-anchor="end">8 · 4 · 19 · 3</text>
  <rect x="48" y="155" width="232" height="92" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="164.0" y="194.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">READY(g)</text>
  <text x="164.0" y="218.0" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">正常服务</text>
  <rect x="352" y="155" width="232" height="92" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="468.0" y="194.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">QUIESCING(g)</text>
  <text x="468.0" y="218.0" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle">停止旧提交</text>
  <rect x="656" y="155" width="232" height="92" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="772.0" y="194.0" font-size="14" fill="#514573" font-weight="700" text-anchor="middle">DRAINING(g)</text>
  <text x="772.0" y="218.0" font-size="14" fill="#514573" font-weight="400" text-anchor="middle">收集终结证据</text>
  <rect x="960" y="155" width="232" height="92" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="1076.0" y="194.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">RETIRING(g)</text>
  <text x="1076.0" y="218.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">按依赖处理资源</text>
  <polyline points="284,201 347,201" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="316" y="143" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">故障 / 关闭</text>
  <polyline points="588,201 651,201" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="620" y="143" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">静默已确认</text>
  <polyline points="892,201 955,201" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="924" y="143" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">证据齐备</text>
  <rect x="656" y="323" width="270" height="82" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
  <text x="791.0" y="357.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">QUARANTINED</text>
  <text x="791.0" y="381.0" font-size="14" fill="#733428" font-weight="400" text-anchor="middle">证据不足：保留并升级</text>
  <polyline points="772,251 772,319" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#redarr)" />
  <text x="786" y="289" font-size="13" fill="#733428" font-weight="400" text-anchor="start">CQ 坏 / drain 超时</text>
  <rect x="960" y="321" width="232" height="69" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="1076.0" y="348.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">BACKOFF</text>
  <text x="1076.0" y="372.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">定时器 + 重连额度</text>
  <polyline points="1076,251 1076,317" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <polyline points="1076,394 1076,450" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="960" y="454" width="232" height="99" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="1076.0" y="496.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">CONNECTING(g+1)</text>
  <text x="1076.0" y="520.5" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">新 QP / CM</text>
  <rect x="656" y="454" width="232" height="99" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="772.0" y="496.5" font-size="14" fill="#514573" font-weight="700" text-anchor="middle">NEGOTIATING</text>
  <text x="772.0" y="520.5" font-size="14" fill="#514573" font-weight="400" text-anchor="middle">身份 / 权限 / 信用</text>
  <rect x="352" y="454" width="232" height="99" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="468.0" y="496.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">RECONCILING</text>
  <text x="468.0" y="520.5" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle">查询 / 去重 / 限速重放</text>
  <rect x="48" y="454" width="232" height="99" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="164.0" y="496.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">READY(g+1)</text>
  <text x="164.0" y="520.5" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">逐步开放业务</text>
  <polyline points="956,503 892,503" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="925" y="435" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">传输就绪</text>
  <polyline points="652,503 588,503" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="621" y="435" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">应用屏障</text>
  <polyline points="348,503 284,503" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="317" y="435" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">策略满足</text>
  <rect x="48" y="291" width="536" height="128" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="64" y="318" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">隔离与恢复并行的前提</text>
  <text x="68" y="351" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">新区域不复用旧 lease；旧账本仍可结算。</text>
  <text x="68" y="386" font-size="14" fill="#733428" font-weight="400" text-anchor="start">时间到、CQ 空、调用者取消，都不是访问终止证明。</text>
  <rect x="48" y="612" width="1144" height="47" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="66" y="641" font-size="14" fill="#4A473F" font-weight="700" text-anchor="start">开放条件</text>
  <text x="142" y="641" font-size="14" fill="#4A473F" font-weight="400" text-anchor="start">ESTABLISHED 不等于业务 READY；旧写者隔离和业务顺序必须另行验证。</text>
</svg>