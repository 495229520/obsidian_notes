<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180px" height="840px" viewBox="0 0 1180 840" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f4f5f"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#185FA5"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#534AB7"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0F6E56"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0E7C8A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="590" y="36" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="26" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">易播服务器 — 全系统架构（多进程 + 线程池 + epoll）</text>

  <!-- ========== Client ========== -->
  <rect x="400" y="56" width="380" height="54" rx="12" ry="12" fill="#FFF6E8" stroke="#C27A18" stroke-width="2"/>
  <text x="590" y="76" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="17" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">客户端 HTTP GET</text>
  <text x="590" y="97" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="13" font-weight="500" font-family="Consolas, Menlo, monospace">/login?time=X&amp;salt=Y&amp;user=Z&amp;sign=W</text>

  <line x1="590" y1="110" x2="590" y2="146" stroke="#3f4f5f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <text x="608" y="131" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">TCP :9999</text>

  <!-- ========== Main Process (CServer) ========== -->
  <rect x="40" y="148" width="880" height="148" rx="16" ry="16" fill="#EAF1FA" stroke="#6c82aa" stroke-width="2"/>
  <rect x="40" y="148" width="880" height="32" rx="16" ry="16" fill="#185FA5"/>
  <rect x="40" y="164" width="880" height="16" fill="#185FA5"/>
  <text x="480" y="168" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">主进程 — CServer（网络接入）</text>

  <!-- b1: CEpoll listen -->
  <rect x="58" y="192" width="262" height="90" rx="10" ry="10" fill="#E8F3FF" stroke="#6c82aa" stroke-width="1.5"/>
  <text x="189" y="214" text-anchor="middle" dominant-baseline="middle" fill="#185FA5" font-size="15" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">CEpoll 监听</text>
  <text x="189" y="240" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="13" font-weight="500" font-family="Consolas, Menlo, monospace">epoll_wait(listen_fd)</text>
  <text x="189" y="262" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">监听 0.0.0.0:9999</text>

  <!-- b2: ThreadPool(2) -->
  <rect x="338" y="192" width="262" height="90" rx="10" ry="10" fill="#E0F3F4" stroke="#4F9BA6" stroke-width="1.5"/>
  <text x="469" y="214" text-anchor="middle" dominant-baseline="middle" fill="#0E7C8A" font-size="15" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">CThreadPool(2)</text>
  <text x="469" y="240" text-anchor="middle" dominant-baseline="middle" fill="#0b5f6a" font-size="13" font-weight="500" font-family="Consolas, Menlo, monospace">CServer::ThreadFunc</text>
  <text x="469" y="262" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">accept → Link(pClient)</text>

  <!-- b3: SendSocket -->
  <rect x="618" y="192" width="284" height="90" rx="10" ry="10" fill="#E8F3FF" stroke="#6c82aa" stroke-width="1.5"/>
  <text x="760" y="214" text-anchor="middle" dominant-baseline="middle" fill="#185FA5" font-size="15" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">SendSocket(fd, addr)</text>
  <text x="760" y="240" text-anchor="middle" dominant-baseline="middle" fill="#534AB7" font-size="12.5" font-weight="600" font-family="Consolas, Menlo, monospace">sendmsg + SCM_RIGHTS</text>
  <text x="760" y="262" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">把已连接 fd 交给子进程</text>

  <line x1="320" y1="237" x2="336" y2="237" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <line x1="600" y1="237" x2="616" y2="237" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- ========== Log Subprocess (tall, right column) ========== -->
  <rect x="940" y="148" width="200" height="512" rx="14" ry="14" fill="#F2EEFC" stroke="#534AB7" stroke-width="2"/>
  <rect x="940" y="148" width="200" height="32" rx="14" ry="14" fill="#534AB7"/>
  <rect x="940" y="164" width="200" height="16" fill="#534AB7"/>
  <text x="1040" y="168" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">日志子进程</text>
  <text x="1040" y="204" text-anchor="middle" dominant-baseline="middle" fill="#534AB7" font-size="14" font-weight="700" font-family="Consolas, Menlo, monospace">CLoggerServer</text>
  <text x="1040" y="234" text-anchor="middle" dominant-baseline="middle" fill="#5b4fb0" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">后台 CThread</text>
  <text x="1040" y="254" text-anchor="middle" dominant-baseline="middle" fill="#5b4fb0" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">监听本地 socket</text>
  <line x1="966" y1="276" x2="1114" y2="276" stroke="#cfc6ee" stroke-width="1.2"/>
  <text x="1040" y="300" text-anchor="middle" dominant-baseline="middle" fill="#5b4fb0" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">TRACE / DUMP / LOG</text>
  <text x="1040" y="320" text-anchor="middle" dominant-baseline="middle" fill="#5b4fb0" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">宏经 local socket</text>
  <text x="1040" y="340" text-anchor="middle" dominant-baseline="middle" fill="#5b4fb0" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">汇聚到日志线程</text>
  <line x1="966" y1="362" x2="1114" y2="362" stroke="#cfc6ee" stroke-width="1.2"/>
  <text x="1040" y="386" text-anchor="middle" dominant-baseline="middle" fill="#5b4fb0" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">异步落盘，主/业务</text>
  <text x="1040" y="406" text-anchor="middle" dominant-baseline="middle" fill="#5b4fb0" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">进程均向其投递</text>
  <text x="1040" y="440" text-anchor="middle" dominant-baseline="middle" fill="#8d83c6" font-size="12" font-style="italic" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">主进程 SendFD(-1)</text>
  <text x="1040" y="458" text-anchor="middle" dominant-baseline="middle" fill="#8d83c6" font-size="12" font-style="italic" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">通知其退出</text>

  <!-- dashed log arrows from main and business -->
  <path d="M905 230 C925 232 932 240 938 248" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <path d="M905 520 C925 516 932 510 938 504" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <text x="892" y="500" text-anchor="end" fill="#534AB7" font-size="11.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">日志旁路</text>

  <!-- ========== IPC boundary ========== -->
  <line x1="480" y1="296" x2="480" y2="312" stroke="#534AB7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="150" y="314" width="660" height="30" rx="8" ry="8" fill="#EDE9FE" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="480" y="331" text-anchor="middle" dominant-baseline="middle" fill="#534AB7" font-size="13.5" font-weight="600" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">进程边界 — fork() + socketpair：通过 SCM_RIGHTS 跨进程传递 client fd</text>
  <line x1="480" y1="344" x2="480" y2="372" stroke="#534AB7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- ========== Business Subprocess ========== -->
  <rect x="40" y="374" width="880" height="288" rx="16" ry="16" fill="#FAFAF5" stroke="#5F5E5A" stroke-width="2"/>
  <rect x="40" y="374" width="880" height="32" rx="16" ry="16" fill="#534AB7"/>
  <rect x="40" y="390" width="880" height="16" fill="#534AB7"/>
  <text x="480" y="394" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">业务子进程 — CEdoyunPlayerServer::BusinessProcess()</text>

  <!-- row A: epoll + threadpool -->
  <rect x="58" y="418" width="408" height="78" rx="10" ry="10" fill="#E8F3FF" stroke="#6c82aa" stroke-width="1.5"/>
  <text x="262" y="440" text-anchor="middle" dominant-baseline="middle" fill="#185FA5" font-size="15" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">业务 CEpoll</text>
  <text x="262" y="464" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="13" font-weight="500" font-family="Consolas, Menlo, monospace">RecvSocket → m_epoll.Add(client)</text>
  <text x="262" y="484" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">注册客户端读事件 EPOLLIN</text>

  <rect x="494" y="418" width="408" height="78" rx="10" ry="10" fill="#E0F3F4" stroke="#4F9BA6" stroke-width="1.5"/>
  <text x="698" y="440" text-anchor="middle" dominant-baseline="middle" fill="#0E7C8A" font-size="15" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">CThreadPool(N) — N 个 worker</text>
  <text x="698" y="464" text-anchor="middle" dominant-baseline="middle" fill="#0b5f6a" font-size="13" font-weight="500" font-family="Consolas, Menlo, monospace">ThreadFunc：epoll_wait → Recv</text>
  <text x="698" y="484" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12.5" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">可读事件触发 m_recvcallback</text>

  <line x1="466" y1="457" x2="492" y2="457" stroke="#0E7C8A" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <line x1="480" y1="496" x2="480" y2="514" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="498" y="509" fill="#56677a" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">Received() 回调</text>

  <!-- row B: http / crypto / response -->
  <rect x="58" y="518" width="260" height="128" rx="10" ry="10" fill="#E8F3FF" stroke="#6c82aa" stroke-width="1.5"/>
  <text x="188" y="540" text-anchor="middle" dominant-baseline="middle" fill="#185FA5" font-size="14.5" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">HTTP 解析与路由</text>
  <text x="188" y="566" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="12.5" font-weight="500" font-family="Consolas, Menlo, monospace">CHttpParser</text>
  <text x="188" y="586" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="12.5" font-weight="500" font-family="Consolas, Menlo, monospace">UrlParser</text>
  <text x="188" y="610" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">取 method / uri</text>
  <text x="188" y="628" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">time/salt/user/sign</text>

  <rect x="338" y="518" width="260" height="128" rx="10" ry="10" fill="#FFF6E8" stroke="#C27A18" stroke-width="1.5"/>
  <text x="468" y="540" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="14.5" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">加密校验</text>
  <text x="468" y="566" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="12.5" font-weight="500" font-family="Consolas, Menlo, monospace">Crypto::MD5()</text>
  <text x="468" y="590" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">MD5(time+KEY</text>
  <text x="468" y="608" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">+pwd+salt)</text>
  <text x="468" y="628" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">比对 sign</text>

  <rect x="618" y="518" width="284" height="128" rx="10" ry="10" fill="#FFF6E8" stroke="#C27A18" stroke-width="1.5"/>
  <text x="760" y="540" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="14.5" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">响应构造</text>
  <text x="760" y="566" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="12.5" font-weight="500" font-family="Consolas, Menlo, monospace">MakeResponse()</text>
  <text x="760" y="590" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">HTTP/1.1 200 OK</text>
  <text x="760" y="608" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">JSON {status,message}</text>
  <text x="760" y="628" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">Send 回客户端</text>

  <line x1="318" y1="582" x2="336" y2="582" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <line x1="598" y1="582" x2="616" y2="582" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- response back to client (curved up the left edge) -->
  <path d="M58 560 C18 560 18 83 398 83" fill="none" stroke="#C27A18" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-dark)"/>
  <text x="26" y="330" fill="#C27A18" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" transform="rotate(-90 26 330)">HTTP 响应回包</text>

  <!-- Arrow: crypto -> DB -->
  <line x1="468" y1="646" x2="468" y2="686" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="556" y="670" fill="#0F6E56" font-size="12.5" font-weight="600" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">查 user_name → 取 password</text>

  <!-- ========== Database ========== -->
  <rect x="190" y="688" width="560" height="58" rx="12" ry="12" fill="#D8F0DF" stroke="#0F6E56" stroke-width="2"/>
  <rect x="190" y="688" width="560" height="28" rx="12" ry="12" fill="#0F6E56"/>
  <rect x="190" y="702" width="560" height="14" fill="#0F6E56"/>
  <text x="470" y="706" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">数据库层 — CDatabaseClient / CMysqlClient → MySQL(edoyun)</text>
  <text x="470" y="732" text-anchor="middle" dominant-baseline="middle" fill="#244c2e" font-size="13" font-weight="500" font-family="Consolas, Menlo, monospace">edoyunLogin_user_mysql：SELECT * WHERE user_name=?</text>

  <!-- ========== Legend (四专题映射) ========== -->
  <rect x="40" y="762" width="1100" height="60" rx="10" ry="10" fill="rgb(245, 244, 237)" stroke="#c5bda8" stroke-width="1"/>
  <text x="60" y="784" fill="#1f2933" font-size="13.5" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">四专题配色</text>

  <rect x="60" y="797" width="14" height="14" rx="3" fill="#E0F3F4" stroke="#4F9BA6" stroke-width="1"/>
  <text x="82" y="806" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">4.1 线程（线程池 / worker）</text>
  <rect x="290" y="797" width="14" height="14" rx="3" fill="#E8F3FF" stroke="#6c82aa" stroke-width="1"/>
  <text x="312" y="806" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">4.2 网络（CServer / epoll / HTTP）</text>
  <rect x="560" y="797" width="14" height="14" rx="3" fill="#D8F0DF" stroke="#0F6E56" stroke-width="1"/>
  <text x="582" y="806" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">4.3 数据库（MySQL）</text>
  <rect x="760" y="797" width="14" height="14" rx="3" fill="#FFF6E8" stroke="#C27A18" stroke-width="1"/>
  <text x="782" y="806" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">4.4 加密与业务</text>
  <rect x="930" y="797" width="14" height="14" rx="3" fill="#EDE9FE" stroke="#534AB7" stroke-width="1"/>
  <text x="952" y="806" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">进程 / IPC / 日志</text>
</svg>
