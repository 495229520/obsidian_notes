<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect x="0" y="0" width="960" height="600" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    原子性缺失：num++ 的读-改-写交错
  </text>
  <text x="480" y="56" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">
    两个线程各自 +1，预期 num=2，实际丢失一次更新得到 num=1
  </text>

  <!-- timeline axis -->
  <line x1="480" y1="90" x2="480" y2="530" stroke="#BBBAB2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="480" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#888"> 时间 ↓ </text>

  <!-- lane headers -->
  <rect x="60" y="90" width="300" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="110" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">线程 A：reg_A = num; reg_A+1; num = reg_A</text>

  <rect x="600" y="90" width="300" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="750" y="110" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">线程 B：reg_B = num; reg_B+1; num = reg_B</text>

  <!-- step boxes: A on left, B on right, ordered by time -->
  <!-- t1: A load -->
  <rect x="60" y="160" width="300" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="182" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#0C447C">① load：reg_A ← num (0)</text>

  <!-- t2: B load -->
  <rect x="600" y="220" width="300" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="750" y="242" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#633806">② load：reg_B ← num (0)</text>

  <!-- t3: A add+store -->
  <rect x="60" y="280" width="300" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="302" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#0C447C">③ add+store：num ← 1</text>

  <!-- t4: B add+store overwrite -->
  <rect x="600" y="340" width="300" height="44" rx="8" fill="#FBE9E7" stroke="#B3261E" stroke-width="0.5"/>
  <text x="750" y="362" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#7A1B14">④ add+store：num ← 1（覆盖了 ③）</text>

  <!-- num value tracker on axis -->
  <circle cx="480" cy="182" r="5" fill="#185FA5"/>
  <circle cx="480" cy="242" r="5" fill="#854F0B"/>
  <circle cx="480" cy="302" r="5" fill="#185FA5"/>
  <circle cx="480" cy="362" r="5" fill="#B3261E"/>

  <!-- connectors -->
  <path d="M360 182 L475 182" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 242 L485 242" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M360 302 L475 302" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 362 L485 362" fill="none" stroke="#B3261E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- result -->
  <rect x="300" y="450" width="360" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="480" y="474" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">最终 num = 1（而非 2）</text>
  <text x="480" y="498" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">两次 load 都读到旧值 0，后写覆盖先写 → 更新丢失</text>

  <text x="480" y="554" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    根因：读-改-写三步之间可被打断，不是一个不可分割的整体
  </text>
</svg>
