<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc">
<title id="title">eRPC：端点与资源所有权</title><desc id="desc">同一进程中，Nexus 管理公共设施，两个 owner thread 各自驱动 Rpc、Session、MsgBuffer 和 Transport。逻辑会话共享端点队列，控制面不承载正常 RPC 数据。</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3D5A80"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6B5E"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D655F"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B07D2B"/></marker>
</defs>
<g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" fill="#273530" text-anchor="start" font-weight="700">eRPC：端点与资源所有权</text>
<text x="48" y="77" font-size="14" fill="#5D655F" text-anchor="start">同一进程内的两个端点；Session 是软件状态，不是一条独占 RC 连接</text>
<rect x="48" y="100" width="1144" height="108" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="132" font-size="18" fill="#273530" text-anchor="start" font-weight="700">Nexus</text>
<text x="68" y="157" font-size="14" fill="#5D655F" text-anchor="start">进程公共设施</text>
<text x="68" y="184" font-size="13" fill="#5D655F" text-anchor="start">初始化与注册，不代替数据面 loop</text>
<rect x="340" y="125" width="248" height="56" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="464.0" y="150" font-size="15" fill="#24473F" text-anchor="middle" font-weight="600">会话管理 SM thread</text>
<text x="464.0" y="171" font-size="13" fill="#24473F" text-anchor="middle">内核管理网络 → 事件队列</text>
<rect x="614" y="125" width="256" height="56" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="742.0" y="150" font-size="15" fill="#24473F" text-anchor="middle" font-weight="600">Request type registry</text>
<text x="742.0" y="171" font-size="13" fill="#24473F" text-anchor="middle">在创建 Rpc 前注册 handler</text>
<rect x="896" y="125" width="276" height="56" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1034.0" y="150" font-size="15" fill="#6B4E28" text-anchor="middle" font-weight="600">可选 background workers</text>
<text x="1034.0" y="171" font-size="13" fill="#6B4E28" text-anchor="middle">允许的 API 仍有线程边界</text>
<text x="614" y="226" font-size="13" fill="#24473F" text-anchor="start">SM 事件入队，由 owner loop 处理</text>
<rect x="48" y="250" width="552" height="292" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="273" font-size="15" fill="#273530" text-anchor="start" font-weight="700">Owner thread A</text>
<rect x="64" y="282" width="520" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="324.0" y="314.0" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="600">Rpc A · run_event_loop_once()</text>
<rect x="80" y="358" width="232" height="62" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="196.0" y="383" font-size="15" fill="#24473F" text-anchor="middle" font-weight="600">Session 0、1、…</text>
<text x="196.0" y="404" font-size="13" fill="#24473F" text-anchor="middle">角色 · slots · credit · 路由</text>
<rect x="334" y="358" width="234" height="62" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="451.0" y="383" font-size="15" fill="#6B4E28" text-anchor="middle" font-weight="600">MsgBuffer / 分配器</text>
<text x="451.0" y="404" font-size="13" fill="#6B4E28" text-anchor="middle">容量、长度与借用生命期</text>
<path d="M 196 420 L 196 456" fill="none" stroke="#2F6B5E" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M 451 420 L 451 456" fill="none" stroke="#B07D2B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="80" y="456" width="488" height="57" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="324.0" y="481" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="600">Transport A</text>
<text x="324.0" y="502" font-size="13" fill="#2C4460" text-anchor="middle">收发批次 · 数据面 NIC 接口</text>
<rect x="640" y="250" width="552" height="292" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="660" y="273" font-size="15" fill="#273530" text-anchor="start" font-weight="700">Owner thread B</text>
<rect x="656" y="282" width="520" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="916.0" y="314.0" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="600">Rpc B · run_event_loop_once()</text>
<rect x="672" y="358" width="232" height="62" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="788.0" y="383" font-size="15" fill="#24473F" text-anchor="middle" font-weight="600">Session 0、1、…</text>
<text x="788.0" y="404" font-size="13" fill="#24473F" text-anchor="middle">角色 · slots · credit · 路由</text>
<rect x="926" y="358" width="234" height="62" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1043.0" y="383" font-size="15" fill="#6B4E28" text-anchor="middle" font-weight="600">MsgBuffer / 分配器</text>
<text x="1043.0" y="404" font-size="13" fill="#6B4E28" text-anchor="middle">容量、长度与借用生命期</text>
<path d="M 788 420 L 788 456" fill="none" stroke="#2F6B5E" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M 1043 420 L 1043 456" fill="none" stroke="#B07D2B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="672" y="456" width="488" height="57" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="916.0" y="481" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="600">Transport B</text>
<text x="916.0" y="502" font-size="13" fill="#2C4460" text-anchor="middle">收发批次 · 数据面 NIC 接口</text>
<rect x="48" y="567" width="1144" height="91" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="591" font-size="15" fill="#273530" text-anchor="start" font-weight="700">数据面 NIC 端口</text>
<text x="68" y="616" font-size="13" fill="#5D655F" text-anchor="start">队列归属按后端实现</text>
<text x="68" y="638" font-size="13" fill="#5D655F" text-anchor="start">不是一 Session 一队列</text>
<rect x="264" y="586" width="300" height="51" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="414.0" y="616.5" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="600">端点 A 的 TX / RX 队列</text>
<rect x="760" y="586" width="300" height="51" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="910.0" y="616.5" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="600">端点 B 的 TX / RX 队列</text>
<text x="620" y="682" font-size="13" fill="#5D655F" text-anchor="middle">图示队列为逻辑资源归属；实际队列数量、端口能力与共享方式以 Transport 实现为准</text>
<path d="M 464 181 L 464 237 L 324 237 L 324 282" fill="none" stroke="#2F6B5E" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
<path d="M 464 237 L 916 237 L 916 282" fill="none" stroke="#2F6B5E" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
<path d="M 324 513 L 324 552 L 414 552 L 414 586" fill="none" stroke="#3D5A80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 916 513 L 916 586" fill="none" stroke="#3D5A80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
</g></svg>
