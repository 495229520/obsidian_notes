<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="760px" viewBox="0 0 1280 760" version="1.1">
  <title>CUDA Week 3 naive versus tiled transpose memory access</title>
  <desc>Compares naive transpose global memory read and write patterns with tiled transpose using shared memory.</desc>
  <rect x="0" y="0" width="1280" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="lineArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#2f3f46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #18282f; }
      .section { font: 700 19px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #26343a; }
      .label { font: 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #34464d; }
      .small { font: 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526168; }
      .code { font: 15px Menlo, Consolas, monospace; fill: #26343a; }
      .cell { fill: #fffdf8; stroke: #7f8f88; stroke-width: 1.1; }
      .active { fill: #f7e5b8; stroke: #b79d58; stroke-width: 1.7; }
      .good { fill: #eaf4ef; stroke: #7b9d8e; stroke-width: 1.7; }
      .bad { fill: #f8e1dd; stroke: #bd7a6c; stroke-width: 1.7; }
      .shared { fill: #e7eef7; stroke: #8fa4bd; stroke-width: 1.7; }
      .panel { fill: #fffdf8; stroke: #2f3f46; stroke-width: 1.6; }
      .arrow { stroke: #2f3f46; stroke-width: 2.1; fill: none; marker-end: url(#lineArrow); }
      .goodLine { stroke: #4f8b6d; stroke-width: 4; stroke-linecap: round; }
      .badLine { stroke: #bd6f61; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="title" x="640" y="42" text-anchor="middle">Naive transpose 的读写矛盾与 tiled 解决思路</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="640" y="76" text-anchor="middle">naive 直接从 global memory 转置：读连续但写跨步；tiled 借 shared memory 重排，让 global 两端都尽量连续</text>

  <rect class="panel" x="55" y="112" width="1170" height="255" rx="10"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="95" y="148">Naive transpose</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="95" y="176">out[x * height + y] = in[y * width + x]</text>

  <g transform="translate(100 205)">
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="160" y="-12" text-anchor="middle">global load: x 连续</text>
    <g>
      <rect class="active" x="0" y="0" width="42" height="42"/><rect class="active" x="42" y="0" width="42" height="42"/>
      <rect class="active" x="84" y="0" width="42" height="42"/><rect class="active" x="126" y="0" width="42" height="42"/>
      <rect class="cell" x="168" y="0" width="42" height="42"/><rect class="cell" x="210" y="0" width="42" height="42"/>
      <rect class="cell" x="252" y="0" width="42" height="42"/><rect class="cell" x="294" y="0" width="42" height="42"/>
      <line class="goodLine" x1="8" y1="58" x2="160" y2="58"/>
      <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="168" y="83" text-anchor="middle">thread 0..31 访问相邻地址</text>
    </g>
  </g>

  <path class="arrow" d="M500 250 C555 220, 620 220, 675 250"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="588" y="218" text-anchor="middle">same warp</text>

  <g transform="translate(760 180)">
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="170" y="7" text-anchor="middle">global store: 相邻线程相差 height</text>
    <rect class="bad" x="0" y="32" width="42" height="42"/>
    <rect class="cell" x="42" y="32" width="42" height="42"/>
    <rect class="cell" x="84" y="32" width="42" height="42"/>
    <rect class="cell" x="126" y="32" width="42" height="42"/>
    <rect class="bad" x="168" y="32" width="42" height="42"/>
    <rect class="cell" x="210" y="32" width="42" height="42"/>
    <rect class="cell" x="252" y="32" width="42" height="42"/>
    <rect class="cell" x="294" y="32" width="42" height="42"/>
    <rect class="bad" x="336" y="32" width="42" height="42"/>
    <line class="badLine" x1="21" y1="90" x2="357" y2="90"/>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="190" y="119" text-anchor="middle">store 跨步，内存事务难合并</text>
  </g>

  <rect x="150" y="318" width="980" height="34" rx="7" fill="#f8e1dd" stroke="#bd7a6c" stroke-width="1.3"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="640" y="340" text-anchor="middle">naive 的矛盾：让读连续时，写通常变成跨步；换映射让写连续时，读又会跨步</text>

  <rect class="panel" x="55" y="392" width="1170" height="285" rx="10"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="95" y="418">Tiled transpose</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="95" y="445">shared memory tile 承担“转身”动作，global memory 两侧保持规则访问</text>

  <g transform="translate(115 482)">
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="120" y="-18" text-anchor="middle">Global input</text>
    <g>
      <rect class="good" x="0" y="0" width="42" height="42"/><rect class="good" x="42" y="0" width="42" height="42"/>
      <rect class="good" x="84" y="0" width="42" height="42"/><rect class="good" x="126" y="0" width="42" height="42"/>
      <rect class="cell" x="0" y="42" width="42" height="42"/><rect class="cell" x="42" y="42" width="42" height="42"/>
      <rect class="cell" x="84" y="42" width="42" height="42"/><rect class="cell" x="126" y="42" width="42" height="42"/>
      <line class="goodLine" x1="7" y1="104" x2="160" y2="104"/>
      <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="85" y="130" text-anchor="middle">coalesced read</text>
    </g>
  </g>

  <path class="arrow" d="M315 540 C365 520, 410 520, 462 540"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="390" y="510" text-anchor="middle">load tile</text>

  <g transform="translate(500 468)">
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="140" y="-5" text-anchor="middle">Shared memory tile</text>
    <rect class="shared" x="40" y="25" width="200" height="120" rx="8"/>
    <line x1="90" y1="25" x2="90" y2="145" stroke="#8fa4bd" stroke-width="1"/>
    <line x1="140" y1="25" x2="140" y2="145" stroke="#8fa4bd" stroke-width="1"/>
    <line x1="190" y1="25" x2="190" y2="145" stroke="#8fa4bd" stroke-width="1"/>
    <line x1="40" y1="65" x2="240" y2="65" stroke="#8fa4bd" stroke-width="1"/>
    <line x1="40" y1="105" x2="240" y2="105" stroke="#8fa4bd" stroke-width="1"/>
    <path d="M73 122 C95 52, 174 45, 205 65" stroke="#2f3f46" stroke-width="2.2" fill="none" marker-end="url(#lineArrow)"/>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="140" y="172" text-anchor="middle">block 内同步后再转置读取</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="140" y="188" text-anchor="middle">__syncthreads()</text>
  </g>

  <path class="arrow" d="M760 540 C815 520, 865 520, 915 540"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="838" y="510" text-anchor="middle">store tile</text>

  <g transform="translate(960 482)">
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="120" y="-18" text-anchor="middle">Global output</text>
    <g>
      <rect class="good" x="0" y="0" width="42" height="42"/><rect class="good" x="42" y="0" width="42" height="42"/>
      <rect class="good" x="84" y="0" width="42" height="42"/><rect class="good" x="126" y="0" width="42" height="42"/>
      <rect class="cell" x="0" y="42" width="42" height="42"/><rect class="cell" x="42" y="42" width="42" height="42"/>
      <rect class="cell" x="84" y="42" width="42" height="42"/><rect class="cell" x="126" y="42" width="42" height="42"/>
      <line class="goodLine" x1="7" y1="104" x2="160" y2="104"/>
      <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="85" y="130" text-anchor="middle">coalesced write</text>
    </g>
  </g>

  <rect x="315" y="702" width="650" height="34" rx="7" fill="#eaf4ef" stroke="#7b9d8e" stroke-width="1.3"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="640" y="724" text-anchor="middle">关键不是“shared 一定快”，而是它让 global load/store 的地址形状更规整</text>
</svg>
