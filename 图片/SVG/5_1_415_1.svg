<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <!-- 标题 -->
  <text x="490" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#2c3e50">415. 字符串相加 · 高精度加法</text>
  <text x="490" y="66" text-anchor="middle" font-size="15" fill="#7f8c8d">示例：num1 = "99" ， num2 = "999" → 结果 "1098"</text>

  <!-- ===== 第一步：逆序存储 ===== -->
  <rect x="30" y="84" width="920" height="108" rx="8" fill="#ffffff" stroke="#cfcabb" stroke-width="1.5"/>
  <text x="46" y="108" font-size="16" font-weight="700" fill="#34495e">① 逆序存入 vector（低位存低索引，方便进位）</text>

  <!-- num1 -> A -->
  <text x="60" y="140" font-size="14" fill="#555">num1 "99"</text>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="150" y="124" width="40" height="40" rx="5" fill="#eaf2fb" stroke="#5b8fd6"/><text x="170" y="151" fill="#2c3e50">9</text>
    <rect x="194" y="124" width="40" height="40" rx="5" fill="#eaf2fb" stroke="#5b8fd6"/><text x="214" y="151" fill="#2c3e50">9</text>
  </g>
  <text x="170" y="180" font-size="12" text-anchor="middle" fill="#999">个位</text>
  <text x="214" y="180" font-size="12" text-anchor="middle" fill="#999">十位</text>

  <!-- num2 -> B -->
  <text x="520" y="140" font-size="14" fill="#555">num2 "999"</text>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="630" y="124" width="40" height="40" rx="5" fill="#f3ecf9" stroke="#9b6fc6"/><text x="650" y="151" fill="#2c3e50">9</text>
    <rect x="674" y="124" width="40" height="40" rx="5" fill="#f3ecf9" stroke="#9b6fc6"/><text x="694" y="151" fill="#2c3e50">9</text>
    <rect x="718" y="124" width="40" height="40" rx="5" fill="#f3ecf9" stroke="#9b6fc6"/><text x="738" y="151" fill="#2c3e50">9</text>
  </g>
  <text x="650" y="180" font-size="12" text-anchor="middle" fill="#999">个位</text>
  <text x="694" y="180" font-size="12" text-anchor="middle" fill="#999">十位</text>
  <text x="738" y="180" font-size="12" text-anchor="middle" fill="#999">百位</text>

  <!-- ===== 第二步：逐位相加表 ===== -->
  <text x="46" y="220" font-size="16" font-weight="700" fill="#34495e">② 从低位到高位逐位相加：t = 进位 + A[i] + B[i]，写入 t%10，进位 = t/10</text>

  <!-- 表格底色行 -->
  <g>
    <rect x="30" y="232" width="920" height="56" fill="#e8eef6"/>            <!-- header -->
    <rect x="30" y="344" width="920" height="56" fill="#fbeede"/>            <!-- 进位入 -->
    <rect x="30" y="456" width="920" height="56" fill="#e3f1e3"/>            <!-- 结果 -->
  </g>

  <!-- 网格线 -->
  <g stroke="#c9c3b4" stroke-width="1">
    <line x1="30" y1="232" x2="950" y2="232"/>
    <line x1="30" y1="288" x2="950" y2="288"/>
    <line x1="30" y1="344" x2="950" y2="344"/>
    <line x1="30" y1="400" x2="950" y2="400"/>
    <line x1="30" y1="456" x2="950" y2="456"/>
    <line x1="30" y1="512" x2="950" y2="512"/>
    <line x1="30" y1="232" x2="30" y2="512"/>
    <line x1="230" y1="232" x2="230" y2="512"/>
    <line x1="410" y1="232" x2="410" y2="512"/>
    <line x1="590" y1="232" x2="590" y2="512"/>
    <line x1="770" y1="232" x2="770" y2="512"/>
    <line x1="950" y1="232" x2="950" y2="512"/>
  </g>

  <!-- 行标签 -->
  <g font-size="14" fill="#555" text-anchor="start">
    <text x="44" y="265">步骤</text>
    <text x="44" y="321">进位（入）</text>
    <text x="44" y="377">A[i]</text>
    <text x="44" y="433">B[i]</text>
    <text x="44" y="489">写入 C / 新进位</text>
  </g>
  <!-- header 第二行说明 -->
  <text x="44" y="282" font-size="11" fill="#8a93a0">i 从 0 起</text>

  <!-- 列表头 -->
  <g font-size="15" font-weight="700" fill="#2c3e50" text-anchor="middle">
    <text x="320" y="258">i = 0</text><text x="320" y="278" font-size="12" font-weight="400" fill="#7f8c8d">个位</text>
    <text x="500" y="258">i = 1</text><text x="500" y="278" font-size="12" font-weight="400" fill="#7f8c8d">十位</text>
    <text x="680" y="258">i = 2</text><text x="680" y="278" font-size="12" font-weight="400" fill="#7f8c8d">百位</text>
    <text x="860" y="258">收尾</text><text x="860" y="278" font-size="12" font-weight="400" fill="#7f8c8d">剩余进位</text>
  </g>

  <!-- 进位入行 -->
  <g font-size="20" font-weight="700" fill="#c0712a" text-anchor="middle">
    <text x="320" y="321">0</text>
    <text x="500" y="321">1</text>
    <text x="680" y="321">1</text>
    <text x="860" y="321">1</text>
  </g>

  <!-- A[i] 行 -->
  <g font-size="20" font-weight="700" fill="#3a6bb0" text-anchor="middle">
    <text x="320" y="377">9</text>
    <text x="500" y="377">9</text>
    <text x="680" y="375" fill="#b0b0b0" font-size="16">—</text>
    <text x="860" y="377" fill="#b0b0b0">·</text>
  </g>
  <text x="680" y="392" font-size="10" text-anchor="middle" fill="#aa6">越界，跳过</text>

  <!-- B[i] 行 -->
  <g font-size="20" font-weight="700" fill="#7a4ba3" text-anchor="middle">
    <text x="320" y="433">9</text>
    <text x="500" y="433">9</text>
    <text x="680" y="433">9</text>
    <text x="860" y="433" fill="#b0b0b0">·</text>
  </g>

  <!-- 结果行：t / 写入 / 进位 -->
  <g text-anchor="middle">
    <text x="320" y="481" font-size="13" fill="#555">t = 0+9+9 = 18</text>
    <text x="320" y="503" font-size="14" font-weight="700" fill="#27795b">C←8  进位1</text>

    <text x="500" y="481" font-size="13" fill="#555">t = 1+9+9 = 19</text>
    <text x="500" y="503" font-size="14" font-weight="700" fill="#27795b">C←9  进位1</text>

    <text x="680" y="481" font-size="13" fill="#555">t = 1+0+9 = 10</text>
    <text x="680" y="503" font-size="14" font-weight="700" fill="#27795b">C←0  进位1</text>

    <text x="860" y="481" font-size="13" fill="#555">t = 1（剩余）</text>
    <text x="860" y="503" font-size="14" font-weight="700" fill="#27795b">C←1  进位0</text>
  </g>

  <!-- ===== 第三步：逆序输出 ===== -->
  <rect x="30" y="528" width="920" height="108" rx="8" fill="#ffffff" stroke="#cfcabb" stroke-width="1.5"/>
  <text x="46" y="552" font-size="16" font-weight="700" fill="#34495e">③ C = [8, 9, 0, 1]，逆序输出（高位 → 低位）得到结果</text>

  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="80" y="568" width="40" height="40" rx="5" fill="#e3f1e3" stroke="#4f9e6f"/><text x="100" y="595" fill="#2c3e50">8</text>
    <rect x="124" y="568" width="40" height="40" rx="5" fill="#e3f1e3" stroke="#4f9e6f"/><text x="144" y="595" fill="#2c3e50">9</text>
    <rect x="168" y="568" width="40" height="40" rx="5" fill="#e3f1e3" stroke="#4f9e6f"/><text x="188" y="595" fill="#2c3e50">0</text>
    <rect x="212" y="568" width="40" height="40" rx="5" fill="#e3f1e3" stroke="#4f9e6f"/><text x="232" y="595" fill="#2c3e50">1</text>
  </g>
  <text x="166" y="626" font-size="11" text-anchor="middle" fill="#999">C[0] … C[3]</text>

  <text x="330" y="595" font-size="26" fill="#7f8c8d">⟹</text>

  <text x="430" y="600" font-size="34" font-weight="700" fill="#c0392b">1098</text>
  <text x="640" y="595" font-size="16" fill="#555">res = "1098" ，即 99 + 999 = 1098</text>
</svg>
