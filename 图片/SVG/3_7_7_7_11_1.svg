<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>BGP-EVPN：控制路径与租户数据路径分开看</title>
<desc>上半部表示 VTEP-B 经路由反射器向 A 分发 Type-2/3，下半部表示租户数据按 VTEP 下一跳发送。底部是实际安装前后的验证阶段。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">BGP-EVPN：控制路径与租户数据路径分开看</text>
<text x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">从 RR 学到路由，不代表把 VXLAN 数据发给 RR。</text>
<rect x="32" y="112" width="1176" height="416" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="470" y="128" width="300" height="80" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="620.0" y="151.0" font-size="14" font-weight="700" fill="#4A3F68" text-anchor="middle">EVPN Route Reflector</text>
<text x="620.0" y="173.0" font-size="14" font-weight="400" fill="#4A3F68" text-anchor="middle">反射 Type-2 / Type-3</text>
<text x="620.0" y="195.0" font-size="14" font-weight="400" fill="#4A3F68" text-anchor="middle">数据下一跳仍可为 B</text>
<rect x="82" y="294" width="250" height="114" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="207.0" y="334.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">VTEP-A</text>
<text x="207.0" y="356.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">10.255.0.1</text>
<text x="207.0" y="378.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">服务导入 / FDB / 代理表</text>
<rect x="908" y="294" width="250" height="114" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1033.0" y="334.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">VTEP-B</text>
<text x="1033.0" y="356.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">10.255.0.2</text>
<text x="1033.0" y="378.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">本地端点发现 / 路由通告</text>
<path d="M1033,290 L1033,168 L774,168" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="7 5"/>
<path d="M466,168 L207,168 L207,290" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="7 5"/>
<text x="828" y="148" font-size="14" font-weight="400" fill="#2C4460" text-anchor="start">BGP 控制信息</text>
<text x="265" y="148" font-size="14" font-weight="400" fill="#2C4460" text-anchor="start">BGP 控制信息</text>
<text x="620" y="265" font-size="15" font-weight="700" fill="#4A3F68" text-anchor="middle">租户数据不以 RR 为必经端点</text>
<path d="M336,352 L904,352" fill="none" stroke="#2F6B5E" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="620" y="330" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle">VXLAN / UDP 4789 / VNI 10100</text>
<text x="620" y="384" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">Outer Dst IP = 10.255.0.2</text>
<rect x="82" y="457" width="200" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="182.0" y="489.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">H1 · 租户端点</text>
<rect x="958" y="457" width="200" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1058.0" y="489.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">H2 · 租户端点</text>
<path d="M182,453 L182,412" fill="none" stroke="#2F6B5E" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M1058,412 L1058,453" fill="none" stroke="#2F6B5E" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="620" y="475" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="middle">会话 Up ≠ 路由导入 ≠ FDB 已安装</text>
<text x="48" y="559" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">本地验证：按状态层次追踪，不跳过最后一步</text>
<rect x="48" y="579" width="200" height="62" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="148.0" y="604.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">接收 NLRI</text>
<text x="148.0" y="626.0" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle">全局 EVPN RIB</text>
<path d="M252,610 L280,610" fill="none" stroke="#5A564B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="284" y="579" width="200" height="62" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="384.0" y="604.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">RT 导入</text>
<text x="384.0" y="626.0" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle">本地 MAC/IP-VRF</text>
<path d="M488,610 L516,610" fill="none" stroke="#5A564B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="520" y="579" width="200" height="62" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="620.0" y="604.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">选择与解析</text>
<text x="620.0" y="626.0" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle">远端位置 / Underlay</text>
<path d="M724,610 L752,610" fill="none" stroke="#5A564B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="756" y="579" width="200" height="62" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="856.0" y="604.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">实际安装</text>
<text x="856.0" y="626.0" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle">内核 / ASIC FIB</text>
<path d="M960,610 L988,610" fill="none" stroke="#5A564B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="992" y="579" width="200" height="62" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1092.0" y="604.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">双端验收</text>
<text x="1092.0" y="626.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">表项 / 抓包 / 业务</text>
<path d="M48,655 L1192,655" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="48" y="680" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">拓扑为普通 iBGP RR 教学示意；并非所有 EVPN 部署都使用 RR；实际安装过程可能异步或交错执行。</text>
</svg>
