<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>P99 的边界：从哪个时刻开始，到哪个完成事件结束</title>
<desc>上半部区分延迟口径；下半部使用合成样本，展示加权合并与平均分位数的区别</desc>
<defs>
<marker id="arr_n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5A564B"/></marker>
<marker id="arr_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3D5A80"/></marker>
<marker id="arr_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6B5E"/></marker>
<marker id="arr_r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="690" fill="rgb(245, 244, 237)"/>
<text x="48" y="43" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="title">P99 的边界：从哪个时刻开始，到哪个完成事件结束</text>
<text x="48" y="72" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="subtitle">上半部区分延迟口径；下半部使用合成样本，展示加权合并与平均分位数的区别</text>
<text x="48" y="118" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">A · 同一次请求，多个有效但不同的指标</text>
<polyline points="130,190 1149,190" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_n)"/>
<polyline points="159,172 159,204" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="159" y="147" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">t_due</text>
<text x="159" y="169" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">计划到达</text>
<polyline points="369,172 369,204" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="369" y="147" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">t_issue</text>
<text x="369" y="169" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">实际发起</text>
<polyline points="578,172 578,204" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="578" y="147" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">t_post</text>
<text x="578" y="169" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">开始提交</text>
<polyline points="808,172 808,204" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="808" y="147" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">t_cq</text>
<text x="808" y="169" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">观察 WC</text>
<polyline points="1100,172 1100,204" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1100" y="147" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">t_ack</text>
<text x="1100" y="169" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">业务确认</text>
<rect x="159" y="227" width="941" height="29" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="629.5" y="247" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body" data-region="163,229,933,25">scheduled_response</text>
<rect x="369" y="269" width="731" height="29" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="734.5" y="289" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body" data-region="373,271,723,25">issued_response</text>
<rect x="578" y="311" width="230" height="29" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="693.0" y="331" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body" data-region="582,313,222,25">post → CQ observed</text>
<text x="852" y="332" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">CQ 完成 ≠ 远端业务已消费</text>
<text x="48" y="391" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">B · 合成反例：平均各流 P99 没有整体分位数意义</text>
<rect x="48" y="413" width="504" height="170" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="67" y="443" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">流 A：10,000 个样本 × 1 μs</text>
<text x="67" y="479" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">流 B：100 个样本 × 100 μs</text>
<text x="67" y="527" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">各流 P99：1 μs / 100 μs</text>
<text x="67" y="559" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">平均各流 P99：50.5 μs</text>
<text x="596" y="441" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">合并后：10,100 个成功样本</text>
<rect x="596" y="472" width="576.2376237623762" height="38" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<rect x="1172.2376237623762" y="472" width="5.762376237623812" height="38" rx="0" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="611" y="497" font-size="14" fill="#24473F" font-weight="400" text-anchor="start" data-role="body">前 10,000 个：1 μs</text>
<polyline points="1172.1776237623762,517 1172.1776237623762,543 943,543" fill="none" stroke="#5A564B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="563" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">P99 rank = 9,999 → 整体 P99 = 1 μs</text>
<text x="48" y="627" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">整体指标与 per-flow 指标一起报告；成功分布还必须配错误、超时与未完成计数</text>
<text x="48" y="665" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">分位数采用 nearest-rank；此图不推断任何真实 Fabric 性能。不同口径、单位或采样权重的分布不能混合。</text>
</svg>