<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="560px" viewBox="0 0 900 560" version="1.1">
  <rect x="0" y="0" width="900" height="560" fill="rgb(245, 244, 237)" />
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b03b2e" />
    </marker>
  </defs>

  <text fill="#222" font-size="22" font-weight="700" font-family="system-ui, sans-serif" x="450" y="34" text-anchor="middle">竖式过程：1 / 6 = 0.1(6)</text>
  <text fill="#666" font-size="14" font-family="system-ui, sans-serif" x="450" y="60" text-anchor="middle">先记录余数位置再写商：mp[rem] = ans.size()，余数重复就停下来括循环节</text>
  <line stroke="#d9d5c9" stroke-width="1" x1="36" y1="84" x2="864" y2="84" />

  <text fill="#555" font-size="13.5" font-family="system-ui, sans-serif" x="40" y="108">起点：整数部分 0，ans = "0." （长度 2），余数 rem = 1</text>

  <!-- Table header -->
  <rect fill="#e8e6dc" stroke="#cfcabb" stroke-width="1" x="40" y="122" width="820" height="38" rx="6" />
  <text fill="#444" font-size="13.5" font-weight="700" font-family="system-ui, sans-serif" x="78"  y="146" text-anchor="middle">轮次</text>
  <text fill="#444" font-size="13.5" font-weight="700" font-family="system-ui, sans-serif" x="160" y="146" text-anchor="middle">余数 rem</text>
  <text fill="#444" font-size="13.5" font-weight="700" font-family="system-ui, sans-serif" x="255" y="146" text-anchor="middle">见过?</text>
  <text fill="#444" font-size="13.5" font-weight="700" font-family="system-ui, sans-serif" x="400" y="146" text-anchor="middle">记录 / 操作</text>
  <text fill="#444" font-size="13.5" font-weight="700" font-family="system-ui, sans-serif" x="565" y="146" text-anchor="middle">商 = rem×10 / 6</text>
  <text fill="#444" font-size="13.5" font-weight="700" font-family="system-ui, sans-serif" x="690" y="146" text-anchor="middle">ans</text>
  <text fill="#444" font-size="13.5" font-weight="700" font-family="system-ui, sans-serif" x="815" y="146" text-anchor="middle">新 rem</text>

  <!-- Row 1 -->
  <rect fill="#ffffff" stroke="#dcd8cc" stroke-width="1" x="40" y="162" width="820" height="46" />
  <text fill="#333" font-size="14" font-family="system-ui, sans-serif" x="78"  y="190" text-anchor="middle">轮 1</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="160" y="190" text-anchor="middle">1</text>
  <text fill="#246b45" font-size="13.5" font-family="system-ui, sans-serif" x="255" y="190" text-anchor="middle">否</text>
  <text fill="#2c5070" font-size="13.5" font-family="ui-monospace, monospace" x="400" y="190" text-anchor="middle">mp[1] = 2</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="565" y="190" text-anchor="middle">10 / 6 = 1</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="690" y="190" text-anchor="middle">"0.1"</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="815" y="190" text-anchor="middle">4</text>

  <!-- Row 2 -->
  <rect fill="#f6f5ef" stroke="#dcd8cc" stroke-width="1" x="40" y="208" width="820" height="46" />
  <text fill="#333" font-size="14" font-family="system-ui, sans-serif" x="78"  y="236" text-anchor="middle">轮 2</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="160" y="236" text-anchor="middle">4</text>
  <text fill="#246b45" font-size="13.5" font-family="system-ui, sans-serif" x="255" y="236" text-anchor="middle">否</text>
  <text fill="#2c5070" font-size="13.5" font-family="ui-monospace, monospace" x="400" y="236" text-anchor="middle">mp[4] = 3</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="565" y="236" text-anchor="middle">40 / 6 = 6</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="690" y="236" text-anchor="middle">"0.16"</text>
  <text fill="#333" font-size="14" font-family="ui-monospace, monospace" x="815" y="236" text-anchor="middle">4</text>

  <!-- Row 3 (cycle hit) -->
  <rect fill="#fbe5e2" stroke="#d8887f" stroke-width="1.4" x="40" y="254" width="820" height="46" />
  <text fill="#b03b2e" font-size="14" font-weight="700" font-family="system-ui, sans-serif" x="78"  y="282" text-anchor="middle">轮 3</text>
  <text fill="#b03b2e" font-size="14" font-weight="700" font-family="ui-monospace, monospace" x="160" y="282" text-anchor="middle">4</text>
  <text fill="#b03b2e" font-size="13.5" font-weight="700" font-family="system-ui, sans-serif" x="255" y="282" text-anchor="middle">是! pos=3</text>
  <text fill="#b03b2e" font-size="13.5" font-family="ui-monospace, monospace" x="400" y="282" text-anchor="middle">在 pos=3 插 "(" ，末尾补 ")"</text>
  <text fill="#999" font-size="14" font-family="ui-monospace, monospace" x="565" y="282" text-anchor="middle">—</text>
  <text fill="#b03b2e" font-size="14" font-weight="700" font-family="ui-monospace, monospace" x="690" y="282" text-anchor="middle">"0.1(6)"</text>
  <text fill="#b03b2e" font-size="13.5" font-family="system-ui, sans-serif" x="815" y="282" text-anchor="middle">停止</text>

  <line stroke="#d9d5c9" stroke-width="1" stroke-dasharray="6 5" x1="36" y1="324" x2="864" y2="324" />

  <!-- Result string visualization -->
  <text fill="#333" font-size="15" font-weight="700" font-family="system-ui, sans-serif" x="40" y="356">余数 → 位置：插入括号前的串 "0.16"</text>

  <!-- char boxes for 0 . 1 6 -->
  <g font-family="ui-monospace, monospace">
    <rect fill="#ffffff" stroke="#b9c8da" stroke-width="1.3" x="120" y="378" width="60" height="60" rx="6" />
    <text fill="#333" font-size="26" x="150" y="418" text-anchor="middle">0</text>
    <text fill="#888" font-size="13" x="150" y="458" text-anchor="middle">0</text>

    <rect fill="#ffffff" stroke="#b9c8da" stroke-width="1.3" x="185" y="378" width="60" height="60" rx="6" />
    <text fill="#333" font-size="26" x="215" y="418" text-anchor="middle">.</text>
    <text fill="#888" font-size="13" x="215" y="458" text-anchor="middle">1</text>

    <rect fill="#eef5ef" stroke="#78b887" stroke-width="1.5" x="250" y="378" width="60" height="60" rx="6" />
    <text fill="#246b45" font-size="26" x="280" y="418" text-anchor="middle">1</text>
    <text fill="#888" font-size="13" x="280" y="458" text-anchor="middle">2</text>

    <rect fill="#fbe5e2" stroke="#d8887f" stroke-width="1.5" x="315" y="378" width="60" height="60" rx="6" />
    <text fill="#b03b2e" font-size="26" x="345" y="418" text-anchor="middle">6</text>
    <text fill="#888" font-size="13" x="345" y="458" text-anchor="middle">3</text>
  </g>

  <!-- mp pointers -->
  <text fill="#246b45" font-size="13.5" font-family="ui-monospace, monospace" x="280" y="492" text-anchor="middle">mp[1]=2</text>
  <text fill="#b03b2e" font-size="13.5" font-family="ui-monospace, monospace" x="345" y="492" text-anchor="middle">mp[4]=3</text>

  <!-- insertion arrow -->
  <line stroke="#b03b2e" stroke-width="1.6" marker-end="url(#arrow2)" x1="430" y1="408" x2="470" y2="408" />

  <g font-family="ui-monospace, monospace">
    <rect fill="#fff8ec" stroke="#e3c890" stroke-width="1.4" x="486" y="378" width="320" height="60" rx="8" />
    <text fill="#333" font-size="26" x="646" y="418" text-anchor="middle">0 . 1 ( 6 )</text>
  </g>
  <text fill="#9a6b1e" font-size="13.5" font-family="system-ui, sans-serif" x="646" y="462" text-anchor="middle">余数 4 重复 → 从位置 3 起是循环节</text>

  <text fill="#555" font-size="13" font-family="system-ui, sans-serif" x="450" y="528" text-anchor="middle">注意：mp[rem] 存的是「下一位商将写入的下标」，所以它正好指向循环节的第一个数字</text>
</svg>
