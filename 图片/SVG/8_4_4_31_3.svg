<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<title id="title">谁在推动请求：busy、协作式轮询与 wakeup</title>
<desc id="desc">上部以时间条对比三种调用间隔，下部展示drain-check-arm-wait-progress循环及BUSY必须返回推进的分支。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="740" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">谁在推动请求：busy、协作式轮询与 wakeup</text>
<text x="48" y="76" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">progress 返回值描述本次进展，不代表某个指定 request 已完成</text>
<line x1="48" y1="96" x2="1192" y2="96" stroke="#D8D5C8" stroke-width="1"/>
<text x="218" y="132" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">时间 →</text>
<text x="68" y="187" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">Busy poll</text>
<line x1="214" y1="207" x2="1170" y2="207" stroke="#9B968A" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="68" y="263" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">协作式</text>
<line x1="214" y1="283" x2="1170" y2="283" stroke="#9B968A" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="68" y="339" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">事件等待</text>
<line x1="214" y1="359" x2="1170" y2="359" stroke="#9B968A" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="222" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="277" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="332" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="387" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="442" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="497" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="552" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="607" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="662" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="717" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="772" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="827" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="882" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="937" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="992" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="1047" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<rect x="1102" y="161" width="31" height="32" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="717" y="152" font-size="12" fill="#3D5A80" text-anchor="middle" font-weight="400" data-role="body">不断 progress；空闲 CPU 也有成本</text>
<rect x="222" y="237" width="178" height="36" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="311.0" y="259.2" font-size="12" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">业务计算</text>
<rect x="408" y="237" width="89" height="36" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="452.5" y="259.2" font-size="12" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">progress</text>
<rect x="505" y="237" width="277" height="36" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="643.5" y="259.2" font-size="12" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">业务计算</text>
<rect x="790" y="237" width="89" height="36" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="834.5" y="259.2" font-size="12" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">progress</text>
<rect x="887" y="237" width="256" height="36" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="1015.0" y="259.2" font-size="12" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">业务计算</text>
<rect x="222" y="313" width="129" height="36" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="286.5" y="335.2" font-size="12" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">progress</text>
<rect x="359" y="313" width="116" height="36" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="417.0" y="335.2" font-size="12" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">arm</text>
<rect x="483" y="313" width="418" height="36" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="692.0" y="335.2" font-size="12" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">poll 睡眠：不在调用 progress</text>
<rect x="909" y="313" width="234" height="36" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="1026.0" y="335.2" font-size="12" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">醒来后再次 progress</text>
<text x="68" y="410" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">WAKEUP 循环：arm 封住“检查空闲 → 睡下”之间的窗口</text>
<rect x="70" y="464" width="222" height="78" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="181.0" y="496.55" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">① progress / drain</text>
<text x="181.0" y="518.55" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">并检查完成条件</text>
<rect x="348" y="464" width="222" height="78" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="459.0" y="496.55" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">② worker_arm</text>
<text x="459.0" y="518.55" font-size="13" fill="#4A3F68" text-anchor="middle" font-weight="400" data-role="body">取得 arm 结果</text>
<rect x="682" y="464" width="222" height="78" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="793.0" y="496.55" font-size="13" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">③ poll / epoll</text>
<text x="793.0" y="518.55" font-size="13" fill="#4A473F" text-anchor="middle" font-weight="400" data-role="body">仅 UCS_OK 后睡眠</text>
<rect x="960" y="464" width="220" height="78" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1070.0" y="496.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">④ 再次 progress</text>
<text x="1070.0" y="518.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">观察自己的 request</text>
<line x1="294" y1="503" x2="345" y2="503" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="572" y1="503" x2="679" y2="503" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="624" y="487" font-size="12" fill="#2F6B5E" text-anchor="middle" font-weight="400" data-role="body">OK</text>
<line x1="906" y1="503" x2="957" y2="503" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="459,544 459,584 181,584 181,545" fill="none" stroke="#A64B3C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="314" y="606" font-size="13" fill="#A64B3C" text-anchor="middle" font-weight="400" data-role="body">BUSY：不能睡，继续推进</text>
<polyline points="1070,544 1070,630 52,630 52,503 67,503" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<line x1="48" y1="670" x2="1192" y2="670" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="696" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">ucp_worker_wait() 是另一种等待事件接口，不是让所有请求自动前进的后台执行器。</text>
<text x="48" y="717" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">时间不按比例；wakeup 需要相应能力与正确事件循环。</text>
</svg>