<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>DPDK：内核准备资源，用户线程推进数据面</title><desc>控制面建立设备与内存映射，应用线程调用同线程PMD，设备DMA访问主机数据区。</desc>
<defs>
<marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">DPDK：内核准备资源，用户线程推进数据面</text>
<text x="48" y="81" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">主路径：直接硬件 Ethernet PMD；不是所有 PMD 后端的统一硬件图。</text>
<rect x="56" y="111" width="1128" height="124" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="72" y="136" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">A · 控制面 / 初始化</text>
<rect x="80" y="158" width="280" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="220.0" y="179.5" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">应用：rte_eal_init</text>
<text x="220.0" y="199.5" font-size="13" fill="#4A473F" font-weight="400" text-anchor="middle" data-role="body">设备探测 / 内存 / lcore</text>
<rect x="455" y="158" width="300" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="605.0" y="179.5" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">内核控制与访问授权</text>
<text x="605.0" y="199.5" font-size="13" fill="#4A473F" font-weight="400" text-anchor="middle" data-role="body">VFIO / IOMMU / 驱动</text>
<rect x="850" y="158" width="300" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1000.0" y="179.5" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">端口 / Queue / DMA 映射</text>
<text x="1000.0" y="199.5" font-size="13" fill="#4A473F" font-weight="400" text-anchor="middle" data-role="body">能力查询 → 配置 → 启动</text>
<polyline points="362,185 451,185" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)" stroke-dasharray="5 4"/>
<polyline points="757,185 846,185" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)" stroke-dasharray="5 4"/>
<rect x="56" y="253" width="1128" height="153" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="72" y="278" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">B · 用户态 / 同一个 lcore 线程</text>
<rect x="80" y="307" width="230" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="195.0" y="334.0" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">应用处理循环</text>
<text x="195.0" y="354.0" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">分类 / 转发 / 协议状态</text>
<rect x="410" y="300" width="320" height="80" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="570.0" y="324.0" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">Ethernet PMD 代码</text>
<text x="570.0" y="344.0" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">rte_eth_rx_burst</text>
<text x="570.0" y="364.0" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">rte_eth_tx_burst</text>
<polyline points="312,331 406,331" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="360" y="318" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">函数调用</text>
<polyline points="408,375 314,375" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="360" y="396" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">packet 数 / 指针</text>
<rect x="847" y="307" width="302" height="66" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="998.0" y="334.0" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">不经过常规 socket 数据面</text>
<text x="998.0" y="354.0" font-size="13" fill="#4A473F" font-weight="400" text-anchor="middle" data-role="body">skb / TCP-IP / socket</text>
<rect x="56" y="433" width="1128" height="191" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="72" y="458" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">C · 硬件与主机内存</text>
<rect x="85" y="493" width="207" height="82" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="188.5" y="528.0" font-size="13" fill="#4A3F68" font-weight="700" text-anchor="middle" data-role="body">NIC 硬件</text>
<text x="188.5" y="548.0" font-size="13" fill="#4A3F68" font-weight="400" text-anchor="middle" data-role="body">RX / TX 引擎</text>
<rect x="431" y="487" width="255" height="92" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="558.5" y="517.0" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">主机内存：队列信息</text>
<text x="558.5" y="537.0" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">descriptor / completion</text>
<text x="558.5" y="557.0" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">PMD 读写，设备消费</text>
<rect x="859" y="487" width="290" height="92" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1004.0" y="517.0" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">主机内存：packet buffer</text>
<text x="1004.0" y="537.0" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">应用直接访问的数据区</text>
<text x="1004.0" y="557.0" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">mbuf 引用该区域</text>
<polyline points="557,380 557,483" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="574" y="425" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">队列操作</text>
<polyline points="457,380 457,420 333,420 333,473 189,473 189,489" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="345" y="460" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">发布 / Doorbell</text>
<polyline points="294,556 348,556 348,604 1005,604 1005,583" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/>
<text x="585" y="598" font-size="12" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">RX DMA 写入 / TX DMA 读取</text>
<text x="75" y="652" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">虚线：初始化</text>
<text x="320" y="652" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">深色：调用 / 队列 / 通知</text>
<text x="690" y="652" font-size="12" fill="#2C4460" font-weight="400" text-anchor="start" data-role="body">蓝色：DMA 字节移动</text>
<text x="48" y="673" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">边界：host buffer ≠ NIC 板载内存；mlx5 bifurcated 与 AF_XDP PMD 的控制/数据路径另行核验。</text>
</svg>