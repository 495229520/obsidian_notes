<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">三种实现资源与同步对比</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">19 资源占用对比：shared bytes、barrier、活跃线程</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“20.4 SM 资源竞争与 Occupancy”后</text>
<rect x="70" y="150" width="1140" height="410" rx="20" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="90" y="190" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">实现</text>
<text x="245" y="190" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Shared Memory / block</text>
<text x="490" y="190" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">block 内同步</text>
<text x="700" y="190" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">有效工作线程模式</text>
<text x="930" y="190" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">主要瓶颈</text>
<line x1="85" y1="210" x2="1185" y2="210" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
<rect x="85" y="220" width="1100" height="80" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" opacity="1"/>
<text x="90" y="255" font-size="16" font-weight="900" fill="#F59E0B" text-anchor="start">Naive</text>
<text x="245" y="255" font-size="14" font-weight="700" fill="#334155" text-anchor="start">0 B</text>
<text x="490" y="255" font-size="14" font-weight="700" fill="#334155" text-anchor="start">0</text>
<text x="700" y="255" font-size="14" font-weight="700" fill="#334155" text-anchor="start">只有 T0 串行循环</text>
<text x="930" y="255" font-size="14" font-weight="700" fill="#334155" text-anchor="start">global memory latency + divergence</text>
<rect x="85" y="330" width="1100" height="80" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" opacity="1"/>
<text x="90" y="365" font-size="16" font-weight="900" fill="#059669" text-anchor="start">Shared</text>
<text x="245" y="365" font-size="14" font-weight="700" fill="#334155" text-anchor="start">1024 B (float, 256T)</text>
<text x="490" y="365" font-size="14" font-weight="700" fill="#334155" text-anchor="start">加载后 + 8 轮</text>
<text x="700" y="365" font-size="14" font-weight="700" fill="#334155" text-anchor="start">128→64→32→...→1</text>
<text x="930" y="365" font-size="14" font-weight="700" fill="#334155" text-anchor="start">barrier + smem traffic</text>
<rect x="85" y="440" width="1100" height="80" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" opacity="1"/>
<text x="90" y="475" font-size="16" font-weight="900" fill="#2563EB" text-anchor="start">Shuffle</text>
<text x="245" y="475" font-size="14" font-weight="700" fill="#334155" text-anchor="start">32 B (float, 256T)</text>
<text x="490" y="475" font-size="14" font-weight="700" fill="#334155" text-anchor="start">1</text>
<text x="700" y="475" font-size="14" font-weight="700" fill="#334155" text-anchor="start">8 warps 并行 + warp0 final</text>
<text x="930" y="475" font-size="14" font-weight="700" fill="#334155" text-anchor="start">更少 smem / 更少 barrier</text>
<rect x="365" y="610" width="560" height="34" rx="17.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="645.0" y="632.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">默认 256 threads/block：Shared 需要 256*sizeof(T)，Shuffle 只需要 8*sizeof(T)</text>
</svg>
