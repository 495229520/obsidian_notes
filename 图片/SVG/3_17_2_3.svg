<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <rect x="0" y="0" width="960" height="580" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    acquire / release 配对建立 happens-before
  </text>
  <text x="480" y="56" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">
    release 之前的写，对「读到该值的」acquire 之后全部可见
  </text>

  <!-- Thread A lane -->
  <rect x="60" y="92" width="360" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="240" y="112" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">线程 A（生产者）</text>

  <rect x="60" y="160" width="360" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="240" y="182" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#444441">data = 42;        // 普通写</text>

  <rect x="60" y="222" width="360" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="240" y="244" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041">ready.store(true, release);</text>

  <!-- Thread B lane -->
  <rect x="540" y="92" width="360" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="720" y="112" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">线程 B（消费者）</text>

  <rect x="540" y="300" width="360" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="720" y="322" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041">while(!ready.load(acquire));</text>

  <rect x="540" y="362" width="360" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="720" y="384" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#444441">assert(data == 42);  // 保证成立</text>

  <!-- synchronizes-with arrow -->
  <path d="M420 244 C490 244 470 322 540 322" fill="none" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="268" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0F6E56">synchronizes-with</text>
  <text x="480" y="286" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#0F6E56">（B 读到 A 写入的 true）</text>

  <!-- release barrier: writes above cannot sink below -->
  <line x1="60" y1="212" x2="420" y2="212" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="240" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#0F6E56">↑ release：上方写不可下沉</text>

  <!-- acquire barrier: reads below cannot rise above -->
  <line x1="540" y1="354" x2="900" y2="354" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="720" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#0F6E56">↓ acquire：下方读不可上浮</text>

  <!-- happens-before chain box -->
  <rect x="200" y="450" width="560" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="480" y="474" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3C3489">happens-before 传递链</text>
  <text x="480" y="498" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#3C3489">data=42  →  release store  →  acquire load  →  read data</text>
  <text x="480" y="518" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#3C3489">三段拼接，A 的写对 B 可见，无需 seq_cst 的全局开销</text>
</svg>
