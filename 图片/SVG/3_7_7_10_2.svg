<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>MAC 逐跳重写与交换机转发行为</title>
  <desc>上半部分沿一次跨网段访问画出三条链路上的三个 Ethernet 帧头，对照出 MAC 三次全换而 IP 一个字节没变；下半部分列出交换机对单播命中、单播未命中、广播、组播四种帧的处理动作。</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">一次跨网段访问：IP 头端到端不变，帧头每跳重写</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">MAC 的作用域只有一条链路；交换机只看 MAC，路由器拆到 IP 才知道下一跳是谁</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="102" width="1144" height="328" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 三条链路，三个帧头</text>

  <rect x="88" y="156" width="150" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="163" y="180" font-size="12.5" fill="#2C4460" text-anchor="middle">主机 A</text>
  <text x="163" y="198" font-size="11" fill="#2C4460" text-anchor="middle">aa:aa · 198.51.100.7</text>

  <rect x="286" y="156" width="110" height="54" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.4"/>
  <text x="341" y="180" font-size="12.5" fill="#4A473F" text-anchor="middle">交换机</text>
  <text x="341" y="198" font-size="11" fill="#6B675C" text-anchor="middle">只看 MAC</text>

  <rect x="444" y="156" width="150" height="54" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="519" y="180" font-size="12.5" fill="#6B4E28" text-anchor="middle">网关 R1</text>
  <text x="519" y="198" font-size="11" fill="#6B4E28" text-anchor="middle">内侧口 bb:bb</text>

  <rect x="642" y="156" width="150" height="54" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="717" y="180" font-size="12.5" fill="#6B675C" text-anchor="middle">中间网络</text>
  <text x="717" y="198" font-size="11" fill="#6B675C" text-anchor="middle">若干跳，同样逐跳换帧</text>

  <rect x="840" y="156" width="150" height="54" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="915" y="180" font-size="12.5" fill="#6B4E28" text-anchor="middle">末跳路由器</text>
  <text x="915" y="198" font-size="11" fill="#6B4E28" text-anchor="middle">出口 ee:ee</text>

  <rect x="1038" y="156" width="130" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1103" y="180" font-size="12.5" fill="#24473F" text-anchor="middle">服务器 B</text>
  <text x="1103" y="198" font-size="11" fill="#24473F" text-anchor="middle">dd:dd · 203.0.113.9</text>

  <line x1="240" y1="183" x2="282" y2="183" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="398" y1="183" x2="440" y2="183" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="596" y1="183" x2="638" y2="183" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="794" y1="183" x2="836" y2="183" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="992" y1="183" x2="1034" y2="183" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- frame header cards -->
  <rect x="88" y="240" width="340" height="122" rx="7" fill="#F4F2EA" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="108" y="264" font-size="12.5" font-weight="700" fill="#2C4460">链路 1 · A → 网关</text>
  <text x="108" y="290" font-size="11.5" fill="#2B2A26">dst MAC　bb:bb　← 网关，不是 B</text>
  <text x="108" y="313" font-size="11.5" fill="#2B2A26">src MAC　aa:aa</text>
  <rect x="100" y="326" width="316" height="24" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="108" y="342" font-size="11.5" fill="#24473F">IP　198.51.100.7 → 203.0.113.9</text>

  <rect x="452" y="240" width="340" height="122" rx="7" fill="#F4F2EA" stroke="#9B968A" stroke-width="1.3"/>
  <text x="472" y="264" font-size="12.5" font-weight="700" fill="#4A473F">链路 2 · 运营商内部某跳</text>
  <text x="472" y="290" font-size="11.5" fill="#2B2A26">dst MAC　cc:cc</text>
  <text x="472" y="313" font-size="11.5" fill="#2B2A26">src MAC　bb:bb（换成外侧口）</text>
  <rect x="464" y="326" width="316" height="24" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="472" y="342" font-size="11.5" fill="#24473F">IP　198.51.100.7 → 203.0.113.9</text>

  <rect x="816" y="240" width="340" height="122" rx="7" fill="#F4F2EA" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="836" y="264" font-size="12.5" font-weight="700" fill="#24473F">链路 3 · 末跳 → B</text>
  <text x="836" y="290" font-size="11.5" fill="#2B2A26">dst MAC　dd:dd</text>
  <text x="836" y="313" font-size="11.5" fill="#2B2A26">src MAC　ee:ee</text>
  <rect x="828" y="326" width="316" height="24" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="836" y="342" font-size="11.5" fill="#24473F">IP　198.51.100.7 → 203.0.113.9</text>

  <text x="88" y="390" font-size="12.5" font-weight="700" fill="#733428">三张卡片里 MAC 三次全换，绿色那行一个字节没动</text>
  <text x="88" y="414" font-size="11.5" fill="#6B675C">路由器每跳要做：丢弃旧帧头、TTL 减一、重算 IP 校验和、按新下一跳重新封帧</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="448" width="1144" height="214" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="476" font-size="15" font-weight="700" fill="#4A473F">B · 交换机收到一帧时做什么</text>

  <text x="72" y="506" font-size="11" font-weight="700" fill="#6B675C">帧的目的 MAC</text>
  <text x="330" y="506" font-size="11" font-weight="700" fill="#6B675C">查 MAC 表</text>
  <text x="560" y="506" font-size="11" font-weight="700" fill="#6B675C">动作</text>
  <text x="880" y="506" font-size="11" font-weight="700" fill="#6B675C">由此定义的边界</text>
  <line x1="72" y1="514" x2="1168" y2="514" stroke="#D8D5C8" stroke-width="1"/>

  <text x="72" y="540" font-size="11.5" fill="#2B2A26">单播，表里有</text>
  <text x="330" y="540" font-size="11.5" fill="#2B2A26">命中端口 P</text>
  <text x="560" y="540" font-size="11.5" fill="#4A473F">只从 P 发出</text>
  <text x="880" y="540" font-size="11.5" fill="#4A473F">其他端口完全收不到</text>

  <text x="72" y="568" font-size="11.5" fill="#2B2A26">单播，表里没有</text>
  <text x="330" y="568" font-size="11.5" fill="#2B2A26">未命中</text>
  <text x="560" y="568" font-size="11.5" fill="#4A473F">除入口外全部泛洪</text>
  <text x="880" y="568" font-size="11.5" fill="#4A473F">对端一回包就学到，不再泛洪</text>

  <text x="72" y="596" font-size="11.5" fill="#2B2A26">广播 ff:ff:ff:ff:ff:ff</text>
  <text x="330" y="596" font-size="11.5" fill="#2B2A26">不查表</text>
  <text x="560" y="596" font-size="11.5" fill="#4A473F">除入口外全部泛洪</text>
  <text x="880" y="596" font-size="11.5" fill="#4A473F">泛洪能到的范围就是广播域</text>

  <text x="72" y="624" font-size="11.5" fill="#2B2A26">组播 01:00:5e:…</text>
  <text x="330" y="624" font-size="11.5" fill="#2B2A26">不查 MAC 表</text>
  <text x="560" y="624" font-size="11.5" fill="#4A473F">默认当广播处理</text>
  <text x="880" y="624" font-size="11.5" fill="#4A473F">开 IGMP snooping 才收敛</text>

  <text x="72" y="650" font-size="10.5" fill="#6B675C">学习看源 MAC，转发看目的 MAC，两者用的不是同一个字段</text>

  <text x="48" y="686" font-size="11.5" fill="#6B675C">口径提醒：整台交换机的所有端口在一个广播域；全双工链路下每个端口自成一个冲突域</text>
</svg>
