<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>跨机测量：先在本地求时长，再讨论混合余项</title><desc>双时钟域中的因果边界与嵌套区间，展示混合余项和不能用 Target 回收完成替代 response 发布前的原因。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs><rect width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="47" font-size="22" fill="#2B2A26" font-weight="700">跨机测量：先在本地求时长，再讨论混合余项</text>
<text x="48" y="77" font-size="14" fill="#6B675C">同一请求、明确边界、可验证嵌套；不直接相减两台机器的裸时间戳</text>
<text x="48" y="115" font-size="15" fill="#2B2A26" font-weight="700">A · 请求区间：H_* / T_* 为教学埋点，不是原生 trace 名称</text>
<rect x="48" y="138" width="1144" height="91" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<rect x="48" y="255" width="1144" height="151" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="64" y="162" font-size="14" fill="#2B2A26" font-weight="700">Host 时钟</text>
<text x="64" y="280" font-size="14" fill="#2B2A26" font-weight="700">Target 时钟</text>
<line x1="195" y1="191" x2="1080" y2="191" stroke="#5A564B" stroke-width="1.6"/>
<line x1="195" y1="181" x2="195" y2="201" stroke="#5A564B" stroke-width="1.6"/>
<line x1="1080" y1="181" x2="1080" y2="201" stroke="#5A564B" stroke-width="1.6"/>
<text x="195" y="179" font-size="13" fill="#2B2A26" text-anchor="middle">H_BEGIN</text>
<text x="1080" y="179" font-size="13" fill="#2B2A26" text-anchor="middle">H_DONE</text>
<text x="634" y="216" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">W：Host 完整被测区间</text>
<line x1="340" y1="318" x2="340" y2="341" stroke="#5A564B" stroke-width="1.6"/>
<line x1="520" y1="318" x2="520" y2="341" stroke="#5A564B" stroke-width="1.6"/>
<line x1="734" y1="318" x2="734" y2="341" stroke="#5A564B" stroke-width="1.6"/>
<line x1="936" y1="318" x2="936" y2="341" stroke="#5A564B" stroke-width="1.6"/>
<line x1="340" y1="329" x2="936" y2="329" stroke="#5A564B" stroke-width="1.6"/>
<text x="340" y="304" font-size="12.5" fill="#2B2A26" text-anchor="middle">T_RECV_OBS</text>
<text x="520" y="304" font-size="12.5" fill="#2B2A26" text-anchor="middle">T_BDEV_SUBMIT</text>
<text x="734" y="304" font-size="12.5" fill="#2B2A26" text-anchor="middle">T_BDEV_CB</text>
<text x="936" y="304" font-size="12.5" fill="#2B2A26" text-anchor="middle">T_RESP_POST_BEGIN</text>
<path d="M195,229 L195,247 L340,247 L340,291" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<path d="M936,284 L936,244 L1080,244 L1080,231" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="627" y="356" font-size="13" fill="#2B2A26" text-anchor="middle">bdev + 驱动 + 设备 + 完成观察</text>
<text x="638" y="387" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">R：接收观察 → response 发布之前</text>
<text x="48" y="444" font-size="15" fill="#2B2A26" font-weight="700">B · 余项不是 RTT</text>
<rect x="48" y="465" width="176" height="83" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="136.0" y="489" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">W − R</text>
<text x="136.0" y="510" font-size="12.5" fill="#2C4460" text-anchor="middle">同一请求的时长</text>
<line x1="232" y1="506" x2="263" y2="506" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="276" y="465" width="524" height="83" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="538.0" y="489" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">Host + 去程 + 未覆盖的软件 + 回程</text>
<text x="538.0" y="510" font-size="12.5" fill="#6B4E28" text-anchor="middle">去程含收包到软件观察；回程含实际发布</text>
<rect x="830" y="442" width="362" height="175" rx="7" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<text x="848" y="468" font-size="15" fill="#2B2A26" font-weight="700">C · 一个错误端点</text>
<text x="848" y="497" font-size="14" fill="#2B2A26">Host H_DONE</text>
<line x1="988" y1="493" x2="1168" y2="493" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="848" y="529" font-size="14" fill="#733428">Target 回收可能更晚</text>
<text x="848" y="558" font-size="13" fill="#733428">RDMA_REQ_COMPLETED</text>
<text x="848" y="590" font-size="13" fill="#733428">因此不能假定区间嵌套</text>
<text x="48" y="583" font-size="14" fill="#2B2A26" font-weight="700">检查：ID 复用 / 子请求 / 丢事件 / 时钟速率 / 时间戳位置</text>
<text x="48" y="612" font-size="13" fill="#6B675C">异常负值先查模型和配对，不把它归为“负网络延迟”。</text>
<line x1="48" y1="646" x2="1192" y2="646" stroke="#5A564B" stroke-width="1.6"/>
<text x="48" y="674" font-size="13" fill="#6B675C">PTP/NTP 的名称不能替代误差预算；P99(W) − P99(R) 仍然不等于 P99(W − R)。</text>
</svg>