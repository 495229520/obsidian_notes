<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <title id="title">竞态条件：num++ 的丢失更新</title>
  <desc id="desc">两个线程交错执行 num++，各自读到 0、各自写回 1，最终结果为 1 而非期望的 2。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      .title { font: 700 26px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .lane  { font: 700 19px "PingFang SC", "Microsoft YaHei", sans-serif; }
      .step  { font: 600 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .time  { font: 600 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #607d8b; }
      .mono  { font: 600 15px "JetBrains Mono, Consolas, monospace"; fill: #1a237e; }
      .bad   { font: 700 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b71c1c; }
      .ok    { font: 600 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2e7d32; }
      .laneA { fill: #e8f1f7; stroke: #42677c; stroke-width: 2; }
      .laneB { fill: #fdf2e3; stroke: #b07d37; stroke-width: 2; }
      .var   { fill: #dfeede; stroke: #4f7b58; stroke-width: 2.2; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text class="title" x="450" y="44" text-anchor="middle">竞态条件：两个线程各执行一次 num++</text>

  <!-- lane headers -->
  <rect class="laneA" x="120" y="70" width="240" height="42" rx="10"/>
  <text class="lane" x="240" y="98" text-anchor="middle" fill="#33495a">线程 A</text>
  <rect class="laneB" x="540" y="70" width="240" height="42" rx="10"/>
  <text class="lane" x="660" y="98" text-anchor="middle" fill="#7a5520">线程 B</text>

  <!-- shared var box -->
  <rect class="var" x="375" y="74" width="150" height="40" rx="10"/>
  <text class="step" x="450" y="100" text-anchor="middle">共享 num</text>

  <!-- timeline axis -->
  <line x1="450" y1="120" x2="450" y2="520" stroke="#b0bec5" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- t1: A reads 0 -->
  <text class="time" x="60" y="170" text-anchor="middle">t1</text>
  <rect class="laneA" x="120" y="148" width="240" height="40" rx="9"/>
  <text class="mono" x="240" y="173" text-anchor="middle">读 num → 0</text>
  <line x1="358" y1="168" x2="448" y2="138" stroke="#607d8b" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="4 4"/>
  <text class="time" x="455" y="135" text-anchor="start" fill="#37474f">num = 0</text>

  <!-- t2: B reads 0 -->
  <text class="time" x="60" y="230" text-anchor="middle">t2</text>
  <rect class="laneB" x="540" y="208" width="240" height="40" rx="9"/>
  <text class="mono" x="660" y="233" text-anchor="middle">读 num → 0</text>
  <line x1="540" y1="228" x2="452" y2="228" stroke="#607d8b" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="4 4"/>

  <!-- t3: A computes & writes 1 -->
  <text class="time" x="60" y="300" text-anchor="middle">t3</text>
  <rect class="laneA" x="120" y="278" width="240" height="40" rx="9"/>
  <text class="mono" x="240" y="303" text-anchor="middle">0 + 1 = 1，写回</text>
  <line x1="360" y1="298" x2="448" y2="318" stroke="#607d8b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="time" x="455" y="322" text-anchor="start" fill="#37474f">num = 1</text>

  <!-- t4: B computes & writes 1 -->
  <text class="time" x="60" y="370" text-anchor="middle">t4</text>
  <rect class="laneB" x="540" y="348" width="240" height="40" rx="9"/>
  <text class="mono" x="660" y="373" text-anchor="middle">0 + 1 = 1，写回</text>
  <line x1="540" y1="368" x2="452" y2="388" stroke="#607d8b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="time" x="445" y="392" text-anchor="end" fill="#b71c1c">num = 1 (覆盖)</text>

  <!-- result -->
  <rect x="250" y="440" width="400" height="86" rx="14" fill="#fdecea" stroke="#b71c1c" stroke-width="2.2"/>
  <text class="bad" x="450" y="475" text-anchor="middle">最终 num = 1</text>
  <text class="ok"  x="450" y="503" text-anchor="middle">期望 num = 2 —— 一次自增「丢失更新」</text>

  <text class="time" x="450" y="560" text-anchor="middle">根因：num++ 非原子（读-改-写三步可被打断）</text>
</svg>
