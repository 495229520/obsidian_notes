<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
<title>跨层排障：从最窄复现条件逐步增加复杂度</title><desc>先验证身份与正确性，再测局部、跨机、多卡与业务共载；每次变化都要有对照。。原创教学示意；数字不是硬件实测；详细条件与出处见对应 Markdown 笔记。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="52" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">跨层排障：从最窄复现条件逐步增加复杂度</text>
<text x="48" y="81" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">先验证身份与正确性，再测局部、跨机、多卡与业务共载；每次变化都要有对照。</text>
<text x="64" y="124" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">A · 实验阶梯：一次增加一个因素</text>
<rect x="64" y="150" width="436" height="49" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="282.0" y="179.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">0 · 对齐 rank / GPU / 调用参数</text>
<path d="M 276,203 L 276,212 L 292,212 L 292,217" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="80" y="221" width="436" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="298.0" y="250.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">1 · 单机一对 GPU：正确性与带宽</text>
<path d="M 292,274 L 292,283 L 308,283 L 308,288" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="96" y="292" width="436" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="314.0" y="321.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">2 · 两节点各一卡：最小网络路径</text>
<path d="M 308,345 L 308,354 L 324,354 L 324,359" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="112" y="363" width="436" height="49" rx="8" fill="#EDEAF3" stroke="#82709B" stroke-width="1.3"/>
<text x="330.0" y="392.5" font-size="14" fill="#625476" font-weight="700" text-anchor="middle">3 · 单节点多卡：本地并行竞争</text>
<path d="M 324,416 L 324,425 L 340,425 L 340,430" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="128" y="434" width="436" height="49" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="346.0" y="463.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">4 · 两节点多卡：注入与多 rail</text>
<path d="M 340,487 L 340,496 L 356,496 L 356,501" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="144" y="505" width="436" height="49" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="362.0" y="534.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">5 · 业务共载：计算 / IO / 尾延迟</text>
<text x="654" y="124" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">B · 每条结论要能回到证据</text>
<rect x="654" y="150" width="538" height="385" rx="6" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="654" y="150" width="538" height="55" rx="0" fill="#EDEBE3" stroke="none" stroke-width="1.3"/>
<text x="666" y="184.65" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">证据层</text>
<text x="820" y="184.65" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">保留什么</text>
<line x1="654" y1="205" x2="1192" y2="205" stroke="#D8D5C8" stroke-width="1"/>
<text x="666" y="239.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">设备身份</text>
<text x="820" y="239.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">host / rank / UUID / bus ID</text>
<rect x="655" y="260" width="536" height="55" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<line x1="654" y1="260" x2="1192" y2="260" stroke="#D8D5C8" stroke-width="1"/>
<text x="666" y="294.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">物理拓扑</text>
<text x="820" y="294.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">PCIe、NVLink、NUMA、rail</text>
<line x1="654" y1="315" x2="1192" y2="315" stroke="#D8D5C8" stroke-width="1"/>
<text x="666" y="349.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">运行时选择</text>
<text x="820" y="349.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">transport、注册、Channel 路径</text>
<rect x="655" y="370" width="536" height="55" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<line x1="654" y1="370" x2="1192" y2="370" stroke="#D8D5C8" stroke-width="1"/>
<text x="666" y="404.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">链路与资源</text>
<text x="820" y="404.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">NIC / switch 增量、CPU 调度</text>
<line x1="654" y1="425" x2="1192" y2="425" stroke="#D8D5C8" stroke-width="1"/>
<text x="666" y="459.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">对照实验</text>
<text x="820" y="459.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">同一消息口径、只改目标因素</text>
<rect x="655" y="480" width="536" height="55" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<line x1="654" y1="480" x2="1192" y2="480" stroke="#D8D5C8" stroke-width="1"/>
<text x="666" y="514.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">业务结果</text>
<text x="820" y="514.65" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">正确性、step time、时间分布</text>
<rect x="654" y="551" width="538" height="36" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="668" y="575" font-size="13" fill="#733428" font-weight="700" text-anchor="start">长 NCCL 区间 ≠ 网络一直满载 ≠ 已找到根因</text>
<line x1="48" y1="609" x2="1192" y2="609" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="637" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">低层测试通过不能证明完整 Collective 或业务一定正确；P99 需要逐次样本，不能用平均时间替代。</text>
<text x="48" y="660" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">对应 8.20 §10–§13；交付映射表、真实拓扑、版本基线、A/B 与尚未排除的假设。</text>
</svg>