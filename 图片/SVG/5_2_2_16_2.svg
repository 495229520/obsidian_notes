<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
  <rect width="980" height="540" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .cell { fill: #eef6fb; stroke: #6f94b3; stroke-width: 1.5; rx: 6; }
      .active { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2; rx: 6; }
      .move { fill: #dff0ea; stroke: #45907a; stroke-width: 2; rx: 6; }
      .heap { fill: #f5ecff; stroke: #8a72b5; stroke-width: 1.8; rx: 8; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .note { fill: #edf4f1; stroke: #9db7aa; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">随机集合与双堆中位数：用结构换复杂度</text>
  <text x="40" y="76" class="subtitle">RandomizedSet 依赖 vector 的随机访问；MedianFinder 依赖两个堆维护左右半区。</text>

  <rect x="54" y="116" width="414" height="328" class="panel"/>
  <text x="82" y="150" class="label">RandomizedSet 删除</text>
  <text x="82" y="176" class="small">删除中间元素时，用末尾元素覆盖，再 pop_back</text>
  <g transform="translate(86,224)">
    <rect x="0" y="0" width="58" height="42" class="cell"/><text x="29" y="26" text-anchor="middle" class="mono">10</text>
    <rect x="66" y="0" width="58" height="42" class="active"/><text x="95" y="26" text-anchor="middle" class="mono">20</text>
    <rect x="132" y="0" width="58" height="42" class="cell"/><text x="161" y="26" text-anchor="middle" class="mono">30</text>
    <rect x="198" y="0" width="58" height="42" class="move"/><text x="227" y="26" text-anchor="middle" class="mono">40</text>
  </g>
  <path d="M 314 286 C 276 336 210 336 184 286" class="arrow"/>
  <text x="96" y="350" class="mono">index[40] = index[20]</text>
  <text x="96" y="380" class="small">覆盖后删除末尾，保持 vector 连续和随机访问</text>

  <rect x="522" y="116" width="404" height="328" class="panel"/>
  <text x="550" y="150" class="label">MedianFinder 双堆</text>
  <text x="550" y="176" class="small">左半区大根堆，右半区小根堆</text>
  <rect x="574" y="226" width="136" height="58" class="heap"/>
  <text x="642" y="250" text-anchor="middle" class="mono">left maxHeap</text>
  <text x="642" y="272" text-anchor="middle" class="mono">top = 5</text>
  <rect x="738" y="226" width="136" height="58" class="heap"/>
  <text x="806" y="250" text-anchor="middle" class="mono">right minHeap</text>
  <text x="806" y="272" text-anchor="middle" class="mono">top = 8</text>
  <path d="M 710 255 L 738 255" class="arrow"/>
  <text x="590" y="332" class="small">大小相等：median = (5 + 8) / 2</text>
  <text x="590" y="362" class="small">左边多一个：median = left.top()</text>
  <text x="590" y="392" class="small">插入后需要 rebalance，保证大小差不超过 1</text>

  <rect x="146" y="478" width="688" height="38" class="note"/>
  <text x="490" y="502" text-anchor="middle" class="small">设计题的套路：一个结构保证定位，另一个结构保证目标操作的顺序、随机性或优先级。</text>
</svg>
