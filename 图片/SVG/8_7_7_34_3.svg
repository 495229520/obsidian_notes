<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<title>完整性保护的是覆盖区间，而不是 CRC 的层数</title><desc>七步数据路径展示应用端到端摘要覆盖与局部传输/存储检查，底部指出生成摘要前、验证通过后的盲区。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A64B3C"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6B5E"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5A80"/></marker>
</defs>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">完整性保护的是覆盖区间，而不是 CRC 的层数</text>
<text x="48" y="82" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">可信生产者冻结字节并生成承诺；消费者按同一身份、版本与范围验证实际使用的内容。</text>
<text x="48" y="126" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">端到端承诺：覆盖字节变化，也必须绑定对象身份与 generation</text>
<line x1="286" y1="162" x2="1025" y2="162" stroke="#2F6B5E" stroke-width="2.2"/>
<line x1="286" y1="155" x2="286" y2="173" stroke="#2F6B5E" stroke-width="2.2"/>
<line x1="1025" y1="155" x2="1025" y2="173" stroke="#2F6B5E" stroke-width="2.2"/>
<text x="675" y="151" font-size="15" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">可信期望摘要：不是由被检查节点随意自报</text>
<rect x="48" y="206" width="142" height="90" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="119.0" y="244.1" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">原始生产者</text>
<text x="119.0" y="268.1" font-size="15" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">生成数据</text>
<line x1="190" y1="251" x2="210" y2="251" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="215" y="206" width="142" height="90" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="286.0" y="244.1" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">冻结缓冲区</text>
<text x="286.0" y="268.1" font-size="15" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">生成摘要</text>
<line x1="357" y1="251" x2="377" y2="251" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="382" y="206" width="142" height="90" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="453.0" y="244.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">网络传输</text>
<text x="453.0" y="268.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">收发与拷贝</text>
<line x1="524" y1="251" x2="544" y2="251" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="549" y="206" width="142" height="90" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="620.0" y="244.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">持久化</text>
<text x="620.0" y="268.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">读取介质</text>
<line x1="691" y1="251" x2="711" y2="251" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="716" y="206" width="142" height="90" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="787.0" y="244.1" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">副本 / EC</text>
<text x="787.0" y="268.1" font-size="15" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">恢复数据</text>
<line x1="858" y1="251" x2="878" y2="251" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="883" y="206" width="142" height="90" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="954.0" y="244.1" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">最终验证</text>
<text x="954.0" y="268.1" font-size="15" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">核对期望值</text>
<line x1="1025" y1="251" x2="1045" y2="251" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="1050" y="206" width="142" height="90" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1121.0" y="244.1" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">业务消费</text>
<text x="1121.0" y="268.1" font-size="15" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">使用结果</text>
<text x="48" y="341" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">局部机制各有范围：它们减少错误，但不能证明链路以外的字节永远正确</text>
<line x1="382" y1="370" x2="524" y2="370" stroke="#3D5A80" stroke-width="3"/>
<text x="453.0" y="398" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">网络校验</text>
<line x1="549" y1="370" x2="691" y2="370" stroke="#3D5A80" stroke-width="3"/>
<text x="620.0" y="398" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">介质 / 块校验</text>
<line x1="716" y1="370" x2="858" y2="370" stroke="#2F6B5E" stroke-width="3"/>
<text x="787.0" y="398" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">输入片校验</text>
<rect x="48" y="433" width="355" height="185" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="68" y="465" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">盲区 A · 摘要生成前</text>
<text x="68" y="496" font-size="15" font-weight="400" fill="#733428" text-anchor="start" data-role="body">错误值先进入缓冲区</text>
<text x="68" y="524" font-size="15" font-weight="400" fill="#733428" text-anchor="start" data-role="body">再计算 H(错误值)</text>
<text x="68" y="552" font-size="15" font-weight="400" fill="#733428" text-anchor="start" data-role="body">只能认证“以后仍是这个值”</text>
<text x="68" y="580" font-size="15" font-weight="400" fill="#733428" text-anchor="start" data-role="body">需要更早的可信 oracle</text>
<rect x="431" y="433" width="378" height="185" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="451" y="465" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">覆盖有效所需的依据</text>
<text x="451" y="496" font-size="15" font-weight="400" fill="#24473F" text-anchor="start" data-role="body">对象 / 版本 / 范围绑定</text>
<text x="451" y="524" font-size="15" font-weight="400" fill="#24473F" text-anchor="start" data-role="body">可信 manifest 或内容承诺</text>
<text x="451" y="552" font-size="15" font-weight="400" fill="#24473F" text-anchor="start" data-role="body">实际参与计算的输入已验证</text>
<text x="451" y="580" font-size="15" font-weight="400" fill="#24473F" text-anchor="start" data-role="body">输出与预先承诺匹配</text>
<rect x="837" y="433" width="355" height="185" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="857" y="465" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">盲区 B · 验证通过后</text>
<text x="857" y="496" font-size="15" font-weight="400" fill="#733428" text-anchor="start" data-role="body">共享写者再次修改内存</text>
<text x="857" y="524" font-size="15" font-weight="400" fill="#733428" text-anchor="start" data-role="body">异步任务复用旧缓冲区</text>
<text x="857" y="552" font-size="15" font-weight="400" fill="#733428" text-anchor="start" data-role="body">检查过 ≠ 此刻仍未变化</text>
<text x="857" y="580" font-size="15" font-weight="400" fill="#733428" text-anchor="start" data-role="body">需要冻结、所有权与生命周期</text>
<line x1="48" y1="643" x2="1192" y2="643" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="671" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">长线代表应用承诺的设计边界；下层校验与受保护元数据相互补充，任何一层都不能替错误原始输入纠错。</text>
</svg>