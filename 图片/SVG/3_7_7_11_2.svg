<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 856" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>IPv4 分片：一个 4000 字节数据报怎么切成三片</title>
  <desc>上半部分把 4000 字节的数据报按 MTU 1500 切成三片，标出每片的 Total Length、Fragment Offset 和 MF 标志；下半左侧列分片的四项代价，右侧说明 TCP 用 MSS 规避分片的做法。</desc>

  <rect x="0" y="0" width="1240" height="856" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">IPv4 分片：切开容易，丢一片就全废</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">判断准则：每片都要带完整 IP 首部，Offset 以 8 字节为单位，重组只在目的主机做一次</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="380" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F" dominant-baseline="central">A · 4000 字节的数据报遇上 MTU 1500 的链路</text>

  <rect x="72" y="156" width="110" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="127" y="178" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">IP 首部 20B</text>
  <rect x="182" y="156" width="986" height="44" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="675" y="178" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle" dominant-baseline="central">负载 3980 字节（UDP 首部 + 用户数据）</text>

  <line x1="127" y1="206" x2="127" y2="232" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="150" y="219" font-size="11.5" fill="#6B675C" dominant-baseline="central">出口 MTU 只有 1500，源主机或路由器动手切</text>

  <!-- 片 1 -->
  <rect x="72" y="238" width="56" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="100" y="260" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">首部</text>
  <rect x="128" y="238" width="380" height="44" rx="4" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="318" y="260" font-size="11.5" font-weight="700" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">片 1 · 1480 字节</text>
  <text x="540" y="254" font-size="11" fill="#4A473F" dominant-baseline="central">Total Length 1500 · Offset 0 · MF = 1</text>
  <text x="540" y="270" font-size="10.5" fill="#6B675C" dominant-baseline="central">携带原负载的第 0–1479 字节</text>

  <!-- 片 2 -->
  <rect x="72" y="294" width="56" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="100" y="316" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">首部</text>
  <rect x="128" y="294" width="380" height="44" rx="4" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="318" y="316" font-size="11.5" font-weight="700" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">片 2 · 1480 字节</text>
  <text x="540" y="310" font-size="11" fill="#4A473F" dominant-baseline="central">Total Length 1500 · Offset 185 · MF = 1</text>
  <text x="540" y="326" font-size="10.5" fill="#6B675C" dominant-baseline="central">携带原负载的第 1480–2959 字节</text>

  <!-- 片 3 -->
  <rect x="72" y="350" width="56" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="100" y="372" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">首部</text>
  <rect x="128" y="350" width="262" height="44" rx="4" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="259" y="372" font-size="11.5" font-weight="700" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">片 3 · 1020 字节</text>
  <text x="540" y="366" font-size="11" fill="#4A473F" dominant-baseline="central">Total Length 1040 · Offset 370 · MF = 0</text>
  <text x="540" y="382" font-size="10.5" fill="#6B675C" dominant-baseline="central">携带原负载的第 2960–3979 字节</text>

  <text x="72" y="418" font-size="11.5" fill="#4A473F" dominant-baseline="central">三片的 Identification 填同一个值，接收方靠它把三片认成一家</text>
  <text x="72" y="440" font-size="11.5" fill="#6B675C" dominant-baseline="central">校验：185 × 8 = 1480，370 × 8 = 2960，MF = 0 标记最后一片</text>
  <text x="72" y="462" font-size="11.5" fill="#6B675C" dominant-baseline="central">UDP 首部只在片 1 里，片 2 和片 3 拆开看不出源端口目的端口</text>

  <!-- ================= Panel B ================= -->
  <rect x="48" y="504" width="560" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="532" font-size="15" font-weight="700" fill="#4A473F" dominant-baseline="central">B · 分片要付的四笔账</text>

  <rect x="72" y="552" width="512" height="48" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="88" y="569" font-size="12" font-weight="700" fill="#733428" dominant-baseline="central">丢一片，整个数据报作废</text>
  <text x="88" y="586" font-size="10.5" fill="#733428" dominant-baseline="central">4000 字节白传，重传也是整报重来</text>

  <rect x="72" y="608" width="512" height="48" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="88" y="625" font-size="12" font-weight="700" fill="#6B4E28" dominant-baseline="central">只有目的主机能重组</text>
  <text x="88" y="642" font-size="10.5" fill="#6B4E28" dominant-baseline="central">中途路由器不攒片，来一片转一片</text>

  <rect x="72" y="664" width="512" height="48" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="88" y="681" font-size="12" font-weight="700" fill="#6B4E28" dominant-baseline="central">重组有超时</text>
  <text x="88" y="698" font-size="10.5" fill="#6B4E28" dominant-baseline="central">Linux 默认 30 秒，超时丢弃并回 ICMP 11/1</text>

  <rect x="72" y="720" width="512" height="48" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="88" y="737" font-size="12" font-weight="700" fill="#4A473F" dominant-baseline="central">很多中间设备直接丢分片</text>
  <text x="88" y="754" font-size="10.5" fill="#4A473F" dominant-baseline="central">防火墙、负载均衡读不到端口就拒收</text>

  <!-- ================= Panel C ================= -->
  <rect x="632" y="504" width="560" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="656" y="532" font-size="15" font-weight="700" fill="#4A473F" dominant-baseline="central">C · TCP 为什么很少走到这一步</text>

  <rect x="656" y="552" width="512" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="672" y="569" font-size="12" font-weight="700" fill="#2C4460" dominant-baseline="central">握手时就协商 MSS</text>
  <text x="672" y="586" font-size="10.5" fill="#2C4460" dominant-baseline="central">双方各自通告自己一次能收多大的段</text>

  <rect x="656" y="608" width="512" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="672" y="625" font-size="12" font-weight="700" fill="#2C4460" dominant-baseline="central">以太网上 MSS 常见 1460</text>
  <text x="672" y="642" font-size="10.5" fill="#2C4460" dominant-baseline="central">1500 − 20 字节 IP 首部 − 20 字节 TCP 首部</text>

  <rect x="656" y="664" width="512" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="672" y="681" font-size="12" font-weight="700" fill="#24473F" dominant-baseline="central">超出部分 TCP 自己切段</text>
  <text x="672" y="698" font-size="10.5" fill="#24473F" dominant-baseline="central">每段是独立数据报，丢了只补这一段</text>

  <rect x="656" y="720" width="512" height="48" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="672" y="737" font-size="12" font-weight="700" fill="#733428" dominant-baseline="central">分片主要发生在 UDP 上</text>
  <text x="672" y="754" font-size="10.5" fill="#733428" dominant-baseline="central">一次 sendto 超过 MTU，IP 层就动手切</text>

  <text x="48" y="830" font-size="11.5" fill="#6B675C" dominant-baseline="central">口径：例中 MTU 取以太网常见的 1500；分片规则依 RFC 791，重组超时依 Linux 的 net.ipv4.ipfrag_time 默认值</text>
</svg>
