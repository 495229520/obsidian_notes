<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
<title>KV 传输的关联主键：请求、批次、handle 与端口窗口</title>
<desc>构造案例 · R-017 / attempt 2 · 实线是显式映射；虚线仅为设备与时间窗相关</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="47" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">KV 传输的关联主键：请求、批次、handle 与端口窗口</text>
<text x="48" y="77" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400">构造案例 · R-017 / attempt 2 · 实线是显式映射；虚线仅为设备与时间窗相关</text>
<rect x="48" y="118" width="486" height="84" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="291" y="153.5" font-size="15" fill="#24473F" text-anchor="middle" font-weight="700">业务请求 R-017 · attempt 2</text>
<text x="291" y="176.5" font-size="14" fill="#24473F" text-anchor="middle" font-weight="400">run_id / route_epoch / generation</text>
<rect x="676" y="118" width="516" height="84" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="934" y="153.5" font-size="15" fill="#4A473F" text-anchor="middle" font-weight="700">Prefill ID ↔ Decode ID</text>
<text x="934" y="176.5" font-size="14" fill="#4A473F" text-anchor="middle" font-weight="400">明确映射，不假定本地 request_id 相同</text>
<line x1="538" y1="160" x2="670" y2="160" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="600" y="146" font-size="13" fill="#2B2A26" text-anchor="middle" font-weight="400">传播关联键</text>
<path d="M291,202 V229 H246 V259" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M291,229 H947 V259" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="66" y="266" width="360" height="95" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="246" y="295.5" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="700">TP0 · B420 · 32 MiB</text>
<text x="246" y="318.5" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400">worker_epoch / batch_seq</text>
<text x="246" y="341.5" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400">fragment → handle h0</text>
<rect x="767" y="266" width="360" height="95" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="947" y="295.5" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="700">TP1 · B421 · 32 MiB</text>
<text x="947" y="318.5" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400">worker_epoch / batch_seq</text>
<text x="947" y="341.5" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400">fragment → handle h1</text>
<rect x="460" y="270" width="267" height="91" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="593.5" y="297.5" font-size="15" fill="#6B4E28" text-anchor="middle" font-weight="700">必要分片集合</text>
<text x="593.5" y="320.5" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400">防止漏算、重试重复计数</text>
<text x="593.5" y="343.5" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400">真实系统允许多对多</text>
<line x1="246" y1="363" x2="246" y2="401" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="947" y1="363" x2="947" y2="401" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="66" y="407" width="360" height="76" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="246" y="438.5" font-size="15" fill="#4A3F68" text-anchor="middle" font-weight="700">GPU0 / backend 连接</text>
<text x="246" y="461.5" font-size="14" fill="#4A3F68" text-anchor="middle" font-weight="400">GPU UUID · HCA / port / rail</text>
<rect x="767" y="407" width="360" height="76" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="947" y="438.5" font-size="15" fill="#4A3F68" text-anchor="middle" font-weight="700">GPU1 / backend 连接</text>
<text x="947" y="461.5" font-size="14" fill="#4A3F68" text-anchor="middle" font-weight="400">GPU UUID · HCA / port / rail</text>
<path d="M246,485 V520 H417" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="6 4"/>
<path d="M947,485 V520 H806" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="6 4"/>
<rect x="424" y="492" width="376" height="87" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="612" y="517.5" font-size="15" fill="#4A473F" text-anchor="middle" font-weight="700">NIC vport / priority / 时间窗</text>
<text x="612" y="540.5" font-size="14" fill="#4A473F" text-anchor="middle" font-weight="400">聚合 RDMA bytes、pause、队列</text>
<text x="612" y="563.5" font-size="14" fill="#4A473F" text-anchor="middle" font-weight="400">不能直接逐 request 分账</text>
<text x="69" y="579" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">QP / WR 归属：需要底层证据</text>
<text x="839" y="579" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">handle 是局部、可复用对象</text>
<text x="66" y="612" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700">闭环检查：必要 worker 齐全 → 当前 attempt → 全分片完成 → GPU 可消费</text>
<line x1="48" y1="639" x2="1192" y2="639" stroke="#D8D5C8" stroke-width="1.5"/>
<text x="48" y="668" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">记录 request↔batch 边与唯一有效字节；源端 TX 和目的端 RX 是同一数据的两个视角，不能直接相加。</text>
</svg>