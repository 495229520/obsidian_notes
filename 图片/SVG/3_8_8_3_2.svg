<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 524" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/>
    </marker>
  </defs>

  <title>connect 的三种结局</title>
  <desc>connect 成功时一个 RTT 内完成三次握手返回 0；目标端口无人监听时收到 RST 立刻返回 ECONNREFUSED；对端无响应时 SYN 按指数退避重传六次，约 127 秒后返回 ETIMEDOUT。</desc>

  <rect x="0" y="0" width="1240" height="524" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">connect() 的三种结局</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">返回之前网络上发生了什么，决定了你等多久、以及拿到哪一个 errno</text>

  <rect x="48" y="104" width="1144" height="372" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="15" font-weight="700" fill="#4A473F">同一行代码，三条完全不同的时间线</text>

  <!-- 结局 1：成功 -->
  <rect x="72" y="152" width="1096" height="96" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="92" y="186" font-size="13.5" font-weight="700" fill="#24473F">① 握手成功</text>
  <text x="92" y="210" font-size="11" fill="#24473F">对端在监听，且网络通</text>
  <text x="92" y="230" font-size="11" fill="#24473F">开销就是一个 RTT</text>

  <rect x="330" y="176" width="140" height="30" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="400" y="196" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">SYN →</text>
  <rect x="500" y="176" width="150" height="30" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="575" y="196" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">← SYN + ACK</text>
  <rect x="680" y="176" width="140" height="30" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="750" y="196" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">ACK →</text>
  <path d="M330 224 L900 224" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="600" y="240" font-size="10.5" fill="#24473F" text-anchor="middle">第三个包发出去就返回，不等对方确认</text>

  <rect x="1000" y="176" width="150" height="48" rx="7" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1075" y="196" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">返回 0</text>
  <text x="1075" y="214" font-size="10.5" fill="#24473F" text-anchor="middle">约 1 个 RTT</text>

  <!-- 结局 2：被拒 -->
  <rect x="72" y="256" width="1096" height="96" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="92" y="290" font-size="13.5" font-weight="700" fill="#733428">② 被明确拒绝</text>
  <text x="92" y="314" font-size="11" fill="#733428">主机在，端口上没人 listen</text>
  <text x="92" y="334" font-size="11" fill="#733428">服务没起来就是这一种</text>

  <rect x="330" y="280" width="140" height="30" rx="6" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="400" y="300" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">SYN →</text>
  <rect x="500" y="280" width="140" height="30" rx="6" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="570" y="300" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">← RST</text>
  <path d="M330 328 L900 328" stroke="#A64B3C" stroke-width="1.4" marker-end="url(#arrR)"/>
  <text x="600" y="344" font-size="10.5" fill="#733428" text-anchor="middle">对端内核直接回 RST，没有重传，没有等待</text>

  <rect x="1000" y="280" width="150" height="48" rx="7" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="1075" y="300" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">ECONNREFUSED</text>
  <text x="1075" y="318" font-size="10.5" fill="#733428" text-anchor="middle">毫秒级就回来</text>

  <!-- 结局 3：超时 -->
  <rect x="72" y="360" width="1096" height="100" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="92" y="394" font-size="13.5" font-weight="700" fill="#6B4E28">③ 一直没有回音</text>
  <text x="92" y="418" font-size="11" fill="#6B4E28">包被防火墙丢了，或主机不在</text>
  <text x="92" y="438" font-size="11" fill="#6B4E28">SYN 按指数退避重传</text>

  <rect x="330" y="382" width="80" height="28" rx="6" fill="#FBFBF6" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="370" y="401" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">SYN</text>
  <rect x="424" y="382" width="62" height="28" rx="6" fill="#FBFBF6" stroke="#B07D2B" stroke-width="1"/>
  <text x="455" y="401" font-size="10.5" fill="#6B4E28" text-anchor="middle">+1s</text>
  <rect x="494" y="382" width="62" height="28" rx="6" fill="#FBFBF6" stroke="#B07D2B" stroke-width="1"/>
  <text x="525" y="401" font-size="10.5" fill="#6B4E28" text-anchor="middle">+2s</text>
  <rect x="564" y="382" width="62" height="28" rx="6" fill="#FBFBF6" stroke="#B07D2B" stroke-width="1"/>
  <text x="595" y="401" font-size="10.5" fill="#6B4E28" text-anchor="middle">+4s</text>
  <rect x="634" y="382" width="62" height="28" rx="6" fill="#FBFBF6" stroke="#B07D2B" stroke-width="1"/>
  <text x="665" y="401" font-size="10.5" fill="#6B4E28" text-anchor="middle">+8s</text>
  <rect x="704" y="382" width="62" height="28" rx="6" fill="#FBFBF6" stroke="#B07D2B" stroke-width="1"/>
  <text x="735" y="401" font-size="10.5" fill="#6B4E28" text-anchor="middle">+16s</text>
  <rect x="774" y="382" width="62" height="28" rx="6" fill="#FBFBF6" stroke="#B07D2B" stroke-width="1"/>
  <text x="805" y="401" font-size="10.5" fill="#6B4E28" text-anchor="middle">+32s</text>
  <rect x="844" y="382" width="76" height="28" rx="6" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="882" y="401" font-size="10.5" fill="#6B4E28" text-anchor="middle">再等 64s</text>

  <path d="M330 428 L900 428" stroke="#B07D2B" stroke-width="1.4" marker-end="url(#arrA)"/>
  <text x="600" y="446" font-size="10.5" fill="#6B4E28" text-anchor="middle">6 次重传打满，1+2+4+8+16+32+64 ≈ 127 秒</text>

  <rect x="1000" y="382" width="150" height="48" rx="7" fill="#FBFBF6" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="1075" y="402" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">ETIMEDOUT</text>
  <text x="1075" y="420" font-size="10.5" fill="#6B4E28" text-anchor="middle">tcp_syn_retries = 6</text>

  <text x="48" y="504" font-size="12" fill="#6B675C">第 ③ 种是阻塞式 connect 最难受的地方：两分钟里线程什么也做不了。非阻塞 connect 的解法见 8.12</text>
</svg>
