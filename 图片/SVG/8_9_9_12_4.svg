<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Hash 成本：核数、内存流量与流水瓶颈要一起算</title><desc id="desc">预算示例而非实测：payload R = 40 GB/s，单核 Bc = 8 GB/s，目标利用率 u = 50%。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">Hash 成本：核数、内存流量与流水瓶颈要一起算</text>
<text x="48" y="80" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">预算示例而非实测：payload R = 40 GB/s，单核 Bc = 8 GB/s，目标利用率 u = 50%。</text>
<rect x="66" y="132" width="203" height="72" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="167.5" y="165.0" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">D2H → Host</text>
<text x="167.5" y="187.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle">写入 S</text>
<rect x="360" y="132" width="203" height="72" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="461.5" y="165.0" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">CPU Hash</text>
<text x="461.5" y="187.0" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle">读取 S</text>
<rect x="654" y="132" width="203" height="72" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="755.5" y="165.0" font-size="15" fill="#6B4E28" font-weight="700" text-anchor="middle">RNIC 发送</text>
<text x="755.5" y="187.0" font-size="12.5" fill="#6B4E28" font-weight="400" text-anchor="middle">读取 S</text>
<rect x="948" y="132" width="226" height="72" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="1061.0" y="165.0" font-size="15" fill="#4A3F68" font-weight="700" text-anchor="middle">后端存储</text>
<text x="1061.0" y="187.0" font-size="12.5" fill="#4A3F68" font-weight="400" text-anchor="middle">另有持久化约束</text>
<line x1="274" y1="169" x2="353" y2="169" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="569" y1="169" x2="647" y2="169" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="863" y1="169" x2="941" y2="169" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="620" y="241" font-size="14" fill="#6B675C" font-weight="400" text-anchor="middle">充分重叠时看最慢阶段；缓冲不受控时，还会出现排队和尾延迟。</text>
<rect x="48" y="278" width="598" height="278" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="66" y="307" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">A · Host 内存边界的流量账（条件模型）</text>
<text x="73" y="374" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start">D2H 写</text>
<rect x="196" y="350" width="422" height="36" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="407" y="374" font-size="16" fill="#2C4460" font-weight="700" text-anchor="middle">S</text>
<text x="73" y="434" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start">Hash 读</text>
<rect x="196" y="410" width="422" height="36" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="407" y="434" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle">S</text>
<text x="73" y="494" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start">NIC 读</text>
<rect x="196" y="470" width="422" height="36" rx="0" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="407" y="494" font-size="16" fill="#6B4E28" font-weight="700" text-anchor="middle">S</text>
<text x="72" y="536" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="start">三段均经过该计量边界时：约 3S；缓存等会改变实测。</text>
<rect x="673" y="278" width="519" height="278" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="691" y="307" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">B · 平均容量够用，不等于留有余量</text>
<text x="701" y="347" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">核数</text>
<text x="825" y="347" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">容量</text>
<text x="1021" y="347" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">利用率</text>
<line x1="693" y1="362" x2="1172" y2="362" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="704" y="389" font-size="16" fill="#733428" font-weight="700" text-anchor="start">5</text>
<text x="825" y="389" font-size="16" fill="#733428" font-weight="700" text-anchor="start">40 GB/s</text>
<text x="1021" y="389" font-size="16" fill="#733428" font-weight="700" text-anchor="start">100%</text>
<line x1="693" y1="406" x2="1172" y2="406" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="704" y="433" font-size="16" fill="#24473F" font-weight="700" text-anchor="start">10</text>
<text x="825" y="433" font-size="16" fill="#24473F" font-weight="700" text-anchor="start">80 GB/s</text>
<text x="1021" y="433" font-size="16" fill="#24473F" font-weight="700" text-anchor="start">50%</text>
<text x="703" y="486" font-size="19" fill="#24473F" font-weight="600" text-anchor="start">C ≥ ceil[R / (u × Bc)]</text>
<text x="703" y="524" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">64 GiB ÷ 10 GB/s = 6.87 s（纯 Hash）</text>
<rect x="48" y="579" width="1144" height="44" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
<text x="620" y="608" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="middle">R ≤ min(C × Bc,  内存带宽 / a,  网络,  存储,  其他阶段)</text>
<text x="48" y="650" font-size="13" fill="#2B2A26" font-weight="500" text-anchor="start">a 为相对 payload 的内存流量放大系数；所有吞吐必须统一到 GB/s，而不是混用 Gb/s 或 GiB/s。</text>
</svg>
