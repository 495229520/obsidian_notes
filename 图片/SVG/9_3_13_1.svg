<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#34495e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5d6d7e; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #415363; }
      .small { font-size: 13px; fill: #526475; }
      .label { font-size: 15px; font-weight: 650; }
    </style>
  </defs>
  <text x="56" y="55" class="title">Week 4 MatMul v0 -&gt; Week 9 GEMM Lab</text>
  <text x="56" y="84" class="subtitle">从“理解一个 kernel”升级到“可信地比较多种 GEMM 实现”</text>

  <rect x="56" y="132" width="248" height="230" rx="8" fill="#e8f0f6" stroke="#85a8c5" stroke-width="2"/>
  <text x="82" y="170" class="box-title">Week 4: 教学版 matmul</text>
  <text x="82" y="207" class="body">• C[row, col] = dot(A row, B col)</text>
  <text x="82" y="235" class="body">• naive CUDA</text>
  <text x="82" y="263" class="body">• shared memory tile</text>
  <text x="82" y="291" class="body">• arithmetic intensity / roofline</text>
  <text x="82" y="328" class="small">重点：把公式和数据复用看懂</text>

  <rect x="436" y="120" width="248" height="254" rx="8" fill="#f4ead7" stroke="#c9a75f" stroke-width="2"/>
  <text x="462" y="158" class="box-title">Week 9: GEMM Deep Dive v1</text>
  <text x="462" y="195" class="body">• CPU / PyTorch reference</text>
  <text x="462" y="223" class="body">• naive / tiled / reg-block</text>
  <text x="462" y="251" class="body">• cuBLAS SGEMM baseline</text>
  <text x="462" y="279" class="body">• benchmark_results.csv</text>
  <text x="462" y="307" class="body">• profiling.md / README report</text>
  <text x="462" y="344" class="small">重点：统一协议后再比较性能</text>

  <rect x="816" y="132" width="248" height="230" rx="8" fill="#e7efe3" stroke="#8bad79" stroke-width="2"/>
  <text x="842" y="170" class="box-title">后续阶段复用</text>
  <text x="842" y="207" class="body">• Week 10 Triton matmul</text>
  <text x="842" y="235" class="body">• Week 11 CUTLASS baseline</text>
  <text x="842" y="263" class="body">• Week 12 Tensor Core</text>
  <text x="842" y="291" class="body">• Week 15 roofline report</text>
  <text x="842" y="328" class="small">重点：沿用同一套实验底座</text>

  <line x1="317" y1="247" x2="421" y2="247" stroke="#34495e" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="697" y1="247" x2="801" y2="247" stroke="#34495e" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="184" y="415" width="752" height="52" rx="8" fill="#fffaf0" stroke="#d8c088"/>
  <text x="238" y="447" class="label">核心升级：</text>
  <text x="324" y="447" class="body">不是让 kernel 立刻变复杂，而是让 correctness、benchmark、profiling 都可复现。</text>
</svg>
