<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#F5F4ED"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">WAL：先记账后干活——提交点在哪，崩在哪都不怕</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">一笔事务的五步流水，五个崩溃窗口逐一对账：恢复动作只有三种——什么都不做、截断残尾、重放 redo</text>

  <!-- ======== 时间轴五步 ======== -->
  <line x1="70" y1="196" x2="1180" y2="196" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1176" y="182" font-size="11" fill="#6B675C" text-anchor="end">时间</text>

  <!-- 步骤盒子 -->
  <rect x="85" y="120" width="175" height="60" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="172" y="144" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 只改内存</text>
  <text x="172" y="163" font-size="10.5" fill="#2C4460" text-anchor="middle">数据页在 DRAM 里变脏</text>

  <rect x="300" y="120" width="185" height="60" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="392" y="144" font-size="12.5" font-weight="700" fill="#7A5518" text-anchor="middle">② 追加 log record</text>
  <text x="392" y="163" font-size="10.5" fill="#7A5518" text-anchor="middle">顺序 append，还在页缓存</text>

  <rect x="525" y="120" width="175" height="60" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="612" y="144" font-size="12.5" font-weight="700" fill="#7A5518" text-anchor="middle">③ fdatasync(log)</text>
  <text x="612" y="163" font-size="10.5" fill="#7A5518" text-anchor="middle">打穿闸门二 + 三（1.4）</text>

  <rect x="740" y="120" width="175" height="60" rx="8" fill="#E9EFDA" stroke="#48562B" stroke-width="1.5"/>
  <text x="827" y="144" font-size="12.5" font-weight="700" fill="#48562B" text-anchor="middle">④ 向客户端确认</text>
  <text x="827" y="163" font-size="10.5" fill="#48562B" text-anchor="middle">承诺从此生效</text>

  <rect x="955" y="120" width="200" height="60" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="1055" y="144" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">⑤ 后台刷数据页</text>
  <text x="1055" y="163" font-size="10.5" fill="#4A3F68" text-anchor="middle">随机写慢慢做，之后可截断日志</text>

  <!-- 提交点标记 -->
  <line x1="712" y1="108" x2="712" y2="212" stroke="#A64B3C" stroke-width="2.2"/>
  <text x="712" y="100" font-size="13" font-weight="700" fill="#A64B3C" text-anchor="middle">★ 提交点 = log 落盘那一刻</text>
  <text x="712" y="230" font-size="10.5" fill="#A64B3C" text-anchor="middle">之前崩 = 事务不存在；之后崩 = 必能重放</text>

  <!-- ======== 崩溃窗口 ======== -->
  <text x="48" y="286" font-size="15" font-weight="700" fill="#2B2A26">五个崩溃窗口对账</text>

  <!-- 窗口标记（雷电符号用红色折线） -->
  <g stroke="#A64B3C" stroke-width="2" fill="none">
    <path d="M 282 296 l -6 12 l 8 0 l -6 12"/>
    <path d="M 505 296 l -6 12 l 8 0 l -6 12"/>
    <path d="M 668 296 l -6 12 l 8 0 l -6 12"/>
    <path d="M 935 296 l -6 12 l 8 0 l -6 12"/>
    <path d="M 1168 296 l -6 12 l 8 0 l -6 12"/>
  </g>
  <!-- 表格 -->
  <g font-size="12">
    <rect x="70" y="330" width="1110" height="34" rx="6" fill="#EFEDE3" stroke="#5A564B" stroke-width="1"/>
    <text x="90" y="352" font-weight="700" fill="#4A473F">崩溃窗口</text>
    <text x="360" y="352" font-weight="700" fill="#4A473F">重启后盘上是什么</text>
    <text x="770" y="352" font-weight="700" fill="#4A473F">恢复动作 / 结论</text>

    <text x="90" y="388" fill="#4A473F">W1　①②之间（log 还没写）</text>
    <text x="360" y="388" fill="#6B675C">盘上无痕迹</text>
    <text x="770" y="388" fill="#48562B">什么都不做——事务从未被承诺，丢弃是正确语义</text>

    <text x="90" y="418" fill="#4A473F">W2　②进行中（record 写了半截）</text>
    <text x="360" y="418" fill="#6B675C">日志尾部有残缺记录（torn tail）</text>
    <text x="770" y="418" fill="#B07D2B">CRC / 长度校验不过 → 截断残尾，视同 W1</text>

    <text x="90" y="448" fill="#4A473F">W3　③进行中（fdatasync 未返回）</text>
    <text x="360" y="448" fill="#6B675C">record 可能在、可能不在</text>
    <text x="770" y="448" fill="#B07D2B">两种都对：尚未向客户端承诺，在则重放、不在则丢弃</text>

    <text x="90" y="478" fill="#4A473F">W4　★之后、⑤之前（最关键）</text>
    <text x="360" y="478" fill="#6B675C">log 完整，数据页还是旧的</text>
    <text x="770" y="478" fill="#A64B3C">redo 重放日志 → 数据页重新算出来——WAL 存在的意义</text>

    <text x="90" y="508" fill="#4A473F">W5　⑤进行中（数据页写半截）</text>
    <text x="360" y="508" fill="#6B675C">torn page：页内一半新一半旧</text>
    <text x="770" y="508" fill="#A64B3C">redo 覆盖可修（需页级校验/全页镜像，见 6.4）</text>
  </g>
  <line x1="70" y1="368" x2="1180" y2="368" stroke="#D8D5C9" stroke-width="1"/>
  <line x1="70" y1="398" x2="1180" y2="398" stroke="#D8D5C9" stroke-width="1"/>
  <line x1="70" y1="428" x2="1180" y2="428" stroke="#D8D5C9" stroke-width="1"/>
  <line x1="70" y1="458" x2="1180" y2="458" stroke="#D8D5C9" stroke-width="1"/>
  <line x1="70" y1="488" x2="1180" y2="488" stroke="#D8D5C9" stroke-width="1"/>

  <!-- ======== 底部：record 格式与 torn tail ======== -->
  <text x="48" y="572" font-size="15" font-weight="700" fill="#2B2A26">log record 自描述格式：恢复时靠它识别「哪里是完整的尽头」</text>

  <g font-size="11.5">
    <rect x="70" y="590" width="90" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="115" y="608" font-weight="700" fill="#2C4460" text-anchor="middle">len (4B)</text>
    <text x="115" y="625" fill="#2C4460" text-anchor="middle">载荷长度</text>
    <rect x="160" y="590" width="90" height="44" rx="4" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
    <text x="205" y="608" font-weight="700" fill="#4A3F68" text-anchor="middle">crc32 (4B)</text>
    <text x="205" y="625" fill="#4A3F68" text-anchor="middle">载荷校验和</text>
    <rect x="250" y="590" width="220" height="44" rx="4" fill="#E9EFDA" stroke="#48562B" stroke-width="1.2"/>
    <text x="360" y="608" font-weight="700" fill="#48562B" text-anchor="middle">payload（变长）</text>
    <text x="360" y="625" fill="#48562B" text-anchor="middle">操作内容：如 put(key, value)</text>

    <rect x="490" y="590" width="90" height="44" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="535" y="614" fill="#2C4460" text-anchor="middle">下一条…</text>

    <rect x="600" y="590" width="130" height="44" rx="4" fill="#F5E5E0" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="665" y="608" font-weight="700" fill="#A64B3C" text-anchor="middle">残尾（torn tail）</text>
    <text x="665" y="625" fill="#A64B3C" text-anchor="middle">崩溃时写到一半</text>
  </g>
  <line x1="600" y1="652" x2="740" y2="652" stroke="#A64B3C" stroke-width="1.8"/>
  <text x="760" y="656" font-size="11.5" fill="#A64B3C">恢复：顺序扫描 → 长度越界或 CRC 不匹配即停 → ftruncate 砍掉残尾</text>
  <text x="760" y="678" font-size="11" fill="#6B675C">生产系统还会加 LSN（序号）、类型字段；重放必须幂等（重放两遍结果不变）</text>
</svg>
