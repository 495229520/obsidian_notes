<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
  <title id="title">大整数的逆序存储</title>
  <desc id="desc">字符串 "12345" 高位在前，逆序存入 vector A，使个位落在 A[0]、最高位落在 A[4]，方便进位时在数组末尾追加。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3b5164" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .sub   { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .rlab  { font: 600 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .idx   { font: 13px "Consolas", "Microsoft YaHei", monospace; fill: #5a6876; }
      .val   { font: 600 20px "Consolas", "Microsoft YaHei", monospace; fill: #23313f; }
      .note  { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .tag   { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .cellS { fill: #dbe7f5; stroke: #2f6cb0; stroke-width: 1.4; }
      .cellA { fill: #d9efe7; stroke: #2c8c6f; stroke-width: 1.4; }
      .lo    { stroke: #c08a1d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .hi    { stroke: #2f6cb0; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .mid   { stroke: #9aa6b0; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .box   { fill: #fbfaf4; stroke: #d9cfbd; stroke-width: 1.4; }
    </style>
  </defs>

  <text x="410" y="42" text-anchor="middle" class="title">大整数的逆序存储：个位放在 A[0]</text>
  <text x="410" y="70" text-anchor="middle" class="sub">以字符串读入，再倒着塞进 vector，低位对低索引</text>

  <!-- 字符串行 -->
  <text x="100" y="148" text-anchor="end" class="rlab">字符串 s</text>
  <rect x="170" y="120" width="92" height="56" rx="6" class="cellS"/>
  <rect x="262" y="120" width="92" height="56" rx="6" class="cellS"/>
  <rect x="354" y="120" width="92" height="56" rx="6" class="cellS"/>
  <rect x="446" y="120" width="92" height="56" rx="6" class="cellS"/>
  <rect x="538" y="120" width="92" height="56" rx="6" class="cellS"/>
  <text x="216" y="150" text-anchor="middle" class="val">1</text>
  <text x="308" y="150" text-anchor="middle" class="val">2</text>
  <text x="400" y="150" text-anchor="middle" class="val">3</text>
  <text x="492" y="150" text-anchor="middle" class="val">4</text>
  <text x="584" y="150" text-anchor="middle" class="val">5</text>
  <text x="216" y="110" text-anchor="middle" class="idx">s[0]</text>
  <text x="308" y="110" text-anchor="middle" class="idx">s[1]</text>
  <text x="400" y="110" text-anchor="middle" class="idx">s[2]</text>
  <text x="492" y="110" text-anchor="middle" class="idx">s[3]</text>
  <text x="584" y="110" text-anchor="middle" class="idx">s[4]</text>
  <text x="216" y="98" text-anchor="middle" class="tag" fill="#0c447c">最高位</text>
  <text x="584" y="98" text-anchor="middle" class="tag" fill="#854f0b">个位</text>

  <!-- 交叉箭头：s[i] -> A[4-i] -->
  <line x1="216" y1="180" x2="580" y2="296" class="hi"/>
  <line x1="308" y1="180" x2="492" y2="296" class="mid"/>
  <line x1="400" y1="180" x2="400" y2="296" class="mid"/>
  <line x1="492" y1="180" x2="308" y2="296" class="mid"/>
  <line x1="584" y1="180" x2="220" y2="296" class="lo"/>

  <!-- vector 行 -->
  <text x="100" y="328" text-anchor="end" class="rlab">vector A</text>
  <rect x="170" y="300" width="92" height="56" rx="6" class="cellA"/>
  <rect x="262" y="300" width="92" height="56" rx="6" class="cellA"/>
  <rect x="354" y="300" width="92" height="56" rx="6" class="cellA"/>
  <rect x="446" y="300" width="92" height="56" rx="6" class="cellA"/>
  <rect x="538" y="300" width="92" height="56" rx="6" class="cellA"/>
  <text x="216" y="330" text-anchor="middle" class="val">5</text>
  <text x="308" y="330" text-anchor="middle" class="val">4</text>
  <text x="400" y="330" text-anchor="middle" class="val">3</text>
  <text x="492" y="330" text-anchor="middle" class="val">2</text>
  <text x="584" y="330" text-anchor="middle" class="val">1</text>
  <text x="216" y="376" text-anchor="middle" class="idx">A[0]</text>
  <text x="308" y="376" text-anchor="middle" class="idx">A[1]</text>
  <text x="400" y="376" text-anchor="middle" class="idx">A[2]</text>
  <text x="492" y="376" text-anchor="middle" class="idx">A[3]</text>
  <text x="584" y="376" text-anchor="middle" class="idx">A[4]</text>
  <text x="216" y="392" text-anchor="middle" class="tag" fill="#854f0b">个位</text>
  <text x="584" y="392" text-anchor="middle" class="tag" fill="#0c447c">最高位</text>

  <!-- 注解 -->
  <rect x="120" y="412" width="580" height="36" rx="8" class="box"/>
  <text x="410" y="430" text-anchor="middle" class="note">为何逆序？进位永远朝最高位走；逆序后最高位在末尾，C.push_back() 直接追加新位即可</text>
</svg>
