<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>线程交互模型：跨线程通信通道</title>
  <desc>UI 线程与网络线程通过四条通道协作：PostEvent/PostMessage 投递事件、RequestConsent 发起同意、SetEvent 唤醒阻塞、EndSession 经 atomic_bool 通知断开。</desc>
  <rect x="0" y="0" width="920" height="490" fill="rgb(245, 244, 237)"/>

  <text x="460" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#444441">线程交互模型：跨线程通信通道</text>

  <!-- UI thread lane -->
  <rect x="60" y="80" width="240" height="330" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="180" y="104" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">UI 线程</text>
  <text x="180" y="124" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">(MFC 消息泵)</text>
  <text x="288" y="180" text-anchor="end" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">消息泵分发</text>
  <text x="288" y="240" text-anchor="end" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">OnConsentRequest()</text>
  <text x="288" y="300" text-anchor="end" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">SetEvent(event)</text>
  <text x="288" y="360" text-anchor="end" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">EndSession（按钮/Banner）</text>

  <!-- Network thread lane -->
  <rect x="620" y="80" width="240" height="330" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="740" y="104" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">网络线程</text>
  <text x="740" y="124" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">(select 循环)</text>
  <text x="632" y="180" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">PostEvent()</text>
  <text x="632" y="240" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">RequestConsent() → WaitFor...</text>
  <text x="632" y="300" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">(被唤醒，继续)</text>
  <text x="632" y="360" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">轮询检测 → 断开</text>

  <!-- channel 1: network -> UI (PostEvent) -->
  <path d="M618 180 L302 180" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="166" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5">① PostEvent → PostMessage</text>

  <!-- channel 2: network -> UI (RequestConsent) -->
  <path d="M618 240 L302 240" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5">② RequestConsent → OnConsentRequest</text>

  <!-- channel 3: UI -> network (SetEvent) -->
  <path d="M302 300 L618 300" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="286" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#534AB7">③ SetEvent → 唤醒 WaitForSingleObject</text>

  <!-- channel 4: UI -> network (EndSession) -->
  <path d="M302 360 L618 360" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="346" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#534AB7">④ EndSession：atomic_bool 置位</text>

  <text x="460" y="440" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">PostMessage/PostEvent 跨线程投递消息；Event 唤醒阻塞的网络线程；atomic_bool 为单向终止标志。</text>
</svg>
