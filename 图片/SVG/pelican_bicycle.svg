<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A friendly pelican pedals a bicycle along a sunny road in a five-second looping animation.</desc>
  <style>
    :root { --ink:#23303b; --navy:#2d5068; --cream:#f7f1df; --coral:#e76f51; --yellow:#f4c95d; --road:#30434a; }
    .scene { animation: cruise 5s linear infinite; }
    .pelican { animation: body-bob 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .wing { animation: flap 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 430px 228px; }
    .head { animation: head-bob 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .leg-a { animation: leg-a 0.8s linear infinite; transform-box: view-box; transform-origin: 358px 267px; }
    .leg-b { animation: leg-b 0.8s linear infinite; transform-box: view-box; transform-origin: 358px 267px; }
    .wheel-spin { animation: wheel-spin .8s linear infinite; transform-box: fill-box; transform-origin: center; }
    .road-dash { animation: dash 1.1s linear infinite; }
    .cloud { animation: cloud-drift 5s linear infinite; }
    .cloud.slow { animation-duration: 8s; animation-delay: -2s; }
    @keyframes cruise { 0% { transform: translateX(0); } 50% { transform: translateX(7px); } 100% { transform: translateX(0); } }
    @keyframes body-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes head-bob { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(2px,-4px) rotate(2deg); } }
    @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-11deg); } }
    @keyframes leg-a { 0% { transform: rotate(-28deg); } 50% { transform: rotate(30deg); } 100% { transform: rotate(-28deg); } }
    @keyframes leg-b { 0% { transform: rotate(30deg); } 50% { transform: rotate(-28deg); } 100% { transform: rotate(30deg); } }
    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes dash { to { transform: translateX(-150px); } }
    @keyframes cloud-drift { from { transform: translateX(0); } to { transform: translateX(-170px); } }
  </style>
  <rect width="800" height="500" fill="rgb(245, 244, 237)"/>
  <g class="scene">
    <!-- sky and sun -->
    <rect x="0" y="0" width="800" height="345" fill="#d9edf0"/>
    <circle cx="675" cy="92" r="42" fill="#f4c95d" opacity=".92"/>
    <g class="cloud" fill="#fffdf5" opacity=".84">
      <path d="M72 118c0-18 15-33 33-33 9 0 18 4 24 11 6-19 24-32 45-32 26 0 47 20 48 46h10c16 0 29 13 29 29H72c0-12 0-15 0-21z"/>
    </g>
    <g class="cloud slow" fill="#fffdf5" opacity=".7">
      <path d="M520 176c0-14 11-25 25-25 8 0 15 3 20 9 5-14 18-24 34-24 20 0 36 15 37 35h8c13 0 22 10 22 22H520c0-8 0-11 0-17z"/>
    </g>
    <!-- distant hills -->
    <path d="M0 298 Q120 220 240 298 T480 298 T720 298 T960 298 V345 H0Z" fill="#a8c7be"/>
    <path d="M0 320 Q130 257 270 320 T540 320 T810 320 V345 H0Z" fill="#8fb3aa" opacity=".8"/>
    <!-- road -->
    <rect x="0" y="345" width="800" height="155" fill="#30434a"/>
    <rect x="0" y="345" width="800" height="7" fill="#f7d9a5"/>
    <rect x="0" y="487" width="800" height="13" fill="#243239"/>
    <g class="road-dash" fill="#e9c46a" opacity=".9">
      <rect x="-120" y="415" width="90" height="7" rx="3"/><rect x="35" y="415" width="90" height="7" rx="3"/><rect x="190" y="415" width="90" height="7" rx="3"/><rect x="345" y="415" width="90" height="7" rx="3"/><rect x="500" y="415" width="90" height="7" rx="3"/><rect x="655" y="415" width="90" height="7" rx="3"/><rect x="810" y="415" width="90" height="7" rx="3"/>
    </g>
    <!-- bicycle shadow -->
    <ellipse cx="403" cy="400" rx="164" ry="15" fill="#18272d" opacity=".45"/>
    <!-- bicycle -->
    <g aria-label="bicycle">
      <g class="wheel-spin" aria-label="back wheel">
        <circle cx="280" cy="362" r="57" fill="#f5f3eb" stroke="#23303b" stroke-width="8"/>
        <circle cx="280" cy="362" r="8" fill="#e76f51" stroke="#23303b" stroke-width="4"/>
        <g stroke="#6e8990" stroke-width="2" opacity=".8"><path d="M280 313v98M231 362h98M246 328l68 68M246 396l68-68"/></g>
      </g>
      <g class="wheel-spin" aria-label="front wheel">
        <circle cx="526" cy="362" r="57" fill="#f5f3eb" stroke="#23303b" stroke-width="8"/>
        <circle cx="526" cy="362" r="8" fill="#e76f51" stroke="#23303b" stroke-width="4"/>
        <g stroke="#6e8990" stroke-width="2" opacity=".8"><path d="M526 313v98M477 362h98M492 328l68 68M492 396l68-68"/></g>
      </g>
      <path d="M280 362 L354 292 L445 362 L280 362 Z" fill="none" stroke="#e76f51" stroke-width="8" stroke-linejoin="round"/>
      <path d="M354 292 L392 362 M445 362 L526 362 M445 362 L467 286" fill="none" stroke="#e76f51" stroke-width="8" stroke-linecap="round"/>
      <path d="M458 278 L483 278" stroke="#23303b" stroke-width="7" stroke-linecap="round"/>
      <path d="M338 286 L370 286" stroke="#23303b" stroke-width="7" stroke-linecap="round"/>
      <path d="M332 279 Q353 267 375 279" fill="none" stroke="#23303b" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(392 362)"><circle r="11" fill="#f4c95d" stroke="#23303b" stroke-width="4"/><g class="wheel-spin"><path d="M0 0 L35 0" stroke="#23303b" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-26 23" stroke="#23303b" stroke-width="5" stroke-linecap="round"/><rect x="31" y="-4" width="17" height="8" rx="3" fill="#23303b"/><rect x="-35" y="20" width="17" height="8" rx="3" fill="#23303b"/></g></g>
    </g>
    <!-- pelican -->
    <g class="pelican" aria-label="pelican">
      <!-- feet and pedaling legs -->
      <g class="leg leg-a"><path d="M358 268 Q378 300 391 361" fill="none" stroke="#d66d45" stroke-width="10" stroke-linecap="round"/><path d="M388 358 l19 7" stroke="#d66d45" stroke-width="8" stroke-linecap="round"/></g>
      <g class="leg leg-b"><path d="M389 269 Q370 302 391 361" fill="none" stroke="#c85d3e" stroke-width="10" stroke-linecap="round"/><path d="M388 358 l-18 11" stroke="#c85d3e" stroke-width="8" stroke-linecap="round"/></g>
      <!-- body -->
      <ellipse cx="385" cy="225" rx="83" ry="61" fill="#fffdf5" stroke="#23303b" stroke-width="5"/>
      <path d="M322 238 Q377 278 442 246 Q423 295 366 286 Q333 278 322 238Z" fill="#eef2ee" stroke="#23303b" stroke-width="4"/>
      <!-- neck/head -->
      <g class="head">
        <path d="M357 215 Q337 167 367 132 Q388 108 419 125 Q441 137 432 164 Q421 195 395 218Z" fill="#fffdf5" stroke="#23303b" stroke-width="5"/>
        <circle cx="404" cy="137" r="31" fill="#fffdf5" stroke="#23303b" stroke-width="5"/>
        <path d="M421 147 Q490 147 533 174 Q497 195 424 175 Q407 169 421 147Z" fill="#f1a45d" stroke="#23303b" stroke-width="5" stroke-linejoin="round"/>
        <path d="M431 171 Q488 170 522 177" fill="none" stroke="#d97846" stroke-width="4" stroke-linecap="round"/>
        <circle cx="413" cy="134" r="5.5" fill="#23303b"/><circle cx="415" cy="132" r="1.8" fill="#fffdf5"/>
        <path d="M394 110 Q410 99 428 108" fill="none" stroke="#e76f51" stroke-width="5" stroke-linecap="round"/>
      </g>
      <!-- wing -->
      <path class="wing" d="M359 198 Q419 181 470 215 Q439 252 377 244 Q350 239 359 198Z" fill="#dce8e5" stroke="#23303b" stroke-width="5"/>
      <path d="M382 209 Q423 216 450 232" fill="none" stroke="#9bb8b2" stroke-width="4" stroke-linecap="round"/>
      <path d="M372 220 Q415 231 438 240" fill="none" stroke="#9bb8b2" stroke-width="4" stroke-linecap="round"/>
      <!-- tail -->
      <path d="M316 231 L272 210 L286 251 Z" fill="#dce8e5" stroke="#23303b" stroke-width="5"/>
      <!-- seat perch -->
      <path d="M341 279 Q359 269 379 279" fill="none" stroke="#23303b" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- tiny motion marks -->
    <g stroke="#e76f51" stroke-width="4" stroke-linecap="round" opacity=".8">
      <path d="M190 272h30"/><path d="M176 290h22"/>
    </g>
  </g>
  <text x="28" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#23303b">Pelican on a bicycle</text>
  <text x="30" y="68" font-family="system-ui, sans-serif" font-size="13" fill="#4d6870">A five-second CSS loop · no external resources</text>
</svg>
