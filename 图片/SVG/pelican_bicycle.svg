<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只橙色鹈鹕骑着蓝色自行车，背景为米白色。</desc>
  <rect width="1200" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDECF4"/>
      <stop offset="1" stop-color="#F5F4ED"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2F6B78"/>
    </marker>
  </defs>
  <rect x="28" y="28" width="1144" height="704" rx="28" fill="url(#sky)" stroke="#C9D9D5" stroke-width="3"/>
  <path d="M55 590 C240 530 360 590 520 552 C720 505 850 575 1140 520 L1140 704 L55 704Z" fill="#DDE9D9"/>
  <path d="M55 625 C250 575 420 645 600 600 C790 553 965 625 1140 575" fill="none" stroke="#B6CCB4" stroke-width="5" stroke-linecap="round"/>

  <text x="72" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#2B2A26">鹈鹕骑自行车</text>
  <text x="74" y="122" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#6B675C">海风里的一段慢悠悠旅程</text>

  <!-- bicycle -->
  <g stroke="#2F6B78" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="390" cy="548" r="92" fill="#F5F4ED"/>
    <circle cx="790" cy="548" r="92" fill="#F5F4ED"/>
    <path d="M390 548 L505 430 L628 548 L390 548 M505 430 L790 548 M505 430 L570 430 M628 548 L675 430 L790 548 M675 430 L735 430"/>
    <path d="M570 430 L550 390 M550 390 L592 390"/>
    <circle cx="628" cy="548" r="18" fill="#F2B134"/>
    <path d="M628 548 L590 585 M628 548 L669 510" stroke="#F2B134" stroke-width="7"/>
    <path d="M578 585 L601 585 M659 510 L681 510" stroke="#F2B134" stroke-width="7"/>
  </g>
  <g fill="#2F6B78">
    <circle cx="390" cy="548" r="8"/><circle cx="790" cy="548" r="8"/>
  </g>

  <!-- pelican body -->
  <g stroke="#9A5B31" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="605" cy="327" rx="116" ry="146" fill="#E9A35A" transform="rotate(-12 605 327)"/>
    <path d="M525 300 C462 338 470 425 550 440 C574 445 593 428 585 404 C555 365 559 330 590 307Z" fill="#D7833E"/>
    <path d="M662 284 C721 300 751 360 718 407 C688 449 641 438 630 403 C659 378 675 346 662 284Z" fill="#D7833E"/>
    <path d="M625 430 C614 466 592 490 570 502" fill="none"/>
    <path d="M675 425 C685 465 706 487 731 496" fill="none"/>
  </g>
  <!-- neck and head -->
  <path d="M610 240 C585 194 596 132 649 112 C709 89 764 129 766 185 C768 230 735 263 689 268Z" fill="#F0B66C" stroke="#9A5B31" stroke-width="5"/>
  <path d="M718 178 C796 173 862 196 922 224 C867 255 790 265 715 237Z" fill="#E58D45" stroke="#9A5B31" stroke-width="5"/>
  <path d="M718 213 C790 217 853 230 906 243 C842 272 775 267 710 241Z" fill="#F4C17E" stroke="#9A5B31" stroke-width="4"/>
  <circle cx="718" cy="157" r="13" fill="#FFF8E8" stroke="#9A5B31" stroke-width="4"/>
  <circle cx="721" cy="158" r="5" fill="#2B2A26" stroke="none"/>
  <path d="M752 124 C775 101 797 103 811 119" fill="none" stroke="#C8753D" stroke-width="9" stroke-linecap="round"/>

  <!-- feet on pedals -->
  <g fill="#D77E38" stroke="#9A5B31" stroke-width="4">
    <path d="M570 500 C543 505 522 526 531 541 C542 554 570 546 587 532Z"/>
    <path d="M731 492 C753 488 777 499 778 516 C779 530 754 534 732 523Z"/>
  </g>

  <!-- motion lines and birds -->
  <path d="M210 330 C160 305 135 307 102 327 M238 366 C194 350 166 355 132 379" fill="none" stroke="#8AB4BF" stroke-width="6" stroke-linecap="round"/>
  <path d="M951 165 q18 -18 36 0 q18 -18 36 0" fill="none" stroke="#5B8991" stroke-width="5" stroke-linecap="round"/>
  <path d="M1000 300 q15 -15 30 0 q15 -15 30 0" fill="none" stroke="#5B8991" stroke-width="4" stroke-linecap="round"/>
  <path d="M105 520 C150 490 200 488 248 508" fill="none" stroke="#2F6B78" stroke-width="4" stroke-dasharray="10 14" marker-end="url(#arrow)"/>
</svg>
