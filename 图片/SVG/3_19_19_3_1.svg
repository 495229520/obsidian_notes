<rect x="535" y="290" width="20" height="20" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<rect x="560" y="290" width="20" height="20" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<path d="M680,300 L718,300" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="722" y="278" width="192" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="818.0" y="304.42" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">向量 2 → CPU 6</text>
<path d="M917,300 L978,300" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="983" y="278" width="189" height="44" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
