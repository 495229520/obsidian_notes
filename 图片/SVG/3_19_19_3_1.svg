<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<title>从流到 CPU：每一段由不同的机制选择</title>
<desc>RSS 选队列；IRQ 选通知位置；RPS/RFS 可转交后续处理；应用调度仍然独立。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="52" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">从流到 CPU：每一段由不同的机制选择</text>
<text x="48" y="82" font-size="14" fill="#6B675C" text-anchor="start" data-role="subtitle">RSS 选队列；IRQ 选通知位置；RPS/RFS 可转交后续处理；应用调度仍然独立。</text>
<rect x="48" y="108" width="1144" height="300" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="136" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">① 流（示意）</text>
<text x="288" y="136" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">② RSS 桶 → 队列</text>
<text x="492" y="136" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">③ RX Ring</text>
<text x="732" y="136" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">④ IRQ / NAPI</text>
<text x="1004" y="136" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">⑤ 协议栈 CPU</text>
<rect x="65" y="162" width="164" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="147.0" y="188.42" font-size="13" fill="#733428" text-anchor="middle" font-weight="700" data-role="body">Flow A · 大象流</text>
