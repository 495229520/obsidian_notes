<rect x="560" y="348" width="20" height="20" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<path d="M680,358 L718,358" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="722" y="336" width="192" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
