<text x="729" y="399" font-size="12" fill="#6B675C" text-anchor="start" data-role="body">示例映射；并非固定 1∶1∶1</text>
<rect x="48" y="427" width="1144" height="180" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="454" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">B · 看清选择方向，避免“绑一个核就全绑定”的误判</text>
<rect x="70" y="480" width="172" height="58" rx="7" fill="#EDEAF3" stroke="#82759D" stroke-width="1.3"/>
<text x="156.0" y="503.76" font-size="14" fill="#6B5B95" text-anchor="middle" font-weight="700" data-role="body">应用线程</text>
<text x="156.0" y="523.76" font-size="14" fill="#6B5B95" text-anchor="middle" data-role="body">当前执行 CPU</text>
<rect x="330" y="480" width="183" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="421.5" y="503.42" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">XPS</text>
<text x="421.5" y="523.42" font-size="13" fill="#2C4460" text-anchor="middle" data-role="body">CPU 或 RX 队列映射</text>
<rect x="601" y="480" width="180" height="58" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="691.0" y="503.76" font-size="14" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">TX queue</text>
<text x="691.0" y="523.76" font-size="14" fill="#24473F" text-anchor="middle" data-role="body">发送队列归属</text>
<rect x="874" y="480" width="281" height="58" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1014.5" y="503.42" font-size="13" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">发送完成处理</text>
<text x="1014.5" y="523.42" font-size="13" fill="#4A473F" text-anchor="middle" data-role="body">另查 CQ / NAPI / IRQ 映射</text>
<path d="M245,509 L326,509" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M516,509 L597,509" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M784,509 L870,509" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="71" y="577" font-size="13" fill="#733428" text-anchor="start" data-role="body">接收：流稳定 ≠ 工作量均匀</text>
<text x="418" y="577" font-size="13" fill="#6B4E28" text-anchor="start" data-role="body">应用位置 ≠ 协议栈位置</text>
<text x="812" y="577" font-size="13" fill="#24473F" text-anchor="start" data-role="body">发送队列 ≠ 完成处理 CPU</text>
<path d="M48,621 L1192,621" fill="none" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="651" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="footer">口径：普通 Linux socket 路径的职责图；色块数量仅示意负载，不代表实测队列深度。</text>
</svg>