<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/>
    </marker>
  </defs>

  <title>服务端与客户端的流程对照</title>
  <desc>两条泳道按时间对齐：服务端 socket-bind-listen-accept，客户端 socket-connect，三次握手在 connect 与 accept 之间发生，数据段与四次挥手对称收尾。</desc>

  <rect x="0" y="0" width="1240" height="690" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">服务端等，客户端敲门</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">两条泳道按时间对齐 · 握手发生在 connect 与 accept 之间 · 客户端不 bind，但一样有端口</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="104" width="1144" height="424" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="15" font-weight="700" fill="#4A473F">A · 同一段时间里，两边各自在做什么</text>

  <rect x="140" y="172" width="340" height="340" rx="8" fill="#F2F5FA" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="760" y="172" width="340" height="340" rx="8" fill="#F0F6F3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="310" y="164" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">服务端 · 被动方</text>
  <text x="930" y="164" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">客户端 · 主动方</text>

  <!-- 服务端四步 -->
  <rect x="180" y="184" width="260" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="310" y="210" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">socket()</text>

  <rect x="180" y="238" width="260" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="310" y="264" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">bind()</text>

  <rect x="180" y="292" width="260" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="310" y="318" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">listen()</text>

  <rect x="180" y="346" width="260" height="42" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="310" y="372" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">accept() 阻塞在这里</text>

  <rect x="180" y="404" width="260" height="42" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="310" y="430" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">read / write</text>

  <rect x="180" y="460" width="260" height="42" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="310" y="486" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">close()</text>

  <path d="M310 228 L310 236" stroke="#9B968A" stroke-width="1.4" marker-end="url(#arrS)"/>
  <path d="M310 282 L310 290" stroke="#9B968A" stroke-width="1.4" marker-end="url(#arrS)"/>
  <path d="M310 336 L310 344" stroke="#9B968A" stroke-width="1.4" marker-end="url(#arrS)"/>
  <path d="M310 390 L310 402" stroke="#9B968A" stroke-width="1.4" marker-end="url(#arrS)"/>
  <path d="M310 448 L310 458" stroke="#9B968A" stroke-width="1.4" marker-end="url(#arrS)"/>

  <!-- 客户端 -->
  <rect x="800" y="184" width="260" height="96" rx="7" fill="none" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="930" y="222" font-size="12.5" font-weight="700" fill="#6B675C" text-anchor="middle">不 bind，也不 listen</text>
  <text x="930" y="246" font-size="11" fill="#6B675C" text-anchor="middle">但这不等于没有端口</text>

  <rect x="800" y="292" width="260" height="42" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="930" y="318" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">socket()</text>

  <rect x="800" y="346" width="260" height="42" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="930" y="372" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">connect() 阻塞在这里</text>

  <rect x="800" y="404" width="260" height="42" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="930" y="430" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">write / read</text>

  <rect x="800" y="460" width="260" height="42" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="930" y="486" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">close()</text>

  <path d="M930 336 L930 344" stroke="#9B968A" stroke-width="1.4" marker-end="url(#arrS)"/>
  <path d="M930 390 L930 402" stroke="#9B968A" stroke-width="1.4" marker-end="url(#arrS)"/>
  <path d="M930 448 L930 458" stroke="#9B968A" stroke-width="1.4" marker-end="url(#arrS)"/>

  <!-- 跨列：三次握手 -->
  <path d="M600 367 L444 367" stroke="#B07D2B" stroke-width="1.8" marker-end="url(#arrA)"/>
  <path d="M640 367 L796 367" stroke="#B07D2B" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="620" y="354" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">三次握手</text>
  <text x="620" y="386" font-size="10.5" fill="#6B4E28" text-anchor="middle">内核自己完成</text>
  <text x="620" y="402" font-size="10.5" fill="#6B4E28" text-anchor="middle">connect 返回 0，accept 拿到新 fd</text>

  <!-- 跨列：数据 -->
  <path d="M600 428 L444 428" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrG)"/>
  <path d="M640 428 L796 428" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="620" y="422" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">数据</text>
  <text x="620" y="446" font-size="10.5" fill="#24473F" text-anchor="middle">字节流，没有消息边界</text>

  <!-- 跨列：挥手 -->
  <path d="M600 481 L444 481" stroke="#9B968A" stroke-width="1.8" marker-end="url(#arrN)"/>
  <path d="M640 481 L796 481" stroke="#9B968A" stroke-width="1.8" marker-end="url(#arrN)"/>
  <text x="620" y="475" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">四次挥手</text>
  <text x="620" y="499" font-size="10.5" fill="#4A473F" text-anchor="middle">先 close 的一方进 TIME_WAIT</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="544" width="1144" height="102" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="72" y="558" width="346" height="74" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="88" y="582" font-size="12.5" font-weight="700" fill="#2C4460">客户端也有端口</text>
  <text x="88" y="604" font-size="11" fill="#2C4460">connect 时内核挑一个临时端口</text>
  <text x="88" y="622" font-size="11" fill="#2C4460">范围看 ip_local_port_range</text>

  <rect x="446" y="558" width="346" height="74" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="462" y="582" font-size="12.5" font-weight="700" fill="#6B4E28">握手不是 accept 做的</text>
  <text x="462" y="604" font-size="11" fill="#6B4E28">listen 之后内核就自己握手了</text>
  <text x="462" y="622" font-size="11" fill="#6B4E28">accept 只是从队列里取一条</text>

  <rect x="820" y="558" width="346" height="74" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="836" y="582" font-size="12.5" font-weight="700" fill="#24473F">两边的 close 不对称</text>
  <text x="836" y="604" font-size="11" fill="#24473F">先 close 的一方留 2MSL 的 TIME_WAIT</text>
  <text x="836" y="622" font-size="11" fill="#24473F">服务端重启撞 EADDRINUSE 就是它</text>

  <text x="48" y="676" font-size="12" fill="#6B675C">左右两列的差别只有三处：客户端不 bind、不 listen，用 connect 代替 accept。剩下的收发与关闭完全对称</text>
</svg>
