<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
  <rect x="0" y="0" width="1200" height="570" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .mess { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .clean { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">从实验堆到作品集交付</text>
  <text x="56" y="88" class="small">Week16 的主要动作是整理边界和证据，而不是继续堆新功能。</text>

  <rect x="70" y="135" width="410" height="310" class="mess"/>
  <text x="105" y="175" class="label">实验堆</text>
  <rect x="105" y="210" width="145" height="45" class="card"/><text x="125" y="239" class="tiny">random csv</text>
  <rect x="270" y="225" width="145" height="45" class="card"/><text x="292" y="254" class="tiny">old logs</text>
  <rect x="125" y="285" width="145" height="45" class="card"/><text x="145" y="314" class="tiny">ncu reports</text>
  <rect x="290" y="310" width="145" height="45" class="card"/><text x="310" y="339" class="tiny">draft notes</text>
  <text x="105" y="395" class="small">入口不清楚，结果难追溯。</text>

  <path d="M500 290 H670" class="line"/>

  <rect x="700" y="135" width="410" height="310" class="clean"/>
  <text x="735" y="175" class="label">作品集结构</text>
  <rect x="735" y="210" width="300" height="38" class="card"/><text x="755" y="235" class="tiny">README.md</text>
  <rect x="735" y="260" width="300" height="38" class="card"/><text x="755" y="285" class="tiny">benchmarks/raw + summary</text>
  <rect x="735" y="310" width="300" height="38" class="card"/><text x="755" y="335" class="tiny">profiling/ncu + profiling.md</text>
  <rect x="735" y="360" width="300" height="38" class="card"/><text x="755" y="385" class="tiny">reports/artifacts_index.md</text>
  <text x="735" y="430" class="small">入口、数据、报告、限制都可追溯。</text>

  <text x="82" y="520" class="tiny">不要删除失败实验；在 artifact index 中标注状态、原因和是否参与最终结论。</text>
</svg>
