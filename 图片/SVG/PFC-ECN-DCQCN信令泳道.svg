<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A05248"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">无损的两道闸：ECN 提前减速，PFC 最后刹车</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">DCQCN：交换机标 CE → 接收端回 CNP → 发送端网卡降速；PFC 只该在 ECN 来不及时逐跳暂停</text>

  <!-- 发送端 RP -->
  <rect x="48" y="150" width="250" height="120" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="64" y="176" font-size="12.5" font-weight="700" fill="#2C4460">发送端网卡 · RP（反应点）</text>
  <text x="64" y="200" font-size="10.5" fill="#2C4460">④ 收到 CNP → rate ×(1−α/2)</text>
  <text x="64" y="218" font-size="10.5" fill="#2C4460">安静周期 → 向 target 逐步恢复</text>
  <text x="64" y="236" font-size="10.5" fill="#2C4460">每流状态在网卡：rate / target / α</text>

  <!-- 交换机 CP -->
  <rect x="470" y="130" width="300" height="250" rx="8" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.4"/>
  <text x="486" y="156" font-size="12.5" font-weight="700" fill="#2B2A26">交换机 · CP（拥塞点）</text>
  <!-- 队列图: 从下往上涨 -->
  <rect x="500" y="180" width="64" height="176" rx="4" fill="none" stroke="#5A564B" stroke-width="1.4"/>
  <rect x="502" y="290" width="60" height="64" fill="#DCE9E3"/>
  <rect x="502" y="248" width="60" height="42" fill="#F0E3D3"/>
  <rect x="502" y="216" width="60" height="32" fill="#EDDCD8"/>
  <line x1="496" y1="290" x2="568" y2="290" stroke="#2F6B5E" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="578" y="294" font-size="10" fill="#24473F">ECN 标记阈值（先触发）</text>
  <line x1="496" y1="248" x2="568" y2="248" stroke="#B07A3E" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="578" y="252" font-size="10" fill="#7A5426">PFC XOFF（后触发）</text>
  <line x1="496" y1="216" x2="568" y2="216" stroke="#A05248" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="578" y="220" font-size="10" fill="#7A392F">headroom：吸收在途包</text>
  <text x="500" y="372" font-size="10" fill="#6B675C">出口队列深度 ↑</text>

  <!-- 接收端 NP -->
  <rect x="940" y="150" width="250" height="120" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="956" y="176" font-size="12.5" font-weight="700" fill="#24473F">接收端网卡 · NP（通知点）</text>
  <text x="956" y="200" font-size="10.5" fill="#24473F">③ 见到 CE 标记 → 回 CNP</text>
  <text x="956" y="218" font-size="10.5" fill="#24473F">CNP 走独立的高优先级 TC</text>
  <text x="956" y="236" font-size="10.5" fill="#24473F">（不能和数据同队列被一起堵）</text>

  <!-- 数据流箭头 -->
  <line x1="298" y1="205" x2="466" y2="205" stroke="#5A564B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="196" font-size="10.5" fill="#6B675C">① 满速数据流</text>
  <line x1="770" y1="205" x2="936" y2="205" stroke="#5A564B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="778" y="196" font-size="10.5" fill="#6B675C">② 越过 ECN 阈值 → 出包打 CE</text>

  <!-- CNP 返回 -->
  <line x1="938" y1="300" x2="300" y2="300" stroke="#2F6B5E" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrt)"/>
  <text x="560" y="318" font-size="10.5" fill="#24473F">③ CNP（拥塞通知包）——端到端，只发给造成拥塞的那条流的发送方</text>

  <!-- PAUSE 返回 -->
  <line x1="466" y1="168" x2="300" y2="168" stroke="#A05248" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrr)"/>
  <text x="306" y="132" font-size="10.5" fill="#7A392F">⑤ 超过 XOFF → PAUSE 帧</text>
  <text x="306" y="148" font-size="10.5" fill="#7A392F">（逐跳、按优先级、无差别）</text>

  <!-- 阈值关系条 -->
  <text x="48" y="428" font-size="13" font-weight="700" fill="#2B2A26">缓冲阈值的正确顺序 —— 让 ECN 先说话，PFC 当保险丝</text>
  <rect x="48" y="442" width="500" height="44" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="298" y="469" font-size="11" fill="#24473F" text-anchor="middle">正常转发</text>
  <rect x="548" y="442" width="340" height="44" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.2"/>
  <text x="718" y="469" font-size="11" fill="#7A5426" text-anchor="middle">超过 ECN 阈值：概率标记 CE</text>
  <rect x="888" y="442" width="292" height="44" fill="#EDDCD8" stroke="#A05248" stroke-width="1.2"/>
  <text x="1034" y="469" font-size="11" fill="#7A392F" text-anchor="middle">超过 XOFF：PAUSE 上游 + headroom</text>
  <text x="48" y="512" font-size="10.5" fill="#7A392F">顺序配反（ECN 阈值 ≥ XOFF）：PFC 永远先触发，ECN 形同虚设 —— 全网只剩暂停/恢复的锯齿【陷阱】</text>

  <!-- PFC 三种病 -->
  <text x="48" y="552" font-size="13" font-weight="700" fill="#2B2A26">PFC 单独扛拥塞会得的三种病</text>
  <rect x="48" y="566" width="364" height="88" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="64" y="590" font-size="12" font-weight="700" fill="#2B2A26">队头阻塞（HoL）</text>
  <text x="64" y="612" font-size="10.5" fill="#6B675C">PAUSE 按优先级整级暂停：</text>
  <text x="64" y="630" font-size="10.5" fill="#6B675C">一条慢流拖停同优先级的所有流</text>
  <rect x="430" y="566" width="364" height="88" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="446" y="590" font-size="12" font-weight="700" fill="#2B2A26">拥塞扩散</text>
  <text x="446" y="612" font-size="10.5" fill="#6B675C">上游停发 → 上游自己的队列涨 →</text>
  <text x="446" y="630" font-size="10.5" fill="#6B675C">再向更上游 PAUSE，蔓延成拥塞树</text>
  <rect x="812" y="566" width="364" height="88" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="828" y="590" font-size="12" font-weight="700" fill="#2B2A26">死锁（循环缓冲依赖 CBD）</text>
  <text x="828" y="612" font-size="10.5" fill="#6B675C">环上各口互等对方腾缓冲——与多把锁</text>
  <text x="828" y="630" font-size="10.5" fill="#6B675C">循环等待同构；靠 PFC watchdog 强拆</text>

  <text x="48" y="694" font-size="10.5" fill="#6B675C">PFC = 分布式的有界队列阻塞背压（与 1.7 的 tag/信号量同构）；DCQCN = 网卡里的 AIMD 限流器</text>
</svg>
