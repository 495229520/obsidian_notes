<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<title id="title">同一个 verbs API，资源路径与热路径分工不同</title><desc id="desc">顶层应用分为资源管理路径和普通post/poll热路径。左侧进入内核建立映射，右侧构造WQE、发布MMIO、RNIC执行和CQ解析。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="690" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">同一个 verbs API，资源路径与热路径分工不同</text>
<text x="48" y="82" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">固定 rdma-core v57.0 / mlx5；用户态 provider 不等于内核 mlx5_ib 模块。</text>
<rect x="48" y="114" width="1144" height="53" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="620.0" y="134.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">应用：公共 verbs 对象与 API</text>
<text x="620.0" y="155.76" font-size="12" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">QP / CQ / MR / WR / SGE</text>
<rect x="48" y="186" width="376" height="416" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<rect x="450" y="186" width="742" height="416" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text x="68" y="215" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">资源建立 / 低频</text>
<text x="471" y="215" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">常规 post / poll / 高频</text>
<rect x="72" y="243" width="328" height="71" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="236.0" y="272.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">libibverbs + mlx5</text>
<text x="236.0" y="293.76" font-size="12" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">PD / CQ / QP / MR 命令</text>
<rect x="72" y="365" width="328" height="71" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="236.0" y="394.76" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">uverbs + 内核设备驱动</text>
<text x="236.0" y="415.76" font-size="12" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">授权 / 硬件对象 / 映射</text>
<rect x="72" y="487" width="328" height="81" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
<text x="236.0" y="511.26" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">合法可用的资源</text>
<text x="236.0" y="532.26" font-size="12" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">SQ / CQ / DBR</text>
<text x="236.0" y="553.26" font-size="12" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">UAR MMIO 映射</text>
<path d="M236,170 L236,239" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M236,317 L236,361" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M236,439 L236,483" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="478" y="244" width="268" height="67" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="612.0" y="271.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">mlx5_post_send</text>
<text x="612.0" y="292.76" font-size="12" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">通用 WR → 设备任务</text>
<rect x="828" y="244" width="326" height="67" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="991.0" y="271.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">WQE + shadow arrays</text>
<text x="991.0" y="292.76" font-size="12" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">SQ 内存 / wrid / wqe_head</text>
<rect x="828" y="369" width="326" height="67" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="991.0" y="396.76" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">DBR + BF / MMIO</text>
<text x="991.0" y="417.76" font-size="12" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">排序后发布</text>
<rect x="478" y="369" width="268" height="67" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="612.0" y="396.76" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">RNIC 执行</text>
<text x="612.0" y="417.76" font-size="12" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">DMA / RC 传输</text>
<rect x="478" y="492" width="268" height="67" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="612.0" y="519.76" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">CQE</text>
<text x="612.0" y="540.76" font-size="12" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">owner / WQE counter</text>
<rect x="828" y="492" width="326" height="67" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="991.0" y="519.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">mlx5_poll_cq / v1</text>
<text x="991.0" y="540.76" font-size="12" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">解析 WC / 推进回收</text>
<path d="M728,170 L728,226 L612,226 L612,240" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M750,277 L823,277" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M991,315 L991,365" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M824,402 L750,402" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M612,440 L612,488" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M750,525 L824,525" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="832" y="584" font-size="12" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">返回 ibv_wc 给应用</text>
<text x="68" y="631" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">常规热路径不需要每 WR 系统调用；但依赖已建立的对象、权限与映射。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="scope">事件、错误、资源重建或 ODP 等路径仍可能需要内核参与；本图不覆盖所有 mlx5 扩展。</text>
</svg>