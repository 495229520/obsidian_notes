  <rect x="520" y="202" width="588" height="43" fill="#F3E8D3" stroke="#8A6A3A" rx="8" stroke-width="1.3" />
  <text x="814.0" y="228.54" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">潜在坏块 · 业务未访问</text>
  <rect x="245" y="262" width="575" height="43" fill="#DCE9E3" stroke="#2F6B5E" rx="8" stroke-width="1.3" />
  <text x="532.5" y="288.54" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">正常字节</text>
  <rect x="820" y="262" width="288" height="43" fill="#F0E0DB" stroke="#A64B3C" rx="8" stroke-width="1.3" />
  <text x="964.0" y="288.54" font-size="14" fill="#733428" font-weight="700" text-anchor="middle" data-role="body">节点不可用</text>
  <rect x="245" y="322" width="863" height="43" fill="#DCE9E3" stroke="#2F6B5E" rx="8" stroke-width="1.3" />
