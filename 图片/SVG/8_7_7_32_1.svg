  <text x="79" y="349" font-size="14.5" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">副本 C</text>
  <rect x="245" y="202" width="275" height="43" fill="#DCE9E3" stroke="#2F6B5E" rx="8" stroke-width="1.3" />
