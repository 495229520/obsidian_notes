  <text x="894" y="390" font-size="14" fill="#733428" font-weight="700" text-anchor="start" data-role="body">此块仅 C 合格</text>
  <rect x="48" y="425" width="1144" height="205" fill="#FBFBF6" stroke="#D8D5C8" rx="8" stroke-width="1.3" />
  <text x="66" y="453" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="section">B · 周期深度检查：提前发现与恢复</text>
  <polyline points="194,517 1140,517" fill="none" stroke="#9B968A" stroke-width="2" marker-end="url(#arr-gray)" stroke-linejoin="round" />
  <circle cx="250" cy="517" r="7" fill="#3D5A80" />
  <text x="250" y="490" font-size="14.5" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">正常写入</text>
  <text x="250" y="552" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">建立期望值</text>
  <circle cx="510" cy="517" r="7" fill="#8A6A3A" />
  <text x="510" y="490" font-size="14.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">字节变化</text>
  <text x="510" y="552" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">潜伏开始</text>
  <circle cx="755" cy="517" r="7" fill="#A64B3C" />
  <text x="755" y="490" font-size="14.5" fill="#733428" font-weight="700" text-anchor="middle" data-role="body">主动回读</text>
  <text x="755" y="552" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">发现不匹配</text>
  <circle cx="1000" cy="517" r="7" fill="#2F6B5E" />
  <text x="1000" y="490" font-size="14.5" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">修复 + 复核</text>
  <text x="1000" y="552" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">恢复健康冗余</text>
  <rect x="515" y="574" width="480" height="23" fill="#F3E8D3" stroke="none" rx="3" stroke-width="1.3" />
  <text x="755" y="613" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body">发现延迟 + 排队 + 修复 + 复核</text>
  <line x1="48" y1="649" x2="1192" y2="649" stroke="#D8D5C8" stroke-width="1" />
  <text x="48" y="678" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">Read Repair 只覆盖被访问的数据；定期扫描要有可验证的覆盖目标，不能只记录定时任务启动成功。</text>
