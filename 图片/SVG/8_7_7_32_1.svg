  <rect x="0" y="0" width="1240" height="700" fill="#F5F4ED" stroke="none" rx="0" stroke-width="1.3" />
  <text x="48" y="53" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="title">冷数据：业务正常，不等于冗余健康</text>
  <text x="48" y="82" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-role="subtitle">时间为机制示意；实际风险取决于故障域、扫描覆盖与修复进度。</text>
  <rect x="48" y="109" width="1144" height="298" fill="#FBFBF6" stroke="#D8D5C8" rx="8" stroke-width="1.3" />
