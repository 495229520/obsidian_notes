<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<title id="title">三种完成域：GPU 生产、网络交付、GPU 消费</title><desc id="desc">五个参与者的顺序图：生产者完成、post、NIC写显存、接收WC、CUDA可见性衔接、校验完成和CHECKED ACK。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">三种完成域：GPU 生产、网络交付、GPU 消费</text>
<text x="48" y="82" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">单槽串行基线；接收完成之后再进入 CUDA 消费，校验之后才归还槽。</text>
<rect x="74" y="117" width="164" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="156.0" y="148.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">GPU A</text>
<line x1="156" y1="181" x2="156" y2="597" stroke="#B6B1A3" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="304" y="117" width="164" height="54" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
<text x="386.0" y="148.76" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">CPU A</text>
<line x1="386" y1="181" x2="386" y2="597" stroke="#B6B1A3" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="534" y="117" width="164" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="616.0" y="148.76" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">RNIC / 网络</text>
<line x1="616" y1="181" x2="616" y2="597" stroke="#B6B1A3" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="764" y="117" width="164" height="54" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
<text x="846.0" y="148.76" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">CPU B</text>
<line x1="846" y1="181" x2="846" y2="597" stroke="#B6B1A3" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="994" y="117" width="164" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="1076.0" y="148.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">GPU B</text>
<line x1="1076" y1="181" x2="1076" y2="597" stroke="#B6B1A3" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="150" y="192" width="12" height="50" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<rect x="1070" y="443" width="12" height="81" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<path d="M163,220 L379,220" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="176.0" y="190" width="190" height="23" rx="2" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="271.0" y="207" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">① producer event 完成</text>
<path d="M393,277 L609,277" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="406.0" y="247" width="190" height="23" rx="2" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="501.0" y="264" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">② post / 提交返回</text>
<path d="M623,337 L1069,337" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="751.0" y="307" width="190" height="23" rx="2" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="846.0" y="324" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">③ DMA 写 payload</text>
<path d="M623,395 L839,395" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="636.0" y="365" width="190" height="23" rx="2" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="731.0" y="382" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">④ 成功 receive WC</text>
<path d="M853,455 L1069,455" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="866.0" y="425" width="190" height="23" rx="2" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="961.0" y="442" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">⑤ CUDA 顺序衔接</text>
<path d="M1069,515 L853,515" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="866.0" y="485" width="190" height="23" rx="2" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="961.0" y="502" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">⑥ 本轮校验结束</text>
<path d="M839,575 L393,575" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="521.0" y="545" width="190" height="23" rx="2" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="616.0" y="562" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">⑦ CHECKED ACK</text>
<text x="51" y="626" font-size="14" font-weight="700" fill="#24473F" text-anchor="start" data-role="section">允许复用：本地发送完成 + 对端消费确认</text>
<text x="48" y="653" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="scope">图中的接收 WC 对应 SEND/RECV 或 WRITE_WITH_IMM；普通 WRITE 不自动产生远端接收 WC。</text>
</svg>