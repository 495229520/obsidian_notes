<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>pbuf ring 内存布局与发布顺序</title>
  <desc>模拟 io_uring_buf 描述符环、数据区、tail 发布，以及先写描述符后 advance 的 release/acquire 协议。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">pbuf ring：描述符环 + 数据区，不是 fixed buffer</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">ring 装 io_uring_buf · 数据区仍是应用内存 · 先写描述符再 release 发布 tail</text>

  <!-- ========== Memory map ========== -->
  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">用户态内存布局示意</text>

  <rect x="48" y="128" width="1144" height="280" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>

  <!-- buf ring header + slots -->
  <text x="72" y="158" font-size="12" font-weight="700" fill="#2C4460">io_uring_buf_ring（共享描述符环）</text>
  <text x="360" y="158" font-size="11" fill="#6B675C">entries = 2^n · mask = entries-1 · 与 SQ/CQ mask 无关</text>

  <rect x="72" y="176" width="120" height="72" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="132" y="206" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">tail</text>
  <text x="132" y="226" font-size="10" fill="#3D5A80" text-anchor="middle">应用发布</text>

  <rect x="208" y="176" width="150" height="72" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="283" y="198" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">slot 0</text>
  <text x="283" y="216" font-size="10" fill="#8A6A3A" text-anchor="middle">addr / len</text>
  <text x="283" y="234" font-size="10" fill="#8A6A3A" text-anchor="middle">bid=0</text>

  <rect x="370" y="176" width="150" height="72" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="445" y="198" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">slot 1</text>
  <text x="445" y="216" font-size="10" fill="#8A6A3A" text-anchor="middle">addr / len</text>
  <text x="445" y="234" font-size="10" fill="#8A6A3A" text-anchor="middle">bid=1</text>

  <rect x="532" y="176" width="150" height="72" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="607" y="214" font-size="12" fill="#6B675C" text-anchor="middle">…</text>

  <rect x="694" y="176" width="150" height="72" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="769" y="198" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">slot N-1</text>
  <text x="769" y="216" font-size="10" fill="#8A6A3A" text-anchor="middle">addr / len</text>
  <text x="769" y="234" font-size="10" fill="#8A6A3A" text-anchor="middle">bid=N-1</text>

  <rect x="860" y="176" width="300" height="72" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="1010" y="206" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">bgid = SQE.buf_group</text>
  <text x="1010" y="226" font-size="10" fill="#6B5B95" text-anchor="middle">选池 · 不是选具体块</text>

  <!-- data buffers -->
  <text x="72" y="280" font-size="12" font-weight="700" fill="#24473F">数据区（应用分配，描述符只指向它们）</text>

  <rect x="72" y="296" width="200" height="80" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="172" y="324" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">buffers[0]</text>
  <text x="172" y="344" font-size="10" fill="#2F6B5E" text-anchor="middle">4096 B · bid 0</text>
  <text x="172" y="362" font-size="10" fill="#6B675C" text-anchor="middle">← slot0.addr</text>

  <rect x="292" y="296" width="200" height="80" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="392" y="324" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">buffers[1]</text>
  <text x="392" y="344" font-size="10" fill="#2F6B5E" text-anchor="middle">4096 B · bid 1</text>
  <text x="392" y="362" font-size="10" fill="#6B675C" text-anchor="middle">← slot1.addr</text>

  <rect x="512" y="296" width="200" height="80" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="612" y="340" font-size="14" fill="#6B675C" text-anchor="middle">…</text>

  <rect x="732" y="296" width="200" height="80" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="832" y="324" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">buffers[N-1]</text>
  <text x="832" y="344" font-size="10" fill="#2F6B5E" text-anchor="middle">4096 B · bid N-1</text>
  <text x="832" y="362" font-size="10" fill="#6B675C" text-anchor="middle">← slotN-1.addr</text>

  <rect x="952" y="296" width="208" height="80" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="1056" y="328" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">≠ fixed/registered</text>
  <text x="1056" y="348" font-size="10" fill="#A64B3C" text-anchor="middle">≠ 零拷贝承诺</text>
  <text x="1056" y="366" font-size="10" fill="#733428" text-anchor="middle">只是选择/回收协议</text>

  <!-- pointer lines -->
  <path d="M283,248 L172,296" fill="none" stroke="#8A6A3A" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M445,248 L392,296" fill="none" stroke="#8A6A3A" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M769,248 L832,296" fill="none" stroke="#8A6A3A" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- ========== Ordering ========== -->
  <text x="48" y="446" font-size="13" font-weight="700" fill="#4A473F">内存顺序 · 先写描述符，后推进 tail</text>

  <!-- correct -->
  <rect x="48" y="462" width="560" height="220" rx="10" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.5"/>
  <rect x="48" y="462" width="560" height="36" rx="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <rect x="48" y="486" width="560" height="12" fill="#DCE9E3"/>
  <text x="68" y="486" font-size="13" font-weight="700" fill="#24473F">正确 · release/acquire 协议</text>

  <rect x="72" y="520" width="150" height="48" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="147" y="540" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">① 写 addr/len/bid</text>
  <text x="147" y="556" font-size="10" fill="#8A6A3A" text-anchor="middle">buf_ring_add</text>

  <path d="M230,544 L258,544" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arrg)"/>

  <rect x="266" y="520" width="150" height="48" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="341" y="540" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">② release tail</text>
  <text x="341" y="556" font-size="10" fill="#3D5A80" text-anchor="middle">buf_ring_advance</text>

  <path d="M424,544 L452,544" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arrg)"/>

  <rect x="460" y="520" width="120" height="48" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="520" y="540" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">③ 内核可见</text>
  <text x="520" y="556" font-size="10" fill="#2F6B5E" text-anchor="middle">acquire 读槽</text>

  <text x="72" y="598" font-size="12" fill="#4A473F">应用：写描述符 → release 发布 tail</text>
  <text x="72" y="622" font-size="12" fill="#4A473F">内核：acquire 观察 tail → 读描述符 → 消费 buffer</text>
  <text x="72" y="646" font-size="11" fill="#2F6B5E">批量：offset 0..N-1 写完，一次 advance(N)</text>
  <text x="72" y="668" font-size="11" fill="#6B675C">优先用 liburing helper，勿普通赋值重写发布</text>

  <!-- wrong -->
  <rect x="632" y="462" width="560" height="220" rx="10" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.5"/>
  <rect x="632" y="462" width="560" height="36" rx="10" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <rect x="632" y="486" width="560" height="12" fill="#F0E0DB"/>
  <text x="652" y="486" font-size="13" font-weight="700" fill="#733428">错误 · 先推进 tail 再写描述符</text>

  <rect x="656" y="520" width="150" height="48" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="731" y="540" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">① 先 advance</text>
  <text x="731" y="556" font-size="10" fill="#A64B3C" text-anchor="middle">tail 已可见</text>

  <path d="M814,544 L842,544" fill="none" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arrr)"/>

  <rect x="850" y="520" width="150" height="48" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="925" y="540" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">② 后写描述符</text>
  <text x="925" y="556" font-size="10" fill="#8A6A3A" text-anchor="middle">可能未完成</text>

  <path d="M1008,544 L1036,544" fill="none" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arrr)"/>

  <rect x="1044" y="520" width="120" height="48" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1104" y="540" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">③ 内核读脏</text>
  <text x="1104" y="556" font-size="10" fill="#A64B3C" text-anchor="middle">旧/半写字段</text>

  <text x="656" y="598" font-size="12" fill="#733428">内核看到「新 buffer 已到货」，却读到旧地址或半写入长度</text>
  <text x="656" y="622" font-size="12" fill="#4A473F">结果：错误 bid、写到错误内存、静默覆盖</text>
  <text x="656" y="646" font-size="11" fill="#733428">「用了原子类型」≠ 并发协议正确</text>
  <text x="656" y="668" font-size="11" fill="#6B675C">多线程争槽、重复归还 bid、同时推进 CQ 仍需另设计</text>

  <!-- ========== API strip ========== -->
  <rect x="48" y="708" width="1144" height="140" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
  <text x="72" y="740" font-size="13" font-weight="700" fill="#4A473F">liburing 常用路径</text>

  <rect x="72" y="760" width="260" height="60" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="202" y="786" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">setup_buf_ring</text>
  <text x="202" y="804" font-size="10" fill="#3D5A80" text-anchor="middle">entries · bgid · 注册</text>

  <rect x="352" y="760" width="260" height="60" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="482" y="786" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">buf_ring_add</text>
  <text x="482" y="804" font-size="10" fill="#8A6A3A" text-anchor="middle">addr · len · bid · mask · offset</text>

  <rect x="632" y="760" width="260" height="60" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="762" y="786" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">buf_ring_advance</text>
  <text x="762" y="804" font-size="10" fill="#2F6B5E" text-anchor="middle">一次发布 count 个槽</text>

  <rect x="912" y="760" width="252" height="60" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="1038" y="786" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">free_buf_ring</text>
  <text x="1038" y="804" font-size="10" fill="#6B5B95" text-anchor="middle">晚于请求/业务引用结束</text>
</svg>
