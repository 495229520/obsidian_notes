<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">CMake 目标依赖图</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">05 CMake target dependency graph</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“3. 构建系统：CMakeLists.txt”中，解释 reduce_lib、测试和 benchmark 的关系</text>
<rect x="480" y="130" width="320" height="120" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="480" y="130" width="320" height="8" rx="18" fill="#7C3AED" opacity="1"/>
<text x="500" y="164" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">reduce_lib</text>
<text x="500" y="194" font-size="14" font-weight="400" fill="#334155" text-anchor="start">src/reduce_naive.cu</text>
<text x="500" y="215" font-size="14" font-weight="400" fill="#334155" text-anchor="start">src/reduce_shared.cu</text>
<text x="500" y="236" font-size="14" font-weight="400" fill="#334155" text-anchor="start">src/reduce_shuffle.cu</text>
<rect x="515" y="255" width="250" height="32" rx="16.0" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" opacity="1"/>
<text x="640.0" y="276.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">PUBLIC include dirs: include + src</text>
<rect x="130" y="420" width="230" height="110" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="130" y="420" width="230" height="8" rx="18" fill="#F59E0B" opacity="1"/>
<text x="150" y="454" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">test_reduce_naive</text>
<text x="150" y="484" font-size="14" font-weight="400" fill="#334155" text-anchor="start">tests/test_reduce_naive.cu</text>
<text x="150" y="505" font-size="14" font-weight="400" fill="#334155" text-anchor="start">target_link_libraries(... reduce_lib)</text>
<line x1="640" y1="250" x2="245" y2="420" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="440" y="420" width="230" height="110" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="440" y="420" width="230" height="8" rx="18" fill="#059669" opacity="1"/>
<text x="460" y="454" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">test_reduce_shared</text>
<text x="460" y="484" font-size="14" font-weight="400" fill="#334155" text-anchor="start">tests/test_reduce_shared.cu</text>
<text x="460" y="505" font-size="14" font-weight="400" fill="#334155" text-anchor="start">target_link_libraries(... reduce_lib)</text>
<line x1="640" y1="250" x2="555" y2="420" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="750" y="420" width="230" height="110" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="750" y="420" width="230" height="8" rx="18" fill="#2563EB" opacity="1"/>
<text x="770" y="454" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">test_reduce_shuffle</text>
<text x="770" y="484" font-size="14" font-weight="400" fill="#334155" text-anchor="start">tests/test_reduce_shuffle.cu</text>
<text x="770" y="505" font-size="14" font-weight="400" fill="#334155" text-anchor="start">target_link_libraries(... reduce_lib)</text>
<line x1="640" y1="250" x2="865" y2="420" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1010" y="420" width="230" height="110" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="1010" y="420" width="230" height="8" rx="18" fill="#DC2626" opacity="1"/>
<text x="1030" y="454" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">bench_reduce</text>
<text x="1030" y="484" font-size="14" font-weight="400" fill="#334155" text-anchor="start">benchmarks/bench_reduce.cu</text>
<text x="1030" y="505" font-size="14" font-weight="400" fill="#334155" text-anchor="start">target_link_libraries(... reduce_lib)</text>
<line x1="640" y1="250" x2="1125" y2="420" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="70" y="135" width="350" height="225" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="88" y="163" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="start">关键 CMake 片段</text>
<text x="88" y="190" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">project(ParallelReduce LANGUAGES CXX CUDA)</text>
<text x="88" y="210" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">set(CMAKE_CXX_STANDARD 20)</text>
<text x="88" y="230" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">set(CMAKE_CUDA_STANDARD 17)</text>
<text x="88" y="250" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">add_library(reduce_lib ...)</text>
<text x="88" y="270" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">target_include_directories(PUBLIC include src)</text>
<text x="640" y="650" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">新增 reduce 版本时：把 .cu 加入 reduce_lib → 补一份 test → 在 bench_reduce 中加一项 kernel。</text>
</svg>
