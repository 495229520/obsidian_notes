<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">端到端保护：校验的起止点，比层数更重要</title><desc id="desc">横轴是数据生命周期；条带是保护边界示意，不是耗时或可靠性比例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">端到端保护：校验的起止点，比层数更重要</text>
<text x="48" y="80" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">横轴是数据生命周期；条带是保护边界示意，不是耗时或可靠性比例。</text>
<text x="245" y="125" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="middle">稳定快照</text>
<text x="245" y="147" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">应用依据</text>
<line x1="245" y1="161" x2="245" y2="516" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="365" y="125" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="middle">Host 副本</text>
<text x="365" y="147" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">staging</text>
<line x1="365" y1="161" x2="365" y2="516" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="485" y="125" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="middle">发送 RNIC</text>
<text x="485" y="147" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">取数 / 编包</text>
<line x1="485" y1="161" x2="485" y2="516" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="605" y="125" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="middle">RoCE 网络</text>
<text x="605" y="147" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">多段传输</text>
<line x1="605" y1="161" x2="605" y2="516" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="725" y="125" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="middle">接收 / Target</text>
<text x="725" y="147" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">应用处理</text>
<line x1="725" y1="161" x2="725" y2="516" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="845" y="125" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="middle">NVMe 写入</text>
<text x="845" y="147" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">块与介质</text>
<line x1="845" y1="161" x2="845" y2="516" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="965" y="125" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="middle">保留 / 迁移</text>
<text x="965" y="147" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">时间跨度</text>
<line x1="965" y1="161" x2="965" y2="516" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="1100" y="125" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="middle">恢复使用</text>
<text x="1100" y="147" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">再次验证</text>
<line x1="1100" y1="161" x2="1100" y2="516" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="56" y="194" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">ECC</text>
<text x="56" y="213" font-size="11.5" fill="#6B675C" font-weight="400" text-anchor="start">局部码字</text>
<text x="56" y="261" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">Ethernet FCS</text>
<text x="56" y="280" font-size="11.5" fill="#6B675C" font-weight="400" text-anchor="start">帧边界</text>
<text x="56" y="322" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">RoCE ICRC</text>
<text x="56" y="341" font-size="11.5" fill="#6B675C" font-weight="400" text-anchor="start">传输边界</text>
<text x="56" y="383" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">PCIe</text>
<text x="56" y="402" font-size="11.5" fill="#6B675C" font-weight="400" text-anchor="start">链路 / 事务</text>
<text x="56" y="444" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">NVMe PI</text>
<text x="56" y="463" font-size="11.5" fill="#6B675C" font-weight="400" text-anchor="start">块保护*</text>
<text x="56" y="506" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">应用校验</text>
<text x="56" y="525" font-size="11.5" fill="#6B675C" font-weight="400" text-anchor="start">身份 + 生命周期</text>
<rect x="218" y="175" width="172" height="38" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="304.0" y="199.0" font-size="12.5" fill="#4A3F68" font-weight="600" text-anchor="middle">源端受保护内存</text>
<rect x="690" y="175" width="102" height="38" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="741.0" y="199.0" font-size="12.5" fill="#4A3F68" font-weight="600" text-anchor="middle">目标内存</text>
<rect x="1048" y="175" width="111" height="38" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="1103.5" y="199.0" font-size="12.5" fill="#4A3F68" font-weight="600" text-anchor="middle">恢复内存</text>
<rect x="481" y="242" width="71" height="36" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="516.5" y="265.0" font-size="13" fill="#2C4460" font-weight="600" text-anchor="middle">帧</text>
<rect x="562" y="242" width="71" height="36" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="597.5" y="265.0" font-size="13" fill="#2C4460" font-weight="600" text-anchor="middle">帧</text>
<rect x="643" y="242" width="71" height="36" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="678.5" y="265.0" font-size="13" fill="#2C4460" font-weight="600" text-anchor="middle">帧</text>
<rect x="471" y="303" width="277" height="37" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="609.5" y="326.5" font-size="13" fill="#24473F" font-weight="600" text-anchor="middle">规定头部 + payload + pad</text>
<rect x="358" y="364" width="142" height="37" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="429.0" y="387.5" font-size="12" fill="#6B4E28" font-weight="600" text-anchor="middle">Non-FLIT 示例</text>
<rect x="723" y="364" width="135" height="37" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="790.5" y="387.5" font-size="12" fill="#6B4E28" font-weight="600" text-anchor="middle">LCRC / ECRC</text>
<rect x="727" y="425" width="327" height="37" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="890.5" y="448.5" font-size="12.5" fill="#4A3F68" font-weight="600" text-anchor="middle">数据 + 标签：按配置生成、保留、验证</text>
<rect x="228" y="487" width="895" height="38" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="675.5" y="511.0" font-size="14" fill="#24473F" font-weight="600" text-anchor="middle">稳定表示上的原始摘要 + 对象身份 → 恢复使用前核对</text>
<rect x="48" y="550" width="362" height="66" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="62" y="573" font-size="14" fill="#733428" font-weight="700" text-anchor="start">盲区 ① · 生成之前</text>
<text x="62" y="598" font-size="12.5" fill="#733428" font-weight="400" text-anchor="start">晚生成的校验，不证明更早的数据正确</text>
<rect x="437" y="550" width="362" height="66" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="451" y="573" font-size="14" fill="#733428" font-weight="700" text-anchor="start">盲区 ② · 验证之后</text>
<text x="451" y="598" font-size="12.5" fill="#733428" font-weight="400" text-anchor="start">buffer 复用、重写与长期存留</text>
<rect x="826" y="550" width="366" height="66" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="840" y="573" font-size="14" fill="#733428" font-weight="700" text-anchor="start">盲区 ③ · 对象身份</text>
<text x="840" y="598" font-size="12.5" fill="#733428" font-weight="400" text-anchor="start">合法字节，仍可能是错误 epoch / shard</text>
<text x="48" y="650" font-size="13" fill="#2B2A26" font-weight="500" text-anchor="start">* PI 的实际区间取决于格式与生成/验证位置；PCIe FLIT 模式不能直接套用 Non-FLIT 格式。</text>
</svg>
