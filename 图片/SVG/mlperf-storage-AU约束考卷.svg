<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#F5F4ED"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">MLPerf Storage：不用 GPU 的喂卡考试——计算是睡出来的，IO 是真的</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">考题不是「存储能跑多少 MB/s」，而是「在不饿卡（AU ≥ 阈值）的前提下，最多喂饱多少个模拟加速器」</text>

  <!-- ======== 左:架构 ======== -->
  <text x="70" y="122" font-size="14" font-weight="700" fill="#4A473F">架构（DLIO）：真实 IO 栈 + 模拟计算</text>

  <rect x="70" y="140" width="300" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="220" y="162" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">被测存储系统</text>
  <text x="220" y="182" font-size="10" fill="#2C4460" text-anchor="middle">本地盘阵 / 并行 FS / NAS / 对象存储——随你考谁</text>

  <line x1="220" y1="194" x2="220" y2="220" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="70" y="222" width="300" height="54" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="220" y="244" font-size="12" font-weight="700" fill="#7A5518" text-anchor="middle">真实 DataLoader（PyTorch/TF）</text>
  <text x="220" y="264" font-size="10" fill="#7A5518" text-anchor="middle">真读文件、真反序列化——8.7 的整条流水线都在考</text>

  <line x1="220" y1="276" x2="220" y2="302" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="70" y="304" width="300" height="54" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.8"/>
  <text x="220" y="326" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">模拟加速器：sleep(每 batch 计算时间)</text>
  <text x="220" y="346" font-size="10" fill="#4A3F68" text-anchor="middle">不需要 GPU——计算时间按 A100/H100 实测值回放</text>

  <rect x="70" y="382" width="300" height="66" rx="8" fill="#EFEDE3" stroke="#5A564B" stroke-width="1.2"/>
  <text x="94" y="406" font-size="10.5" font-weight="700" fill="#4A473F">这就是 8.7 §3「第二刀」的标准化：</text>
  <text x="94" y="424" font-size="10" fill="#6B675C">把计算换成确定的合成负载，剩下的时间</text>
  <text x="94" y="440" font-size="10" fill="#6B675C">全归存储 + 主机路径——考卷纯考数据面</text>

  <!-- ======== 中:AU 定义 ======== -->
  <text x="440" y="122" font-size="14" font-weight="700" fill="#4A473F">指标：AU（加速器利用率）</text>

  <text x="456" y="160" font-size="10" fill="#6B675C">时间线</text>
  <rect x="440" y="172" width="150" height="26" rx="3" fill="#E9EFDA" stroke="#48562B" stroke-width="1"/>
  <text x="515" y="189" font-size="9.5" fill="#48562B" text-anchor="middle">计算（sleep）</text>
  <rect x="590" y="172" width="60" height="26" rx="3" fill="#F5E5E0" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="620" y="189" font-size="9.5" fill="#A64B3C" text-anchor="middle">等数据</text>
  <rect x="650" y="172" width="150" height="26" rx="3" fill="#E9EFDA" stroke="#48562B" stroke-width="1"/>
  <text x="725" y="189" font-size="9.5" fill="#48562B" text-anchor="middle">计算</text>
  <rect x="800" y="172" width="30" height="26" rx="3" fill="#F5E5E0" stroke="#A64B3C" stroke-width="1.2"/>

  <rect x="440" y="220" width="390" height="66" rx="8" fill="#EFEDE3" stroke="#5A564B" stroke-width="1.2"/>
  <text x="460" y="246" font-size="12" fill="#4A473F">AU = 计算时间 ÷（计算时间 + 等待时间）</text>
  <text x="460" y="270" font-size="10.5" fill="#6B675C">训练类阈值 90%（CosmoFlow 70%）——低于阈值的成绩无效</text>

  <rect x="440" y="304" width="390" height="144" rx="8" fill="#EFEDE3" stroke="#5A564B" stroke-width="1.2"/>
  <text x="460" y="330" font-size="11.5" font-weight="700" fill="#2B2A26">三张考卷（v1.0 训练类）+ v2.0 新增</text>
  <text x="460" y="354" font-size="10.5" fill="#4A473F">U-Net3D：医学影像,大样本大文件——吞吐型</text>
  <text x="460" y="374" font-size="10.5" fill="#4A473F">ResNet-50：小样本海量——IOPS/元数据型</text>
  <text x="460" y="394" font-size="10.5" fill="#4A473F">CosmoFlow：科学数据,中等样本——混合型</text>
  <text x="460" y="418" font-size="10.5" fill="#7A5518">v2.0（2025）新增 checkpoint 考卷：Llama3 系列</text>
  <text x="460" y="436" font-size="10.5" fill="#7A5518">写入/恢复——8.6 的负载形状进了标准考试</text>

  <!-- ======== 右:扫描曲线 ======== -->
  <text x="900" y="122" font-size="14" font-weight="700" fill="#4A473F">成绩：扫加速器数，找 AU 悬崖</text>

  <!-- 坐标系 -->
  <line x1="900" y1="420" x2="1180" y2="420" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="900" y1="420" x2="900" y2="150" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="1176" y="440" font-size="10" fill="#6B675C" text-anchor="end">模拟加速器数 N</text>
  <text x="892" y="148" font-size="10" fill="#6B675C" text-anchor="end">AU</text>

  <!-- 90% 阈值线 -->
  <line x1="900" y1="200" x2="1180" y2="200" stroke="#A64B3C" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="1176" y="194" font-size="10" fill="#A64B3C" text-anchor="end">90% 阈值</text>

  <!-- 曲线:平台后跌落 -->
  <path d="M 905 172 L 1010 174 L 1060 178 L 1090 186 L 1110 200 L 1130 250 L 1150 330 L 1168 390"
        fill="none" stroke="#2F6B5E" stroke-width="2.2"/>
  <circle cx="1110" cy="200" r="5" fill="#A64B3C"/>
  <line x1="1110" y1="200" x2="1110" y2="420" stroke="#A64B3C" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="1110" y="438" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">N*</text>

  <rect x="880" y="456" width="300" height="60" rx="8" fill="#E9EFDA" stroke="#48562B" stroke-width="1.2"/>
  <text x="900" y="480" font-size="10.5" font-weight="700" fill="#48562B">报告成绩 = N*（最大可喂饱数）</text>
  <text x="900" y="500" font-size="10" fill="#4A473F">及该点的 samples/s 与 MB/s——三个数一起看</text>

  <!-- ======== 底部规则要点 ======== -->
  <rect x="70" y="540" width="1110" height="152" rx="8" fill="#EFEDE3" stroke="#5A564B" stroke-width="1.2"/>
  <text x="96" y="568" font-size="12.5" font-weight="700" fill="#2B2A26">让成绩可比的三条规则（也是自建基准最常缺的三块）：</text>
  <text x="96" y="596" font-size="11" fill="#4A473F">① 数据集尺寸远大于主机内存（规则按主机内存倍数生成合成数据）——考存储而不是考页缓存；自测忘了这条，测出来的是 DRAM</text>
  <text x="96" y="622" font-size="11" fill="#4A473F">② AU 约束在先，吞吐在后——没有 AU 约束的「峰值 MB/s」可以靠牺牲延迟无限堆并发刷出来，对训练毫无意义（Little 定律的另一面）</text>
  <text x="96" y="648" font-size="11" fill="#4A473F">③ 固定负载定义与模拟加速器型号——H100 卷面与 A100 卷面计算时间不同，跨型号的 N* 不可比；closed 分区改负载即无效</text>
  <text x="96" y="676" font-size="10.5" fill="#6B675C">定位：fio（9.1）考盘和协议层，MLPerf Storage 考端到端喂卡路径——采购验收两张卷子都要，谁也替代不了谁</text>
</svg>
