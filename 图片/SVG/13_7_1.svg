<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#4f6f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .subtitle { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .lane-title { font: 700 18px Arial, "Microsoft YaHei", sans-serif; fill: #31465a; }
      .box-title { font: 700 17px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .box-text { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #31465a; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .worker { fill: #fff8e8; stroke: #d49b38; stroke-width: 2; rx: 18; }
      .queue { fill: #f0f6ff; stroke: #2f7ab8; stroke-width: 2; rx: 18; }
      .eventfd { fill: #fff0f0; stroke: #c96b6b; stroke-width: 2; rx: 18; }
      .loop { fill: #edf7ed; stroke: #4f8f55; stroke-width: 2.4; rx: 20; }
      .note { fill: #fffdf5; stroke: #c6b178; stroke-width: 1.5; rx: 14; }
      .line { stroke: #4f6f8f; stroke-width: 2.2; fill: none; marker-end: url(#arrow-hollow); }
      .dash { stroke: #8a98a8; stroke-width: 1.6; stroke-dasharray: 7 7; fill: none; }
    </style>
  </defs>

  <text x="500" y="48" text-anchor="middle" class="title">eventfd：跨线程唤醒 EventLoop</text>
  <text x="500" y="76" text-anchor="middle" class="subtitle">其他线程只投递任务和写 eventfd，连接状态回到所属 EventLoop 线程处理</text>

  <rect x="55" y="112" width="890" height="188" rx="24" fill="#fffaf0" stroke="#e2c891" stroke-width="1.5"/>
  <text x="86" y="145" class="lane-title">worker / main 线程</text>

  <rect x="92" y="175" width="190" height="76" class="worker"/>
  <text x="187" y="205" text-anchor="middle" class="box-title">业务处理完成</text>
  <text x="187" y="229" text-anchor="middle" class="small">生成 functor</text>

  <rect x="380" y="175" width="210" height="76" class="queue"/>
  <text x="485" y="205" text-anchor="middle" class="box-title">pendingFunctors</text>
  <text x="485" y="229" text-anchor="middle" class="small">加锁放入任务队列</text>

  <rect x="698" y="175" width="190" height="76" class="eventfd"/>
  <text x="793" y="205" text-anchor="middle" class="box-title">write(eventfd)</text>
  <text x="793" y="229" text-anchor="middle" class="small">计数器 + 1</text>

  <path d="M 282 213 L 378 213" class="line"/>
  <path d="M 590 213 L 696 213" class="line"/>

  <rect x="55" y="342" width="890" height="206" rx="24" fill="#f4fbf4" stroke="#b8d8b9" stroke-width="1.5"/>
  <text x="86" y="375" class="lane-title">所属 EventLoop 线程</text>

  <rect x="92" y="412" width="190" height="82" class="loop"/>
  <text x="187" y="441" text-anchor="middle" class="box-title">epoll_wait()</text>
  <text x="187" y="466" text-anchor="middle" class="small">阻塞等待 fd 事件</text>

  <rect x="386" y="412" width="200" height="82" class="eventfd"/>
  <text x="486" y="441" text-anchor="middle" class="box-title">eventfd 可读</text>
  <text x="486" y="466" text-anchor="middle" class="small">read 后计数清零</text>

  <rect x="696" y="412" width="200" height="82" class="loop"/>
  <text x="796" y="441" text-anchor="middle" class="box-title">doPendingFunctors()</text>
  <text x="796" y="466" text-anchor="middle" class="small">在 loop 线程执行任务</text>

  <path d="M 793 251 C 793 312 486 318 486 410" class="line"/>
  <path d="M 282 453 L 384 453" class="line"/>
  <path d="M 586 453 L 694 453" class="line"/>

  <path d="M 485 251 C 485 294 786 310 796 410" class="dash"/>
  <text x="648" y="316" text-anchor="middle" class="small">任务数据在队列中，eventfd 只负责唤醒</text>

  <rect x="255" y="548" width="490" height="44" class="note"/>
  <text x="500" y="576" text-anchor="middle" class="small">关键边界：跨线程不直接改连接对象，只把操作投递回连接所属 EventLoop</text>
</svg>
