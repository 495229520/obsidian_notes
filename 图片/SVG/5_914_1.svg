<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="880px" height="520px" viewBox="0 0 880 520" version="1.1">
  <rect x="0" y="0" width="880" height="520" fill="rgb(245, 244, 237)" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#666" />
    </marker>
  </defs>
  <text fill="#222" font-size="22" font-weight="700" font-family="system-ui, sans-serif" x="440" y="34" text-anchor="middle">914. 卡牌分组：频率 gcd 判断</text>
  <text fill="#666" font-size="14" font-family="system-ui, sans-serif" x="440" y="60" text-anchor="middle">把牌面先转成出现次数，再判断这些次数是否有大于等于 2 的共同因数</text>

  <line stroke="#d9d5c9" stroke-width="1" x1="36" y1="84" x2="844" y2="84" />

  <text fill="#246b45" font-size="17" font-weight="700" font-family="system-ui, sans-serif" x="58" y="116">可以分组</text>
  <rect fill="#eef5ef" stroke="#bdd6c3" stroke-width="1.2" x="58" y="134" width="310" height="86" rx="8" />
  <text fill="#333" font-size="14" font-family="system-ui, sans-serif" x="78" y="164">deck = [1,1,2,2,3,3,4,4]</text>
  <text fill="#333" font-size="14" font-family="system-ui, sans-serif" x="78" y="194">出现次数 = 2, 2, 2, 2</text>

  <line stroke="#666" stroke-width="1.5" marker-end="url(#arrow)" x1="385" y1="177" x2="455" y2="177" />
  <rect fill="#e4f2e8" stroke="#78b887" stroke-width="1.4" x="475" y="139" width="170" height="76" rx="8" />
  <text fill="#246b45" font-size="15" font-weight="700" font-family="system-ui, sans-serif" x="560" y="169" text-anchor="middle">gcd = 2</text>
  <text fill="#246b45" font-size="14" font-family="system-ui, sans-serif" x="560" y="194" text-anchor="middle">可选 X = 2</text>

  <line stroke="#666" stroke-width="1.5" marker-end="url(#arrow)" x1="663" y1="177" x2="720" y2="177" />
  <rect fill="#ffffff" stroke="#78b887" stroke-width="1.4" x="740" y="129" width="86" height="96" rx="8" />
  <text fill="#246b45" font-size="15" font-weight="700" font-family="system-ui, sans-serif" x="783" y="160" text-anchor="middle">true</text>
  <text fill="#555" font-size="12" font-family="system-ui, sans-serif" x="783" y="190" text-anchor="middle">每组 2 张</text>

  <line stroke="#d9d5c9" stroke-width="1" stroke-dasharray="6 5" x1="36" y1="260" x2="844" y2="260" />

  <text fill="#b03b2e" font-size="17" font-weight="700" font-family="system-ui, sans-serif" x="58" y="296">不能分组</text>
  <rect fill="#fbefed" stroke="#e6b7b1" stroke-width="1.2" x="58" y="314" width="310" height="86" rx="8" />
  <text fill="#333" font-size="14" font-family="system-ui, sans-serif" x="78" y="344">deck = [1,1,1,2,2,2,3,3]</text>
  <text fill="#333" font-size="14" font-family="system-ui, sans-serif" x="78" y="374">出现次数 = 3, 3, 2</text>

  <line stroke="#666" stroke-width="1.5" marker-end="url(#arrow)" x1="385" y1="357" x2="455" y2="357" />
  <rect fill="#fbe5e2" stroke="#d8887f" stroke-width="1.4" x="475" y="319" width="170" height="76" rx="8" />
  <text fill="#b03b2e" font-size="15" font-weight="700" font-family="system-ui, sans-serif" x="560" y="349" text-anchor="middle">gcd = 1</text>
  <text fill="#b03b2e" font-size="14" font-family="system-ui, sans-serif" x="560" y="374" text-anchor="middle">只能按 1 张分</text>

  <line stroke="#666" stroke-width="1.5" marker-end="url(#arrow)" x1="663" y1="357" x2="720" y2="357" />
  <rect fill="#ffffff" stroke="#d8887f" stroke-width="1.4" x="740" y="309" width="86" height="96" rx="8" />
  <text fill="#b03b2e" font-size="15" font-weight="700" font-family="system-ui, sans-serif" x="783" y="340" text-anchor="middle">false</text>
  <text fill="#555" font-size="12" font-family="system-ui, sans-serif" x="783" y="370" text-anchor="middle">X 必须 >= 2</text>

  <rect fill="#fffdf7" stroke="#d8ceb6" stroke-width="1" x="110" y="444" width="660" height="42" rx="8" />
  <text fill="#333" font-size="15" font-weight="700" font-family="system-ui, sans-serif" x="440" y="470" text-anchor="middle">核心：gcd(所有牌面出现次数) >= 2 才能统一分组</text>
</svg>
