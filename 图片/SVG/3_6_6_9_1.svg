<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 612" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <title>readdir 背后的 getdents64 批量填充</title>
  <desc>opendir 分配的 DIR 内部缓冲在三个时刻的状态：第一次 readdir 触发 getdents64 灌入一批条目，随后几次只在缓冲内移动游标不进内核，缓冲耗尽后新一批覆盖旧内容导致此前保存的指针失效。</desc>

  <rect x="0" y="0" width="1240" height="612" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">readdir 的一次调用，大多不进内核</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">opendir 分配一块用户态缓冲 → 一次 getdents64 灌满一批 → 之后几次 readdir 只是在缓冲里挪游标</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="104" width="1144" height="330" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="15" font-weight="700" fill="#4A473F">A · 同一块 DIR 内部缓冲的三个时刻</text>

  <text x="272" y="160" font-size="10.5" fill="#6B675C">DIR 内部缓冲（glibc 默认 32KB 量级，这里画 4 条变长记录）</text>

  <!-- 帧 1 -->
  <text x="72" y="190" font-size="12.5" font-weight="700" fill="#2B2A26">第 1 次 readdir</text>
  <text x="72" y="208" font-size="10.5" fill="#6B675C">缓冲是空的</text>

  <rect x="272" y="168" width="146" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="418" y="168" width="146" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="564" y="168" width="194" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="758" y="168" width="194" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="345" y="188" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">.</text>
  <text x="491" y="188" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">..</text>
  <text x="661" y="188" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">a_file.txt</text>
  <text x="855" y="188" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">list_dir.c</text>
  <text x="345" y="204" font-size="9.5" fill="#6B675C" text-anchor="middle">d_reclen 24</text>
  <text x="491" y="204" font-size="9.5" fill="#6B675C" text-anchor="middle">d_reclen 24</text>
  <text x="661" y="204" font-size="9.5" fill="#6B675C" text-anchor="middle">d_reclen 32</text>
  <text x="855" y="204" font-size="9.5" fill="#6B675C" text-anchor="middle">d_reclen 32</text>

  <path d="M345 216 L339 226 L351 226 z" fill="#A64B3C"/>
  <text x="360" y="228" font-size="10" fill="#733428">返回 &amp;条目1</text>

  <rect x="976" y="168" width="190" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="992" y="187" font-size="12" font-weight="700" fill="#6B4E28">getdents64</text>
  <text x="992" y="204" font-size="10.5" fill="#6B4E28">一次系统调用拿回 4 条</text>

  <!-- 帧 2 -->
  <text x="72" y="272" font-size="12.5" font-weight="700" fill="#2B2A26">第 2、3、4 次</text>
  <text x="72" y="290" font-size="10.5" fill="#6B675C">缓冲里还有货</text>

  <rect x="272" y="250" width="146" height="44" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <rect x="418" y="250" width="146" height="44" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <rect x="564" y="250" width="194" height="44" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <rect x="758" y="250" width="194" height="44" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="345" y="270" font-size="11.5" fill="#4A473F" text-anchor="middle">.</text>
  <text x="491" y="270" font-size="11.5" fill="#4A473F" text-anchor="middle">..</text>
  <text x="661" y="270" font-size="11.5" fill="#4A473F" text-anchor="middle">a_file.txt</text>
  <text x="855" y="270" font-size="11.5" fill="#4A473F" text-anchor="middle">list_dir.c</text>

  <path d="M345 306 L836 306" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrRed)"/>
  <text x="852" y="310" font-size="10" fill="#733428">游标到第 4 条</text>

  <rect x="976" y="250" width="190" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="992" y="269" font-size="12" font-weight="700" fill="#24473F">0 次系统调用</text>
  <text x="992" y="286" font-size="10.5" fill="#24473F">纯用户态取指针</text>

  <!-- 帧 3 -->
  <text x="72" y="354" font-size="12.5" font-weight="700" fill="#2B2A26">第 5 次 readdir</text>
  <text x="72" y="372" font-size="10.5" fill="#6B675C">缓冲耗尽了</text>

  <rect x="272" y="332" width="146" height="44" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="418" y="332" width="146" height="44" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="564" y="332" width="194" height="44" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="758" y="332" width="194" height="44" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="345" y="352" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">b.log</text>
  <text x="491" y="352" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">sub</text>
  <text x="661" y="352" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">x.o</text>
  <text x="855" y="352" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">y.o</text>

  <path d="M661 380 L655 390 L667 390 z" fill="#A64B3C"/>
  <text x="676" y="392" font-size="10" font-weight="700" fill="#733428">上一轮存下的 &amp;a_file.txt 现在指向 x.o</text>

  <rect x="976" y="332" width="190" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="992" y="351" font-size="12" font-weight="700" fill="#6B4E28">getdents64</text>
  <text x="992" y="368" font-size="10.5" fill="#6B4E28">第 2 批灌进同一块缓冲</text>

  <text x="72" y="418" font-size="11.5" fill="#6B675C">遍历一个上万条目的目录，系统调用次数是「条目数 ÷ 每批条数」，不是「条目数」</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="450" width="1144" height="106" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="478" font-size="15" font-weight="700" fill="#4A473F">B · 这张图直接解释了两条使用限制</text>

  <rect x="72" y="490" width="540" height="52" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="88" y="512" font-size="12.5" font-weight="700" fill="#733428">要留住信息，必须复制出来</text>
  <text x="88" y="532" font-size="11" fill="#733428">存 d_name 的副本，不要存 readdir 返回的指针</text>

  <rect x="652" y="490" width="504" height="52" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="668" y="512" font-size="12.5" font-weight="700" fill="#6B4E28">d_reclen 才是这条记录的长度</text>
  <text x="668" y="532" font-size="11" fill="#6B4E28">记录是变长的，别拿 sizeof(struct dirent) 去算</text>

  <text x="48" y="586" font-size="12" fill="#6B675C">遍历顺序由文件系统决定，既不是字母序也不是创建序；要有序就用 scandir()，或者收齐之后自己排</text>
</svg>
