<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">高精度减法的竖式与借位</title>
  <desc id="desc">以 203 − 18 = 185 为例（保证大数减小数），从个位起逐位相减，t 为负时用 (t+10)%10 得到结果位并向高位借 1。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <style>
      .title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .sub   { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .val   { font: 600 22px "Consolas", "Microsoft YaHei", monospace; fill: #23313f; }
      .op    { font: 600 22px "Consolas", "Microsoft YaHei", monospace; fill: #465564; }
      .borrow{ font: 600 16px "Consolas", "Microsoft YaHei", monospace; fill: #c5612f; }
      .clab  { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5a6876; }
      .fml   { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .eg    { font: 14px "Consolas", "Microsoft YaHei", monospace; fill: #465564; }
      .cellA { fill: #dbe7f5; stroke: #2f6cb0; stroke-width: 1.4; }
      .cellB { fill: #eae6f6; stroke: #6a59c0; stroke-width: 1.4; }
      .cellC { fill: #d8ead8; stroke: #4f9a68; stroke-width: 1.8; }
      .rule  { stroke: #5a6876; stroke-width: 2; }
      .panel { fill: #fbfaf4; stroke: #d9cfbd; stroke-width: 1.4; }
    </style>
  </defs>

  <text x="290" y="40" text-anchor="middle" class="title">高精度减法：203 − 18 = 185</text>
  <text x="290" y="66" text-anchor="middle" class="sub">先比大小保证大减小，t 为负则补 10 并向高位借 1</text>

  <!-- 列标 -->
  <text x="300" y="100" text-anchor="middle" class="clab">百</text>
  <text x="400" y="100" text-anchor="middle" class="clab">十</text>
  <text x="500" y="100" text-anchor="middle" class="clab">个</text>

  <!-- 借位行 -->
  <text x="330" y="128" text-anchor="middle" class="borrow">¹</text>
  <text x="430" y="128" text-anchor="middle" class="borrow">¹</text>
  <text x="180" y="128" text-anchor="start" class="clab" fill="#c5612f">借位 →</text>

  <!-- A 行 -->
  <rect x="260" y="136" width="80" height="54" rx="6" class="cellA"/>
  <rect x="360" y="136" width="80" height="54" rx="6" class="cellA"/>
  <rect x="460" y="136" width="80" height="54" rx="6" class="cellA"/>
  <text x="300" y="163" text-anchor="middle" class="val">2</text>
  <text x="400" y="163" text-anchor="middle" class="val">0</text>
  <text x="500" y="163" text-anchor="middle" class="val">3</text>

  <!-- B 行 -->
  <text x="228" y="227" text-anchor="middle" class="op">−</text>
  <rect x="360" y="208" width="80" height="54" rx="6" class="cellB"/>
  <rect x="460" y="208" width="80" height="54" rx="6" class="cellB"/>
  <text x="400" y="235" text-anchor="middle" class="val">1</text>
  <text x="500" y="235" text-anchor="middle" class="val">8</text>

  <!-- 横线 -->
  <line x1="210" y1="278" x2="552" y2="278" class="rule"/>

  <!-- C 行 -->
  <rect x="260" y="290" width="80" height="54" rx="6" class="cellC"/>
  <rect x="360" y="290" width="80" height="54" rx="6" class="cellC"/>
  <rect x="460" y="290" width="80" height="54" rx="6" class="cellC"/>
  <text x="300" y="317" text-anchor="middle" class="val">1</text>
  <text x="400" y="317" text-anchor="middle" class="val">8</text>
  <text x="500" y="317" text-anchor="middle" class="val">5</text>

  <!-- 公式面板 -->
  <rect x="596" y="88" width="268" height="300" rx="8" class="panel"/>
  <text x="616" y="118" text-anchor="start" class="fml">① t = A[i] − 借位</text>
  <text x="616" y="146" text-anchor="start" class="fml">② 若有 B[i]: t −= B[i]</text>
  <text x="616" y="174" text-anchor="start" class="fml">③ C[i] = (t + 10) % 10</text>
  <text x="616" y="200" text-anchor="start" class="fml">④ 借位 = (t &lt; 0) ? 1 : 0</text>
  <text x="616" y="226" text-anchor="start" class="fml">⑤ 末尾去前导零</text>
  <line x1="616" y1="246" x2="844" y2="246" stroke="#d9cfbd" stroke-width="1.2"/>
  <text x="616" y="272" text-anchor="start" class="eg">个位: 3−8 = −5</text>
  <text x="616" y="296" text-anchor="start" class="eg">　(−5+10)%10 = 5, 借 1</text>
  <text x="616" y="320" text-anchor="start" class="eg">十位: 0−1−1 = −2 → 8, 借 1</text>
  <text x="616" y="344" text-anchor="start" class="eg">百位: 2−1 = 1 → 1</text>
  <text x="616" y="372" text-anchor="start" class="eg">结果 = 185</text>
</svg>
