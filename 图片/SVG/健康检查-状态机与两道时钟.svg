<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="esc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0503F"/>
    </marker>
    <marker id="rec" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="620" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">从漏跳到摘除：健康状态机与两道赌注时钟</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">SUSPECT 与 grace 两级缓冲，把「抖动 / 忙 / 重启」挡在「重建」这条最贵的边之外</text>

  <!-- IN / OUT 分区 -->
  <line x1="60" y1="122" x2="854" y2="122" stroke="#8A8574" stroke-width="1.2"/>
  <line x1="60" y1="117" x2="60" y2="127" stroke="#8A8574" stroke-width="1.2"/>
  <line x1="854" y1="117" x2="854" y2="127" stroke="#8A8574" stroke-width="1.2"/>
  <text x="457" y="112" font-size="11.5" fill="#4A473F" text-anchor="middle">IN：数据仍算在该节点名下 · 副本数不变 · <tspan font-weight="700">不重建</tspan></text>

  <line x1="936" y1="122" x2="1146" y2="122" stroke="#A64B3C" stroke-width="1.2"/>
  <line x1="936" y1="117" x2="936" y2="127" stroke="#A64B3C" stroke-width="1.2"/>
  <line x1="1146" y1="117" x2="1146" y2="127" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1041" y="112" font-size="11.5" fill="#733428" text-anchor="middle">OUT：移出数据布局 → <tspan font-weight="700">触发重建</tspan></text>

  <!-- 状态框 -->
  <rect x="60" y="150" width="210" height="92" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="165" y="182" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle">UP　健康</text>
  <text x="165" y="206" font-size="11" fill="#24473F" text-anchor="middle">心跳按期到达</text>
  <text x="165" y="225" font-size="11" fill="#24473F" text-anchor="middle">对外可读可写</text>

  <rect x="352" y="150" width="210" height="92" rx="8" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.8"/>
  <text x="457" y="182" font-size="15" font-weight="700" fill="#7A5426" text-anchor="middle">SUSPECT　可疑</text>
  <text x="457" y="206" font-size="11" fill="#7A5426" text-anchor="middle">漏跳 / φ 超阈值</text>
  <text x="457" y="225" font-size="11" fill="#7A5426" text-anchor="middle">先别动手，等确认</text>

  <rect x="644" y="150" width="210" height="92" rx="8" fill="#F4E3DE" stroke="#B0503F" stroke-width="1.8"/>
  <text x="749" y="182" font-size="15" font-weight="700" fill="#B0503F" text-anchor="middle">DOWN　判死</text>
  <text x="749" y="206" font-size="11" fill="#733428" text-anchor="middle">多数派 / 间接探测确认</text>
  <text x="749" y="225" font-size="11" fill="#733428" text-anchor="middle">仍 IN：只是不派新活</text>

  <rect x="936" y="150" width="210" height="92" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="2"/>
  <text x="1041" y="182" font-size="15" font-weight="700" fill="#733428" text-anchor="middle">OUT　摘除</text>
  <text x="1041" y="206" font-size="11" fill="#733428" text-anchor="middle">grace 到期仍未归</text>
  <text x="1041" y="225" font-size="11" fill="#733428" text-anchor="middle">重映射 → 重建</text>

  <!-- 前进箭头（升级，红） -->
  <line x1="272" y1="180" x2="350" y2="180" stroke="#B0503F" stroke-width="2" marker-end="url(#esc)"/>
  <text x="311" y="172" font-size="10.5" fill="#B0503F" text-anchor="middle">连续漏跳</text>
  <line x1="564" y1="180" x2="642" y2="180" stroke="#B0503F" stroke-width="2" marker-end="url(#esc)"/>
  <text x="603" y="172" font-size="10.5" fill="#B0503F" text-anchor="middle">确认</text>
  <line x1="856" y1="180" x2="934" y2="180" stroke="#B0503F" stroke-width="2" marker-end="url(#esc)"/>
  <text x="895" y="172" font-size="10.5" fill="#B0503F" text-anchor="middle">grace 到期</text>

  <!-- 回退箭头（恢复，绿，向左） -->
  <line x1="350" y1="214" x2="272" y2="214" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#rec)"/>
  <text x="311" y="231" font-size="10" fill="#24473F" text-anchor="middle">自证清白</text>
  <line x1="642" y1="214" x2="564" y2="214" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#rec)"/>
  <text x="603" y="231" font-size="10" fill="#24473F" text-anchor="middle">grace 内归队</text>

  <!-- 重建 callout -->
  <text x="1041" y="262" font-size="11" font-weight="700" fill="#B0503F" text-anchor="middle">▶ 跨过此边才产生重建流量</text>

  <!-- OUT→UP 回边（最贵） -->
  <path d="M1000,244 C980,322 320,322 202,250" fill="none" stroke="#2F6B5E" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#rec)"/>
  <text x="600" y="281" font-size="10.5" fill="#24473F" text-anchor="middle">重新加入 = 卸载旧布局 + 数据重平衡（最贵的回边，不是免费撤销）</text>

  <!-- 时间线面板 -->
  <rect x="48" y="316" width="1144" height="286" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="72" y="344" font-size="14" font-weight="700" fill="#4A473F">同一次故障的时间线：两段时长各自对冲一种错误</text>
  <text x="72" y="365" font-size="11" fill="#6B675C">心跳是唯一信号 —— 它一停，你只能靠「等多久」来猜它是死了，还是慢了 / 断了 / 暂停了</text>

  <!-- 心跳 lane -->
  <text x="72" y="404" font-size="11" fill="#4A473F">node→monitor</text>
  <text x="72" y="419" font-size="11" fill="#4A473F">心跳</text>
  <rect x="200" y="392" width="5" height="22" fill="#2F6B5E"/>
  <rect x="255" y="392" width="5" height="22" fill="#2F6B5E"/>
  <rect x="310" y="392" width="5" height="22" fill="#2F6B5E"/>
  <rect x="365" y="392" width="5" height="22" fill="#2F6B5E"/>
  <rect x="420" y="392" width="5" height="22" fill="#2F6B5E"/>
  <text x="470" y="408" font-size="11" fill="#B0503F">✕ 心跳消失（死了？还是慢了 / 断了 / 暂停了？）</text>

  <!-- 时间轴 -->
  <line x1="200" y1="486" x2="1150" y2="486" stroke="#5A564B" stroke-width="1.4"/>
  <text x="1158" y="490" font-size="10.5" fill="#6B675C">时间 →</text>

  <!-- 事件竖线 -->
  <line x1="425" y1="430" x2="425" y2="486" stroke="#5A564B" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="425" y="444" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">t₀ 最后心跳</text>
  <line x1="640" y1="430" x2="640" y2="486" stroke="#B0503F" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="640" y="444" font-size="10.5" font-weight="700" fill="#B0503F" text-anchor="middle">判 DOWN</text>
  <line x1="1000" y1="430" x2="1000" y2="486" stroke="#A64B3C" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="1000" y="444" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">判 OUT → 重建启动</text>

  <!-- 区间条 -->
  <rect x="425" y="496" width="215" height="16" fill="#F4E3DE" stroke="#B0503F" stroke-width="0.8"/>
  <text x="532" y="508" font-size="10" fill="#B0503F" text-anchor="middle">T_d 检测 = 不可用窗口</text>
  <rect x="640" y="496" width="360" height="16" fill="#F0E3D3" stroke="#B07A3E" stroke-width="0.8"/>
  <text x="820" y="508" font-size="10" fill="#7A5426" text-anchor="middle">grace（Ceph down_out 默认 ≈ 600s）= 抖动 / 重启缓冲</text>

  <!-- 失败模式 callout -->
  <text x="532" y="538" font-size="10.5" fill="#B0503F" text-anchor="middle">太短 → 把「忙 / GC / 抖动」当成「死」</text>
  <text x="532" y="554" font-size="10.5" fill="#B0503F" text-anchor="middle">→ 误摘除雪崩（见下一图）</text>
  <text x="820" y="538" font-size="10.5" fill="#7A5426" text-anchor="middle">太短 → 重启、瞬断也触发昂贵重建</text>
  <text x="820" y="554" font-size="10.5" fill="#7A5426" text-anchor="middle">太长 → 真故障时不可用窗口被拉长</text>

  <text x="72" y="586" font-size="11" fill="#6B675C">口诀：<tspan font-weight="700" fill="#4A473F">检测要快、定罪要稳、重建要缓</tspan> —— 快靠 T_d，稳靠确认（法定人数 / 间接探测），缓靠 grace</text>
</svg>
