<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
  <rect width="980" height="540" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .cell { fill: #eef6fb; stroke: #6f94b3; stroke-width: 1.4; rx: 5; }
      .hit { fill: #dff0ea; stroke: #45907a; stroke-width: 2; rx: 5; }
      .active { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2; rx: 5; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .note { fill: #edf4f1; stroke: #9db7aa; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">子序列 DP：一维看结尾，二维看前缀</text>
  <text x="40" y="76" class="subtitle">LIS 关注“以谁结尾”；LCS 关注“两个前缀已经匹配到哪里”。</text>

  <rect x="52" y="116" width="404" height="310" class="panel"/>
  <text x="82" y="150" class="label">LIS：dp[i] = 以 nums[i] 结尾</text>
  <text x="82" y="176" class="small">nums = [10, 9, 2, 5, 3, 7]</text>
  <g transform="translate(84,218)">
    <rect x="0" y="0" width="52" height="42" class="cell"/><text x="26" y="26" text-anchor="middle" class="mono">10</text>
    <rect x="62" y="0" width="52" height="42" class="cell"/><text x="88" y="26" text-anchor="middle" class="mono">9</text>
    <rect x="124" y="0" width="52" height="42" class="hit"/><text x="150" y="26" text-anchor="middle" class="mono">2</text>
    <rect x="186" y="0" width="52" height="42" class="hit"/><text x="212" y="26" text-anchor="middle" class="mono">5</text>
    <rect x="248" y="0" width="52" height="42" class="cell"/><text x="274" y="26" text-anchor="middle" class="mono">3</text>
    <rect x="310" y="0" width="52" height="42" class="active"/><text x="336" y="26" text-anchor="middle" class="mono">7</text>
  </g>
  <path d="M 238 286 C 272 330 332 330 408 286" class="arrow"/>
  <text x="100" y="354" class="mono">dp[5] = max(dp[j] + 1)</text>
  <text x="100" y="380" class="small">只从 j &lt; i 且 nums[j] &lt; nums[i] 的位置转移</text>

  <rect x="522" y="116" width="404" height="310" class="panel"/>
  <text x="552" y="150" class="label">LCS：dp[i][j] = 两个前缀</text>
  <text x="552" y="176" class="small">text1 = abcde，text2 = ace</text>
  <g transform="translate(596,212)">
    <text x="-24" y="26" text-anchor="middle" class="mono">a</text>
    <text x="-24" y="76" text-anchor="middle" class="mono">b</text>
    <text x="-24" y="126" text-anchor="middle" class="mono">c</text>
    <text x="26" y="-12" text-anchor="middle" class="mono">a</text>
    <text x="76" y="-12" text-anchor="middle" class="mono">c</text>
    <text x="126" y="-12" text-anchor="middle" class="mono">e</text>
    <rect x="0" y="0" width="44" height="44" class="hit"/><text x="22" y="27" text-anchor="middle" class="mono">1</text>
    <rect x="50" y="0" width="44" height="44" class="cell"/><text x="72" y="27" text-anchor="middle" class="mono">1</text>
    <rect x="100" y="0" width="44" height="44" class="cell"/><text x="122" y="27" text-anchor="middle" class="mono">1</text>
    <rect x="0" y="50" width="44" height="44" class="cell"/><text x="22" y="77" text-anchor="middle" class="mono">1</text>
    <rect x="50" y="50" width="44" height="44" class="cell"/><text x="72" y="77" text-anchor="middle" class="mono">1</text>
    <rect x="100" y="50" width="44" height="44" class="cell"/><text x="122" y="77" text-anchor="middle" class="mono">1</text>
    <rect x="0" y="100" width="44" height="44" class="cell"/><text x="22" y="127" text-anchor="middle" class="mono">1</text>
    <rect x="50" y="100" width="44" height="44" class="active"/><text x="72" y="127" text-anchor="middle" class="mono">2</text>
    <rect x="100" y="100" width="44" height="44" class="cell"/><text x="122" y="127" text-anchor="middle" class="mono">2</text>
  </g>
  <text x="552" y="382" class="mono">字符相同：dp[i][j] = dp[i-1][j-1] + 1</text>
  <text x="552" y="408" class="small">字符不同：从上方或左方取最大值</text>

  <rect x="132" y="468" width="716" height="38" class="note"/>
  <text x="490" y="492" text-anchor="middle" class="small">一维子序列通常问“以当前位置结尾”；双序列通常问“两个前缀的最优关系”。</text>
</svg>
