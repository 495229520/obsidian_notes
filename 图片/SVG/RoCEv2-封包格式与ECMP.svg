<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统:背景 #F5F4ED;标题 22/700 #2B2A26;正文 9.5-13 #6B675C;
       色语义:蓝 #E3EAF4/#3D5A80=网络世界,绿 #DCE9E3/#2F6B5E=RDMA 世界,
       中性 #F0EFE8/#9B968A,警示红 #A05248 -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="620" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">RoCE v2 线上一包:以太网壳 · IP/UDP 皮 · InfiniBand 芯</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">一次 RDMA WRITE 被网卡切成 ≤MTU 的报文;交换机只读外三层,两端网卡只认内三层</text>

  <!-- 上括号:交换机可见范围 -->
  <text x="299" y="150" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">交换机只读这一段:五元组哈希选路 · 拥塞标记打在 ECN 位</text>
  <path d="M48,168 L48,160 L550,160 L550,168" fill="none" stroke="#3D5A80" stroke-width="1.4"/>

  <!-- 报文分段 y=210 h=74 -->
  <rect x="48" y="210" width="146" height="74" rx="4" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="121" y="234" font-size="11" font-weight="700" fill="#2B2A26" text-anchor="middle">以太网头 14B</text>
  <text x="121" y="254" font-size="9.5" fill="#6B675C" text-anchor="middle">MAC · VLAN/PCP</text>
  <text x="121" y="270" font-size="9.5" fill="#6B675C" text-anchor="middle">(PCP=二层优先级)</text>

  <rect x="194" y="210" width="190" height="74" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="289" y="234" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">IP 头 20B</text>
  <text x="289" y="254" font-size="9.5" fill="#2C4460" text-anchor="middle">DSCP · TTL · 校验和</text>
  <text x="289" y="270" font-size="9.5" font-weight="700" fill="#A05248" text-anchor="middle">ECN 2bit:4.7 在这标 CE</text>

  <rect x="384" y="210" width="166" height="74" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="467" y="234" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">UDP 头 8B</text>
  <text x="467" y="254" font-size="9.5" fill="#2C4460" text-anchor="middle">dport=4791 固定</text>
  <text x="467" y="270" font-size="9.5" fill="#2C4460" text-anchor="middle">sport=流熵 → ECMP 选路</text>

  <rect x="550" y="210" width="194" height="74" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="647" y="234" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">IB 基本传输头 BTH 12B</text>
  <text x="647" y="254" font-size="9.5" fill="#24473F" text-anchor="middle">opcode · DestQP · PSN</text>
  <text x="647" y="270" font-size="9.5" fill="#24473F" text-anchor="middle">网卡按 PSN 保序/重传</text>

  <rect x="744" y="210" width="168" height="74" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="828" y="234" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">RETH 16B(仅单边)</text>
  <text x="828" y="254" font-size="9.5" fill="#24473F" text-anchor="middle">远端 VA · rkey · 长度</text>
  <text x="828" y="270" font-size="9.5" fill="#24473F" text-anchor="middle">4.5 的"钥匙"在此上线</text>

  <rect x="912" y="210" width="174" height="74" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="999" y="234" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">Payload</text>
  <text x="999" y="254" font-size="9.5" fill="#24473F" text-anchor="middle">≤ 路径 MTU(两端取小)</text>

  <rect x="1086" y="210" width="48" height="74" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1110" y="238" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">ICRC</text>
  <text x="1110" y="256" font-size="9" fill="#24473F" text-anchor="middle">4B</text>

  <rect x="1134" y="210" width="46" height="74" rx="4" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1157" y="238" font-size="10" font-weight="700" fill="#2B2A26" text-anchor="middle">FCS</text>
  <text x="1157" y="256" font-size="9" fill="#6B675C" text-anchor="middle">4B</text>

  <!-- 下括号:网卡可见范围 -->
  <path d="M550,296 L550,304 L1134,304 L1134,296" fill="none" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="842" y="326" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">RDMA 网卡只认这一段:DestQP 找上下文 · PSN 保序 · rkey 查地址翻译 · ICRC 端到端校验</text>

  <!-- 机制注解三卡 -->
  <line x1="170" y1="352" x2="280" y2="290" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="48" y="356" width="356" height="92" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="64" y="380" font-size="12" font-weight="700" fill="#2B2A26">拥塞信号搭数据便车</text>
  <text x="64" y="402" font-size="10.5" fill="#6B675C">交换机队列过阈值 → 把路过的包 ECN 位改成 CE;</text>
  <text x="64" y="420" font-size="10.5" fill="#6B675C">信号先到接收端、再折返发送端 → 反馈晚一个 RTT</text>
  <text x="64" y="438" font-size="10.5" fill="#6B675C">(所以 4.7 的标记阈值必须给反馈延迟留余量)</text>

  <line x1="560" y1="352" x2="490" y2="290" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="420" y="356" width="356" height="92" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="436" y="380" font-size="12" font-weight="700" fill="#2B2A26">保序从哪来【事实】</text>
  <text x="436" y="402" font-size="10.5" fill="#6B675C">一个 QP 的五元组固定 → ECMP 全程走同一条路;</text>
  <text x="436" y="420" font-size="10.5" fill="#6B675C">硬件传输层按 PSN 严格收包:乱序不是"重排一下",</text>
  <text x="436" y="438" font-size="10.5" fill="#6B675C">而是 NAK + go-back-N 重传 —— 换路抖动即掉速</text>

  <rect x="792" y="356" width="388" height="92" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="808" y="380" font-size="12" font-weight="700" fill="#2B2A26">v1 与 v2 的唯一差别【事实】</text>
  <text x="808" y="402" font-size="10.5" fill="#6B675C">v1:Eth(EtherType 0x8915) + GRH,没有 IP/UDP 皮,</text>
  <text x="808" y="420" font-size="10.5" fill="#6B675C">出不了二层域,基本被 v2 取代;</text>
  <text x="808" y="438" font-size="10.5" fill="#6B675C">v2 换上 UDP/IP 皮 → 可路由、可 ECMP、可三层组网</text>

  <!-- 自证 -->
  <rect x="48" y="472" width="1132" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="64" y="496" font-size="11" fill="#2C4460">抓包与自证【实践】:tcpdump -i eth0 'udp port 4791' 只见 v2 报文(payload 即 IB 报文);</text>
  <text x="64" y="516" font-size="11" fill="#2C4460">ibv_devinfo 看 link_layer=Ethernet;show_gids 看每个 gid_index 的 v1/v2 与对应 IP —— 三处互相印证</text>

  <text x="48" y="572" font-size="11.5" font-weight="700" fill="#24473F">一句话:交换机按 IP 世界的规则转发它,两端网卡按 IB 世界的规则要求它不丢、不乱 —— 两个世界的落差,由 4.7 的无损工程来填。</text>
</svg>
