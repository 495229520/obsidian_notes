<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #435363; }
      .tag { font-size: 13px; font-weight: 700; fill: #334155; }
    </style>
  </defs>
  <text x="56" y="55" class="title">Week 12: Tensor Core + Mixed Precision GEMM</text>
  <text x="56" y="84" class="subtitle">从 FP32 comparison 扩展到 dtype / compute / tolerance / Tensor Core evidence</text>

  <rect x="72" y="138" width="230" height="220" rx="8" fill="#e8f0f6" stroke="#86a8c4" stroke-width="2"/>
  <text x="102" y="176" class="head">已有 FP32 主线</text>
  <text x="102" y="216" class="body">• CUDA kernels</text>
  <text x="102" y="244" class="body">• Triton v1</text>
  <text x="102" y="272" class="body">• CUTLASS profiler</text>
  <text x="102" y="300" class="body">• cuBLAS SGEMM</text>

  <rect x="438" y="118" width="250" height="258" rx="8" fill="#f4ead7" stroke="#c6a661" stroke-width="2"/>
  <text x="468" y="156" class="head">Week 12 新增字段</text>
  <text x="468" y="196" class="body">• input / output dtype</text>
  <text x="468" y="224" class="body">• compute / accumulate</text>
  <text x="468" y="252" class="body">• reference dtype</text>
  <text x="468" y="280" class="body">• tolerance</text>
  <text x="468" y="308" class="body">• Tensor Core evidence</text>

  <rect x="824" y="138" width="224" height="220" rx="8" fill="#e7efe3" stroke="#84a96d" stroke-width="2"/>
  <text x="854" y="176" class="head">统一输出</text>
  <text x="854" y="216" class="body">• mixed precision table</text>
  <text x="854" y="244" class="body">• autotune log</text>
  <text x="854" y="272" class="body">• limitations</text>
  <text x="854" y="300" class="body">• Week 13/14 ready</text>

  <line x1="316" y1="248" x2="422" y2="248" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="702" y1="248" x2="808" y2="248" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="154" y="420" width="812" height="52" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="210" y="452" class="tag">原则：</text>
  <text x="264" y="452" class="body">mixed precision 的性能数字必须带着 dtype 口径和 correctness 口径一起出现。</text>
</svg>
