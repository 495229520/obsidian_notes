<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="1240" height="700" fill="rgb(245, 244, 237)"/>
  <title>AI Compiler 学习主线：从 IR 到自己的张量编译器</title>
  <desc>五个连续阶段：读懂 IR 与张量，写 C++ Pass，定义 MiniNN，跑通 CPU，做一次优化。第四阶段形成项目第一版，主线完成后再深化 NPU。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5A564B"/></marker>
  </defs>
  <text x="48" y="48" font-size="24" font-weight="700" fill="#2B2A26">AI Compiler：一条主线，一个持续扩展的项目</text>
  <text x="48" y="80" font-size="16" fill="#6B675C">目标：MatMul → Add → ReLU，从自己的算子定义到 CPU 正确执行，再做一次优化</text>
  <rect x="928" y="25" width="264" height="32" rx="16" fill="#EFE7DA" stroke="#8A6A3A"/>
  <text x="1060" y="47" font-size="15" text-anchor="middle" fill="#6B4E28">从第 1 阶段的剩余检查继续</text>
  <text x="122" y="122" font-size="14" font-weight="700" fill="#6B675C">阶段</text>
  <text x="390" y="122" font-size="14" font-weight="700" fill="#6B675C">这一阶段只学这些</text>
  <text x="810" y="122" font-size="14" font-weight="700" fill="#6B675C">留下结果，再进入下一阶段</text>

  <path d="M76 184V224 M76 270V310 M76 356V396 M76 442V482" fill="none" stroke="#5A564B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="108" y="140" width="1084" height="70" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <circle cx="76" cy="175" r="20" fill="#3D5A80"/>
  <text x="76" y="182" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="126" y="169" font-size="19" font-weight="700" fill="#2C4460">读懂 IR 与张量</text>
  <text x="126" y="195" font-size="14" fill="#2C4460">目前的起点</text>
  <text x="390" y="169" font-size="16" fill="#2B2A26">AST / SSA / MLIR 结构</text>
  <text x="390" y="195" font-size="15" fill="#4A473F">矩阵乘法、shape / stride、误差</text>
  <text x="810" y="169" font-size="16" font-weight="700" fill="#2C4460">一段注释 IR ＋ 数值参考</text>
  <text x="810" y="195" font-size="14" fill="#4A473F">解释值的来源，手算与程序结果一致</text>

  <rect x="108" y="226" width="1084" height="70" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <circle cx="76" cy="261" r="20" fill="#3D5A80"/>
  <text x="76" y="268" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="126" y="255" font-size="19" font-weight="700" fill="#2B2A26">写第一个 C++ Pass</text>
  <text x="126" y="281" font-size="14" fill="#6B675C">近期里程碑</text>
  <text x="390" y="255" font-size="16" fill="#2B2A26">固定环境、模式匹配与替换</text>
  <text x="390" y="281" font-size="15" fill="#4A473F">standalone / PatternRewriter / 测试</text>
  <text x="810" y="255" font-size="16" font-weight="700" fill="#2C4460">自己的整数加零消除规则</text>
  <text x="810" y="281" font-size="14" fill="#4A473F">正例、反例、重复运行与命中证据</text>

  <rect x="108" y="312" width="1084" height="70" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <circle cx="76" cy="347" r="20" fill="#3D5A80"/>
  <text x="76" y="354" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="126" y="341" font-size="19" font-weight="700" fill="#2B2A26">定义 MiniNN 算子</text>
  <text x="126" y="367" font-size="14" fill="#6B675C">表示与检查</text>
  <text x="390" y="341" font-size="16" fill="#2B2A26">Dialect / ODS / Verifier</text>
  <text x="390" y="367" font-size="15" fill="#4A473F">静态二维 FP32，Add 同形状</text>
  <text x="810" y="341" font-size="16" font-weight="700" fill="#2C4460">四类操作 ＋ 合法与非法输入测试</text>
  <text x="810" y="367" font-size="14" fill="#4A473F">能解析、打印，并拒绝不支持的输入</text>

  <rect x="108" y="398" width="1084" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <circle cx="76" cy="433" r="20" fill="#2F6B5E"/>
  <text x="76" y="440" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="126" y="427" font-size="19" font-weight="700" fill="#24473F">跑通 CPU 执行</text>
  <text x="126" y="453" font-size="14" font-weight="700" fill="#24473F">项目第一版完成</text>
  <text x="390" y="427" font-size="16" fill="#2B2A26">Lowering / Bufferization / LLVM</text>
  <text x="390" y="453" font-size="15" fill="#4A473F">算子转换、累加初始化、分配与释放</text>
  <text x="810" y="427" font-size="16" font-weight="700" fill="#24473F">ReLU(AB+C) 在 CPU 上算对</text>
  <text x="810" y="453" font-size="14" fill="#4A473F">独立数值对照 ＋ 完整复现步骤</text>

  <rect x="108" y="484" width="1084" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <circle cx="76" cy="519" r="20" fill="#2F6B5E"/>
  <text x="76" y="526" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="126" y="513" font-size="19" font-weight="700" fill="#24473F">完成一次优化</text>
  <text x="126" y="539" font-size="14" font-weight="700" fill="#24473F">主线完成</text>
  <text x="390" y="513" font-size="16" fill="#2B2A26">先 MatMul 分块，再按需融合</text>
  <text x="390" y="539" font-size="15" fill="#4A473F">尾块、合法性、基线与重复测量</text>
  <text x="810" y="513" font-size="16" font-weight="700" fill="#24473F">优化前后对照 ＋ 一次真实问题修复</text>
  <text x="810" y="539" font-size="14" fill="#4A473F">说清收益或无收益，别人能够复现</text>

  <path d="M76 542V606H108" fill="none" stroke="#8A6A3A" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <rect x="116" y="585" width="1076" height="44" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="138" y="613" font-size="16" fill="#6B4E28">后续深化：张量生命周期 → 教学片上内存规划 → 工业 NPU 修改 → 匹配设备验证</text>
  <text x="48" y="668" font-size="15" fill="#6B675C">每日计划继续管时间；这张图管先后顺序。阶段是否通过，只看自己的解释、代码与测试。</text>
</svg>
