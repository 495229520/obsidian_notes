<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>NVMe-oF：命令由线程推进，数据由 DMA 搬运</title><desc>上半层次结构区分 Host、Fabric、Target 与 SSD；下半以方向箭头展示共享 Target 缓冲及两次 DMA。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs><rect width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="47" font-size="22" fill="#2B2A26" font-weight="700">NVMe-oF：命令由线程推进，数据由 DMA 搬运</text>
<text x="48" y="77" font-size="14" fill="#6B675C">基线：Linux 或 SPDK Host → RoCE → SPDK Target → 普通 PCIe NVMe bdev</text>
<text x="48" y="111" font-size="15" fill="#2B2A26" font-weight="700">A · 控制与执行：两种 Host 入口，汇合到同一条远端路径</text>
<rect x="48" y="130" width="236" height="204" rx="7" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<text x="64" y="155" font-size="15" fill="#2B2A26" font-weight="700">Host</text>
<rect x="316" y="130" width="180" height="204" rx="7" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<text x="332" y="155" font-size="15" fill="#2B2A26" font-weight="700">RoCE Fabric</text>
<rect x="528" y="130" width="412" height="204" rx="7" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<text x="544" y="155" font-size="15" fill="#2B2A26" font-weight="700">SPDK Target</text>
<rect x="972" y="130" width="220" height="204" rx="7" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<text x="988" y="155" font-size="15" fill="#2B2A26" font-weight="700">NVMe SSD</text>
<rect x="64" y="174" width="204" height="57" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="166.0" y="198" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Linux initiator</text>
<text x="166.0" y="219" font-size="12.5" fill="#2C4460" text-anchor="middle">io_uring → blk-mq</text>
<rect x="64" y="251" width="204" height="57" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="166.0" y="275" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">SPDK initiator</text>
<text x="166.0" y="296" font-size="12.5" fill="#2C4460" text-anchor="middle">用户态 NVMe 库</text>
<text x="406" y="198" font-size="14" fill="#2B2A26" text-anchor="middle">RNIC → Switch</text>
<text x="406" y="221" font-size="14" fill="#2B2A26" text-anchor="middle">→ RNIC</text>
<text x="406" y="267" font-size="13" fill="#2B2A26" text-anchor="middle">QP / 收发资源</text>
<text x="406" y="292" font-size="13" fill="#2B2A26" text-anchor="middle">ECMP / 队列</text>
<path d="M285,232 L309,232" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M497,232 L521,232" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M941,232 L965,232" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="548" y="184" font-size="15" fill="#2B2A26" font-weight="700">Reactor → spdk_thread</text>
<rect x="548" y="199" width="175" height="55" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="635.5" y="223" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">poll group</text>
<text x="635.5" y="244" font-size="12.5" fill="#24473F" text-anchor="middle">RDMA CQ / 状态机</text>
<rect x="745" y="199" width="175" height="55" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="832.5" y="223" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">bdev channel</text>
<text x="832.5" y="244" font-size="12.5" fill="#24473F" text-anchor="middle">模块 / 后端上下文</text>
<line x1="724" y1="227" x2="739" y2="227" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="624" y="274" width="223" height="40" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="735.5" y="299.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">SPDK NVMe 驱动</text>
<path d="M830,255 L830,267" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1082" y="199" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="middle">后端 SQ / CQ</text>
<text x="1082" y="229" font-size="14" fill="#2B2A26" text-anchor="middle">Doorbell / DMA</text>
<text x="1082" y="274" font-size="14" fill="#2B2A26" text-anchor="middle">控制器 / 缓存</text>
<text x="1082" y="302" font-size="14" fill="#2B2A26" text-anchor="middle">介质处理</text>
<text x="48" y="372" font-size="15" fill="#2B2A26" font-weight="700">B · Payload：Target 内存是接力点，不是 RNIC 直写 NAND</text>
<rect x="48" y="398" width="238" height="91" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="167.0" y="422" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Host buffer</text>
<text x="167.0" y="443" font-size="12.5" fill="#2C4460" text-anchor="middle">MR / key / 有效映射</text>
<rect x="449" y="398" width="374" height="91" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="636.0" y="422" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Target buffer</text>
<text x="636.0" y="443" font-size="12.5" fill="#24473F" text-anchor="middle">先后交给 RNIC 与 SSD 使用</text>
<rect x="990" y="398" width="202" height="91" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1091.0" y="422" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">SSD 控制器</text>
<text x="1091.0" y="443" font-size="12.5" fill="#6B4E28" text-anchor="middle">PCIe DMA</text>
<line x1="292" y1="430" x2="441" y2="430" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="367" y="420" font-size="12.5" fill="#2B2A26" text-anchor="middle">写：RDMA READ</text>
<line x1="441" y1="470" x2="292" y2="470" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="367" y="460" font-size="12.5" fill="#2B2A26" text-anchor="middle">读：RDMA WRITE</text>
<line x1="830" y1="430" x2="982" y2="430" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="906" y="420" font-size="12.5" fill="#2B2A26" text-anchor="middle">写：SSD 读内存</text>
<line x1="982" y1="470" x2="830" y2="470" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="906" y="460" font-size="12.5" fill="#2B2A26" text-anchor="middle">读：SSD 写内存</text>
<text x="48" y="526" font-size="15" fill="#2B2A26" font-weight="700">C · 释放条件：完成属于谁，就按谁的生命周期判断</text>
<rect x="48" y="546" width="350" height="70" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="223.0" y="570" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">Host 缓冲</text>
<text x="223.0" y="591" font-size="12.5" fill="#2C4460" text-anchor="middle">协议完成 / 错误路径收束</text>
<rect x="420" y="546" width="378" height="70" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="609.0" y="570" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Target 缓冲</text>
<text x="609.0" y="591" font-size="12.5" fill="#24473F" text-anchor="middle">后端 DMA 与数据 WR 都结束</text>
<rect x="820" y="546" width="372" height="70" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1006.0" y="570" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">Target request</text>
<text x="1006.0" y="591" font-size="12.5" fill="#6B4E28" text-anchor="middle">响应发送与实现回收条件满足</text>
<line x1="48" y1="646" x2="1192" y2="646" stroke="#5A564B" stroke-width="1.6"/>
<text x="48" y="674" font-size="13" fill="#6B675C">零拷贝 ≠ 无内存流量；前端 QP ≠ 后端 NVMe qpair；SPDK PCIe 后端不经过普通 blk-mq。</text>
</svg>