<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">局部校验全通过，为什么恢复仍然可能错？</title><desc id="desc">三个反例：生成前的错误、验证后的覆盖、完整但身份错误的对象。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">局部校验全通过，为什么恢复仍然可能错？</text>
<text x="48" y="80" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">三个反例：生成前的错误、验证后的覆盖、完整但身份错误的对象。</text>
<rect x="48" y="114" width="1144" height="133" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="70" y="148" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start">① 生成前错</text>
<text x="70" y="175" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">错误先于局部校验</text>
<rect x="48" y="263" width="1144" height="133" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="70" y="297" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start">② 验证后错</text>
<text x="70" y="324" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">生命周期没有结束</text>
<rect x="48" y="412" width="1144" height="133" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="70" y="446" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start">③ 身份不对</text>
<text x="70" y="473" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">内容本身完全合法</text>
<rect x="257" y="132" width="194" height="58" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="354.0" y="158.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">D0 → D1</text>
<text x="354.0" y="180.0" font-size="12.5" fill="#733428" font-weight="400" text-anchor="middle">先发生错误写入</text>
<rect x="552" y="132" width="194" height="58" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="649.0" y="158.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">CRC(D1)</text>
<text x="649.0" y="180.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle">局部校验随后生成</text>
<rect x="852" y="132" width="285" height="58" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="994.5" y="158.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">D1 + CRC(D1)</text>
<text x="994.5" y="180.0" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle">传输检查可以通过</text>
<line x1="455" y1="160" x2="546" y2="160" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="750" y1="160" x2="846" y2="160" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="258" y="221" font-size="13" fill="#733428" font-weight="400" text-anchor="start">保留 H(D0)：可检出变化；首次只算 H(D1)：错误已在边界之外。</text>
<rect x="257" y="281" width="194" height="58" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="354.0" y="307.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">接收验证通过</text>
<text x="354.0" y="329.0" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle">只证明当时的字节</text>
<rect x="552" y="281" width="194" height="58" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="649.0" y="307.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">buffer 提前复用</text>
<text x="649.0" y="329.0" font-size="12.5" fill="#733428" font-weight="400" text-anchor="middle">另一请求覆盖内容</text>
<rect x="852" y="281" width="285" height="58" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="994.5" y="307.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">异步 I/O 仍在取数</text>
<text x="994.5" y="329.0" font-size="12.5" fill="#6B4E28" font-weight="400" text-anchor="middle">网络检查不会回头重做</text>
<line x1="455" y1="309" x2="546" y2="309" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="750" y1="309" x2="846" y2="309" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="258" y="370" font-size="13" fill="#733428" font-weight="400" text-anchor="start">释放条件必须等待所有相关消费者；Hash 完成，不等于 I/O 已经读完 buffer。</text>
<rect x="257" y="430" width="194" height="58" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="354.0" y="456.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">合法 shard 7</text>
<text x="354.0" y="478.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle">内容 + 合法摘要</text>
<rect x="552" y="430" width="194" height="58" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="649.0" y="456.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">裸摘要验证成功</text>
<text x="649.0" y="478.0" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle">对象内部自洽</text>
<rect x="852" y="430" width="285" height="58" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="994.5" y="456.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">本次需要 shard 8</text>
<text x="994.5" y="478.0" font-size="12.5" fill="#733428" font-weight="400" text-anchor="middle">独立身份检查应拒绝</text>
<line x1="455" y1="458" x2="546" y2="458" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="750" y1="458" x2="846" y2="458" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="258" y="519" font-size="13" fill="#733428" font-weight="400" text-anchor="start">期望身份必须来自恢复请求 / 受信 manifest，不能从被检查对象直接照抄。</text>
<rect x="48" y="567" width="1144" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="620" y="593" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle">每段都为当前字节重算校验，不等于保存了原始正确性依据。</text>
<text x="620" y="616" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">应用协议必须保留可信依据，并把内容与版本、位置及完整集合绑定。</text>
<text x="48" y="650" font-size="13" fill="#2B2A26" font-weight="500" text-anchor="start">图为工程反例，不假设具体设备必然发生上述错误，也不把 Hash 相等写成数学上绝对相同。</text>
</svg>
