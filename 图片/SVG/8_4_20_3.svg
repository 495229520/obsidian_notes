<text x="64" y="362" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">3 × 400G</text>
<rect x="310" y="326" width="300" height="40" rx="3" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<line x1="410.0" y1="328" x2="410.0" y2="364" stroke="#A64B3C" stroke-width="0.8" stroke-linecap="round" opacity="1"/>
