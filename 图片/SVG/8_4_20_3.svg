<text x="360.0" y="268" font-size="12" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">400G</text>
<text x="460.0" y="268" font-size="12" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">400G</text>
