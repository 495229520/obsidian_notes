<line x1="1085.0" y1="160" x2="1085.0" y2="196" stroke="#3D5A80" stroke-width="0.8" stroke-linecap="round" opacity="1"/>
<text x="1123" y="184" font-size="13" fill="#3D5A80" text-anchor="start" font-weight="700" data-role="body">3.2 Tb/s</text>
<text x="64" y="255" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">正常上联</text>
<text x="64" y="278" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">4 × 400G</text>
<rect x="310" y="242" width="400" height="40" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<line x1="410.0" y1="244" x2="410.0" y2="280" stroke="#2F6B5E" stroke-width="0.8" stroke-linecap="round" opacity="1"/>
