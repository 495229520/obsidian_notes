<text x="360.0" y="352" font-size="12" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">400G</text>
<text x="460.0" y="352" font-size="12" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">400G</text>
<text x="560.0" y="352" font-size="12" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">400G</text>
<rect x="610" y="326" width="100" height="40" rx="3" fill="none" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="660" y="352" font-size="12" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">失效</text>
<rect x="714" y="319" width="435" height="57" rx="0" fill="#FBFBF6" stroke="#FBFBF6" stroke-width="0"/>
<text x="733" y="352" font-size="14" fill="#A64B3C" text-anchor="start" font-weight="700" data-role="body">1.2 Tb/s · 2.67:1</text>
<text x="310" y="399" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">1:1 的正常配置失去容量后，也可能变成超售。</text>
<rect x="40" y="439" width="1160" height="188" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="470" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">另一种瓶颈：8 路汇聚到一个 100G 出口</text>
<rect x="68" y="490" width="164" height="29" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="150.0" y="509.5" font-size="12" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">100G 输入</text>
<line x1="237" y1="504.5" x2="426" y2="549" stroke="#3D5A80" stroke-width="1.6" stroke-linecap="round" opacity="1" marker-end="url(#arr-blue)"/>
<rect x="68" y="531" width="164" height="29" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="150.0" y="550.5" font-size="12" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">100G 输入</text>
<line x1="237" y1="545.5" x2="426" y2="549" stroke="#3D5A80" stroke-width="1.6" stroke-linecap="round" opacity="1" marker-end="url(#arr-blue)"/>
<rect x="68" y="572" width="164" height="29" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="150.0" y="591.5" font-size="12" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">100G 输入</text>
<line x1="237" y1="586.5" x2="426" y2="549" stroke="#3D5A80" stroke-width="1.6" stroke-linecap="round" opacity="1" marker-end="url(#arr-blue)"/>
<text x="253" y="501" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">共 8 路</text>
<rect x="436" y="526" width="170" height="48" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="521.0" y="555.0" font-size="13" fill="#8A6A3A" text-anchor="middle" font-weight="700" data-role="body">目的出口队列</text>
<line x1="612" y1="550" x2="695" y2="550" stroke="#8A6A3A" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr-amber)"/>
<rect x="706" y="526" width="178" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="795.0" y="555.0" font-size="13" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">100G 目的端口</text>
<text x="925" y="519" font-size="14" fill="#A64B3C" text-anchor="start" font-weight="700" data-role="body">净积压 700 Gb/s</text>
<text x="925" y="551" font-size="16" fill="#A64B3C" text-anchor="start" font-weight="700" data-role="body">2 μs → 175 kB</text>
<text x="925" y="584" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">流体近似；非实测</text>
<text x="48" y="658" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">增加中间路径不能绕过共同的目的出口；缓冲只延迟过载后果。</text>
</svg>