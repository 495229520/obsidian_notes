<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1010" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统：底色 rgb(245,244,237)；面板 #FAF9F2/#8A8574；结构框 #E3EAF4/#3D5A80/#2C4460；
       专色 #EFE7D6/#8A6D3B；优点 #E2EFE9/#2F6B5E；代价/水位 #F4E3DE/#B0503F -->
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0503F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1010" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">Compaction：每层几份 run 决定流派，欠账与水位线决定生死</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">leveled「每次整理到位」压读/空间放大，tiered「攒一堆再大扫除」压写放大；调度是一条与前台抢盘的有界流水线</text>

  <!-- ═══ 左：leveled ═══ -->
  <rect x="48" y="104" width="556" height="376" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="72" y="132" font-size="14" font-weight="700" fill="#4A473F">leveled：每层 1 份全局有序 run</text>

  <rect x="200" y="150" width="120" height="36" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="260" y="173" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">下沉的文件</text>
  <path d="M260,186 L260,222" fill="none" stroke="#B0503F" stroke-width="2" marker-end="url(#arrr)"/>
  <text x="276" y="210" font-size="10.5" fill="#B0503F">必须与目标层重叠部分一起重写</text>

  <rect x="100" y="226" width="420" height="40" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <rect x="180" y="226" width="170" height="40" rx="6" fill="#F4E3DE" stroke="#B0503F" stroke-width="1.5"/>
  <text x="265" y="251" font-size="10.5" font-weight="700" fill="#B0503F" text-anchor="middle">重叠区：~T 倍体量陪写</text>
  <text x="450" y="251" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">Ln：1 份有序</text>

  <rect x="100" y="290" width="420" height="40" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="310" y="315" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">Ln+1：仍是 1 份有序 —— 读一层只探 1 个文件</text>

  <rect x="76" y="352" width="500" height="104" rx="8" fill="#F3F1E8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="96" y="378" font-size="11" font-weight="700" fill="#B0503F">写放大 高：每下沉一层重写 ~T 遍，WA ≈ T × 层数</text>
  <text x="96" y="404" font-size="11" font-weight="700" fill="#2F6B5E">读放大 低：每层最多 1 个文件</text>
  <text x="96" y="430" font-size="11" font-weight="700" fill="#2F6B5E">空间放大 低：~1 ＋ 1/T，旧版本存活短</text>
  <text x="96" y="450" font-size="10" fill="#6B675C">适合：读多、点查延迟敏感、空间紧</text>

  <!-- ═══ 右：tiered ═══ -->
  <rect x="636" y="104" width="556" height="376" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="660" y="132" font-size="14" font-weight="700" fill="#4A473F">tiered：每层攒 K 份 run 再整体合并</text>

  <rect x="688" y="150" width="400" height="26" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="688" y="182" width="400" height="26" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="688" y="214" width="400" height="26" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="688" y="246" width="400" height="26" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="888" y="167" font-size="10.5" fill="#2C4460" text-anchor="middle">Ln run #1（有序）</text>
  <text x="888" y="199" font-size="10.5" fill="#2C4460" text-anchor="middle">Ln run #2 —— 读这一层要探 K 份</text>
  <text x="888" y="231" font-size="10.5" fill="#2C4460" text-anchor="middle">Ln run #3（同 key 旧版本长期并存）</text>
  <text x="888" y="263" font-size="10.5" fill="#2C4460" text-anchor="middle">Ln run #4 ← 攒满 K＝4 触发合并</text>

  <path d="M888,276 L888,306" fill="none" stroke="#5A564B" stroke-width="2" marker-end="url(#arrn)"/>
  <text x="902" y="296" font-size="10.5" fill="#6B675C">K 份归并成 1 份写入下层，不碰下层已有 run</text>

  <rect x="688" y="310" width="400" height="26" rx="5" fill="#E2EFE9" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="888" y="327" font-size="10.5" font-weight="700" fill="#2F6B5E" text-anchor="middle">Ln+1 新增 1 份 run —— 每字节每层只写一次</text>

  <rect x="664" y="352" width="500" height="104" rx="8" fill="#F3F1E8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="684" y="378" font-size="11" font-weight="700" fill="#2F6B5E">写放大 低：WA ≈ 层数</text>
  <text x="684" y="404" font-size="11" font-weight="700" fill="#B0503F">读放大 高：每层探 K 份 run（bloom 只救点查）</text>
  <text x="684" y="430" font-size="11" font-weight="700" fill="#B0503F">空间放大 高：可达 ~2x，合并瞬间还要双份空间</text>
  <text x="684" y="450" font-size="10" fill="#6B675C">适合：写重摄取型（日志/时序/批量导入）</text>

  <!-- ═══ 杂交带 ═══ -->
  <rect x="48" y="500" width="1144" height="76" rx="10" fill="#EFE7D6" stroke="#8A6D3B" stroke-width="1.5"/>
  <text x="620" y="528" font-size="13" font-weight="700" fill="#5C4A28" text-anchor="middle">工业默认是杂交（RocksDB）：L0 天然 tiered（memtable 倾倒，文件重叠，先攒着）＋ L1 起 leveled</text>
  <text x="620" y="554" font-size="11.5" fill="#5C4A28" text-anchor="middle">用 tiered 的低写放大吸收突发写，用 leveled 的低读放大保住稳态读；极端简化 FIFO：整文件按时淘汰，WA＝1，纯时序专用</text>

  <!-- ═══ 背压流水线 ═══ -->
  <rect x="48" y="598" width="1144" height="368" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="72" y="626" font-size="14" font-weight="700" fill="#4A473F">调度：欠账驱动的有界流水线，背压逐级回传到前台写</text>

  <rect x="76" y="646" width="150" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="151" y="668" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">前台写</text>
  <text x="151" y="688" font-size="10.5" fill="#2C4460" text-anchor="middle">μs 级追加</text>
  <path d="M226,674 L262,674" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="266" y="646" width="170" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="351" y="668" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">memtable（有界）</text>
  <text x="351" y="688" font-size="10.5" fill="#2C4460" text-anchor="middle">写满冻结 → flush 线程</text>
  <path d="M436,674 L472,674" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="476" y="640" width="220" height="68" rx="7" fill="#F4E3DE" stroke="#B0503F" stroke-width="1.5"/>
  <text x="586" y="660" font-size="12" font-weight="700" fill="#B0503F" text-anchor="middle">L0 文件数 ＝ 水位计</text>
  <text x="586" y="678" font-size="10.5" fill="#B0503F" text-anchor="middle">≥20：slowdown（每笔写注延迟）</text>
  <text x="586" y="694" font-size="10.5" fill="#B0503F" text-anchor="middle">≥36：stop（write stall，停写）</text>
  <path d="M696,674 L732,674" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="736" y="646" width="210" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="841" y="668" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">compaction 线程池</text>
  <text x="841" y="688" font-size="10.5" fill="#2C4460" text-anchor="middle">rate limiter 限速（令牌桶）</text>
  <path d="M946,674 L982,674" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="986" y="646" width="180" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="1076" y="668" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">L1..Ln</text>
  <text x="1076" y="688" font-size="10.5" fill="#2C4460" text-anchor="middle">pending bytes ＝ 欠账</text>

  <!-- 背压回传 -->
  <path d="M1076,706 L1076,742 L586,742 L586,712" fill="none" stroke="#B0503F" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrr)"/>
  <path d="M476,674 C440,716 260,730 190,706" fill="none" stroke="#B0503F" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrr)"/>
  <text x="620" y="762" font-size="11" font-weight="700" fill="#B0503F" text-anchor="middle">背压逐级回传：欠账涨 → L0 清不动 → slowdown → stop —— stall 不是 bug，是保护读延迟的保险丝</text>

  <rect x="76" y="784" width="1090" height="76" rx="8" fill="#F3F1E8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="96" y="810" font-size="11.5" font-weight="700" fill="#4A473F">稳态成立条件只有一条：compaction 消化速率 ≥ 前台写入速率 × WA</text>
  <text x="96" y="832" font-size="10.5" fill="#6B675C">不成立时，调大缓冲（阈值/memtable）只是把欠账上限调大 —— 爆炸推迟且更猛；领先指标盯 pending compaction bytes</text>
  <text x="96" y="850" font-size="10.5" fill="#6B675C">rate limiter 两难：限太狠 → 欠账涨 → stall；不限 → compaction 大块 IO 与前台读挤同一设备队列（1.7），读 p99 上天</text>

  <rect x="76" y="880" width="1090" height="64" rx="8" fill="#E2EFE9" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="620" y="906" font-size="12" font-weight="700" fill="#2F6B5E" text-anchor="middle">C++ 同构物：多级 bounded-queue 流水线 —— 决策菜单一模一样：加消费者 / 加缓冲 / 生产者限流 / 丢弃</text>
  <text x="620" y="928" font-size="10.5" fill="#2F6B5E" text-anchor="middle">LSM 只是把这道题从内存搬到盘上，每个错误决策以小时级欠账偿还周期呈现</text>
</svg>
