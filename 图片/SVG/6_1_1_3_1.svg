<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>CPacket 在协议栈中的定位</title>
  <desc>应用层 ScreenShareProtocol 定义语义，传输封装层 CPacket 负责帧定界，传输层 TCP 提供不保边界的字节流。</desc>
  <rect x="0" y="0" width="760" height="456" fill="rgb(245, 244, 237)"/>

  <text x="100" y="118" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">应用层</text>
  <text x="100" y="234" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">传输封装层</text>
  <text x="100" y="350" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">传输层</text>

  <g>
    <rect x="180" y="90" width="360" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="360" y="110" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">ScreenShareProtocol</text>
    <text x="360" y="130" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central">语义：命令、状态、载荷含义</text>
  </g>
  <g>
    <rect x="180" y="206" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="360" y="226" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">CPacket (SharedPacket)</text>
    <text x="360" y="246" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">帧定界：Magic + Length + Checksum</text>
  </g>
  <g>
    <rect x="180" y="322" width="360" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="360" y="342" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">TCP (Winsock)</text>
    <text x="360" y="362" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">字节流：不保证消息边界</text>
  </g>

  <path d="M360 146 L360 206" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="378" y="176" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">① Serialize 封装</text>
  <path d="M360 262 L360 322" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="378" y="292" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">② send 发送字节流</text>

  <path d="M540 350 L600 350 L600 118 L540 118" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="608" y="234" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start" dominant-baseline="central">recv → TryParse 解析</text>

  <text x="360" y="412" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">CPacket 在字节流之上恢复消息边界（帧定界）</text>
</svg>
