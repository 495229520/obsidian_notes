<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Trellis 工作流程：从项目上下文到经验沉淀</title>
  <desc>展示 Trellis 的完整工作流程：顶部为核心目录结构（spec/workspace/tasks 三大支柱），中部为 Task 生命周期状态机，底部为 8 步工作流程（会话恢复 → 状态注入 → 需求分析 → Planning → 实现 → Check → 沉淀经验 → 归档）</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="rgb(245, 244, 237)"/>

  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">Trellis 工作流程：Agent = Model + Harness + 自进化闭环</text>
  <text x="48" y="75" font-size="13" fill="#6B675C">Spec 约束 Task 怎么做，Task 按 Workflow 推进，Journal 记录过程，经验升级回 Spec</text>

  <!-- ============ Panel A：核心目录结构 ============ -->
  <text x="48" y="108" font-size="14" font-weight="700" fill="#4A473F">A · .trellis/ 核心结构：Spec（规范）+ Workspace（记忆）+ Tasks（任务）</text>

  <!-- spec/ 长期规范 -->
  <rect x="48" y="126" width="280" height="110" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="188" y="150" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">spec/ · 长期项目规范</text>
  <text x="188" y="171" font-size="11" fill="#2C4460" text-anchor="middle">命名规范、接口格式</text>
  <text x="188" y="188" font-size="11" fill="#2C4460" text-anchor="middle">错误处理方式、测试要求</text>
  <text x="188" y="205" font-size="11" fill="#2C4460" text-anchor="middle">架构约束</text>
  <text x="188" y="222" font-size="10" fill="#6B675C" text-anchor="middle">✓ 进 git，改动走 PR review</text>

  <!-- workspace/ 工作记忆 -->
  <rect x="358" y="126" width="280" height="110" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="498" y="150" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">workspace/ · 开发者记忆</text>
  <text x="498" y="171" font-size="11" fill="#6B4E28" text-anchor="middle">&lt;developer-name&gt;/journal-N.md</text>
  <text x="498" y="188" font-size="11" fill="#6B4E28" text-anchor="middle">已修改哪些文件、遇到什么问题</text>
  <text x="498" y="205" font-size="11" fill="#6B4E28" text-anchor="middle">尝试过哪些方案、下次从哪继续</text>
  <text x="498" y="222" font-size="10" fill="#6B675C" text-anchor="middle">✓ 进 git，保留开发轨迹</text>

  <!-- tasks/ 任务目录 -->
  <rect x="668" y="126" width="280" height="110" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="808" y="150" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">tasks/ · 任务与资产</text>
  <text x="808" y="171" font-size="11" fill="#24473F" text-anchor="middle">prd.md（需求与验收标准）</text>
  <text x="808" y="188" font-size="11" fill="#24473F" text-anchor="middle">design.md（技术设计与调用关系）</text>
  <text x="808" y="205" font-size="11" fill="#24473F" text-anchor="middle">implement.md（执行顺序）</text>
  <text x="808" y="222" font-size="10" fill="#6B675C" text-anchor="middle">✓ 进 git，完成后归档到 archive/</text>

  <!-- 跨平台适配层 -->
  <rect x="978" y="126" width="214" height="110" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1085" y="150" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">跨平台适配层</text>
  <text x="1085" y="171" font-size="10.5" fill="#4A473F" text-anchor="middle">.claude/ (Claude Code)</text>
  <text x="1085" y="187" font-size="10.5" fill="#4A473F" text-anchor="middle">.cursor/ (Cursor)</text>
  <text x="1085" y="203" font-size="10.5" fill="#4A473F" text-anchor="middle">.codex/ (Codex)</text>
  <text x="1085" y="219" font-size="10.5" fill="#4A473F" text-anchor="middle">.opencode/ (OpenCode)</text>

  <!-- ============ Panel B：Task 生命周期 ============ -->
  <text x="48" y="274" font-size="14" font-weight="700" fill="#4A473F">B · Task 生命周期：创建 → 绑定 Session → Planning → 实现 → 提交 → 归档</text>

  <!-- 状态流 -->
  <rect x="48" y="292" width="178" height="68" rx="8" fill="#EDEBE3" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="137" y="316" font-size="12" font-weight="700" fill="#444441" text-anchor="middle">创建 Task</text>
  <text x="137" y="333" font-size="10.5" fill="#6B675C" text-anchor="middle">生成任务目录</text>
  <text x="137" y="348" font-size="10.5" fill="#6B675C" text-anchor="middle">&lt;MM-DD-task-name&gt;/</text>

  <path d="M226,326 L252,326" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="254" y="292" width="168" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="338" y="316" font-size="12" font-weight="700" fill="#0C447C" text-anchor="middle">绑定 Session</text>
  <text x="338" y="333" font-size="10.5" fill="#6B675C" text-anchor="middle">写入 .runtime/</text>
  <text x="338" y="348" font-size="10.5" fill="#6B675C" text-anchor="middle">sessions/&lt;key&gt;.json</text>

  <path d="M422,326 L448,326" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="450" y="292" width="158" height="68" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="529" y="316" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">planning</text>
  <text x="529" y="333" font-size="10.5" fill="#6B675C" text-anchor="middle">生成 prd.md</text>
  <text x="529" y="348" font-size="10.5" fill="#6B675C" text-anchor="middle">design.md, implement.md</text>

  <path d="M608,326 L634,326" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="636" y="292" width="168" height="68" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="720" y="316" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">in_progress</text>
  <text x="720" y="333" font-size="10.5" fill="#6B675C" text-anchor="middle">实现 + check 阶段</text>
  <text x="720" y="348" font-size="10.5" fill="#6B675C" text-anchor="middle">读取 spec 与 research</text>

  <path d="M804,326 L830,326" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="832" y="292" width="158" height="68" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="911" y="316" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">完成提交</text>
  <text x="911" y="333" font-size="10.5" fill="#6B675C" text-anchor="middle">git commit</text>
  <text x="911" y="348" font-size="10.5" fill="#6B675C" text-anchor="middle">代码进仓库</text>

  <path d="M990,326 L1016,326" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <rect x="1018" y="292" width="174" height="68" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1105" y="316" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">归档 + 记录</text>
  <text x="1105" y="333" font-size="10.5" fill="#6B675C" text-anchor="middle">→ archive/</text>
  <text x="1105" y="348" font-size="10.5" fill="#6B675C" text-anchor="middle">追加 journal</text>

  <!-- ============ Panel C：8 步工作流程 ============ -->
  <text x="48" y="398" font-size="14" font-weight="700" fill="#4A473F">C · 完整工作流程：从会话恢复到经验沉淀（8 步闭环）</text>

  <!-- 第 1 步：恢复项目上下文 -->
  <rect x="48" y="416" width="270" height="118" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="183" y="438" font-size="12" font-weight="700" fill="#0C447C" text-anchor="middle">① 恢复项目上下文</text>
  <text x="183" y="456" font-size="10.5" fill="#2C4460" text-anchor="middle">developer 是谁？</text>
  <text x="183" y="471" font-size="10.5" fill="#2C4460" text-anchor="middle">仓库现在的状态？（git status）</text>
  <text x="183" y="486" font-size="10.5" fill="#2C4460" text-anchor="middle">正在处理哪个任务？（Session Id）</text>
  <text x="183" y="501" font-size="10.5" fill="#2C4460" text-anchor="middle">任务进行到哪一步？（Task Status）</text>
  <text x="183" y="516" font-size="10.5" fill="#2C4460" text-anchor="middle">需要遵守哪些规范？（Spec index）</text>
  <text x="183" y="531" font-size="10.5" fill="#2C4460" text-anchor="middle">上次工作到哪里？（Workspace memory）</text>

  <path d="M318,475 L344,475" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- 第 2 步：状态注入 -->
  <rect x="346" y="416" width="248" height="118" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="470" y="438" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">② 状态注入 Prompt</text>
  <text x="470" y="458" font-size="10.5" fill="#2C4460" text-anchor="middle">每轮 prompt 自动注入：</text>
  <text x="470" y="476" font-size="10.5" fill="#2C4460" text-anchor="middle">· 当前任务状态</text>
  <text x="470" y="491" font-size="10.5" fill="#2C4460" text-anchor="middle">· Workflow 阶段</text>
  <text x="470" y="506" font-size="10.5" fill="#2C4460" text-anchor="middle">· PRD / Design / 规范</text>
  <text x="470" y="521" font-size="10.5" fill="#2C4460" text-anchor="middle">· 详细 Journal</text>

  <path d="M594,475 L620,475" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- 第 3 步：判断是否建 Task -->
  <rect x="622" y="416" width="570" height="118" rx="8" fill="#EDEBE3" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="907" y="438" font-size="12" font-weight="700" fill="#444441" text-anchor="middle">③ 判断是否建立 Task</text>
  <text x="907" y="458" font-size="11" fill="#4A473F" text-anchor="middle">小需求或技术问题 → 不创建 task，直接回答</text>
  <text x="907" y="476" font-size="11" fill="#4A473F" text-anchor="middle">大型功能开发 → 进入 ④ 需求分析</text>
  <line x1="640" y1="494" x2="1174" y2="494" stroke="#D8D5C8" stroke-width="1"/>
  <text x="907" y="512" font-size="10" fill="#6B675C" text-anchor="middle">「做登录界面」→ 创建 task 并生成 prd / design / implement</text>
  <text x="907" y="527" font-size="10" fill="#6B675C" text-anchor="middle">「什么是 JWT？」→ 直接回答，无需建 task</text>

  <!-- 第 4 步：需求分析 -->
  <rect x="48" y="562" width="376" height="96" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="236" y="584" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">④ 需求分析（Planning 前追问）</text>
  <text x="236" y="604" font-size="10.5" fill="#6B4E28" text-anchor="middle">prd.md：要做什么？做到什么算完成？</text>
  <text x="236" y="620" font-size="10.5" fill="#6B4E28" text-anchor="middle">design.md：准备怎么做？为什么这样做？</text>
  <text x="236" y="636" font-size="10.5" fill="#6B4E28" text-anchor="middle">implement.md：按什么顺序执行？</text>
  <text x="236" y="652" font-size="10.5" fill="#6B4E28" text-anchor="middle">research/：调研发现了什么？哪些结论有依据？</text>

  <path d="M424,610 L450,610" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 第 5 步：实现 -->
  <rect x="452" y="562" width="264" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="584" y="584" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">⑤ 实现（in_progress）</text>
  <text x="584" y="604" font-size="10.5" fill="#2C4460" text-anchor="middle">AI 综合读取：</text>
  <text x="584" y="620" font-size="10.5" fill="#2C4460" text-anchor="middle">· 任务状态 + artifacts</text>
  <text x="584" y="636" font-size="10.5" fill="#2C4460" text-anchor="middle">· 相关 spec + 调研材料</text>
  <text x="584" y="652" font-size="10.5" fill="#2C4460" text-anchor="middle">· 仓库实际代码</text>

  <path d="M716,610 L742,610" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- 第 6 步：Check -->
  <rect x="744" y="562" width="224" height="96" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="856" y="584" font-size="12" font-weight="700" fill="#3C3489" text-anchor="middle">⑥ Check 阶段</text>
  <text x="856" y="604" font-size="10.5" fill="#3C3489" text-anchor="middle">小 Code Review：</text>
  <text x="856" y="620" font-size="10.5" fill="#3C3489" text-anchor="middle">查看当前 diff</text>
  <text x="856" y="636" font-size="10.5" fill="#3C3489" text-anchor="middle">读取 check.jsonl 声明的</text>
  <text x="856" y="652" font-size="10.5" fill="#3C3489" text-anchor="middle">spec 和 research 对照检查</text>

  <path d="M968,610 L994,610" stroke="#534AB7" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 第 7 步：沉淀经验 -->
  <rect x="996" y="562" width="196" height="96" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1094" y="584" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">⑦ 沉淀经验</text>
  <text x="1094" y="604" font-size="10.5" fill="#24473F" text-anchor="middle">update-spec：</text>
  <text x="1094" y="620" font-size="10.5" fill="#24473F" text-anchor="middle">AI 引导判断哪些经验</text>
  <text x="1094" y="636" font-size="10.5" fill="#24473F" text-anchor="middle">值得长期复用</text>
  <text x="1094" y="652" font-size="10.5" fill="#24473F" text-anchor="middle">筛选后写回 spec/</text>

  <!-- 第 8 步：归档 -->
  <rect x="48" y="686" width="1144" height="76" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="620" y="710" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">⑧ git commit 后运行 /trellis:finish-work 归档任务</text>
  <text x="620" y="730" font-size="11" fill="#24473F" text-anchor="middle">任务目录 .trellis/tasks/xxx_Task/ → archive/</text>
  <text x="620" y="748" font-size="11" fill="#24473F" text-anchor="middle">工作记录 → workspace/&lt;developer&gt;/journal-N.md</text>

  <!-- 自进化闭环箭头 -->
  <path d="M1094,658 Q1210,710 1094,762" fill="none" stroke="#2F6B5E" stroke-width="2.2" marker-end="url(#arr-green)" stroke-dasharray="5,3"/>
  <text x="1215" y="710" font-size="11" font-weight="700" fill="#2F6B5E">经验</text>
  <text x="1215" y="725" font-size="11" font-weight="700" fill="#2F6B5E">回流</text>

  <!-- 底部口径说明 -->
  <rect x="48" y="792" width="1144" height="64" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="620" y="813" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">核心设计原则</text>
  <text x="620" y="832" font-size="10.5" fill="#6B675C" text-anchor="middle">规范改动走 PR review（spec 是团队代码）· 任务通过 --assignee 明确负责人避免冲突 · .developer 和 .runtime/ 本地 gitignored</text>
  <text x="620" y="848" font-size="10.5" fill="#6B675C" text-anchor="middle">Spec 约束 Task 怎么做 → Task 按 Workflow 推进 → Journal 记录过程 → 经验升级为 Spec → 长期自进化</text>
</svg>
