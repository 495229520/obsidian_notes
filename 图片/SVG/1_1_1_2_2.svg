<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="flow-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5A564B"/>
    </marker>
    <marker id="sub-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <!-- 顶部标题区 -->
  <text x="48" y="44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#2B2A26">函数调用全生命周期栈帧演变时序</text>
  <text x="48" y="72" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#6B675C">从实参入栈、序言建立新栈帧，到尾声撤帧与主调平衡堆栈的四个关键节点</text>

  <!-- 阶段 1：实参压栈 -->
  <g transform="translate(48, 100)">
    <rect x="0" y="0" width="270" height="550" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
    <rect x="0" y="0" width="270" height="42" rx="8" fill="#EDEAF3"/>
    <text x="16" y="26" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#4A3F6B">① 实参压栈 (Push Args)</text>

    <!-- 汇编指令卡 -->
    <rect x="14" y="52" width="242" height="62" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
    <text x="24" y="74" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2B2A26">push dword ptr [b] ; 20</text>
    <text x="24" y="96" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2B2A26">push dword ptr [a] ; 10</text>

    <!-- 栈空间图示 -->
    <g transform="translate(14, 126)">
      <rect x="0" y="0" width="242" height="310" rx="6" fill="#FFFFFF" stroke="#D8D5C8" stroke-width="1"/>

      <!-- 空闲栈空间 -->
      <rect x="10" y="10" width="222" height="60" rx="4" fill="#F9F9F6" stroke="#D8D5C8" stroke-dasharray="3 2"/>
      <text x="121" y="44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#9B968A" text-anchor="middle">未分配栈空间 (低地址 ↑)</text>

      <!-- 参数 a -->
      <rect x="10" y="76" width="222" height="52" rx="4" fill="#EDEAF3" stroke="#8C7CA8" stroke-width="1.2"/>
      <text x="22" y="98" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#4A3F6B">实参 a = 10</text>
      <text x="220" y="98" font-family="Menlo,Consolas,monospace" font-size="11" fill="#6B5B95" text-anchor="end">← ESP</text>
      <text x="22" y="116" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6B5B95">后压入，位于较低地址</text>

      <!-- 参数 b -->
      <rect x="10" y="134" width="222" height="52" rx="4" fill="#EDEAF3" stroke="#8C7CA8" stroke-width="1.2"/>
      <text x="22" y="156" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#4A3F6B">实参 b = 20</text>
      <text x="220" y="156" font-family="Menlo,Consolas,monospace" font-size="11" fill="#6B5B95" text-anchor="end">[esp + 4]</text>
      <text x="22" y="174" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6B5B95">从右向左最先入栈</text>

      <!-- main 局部栈帧 -->
      <rect x="10" y="192" width="222" height="106" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
      <text x="22" y="218" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#4A473F">main 栈帧区域</text>
      <text x="22" y="240" font-family="Menlo,Consolas,monospace" font-size="11" fill="#5A564B">局部变量 a=10, b=20</text>
      <text x="220" y="240" font-family="Menlo,Consolas,monospace" font-size="11" fill="#8A6A3A" text-anchor="end">← EBP</text>
      <text x="22" y="262" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6B675C">EBP 仍锚定 main 栈底</text>
    </g>

    <!-- 说明卡 -->
    <rect x="14" y="448" width="242" height="88" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
    <text x="24" y="472" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#2B2A26">状态特征：</text>
    <text x="24" y="492" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">1. 参数由 main 压入</text>
    <text x="24" y="510" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">2. ESP 向低地址移动 8 字节</text>
    <text x="24" y="528" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">3. EBP 保持 main 状态不变</text>
  </g>

  <!-- 连接箭头 1 -> 2 -->
  <line x1="324" y1="360" x2="344" y2="360" stroke="#5A564B" stroke-width="2" marker-end="url(#flow-arr)"/>

  <!-- 阶段 2：序言建帧 -->
  <g transform="translate(350, 100)">
    <rect x="0" y="0" width="270" height="550" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
    <rect x="0" y="0" width="270" height="42" rx="8" fill="#E3EAF4"/>
    <text x="16" y="26" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#2C4460">② 序言建帧 (Prologue)</text>

    <!-- 汇编指令卡 -->
    <rect x="14" y="52" width="242" height="62" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
    <text x="22" y="70" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2B2A26">call sum  ; push ret_addr</text>
    <text x="22" y="88" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2B2A26">push ebp; mov ebp, esp</text>
    <text x="22" y="106" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2B2A26">sub esp, 4Ch ; 开辟局部空间</text>

    <!-- 栈空间图示 -->
    <g transform="translate(14, 126)">
      <rect x="0" y="0" width="242" height="310" rx="6" fill="#FFFFFF" stroke="#D8D5C8" stroke-width="1"/>

      <!-- 局部变量 temp -->
      <rect x="10" y="10" width="222" height="48" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
      <text x="22" y="30" font-family="Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#2C4460">temp = 0 [ebp - 4]</text>
      <text x="220" y="30" font-family="Menlo,Consolas,monospace" font-size="11" fill="#3D5A80" text-anchor="end">← ESP</text>
      <text x="22" y="46" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#3D5A80">当前栈顶已抬升</text>

      <!-- 旧 EBP -->
      <rect x="10" y="64" width="222" height="48" rx="4" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
      <text x="22" y="84" font-family="Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#6B4E28">Saved EBP (main 栈底)</text>
      <text x="220" y="84" font-family="Menlo,Consolas,monospace" font-size="11" fill="#8A6A3A" text-anchor="end">← EBP</text>
      <text x="22" y="100" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#8A6A3A">新栈基准确立 [ebp+0]</text>

      <!-- 返回地址 -->
      <rect x="10" y="118" width="222" height="44" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
      <text x="22" y="138" font-family="Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#24473F">Return Address [ebp+4]</text>
      <text x="22" y="152" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#2F6B5E">call 指令写入 Next EIP</text>

      <!-- 参数 a & b -->
      <rect x="10" y="168" width="222" height="54" rx="4" fill="#EDEAF3" stroke="#8C7CA8" stroke-width="1.1"/>
      <text x="22" y="188" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#4A3F6B">参数 a [ebp+8]  (10)</text>
      <text x="22" y="206" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#4A3F6B">参数 b [ebp+12] (20)</text>

      <!-- main 区域 -->
      <rect x="10" y="228" width="222" height="70" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
      <text x="22" y="254" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5A564B">main 栈帧挂起等待</text>
      <text x="22" y="274" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#6B675C">sum 执行 a+b 并将结果送入 EAX</text>
    </g>

    <!-- 说明卡 -->
    <rect x="14" y="448" width="242" height="88" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
    <text x="24" y="472" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#2B2A26">状态特征：</text>
    <text x="24" y="492" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">1. sum 拥有独立栈帧空间</text>
    <text x="24" y="510" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">2. EBP 成为固定寻址原点</text>
    <text x="24" y="528" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">3. 返回值存入 EAX 寄存器</text>
  </g>

  <!-- 连接箭头 2 -> 3 -->
  <line x1="626" y1="360" x2="646" y2="360" stroke="#5A564B" stroke-width="2" marker-end="url(#flow-arr)"/>

  <!-- 阶段 3：尾声撤帧 -->
  <g transform="translate(652, 100)">
    <rect x="0" y="0" width="270" height="550" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
    <rect x="0" y="0" width="270" height="42" rx="8" fill="#F3E8D3"/>
    <text x="16" y="26" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#6B4E28">③ 尾声撤帧 (Epilogue &amp; Ret)</text>

    <!-- 汇编指令卡 -->
    <rect x="14" y="52" width="242" height="62" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
    <text x="22" y="70" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2B2A26">mov esp, ebp ; 回收局部变量</text>
    <text x="22" y="88" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2B2A26">pop ebp      ; 恢复 main 的栈底</text>
    <text x="22" y="106" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2B2A26">ret          ; 弹出地址并赋给 EIP</text>

    <!-- 栈空间图示 -->
    <g transform="translate(14, 126)">
      <rect x="0" y="0" width="242" height="310" rx="6" fill="#FFFFFF" stroke="#D8D5C8" stroke-width="1"/>

      <!-- 已释放的局部变量空间 -->
      <rect x="10" y="10" width="222" height="56" rx="4" fill="#F9F9F6" stroke="#A64B3C" stroke-dasharray="4 3"/>
      <text x="121" y="32" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#A64B3C" text-anchor="middle">[已回收空间：局部变量]</text>
      <text x="121" y="50" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#6B675C" text-anchor="middle">mov esp, ebp 瞬间释放</text>

      <!-- 已弹出的 EBP 与 返回地址 -->
      <rect x="10" y="72" width="222" height="56" rx="4" fill="#F9F9F6" stroke="#9B968A" stroke-dasharray="3 2"/>
      <text x="121" y="94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5A564B" text-anchor="middle">[已弹出] 旧 EBP 与返回地址</text>
      <text x="121" y="112" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#6B675C" text-anchor="middle">pop ebp &amp; ret 指令执行完毕</text>

      <!-- 参数 a（当前栈顶） -->
      <rect x="10" y="134" width="222" height="50" rx="4" fill="#EDEAF3" stroke="#8C7CA8" stroke-width="1.2"/>
      <text x="22" y="156" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#4A3F6B">实参 a = 10</text>
      <text x="220" y="156" font-family="Menlo,Consolas,monospace" font-size="11" fill="#3D5A80" text-anchor="end">← ESP</text>
      <text x="22" y="172" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6B5B95">ret 弹出后栈顶停在此处</text>

      <!-- 参数 b -->
      <rect x="10" y="190" width="222" height="46" rx="4" fill="#EDEAF3" stroke="#8C7CA8" stroke-width="1.2"/>
      <text x="22" y="212" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#4A3F6B">实参 b = 20</text>
      <text x="220" y="212" font-family="Menlo,Consolas,monospace" font-size="11" fill="#6B5B95" text-anchor="end">[esp + 4]</text>

      <!-- main 区域 -->
      <rect x="10" y="242" width="222" height="56" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
      <text x="22" y="264" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#4A473F">main 重新恢复执行</text>
      <text x="220" y="264" font-family="Menlo,Consolas,monospace" font-size="11" fill="#8A6A3A" text-anchor="end">← EBP</text>
      <text x="22" y="282" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#6B675C">pop ebp 还原了 main 栈底基准</text>
    </g>

    <!-- 说明卡 -->
    <rect x="14" y="448" width="242" height="88" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
    <text x="24" y="472" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#2B2A26">状态特征：</text>
    <text x="24" y="492" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">1. sum 栈帧完全瓦解</text>
    <text x="24" y="510" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">2. CPU 控制权回到 main 函数</text>
    <text x="24" y="528" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">3. 形参内存仍在栈中等待清理</text>
  </g>

  <!-- 连接箭头 3 -> 4 -->
  <line x1="928" y1="360" x2="948" y2="360" stroke="#5A564B" stroke-width="2" marker-end="url(#flow-arr)"/>

  <!-- 阶段 4：调用者平栈 -->
  <g transform="translate(954, 100)">
    <rect x="0" y="0" width="238" height="550" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
    <rect x="0" y="0" width="238" height="42" rx="8" fill="#DCE9E3"/>
    <text x="16" y="26" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#24473F">④ 调用者平栈 (Cleanup)</text>

    <!-- 汇编指令卡 -->
    <rect x="14" y="52" width="210" height="62" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
    <text x="22" y="74" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2B2A26">add esp, 8</text>
    <text x="22" y="96" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5A564B">释放形参 a 与 b 占用的空间</text>

    <!-- 栈空间图示 -->
    <g transform="translate(14, 126)">
      <rect x="0" y="0" width="210" height="310" rx="6" fill="#FFFFFF" stroke="#D8D5C8" stroke-width="1"/>

      <!-- 空闲栈空间（包含被回收的参数区） -->
      <rect x="10" y="10" width="190" height="150" rx="4" fill="#F9F9F6" stroke="#2F6B5E" stroke-dasharray="4 3"/>
      <text x="105" y="60" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">栈已完全平衡</text>
      <text x="105" y="85" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5A564B" text-anchor="middle">实参 a, b 内存逻辑释放</text>
      <text x="105" y="108" font-family="Menlo,Consolas,monospace" font-size="11" fill="#2F6B5E" text-anchor="middle">add esp, 8 抹平偏移</text>

      <!-- main 局部栈帧（完全恢复） -->
      <rect x="10" y="168" width="190" height="130" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
      <text x="20" y="196" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#4A473F">main 栈帧完全还原</text>
      <text x="180" y="196" font-family="Menlo,Consolas,monospace" font-size="11" fill="#3D5A80" text-anchor="end">← ESP</text>
      <text x="20" y="222" font-family="Menlo,Consolas,monospace" font-size="11" fill="#5A564B">mov [ret], eax</text>
      <text x="20" y="244" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#5A564B">从 EAX 读取计算结果 (30)</text>
      <text x="20" y="266" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6B675C">栈顶与调用前保持完全一致</text>
      <text x="180" y="266" font-family="Menlo,Consolas,monospace" font-size="11" fill="#8A6A3A" text-anchor="end">← EBP</text>
    </g>

    <!-- 说明卡 -->
    <rect x="14" y="448" width="210" height="88" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
    <text x="22" y="472" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#2B2A26">状态特征：</text>
    <text x="22" y="492" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">1. 堆栈指针 ESP 归位</text>
    <text x="22" y="510" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">2. 返回值存入 ret 变量</text>
    <text x="22" y="528" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#4A473F">3. 避免了多次调用的栈泄漏</text>
  </g>
</svg>