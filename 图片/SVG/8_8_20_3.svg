<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
<title>PXN：多一跳 NVLink，可能换来更合适的网络出口</title><desc>示意目标在 rail 1；优化目标是完整路径与共享资源，而不是只比较本节点 GPU-NIC 距离。。原创教学示意；数字不是硬件实测；详细条件与出处见对应 Markdown 笔记。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="52" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">PXN：多一跳 NVLink，可能换来更合适的网络出口</text>
<text x="48" y="81" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">示意目标在 rail 1；优化目标是完整路径与共享资源，而不是只比较本节点 GPU-NIC 距离。</text>
<text x="64" y="122" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">A · 不经中转的示意路径：可能需要跨 rail</text>
<rect x="64" y="142" width="141" height="67" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="134.5" y="169.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU 0</text>
<text x="134.5" y="191.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">源 rank</text>
<rect x="279" y="142" width="145" height="67" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="351.5" y="169.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">NIC 0</text>
<text x="351.5" y="191.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">局部出口</text>
<rect x="551" y="142" width="376" height="67" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="739.0" y="169.5" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">网络中跨 rail</text>
<text x="739.0" y="191.5" font-size="13" fill="#733428" font-weight="400" text-anchor="middle">代价依 fabric 结构与负载</text>
<rect x="1026" y="142" width="150" height="67" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="1101.0" y="169.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">远端 NIC 1</text>
<text x="1101.0" y="191.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">目标 rail 1</text>
<line x1="210" y1="175" x2="273" y2="175" stroke="#5A564B" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="429" y1="175" x2="545" y2="175" stroke="#5A564B" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="933" y1="175" x2="1020" y2="175" stroke="#5A564B" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="64" y="256" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">B · PXN 示例：先到另一 GPU，再用对应 NIC</text>
<rect x="64" y="276" width="141" height="75" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="134.5" y="307.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU 0</text>
<text x="134.5" y="329.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">源 rank 不变</text>
<rect x="279" y="276" width="145" height="75" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="351.5" y="307.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">中间 GPU 1</text>
<text x="351.5" y="329.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">承载转发缓冲</text>
<rect x="551" y="276" width="145" height="75" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="623.5" y="307.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">NIC 1</text>
<text x="623.5" y="329.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">目标 rail 出口</text>
<rect x="765" y="276" width="162" height="75" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="846.0" y="307.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">同 rail 网络</text>
<text x="846.0" y="329.5" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle">无需该次跨 rail</text>
<rect x="1026" y="276" width="150" height="75" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="1101.0" y="307.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">远端 NIC 1</text>
<text x="1101.0" y="329.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">目标 rail 1</text>
<line x1="210" y1="313" x2="273" y2="313" stroke="#3D5A80" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="241.5" y="297" font-size="12" fill="#2C4460" font-weight="400" text-anchor="middle">NVLink</text>
<line x1="429" y1="313" x2="545" y2="313" stroke="#9B968A" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="487.0" y="297" font-size="12" fill="#4A473F" font-weight="400" text-anchor="middle">PCIe</text>
<line x1="701" y1="313" x2="759" y2="313" stroke="#8A6A3A" stroke-width="2.5" marker-end="url(#amber)"/>
<line x1="933" y1="313" x2="1020" y2="313" stroke="#8A6A3A" stroke-width="2.5" marker-end="url(#amber)"/>
<rect x="48" y="390" width="1144" height="198" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="419" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">C · 共享出口仍然存在：四 GPU 不会把单 NIC 变成四倍速</text>
<rect x="64" y="455" width="120" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="124.0" y="486.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU 0</text>
<path d="M 124,511 L 124,546 L 722,546 L 722,488 L 750,488" fill="none" stroke="#6B675C" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="214" y="455" width="120" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="274.0" y="486.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU 1</text>
<path d="M 274,511 L 274,546 L 722,546 L 722,488 L 750,488" fill="none" stroke="#6B675C" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="364" y="455" width="120" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="424.0" y="486.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU 2</text>
<path d="M 424,511 L 424,546 L 722,546 L 722,488 L 750,488" fill="none" stroke="#6B675C" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="514" y="455" width="120" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="574.0" y="486.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU 3</text>
<path d="M 574,511 L 574,546 L 722,546 L 722,488 L 750,488" fill="none" stroke="#6B675C" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="755" y="455" width="179" height="65" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="844.5" y="481.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">一个 NIC</text>
<text x="844.5" y="503.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">400 Gb/s（假设）</text>
<line x1="939" y1="488" x2="978" y2="488" stroke="#8A6A3A" stroke-width="3" marker-end="url(#amber)"/>
<text x="991" y="475" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">名义合计 ≤ 50 GB/s</text>
<text x="991" y="504" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="start">不是每 GPU 50 GB/s</text>
<text x="64" y="573" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">先证明流量实际经过哪些共享边，再做 V / B 的容量下界计算。</text>
<line x1="48" y1="609" x2="1192" y2="609" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="637" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">PXN 是否有益需测量；中转 GPU、NIC、PCIe 与网络 rail 都可能成为瓶颈。400 Gb/s 仅用于单位换算。</text>
<text x="48" y="660" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">对应 8.20 §4.4、§5–§6；物理路由示意，不承诺当前机器一定启用 PXN。</text>
</svg>