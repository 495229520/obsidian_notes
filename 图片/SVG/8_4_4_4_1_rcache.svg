<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<title>注册缓存：地址命中之后，还要验证什么？</title>
<desc>所有权让 backing 活着；身份、注册语义和同步状态决定 MR 能否复用。。中文教学示意；状态编号与时间间距不代表实测延迟。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="690" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="49" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">注册缓存：地址命中之后，还要验证什么？</text>
<text x="48" y="79" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start">所有权让 backing 活着；身份、注册语义和同步状态决定 MR 能否复用。</text>
<rect x="40" y="108" width="705" height="493" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="765" y="108" width="435" height="493" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="62" y="138" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">A · 所有权与设备映射</text>
<rect x="62" y="180" width="172" height="70" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="148.0" y="209.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">CPU VA</text>
<text x="148.0" y="230.5" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle">allocation_id / epoch</text>
<rect x="290" y="180" width="195" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="387.5" y="209.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">底层分配</text>
<text x="387.5" y="230.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">稳定引用 / pin</text>
<rect x="541" y="180" width="182" height="70" rx="8" fill="#EDEAF3" stroke="#82749E" stroke-width="1.3"/>
<text x="632.0" y="209.5" font-size="14" fill="#5D4F78" font-weight="700" text-anchor="middle">RNIC / MR</text>
<text x="632.0" y="230.5" font-size="13" fill="#5D4F78" font-weight="400" text-anchor="middle">PD · IOVA · key</text>
<line x1="237" y1="215" x2="283" y2="215" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="244" y="199" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start">持有</text>
<line x1="490" y1="215" x2="534" y2="215" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="491" y="199" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start">注册</text>
<text x="63" y="282" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">VA / IOVA / PA：不同地址空间</text>
<text x="63" y="307" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">普通长期 MR：稳定 backing + 设备翻译 + 权限</text>
<text x="62" y="353" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">B · 区间覆盖只完成了查找</text>
<rect x="70" y="390" width="80" height="42" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="110" y="417" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">0</text>
<rect x="150" y="390" width="80" height="42" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="190" y="417" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">1</text>
<rect x="230" y="390" width="80" height="42" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="270" y="417" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">2</text>
<rect x="310" y="390" width="80" height="42" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="350" y="417" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">3</text>
<rect x="390" y="390" width="80" height="42" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="430" y="417" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">4</text>
<rect x="470" y="390" width="80" height="42" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="510" y="417" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">5</text>
<rect x="550" y="390" width="80" height="42" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="590" y="417" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">6</text>
<rect x="630" y="390" width="80" height="42" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="670" y="417" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">7</text>
<text x="70" y="379" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">缓存 MR 范围</text>
<rect x="230" y="453" width="320" height="33" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="390" y="475" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">请求子区间：覆盖成立</text>
<line x1="230" y1="451" x2="230" y2="437" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="550" y1="451" x2="550" y2="437" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="70" y="528" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">仍需：同一分配、同一域、兼容 flags</text>
<text x="70" y="561" font-size="13" fill="#733428" font-weight="400" text-anchor="start">页对齐扩展不能越过 backing 所有权</text>
<text x="789" y="138" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">C · 命中门：逐项检查</text>
<rect x="783" y="169" width="399" height="61" rx="3" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="797" y="192" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">设备 / 保护域</text>
<text x="797" y="216" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">context_epoch · pd_epoch</text>
<text x="797" y="257" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">内存身份</text>
<text x="797" y="281" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">memory_type · allocation_epoch</text>
<rect x="783" y="299" width="399" height="61" rx="3" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="797" y="322" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">访问地址语义</text>
<text x="797" y="346" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">CPU VA → IOVA · zero-based</text>
<text x="797" y="387" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">范围与权限</text>
<text x="797" y="411" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">完整覆盖 · access 足够</text>
<rect x="783" y="429" width="399" height="61" rx="3" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="797" y="452" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">非权限属性</text>
<text x="797" y="476" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">ODP · relaxed ordering</text>
<text x="797" y="517" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">同步状态</text>
<text x="797" y="541" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">READY / IDLE · 尚未失效</text>
<line x1="48" y1="625" x2="1192" y2="625" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="654" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">最小原则：可复用的是仍成立的注册，不是“这个指针以前注册过”。</text>
</svg>