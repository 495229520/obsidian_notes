<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580">
  <title>判别向量组线性相关性 · 方法地图</title>
  <desc>按题型选择判据：两向量看成比例；方阵算行列式；非方阵求秩；抽象组算系数矩阵 C 的行列式。行列式为零或秩小于个数则相关，否则无关。</desc>
  <rect x="0" y="0" width="760" height="580" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="380" y="28" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">判别向量组线性相关性 · 方法地图</text>

  <!-- 根节点 -->
  <path d="M232 48 H528 V86 H232 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text x="380" y="67" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">向量组 α₁ , … , αₘ（m 个 n 维向量）</text>
  <text x="380" y="101" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">↓ 按题型选择判据 ↓</text>

  <!-- 列标题 -->
  <text x="129" y="112" font-family="system-ui,sans-serif" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#185FA5">场景</text>
  <text x="368" y="112" font-family="system-ui,sans-serif" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#534AB7">判据</text>
  <text x="626" y="112" font-family="system-ui,sans-serif" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">结论</text>

  <!-- ============ 通道 1：两向量 (yc=150) ============ -->
  <path d="M40 118 H218 V182 H40 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text x="129" y="150" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">① 仅 2 个向量</text>
  <path d="M262 118 H474 V182 H262 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text x="368" y="143" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#3C3489">看是否对应成比例</text>
  <text x="368" y="161" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">（即 |α₁ α₂|）</text>
  <path d="M518 117 H734 V145 H518 Z" fill="#F6E0DE" stroke="#A23838" stroke-width="0.6"/>
  <text x="626" y="131" font-family="system-ui,sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#8A2F2F">成比例 → 相关</text>
  <path d="M518 155 H734 V183 H518 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text x="626" y="169" font-family="system-ui,sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">不成比例 → 无关</text>
  <path d="M218 150 H258" stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M474 150 H494 V131 H514" stroke="#A23838" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/>
  <path d="M474 150 H494 V169 H514" stroke="#0F6E56" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ 通道 2：方阵 (yc=248) ============ -->
  <path d="M40 216 H218 V280 H40 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text x="129" y="241" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">② 个数 = 维数</text>
  <text x="129" y="259" font-family="system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#185FA5">（排成方阵 A）</text>
  <path d="M262 216 H474 V280 H262 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text x="368" y="248" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">算行列式 |A|</text>
  <path d="M518 215 H734 V243 H518 Z" fill="#F6E0DE" stroke="#A23838" stroke-width="0.6"/>
  <text x="626" y="229" font-family="system-ui,sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#8A2F2F">|A| = 0 → 相关</text>
  <path d="M518 253 H734 V281 H518 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text x="626" y="267" font-family="system-ui,sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">|A| ≠ 0 → 无关</text>
  <path d="M218 248 H258" stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M474 248 H494 V229 H514" stroke="#A23838" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/>
  <path d="M474 248 H494 V267 H514" stroke="#0F6E56" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ 通道 3：非方阵 (yc=346) ============ -->
  <path d="M40 314 H218 V378 H40 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text x="129" y="339" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">③ 个数 ≠ 维数</text>
  <text x="129" y="357" font-family="system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#185FA5">（通用情形）</text>
  <path d="M262 314 H474 V378 H262 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text x="368" y="339" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">化行阶梯形，求秩 r</text>
  <text x="368" y="357" font-family="system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">r = 非零行数</text>
  <path d="M518 313 H734 V341 H518 Z" fill="#F6E0DE" stroke="#A23838" stroke-width="0.6"/>
  <text x="626" y="327" font-family="system-ui,sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#8A2F2F">r &lt; m → 相关</text>
  <path d="M518 351 H734 V379 H518 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text x="626" y="365" font-family="system-ui,sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">r = m → 无关</text>
  <path d="M218 346 H258" stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M474 346 H494 V327 H514" stroke="#A23838" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/>
  <path d="M474 346 H494 V365 H514" stroke="#0F6E56" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ 通道 4：抽象 (yc=444) ============ -->
  <path d="M40 412 H218 V476 H40 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text x="129" y="437" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">④ 抽象向量组</text>
  <text x="129" y="455" font-family="system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#185FA5">(β)=(α)C，α 无关</text>
  <path d="M262 412 H474 V476 H262 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text x="368" y="444" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">算系数矩阵 |C|</text>
  <path d="M518 411 H734 V439 H518 Z" fill="#F6E0DE" stroke="#A23838" stroke-width="0.6"/>
  <text x="626" y="425" font-family="system-ui,sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#8A2F2F">|C| = 0 → 相关</text>
  <path d="M518 449 H734 V477 H518 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text x="626" y="463" font-family="system-ui,sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">|C| ≠ 0 → 无关</text>
  <path d="M218 444 H258" stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M474 444 H494 V425 H514" stroke="#A23838" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/>
  <path d="M474 444 H494 V463 H514" stroke="#0F6E56" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/>

  <!-- 底部提示 -->
  <path d="M40 500 H734 V560 H40 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
  <text x="380" y="520" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">推论：个数 &gt; 维数（m &gt; n）⇒ 向量组必线性相关（因 r ≤ n &lt; m）</text>
  <text x="380" y="542" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#854F0B">求秩的同时：行阶梯形中主元所在列对应的原向量 = 一个极大无关组</text>
</svg>
