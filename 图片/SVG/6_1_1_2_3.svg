<svg xmlns="http://www.w3.org/2000/svg" width="740" height="290" viewBox="0 0 740 290">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>线上字节流包格式（以 Hello 为例）</title>
  <desc>CPacket 二进制帧：Magic 0xFEFF、Length(bodyLen)、Command 0x03E9、Payload、Checksum；bodyLen = Command + Payload + Checksum。</desc>
  <rect x="0" y="0" width="740" height="290" fill="rgb(245, 244, 237)"/>

  <text x="370" y="40" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">线上 TCP 字节流（以 Hello 为例）</text>

  <rect x="60" y="72" width="620" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <line x1="150" y1="72" x2="150" y2="128" stroke="#185FA5" stroke-width="1"/>
  <line x1="270" y1="72" x2="270" y2="128" stroke="#185FA5" stroke-width="1"/>
  <line x1="380" y1="72" x2="380" y2="128" stroke="#185FA5" stroke-width="1"/>
  <line x1="560" y1="72" x2="560" y2="128" stroke="#185FA5" stroke-width="1"/>

  <text x="105" y="92" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Magic</text>
  <text x="105" y="112" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">0xFEFF</text>
  <text x="210" y="92" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Length</text>
  <text x="210" y="112" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">bodyLen</text>
  <text x="325" y="92" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Command</text>
  <text x="325" y="112" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">0x03E9</text>
  <text x="470" y="92" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Payload</text>
  <text x="470" y="112" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">123456\nAlice</text>
  <text x="620" y="92" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Checksum</text>
  <text x="620" y="112" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">sum</text>

  <text x="105" y="146" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">2 字节</text>
  <text x="210" y="146" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">4 字节</text>
  <text x="325" y="146" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">2 字节</text>
  <text x="470" y="146" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">N 字节</text>
  <text x="620" y="146" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">2 字节</text>

  <path d="M270 170 L270 176 L680 176 L680 170" fill="none" stroke="#854F0B" stroke-width="1.5"/>
  <text x="475" y="192" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">bodyLen = N + 2 + 2（Command + Payload + Checksum）</text>

  <text x="370" y="226" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">Command 0x03E9 = 1001（Hello）</text>
  <text x="370" y="246" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">Checksum = 逐字节累加 Payload 的 WORD 值</text>
</svg>
