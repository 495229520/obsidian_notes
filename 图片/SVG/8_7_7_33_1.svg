<text x="64" y="342" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">读／处理 D 字节</text>
<rect x="432" y="262" width="335" height="122" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="448" y="282" width="4" height="28" rx="2" fill="#345AC9"/>
