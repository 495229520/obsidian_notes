<rect x="42" y="462" width="335" height="155" rx="14" fill="#E7F1EC" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="58" y="482" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="74" y="505" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">存储端</text>
<text x="64" y="542" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">读／处理约 sB</text>
<text x="64" y="571" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">另有元数据与代数运算</text>
<text x="64" y="600" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">逻辑读取不等于物理读取。</text>
<rect x="432" y="462" width="335" height="155" rx="14" fill="#E7F1EC" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="448" y="482" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="464" y="505" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">网络</text>
<text x="454" y="542" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">发送 challenge + proof</text>
<text x="454" y="571" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">大小依赖方案与参数</text>
<text x="454" y="600" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">不是所有方案都只发几十字节。</text>
<rect x="822" y="462" width="336" height="155" rx="14" fill="#E7F1EC" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="838" y="482" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="854" y="505" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">验证端</text>
<text x="844" y="542" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">保留可信验证元数据</text>
<text x="844" y="571" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">执行相应的证明检查</text>
<text x="844" y="600" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">不是下载全文后重新 Hash。</text>
<path d="M382 539 L426 539" fill="none" stroke="#127B6A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M772 539 L816 539" fill="none" stroke="#127B6A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="42" y="654" width="1116" height="81" rx="12" fill="#F8EEDB"/>
<text x="64" y="684" fill="#9A641B" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">真正恢复仍需取得足够的数据并解码；短证明不包含一份可凭空展开的 PB 文件。</text>
