<rect x="0" y="0" width="1200" height="800" rx="0" fill="rgb(245, 244, 237)"/>
<text x="42" y="35" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" text-anchor="start">8 · 7 · 7 · 33 · 1</text>
<text x="42" y="81" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" text-anchor="start">“少传数据”与“少读数据”是两本账</text>
<text x="42" y="119" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">设存储表示为 D 字节；每轮挑战 s 个块，每块 B 字节。</text>
<path d="M42 141 L1158 141" fill="none" stroke="#D1D7DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
