<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/>
    </marker>
  </defs>

  <title>发送方的滑动窗口：四个区与 rwnd 的约束</title>
  <desc>上半部分把发送队列切成"已确认""已发送未确认""可立即发送""还不能发"四个区，标出 SND.UNA、SND.NXT 和窗口右边界；下半部分对比窗口右滑与被 rwnd 压窄两种情况。</desc>

  <rect x="0" y="0" width="1240" height="620" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">发送方的滑动窗口：四个区，和 rwnd 怎么约束它</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">窗口里装的是"现在就允许发出去"的字节；窗口外的字节要么已经确认完，要么还没拿到许可</text>

  <!-- ===================== Panel A ===================== -->
  <rect x="48" y="104" width="1144" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 一条发送队列上的四个区</text>

  <!-- window bracket -->
  <path d="M346,168 L346,158 L886,158 L886,168" fill="none" stroke="#5A564B" stroke-width="1.4"/>
  <rect x="470" y="140" width="292" height="18" fill="#FBFBF6"/>
  <text x="616" y="153" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">发送窗口 = min(rwnd, cwnd)</text>

  <!-- bar regions -->
  <rect x="130" y="176" width="216" height="44" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="346" y="176" width="324" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="670" y="176" width="216" height="44" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="886" y="176" width="216" height="44" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- cell separators -->
  <line x1="184" y1="176" x2="184" y2="220" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="238" y1="176" x2="238" y2="220" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="292" y1="176" x2="292" y2="220" stroke="#C9C5B8" stroke-width="0.8"/>
  <line x1="400" y1="176" x2="400" y2="220" stroke="#B9C7D8" stroke-width="0.8"/>
  <line x1="454" y1="176" x2="454" y2="220" stroke="#B9C7D8" stroke-width="0.8"/>
  <line x1="508" y1="176" x2="508" y2="220" stroke="#B9C7D8" stroke-width="0.8"/>
  <line x1="562" y1="176" x2="562" y2="220" stroke="#B9C7D8" stroke-width="0.8"/>
  <line x1="616" y1="176" x2="616" y2="220" stroke="#B9C7D8" stroke-width="0.8"/>
  <line x1="724" y1="176" x2="724" y2="220" stroke="#B4CDC3" stroke-width="0.8"/>
  <line x1="778" y1="176" x2="778" y2="220" stroke="#B4CDC3" stroke-width="0.8"/>
  <line x1="832" y1="176" x2="832" y2="220" stroke="#B4CDC3" stroke-width="0.8"/>
  <line x1="940" y1="176" x2="940" y2="220" stroke="#DEDACD" stroke-width="0.8"/>
  <line x1="994" y1="176" x2="994" y2="220" stroke="#DEDACD" stroke-width="0.8"/>
  <line x1="1048" y1="176" x2="1048" y2="220" stroke="#DEDACD" stroke-width="0.8"/>

  <!-- region labels -->
  <text x="238" y="244" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">① 已发送、已确认</text>
  <text x="238" y="262" font-size="9.5" fill="#8A8578" text-anchor="middle">可以从发送缓冲区丢掉了</text>
  <text x="508" y="244" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">② 已发送、未确认</text>
  <text x="508" y="262" font-size="9.5" fill="#8A8578" text-anchor="middle">还在网络里飞，等 ACK</text>
  <text x="778" y="244" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">③ 可以立即发送</text>
  <text x="778" y="262" font-size="9.5" fill="#8A8578" text-anchor="middle">窗口剩下的额度</text>
  <text x="994" y="244" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">④ 还不能发</text>
  <text x="994" y="262" font-size="9.5" fill="#8A8578" text-anchor="middle">等窗口右滑才轮得到</text>

  <!-- pointers -->
  <line x1="346" y1="170" x2="346" y2="284" stroke="#3D5A80" stroke-width="2.2"/>
  <line x1="670" y1="170" x2="670" y2="284" stroke="#2F6B5E" stroke-width="2.2"/>
  <line x1="886" y1="170" x2="886" y2="284" stroke="#B07D2B" stroke-width="2.2"/>
  <text x="346" y="300" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">SND.UNA</text>
  <text x="346" y="316" font-size="9" fill="#8A8578" text-anchor="middle">最早的未确认字节</text>
  <text x="670" y="300" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">SND.NXT</text>
  <text x="670" y="316" font-size="9" fill="#8A8578" text-anchor="middle">下一个要发的字节</text>
  <text x="886" y="300" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">SND.UNA + 窗口</text>
  <text x="886" y="316" font-size="9" fill="#8A8578" text-anchor="middle">窗口右边界</text>

  <text x="72" y="340" font-size="11" fill="#6B675C">①②的分界由 ACK 推动，③④的分界由接收方通告的窗口决定。应用层 write 进来的数据只是排到④后面去，并不代表马上就能上路</text>

  <!-- ===================== Panel B ===================== -->
  <rect x="48" y="374" width="1144" height="200" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <line x1="620" y1="390" x2="620" y2="558" stroke="#E3E0D6" stroke-width="1"/>

  <!-- left: slide right -->
  <text x="72" y="400" font-size="13" font-weight="700" fill="#4A473F">① 收到新 ACK → 窗口整体右滑</text>
  <path d="M180,436 L180,428 L370,428 L370,436" fill="none" stroke="#9B968A" stroke-width="1.2"/>
  <text x="275" y="422" font-size="9.5" fill="#8A8578" text-anchor="middle">旧窗口（5）</text>
  <rect x="104" y="442" width="76" height="32" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="180" y="442" width="76" height="32" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="256" y="442" width="190" height="32" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="446" y="442" width="38" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="218" y="462" font-size="9.5" font-weight="700" fill="#6B4E28" text-anchor="middle">刚被确认</text>
  <path d="M256,488 L256,496 L446,496 L446,488" fill="none" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="351" y="510" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">新窗口（还是 5）</text>
  <text x="72" y="534" font-size="10.5" fill="#4A473F">ACK 确认掉左边 2 个单位，左边界前移 2</text>
  <text x="72" y="554" font-size="10.5" fill="#4A473F">右边界 = 左边界 + 通告窗口，跟着前移 2，宽度不变</text>

  <!-- right: shrink -->
  <text x="668" y="400" font-size="13" font-weight="700" fill="#4A473F">② rwnd 变小 → 窗口被压窄</text>
  <path d="M776,436 L776,428 L966,428 L966,436" fill="none" stroke="#9B968A" stroke-width="1.2"/>
  <text x="871" y="422" font-size="9.5" fill="#8A8578" text-anchor="middle">旧窗口（5）</text>
  <rect x="700" y="442" width="76" height="32" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="776" y="442" width="76" height="32" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="852" y="442" width="114" height="32" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="966" y="442" width="114" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="814" y="462" font-size="9.5" font-weight="700" fill="#6B4E28" text-anchor="middle">刚被确认</text>
  <path d="M852,488 L852,496 L966,496 L966,488" fill="none" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="909" y="510" font-size="9.5" font-weight="700" fill="#733428" text-anchor="middle">新窗口（3）</text>
  <text x="668" y="534" font-size="10.5" fill="#4A473F">左边界照常前移 2，但接收方把通告窗口从 5 降到 3</text>
  <text x="668" y="554" font-size="10.5" fill="#4A473F">右边界原地不动，窗口宽度 5 → 3，这就是在踩刹车</text>

  <text x="48" y="602" font-size="11" fill="#6B675C">接收方要收窄窗口，只能靠"右边界少往前推"，不能把已经通告出去的右边界往回撤——RFC 1122 把后者叫 shrinking the window，会让对端已经合法发出的数据凭空变成越界数据</text>
</svg>
