<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<title>Descriptor：软件身份检查与硬件访问检查</title>
<desc>软件检查 owner / session / generation；RNIC 依据地址、key 与已登记的访问约束校验。。中文教学示意；状态编号与时间间距不代表实测延迟。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="690" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="49" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">Descriptor：软件身份检查与硬件访问检查</text>
<text x="48" y="79" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start">软件检查 owner / session / generation；RNIC 依据地址、key 与已登记的访问约束校验。</text>
<rect x="40" y="111" width="726" height="309" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="802" y="111" width="398" height="309" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="61" y="140" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">A · 软件授权身份</text>
<rect x="62" y="164" width="136" height="70" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="130" y="190" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="middle">owner</text>
<text x="130" y="215" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle">实例代次</text>
<rect x="198" y="164" width="136" height="70" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="266" y="190" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="middle">session</text>
<text x="266" y="215" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle">连接代次</text>
<rect x="334" y="164" width="136" height="70" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="402" y="190" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="middle">object / gen</text>
<text x="402" y="215" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle">对象代次</text>
<rect x="470" y="164" width="136" height="70" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="538" y="190" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="middle">grant</text>
<text x="538" y="215" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle">本次授权</text>
<rect x="606" y="164" width="136" height="70" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="674" y="190" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="middle">domain</text>
<text x="674" y="215" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle">访问域代次</text>
<text x="61" y="279" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">B · 设备访问字段与注册约束</text>
<rect x="62" y="300" width="226" height="66" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="175" y="326" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">base IOVA</text>
<text x="175" y="351" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle">设备地址</text>
<rect x="288" y="300" width="226" height="66" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="401" y="326" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">length / rights</text>
<text x="401" y="351" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle">访问边界</text>
<rect x="514" y="300" width="226" height="66" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="627" y="326" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">rkey</text>
<text x="627" y="351" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle">访问凭据</text>
<text x="62" y="394" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">WR 提供地址 / key；权限由已登记的 MR / MW 决定</text>
<rect x="826" y="165" width="350" height="79" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1001.0" y="199.0" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">应用提交门</text>
<text x="1001.0" y="220.0" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">对比当前权威记录</text>
<rect x="826" y="300" width="350" height="79" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1001.0" y="334.0" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">目标 RNIC</text>
<text x="1001.0" y="355.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">校验适用的硬件访问规则</text>
<line x1="747" y1="198" x2="819" y2="198" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="747" y1="333" x2="819" y2="333" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="770" y1="239" x2="820" y2="285" stroke="#A64B3C" stroke-width="1.7" stroke-dasharray="4 4"/>
<line x1="788" y1="255" x2="802" y2="269" stroke="#A64B3C" stroke-width="2.5"/>
<line x1="788" y1="269" x2="802" y2="255" stroke="#A64B3C" stroke-width="2.5"/>
<text x="829" y="276" font-size="13" fill="#733428" font-weight="400" text-anchor="start">generation 不自动成为硬件 ACL</text>
<text x="50" y="459" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">C · 三种变化，三个不同动作</text>
<rect x="49" y="478" width="1140" height="40" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="67" y="504" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">slot 换用途</text>
<text x="411" y="504" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">object generation 更新</text>
<text x="785" y="504" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">旧 grant 先退休</text>
<rect x="49" y="519" width="1140" height="40" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="67" y="545" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">连接重建</text>
<text x="411" y="545" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">session epoch 更新</text>
<text x="785" y="545" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">重新交换 / 激活 descriptor</text>
<rect x="49" y="560" width="1140" height="40" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="67" y="586" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">设备 / PD 重建</text>
<text x="411" y="586" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">domain epoch 更新</text>
<text x="785" y="586" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">本地注册缓存也失效</text>
<line x1="48" y1="625" x2="1192" y2="625" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="654" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">rkey 是不透明的 32 位接口值；不要把设备内部版本位当成永不重复的业务 generation。</text>
</svg>