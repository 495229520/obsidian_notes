<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<title>最小正确性闭环：GPU 写，GPU 验，主机只回报结果</title>
<desc>32 轮 × 1 MiB · 单个在途 payload · 三种显式路径</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="690" fill="#F5F4ED"/>
<text x="48" y="49" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">最小正确性闭环：GPU 写，GPU 验，主机只回报结果</text>
<text x="48" y="78" font-size="13" fill="#6B675C" text-anchor="start">32 轮 × 1 MiB · 单个在途 payload · 三种显式路径</text>
<rect x="58" y="111" width="230" height="44" rx="8" fill="#EDEAF3" stroke="#88749B" stroke-width="1.3"/>
<text x="173.0" y="138.0" font-size="13" fill="#6B5B95" text-anchor="middle" font-weight="700">发送 GPU</text>
<line x1="173" y1="170" x2="173" y2="580" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="346" y="111" width="230" height="44" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="461.0" y="138.0" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">发送主机 / RNIC</text>
<line x1="461" y1="170" x2="461" y2="580" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="664" y="111" width="230" height="44" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="779.0" y="138.0" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">接收主机 / RNIC</text>
<line x1="779" y1="170" x2="779" y2="580" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="952" y="111" width="230" height="44" rx="8" fill="#EDEAF3" stroke="#88749B" stroke-width="1.3"/>
<text x="1067.0" y="138.0" font-size="13" fill="#6B5B95" text-anchor="middle" font-weight="700">接收 GPU</text>
<line x1="1067" y1="170" x2="1067" y2="580" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="64" y="181" width="218" height="49" rx="8" fill="#EDEAF3" stroke="#88749B" stroke-width="1.3"/>
<text x="173.0" y="200.5" font-size="13" fill="#6B5B95" text-anchor="middle" font-weight="700">fill_data(round)</text>
<text x="173.0" y="220.5" font-size="12" fill="#6B5B95" text-anchor="middle">round + word index</text>
<line x1="285" y1="205" x2="453" y2="205" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="310" y="194" font-size="12" fill="#2B2A26" text-anchor="start">producer sync</text>
<line x1="468" y1="269" x2="771" y2="269" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="620" y="255" font-size="13" fill="#2B2A26" text-anchor="middle" font-weight="700">SEND payload</text>
<text x="789" y="242" font-size="12" fill="#6B675C" text-anchor="start">先 post_recv</text>
<rect x="667" y="291" width="224" height="51" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="779.0" y="311.5" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">IBV_WC_RECV</text>
<text x="779.0" y="331.5" font-size="12" fill="#2C4460" text-anchor="middle">status + length + wr_id</text>
<line x1="894" y1="316" x2="1059" y2="316" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="902" y="302" font-size="12" fill="#2B2A26" text-anchor="start">必要时 flush</text>
<rect x="958" y="359" width="218" height="56" rx="8" fill="#EDEAF3" stroke="#88749B" stroke-width="1.3"/>
<text x="1067.0" y="382.0" font-size="13" fill="#6B5B95" text-anchor="middle" font-weight="700">verify_data(round)</text>
<text x="1067.0" y="402.0" font-size="12" fill="#6B5B95" text-anchor="middle">逐 word 比较</text>
<line x1="1059" y1="441" x2="787" y2="441" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="925" y="430" font-size="12" fill="#2B2A26" text-anchor="middle">GPU 完成 + mismatch 数</text>
<line x1="771" y1="492" x2="469" y2="492" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="620" y="480" font-size="13" fill="#2B2A26" text-anchor="middle" font-weight="700">ACK(round, errors)</text>
<path d="M453,515 L390,515 L390,548 L181,548" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="275" y="538" font-size="12" fill="#2B2A26" text-anchor="middle">ACK 后下一轮复用</text>
<rect x="58" y="586" width="1118" height="28" rx="5" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="617" y="605" font-size="12" fill="#6B4E28" text-anchor="middle">CORRUPT=1：第二轮翻转一位；期望非零退出，而不是最终 PASS</text>
<line x1="48" y1="629" x2="1192" y2="629" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="659" font-size="12" fill="#6B675C" text-anchor="start">8.12 / SEND–RECV 实验</text>
<text x="1192" y="659" font-size="12" fill="#6B675C" text-anchor="end">不是 one-sided WRITE 的远端提交证明</text>
</svg>