<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A3F68"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">NVMe 命令模型：一条读命令的一生</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">命令 = 64 B 描述（SQE），完成 = 16 B 回执（CQE）；数据搬运全程 DMA，MMIO 只有一次门铃写、零次读</text>

  <!-- 主机容器 -->
  <rect x="48" y="106" width="578" height="478" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="68" y="132" font-size="13" font-weight="700" fill="#4A473F">主机（CPU + DRAM）</text>

  <!-- CPU / 驱动 -->
  <rect x="76" y="150" width="230" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="191" y="172" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">CPU · NVMe 驱动</text>
  <text x="191" y="190" font-size="10.5" fill="#2C4460" text-anchor="middle">blk-mq 之下（1.7）</text>

  <!-- 主机 DRAM -->
  <rect x="76" y="226" width="522" height="336" rx="8" fill="#FBFAF5" stroke="#B9B4A4" stroke-width="1.2"/>
  <text x="92" y="250" font-size="12" font-weight="700" fill="#6B675C">主机 DRAM</text>

  <!-- SQ 环 -->
  <text x="92" y="282" font-size="11.5" font-weight="700" fill="#24473F">SQ 提交环 · 每槽 64 B</text>
  <rect x="92"  y="292" width="48" height="38" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="140" y="292" width="48" height="38" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="188" y="292" width="48" height="38" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="236" y="292" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="284" y="292" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="332" y="292" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="380" y="292" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="428" y="292" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="116" y="315" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SQE</text>
  <text x="164" y="315" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SQE</text>
  <text x="212" y="315" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SQE</text>
  <text x="240" y="346" font-size="10" fill="#6B675C">↑ tail：主机推进，敲门铃发布（3.2）</text>

  <!-- CQ 环 -->
  <text x="92" y="396" font-size="11.5" font-weight="700" fill="#24473F">CQ 完成环 · 每槽 16 B</text>
  <rect x="92"  y="406" width="48" height="38" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="140" y="406" width="48" height="38" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="188" y="406" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="236" y="406" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="284" y="406" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="332" y="406" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="380" y="406" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="428" y="406" width="48" height="38" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="116" y="429" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">CQE</text>
  <text x="164" y="429" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">CQE</text>
  <text x="92" y="460" font-size="10.5" fill="#4A473F">⑧ 收割：读下一槽 phase 位（自家 DRAM）→ CID 对号 → 查 status</text>

  <!-- 数据 buffer -->
  <rect x="92" y="486" width="384" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="284" y="508" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">数据 buffer（页对齐）</text>
  <text x="284" y="526" font-size="10.5" fill="#2C4460" text-anchor="middle">O_DIRECT 时就是用户态内存——DMA 直达，零拷贝</text>

  <!-- PCIe 分界 -->
  <line x1="651" y1="110" x2="651" y2="584" stroke="#B9B4A4" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="638" y="600" font-size="11" fill="#6B675C">PCIe</text>

  <!-- 设备容器 -->
  <rect x="676" y="106" width="516" height="478" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="696" y="132" font-size="13" font-weight="700" fill="#4A473F">NVMe SSD（控制器 + NAND）</text>

  <!-- 门铃寄存器 -->
  <rect x="704" y="150" width="236" height="60" rx="7" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="822" y="172" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">BAR0 门铃寄存器（MMIO）</text>
  <text x="822" y="192" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#733428" text-anchor="middle">SQ Tail / CQ Head Doorbell</text>

  <!-- 取命令 -->
  <rect x="704" y="246" width="236" height="56" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="822" y="268" font-size="13" font-weight="700" fill="#4A3F68" text-anchor="middle">取命令 · 解码 · 调度</text>
  <text x="822" y="288" font-size="10.5" fill="#4A3F68" text-anchor="middle">从 SQ 批量取回待办 SQE</text>

  <!-- DMA 引擎 -->
  <rect x="704" y="336" width="236" height="52" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="822" y="357" font-size="13" font-weight="700" fill="#4A3F68" text-anchor="middle">DMA 引擎</text>
  <text x="822" y="375" font-size="10.5" fill="#4A3F68" text-anchor="middle">搬数据、写 CQE——不烦 CPU</text>

  <!-- NAND 并行 -->
  <text x="970" y="262" font-size="11.5" font-weight="700" fill="#4A3F68">通道 × 裸片（并行）</text>
  <rect x="970"  y="274" width="100" height="44" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.2"/>
  <rect x="1078" y="274" width="100" height="44" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.2"/>
  <rect x="970"  y="326" width="100" height="44" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.2"/>
  <rect x="1078" y="326" width="100" height="44" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.2"/>
  <text x="1020" y="300" font-size="10.5" fill="#4A3F68" text-anchor="middle">通道0·裸片</text>
  <text x="1128" y="300" font-size="10.5" fill="#4A3F68" text-anchor="middle">通道1·裸片</text>
  <text x="1020" y="352" font-size="10.5" fill="#4A3F68" text-anchor="middle">通道2·裸片</text>
  <text x="1128" y="352" font-size="10.5" fill="#4A3F68" text-anchor="middle">通道3·裸片</text>
  <text x="970" y="398" font-size="10.5" fill="#6B675C">闪存读 ~几十 μs【量级】</text>
  <text x="970" y="414" font-size="10.5" fill="#6B675C">——整条链路的时间大头</text>

  <!-- ① 填 SQE -->
  <line x1="191" y1="206" x2="191" y2="288" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="205" y="250" font-size="11" fill="#4A473F">① 填 SQE：普通 DRAM 写</text>

  <!-- ② 门铃 -->
  <line x1="306" y1="176" x2="700" y2="176" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="340" y="168" font-size="11" fill="#733428">② MMIO 写 SQ Tail Doorbell（posted，不停等）</text>

  <!-- ③ DMA 取 SQE -->
  <line x1="476" y1="308" x2="700" y2="272" stroke="#4A3F68" stroke-width="1.5" marker-start="url(#arrP)"/>
  <text x="500" y="296" font-size="11" fill="#4A3F68">③ 设备 DMA 取走 SQE</text>

  <!-- ④ 派发 -->
  <line x1="940" y1="274" x2="966" y2="292" stroke="#4A3F68" stroke-width="1.5" marker-end="url(#arrP)"/>
  <text x="884" y="240" font-size="10.5" fill="#4A3F68">④ 派发到通道/裸片</text>

  <!-- ⑤ DMA 写数据 -->
  <polyline points="760,388 760,514 480,514" fill="none" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="530" y="506" font-size="11" fill="#24473F">⑤ DMA 写数据 → 主机 buffer（CPU 不参与）</text>

  <!-- ⑥ DMA 写 CQE -->
  <polyline points="704,352 620,352 620,425 480,425" fill="none" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="486" y="416" font-size="11" fill="#24473F">⑥ DMA 写 CQE ＋ 翻转 phase 位</text>

  <!-- ⑦ MSI-X -->
  <polyline points="740,150 740,140 250,140 250,150" fill="none" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="380" y="133" font-size="11" fill="#733428">⑦ MSI-X 中断（信号；也可轮询）</text>

  <!-- ⑧ 收割路径 -->
  <polyline points="76,196 64,196 64,425 88,425" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SQE 剖面 -->
  <text x="48" y="622" font-size="13" font-weight="700" fill="#2B2A26">SQE 剖面——64 字节命令描述：只带描述与指针，不带数据</text>
  <rect x="48"  y="634" width="78"  height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="126" y="634" width="96"  height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="222" y="634" width="84"  height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="306" y="634" width="120" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="426" y="634" width="120" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="546" y="634" width="110" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="656" y="634" width="80"  height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="736" y="634" width="120" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="87"  y="658" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">CID</text>
  <text x="174" y="658" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">opcode</text>
  <text x="264" y="658" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">NSID</text>
  <text x="366" y="658" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">PRP1</text>
  <text x="486" y="658" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">PRP2</text>
  <text x="601" y="658" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SLBA</text>
  <text x="696" y="658" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">NLB</text>
  <text x="796" y="658" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">其余 CDW</text>
  <text x="87"  y="692" font-size="10" fill="#6B675C" text-anchor="middle">完成对号</text>
  <text x="174" y="692" font-size="10" fill="#6B675C" text-anchor="middle">Read=02h</text>
  <text x="264" y="692" font-size="10" fill="#6B675C" text-anchor="middle">命名空间</text>
  <text x="366" y="692" font-size="10" fill="#6B675C" text-anchor="middle">数据页物理指针</text>
  <text x="486" y="692" font-size="10" fill="#6B675C" text-anchor="middle">第二页 / 页列表</text>
  <text x="601" y="692" font-size="10" fill="#6B675C" text-anchor="middle">起始逻辑块</text>
  <text x="696" y="692" font-size="10" fill="#6B675C" text-anchor="middle">块数−1</text>
  <text x="796" y="692" font-size="10" fill="#6B675C" text-anchor="middle">其余参数</text>

  <!-- CQE 剖面 -->
  <text x="48" y="740" font-size="13" font-weight="700" fill="#2B2A26">CQE 剖面——16 字节完成回执：回执还捎带流控</text>
  <rect x="48"  y="752" width="100" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="148" y="752" width="80"  height="40" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.2"/>
  <rect x="228" y="752" width="110" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="338" y="752" width="80"  height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="418" y="752" width="80"  height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="498" y="752" width="130" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="98"  y="776" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">DW0</text>
  <text x="188" y="776" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#9B968A" text-anchor="middle">保留</text>
  <text x="283" y="776" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SQ Head</text>
  <text x="378" y="776" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SQ ID</text>
  <text x="458" y="776" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">CID</text>
  <text x="563" y="776" font-size="11" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">Status＋P</text>
  <text x="98"  y="810" font-size="10" fill="#6B675C" text-anchor="middle">命令相关结果</text>
  <text x="283" y="810" font-size="10" fill="#6B675C" text-anchor="middle">设备消费进度</text>
  <text x="378" y="810" font-size="10" fill="#6B675C" text-anchor="middle">哪条队列</text>
  <text x="458" y="810" font-size="10" fill="#6B675C" text-anchor="middle">对号</text>
  <text x="563" y="810" font-size="10" fill="#6B675C" text-anchor="middle">状态码＋相位位</text>

  <!-- 一眼对账 -->
  <rect x="900" y="614" width="292" height="210" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="920" y="642" font-size="12.5" font-weight="700" fill="#4A473F">一眼对账</text>
  <text x="920" y="670" font-size="11" fill="#4A473F">CPU 参与：仅 ① ② ⑧</text>
  <text x="920" y="696" font-size="11" fill="#4A473F">数据搬运：③⑤⑥ 全部 DMA</text>
  <text x="920" y="722" font-size="11" fill="#4A473F">MMIO：仅 ② 一次写，0 次读</text>
  <text x="920" y="748" font-size="11" fill="#4A473F">完成天然乱序：靠 CID 对号</text>
  <text x="920" y="774" font-size="11" fill="#4A473F">设备段（④）~几十 μs 是大头</text>
  <text x="920" y="800" font-size="11" fill="#4A473F">协议瘦身，瘦的是主机侧开销</text>
</svg>
