<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000px" height="620px" viewBox="0 0 1000 620" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f4f5f"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #1f2933; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; fill: #56677a; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #1f2933; }
      .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; fill: #43505f; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1f2933; }
      .nodeText { font-family: Menlo, Consolas, monospace; font-size: 22px; font-weight: 800; fill: #1f2933; }
    </style>
  </defs>

  <text x="500" y="38" text-anchor="middle" dominant-baseline="middle" class="title">二叉树遍历：根、左、右的访问顺序</text>
  <text x="500" y="68" text-anchor="middle" dominant-baseline="middle" class="subtitle">同一棵树，改变访问时机，就得到前序 / 中序 / 后序；按层推进就是层序遍历</text>

  <rect x="80" y="96" width="420" height="310" rx="18" ry="18" fill="#fbfaf5" stroke="#c5bda8" stroke-width="2"/>
  <text x="290" y="124" text-anchor="middle" dominant-baseline="middle" class="label">示例二叉树</text>

  <line x1="290" y1="168" x2="200" y2="230" stroke="#3f4f5f" stroke-width="3"/>
  <line x1="290" y1="168" x2="380" y2="230" stroke="#3f4f5f" stroke-width="3"/>
  <line x1="200" y1="230" x2="150" y2="306" stroke="#3f4f5f" stroke-width="3"/>
  <line x1="200" y1="230" x2="250" y2="306" stroke="#3f4f5f" stroke-width="3"/>
  <line x1="380" y1="230" x2="330" y2="306" stroke="#3f4f5f" stroke-width="3"/>
  <line x1="380" y1="230" x2="430" y2="306" stroke="#3f4f5f" stroke-width="3"/>

  <circle cx="290" cy="168" r="28" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2.5"/>
  <circle cx="200" cy="230" r="28" fill="#eef8ef" stroke="#6f9678" stroke-width="2.5"/>
  <circle cx="380" cy="230" r="28" fill="#fff1c7" stroke="#b7872f" stroke-width="2.5"/>
  <circle cx="150" cy="306" r="28" fill="#f2e8ff" stroke="#8a6bb8" stroke-width="2.5"/>
  <circle cx="250" cy="306" r="28" fill="#f2e8ff" stroke="#8a6bb8" stroke-width="2.5"/>
  <circle cx="330" cy="306" r="28" fill="#f2e8ff" stroke="#8a6bb8" stroke-width="2.5"/>
  <circle cx="430" cy="306" r="28" fill="#f2e8ff" stroke="#8a6bb8" stroke-width="2.5"/>

  <text x="290" y="168" text-anchor="middle" dominant-baseline="middle" class="nodeText">A</text>
  <text x="200" y="230" text-anchor="middle" dominant-baseline="middle" class="nodeText">B</text>
  <text x="380" y="230" text-anchor="middle" dominant-baseline="middle" class="nodeText">C</text>
  <text x="150" y="306" text-anchor="middle" dominant-baseline="middle" class="nodeText">D</text>
  <text x="250" y="306" text-anchor="middle" dominant-baseline="middle" class="nodeText">E</text>
  <text x="330" y="306" text-anchor="middle" dominant-baseline="middle" class="nodeText">F</text>
  <text x="430" y="306" text-anchor="middle" dominant-baseline="middle" class="nodeText">G</text>

  <rect x="105" y="348" width="370" height="40" rx="10" ry="10" fill="#eef2f7" stroke="#b8c1cc" stroke-width="1.5"/>
  <text x="290" y="369" text-anchor="middle" dominant-baseline="middle" class="small">根节点 A；叶子节点 D / E / F / G；高度为 3 层</text>

  <rect x="540" y="96" width="380" height="310" rx="18" ry="18" fill="#fbfaf5" stroke="#c5bda8" stroke-width="2"/>
  <text x="730" y="124" text-anchor="middle" dominant-baseline="middle" class="label">四种遍历结果</text>

  <rect x="575" y="154" width="310" height="44" rx="10" ry="10" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/>
  <text x="600" y="176" dominant-baseline="middle" class="label" fill="#324a82">前序</text>
  <text x="670" y="176" dominant-baseline="middle" class="mono">A B D E C F G</text>

  <rect x="575" y="214" width="310" height="44" rx="10" ry="10" fill="#eef8ef" stroke="#6f9678" stroke-width="2"/>
  <text x="600" y="236" dominant-baseline="middle" class="label" fill="#244c2e">中序</text>
  <text x="670" y="236" dominant-baseline="middle" class="mono">D B E A F C G</text>

  <rect x="575" y="274" width="310" height="44" rx="10" ry="10" fill="#fff1c7" stroke="#b7872f" stroke-width="2"/>
  <text x="600" y="296" dominant-baseline="middle" class="label" fill="#6a4817">后序</text>
  <text x="670" y="296" dominant-baseline="middle" class="mono">D E B F G C A</text>

  <rect x="575" y="334" width="310" height="44" rx="10" ry="10" fill="#f2e8ff" stroke="#8a6bb8" stroke-width="2"/>
  <text x="600" y="356" dominant-baseline="middle" class="label" fill="#563a7c">层序</text>
  <text x="670" y="356" dominant-baseline="middle" class="mono">A B C D E F G</text>

  <path d="M500 250 C515 250 525 250 540 250" fill="none" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="80" y="444" width="840" height="130" rx="18" ry="18" fill="#d8f0df" stroke="#598765" stroke-width="2"/>
  <text x="500" y="474" text-anchor="middle" dominant-baseline="middle" class="label" fill="#244c2e">记忆方式</text>
  <text x="128" y="510" class="small">前序：根在前，适合复制 / 序列化树结构</text>
  <text x="128" y="540" class="small">中序：二叉搜索树中序遍历得到升序序列</text>
  <text x="548" y="510" class="small">后序：根在后，适合删除树 / 统计子树信息</text>
  <text x="548" y="540" class="small">层序：按层访问，适合 BFS / 最短层数问题</text>
</svg>
