<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>cwnd 的锯齿曲线：慢启动、拥塞避免、快恢复与超时</title>
  <desc>以 cwnd 初值 1 MSS、ssthresh 初值 8 MSS 为例，画出 14 个 RTT 轮次里 cwnd 的完整变化：指数增长到门限后转线性，遇到 3 个重复 ACK 减半，遇到超时打回 1 MSS 重新慢启动。</desc>

  <rect x="0" y="0" width="1240" height="660" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">cwnd 的锯齿曲线：从 1 MSS 到 11 MSS，再被两次打回去</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">初值 cwnd = 1 MSS、ssthresh = 8 MSS；纵轴单位是 MSS，横轴是 RTT 轮次</text>

  <!-- event flags -->
  <rect x="505" y="104" width="210" height="44" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="610" y="122" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">3 个重复 ACK</text>
  <text x="610" y="139" font-size="10" fill="#733428" text-anchor="middle">ssthresh = 11/2 → 5，cwnd 减半</text>
  <line x1="610" y1="148" x2="629" y2="162" stroke="#A64B3C" stroke-width="1.2"/>

  <rect x="740" y="104" width="205" height="44" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="842" y="122" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">超时（RTO）</text>
  <text x="842" y="139" font-size="10" fill="#733428" text-anchor="middle">ssthresh = 7/2 → 3，cwnd = 1</text>
  <line x1="842" y1="148" x2="827" y2="162" stroke="#A64B3C" stroke-width="1.2"/>

  <!-- phase bands behind plot -->
  <rect x="200" y="160" width="198" height="360" fill="#F2F5FA"/>
  <rect x="398" y="160" width="231" height="360" fill="#F0F6F3"/>
  <rect x="629" y="160" width="198" height="360" fill="#FAF3E6"/>
  <rect x="827" y="160" width="165" height="360" fill="#F2F5FA"/>
  <rect x="992" y="160" width="128" height="360" fill="#F0F6F3"/>

  <!-- grid -->
  <line x1="160" y1="160" x2="1120" y2="160" stroke="#E3E0D6" stroke-width="1"/>
  <line x1="160" y1="220" x2="1120" y2="220" stroke="#E3E0D6" stroke-width="1"/>
  <line x1="160" y1="280" x2="1120" y2="280" stroke="#E3E0D6" stroke-width="1"/>
  <line x1="160" y1="340" x2="1120" y2="340" stroke="#E3E0D6" stroke-width="1"/>
  <line x1="160" y1="400" x2="1120" y2="400" stroke="#E3E0D6" stroke-width="1"/>
  <line x1="160" y1="460" x2="1120" y2="460" stroke="#E3E0D6" stroke-width="1"/>

  <!-- axes -->
  <line x1="160" y1="160" x2="160" y2="520" stroke="#5A564B" stroke-width="1.4"/>
  <line x1="160" y1="520" x2="1120" y2="520" stroke="#5A564B" stroke-width="1.4"/>
  <text x="68" y="152" font-size="11.5" font-weight="700" fill="#4A473F">cwnd (MSS)</text>
  <text x="1130" y="524" font-size="11.5" font-weight="700" fill="#4A473F">RTT 轮次</text>

  <text x="148" y="164" font-size="10" fill="#6B675C" text-anchor="end">12</text>
  <text x="148" y="224" font-size="10" fill="#6B675C" text-anchor="end">10</text>
  <text x="148" y="284" font-size="10" fill="#6B675C" text-anchor="end">8</text>
  <text x="148" y="344" font-size="10" fill="#6B675C" text-anchor="end">6</text>
  <text x="148" y="404" font-size="10" fill="#6B675C" text-anchor="end">4</text>
  <text x="148" y="464" font-size="10" fill="#6B675C" text-anchor="end">2</text>
  <text x="148" y="524" font-size="10" fill="#6B675C" text-anchor="end">0</text>

  <!-- ssthresh -->
  <line x1="160" y1="280" x2="596" y2="280" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="7 5"/>
  <line x1="596" y1="280" x2="596" y2="370" stroke="#A64B3C" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="596" y1="370" x2="794" y2="370" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="7 5"/>
  <line x1="794" y1="370" x2="794" y2="430" stroke="#A64B3C" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="794" y1="430" x2="1120" y2="430" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="230" y="273" font-size="10" font-weight="700" fill="#733428">ssthresh = 8</text>
  <text x="690" y="388" font-size="10" font-weight="700" fill="#733428">ssthresh = 5</text>
  <text x="1066" y="423" font-size="10" font-weight="700" fill="#733428">ssthresh = 3</text>

  <!-- event verticals -->
  <line x1="629" y1="160" x2="629" y2="520" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="827" y1="160" x2="827" y2="520" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- cwnd curve -->
  <polyline points="200,490 266,460 332,400 398,280 464,250 530,220 596,190 662,370 728,340 794,310 860,490 926,460 992,430 1058,400"
            fill="none" stroke="#2C4460" stroke-width="2.4" stroke-linejoin="round"/>

  <circle cx="200" cy="490" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="266" cy="460" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="332" cy="400" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="398" cy="280" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="464" cy="250" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="530" cy="220" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="596" cy="190" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="662" cy="370" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="728" cy="340" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="794" cy="310" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="860" cy="490" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="926" cy="460" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="992" cy="430" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <circle cx="1058" cy="400" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>

  <!-- value labels on key points -->
  <text x="596" y="180" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">11</text>
  <text x="398" y="270" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">8</text>
  <text x="662" y="386" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">5</text>
  <text x="794" y="300" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">7</text>
  <text x="860" y="506" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">1</text>

  <!-- x ticks -->
  <text x="200" y="540" font-size="10" fill="#6B675C" text-anchor="middle">1</text>
  <text x="266" y="540" font-size="10" fill="#6B675C" text-anchor="middle">2</text>
  <text x="332" y="540" font-size="10" fill="#6B675C" text-anchor="middle">3</text>
  <text x="398" y="540" font-size="10" fill="#6B675C" text-anchor="middle">4</text>
  <text x="464" y="540" font-size="10" fill="#6B675C" text-anchor="middle">5</text>
  <text x="530" y="540" font-size="10" fill="#6B675C" text-anchor="middle">6</text>
  <text x="596" y="540" font-size="10" fill="#6B675C" text-anchor="middle">7</text>
  <text x="662" y="540" font-size="10" fill="#6B675C" text-anchor="middle">8</text>
  <text x="728" y="540" font-size="10" fill="#6B675C" text-anchor="middle">9</text>
  <text x="794" y="540" font-size="10" fill="#6B675C" text-anchor="middle">10</text>
  <text x="860" y="540" font-size="10" fill="#6B675C" text-anchor="middle">11</text>
  <text x="926" y="540" font-size="10" fill="#6B675C" text-anchor="middle">12</text>
  <text x="992" y="540" font-size="10" fill="#6B675C" text-anchor="middle">13</text>
  <text x="1058" y="540" font-size="10" fill="#6B675C" text-anchor="middle">14</text>

  <!-- phase strip -->
  <rect x="200" y="552" width="198" height="24" rx="4" fill="#F2F5FA" stroke="#3D5A80" stroke-width="1"/>
  <text x="299" y="568" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">慢启动（每轮翻倍）</text>
  <rect x="398" y="552" width="231" height="24" rx="4" fill="#F0F6F3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="513" y="568" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">拥塞避免（每轮 +1）</text>
  <rect x="629" y="552" width="198" height="24" rx="4" fill="#FAF3E6" stroke="#B07D2B" stroke-width="1"/>
  <text x="728" y="568" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">快恢复 → 拥塞避免</text>
  <rect x="827" y="552" width="165" height="24" rx="4" fill="#F2F5FA" stroke="#3D5A80" stroke-width="1"/>
  <text x="909" y="568" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">慢启动</text>
  <rect x="992" y="552" width="128" height="24" rx="4" fill="#F0F6F3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="1056" y="568" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">拥塞避免</text>

  <!-- legend -->
  <line x1="180" y1="602" x2="222" y2="602" stroke="#2C4460" stroke-width="2.4"/>
  <circle cx="201" cy="602" r="4" fill="#FBFBF6" stroke="#2C4460" stroke-width="1.6"/>
  <text x="232" y="606" font-size="10.5" fill="#4A473F">cwnd：每个 RTT 轮次结束时的值</text>
  <line x1="500" y1="602" x2="542" y2="602" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="552" y="606" font-size="10.5" fill="#4A473F">ssthresh：低于它走指数，高于它走线性</text>

  <text x="48" y="640" font-size="11" fill="#6B675C">同样是丢包，3 个重复 ACK 只把 cwnd 砍到一半就转入线性增长，超时却直接打回 1 MSS 重新爬——这就是 TCP 对两种信号严重程度的判断差别</text>
</svg>
