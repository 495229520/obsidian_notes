<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000px" height="560px" viewBox="0 0 1000 560" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f4f5f"/>
    </marker>
  </defs>

  <text x="500" y="38" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="28" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">中心扩展法：从中心向两边找最长回文</text>

  <rect x="120" y="76" width="760" height="128" rx="16" ry="16" fill="#fbfaf5" stroke="#c5bda8" stroke-width="2"/>
  <text x="500" y="108" text-anchor="middle" dominant-baseline="middle" fill="#43505f" font-size="21" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">输入字符串 s = "babad"</text>

  <g font-family="Menlo, Consolas, monospace" text-anchor="middle" dominant-baseline="middle" font-weight="700">
    <rect x="340" y="132" width="64" height="46" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/>
    <rect x="404" y="132" width="64" height="46" fill="#fff1c7" stroke="#b7872f" stroke-width="2"/>
    <rect x="468" y="132" width="64" height="46" fill="#fff1c7" stroke="#b7872f" stroke-width="3"/>
    <rect x="532" y="132" width="64" height="46" fill="#fff1c7" stroke="#b7872f" stroke-width="2"/>
    <rect x="596" y="132" width="64" height="46" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2"/>
    <text x="372" y="155" fill="#1f2933" font-size="24">b</text>
    <text x="436" y="155" fill="#1f2933" font-size="24">a</text>
    <text x="500" y="155" fill="#1f2933" font-size="24">b</text>
    <text x="564" y="155" fill="#1f2933" font-size="24">a</text>
    <text x="628" y="155" fill="#1f2933" font-size="24">d</text>
    <text x="372" y="192" fill="#56677a" font-size="15">0</text>
    <text x="436" y="192" fill="#56677a" font-size="15">1</text>
    <text x="500" y="192" fill="#56677a" font-size="15">2</text>
    <text x="564" y="192" fill="#56677a" font-size="15">3</text>
    <text x="628" y="192" fill="#56677a" font-size="15">4</text>
  </g>

  <line x1="500" y1="206" x2="500" y2="246" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="538" y="228" fill="#56677a" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">枚举中心 i = 2</text>

  <rect x="92" y="270" width="360" height="142" rx="16" ry="16" fill="#e8f3ff" stroke="#6c82aa" stroke-width="2.2"/>
  <text x="272" y="302" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">奇数长度中心</text>
  <text x="272" y="336" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="20" font-weight="700" font-family="Menlo, Consolas, monospace">expand(i, i)</text>
  <text x="272" y="366" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">从同一个字符向两边扩展</text>
  <text x="272" y="394" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="21" font-weight="800" font-family="Menlo, Consolas, monospace">得到 "bab"</text>

  <rect x="548" y="270" width="360" height="142" rx="16" ry="16" fill="#fff1c7" stroke="#b7872f" stroke-width="2.2"/>
  <text x="728" y="302" text-anchor="middle" dominant-baseline="middle" fill="#6a4817" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">偶数长度中心</text>
  <text x="728" y="336" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="20" font-weight="700" font-family="Menlo, Consolas, monospace">expand(i, i + 1)</text>
  <text x="728" y="366" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">从两个字符中间向两边扩展</text>
  <text x="728" y="394" text-anchor="middle" dominant-baseline="middle" fill="#6a4817" font-size="21" font-weight="800" font-family="Menlo, Consolas, monospace">长度可能为 0 / 2 / 4...</text>

  <path d="M500 246 C430 252 335 256 286 270" fill="none" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M500 246 C570 252 665 256 714 270" fill="none" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M272 424 C336 456 414 462 456 472" fill="none" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M728 424 C664 456 586 462 544 472" fill="none" stroke="#3f4f5f" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="286" y="474" width="428" height="66" rx="16" ry="16" fill="#d8f0df" stroke="#598765" stroke-width="2.2"/>
  <text x="500" y="499" text-anchor="middle" dominant-baseline="middle" fill="#244c2e" font-size="21" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">更新最长回文区间</text>
  <text x="500" y="525" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="20" font-weight="800" font-family="Menlo, Consolas, monospace">start = i - (len - 1) / 2</text>
</svg>
