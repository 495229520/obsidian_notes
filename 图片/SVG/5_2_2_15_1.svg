<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
  <rect width="980" height="540" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .cell { fill: #eef6fb; stroke: #6f94b3; stroke-width: 1.5; rx: 6; }
      .match { fill: #dff0ea; stroke: #45907a; stroke-width: 2; rx: 6; }
      .bad { fill: #fde2df; stroke: #d36b5f; stroke-width: 2; rx: 6; }
      .active { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2; rx: 6; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .note { fill: #edf4f1; stroke: #9db7aa; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">KMP：失配时按前缀函数回退</text>
  <text x="40" y="76" class="subtitle">已匹配的前缀里，最长相等真前后缀可以继续复用，所以模式串指针不必回到 0。</text>

  <rect x="54" y="118" width="872" height="176" class="panel"/>
  <text x="82" y="152" class="label">前缀函数 pi</text>
  <g transform="translate(92,182)">
    <rect x="0" y="0" width="64" height="42" class="match"/><text x="32" y="26" text-anchor="middle" class="mono">a</text>
    <rect x="72" y="0" width="64" height="42" class="match"/><text x="104" y="26" text-anchor="middle" class="mono">b</text>
    <rect x="144" y="0" width="64" height="42" class="match"/><text x="176" y="26" text-anchor="middle" class="mono">a</text>
    <rect x="216" y="0" width="64" height="42" class="match"/><text x="248" y="26" text-anchor="middle" class="mono">b</text>
    <rect x="288" y="0" width="64" height="42" class="active"/><text x="320" y="26" text-anchor="middle" class="mono">a</text>
    <rect x="360" y="0" width="64" height="42" class="bad"/><text x="392" y="26" text-anchor="middle" class="mono">c</text>

    <text x="-34" y="82" class="small">pi</text>
    <rect x="0" y="60" width="64" height="34" class="cell"/><text x="32" y="82" text-anchor="middle" class="mono">0</text>
    <rect x="72" y="60" width="64" height="34" class="cell"/><text x="104" y="82" text-anchor="middle" class="mono">0</text>
    <rect x="144" y="60" width="64" height="34" class="cell"/><text x="176" y="82" text-anchor="middle" class="mono">1</text>
    <rect x="216" y="60" width="64" height="34" class="cell"/><text x="248" y="82" text-anchor="middle" class="mono">2</text>
    <rect x="288" y="60" width="64" height="34" class="active"/><text x="320" y="82" text-anchor="middle" class="mono">3</text>
    <rect x="360" y="60" width="64" height="34" class="bad"/><text x="392" y="82" text-anchor="middle" class="mono">0</text>
  </g>
  <text x="560" y="206" class="mono">pattern[0..4] = "ababa"</text>
  <text x="560" y="236" class="small">最长相等真前后缀是 "aba"，所以 pi[4] = 3</text>

  <rect x="54" y="326" width="872" height="126" class="panel"/>
  <text x="82" y="360" class="label">匹配阶段失配</text>
  <text x="82" y="392" class="mono">text[i] != pattern[j]</text>
  <text x="82" y="422" class="mono">j = pi[j - 1]</text>
  <path d="M 362 394 C 440 332 560 332 632 392" class="arrow"/>
  <text x="672" y="392" class="small">文本指针 i 不回退，只让模式串 j 回到可复用前缀长度</text>

  <rect x="170" y="480" width="640" height="34" class="note"/>
  <text x="490" y="502" text-anchor="middle" class="small">核心不变量：pattern[0..j-1] 已经和 text 的某段后缀匹配。</text>
</svg>
