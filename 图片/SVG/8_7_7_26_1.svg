<path d="M 716 495 V 524" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect id="spdk" x="904" y="519" width="270" height="59" rx="10" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
<text id="txt-39" x="1039.0" y="543.38" font-size="16" fill="#6B4E28" text-anchor="middle" font-weight="600" data-role="body" data-owner="spdk">SPDK</text>
<text id="txt-40" x="1039.0" y="567.38" font-size="16" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body" data-owner="spdk">Blobstore / bdev / 驱动</text>
<path d="M 838 552 H 898" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<rect id="media" x="322" y="618" width="878" height="43" rx="12" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text id="txt-41" x="344" y="646" font-size="15" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">元数据介质：PMem 或 Metadata-on-SSD</text>
<rect id="nvme" x="930" y="623" width="218" height="32" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
<text id="txt-42" x="1039.0" y="645.88" font-size="16" fill="#6B4E28" text-anchor="middle" font-weight="600" data-role="body" data-owner="nvme">本地 NVMe</text>
<path d="M 1039 578 V 617" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<text id="txt-43" x="48" y="682" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">边界：agent 和 Go 管理进程不逐块转发 payload；RDB 不串行代理全部 Object I/O。</text>
</svg>
