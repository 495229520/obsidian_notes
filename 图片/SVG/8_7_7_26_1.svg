<text id="txt-34" x="1039.0" y="385.38" font-size="16" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body" data-owner="rdb">RDB · Raft 元数据支线</text>
<path d="M 530 333 V 311 H 1039 V 319" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow-amber)"/>
<text id="txt-35" x="683" y="304" font-size="13.5" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body">元数据 RPC</text>
<rect id="vos" x="594" y="433" width="244" height="62" rx="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text id="txt-36" x="716.0" y="458.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="vos">VOS</text>
<text id="txt-37" x="716.0" y="482.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="vos">本地索引 / 版本 / DTX 状态</text>
<path d="M 716 398 V 427" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/>
