<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-labelledby="title desc">
<title id="title">DAOS 架构全景：管理、对象语义与本地存储</title><desc id="desc">上方管理通信与下方数据面分开；客户端库直接使用 fabric 访问 engine，agent 不转发 payload。RDB 服务支线与对象到 VOS、BIO、SPDK 的数据路径分开。</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3D5A80"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6B5E"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8A6A3A"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A64B3C"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8B8679"/></marker>
</defs>
<style>text {font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;}</style>
<rect id="background" x="0" y="0" width="1240" height="690" fill="rgb(245, 244, 237)"/>
<text id="txt-1" x="48" y="49" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="title">DAOS 架构全景：管理、对象语义与本地存储</text>
<text id="txt-2" x="48" y="78" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">以 DAOS 2.8.0 为基线 · 展开一个 engine；真实的 target、执行流与设备数量由配置决定</text>
<rect id="management" x="40" y="105" width="1160" height="132" rx="12" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text id="txt-3" x="60" y="128" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">管理平面</text>
<rect id="dmg" x="60" y="145" width="152" height="66" rx="10" fill="#F1EFE8" stroke="#8B8679" stroke-width="1.3"/>
<text id="txt-4" x="136.0" y="172.88" font-size="16" fill="#4A473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="dmg">dmg</text>
<text id="txt-5" x="136.0" y="196.88" font-size="16" fill="#4A473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="dmg">管理客户端</text>
<rect id="control" x="398" y="143" width="310" height="68" rx="10" fill="#F1EFE8" stroke="#8B8679" stroke-width="1.3"/>
<text id="txt-6" x="553.0" y="171.88" font-size="16" fill="#4A473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="control">daos_server · Go</text>
<text id="txt-7" x="553.0" y="195.88" font-size="16" fill="#4A473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="control">配置 / 启停 / 监控 engine</text>
<rect id="msdb" x="904" y="143" width="270" height="68" rx="10" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
<text id="txt-8" x="1039.0" y="171.88" font-size="16" fill="#6B4E28" text-anchor="middle" font-weight="600" data-role="body" data-owner="msdb">系统管理数据库</text>
<text id="txt-9" x="1039.0" y="195.88" font-size="16" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body" data-owner="msdb">成员 / rank / 服务记录</text>
<path d="M 212 178 H 392" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text id="txt-10" x="296" y="164" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">gRPC</text>
<path d="M 708 178 H 898" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<text id="txt-11" x="805" y="164" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body">管理服务状态</text>
<rect id="client" x="40" y="262" width="232" height="339" rx="12" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text id="txt-12" x="60" y="289" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">客户端主机</text>
<rect id="app" x="60" y="314" width="192" height="67" rx="10" fill="#F1EFE8" stroke="#8B8679" stroke-width="1.3"/>
<text id="txt-13" x="156.0" y="342.38" font-size="16" fill="#4A473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="app">应用 / I/O 中间件</text>
<text id="txt-14" x="156.0" y="366.38" font-size="16" fill="#4A473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="app">native / DFS 等</text>
<rect id="libdaos" x="60" y="416" width="192" height="59" rx="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text id="txt-15" x="156.0" y="440.38" font-size="16" fill="#24473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="libdaos">libdaos</text>
<text id="txt-16" x="156.0" y="464.38" font-size="16" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="libdaos">对象与访问上下文</text>
<rect id="agent" x="60" y="519" width="192" height="59" rx="10" fill="#F1EFE8" stroke="#8B8679" stroke-width="1.3"/>
<text id="txt-17" x="156.0" y="543.38" font-size="16" fill="#4A473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="agent">daos_agent</text>
<text id="txt-18" x="156.0" y="567.38" font-size="16" fill="#4A473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="agent">认证 / 附着信息</text>
<path d="M 156 381 V 410" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<path d="M 156 475 V 513" fill="none" stroke="#8B8679" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow-neutral)"/>
<text id="txt-19" x="169" y="502" font-size="13.5" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">dRPC</text>
<path d="M 252 549 H 292 V 227 H 553 V 213" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow-blue)"/>
<text id="txt-20" x="280" y="390" font-size="13.5" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">gRPC</text>
<rect id="engine" x="322" y="262" width="878" height="339" rx="12" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text id="txt-21" x="344" y="289" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">daos_engine · C · rank r</text>
<text id="txt-22" x="826" y="289" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">Argobots 调度 / 多个 targets</text>
<path d="M 708 197 H 770 V 256" fill="none" stroke="#8B8679" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow-neutral)" marker-end="url(#arrow-neutral)"/>
<text id="txt-23" x="783" y="245" font-size="13.5" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">本机 dRPC</text>
<rect id="cart" x="342" y="333" width="200" height="61" rx="10" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text id="txt-24" x="442.0" y="358.38" font-size="16" fill="#2C4460" text-anchor="middle" font-weight="600" data-role="body" data-owner="cart">CaRT</text>
<text id="txt-25" x="442.0" y="382.38" font-size="16" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body" data-owner="cart">RPC / bulk / 集体通信</text>
<rect id="mercury" x="342" y="418" width="200" height="74" rx="10" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text id="txt-26" x="442.0" y="449.235" font-size="14.5" fill="#2C4460" text-anchor="middle" font-weight="600" data-role="body" data-owner="mercury">Mercury</text>
<text id="txt-27" x="442.0" y="473.235" font-size="14.5" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body" data-owner="mercury">OFI / libfabric 或 UCX</text>
<path d="M 252 446 H 336" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
<text id="txt-28" x="296" y="433" font-size="13.5" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">Fabric</text>
<path d="M 442 418 V 400" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text id="txt-29" x="344" y="526" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">传输依赖与处理边界</text>
<text id="txt-30" x="344" y="552" font-size="13.5" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">provider 不等于物理网卡</text>
<rect id="object" x="594" y="333" width="244" height="65" rx="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text id="txt-31" x="716.0" y="360.38" font-size="16" fill="#24473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="object">对象服务 / DTX</text>
<text id="txt-32" x="716.0" y="384.38" font-size="16" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="object">布局 / 保护 / 操作协调</text>
<path d="M 542 365 H 588" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect id="rdb" x="904" y="325" width="270" height="83" rx="10" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
