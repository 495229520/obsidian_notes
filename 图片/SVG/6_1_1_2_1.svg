<svg xmlns="http://www.w3.org/2000/svg" width="740" height="384" viewBox="0 0 740 384">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>ScreenShareProtocol 与 SharedPacket 的职责分层</title>
  <desc>ScreenShareProtocol 定义语义（说什么），SharedPacket 定义封装（怎么传），协议消息作为 Body 由 CPacket 封装。</desc>
  <rect x="0" y="0" width="740" height="384" fill="rgb(245, 244, 237)"/>

  <path d="M40 60 H350 V300 H40 Z" fill="#F1EFE8" stroke="none"/>
  <path d="M390 60 H700 V300 H390 Z" fill="#F1EFE8" stroke="none"/>

  <g>
    <rect x="70" y="80" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="195" y="100" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">ScreenShareProtocol</text>
    <text x="195" y="120" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central">语义层 · 定义『说什么』</text>
  </g>
  <g>
    <rect x="420" y="80" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="545" y="100" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">SharedPacket (CPacket)</text>
    <text x="545" y="120" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">传输层 · 定义『怎么封装』</text>
  </g>

  <path d="M320 108 L420 108" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="92" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">作为 Body 封装</text>

  <circle cx="82" cy="175" r="3" fill="#534AB7"/>
  <text x="95" y="175" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="start" dominant-baseline="central">Command 枚举</text>
  <circle cx="82" cy="211" r="3" fill="#534AB7"/>
  <text x="95" y="211" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="start" dominant-baseline="central">Status 枚举</text>
  <circle cx="82" cy="247" r="3" fill="#534AB7"/>
  <text x="95" y="247" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="start" dominant-baseline="central">HelloPayload 结构</text>
  <circle cx="82" cy="283" r="3" fill="#534AB7"/>
  <text x="95" y="283" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="start" dominant-baseline="central">验证函数 IsValid…</text>

  <circle cx="432" cy="175" r="3" fill="#0F6E56"/>
  <text x="445" y="175" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">Magic + Length + Body</text>
  <circle cx="432" cy="211" r="3" fill="#0F6E56"/>
  <text x="445" y="211" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">Checksum 校验</text>
  <circle cx="432" cy="247" r="3" fill="#0F6E56"/>
  <text x="445" y="247" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">Serialize / TryParse</text>
  <circle cx="432" cy="283" r="3" fill="#0F6E56"/>
  <text x="445" y="283" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">二进制帧格式</text>

  <text x="370" y="340" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">两份 Header-only 定义，Host 与 Viewer 共享同一份协议源码</text>
</svg>
