<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>longjmp 前后的栈帧对照，以及 jmp_buf 里存了什么</title>
  <desc>左边两根栈条对照 longjmp 前后：跳转前 main、first_function、second_function 三个帧叠着，栈顶在最深处；跳转后 main 的帧还在，中间两个帧变成虚线的作废状态，栈顶一步回到 main。右边列出 env 里存下的三样东西（PC、SP/FP、被调用者保存寄存器）、没存的东西（信号掩码与局部变量的当前值），以及 setjmp 两次返回分别返回什么。</desc>
  <defs>
    <marker id="j1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="580" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">longjmp 不是返回，是把栈指针直接搬回去</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">setjmp 存下 PC、SP 和被调用者保存寄存器，longjmp 把它们原样写回，中间几层栈帧就这么作废</text>

  <text x="56" y="118" font-size="13" font-weight="700" fill="#4A473F">A · 栈在 longjmp 前后的两个样子</text>
  <text x="632" y="118" font-size="13" font-weight="700" fill="#4A473F">B · env 里存了什么，setjmp 又会返回几次</text>

  <!-- Panel A -->
  <rect x="48" y="132" width="552" height="360" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <text x="168" y="162" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">longjmp 之前</text>
  <text x="480" y="162" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">longjmp 之后</text>

  <rect x="72" y="176" width="192" height="68" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="88" y="202" font-size="11.5" font-weight="700" fill="#2C4460">main 的帧</text>
  <text x="88" y="224" font-size="10.5" fill="#2C4460">setjmp 在这里存档</text>

  <rect x="72" y="252" width="192" height="68" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
  <text x="88" y="278" font-size="11" font-weight="700" fill="#4A473F">first_function 的帧</text>
  <text x="88" y="300" font-size="10.5" fill="#4A473F">局部变量都在这里</text>

  <rect x="72" y="328" width="192" height="68" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
  <text x="88" y="354" font-size="11" font-weight="700" fill="#4A473F">second_function 的帧</text>
  <text x="88" y="376" font-size="10.5" fill="#4A473F">调用 longjmp(env, 42)</text>

  <text x="168" y="418" font-size="10.5" fill="#6B675C" text-anchor="middle">栈顶在最下面这一格</text>

  <line x1="272" y1="286" x2="376" y2="286" stroke="#5A564B" stroke-width="1.8" marker-end="url(#j1)"/>
  <text x="324" y="272" font-size="10.5" fill="#4A473F" text-anchor="middle">longjmp(env, 42)</text>
  <text x="324" y="304" font-size="10.5" fill="#4A473F" text-anchor="middle">只改 SP 和 PC</text>

  <rect x="384" y="176" width="192" height="68" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="400" y="202" font-size="11.5" font-weight="700" fill="#24473F">main 的帧</text>
  <text x="400" y="224" font-size="10.5" fill="#24473F">SP 和 PC 都回到这里</text>

  <rect x="384" y="252" width="192" height="68" rx="6" fill="#F5F4ED" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="400" y="278" font-size="11" fill="#9B968A">first_function 的帧</text>
  <text x="400" y="300" font-size="10.5" fill="#9B968A">帧已作废</text>

  <rect x="384" y="328" width="192" height="68" rx="6" fill="#F5F4ED" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="400" y="354" font-size="11" fill="#9B968A">second_function 的帧</text>
  <text x="400" y="376" font-size="10.5" fill="#9B968A">帧已作废</text>

  <text x="480" y="418" font-size="10.5" fill="#6B675C" text-anchor="middle">栈顶一步回到最上面</text>

  <text x="72" y="456" font-size="11" fill="#733428">中间两帧的 fclose / free 一句都没跑</text>

  <!-- Panel B -->
  <rect x="616" y="132" width="576" height="360" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <text x="640" y="158" font-size="10.5" fill="#6B675C">env 里存下的三样东西</text>

  <rect x="640" y="170" width="170" height="88" rx="7" fill="#EDEBE3" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="656" y="200" font-size="11.5" font-weight="700" fill="#4A473F">PC / 返回地址</text>
  <text x="656" y="226" font-size="10.5" fill="#4A473F">跳回哪一行</text>

  <rect x="826" y="170" width="170" height="88" rx="7" fill="#EDEBE3" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="842" y="200" font-size="11.5" font-weight="700" fill="#4A473F">SP / FP</text>
  <text x="842" y="226" font-size="10.5" fill="#4A473F">栈顶退到哪</text>

  <rect x="1012" y="170" width="164" height="88" rx="7" fill="#EDEBE3" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="1028" y="200" font-size="11.5" font-weight="700" fill="#4A473F">被调用者保存寄存器</text>
  <text x="1028" y="226" font-size="10.5" fill="#4A473F">rbx rbp r12-r15</text>

  <rect x="640" y="278" width="536" height="64" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="660" y="304" font-size="11.5" font-weight="700" fill="#733428">env 里没有的</text>
  <text x="660" y="328" font-size="10.5" fill="#733428">信号掩码，以及局部变量的当前值</text>

  <rect x="640" y="356" width="536" height="30" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="640" y="386" width="536" height="42" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="640" y="428" width="536" height="42" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.2"/>
  <line x1="856" y1="356" x2="856" y2="470" stroke="#D8D5C8" stroke-width="1.2"/>

  <text x="656" y="376" font-size="11" font-weight="700" fill="#4A473F">setjmp 什么时候返回</text>
  <text x="872" y="376" font-size="11" font-weight="700" fill="#4A473F">返回值</text>
  <text x="656" y="412" font-size="10.5" fill="#4A473F">第一次直接调用</text>
  <text x="872" y="412" font-size="10.5" fill="#4A473F">0</text>
  <text x="656" y="454" font-size="10.5" fill="#4A473F">被 longjmp 打回来</text>
  <text x="872" y="454" font-size="10.5" fill="#4A473F">longjmp 的第二个参数；传 0 会变成 1</text>

  <text x="68" y="528" font-size="11.5" fill="#4A473F">longjmp 不做返回：它只把 SP 和 PC 写回 setjmp 那一刻的值，中间几层栈帧就这么被丢掉。</text>
  <text x="68" y="552" font-size="11.5" fill="#4A473F">所以它只能往调用链的上游跳。setjmp 所在的函数一旦返回，那个 env 就是一张废票。</text>
</svg>
