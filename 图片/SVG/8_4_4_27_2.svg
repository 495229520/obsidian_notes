<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">PFC 是逐跳暂停；CE / CNP 是另一条反馈回路</title>
<desc id="desc">观察方向固定为 U → D：下游 PFC Tx 对应上游 PFC Rx；并非把 PFC 路由到源端</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="title">PFC 是逐跳暂停；CE / CNP 是另一条反馈回路</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="title">观察方向固定为 U → D：下游 PFC Tx 对应上游 PFC Rx；并非把 PFC 路由到源端</text>
<rect x="48" y="108" width="414" height="286" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="70" y="137" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">A · 上游 U：本链路的发送资源</text>
<rect x="83" y="170" width="340" height="60" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="253.0" y="193.5" font-size="14" fill="#733428" font-weight="700" text-anchor="middle" data-zone="body">RoCE 发送 Queue</text>
<text x="253.0" y="216.5" font-size="14" fill="#733428" font-weight="400" text-anchor="middle" data-zone="body">priority 3 受控</text>
<rect x="83" y="251" width="340" height="48" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="253.0" y="280.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle" data-zone="body">PFC Rx：停对应发送类别</text>
<path d="M256,247 V235" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#redarr)"/>
<rect x="83" y="316" width="164" height="48" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="165.0" y="345.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">CNP 类别</text>
<rect x="262" y="316" width="161" height="48" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="342.5" y="345.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">其他类别</text>
<rect x="780" y="108" width="412" height="286" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="802" y="137" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">B · 下游 D：本链路的入口资源</text>
<rect x="805" y="170" width="359" height="60" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="984.5" y="193.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">RoCE Ingress PG</text>
<text x="984.5" y="216.5" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle" data-zone="body">按本地资源状态触发</text>
<rect x="808" y="248" width="25" height="24" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="837" y="248" width="25" height="24" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="866" y="248" width="25" height="24" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="895" y="248" width="25" height="24" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="924" y="248" width="25" height="24" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="953" y="248" width="25" height="24" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="982" y="248" width="25" height="24" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="1011" y="248" width="25" height="24" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="1040" y="248" width="25" height="24" rx="2" fill="#F0E0DB" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="1069" y="248" width="25" height="24" rx="2" fill="#F0E0DB" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="1098" y="248" width="25" height="24" rx="2" fill="#F0E0DB" stroke="#B07D2B" stroke-width="1.3"/>
<rect x="1127" y="248" width="25" height="24" rx="2" fill="#F0E0DB" stroke="#B07D2B" stroke-width="1.3"/>
<text x="810" y="298" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="start" data-zone="body">已有占用</text>
<text x="1040" y="298" font-size="13" fill="#733428" font-weight="400" text-anchor="start" data-zone="body">在途 / headroom</text>
<rect x="806" y="317" width="356" height="47" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="984.0" y="345.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">PFC Tx：请求暂停 priority 3</text>
<line x1="429" y1="195" x2="798" y2="195" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="544" y="179" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="body">RoCE 数据</text>
<path d="M801,341 H623 V273 H429" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#redarr)"/>
<text x="496" y="315" font-size="14" fill="#733428" font-weight="700" text-anchor="start" data-zone="body">相邻链路控制帧</text>
<text x="68" y="429" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">C · 端到端拥塞反馈：与上面的逐跳控制分开核对</text>
<rect x="74" y="463" width="231" height="65" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="189.5" y="489.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">发送 RNIC</text>
<text x="189.5" y="512.0" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle" data-zone="body">按反馈调整注入</text>
<rect x="502" y="463" width="233" height="65" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="618.5" y="489.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">拥塞交换机</text>
<text x="618.5" y="512.0" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle" data-zone="body">数据包 ECT → CE</text>
<rect x="936" y="463" width="229" height="65" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1050.5" y="489.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">接收 RNIC</text>
<text x="1050.5" y="512.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle" data-zone="body">按实现生成 CNP</text>
<line x1="310" y1="494" x2="496" y2="494" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="740" y1="494" x2="930" y2="494" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M1050,533 V574 H190 V533" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="466" y="563" font-size="14" fill="#24473F" font-weight="700" text-anchor="start" data-zone="body">CNP 反向 IP 路径 / 独立类别策略</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="646" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="footer">PFC 帧数不是暂停时长；CE 包数与 CNP 数也不要求一一相等。计数必须带端口、方向与时间窗口。</text>
</svg>