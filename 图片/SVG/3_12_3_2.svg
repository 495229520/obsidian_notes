<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 852" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>死锁的持有等待环与统一加锁顺序</title>
  <desc>上半把两个线程和两把互斥量画成一个四节点的环，标出请求边和已分配边；中间并列对比顺序相反和统一顺序两种写法，说明后到的线程手里什么都没有因而构不成持有并等待；下半列出死锁的四个必要条件和各自的破法。</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="852" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">死锁：两条「已分配」边和两条「请求」边接成了一个环</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">统一加锁顺序打破的是四个必要条件里的最后一个，也是工程上唯一好破的那一个</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="102" width="1144" height="290" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 加锁顺序相反时，四个节点首尾相接</text>

  <text x="72" y="176" font-size="11.5" fill="#2B2A26">线程 1：先锁 a，再锁 b</text>
  <text x="72" y="200" font-size="11.5" fill="#2B2A26">线程 2：先锁 b，再锁 a</text>
  <text x="72" y="234" font-size="11" fill="#733428">顺序相反是成环的唯一原因</text>

  <rect x="330" y="150" width="210" height="62" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="435" y="176" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">线程 1</text>
  <text x="435" y="196" font-size="11" fill="#2C4460" text-anchor="middle">手里握着 mutex_a</text>

  <rect x="700" y="150" width="210" height="62" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="805" y="176" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">mutex_b</text>
  <text x="805" y="196" font-size="11" fill="#6B4E28" text-anchor="middle">已锁定</text>

  <rect x="700" y="272" width="210" height="62" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="805" y="298" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">线程 2</text>
  <text x="805" y="318" font-size="11" fill="#2C4460" text-anchor="middle">手里握着 mutex_b</text>

  <rect x="330" y="272" width="210" height="62" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="435" y="298" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">mutex_a</text>
  <text x="435" y="318" font-size="11" fill="#6B4E28" text-anchor="middle">已锁定</text>

  <line x1="542" y1="181" x2="696" y2="181" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrr)"/>
  <text x="619" y="172" font-size="10.5" fill="#733428" text-anchor="middle">① 请求，拿不到</text>

  <line x1="805" y1="214" x2="805" y2="268" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="815" y="246" font-size="10.5" fill="#4A473F">② 已分配给</text>

  <line x1="698" y1="303" x2="544" y2="303" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrr)"/>
  <text x="621" y="322" font-size="10.5" fill="#733428" text-anchor="middle">③ 请求，拿不到</text>

  <line x1="435" y1="270" x2="435" y2="216" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="425" y="246" font-size="10.5" fill="#4A473F" text-anchor="end">④ 已分配给</text>

  <text x="950" y="170" font-size="12" font-weight="700" fill="#4A473F">环上的四条边</text>
  <text x="950" y="196" font-size="11" fill="#733428">① 线程 1 请求 mutex_b</text>
  <text x="950" y="218" font-size="11" fill="#4A473F">② mutex_b 在线程 2 手里</text>
  <text x="950" y="240" font-size="11" fill="#733428">③ 线程 2 请求 mutex_a</text>
  <text x="950" y="262" font-size="11" fill="#4A473F">④ mutex_a 在线程 1 手里</text>
  <text x="950" y="296" font-size="11" font-weight="700" fill="#733428">首尾相接，就是循环等待</text>

  <rect x="72" y="350" width="1096" height="28" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="88" y="369" font-size="11.5" fill="#733428">现场特征：两个线程都停在 pthread_mutex_lock() 里</text>
  <text x="620" y="369" font-size="11.5" fill="#733428">进程不退出，CPU 也不涨</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="410" width="1144" height="200" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="432" font-size="15" font-weight="700" fill="#4A473F">B · 换成统一加锁顺序，这个环就接不上了</text>

  <rect x="72" y="444" width="536" height="106" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="92" y="468" font-size="12.5" font-weight="700" fill="#733428">顺序相反 · 会死锁</text>
  <text x="92" y="492" font-size="11.5" fill="#733428">线程 1：lock(a) → lock(b)</text>
  <text x="92" y="514" font-size="11.5" fill="#733428">线程 2：lock(b) → lock(a)</text>
  <text x="92" y="536" font-size="11" fill="#6B675C">两条请求边方向相反，接成环</text>

  <rect x="632" y="444" width="536" height="106" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="652" y="468" font-size="12.5" font-weight="700" fill="#24473F">统一顺序 · 不会死锁</text>
  <text x="652" y="492" font-size="11.5" fill="#24473F">线程 1：lock(a) → lock(b)</text>
  <text x="652" y="514" font-size="11.5" fill="#24473F">线程 2：lock(a) → lock(b)</text>
  <text x="652" y="536" font-size="11" fill="#6B675C">谁先拿到 a 谁往下走</text>

  <rect x="72" y="562" width="1096" height="32" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="88" y="583" font-size="11.5" fill="#6B4E28">关键在于：拿不到 a 的那个线程手里什么都没有，构不成「持有并等待」</text>

  <!-- ============ Panel C ============ -->
  <rect x="48" y="628" width="1144" height="200" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="650" font-size="15" font-weight="700" fill="#4A473F">C · 四个必要条件，各自对应一种破法</text>

  <rect x="72" y="662" width="1096" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="86" y="682" font-size="11.5" font-weight="700" fill="#4A473F">必要条件</text>
  <text x="306" y="682" font-size="11.5" font-weight="700" fill="#4A473F">含义</text>
  <text x="706" y="682" font-size="11.5" font-weight="700" fill="#4A473F">工程上怎么破</text>

  <rect x="72" y="692" width="1096" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="86" y="714" font-size="11" fill="#2B2A26">互斥</text>
  <text x="306" y="714" font-size="11" fill="#2B2A26">资源同一时刻只能给一个线程</text>
  <text x="706" y="714" font-size="11" fill="#733428">破不了，锁的语义就是这个</text>

  <rect x="72" y="726" width="1096" height="34" fill="#F4F2EA" stroke="#D8D5C8" stroke-width="1"/>
  <text x="86" y="748" font-size="11" fill="#2B2A26">持有并等待</text>
  <text x="306" y="748" font-size="11" fill="#2B2A26">拿着一把还去要另一把</text>
  <text x="706" y="748" font-size="11" fill="#2B2A26">一次性申请全部，或者失败就全放</text>

  <rect x="72" y="760" width="1096" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="86" y="782" font-size="11" fill="#2B2A26">不可剥夺</text>
  <text x="306" y="782" font-size="11" fill="#2B2A26">只能等持有者自己放手</text>
  <text x="706" y="782" font-size="11" fill="#2B2A26">trylock / timedlock 失败就 unlock 重来</text>

  <rect x="72" y="794" width="1096" height="34" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="86" y="816" font-size="11" font-weight="700" fill="#24473F">循环等待</text>
  <text x="306" y="816" font-size="11" font-weight="700" fill="#24473F">等待关系接成了一个环</text>
  <text x="706" y="816" font-size="11" font-weight="700" fill="#24473F">给所有锁定一个全局顺序，按序加锁</text>
</svg>
