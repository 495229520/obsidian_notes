<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>TX 只接管接受前缀：其余 mbuf 仍归应用</title><desc>上方8格包数组显示5个移交与3个应用所有，下方展示接收、发送和mempool归还生命周期。</desc>
<defs>
<marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">TX 只接管接受前缀：其余 mbuf 仍归应用</text>
<text x="48" y="81" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">示例：RX n = 8，prepare p = 8，TX accepted s = 5；不是性能测量。</text>
<rect x="56" y="114" width="1128" height="207" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="72" y="139" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">A · 一次 burst 的所有权分裂</text>
<rect x="96" y="167" width="112" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="152.0" y="190.5" font-size="12.5" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">packet 0</text>
<text x="152.0" y="210.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">PMD 持有</text>
<rect x="228" y="167" width="112" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="284.0" y="190.5" font-size="12.5" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">packet 1</text>
<text x="284.0" y="210.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">PMD 持有</text>
<rect x="360" y="167" width="112" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="416.0" y="190.5" font-size="12.5" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">packet 2</text>
<text x="416.0" y="210.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">PMD 持有</text>
<rect x="492" y="167" width="112" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="548.0" y="190.5" font-size="12.5" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">packet 3</text>
<text x="548.0" y="210.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">PMD 持有</text>
<rect x="624" y="167" width="112" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="680.0" y="190.5" font-size="12.5" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">packet 4</text>
<text x="680.0" y="210.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">PMD 持有</text>
<rect x="756" y="167" width="112" height="59" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="812.0" y="190.5" font-size="12.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">packet 5</text>
<text x="812.0" y="210.5" font-size="12.5" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body">应用持有</text>
<rect x="888" y="167" width="112" height="59" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="944.0" y="190.5" font-size="12.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">packet 6</text>
<text x="944.0" y="210.5" font-size="12.5" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body">应用持有</text>
<rect x="1020" y="167" width="112" height="59" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1076.0" y="190.5" font-size="12.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">packet 7</text>
<text x="1076.0" y="210.5" font-size="12.5" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body">应用持有</text>
<polyline points="96,244 736,244" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round"/>
<text x="416" y="266" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">[0,5) 不再访问 / 不再 free</text>
<polyline points="756,244 1132,244" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<text x="944" y="266" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body">[5,8) 有界重试 / 排队 / 释放</text>
<text x="80" y="297" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">API 返回的是接受数量；NIC 完成和远端消费是之后的不同事件。</text>
<rect x="56" y="344" width="1128" height="282" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="72" y="369" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">B · 一份 packet 引用的循环：每条回收路径都要有人推进</text>
<rect x="82" y="403" width="245" height="66" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="204.5" y="430.0" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">RX：驱动持有</text>
<text x="204.5" y="450.0" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">已投递接收 buffer</text>
<rect x="479" y="403" width="247" height="66" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="602.5" y="430.0" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">应用：处理中</text>
<text x="602.5" y="450.0" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body">拥有 RX 返回的 packet</text>
<rect x="889" y="403" width="262" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1020.0" y="430.0" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">TX：PMD 持有</text>
<text x="1020.0" y="450.0" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">已接受 / 等待回收</text>
<polyline points="329,436 475,436" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="402" y="423" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">RX 返回</text>
<polyline points="728,436 885,436" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="807" y="423" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">TX 接受</text>
<rect x="479" y="541" width="247" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="602.5" y="562.5" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">Mempool / local cache</text>
<text x="602.5" y="582.5" font-size="13" fill="#4A473F" font-weight="400" text-anchor="middle" data-role="body">可供再次分配</text>
<polyline points="1020,473 1020,568 730,568" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-green)"/>
<text x="885" y="593" font-size="12" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">完成后释放引用</text>
<polyline points="479,568 204,568 204,473" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="324" y="592" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">分配 / 补充 RX</text>
<polyline points="602,472 602,537" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="622" y="507" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">丢弃 / 未接受</text>
<text x="48" y="673" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">容量按各 pool 的对象持有集合计算；TX 提交成功并不立即增加 pool 中的可用对象。</text>
</svg>