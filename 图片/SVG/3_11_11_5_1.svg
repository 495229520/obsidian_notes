<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>进程从运行到彻底消失的状态转换，以及僵尸状态下到底占着什么资源</title>
  <desc>上半是状态机：进程退出后进入僵尸态，从这里分出三条路，父进程调 wait 则释放，父进程活着不 wait 则堆积，父进程先退出则转投 PID 1 被立刻收走；下半对照 exit 那一刻就归还的资源、要等 wait 才归还的资源，以及三个常见误解。</desc>
  <defs>
    <marker id="z1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="730" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">从运行到彻底消失，中间那一段就叫僵尸</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">进程什么时候真正从系统里消失，取决于父进程做了什么，跟子进程自己没关系</text>

  <text x="56" y="118" font-size="13" font-weight="700" fill="#4A473F">A · 状态转换：进了僵尸态之后有三条出路</text>

  <rect x="76" y="180" width="170" height="80" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="161" y="212" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">运行中</text>
  <text x="161" y="234" font-size="10.5" fill="#24473F" text-anchor="middle">ps 里是 R 或 S</text>

  <rect x="400" y="180" width="200" height="80" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="2"/>
  <text x="500" y="206" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">僵尸态</text>
  <text x="500" y="228" font-size="10.5" fill="#733428" text-anchor="middle">ps 里是 Z，命令名带</text>
  <text x="500" y="246" font-size="10.5" fill="#733428" text-anchor="middle">&lt;defunct&gt;</text>

  <line x1="250" y1="220" x2="396" y2="220" stroke="#5A564B" stroke-width="1.8" marker-end="url(#z1)"/>
  <text x="323" y="206" font-size="10.5" fill="#4A473F" text-anchor="middle">exit() 或被信号杀死</text>

  <rect x="680" y="150" width="230" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="700" y="174" font-size="11.5" font-weight="700" fill="#24473F">① 父进程调了 wait()</text>
  <text x="700" y="194" font-size="10.5" fill="#24473F">退出状态被读走</text>
  <text x="700" y="212" font-size="10.5" fill="#24473F">内核随即释放 task_struct</text>

  <rect x="680" y="250" width="230" height="72" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="700" y="274" font-size="11.5" font-weight="700" fill="#733428">② 父进程活着，却不 wait</text>
  <text x="700" y="294" font-size="10.5" fill="#733428">没人来读，就一直留着</text>
  <text x="700" y="312" font-size="10.5" fill="#733428">这才是真正会出事的那条</text>

  <rect x="680" y="350" width="230" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="700" y="374" font-size="11.5" font-weight="700" fill="#2C4460">③ 父进程先退出了</text>
  <text x="700" y="394" font-size="10.5" fill="#2C4460">当场转投 PID 1</text>
  <text x="700" y="412" font-size="10.5" fill="#2C4460">systemd 一直在 wait，随收</text>

  <line x1="604" y1="204" x2="676" y2="186" stroke="#5A564B" stroke-width="1.6" marker-end="url(#z1)"/>
  <line x1="604" y1="222" x2="676" y2="286" stroke="#5A564B" stroke-width="1.6" marker-end="url(#z1)"/>
  <line x1="604" y1="242" x2="676" y2="386" stroke="#5A564B" stroke-width="1.6" marker-end="url(#z1)"/>

  <rect x="980" y="150" width="190" height="72" rx="7" fill="#EDEBE3" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="1075" y="180" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">彻底消失</text>
  <text x="1075" y="202" font-size="10.5" fill="#4A473F" text-anchor="middle">PID 回到可分配池</text>

  <rect x="980" y="250" width="190" height="72" rx="7" fill="#EDD2CB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="1075" y="274" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">一个个堆起来</text>
  <text x="1075" y="294" font-size="10.5" fill="#733428" text-anchor="middle">PID 被一直占着</text>
  <text x="1075" y="312" font-size="10.5" fill="#733428" text-anchor="middle">撑满后 fork 返回 EAGAIN</text>

  <line x1="914" y1="186" x2="976" y2="186" stroke="#5A564B" stroke-width="1.6" marker-end="url(#z1)"/>
  <line x1="914" y1="286" x2="976" y2="286" stroke="#5A564B" stroke-width="1.6" marker-end="url(#z1)"/>
  <line x1="914" y1="386" x2="974" y2="226" stroke="#5A564B" stroke-width="1.6" marker-end="url(#z1)"/>

  <text x="56" y="460" font-size="13" font-weight="700" fill="#4A473F">B · 僵尸到底还占着什么</text>

  <rect x="56" y="476" width="362" height="140" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="78" y="502" font-size="12.5" font-weight="700" fill="#24473F">exit() 那一刻就还回去了</text>
  <text x="78" y="528" font-size="11" fill="#24473F">整个地址空间</text>
  <text x="78" y="550" font-size="11" fill="#24473F">所有打开的文件描述符</text>
  <text x="78" y="572" font-size="11" fill="#24473F">占用的物理内存</text>
  <text x="78" y="596" font-size="11" font-weight="700" fill="#24473F">所以僵尸不吃内存</text>

  <rect x="439" y="476" width="362" height="140" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="461" y="502" font-size="12.5" font-weight="700" fill="#733428">要等 wait() 才还</text>
  <text x="461" y="528" font-size="11" fill="#733428">内核里的 task_struct 条目</text>
  <text x="461" y="550" font-size="11" fill="#733428">那个 PID 号</text>
  <text x="461" y="572" font-size="11" fill="#733428">退出状态与 rusage 统计</text>
  <text x="461" y="596" font-size="11" font-weight="700" fill="#733428">pid_max 默认 32768</text>

  <rect x="822" y="476" width="362" height="140" rx="8" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="844" y="502" font-size="12.5" font-weight="700" fill="#6B4E28">三个常见误解</text>
  <text x="844" y="528" font-size="11" fill="#6B4E28">kill -9 能清掉僵尸：不能</text>
  <text x="844" y="550" font-size="11" fill="#6B4E28">僵尸在吃 CPU：一点也没有</text>
  <text x="844" y="572" font-size="11" fill="#6B4E28">只能重启才清得掉：不用</text>
  <text x="844" y="596" font-size="11" font-weight="700" fill="#6B4E28">杀掉父进程就够了</text>

  <text x="68" y="670" font-size="11.5" fill="#4A473F">僵尸已经没有任何代码可执行，信号是发给活着的进程去执行的，所以 kill -9 打在它身上没有任何效果。</text>
  <text x="68" y="694" font-size="11.5" fill="#4A473F">杀父进程之所以有效，是因为父进程一死，这些僵尸立刻转投第 ③ 条路，被 PID 1 接手并当场收走。</text>
</svg>
