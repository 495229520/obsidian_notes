<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">zkML 的证明合同：指定模型、指定输入、指定计算语义</title>
<desc id="desc">公开语句和私有见证分开展示。证明关系同时验证模型和输入承诺、约定数值语义下的推理结果。验证者只接收公开语句和证明，但公开输出仍可能泄露信息。底部列出数学关系与物理执行、现实事实的边界。</desc>
<defs>
<marker id="arr-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A7EA4"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<text id="t0" x="48" y="49" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">zkML 的证明合同：指定模型、指定输入、指定计算语义</text>
<text id="t1" x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">验证者接受的是编码关系；承诺身份、量化语义与程序标识没有绑定，证明再短也答非所问。</text>
<rect x="48" y="111" width="1144" height="115" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t2" x="64" y="137" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start" data-role="section">公开语句 s · 由验证方确认其业务含义</text>
<rect x="69" y="168" width="134" height="37" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t3" x="136.0" y="191.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">模型承诺 C_W</text>
<rect x="219" y="168" width="134" height="37" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t4" x="286.0" y="191.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">输入承诺 C_x</text>
<rect x="369" y="168" width="115" height="37" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t5" x="426.5" y="191.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">输出 y</text>
<rect x="500" y="168" width="165" height="37" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t6" x="582.5" y="191.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">program / graph ID</text>
<rect x="681" y="168" width="155" height="37" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t7" x="758.5" y="191.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">数值语义 q</text>
<rect x="852" y="168" width="151" height="37" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t8" x="927.5" y="191.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">模型版本</text>
<rect x="1019" y="168" width="151" height="37" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t9" x="1094.5" y="191.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">请求上下文</text>
<rect x="48" y="245" width="294" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t10" x="64" y="271" font-size="15" font-weight="700" fill="#6B5B95" text-anchor="start" data-role="section">私有见证 w</text>
<text id="t11" x="69" y="304" font-size="16" font-weight="700" fill="#6B5B95" text-anchor="start" data-role="body">W · 模型权重</text>
<text id="t12" x="69" y="336" font-size="16" font-weight="700" fill="#6B5B95" text-anchor="start" data-role="body">x · 私有输入</text>
<text id="t13" x="69" y="368" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">ρ_W / ρ_x · 承诺随机性</text>
<text id="t14" x="69" y="400" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">trace · 中间值与执行轨迹</text>
<line x1="69" y1="421" x2="321" y2="421" stroke="#9B968A" stroke-width="1.7"/>
<text id="t15" x="69" y="449" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">是否保密，取决于具体协议</text>
<text id="t16" x="69" y="475" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">输入公开时可直接进入 s</text>
<rect x="378" y="245" width="466" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t17" x="394" y="271" font-size="15" font-weight="700" fill="#24473F" text-anchor="start" data-role="section">证明者约束的关系 R(s, w)</text>
<text id="t18" x="399" y="306" font-size="16" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">① Commit(W; ρ_W) = C_W</text>
<text id="t19" x="399" y="341" font-size="16" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">② Commit(x; ρ_x) = C_x</text>
<text id="t20" x="399" y="376" font-size="17" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">③ Eval_q(W, x) = y</text>
<line x1="399" y1="395" x2="822" y2="395" stroke="#9B968A" stroke-width="1.7"/>
<text id="t21" x="399" y="426" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">q：量化 / 舍入 / 范围 / 非线性约束</text>
<text id="t22" x="399" y="455" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">还需绑定图结构、预处理与输出定义</text>
<text id="t23" x="399" y="480" font-size="13" font-weight="700" fill="#733428" text-anchor="start" data-role="body">不能只证明“存在某个模型”</text>
<line x1="346" y1="367" x2="374" y2="367" stroke="#8A7EA4" stroke-width="1.7" marker-end="url(#arr-purple)"/>
<rect x="881" y="245" width="311" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t24" x="897" y="271" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start" data-role="section">验证者</text>
<rect x="905" y="303" width="263" height="66" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t25" x="1036.5" y="332.0" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Verify(params, s, π)</text>
<text id="t26" x="1036.5" y="354.0" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">公开语句 + 证明 π</text>
<path d="M1108,230 L1108,290 L1108,299" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text id="t27" x="1140" y="275" font-size="13" font-weight="400" fill="#2C4460" text-anchor="start" data-role="body">s</text>
<line x1="848" y1="338" x2="901" y2="338" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arr-green)"/>
<text id="t28" x="873" y="322" font-size="16" font-weight="700" fill="#2B2A26" text-anchor="middle" data-role="body">π</text>
<text id="t29" x="905" y="405" font-size="17" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">接受 / 拒绝</text>
<text id="t30" x="905" y="438" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">不要求公开整个私有 w</text>
<text id="t31" x="905" y="470" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">公开 y 本身仍有信息量</text>
<rect x="48" y="512" width="563" height="82" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text id="t32" x="68" y="541" font-size="16" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">能支持：合同中的数学关系</text>
<text id="t33" x="68" y="572" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">指定承诺 · 指定输入 · 指定数值语义</text>
<rect x="629" y="512" width="563" height="82" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text id="t34" x="649" y="541" font-size="16" font-weight="700" fill="#733428" text-anchor="start" data-role="body">不自动支持：事实真伪或物理历史</text>
<text id="t35" x="649" y="572" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">无幻觉 / 训练来源 / GPU 地点 / 实际执行时刻</text>
<rect x="48" y="618" width="1144" height="54" rx="7" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t36" x="64" y="641" font-size="14" font-weight="700" fill="#4A473F" text-anchor="start" data-role="footer">数值边界：有限域或量化推理正确 ≠ 任意 FP16/BF16 CUDA kernel 逐位等价。</text>
<text id="t37" x="64" y="662" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">关系合同为教学设计，并非某个框架 API · π 的安全性与隐私仍依赖具体构造和参数 · 对应笔记 §7、§8</text>
</svg>