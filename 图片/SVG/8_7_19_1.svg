<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>一根日志轴上的截断决策</title>
  <desc>复制日志轴上的 snapshot/first/commit/last 游标与三个 follower 的 matchIndex；安全截断点公式与三条约束；追赶收敛条件。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">一根日志轴上的截断决策：这段前缀还有谁需要？</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">安全截断点 T = min( snapshot_last, min matchIndex(仅活跃成员) ) − margin —— 死副本必须被剔除，否则 min 被永远钉住</text>

  <!-- Panel A: the log axis -->
  <rect x="48" y="104" width="1144" height="368" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="13" font-weight="700" fill="#4A473F">A · 日志轴与游标（示例：index 760 – 1200）</text>

  <!-- axis regions: mapping x = 100 + (idx-760)*2.36 ; deleted 760-820: 100..242, retained 820..1200: 242..1138 -->
  <!-- deleted region -->
  <rect x="100" y="176" width="142" height="44" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="171" y="203" font-size="10.5" fill="#6B675C" text-anchor="middle">已删除（被快照吸收）</text>

  <!-- retained log -->
  <rect x="242" y="176" width="896" height="44" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="900" y="203" font-size="11" fill="#6B4E28" text-anchor="middle">保留中的日志（落后者的教材 + 本机重启的回放来源）</text>

  <!-- this-round deletable overlay 820..940: 242..525 -->
  <rect x="242" y="176" width="283" height="44" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="384" y="203" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">本轮可安全删除</text>

  <!-- markers on axis -->
  <!-- first_index 820 -> x=242 -->
  <line x1="242" y1="156" x2="242" y2="228" stroke="#4A473F" stroke-width="1.4"/>
  <text x="242" y="150" font-size="10.5" fill="#4A473F" text-anchor="middle">first = 820</text>

  <!-- new truncate point 940 -> x=525 -->
  <line x1="525" y1="156" x2="525" y2="244" stroke="#2F6B5E" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="525" y="150" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">T = 940（1000 与 1080 取小，再退 margin 60）</text>

  <!-- snapshot 1000 -> x=666 -->
  <line x1="666" y1="156" x2="666" y2="244" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="666" y="150" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">snapshot_last = 1000（硬底线）</text>

  <!-- commit 1180 -> x=1091 -->
  <line x1="1091" y1="156" x2="1091" y2="228" stroke="#3D5A80" stroke-width="1.6"/>
  <text x="1080" y="150" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">commit = 1180</text>

  <!-- last 1200 -> x=1138 -->
  <line x1="1138" y1="156" x2="1138" y2="228" stroke="#4A473F" stroke-width="1.4"/>
  <text x="1152" y="203" font-size="10.5" fill="#4A473F">last</text>
  <text x="1152" y="217" font-size="10.5" fill="#4A473F">=1200</text>

  <!-- follower rows -->
  <!-- F1 match=1195 -> x=1127 -->
  <text x="100" y="288" font-size="11.5" font-weight="700" fill="#24473F">F1  match = 1195</text>
  <line x1="242" y1="284" x2="1119" y2="284" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrg)"/>
  <circle cx="1127" cy="284" r="5" fill="#2F6B5E"/>
  <text x="720" y="278" font-size="10.5" fill="#24473F">Replicate：流水线复制中，几乎追平</text>

  <!-- F2 match=1080 -> x=855 -->
  <text x="100" y="334" font-size="11.5" font-weight="700" fill="#6B4E28">F2  match = 1080</text>
  <line x1="242" y1="330" x2="847" y2="330" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="855" cy="330" r="5" fill="#8A6A3A"/>
  <text x="880" y="334" font-size="10.5" fill="#6B4E28">仍在日志窗口内 → 路径一：补差量（便宜）</text>

  <!-- F3 match=790 -> x=171 (inside deleted region) -->
  <text x="100" y="380" font-size="11.5" font-weight="700" fill="#733428">F3  match = 790</text>
  <circle cx="171" cy="376" r="5" fill="#A64B3C"/>
  <line x1="171" y1="376" x2="234" y2="376" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrr)"/>
  <text x="252" y="380" font-size="10.5" fill="#733428">需要的日志已删除 → 路径二：InstallSnapshot 全量（贵一个数量级）；</text>
  <text x="252" y="396" font-size="10.5" fill="#733428">若 F3 已被判死（out）：从 min(matchIndex) 中剔除，同时交给 Recovery 全量重建</text>

  <!-- constraint note row -->
  <line x1="72" y1="416" x2="1168" y2="416" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="444" font-size="11.5" fill="#6B675C">读法：min(matchIndex 活跃成员) = min(1195, 1080) = 1080；与 snapshot_last=1000 取小 → 1000；再留 margin 60 → T=940。</text>
  <text x="88" y="462" font-size="11.5" fill="#6B675C">越过 1080 截断并不违反正确性（Raft 用快照兜底），但会把 F2 从便宜的路径一踢进昂贵的路径二 —— 这是性能取舍。</text>

  <!-- Panel B: three constraints -->
  <rect x="48" y="496" width="700" height="164" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="526" font-size="13" font-weight="700" fill="#4A473F">B · 截断点的三条约束</text>

  <rect x="72" y="544" width="204" height="96" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="88" y="568" font-size="12" font-weight="700" fill="#733428">快照约束（硬）</text>
  <text x="88" y="588" font-size="10.5" fill="#733428">T ≤ snapshot_last</text>
  <text x="88" y="606" font-size="10.5" fill="#733428">越线 = 本机重启后</text>
  <text x="88" y="622" font-size="10.5" fill="#733428">回放不出状态，丢数据</text>

  <rect x="296" y="544" width="204" height="96" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="312" y="568" font-size="12" font-weight="700" fill="#6B4E28">同伴约束（软）</text>
  <text x="312" y="588" font-size="10.5" fill="#6B4E28">T ≤ min(matchIndex)</text>
  <text x="312" y="606" font-size="10.5" fill="#6B4E28">越线不丢数据，但把同伴</text>
  <text x="312" y="622" font-size="10.5" fill="#6B4E28">踢进快照路径；死副本要剔除</text>

  <rect x="520" y="544" width="204" height="96" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="536" y="568" font-size="12" font-weight="700" fill="#24473F">保留窗口 margin</text>
  <text x="536" y="588" font-size="10.5" fill="#24473F">给重启 / 滚动升级 / 抖动</text>
  <text x="536" y="606" font-size="10.5" fill="#24473F">留缓冲，让常见短暂离线</text>
  <text x="536" y="622" font-size="10.5" fill="#24473F">都走便宜的差量路径</text>

  <!-- Panel C: convergence -->
  <rect x="772" y="496" width="420" height="164" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="796" y="526" font-size="13" font-weight="700" fill="#4A473F">C · 追赶收敛条件（移动靶）</text>
  <rect x="796" y="544" width="372" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="812" y="562" font-size="11" font-weight="700" fill="#2C4460">R_catchup &gt; R_append，否则 lag 只增不减</text>
  <text x="812" y="580" font-size="10.5" fill="#2C4460">T_converge = lag_bytes ÷ (R_catchup − R_append)</text>
  <rect x="796" y="598" width="372" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="812" y="616" font-size="11" font-weight="700" fill="#733428">快照循环：传快照期间新增日志又超出保留窗口</text>
  <text x="812" y="634" font-size="10.5" fill="#733428">要求 snapshot_bytes ÷ R_transfer × R_append &lt; 窗口长度</text>

  <!-- bottom note -->
  <text x="48" y="700" font-size="11.5" fill="#6B675C">边界条件：本图讲的是前缀截断（compact，删老历史省盘）；follower 与 leader 冲突时删的是未提交的后缀（conflict truncate），</text>
  <text x="48" y="720" font-size="11.5" fill="#6B675C">安全条件完全不同 —— 见 §5。追赶流量本身还要受 Backpressure 配额约束（7.18），保底速率与重建同理（7.17 §4）。</text>
</svg>
