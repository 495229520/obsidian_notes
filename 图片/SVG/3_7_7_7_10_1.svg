<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>VXLAN：先定位租户 MAC，再路由到远端 VTEP</title>
<desc>同一桥接域中的 H1 与 H2 经两个 VTEP 通信，Underlay 提供两条候选路径。下部列出接入、MAC、路由和邻居四级查找。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">VXLAN：先定位租户 MAC，再路由到远端 VTEP</text>
<text x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">内层服务租户寻址；外层服务承载转发。ECMP 是路径选择，不是单播复制。</text>
<rect x="32" y="112" width="1176" height="248" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="48" y="138" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · 同一桥接域的已知单播</text>
<rect x="48" y="215" width="142" height="88" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="119.0" y="242.0" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">H1</text>
<text x="119.0" y="264.0" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle">192.168.100.11</text>
<text x="119.0" y="286.0" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle">MAC …:11</text>
<rect x="236" y="196" width="224" height="116" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="348.0" y="226.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">VTEP-A</text>
<text x="348.0" y="248.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">10.255.0.1</text>
<text x="348.0" y="270.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">BD100 / VNI 10100</text>
<text x="348.0" y="292.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">H2 MAC → VTEP-B</text>
<rect x="548" y="169" width="144" height="58" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="620.0" y="192.0" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">Spine-1</text>
<text x="620.0" y="214.0" font-size="13" font-weight="400" fill="#4A473F" text-anchor="middle">外层 L3 转发</text>
<rect x="548" y="282" width="144" height="58" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="620.0" y="305.0" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">Spine-2</text>
<text x="620.0" y="327.0" font-size="13" font-weight="400" fill="#4A473F" text-anchor="middle">等价候选路径</text>
<rect x="780" y="196" width="224" height="116" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="892.0" y="226.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">VTEP-B</text>
<text x="892.0" y="248.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">10.255.0.2</text>
<text x="892.0" y="270.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">VNI 10100 → BD100</text>
<text x="892.0" y="292.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">H2 MAC → access</text>
<rect x="1050" y="215" width="142" height="88" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1121.0" y="242.0" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">H2</text>
<text x="1121.0" y="264.0" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle">192.168.100.22</text>
<text x="1121.0" y="286.0" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle">MAC …:22</text>
<path d="M190,259 L232,259" fill="none" stroke="#2F6B5E" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M1004,259 L1046,259" fill="none" stroke="#2F6B5E" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M460,226 L503,226 L503,198 L544,198" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M692,198 L738,198 L738,226 L776,226" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M460,287 L503,287 L503,311 L544,311" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="7 5"/>
<path d="M692,311 L738,311 L738,287 L776,287" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="7 5"/>
<text x="620" y="260" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle">择一路径</text>
<text x="48" y="391" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · 四个决策，不是一张 ARP 表</text>
<rect x="48" y="409" width="1144" height="230" rx="6" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="48" y="409" width="1144" height="46" rx="6" fill="#EDEBE3" stroke="none" stroke-width="1.3"/>
<text x="64" y="437.0" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">查找层</text>
<text x="294" y="437.0" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">查找键</text>
<path d="M278,409 L278,639" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="694" y="437.0" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">得到的结果</text>
<path d="M678,409 L678,639" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,455 L1192,455" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="64" y="483.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">接入分类</text>
<text x="294" y="483.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">port / VLAN</text>
<path d="M278,409 L278,639" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="694" y="483.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">BD100 → VNI 10100</text>
<path d="M678,409 L678,639" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,501 L1192,501" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="64" y="529.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">租户 FDB</text>
<text x="294" y="529.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">BD100 + H2 MAC</text>
<path d="M278,409 L278,639" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="694" y="529.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">远端 VTEP：10.255.0.2</text>
<path d="M678,409 L678,639" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,547 L1192,547" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="64" y="575.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">Underlay FIB</text>
<text x="294" y="575.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">10.255.0.2</text>
<path d="M278,409 L278,639" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="694" y="575.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">下一跳 IP + 出接口</text>
<path d="M678,409 L678,639" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,593 L1192,593" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="64" y="621.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">Underlay Neighbor</text>
<text x="294" y="621.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">下一跳 IP</text>
<path d="M278,409 L278,639" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="694" y="621.0" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">当前跳的目的 MAC</text>
<path d="M678,409 L678,639" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<path d="M48,655 L1192,655" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="48" y="680" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">范围：纯二层 Overlay、无 NAT；Inner MAC/IP 不随承载跳数改变，Outer MAC 在承载三层转发处重写。</text>
</svg>
