<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 824" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="824" fill="#F5F4ED"/>

  <text x="48" y="44" font-size="22" font-weight="700" fill="#2B2A26">p99 毛刺定位：先刻画（周期 · 幅度 · 相关），再分层二分</text>
  <text x="48" y="70" font-size="13" fill="#6B675C">均值说系统健康，p99 说最坏 1% 的经历；训练场景里 p99 毛刺 = GPU 利用率的周期性凹陷</text>

  <!-- ① 对齐时间线 -->
  <text x="48" y="100" font-size="13" font-weight="700" fill="#2B2A26">① 先看相关：GPU 利用率的凹陷，和取数 p99 的尖峰，在时间上对齐吗？</text>

  <text x="48" y="140" font-size="10.5" font-weight="700" fill="#2F6B5E">GPU 利用率</text>
  <polyline points="140,120 280,120 340,150 400,120 560,120 620,150 680,120 840,120 900,150 960,120 1160,120" fill="none" stroke="#2F6B5E" stroke-width="2.2"/>

  <text x="48" y="205" font-size="10.5" font-weight="700" fill="#A64B3C">取数 p99</text>
  <polyline points="140,210 300,210 340,166 380,210 580,210 620,166 660,210 860,210 900,166 940,210 1160,210" fill="none" stroke="#A64B3C" stroke-width="2.2"/>

  <line x1="340" y1="120" x2="340" y2="210" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="620" y1="120" x2="620" y2="210" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="900" y1="120" x2="900" y2="210" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 3"/>

  <line x1="345" y1="234" x2="615" y2="234" stroke="#5A564B" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="480" y="229" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">周期 T</text>
  <text x="944" y="150" font-size="10.5" fill="#6B675C">凹陷 ↔ 尖峰对齐 = 强相关</text>
  <text x="48" y="256" font-size="11" fill="#6B675C">先量周期 T 与幅度，别急着抓包——周期本身就把嫌疑范围缩掉大半</text>

  <!-- ② 周期指纹表 -->
  <text x="48" y="286" font-size="13" font-weight="700" fill="#2B2A26">② 周期对号：毛刺的「指纹」</text>

  <rect x="48" y="298" width="150" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="198" y="298" width="130" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="328" y="298" width="284" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="58" y="318" font-size="11" font-weight="700" fill="#2B2A26">周期特征</text>
  <text x="208" y="318" font-size="11" font-weight="700" fill="#2B2A26">疑似源</text>
  <text x="338" y="318" font-size="11" font-weight="700" fill="#2B2A26">机制 / 证据在哪层</text>

  <g font-size="10.5" fill="#4A473F">
    <rect x="48" y="328" width="150" height="38" fill="#FBFAF5" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="198" y="328" width="130" height="38" fill="#FBFAF5" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="328" y="328" width="284" height="38" fill="#FBFAF5" stroke="#D8D4C6" stroke-width="1"/>
    <text x="58" y="352">每 epoch 一次</text>
    <text x="208" y="352">shuffle 后齐读</text>
    <text x="338" y="352">多 worker 同打存储 = incast（网络 / 元数据）</text>

    <rect x="48" y="366" width="150" height="38" fill="#F3F1EA" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="198" y="366" width="130" height="38" fill="#F3F1EA" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="328" y="366" width="284" height="38" fill="#F3F1EA" stroke="#D8D4C6" stroke-width="1"/>
    <text x="58" y="390">每 N 分钟规律</text>
    <text x="208" y="390">checkpoint（8.6）</text>
    <text x="338" y="390">N-rank 齐射写，抢带宽（incast 突发）</text>

    <rect x="48" y="404" width="150" height="38" fill="#FBFAF5" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="198" y="404" width="130" height="38" fill="#FBFAF5" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="328" y="404" width="284" height="38" fill="#FBFAF5" stroke="#D8D4C6" stroke-width="1"/>
    <text x="58" y="428">不规则、成簇</text>
    <text x="208" y="428">SSD GC / 温控（3.5）</text>
    <text x="338" y="428">设备内部回收，D→C 尖峰（9.3 §8.2）</text>

    <rect x="48" y="442" width="150" height="38" fill="#F3F1EA" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="198" y="442" width="130" height="38" fill="#F3F1EA" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="328" y="442" width="284" height="38" fill="#F3F1EA" stroke="#D8D4C6" stroke-width="1"/>
    <text x="58" y="466">集大于内存后每步</text>
    <text x="208" y="466">页缓存悬崖（1.2）</text>
    <text x="338" y="466">命中率塌，每 batch 变冷读</text>

    <rect x="48" y="480" width="150" height="38" fill="#FBFAF5" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="198" y="480" width="130" height="38" fill="#FBFAF5" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="328" y="480" width="284" height="38" fill="#FBFAF5" stroke="#D8D4C6" stroke-width="1"/>
    <text x="58" y="504">与采样点对齐</text>
    <text x="208" y="504">监控 / 日志自身</text>
    <text x="338" y="504">观测器自造毛刺（9.4 ring buffer）</text>

    <rect x="48" y="518" width="150" height="38" fill="#F3F1EA" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="198" y="518" width="130" height="38" fill="#F3F1EA" stroke="#D8D4C6" stroke-width="1"/>
    <rect x="328" y="518" width="284" height="38" fill="#F3F1EA" stroke="#D8D4C6" stroke-width="1"/>
    <text x="58" y="542">随机、无周期</text>
    <text x="208" y="542">排队 / 争用</text>
    <text x="338" y="542">QD 过深或抢 CPU / softirq，均值也升</text>
  </g>

  <!-- ③ 分层二分梯 -->
  <text x="628" y="286" font-size="13" font-weight="700" fill="#2B2A26">③ 分层二分：端到端 p99 自上而下逐层拆，每层配一把尺</text>

  <rect x="628" y="298" width="564" height="42" rx="5" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.3"/>
  <text x="642" y="316" font-size="11.5" font-weight="700" fill="#7A5426">应用 / 预取队列　·　profiler data_time（8.7）</text>
  <text x="642" y="332" font-size="9.5" fill="#7A5426">边界：是不是根本没到存储——空泡在队列这端</text>

  <rect x="628" y="344" width="564" height="42" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="642" y="362" font-size="11.5" font-weight="700" fill="#2C4460">文件系统 / 元数据　·　nfsstat / stat（7.2）</text>
  <text x="642" y="378" font-size="9.5" fill="#2C4460">边界：小文件 open / stat 尖峰，海量元数据 RPC</text>

  <rect x="628" y="390" width="564" height="42" rx="5" fill="#E8E6F5" stroke="#5B4F9A" stroke-width="1.3"/>
  <text x="642" y="408" font-size="11.5" font-weight="700" fill="#3D356E">页缓存　·　命中率 / 第二 epoch（1.2）</text>
  <text x="642" y="424" font-size="9.5" fill="#3D356E">边界：命中就不进块层，miss 才有块请求</text>

  <rect x="628" y="436" width="564" height="42" rx="5" fill="#EFEDE3" stroke="#5A564B" stroke-width="1.3"/>
  <text x="642" y="454" font-size="11.5" font-weight="700" fill="#4A473F">块层 Q→D | D→C　·　blktrace btt（9.3）</text>
  <text x="642" y="470" font-size="9.5" fill="#4A473F">边界：Q→D 软件排队 vs D→C 驱动以下</text>

  <rect x="628" y="482" width="564" height="42" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="642" y="500" font-size="11.5" font-weight="700" fill="#24473F">设备　·　biolatency（9.4）</text>
  <text x="642" y="516" font-size="9.5" fill="#24473F">边界：介质本身——GC / 温控 / 掉速（3.5）</text>

  <rect x="628" y="528" width="564" height="42" rx="5" fill="#F5E5E0" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="642" y="546" font-size="11.5" font-weight="700" fill="#A64B3C">网络　·　nstat 重传 / PFC-ECN（5.2 / 4.7）</text>
  <text x="642" y="562" font-size="9.5" fill="#A64B3C">边界：跨网到 target 与远端介质，D→C 含网络</text>

  <text x="628" y="586" font-size="10.5" fill="#6B675C">口径不同不能直接相减（9.4）；逐层量，定位尖峰第一次出现的那一层</text>

  <!-- ④ 尾延迟放大器 -->
  <text x="48" y="618" font-size="13" font-weight="700" fill="#2B2A26">④ 尾延迟放大器：分布式把单点毛刺放大成系统毛刺</text>

  <rect x="48" y="630" width="364" height="150" rx="7" fill="#F5E5E0" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="66" y="656" font-size="12.5" font-weight="700" fill="#A64B3C">incast（多 → 一）</text>
  <text x="66" y="682" font-size="10.5" fill="#A64B3C">多个 worker / rank 同时打一个</text>
  <text x="66" y="700" font-size="10.5" fill="#A64B3C">出口（交换机 / 机头）</text>
  <text x="66" y="718" font-size="10.5" fill="#A64B3C">→ 缓冲溢出 → 丢包重传 → 尖峰</text>
  <text x="66" y="748" font-size="10" fill="#7A3F34">见 4.7 PFC/ECN、5.2 传输</text>

  <rect x="428" y="630" width="364" height="150" rx="7" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.4"/>
  <text x="446" y="656" font-size="12.5" font-weight="700" fill="#7A5426">fan-out（一 → 多，取 max）</text>
  <text x="446" y="682" font-size="10.5" fill="#7A5426">一个请求打 N 个后端，等最慢的</text>
  <rect x="446" y="692" width="330" height="26" rx="4" fill="#F5EFE2" stroke="#B07A3E" stroke-width="1"/>
  <text x="456" y="710" font-size="11" fill="#7A5426">P(全 ≤ t) = [ P(单 ≤ t) ]^N</text>
  <text x="446" y="736" font-size="10.5" fill="#7A5426">N=100、单 p99 → 0.99^100 ≈ 37% 全在门内</text>
  <text x="446" y="756" font-size="10.5" fill="#7A5426">→ 63% 请求命中至少一个尾</text>

  <rect x="808" y="630" width="384" height="150" rx="7" fill="#EFEDE3" stroke="#5A564B" stroke-width="1.4"/>
  <text x="826" y="656" font-size="12.5" font-weight="700" fill="#4A473F">重试放大</text>
  <text x="826" y="682" font-size="10.5" fill="#4A473F">超时重发把「一次慢」</text>
  <text x="826" y="700" font-size="10.5" fill="#4A473F">变成「两次慢」，毛刺叠加</text>
  <text x="826" y="718" font-size="10.5" fill="#4A473F">尾更长、更难与真实慢区分</text>
  <text x="826" y="748" font-size="10" fill="#6B675C">对策：对冲 / hedged 请求</text>

  <text x="48" y="806" font-size="11.5" font-weight="700" fill="#2B2A26">定位流程：刻画（周期 / 幅度 / 相关）→ 对号（指纹表）→ 二分（分层）→ 验证（动一个变量，看毛刺是否消失）</text>
</svg>
