<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
  <rect width="980" height="540" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .cell { fill: #eef6fb; stroke: #6f94b3; stroke-width: 1.3; rx: 4; }
      .base { fill: #dff0ea; stroke: #45907a; stroke-width: 1.8; rx: 4; }
      .active { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2; rx: 4; }
      .empty { fill: #f8f5ec; stroke: #d7d0bf; stroke-width: 1; rx: 4; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .note { fill: #edf4f1; stroke: #9db7aa; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">区间 DP：按区间长度从小到大填表</text>
  <text x="40" y="76" class="subtitle">计算 dp[i][j] 前，必须先准备好更短的区间，例如 dp[i+1][j]、dp[i][j-1]、dp[i+1][j-1]。</text>

  <rect x="72" y="118" width="420" height="328" class="panel"/>
  <text x="102" y="152" class="label">闭区间 dp[i][j]</text>
  <text x="102" y="178" class="small">只使用右上三角，斜线代表相同区间长度</text>
  <g transform="translate(132,218)">
    <rect x="0" y="0" width="48" height="38" class="base"/><text x="24" y="24" text-anchor="middle" class="mono">1</text>
    <rect x="54" y="0" width="48" height="38" class="cell"/><text x="78" y="24" text-anchor="middle" class="mono">2</text>
    <rect x="108" y="0" width="48" height="38" class="cell"/><text x="132" y="24" text-anchor="middle" class="mono">3</text>
    <rect x="162" y="0" width="48" height="38" class="active"/><text x="186" y="24" text-anchor="middle" class="mono">4</text>
    <rect x="216" y="0" width="48" height="38" class="cell"/><text x="240" y="24" text-anchor="middle" class="mono">5</text>

    <rect x="0" y="44" width="48" height="38" class="empty"/>
    <rect x="54" y="44" width="48" height="38" class="base"/><text x="78" y="68" text-anchor="middle" class="mono">1</text>
    <rect x="108" y="44" width="48" height="38" class="cell"/><text x="132" y="68" text-anchor="middle" class="mono">2</text>
    <rect x="162" y="44" width="48" height="38" class="cell"/><text x="186" y="68" text-anchor="middle" class="mono">3</text>
    <rect x="216" y="44" width="48" height="38" class="active"/><text x="240" y="68" text-anchor="middle" class="mono">4</text>

    <rect x="0" y="88" width="48" height="38" class="empty"/>
    <rect x="54" y="88" width="48" height="38" class="empty"/>
    <rect x="108" y="88" width="48" height="38" class="base"/><text x="132" y="112" text-anchor="middle" class="mono">1</text>
    <rect x="162" y="88" width="48" height="38" class="cell"/><text x="186" y="112" text-anchor="middle" class="mono">2</text>
    <rect x="216" y="88" width="48" height="38" class="cell"/><text x="240" y="112" text-anchor="middle" class="mono">3</text>

    <rect x="0" y="132" width="48" height="38" class="empty"/>
    <rect x="54" y="132" width="48" height="38" class="empty"/>
    <rect x="108" y="132" width="48" height="38" class="empty"/>
    <rect x="162" y="132" width="48" height="38" class="base"/><text x="186" y="156" text-anchor="middle" class="mono">1</text>
    <rect x="216" y="132" width="48" height="38" class="cell"/><text x="240" y="156" text-anchor="middle" class="mono">2</text>

    <rect x="0" y="176" width="48" height="38" class="empty"/>
    <rect x="54" y="176" width="48" height="38" class="empty"/>
    <rect x="108" y="176" width="48" height="38" class="empty"/>
    <rect x="162" y="176" width="48" height="38" class="empty"/>
    <rect x="216" y="176" width="48" height="38" class="base"/><text x="240" y="200" text-anchor="middle" class="mono">1</text>
  </g>

  <rect x="548" y="118" width="360" height="328" class="panel"/>
  <text x="578" y="152" class="label">计算 dp[left][right]</text>
  <text x="578" y="184" class="mono">for len = 1..n</text>
  <text x="578" y="214" class="mono">  for left</text>
  <text x="578" y="244" class="mono">    right = left + len - 1</text>
  <text x="578" y="292" class="small">常见依赖：</text>
  <text x="598" y="322" class="mono">dp[left + 1][right]</text>
  <text x="598" y="352" class="mono">dp[left][right - 1]</text>
  <text x="598" y="382" class="mono">dp[left + 1][right - 1]</text>

  <path d="M 400 308 C 470 308 492 308 548 308" class="arrow"/>

  <rect x="140" y="480" width="700" height="38" class="note"/>
  <text x="490" y="504" text-anchor="middle" class="small">填表准则：大区间依赖小区间，所以先算短区间，再算长区间。</text>
</svg>
