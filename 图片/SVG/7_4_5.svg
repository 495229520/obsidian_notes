<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340">
  <title>初等行变换求逆矩阵</title>
  <desc>把 A 与单位阵 E 拼成增广矩阵 (A|E)，只用初等行变换把左半化为 E，右半同步变为 A 的逆。</desc>
  <rect x="0" y="0" width="680" height="340" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="32" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">初等行变换求逆：(A | E) → (E | A⁻¹)</text>

  <!-- 左侧增广矩阵 (A|E) -->
  <path d="M62 96 q-10 0 -10 14 V196 q0 14 10 14" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M226 96 q10 0 10 14 V196 q0 14 -10 14" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M68 100 H140 V206 H68 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="104" y="153" font-family="system-ui,sans-serif" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">A</text>
  <path d="M148 100 H220 V206 H148 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="184" y="153" font-family="system-ui,sans-serif" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">E</text>
  <path d="M144 100 V206" stroke="#444441" stroke-width="0.8" fill="none" stroke-dasharray="3 3"/>
  <text x="144" y="228" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">( A | E )</text>

  <!-- 中间箭头 -->
  <path d="M252 153 H428" stroke="#534AB7" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="340" y="134" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">若干次初等行变换</text>
  <text x="340" y="174" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">① 某行乘非零数</text>
  <text x="340" y="192" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">② 某行 k 倍加到另一行</text>
  <text x="340" y="210" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">③ 两行对换</text>

  <!-- 右侧增广矩阵 (E|A⁻¹) -->
  <path d="M450 96 q-10 0 -10 14 V196 q0 14 10 14" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M618 96 q10 0 10 14 V196 q0 14 -10 14" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M456 100 H528 V206 H456 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="492" y="153" font-family="system-ui,sans-serif" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">E</text>
  <path d="M536 100 H612 V206 H536 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="574" y="153" font-family="system-ui,sans-serif" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">A⁻¹</text>
  <path d="M532 100 V206" stroke="#444441" stroke-width="0.8" fill="none" stroke-dasharray="3 3"/>
  <text x="534" y="228" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">( E | A⁻¹ )</text>

  <!-- 底部说明 -->
  <path d="M120 262 H560 V300 H120 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="281" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">左半 A 被化成单位阵 E 的同时，右半 E 同步变成 A⁻¹</text>
</svg>
