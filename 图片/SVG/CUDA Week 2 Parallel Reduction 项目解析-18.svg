<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">partial_sums 与 CPU 最终汇总</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">18 当前实现边界：GPU block partials + CPU final sum</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“1. 项目定位”的 note 后，或“21. 三种实现完整流程对比”前</text>
<rect x="80" y="150" width="1040" height="80" rx="16" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="105" y="185" font-size="17" font-weight="800" fill="#0F172A" text-anchor="start">input, n = 2048, blockDim = 256 → num_blocks = 8</text>
<rect x="320" y="195" width="78" height="20" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="359" y="210" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">B0</text>
<rect x="410" y="195" width="78" height="20" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="449" y="210" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">B1</text>
<rect x="500" y="195" width="78" height="20" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="539" y="210" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">B2</text>
<rect x="590" y="195" width="78" height="20" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="629" y="210" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">B3</text>
<rect x="680" y="195" width="78" height="20" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="719" y="210" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">B4</text>
<rect x="770" y="195" width="78" height="20" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="809" y="210" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">B5</text>
<rect x="860" y="195" width="78" height="20" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="899" y="210" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">B6</text>
<rect x="950" y="195" width="78" height="20" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="989" y="210" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">B7</text>
<rect x="130" y="305" width="250" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="130" y="305" width="250" height="8" rx="18" fill="#7C3AED" opacity="1"/>
<text x="150" y="339" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">GPU Kernel</text>
<text x="150" y="369" font-size="14" font-weight="400" fill="#334155" text-anchor="start">每个 block 处理 256 个元素</text>
<text x="150" y="390" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Naive / Shared / Shuffle</text>
<text x="150" y="411" font-size="14" font-weight="400" fill="#334155" text-anchor="start">输出一个 partial sum</text>
<line x1="540" y1="230" x2="320" y2="305" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="505" y="305" width="300" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="505" y="305" width="300" height="8" rx="18" fill="#059669" opacity="1"/>
<text x="525" y="339" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">d_partial[num_blocks]</text>
<text x="525" y="369" font-size="14" font-weight="400" fill="#334155" text-anchor="start">partial_sums[0]</text>
<text x="525" y="390" font-size="14" font-weight="400" fill="#334155" text-anchor="start">partial_sums[1]</text>
<text x="525" y="411" font-size="14" font-weight="400" fill="#334155" text-anchor="start">...</text>
<text x="525" y="432" font-size="14" font-weight="400" fill="#334155" text-anchor="start">partial_sums[7]</text>
<line x1="380" y1="380" x2="505" y2="380" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="895" y="305" width="235" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="895" y="305" width="235" height="8" rx="18" fill="#F59E0B" opacity="1"/>
<text x="915" y="339" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">CPU final</text>
<text x="915" y="369" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cudaMemcpy D2H</text>
<text x="915" y="390" font-size="14" font-weight="400" fill="#334155" text-anchor="start">h_partial vector</text>
<text x="915" y="411" font-size="14" font-weight="400" fill="#334155" text-anchor="start">double/int total loop</text>
<line x1="805" y1="380" x2="895" y2="380" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
<rect x="430" y="545" width="500" height="38" rx="19.0" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" opacity="1"/>
<text x="680.0" y="569.0" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">学习重点：block-level reduction 与 profiling；还不是完整 GPU-only 多级 reduction</text>
</svg>
