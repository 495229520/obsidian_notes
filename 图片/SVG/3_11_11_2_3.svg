<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>vfork 与父进程共用同一个栈，除 exec 和 _exit 外什么都不能做</title>
  <desc>左上对比 fork 与 vfork 的地址空间关系，右上展示子进程 return 破坏父进程栈帧的三步，下半是禁止操作的对照表。</desc>
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="p1r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="620" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">vfork 共享的不只是内存，是同一个栈</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">「必须紧接着 exec 或 _exit」不是风格建议：多执行一条 return，毁的是父进程的栈帧</text>

  <text x="56" y="118" font-size="13" font-weight="700" fill="#4A473F">A · 地址空间关系</text>

  <rect x="56" y="130" width="520" height="186" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="76" y="156" font-size="12" font-weight="700" fill="#2C4460">fork：两套 mm_struct</text>
  <rect x="76" y="168" width="140" height="32" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="146" y="189" font-size="11.5" fill="#2C4460" text-anchor="middle">父 mm · 父的栈</text>
  <rect x="232" y="168" width="140" height="32" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="302" y="189" font-size="11.5" fill="#24473F" text-anchor="middle">子 mm · 子的栈</text>
  <text x="392" y="189" font-size="11" fill="#6B675C">父子并行跑</text>

  <line x1="76" y1="220" x2="556" y2="220" stroke="#D8D5C8" stroke-width="1"/>

  <text x="76" y="248" font-size="12" font-weight="700" fill="#733428">vfork：一套 mm_struct</text>
  <rect x="76" y="260" width="140" height="32" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="146" y="281" font-size="11.5" fill="#2C4460" text-anchor="middle">父 · 睡在内核</text>
  <rect x="232" y="260" width="140" height="32" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="302" y="281" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">子 · 正在跑</text>
  <line x1="372" y1="276" x2="398" y2="276" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#p1r)"/>
  <rect x="402" y="260" width="154" height="32" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="479" y="281" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">同一个 mm · 同一个栈</text>

  <text x="628" y="118" font-size="13" font-weight="700" fill="#4A473F">B · 把 _exit 写成 return 之后</text>

  <rect x="628" y="130" width="556" height="186" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="648" y="146" width="516" height="42" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="666" y="163" font-size="11.5" font-weight="700" fill="#733428">① 子进程 return，弹掉当前函数的栈帧</text>
  <text x="666" y="180" font-size="10.5" fill="#733428">这个栈帧父子共用，只有一份</text>

  <line x1="906" y1="188" x2="906" y2="198" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#p1r)"/>

  <rect x="648" y="200" width="516" height="42" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="666" y="217" font-size="11.5" font-weight="700" fill="#733428">② 父进程被唤醒，从同一个函数返回</text>
  <text x="666" y="234" font-size="10.5" fill="#733428">返回地址所在的栈空间已经被覆盖</text>

  <line x1="906" y1="242" x2="906" y2="252" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#p1r)"/>

  <rect x="648" y="254" width="516" height="42" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.8"/>
  <text x="666" y="271" font-size="11.5" font-weight="700" fill="#733428">③ 跳到垃圾地址</text>
  <text x="666" y="288" font-size="10.5" fill="#733428">段错误是好结果，跳进能跑的代码才是坏结果</text>

  <text x="56" y="356" font-size="13" font-weight="700" fill="#4A473F">C · 子进程能做什么、不能做什么</text>

  <rect x="56" y="368" width="1128" height="32" rx="6" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="76" y="389" font-size="11.5" font-weight="700" fill="#4A473F">操作</text>
  <text x="330" y="389" font-size="11.5" font-weight="700" fill="#4A473F">允许？</text>
  <text x="520" y="389" font-size="11.5" font-weight="700" fill="#4A473F">为什么</text>

  <rect x="56" y="404" width="1128" height="36" rx="6" fill="#E9F1EC" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="76" y="427" font-size="11.5" font-weight="700" fill="#24473F">exec 系列</text>
  <text x="330" y="427" font-size="11.5" font-weight="700" fill="#24473F">允许</text>
  <text x="520" y="427" font-size="11.5" fill="#4A473F">整个地址空间被换掉，父进程随即被唤醒</text>

  <rect x="56" y="444" width="1128" height="36" rx="6" fill="#E9F1EC" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="76" y="467" font-size="11.5" font-weight="700" fill="#24473F">_exit()</text>
  <text x="330" y="467" font-size="11.5" font-weight="700" fill="#24473F">允许</text>
  <text x="520" y="467" font-size="11.5" fill="#4A473F">直接进内核结束，不碰用户态的任何状态</text>

  <rect x="56" y="484" width="1128" height="36" rx="6" fill="#F7ECE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="76" y="507" font-size="11.5" font-weight="700" fill="#733428">return</text>
  <text x="330" y="507" font-size="11.5" font-weight="700" fill="#733428">禁止</text>
  <text x="520" y="507" font-size="11.5" fill="#4A473F">弹掉父子共用的栈帧，见上图三步</text>

  <rect x="56" y="524" width="1128" height="36" rx="6" fill="#F7ECE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="76" y="547" font-size="11.5" font-weight="700" fill="#733428">exit()</text>
  <text x="330" y="547" font-size="11.5" font-weight="700" fill="#733428">禁止</text>
  <text x="520" y="547" font-size="11.5" fill="#4A473F">会跑 atexit 钩子、刷掉父进程的 stdio 缓冲</text>

  <rect x="56" y="564" width="1128" height="36" rx="6" fill="#F7ECE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="76" y="587" font-size="11.5" font-weight="700" fill="#733428">printf / malloc</text>
  <text x="330" y="587" font-size="11.5" font-weight="700" fill="#733428">禁止</text>
  <text x="520" y="587" font-size="11.5" fill="#4A473F">动的是父进程的全局状态，父进程醒来后看到被改过的现场</text>
</svg>
