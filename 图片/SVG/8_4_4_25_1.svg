<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>两条 rail，也要检查它们在主机内部是否再次汇聚</title>
<desc>NUMA 本地性、PCIe Root 与 GPU P2P 是不同属性；同名 NIC 也不证明跨节点 rail 对应。</desc>
<defs>
<marker id="8_4_4_25_1-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="8_4_4_25_1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="8_4_4_25_1-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="8_4_4_25_1-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="45" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">两条 rail，也要检查它们在主机内部是否再次汇聚</text>
<text x="48" y="74" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">NUMA 本地性、PCIe Root 与 GPU P2P 是不同属性；同名 NIC 也不证明跨节点 rail 对应。</text>
<rect x="48" y="113" width="548" height="405" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="66" y="141" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A0 · NUMA node 0（拓扑示意）</text>
<rect x="72" y="162" width="214" height="63" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="179.0" y="187.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">CPU 0 · 提交 / CQ</text>
<text x="179.0" y="209.5" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">绑到实际逻辑 CPU</text>
<rect x="355" y="162" width="217" height="63" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="463.5" y="187.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">DRAM 0</text>
<text x="463.5" y="209.5" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">分配 / first touch</text>
<line x1="286" y1="194" x2="351" y2="194" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_25_1-arr)" marker-start="url(#8_4_4_25_1-arr)"/>
<rect x="205" y="260" width="235" height="48" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="322.5" y="289.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">PCIe Root 0</text>
<polyline points="180,225 180,244 322,244 322,256" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<rect x="205" y="342" width="235" height="48" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="322.5" y="371.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">PCIe switch（若存在）</text>
<line x1="322" y1="308" x2="322" y2="338" stroke="#5A564B" stroke-width="1.7"/>
<rect x="72" y="430" width="214" height="60" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="179.0" y="454.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">GPU 0</text>
<text x="179.0" y="476.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">实际验证 GDR</text>
<rect x="355" y="430" width="217" height="60" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="463.5" y="454.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">NIC 0 / port</text>
<text x="463.5" y="476.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">GID · QP · MR</text>
<polyline points="322,390 322,411 179,411 179,426" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round"/>
<polyline points="322,411 463,411 463,426" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round"/>
<rect x="644" y="113" width="548" height="405" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="662" y="141" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A1 · NUMA node 1（拓扑示意）</text>
<rect x="668" y="162" width="214" height="63" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="775.0" y="187.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">CPU 1 · 提交 / CQ</text>
<text x="775.0" y="209.5" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">绑到实际逻辑 CPU</text>
<rect x="951" y="162" width="217" height="63" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="1059.5" y="187.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">DRAM 1</text>
<text x="1059.5" y="209.5" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">分配 / first touch</text>
<line x1="882" y1="194" x2="947" y2="194" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_25_1-arr)" marker-start="url(#8_4_4_25_1-arr)"/>
<rect x="801" y="260" width="235" height="48" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="918.5" y="289.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">PCIe Root 1</text>
<polyline points="776,225 776,244 918,244 918,256" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<rect x="801" y="342" width="235" height="48" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="918.5" y="371.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">PCIe switch（若存在）</text>
<line x1="918" y1="308" x2="918" y2="338" stroke="#5A564B" stroke-width="1.7"/>
<rect x="668" y="430" width="214" height="60" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="775.0" y="454.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">GPU 1</text>
<text x="775.0" y="476.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">实际验证 GDR</text>
<rect x="951" y="430" width="217" height="60" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="1059.5" y="454.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">NIC 1 / port</text>
<text x="1059.5" y="476.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">GID · QP · MR</text>
<polyline points="918,390 918,411 775,411 775,426" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round"/>
<polyline points="918,411 1059,411 1059,426" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round"/>
<polyline points="322,252 322,235 919,235 919,252" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="5 4"/>
<text x="616" y="249" font-size="12" font-weight="400" fill="#A64B3C" text-anchor="middle" data-role="body">跨 CPU 互连</text>
<line x1="463" y1="492" x2="463" y2="533" stroke="#3D5A80" stroke-width="1.7" marker-end="url(#8_4_4_25_1-blue)"/>
<line x1="1059" y1="492" x2="1059" y2="533" stroke="#3D5A80" stroke-width="1.7" marker-end="url(#8_4_4_25_1-blue)"/>
<rect x="355" y="540" width="217" height="42" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="463.5" y="566.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Fabric rail 0</text>
<rect x="951" y="540" width="217" height="42" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="1059.5" y="566.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Fabric rail 1</text>
<text x="68" y="550" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">还要核对远端拓扑</text>
<text x="68" y="574" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">与 Fabric 公共边</text>
<rect x="48" y="601" width="1144" height="48" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="67" y="631" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="body">反例：双 NIC → 同一 PCIe 上联</text>
<text x="578" y="631" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="body">网络端口之和 ≠ 共享上联容量</text>
<text x="48" y="670" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">结构示意，不替代主板框图或 P2P 测试；双口卡还可能共享芯片、固件和供电故障域。</text>
</svg>