<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 视觉系统对齐 8_0_1 / 8_0_2 / 8_0_3：
       底色 rgb(245,244,237)
       蓝 #E3EAF4 / #3D5A80 / #2C4460
       绿 #DCE9E3 / #2F6B5E / #24473F
       琥珀 #EFE7DA / #8A6A3A / #6B4E28
       红 #F0E0DB / #A64B3C / #733428
       中性 #F1EFE8 / #D8D5C8 / #4A473F / #6B675C / #2B2A26
       面板底 #FBFBF6 · 实心三角箭头 #5A564B -->
  <title>控制、数据与通知走不同路径</title>
  <desc>上半：PCIe 分层网络结构。中部：四种访问机制对照。下半：NVMe 提交与完成闭环中的路径分工。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">一笔 I/O：控制、数据与通知走不同路径</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">BAR 提供 CPU→设备入口 · MMIO 做控制面 · DMA 搬队列与数据 · MSI-X 闭环通知</text>

  <!-- ============ Panel A：PCIe hierarchy ============ -->
  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">A · PCIe 最小心智模型：点对点链路 + 交换节点，不是共享并行总线</text>

  <rect x="48" y="124" width="1144" height="168" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <!-- CPU / Memory -->
  <rect x="72" y="160" width="150" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="147" y="190" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">CPU / Memory</text>
  <text x="147" y="210" font-size="11" fill="#3D5A80" text-anchor="middle">主机侧</text>

  <path d="M222,196 L260,196" fill="none" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrb)"/>

  <!-- Root Complex -->
  <rect x="264" y="160" width="160" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="344" y="185" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">Root Complex</text>
  <text x="344" y="205" font-size="10.5" fill="#3D5A80" text-anchor="middle">连接 CPU/内存与 hierarchy</text>
  <text x="344" y="220" font-size="10.5" fill="#3D5A80" text-anchor="middle">含 Root Port</text>

  <path d="M424,196 L462,196" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>

  <!-- Switch -->
  <rect x="466" y="160" width="170" height="72" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.5"/>
  <text x="551" y="185" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">Switch / Bridge</text>
  <text x="551" y="205" font-size="10.5" fill="#6B675C" text-anchor="middle">可选 · 转发事务</text>
  <text x="551" y="220" font-size="10.5" fill="#6B675C" text-anchor="middle">形成下游总线</text>

  <path d="M636,196 L674,196" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>

  <!-- Endpoint -->
  <rect x="678" y="160" width="200" height="72" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="778" y="185" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">Endpoint (EP)</text>
  <text x="778" y="205" font-size="10.5" fill="#8A6A3A" text-anchor="middle">NVMe / NIC / GPU</text>
  <text x="778" y="220" font-size="10.5" fill="#8A6A3A" text-anchor="middle">终端功能</text>

  <!-- BDF badge -->
  <rect x="920" y="160" width="240" height="72" rx="7" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="1040" y="185" font-size="12" font-weight="700" fill="#6B5B95" text-anchor="middle">BDF 定位 function</text>
  <text x="1040" y="205" font-size="12" fill="#4A473F" text-anchor="middle">0000:5e:00.0</text>
  <text x="1040" y="222" font-size="10.5" fill="#6B675C" text-anchor="middle">domain · bus · device · function</text>

  <!-- ============ Panel B：四种访问 ============ -->
  <text x="48" y="330" font-size="13" font-weight="700" fill="#4A473F">B · 四种访问：发起者、目标与语义都不同</text>

  <!-- card 1 CPU -->
  <rect x="48" y="344" width="274" height="168" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="48" y="344" width="274" height="34" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="48" y="366" width="274" height="12" fill="#E3EAF4"/>
  <text x="185" y="367" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">① CPU load/store</text>
  <text x="68" y="400" font-size="12" fill="#4A473F">发起者：CPU</text>
  <text x="68" y="422" font-size="12" fill="#4A473F">目标：主机 DRAM</text>
  <text x="68" y="444" font-size="12" fill="#4A473F">内容：软件数据</text>
  <text x="68" y="466" font-size="11.5" fill="#3D5A80">NVMe：填 SQE · 读 CQE</text>
  <text x="68" y="490" font-size="11" fill="#6B675C">普通访存，不是设备寄存器</text>

  <!-- card 2 DMA -->
  <rect x="338" y="344" width="274" height="168" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="338" y="344" width="274" height="34" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="338" y="366" width="274" height="12" fill="#DCE9E3"/>
  <text x="475" y="367" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">② DMA</text>
  <text x="358" y="400" font-size="12" fill="#4A473F">发起者：设备</text>
  <text x="358" y="422" font-size="12" fill="#4A473F">目标：主机内存</text>
  <text x="358" y="444" font-size="12" fill="#4A473F">内容：命令 / 完成 / 业务数据</text>
  <text x="358" y="466" font-size="11.5" fill="#2F6B5E">NVMe：读 SQE · 写 CQE+数据</text>
  <text x="358" y="490" font-size="11" fill="#6B675C">经 IOVA/IOMMU → PA</text>

  <!-- card 3 MMIO -->
  <rect x="628" y="344" width="274" height="168" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="628" y="344" width="274" height="34" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <rect x="628" y="366" width="274" height="12" fill="#EFE7DA"/>
  <text x="765" y="367" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">③ MMIO</text>
  <text x="648" y="400" font-size="12" fill="#4A473F">发起者：CPU</text>
  <text x="648" y="422" font-size="12" fill="#4A473F">目标：设备 BAR aperture</text>
  <text x="648" y="444" font-size="12" fill="#4A473F">内容：少量控制信息</text>
  <text x="648" y="466" font-size="11.5" fill="#8A6A3A">NVMe：写 Doorbell</text>
  <text x="648" y="490" font-size="11" fill="#6B675C">控制面通知，非数据搬运</text>

  <!-- card 4 MSI-X -->
  <rect x="918" y="344" width="274" height="168" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="918" y="344" width="274" height="34" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="918" y="366" width="274" height="12" fill="#F0E0DB"/>
  <text x="1055" y="367" font-size="13" font-weight="700" fill="#733428" text-anchor="middle">④ MSI-X</text>
  <text x="938" y="400" font-size="12" fill="#4A473F">发起者：设备</text>
  <text x="938" y="422" font-size="12" fill="#4A473F">目标：平台中断目标</text>
  <text x="938" y="444" font-size="12" fill="#4A473F">内容：中断消息</text>
  <text x="938" y="466" font-size="11.5" fill="#A64B3C">NVMe：通知某 CQ 有完成</text>
  <text x="938" y="490" font-size="11" fill="#6B675C">线路上是 MemWr TLP</text>

  <!-- ============ Panel C：闭环 ============ -->
  <text x="48" y="550" font-size="13" font-weight="700" fill="#4A473F">C · 提交与完成：四路径如何串成一笔 NVMe 请求</text>

  <rect x="48" y="564" width="1144" height="288" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <!-- Submit lane -->
  <rect x="68" y="584" width="1104" height="100" rx="7" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="84" y="608" font-size="12" font-weight="700" fill="#3D5A80">提交</text>

  <rect x="160" y="600" width="140" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="230" y="622" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">CPU 写 SQE</text>
  <text x="230" y="640" font-size="10.5" fill="#3D5A80" text-anchor="middle">① 普通访存</text>

  <path d="M300,626 L330,626" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arrn)"/>

  <rect x="334" y="600" width="140" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="404" y="622" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">发布同步</text>
  <text x="404" y="640" font-size="10.5" fill="#3D5A80" text-anchor="middle">DMA/MMIO barrier</text>

  <path d="M474,626 L504,626" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arrn)"/>

  <rect x="508" y="600" width="160" height="52" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="588" y="622" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">MMIO 写 Doorbell</text>
  <text x="588" y="640" font-size="10.5" fill="#8A6A3A" text-anchor="middle">③ posted write</text>

  <path d="M668,626 L698,626" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arrn)"/>

  <rect x="702" y="600" width="180" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="792" y="622" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">设备 DMA Read SQE</text>
  <text x="792" y="640" font-size="10.5" fill="#2F6B5E" text-anchor="middle">② 从主机 DRAM</text>

  <rect x="920" y="600" width="220" height="52" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1030" y="622" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">控制面：①→③ 通知设备</text>
  <text x="1030" y="640" font-size="10.5" fill="#6B675C" text-anchor="middle">数据面：② 取命令</text>

  <!-- Complete lane -->
  <rect x="68" y="704" width="1104" height="100" rx="7" fill="#F4E9E4" stroke="#D8D5C8" stroke-width="1"/>
  <text x="84" y="728" font-size="12" font-weight="700" fill="#A64B3C">完成</text>

  <rect x="160" y="720" width="200" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="260" y="742" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">DMA Write 数据 + CQE</text>
  <text x="260" y="760" font-size="10.5" fill="#2F6B5E" text-anchor="middle">② 写回主机内存</text>

  <path d="M360,746 L390,746" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arrn)"/>

  <rect x="394" y="720" width="160" height="52" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="474" y="742" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">MSI-X 消息</text>
  <text x="474" y="760" font-size="10.5" fill="#A64B3C" text-anchor="middle">④ MemWr TLP</text>

  <path d="M554,746 L584,746" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arrn)"/>

  <rect x="588" y="720" width="170" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="673" y="742" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">CPU 进 IRQ 路径</text>
  <text x="673" y="760" font-size="10.5" fill="#3D5A80" text-anchor="middle">affinity 落点</text>

  <path d="M758,746 L788,746" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arrn)"/>

  <rect x="792" y="720" width="150" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="867" y="742" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">CPU 读 CQE</text>
  <text x="867" y="760" font-size="10.5" fill="#3D5A80" text-anchor="middle">① + 协议同步</text>

  <rect x="980" y="720" width="160" height="52" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1060" y="742" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">IRQ ≠ acquire</text>
  <text x="1060" y="760" font-size="10.5" fill="#6B675C" text-anchor="middle">仍需读 phase/status</text>
</svg>
