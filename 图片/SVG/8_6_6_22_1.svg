<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">ARC：驻留数据、Ghost 历史与目标 p</title>
<desc id="desc">容量为 4，目标 p 为 2，T1 和 T2 各有两页。T1 的 P17 被 pin，其他三页可淘汰。B1 有 P8、P5，B2 有 P3；ghost 不保留页数据和当前 frame 所有权。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)"/>
<text class="title" x="48" y="52" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">ARC：驻留数据、Ghost 历史与目标 p</text>
<text class="subtitle" x="48" y="81" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">示意快照：c = 4，p = 2；每列列表从左到右为 MRU → LRU</text>
<rect x="48" y="117" width="546" height="396" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<rect x="650" y="117" width="542" height="396" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text class="body" x="70" y="148" font-size="17" fill="#3D5A80" font-weight="700" text-anchor="start">驻留区：占用数据 frame</text>
<text class="body" x="672" y="148" font-size="17" fill="#6B675C" font-weight="700" text-anchor="start">历史区：只有 page 身份</text>
<text class="body" x="70" y="180" font-size="15" fill="#3D5A80" font-weight="700" text-anchor="start">T1 / MRU · 最近只见过一次</text>
<text class="body" x="672" y="180" font-size="15" fill="#3D5A80" font-weight="700" text-anchor="start">B1 / MRU ghost</text>
<text class="body" x="70" y="339" font-size="15" fill="#2F6B5E" font-weight="700" text-anchor="start">T2 / MFU · 最近存在复用证据</text>
<text class="body" x="672" y="339" font-size="15" fill="#2F6B5E" font-weight="700" text-anchor="start">B2 / MFU ghost</text>
<text class="body" x="87" y="205" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">MRU</text>
<text class="body" x="540" y="205" font-size="13" fill="#6B675C" font-weight="400" text-anchor="end">LRU</text>
<text class="body" x="691" y="205" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">MRU</text>
<text class="body" x="1138" y="205" font-size="13" fill="#6B675C" font-weight="400" text-anchor="end">LRU</text>
<text class="body" x="87" y="364" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">MRU</text>
<text class="body" x="540" y="364" font-size="13" fill="#6B675C" font-weight="400" text-anchor="end">LRU</text>
<text class="body" x="691" y="364" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">MRU</text>
<text class="body" x="1138" y="364" font-size="13" fill="#6B675C" font-weight="400" text-anchor="end">LRU</text>
<rect x="72" y="217" width="238" height="82" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text class="body" x="191" y="247" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="middle">P17 @ F0</text>
<text class="body" x="191" y="276" font-size="14" fill="#A64B3C" font-weight="400" text-anchor="middle">pin = 1 · 不可淘汰</text>
<rect x="328" y="217" width="238" height="82" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text class="body" x="447" y="247" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="middle">P42 @ F1</text>
<text class="body" x="447" y="276" font-size="14" fill="#2F6B5E" font-weight="400" text-anchor="middle">pin = 0 · 可淘汰</text>
<rect x="72" y="376" width="238" height="82" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text class="body" x="191" y="406" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="middle">P9 @ F2</text>
<text class="body" x="191" y="435" font-size="14" fill="#2F6B5E" font-weight="400" text-anchor="middle">pin = 0 · 可淘汰</text>
<rect x="328" y="376" width="238" height="82" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text class="body" x="447" y="406" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="middle">P6 @ F3</text>
<text class="body" x="447" y="435" font-size="14" fill="#2F6B5E" font-weight="400" text-anchor="middle">pin = 0 · 可淘汰</text>
<rect x="674" y="217" width="238" height="82" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="body" x="793" y="247" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="middle">P8</text>
<text class="body" x="793" y="276" font-size="14" fill="#6B675C" font-weight="400" text-anchor="middle">无数据 · 无当前 frame</text>
<rect x="930" y="217" width="238" height="82" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="body" x="1049" y="247" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="middle">P5</text>
<text class="body" x="1049" y="276" font-size="14" fill="#6B675C" font-weight="400" text-anchor="middle">无数据 · 无当前 frame</text>
<rect x="674" y="376" width="238" height="82" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="body" x="793" y="406" font-size="18" fill="#2B2A26" font-weight="700" text-anchor="middle">P3</text>
<text class="body" x="793" y="435" font-size="14" fill="#6B675C" font-weight="400" text-anchor="middle">无数据 · 无当前 frame</text>
<text class="body" x="72" y="486" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">resident = 4，evictable = 3</text>
<text class="body" x="674" y="486" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">ghost = 3，目录总条目 = 7 ≤ 2c</text>
<path d="M597 258 H646" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text class="body" x="621" y="239" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle">淘汰</text>
<path d="M597 417 H646" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text class="body" x="621" y="398" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle">淘汰</text>
<rect x="48" y="536" width="1144" height="100" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
<text class="body" x="70" y="565" font-size="16" fill="#B07D2B" font-weight="700" text-anchor="start">反馈调节目标 p</text>
<text class="body" x="70" y="593" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">B1 命中：p ↑</text>
<text class="body" x="70" y="619" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">B2 命中：p ↓</text>
<rect x="366" y="564" width="74" height="30" rx="0" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.4"/>
<rect x="440" y="564" width="74" height="30" rx="0" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.4"/>
<rect x="514" y="564" width="74" height="30" rx="0" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1.4"/>
<rect x="588" y="564" width="74" height="30" rx="0" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1.4"/>
<text class="body" x="366" y="613" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle">0</text>
<text class="body" x="440" y="613" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle">1</text>
<text class="body" x="514" y="613" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle">2</text>
<text class="body" x="588" y="613" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle">3</text>
<text class="body" x="662" y="613" font-size="13" fill="#6B675C" font-weight="400" text-anchor="middle">4</text>
<path d="M514 552 V598" fill="none" stroke="#5A564B" stroke-width="1.7"/>
<text class="body" x="514" y="552" font-size="14" fill="#B07D2B" font-weight="700" text-anchor="middle">p = 2</text>
<text class="body" x="720" y="570" font-size="16" fill="#B07D2B" font-weight="700" text-anchor="start">目标 p 不是硬配额</text>
<text class="body" x="720" y="596" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">需要腾位且 |T1| = p：先查 T1</text>
<text class="body" x="720" y="619" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">从最旧端查找，跳过 pinned，必要时换侧</text>
<text class="footer" x="48" y="676" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">Ghost 命中仍是数据缓存 miss；图中的箭头不代表脏页已经完成写回。</text>
</svg>
