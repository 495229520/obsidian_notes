<text x="901.0" y="204.0" font-size="13.5" fill="#6B5B95" font-weight="400" text-anchor="middle" data-zone="body">可变</text>
<rect x="992" y="158" width="74" height="59" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1029.0" y="181.0" font-size="13.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">ICRC</text>
<text x="1029.0" y="204.0" font-size="13.5" fill="#6B4E28" font-weight="400" text-anchor="middle" data-zone="body">4 B</text>
