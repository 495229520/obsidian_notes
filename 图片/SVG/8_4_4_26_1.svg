<text x="444.0" y="264.0" font-size="13.5" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">IPv6</text>
<text x="444.0" y="287.0" font-size="13.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-zone="body">40 B*</text>
<rect x="508" y="241" width="84" height="59" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="550.0" y="264.0" font-size="13.5" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">UDP</text>
<text x="550.0" y="287.0" font-size="13.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-zone="body">8 B</text>
<rect x="592" y="241" width="94" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="639.0" y="264.0" font-size="13.5" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">BTH</text>
<text x="639.0" y="287.0" font-size="13.5" fill="#24473F" font-weight="400" text-anchor="middle" data-zone="body">12 B</text>
<rect x="686" y="241" width="124" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="748.0" y="264.0" font-size="13.5" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">扩展头</text>
<text x="748.0" y="287.0" font-size="13.5" fill="#24473F" font-weight="400" text-anchor="middle" data-zone="body">按 opcode</text>
<rect x="810" y="241" width="182" height="59" rx="8" fill="#EDEAF3" stroke="#8A7BA6" stroke-width="1.3"/>
<text x="901.0" y="264.0" font-size="13.5" fill="#6B5B95" font-weight="700" text-anchor="middle" data-zone="body">Data + Pad</text>
<text x="901.0" y="287.0" font-size="13.5" fill="#6B5B95" font-weight="400" text-anchor="middle" data-zone="body">可变</text>
<rect x="992" y="241" width="74" height="59" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1029.0" y="264.0" font-size="13.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">ICRC</text>
<text x="1029.0" y="287.0" font-size="13.5" fill="#6B4E28" font-weight="400" text-anchor="middle" data-zone="body">4 B</text>
<rect x="1066" y="241" width="78" height="59" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1105.0" y="264.0" font-size="13.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">FCS</text>
<text x="1105.0" y="287.0" font-size="13.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-zone="body">4 B</text>
<text x="460" y="233" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">* 不含 options / extension headers</text>
<rect x="48" y="342" width="750" height="254" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="370" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">B · BTH：每行 32 bit，共 12 B</text>
<text x="76" y="394" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">31</text>
<text x="772" y="394" font-size="12" fill="#6B675C" font-weight="400" text-anchor="end" data-zone="body">0</text>
<rect x="76" y="404" width="174.0" height="44" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="163.0" y="431.0" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">Opcode · 8</text>
