<text x="234.0" y="264.0" font-size="13.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">VLAN</text>
<text x="234.0" y="287.0" font-size="13.5" fill="#6B4E28" font-weight="400" text-anchor="middle" data-zone="body">可选 4 B</text>
<rect x="278" y="241" width="102" height="59" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="329.0" y="264.0" font-size="13.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">EtherType</text>
<text x="329.0" y="287.0" font-size="13.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-zone="body">2 B</text>
