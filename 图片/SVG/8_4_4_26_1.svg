<text x="130.0" y="181.0" font-size="13.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">DA + SA</text>
<text x="130.0" y="204.0" font-size="13.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-zone="body">12 B</text>
