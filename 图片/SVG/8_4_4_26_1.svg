<text x="329.0" y="181.0" font-size="13.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">EtherType</text>
<text x="329.0" y="204.0" font-size="13.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-zone="body">2 B</text>
<rect x="380" y="158" width="128" height="59" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
