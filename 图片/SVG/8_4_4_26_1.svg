<text x="337.0" y="431.0" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">Flags · 8</text>
<rect x="424.0" y="404" width="348.0" height="44" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="598.0" y="431.0" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">P_Key · 16</text>
<rect x="76" y="452" width="174.0" height="44" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="163.0" y="479.0" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">控制 / 保留 · 8</text>
<rect x="250.0" y="452" width="522.0" height="44" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="511.0" y="479.0" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">Destination QPN · 24</text>
<rect x="76" y="500" width="174.0" height="44" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="163.0" y="527.0" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">AckReq + 保留 · 8</text>
<rect x="250.0" y="500" width="522.0" height="44" rx="8" fill="#EDEAF3" stroke="#8A7BA6" stroke-width="1.3"/>
<text x="511.0" y="527.0" font-size="13" fill="#6B5B95" font-weight="700" text-anchor="middle" data-zone="body">PSN · 24</text>
<text x="78" y="573" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">Flags：SE · MIG · Pad Count（2）· Tver（4）</text>
<rect x="818" y="342" width="374" height="254" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="840" y="370" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">C · 字段职责</text>
<text x="838" y="409" font-size="14" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">目的 IP</text>
<text x="962" y="409" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">选择目的主机</text>
<text x="838" y="457" font-size="14" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">Dest QPN</text>
<text x="962" y="457" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">选择目的 QP</text>
<text x="838" y="505" font-size="14" fill="#24473F" font-weight="700" text-anchor="start" data-zone="body">RETH / rkey</text>
<text x="962" y="505" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">远端内存访问</text>
<text x="838" y="553" font-size="14" fill="#6B5B95" font-weight="700" text-anchor="start" data-zone="body">PSN</text>
<text x="962" y="553" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">包序号，不是字节序号</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="646" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="footer">IPv4/IPv6 后面不再追加一份 IB GRH；普通 RC BTH 没有对称的 Source QPN 字段。</text>
