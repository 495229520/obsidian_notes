<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="title desc">
  <title id="title">高精度加法的竖式与进位</title>
  <desc id="desc">以 167 + 58 = 225 为例，从个位起逐位相加，t = A[i] + B[i] + 进位，写下 t%10 并把 t/10 进到高位。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <style>
      .title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .sub   { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #465564; }
      .val   { font: 600 22px "Consolas", "Microsoft YaHei", monospace; fill: #23313f; }
      .op    { font: 600 22px "Consolas", "Microsoft YaHei", monospace; fill: #465564; }
      .carry { font: 600 16px "Consolas", "Microsoft YaHei", monospace; fill: #c5612f; }
      .clab  { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5a6876; }
      .fml   { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .eg    { font: 14px "Consolas", "Microsoft YaHei", monospace; fill: #465564; }
      .cellA { fill: #dbe7f5; stroke: #2f6cb0; stroke-width: 1.4; }
      .cellB { fill: #eae6f6; stroke: #6a59c0; stroke-width: 1.4; }
      .cellC { fill: #d8ead8; stroke: #4f9a68; stroke-width: 1.8; }
      .rule  { stroke: #5a6876; stroke-width: 2; }
      .panel { fill: #fbfaf4; stroke: #d9cfbd; stroke-width: 1.4; }
    </style>
  </defs>

  <text x="290" y="40" text-anchor="middle" class="title">高精度加法：167 + 58 = 225</text>
  <text x="290" y="66" text-anchor="middle" class="sub">从个位起逐位相加，进位朝高位传递</text>

  <!-- 列标 -->
  <text x="300" y="100" text-anchor="middle" class="clab">百</text>
  <text x="400" y="100" text-anchor="middle" class="clab">十</text>
  <text x="500" y="100" text-anchor="middle" class="clab">个</text>

  <!-- 进位行 -->
  <text x="270" y="128" text-anchor="middle" class="carry">¹</text>
  <text x="370" y="128" text-anchor="middle" class="carry">¹</text>
  <text x="180" y="128" text-anchor="start" class="clab" fill="#c5612f">进位 →</text>

  <!-- A 行 -->
  <rect x="260" y="136" width="80" height="54" rx="6" class="cellA"/>
  <rect x="360" y="136" width="80" height="54" rx="6" class="cellA"/>
  <rect x="460" y="136" width="80" height="54" rx="6" class="cellA"/>
  <text x="300" y="163" text-anchor="middle" class="val">1</text>
  <text x="400" y="163" text-anchor="middle" class="val">6</text>
  <text x="500" y="163" text-anchor="middle" class="val">7</text>

  <!-- B 行 -->
  <text x="228" y="227" text-anchor="middle" class="op">+</text>
  <rect x="360" y="208" width="80" height="54" rx="6" class="cellB"/>
  <rect x="460" y="208" width="80" height="54" rx="6" class="cellB"/>
  <text x="400" y="235" text-anchor="middle" class="val">5</text>
  <text x="500" y="235" text-anchor="middle" class="val">8</text>

  <!-- 横线 -->
  <line x1="210" y1="278" x2="552" y2="278" class="rule"/>

  <!-- C 行 -->
  <rect x="260" y="290" width="80" height="54" rx="6" class="cellC"/>
  <rect x="360" y="290" width="80" height="54" rx="6" class="cellC"/>
  <rect x="460" y="290" width="80" height="54" rx="6" class="cellC"/>
  <text x="300" y="317" text-anchor="middle" class="val">2</text>
  <text x="400" y="317" text-anchor="middle" class="val">2</text>
  <text x="500" y="317" text-anchor="middle" class="val">5</text>

  <!-- 公式面板 -->
  <rect x="596" y="92" width="268" height="252" rx="8" class="panel"/>
  <text x="616" y="124" text-anchor="start" class="fml">① t = A[i] + B[i] + 进位</text>
  <text x="616" y="152" text-anchor="start" class="fml">② C[i] = t % 10　（结果位）</text>
  <text x="616" y="180" text-anchor="start" class="fml">③ 进位 = t / 10</text>
  <text x="616" y="208" text-anchor="start" class="fml">④ 末尾进位≠0 → 再补一位</text>
  <line x1="616" y1="228" x2="844" y2="228" stroke="#d9cfbd" stroke-width="1.2"/>
  <text x="616" y="254" text-anchor="start" class="eg">个位: 7+8 = 15 → 写 5 进 1</text>
  <text x="616" y="280" text-anchor="start" class="eg">十位: 6+5+1 = 12 → 写 2 进 1</text>
  <text x="616" y="306" text-anchor="start" class="eg">百位: 1+0+1 = 2 → 写 2</text>
  <text x="616" y="332" text-anchor="start" class="eg">结果 = 225</text>
</svg>
