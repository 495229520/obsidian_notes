<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #435363; }
      .cell { font-size: 12px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
      .code { font-size: 14px; fill: #334155; }
    </style>
  </defs>
  <text x="56" y="54" class="title">mask load / store 处理非整除边界</text>
  <text x="56" y="83" class="subtitle">边缘 tile 会落到矩阵外：load 用 other=0.0，store 用 mask 防止越界写</text>

  <rect x="76" y="136" width="312" height="282" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="106" y="174" class="head">边缘 C tile</text>
  <g transform="translate(116,205)">
    <rect x="0" y="0" width="210" height="150" fill="#e7efe3" stroke="#84a96d"/>
    <line x1="70" y1="0" x2="70" y2="150" stroke="#b6c7ae"/>
    <line x1="140" y1="0" x2="140" y2="150" stroke="#b6c7ae"/>
    <line x1="0" y1="50" x2="210" y2="50" stroke="#b6c7ae"/>
    <line x1="0" y1="100" x2="210" y2="100" stroke="#b6c7ae"/>
    <rect x="140" y="100" width="70" height="50" fill="#f7e8e5" stroke="#c98e83"/>
    <text x="35" y="25" class="cell">valid</text>
    <text x="105" y="75" class="cell">valid</text>
    <text x="175" y="125" class="cell">masked</text>
  </g>
  <text x="106" y="388" class="body">非整除 M/N 时，C 的边缘位置不能写出界。</text>

  <rect x="468" y="136" width="576" height="282" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="500" y="174" class="head">Triton mask 形状</text>
  <text x="500" y="218" class="code">a_mask = (offs_m[:, None] &lt; M) &amp; (k_idxs[None, :] &lt; K)</text>
  <text x="500" y="252" class="code">b_mask = (k_idxs[:, None] &lt; K) &amp; (offs_n[None, :] &lt; N)</text>
  <text x="500" y="286" class="code">a = tl.load(a_ptrs, mask=a_mask, other=0.0)</text>
  <text x="500" y="320" class="code">b = tl.load(b_ptrs, mask=b_mask, other=0.0)</text>
  <text x="500" y="354" class="code">tl.store(c_ptrs, acc, mask=c_mask)</text>
  <line x1="398" y1="277" x2="452" y2="277" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="184" y="470" width="752" height="52" rx="8" fill="#efe8f6" stroke="#aa92c5"/>
  <text x="230" y="503" class="body">`127 x 129 x 131` 会同时测试 M、N、K 三个方向的 mask。</text>
</svg>
