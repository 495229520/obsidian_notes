<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>非阻塞 RPC 的连接与解析状态机</title>
  <desc>连接级状态、帧头与消息体解析状态、输出缓冲区与 epoll 兴趣集共同保存一次 I/O 做到一半的现场。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1300" height="820" fill="#f7f6f2"/>
  <text x="50" y="58" font-size="22" font-weight="700" fill="#1f2937">连接状态机：非阻塞 RPC 为何必须保存“半途现场”</text>
  <text x="50" y="92" font-size="13.5" fill="#4b5563">推荐把连接级状态、解析级状态和输出积压分开理解，而不是塞进一个巨大的 if/else。</text>

  <rect x="85" y="180" width="230" height="88" rx="14" fill="#e8eef9" stroke="#4f6fad" stroke-width="2"/>
  <text x="200" y="214" text-anchor="middle" font-size="23" font-weight="700" fill="#274472">Connecting</text>
  <text x="200" y="242" text-anchor="middle" font-size="15" fill="#274472">建立连接 / 注册 epoll</text>

  <rect x="500" y="180" width="300" height="120" rx="16" fill="#eef5ec" stroke="#5d8a56" stroke-width="2"/>
  <text x="650" y="216" text-anchor="middle" font-size="25" font-weight="700" fill="#2d5a27">Open</text>
  <text x="650" y="245" text-anchor="middle" font-size="15" fill="#2d5a27">连接存活，可读可写</text>
  <text x="650" y="271" text-anchor="middle" font-size="15" fill="#2d5a27">内部还分 ReadingHeader / ReadingBody</text>

  <rect x="980" y="180" width="220" height="88" rx="14" fill="#f8efd8" stroke="#a07d2b" stroke-width="2"/>
  <text x="1090" y="214" text-anchor="middle" font-size="23" font-weight="700" fill="#6a5017">Closing</text>
  <text x="1090" y="242" text-anchor="middle" font-size="15" fill="#6a5017">失败挂起调用 / 清理 fd</text>

  <rect x="980" y="360" width="220" height="88" rx="14" fill="#f0e8fb" stroke="#7a58a3" stroke-width="2"/>
  <text x="1090" y="394" text-anchor="middle" font-size="23" font-weight="700" fill="#5c3b86">Closed</text>
  <text x="1090" y="422" text-anchor="middle" font-size="15" fill="#5c3b86">对象销毁 / 从 epoll 移除</text>

  <line x1="315" y1="224" x2="500" y2="224" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="407" y="205" text-anchor="middle" font-size="14" fill="#374151">connect 完成</text>

  <line x1="800" y1="224" x2="980" y2="224" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="890" y="205" text-anchor="middle" font-size="14" fill="#374151">EOF / 错误 / 超时</text>

  <line x1="1090" y1="268" x2="1090" y2="360" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1118" y="320" font-size="14" fill="#374151">清理完成</text>

  <rect x="190" y="500" width="340" height="190" rx="18" fill="#fbfbf8" stroke="#d2cec1" stroke-width="2"/>
  <text x="360" y="540" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">解析级状态</text>
  <rect x="240" y="580" width="240" height="56" rx="12" fill="#dde7f7" stroke="#4f6fad" stroke-width="1.8"/>
  <text x="360" y="614" text-anchor="middle" font-size="19" font-weight="700" fill="#274472">ReadingHeader</text>
  <rect x="240" y="650" width="240" height="56" rx="12" fill="#e7f1e4" stroke="#5d8a56" stroke-width="1.8"/>
  <text x="360" y="684" text-anchor="middle" font-size="19" font-weight="700" fill="#2d5a27">ReadingBody</text>
  <line x1="360" y1="636" x2="360" y2="650" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="678" x2="520" y2="678" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="370" y="567" font-size="14" fill="#374151" text-anchor="middle">input_buffer 中头够 14 B → 解析 body_len</text>
  <text x="360" y="735" font-size="14" fill="#374151" text-anchor="middle">body 收全后交给 HandleFrame，再回到 ReadingHeader</text>

  <rect x="660" y="500" width="490" height="220" rx="18" fill="#fbfbf8" stroke="#d2cec1" stroke-width="2"/>
  <text x="905" y="540" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">写出级状态（由缓冲区长度隐式表达）</text>
  <rect x="725" y="585" width="190" height="60" rx="12" fill="#eef5ec" stroke="#5d8a56" stroke-width="1.8"/>
  <text x="820" y="620" text-anchor="middle" font-size="18" font-weight="700" fill="#2d5a27">output_buffer 为空</text>
  <rect x="960" y="585" width="155" height="60" rx="12" fill="#f8efd8" stroke="#a07d2b" stroke-width="1.8"/>
  <text x="1037" y="620" text-anchor="middle" font-size="18" font-weight="700" fill="#6a5017">仅监听 EPOLLIN</text>
  <line x1="915" y1="615" x2="960" y2="615" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="725" y="670" width="190" height="60" rx="12" fill="#dde7f7" stroke="#4f6fad" stroke-width="1.8"/>
  <text x="820" y="705" text-anchor="middle" font-size="18" font-weight="700" fill="#274472">output_buffer 非空</text>
  <rect x="960" y="670" width="155" height="60" rx="12" fill="#f0e8fb" stroke="#7a58a3" stroke-width="1.8"/>
  <text x="1037" y="705" text-anchor="middle" font-size="18" font-weight="700" fill="#5c3b86">监听 EPOLLIN|OUT</text>
  <line x1="915" y1="700" x2="960" y2="700" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="710" y="772" font-size="15" fill="#374151">结论：枚举与缓冲区长度都能表达状态；关键是保存可恢复点</text>
</svg>
