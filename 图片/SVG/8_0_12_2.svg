<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">IRQ 该不该离开关键 CPU？先看工作负载</title><desc id="desc">三条横向时间线展示同核 IRQ 和应用、跨核 IRQ 到 worker 的交接，以及持续用户态轮询。所有宽度为示意。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">IRQ 该不该离开关键 CPU？先看工作负载</text>
<text x="48" y="77" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">同核处理少一次交接；跨核处理少一次打断；纯用户态 poller 又是另一条路径。</text>
<rect x="40" y="118" width="1160" height="143" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="146" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 内核 I/O：IRQ 与应用同核</text>
<rect x="40" y="280" width="1160" height="143" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="308" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 内核 I/O：IRQ 与应用分核</text>
<rect x="40" y="442" width="1160" height="143" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="470" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">C · 纯用户态 poller：轮询已映射队列</text>
<text x="62" y="192" font-size="13" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">CPU 6</text>
<rect x="174" y="165" width="150" height="48" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="249.0" y="194.0" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">应用处理</text>
<rect x="324" y="165" width="165" height="48" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="406.5" y="194.0" font-size="15" font-weight="600" fill="#6B4E28" text-anchor="middle" data-role="body">IRQ / 协议</text>
<rect x="489" y="165" width="555" height="48" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="766.5" y="194.0" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">应用继续</text>
<line x1="1049" y1="189" x2="1160" y2="189" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="177" y="239" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">代价：关键执行区间被占用</text>
<text x="750" y="239" font-size="13" font-weight="400" fill="#24473F" text-anchor="start" data-role="body">收益候选：局部性与少交接</text>
<text x="62" y="350" font-size="13" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">CPU 0</text>
<text x="62" y="393" font-size="13" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">CPU 6</text>
<rect x="174" y="324" width="252" height="38" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="300.0" y="348.0" font-size="15" font-weight="600" fill="#6B4E28" text-anchor="middle" data-role="body">IRQ / 协议处理</text>
<rect x="526" y="365" width="520" height="39" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="786.0" y="389.5" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">worker 处理</text>
<path d="M 427,343 L 476,343 L 476,384 L 522,384" fill="none" stroke="#A64B3C" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#red)"/>
<text x="562" y="345" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">交接队列 · 唤醒 / IPI · Cache 移动</text>
<line x1="1052" y1="385" x2="1160" y2="385" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="62" y="520" font-size="13" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">CPU 6</text>
<rect x="174" y="494" width="140" height="47" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="244.0" y="522.5" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">poll / process</text>
<rect x="318" y="494" width="140" height="47" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="388.0" y="522.5" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">poll / process</text>
<rect x="462" y="494" width="140" height="47" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="532.0" y="522.5" font-size="15" font-weight="600" fill="#24473F" text-anchor="middle" data-role="body">poll / process</text>
<rect x="606" y="494" width="140" height="47" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="676.0" y="522.5" font-size="15" font-weight="600" fill="#24473F" text-anchor="middle" data-role="body">poll / process</text>
<rect x="750" y="494" width="140" height="47" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="820.0" y="522.5" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">poll / process</text>
<rect x="894" y="494" width="140" height="47" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="964.0" y="522.5" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">poll / process</text>
<line x1="1046" y1="518" x2="1160" y2="518" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="177" y="566" font-size="13" font-weight="400" fill="#24473F" text-anchor="start" data-role="body">典型目标：单个 runnable worker，热路径不入内核</text>
<text x="804" y="566" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">有用工作 ≠ 空轮询</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="642" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">三种路径不能套同一 IRQ 方案：先追踪谁处理队列、谁唤醒谁，再比较同一负载下的尾延迟。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">本图不是速率比较；kernel busy polling 与 io_uring SQPOLL 不等同于纯用户态单任务。</text>
</svg>