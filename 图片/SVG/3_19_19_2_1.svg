<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>TX：接受字节、控制发送、发布 DMA 工作，再回收资源</title><desc>编号表示处理阶段，不是所有事件严格先后；ACK、返回值与设备完成属于不同边界。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="ctrl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="51" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">TX：接受字节、控制发送、发布 DMA 工作，再回收资源</text>
<text x="48" y="80" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">编号表示处理阶段，不是所有事件严格先后；ACK、返回值与设备完成属于不同边界。</text>
<rect x="48" y="113" width="1144" height="138" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="137" font-size="13" font-weight="700" fill="#6B675C" text-anchor="start">A · 应用与 TCP/IP</text>
<rect x="48" y="280" width="1144" height="138" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="304" font-size="13" font-weight="700" fill="#6B675C" text-anchor="start">B · 驱动提交：从右向左读</text>
<rect x="48" y="450" width="1144" height="138" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="474" font-size="13" font-weight="700" fill="#6B675C" text-anchor="start">C · 设备执行与完成回收</text>
<rect x="78" y="159" width="225" height="67" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="190.5" y="186.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">① sendmsg</text>
<text x="190.5" y="208.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle">普通路径复制用户字节</text>
<rect x="365" y="159" width="225" height="67" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="477.5" y="186.5" font-size="14" font-weight="700" fill="#51416D" text-anchor="middle">② TCP 发送状态</text>
<text x="477.5" y="208.5" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">cwnd / rwnd / pacing</text>
<rect x="652" y="159" width="225" height="67" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="764.5" y="186.5" font-size="14" font-weight="700" fill="#51416D" text-anchor="middle">③ IP / 邻居层</text>
<text x="764.5" y="208.5" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">route / hook / ARP</text>
<rect x="938" y="159" width="225" height="67" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="1050.5" y="186.5" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">④ qdisc / TX queue</text>
<text x="1050.5" y="208.5" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle">调度 · 队列选择</text>
<path d="M 306,192 L 361,192" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 593,192 L 648,192" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 880,192 L 934,192" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="938" y="327" width="225" height="65" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1050.5" y="353.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">⑤ ndo_start_xmit</text>
<text x="1050.5" y="375.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle">检查空间 · 接管 skb</text>
<path d="M 1050,229 L 1050,323" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="652" y="327" width="225" height="65" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="764.5" y="353.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">⑥ 建立 DMA 映射</text>
<text x="764.5" y="375.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle">head + frags → DMA 地址</text>
<rect x="365" y="327" width="225" height="65" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="477.5" y="353.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">⑦ 填 TX descriptors</text>
<text x="477.5" y="375.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle">地址 / 长度 / offload</text>
<rect x="78" y="327" width="225" height="65" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="190.5" y="353.5" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">⑧ 发布并敲 Doorbell</text>
<text x="190.5" y="375.5" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle">顺序约束 → tail/MMIO</text>
<path d="M 935,359 L 881,359" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 649,359 L 594,359" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 362,359 L 307,359" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="84" y="248" font-size="12" font-weight="400" fill="#3D5A80" text-anchor="start">返回 n：只表示本次已接受字节</text>
<text x="365" y="424" font-size="13" font-weight="400" fill="#2F6B5E" text-anchor="start">payload 留在 DMA 可访问存储中；Doorbell 不是逐字节传包。</text>
<rect x="78" y="492" width="225" height="68" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="190.5" y="520.0" font-size="14" font-weight="700" fill="#733428" text-anchor="middle">⑨ NIC 消费 descriptors</text>
<text x="190.5" y="542.0" font-size="12.5" font-weight="400" fill="#733428" text-anchor="middle">DMA 读取 · TSO · 发帧</text>
<path d="M 190,395 L 190,438 L 330,438 L 330,479 L 190,479 L 190,488" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="365" y="492" width="225" height="68" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="477.5" y="520.0" font-size="14" font-weight="700" fill="#733428" text-anchor="middle">⑩ 设备完成信息</text>
<text x="477.5" y="542.0" font-size="12.5" font-weight="400" fill="#733428" text-anchor="middle">回写状态 / completion</text>
<path d="M 307,526 L 361,526" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="652" y="492" width="225" height="68" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="764.5" y="520.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">⑪ NAPI / TX cleanup</text>
<text x="764.5" y="542.0" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle">unmap · 放引用 · 记账</text>
<path d="M 594,526 L 648,526" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ctrl)"/>
<rect x="938" y="492" width="225" height="68" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="1050.5" y="520.0" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">⑫ 队列恢复可用</text>
<text x="1050.5" y="542.0" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle">BQL / stop-wake 协作</text>
<path d="M 881,526 L 934,526" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ctrl)"/>
<path d="M 1166,526 L 1180,526 L 1180,245 L 1050,245 L 1050,230" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ctrl)"/>
<text x="48" y="622" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">三个不同等待点</text>
<rect x="230" y="609" width="250" height="43" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="355.0" y="635.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">socket：等待发送空间</text>
<rect x="495" y="609" width="291" height="43" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="640.5" y="635.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">TCP：等待窗口 / ACK / 时机</text>
<rect x="801" y="609" width="391" height="43" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="996.5" y="635.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">驱动：等待描述符与完成清理</text>
<text x="48" y="684" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start">ixgbe v6.8 示例：wmb() 后可经 writel(tail) 发布；netdev_xmit_more() 可影响通知批量，其他驱动不必相同。</text>
</svg>