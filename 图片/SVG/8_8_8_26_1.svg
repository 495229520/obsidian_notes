<title id="title">GPU–NIC：先核对物理路径，再区分注册入口</title><desc id="desc">左侧为根复合体、PCIe交换机、GPU和RNIC；右侧为DMA-BUF与peer-memory两条注册路径，最终汇入MR。</desc>
