<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>一次 send 对端要 recv 几次</title>
  <desc>同一次 send(1200) 在接收端可能被切成任意份，切法由网络和内核决定；给出循环读取时 read_len 的状态推进，以及判断消息收完的三种协议手段。</desc>

  <rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">一次 send(1200)，对端要 recv 几次？</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">答案是不确定。切法由 MSS、拥塞窗口和对端读取速度共同决定，写代码时唯一安全的假设是「每次只拿到一部分」</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="104" width="1144" height="232" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="15" font-weight="700" fill="#4A473F">A · 同一次发送，三种都合法的到达形态</text>

  <text x="1066" y="146" font-size="10.5" font-weight="700" fill="#6B675C">recv 次数</text>

  <text x="72" y="172" font-size="11.5" font-weight="700" fill="#4A473F">发送端</text>
  <rect x="200" y="152" width="850" height="30" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="625" y="172" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">send(buf, 1200)　一次系统调用，1200 字节</text>
  <text x="1066" y="172" font-size="11" fill="#4A473F">1 次 send</text>

  <path d="M625 184 L625 198" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="72" y="222" font-size="11.5" font-weight="700" fill="#4A473F">到达形态 ①</text>
  <rect x="200" y="204" width="850" height="28" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="625" y="222" font-size="11.5" fill="#24473F" text-anchor="middle">1200</text>
  <text x="1066" y="222" font-size="11" fill="#24473F">1 次</text>

  <text x="72" y="260" font-size="11.5" font-weight="700" fill="#4A473F">到达形态 ②</text>
  <rect x="200" y="242" width="352" height="28" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="376" y="260" font-size="11.5" fill="#6B4E28" text-anchor="middle">500</text>
  <rect x="556" y="242" width="280" height="28" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="696" y="260" font-size="11.5" fill="#6B4E28" text-anchor="middle">400</text>
  <rect x="840" y="242" width="210" height="28" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="945" y="260" font-size="11.5" fill="#6B4E28" text-anchor="middle">300</text>
  <text x="1066" y="260" font-size="11" fill="#6B4E28">3 次</text>

  <text x="72" y="298" font-size="11.5" font-weight="700" fill="#4A473F">到达形态 ③</text>
  <rect x="200" y="280" width="67" height="28" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="233" y="298" font-size="10" fill="#733428" text-anchor="middle">100</text>
  <rect x="271" y="280" width="779" height="28" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="660" y="298" font-size="11.5" fill="#733428" text-anchor="middle">1100</text>
  <text x="1066" y="298" font-size="11" fill="#733428">2 次</text>

  <text x="72" y="324" font-size="11.5" font-weight="700" fill="#2C4460">形态 ① 在本机回环、小数据时最常出现，所以 bug 往往到了生产环境才暴露</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="352" width="560" height="268" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="382" font-size="15" font-weight="700" fill="#4A473F">B · 循环读取时的状态推进</text>

  <rect x="72" y="392" width="488" height="30" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="88" y="412" font-size="11.5" font-weight="700" fill="#2C4460">recv(fd, buf + read_len, total − read_len, 0)</text>

  <text x="88" y="444" font-size="11" font-weight="700" fill="#6B675C">轮次</text>
  <text x="180" y="444" font-size="11" font-weight="700" fill="#6B675C">recv 返回</text>
  <text x="310" y="444" font-size="11" font-weight="700" fill="#6B675C">read_len</text>
  <text x="440" y="444" font-size="11" font-weight="700" fill="#6B675C">还差</text>
  <path d="M72 452 L560 452" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="72" y="458" width="488" height="30" fill="#F1EFE8"/>
  <text x="88" y="478" font-size="11.5" fill="#4A473F">1</text>
  <text x="180" y="478" font-size="11.5" fill="#4A473F">500</text>
  <text x="310" y="478" font-size="11.5" fill="#4A473F">500</text>
  <text x="440" y="478" font-size="11.5" fill="#4A473F">700</text>

  <rect x="72" y="490" width="488" height="30" fill="#EDEBE3"/>
  <text x="88" y="510" font-size="11.5" fill="#4A473F">2</text>
  <text x="180" y="510" font-size="11.5" fill="#4A473F">400</text>
  <text x="310" y="510" font-size="11.5" fill="#4A473F">900</text>
  <text x="440" y="510" font-size="11.5" fill="#4A473F">300</text>

  <rect x="72" y="522" width="488" height="30" fill="#DCE9E3"/>
  <text x="88" y="542" font-size="11.5" font-weight="700" fill="#24473F">3</text>
  <text x="180" y="542" font-size="11.5" font-weight="700" fill="#24473F">300</text>
  <text x="310" y="542" font-size="11.5" font-weight="700" fill="#24473F">1200</text>
  <text x="440" y="542" font-size="11.5" font-weight="700" fill="#24473F">0　退出</text>

  <rect x="72" y="562" width="488" height="42" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="88" y="580" font-size="11" font-weight="700" fill="#733428">易错：把 recv 的返回值赋回长度变量</text>
  <text x="88" y="597" font-size="11" fill="#733428">第二轮的第三个参数立刻变成负数或垃圾值</text>

  <!-- ============ Panel C ============ -->
  <rect x="624" y="352" width="568" height="268" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="648" y="382" font-size="15" font-weight="700" fill="#4A473F">C · 怎么知道「收够了」</text>

  <text x="648" y="408" font-size="11" font-weight="700" fill="#6B675C">判据</text>
  <text x="790" y="408" font-size="11" font-weight="700" fill="#6B675C">循环的退出条件</text>
  <text x="1010" y="408" font-size="11" font-weight="700" fill="#6B675C">代价</text>
  <path d="M648 416 L1168 416" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="648" y="422" width="520" height="42" fill="#E3EAF4"/>
  <text x="656" y="440" font-size="11.5" font-weight="700" fill="#2C4460">定长消息</text>
  <text x="656" y="457" font-size="10" fill="#2C4460">协议里写死</text>
  <text x="790" y="448" font-size="11.5" fill="#2C4460">收满 sizeof(结构体)</text>
  <text x="1010" y="448" font-size="11.5" fill="#2C4460">字段不能变长</text>

  <rect x="648" y="466" width="520" height="42" fill="#DCE9E3"/>
  <text x="656" y="484" font-size="11.5" font-weight="700" fill="#24473F">长度头</text>
  <text x="656" y="501" font-size="10" fill="#24473F">主流做法</text>
  <text x="790" y="484" font-size="11.5" fill="#24473F">先收 4 字节头</text>
  <text x="790" y="501" font-size="11.5" fill="#24473F">再按头里的长度收 body</text>
  <text x="1010" y="493" font-size="11.5" fill="#24473F">头要防伪造</text>

  <rect x="648" y="510" width="520" height="42" fill="#EFE7DA"/>
  <text x="656" y="528" font-size="11.5" font-weight="700" fill="#6B4E28">分隔符</text>
  <text x="656" y="545" font-size="10" fill="#6B4E28">文本协议</text>
  <text x="790" y="536" font-size="11.5" fill="#6B4E28">读到 \n 为止</text>
  <text x="1010" y="528" font-size="11.5" fill="#6B4E28">正文里出现分隔符</text>
  <text x="1010" y="545" font-size="11.5" fill="#6B4E28">就得转义</text>

  <rect x="648" y="562" width="520" height="42" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="664" y="580" font-size="11" font-weight="700" fill="#6B5B95">没有判据就不叫协议</text>
  <text x="664" y="597" font-size="11" fill="#6B5B95">「收到就算一条消息」在生产环境一定出错</text>

  <text x="48" y="656" font-size="12" fill="#6B675C">口径：形态 ③ 的 100 + 1100 是为了画得出来而取的值；真实切分粒度受 MSS（以太网上通常 1460 字节）与 Nagle 算法影响</text>
</svg>
