<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">描述符“写好了”，为什么设备还可能读错？</title><desc id="desc">两条状态轨迹分别显示 CPU 发布带 Owner 的教学描述符，以及设备发布完成、CPU 消费。下方矩阵说明屏障与同步边界。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">描述符“写好了”，为什么设备还可能读错？</text>
<text x="48" y="77" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">内容 → 所有权 → 通知，必须由 CPU/DMA、MMIO 与设备协议共同建立顺序。</text>
<rect x="40" y="107" width="1160" height="184" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="135" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 发布：CPU → 设备（教学 Owner 描述符，不是 NVMe SQE 格式）</text>
<rect x="70" y="171" width="230" height="73" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="185.0" y="204.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">填字段</text>
<text x="185.0" y="226.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">addr · len</text>
<rect x="335" y="171" width="230" height="73" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="450.0" y="204.5" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">dma_wmb()</text>
<text x="450.0" y="226.5" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">发布内容顺序</text>
<rect x="600" y="171" width="230" height="73" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="715.0" y="204.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">Owner = DEVICE</text>
<text x="715.0" y="226.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">交出所有权</text>
<rect x="865" y="171" width="230" height="73" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="980.0" y="204.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">writel(tail)</text>
<text x="980.0" y="226.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">MMIO 通知</text>
<line x1="305" y1="207" x2="328" y2="207" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="570" y1="207" x2="593" y2="207" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="835" y1="207" x2="858" y2="207" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="70" y="271" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">设备：Owner 未交接时不可消费；Doorbell 到达也不等于命令完成。</text>
<rect x="40" y="310" width="1160" height="166" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="338" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 消费：设备 → CPU（假设设备遵守先内容、后标志的协议）</text>
<rect x="70" y="365" width="230" height="71" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="185.0" y="397.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">DMA 写完成内容</text>
<text x="185.0" y="419.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">设备侧执行</text>
<rect x="335" y="365" width="230" height="71" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="450.0" y="397.5" font-size="15" font-weight="700" fill="#4A3F68" text-anchor="middle" data-role="body">发布 Phase</text>
<text x="450.0" y="419.5" font-size="12.5" font-weight="400" fill="#4A3F68" text-anchor="middle" data-role="body">设备协议排序</text>
<rect x="600" y="365" width="230" height="71" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="715.0" y="397.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">检查 Phase</text>
<text x="715.0" y="419.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">未就绪则继续 poll</text>
<rect x="865" y="365" width="230" height="71" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="980.0" y="397.5" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">dma_rmb()</text>
<text x="980.0" y="419.5" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">再读完成字段</text>
<line x1="305" y1="401" x2="328" y2="401" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="570" y1="401" x2="593" y2="401" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="835" y1="401" x2="858" y2="401" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="67" y="508" font-size="13" font-weight="600" fill="#2C4460" text-anchor="start" data-role="body">DMA barrier</text>
<text x="392" y="508" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">约束顺序</text>
<text x="737" y="508" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">不等于 streaming cache sync</text>
<line x1="64" y1="518" x2="1178" y2="518" stroke="#DEDCD3" stroke-width="1"/>
<text x="67" y="539" font-size="13" font-weight="600" fill="#2C4460" text-anchor="start" data-role="body">DMA sync / unmap</text>
<text x="392" y="539" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">缓存与 ownership</text>
<text x="737" y="539" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">不等于 Posted MMIO 冲刷</text>
<line x1="64" y1="549" x2="1178" y2="549" stroke="#DEDCD3" stroke-width="1"/>
<text x="67" y="570" font-size="13" font-weight="600" fill="#2C4460" text-anchor="start" data-role="body">安全寄存器 readback</text>
<text x="392" y="570" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">相关 MMIO 到达顺序</text>
<text x="737" y="570" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">不等于设备命令 / 持久化完成</text>
<line x1="64" y1="580" x2="1178" y2="580" stroke="#DEDCD3" stroke-width="1"/>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="642" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">coherent DMA 不保证所有字段天然按设备协议发布；streaming DMA 还需遵守独立的缓存同步契约。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">volatile、普通 C++ 原子与 CPU 线程锁，不能自动替代平台的 DMA/MMIO API。</text>
</svg>