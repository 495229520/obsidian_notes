<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #475569; }
      .node-title { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .text { font-family: Inter, Arial, sans-serif; font-size: 16px; fill: #334155; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 15px; fill: #0f172a; }
    </style>
  </defs>

  <text font-family="Inter, Arial, sans-serif" x="70" y="70" class="title">vLLM Metrics Minimum Chain</text>
  <text font-family="Inter, Arial, sans-serif" x="70" y="105" class="subtitle">重点不是会装工具，而是让每个 panel 能解释一个 serving 问题</text>

  <rect x="70" y="230" width="235" height="190" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="105" y="285" class="node-title">Benchmark Client</text>
  <text font-family="Inter, Arial, sans-serif" x="105" y="325" class="text">Week 5 workloads</text>
  <text font-family="Inter, Arial, sans-serif" x="105" y="355" class="text">request rate</text>
  <text font-family="Inter, Arial, sans-serif" x="105" y="385" class="text">max concurrency</text>

  <rect x="370" y="205" width="270" height="240" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="405" y="260" class="node-title">vLLM Server</text>
  <text font-family="Inter, Arial, sans-serif" x="405" y="300" class="text">OpenAI-compatible API</text>
  <text font-family="Inter, Arial, sans-serif" x="405" y="335" class="text">scheduler + KV cache</text>
  <text font-family="Inter, Arial, sans-serif" x="405" y="370" class="text">prefill / decode</text>
  <rect x="405" y="392" width="162" height="34" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text font-family="Inter, Arial, sans-serif" x="421" y="415" class="code">/metrics</text>

  <rect x="710" y="230" width="220" height="190" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="750" y="285" class="node-title">Prometheus</text>
  <text font-family="Inter, Arial, sans-serif" x="750" y="325" class="text">scrape interval</text>
  <text font-family="Inter, Arial, sans-serif" x="750" y="355" class="text">time series</text>
  <text font-family="Inter, Arial, sans-serif" x="750" y="385" class="text">PromQL</text>

  <rect x="995" y="230" width="215" height="190" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="1037" y="285" class="node-title">Grafana</text>
  <text font-family="Inter, Arial, sans-serif" x="1037" y="325" class="text">latency panels</text>
  <text font-family="Inter, Arial, sans-serif" x="1037" y="355" class="text">queue panels</text>
  <text font-family="Inter, Arial, sans-serif" x="1037" y="385" class="text">cache panels</text>

  <path d="M305 325 H350" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 325 H690" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M930 325 H975" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="175" y="525" width="930" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="215" y="558" class="code">curl /metrics -&gt; vllm:num_requests_waiting, queue_time, TTFT, ITL, KV cache, prompt/generation tokens</text>
  <text font-family="Inter, Arial, sans-serif" x="215" y="590" class="text">先确认实际暴露的指标名，再写 PromQL 和 dashboard。</text>
</svg>
