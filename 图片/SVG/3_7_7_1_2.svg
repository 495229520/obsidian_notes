<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>OSI 七层、五层、TCP/IP 四层的对应关系</title>
  <desc>三种分层模型的逐层对照，右侧列出每层的代表协议与工作在该层的转发设备；底部说明三个模型的来历差异，以及表示层、会话层的功能在 TCP/IP 中的去向。</desc>

  <rect x="0" y="0" width="1240" height="780" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">三种分层模型：同一件事的三种切法</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">差别只在上三层怎么合并、下两层要不要拆开；协议和设备的归属是不变的</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="440" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 逐层对照</text>

  <text x="163" y="160" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">OSI 七层</text>
  <text x="343" y="160" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">五层（教学）</text>
  <text x="533" y="160" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">TCP/IP 四层</text>
  <text x="825" y="160" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">代表协议</text>
  <text x="1093" y="160" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="middle">工作在该层的设备</text>

  <!-- OSI 七层 -->
  <rect x="88" y="170" width="150" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="163" y="197" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">7 应用层</text>
  <rect x="88" y="222" width="150" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="163" y="249" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">6 表示层</text>
  <rect x="88" y="274" width="150" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="163" y="301" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">5 会话层</text>
  <rect x="88" y="326" width="150" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="163" y="353" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">4 传输层</text>
  <rect x="88" y="378" width="150" height="44" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="163" y="405" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">3 网络层</text>
  <rect x="88" y="430" width="150" height="44" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="163" y="457" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">2 数据链路层</text>
  <rect x="88" y="482" width="150" height="44" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.4"/>
  <text x="163" y="509" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">1 物理层</text>

  <!-- 五层 -->
  <rect x="268" y="170" width="150" height="148" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="343" y="238" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">应用层</text>
  <text x="343" y="256" font-size="10.5" fill="#2C4460" text-anchor="middle">合并上三层</text>
  <rect x="268" y="326" width="150" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="343" y="353" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">传输层</text>
  <rect x="268" y="378" width="150" height="44" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="343" y="405" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">网络层</text>
  <rect x="268" y="430" width="150" height="44" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="343" y="457" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">数据链路层</text>
  <rect x="268" y="482" width="150" height="44" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.4"/>
  <text x="343" y="509" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">物理层</text>

  <!-- TCP/IP 四层 -->
  <rect x="448" y="170" width="170" height="148" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="533" y="238" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">应用层</text>
  <text x="533" y="256" font-size="10.5" fill="#2C4460" text-anchor="middle">合并上三层</text>
  <rect x="448" y="326" width="170" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="533" y="353" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">传输层</text>
  <rect x="448" y="378" width="170" height="44" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="533" y="405" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">网际层</text>
  <rect x="448" y="430" width="170" height="96" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="533" y="472" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">网络接口层</text>
  <text x="533" y="490" font-size="10.5" fill="#6B4E28" text-anchor="middle">合并下两层</text>

  <!-- 协议 chips -->
  <rect x="654" y="211" width="80" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="694" y="230" font-size="11" fill="#2C4460" text-anchor="middle">HTTP</text>
  <rect x="742" y="211" width="80" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="782" y="230" font-size="11" fill="#2C4460" text-anchor="middle">HTTPS</text>
  <rect x="830" y="211" width="80" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="870" y="230" font-size="11" fill="#2C4460" text-anchor="middle">FTP</text>
  <rect x="918" y="211" width="80" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="958" y="230" font-size="11" fill="#2C4460" text-anchor="middle">SSH</text>
  <rect x="654" y="249" width="80" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="694" y="268" font-size="11" fill="#2C4460" text-anchor="middle">SMTP</text>
  <rect x="742" y="249" width="80" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="782" y="268" font-size="11" fill="#2C4460" text-anchor="middle">DNS</text>
  <rect x="830" y="249" width="80" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="870" y="268" font-size="11" fill="#2C4460" text-anchor="middle">DHCP</text>
  <rect x="918" y="249" width="80" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="958" y="268" font-size="11" fill="#2C4460" text-anchor="middle">NTP</text>

  <rect x="654" y="335" width="80" height="26" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="694" y="353" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">TCP</text>
  <rect x="742" y="335" width="80" height="26" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="782" y="353" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">UDP</text>
  <rect x="830" y="335" width="80" height="26" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="870" y="353" font-size="11" fill="#24473F" text-anchor="middle">QUIC</text>

  <rect x="654" y="387" width="80" height="26" rx="5" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1"/>
  <text x="694" y="405" font-size="11" font-weight="700" fill="#4A3F68" text-anchor="middle">IP</text>
  <rect x="742" y="387" width="80" height="26" rx="5" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1"/>
  <text x="782" y="405" font-size="11" fill="#4A3F68" text-anchor="middle">ICMP</text>
  <rect x="830" y="387" width="80" height="26" rx="5" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1"/>
  <text x="870" y="405" font-size="11" fill="#4A3F68" text-anchor="middle">IGMP</text>
  <rect x="918" y="387" width="80" height="26" rx="5" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="958" y="405" font-size="11" fill="#4A3F68" text-anchor="middle">ARP</text>

  <rect x="654" y="439" width="80" height="26" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1"/>
  <text x="694" y="457" font-size="11" fill="#6B4E28" text-anchor="middle">以太网</text>
  <rect x="742" y="439" width="80" height="26" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1"/>
  <text x="782" y="457" font-size="11" fill="#6B4E28" text-anchor="middle">Wi-Fi</text>
  <rect x="830" y="439" width="80" height="26" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1"/>
  <text x="870" y="457" font-size="11" fill="#6B4E28" text-anchor="middle">PPP</text>

  <rect x="654" y="491" width="80" height="26" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="694" y="509" font-size="11" fill="#4A473F" text-anchor="middle">双绞线</text>
  <rect x="742" y="491" width="80" height="26" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="782" y="509" font-size="11" fill="#4A473F" text-anchor="middle">光纤</text>
  <rect x="830" y="491" width="80" height="26" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="870" y="509" font-size="11" fill="#4A473F" text-anchor="middle">无线电</text>

  <text x="1013" y="405" font-size="11.5" font-weight="700" fill="#4A3F68">路由器 · 三层交换机</text>
  <text x="1013" y="457" font-size="11.5" font-weight="700" fill="#6B4E28">交换机 · 网桥 · 网卡</text>
  <text x="1013" y="509" font-size="11.5" font-weight="700" fill="#4A473F">中继器 · 集线器</text>
  <text x="1013" y="238" font-size="11" fill="#6B675C">主机上的进程</text>

  <text x="654" y="533" font-size="10.5" fill="#6B675C">ARP 虚线：靠链路层广播帧承载，但为网络层服务，两层之间</text>

  <!-- ================= Panel B ================= -->
  <rect x="48" y="560" width="366" height="146" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="588" font-size="13.5" font-weight="700" fill="#3D5A80">OSI：先标准，后实现</text>
  <text x="72" y="612" font-size="11.5" fill="#4A473F">ISO 在 1984 年定稿</text>
  <text x="72" y="632" font-size="11.5" fill="#4A473F">七层完整、职责划分清晰</text>
  <text x="72" y="652" font-size="11.5" fill="#4A473F">没有一个协议栈完整实现它</text>
  <text x="72" y="678" font-size="11" fill="#6B675C">用途：教学与标准制定的公共词汇</text>

  <rect x="437" y="560" width="366" height="146" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="461" y="588" font-size="13.5" font-weight="700" fill="#2F6B5E">TCP/IP：先实现，后标准</text>
  <text x="461" y="612" font-size="11.5" fill="#4A473F">从 ARPANET 的可用代码倒推</text>
  <text x="461" y="632" font-size="11.5" fill="#4A473F">RFC 793 / 791 是事实标准</text>
  <text x="461" y="652" font-size="11.5" fill="#4A473F">四层，上三层合成应用层</text>
  <text x="461" y="678" font-size="11" fill="#6B675C">用途：今天所有联网设备跑的就是它</text>

  <rect x="826" y="560" width="366" height="146" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="850" y="588" font-size="13.5" font-weight="700" fill="#8A6A3A">表示层和会话层去哪了</text>
  <text x="850" y="612" font-size="11.5" fill="#4A473F">加密 → TLS 库，应用自己调</text>
  <text x="850" y="632" font-size="11.5" fill="#4A473F">编码压缩 → HTTP 头字段协商</text>
  <text x="850" y="652" font-size="11.5" fill="#4A473F">会话 → Cookie / Session ID</text>
  <text x="850" y="678" font-size="11" fill="#6B675C">功能仍在，只是不再是独立的一层</text>

  <text x="48" y="734" font-size="11.5" fill="#4A473F">写网络程序时按 TCP/IP 四层思考：socket API 正好架在应用层与传输层的边界上，往下是内核协议栈，往上是自己的业务协议。</text>
  <text x="48" y="756" font-size="11.5" fill="#4A473F">七层模型的价值在于排障时的共同语言：说「二层不通」「三层可达但四层被拒」，双方立刻知道该查交换机、路由表还是防火墙规则。</text>
</svg>
