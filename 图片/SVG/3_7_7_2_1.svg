<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>A 到 E 五类地址的位布局</title>
  <desc>32 位 IPv4 地址按首字节前导位划分为五类，图中标出每类的类别位、网络位、主机位宽度，以及可用网络数与每网可用主机数；下半部分用一个 /24 网段说明主机数为什么要减 2。</desc>

  <rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">五类地址：靠首字节的前导位区分</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">分类地址 1993 年已被 CIDR 取代（RFC 1519），但 A/B/C 类的叫法和私有地址段沿用至今</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="366" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 32 位的切分方式</text>

  <!-- 位标尺 -->
  <line x1="280" y1="176" x2="920" y2="176" stroke="#9B968A" stroke-width="1"/>
  <line x1="280" y1="170" x2="280" y2="176" stroke="#9B968A" stroke-width="1"/>
  <line x1="440" y1="170" x2="440" y2="176" stroke="#9B968A" stroke-width="1"/>
  <line x1="600" y1="170" x2="600" y2="176" stroke="#9B968A" stroke-width="1"/>
  <line x1="760" y1="170" x2="760" y2="176" stroke="#9B968A" stroke-width="1"/>
  <line x1="920" y1="170" x2="920" y2="176" stroke="#9B968A" stroke-width="1"/>
  <text x="280" y="164" font-size="10" fill="#6B675C" text-anchor="middle">bit 0</text>
  <text x="440" y="164" font-size="10" fill="#6B675C" text-anchor="middle">8</text>
  <text x="600" y="164" font-size="10" fill="#6B675C" text-anchor="middle">16</text>
  <text x="760" y="164" font-size="10" fill="#6B675C" text-anchor="middle">24</text>
  <text x="920" y="164" font-size="10" fill="#6B675C" text-anchor="middle">32</text>
  <text x="1052" y="164" font-size="10.5" font-weight="700" fill="#6B675C" text-anchor="middle">可用网络数 / 每网可用主机数</text>

  <!-- A 类 -->
  <text x="76" y="203" font-size="13" font-weight="700" fill="#2C4460">A 类</text>
  <text x="76" y="219" font-size="10.5" fill="#6B675C">首字节 1 – 126</text>
  <rect x="280" y="186" width="20" height="40" fill="#EDEBE3" stroke="#4A473F" stroke-width="1.2"/>
  <text x="290" y="211" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">0</text>
  <rect x="300" y="186" width="140" height="40" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="370" y="211" font-size="11.5" fill="#4A3F68" text-anchor="middle">网络号 7 位</text>
  <rect x="440" y="186" width="480" height="40" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="680" y="211" font-size="11.5" fill="#2C4460" text-anchor="middle">主机号 24 位</text>
  <text x="940" y="203" font-size="11" fill="#4A473F">126 个网络</text>
  <text x="940" y="219" font-size="11" fill="#4A473F">16 777 214 台</text>

  <!-- B 类 -->
  <text x="76" y="259" font-size="13" font-weight="700" fill="#2C4460">B 类</text>
  <text x="76" y="275" font-size="10.5" fill="#6B675C">首字节 128 – 191</text>
  <rect x="280" y="242" width="40" height="40" fill="#EDEBE3" stroke="#4A473F" stroke-width="1.2"/>
  <text x="300" y="267" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">10</text>
  <rect x="320" y="242" width="280" height="40" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="460" y="267" font-size="11.5" fill="#4A3F68" text-anchor="middle">网络号 14 位</text>
  <rect x="600" y="242" width="320" height="40" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="760" y="267" font-size="11.5" fill="#2C4460" text-anchor="middle">主机号 16 位</text>
  <text x="940" y="259" font-size="11" fill="#4A473F">16 384 个网络</text>
  <text x="940" y="275" font-size="11" fill="#4A473F">65 534 台</text>

  <!-- C 类 -->
  <text x="76" y="315" font-size="13" font-weight="700" fill="#2C4460">C 类</text>
  <text x="76" y="331" font-size="10.5" fill="#6B675C">首字节 192 – 223</text>
  <rect x="280" y="298" width="60" height="40" fill="#EDEBE3" stroke="#4A473F" stroke-width="1.2"/>
  <text x="310" y="323" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">110</text>
  <rect x="340" y="298" width="420" height="40" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="550" y="323" font-size="11.5" fill="#4A3F68" text-anchor="middle">网络号 21 位</text>
  <rect x="760" y="298" width="160" height="40" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="840" y="323" font-size="11.5" fill="#2C4460" text-anchor="middle">主机号 8 位</text>
  <text x="940" y="315" font-size="11" fill="#4A473F">2 097 152 个网络</text>
  <text x="940" y="331" font-size="11" fill="#4A473F">254 台</text>

  <!-- D 类 -->
  <text x="76" y="371" font-size="13" font-weight="700" fill="#2C4460">D 类</text>
  <text x="76" y="387" font-size="10.5" fill="#6B675C">首字节 224 – 239</text>
  <rect x="280" y="354" width="80" height="40" fill="#EDEBE3" stroke="#4A473F" stroke-width="1.2"/>
  <text x="320" y="379" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">1110</text>
  <rect x="360" y="354" width="560" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="640" y="379" font-size="11.5" fill="#24473F" text-anchor="middle">组播组标识 28 位（不再分网络号与主机号）</text>
  <text x="940" y="371" font-size="11" fill="#4A473F">不分配给单台主机</text>
  <text x="940" y="387" font-size="11" fill="#4A473F">一对多分发</text>

  <!-- E 类 -->
  <text x="76" y="427" font-size="13" font-weight="700" fill="#2C4460">E 类</text>
  <text x="76" y="443" font-size="10.5" fill="#6B675C">首字节 240 – 255</text>
  <rect x="280" y="410" width="80" height="40" fill="#EDEBE3" stroke="#4A473F" stroke-width="1.2"/>
  <text x="320" y="435" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">1111</text>
  <rect x="360" y="410" width="560" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="640" y="435" font-size="11.5" fill="#4A473F" text-anchor="middle">保留，至今未分配</text>
  <text x="940" y="427" font-size="11" fill="#4A473F">末址 255.255.255.255</text>
  <text x="940" y="443" font-size="11" fill="#4A473F">是受限广播地址</text>

  <!-- ================= Panel B ================= -->
  <rect x="48" y="486" width="1144" height="134" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="512" font-size="15" font-weight="700" fill="#4A473F">B · 主机数为什么要减 2：以 192.168.1.0/24 为例</text>

  <rect x="76" y="528" width="120" height="38" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="136" y="552" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">192.168.1.0</text>
  <rect x="196" y="528" width="848" height="38" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="620" y="552" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">192.168.1.1 – 192.168.1.254　共 254 个可分配地址</text>
  <rect x="1044" y="528" width="120" height="38" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="1104" y="552" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">192.168.1.255</text>

  <text x="136" y="584" font-size="10.5" fill="#733428" text-anchor="middle">主机位全 0：网络号</text>
  <text x="620" y="584" font-size="10.5" fill="#24473F" text-anchor="middle">2⁸ − 2 = 254</text>
  <text x="1104" y="584" font-size="10.5" fill="#733428" text-anchor="middle">主机位全 1：广播地址</text>

  <text x="72" y="608" font-size="11" fill="#6B675C">判定看的是主机位是否全 0 / 全 1，不是看点分十进制的最后一段是不是 0 或 255</text>

  <text x="48" y="648" font-size="11.5" fill="#4A473F">127 不在 A 类可用范围内：127.0.0.0/8 整段留给回环，所以 A 类是 1–126 而不是 1–127。</text>
  <text x="48" y="670" font-size="11.5" fill="#4A473F">A 类网络数写作 2⁷ − 2 = 126，减掉的是网络号全 0（表示「本网络」）和全 1（127，回环）两个取值。</text>
</svg>
