<rect x="551" y="497" width="176" height="43" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="639.0" y="523.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-region="body" data-box="551,497,176,43">查找失败动作</text>
<path d="M174,518 L238,518" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M499,518 L545,518" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="76" y="574" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">最后一行的 PASS 取决于 helper flags，不覆盖后端所有错误。</text>
<rect x="780" y="220" width="412" height="380" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="798" y="247" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">B · queue id ≠ CPU id</text>
