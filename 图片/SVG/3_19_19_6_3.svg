<text x="1123" y="471" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="middle" data-region="body">0</text>
<text x="811" y="548" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">数字仅为示例，须查看实际拓扑与 affinity。</text>
<text x="811" y="574" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">taskset 不改变包到达的硬件 queue。</text>
<rect x="48" y="632" width="1144" height="38" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="657" font-size="13" fill="#4A473F" font-weight="400" text-anchor="start" data-region="caption">定位顺序：流量进入哪个 queue → map 选哪个 XSK → FILL / RX 是否推进 → 驱动与 worker 分别在哪个 CPU。</text>
</svg>
