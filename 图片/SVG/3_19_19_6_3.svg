<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Queue Binding：先有来源 queue，后有 XSKMAP 选择</title><desc id="desc">固定报文来自 ethX queue2，对照 key7绑定同queue合法、key2绑定其他queue或设备不合法、map未命中走helperfallback；另表说明queue与CPU编号不同。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">Queue Binding：先有来源 queue，后有 XSKMAP 选择</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">map key 可以自定义；合法交付要求目标 socket 与当前报文的来源设备、RX queue 匹配。</text>
<rect x="65" y="118" width="354" height="73" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="242.0" y="149.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="65,118,354,73">当前报文：ethX · RX queue 2</text>
<text x="242.0" y="170.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="65,118,354,73">来源由接收路径确定</text>
<path d="M419,154 L493,154" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="499" y="118" width="331" height="73" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="664.5" y="149.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="499,118,331,73">XDP 上下文</text>
<text x="664.5" y="170.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="499,118,331,73">ingress_ifindex / rx_queue_index</text>
<path d="M830,154 L898,154" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="904" y="118" width="271" height="73" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1039.5" y="149.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-region="body" data-box="904,118,271,73">选择 map key</text>
<text x="1039.5" y="170.0" font-size="12.5" fill="#6B4E28" font-weight="400" text-anchor="middle" data-region="body" data-box="904,118,271,73">不是重新选择硬件 RX queue</text>
<rect x="48" y="220" width="707" height="380" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="247" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">A · 四种互斥配置示例</text>
<text x="76" y="281" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="body">key</text>
<text x="258" y="281" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="body">该项指向的目标</text>
<text x="573" y="281" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="body">交付结果</text>
