<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="730" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">FTL：设备里的"页表"——LBA 到物理页的重定向写</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">覆盖写从不原地发生：新数据写到别处的新页，旧页只标失效，映射表改指向 —— 与虚拟内存页表同构</text>

  <!-- 列标题 -->
  <text x="70" y="128" font-size="13" font-weight="700" fill="#2B2A26">主机视角：连续的 LBA</text>
  <text x="390" y="128" font-size="13" font-weight="700" fill="#2B2A26">FTL：页级 L2P 映射表</text>
  <text x="730" y="128" font-size="13" font-weight="700" fill="#2B2A26">NAND 真实几何（Die 内）</text>

  <!-- 列 A: LBA 数组 -->
  <rect x="70" y="142" width="180" height="32" rx="5" fill="#ECEAE2" stroke="#9B968A" stroke-width="1.2"/>
  <text x="160" y="163" font-size="11.5" fill="#6B675C" text-anchor="middle">LBA 0</text>
  <rect x="70" y="178" width="180" height="32" rx="5" fill="#ECEAE2" stroke="#9B968A" stroke-width="1.2"/>
  <text x="160" y="199" font-size="11.5" fill="#6B675C" text-anchor="middle">LBA 1</text>
  <rect x="70" y="214" width="180" height="32" rx="5" fill="#ECEAE2" stroke="#9B968A" stroke-width="1.2"/>
  <text x="160" y="235" font-size="11.5" fill="#6B675C" text-anchor="middle">LBA 2</text>
  <rect x="70" y="250" width="180" height="32" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.8"/>
  <text x="160" y="271" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">LBA 3 ← 第二次覆盖写</text>
  <rect x="70" y="286" width="180" height="32" rx="5" fill="#ECEAE2" stroke="#9B968A" stroke-width="1.2"/>
  <text x="160" y="307" font-size="11.5" fill="#6B675C" text-anchor="middle">LBA 4</text>
  <rect x="70" y="322" width="180" height="32" rx="5" fill="#ECEAE2" stroke="#9B968A" stroke-width="1.2"/>
  <text x="160" y="343" font-size="11.5" fill="#6B675C" text-anchor="middle">LBA 5</text>
  <rect x="70" y="358" width="180" height="32" rx="5" fill="#ECEAE2" stroke="#9B968A" stroke-width="1.2"/>
  <text x="160" y="379" font-size="11.5" fill="#6B675C" text-anchor="middle">LBA 6</text>
  <rect x="70" y="394" width="180" height="32" rx="5" fill="#ECEAE2" stroke="#9B968A" stroke-width="1.2"/>
  <text x="160" y="415" font-size="11.5" fill="#6B675C" text-anchor="middle">LBA 7</text>
  <text x="70" y="452" font-size="10.5" fill="#6B675C">主机以为自己在"原地"更新 LBA 3</text>

  <!-- 箭头 ①: LBA3 -> L2P -->
  <polyline points="250,266 370,266 370,232 386,232" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="258" y="257" font-size="10.5" fill="#6B675C">① NVMe Write：LBA 3</text>

  <!-- 列 B: L2P 映射表 -->
  <rect x="390" y="142" width="250" height="150" rx="6" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <rect x="390" y="142" width="250" height="30" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="515" y="162" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">L2P 表（设备 DRAM / HMB）</text>
  <text x="406" y="197" font-size="11.5" fill="#6B675C">LBA 2  →  B0·P5</text>
  <rect x="391" y="212" width="248" height="40" fill="#E3EAF4"/>
  <text x="406" y="237" font-size="11.5" font-weight="700" fill="#2C4460">LBA 3  →</text>
  <text x="487" y="237" font-size="11.5" fill="#6B675C">B0·P2</text>
  <line x1="484" y1="233" x2="524" y2="233" stroke="#A05248" stroke-width="1.5"/>
  <text x="546" y="237" font-size="11.5" font-weight="700" fill="#24473F">B1·P0</text>
  <text x="406" y="277" font-size="11.5" fill="#6B675C">LBA 4  →  B0·P7</text>
  <text x="390" y="322" font-size="10.5" fill="#6B675C">③ 改指向：LBA 3 → B1·P0，旧页 B0·P2 记失效</text>
  <text x="390" y="342" font-size="10.5" fill="#6B675C">页级映射 4 B/页 ≈ 容量的 0.1%：</text>
  <text x="390" y="360" font-size="10.5" fill="#6B675C">1 TB 盘 ≈ 1 GB 映射表【量级】</text>

  <!-- 箭头 ②: L2P -> 活跃块新页 -->
  <polyline points="640,232 688,232 688,204 746,204" fill="none" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrt)"/>
  <text x="648" y="262" font-size="10.5" fill="#24473F">② 写入活跃块</text>
  <text x="648" y="278" font-size="10.5" fill="#24473F">的下一空闲页</text>

  <!-- 列 C: Die 几何 -->
  <rect x="730" y="142" width="450" height="300" rx="8" fill="none" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="744" y="164" font-size="10.5" fill="#6B675C">Die ×N：多 die / 多通道 = 设备并行度的来源</text>

  <text x="807" y="186" font-size="12" font-weight="700" fill="#2B2A26" text-anchor="middle">Block 1 · 活跃块</text>
  <text x="962" y="186" font-size="12" font-weight="700" fill="#2B2A26" text-anchor="middle">Block 0 · 已满</text>
  <text x="1112" y="186" font-size="12" font-weight="700" fill="#2B2A26" text-anchor="middle">Block 2 · 空闲</text>

  <!-- Block 1: 活跃块 (左, 接收新写入) -->
  <rect x="750" y="192" width="54" height="28" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="2.2"/>
  <text x="777" y="210" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">新 LBA 3</text>
  <rect x="810" y="192" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="750" y="226" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="810" y="226" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="750" y="260" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="810" y="260" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="750" y="294" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="810" y="294" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Block 0: 已写满 (P2 = 旧 LBA3 失效) -->
  <rect x="905" y="192" width="54" height="28" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="932" y="210" font-size="9.5" fill="#24473F" text-anchor="middle">LBA 0</text>
  <rect x="965" y="192" width="54" height="28" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="992" y="210" font-size="9.5" fill="#24473F" text-anchor="middle">LBA 1</text>
  <rect x="905" y="226" width="54" height="28" rx="4" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.4"/>
  <text x="932" y="244" font-size="9.5" font-weight="700" fill="#7A5426" text-anchor="middle">LBA 3 ✕</text>
  <rect x="965" y="226" width="54" height="28" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="992" y="244" font-size="9.5" fill="#24473F" text-anchor="middle">LBA 6</text>
  <rect x="905" y="260" width="54" height="28" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="932" y="278" font-size="9.5" fill="#24473F" text-anchor="middle">LBA 7</text>
  <rect x="965" y="260" width="54" height="28" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="992" y="278" font-size="9.5" fill="#24473F" text-anchor="middle">LBA 2</text>
  <rect x="905" y="294" width="54" height="28" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="932" y="312" font-size="9.5" fill="#24473F" text-anchor="middle">LBA 5</text>
  <rect x="965" y="294" width="54" height="28" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="992" y="312" font-size="9.5" fill="#24473F" text-anchor="middle">LBA 4</text>

  <!-- Block 2: 空闲 -->
  <rect x="1055" y="192" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="1115" y="192" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="1055" y="226" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="1115" y="226" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="1055" y="260" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="1115" y="260" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="1055" y="294" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="1115" y="294" width="54" height="28" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="750" y="352" font-size="10.5" font-weight="700" fill="#7A5426">④ 旧页失效 ≠ 立刻可复用</text>
  <text x="750" y="370" font-size="10.5" fill="#6B675C">擦除只能整块 → 失效页先攒着，由 GC 清算（见 3.5）</text>
  <text x="744" y="428" font-size="10.5" fill="#6B675C">页 = 读写单位 · 块 = 擦除单位 · die = 并行单位</text>

  <!-- 底部: 三条物理约束 -->
  <text x="48" y="500" font-size="13" font-weight="700" fill="#2B2A26">NAND 的三条物理约束 —— 上面一切设计的因</text>
  <rect x="48" y="516" width="354" height="64" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="64" y="540" font-size="12.5" font-weight="700" fill="#2B2A26">读 / 写以页为单位</text>
  <text x="64" y="562" font-size="10.5" fill="#6B675C">页 4–16 KiB【量级】；不足一页也占一页</text>
  <rect x="418" y="516" width="354" height="64" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="434" y="540" font-size="12.5" font-weight="700" fill="#2B2A26">先擦后写，擦除以块为单位</text>
  <text x="434" y="562" font-size="10.5" fill="#6B675C">块 = 数百~上千页，数 MiB【事实】</text>
  <rect x="788" y="516" width="354" height="64" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="804" y="540" font-size="12.5" font-weight="700" fill="#2B2A26">每块 P/E 擦写次数有限</text>
  <text x="804" y="562" font-size="10.5" fill="#6B675C">TLC 千次量级【量级】→ 需要磨损均衡</text>

  <!-- 类比条 -->
  <rect x="48" y="604" width="1094" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="64" y="626" font-size="12" font-weight="700" fill="#24473F">虚拟内存同构（给多线程工程师的坐标系）</text>
  <text x="64" y="646" font-size="11" fill="#24473F">LBA ≈ 虚拟地址 · L2P ≈ 页表 · 设备映射缓存 ≈ TLB · GC ≈ 压缩式整理 · TRIM ≈ MADV_FREE 式的"这段是垃圾"提示</text>

  <text x="48" y="690" font-size="10.5" fill="#6B675C">同一形状在软件层反复出现：Bitcask / LSM 也是"追加写 + 索引改指向 + 后台合并"（6.5 / 6.6）</text>
</svg>
