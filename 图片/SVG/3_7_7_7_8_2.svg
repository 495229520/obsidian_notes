<text x="382.0" y="240.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">SA</text>
<text x="382.0" y="263.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">6 B</text>
<rect x="440" y="215" width="140" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="510.0" y="240.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">C-TPID</text>
<text x="510.0" y="263.5" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">8100 / 2 B</text>
<rect x="580" y="215" width="116" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="638.0" y="240.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">C-TCI</text>
<text x="638.0" y="263.5" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">2 B</text>
<rect x="696" y="215" width="140" height="64" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="766.0" y="240.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">EtherType</text>
<text x="766.0" y="263.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">2 B</text>
<rect x="836" y="215" width="210" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="941.0" y="240.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Payload</text>
<text x="941.0" y="263.5" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">可变</text>
<rect x="1046" y="215" width="134" height="64" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="1113.0" y="240.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">FCS</text>
<text x="1113.0" y="263.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">4 B</text>
<text x="48" y="340" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">QinQ</text>
<rect x="208" y="306" width="104" height="64" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="260.0" y="331.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">DA</text>
<text x="260.0" y="354.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">6 B</text>
<rect x="312" y="306" width="104" height="64" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="364.0" y="331.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">SA</text>
<text x="364.0" y="354.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">6 B</text>
<rect x="416" y="306" width="176" height="64" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="504.0" y="331.5" font-size="14" fill="#73531F" font-weight="700" text-anchor="middle">S-Tag</text>
<text x="504.0" y="354.5" font-size="14" fill="#73531F" font-weight="400" text-anchor="middle">4 B</text>
<rect x="592" y="306" width="164" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="674.0" y="331.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">C-Tag</text>
<text x="674.0" y="354.5" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">4 B</text>
<rect x="756" y="306" width="138" height="64" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="825.0" y="331.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">EtherType</text>
<text x="825.0" y="354.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">2 B</text>
<rect x="894" y="306" width="160" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="974.0" y="331.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Payload</text>
<text x="974.0" y="354.5" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">可变</text>
<rect x="1054" y="306" width="126" height="64" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="1117.0" y="331.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">FCS</text>
<text x="1117.0" y="354.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">4 B</text>
<text x="208" y="401" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">典型 S-TPID：0x88A8；典型 C-TPID：0x8100；设备可以有其他约定。</text>
<text x="48" y="456" font-size="17" fill="#2B2A26" font-weight="700" text-anchor="start">TCI</text>
<rect x="208" y="438" width="162" height="82" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="289.0" y="472.5" font-size="14" fill="#73531F" font-weight="700" text-anchor="middle">PCP</text>
<text x="289.0" y="495.5" font-size="14" fill="#73531F" font-weight="400" text-anchor="middle">3 bit</text>
<rect x="370" y="438" width="54" height="82" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="397.0" y="472.5" font-size="14" fill="#733428" font-weight="700" text-anchor="middle">DEI</text>
<text x="397.0" y="495.5" font-size="14" fill="#733428" font-weight="400" text-anchor="middle">1 bit</text>
<rect x="424" y="438" width="648" height="82" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="748.0" y="472.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">VID</text>
<text x="748.0" y="495.5" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">12 bit</text>
<text x="208" y="547" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">15…13</text>
<text x="370" y="547" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">12</text>
<text x="440" y="547" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">11…0</text>
<text x="48" y="589" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">例：0x7064 → PCP 3、DEI 1、VID 100；VID 0 表示 priority-tagged，不是普通 VLAN 0。</text>
<text x="48" y="620" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">DEI 是现代命名；教材或旧设备的 CFI 字段需按版本解释。FCS 通常不会出现在主机抓包中。</text>
</svg>