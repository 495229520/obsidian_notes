<text x="516.0" y="149.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">EtherType</text>
<text x="516.0" y="172.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">2 B</text>
<rect x="592" y="124" width="446" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="815.0" y="149.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">Payload</text>
<text x="815.0" y="172.5" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">含必要填充</text>
<rect x="1038" y="124" width="142" height="64" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="1109.0" y="149.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">FCS</text>
<text x="1109.0" y="172.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">4 B</text>
<text x="48" y="249" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">单 C-Tag</text>
<rect x="208" y="215" width="116" height="64" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="266.0" y="240.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">DA</text>
<text x="266.0" y="263.5" font-size="14" fill="#4A473F" font-weight="400" text-anchor="middle">6 B</text>
