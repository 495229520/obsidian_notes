<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #475569; }
      .box-title { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .text { font-family: Inter, Arial, sans-serif; font-size: 17px; fill: #334155; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #475569; }
      .pill { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; }
    </style>
  </defs>

  <text font-family="Inter, Arial, sans-serif" x="70" y="70" class="title">Week 5 Benchmark -&gt; Week 6 Observability</text>
  <text font-family="Inter, Arial, sans-serif" x="70" y="105" class="subtitle">把离线结果接到运行时指标，再沉淀成可执行 runbook</text>

  <rect x="70" y="165" width="310" height="360" rx="14" fill="#fffaf0" stroke="#c0842f" stroke-width="2"/>
  <rect x="100" y="198" width="126" height="34" rx="17" fill="#b45309"/>
  <text font-family="Inter, Arial, sans-serif" x="122" y="221" class="pill">Week 5</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="268" class="box-title">Benchmark Result</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="315" class="text">TTFT / TPOT p95</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="350" class="text">TPS / RPS</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="385" class="text">failed requests</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="420" class="text">request rate matrix</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="455" class="text">prompt / output shape</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="495" class="small">结论：现象变了</text>

  <rect x="485" y="165" width="310" height="360" rx="14" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <rect x="515" y="198" width="126" height="34" rx="17" fill="#2563eb"/>
  <text font-family="Inter, Arial, sans-serif" x="537" y="221" class="pill">Week 6</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="268" class="box-title">Live Metrics</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="315" class="text">running / waiting</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="350" class="text">queue time</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="385" class="text">prefill / decode</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="420" class="text">KV cache usage</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="455" class="text">tokens/s over time</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="495" class="small">结论：为什么变</text>

  <rect x="900" y="165" width="310" height="360" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="930" y="198" width="138" height="34" rx="17" fill="#15803d"/>
  <text font-family="Inter, Arial, sans-serif" x="949" y="221" class="pill">Runbook</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="268" class="box-title">Actionable Diagnosis</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="315" class="text">symptom</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="350" class="text">first metrics</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="385" class="text">likely cause</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="420" class="text">next experiment</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="455" class="text">mitigation / fix</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="495" class="small">结论：下一步做什么</text>

  <path d="M395 345 H465" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M810 345 H880" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="242" y="585" width="790" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="277" y="622" class="text">benchmark_config.yaml + raw CSV/JSON + /metrics time series + dashboard screenshot + runbook.md</text>
</svg>
