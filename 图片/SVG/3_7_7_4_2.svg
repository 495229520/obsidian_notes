<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 610" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>HTTP 报文结构：起始行、头部、空行、实体</title>
  <desc>左右两块分别展示 HTTP 请求报文与响应报文的逐行结构，标出请求行与状态行、头字段、作为头部结束标志的空行以及实体；底部对照实体长度的三种声明方式：Content-Length、分块传输编码、以及读到连接关闭为止。</desc>

  <rect x="0" y="0" width="1240" height="610" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">HTTP：起始行 + 头部 + 空行 + 实体</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">头部靠 CRLF 逐行扫描，空行标志头部结束，实体长度必须由某个头字段声明</text>

  <!-- ============ Panel A: 请求 ============ -->
  <rect x="48" y="104" width="572" height="272" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 请求报文</text>

  <rect x="72" y="152" width="5" height="166" fill="#8A6A3A"/>
  <rect x="72" y="322" width="5" height="30" fill="#2F6B5E"/>

  <rect x="92" y="152" width="504" height="30" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="106" y="172" font-size="11.5" font-weight="700" fill="#2C4460">GET /search?q=socket HTTP/1.1</text>
  <text x="584" y="172" font-size="10.5" fill="#6B675C" text-anchor="end">请求行</text>

  <rect x="92" y="186" width="504" height="30" fill="#EDF1F7" stroke="#3D5A80" stroke-width="1"/>
  <text x="106" y="206" font-size="11.5" fill="#2C4460">Host: example.com</text>
  <text x="584" y="206" font-size="10.5" fill="#6B675C" text-anchor="end">头字段</text>

  <rect x="92" y="220" width="504" height="30" fill="#EDF1F7" stroke="#3D5A80" stroke-width="1"/>
  <text x="106" y="240" font-size="11.5" fill="#2C4460">Connection: keep-alive</text>
  <text x="584" y="240" font-size="10.5" fill="#6B675C" text-anchor="end">头字段</text>

  <rect x="92" y="254" width="504" height="30" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="106" y="274" font-size="11.5" font-weight="700" fill="#6B4E28">Content-Length: 17</text>
  <text x="584" y="274" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="end">声明实体长度</text>

  <rect x="92" y="288" width="504" height="30" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="106" y="308" font-size="11.5" font-weight="700" fill="#733428">CRLF（空行）</text>
  <text x="584" y="308" font-size="10.5" font-weight="700" fill="#733428" text-anchor="end">头部到此结束</text>

  <rect x="92" y="322" width="504" height="30" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="106" y="342" font-size="11.5" fill="#24473F">name=alice&amp;age=30</text>
  <text x="584" y="342" font-size="10.5" fill="#24473F" text-anchor="end">实体 17 字节</text>

  <!-- ============ Panel B: 响应 ============ -->
  <rect x="644" y="104" width="548" height="272" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="668" y="132" font-size="15" font-weight="700" fill="#4A473F">B · 响应报文</text>

  <rect x="668" y="152" width="5" height="166" fill="#8A6A3A"/>
  <rect x="668" y="322" width="5" height="30" fill="#2F6B5E"/>

  <rect x="688" y="152" width="480" height="30" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="702" y="172" font-size="11.5" font-weight="700" fill="#2C4460">HTTP/1.1 200 OK</text>
  <text x="1156" y="172" font-size="10.5" fill="#6B675C" text-anchor="end">状态行</text>

  <rect x="688" y="186" width="480" height="30" fill="#EDF1F7" stroke="#3D5A80" stroke-width="1"/>
  <text x="702" y="206" font-size="11.5" fill="#2C4460">Content-Type: text/html</text>
  <text x="1156" y="206" font-size="10.5" fill="#6B675C" text-anchor="end">头字段</text>

  <rect x="688" y="220" width="480" height="30" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="702" y="240" font-size="11.5" font-weight="700" fill="#6B4E28">Content-Length: 138</text>
  <text x="1156" y="240" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="end">声明实体长度</text>

  <rect x="688" y="254" width="480" height="30" fill="#EDF1F7" stroke="#3D5A80" stroke-width="1"/>
  <text x="702" y="274" font-size="11.5" fill="#2C4460">Connection: keep-alive</text>
  <text x="1156" y="274" font-size="10.5" fill="#6B675C" text-anchor="end">连接不关，可复用</text>

  <rect x="688" y="288" width="480" height="30" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="702" y="308" font-size="11.5" font-weight="700" fill="#733428">CRLF（空行）</text>
  <text x="1156" y="308" font-size="10.5" font-weight="700" fill="#733428" text-anchor="end">头部到此结束</text>

  <rect x="688" y="322" width="480" height="30" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="702" y="342" font-size="11.5" fill="#24473F">&lt;html&gt;…&lt;/html&gt;</text>
  <text x="1156" y="342" font-size="10.5" fill="#24473F" text-anchor="end">实体 138 字节</text>

  <!-- ============ Panel C: 实体长度的三种声明 ============ -->
  <rect x="48" y="400" width="1144" height="170" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="428" font-size="15" font-weight="700" fill="#4A473F">C · 实体长度只有这三种给法</text>

  <rect x="72" y="444" width="352" height="104" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="88" y="466" font-size="12.5" font-weight="700" fill="#6B4E28">Content-Length: 42</text>
  <text x="88" y="488" font-size="11" fill="#6B4E28">头里写死字节数，读满即止</text>
  <text x="88" y="510" font-size="11" fill="#6B4E28">前提：发之前长度已知</text>
  <text x="88" y="532" font-size="10.5" fill="#8A6A3A">静态文件、表单提交走这条</text>

  <rect x="444" y="444" width="352" height="104" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="460" y="466" font-size="12.5" font-weight="700" fill="#2C4460">Transfer-Encoding: chunked</text>
  <text x="460" y="488" font-size="11" fill="#2C4460">每块前写十六进制长度</text>
  <text x="460" y="510" font-size="11" fill="#2C4460">长度为 0 的块表示结束</text>
  <text x="460" y="532" font-size="10.5" fill="#3D5A80">边算边发的动态响应走这条</text>

  <rect x="816" y="444" width="352" height="104" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="832" y="466" font-size="12.5" font-weight="700" fill="#733428">两个都不给：读到连接关闭</text>
  <text x="832" y="488" font-size="11" fill="#733428">HTTP/1.0 的兜底做法</text>
  <text x="832" y="510" font-size="11" fill="#733428">分不清「发完了」和「断了」</text>
  <text x="832" y="532" font-size="10.5" fill="#A64B3C">连接用一次就废，不能复用</text>
</svg>
