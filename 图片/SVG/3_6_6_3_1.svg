<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
  </defs>

  <title>文件位置指示器：读和写共用同一个位置</title>
  <desc>以 r+ 打开 16 字节文件，三步操作（fread、fseek+fputs、fseek+fread）后位置指示器的移动轨迹，以及 + 模式读写切换规则。</desc>

  <rect x="0" y="0" width="1240" height="620" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">文件位置指示器：读和写共用同一个位置</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">以 "r+" 打开 16 字节文件 ABCDEFGHIJKLMNOP，三步操作后的位置轨迹（对应正文示例代码）</text>

  <!-- Panel A -->
  <rect x="48" y="104" width="1144" height="330" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="15" font-weight="700" fill="#4A473F">A · 三步操作的位置轨迹</text>

  <!-- reference ruler -->
  <text x="72" y="177" font-size="11.5" fill="#6B675C">文件内容</text>
  <rect x="250" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="302" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="354" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="406" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="458" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="510" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="562" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="614" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="666" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="718" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="770" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="822" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="874" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="926" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="978" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="1030" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="276" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">A</text>
  <text x="328" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">B</text>
  <text x="380" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">C</text>
  <text x="432" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">D</text>
  <text x="484" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">E</text>
  <text x="536" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">F</text>
  <text x="588" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">G</text>
  <text x="640" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">H</text>
  <text x="692" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">I</text>
  <text x="744" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">J</text>
  <text x="796" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">K</text>
  <text x="848" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">L</text>
  <text x="900" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">M</text>
  <text x="952" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">N</text>
  <text x="1004" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">O</text>
  <text x="1056" y="177" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">P</text>
  <text x="276" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">0</text>
  <text x="328" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">1</text>
  <text x="380" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">2</text>
  <text x="432" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">3</text>
  <text x="484" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">4</text>
  <text x="536" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">5</text>
  <text x="588" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">6</text>
  <text x="640" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">7</text>
  <text x="692" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">8</text>
  <text x="744" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">9</text>
  <text x="796" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">10</text>
  <text x="848" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">11</text>
  <text x="900" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">12</text>
  <text x="952" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">13</text>
  <text x="1004" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">14</text>
  <text x="1056" y="206" font-size="9.5" fill="#6B675C" text-anchor="middle">15</text>

  <!-- frame 1: fread 5 -->
  <text x="72" y="242" font-size="11.5" font-weight="700" fill="#2C4460">① fread(buf, 1, 5, fp)</text>
  <text x="72" y="258" font-size="10" fill="#6B675C">读 ABCDE，位置 0 → 5</text>
  <rect x="250" y="228" width="260" height="30" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="510" y="228" width="572" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="302" y1="228" x2="302" y2="258" stroke="#D8D5C8" stroke-width="0.8"/>
  <line x1="354" y1="228" x2="354" y2="258" stroke="#D8D5C8" stroke-width="0.8"/>
  <line x1="406" y1="228" x2="406" y2="258" stroke="#D8D5C8" stroke-width="0.8"/>
  <line x1="458" y1="228" x2="458" y2="258" stroke="#D8D5C8" stroke-width="0.8"/>
  <path d="M504,216 L516,216 L510,225 z" fill="#A64B3C"/>
  <line x1="510" y1="222" x2="510" y2="264" stroke="#A64B3C" stroke-width="2.2"/>
  <text x="1098" y="248" font-size="11.5" font-weight="700" fill="#4A473F">pos = 5</text>

  <!-- fseek jump arrow -->
  <line x1="510" y1="276" x2="660" y2="276" stroke="#8A6A3A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="585" y="271" font-size="9.5" fill="#8A6A3A" text-anchor="middle">fseek(fp, 8, SEEK_SET)</text>

  <!-- frame 2: fputs xx -->
  <text x="72" y="304" font-size="11.5" font-weight="700" fill="#733428">② fseek(8) 后 fputs("xx")</text>
  <text x="72" y="320" font-size="10" fill="#6B675C">覆盖位置 8、9 的 I、J</text>
  <rect x="250" y="290" width="416" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="666" y="290" width="104" height="30" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="770" y="290" width="312" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="718" y1="290" x2="718" y2="320" stroke="#D8D5C8" stroke-width="0.8"/>
  <text x="692" y="310" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">x</text>
  <text x="744" y="310" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">x</text>
  <path d="M764,278 L776,278 L770,287 z" fill="#A64B3C"/>
  <line x1="770" y1="284" x2="770" y2="326" stroke="#A64B3C" stroke-width="2.2"/>
  <text x="1098" y="310" font-size="11.5" font-weight="700" fill="#4A473F">pos = 10</text>

  <!-- frame 3: read back all -->
  <text x="72" y="366" font-size="11.5" font-weight="700" fill="#24473F">③ fseek(0) 后 fread 16 字节</text>
  <text x="72" y="382" font-size="10" fill="#6B675C">读回全部最终内容</text>
  <rect x="250" y="352" width="832" height="30" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <line x1="302" y1="352" x2="302" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="354" y1="352" x2="354" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="406" y1="352" x2="406" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="458" y1="352" x2="458" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="510" y1="352" x2="510" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="562" y1="352" x2="562" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="614" y1="352" x2="614" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="666" y1="352" x2="666" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="718" y1="352" x2="718" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="770" y1="352" x2="770" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="822" y1="352" x2="822" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="874" y1="352" x2="874" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="926" y1="352" x2="926" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="978" y1="352" x2="978" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <line x1="1030" y1="352" x2="1030" y2="382" stroke="#C4D5CC" stroke-width="0.8"/>
  <text x="276" y="372" font-size="11" fill="#24473F" text-anchor="middle">A</text>
  <text x="328" y="372" font-size="11" fill="#24473F" text-anchor="middle">B</text>
  <text x="380" y="372" font-size="11" fill="#24473F" text-anchor="middle">C</text>
  <text x="432" y="372" font-size="11" fill="#24473F" text-anchor="middle">D</text>
  <text x="484" y="372" font-size="11" fill="#24473F" text-anchor="middle">E</text>
  <text x="536" y="372" font-size="11" fill="#24473F" text-anchor="middle">F</text>
  <text x="588" y="372" font-size="11" fill="#24473F" text-anchor="middle">G</text>
  <text x="640" y="372" font-size="11" fill="#24473F" text-anchor="middle">H</text>
  <text x="692" y="372" font-size="11" font-weight="700" fill="#A64B3C" text-anchor="middle">x</text>
  <text x="744" y="372" font-size="11" font-weight="700" fill="#A64B3C" text-anchor="middle">x</text>
  <text x="796" y="372" font-size="11" fill="#24473F" text-anchor="middle">K</text>
  <text x="848" y="372" font-size="11" fill="#24473F" text-anchor="middle">L</text>
  <text x="900" y="372" font-size="11" fill="#24473F" text-anchor="middle">M</text>
  <text x="952" y="372" font-size="11" fill="#24473F" text-anchor="middle">N</text>
  <text x="1004" y="372" font-size="11" fill="#24473F" text-anchor="middle">O</text>
  <text x="1056" y="372" font-size="11" fill="#24473F" text-anchor="middle">P</text>
  <path d="M1076,340 L1088,340 L1082,349 z" fill="#A64B3C"/>
  <line x1="1082" y1="346" x2="1082" y2="388" stroke="#A64B3C" stroke-width="2.2"/>
  <text x="1098" y="372" font-size="11.5" font-weight="700" fill="#4A473F">pos = 16（EOF）</text>

  <!-- legend -->
  <line x1="76" y1="404" x2="76" y2="420" stroke="#A64B3C" stroke-width="2.2"/>
  <text x="88" y="416" font-size="10.5" fill="#6B675C">当前位置</text>
  <rect x="166" y="406" width="14" height="12" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="188" y="416" font-size="10.5" fill="#6B675C">本步读取</text>
  <rect x="266" y="406" width="14" height="12" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="288" y="416" font-size="10.5" fill="#6B675C">本步写入</text>
  <rect x="366" y="406" width="14" height="12" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="388" y="416" font-size="10.5" fill="#6B675C">最终内容</text>

  <!-- Card 1: switching rules -->
  <rect x="48" y="454" width="700" height="126" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="482" font-size="13" font-weight="700" fill="#4A473F">「+」模式读写切换规则</text>
  <text x="72" y="506" font-size="10.5" font-weight="700" fill="#6B675C">切换方向</text>
  <text x="240" y="506" font-size="10.5" font-weight="700" fill="#6B675C">中间必须做</text>
  <text x="520" y="506" font-size="10.5" font-weight="700" fill="#6B675C">违反后果</text>
  <line x1="72" y1="514" x2="724" y2="514" stroke="#D8D5C8" stroke-width="1"/>
  <text x="72" y="533" font-size="11" fill="#4A473F">读 → 写</text>
  <text x="240" y="533" font-size="11" fill="#4A473F">fseek / fsetpos / rewind 任一</text>
  <text x="520" y="533" font-size="11" font-weight="700" fill="#A64B3C">未定义行为</text>
  <text x="72" y="555" font-size="11" fill="#4A473F">写 → 读</text>
  <text x="240" y="555" font-size="11" fill="#4A473F">fflush 或任一定位函数</text>
  <text x="520" y="555" font-size="11" font-weight="700" fill="#A64B3C">读到过期缓冲</text>
  <text x="72" y="573" font-size="9.5" fill="#6B675C">例外：上一次读已遇到 EOF 时，可直接写</text>

  <!-- Card 2: append mode -->
  <rect x="768" y="454" width="424" height="126" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="792" y="482" font-size="13" font-weight="700" fill="#4A473F">追加模式是例外</text>
  <text x="792" y="510" font-size="11" fill="#4A473F">a / a+：每次写入自动跳到文件末尾</text>
  <text x="792" y="534" font-size="11" fill="#4A473F">fseek 只能移动 a+ 的读位置</text>
  <text x="792" y="558" font-size="11" font-weight="700" fill="#6B4E28">写入位置移不动，永远是 EOF</text>

  <!-- bottom note -->
  <text x="48" y="606" font-size="11" fill="#6B675C">ftell 报告的是流的逻辑位置；底层 fd 的偏移可能因缓冲预读跑在更后面，fseek / fflush 会让两者重新对齐</text>
</svg>
