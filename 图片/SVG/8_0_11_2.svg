<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">NVMe READ：把一笔块读翻译成 PCIe 事务</title><desc id="desc">四条纵向泳道显示 CPU、主机队列内存、PCIe 路径和 NVMe 控制器。MRd 取命令、CplD 返回命令、MWr 返回数据与 CQE。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">NVMe READ：把一笔块读翻译成 PCIe 事务</text>
<text x="48" y="77" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">“读盘”是应用语义；控制器把数据返回主机，典型事务是 Memory Write。</text>
<rect x="38" y="110" width="194" height="65" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="135.0" y="139.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">CPU 线程</text>
<text x="135.0" y="161.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">发布 / 消费</text>
<line x1="135" y1="183" x2="135" y2="590" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<rect x="323" y="110" width="194" height="65" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="420.0" y="139.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">主机 DRAM</text>
<text x="420.0" y="161.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">SQ · CQ · Buffer</text>
<line x1="420" y1="183" x2="420" y2="590" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<rect x="618" y="110" width="194" height="65" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="715.0" y="139.5" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">PCIe 路径</text>
<text x="715.0" y="161.5" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">RC / Switch</text>
<line x1="715" y1="183" x2="715" y2="590" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<rect x="993" y="110" width="194" height="65" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1090.0" y="139.5" font-size="15" font-weight="700" fill="#4A3F68" text-anchor="middle" data-role="body">NVMe 控制器</text>
<text x="1090.0" y="161.5" font-size="12.5" font-weight="400" fill="#4A3F68" text-anchor="middle" data-role="body">取命令 / 执行</text>
<line x1="1090" y1="183" x2="1090" y2="590" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<line x1="135" y1="211" x2="420" y2="211" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="277.5" y="201" font-size="13" font-weight="500" fill="#3D5A80" text-anchor="middle" data-role="body">① 填写 SQE</text>
<line x1="135" y1="253" x2="1090" y2="253" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="720" y="243" font-size="13" font-weight="500" fill="#3D5A80" text-anchor="middle" data-role="body">② MWr · Doorbell</text>
<line x1="1090" y1="303" x2="420" y2="303" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#amber)"/>
<text x="760" y="293" font-size="13" font-weight="500" fill="#8A6A3A" text-anchor="middle" data-role="body">③ MRd · 获取 SQE</text>
<line x1="420" y1="348" x2="1090" y2="348" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#green)"/>
<text x="760" y="338" font-size="13" font-weight="500" fill="#2F6B5E" text-anchor="middle" data-role="body">CplD · 返回 SQE</text>
<rect x="959" y="363" width="228" height="39" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1073.0" y="387.5" font-size="15" font-weight="600" fill="#4A3F68" text-anchor="middle" data-role="body">④ 控制器内部存储访问</text>
<line x1="1090" y1="430" x2="420" y2="430" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#green)"/>
<text x="760" y="420" font-size="13" font-weight="500" fill="#2F6B5E" text-anchor="middle" data-role="body">⑤ MWr · 返回业务数据</text>
<line x1="1090" y1="476" x2="420" y2="476" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#green)"/>
<text x="760" y="466" font-size="13" font-weight="500" fill="#2F6B5E" text-anchor="middle" data-role="body">⑥ MWr · 写 CQE / Phase</text>
<line x1="135" y1="527" x2="420" y2="527" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="277.5" y="517" font-size="13" font-weight="500" fill="#3D5A80" text-anchor="middle" data-role="body">⑦ 检查主机 CQ</text>
<line x1="420" y1="563" x2="135" y2="563" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="277.5" y="553" font-size="13" font-weight="500" fill="#3D5A80" text-anchor="middle" data-role="body">按协议读取完成</text>
<line x1="1090" y1="581" x2="135" y2="581" stroke="#8A6A3A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#amber)"/>
<text x="787" y="572" font-size="13" font-weight="500" fill="#8A6A3A" text-anchor="middle" data-role="body">可选 MSI-X · MWr 通知</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="642" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">CQE 是写入主机内存的设备协议数据，不是对 Doorbell 返回的 PCIe Completion。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">省略 PRP/SGL、预取与批量优化；箭头跨过 RC/Switch 表示路径转发，不表示 CPU 拷贝。</text>
</svg>