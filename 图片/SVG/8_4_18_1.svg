<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">一次请求，四个角色：数据与修改权怎样交接</title>
  <desc id="desc">A 产生业务，S 提交，P 推进，C 执行回调；基线把 S/P 与生命周期合并到一个 Owner。。图中预算、序号与布局均为教学示意，不是实测结果。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="bluearr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3" />
  <text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">一次请求，四个角色：数据与修改权怎样交接</text>
  <text x="48" y="79" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">A 产生业务，S 提交，P 推进，C 执行回调；基线把 S/P 与生命周期合并到一个 Owner。</text>
  <line x1="48" y1="98" x2="1192" y2="98" stroke="#D8D5C8" stroke-width="1" />
  <text x="1192" y="658" font-size="12" fill="#8B8679" font-weight="400" text-anchor="end">8 · 4 · 18 · 1</text>
  <rect x="48" y="115" width="924" height="100" rx="8" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="65" y="150" font-size="15" fill="#2C4460" font-weight="700" text-anchor="start">A · 应用</text>
  <text x="65" y="178" font-size="13" fill="#2C4460" font-weight="400" text-anchor="start">创建与发布</text>
  <rect x="48" y="227" width="924" height="100" rx="8" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="65" y="262" font-size="15" fill="#24473F" font-weight="700" text-anchor="start">S · 提交</text>
  <text x="65" y="290" font-size="13" fill="#24473F" font-weight="400" text-anchor="start">SQ / 信用</text>
  <rect x="48" y="339" width="924" height="100" rx="8" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="65" y="374" font-size="15" fill="#514573" font-weight="700" text-anchor="start">P · Progress</text>
  <text x="65" y="402" font-size="13" fill="#514573" font-weight="400" text-anchor="start">CQ / 账本</text>
  <rect x="48" y="451" width="924" height="100" rx="8" fill="#F3E8D3" stroke="#D8D5C8" stroke-width="1.3" />
  <text x="65" y="486" font-size="15" fill="#6B4E28" font-weight="700" text-anchor="start">C · 完成</text>
  <text x="65" y="514" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="start">业务与结果</text>
  <rect x="235" y="135" width="215" height="61" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="342.5" y="158.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">填写 buffer</text>
  <text x="342.5" y="182.5" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">取得 lease</text>
  <rect x="635" y="135" width="287" height="61" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="778.5" y="158.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">try_enqueue(command)</text>
  <text x="778.5" y="182.5" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle">发布后停止修改</text>
  <polyline points="454,165 630,165" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="482" y="152" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">主机线程发布关系</text>
  <rect x="635" y="247" width="287" height="61" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="778.5" y="270.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">校验 generation / credit</text>
  <text x="778.5" y="294.5" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">准备记录 → post</text>
  <polyline points="778,198 778,243" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="789" y="226" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start">命令交接</text>
  <rect x="1010" y="248" width="182" height="175" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="1101.0" y="316.5" font-size="15" fill="#4A473F" font-weight="700" text-anchor="middle">RNIC</text>
  <text x="1101.0" y="340.5" font-size="15" fill="#4A473F" font-weight="400" text-anchor="middle">执行 WQE</text>
  <text x="1101.0" y="364.5" font-size="15" fill="#4A473F" font-weight="400" text-anchor="middle">访问 buffer</text>
  <polyline points="925,278 1006,278" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="943" y="263" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start">提交</text>
  <rect x="635" y="359" width="287" height="61" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="778.5" y="382.5" font-size="14" fill="#514573" font-weight="700" text-anchor="middle">poll → token 对账</text>
  <text x="778.5" y="406.5" font-size="14" fill="#514573" font-weight="400" text-anchor="middle">结束 DMA 借用</text>
  <polyline points="1008,391 925,391" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="945" y="377" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start">CQE</text>
  <rect x="635" y="471" width="287" height="61" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="778.5" y="494.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">结果 + 读者 lease</text>
  <text x="778.5" y="518.5" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle">有界完成队列</text>
  <polyline points="778,424 778,467" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="790" y="448" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start">发布结果</text>
  <rect x="235" y="471" width="250" height="61" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="360.0" y="494.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">callback / resume</text>
  <text x="360.0" y="518.5" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle">最后读者归还 buffer</text>
  <polyline points="631,502 490,502" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="519" y="488" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start">所有权交接</text>
  <text x="236" y="267" font-size="14" fill="#4A473F" font-weight="700" text-anchor="start">应用持有业务身份</text>
  <text x="236" y="295" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">不再直接碰旧 QP 或数据</text>
  <text x="236" y="379" font-size="14" fill="#733428" font-weight="700" text-anchor="start">传输完成 ≠ 业务提交</text>
  <text x="236" y="407" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">READ 结果仍可能由 C 持有</text>
  <text x="55" y="585" font-size="14" fill="#4A473F" font-weight="700" text-anchor="start">Buffer 使用权</text>
  <rect x="210" y="563" width="230" height="40" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="325.0" y="589" font-size="14" fill="#2C4460" font-weight="500" text-anchor="middle">A 可写</text>
  <rect x="440" y="563" width="440" height="40" rx="0" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="660.0" y="589" font-size="14" fill="#6B4E28" font-weight="500" text-anchor="middle">RNIC 借用：禁止提前复用</text>
  <rect x="880" y="563" width="312" height="40" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="1036.0" y="589" font-size="14" fill="#24473F" font-weight="500" text-anchor="middle">C 读取 → 回池</text>
  <text x="50" y="641" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">lease 管生命周期；release/acquire 管主机线程发布；远端或设备顺序另按协议处理。</text>
</svg>