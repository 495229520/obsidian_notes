  <rect x="60" y="100" width="1080" height="56" class="entity-header-bg"/>
  <text x="80" y="135" class="entity-header-text">edoyunLogin_user_mysql</text>
  <text x="80" y="150" class="entity-header-sub">database: edoyun  ·  engine: MySQL  ·  实体类型：弱实体（业务上需要 user_name 唯一，但表定义未声明 UNIQUE）</text>
  <text x="1120" y="135" text-anchor="end" class="entity-header-sub">_mysql_table_</text>
