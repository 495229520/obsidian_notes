  <text x="600" y="36" text-anchor="middle" class="title-text">edoyunLogin_user_mysql 表 · ER 图</text>
  <text x="600" y="62" text-anchor="middle" class="subtitle-text">集成测试阶段唯一业务表 · 单实体无外键关系 · 23 字段按语义分组</text>

