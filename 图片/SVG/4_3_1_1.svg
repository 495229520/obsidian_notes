  <text x="80" y="836" class="note-text">⚠ 提示：表定义中所有字段约束通过位图 Attr 表达（NONE=0, NOT_NULL=1, DEFAULT=2, UNIQUE=4, PRIMARY_KEY=8, CHECK=16, AUTOINCREMENT=32），可按位或组合。</text>
  <text x="80" y="854" class="note-text">⚠ 业务隐含约束：登录接口要求 user_name 命中唯一一条，因此应在数据层为 user_name 增加 UNIQUE INDEX，否则触发 result.size() != 1 错误分支。</text>
