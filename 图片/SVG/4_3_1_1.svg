<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">edoyunLogin_user_mysql 表 ER 图</title>
  <desc id="desc">易播服务器集成测试阶段唯一业务表，单实体无外键关系。23 个字段按语义分组：标识与认证、联系方式、个人资料、地理信息、业务等级、时间戳。</desc>
  <rect x="0" y="0" width="1200" height="880" fill="rgb(245, 244, 237)"/>

