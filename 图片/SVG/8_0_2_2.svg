<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 视觉系统对齐 8_0_1 / 9.x -->
  <title>TLB Hit/Miss/Page Fault 分流与 CPU/IOMMU 双路径</title>
  <desc>上半：load/store 经 TLB 的 hit、miss walk、fault 三条路径。中部：常见 Page Fault 类型与存储 IO 交叉。下半：CPU 页表与 IOMMU 页表是两条路径，以及热路径前置措施。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">TLB miss ≠ Page Fault · CPU 页表 ≠ 设备 DMA 映射</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">先分流翻译结果，再判断是否进入内核异常；设备侧走 IOMMU，不能沿用进程 VA</text>

  <!-- ============ Panel A：决策树 ============ -->
  <text x="48" y="108" font-size="13" font-weight="700" fill="#4A473F">A · 一次 load/store 的翻译分流：Hit 最快 · Miss 可能 walk · 无效映射才 Fault</text>

  <rect x="48" y="120" width="1144" height="248" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <!-- start -->
  <rect x="68" y="148" width="180" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="158" y="170" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">load / store</text>
  <text x="158" y="188" font-size="10.5" fill="#3D5A80" text-anchor="middle">得到虚拟地址</text>
  <path d="M158,202 L158,224" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>

  <rect x="68" y="228" width="180" height="52" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="158" y="250" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">查 TLB</text>
  <text x="158" y="268" font-size="10.5" fill="#8A6A3A" text-anchor="middle">I/D TLB 常分离</text>

  <!-- three branches -->
  <path d="M250,254 L320,180" fill="none" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrg)"/>
  <path d="M250,254 L320,254" fill="none" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrn)"/>
  <path d="M250,254 L320,328" fill="none" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrr)"/>

  <!-- Hit -->
  <rect x="328" y="148" width="240" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="448" y="172" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">TLB Hit</text>
  <text x="448" y="194" font-size="11" fill="#24473F" text-anchor="middle">直接得 PFN · 查权限 · 访 Cache</text>

  <!-- Miss walk -->
  <rect x="328" y="228" width="240" height="64" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="448" y="252" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">TLB Miss · 有效映射</text>
  <text x="448" y="274" font-size="11" fill="#6B4E28" text-anchor="middle">Page Table Walk → 填 TLB</text>

  <!-- Fault -->
  <rect x="328" y="308" width="240" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="448" y="335" font-size="13" font-weight="700" fill="#733428" text-anchor="middle">无效 / 权限不足 → Page Fault</text>

  <!-- right cost notes -->
  <rect x="600" y="148" width="568" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="620" y="174" font-size="12" font-weight="700" fill="#24473F">Hit：翻译几乎被缓存吸收</text>
  <text x="620" y="196" font-size="11" fill="#24473F">随后延迟由 Cache Hit/Miss 主导（见 0.1）</text>

  <rect x="600" y="228" width="568" height="64" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="620" y="254" font-size="12" font-weight="700" fill="#6B4E28">Miss：walk 层数 × 页表是否在 Cache</text>
  <text x="620" y="276" font-size="11" fill="#6B4E28">不要把固定 ns 当所有机器的结论</text>

  <rect x="600" y="308" width="568" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="620" y="335" font-size="12" font-weight="700" fill="#733428">Fault：进内核异常路径；若读存储设备，延迟远高于 walk</text>

  <!-- ============ Panel B：Page Fault 类型 ============ -->
  <text x="48" y="400" font-size="13" font-weight="700" fill="#4A473F">B · Page Fault 不是“程序一定崩溃”：合法缺页可修复；保护错误才杀进程</text>

  <rect x="48" y="412" width="220" height="100" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="68" y="438" font-size="12" font-weight="700" fill="#24473F">按需分配</text>
  <text x="68" y="460" font-size="11" fill="#24473F">首次触碰匿名页</text>
  <text x="68" y="482" font-size="11" fill="#24473F">分配/清零后返回</text>
  <text x="68" y="500" font-size="10.5" fill="#2F6B5E">minor 居多</text>

  <rect x="284" y="412" width="220" height="100" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="304" y="438" font-size="12" font-weight="700" fill="#6B4E28">文件页调入</text>
  <text x="304" y="460" font-size="11" fill="#6B4E28">mmap 页不在内存</text>
  <text x="304" y="482" font-size="11" fill="#6B4E28">读文件/块设备</text>
  <text x="304" y="500" font-size="10.5" fill="#8A6A3A">可能 major + 睡眠</text>

  <rect x="520" y="412" width="220" height="100" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="540" y="438" font-size="12" font-weight="700" fill="#2C4460">写时复制 CoW</text>
  <text x="540" y="460" font-size="11" fill="#2C4460">共享页首次写入</text>
  <text x="540" y="482" font-size="11" fill="#2C4460">复制并改映射</text>
  <text x="540" y="500" font-size="10.5" fill="#3D5A80">fork 后常见</text>

  <rect x="756" y="412" width="200" height="100" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="776" y="438" font-size="12" font-weight="700" fill="#733428">保护错误</text>
  <text x="776" y="460" font-size="11" fill="#733428">写只读 / 越权</text>
  <text x="776" y="482" font-size="11" fill="#733428">执行 NX 页</text>
  <text x="776" y="500" font-size="10.5" fill="#A64B3C">常 SIGSEGV</text>

  <rect x="972" y="412" width="220" height="100" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
  <text x="992" y="438" font-size="12" font-weight="700" fill="#4A473F">swap 换入</text>
  <text x="992" y="460" font-size="11" fill="#4A473F">页被换出</text>
  <text x="992" y="482" font-size="11" fill="#4A473F">从 swap 读回</text>
  <text x="992" y="500" font-size="10.5" fill="#6B675C">延迟受存储影响</text>

  <!-- mmap path strip -->
  <rect x="48" y="528" width="1144" height="56" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="68" y="552" font-size="12" font-weight="700" fill="#6B4E28">mmap 文件页未驻留：Fault → 查 VMA → 提交文件读 → 线程睡眠 → 建 PTE → 重试指令</text>
  <text x="68" y="572" font-size="11" fill="#8A6A3A">与显式 read 都可能读块设备，但触发点不同：Fault 由 CPU 访问触发，read 由系统调用触发</text>

  <!-- ============ Panel C：双路径 ============ -->
  <text x="48" y="618" font-size="13" font-weight="700" fill="#4A473F">C · CPU 页表与 IOMMU 页表是两条路径：进程 VA 不会自动变成设备可 DMA 地址</text>

  <!-- CPU path -->
  <rect x="48" y="632" width="560" height="140" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="68" y="660" font-size="13" font-weight="700" fill="#2C4460">CPU 访问路径</text>
  <rect x="80" y="680" width="120" height="44" rx="6" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="140" y="706" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">进程 VA</text>
  <path d="M204,702 L236,702" fill="none" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrb)"/>
  <rect x="240" y="680" width="160" height="44" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="320" y="698" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">CPU Page Table</text>
  <text x="320" y="714" font-size="10" fill="#3D5A80" text-anchor="middle">+ TLB</text>
  <path d="M404,702 L436,702" fill="none" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrb)"/>
  <rect x="440" y="680" width="140" height="44" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="510" y="706" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">PA → Cache</text>
  <text x="68" y="752" font-size="11" fill="#2C4460">权限、隔离、按需映射都在这条路径上生效</text>

  <!-- Device path -->
  <rect x="632" y="632" width="560" height="140" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="652" y="660" font-size="13" font-weight="700" fill="#6B4E28">设备 DMA 路径</text>
  <rect x="664" y="680" width="130" height="44" rx="6" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="729" y="698" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">DMA / IOVA</text>
  <text x="729" y="714" font-size="10" fill="#8A6A3A" text-anchor="middle">设备发出</text>
  <path d="M798,702 L830,702" fill="none" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrn)"/>
  <rect x="834" y="680" width="160" height="44" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="914" y="698" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">IOMMU Page Table</text>
  <text x="914" y="714" font-size="10" fill="#8A6A3A" text-anchor="middle">隔离 + 重映射</text>
  <path d="M998,702 L1030,702" fill="none" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrn)"/>
  <rect x="1034" y="680" width="130" height="44" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1099" y="706" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">PA</text>
  <text x="652" y="752" font-size="11" fill="#6B4E28">需 pin → DMA map → 完成后 unmap；见 0.3</text>

  <!-- ============ Panel D：热路径 ============ -->
  <text x="48" y="804" font-size="13" font-weight="700" fill="#4A473F">D · 存储热路径：把缺页、映射、pin 挪到提交之前</text>

  <rect x="48" y="816" width="1144" height="100" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="68" y="836" width="250" height="60" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="193" y="860" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">① 分配并 touch 工作集</text>
  <text x="193" y="880" font-size="10.5" fill="#2F6B5E" text-anchor="middle">减少首次访问缺页</text>

  <path d="M322,866 L348,866" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>

  <rect x="352" y="836" width="250" height="60" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="477" y="860" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">② 预读 / 显式加载</text>
  <text x="477" y="880" font-size="10.5" fill="#3D5A80" text-anchor="middle">文件页尽量先驻留</text>

  <path d="M606,866 L632,866" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>

  <rect x="636" y="836" width="250" height="60" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="761" y="860" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">③ pin + DMA 映射</text>
  <text x="761" y="880" font-size="10.5" fill="#8A6A3A" text-anchor="middle">设备路径单独建立</text>

  <path d="M890,866 L916,866" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>

  <rect x="920" y="836" width="248" height="60" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1044" y="860" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">④ 再进低延迟提交</text>
  <text x="1044" y="880" font-size="10.5" fill="#A64B3C" text-anchor="middle">勿在热路径临时分配</text>
</svg>
