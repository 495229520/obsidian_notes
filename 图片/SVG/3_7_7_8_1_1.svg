<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Ethernet II 帧格式与帧长口径</title>
  <desc>按字节顺序画出 Ethernet II 帧的六段结构，标出前导码不计入帧长、帧长 64 到 1518、MTU 只指 payload 这三条口径；再给出插入 802.1Q 标签后的变化和 EtherType 分用表。</desc>

  <rect x="0" y="0" width="1240" height="660" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">Ethernet II 帧：哪些字节算帧长，MTU 又是指哪一段</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">帧头 14 字节 + payload 46～1500 + FCS 4 = 64～1518；前导码在这之外，MTU 只管中间那段</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="102" width="1144" height="278" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 一帧从左到右的六段</text>

  <!-- preamble bracket above -->
  <text x="170" y="158" font-size="10.5" fill="#6B675C" text-anchor="middle">网卡硬件生成，抓包看不到</text>
  <path d="M92,166 L92,172 L248,172 L248,166" fill="none" stroke="#9B968A" stroke-width="1"/>

  <!-- field bar -->
  <rect x="92" y="182" width="156" height="54" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="170" y="205" font-size="12" fill="#6B675C" text-anchor="middle">前导码 + SFD</text>
  <text x="170" y="224" font-size="11" fill="#6B675C" text-anchor="middle">7 + 1 字节</text>

  <rect x="248" y="182" width="160" height="54" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="328" y="205" font-size="12.5" fill="#2C4460" text-anchor="middle">目的 MAC</text>
  <text x="328" y="224" font-size="11" fill="#2C4460" text-anchor="middle">6 字节</text>

  <rect x="408" y="182" width="160" height="54" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="488" y="205" font-size="12.5" fill="#2C4460" text-anchor="middle">源 MAC</text>
  <text x="488" y="224" font-size="11" fill="#2C4460" text-anchor="middle">6 字节</text>

  <rect x="568" y="182" width="100" height="54" rx="4" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="618" y="205" font-size="12.5" fill="#6B4E28" text-anchor="middle">EtherType</text>
  <text x="618" y="224" font-size="11" fill="#6B4E28" text-anchor="middle">2 字节</text>

  <rect x="668" y="182" width="360" height="54" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="848" y="205" font-size="12.5" fill="#24473F" text-anchor="middle">Payload（上层数据）</text>
  <text x="848" y="224" font-size="11" fill="#24473F" text-anchor="middle">46 ～ 1500 字节</text>

  <rect x="1028" y="182" width="120" height="54" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1088" y="205" font-size="12.5" fill="#733428" text-anchor="middle">FCS</text>
  <text x="1088" y="224" font-size="11" fill="#733428" text-anchor="middle">4 字节</text>

  <!-- bracket: frame length -->
  <path d="M248,252 L248,258 L1148,258 L1148,252" fill="none" stroke="#5A564B" stroke-width="1.3"/>
  <text x="698" y="277" font-size="12" fill="#4A473F" text-anchor="middle">帧长 64 ～ 1518 字节，FCS 计入，前导码不计入</text>

  <!-- bracket: MTU -->
  <path d="M668,296 L668,302 L1028,302 L1028,296" fill="none" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="848" y="321" font-size="12" fill="#24473F" text-anchor="middle">MTU 1500 只管这一段，不含 14 字节帧头</text>

  <!-- bracket: header -->
  <path d="M248,296 L248,302 L668,302 L668,296" fill="none" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="458" y="321" font-size="12" fill="#2C4460" text-anchor="middle">帧头固定 14 字节，任何 Ethernet II 帧都一样</text>

  <!-- notes -->
  <text x="92" y="352" font-size="11.5" fill="#6B675C">payload 不足 46 字节时补 0，凑够最小帧长 64</text>
  <text x="470" y="352" font-size="11.5" fill="#6B675C">FCS 由网卡校验后剥掉，很少上交给协议栈</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="398" width="560" height="224" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="426" font-size="15" font-weight="700" fill="#4A473F">B · 插入 802.1Q VLAN 标签后</text>

  <rect x="72" y="448" width="86" height="40" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="115" y="473" font-size="11" fill="#2C4460" text-anchor="middle">目的 6</text>
  <rect x="158" y="448" width="86" height="40" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="201" y="473" font-size="11" fill="#2C4460" text-anchor="middle">源 6</text>
  <rect x="244" y="448" width="116" height="40" rx="4" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.6"/>
  <text x="302" y="473" font-size="11" fill="#4F4270" text-anchor="middle">VLAN 标签 4</text>
  <rect x="360" y="448" width="80" height="40" rx="4" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="400" y="473" font-size="11" fill="#6B4E28" text-anchor="middle">Type 2</text>
  <rect x="440" y="448" width="88" height="40" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="484" y="473" font-size="11" fill="#24473F" text-anchor="middle">Payload</text>
  <rect x="528" y="448" width="56" height="40" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="556" y="473" font-size="11" fill="#733428" text-anchor="middle">FCS 4</text>

  <text x="72" y="518" font-size="11.5" fill="#4A473F">标签插在源 MAC 之后、EtherType 之前</text>
  <text x="72" y="541" font-size="11.5" fill="#4A473F">前 2 字节固定 0x8100，后 2 字节装 3 位优先级 + 12 位 VLAN ID</text>
  <text x="72" y="564" font-size="11.5" fill="#4A473F">帧长上限变成 1522，最小仍是 64</text>
  <text x="72" y="595" font-size="11" fill="#6B675C">交换机在 access 口打标签、出口剥标签，主机通常看不到</text>

  <!-- ============ Panel C ============ -->
  <rect x="624" y="398" width="568" height="224" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="648" y="426" font-size="15" font-weight="700" fill="#4A473F">C · EtherType 决定 payload 交给谁</text>

  <text x="648" y="456" font-size="11" font-weight="700" fill="#6B675C">字段值</text>
  <text x="762" y="456" font-size="11" font-weight="700" fill="#6B675C">上层</text>
  <text x="878" y="456" font-size="11" font-weight="700" fill="#6B675C">接收端动作</text>
  <line x1="648" y1="464" x2="1168" y2="464" stroke="#D8D5C8" stroke-width="1"/>

  <text x="648" y="488" font-size="11.5" fill="#2B2A26">0x0800</text>
  <text x="762" y="488" font-size="11.5" fill="#2B2A26">IPv4</text>
  <text x="878" y="488" font-size="11.5" fill="#4A473F">送进 IP 层</text>

  <text x="648" y="514" font-size="11.5" fill="#2B2A26">0x0806</text>
  <text x="762" y="514" font-size="11.5" fill="#2B2A26">ARP</text>
  <text x="878" y="514" font-size="11.5" fill="#4A473F">送进 ARP 模块，不进 IP 层</text>

  <text x="648" y="540" font-size="11.5" fill="#2B2A26">0x86DD</text>
  <text x="762" y="540" font-size="11.5" fill="#2B2A26">IPv6</text>
  <text x="878" y="540" font-size="11.5" fill="#4A473F">送进 IPv6 层</text>

  <text x="648" y="566" font-size="11.5" fill="#2B2A26">0x8100</text>
  <text x="762" y="566" font-size="11.5" fill="#2B2A26">802.1Q</text>
  <text x="878" y="566" font-size="11.5" fill="#4A473F">剥标签，再读下一个 Type</text>

  <text x="648" y="592" font-size="11.5" fill="#2B2A26">≤ 0x05DC</text>
  <text x="762" y="592" font-size="11.5" fill="#2B2A26">长度</text>
  <text x="878" y="592" font-size="11.5" fill="#4A473F">旧 802.3 格式，此处是长度</text>

  <text x="648" y="614" font-size="10.5" fill="#6B675C">0x05DC = 1500，分界线以上才是类型</text>

  <text x="48" y="646" font-size="11.5" fill="#6B675C">口径提醒：tcpdump 与 Wireshark 显示的帧长既不含前导码，通常也不含 FCS</text>
</svg>
