<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>BUM 复制：入口复制，还是在承载树上复制？</title>
<desc>对比入口为三个远端复制三份外层单播包与 Underlay 组播在分叉处复制的差异。另一个 VNI 的端点不参与此复制集合。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">BUM 复制：入口复制，还是在承载树上复制？</text>
<text x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">示例：同一 VNI 共 4 个 VTEP；未知单播仍保留原来的内层单播目的 MAC。</text>
<rect x="32" y="112" width="568" height="470" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="624" y="112" width="584" height="470" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="52" y="140" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · Ingress Replication / HER</text>
<text x="644" y="140" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · Underlay Multicast</text>
<rect x="64" y="247" width="142" height="88" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="135.0" y="274.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">VTEP-A</text>
<text x="135.0" y="296.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">VNI 10100</text>
<text x="135.0" y="318.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">产生 1 个帧</text>
<rect x="412" y="168" width="156" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="490.0" y="195.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">VTEP-B</text>
<text x="490.0" y="217.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">VNI 10100</text>
<path d="M206,265 L250,265 L250,201 L408,201" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="310" y="189" font-size="13" font-weight="400" fill="#2C4460" text-anchor="start">单播 → B</text>
<rect x="412" y="292" width="156" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="490.0" y="319.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">VTEP-C</text>
<text x="490.0" y="341.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">VNI 10100</text>
<path d="M206,291 L314,291 L314,325 L408,325" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="334" y="313" font-size="13" font-weight="400" fill="#2C4460" text-anchor="start">单播 → C</text>
<rect x="412" y="416" width="156" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="490.0" y="443.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">VTEP-D</text>
<text x="490.0" y="465.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">VNI 10100</text>
<path d="M206,317 L282,317 L282,449 L408,449" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="310" y="437" font-size="13" font-weight="400" fill="#2C4460" text-anchor="start">单播 → D</text>
<rect x="64" y="425" width="142" height="62" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="135.0" y="450.0" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">另一 VNI</text>
<text x="135.0" y="472.0" font-size="13" font-weight="400" fill="#4A473F" text-anchor="middle">不在成员集合</text>
<text x="64" y="553" font-size="16" font-weight="700" fill="#2C4460" text-anchor="start">入口发 3 份</text>
<text x="296" y="553" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">不要求 Underlay 组播</text>
<rect x="648" y="247" width="142" height="88" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="719.0" y="274.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">VTEP-A</text>
<text x="719.0" y="296.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">VNI 10100</text>
<text x="719.0" y="318.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">产生 1 个帧</text>
<rect x="812" y="166" width="184" height="339" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="904" y="190" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="middle">组播分发树</text>
<path d="M790,291 L920,291" fill="none" stroke="#8A6A3A" stroke-width="1.8" stroke-linejoin="round"/>
<text x="806" y="276" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="start">入口 1 份</text>
<path d="M920,201 L920,449" fill="none" stroke="#8A6A3A" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="920" cy="291" r="5" fill="#8A6A3A"/>
<rect x="1028" y="168" width="152" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1104.0" y="195.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">VTEP-B</text>
<text x="1104.0" y="217.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">VNI 10100</text>
<path d="M920,201 L1024,201" fill="none" stroke="#8A6A3A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="1028" y="292" width="152" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1104.0" y="319.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">VTEP-C</text>
<text x="1104.0" y="341.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">VNI 10100</text>
<path d="M920,325 L1024,325" fill="none" stroke="#8A6A3A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="1028" y="416" width="152" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1104.0" y="443.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">VTEP-D</text>
<text x="1104.0" y="465.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">VNI 10100</text>
<path d="M920,449 L1024,449" fill="none" stroke="#8A6A3A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="648" y="553" font-size="16" font-weight="700" fill="#6B4E28" text-anchor="start">入口发 1 份</text>
<text x="895" y="553" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">分叉处继续复制</text>
<text x="48" y="615" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">共同约束：成员范围、复制资源、接收处理与防环</text>
<text x="48" y="642" font-size="14" font-weight="400" fill="#24473F" text-anchor="start">只在合格的同服务成员间复制</text>
<text x="656" y="642" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">EVPN 可以减少部分泛洪，不会消灭全部 BUM</text>
<path d="M48,655 L1192,655" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="48" y="680" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">“1 份 / 3 份”仅统计源端对这个帧发出的隧道副本；不等于整张网络的总字节数，也不等于全部链路负载。</text>
</svg>
