<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" role="img" aria-label="哈希表查找、散列值、桶下标与冲突示意" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>哈希表：散列值、桶下标与冲突</title>
  <desc>本图用教学用散列函数 h(k)=7k+3 说明：key 先得到散列值，再对桶数取模得到桶下标。不同 key 的散列值可能不同，但取模后仍可能落入同一桶，这就是哈希冲突。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="690" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">哈希表：先把 key 定位到桶，再在桶内检查</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">散列值是函数算出的中间数字；桶下标是把这个数字映射到有限桶数组后的位置。</text>

  <text x="48" y="111" font-size="13" font-weight="700" fill="#4A473F">A · 查找 7：线性扫描与哈希定位</text>

  <rect x="48" y="124" width="548" height="156" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="149" font-size="13" font-weight="700" fill="#2B2A26">线性查找：从头逐个比较</text>
  <text x="68" y="170" font-size="11" fill="#6B675C">数组 [3, 8, 1, 7, 9]，找 7</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="84" y="190" width="64" height="46" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="116" y="219" fill="#2C4460">3</text>
    <rect x="160" y="190" width="64" height="46" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="192" y="219" fill="#2C4460">8</text>
    <rect x="236" y="190" width="64" height="46" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="268" y="219" fill="#2C4460">1</text>
    <rect x="312" y="190" width="64" height="46" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
    <text x="344" y="219" fill="#24473F">7</text>
    <rect x="388" y="190" width="64" height="46" rx="6" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
    <text x="420" y="219" fill="#4A473F">9</text>
  </g>
  <path d="M116,244 C178,266 286,266 344,244" fill="none" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="230" y="270" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">比较 4 次才找到 → 最坏 O(n)</text>

  <rect x="616" y="124" width="576" height="156" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="636" y="149" font-size="13" font-weight="700" fill="#2B2A26">哈希查找：先算桶下标，再比较短链</text>
  <text x="636" y="170" font-size="11" fill="#6B675C">此图的教学函数：h(k) = 7k + 3；共有 5 个桶</text>
  <rect x="644" y="190" width="112" height="46" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="700" y="219" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">key = 7</text>
  <line x1="760" y1="213" x2="806" y2="213" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#green-arrow)"/>
  <rect x="814" y="190" width="134" height="46" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="881" y="219" font-size="13" font-weight="700" fill="#7A5518" text-anchor="middle">h(7) = 52</text>
  <line x1="952" y1="213" x2="998" y2="213" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#green-arrow)"/>
  <rect x="1006" y="190" width="146" height="46" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1079" y="219" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">52 % 5 = 2</text>
  <text x="636" y="265" font-size="11" font-weight="700" fill="#2F6B5E">直接到 bucket[2]，只需检查这个桶里的少量元素 → 平均 O(1)</text>

  <text x="48" y="315" font-size="13" font-weight="700" fill="#4A473F">B · 三步：key → 散列值 → 桶下标</text>
  <rect x="48" y="328" width="1144" height="100" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="76" y="350" width="190" height="56" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="171" y="373" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">key = 17</text>
  <text x="171" y="394" font-size="11" fill="#2C4460" text-anchor="middle">要保存或查找的键</text>
  <line x1="270" y1="378" x2="330" y2="378" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="338" y="350" width="236" height="56" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="456" y="373" font-size="13" font-weight="700" fill="#7A5518" text-anchor="middle">h(17) = 7 × 17 + 3 = 122</text>
  <text x="456" y="394" font-size="11" fill="#7A5518" text-anchor="middle">散列值：范围很大</text>
  <line x1="578" y1="378" x2="638" y2="378" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="646" y="350" width="202" height="56" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="747" y="373" font-size="13" font-weight="700" fill="#7A5518" text-anchor="middle">122 % 5 = 2</text>
  <text x="747" y="394" font-size="11" fill="#7A5518" text-anchor="middle">桶下标：0 到 4</text>
  <line x1="852" y1="378" x2="912" y2="378" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="920" y="350" width="190" height="56" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1015" y="373" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">bucket[2]</text>
  <text x="1015" y="394" font-size="11" fill="#24473F" text-anchor="middle">桶数组中的第 2 格</text>

  <text x="48" y="463" font-size="13" font-weight="700" fill="#4A473F">C · 为什么会冲突：桶有限，不同散列值仍可能得到同一下标</text>
  <rect x="48" y="476" width="714" height="158" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="501" font-size="12" font-weight="700" fill="#4A473F">三个不同 key，散列值不同，却都落入 bucket[2]</text>
  <text x="68" y="531" font-size="12" fill="#2C4460">7</text>
  <text x="160" y="531" font-size="12" fill="#7A5518">h(7) = 52</text>
  <text x="310" y="531" font-size="12" fill="#7A5518">52 % 5 = 2</text>
  <text x="68" y="557" font-size="12" fill="#2C4460">12</text>
  <text x="160" y="557" font-size="12" fill="#7A5518">h(12) = 87</text>
  <text x="310" y="557" font-size="12" fill="#7A5518">87 % 5 = 2</text>
  <text x="68" y="583" font-size="12" fill="#2C4460">17</text>
  <text x="160" y="583" font-size="12" fill="#7A5518">h(17) = 122</text>
  <text x="310" y="583" font-size="12" fill="#7A5518">122 % 5 = 2</text>
  <line x1="432" y1="555" x2="488" y2="555" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="496" y="524" width="112" height="60" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="552" y="549" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">bucket[2]</text>
  <text x="552" y="570" font-size="11" fill="#2C4460" text-anchor="middle">同一桶</text>
  <line x1="612" y1="554" x2="654" y2="554" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="674" y="559" font-size="13" font-weight="700" fill="#733428">7 → 12 → 17</text>

  <rect x="782" y="476" width="410" height="158" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="802" y="502" font-size="13" font-weight="700" fill="#733428">冲突后的处理：链地址法</text>
  <text x="802" y="529" font-size="11.5" fill="#4A473F">同一桶中保存多个 key；查询时逐个比较。</text>
  <text x="802" y="554" font-size="11.5" fill="#2F6B5E">链短：比较次数少 → 平均 O(1)</text>
  <text x="802" y="579" font-size="11.5" fill="#A64B3C">链很长：退化为线性扫描 → 最坏 O(n)</text>
  <text x="802" y="611" font-size="11" fill="#6B675C">控制负载因子、扩容 rehash，就是在防止链变长。</text>

  <rect x="48" y="650" width="1144" height="26" rx="7" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.1"/>
  <text x="68" y="668" font-size="11" fill="#4A473F">要点：散列值不等于桶下标；“不同 key 映射到同一桶下标”就是冲突。真实容器的散列函数更复杂，但流程完全相同。</text>
</svg>
