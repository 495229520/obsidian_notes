<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">XDP Hook：同一个动作，不同的执行位置</title><desc id="desc">对照 Native、Generic 与硬件卸载的执行位置，说明 Native 已发生 NIC 接收和 DMA，Generic 已有 skb。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">XDP Hook：同一个动作，不同的执行位置</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">三条路径是模式对照，不是同一包依次执行三个 XDP；空间位置表示处理层次，不表示时延比例。</text>
<rect x="48" y="114" width="1144" height="146" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="142" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">A · Native</text>
<rect x="48" y="280" width="1144" height="146" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="308" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">B · Generic</text>
<rect x="48" y="446" width="1144" height="146" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="474" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">C · Offload</text>
<rect x="208" y="154" width="146" height="55" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="281.0" y="176.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="208,154,146,55">NIC 收包</text>
<text x="281.0" y="197.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="208,154,146,55">DMA 到主机</text>
<rect x="398" y="154" width="163" height="55" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="479.5" y="176.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="398,154,163,55">RX 驱动轮询</text>
<text x="479.5" y="197.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="398,154,163,55">已有接收缓冲</text>
<rect x="613" y="154" width="175" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="700.5" y="176.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-region="body" data-box="613,154,175,55">Native XDP</text>
<text x="700.5" y="197.0" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body" data-box="613,154,175,55">主机 CPU 执行</text>
<rect x="842" y="154" width="163" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="923.5" y="176.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-region="body" data-box="842,154,163,55">构建 skb</text>
<text x="923.5" y="197.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-region="body" data-box="842,154,163,55">普通协议栈</text>
<rect x="1045" y="154" width="128" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1109.0" y="176.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-region="body" data-box="1045,154,128,55">socket</text>
<text x="1109.0" y="197.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-region="body" data-box="1045,154,128,55">应用接收</text>
<path d="M354,181 L394,181" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M561,181 L609,181" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M788,181 L838,181" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M1005,181 L1041,181" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="804" y="168" font-size="12" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body">PASS</text>
<path d="M700,209 L700,224" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="614" y="226" width="390" height="24" rx="5" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="809" y="243" font-size="12.5" fill="#6B4E28" font-weight="400" text-anchor="middle" data-region="body">DROP / TX / REDIRECT · 丢弃或转向</text>
<rect x="208" y="320" width="146" height="55" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="281.0" y="342.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="208,320,146,55">NIC 收包</text>
<text x="281.0" y="363.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="208,320,146,55">DMA 到主机</text>
<rect x="398" y="320" width="163" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="479.5" y="342.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-region="body" data-box="398,320,163,55">驱动接收</text>
<text x="479.5" y="363.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-region="body" data-box="398,320,163,55">skb 已存在</text>
<rect x="613" y="320" width="175" height="55" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="700.5" y="342.0" font-size="14" fill="#4A3F68" font-weight="700" text-anchor="middle" data-region="body" data-box="613,320,175,55">Generic XDP</text>
<text x="700.5" y="363.0" font-size="12.5" fill="#4A3F68" font-weight="400" text-anchor="middle" data-region="body" data-box="613,320,175,55">主机 CPU 执行</text>
<rect x="842" y="320" width="163" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="923.5" y="342.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-region="body" data-box="842,320,163,55">普通协议栈</text>
<text x="923.5" y="363.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-region="body" data-box="842,320,163,55">继续后续处理</text>
<rect x="1045" y="320" width="128" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1109.0" y="342.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-region="body" data-box="1045,320,128,55">socket</text>
<text x="1109.0" y="363.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-region="body" data-box="1045,320,128,55">应用接收</text>
<path d="M354,347 L394,347" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M561,347 L609,347" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M788,347 L838,347" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M1005,347 L1041,347" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="804" y="334" font-size="12" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body">PASS</text>
<path d="M700,375 L700,389" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="700" y="413" font-size="13" fill="#4A3F68" font-weight="400" text-anchor="middle" data-region="body">丢弃不能再省掉已完成的 skb 构建</text>
<rect x="208" y="486" width="353" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="384.5" y="508.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-region="body" data-box="208,486,353,55">可编程 NIC · 设备侧 XDP</text>
<text x="384.5" y="529.0" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body" data-box="208,486,353,55">需要设备的指令、map 与动作支持</text>
<rect x="613" y="486" width="175" height="55" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="700.5" y="508.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="613,486,175,55">主机接收路径</text>
<text x="700.5" y="529.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="613,486,175,55">后续 DMA / 驱动</text>
<rect x="842" y="486" width="163" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="923.5" y="508.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-region="body" data-box="842,486,163,55">普通协议栈</text>
<text x="923.5" y="529.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-region="body" data-box="842,486,163,55">保留主机处理</text>
<rect x="1045" y="486" width="128" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1109.0" y="508.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-region="body" data-box="1045,486,128,55">socket</text>
<text x="1109.0" y="529.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-region="body" data-box="1045,486,128,55">应用接收</text>
<path d="M561,513 L609,513" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M788,513 L838,513" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M1005,513 L1041,513" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="586" y="498" font-size="12" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body">继续</text>
<text x="208" y="569" font-size="13" fill="#24473F" font-weight="400" text-anchor="start" data-region="body">设备侧动作与能力依具体实现</text>
<text x="613" y="569" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-region="body">不能由 Native 支持推导出 Offload 或 AF_XDP ZC</text>
<rect x="48" y="632" width="1144" height="38" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="657" font-size="13" fill="#4A473F" font-weight="400" text-anchor="start" data-region="caption">成本边界：Native XDP_DROP 通常已支付收包、DMA 与初始轮询成本；省下的是后续常规路径工作。</text>
</svg>
