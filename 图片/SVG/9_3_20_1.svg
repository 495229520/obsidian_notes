<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect x="0" y="0" width="1200" height="520" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 15px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .amber { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .rose { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="60" y="55" class="title">Week 16：把 GEMM lab 收束成作品集项目</text>
  <text x="60" y="88" class="small">可复现、可解释、不过度包装，是最终交付的核心。</text>

  <rect x="60" y="135" width="230" height="170" class="box"/>
  <text x="88" y="172" class="label">Week 9-15 材料</text>
  <text x="88" y="207" class="small">kernels / baselines</text>
  <text x="88" y="234" class="small">CSV / profiler</text>
  <text x="88" y="261" class="small">roofline findings</text>

  <path d="M300 220 H382" class="line"/>

  <rect x="400" y="115" width="240" height="210" class="blue"/>
  <text x="430" y="153" class="label">可信交付</text>
  <text x="430" y="189" class="small">README</text>
  <text x="430" y="216" class="small">comparison report</text>
  <text x="430" y="243" class="small">artifact index</text>
  <text x="430" y="270" class="small">interview story</text>

  <path d="M650 220 H732" class="line"/>

  <rect x="750" y="95" width="250" height="250" class="green"/>
  <text x="780" y="133" class="label">作品集价值</text>
  <text x="780" y="169" class="small">what I built</text>
  <text x="780" y="196" class="small">what I measured</text>
  <text x="780" y="223" class="small">what I learned</text>
  <text x="780" y="250" class="small">what is not proven</text>
  <text x="780" y="277" class="small">what comes next</text>

  <path d="M1010 220 H1082" class="line"/>

  <rect x="60" y="375" width="1080" height="88" class="amber"/>
  <text x="92" y="412" class="label">定位</text>
  <text x="92" y="444" class="small">不是“打败 cuBLAS”的包装，而是“我理解 GEMM 优化链路、baseline 和 profiling 方法”的工程证据。</text>

  <rect x="1100" y="175" width="40" height="90" class="rose"/>
  <text x="1068" y="155" class="small">next</text>
  <text x="1038" y="292" class="tiny">LLM kernels / attention / serving</text>
</svg>
