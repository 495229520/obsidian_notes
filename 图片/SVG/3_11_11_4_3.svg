<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 750" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>三种回收子进程的办法：等着、主动查、收到通知再收</title>
  <desc>上半对比三种回收方式下父进程在做什么；下半说明多个子进程同时结束时，为什么处理函数必须一次收干净。</desc>
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="750" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">三种回收子进程的办法：等着、主动查、收到通知再收</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">区别在于：父进程等待时，是停下来、自己反复查，还是收到通知再处理</text>

  <text x="56" y="118" font-size="13" font-weight="700" fill="#4A473F">A · 等子进程结束时，父进程在做什么</text>

  <rect x="56" y="132" width="1128" height="84" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="158" font-size="12" font-weight="700" fill="#3D5A80">wait(NULL)</text>
  <text x="70" y="178" font-size="10.5" fill="#3D5A80">父进程停在这里等</text>
  <rect x="280" y="150" width="750" height="30" rx="6" fill="#ECEAE0" stroke="#8A8574" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="655" y="170" font-size="11.5" fill="#4A473F" text-anchor="middle">父进程暂停：不占 CPU，也不能做别的事</text>
  <rect x="1044" y="150" width="126" height="30" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="1107" y="170" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">收到退出状态</text>
  <text x="284" y="202" font-size="11" fill="#6B675C">适合父进程没有别的任务，例如 shell 前台运行一条命令</text>

  <rect x="56" y="224" width="1128" height="84" rx="8" fill="#FAF4E9" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="250" font-size="12" font-weight="700" fill="#8A6A3A">waitpid(pid, &amp;st, WNOHANG)</text>
  <text x="70" y="270" font-size="10.5" fill="#8A6A3A">子进程没结束就返回 0</text>
  <rect x="280" y="242" width="750" height="30" rx="6" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="290" y="242" width="30" height="30" fill="#E0CDA4" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="305" y="262" font-size="10" fill="#6B4E28" text-anchor="middle">查</text>
  <rect x="410" y="242" width="30" height="30" fill="#E0CDA4" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="425" y="262" font-size="10" fill="#6B4E28" text-anchor="middle">查</text>
  <rect x="530" y="242" width="30" height="30" fill="#E0CDA4" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="545" y="262" font-size="10" fill="#6B4E28" text-anchor="middle">查</text>
  <rect x="650" y="242" width="30" height="30" fill="#E0CDA4" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="665" y="262" font-size="10" fill="#6B4E28" text-anchor="middle">查</text>
  <rect x="770" y="242" width="30" height="30" fill="#E0CDA4" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="785" y="262" font-size="10" fill="#6B4E28" text-anchor="middle">查</text>
  <rect x="890" y="242" width="30" height="30" fill="#D8B87A" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="905" y="262" font-size="10" fill="#6B4E28" text-anchor="middle">中</text>
  <text x="972" y="262" font-size="10.5" fill="#6B4E28" text-anchor="middle">前五次：还没结束</text>
  <rect x="1044" y="242" width="126" height="30" rx="6" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="1107" y="262" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">第六次：收到了</text>
  <text x="284" y="294" font-size="11" fill="#6B675C">查太勤浪费 CPU；查太少，子进程结束后会晚点才回收</text>

  <rect x="56" y="316" width="1128" height="84" rx="8" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="342" font-size="12" font-weight="700" fill="#2F6B5E">SIGCHLD 处理函数</text>
  <text x="70" y="362" font-size="10.5" fill="#2F6B5E">子进程结束，内核通知父进程</text>
  <rect x="280" y="334" width="460" height="30" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="510" y="354" font-size="11.5" fill="#24473F" text-anchor="middle">父进程继续处理自己的事</text>
  <rect x="748" y="334" width="170" height="30" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="833" y="354" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">收到通知，循环回收</text>
  <rect x="926" y="334" width="104" height="30" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="978" y="354" font-size="11" fill="#24473F" text-anchor="middle">继续原来的工作</text>
  <rect x="1044" y="334" width="126" height="30" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1107" y="354" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">不用反复查</text>
  <text x="284" y="386" font-size="11" fill="#6B675C">父进程忙自己的事，收到通知才回收；不用反复检查</text>

  <text x="56" y="440" font-size="13" font-weight="700" fill="#4A473F">B · 三个子进程几乎同时结束，父进程可能只收到一次 SIGCHLD</text>

  <rect x="56" y="456" width="640" height="180" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="76" y="482" font-size="12.5" font-weight="700" fill="#4A473F">三个子进程几乎同时退出</text>

  <rect x="80" y="498" width="136" height="36" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="148" y="521" font-size="11" fill="#733428" text-anchor="middle">子 A exit(0)</text>
  <rect x="80" y="542" width="136" height="36" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="148" y="565" font-size="11" fill="#733428" text-anchor="middle">子 B exit(1)</text>
  <rect x="80" y="586" width="136" height="36" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="148" y="609" font-size="11" fill="#733428" text-anchor="middle">子 C 段错误退出</text>

  <rect x="262" y="524" width="180" height="76" rx="7" fill="#EDEBE3" stroke="#8A8574" stroke-width="1.5"/>
  <text x="352" y="548" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">同一种信号不排队</text>
  <text x="352" y="568" font-size="10.5" fill="#4A473F" text-anchor="middle">已经有通知在等处理</text>
  <text x="352" y="586" font-size="10.5" fill="#4A473F" text-anchor="middle">后来的同类通知合并</text>

  <rect x="478" y="524" width="200" height="76" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="578" y="548" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">处理函数只运行一次</text>
  <text x="578" y="568" font-size="10.5" fill="#733428" text-anchor="middle">若只回收一个子进程</text>
  <text x="578" y="586" font-size="10.5" fill="#733428" text-anchor="middle">另外两个仍会变成僵尸</text>

  <line x1="220" y1="516" x2="258" y2="545" stroke="#5A564B" stroke-width="1.5" marker-end="url(#c1)"/>
  <line x1="220" y1="560" x2="258" y2="562" stroke="#5A564B" stroke-width="1.5" marker-end="url(#c1)"/>
  <line x1="220" y1="604" x2="258" y2="579" stroke="#5A564B" stroke-width="1.5" marker-end="url(#c1)"/>
  <line x1="442" y1="562" x2="474" y2="562" stroke="#5A564B" stroke-width="1.6" marker-end="url(#c1)"/>

  <rect x="716" y="456" width="468" height="180" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="736" y="482" font-size="12.5" font-weight="700" fill="#4A473F">处理函数里这样写</text>
  <text x="736" y="512" font-size="11" fill="#4A473F">① 循环调用 waitpid，直到没有可回收的</text>
  <text x="736" y="537" font-size="11" fill="#4A473F">② 带 WNOHANG，别卡在处理函数里</text>
  <text x="736" y="562" font-size="11" fill="#4A473F">③ pid 传 -1，一次收任意子进程</text>
  <text x="736" y="587" font-size="11" fill="#4A473F">④ 先保存 errno，结束后再恢复</text>
  <text x="736" y="612" font-size="11" fill="#4A473F">⑤ 别在处理函数里用 printf</text>

  <text x="68" y="690" font-size="11.5" fill="#4A473F">轮询那一行只是用来理解 WNOHANG：它不阻塞，但要由父进程自己安排检查时机。</text>
  <text x="68" y="714" font-size="11.5" fill="#4A473F">还有一种偷懒写法是 signal(SIGCHLD, SIG_IGN)，内核直接不留状态，代价是退出码一起丢掉，只适合完全不关心子进程结果的场景。</text>
</svg>
