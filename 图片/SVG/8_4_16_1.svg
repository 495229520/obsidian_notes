<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Inline、Batching 与 Doorbell：一次小消息发送的 PCIe 账</title>
  <desc>三个分区：A 普通 SGE 发送需要 doorbell MMIO 加两次 DMA 读；B IBV_SEND_INLINE 把数据捎进 WQE 省掉数据 DMA；C postlist 把 N 次门铃摊成 1 次；底部为边界条件。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">Inline、Batching 与 Doorbell：一次小消息发送的 PCIe 账</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">小消息的成本大头不在网线，在 PCIe：doorbell MMIO + 网卡两次 DMA 读；inline 省掉取数那次 DMA，postlist 把 N 次门铃摊成 1 次</text>

  <!-- A · 普通 SGE 发送 -->
  <rect x="48" y="112" width="1144" height="230" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="140" font-size="13" font-weight="700" fill="#4A473F">A · 普通 SGE 发送：WQE 只带指针，数据要网卡自己来取</text>
  <line x1="560" y1="152" x2="560" y2="330" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="80" y="168" font-size="10.5" fill="#6B675C">CPU / 内存侧</text>
  <text x="570" y="168" font-size="10.5" fill="#6B675C">PCIe 边界</text>
  <text x="1040" y="168" font-size="10.5" fill="#6B675C">网卡侧</text>

  <rect x="68" y="186" width="180" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="158" y="208" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">① 填 WQE</text>
  <text x="158" y="226" font-size="9.5" fill="#2C4460" text-anchor="middle">SGE = {addr, len, lkey}</text>

  <rect x="300" y="186" width="160" height="52" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="380" y="208" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">② doorbell</text>
  <text x="380" y="226" font-size="9.5" fill="#6B4E28" text-anchor="middle">MMIO 写（posted）</text>

  <line x1="248" y1="212" x2="294" y2="212" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="460" y1="212" x2="634" y2="196" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="640" y="172" width="210" height="48" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.4"/>
  <text x="745" y="192" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">③ DMA 读 WQE</text>
  <text x="745" y="210" font-size="9.5" fill="#4A473F" text-anchor="middle">PCIe 往返 ×1</text>

  <rect x="640" y="244" width="210" height="48" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="745" y="264" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">④ DMA 读 data buffer</text>
  <text x="745" y="282" font-size="9.5" fill="#733428" text-anchor="middle">PCIe 往返 ×2（按 lkey 取数）</text>

  <line x1="745" y1="220" x2="745" y2="238" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="68" y="262" width="382" height="42" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="259" y="288" font-size="10.5" fill="#6B4E28" text-anchor="middle">data buffer（注册过的 MR，在途期间禁改写）</text>
  <line x1="634" y1="268" x2="456" y2="280" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrr)"/>

  <rect x="920" y="208" width="140" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="990" y="230" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">⑤ 封包上线</text>
  <text x="990" y="248" font-size="9.5" fill="#24473F" text-anchor="middle">切 MTU、加头</text>

  <line x1="850" y1="196" x2="914" y2="226" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="850" y1="268" x2="914" y2="244" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="68" y="330" font-size="10.5" fill="#6B675C">小消息（几十字节）时：两次 PCIe 读往返 ≫ 串行化时间——延迟大头在「取数」，不在网线</text>

  <!-- B · INLINE -->
  <rect x="48" y="362" width="1144" height="216" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="390" font-size="13" font-weight="700" fill="#4A473F">B · IBV_SEND_INLINE：CPU 把数据拷进 WQE，随 WQE 一起被取走</text>
  <line x1="560" y1="402" x2="560" y2="566" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5,4"/>

  <rect x="68" y="424" width="190" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="163" y="446" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">① memcpy 进 WQE</text>
  <text x="163" y="464" font-size="9.5" fill="#2C4460" text-anchor="middle">len ≤ max_inline_data</text>

  <rect x="300" y="424" width="160" height="52" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="380" y="446" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">② doorbell</text>
  <text x="380" y="464" font-size="9.5" fill="#6B4E28" text-anchor="middle">MMIO 写（posted）</text>

  <line x1="258" y1="450" x2="294" y2="450" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="460" y1="450" x2="634" y2="450" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="640" y="424" width="210" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="745" y="446" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">③ DMA 读 WQE</text>
  <text x="745" y="464" font-size="9.5" fill="#24473F" text-anchor="middle">数据捎带，往返 ×1 即拿齐</text>

  <rect x="640" y="500" width="210" height="40" rx="7" fill="none" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="745" y="524" font-size="10.5" fill="#A64B3C" text-anchor="middle">省去：不再读 buffer，也不查 lkey</text>

  <rect x="920" y="424" width="140" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="990" y="446" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">④ 封包上线</text>

  <line x1="850" y1="450" x2="914" y2="450" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="68" y="524" font-size="10.5" fill="#4A473F">post 返回即刻：buffer 立即可复用（不等 CQE——4.15 的 buffer 账当场销账）</text>
  <text x="68" y="546" font-size="10.5" fill="#6B675C">代价：一次 CPU 拷贝，消息越大越亏；inline 只改数据进网卡的路径，不改变对端看到的任何语义</text>

  <!-- C · postlist -->
  <rect x="48" y="598" width="1144" height="196" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="626" font-size="13" font-weight="700" fill="#4A473F">C · Postlist：一次 ibv_post_send 提交 WR 链表，门铃只敲一次</text>

  <text x="68" y="656" font-size="11" fill="#4A473F">逐条 post：4 次 MMIO</text>
  <rect x="68" y="668" width="110" height="40" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="123" y="692" font-size="10.5" fill="#6B4E28" text-anchor="middle">WR + 门铃</text>
  <rect x="190" y="668" width="110" height="40" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="245" y="692" font-size="10.5" fill="#6B4E28" text-anchor="middle">WR + 门铃</text>
  <rect x="312" y="668" width="110" height="40" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="367" y="692" font-size="10.5" fill="#6B4E28" text-anchor="middle">WR + 门铃</text>
  <rect x="434" y="668" width="110" height="40" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="489" y="692" font-size="10.5" fill="#6B4E28" text-anchor="middle">WR + 门铃</text>

  <text x="640" y="656" font-size="11" fill="#4A473F">postlist：wr1→wr2→wr3→wr4（next 链）</text>
  <rect x="640" y="668" width="90" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="685" y="692" font-size="10.5" fill="#2C4460" text-anchor="middle">wr1</text>
  <rect x="748" y="668" width="90" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="793" y="692" font-size="10.5" fill="#2C4460" text-anchor="middle">wr2</text>
  <rect x="856" y="668" width="90" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="901" y="692" font-size="10.5" fill="#2C4460" text-anchor="middle">wr3</text>
  <rect x="964" y="668" width="90" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1009" y="692" font-size="10.5" fill="#2C4460" text-anchor="middle">wr4</text>
  <line x1="730" y1="688" x2="742" y2="688" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="838" y1="688" x2="850" y2="688" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="946" y1="688" x2="958" y2="688" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="1072" y="668" width="100" height="40" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.6"/>
  <text x="1122" y="692" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">门铃 ×1</text>

  <text x="68" y="740" font-size="10.5" fill="#4A473F">门铃是 uncached MMIO store：每次都要穿过 PCIe，高频小消息下门铃本身成为发送侧热点；postlist 把它摊到 1/N</text>
  <text x="68" y="762" font-size="10.5" fill="#6B675C">代价：驱动在链表最后才敲铃——批内靠前的 WR 多等了「凑批」的时间；延迟敏感路径别手工攒批</text>

  <!-- 底部边界条 -->
  <rect x="48" y="814" width="1144" height="64" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="68" y="840" font-size="11" fill="#6B4E28">边界：max_inline_data 是 ibv_create_qp 的请求值，实际以返回的 cap 为准（设备相关，常见几十到几百字节量级）</text>
  <text x="68" y="862" font-size="11" fill="#6B4E28">inline 是「CPU 拷贝换 PCIe 往返」：交叉点随消息大小移动，用 ib_write_lat 在自己机器上实测（4.9）</text>
</svg>
