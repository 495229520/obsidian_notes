<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 14px; fill: #435363; text-anchor: middle; }
      .small { font-size: 13px; fill: #526475; text-anchor: middle; }
    </style>
  </defs>
  <text x="56" y="54" class="title">Tensor Core 结论需要证据边界</text>
  <text x="56" y="83" class="subtitle">dtype 是前提，不是证据；shape、alignment、architecture、kernel/profiler 共同决定结论强度</text>

  <rect x="80" y="145" width="190" height="150" rx="8" fill="#e8f0f6" stroke="#86a8c4" stroke-width="2"/>
  <text x="175" y="184" class="head">Dtype</text>
  <text x="175" y="224" class="body">FP16 / BF16</text>
  <text x="175" y="250" class="body">TF32 / compute type</text>

  <rect x="330" y="145" width="190" height="150" rx="8" fill="#efe8f6" stroke="#aa92c5" stroke-width="2"/>
  <text x="425" y="184" class="head">Shape</text>
  <text x="425" y="224" class="body">M/N/K</text>
  <text x="425" y="250" class="body">alignment</text>

  <rect x="580" y="145" width="190" height="150" rx="8" fill="#f4ead7" stroke="#c6a661" stroke-width="2"/>
  <text x="675" y="184" class="head">Architecture</text>
  <text x="675" y="224" class="body">GPU capability</text>
  <text x="675" y="250" class="body">library version</text>

  <rect x="830" y="145" width="190" height="150" rx="8" fill="#e7efe3" stroke="#84a96d" stroke-width="2"/>
  <text x="925" y="184" class="head">Evidence</text>
  <text x="925" y="224" class="body">kernel name</text>
  <text x="925" y="250" class="body">profiler / instruction</text>

  <line x1="282" y1="220" x2="316" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="532" y1="220" x2="566" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="782" y1="220" x2="816" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="136" y="395" width="252" height="86" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="262" y="428" class="head">可能使用</text>
  <text x="262" y="456" class="body">满足 dtype / shape 前提</text>

  <rect x="434" y="395" width="252" height="86" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="560" y="428" class="head">很可能使用</text>
  <text x="560" y="456" class="body">kernel / config 指向 TC</text>

  <rect x="732" y="395" width="252" height="86" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="858" y="428" class="head">已确认使用</text>
  <text x="858" y="456" class="body">profiler / instruction 支撑</text>
</svg>
