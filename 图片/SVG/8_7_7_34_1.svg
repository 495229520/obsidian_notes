<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<title>故障模型：先描述行为，再判断是否被发现</title><desc>六行矩阵区分 crash-stop、可靠检测约定、crash-recovery、omission、corruption 和 Byzantine，底部并列显式错误与静默错误。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A64B3C"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6B5E"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5A80"/></marker>
</defs>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">故障模型：先描述行为，再判断是否被发现</text>
<text x="48" y="82" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">节点、链路、持久状态是不同故障对象；同一物理错误可能跨越多个观察边界。</text>
<rect x="48" y="112" width="1144" height="414" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="48" y="112" width="1144" height="42" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="139" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">术语 / 本篇口径</text>
<text x="294" y="139" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">外部表现</text>
<text x="564" y="139" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">依赖的关键约束</text>
<text x="890" y="139" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">不能由此推出</text>
<line x1="48" y1="154" x2="1192" y2="154" stroke="#D8D5C8" stroke-width="1"/>
<text x="64" y="179" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">Crash-stop</text>
<text x="64" y="201" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">停止后不再恢复</text>
<text x="294" y="179" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">不再产生新动作</text>
<text x="294" y="201" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">已发消息仍可到达</text>
<text x="564" y="179" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">停止前遵守算法</text>
<text x="564" y="201" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">模型中不再重入</text>
<text x="890" y="179" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">远端立即知道它已死</text>
<text x="890" y="201" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">心跳正常即数据正确</text>
<rect x="49" y="216" width="1142" height="62" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<line x1="48" y1="216" x2="1192" y2="216" stroke="#D8D5C8" stroke-width="1"/>
<text x="64" y="241" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">Fail-stop + 可靠检测</text>
<text x="64" y="263" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">本篇显式加强的约定</text>
<text x="294" y="241" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">停止且故障可被识别</text>
<text x="294" y="263" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">不从术语偷带假设</text>
<text x="564" y="241" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">必须说明检测能力</text>
<text x="564" y="263" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">资料命名可能不同</text>
<text x="890" y="241" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">一次超时证明进程崩溃</text>
<text x="890" y="263" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">SIGKILL 自带远端通知</text>
<line x1="48" y1="278" x2="1192" y2="278" stroke="#D8D5C8" stroke-width="1"/>
<text x="64" y="303" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">Crash-recovery</text>
<text x="64" y="325" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">允许崩溃后恢复</text>
<text x="294" y="303" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">易失内存可以丢失</text>
<text x="294" y="325" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">随后重新执行</text>
<text x="564" y="303" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">稳定存储保留承诺</text>
<text x="564" y="325" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">身份 / 任期 / 投票有效</text>
<text x="890" y="303" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">已 ACK 日志可随意消失</text>
<text x="890" y="325" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">清空状态后直接重入</text>
<rect x="49" y="340" width="1142" height="62" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<line x1="48" y1="340" x2="1192" y2="340" stroke="#D8D5C8" stroke-width="1"/>
<text x="64" y="365" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">Omission</text>
<text x="64" y="387" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">动作或消息遗漏</text>
<text x="294" y="365" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">请求 / 响应没有到达</text>
<text x="294" y="387" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">也可能只发生在单方向</text>
<text x="564" y="365" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">边界与重试语义明确</text>
<text x="564" y="387" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">超时不是失败原因证明</text>
<text x="890" y="365" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">操作从未执行</text>
<text x="890" y="387" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">节点一定永久宕机</text>
<line x1="48" y1="402" x2="1192" y2="402" stroke="#D8D5C8" stroke-width="1"/>
<text x="64" y="427" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">Corruption</text>
<text x="64" y="449" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">字节或状态不符合契约</text>
<text x="294" y="427" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">错值、错址、旧版本</text>
<text x="294" y="449" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">节点可能仍返回成功</text>
<text x="564" y="427" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">说明任意性的范围</text>
<text x="564" y="449" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">校验器与期望值是否可信</text>
<text x="890" y="427" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">就是整节点任意作恶</text>
<text x="890" y="449" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">更多副本自动知道真值</text>
<rect x="49" y="464" width="1142" height="62" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<line x1="48" y1="464" x2="1192" y2="464" stroke="#D8D5C8" stroke-width="1"/>
<text x="64" y="489" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">Byzantine</text>
<text x="64" y="511" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">任意偏离协议</text>
<text x="294" y="489" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">虚假 ACK / 矛盾回复</text>
<text x="294" y="511" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">也允许选择性沉默</text>
<text x="564" y="489" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">认证与正确节点界限</text>
<text x="564" y="511" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">正确节点仍须遵守协议</text>
<text x="890" y="489" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">必须出于恶意</text>
<text x="890" y="511" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">所有副本同时坏仍可保全</text>
<line x1="278" y1="112" x2="278" y2="526" stroke="#D8D5C8" stroke-width="1"/>
<line x1="548" y1="112" x2="548" y2="526" stroke="#D8D5C8" stroke-width="1"/>
<line x1="874" y1="112" x2="874" y2="526" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="558" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">另一个轴：当前观察边界上，有没有错误信号？</text>
<rect x="48" y="576" width="552" height="55" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="324.0" y="608.6" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">显式错误：EIO / checksum mismatch</text>
<rect x="640" y="576" width="552" height="55" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="916.0" y="608.6" font-size="15" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">SDC：错误字节被当成成功结果使用</text>
<line x1="48" y1="643" x2="1192" y2="643" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="671" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">SDC 不是故障模型的“最后一级”；检测可以把局部坏数据转成不可用，但不能自动获得完整 BFT。</text>
</svg>