<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460">
  <rect x="0" y="0" width="940" height="460" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>伪共享 false sharing</title>
  <desc>变量 a、b 落在同一条 cache line，两个核心分别频繁写各自变量，导致缓存行在两核间反复失效与重载。</desc>

  <text x="470" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    伪共享（false sharing）
  </text>
  <text x="470" y="54" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">
    不同变量落在同一条 cache line，跨核写操作互相使缓存失效，缓存行来回弹跳
  </text>

  <rect x="80" y="100" width="300" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="230" y="124" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">核心 1</text>
  <text x="230" y="146" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">频繁写变量 a</text>

  <rect x="560" y="100" width="300" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="710" y="124" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">核心 2</text>
  <text x="710" y="146" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">频繁写变量 b</text>

  <!-- ping-pong -->
  <path d="M380 125 L560 125" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560 150 L380 150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="110" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#5F5E5A">缓存行来回失效 / 重载</text>

  <!-- cache line 容器（path） -->
  <path d="M328 235 H612 A8 8 0 0 1 620 243 V283 A8 8 0 0 1 612 291 H328 A8 8 0 0 1 320 283 V243 A8 8 0 0 1 328 235 Z"
        fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="470" y1="235" x2="470" y2="291" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="395" y="263" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#5F5E5A">变量 a</text>
  <text x="545" y="263" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#5F5E5A">变量 b</text>
  <text x="470" y="312" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">同一条 cache line（64 字节）</text>

  <path d="M260 170 L400 235" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M680 170 L540 235" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="360" width="400" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="470" y="380" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">解决：alignas(64) 或 padding</text>
  <text x="470" y="402" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#085041">让 a、b 各自独占一条 cache line</text>
</svg>
