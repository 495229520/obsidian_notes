<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 852" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>IPv4 首部：20 字节里装了什么</title>
  <desc>上半部分是 IPv4 首部的 32 位对齐位图，按字节偏移分六行，用颜色区分路由器每跳会改的字段、分片三件套和地址字段；下半部分用一次 ping 的实际抓包值逐字段对照。</desc>

  <rect x="0" y="0" width="1240" height="852" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">IPv4 首部：固定 20 字节，转发路上只有两个字段会变</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">判断准则：一行是 32 位；IHL 说首部多长，Total Length 说整个数据报多长，两者单位不同</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="428" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F" dominant-baseline="central">A · 首部位图（每行 32 位，左侧是字节偏移）</text>

  <!-- 位标尺 -->
  <text x="136" y="164" font-size="10" fill="#6B675C" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="392" y="164" font-size="10" fill="#6B675C" text-anchor="middle" dominant-baseline="central">8</text>
  <text x="648" y="164" font-size="10" fill="#6B675C" text-anchor="middle" dominant-baseline="central">16</text>
  <text x="904" y="164" font-size="10" fill="#6B675C" text-anchor="middle" dominant-baseline="central">24</text>
  <text x="1128" y="164" font-size="10" fill="#6B675C" text-anchor="middle" dominant-baseline="central">31</text>
  <line x1="120" y1="174" x2="1144" y2="174" stroke="#D8D5C8" stroke-width="1"/>

  <!-- 第 1 行：偏移 0 -->
  <text x="96" y="200" font-size="10.5" fill="#6B675C" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="120" y="178" width="128" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="184" y="195" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">Version</text>
  <text x="184" y="211" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">4 位 · 填 4</text>
  <rect x="248" y="178" width="128" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="312" y="195" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">IHL</text>
  <text x="312" y="211" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">4 位 · 单位 4 字节</text>
  <rect x="376" y="178" width="192" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="472" y="195" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">DSCP</text>
  <text x="472" y="211" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">6 位 · 优先级</text>
  <rect x="568" y="178" width="64" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="600" y="195" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">ECN</text>
  <text x="600" y="211" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">2 位</text>
  <rect x="632" y="178" width="512" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="888" y="195" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">Total Length</text>
  <text x="888" y="211" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">16 位 · 首部加负载，单位 1 字节，上限 65535</text>

  <!-- 第 2 行：偏移 4 -->
  <text x="96" y="244" font-size="10.5" fill="#6B675C" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="120" y="222" width="512" height="44" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="376" y="239" font-size="11.5" font-weight="700" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">Identification</text>
  <text x="376" y="255" font-size="10" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">16 位 · 同一原始数据报的所有分片填同一个值</text>
  <rect x="632" y="222" width="96" height="44" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="680" y="239" font-size="11" font-weight="700" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">Flags</text>
  <text x="680" y="255" font-size="10" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">DF / MF</text>
  <rect x="728" y="222" width="416" height="44" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="936" y="239" font-size="11.5" font-weight="700" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">Fragment Offset</text>
  <text x="936" y="255" font-size="10" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">13 位 · 单位 8 字节</text>

  <!-- 第 3 行：偏移 8 -->
  <text x="96" y="288" font-size="10.5" fill="#6B675C" text-anchor="middle" dominant-baseline="central">8</text>
  <rect x="120" y="266" width="256" height="44" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="248" y="283" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle" dominant-baseline="central">TTL</text>
  <text x="248" y="299" font-size="10" fill="#6B4E28" text-anchor="middle" dominant-baseline="central">8 位 · 每跳减 1，减到 0 丢包</text>
  <rect x="376" y="266" width="256" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="504" y="283" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">Protocol</text>
  <text x="504" y="299" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">8 位 · 1 ICMP，6 TCP，17 UDP</text>
  <rect x="632" y="266" width="512" height="44" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="888" y="283" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle" dominant-baseline="central">Header Checksum</text>
  <text x="888" y="299" font-size="10" fill="#6B4E28" text-anchor="middle" dominant-baseline="central">16 位 · 只覆盖首部，不覆盖负载；TTL 一变就要重算</text>

  <!-- 第 4 行：偏移 12 -->
  <text x="96" y="332" font-size="10.5" fill="#6B675C" text-anchor="middle" dominant-baseline="central">12</text>
  <rect x="120" y="310" width="1024" height="44" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="632" y="332" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle" dominant-baseline="central">Source Address（32 位，端到端不变）</text>

  <!-- 第 5 行：偏移 16 -->
  <text x="96" y="376" font-size="10.5" fill="#6B675C" text-anchor="middle" dominant-baseline="central">16</text>
  <rect x="120" y="354" width="1024" height="44" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="632" y="376" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle" dominant-baseline="central">Destination Address（32 位，端到端不变）</text>

  <!-- 第 6 行：可选 -->
  <text x="96" y="420" font-size="10.5" fill="#6B675C" text-anchor="middle" dominant-baseline="central">20</text>
  <rect x="120" y="398" width="1024" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="632" y="418" font-size="11.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">Options + Padding（可选，只有 IHL 大于 5 时才存在，实际网络里极少见）</text>

  <!-- 图例 -->
  <rect x="120" y="458" width="18" height="14" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="146" y="465" font-size="11" fill="#4A473F" dominant-baseline="central">路由器每跳都改</text>
  <rect x="290" y="458" width="18" height="14" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="316" y="465" font-size="11" fill="#4A473F" dominant-baseline="central">分片三件套</text>
  <rect x="440" y="458" width="18" height="14" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="466" y="465" font-size="11" fill="#4A473F" dominant-baseline="central">端到端不变</text>
  <rect x="590" y="458" width="18" height="14" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="616" y="465" font-size="11" fill="#4A473F" dominant-baseline="central">源主机填好就不动</text>

  <text x="120" y="500" font-size="11.5" fill="#6B675C" dominant-baseline="central">首字节 0x45 = 版本 4 + IHL 5，也就是首部 5 × 4 = 20 字节</text>

  <!-- ================= Panel B ================= -->
  <rect x="48" y="552" width="1144" height="242" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="580" font-size="15" font-weight="700" fill="#4A473F" dominant-baseline="central">B · 一次 ping 抓到的真实取值（tcpdump -v）</text>

  <rect x="72" y="600" width="240" height="32" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="312" y="600" width="180" height="32" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="492" y="600" width="676" height="32" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="616" font-size="11.5" font-weight="700" fill="#4A473F" dominant-baseline="central">字段</text>
  <text x="328" y="616" font-size="11.5" font-weight="700" fill="#4A473F" dominant-baseline="central">抓到的值</text>
  <text x="508" y="616" font-size="11.5" font-weight="700" fill="#4A473F" dominant-baseline="central">怎么读</text>

  <rect x="72" y="632" width="240" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="312" y="632" width="180" height="32" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="492" y="632" width="676" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="648" font-size="11.5" fill="#4A473F" dominant-baseline="central">Version + IHL</text>
  <text x="328" y="648" font-size="11.5" fill="#2C4460" dominant-baseline="central">0x45</text>
  <text x="508" y="648" font-size="11.5" fill="#4A473F" dominant-baseline="central">版本 4，首部 20 字节，没带 Options</text>

  <rect x="72" y="664" width="240" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="312" y="664" width="180" height="32" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="492" y="664" width="676" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="680" font-size="11.5" fill="#4A473F" dominant-baseline="central">Total Length</text>
  <text x="328" y="680" font-size="11.5" fill="#2C4460" dominant-baseline="central">84</text>
  <text x="508" y="680" font-size="11.5" fill="#4A473F" dominant-baseline="central">20 首部 + 8 ICMP 首部 + 56 默认负载 = 84 字节</text>

  <rect x="72" y="696" width="240" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="312" y="696" width="180" height="32" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="492" y="696" width="676" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="712" font-size="11.5" fill="#4A473F" dominant-baseline="central">Flags</text>
  <text x="328" y="712" font-size="11.5" fill="#6B5B95" dominant-baseline="central">DF 置位</text>
  <text x="508" y="712" font-size="11.5" fill="#4A473F" dominant-baseline="central">禁止沿途分片；配合它才能做路径 MTU 发现</text>

  <rect x="72" y="728" width="240" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="312" y="728" width="180" height="32" fill="#EFE7DA" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="492" y="728" width="676" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="744" font-size="11.5" fill="#4A473F" dominant-baseline="central">TTL</text>
  <text x="328" y="744" font-size="11.5" fill="#6B4E28" dominant-baseline="central">64</text>
  <text x="508" y="744" font-size="11.5" fill="#4A473F" dominant-baseline="central">Linux 出发初值；对端回包的 TTL 能反推中间跳数</text>

  <text x="72" y="776" font-size="11" fill="#6B675C" dominant-baseline="central">Protocol = 1 说明载荷交给 ICMP；改成 6 交 TCP，17 交 UDP，这就是网络层的协议分用</text>

  <text x="48" y="826" font-size="11.5" fill="#6B675C" dominant-baseline="central">口径：字段宽度依 RFC 791；DSCP 与 ECN 是 RFC 2474 / 3168 对原 TOS 字节的重新划分；抓包值取自 Linux 上的 ping -c 1</text>
</svg>
