<svg xmlns="http://www.w3.org/2000/svg" width="960" height="704" viewBox="0 0 960 704" role="img" aria-labelledby="t3 d3">
  <title id="t3">LeetCode 523 哈希表记录余数位置的执行过程</title>
  <desc id="d3">nums=[23,2,4], k=6 的逐步执行：mp 记录每个余数第一次出现的下标，初始化 mp[0]=-1，命中相同余数且间隔≥2 时返回 true。</desc>
  <rect width="960" height="704" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;}
      text:not([text-anchor]){text-anchor:middle;}
      .t-title{font-size:21px;font-weight:700;}
      .t-sub{font-size:13px;}
      .t-head{font-size:13px;font-weight:700;}
      .t-cell{font-size:14px;}
      .t-mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;}
      .t-pt{font-size:14px;font-weight:700;}
      .t-pb{font-size:13px;}
    </style>
  </defs>

  <text class="t-title" x="40" y="44" fill="#444441" dominant-baseline="central" text-anchor="start">哈希表执行过程：记录每个余数“第一次”出现的位置</text>
  <text class="t-sub" x="40" y="72" fill="#5F5E5A" dominant-baseline="central" text-anchor="start">nums = [23, 2, 4]，k = 6；mp: 余数 → 最早下标，初始化 mp[0] = −1（琥珀色行 = 命中）</text>

  <!-- 表头 -->
  <path d="M40 110 h64 v40 h-64 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-head" x="72" y="130" fill="#444441" dominant-baseline="central">i</text>
  <path d="M112 110 h92 v40 h-92 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-head" x="158" y="130" fill="#444441" dominant-baseline="central">nums[i]</text>
  <path d="M212 110 h92 v40 h-92 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-head" x="258" y="130" fill="#444441" dominant-baseline="central">sum</text>
  <path d="M312 110 h120 v40 h-120 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-head" x="372" y="130" fill="#444441" dominant-baseline="central">r = sum%6</text>
  <path d="M440 110 h256 v40 h-256 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-head" x="568" y="130" fill="#444441" dominant-baseline="central">动作</text>
  <path d="M704 110 h232 v40 h-232 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-head" x="820" y="130" fill="#444441" dominant-baseline="central">mp 状态（执行后）</text>

  <!-- init 行 -->
  <path d="M40 158 h64 v64 h-64 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="72" y="190" fill="#444441" dominant-baseline="central">—</text>
  <path d="M112 158 h92 v64 h-92 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="158" y="190" fill="#0C447C" dominant-baseline="central">—</text>
  <path d="M212 158 h92 v64 h-92 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="258" y="190" fill="#0C447C" dominant-baseline="central">0</text>
  <path d="M312 158 h120 v64 h-120 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="t-cell" x="372" y="190" fill="#085041" dominant-baseline="central">0</text>
  <path d="M440 158 h256 v64 h-256 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="568" y="190" fill="#444441" dominant-baseline="central">初始化哨兵 mp[0] = −1</text>
  <path d="M704 158 h232 v64 h-232 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="t-mono" x="820" y="190" fill="#3C3489" dominant-baseline="central">{ 0: −1 }</text>

  <!-- i=0 行 -->
  <path d="M40 230 h64 v64 h-64 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="72" y="262" fill="#444441" dominant-baseline="central">0</text>
  <path d="M112 230 h92 v64 h-92 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="158" y="262" fill="#0C447C" dominant-baseline="central">23</text>
  <path d="M212 230 h92 v64 h-92 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="258" y="262" fill="#0C447C" dominant-baseline="central">23</text>
  <path d="M312 230 h120 v64 h-120 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="t-cell" x="372" y="262" fill="#085041" dominant-baseline="central">5</text>
  <path d="M440 230 h256 v64 h-256 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="568" y="262" fill="#444441" dominant-baseline="central">5 不在 mp → 插入 mp[5] = 0</text>
  <path d="M704 230 h232 v64 h-232 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="t-mono" x="820" y="262" fill="#3C3489" dominant-baseline="central">{ 0:−1, 5:0 }</text>

  <!-- i=1 行 -->
  <path d="M40 302 h64 v64 h-64 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="72" y="334" fill="#444441" dominant-baseline="central">1</text>
  <path d="M112 302 h92 v64 h-92 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="158" y="334" fill="#0C447C" dominant-baseline="central">2</text>
  <path d="M212 302 h92 v64 h-92 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="258" y="334" fill="#0C447C" dominant-baseline="central">25</text>
  <path d="M312 302 h120 v64 h-120 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="t-cell" x="372" y="334" fill="#085041" dominant-baseline="central">1</text>
  <path d="M440 302 h256 v64 h-256 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="568" y="334" fill="#444441" dominant-baseline="central">1 不在 mp → 插入 mp[1] = 1</text>
  <path d="M704 302 h232 v64 h-232 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="t-mono" x="820" y="334" fill="#3C3489" dominant-baseline="central">{ 0:−1, 5:0, 1:1 }</text>

  <!-- i=2 行（命中，高亮） -->
  <path d="M40 374 h64 v64 h-64 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="t-cell" x="72" y="406" fill="#444441" dominant-baseline="central">2</text>
  <path d="M112 374 h92 v64 h-92 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="158" y="406" fill="#0C447C" dominant-baseline="central">4</text>
  <path d="M212 374 h92 v64 h-92 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="t-cell" x="258" y="406" fill="#0C447C" dominant-baseline="central">29</text>
  <path d="M312 374 h120 v64 h-120 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="t-cell" x="372" y="406" fill="#633806" dominant-baseline="central">5</text>
  <path d="M440 374 h256 v64 h-256 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="t-cell" x="568" y="398" fill="#633806" dominant-baseline="central">5 已存在，mp[5] = 0（与 i=0 同余）</text>
  <text class="t-cell" x="568" y="418" fill="#633806" dominant-baseline="central">i − mp[5] = 2 − 0 = 2 ≥ 2 → 命中</text>
  <path d="M704 374 h232 v64 h-232 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="t-cell" x="820" y="406" fill="#633806" dominant-baseline="central">return true（不覆盖）</text>

  <!-- 说明面板 A：为什么 mp[0]=-1 -->
  <path d="M50 470 L470 470 Q480 470 480 480 L480 590 Q480 600 470 600 L50 600 Q40 600 40 590 L40 480 Q40 470 50 470 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="t-pt" x="60" y="494" fill="#633806" dominant-baseline="central" text-anchor="start">为什么 mp[0] = −1 ？</text>
  <text class="t-pb" x="60" y="518" fill="#633806" dominant-baseline="central" text-anchor="start">余数 0 表示前缀和本身就是 k 的倍数。</text>
  <text class="t-pb" x="60" y="540" fill="#633806" dominant-baseline="central" text-anchor="start">“空前缀”和为 0、余数 0，视作落在下标 −1。</text>
  <text class="t-pb" x="60" y="562" fill="#633806" dominant-baseline="central" text-anchor="start">于是 sum%k=0 时 i−(−1)=i+1 即 [0, i] 的长度，</text>
  <text class="t-pb" x="60" y="584" fill="#633806" dominant-baseline="central" text-anchor="start">整段就是倍数的情形被自然覆盖，无需特判。</text>

  <!-- 说明面板 B：为什么只记第一次 -->
  <path d="M500 470 L910 470 Q920 470 920 480 L920 590 Q920 600 910 600 L510 600 Q500 600 500 590 L500 480 Q500 470 510 470 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="t-pt" x="520" y="494" fill="#085041" dominant-baseline="central" text-anchor="start">为什么只记“第一次”出现？</text>
  <text class="t-pb" x="520" y="518" fill="#085041" dominant-baseline="central" text-anchor="start">对当前 j，要让长度 j − i ≥ 2 最易成立，</text>
  <text class="t-pb" x="520" y="540" fill="#085041" dominant-baseline="central" text-anchor="start">应让配对的 i 尽量小（间隔最大）。</text>
  <text class="t-pb" x="520" y="562" fill="#085041" dominant-baseline="central" text-anchor="start">最早的下标都不满足，更晚的更不行。</text>
  <text class="t-pb" x="520" y="584" fill="#085041" dominant-baseline="central" text-anchor="start">故余数已存在时不覆盖（只在 else 插入）。</text>

  <text class="t-sub" x="40" y="644" fill="#5F5E5A" dominant-baseline="central" text-anchor="start">时间 O(n)、空间 O(min(n, k))：每个余数至多记一次，哈希表大小不超过 k。</text>
</svg>
