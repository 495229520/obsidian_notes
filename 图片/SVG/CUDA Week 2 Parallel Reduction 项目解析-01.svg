<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc">
  <title id="title">Week 2 CUDA Reduction 学习闭环</title>
  <desc id="desc">从 Week 1 的 vector add 过渡到 naive reduce、shared memory、warp shuffle，再进入 benchmark 和 profiling。</desc>
  <rect x="0" y="0" width="1160" height="380" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="580" y="36" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" font-weight="500" fill="#0C447C">Week 2：从能写 kernel 到能解释性能</text>
  <text x="580" y="62" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">parallel reduction 把线程协作、内存层级、benchmark 和 profiling 串成一个闭环</text>

  <rect x="40" y="112" width="150" height="72" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="115" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">Week 1 基础</text>
  <text x="115" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">vector add</text>

  <line x1="190" y1="148" x2="250" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="112" width="150" height="72" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="325" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">Naive reduce</text>
  <text x="325" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">建立低效 baseline</text>

  <line x1="400" y1="148" x2="460" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="460" y="112" width="150" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="535" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">Shared memory</text>
  <text x="535" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">block 内树形归约</text>

  <line x1="610" y1="148" x2="670" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="670" y="112" width="150" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="745" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">Warp shuffle</text>
  <text x="745" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">寄存器级 lane 通信</text>

  <line x1="820" y1="148" x2="880" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="880" y="112" width="230" height="72" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="995" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">Benchmark + Profiling</text>
  <text x="995" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">avg/min/max + Nsight 证据</text>

  <line x1="995" y1="184" x2="995" y2="250" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="250" width="620" height="82" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="580" y="276" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441">最终收获：用性能证据解释实现选择</text>
  <text x="580" y="304" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">线程协作 · 内存层级 · 正确性测试 · Nsight 指标</text>
</svg>
