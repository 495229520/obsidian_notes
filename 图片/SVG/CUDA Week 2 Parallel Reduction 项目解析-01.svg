<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" role="img" aria-labelledby="title desc">
  <title id="title">Week 2 CUDA Reduction 学习闭环</title>
  <desc id="desc">从 Week 1 的 vector add 过渡到 naive reduce、shared memory、warp shuffle，再进入 benchmark 和 profiling，形成性能解释闭环。</desc>
  <rect x="0" y="0" width="1160" height="400" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="580" y="36" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#0C447C">Week 2：从能写 kernel 到能解释性能</text>
  <text x="580" y="62" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#444441">parallel reduction 把线程协作、内存层级、benchmark 和 profiling 串成一个闭环</text>

  <!-- Stage 1: Week 1 base -->
  <rect x="40" y="112" width="150" height="78" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <circle cx="62" cy="132" r="11" fill="#185FA5"/>
  <text x="62" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
  <text x="115" y="146" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#0C447C">Week 1 基础</text>
  <text x="115" y="170" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">vector add</text>

  <line x1="190" y1="151" x2="252" y2="151" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Stage 2: Naive -->
  <rect x="252" y="112" width="150" height="78" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.3"/>
  <circle cx="274" cy="132" r="11" fill="#854F0B"/>
  <text x="274" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
  <text x="327" y="146" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#633806">Naive reduce</text>
  <text x="327" y="170" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">建立低效 baseline</text>

  <line x1="402" y1="151" x2="464" y2="151" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Stage 3: Shared memory -->
  <rect x="464" y="112" width="150" height="78" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <circle cx="486" cy="132" r="11" fill="#0F6E56"/>
  <text x="486" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
  <text x="539" y="146" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#085041">Shared memory</text>
  <text x="539" y="170" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">block 内树形归约</text>

  <line x1="614" y1="151" x2="676" y2="151" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Stage 4: Warp shuffle -->
  <rect x="676" y="112" width="150" height="78" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
  <circle cx="698" cy="132" r="11" fill="#534AB7"/>
  <text x="698" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
  <text x="751" y="146" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#3C3489">Warp shuffle</text>
  <text x="751" y="170" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">寄存器级 lane 通信</text>

  <line x1="826" y1="151" x2="888" y2="151" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Stage 5: Benchmark + Profiling -->
  <rect x="888" y="112" width="232" height="78" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <circle cx="910" cy="132" r="11" fill="#185FA5"/>
  <text x="910" y="133" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
  <text x="1007" y="146" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#0C447C">Benchmark + Profiling</text>
  <text x="1007" y="170" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">avg/min/max + Nsight 证据</text>

  <!-- converge to outcome -->
  <path d="M1004 190 V232 Q1004 240 996 240 H588 Q580 240 580 248 V262" fill="none" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="270" y="262" width="620" height="86" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
  <text x="580" y="290" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#444441">最终收获：用性能证据解释实现选择</text>
  <text x="580" y="318" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">线程协作 · 内存层级 · 正确性测试 · Nsight 指标</text>
</svg>
