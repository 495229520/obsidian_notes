<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .th { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #1f2937; }
      .td { font-size: 13px; text-anchor: middle; dominant-baseline: middle; fill: #334155; }
      .left { text-anchor: start; }
      .note { font-size: 14px; fill: #435363; }
      .strong { font-size: 14px; font-weight: 700; fill: #334155; }
    </style>
  </defs>

  <text x="56" y="54" class="title">custom kernels 与 cuBLAS SGEMM 成对记录</text>
  <text x="56" y="83" class="subtitle">ratio_vs_cublas = custom_time_ms / cublas_time_ms，先保证 correct，再比较 TFLOPS</text>

  <rect x="64" y="126" width="992" height="300" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="64" y="126" width="992" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>

  <line x1="224" y1="126" x2="224" y2="426" stroke="#cbd5e1"/>
  <line x1="316" y1="126" x2="316" y2="426" stroke="#cbd5e1"/>
  <line x1="408" y1="126" x2="408" y2="426" stroke="#cbd5e1"/>
  <line x1="500" y1="126" x2="500" y2="426" stroke="#cbd5e1"/>
  <line x1="608" y1="126" x2="608" y2="426" stroke="#cbd5e1"/>
  <line x1="740" y1="126" x2="740" y2="426" stroke="#cbd5e1"/>
  <line x1="840" y1="126" x2="840" y2="426" stroke="#cbd5e1"/>
  <line x1="942" y1="126" x2="942" y2="426" stroke="#cbd5e1"/>

  <line x1="64" y1="172" x2="1056" y2="172" stroke="#94a3b8"/>
  <line x1="64" y1="223" x2="1056" y2="223" stroke="#cbd5e1"/>
  <line x1="64" y1="274" x2="1056" y2="274" stroke="#cbd5e1"/>
  <line x1="64" y1="325" x2="1056" y2="325" stroke="#cbd5e1"/>
  <line x1="64" y1="376" x2="1056" y2="376" stroke="#cbd5e1"/>

  <text x="144" y="149" class="th">implementation</text>
  <text x="270" y="149" class="th">M</text>
  <text x="362" y="149" class="th">N</text>
  <text x="454" y="149" class="th">K</text>
  <text x="554" y="149" class="th">dtype</text>
  <text x="674" y="149" class="th">layout</text>
  <text x="790" y="149" class="th">time_ms</text>
  <text x="891" y="149" class="th">TFLOPS</text>
  <text x="999" y="149" class="th">ratio</text>

  <text x="86" y="198" class="td left">naive CUDA</text>
  <text x="270" y="198" class="td">1024</text>
  <text x="362" y="198" class="td">1024</text>
  <text x="454" y="198" class="td">1024</text>
  <text x="554" y="198" class="td">FP32</text>
  <text x="674" y="198" class="td">row-major</text>
  <text x="790" y="198" class="td">TBD</text>
  <text x="891" y="198" class="td">TBD</text>
  <text x="999" y="198" class="td">TBD</text>

  <text x="86" y="249" class="td left">tiled CUDA</text>
  <text x="270" y="249" class="td">1024</text>
  <text x="362" y="249" class="td">1024</text>
  <text x="454" y="249" class="td">1024</text>
  <text x="554" y="249" class="td">FP32</text>
  <text x="674" y="249" class="td">row-major</text>
  <text x="790" y="249" class="td">TBD</text>
  <text x="891" y="249" class="td">TBD</text>
  <text x="999" y="249" class="td">TBD</text>

  <text x="86" y="300" class="td left">register blocking v1</text>
  <text x="270" y="300" class="td">1024</text>
  <text x="362" y="300" class="td">1024</text>
  <text x="454" y="300" class="td">1024</text>
  <text x="554" y="300" class="td">FP32</text>
  <text x="674" y="300" class="td">row-major</text>
  <text x="790" y="300" class="td">TBD</text>
  <text x="891" y="300" class="td">TBD</text>
  <text x="999" y="300" class="td">TBD</text>

  <rect x="64" y="325" width="992" height="51" fill="#e7efe3" opacity="0.65"/>
  <text x="86" y="351" class="td left">cuBLAS SGEMM</text>
  <text x="270" y="351" class="td">1024</text>
  <text x="362" y="351" class="td">1024</text>
  <text x="454" y="351" class="td">1024</text>
  <text x="554" y="351" class="td">FP32</text>
  <text x="674" y="351" class="td">wrapper</text>
  <text x="790" y="351" class="td">TBD</text>
  <text x="891" y="351" class="td">TBD</text>
  <text x="999" y="351" class="td">1.00</text>

  <text x="86" y="402" class="td left">same shape group</text>
  <text x="270" y="402" class="td">...</text>
  <text x="362" y="402" class="td">...</text>
  <text x="454" y="402" class="td">...</text>
  <text x="554" y="402" class="td">...</text>
  <text x="674" y="402" class="td">...</text>
  <text x="790" y="402" class="td">...</text>
  <text x="891" y="402" class="td">...</text>
  <text x="999" y="402" class="td">...</text>

  <rect x="188" y="470" width="744" height="50" rx="8" fill="#fffaf0" stroke="#d7c083"/>
  <text x="228" y="501" class="strong">规则：</text>
  <text x="276" y="501" class="note">同一组 M/N/K 下 custom kernel 与 cuBLAS 相邻记录，方便直接解释差距。</text>
</svg>
