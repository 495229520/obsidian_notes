<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Prefix 匹配与淘汰：哈希链与 radix 树</title>
  <desc>A 区展示块键的哈希链构造（环境指纹与全部历史进键）；B 区展示 radix 树上的前缀匹配路径、未命中断点与叶子优先淘汰；C 区对照 LRU 与成本感知计价。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">Prefix 匹配与淘汰：哈希链把前缀变成键，radix 树把淘汰变成剪枝</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">块的键必须编码它的全部历史与计算环境；淘汰从叶子剪起，按「省下的重算」计价，而不是按「最近没用」</text>

  <!-- ============ A · 哈希链 ============ -->
  <text x="64" y="134" font-size="14" font-weight="700" fill="#2B2A26">A · 块键的构造：哈希链 —— 任何一块的键都编码它的全部历史</text>

  <rect x="64" y="199" width="200" height="64" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="164" y="224" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">环境指纹 fp</text>
  <text x="164" y="242" font-size="10" fill="#6B4E28" text-anchor="middle">模型/权重版本 · 量化 · tokenizer</text>
  <text x="164" y="256" font-size="10" fill="#6B4E28" text-anchor="middle">并行切分布局</text>

  <rect x="330" y="158" width="240" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="450" y="183" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">chunk₀ · system prompt</text>
  <rect x="620" y="158" width="240" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="740" y="183" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">chunk₁ · 会话轮 1</text>
  <rect x="910" y="158" width="240" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="1030" y="183" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">chunk₂ · 会话轮 2</text>

  <rect x="330" y="216" width="240" height="32" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="450" y="237" font-size="11.5" fill="#4A473F" text-anchor="middle">h₀ = H(fp, chunk₀)</text>
  <rect x="620" y="216" width="240" height="32" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="740" y="237" font-size="11.5" fill="#4A473F" text-anchor="middle">h₁ = H(h₀, chunk₁)</text>
  <rect x="910" y="216" width="240" height="32" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1030" y="237" font-size="11.5" fill="#4A473F" text-anchor="middle">h₂ = H(h₁, chunk₂)</text>

  <line x1="450" y1="198" x2="450" y2="212" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="740" y1="198" x2="740" y2="212" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1030" y1="198" x2="1030" y2="212" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="264" y1="231" x2="326" y2="232" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="232" x2="616" y2="232" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="860" y1="232" x2="906" y2="232" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="64" y="286" font-size="11.5" fill="#6B675C">改动前面任何一个 token、或升级模型/量化，后面所有块的键全部改变 —— 注意力让第 i 块的 KV 依赖全部前文，键必须如实编码这一点</text>

  <!-- ============ B · radix 树 ============ -->
  <text x="64" y="330" font-size="14" font-weight="700" fill="#2B2A26">B · 匹配与淘汰同在一棵 radix 树上：命中沿路径走，淘汰从叶子剪</text>

  <rect x="240" y="352" width="250" height="56" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="365" y="375" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">system prompt（root）</text>
  <text x="365" y="393" font-size="10.5" fill="#24473F" text-anchor="middle">3 条会话的公共前缀 · 命中 ①</text>

  <text x="520" y="370" font-size="10.5" fill="#733428">LRU 盲区：最近未被「整段」访问，</text>
  <text x="520" y="386" font-size="10.5" fill="#733428">但淘汰它 = 三条会话同时重算，代价最大</text>

  <rect x="70" y="466" width="200" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="170" y="488" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">会话 A · 轮 1</text>
  <text x="170" y="504" font-size="10.5" fill="#24473F" text-anchor="middle">命中 ②</text>

  <rect x="310" y="466" width="200" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="410" y="488" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">会话 B · 轮 1</text>
  <text x="410" y="504" font-size="10.5" fill="#2C4460" text-anchor="middle">Ready</text>

  <rect x="550" y="466" width="200" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="650" y="488" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">会话 C · 轮 1</text>
  <text x="650" y="504" font-size="10.5" fill="#2C4460" text-anchor="middle">Ready</text>

  <line x1="330" y1="408" x2="180" y2="462" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrg)"/>
  <line x1="365" y1="408" x2="405" y2="462" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="400" y1="408" x2="640" y2="462" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="70" y="576" width="220" height="56" rx="7" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="180" y="598" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">会话 A · 轮 2 ？</text>
  <text x="180" y="616" font-size="10.5" fill="#733428" text-anchor="middle">未命中 → 断点：增量 prefill 只算这段</text>

  <rect x="330" y="576" width="200" height="56" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="430" y="598" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">会话 B · 轮 2</text>
  <text x="430" y="616" font-size="10.5" fill="#6B4E28" text-anchor="middle">decode 正在读 · refcount=1 禁逐出</text>

  <rect x="570" y="576" width="200" height="56" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="670" y="598" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">会话 C · 轮 2</text>
  <text x="670" y="616" font-size="10.5" fill="#4A473F" text-anchor="middle">3 小时未用 · 叶子</text>
  <text x="782" y="590" font-size="12" font-weight="700" fill="#A64B3C">✗ 先剪它</text>

  <line x1="170" y1="518" x2="178" y2="572" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrr)"/>
  <line x1="410" y1="518" x2="428" y2="572" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="650" y1="518" x2="668" y2="572" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="64" y="676" font-size="11.5" fill="#6B675C">剪枝顺序：叶子最「专有」、共享面最小，先剪；内部节点被越多后代共享，价值越高 —— 树结构免费给出这份「共享计数」</text>
  <text x="64" y="696" font-size="11.5" fill="#6B675C">匹配 = 从 root 沿键逐块下走，停在第一个查不到的块 —— 命中长度之后的部分才需要计算（增量 prefill）</text>

  <!-- ============ C · 淘汰计价 ============ -->
  <text x="830" y="330" font-size="14" font-weight="700" fill="#2B2A26">C · 淘汰计价</text>

  <rect x="830" y="352" width="350" height="92" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="852" y="378" font-size="12.5" font-weight="700" fill="#6B4E28">LRU 的隐含假设：每块等价值</text>
  <text x="852" y="402" font-size="11" fill="#6B4E28">对 KV 不成立：块的价值 = 复用概率 ×</text>
  <text x="852" y="420" font-size="11" fill="#6B4E28">省下的重算，两者都随树中位置剧烈变化</text>

  <rect x="830" y="464" width="350" height="104" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="852" y="490" font-size="12.5" font-weight="700" fill="#24473F">成本感知计价</text>
  <text x="852" y="514" font-size="11.5" fill="#24473F">score = 预期复用 × T_recompute(深度) / 体积</text>
  <text x="852" y="536" font-size="11" fill="#24473F">淘汰 score 最小者；T_recompute 随前缀深度</text>
  <text x="852" y="554" font-size="11" fill="#24473F">超线性增长（8.4 决策不等式的分子）</text>

  <rect x="830" y="588" width="350" height="108" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="852" y="614" font-size="12.5" font-weight="700" fill="#733428">两个典型错判</text>
  <text x="852" y="638" font-size="11" fill="#733428">system prompt：LRU 低估 —— 久未被整段</text>
  <text x="852" y="656" font-size="11" fill="#733428">访问，但每条新请求都要它；</text>
  <text x="852" y="674" font-size="11" fill="#733428">会话尾巴：LRU 高估 —— 刚用过，</text>
  <text x="852" y="692" font-size="11" fill="#733428">但用户可能永远不回来</text>

  <!-- ============ 底部约束条 ============ -->
  <rect x="64" y="736" width="1116" height="76" rx="8" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.3"/>
  <text x="86" y="764" font-size="11.5" fill="#4A473F">两条硬约束（8.14 单机版原样上楼）：refcount &gt; 0 禁逐出；先删索引、再等读者散场、最后回收空间 —— 顺序反了，读者会拿到正被覆盖的块</text>
  <text x="86" y="790" font-size="11.5" fill="#4A473F">口径提醒：命中率按 token 计（长前缀命中省得多）；命中率 ↑ ≠ TTFT ↓ —— 取回慢尾可以吃掉全部收益（正文 §3 / §7）</text>
</svg>
