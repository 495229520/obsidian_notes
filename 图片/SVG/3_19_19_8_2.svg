<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>AF_XDP：四个 ring 转移 frame 使用权</title><desc>用户与内核通过FILL RX TX COMPLETION交接帧地址，UMEM payload内存不因ring传递而必然复制。</desc>
<defs>
<marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">AF_XDP：四个 ring 转移 frame 使用权</text>
<text x="48" y="81" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">RX 槽位、TX 槽位和 UMEM frame：分别回收；先明确谁能再次使用这段内存。</text>
<rect x="56" y="114" width="270" height="487" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="72" y="139" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">用户态应用</text>
<rect x="914" y="114" width="270" height="487" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="930" y="139" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">内核驱动 / XDP</text>
<text x="80" y="176" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">空闲 frame 地址</text>
<text x="80" y="260" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">消费 descriptor</text>
<text x="80" y="289" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">处理 / 持有 payload</text>
<text x="80" y="465" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">提交待发 frame</text>
<text x="80" y="563" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">完成后才可复用</text>
<text x="941" y="176" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">接收 buffer 补充</text>
<text x="941" y="260" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">收到报文后发布</text>
<text x="941" y="465" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">发送资源推进</text>
<text x="941" y="563" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">TX buffer 使用结束</text>
<rect x="450" y="145" width="340" height="57" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="620.0" y="167.5" font-size="12.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">FILL</text>
<text x="620.0" y="187.5" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-role="body">空闲 frame 地址</text>
<polyline points="328,173 446,173" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<polyline points="792,173 910,173" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="450" y="238" width="340" height="57" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="620.0" y="260.5" font-size="12.5" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">RX</text>
<text x="620.0" y="280.5" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">已收到的 frame descriptor</text>
<polyline points="912,266 794,266" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<polyline points="448,266 330,266" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="450" y="432" width="340" height="57" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="620.0" y="454.5" font-size="12.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">TX</text>
<text x="620.0" y="474.5" font-size="12.5" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body">待发 frame descriptor</text>
<polyline points="328,460 446,460" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<polyline points="792,460 910,460" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="450" y="527" width="340" height="57" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="620.0" y="549.5" font-size="12.5" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">COMPLETION</text>
<text x="620.0" y="569.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-role="body">TX 已释放的 frame 地址</text>
<polyline points="912,555 794,555" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<polyline points="448,555 330,555" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="371" y="322" width="498" height="84" rx="8" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="620" y="345" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="middle" data-role="body">同一片 UMEM：payload 在这里</text>
<rect x="394" y="358" width="37" height="26" rx="3" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="412" y="376" font-size="11" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">f0</text>
<rect x="439" y="358" width="37" height="26" rx="3" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="457" y="376" font-size="11" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">f1</text>
<rect x="484" y="358" width="37" height="26" rx="3" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="502" y="376" font-size="11" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">f2</text>
<rect x="529" y="358" width="37" height="26" rx="3" fill="#F3E8D3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="547" y="376" font-size="11" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">f3</text>
<rect x="574" y="358" width="37" height="26" rx="3" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="592" y="376" font-size="11" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">f4</text>
<rect x="619" y="358" width="37" height="26" rx="3" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="637" y="376" font-size="11" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">f5</text>
<rect x="664" y="358" width="37" height="26" rx="3" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="682" y="376" font-size="11" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">f6</text>
<rect x="709" y="358" width="37" height="26" rx="3" fill="#F3E8D3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="727" y="376" font-size="11" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">f7</text>
<rect x="754" y="358" width="37" height="26" rx="3" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="772" y="376" font-size="11" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">f8</text>
<rect x="799" y="358" width="37" height="26" rx="3" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="817" y="376" font-size="11" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">f9</text>
<text x="79" y="349" font-size="13" fill="#733428" font-weight="700" text-anchor="start" data-role="body">RX ring release</text>
<text x="79" y="374" font-size="13" fill="#733428" font-weight="400" text-anchor="start" data-role="body">≠ frame 已归还 FILL</text>
<text x="941" y="349" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">copy：先复制到 UMEM</text>
<text x="941" y="374" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">ZC：NIC 直接 DMA</text>
<rect x="73" y="619" width="540" height="37" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="343.0" y="641.5" font-size="12.5" fill="#733428" font-weight="700" text-anchor="middle" data-role="body">禁止同一 frame 同时投入 FILL 与 TX</text>
<rect x="635" y="619" width="532" height="37" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="901.0" y="641.5" font-size="12.5" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">共享 UMEM 不取消各 ring 的 SPSC 约束</text>
<text x="48" y="673" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">COMPLETION 表示本地 TX frame 可复用，不是 TCP ACK 或远端应用处理确认。</text>
</svg>