<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 14px; fill: #435363; text-anchor: middle; }
      .small { font-size: 13px; fill: #526475; text-anchor: middle; }
    </style>
  </defs>
  <text x="56" y="54" class="title">mixed precision 不能只写 dtype = FP16</text>
  <text x="56" y="83" class="subtitle">每个 benchmark row 至少拆出 input、output、compute、accumulate、reference、tolerance</text>

  <rect x="72" y="145" width="170" height="210" rx="8" fill="#e8f0f6" stroke="#86a8c4" stroke-width="2"/>
  <text x="157" y="184" class="head">Input</text>
  <text x="157" y="226" class="body">A/B dtype</text>
  <text x="157" y="254" class="body">FP16 / BF16</text>
  <text x="157" y="300" class="small">storage precision</text>

  <rect x="276" y="145" width="170" height="210" rx="8" fill="#efe8f6" stroke="#aa92c5" stroke-width="2"/>
  <text x="361" y="184" class="head">Compute</text>
  <text x="361" y="226" class="body">multiply path</text>
  <text x="361" y="254" class="body">library mode</text>
  <text x="361" y="300" class="small">Tensor Core?</text>

  <rect x="480" y="145" width="170" height="210" rx="8" fill="#f4ead7" stroke="#c6a661" stroke-width="2"/>
  <text x="565" y="184" class="head">Accumulate</text>
  <text x="565" y="226" class="body">FP32 / FP16</text>
  <text x="565" y="254" class="body">error growth</text>
  <text x="565" y="300" class="small">correctness key</text>

  <rect x="684" y="145" width="170" height="210" rx="8" fill="#e7efe3" stroke="#84a96d" stroke-width="2"/>
  <text x="769" y="184" class="head">Output</text>
  <text x="769" y="226" class="body">C/D dtype</text>
  <text x="769" y="254" class="body">store result</text>
  <text x="769" y="300" class="small">rounding visible</text>

  <rect x="888" y="145" width="170" height="210" rx="8" fill="#f7e8e5" stroke="#c98e83" stroke-width="2"/>
  <text x="973" y="184" class="head">Tolerance</text>
  <text x="973" y="226" class="body">atol / rtol</text>
  <text x="973" y="254" class="body">RMS error</text>
  <text x="973" y="300" class="small">not FP32 default</text>

  <rect x="166" y="430" width="788" height="54" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="560" y="464" class="body">报告中的每个数字，都要能回答：它用什么存、用什么算、和谁对拍、用什么阈值通过。</text>
</svg>
