<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200px" height="760px" viewBox="0 0 1200 760" version="1.1">
  <title>LLM serving request metric timeline</title>
  <desc>Timeline showing TTFT, generation time, ITL, E2E latency, and TPS/RPS distinction.</desc>
  <rect x="0" y="0" width="1200" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#42545a"/>
    </marker>
  </defs>
  <text x="600" y="44" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#263238">一次 LLM 请求的指标时间线</text>
  <text x="600" y="82" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#455a64">TTFT 看首 token，TPOT / ITL 看后续节奏，E2E 看完整请求</text>

  <line x1="120" y1="370" x2="1080" y2="370" stroke="#42545a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="110" y="405" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#607077">send</text>
  <text x="1080" y="405" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#607077">done</text>

  <rect x="150" y="280" width="250" height="70" rx="12" ry="12" fill="#fff1dc" stroke="#d48b2a" stroke-width="2"/>
  <text x="275" y="308" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#6b4719">Queue + Prefill</text>
  <text x="275" y="333" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#6b4719">排队、tokenize、处理 prompt</text>

  <circle cx="450" cy="370" r="12" fill="#d95f43" stroke="#8c3a24" stroke-width="2"/>
  <text x="450" y="250" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#8c3a24">first token</text>
  <path d="M450 260 L450 354" stroke="#8c3a24" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="486" y="280" width="486" height="70" rx="12" ry="12" fill="#eef3ef" stroke="#8fa6a0" stroke-width="2"/>
  <text x="729" y="308" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1d5c63">Decode / Streaming Output</text>
  <text x="729" y="333" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1d5c63">逐 token 生成，持续读取和更新 KV cache</text>

  <circle cx="560" cy="370" r="8" fill="#3f8f8c"/>
  <circle cx="660" cy="370" r="8" fill="#3f8f8c"/>
  <circle cx="760" cy="370" r="8" fill="#3f8f8c"/>
  <circle cx="860" cy="370" r="8" fill="#3f8f8c"/>
  <circle cx="960" cy="370" r="8" fill="#3f8f8c"/>

  <line x1="120" y1="474" x2="450" y2="474" stroke="#b85b31" stroke-width="4"/>
  <text x="285" y="456" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#b85b31">TTFT</text>
  <text x="285" y="504" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#7a4a16">请求发出到第一个 token</text>

  <line x1="560" y1="520" x2="660" y2="520" stroke="#1d6f73" stroke-width="4"/>
  <line x1="660" y1="520" x2="760" y2="520" stroke="#1d6f73" stroke-width="4"/>
  <line x1="760" y1="520" x2="860" y2="520" stroke="#1d6f73" stroke-width="4"/>
  <line x1="860" y1="520" x2="960" y2="520" stroke="#1d6f73" stroke-width="4"/>
  <text x="760" y="500" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#1d6f73">TPOT / ITL</text>
  <text x="760" y="550" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1d5c63">相邻输出 token 的平均间隔</text>

  <line x1="120" y1="612" x2="980" y2="612" stroke="#5c4770" stroke-width="4"/>
  <text x="550" y="594" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#5c4770">E2E latency = TTFT + generation time</text>

  <rect x="804" y="130" width="300" height="104" rx="14" ry="14" fill="#f8fbff" stroke="#b8c4d6" stroke-width="2"/>
  <text x="954" y="162" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#33464b">吞吐指标看整体系统</text>
  <text x="954" y="190" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1d5c63">TPS: output tokens / sec</text>
  <text x="954" y="214" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#7a4a16">RPS: requests / sec</text>
</svg>
