<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">RoCE QoS：分类后分到入口资源与出口队列</title>
<desc id="desc">公开对象模型；物理缓冲可以共享，PG 与 Queue 不是同一命名空间</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="title">RoCE QoS：分类后分到入口资源与出口队列</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="title">公开对象模型；物理缓冲可以共享，PG 与 Queue 不是同一命名空间</text>
<text x="65" y="125" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">A · 输入与策略</text>
<rect x="65" y="150" width="176" height="192" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="153.0" y="228.0" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">PCP / DSCP</text>
<text x="153.0" y="251.0" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle" data-zone="body">端口默认值</text>
<text x="153.0" y="274.0" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle" data-zone="body">Trust / ACL</text>
<text x="287" y="190" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">B · 本地分类</text>
<rect x="285" y="222" width="205" height="101" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="387.5" y="266.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">内部类别 / TC</text>
<text x="387.5" y="289.0" font-size="14" fill="#2C4460" font-weight="400" text-anchor="middle" data-zone="body">或 switch-priority</text>
<line x1="246" y1="269" x2="280" y2="269" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="574" y="123" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">C · 入口接收资源</text>
<rect x="573" y="149" width="242" height="96" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="694.0" y="190.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">Ingress PG</text>
<text x="694.0" y="213.5" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle" data-zone="body">port + class → PG</text>
<path d="M490,252 H532 V197 H568" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="572" y="282" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="start" data-zone="body">Pool · Profile · Headroom</text>
<line x1="820" y1="197" x2="925" y2="197" stroke="#5A564B" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="933" y="151" width="245" height="91" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1055.5" y="190.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-zone="body">PFC Tx</text>
<text x="1055.5" y="213.0" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="middle" data-zone="body">PG 与 priority 关联</text>
<text x="942" y="279" font-size="14" fill="#6B4E28" font-weight="400" text-anchor="start" data-zone="body">请求相邻上游暂停</text>
<text x="574" y="351" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">D · 出口发送资源</text>
<rect x="573" y="373" width="242" height="96" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="694.0" y="414.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">Egress Queue</text>
<text x="694.0" y="437.5" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle" data-zone="body">port + class → Queue</text>
<path d="M490,290 H532 V421 H568" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="573" y="496" font-size="14" fill="#24473F" font-weight="700" text-anchor="start" data-zone="body">实际入队 · 水位 · Drop</text>
<line x1="820" y1="421" x2="870" y2="421" stroke="#5A564B" stroke-width="1.7" stroke-dasharray="6 4"/>
<rect x="933" y="353" width="245" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1055.5" y="387.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">Scheduler / Shaper</text>
<rect x="933" y="429" width="245" height="59" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1055.5" y="463.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">WRED / ECN Profile</text>
<path d="M870,420 V383 H926" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<path d="M870,421 V459 H926" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="68" y="389" width="376" height="95" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="256.0" y="430.0" font-size="14" fill="#733428" font-weight="700" text-anchor="middle" data-zone="body">另一条控制关系：PFC Rx</text>
<text x="256.0" y="453.0" font-size="14" fill="#733428" font-weight="400" text-anchor="middle" data-zone="body">priority → 本地受控发送 Queue</text>
<path d="M444,455 H486 V534 H844 V452 H820" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#redarr)"/>
<text x="69" y="551" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">实线：分类映射</text>
<text x="288" y="551" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">虚线：策略 / 控制关联</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="646" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="footer">核对对象全名：设备 + 端口 + 方向 + PG/Queue/priority；不要只检查“都填了 3”。</text>
</svg>