<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">VXLAN 的 MTU：内层 Ethernet 也占外层 IP 载荷</title>
<desc id="desc">基础外层 IPv4、无 options、内层无 VLAN Tag；内层 FCS 不装入 VXLAN 载荷。</desc>
<defs>
<marker id="arr-bs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-gs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/></marker>
<marker id="arr-rs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-ns" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8574"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="660" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="46" font-size="23" fill="#2B2A26" font-weight="700" text-anchor="start">VXLAN 的 MTU：内层 Ethernet 也占外层 IP 载荷</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">基础外层 IPv4、无 options、内层无 VLAN Tag；内层 FCS 不装入 VXLAN 载荷。</text>
<text x="48" y="127" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">线上顺序</text>
<rect x="48" y="151" width="150" height="80" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="123.0" y="184.5" font-size="15" fill="#4A473F" font-weight="700" text-anchor="middle">Outer Eth</text>
<text x="123.0" y="207.5" font-size="15" fill="#4A473F" font-weight="400" text-anchor="middle">14 B</text>
<rect x="198" y="151" width="180" height="80" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="288.0" y="184.5" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">Outer IPv4</text>
<text x="288.0" y="207.5" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle">20 B</text>
<rect x="378" y="151" width="100" height="80" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="428.0" y="184.5" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">UDP</text>
<text x="428.0" y="207.5" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle">8 B</text>
<rect x="478" y="151" width="132" height="80" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="544.0" y="184.5" font-size="15" fill="#73531F" font-weight="700" text-anchor="middle">VXLAN</text>
<text x="544.0" y="207.5" font-size="15" fill="#73531F" font-weight="400" text-anchor="middle">8 B</text>
<rect x="610" y="151" width="172" height="80" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="696.0" y="184.5" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">Inner Eth</text>
<text x="696.0" y="207.5" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">14 B</text>
<rect x="782" y="151" width="276" height="80" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="920.0" y="184.5" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">Inner IP</text>
<text x="920.0" y="207.5" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">M bytes</text>
<rect x="1058" y="151" width="134" height="80" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="1125.0" y="184.5" font-size="15" fill="#4A473F" font-weight="700" text-anchor="middle">FCS</text>
<text x="1125.0" y="207.5" font-size="15" fill="#4A473F" font-weight="400" text-anchor="middle">4 B</text>
<path d="M200,244 L200,263 L1058,263 L1058,244" fill="none" stroke="#3D5A80" stroke-width="1.8"/>
<text x="630" y="288" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">Underlay IP MTU 的计数范围</text>
<rect x="48" y="318" width="1144" height="112" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="346" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start">50 B 额外开销的参照物是“内层 IP”</text>
<text x="68" y="385" font-size="17" fill="#2C4460" font-weight="400" text-anchor="start">20 IPv4 + 8 UDP + 8 VXLAN + 14 内层以太网 + M</text>
<rect x="48" y="458" width="544" height="99" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="68" y="488" font-size="16" fill="#2C4460" font-weight="700" text-anchor="start">要承载 1500-byte 内层 IP</text>
<text x="68" y="527" font-size="19" fill="#2C4460" font-weight="700" text-anchor="start">外层 IPv4 长度 = 1550 B</text>
<rect x="616" y="458" width="576" height="99" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="636" y="488" font-size="16" fill="#24473F" font-weight="700" text-anchor="start">Underlay IP MTU 固定 1500</text>
<text x="636" y="527" font-size="19" fill="#24473F" font-weight="700" text-anchor="start">内层 IPv4 包上限 = 1450 B</text>
<text x="48" y="596" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">外层 IPv6 基础头再多 20 B：所需 1570；可用内层上限 1430。</text>
<text x="48" y="624" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">外层 VLAN 只增加 L2 帧长；保留在隧道内的 VLAN Tag 才增加外层 IP 长度。</text>
</svg>