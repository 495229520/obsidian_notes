<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>跨 rail 的完成条件：不能让快的一条替慢的一条宣布成功</title>
<desc>一个逻辑消息拆成两片，写入不同范围；时间条仅为示意，不代表真实时延或比例。</desc>
<defs>
<marker id="8_4_4_25_2-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="8_4_4_25_2-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="8_4_4_25_2-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="8_4_4_25_2-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="45" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">跨 rail 的完成条件：不能让快的一条替慢的一条宣布成功</text>
<text x="48" y="74" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">一个逻辑消息拆成两片，写入不同范围；时间条仅为示意，不代表真实时延或比例。</text>
<text x="48" y="115" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 分片并发与完成汇合</text>
<rect x="48" y="139" width="1144" height="109" rx="8" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.3" />
<rect x="48" y="294" width="1144" height="109" rx="8" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="67" y="177" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">QP0 / rail0</text>
<text x="67" y="202" font-size="14" font-weight="400" fill="#2C4460" text-anchor="start" data-role="body">chunk[0]</text>
<text x="67" y="332" font-size="15" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">QP1 / rail1</text>
<text x="67" y="357" font-size="14" font-weight="400" fill="#24473F" text-anchor="start" data-role="body">chunk[1]</text>
<rect x="243" y="164" width="362" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="424.0" y="195.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">chunk[0] 传输</text>
<line x1="609" y1="190" x2="650" y2="190" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_25_2-arr)"/>
<rect x="657" y="164" width="116" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="715.0" y="195.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">CQE0</text>
<polyline points="777,190 1052,190 1052,278" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#8_4_4_25_2-blue)"/>
<text x="852" y="177" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">不是全消息完成</text>
<rect x="243" y="319" width="233" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="359.5" y="350.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">chunk[1] 开始</text>
<rect x="479" y="319" width="215" height="52" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="586.5" y="350.0" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">排队 / 暂停 / 慢路径</text>
<rect x="697" y="319" width="182" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="788.0" y="350.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">剩余传输</text>
<line x1="883" y1="345" x2="915" y2="345" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_25_2-arr)"/>
<rect x="923" y="319" width="111" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="978.5" y="350.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">CQE1</text>
<polyline points="1038,345 1052,345 1052,314" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#8_4_4_25_2-green)"/>
<rect x="970" y="280" width="220" height="34" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="1080.0" y="302.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">汇合：两片条件均满足</text>
<polyline points="1192,297 1210,297 1210,447 1197,447" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#8_4_4_25_2-arr)"/>
<rect x="922" y="422" width="270" height="50" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="1057.0" y="452.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">才进入应用提交</text>
<text x="48" y="462" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 三层语义，不能互相替代</text>
<rect x="48" y="483" width="205" height="34" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="505.0" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">层次</text>
<rect x="253" y="483" width="385" height="34" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="265" y="505.0" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">完成了什么</text>
<rect x="638" y="483" width="554" height="34" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="650" y="505.0" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">还不能据此推断</text>
<rect x="48" y="517" width="205" height="34" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="539.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">传输完成</text>
<rect x="253" y="517" width="385" height="34" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="265" y="539.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">指定操作满足传输完成条件</text>
<rect x="638" y="517" width="554" height="34" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="650" y="539.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">其他 QP / 远端业务已经完成</text>
<rect x="48" y="551" width="205" height="34" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="573.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">应用发布</text>
<rect x="253" y="551" width="385" height="34" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="265" y="573.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">接收协议确认完整并允许消费</text>
<rect x="638" y="551" width="554" height="34" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="650" y="573.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">GPU 并发内核自动可见</text>
<rect x="48" y="585" width="205" height="34" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="607.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">目标消费 / 持久化</text>
<rect x="253" y="585" width="385" height="34" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="265" y="607.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">遵守目标执行环境的规则</text>
<rect x="638" y="585" width="554" height="34" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="650" y="607.0" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">其他环境天然具有同样顺序</text>
<text x="48" y="670" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">跟踪 request_id / epoch / chunk 状态；消息尾部受最慢片段影响，CPU fence 不能替代 GPU 同步。</text>
</svg>