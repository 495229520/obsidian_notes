<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统：底色 rgb(245,244,237)；泳道 #FAF9F2/#8A8574；框 #E3EAF4/#3D5A80/#2C4460；
       成本 #A64B3C；直达/绿色 #2F6B5E；与本库既有 SVG 同一套 -->
  <title>GDS 与传统路径对账</title>
  <desc>上半为传统路径：盘 DMA 进页缓存、两次 CPU 拷贝经用户缓冲与 pinned 暂存、再 DMA 进显存，主存总线六次穿越；下半为 GDS 路径：CPU 只发命令，盘的 DMA 经同一 PCIe Switch 直写显存 BAR1，主存零参与；底部为兼容模式静默回退警示与三步验证法。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="840" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">GDS：让盘的 DMA 直接以显存为目的地，主存整个退场</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">机制 = BAR1 暴露显存 + nvidia-fs 改写 DMA 目的地 + 强制 O_DIRECT；物理前提 = 同 Switch P2P（PIX/PXB）</text>

  <!-- 传统路径 -->
  <rect x="48" y="104" width="1144" height="240" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="620" y="132" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" dominant-baseline="central">传统路径（buffered + pageable，8.1 §3）</text>

  <rect x="78" y="160" width="150" height="60" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="153" y="184" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">NVMe 盘</text>
  <text x="153" y="204" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">本地或 NVMe-oF</text>
  <path d="M228,190 L266,190" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <text x="247" y="174" font-size="9.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">DMA</text>

  <rect x="270" y="160" width="170" height="60" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="355" y="184" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">页缓存（主存）</text>
  <text x="355" y="204" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">穿越 ×1</text>
  <path d="M440,190 L478,190" fill="none" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrr)"/>
  <text x="459" y="174" font-size="9.5" font-weight="700" fill="#A64B3C" text-anchor="middle" dominant-baseline="central">CPU 拷</text>

  <rect x="482" y="160" width="170" height="60" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="567" y="184" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">用户 buffer（主存）</text>
  <text x="567" y="204" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">穿越 ×2</text>
  <path d="M652,190 L690,190" fill="none" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrr)"/>
  <text x="671" y="174" font-size="9.5" font-weight="700" fill="#A64B3C" text-anchor="middle" dominant-baseline="central">CPU 拷</text>

  <rect x="694" y="160" width="180" height="60" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="784" y="184" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">pinned 暂存（主存）</text>
  <text x="784" y="204" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">穿越 ×2</text>
  <path d="M874,190 L912,190" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <text x="893" y="174" font-size="9.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">DMA·PCIe</text>

  <rect x="916" y="160" width="150" height="60" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="991" y="190" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">显存</text>

  <rect x="78" y="252" width="988" height="64" rx="7" fill="#FAF9F2" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="572" y="272" font-size="12.5" font-weight="700" fill="#A64B3C" text-anchor="middle" dominant-baseline="central">账单：主存总线 6 次穿越 · CPU 拷贝 2 次/字节 · 页缓存被占用与污染</text>
  <text x="572" y="298" font-size="10.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">喂卡 10 GB/s = 主存 60 GB/s + 数个核在搬运业——预处理与 DataLoader 被挤出（8.7）</text>

  <!-- GDS 路径 -->
  <rect x="48" y="368" width="1144" height="240" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="620" y="396" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" dominant-baseline="central">GDS 路径（cuFile + nvidia-fs）</text>

  <rect x="78" y="424" width="150" height="60" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="153" y="448" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">NVMe 盘</text>
  <text x="153" y="468" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">O_DIRECT · 4 KiB 对齐</text>
  <path d="M228,454 L342,454" fill="none" stroke="#2F6B5E" stroke-width="2.2" marker-end="url(#arrg)"/>
  <text x="285" y="438" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle" dominant-baseline="central">DMA · P2P</text>

  <rect x="346" y="424" width="200" height="60" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="446" y="448" font-size="12" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="central">同一 PCIe Switch</text>
  <text x="446" y="468" font-size="10" fill="#085041" text-anchor="middle" dominant-baseline="central">不过根复合体 · 不过主存</text>
  <path d="M546,454 L660,454" fill="none" stroke="#2F6B5E" stroke-width="2.2" marker-end="url(#arrg)"/>

  <rect x="664" y="424" width="220" height="60" rx="7" fill="#E3EAF4" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="774" y="448" font-size="12" font-weight="700" fill="#2F6B5E" text-anchor="middle" dominant-baseline="central">显存 BAR1 窗口</text>
  <text x="774" y="468" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">显存被映射成 PCIe 总线地址</text>

  <rect x="938" y="424" width="220" height="60" rx="7" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="1048" y="444" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle" dominant-baseline="central">CPU：只提交 IO 命令</text>
  <text x="1048" y="466" font-size="10" fill="#4A473F" text-anchor="middle" dominant-baseline="central">nvidia-fs 把 DMA 目的地改成 BAR1</text>
  <path d="M938,470 L890,470" fill="none" stroke="#8A8574" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrn)"/>

  <rect x="78" y="516" width="988" height="64" rx="7" fill="#FAF9F2" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="572" y="536" font-size="12.5" font-weight="700" fill="#2F6B5E" text-anchor="middle" dominant-baseline="central">账单：主存总线 0 次 · CPU 拷贝 0 次——CPU 与主存带宽全额归还预处理</text>
  <text x="572" y="562" font-size="10.5" fill="#4A473F" text-anchor="middle" dominant-baseline="central">收益大头：大块顺序读吞吐 + 归还资源；盘的几十 μs 还在，小随机 IO 不归它救【取舍】</text>

  <!-- compat + 验证 -->
  <rect x="48" y="632" width="1144" height="168" rx="8" fill="#F1EFE8" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="70" y="656" font-size="12.5" font-weight="700" fill="#A64B3C" dominant-baseline="central">最大测试陷阱：compat mode 静默回退</text>
  <text x="70" y="680" font-size="11" fill="#4A473F" dominant-baseline="central">文件系统不支持 / nvidia-fs 未加载 / 拓扑不允许 / 未对齐 → cuFile 不报错，悄悄退回经主存的普通路径——「装了 GDS」≠「跑在 GDS 上」</text>
  <text x="70" y="710" font-size="12" font-weight="700" fill="#2B2A26" dominant-baseline="central">三步验证（顺序不可反）</text>
  <text x="70" y="734" font-size="11" fill="#4A473F" dominant-baseline="central">① gdscheck.py -p：支持矩阵逐项 Supported？（IOMMU 建议 passthrough/off）　② nvidia-smi topo -m：GPU↔盘必须 PIX/PXB</text>
  <text x="70" y="758" font-size="11" fill="#4A473F" dominant-baseline="central">③ gdsio 跑完看 /proc/driver/nvidia-fs/stats：读写字节计数不涨 = 回退，两组对比测的是同一条路</text>
  <text x="70" y="782" font-size="10.5" fill="#6B675C" dominant-baseline="central">排查树：真在 GDS 上？→ 物理路径没打折（拓扑/LnkSta）？→ 才轮到块大小、并发、注册复用等参数</text>
</svg>
