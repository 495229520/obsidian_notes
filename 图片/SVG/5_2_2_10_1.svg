<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect width="980" height="520" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#53616f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24313f; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .label { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3b46; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53616f; }
      .mono { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #2f3b46; }
      .cell { fill: #ffffff; stroke: #8aa1b4; stroke-width: 1.5; rx: 8; }
      .active { fill: #fff4cf; stroke: #d59a2d; stroke-width: 2; rx: 8; }
      .pop { fill: #fde2df; stroke: #d36b5f; stroke-width: 2; rx: 8; }
      .keep { fill: #dff0ea; stroke: #45907a; stroke-width: 2; rx: 8; }
      .panel { fill: #ffffff; stroke: #c7d2dc; stroke-width: 1.4; rx: 10; }
      .stack { fill: #eef6fb; stroke: #6f94b3; stroke-width: 1.5; rx: 8; }
      .arrow { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #9aa9b5; stroke-width: 1.6; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <text x="40" y="48" class="title">单调栈：把还没找到答案的下标留在栈里</text>
  <text x="40" y="76" class="subtitle">以每日温度为例，当前温度 72 会结算前面更低的 69 和 71，但 75 继续留在栈中等待更高温度。</text>

  <text x="58" y="124" class="label">数组 temperatures</text>
  <g transform="translate(58,140)">
    <g>
      <rect x="0" y="0" width="82" height="58" class="cell"/>
      <text x="41" y="25" text-anchor="middle" class="mono">73</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=0</text>
    </g>
    <g transform="translate(90,0)">
      <rect x="0" y="0" width="82" height="58" class="cell"/>
      <text x="41" y="25" text-anchor="middle" class="mono">74</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=1</text>
    </g>
    <g transform="translate(180,0)">
      <rect x="0" y="0" width="82" height="58" class="keep"/>
      <text x="41" y="25" text-anchor="middle" class="mono">75</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=2</text>
    </g>
    <g transform="translate(270,0)">
      <rect x="0" y="0" width="82" height="58" class="pop"/>
      <text x="41" y="25" text-anchor="middle" class="mono">71</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=3</text>
    </g>
    <g transform="translate(360,0)">
      <rect x="0" y="0" width="82" height="58" class="pop"/>
      <text x="41" y="25" text-anchor="middle" class="mono">69</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=4</text>
    </g>
    <g transform="translate(450,0)">
      <rect x="0" y="0" width="82" height="58" class="active"/>
      <text x="41" y="25" text-anchor="middle" class="mono">72</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=5</text>
    </g>
    <g transform="translate(540,0)">
      <rect x="0" y="0" width="82" height="58" class="cell"/>
      <text x="41" y="25" text-anchor="middle" class="mono">76</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=6</text>
    </g>
    <g transform="translate(630,0)">
      <rect x="0" y="0" width="82" height="58" class="cell"/>
      <text x="41" y="25" text-anchor="middle" class="mono">73</text>
      <text x="41" y="47" text-anchor="middle" class="small">i=7</text>
    </g>
  </g>

  <path d="M 552 214 C 552 244 552 252 552 276" class="arrow"/>
  <text x="578" y="246" class="small">当前 72 入场</text>

  <rect x="58" y="272" width="300" height="184" class="panel"/>
  <text x="82" y="306" class="label">处理 72 之前的栈</text>
  <text x="82" y="330" class="small">从栈底到栈顶温度递减</text>
  <g transform="translate(92,354)">
    <rect x="0" y="0" width="180" height="34" class="stack"/>
    <text x="90" y="22" text-anchor="middle" class="mono">2:75</text>
    <rect x="0" y="40" width="180" height="34" class="stack"/>
    <text x="90" y="62" text-anchor="middle" class="mono">3:71</text>
    <rect x="0" y="80" width="180" height="34" class="stack"/>
    <text x="90" y="102" text-anchor="middle" class="mono">4:69  ← top</text>
  </g>

  <rect x="410" y="272" width="236" height="184" class="panel"/>
  <text x="434" y="306" class="label">弹出并结算</text>
  <text x="434" y="342" class="mono">72 &gt; 69</text>
  <text x="434" y="366" class="small">ans[4] = 5 - 4 = 1</text>
  <text x="434" y="402" class="mono">72 &gt; 71</text>
  <text x="434" y="426" class="small">ans[3] = 5 - 3 = 2</text>

  <path d="M 360 364 C 386 364 390 364 410 364" class="arrow"/>

  <rect x="696" y="272" width="226" height="184" class="panel"/>
  <text x="720" y="306" class="label">停止并入栈</text>
  <text x="720" y="342" class="mono">72 &lt; 75</text>
  <text x="720" y="366" class="small">75 还没有答案，继续等待</text>
  <g transform="translate(732,390)">
    <rect x="0" y="0" width="150" height="32" class="keep"/>
    <text x="75" y="21" text-anchor="middle" class="mono">2:75</text>
    <rect x="0" y="38" width="150" height="32" class="active"/>
    <text x="75" y="59" text-anchor="middle" class="mono">5:72 ← top</text>
  </g>

  <path d="M 646 364 C 672 364 676 364 696 364" class="arrow"/>

  <line x1="238" y1="198" x2="238" y2="266" class="soft"/>
  <line x1="508" y1="198" x2="508" y2="266" class="soft"/>
  <text x="58" y="488" class="small">不变量：栈中只保留还没有找到“右侧第一个更高温度”的下标；被弹出的下标在弹出时立刻得到答案。</text>
</svg>
