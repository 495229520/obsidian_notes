  <text x="88" y="207" class="small">CUDA v1 / v2</text>
  <text x="88" y="234" class="small">Triton / CUTLASS</text>
  <text x="88" y="261" class="small">cuBLAS / cuBLASLt</text>

  <path d="M290 220 H372" class="line"/>

  <rect x="390" y="115" width="230" height="210" class="blue"/>
  <text x="420" y="153" class="label">冻结实验矩阵</text>
  <text x="420" y="189" class="small">shape</text>
  <text x="420" y="216" class="small">impl</text>
  <text x="420" y="243" class="small">dtype</text>
  <text x="420" y="270" class="small">raw CSV / JSON</text>

