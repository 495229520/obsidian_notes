  <path d="M1000 220 H1082" class="line"/>

  <rect x="60" y="375" width="1080" height="88" class="amber"/>
  <text x="92" y="412" class="label">最终输出</text>
  <text x="92" y="444" class="small">`gemm_profiling_report.md`：finding 能回到 benchmark / profiler / 环境记录，limitations 写清没有证明的部分。</text>

  <rect x="1100" y="175" width="40" height="90" class="rose"/>
