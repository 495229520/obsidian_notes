<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 625" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">Raft：Snapshot边界与逻辑日志坐标</title><desc id="desc">Snapshot表示应用到index100后的状态；立即压缩到100时保留虚拟边界term7，真实日志101、102、103分别成为tail0、1、2。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect width="1240" height="625" fill="rgb(245, 244, 237)"/>
<text x="48" y="53" font-size="22" fill="#2B2A26" font-weight="700">Snapshot：前缀可删除，逻辑坐标不能重编号</text>
<text x="48" y="84" font-size="15" fill="#6B675C">示例：S = 100，term(S) = 7；立即压缩至 S</text>
<line x1="48" y1="106" x2="1192" y2="106" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="64" y="148" font-size="19" fill="#2B2A26" font-weight="700">压缩前</text>
<text x="64" y="185" font-size="16" fill="#6B675C">逻辑 index</text>
<text x="64" y="229" font-size="16" fill="#6B675C">条目 term</text>
<text x="353" y="184" font-size="17" fill="#2B2A26" text-anchor="middle">1…95</text>
<rect x="310" y="201" width="86" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="353" y="232" font-size="19" fill="#24473F" text-anchor="middle">…</text>
<text x="449" y="184" font-size="17" fill="#2B2A26" text-anchor="middle">96</text>
<rect x="406" y="201" width="86" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="449" y="232" font-size="19" fill="#24473F" text-anchor="middle">6</text>
<text x="545" y="184" font-size="17" fill="#2B2A26" text-anchor="middle">97</text>
<rect x="502" y="201" width="86" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="545" y="232" font-size="19" fill="#24473F" text-anchor="middle">6</text>
<text x="641" y="184" font-size="17" fill="#2B2A26" text-anchor="middle">98</text>
<rect x="598" y="201" width="86" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="641" y="232" font-size="19" fill="#24473F" text-anchor="middle">7</text>
<text x="737" y="184" font-size="17" fill="#2B2A26" text-anchor="middle">99</text>
<rect x="694" y="201" width="86" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="737" y="232" font-size="19" fill="#24473F" text-anchor="middle">7</text>
<text x="833" y="184" font-size="17" fill="#2B2A26" text-anchor="middle">100</text>
<rect x="790" y="201" width="86" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="833" y="232" font-size="19" fill="#24473F" text-anchor="middle">7</text>
<text x="929" y="184" font-size="17" fill="#2B2A26" text-anchor="middle">101</text>
<rect x="886" y="201" width="86" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="929" y="232" font-size="19" fill="#2C4460" text-anchor="middle">7</text>
<text x="1025" y="184" font-size="17" fill="#2B2A26" text-anchor="middle">102</text>
<rect x="982" y="201" width="86" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="1025" y="232" font-size="19" fill="#2C4460" text-anchor="middle">8</text>
<text x="1121" y="184" font-size="17" fill="#2B2A26" text-anchor="middle">103</text>
<rect x="1078" y="201" width="86" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="1121" y="232" font-size="19" fill="#2C4460" text-anchor="middle">8</text>
<path d="M310 270 V282 H876 V270" fill="none" stroke="#5A564B" stroke-width="1.6"/>
<text x="593" y="308" font-size="17" fill="#24473F" text-anchor="middle">快照覆盖的已应用前缀</text>
<path d="M593 318 V356 H370 V388" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="64" y="366" font-size="19" fill="#2B2A26" font-weight="700">压缩后</text>
<rect x="64" y="398" width="606" height="143" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="89" y="432" font-size="21" fill="#24473F" font-weight="700">业务状态 @100</text>
<text x="89" y="467" font-size="18" fill="#24473F">lastIncludedIndex = 100</text>
<text x="89" y="499" font-size="18" fill="#24473F">lastIncludedTerm = 7</text>
<text x="425" y="470" font-size="17" fill="#24473F">配置 @100</text>
<text x="425" y="502" font-size="17" fill="#24473F">去重状态 @100</text>
<text x="833" y="387" font-size="16" fill="#6B675C" text-anchor="middle">虚拟边界</text>
<rect x="790" y="404" width="86" height="88" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="833" y="437" font-size="16" fill="#24473F" text-anchor="middle">i=100</text>
<text x="833" y="470" font-size="16" fill="#24473F" text-anchor="middle">term=7</text>
<text x="833" y="519" font-size="14" fill="#6B675C" text-anchor="middle">不再 apply</text>
<path d="M678 448 H779" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="728" y="430" font-size="14" fill="#6B675C" text-anchor="middle">保留边界</text>
<path d="M929 258 V358" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="929" y="387" font-size="16" fill="#6B675C" text-anchor="middle">tail[0]</text>
<rect x="886" y="404" width="86" height="88" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="929" y="437" font-size="16" fill="#2C4460" text-anchor="middle">i=101</text>
<text x="929" y="470" font-size="16" fill="#2C4460" text-anchor="middle">term=7</text>
<path d="M1025 258 V358" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="1025" y="387" font-size="16" fill="#6B675C" text-anchor="middle">tail[1]</text>
<rect x="982" y="404" width="86" height="88" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="1025" y="437" font-size="16" fill="#2C4460" text-anchor="middle">i=102</text>
<text x="1025" y="470" font-size="16" fill="#2C4460" text-anchor="middle">term=8</text>
<path d="M1121 258 V358" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="1121" y="387" font-size="16" fill="#6B675C" text-anchor="middle">tail[2]</text>
<rect x="1078" y="404" width="86" height="88" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="1121" y="437" font-size="16" fill="#2C4460" text-anchor="middle">i=103</text>
<text x="1121" y="470" font-size="16" fill="#2C4460" text-anchor="middle">term=8</text>
<text x="1025" y="519" font-size="15" fill="#6B675C" text-anchor="middle">真实后缀：101…103</text>
<line x1="48" y1="558" x2="1192" y2="558" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="64" y="589" font-size="17" fill="#2B2A26" font-weight="700">term(100) = 7</text>
<text x="440" y="589" font-size="17" fill="#2B2A26" font-weight="700">firstIndex = 101</text>
<text x="830" y="589" font-size="17" fill="#2B2A26" font-weight="700">tail[0] ↔ index 101</text>
</svg>
