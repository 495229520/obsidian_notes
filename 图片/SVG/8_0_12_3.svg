<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">一层隔离，只消除一类干扰</title><desc id="desc">一个三列表格把五类干扰映射到控制机制和验证方法，底部展示仍可能存在的固件与硬件共享。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">一层隔离，只消除一类干扰</text>
<text x="48" y="77" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">分开验证调度、IRQ、tick、RCU 与硬件；不要用一个“isolated”标签覆盖所有层。</text>
<rect x="40" y="108" width="1160" height="55" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="63" y="142" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">来源 / 问题</text>
<text x="357" y="142" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">控制机制</text>
<text x="777" y="142" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">验证与边界</text>
<rect x="40" y="178" width="1160" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="40" y="178" width="8" height="62" rx="0" fill="#3D5A80" stroke="#3D5A80" stroke-width="1.3"/>
<text x="64" y="214" font-size="14" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">调度竞争 / 自动迁移</text>
<text x="357" y="214" font-size="14" font-weight="500" fill="#2C4460" text-anchor="start" data-role="body">cpuset isolated partition</text>
<text x="777" y="214" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">partition 有效 + effective 集合</text>
<rect x="40" y="248" width="1160" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="40" y="248" width="8" height="62" rx="0" fill="#8A6A3A" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="64" y="284" font-size="14" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">设备 IRQ / 网络处理</text>
<text x="357" y="284" font-size="14" font-weight="500" fill="#6B4E28" text-anchor="start" data-role="body">IRQ affinity + steering</text>
<text x="777" y="284" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">计数增量；managed IRQ 尽力调整</text>
<rect x="40" y="318" width="1160" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="40" y="318" width="8" height="62" rx="0" fill="#2F6B5E" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="64" y="354" font-size="14" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">周期调度 tick</text>
<text x="357" y="354" font-size="14" font-weight="500" fill="#24473F" text-anchor="start" data-role="body">nohz_full + 运行条件</text>
<text x="777" y="354" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">单 runnable；排查 tick 依赖</text>
<rect x="40" y="388" width="1160" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="40" y="388" width="8" height="62" rx="0" fill="#6B5B95" stroke="#6B5B95" stroke-width="1.3"/>
<text x="64" y="424" font-size="14" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">RCU callback</text>
<text x="357" y="424" font-size="14" font-weight="500" fill="#4A3F68" text-anchor="start" data-role="body">callback offload + 线程放置</text>
<text x="777" y="424" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">不是关闭 RCU；维护核要有预算</text>
<rect x="40" y="458" width="1160" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="40" y="458" width="8" height="62" rx="0" fill="#3D5A80" stroke="#3D5A80" stroke-width="1.3"/>
<text x="64" y="494" font-size="14" font-weight="600" fill="#2B2A26" text-anchor="start" data-role="body">unbound / per-CPU 工作</text>
<text x="357" y="494" font-size="14" font-weight="500" fill="#2C4460" text-anchor="start" data-role="body">分区约束 + 按来源处理</text>
<text x="777" y="494" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">unbound 可排除；绑定工作另查</text>
<rect x="42" y="548" width="266" height="45" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="175.0" y="575.5" font-size="15" font-weight="600" fill="#733428" text-anchor="middle" data-role="body">SMT / LLC 竞争</text>
<rect x="334" y="548" width="266" height="45" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="467.0" y="575.5" font-size="15" font-weight="600" fill="#733428" text-anchor="middle" data-role="body">内存 / PCIe 争用</text>
<rect x="626" y="548" width="266" height="45" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="759.0" y="575.5" font-size="15" font-weight="600" fill="#733428" text-anchor="middle" data-role="body">固件 SMI / 平台事件</text>
<rect x="918" y="548" width="282" height="45" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="1059.0" y="575.5" font-size="15" font-weight="600" fill="#733428" text-anchor="middle" data-role="body">虚拟化宿主调度</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="642" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">当前文档：有效 cpuset isolated partition 会排除 unbound workqueues；普通 cpuset 不能直接等同。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">残余风险没有被这些软件开关全部覆盖；参数存在、写入成功与负载下真正生效是三种证据。</text>
</svg>