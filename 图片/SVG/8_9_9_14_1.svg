<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">数据保护看边界：控制通道、RDMA 载荷与静态对象分别检查</title>
<desc id="desc">三条独立泳道分别表示控制RPC、GPU/RDMA数据路径、客户端加密后的静态对象。控制面的mTLS不覆盖独立的RDMA载荷，静态密文也不保护运行时明文。</desc>
<defs>
<marker id="arr-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A7EA4"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<text id="t0" x="48" y="49" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">数据保护看边界：控制通道、RDMA 载荷与静态对象分别检查</text>
<text id="t1" x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">加密在哪里开始、解密在哪里结束？服务身份、访问授权与载荷保护不能混为一谈。</text>
<rect x="48" y="109" width="1144" height="138" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t2" x="64" y="135" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start" data-role="section">A · 控制面</text>
<text id="t3" x="66" y="167" font-size="14" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">服务身份</text>
<text id="t4" x="66" y="190" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">仍需业务授权</text>
<rect x="217" y="156" width="174" height="61" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t5" x="304.0" y="182.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">训练作业</text>
<text id="t6" x="304.0" y="204.5" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">gRPC 客户端</text>
<rect x="526" y="156" width="182" height="61" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text id="t7" x="617.0" y="182.5" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">网关 / 代理</text>
<text id="t8" x="617.0" y="204.5" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">TLS 在此终止</text>
<rect x="850" y="156" width="192" height="61" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t9" x="946.0" y="182.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">后端服务</text>
<text id="t10" x="946.0" y="204.5" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">对象 ACL / 租户策略</text>
<line x1="395" y1="185" x2="522" y2="185" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arr-green)"/>
<text id="t11" x="456" y="170" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">mTLS</text>
<line x1="712" y1="185" x2="846" y2="185" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arr-green)"/>
<text id="t12" x="779" y="170" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle" data-role="body">重新建连</text>
<text id="t13" x="1067" y="174" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">两跳保护</text>
<text id="t14" x="1067" y="198" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">不含旁路载荷</text>
<rect x="48" y="259" width="1144" height="153" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t15" x="64" y="285" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="section">B · GPU / RDMA 数据面</text>
<text id="t16" x="66" y="324" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="body">独立数据路径</text>
<text id="t17" x="66" y="347" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">rkey ≠ 加密密钥</text>
<rect x="217" y="307" width="174" height="63" rx="8" fill="#EDEAF3" stroke="#8A7EA4" stroke-width="1.2"/>
<text id="t18" x="304.0" y="334.5" font-size="15" font-weight="700" fill="#6B5B95" text-anchor="middle" data-role="body">GPU ↔ RNIC</text>
<text id="t19" x="304.0" y="356.5" font-size="13" font-weight="400" fill="#6B5B95" text-anchor="middle" data-role="body">注册内存 / DMA</text>
<rect x="526" y="307" width="182" height="63" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text id="t20" x="617.0" y="334.5" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">RoCE Fabric</text>
<text id="t21" x="617.0" y="356.5" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">链路与隧道边界</text>
<rect x="850" y="307" width="192" height="63" rx="8" fill="#EDEAF3" stroke="#8A7EA4" stroke-width="1.2"/>
<text id="t22" x="946.0" y="334.5" font-size="15" font-weight="700" fill="#6B5B95" text-anchor="middle" data-role="body">RNIC ↔ GPU</text>
<text id="t23" x="946.0" y="356.5" font-size="13" font-weight="400" fill="#6B5B95" text-anchor="middle" data-role="body">接收与消费边界</text>
<line x1="395" y1="338" x2="522" y2="338" stroke="#8A6A3A" stroke-width="1.7" marker-end="url(#arr-amber)"/>
<line x1="712" y1="338" x2="846" y2="338" stroke="#8A6A3A" stroke-width="1.7" marker-end="url(#arr-amber)"/>
<text id="t24" x="456" y="322" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle" data-role="body">载荷</text>
<text id="t25" x="779" y="322" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle" data-role="body">载荷</text>
<text id="t26" x="1067" y="326" font-size="13" font-weight="700" fill="#733428" text-anchor="start" data-role="body">不能继承</text>
<text id="t27" x="1067" y="348" font-size="12" font-weight="400" fill="#733428" text-anchor="start" data-role="body">上方的 TLS</text>
<text id="t28" x="218" y="393" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="start" data-role="body">候选：适配路径的 IPsec / MACsec / 应用 AEAD</text>
<text id="t29" x="796" y="393" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">逐项核对：网卡 · 固件 · 栈 · 端点</text>
<rect x="48" y="424" width="1144" height="170" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t30" x="64" y="450" font-size="15" font-weight="700" fill="#24473F" text-anchor="start" data-role="section">C · 静态对象与使用中数据</text>
<text id="t31" x="66" y="491" font-size="14" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">客户端加密模型</text>
<text id="t32" x="66" y="515" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">非所有部署默认</text>
<rect x="217" y="475" width="174" height="61" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text id="t33" x="304.0" y="501.5" font-size="15" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">应用明文 P</text>
<text id="t34" x="304.0" y="523.5" font-size="13" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">使用中 / in use</text>
<rect x="526" y="475" width="182" height="61" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text id="t35" x="617.0" y="501.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">DEK + AEAD</text>
<text id="t36" x="617.0" y="523.5" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">客户端保护边界</text>
<rect x="850" y="475" width="192" height="61" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text id="t37" x="946.0" y="501.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">存储与备份</text>
<text id="t38" x="946.0" y="523.5" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">C + tag + 包装 DEK</text>
<line x1="395" y1="505" x2="522" y2="505" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr-neutral)"/>
<line x1="712" y1="505" x2="846" y2="505" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arr-green)"/>
<text id="t39" x="1067" y="493" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">介质泄漏</text>
<text id="t40" x="1067" y="516" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">不直接给明文</text>
<text id="t41" x="219" y="567" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">进程 / GPU 内存：另评估隔离与 TEE</text>
<text id="t42" x="704" y="567" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">KMS：授权使用 KEK，不传输整份 Checkpoint</text>
<rect x="48" y="618" width="1144" height="54" rx="7" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t43" x="64" y="641" font-size="14" font-weight="700" fill="#4A473F" text-anchor="start" data-role="footer">边界提醒：mTLS ≠ 任意访问授权；静态加密 ≠ 运行时隔离；加密 ≠ 可恢复性。</text>
<text id="t44" x="64" y="662" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">教学架构示意 · 非实测 · 保护能力取决于具体协议端点、设备及配置 · 对应笔记 §1、§2、§7</text>
</svg>