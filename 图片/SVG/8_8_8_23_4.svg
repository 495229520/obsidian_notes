<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<title id="title">完成与超时分两条路：观察截止，不等于硬件停止</title>
<desc id="desc">左侧展示WAITING和TIMEOUT观察分支，右侧展示成功失败计数收敛门和batch回收，底部保持buffer生命周期。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="720" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">完成与超时分两条路：观察截止，不等于硬件停止</text>
<text x="48" y="76" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">最终回收许可来自在途引用消失，而不是一个业务 deadline</text>
<line x1="48" y1="96" x2="1192" y2="96" stroke="#D8D5C8" stroke-width="1"/>
<text x="68" y="127" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">A · 观察者的决定</text>
<text x="652" y="127" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">B · 物理任务的收敛</text>
<rect x="82" y="152" width="448" height="67" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="306.0" y="179.75" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">submitTransfer 返回</text>
<text x="306.0" y="201.75" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">部分工作可能已经交付</text>
<rect x="82" y="268" width="200" height="66" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="182.0" y="294.9" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">WAITING</text>
<text x="182.0" y="316.9" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">继续观察</text>
<rect x="330" y="268" width="200" height="66" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="430.0" y="294.55" font-size="13" fill="#733428" text-anchor="middle" font-weight="700" data-role="body">TIMEOUT / deadline</text>
<text x="430.0" y="316.55" font-size="13" fill="#733428" text-anchor="middle" font-weight="400" data-role="body">不授予回收许可</text>
<line x1="182" y1="221" x2="182" y2="265" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="430,221 430,265" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="307" y="247" font-size="12" fill="#A64B3C" text-anchor="start" font-weight="400" data-role="body">时间到</text>
<rect x="652" y="153" width="506" height="76" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="905.0" y="185.6" font-size="16" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">success + failed == slice_count</text>
<text x="905.0" y="207.6" font-size="16" fill="#4A3F68" text-anchor="middle" font-weight="400" data-role="body">全部 slices 已进入终态？</text>
<rect x="652" y="290" width="230" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="767.0" y="315.9" font-size="14" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">failed == 0</text>
<text x="767.0" y="337.9" font-size="14" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">COMPLETED</text>
<rect x="928" y="290" width="230" height="64" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="1043.0" y="315.9" font-size="14" fill="#733428" text-anchor="middle" font-weight="700" data-role="body">failed &gt; 0</text>
<text x="1043.0" y="337.9" font-size="14" fill="#733428" text-anchor="middle" font-weight="400" data-role="body">FAILED</text>
<polyline points="905,231 905,260 767,260 767,287" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="905,260 1043,260 1043,287" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="700" y="405" width="410" height="65" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="905.0" y="431.4" font-size="14" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">全部 task finished</text>
<text x="905.0" y="453.4" font-size="14" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">freeBatchID 成功后句柄失效</text>
<polyline points="767,356 767,383 905,383 905,402" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="1043,356 1043,383 905,383" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="82" y="408" width="448" height="62" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
<text x="306.0" y="432.9" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">继续持有：batch / entries / buffer</text>
<text x="306.0" y="454.9" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="400" data-role="body">不能因停止等待就提前释放</text>
<line x1="182" y1="336" x2="182" y2="405" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="430" y1="336" x2="430" y2="405" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="275,336 275,364 588,364 588,192 649,192" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="578" y="390" font-size="12" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">CQ / 重试持续推进</text>
<text x="80" y="528" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">内存回收的第二道门：其他本地任务与所有 peer 的引用也必须消失</text>
<rect x="80" y="557" width="290" height="49" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text x="225.0" y="586.4" font-size="14" fill="#4A473F" text-anchor="middle" font-weight="700" data-role="body">停止新提交 / 协调远端</text>
<rect x="404" y="557" width="360" height="49" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
<text x="584.0" y="586.4" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">确认不再访问 → 注销 MR</text>
<rect x="798" y="557" width="360" height="49" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="978.0" y="586.4" font-size="14" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">最后才释放 / 复用 buffer</text>
<line x1="372" y1="581" x2="401" y2="581" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="766" y1="581" x2="795" y2="581" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="48" y1="650" x2="1192" y2="650" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="676" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">FAILED 可能携带部分成功字节；它不是事务回滚，也不保证成功范围是连续前缀。</text>
<text x="48" y="697" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">classic closeSegment() 不保证远端注销或请求排空。</text>
</svg>