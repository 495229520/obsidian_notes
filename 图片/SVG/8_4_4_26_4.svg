<text x="88" y="509" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">MAC → FCS = 4156 + 14 + 4 + 4</text>
<text x="88" y="544" font-size="17" fill="#24473F" font-weight="700" text-anchor="start" data-zone="body">含单 VLAN、含 FCS：4178 B</text>
<text x="88" y="575" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">同一数据量换 IPv6：IP 4176 B；帧 4198 B</text>
