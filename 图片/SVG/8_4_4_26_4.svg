<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="title">左：WRITE Only 单包预算；右：多包 WRITE 分段 · 单 VLAN、无隧道、无 IP 扩展、数据 4 B 对齐</text>
