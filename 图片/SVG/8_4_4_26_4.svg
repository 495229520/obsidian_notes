<title id="title">MTU 预算与 RDMA 分段：四本账分别计算</title>
<desc id="desc">左：WRITE Only 单包预算；右：多包 WRITE 分段 · 单 VLAN、无隧道、无 IP 扩展、数据 4 B 对齐</desc>
