<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<title id="title">两套对象树：可发现的内存，与可回收的传输批次</title>
<desc id="desc">左侧是Segment包含多个注册buffer和每设备key，右侧是Batch拥有Task和Slice。底部标明请求描述和缓冲区必须保持存活。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="720" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">两套对象树：可发现的内存，与可回收的传输批次</text>
<text x="48" y="76" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">左：地址与访问范围；右：提交、完成与拥有关系。</text>
<line x1="48" y1="96" x2="1192" y2="96" stroke="#D8D5C8" stroke-width="1"/>
<text x="68" y="126" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">A · 地址与访问描述</text>
<text x="644" y="126" font-size="15" fill="#4A473F" text-anchor="start" font-weight="700" data-role="section">B · 传输与完成对象</text>
<rect x="60" y="143" width="540" height="442" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<rect x="634" y="143" width="546" height="442" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<rect x="86" y="162" width="488" height="67" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="330.0" y="189.75" font-size="15" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">SegmentDesc</text>
<text x="330.0" y="211.75" font-size="15" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">名称 · devices · buffers</text>
<rect x="95" y="275" width="210" height="82" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="200.0" y="298.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">Buffer / MR 0</text>
<text x="200.0" y="320.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">addr · length</text>
<text x="200.0" y="342.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">按 NIC 匹配 key</text>
<rect x="335" y="275" width="210" height="82" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="440.0" y="298.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">Buffer / MR 1</text>
<text x="440.0" y="320.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">addr · length</text>
<text x="440.0" y="342.55" font-size="13" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body">相邻不等于同一 MR</text>
<polyline points="330,231 330,250 200,250 200,272" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="330,250 440,250 440,272" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="96" y="393" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">一个 buffer，多设备注册</text>
<rect x="95" y="409" width="450" height="42" rx="3" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="118" y="436" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">NIC 0</text>
<text x="258" y="436" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">lkey[0]</text>
<text x="416" y="436" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">rkey[0]</text>
<rect x="95" y="458" width="450" height="42" rx="3" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="118" y="485" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">NIC 1</text>
<text x="258" y="485" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">lkey[1]</text>
<text x="416" y="485" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">rkey[1]</text>
<text x="96" y="542" font-size="13" fill="#2F6B5E" text-anchor="start" font-weight="400" data-role="body">SegmentID 是当前引擎的解析句柄</text>
<rect x="658" y="162" width="498" height="67" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="907.0" y="189.75" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">BatchDesc</text>
<text x="907.0" y="211.75" font-size="15" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">容量 / task_list / 回收边界</text>
<rect x="660" y="275" width="218" height="65" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="769.0" y="301.05" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">TransferTask 0</text>
<text x="769.0" y="323.05" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">request → 调用方 entries</text>
<rect x="916" y="275" width="238" height="65" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="1035.0" y="301.05" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">TransferTask 1</text>
<text x="1035.0" y="323.05" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="400" data-role="body">slice 计数 / 字节计数</text>
<polyline points="906,231 906,250 769,250 769,272" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="906,250 1035,250 1035,272" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="658" y="386" width="66" height="46" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="691.0" y="413.9" font-size="14" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">S0</text>
<rect x="732" y="386" width="66" height="46" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="765.0" y="413.9" font-size="14" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">S1</text>
<rect x="806" y="386" width="66" height="46" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="839.0" y="413.9" font-size="14" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">S2</text>
<rect x="925" y="386" width="214" height="46" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
<text x="1032.0" y="413.9" font-size="14" fill="#4A3F68" text-anchor="middle" font-weight="700" data-role="body">Slice 0 … n</text>
<polyline points="769,342 769,362 764,362 764,383" fill="none" stroke="#5A564B" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<line x1="1035" y1="342" x2="1035" y2="383" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="665" y="465" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">Slice → 地址 / key / 路径 / 重试</text>
<text x="665" y="493" font-size="13" fill="#A64B3C" text-anchor="start" font-weight="700" data-role="body">BatchID 编码本进程 BatchDesc 指针</text>
<text x="665" y="542" font-size="13" fill="#3D5A80" text-anchor="start" font-weight="400" data-role="body">Batch 不是原子事务，也不是一次门铃</text>
<rect x="80" y="598" width="1080" height="46" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
<text x="620.0" y="625.9" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">调用方持有 entries 与 buffer：在途期间不销毁、不扩容、不复用</text>
<line x1="48" y1="650" x2="1192" y2="650" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="676" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">普通提交：request → task → slices；不含分组 scatter。</text>
<text x="48" y="697" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">opaque 句柄并不自动带来安全生命周期：释放后的 BatchID 不得再次查询。</text>
</svg>