<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 892" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Nagle 与延迟确认互等造成的 40 毫秒停顿</title>
  <desc>上半是一次 write-write-read 请求被卡住 40 毫秒的完整时间线；中间用二维表说明只有「写两次 + 对端延迟确认」这一格会出事；下半列出三条修法和各自代价。</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="892" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">那 40 毫秒从哪来：Nagle 在等 ACK，对面在等数据</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">两边都没有违反协议，谁也不该先动；真正点燃它的是 write-write-read 这个写法</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="102" width="1144" height="364" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 一次「4 字节长度头 + 396 字节正文」的请求，被卡住 40 毫秒</text>

  <rect x="330" y="148" width="570" height="290" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="615" y="168" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">40 ms · 两边都不动</text>

  <rect x="345" y="182" width="310" height="32" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="360" y="203" font-size="11.5" fill="#733428">队列里压着 396B 发不出去</text>
  <text x="680" y="203" font-size="11" fill="#6B675C">在途有未确认的小段，Nagle 不放行</text>

  <text x="72" y="244" font-size="12" font-weight="700" fill="#4A473F">发送端</text>
  <text x="180" y="232" font-size="11" fill="#2C4460" text-anchor="middle">write① 4B 头</text>
  <text x="345" y="232" font-size="11" fill="#733428">write② 396B 正文</text>
  <text x="990" y="232" font-size="11" fill="#24473F">收到 ACK，放行</text>
  <line x1="140" y1="248" x2="1168" y2="248" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="180" y1="238" x2="180" y2="258" stroke="#3D5A80" stroke-width="1.6"/>
  <line x1="345" y1="238" x2="345" y2="258" stroke="#A64B3C" stroke-width="1.6"/>
  <line x1="1000" y1="238" x2="1000" y2="258" stroke="#2F6B5E" stroke-width="1.6"/>

  <line x1="188" y1="248" x2="328" y2="370" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="248" y="306" font-size="10.5" fill="#2C4460">seg① 4B</text>
  <line x1="900" y1="372" x2="988" y2="250" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrg)"/>
  <text x="912" y="306" font-size="10.5" fill="#24473F">ACK</text>
  <line x1="1008" y1="248" x2="1098" y2="370" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="1092" y="306" font-size="10.5" fill="#2C4460" text-anchor="end">seg② 396B</text>

  <text x="72" y="376" font-size="12" font-weight="700" fill="#4A473F">接收端</text>
  <line x1="140" y1="372" x2="1168" y2="372" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="330" y1="362" x2="330" y2="382" stroke="#3D5A80" stroke-width="1.6"/>
  <line x1="900" y1="362" x2="900" y2="382" stroke="#8A6A3A" stroke-width="1.6"/>
  <text x="336" y="394" font-size="11" fill="#24473F">只收到 4B</text>
  <text x="905" y="394" font-size="11" fill="#6B4E28">延迟确认到点</text>
  <text x="1104" y="394" font-size="11" fill="#24473F" text-anchor="end">凑齐 400B</text>
  <rect x="336" y="402" width="310" height="32" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="351" y="423" font-size="11.5" fill="#6B4E28">应用在等满 400B，不回包</text>
  <text x="672" y="423" font-size="11" fill="#6B675C">没有数据可以捎，ACK 也压着</text>

  <text x="180" y="456" font-size="10" fill="#6B675C" text-anchor="middle">0 ms</text>
  <text x="900" y="456" font-size="10" fill="#6B675C" text-anchor="middle">40 ms</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="484" width="1144" height="196" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="506" font-size="15" font-weight="700" fill="#4A473F">B · 四种组合里，只有一格会出事</text>

  <text x="586" y="530" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">接收端立刻回 ACK</text>
  <text x="978" y="530" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">接收端延迟确认（默认）</text>

  <rect x="72" y="540" width="310" height="60" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="92" y="564" font-size="12" font-weight="700" fill="#4A473F">写两次：先头后体</text>
  <text x="92" y="586" font-size="11" fill="#6B675C">write-write-read</text>
  <rect x="396" y="540" width="380" height="60" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="586" y="566" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">不卡</text>
  <text x="586" y="588" font-size="11" fill="#24473F" text-anchor="middle">ACK 立刻回来，Nagle 马上放行</text>
  <rect x="788" y="540" width="380" height="60" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.8"/>
  <text x="978" y="566" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">卡 40 ms</text>
  <text x="978" y="588" font-size="11" fill="#733428" text-anchor="middle">两边互等，只有这一格出事</text>

  <rect x="72" y="608" width="310" height="60" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="92" y="632" font-size="12" font-weight="700" fill="#4A473F">写一次：writev 合并</text>
  <text x="92" y="654" font-size="11" fill="#6B675C">一个报文带完整请求</text>
  <rect x="396" y="608" width="380" height="60" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="586" y="634" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">不卡</text>
  <text x="586" y="656" font-size="11" fill="#24473F" text-anchor="middle">接收端一次拿到完整请求</text>
  <rect x="788" y="608" width="380" height="60" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="978" y="634" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">不卡</text>
  <text x="978" y="656" font-size="11" fill="#24473F" text-anchor="middle">应用立刻回包，ACK 顺路捎上</text>

  <!-- ============ Panel C ============ -->
  <rect x="48" y="698" width="1144" height="170" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="720" font-size="15" font-weight="700" fill="#4A473F">C · 三条修法，优先改最上面那条</text>

  <rect x="72" y="732" width="352" height="118" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="92" y="756" font-size="12.5" font-weight="700" fill="#24473F">① 合并成一次写</text>
  <text x="92" y="778" font-size="11.5" fill="#24473F">writev，或先拼进一个缓冲区</text>
  <text x="92" y="800" font-size="11.5" fill="#24473F">接收端一次拿到完整请求</text>
  <text x="92" y="822" font-size="11.5" fill="#24473F">根治，两个选项都不用动</text>
  <text x="92" y="842" font-size="11" fill="#6B675C">代价：要改应用的写法</text>

  <rect x="444" y="732" width="352" height="118" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="464" y="756" font-size="12.5" font-weight="700" fill="#2C4460">② 发送端 TCP_NODELAY</text>
  <text x="464" y="778" font-size="11.5" fill="#2C4460">小段不再排队，立刻发出</text>
  <text x="464" y="800" font-size="11.5" fill="#2C4460">对端的延迟确认照样存在</text>
  <text x="464" y="822" font-size="11.5" fill="#2C4460">包数变多，头部开销上升</text>
  <text x="464" y="842" font-size="11" fill="#6B675C">代价：拿带宽换延迟</text>

  <rect x="816" y="732" width="352" height="118" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="836" y="756" font-size="12.5" font-weight="700" fill="#6B4E28">③ 接收端 TCP_QUICKACK</text>
  <text x="836" y="778" font-size="11.5" fill="#6B4E28">让这一侧先不延迟确认</text>
  <text x="836" y="800" font-size="11.5" fill="#6B4E28">内核过一阵会自己切回去</text>
  <text x="836" y="822" font-size="11.5" fill="#6B4E28">每次读之后都要重新设</text>
  <text x="836" y="842" font-size="11" fill="#6B675C">代价：不粘，最不可靠</text>
</svg>
