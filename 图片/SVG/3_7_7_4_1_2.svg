<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>一次 AddViaRpc 调用的七层路径与线路字节</title>
  <desc>全宽主图按业务、消息、调用、帧、帧头、字节IO、TCP七层并列展示客户端下行与服务端上行，每一行中部标出该层实际处理的对象；底部用放大的十六进制字段条展示Add(3,4)请求22字节与响应18字节，并以body_len、request_id、code三个协议不变量收口。</desc>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="rgb(245, 244, 237)"/>

  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">一次 AddViaRpc(3, 4) 怎么穿过七层：左边下行，右边上行</text>
  <text x="48" y="78" font-size="13.5" fill="#6B675C">每层只理解一种对象：业务值 → 消息体 → RPC 调用 → 帧 → 帧头 → 字节 → TCP 字节流</text>

  <rect x="48" y="102" width="1144" height="466" rx="8"
        fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="66" y="130" font-size="14" font-weight="700" fill="#4A473F">A · 代码路径：同一次请求在不同层有不同名字</text>

  <text x="350" y="158" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">客户端 · 请求向下封装 ↓</text>
  <text x="620" y="158" font-size="12" font-weight="700" fill="#6B675C" text-anchor="middle">这一层实际处理什么</text>
  <text x="890" y="158" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">服务端 · 请求向上还原 ↑</text>

  <rect x="62" y="170" width="1116" height="100" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="62" y="276" width="1116" height="100" rx="8" fill="#F3EFE6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="62" y="382" width="1116" height="100" rx="8" fill="#EFEDF5" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="62" y="488" width="1116" height="58" rx="8" fill="#E7EFE9" stroke="#D8D5C8" stroke-width="1"/>

  <line x1="152" y1="178" x2="152" y2="512" stroke="#3D5A80" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <line x1="1088" y1="512" x2="1088" y2="178" stroke="#2F6B5E" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <rect x="74" y="180" width="68" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="108" y="197" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 业务</text>
  <text x="108" y="213" font-size="10.5" fill="#2C4460" text-anchor="middle">调用者</text>

  <rect x="170" y="176" width="350" height="48" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="188" y="196" font-size="13.5" font-weight="700" fill="#2C4460">AddViaRpc(client, a, b)</text>
  <text x="188" y="215" font-size="11.2" fill="#2C4460">接收 a、b；同步等待最终的 sum</text>

  <rect x="538" y="182" width="164" height="36" rx="8" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.2"/>
  <text x="620" y="202" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">a、b / sum</text>

  <rect x="720" y="176" width="350" height="48" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="738" y="196" font-size="13.5" font-weight="700" fill="#24473F">RegisterAdd 的 handler</text>
  <text x="738" y="215" font-size="11.2" fill="#24473F">解出参数，检查溢出，计算 a + b</text>

  <rect x="74" y="230" width="68" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="108" y="247" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">② 消息</text>
  <text x="108" y="263" font-size="10.5" fill="#2C4460" text-anchor="middle">schema</text>

  <rect x="170" y="226" width="350" height="48" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="188" y="246" font-size="13.5" font-weight="700" fill="#2C4460">AppendU32(args, value)</text>
  <text x="188" y="265" font-size="11.2" fill="#2C4460">两个 uint32_t → 8 B 网络序消息体</text>

  <rect x="538" y="232" width="164" height="36" rx="8" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.2"/>
  <text x="620" y="247" font-size="12.2" font-weight="700" fill="#4A473F" text-anchor="middle">Bytes body</text>
  <text x="620" y="262" font-size="10.5" fill="#6B675C" text-anchor="middle">请求 8 B / 响应 4 B</text>

  <rect x="720" y="226" width="350" height="48" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="738" y="246" font-size="13.5" font-weight="700" fill="#24473F">ReadU32(input_span)</text>
  <text x="738" y="265" font-size="11.2" fill="#24473F">每 4 B 网络序字段 → 一个 uint32_t</text>

  <rect x="74" y="286" width="68" height="40" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="108" y="303" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">③ 调用</text>
  <text x="108" y="319" font-size="10.5" fill="#6B4E28" text-anchor="middle">关联</text>

  <rect x="170" y="282" width="350" height="48" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="188" y="302" font-size="13.5" font-weight="700" fill="#2C4460">RpcClient::Call(method, args)</text>
  <text x="188" y="321" font-size="11.2" fill="#2C4460">分配 request_id；发送后阻塞等响应</text>

  <rect x="538" y="288" width="164" height="36" rx="8" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.2"/>
  <text x="620" y="303" font-size="12.2" font-weight="700" fill="#4A473F" text-anchor="middle">id + code + body</text>
  <text x="620" y="318" font-size="10.5" fill="#6B675C" text-anchor="middle">一次 RPC 调用</text>

  <rect x="720" y="282" width="350" height="48" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="738" y="302" font-size="13.5" font-weight="700" fill="#24473F">ServeConnection → Dispatch</text>
  <text x="738" y="321" font-size="11.2" fill="#24473F">按 method 找 handler；业务异常转状态码</text>

  <rect x="74" y="336" width="68" height="40" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="108" y="353" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">④ 帧</text>
  <text x="108" y="369" font-size="10.5" fill="#6B4E28" text-anchor="middle">定界</text>

  <rect x="170" y="332" width="350" height="48" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="188" y="352" font-size="13.5" font-weight="700" fill="#2C4460">SendFrame(fd, type, id, code, body)</text>
  <text x="188" y="371" font-size="11.2" fill="#2C4460">14 B 帧头 + body，形成一条完整消息</text>

  <rect x="538" y="338" width="164" height="36" rx="8" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.2"/>
  <text x="620" y="353" font-size="12.2" font-weight="700" fill="#4A473F" text-anchor="middle">Frame</text>
  <text x="620" y="368" font-size="10.5" fill="#6B675C" text-anchor="middle">header + body</text>

  <rect x="720" y="332" width="350" height="48" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="738" y="352" font-size="13.5" font-weight="700" fill="#24473F">ReadFrame(fd)</text>
  <text x="738" y="371" font-size="11.2" fill="#24473F">先读满 14 B 头，再按 body_len 读体</text>

  <rect x="74" y="392" width="68" height="40" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="108" y="409" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">⑤ 帧头</text>
  <text x="108" y="425" font-size="10.5" fill="#4A3F68" text-anchor="middle">字节序</text>

  <rect x="170" y="388" width="350" height="48" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="188" y="408" font-size="13.5" font-weight="700" fill="#2C4460">EncodeHeader(FrameHeader)</text>
  <text x="188" y="427" font-size="11.2" fill="#2C4460">逐字段转大端；固定写入 14 B 偏移</text>

  <rect x="538" y="394" width="164" height="36" rx="8" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.2"/>
  <text x="620" y="409" font-size="12.2" font-weight="700" fill="#4A473F" text-anchor="middle">raw_header[14]</text>
  <text x="620" y="424" font-size="10.5" fill="#6B675C" text-anchor="middle">固定线路布局</text>

  <rect x="720" y="388" width="350" height="48" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="738" y="408" font-size="13.5" font-weight="700" fill="#24473F">DecodeHeader(raw_header)</text>
  <text x="738" y="427" font-size="11.2" fill="#24473F">转主机序；校验 magic、version、上限</text>

  <rect x="74" y="442" width="68" height="40" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="108" y="459" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">⑥ I/O</text>
  <text x="108" y="475" font-size="10.5" fill="#4A3F68" text-anchor="middle">精确收发</text>

  <rect x="170" y="438" width="350" height="48" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="188" y="458" font-size="13.5" font-weight="700" fill="#2C4460">WriteAll(fd, wire)</text>
  <text x="188" y="477" font-size="11.2" fill="#2C4460">短写就继续；EINTR 重试；EPIPE 终止</text>

  <rect x="538" y="444" width="164" height="36" rx="8" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.2"/>
  <text x="620" y="459" font-size="12.2" font-weight="700" fill="#4A473F" text-anchor="middle">连续 byte span</text>
  <text x="620" y="474" font-size="10.5" fill="#6B675C" text-anchor="middle">只关心长度</text>

  <rect x="720" y="438" width="350" height="48" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="738" y="458" font-size="13.5" font-weight="700" fill="#24473F">ReadExactly(fd, out)</text>
  <text x="738" y="477" font-size="11.2" fill="#24473F">循环读满；区分 Complete / Eof / Truncated</text>

  <rect x="74" y="497" width="68" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="108" y="514" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">⑦ TCP</text>
  <text x="108" y="530" font-size="10.5" fill="#24473F" text-anchor="middle">内核</text>

  <rect x="170" y="494" width="900" height="46" rx="8" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.5"/>
  <text x="620" y="513" font-size="13.5" font-weight="700" fill="#4A473F" text-anchor="middle">TCP 只提供按序、可靠的字节流，不保留应用层消息边界</text>
  <text x="620" y="531" font-size="11.2" fill="#6B675C" text-anchor="middle">一次 send 不等于一次 read；真正的帧边界只能由 body_len 恢复</text>

  <text x="620" y="559" font-size="11.2" fill="#6B675C" text-anchor="middle">响应沿同一条链反向返回，最终得到 sum = 7</text>

  <rect x="48" y="586" width="1144" height="236" rx="8"
        fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="66" y="614" font-size="14" font-weight="700" fill="#4A473F">B · 线路字节：同一份 14 B 帧头，request 与 response 只改变字段取值</text>

  <text x="176" y="642" font-size="10.5" fill="#9B968A">0</text>
  <text x="256" y="642" font-size="10.5" fill="#9B968A">2</text>
  <text x="296" y="642" font-size="10.5" fill="#9B968A">3</text>
  <text x="336" y="642" font-size="10.5" fill="#9B968A">4</text>
  <text x="496" y="642" font-size="10.5" fill="#9B968A">8</text>
  <text x="576" y="642" font-size="10.5" fill="#9B968A">10</text>
  <text x="736" y="642" font-size="10.5" fill="#9B968A">14</text>
  <text x="896" y="642" font-size="10.5" fill="#9B968A">18</text>
  <text x="1056" y="642" font-size="10.5" fill="#9B968A">22</text>

  <text x="66" y="674" font-size="12.5" font-weight="700" fill="#2C4460">请求</text>
  <text x="66" y="693" font-size="11" fill="#6B675C">22 B</text>

  <rect x="176" y="650" width="80" height="42" rx="6" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.3"/>
  <text x="216" y="675" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#4A473F" text-anchor="middle">52 43</text>
  <text x="216" y="711" font-size="10.5" fill="#6B675C" text-anchor="middle">magic</text>

  <rect x="256" y="650" width="40" height="42" rx="6" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.3"/>
  <text x="276" y="675" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#4A473F" text-anchor="middle">01</text>
  <text x="276" y="711" font-size="10.5" fill="#6B675C" text-anchor="middle">ver</text>

  <rect x="296" y="650" width="40" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="316" y="675" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2C4460" text-anchor="middle">01</text>
  <text x="316" y="711" font-size="10.5" fill="#2C4460" text-anchor="middle">Request</text>

  <rect x="336" y="650" width="160" height="42" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="416" y="675" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#6B4E28" text-anchor="middle">00 00 00 01</text>
  <text x="416" y="711" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">request_id = 1</text>

  <rect x="496" y="650" width="80" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="536" y="675" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2C4460" text-anchor="middle">00 01</text>
  <text x="536" y="711" font-size="10.5" fill="#2C4460" text-anchor="middle">method Add</text>

  <rect x="576" y="650" width="160" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="656" y="675" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">00 00 00 08</text>
  <text x="656" y="711" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">body_len = 8</text>

  <rect x="736" y="650" width="160" height="42" rx="6" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="816" y="675" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#4A473F" text-anchor="middle">00 00 00 03</text>
  <text x="816" y="711" font-size="10.5" fill="#6B675C" text-anchor="middle">a = 3</text>

  <rect x="896" y="650" width="160" height="42" rx="6" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="976" y="675" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#4A473F" text-anchor="middle">00 00 00 04</text>
  <text x="976" y="711" font-size="10.5" fill="#6B675C" text-anchor="middle">b = 4</text>

  <text x="66" y="756" font-size="12.5" font-weight="700" fill="#24473F">响应</text>
  <text x="66" y="775" font-size="11" fill="#6B675C">18 B</text>

  <rect x="176" y="732" width="80" height="42" rx="6" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.3"/>
  <text x="216" y="757" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#4A473F" text-anchor="middle">52 43</text>

  <rect x="256" y="732" width="40" height="42" rx="6" fill="#F1EFE8" stroke="#5A564B" stroke-width="1.3"/>
  <text x="276" y="757" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#4A473F" text-anchor="middle">01</text>

  <rect x="296" y="732" width="40" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="316" y="757" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">02</text>

  <rect x="336" y="732" width="160" height="42" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="416" y="757" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#6B4E28" text-anchor="middle">00 00 00 01</text>
  <text x="416" y="793" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">原样回送 id</text>

  <rect x="496" y="732" width="80" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="536" y="757" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2C4460" text-anchor="middle">00 00</text>
  <text x="536" y="793" font-size="10.5" fill="#2C4460" text-anchor="middle">status OK</text>

  <rect x="576" y="732" width="160" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="656" y="757" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">00 00 00 04</text>
  <text x="656" y="793" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">body_len = 4</text>

  <rect x="736" y="732" width="160" height="42" rx="6" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="816" y="757" font-size="12.2" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#4A473F" text-anchor="middle">00 00 00 07</text>
  <text x="816" y="793" font-size="10.5" fill="#6B675C" text-anchor="middle">sum = 7</text>

  <rect x="916" y="730" width="246" height="48" rx="8" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.1"/>
  <text x="1039" y="748" font-size="10.8" font-weight="700" fill="#4A473F" text-anchor="middle">两帧头部偏移完全一致</text>
  <text x="1039" y="765" font-size="10.5" fill="#6B675C" text-anchor="middle">只改变 type、code、body_len</text>

  <rect x="48" y="838" width="1144" height="30" rx="8" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.1"/>
  <line x1="429" y1="838" x2="429" y2="868" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="810" y1="838" x2="810" y2="868" stroke="#D8D5C8" stroke-width="1"/>

  <text x="238" y="858" font-size="12.2" font-weight="700" fill="#24473F" text-anchor="middle">body_len → 恢复帧边界</text>
  <text x="619" y="858" font-size="12.2" font-weight="700" fill="#6B4E28" text-anchor="middle">request_id → 关联请求与响应</text>
  <text x="1001" y="858" font-size="12.2" font-weight="700" fill="#2C4460" text-anchor="middle">code → 区分方法与业务结果</text>
</svg>
