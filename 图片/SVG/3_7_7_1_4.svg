<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9 z" fill="#8C887B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <title>跨网段逐跳转发全流程：四设备一体化贯通泳道</title>
  <desc>四设备自顶向下纵向贯通：上部为各设备执行步骤，中部为逐跳流转带，下部为对应设备的五层协议栈实际穿越折线。</desc>

  <!-- 画布背景 -->
  <rect x="0" y="0" width="1240" height="760" fill="rgb(245, 244, 237)"/>

  <!-- 顶部主标题与副标题 -->
  <text x="48" y="34" font-size="20" font-weight="700" fill="#2B2A26">跨网段逐跳转发全流程：四设备一体化贯通泳道</text>
  <text x="48" y="56" font-size="12.5" fill="#6B675C">四设备纵向严格贯通：上部看逻辑执行步骤，下部看协议栈物理穿越；端到端 IP 不变，逐跳 MAC 替换</text>

  <!-- 主内容大面板 -->
  <rect x="44" y="70" width="1152" height="610" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <!-- ================= 四根纵向设备贯通大泳道 ================= -->
  <!-- 列 1：源主机 A (x=58, w=268, center=192) -->
  <rect x="58" y="80" width="268" height="588" rx="6" fill="#F4F7FB" stroke="#C5D3E8" stroke-width="1"/>
  <!-- 表头 1 -->
  <rect x="66" y="88" width="252" height="42" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="192" y="105" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">源主机 A (192.168.1.10)</text>
  <text x="192" y="121" font-size="10" fill="#2C4460" text-anchor="middle">走完五层 · MAC-A · 局域网 1</text>

  <!-- 列 2：二层交换机 (x=342, w=268, center=476) -->
  <rect x="342" y="80" width="268" height="588" rx="6" fill="#F9F6F0" stroke="#E2D7C3" stroke-width="1"/>
  <!-- 表头 2 -->
  <rect x="350" y="88" width="252" height="42" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="476" y="105" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">二层交换机</text>
  <text x="476" y="121" font-size="10" fill="#6B4E28" text-anchor="middle">只到二层 · 维护 CAM 地址表</text>

  <!-- 列 3：路由器 R (x=626, w=268, center=760) -->
  <rect x="626" y="80" width="268" height="588" rx="6" fill="#F5F3F8" stroke="#D3CBE2" stroke-width="1"/>
  <!-- 表头 3 -->
  <rect x="634" y="88" width="252" height="42" rx="5" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="760" y="105" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">路由器 R (默认网关)</text>
  <text x="760" y="121" font-size="10" fill="#4A3F68" text-anchor="middle">只到三层 · 左: 192.168.1.1 | 右: 10.0.0.1</text>

  <!-- 列 4：目标主机 B (x=910, w=268, center=1044) -->
  <rect x="910" y="80" width="268" height="588" rx="6" fill="#F4F8F6" stroke="#C5E0D4" stroke-width="1"/>
  <!-- 表头 4 -->
  <rect x="918" y="88" width="252" height="42" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1044" y="105" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">目标主机 B (10.0.0.20)</text>
  <text x="1044" y="121" font-size="10" fill="#24473F" text-anchor="middle">走完五层 · MAC-B · 局域网 2</text>


  <!-- ================= 上半部：四设备微观处理卡片 ================= -->
  <!-- 主机 A 卡片 1~4 -->
  <rect x="66" y="138" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.8"/>
  <text x="74" y="153" font-size="10.5" font-weight="700" fill="#2C4460">① 传输层与网络层封装</text>
  <text x="74" y="167" font-size="9.5" fill="#4A473F">TCP 头: 写入源/目的端口</text>
  <text x="74" y="178" font-size="9.5" fill="#6B675C">IP 头: 192.168.1.10 → 10.0.0.20 (TTL=64)</text>
  <line x1="192" y1="184" x2="192" y2="190" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="66" y="190" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.8"/>
  <text x="74" y="205" font-size="10.5" font-weight="700" fill="#2C4460">② CIDR 计算与查路由表</text>
  <text x="74" y="219" font-size="9.5" fill="#4A473F">掩码计算: 10.0.0.20 非本地子网</text>
  <text x="74" y="230" font-size="9.5" fill="#6B675C">命中默认路由 → 下一跳指向网关 192.168.1.1</text>
  <line x1="192" y1="236" x2="192" y2="242" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="66" y="242" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.8"/>
  <text x="74" y="257" font-size="10.5" font-weight="700" fill="#2C4460">③ 查 ARP 表获取网关 MAC</text>
  <text x="74" y="271" font-size="9.5" fill="#4A473F">检索 192.168.1.1 → 命中 MAC-R1</text>
  <text x="74" y="282" font-size="9.5" fill="#6B675C">(无缓存则在本网段广播 who has)</text>
  <line x1="192" y1="288" x2="192" y2="294" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="66" y="294" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.8"/>
  <text x="74" y="309" font-size="10.5" font-weight="700" fill="#2C4460">④ 封装帧头并发送</text>
  <text x="74" y="323" font-size="9.5" fill="#4A473F">帧头: [Src: MAC-A, Dst: MAC-R1]</text>
  <text x="74" y="334" font-size="9.5" fill="#6B675C">网卡转换为电/光信号向交换机发出</text>

  <!-- 交换机 卡片 5~8 -->
  <rect x="350" y="138" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="0.8"/>
  <text x="358" y="153" font-size="10.5" font-weight="700" fill="#6B4E28">⑤ 接收物理信号与解帧</text>
  <text x="358" y="167" font-size="9.5" fill="#4A473F">端口接收比特流，校验 FCS</text>
  <text x="358" y="178" font-size="9.5" fill="#6B675C">解封装至二层以太网帧头</text>
  <line x1="476" y1="184" x2="476" y2="190" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="350" y="190" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="0.8"/>
  <text x="358" y="205" font-size="10.5" font-weight="700" fill="#6B4E28">⑥ 源 MAC 学习机制</text>
  <text x="358" y="219" font-size="9.5" fill="#4A473F">读取源 MAC: MAC-A</text>
  <text x="358" y="230" font-size="9.5" fill="#6B675C">CAM 表记录: [MAC-A ↔ 入端口]</text>
  <line x1="476" y1="236" x2="476" y2="242" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="350" y="242" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="0.8"/>
  <text x="358" y="257" font-size="10.5" font-weight="700" fill="#6B4E28">⑦ 检索目的 MAC 端口</text>
  <text x="358" y="271" font-size="9.5" fill="#4A473F">读取目的 MAC: MAC-R1</text>
  <text x="358" y="282" font-size="9.5" fill="#6B675C">CAM 表命中路由器所在出端口</text>
  <line x1="476" y1="288" x2="476" y2="294" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="350" y="294" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="0.8"/>
  <text x="358" y="309" font-size="10.5" font-weight="700" fill="#6B4E28">⑧ 对应端口单播转发</text>
  <text x="358" y="323" font-size="9.5" fill="#4A473F">原样从出端口单播发送给路由器</text>
  <text x="358" y="334" font-size="9.5" fill="#6B675C">不碰 IP 头，不修改帧内任何数据</text>

  <!-- 路由器 R 卡片 9~12 -->
  <rect x="634" y="138" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#6B5B95" stroke-width="0.8"/>
  <text x="642" y="153" font-size="10.5" font-weight="700" fill="#4A3F68">⑨ 二层解包与三层校验</text>
  <text x="642" y="167" font-size="9.5" fill="#4A473F">核对 Dst MAC 为左口 MAC-R1</text>
  <text x="642" y="178" font-size="9.5" fill="#6B675C">剥除旧帧头，提取 IP 数据报</text>
  <line x1="760" y1="184" x2="760" y2="190" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="634" y="190" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#6B5B95" stroke-width="0.8"/>
  <text x="642" y="205" font-size="10.5" font-weight="700" fill="#4A3F68">⑩ TTL 递减与重算校验</text>
  <text x="642" y="219" font-size="9.5" fill="#4A473F">读取 Dst IP: 10.0.0.20 (非本机)</text>
  <text x="642" y="230" font-size="9.5" fill="#6B675C">TTL 减 1 (64 → 63)，重算校验和</text>
  <line x1="760" y1="236" x2="760" y2="242" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="634" y="242" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#6B5B95" stroke-width="0.8"/>
  <text x="642" y="257" font-size="10.5" font-weight="700" fill="#4A3F68">⑪ 查路由表与 ARP 解析</text>
  <text x="642" y="271" font-size="9.5" fill="#4A473F">最长前缀匹配: 10.0.0.0/24 右口直连</text>
  <text x="642" y="282" font-size="9.5" fill="#6B675C">右口 ARP 查 10.0.0.20 → 得 MAC-B</text>
  <line x1="760" y1="288" x2="760" y2="294" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="634" y="294" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#6B5B95" stroke-width="0.8"/>
  <text x="642" y="309" font-size="10.5" font-weight="700" fill="#4A3F68">⑫ 重封装帧头并发出</text>
  <text x="642" y="323" font-size="9.5" fill="#4A473F">封新帧头: [Src: MAC-R2, Dst: MAC-B]</text>
  <text x="642" y="334" font-size="9.5" fill="#6B675C">从右端口调制发出 (IP 头部全程未改)</text>

  <!-- 目标主机 B 卡片 13~16 -->
  <rect x="918" y="138" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#2F6B5E" stroke-width="0.8"/>
  <text x="926" y="153" font-size="10.5" font-weight="700" fill="#24473F">⑬ 物理层接收与帧核验</text>
  <text x="926" y="167" font-size="9.5" fill="#4A473F">网卡接收信号，校验 FCS 正确</text>
  <text x="926" y="178" font-size="9.5" fill="#6B675C">核验 Dst MAC = MAC-B，剥除帧头</text>
  <line x1="1044" y1="184" x2="1044" y2="190" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="918" y="190" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#2F6B5E" stroke-width="0.8"/>
  <text x="926" y="205" font-size="10.5" font-weight="700" fill="#24473F">⑭ 网络层解包校验</text>
  <text x="926" y="219" font-size="9.5" fill="#4A473F">核对 Dst IP: 10.0.0.20 为本机</text>
  <text x="926" y="230" font-size="9.5" fill="#6B675C">核对协议号 6 (TCP)，剥除 IP 头部</text>
  <line x1="1044" y1="236" x2="1044" y2="242" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="918" y="242" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#2F6B5E" stroke-width="0.8"/>
  <text x="926" y="257" font-size="10.5" font-weight="700" fill="#24473F">⑮ 传输层处理与端口匹配</text>
  <text x="926" y="271" font-size="9.5" fill="#4A473F">解析 TCP 头，核对 Seq/Ack</text>
  <text x="926" y="282" font-size="9.5" fill="#6B675C">根据目的端口匹配对应 Socket</text>
  <line x1="1044" y1="288" x2="1044" y2="294" stroke="#8C887B" stroke-width="1" marker-end="url(#arrGrey)"/>

  <rect x="918" y="294" width="252" height="46" rx="4" fill="#FFFFFF" stroke="#2F6B5E" stroke-width="0.8"/>
  <text x="926" y="309" font-size="10.5" font-weight="700" fill="#24473F">⑯ 交付应用程序</text>
  <text x="926" y="323" font-size="9.5" fill="#4A473F">载荷存入 Socket 接收缓冲区</text>
  <text x="926" y="334" font-size="9.5" fill="#6B675C">唤醒上层进程 read() / recv() 读取</text>


  <!-- ================= 中部：跨设备逐跳报文流转带 ================= -->
  <!-- 第一跳 -->
  <rect x="58" y="352" width="410" height="48" rx="4" fill="#EFF5F1" stroke="#2F6B5E" stroke-width="1"/>
  <text x="70" y="368" font-size="10.5" font-weight="700" fill="#22564A">【第一跳】主机 A ➔ 交换机 ➔ 路由器 R</text>
  <text x="70" y="382" font-size="9.5" fill="#4A473F">帧头: [Src: MAC-A, Dst: MAC-R1]</text>
  <text x="70" y="393" font-size="9.5" fill="#6B675C">IP: 192.168.1.10 ➔ 10.0.0.20 · TTL=64</text>

  <!-- 交换机透传指示 -->
  <line x1="472" y1="376" x2="620" y2="376" stroke="#8A6A3A" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arrRed)"/>
  <text x="546" y="370" font-size="9.5" fill="#6B4E28" text-anchor="middle">交换机原样透传</text>

  <!-- 第二跳 -->
  <rect x="626" y="352" width="552" height="48" rx="4" fill="#FDF3EB" stroke="#A64B3C" stroke-width="1"/>
  <text x="638" y="368" font-size="10.5" font-weight="700" fill="#733428">【第二跳】路由器 R ➔ 目标主机 B (重写 MAC)</text>
  <text x="638" y="382" font-size="9.5" fill="#4A473F">帧头: [Src: MAC-R2, Dst: MAC-B] (重写)</text>
  <text x="638" y="393" font-size="9.5" fill="#6B675C">IP: 192.168.1.10 ➔ 10.0.0.20 · TTL=63 (路由器减 1)</text>


  <!-- ================= 下半部：五层协议栈实际折线路径 (垂直对应四设备) ================= -->
  <!-- 区域标题 -->
  <text x="58" y="420" font-size="11.5" font-weight="700" fill="#4A473F">▼ 下半部：五层协议栈实际穿越路径（虚线框标明对应设备的协议栈深度）</text>

  <!-- 五层横向色带 -->
  <rect x="58" y="432" width="1120" height="34" rx="4" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="0.8"/>
  <text x="70" y="453" font-size="10.5" font-weight="700" fill="#3D5A80">5 应用层</text>

  <rect x="58" y="470" width="1120" height="34" rx="4" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="0.8"/>
  <text x="70" y="491" font-size="10.5" font-weight="700" fill="#2F6B5E">4 传输层</text>

  <rect x="58" y="508" width="1120" height="34" rx="4" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="0.8"/>
  <text x="70" y="529" font-size="10.5" font-weight="700" fill="#6B5B95">3 网络层</text>

  <rect x="58" y="546" width="1120" height="34" rx="4" fill="#F3EDE2" stroke="#D8D5C8" stroke-width="0.8"/>
  <text x="70" y="567" font-size="10.5" font-weight="700" fill="#8A6A3A">2 链路层</text>

  <rect x="58" y="584" width="1120" height="34" rx="4" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="0.8"/>
  <text x="70" y="605" font-size="10.5" font-weight="700" fill="#4A473F">1 物理层</text>

  <!-- 四设备深度虚线框 (严密对齐上方泳道中轴: 192, 476, 760, 1044) -->
  <!-- 主机 A: 覆盖 5 层 -->
  <rect x="112" y="432" width="160" height="186" rx="6" fill="none" stroke="#3D5A80" stroke-width="1.4" stroke-dasharray="5 3"/>
  <!-- 交换机: 覆盖 2 层 (链路层与物理层) -->
  <rect x="396" y="546" width="160" height="72" rx="6" fill="none" stroke="#8A6A3A" stroke-width="1.4" stroke-dasharray="5 3"/>
  <!-- 路由器: 覆盖 3 层 (网络层到物理层) -->
  <rect x="680" y="508" width="160" height="110" rx="6" fill="none" stroke="#6B5B95" stroke-width="1.4" stroke-dasharray="5 3"/>
  <!-- 主机 B: 覆盖 5 层 -->
  <rect x="964" y="432" width="160" height="186" rx="6" fill="none" stroke="#2F6B5E" stroke-width="1.4" stroke-dasharray="5 3"/>

  <!-- 数据流折线路径 (红色高亮穿行) -->
  <path d="M 192,449 V 601 H 456 V 563 H 496 V 601 H 740 V 525 H 780 V 601 H 1044 V 449"
        fill="none" stroke="#A64B3C" stroke-width="2.2" marker-end="url(#arrRed)"/>

  <!-- 节点圆点 -->
  <circle cx="192" cy="449" r="4" fill="#A64B3C"/>
  <circle cx="476" cy="563" r="4" fill="#A64B3C"/>
  <circle cx="760" cy="525" r="4" fill="#A64B3C"/>

  <!-- 折线文字标注：精确呼应上方步骤 -->
  <text x="204" y="475" font-size="10.5" font-weight="700" fill="#733428">① 逐层加头 (对应步骤①~④)</text>
  <text x="476" y="555" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">② 查 MAC 表 (对应步骤⑤~⑧)</text>
  <text x="760" y="517" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">③ 查路由表重写 (对应步骤⑨~⑫)</text>
  <text x="1032" y="475" font-size="10.5" font-weight="700" fill="#733428" text-anchor="end">④ 逐层剥头 (对应步骤⑬~⑯)</text>

  <!-- 链路网段说明 -->
  <text x="324" y="612" font-size="9.5" fill="#6B675C" text-anchor="middle">同一网段 (局域网 1)</text>
  <text x="618" y="612" font-size="9.5" fill="#6B675C" text-anchor="middle">网关上行链路</text>
  <text x="902" y="612" font-size="9.5" fill="#6B675C" text-anchor="middle">跨网段链路 (局域网 2)</text>

  <!-- 下方呼应口径 -->
  <text x="58" y="636" font-size="10" fill="#4A473F">垂直纵向对应：两端主机走满五层，交换机仅到二层，路由器仅到三层</text>
  <text x="58" y="650" font-size="9.5" fill="#6B675C">中间设备只解封装到其转发所需的层次，不走上层协议栈，保障线速转发</text>


  <!-- ================= 底部收口与核心结论 ================= -->
  <rect x="44" y="694" width="1152" height="48" rx="5" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="58" y="713" font-size="11" font-weight="700" fill="#2B2A26">核心法则：源/目的 IP 端到端不变；源/目的 MAC 逐跳重写（由 ARP 逐跳解析下一跳 MAC）</text>
  <text x="58" y="730" font-size="10" fill="#4A473F">交换机是纯二层设备，依据 MAC 表单播转发，不碰 IP；路由器是三层设备，解帧读 IP 查路由表，重写 MAC 并减 1 TTL。</text>
</svg>
