<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="835" viewBox="0 0 1200 835" role="img" aria-labelledby="title desc">
<title id="title">认证一个 chunk，不等于认证整个 Checkpoint</title><desc id="desc">信任链需要同时绑定内容、集合和当前允许恢复的提交版本。。教学示意图，不代表实测数据。</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#345AC9"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#127B6A"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#AE4247"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#586375"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A641B"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="835" rx="0" fill="rgb(245, 244, 237)"/>
<text x="42" y="35" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" text-anchor="start">8 · 9 · 9 · 13 · 5</text>
<text x="42" y="81" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" text-anchor="start">认证一个 chunk，不等于认证整个 Checkpoint</text>
<text x="42" y="119" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">信任链需要同时绑定内容、集合和当前允许恢复的提交版本。</text>
<path d="M42 141 L1158 141" fill="none" stroke="#D1D7DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="42" y="185" width="310" height="280" rx="14" fill="#E7F1EC" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="58" y="205" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="74" y="228" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">可信控制面</text>
<text x="64" y="265" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">预期 generation = 41</text>
<text x="64" y="294" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">已提交的 manifest 身份</text>
<text x="64" y="323" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">验证 key／可信公钥</text>
<text x="64" y="352" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start"></text>
<text x="64" y="381" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">这个状态不能任意回滚。</text>
<rect x="422" y="185" width="336" height="280" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="438" y="205" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="454" y="228" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">认证 manifest</text>
<text x="444" y="265" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">checkpoint 身份与版本</text>
<text x="444" y="294" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">文件列表、长度、块数</text>
<text x="444" y="323" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">块序、内容承诺与 locator</text>
<text x="444" y="352" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">算法、格式、key 标识</text>
<text x="444" y="381" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start"></text>
<text x="444" y="410" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">定义“完整集合”。</text>
<path d="M358 319 L416 319" fill="none" stroke="#127B6A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="826" y="185" width="332" height="88" rx="14" fill="#E8EDF9" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="842" y="205" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="858" y="219" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">chunk 0</text>
<text x="848" y="253" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">C[0] + nonce[0] + tag[0]</text>
<path d="M764 318 L792 318 L792 229 L820 229" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="826" y="290" width="332" height="88" rx="14" fill="#E8EDF9" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="842" y="310" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="858" y="324" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">chunk 1</text>
<text x="848" y="358" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">C[1] + nonce[1] + tag[1]</text>
<path d="M764 318 L792 318 L792 334 L820 334" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="826" y="395" width="332" height="88" rx="14" fill="#E8EDF9" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="842" y="415" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="858" y="429" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">chunk 2</text>
<text x="848" y="463" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">C[2] + nonce[2] + tag[2]</text>
<path d="M764 318 L792 318 L792 439 L820 439" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M42 512 L1158 512" fill="none" stroke="#D1D7DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="42" y="550" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">恢复的三道检查</text>
<rect x="42" y="577" width="340" height="134" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="58" y="597" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="74" y="620" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">① 版本与 manifest</text>
<text x="64" y="657" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">是预期版本吗？</text>
<text x="64" y="686" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">文件清单和总长度可信吗？</text>
<rect x="430" y="577" width="340" height="134" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="446" y="597" width="4" height="28" rx="2" fill="#345AC9"/>
<text x="462" y="620" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">② 每块认证与集合完整</text>
<text x="452" y="657" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">AEAD 认证成功再使用</text>
<text x="452" y="686" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">缺尾块、缺文件也必须失败。</text>
<rect x="818" y="577" width="340" height="134" rx="14" fill="#FFFFFF" stroke="#D1D7DB" stroke-width="1.5"/>
<rect x="834" y="597" width="4" height="28" rx="2" fill="#127B6A"/>
<text x="850" y="620" fill="#19263D" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">③ 应用恢复合同</text>
<text x="840" y="657" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">张量、优化器与格式一致</text>
<text x="840" y="686" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">完整成功后再发布可用版本。</text>
<path d="M386 644 L424 644" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M774 644 L812 644" fill="none" stroke="#345AC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="42" y="763" fill="#AE4247" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">合法旧 manifest + 合法旧密文仍可能全通过；“最新”来自独立可信状态。</text>
<path d="M42 786 L1158 786" fill="none" stroke="#D1D7DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="42" y="812" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" text-anchor="start">高性能存储 · P1  /  与正文配合阅读：前提、成本、失败边界</text>
<text x="1158" y="812" fill="#586375" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" text-anchor="end">2026-09-16</text>
</svg>