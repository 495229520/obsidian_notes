<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <title>3 个重复 ACK 与超时：TCP 的两种丢包反应</title>
  <desc>左侧展示报文段 3 丢失后，后续段到达触发三个重复 ACK，发送方立即快重传并把 cwnd 减半；右侧展示所有报文都丢失、RTO 到期，发送方把 cwnd 打回 1 MSS 重新慢启动。</desc>

  <rect x="0" y="0" width="1240" height="720" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">同样是丢包，TCP 为什么区别对待</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">左边还有 ACK 源源不断地回来，右边一个都没有——这个差别决定了 cwnd 是减半还是归零重来</text>

  <!-- ===================== Left panel ===================== -->
  <rect x="48" y="104" width="560" height="560" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="14" font-weight="700" fill="#4A473F">① 3 个重复 ACK → 快重传 + 快恢复</text>

  <rect x="90" y="142" width="120" height="28" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="150" y="161" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">发送方</text>
  <rect x="440" y="142" width="120" height="28" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="500" y="161" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">接收方</text>
  <line x1="150" y1="176" x2="150" y2="528" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="500" y1="176" x2="500" y2="528" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>

  <line x1="150" y1="200" x2="500" y2="200" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="325" y="192" font-size="10" fill="#2C4460" text-anchor="middle">报文段 1</text>
  <line x1="150" y1="228" x2="500" y2="228" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="325" y="220" font-size="10" fill="#2C4460" text-anchor="middle">报文段 2</text>

  <line x1="150" y1="256" x2="330" y2="256" stroke="#A64B3C" stroke-width="1.6"/>
  <line x1="334" y1="250" x2="346" y2="262" stroke="#A64B3C" stroke-width="2.2"/>
  <line x1="346" y1="250" x2="334" y2="262" stroke="#A64B3C" stroke-width="2.2"/>
  <text x="240" y="248" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">报文段 3</text>
  <text x="400" y="260" font-size="10" font-weight="700" fill="#733428">丢了</text>

  <line x1="150" y1="284" x2="500" y2="284" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="315" y="276" font-size="10" fill="#2C4460" text-anchor="middle">报文段 4</text>
  <text x="510" y="288" font-size="9.5" fill="#8A8578">乱序缓存</text>
  <line x1="150" y1="312" x2="500" y2="312" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="315" y="304" font-size="10" fill="#2C4460" text-anchor="middle">报文段 5</text>
  <text x="510" y="316" font-size="9.5" fill="#8A8578">乱序缓存</text>
  <line x1="150" y1="340" x2="500" y2="340" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="315" y="332" font-size="10" fill="#2C4460" text-anchor="middle">报文段 6</text>
  <text x="510" y="344" font-size="9.5" fill="#8A8578">乱序缓存</text>

  <line x1="500" y1="368" x2="150" y2="368" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="325" y="360" font-size="10" fill="#24473F" text-anchor="middle">ACK = 3（正常确认 1、2）</text>
  <line x1="500" y1="396" x2="150" y2="396" stroke="#B07D2B" stroke-width="1.6" marker-end="url(#arrA)"/>
  <text x="325" y="388" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">ACK = 3　重复 ①</text>
  <line x1="500" y1="424" x2="150" y2="424" stroke="#B07D2B" stroke-width="1.6" marker-end="url(#arrA)"/>
  <text x="325" y="416" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">ACK = 3　重复 ②</text>
  <line x1="500" y1="452" x2="150" y2="452" stroke="#A64B3C" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="325" y="444" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">ACK = 3　重复 ③ ← 触发快重传</text>

  <line x1="150" y1="486" x2="500" y2="486" stroke="#3D5A80" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="325" y="478" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">立刻重传报文段 3（不等 RTO）</text>
  <line x1="500" y1="514" x2="150" y2="514" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="325" y="506" font-size="10" fill="#24473F" text-anchor="middle">ACK = 7（4、5、6 早就到了）</text>

  <rect x="72" y="536" width="512" height="106" rx="6" fill="#F0F6F3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="96" y="558" font-size="12" font-weight="700" fill="#24473F">发送方的反应</text>
  <text x="96" y="580" font-size="10.5" fill="#4A473F">ssthresh = max(cwnd / 2, 2 MSS)</text>
  <text x="96" y="600" font-size="10.5" fill="#4A473F">cwnd 收缩到 ssthresh 附近，直接转入拥塞避免，不回慢启动</text>
  <text x="96" y="624" font-size="10.5" font-weight="700" fill="#24473F">重复 ACK 一直在回来，说明数据还在流动，路没堵死，反应可以温和</text>

  <!-- ===================== Right panel ===================== -->
  <rect x="632" y="104" width="560" height="560" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="656" y="130" font-size="14" font-weight="700" fill="#4A473F">② 超时 → cwnd 打回 1 MSS，重新慢启动</text>

  <rect x="674" y="142" width="120" height="28" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="734" y="161" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">发送方</text>
  <rect x="1024" y="142" width="120" height="28" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1084" y="161" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">接收方</text>
  <line x1="734" y1="176" x2="734" y2="528" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="1084" y1="176" x2="1084" y2="528" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>

  <line x1="734" y1="200" x2="914" y2="200" stroke="#A64B3C" stroke-width="1.6"/>
  <line x1="918" y1="194" x2="930" y2="206" stroke="#A64B3C" stroke-width="2.2"/>
  <line x1="930" y1="194" x2="918" y2="206" stroke="#A64B3C" stroke-width="2.2"/>
  <text x="824" y="192" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">报文段 1</text>
  <line x1="734" y1="228" x2="914" y2="228" stroke="#A64B3C" stroke-width="1.6"/>
  <line x1="918" y1="222" x2="930" y2="234" stroke="#A64B3C" stroke-width="2.2"/>
  <line x1="930" y1="222" x2="918" y2="234" stroke="#A64B3C" stroke-width="2.2"/>
  <text x="824" y="220" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">报文段 2</text>
  <line x1="734" y1="256" x2="914" y2="256" stroke="#A64B3C" stroke-width="1.6"/>
  <line x1="918" y1="250" x2="930" y2="262" stroke="#A64B3C" stroke-width="2.2"/>
  <line x1="930" y1="250" x2="918" y2="262" stroke="#A64B3C" stroke-width="2.2"/>
  <text x="824" y="248" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">报文段 3</text>
  <text x="948" y="232" font-size="10" font-weight="700" fill="#733428">全丢在路上</text>

  <rect x="664" y="290" width="140" height="140" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="734" y="330" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">RTO 计时中</text>
  <text x="734" y="356" font-size="10" fill="#6B4E28" text-anchor="middle">一个 ACK</text>
  <text x="734" y="374" font-size="10" fill="#6B4E28" text-anchor="middle">都没有回来</text>
  <text x="734" y="400" font-size="10" fill="#8A8578" text-anchor="middle">连"丢了哪一个"</text>
  <text x="734" y="418" font-size="10" fill="#8A8578" text-anchor="middle">都无从判断</text>

  <rect x="664" y="446" width="240" height="26" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="784" y="463" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">RTO 到期，判定为严重拥塞</text>

  <line x1="734" y1="500" x2="1084" y2="500" stroke="#3D5A80" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="909" y="492" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">重传报文段 1，从 cwnd = 1 重新开始</text>

  <rect x="656" y="536" width="512" height="106" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="680" y="558" font-size="12" font-weight="700" fill="#733428">发送方的反应</text>
  <text x="680" y="580" font-size="10.5" fill="#4A473F">ssthresh = max(cwnd / 2, 2 MSS)</text>
  <text x="680" y="600" font-size="10.5" fill="#4A473F">cwnd = 1 MSS，退回慢启动，从头指数试探</text>
  <text x="680" y="624" font-size="10.5" font-weight="700" fill="#733428">ACK 全都收不到，只能按"整条路可能堵死"来处理</text>

  <text x="48" y="692" font-size="11" fill="#6B675C">判断依据是"还有没有 ACK 在回来"：有，说明链路还在工作，减半即可；一个都收不到，就只能退回起点重新试探。数据丢了还是 ACK 丢了，在右边这种情况下发送方是分不出来的</text>
</svg>
