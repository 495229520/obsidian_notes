<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Checkpoint 验证门禁：正确对象，正确完成状态</title><desc id="desc">纵向表示先后顺序；等待区间强调 buffer 生命周期和提交依赖。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">Checkpoint 验证门禁：正确对象，正确完成状态</text>
<text x="48" y="80" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">纵向表示先后顺序；等待区间强调 buffer 生命周期和提交依赖。</text>
<rect x="52" y="111" width="162" height="38" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
<text x="133.0" y="135.0" font-size="13" fill="#4A473F" font-weight="600" text-anchor="middle">训练 / 快照</text>
<line x1="133" y1="151" x2="133" y2="610" stroke="#B9B4A7" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="289" y="111" width="162" height="38" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
<text x="370.0" y="135.0" font-size="13" fill="#4A473F" font-weight="600" text-anchor="middle">staging / Hash</text>
<line x1="370" y1="151" x2="370" y2="610" stroke="#B9B4A7" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="546" y="111" width="162" height="38" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
<text x="627.0" y="135.0" font-size="13" fill="#4A473F" font-weight="600" text-anchor="middle">后端存储</text>
<line x1="627" y1="151" x2="627" y2="610" stroke="#B9B4A7" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="789" y="111" width="162" height="38" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
<text x="870.0" y="135.0" font-size="13" fill="#4A473F" font-weight="600" text-anchor="middle">manifest 提交者</text>
<line x1="870" y1="151" x2="870" y2="610" stroke="#B9B4A7" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="1029" y="111" width="162" height="38" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
<text x="1110.0" y="135.0" font-size="13" fill="#4A473F" font-weight="600" text-anchor="middle">恢复进程</text>
<line x1="1110" y1="151" x2="1110" y2="610" stroke="#B9B4A7" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="362" y="170" width="16" height="266" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<rect x="619" y="291" width="16" height="131" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<line x1="137" y1="185" x2="360" y2="185" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="248" y="174" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="middle">交付 epoch 42 的稳定副本</text>
<rect x="281" y="207" width="178" height="53" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="370.0" y="230.5" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle">建立原始摘要</text>
<text x="370.0" y="252.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle">HASHED</text>
<line x1="381" y1="290" x2="615" y2="290" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="496" y="278" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="middle">write(data, 描述符, digest)</text>
<rect x="523" y="319" width="210" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="628.0" y="348.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">验证 + 持久化</text>
<text x="628.0" y="370.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle">失败：不产生成功回执</text>
<rect x="55" y="310" width="242" height="78" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="176" y="333" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="middle">Pinned slot 保持只读</text>
<text x="176" y="355" font-size="12.5" fill="#6B4E28" font-weight="400" text-anchor="middle">等待相关 I/O 消费者结束</text>
<text x="176" y="376" font-size="12.5" fill="#6B4E28" font-weight="400" text-anchor="middle">不是只等 Hash 完成</text>
<line x1="300" y1="349" x2="355" y2="349" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="638" y1="420" x2="858" y2="420" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="748" y="408" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle">VERIFIED + DURABLE 回执</text>
<rect x="762" y="443" width="216" height="60" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="870.0" y="470.0" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle">核对全部预期分片</text>
<text x="870.0" y="492.0" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle">完整集合 → COMMITTED</text>
<line x1="878" y1="524" x2="1098" y2="524" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="989" y="512" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="middle">固定此次 manifest 版本</text>
<rect x="1006" y="545" width="208" height="61" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1110.0" y="572.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">逐 chunk 验证</text>
<text x="1110.0" y="594.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle">通过后才能使用</text>
<text x="379" y="459" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">按所有权协议回收 slot</text>
<text x="48" y="638" font-size="13" fill="#2B2A26" font-weight="500" text-anchor="start">HASHED ≠ VERIFIED ≠ DURABLE ≠ COMMITTED；一个状态不能自动推出其他状态。</text>
<text x="48" y="660" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="start">持久化语义取决于后端与故障域；恢复可流式验证，但不能对外发布半个有效 epoch。</text>
</svg>
