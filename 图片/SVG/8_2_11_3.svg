<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Buffer 所有权状态机与单 owner 回收</title>
  <desc>每块 buffer 的状态迁移、三条不变量，以及单 CQ owner + BufferLease + MPSC 回收模型。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">Buffer 所有权：收到 bid ≠ 可以立刻归还</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">任一时刻一块 buffer 只处一个主状态 · 最后使用者结束才回 ring · 每次交付只归还一次</text>

  <!-- ========== State machine ========== -->
  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">状态机 · 数据 buffer 生命周期</text>

  <rect x="48" y="128" width="1144" height="220" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>

  <rect x="68" y="160" width="160" height="80" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="148" y="190" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">AppFree</text>
  <text x="148" y="212" font-size="11" fill="#3D5A80" text-anchor="middle">应用准备中</text>

  <path d="M236,200 L264,200" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="250" y="188" font-size="10" fill="#6B675C" text-anchor="middle">add+adv</text>

  <rect x="272" y="160" width="180" height="80" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="362" y="186" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">KernelAvailable</text>
  <text x="362" y="208" font-size="11" fill="#8A6A3A" text-anchor="middle">已发布 · 禁写</text>
  <text x="362" y="226" font-size="10" fill="#6B675C" text-anchor="middle">应用禁止访问</text>

  <path d="M460,200 L488,200" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="474" y="188" font-size="10" fill="#6B675C" text-anchor="middle">F_BUFFER</text>

  <rect x="496" y="160" width="160" height="80" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="576" y="190" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">AppOwned</text>
  <text x="576" y="212" font-size="11" fill="#2F6B5E" text-anchor="middle">按 res 读取</text>

  <path d="M664,200 L692,200" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="678" y="188" font-size="10" fill="#6B675C" text-anchor="middle">移交业务</text>

  <rect x="700" y="160" width="180" height="80" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="790" y="186" font-size="13" font-weight="700" fill="#4A3F68" text-anchor="middle">BusinessOwned</text>
  <text x="790" y="208" font-size="11" fill="#6B5B95" text-anchor="middle">异步仍可能访问</text>
  <text x="790" y="226" font-size="10" fill="#6B675C" text-anchor="middle">解析 / 写盘 / 任务</text>

  <path d="M888,200 L916,200" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="902" y="188" font-size="10" fill="#6B675C" text-anchor="middle">最后用户完</text>

  <rect x="924" y="160" width="160" height="80" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="1004" y="190" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">ReturnPending</text>
  <text x="1004" y="212" font-size="11" fill="#8A6A3A" text-anchor="middle">可归还</text>

  <!-- return arrow back -->
  <path d="M1004,248 L1004,280 L362,280 L362,248" fill="none" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arra)"/>
  <text x="700" y="300" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">add + advance → 回到 KernelAvailable</text>
  <text x="700" y="320" font-size="11" fill="#6B675C" text-anchor="middle">同一 bid 每次内核交付只归还一次 · 重复归还 = 未来双写同一地址</text>

  <!-- ========== Invariants ========== -->
  <text x="48" y="360" font-size="13" font-weight="700" fill="#4A473F">三条不变量</text>

  <rect x="48" y="376" width="370" height="100" rx="9" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="68" y="408" font-size="13" font-weight="700" fill="#733428">1 · 已发布禁写</text>
  <text x="68" y="434" font-size="12" fill="#733428">KernelAvailable 时应用不得</text>
  <text x="68" y="454" font-size="12" fill="#733428">同时写入该 buffer</text>

  <rect x="438" y="376" width="370" height="100" rx="9" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="458" y="408" font-size="13" font-weight="700" fill="#6B4E28">2 · 业务结束才归还</text>
  <text x="458" y="434" font-size="12" fill="#6B4E28">收到 bid 不等于立刻归还</text>
  <text x="458" y="454" font-size="12" fill="#6B4E28">异步用 RAII lease 带回调</text>

  <rect x="828" y="376" width="364" height="100" rx="9" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="848" y="408" font-size="13" font-weight="700" fill="#24473F">3 · 交付一次归还一次</text>
  <text x="848" y="434" font-size="12" fill="#24473F">重复发布同一 bid 会让内核</text>
  <text x="848" y="454" font-size="12" fill="#24473F">把同一地址交给两次接收</text>

  <!-- ========== Architecture ========== -->
  <text x="48" y="512" font-size="13" font-weight="700" fill="#4A473F">推荐工程模型 · 单 CQ owner + BufferLease + MPSC 回收</text>

  <rect x="48" y="528" width="360" height="200" rx="10" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="68" y="558" font-size="13" font-weight="700" fill="#2C4460">Event-loop 线程（唯一 owner）</text>
  <rect x="72" y="576" width="312" height="36" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="228" y="599" font-size="12" fill="#2C4460" text-anchor="middle">独占 CQ head · pbuf tail · 请求态</text>
  <rect x="72" y="624" width="312" height="36" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="228" y="647" font-size="12" fill="#24473F" text-anchor="middle">收 CQE → 构造 BufferLease</text>
  <rect x="72" y="672" width="312" height="36" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="228" y="695" font-size="12" fill="#6B4E28" text-anchor="middle">批量 buf_ring_add + advance</text>

  <path d="M416,628 L444,628" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="430" y="612" font-size="10" fill="#6B675C" text-anchor="middle">move</text>

  <rect x="452" y="528" width="340" height="200" rx="10" fill="#FBFBF6" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="472" y="558" font-size="13" font-weight="700" fill="#4A3F68">业务线程池</text>
  <rect x="476" y="576" width="292" height="48" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="622" y="598" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">BufferLease{pool, bid, span}</text>
  <text x="622" y="616" font-size="10" fill="#6B5B95" text-anchor="middle">不可复制 · 可移动</text>
  <rect x="476" y="640" width="292" height="36" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="622" y="663" font-size="12" fill="#4A3F68" text-anchor="middle">解析 / 校验 / 写盘 / 任务</text>
  <rect x="476" y="688" width="292" height="24" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="622" y="705" font-size="11" fill="#6B675C" text-anchor="middle">析构 → 投递 bid 到回收队列</text>

  <path d="M800,628 L828,628" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="814" y="612" font-size="10" fill="#6B675C" text-anchor="middle">bid</text>

  <rect x="836" y="528" width="356" height="200" rx="10" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="856" y="558" font-size="13" font-weight="700" fill="#6B4E28">MPSC 回收队列</text>
  <rect x="860" y="576" width="308" height="48" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="1014" y="598" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">多业务 → 单 loop 生产者</text>
  <text x="1014" y="616" font-size="10" fill="#8A6A3A" text-anchor="middle">只 loop 推进 pbuf tail</text>
  <text x="860" y="656" font-size="12" fill="#4A473F">· 最后使用者结束 + 单生产者环</text>
  <text x="860" y="680" font-size="12" fill="#4A473F">· 比无锁 MPMC 更容易证明正确</text>
  <text x="860" y="704" font-size="11" fill="#6B675C">多线程直接争 pbuf 槽位高风险</text>

  <!-- bottom teardown -->
  <rect x="48" y="752" width="1144" height="80" rx="9" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="72" y="782" font-size="13" font-weight="700" fill="#733428">Teardown 顺序（不可颠倒）</text>
  <text x="72" y="808" font-size="12" fill="#2B2A26">停新任务 → cancel 长期请求并收割无 F_MORE 终态 → 等全部 lease 归还 → 解注册 pbuf → 关 fd → queue_exit</text>
</svg>
