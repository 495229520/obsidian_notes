<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480">
  <rect x="0" y="0" width="940" height="480" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>读多写少：shared_ptr 原子替换（双缓冲）</title>
  <desc>读者持有旧快照的 shared_ptr 无锁读取，写者构造新副本后原子替换指针，旧快照引用计数归零后回收。</desc>

  <text x="470" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    读多写少：shared_ptr 原子替换（双缓冲）
  </text>
  <text x="470" y="54" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">
    读者无锁读旧快照，写者造新副本后原子换指针，引用计数归零自动回收旧版
  </text>

  <rect x="80" y="100" width="300" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="230" y="124" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">读者线程</text>
  <text x="230" y="146" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">g = ptr.load(); 读 *g（无锁）</text>

  <rect x="560" y="100" width="300" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="710" y="124" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">写者线程</text>
  <text x="710" y="146" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">造 v2 → ptr.store(v2)（原子）</text>

  <rect x="320" y="235" width="300" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="470" y="255" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3C3489">atomic&lt;shared_ptr&lt;Data&gt;&gt;</text>
  <text x="470" y="277" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#3C3489">当前指针</text>

  <rect x="80" y="355" width="320" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="240" y="375" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">快照 v1（旧）</text>
  <text x="240" y="397" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#085041">引用计数归零后回收</text>

  <rect x="540" y="355" width="320" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="700" y="375" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">快照 v2（新）</text>
  <text x="700" y="397" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#085041">指针现指向此版本</text>

  <!-- 读者持有旧快照 -->
  <path d="M225 170 L235 355" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">持有旧快照继续读</text>
  <!-- 写者造新副本 -->
  <path d="M715 170 L705 355" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="785" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#854F0B">构造新副本</text>
  <!-- 写者原子 store -->
  <path d="M560 150 L612 235" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="196" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#854F0B">原子 store</text>
  <!-- 指针指向 v2 -->
  <path d="M520 285 L600 355" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="318" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#3C3489">现指向 v2</text>

  <text x="470" y="440" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    读者全程无锁；写者以一次完整拷贝换取读侧零阻塞，适合读远多于写、可容忍读到稍旧数据的场景
  </text>
</svg>
