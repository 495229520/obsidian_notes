<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">从 Python 训练到 GPU 通信：每一层只负责一件事</title><desc id="desc">8.22 · 图 1　同一 collective 调用会经过框架、c10d、NCCL 与实际硬件路径。原创教学图，非实测数据。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="red-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">从 Python 训练到 GPU 通信：每一层只负责一件事</text>
<text x="48" y="78" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">8.22 · 图 1　同一 collective 调用会经过框架、c10d、NCCL 与实际硬件路径</text>
<rect x="48" y="110" width="1144" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="148" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">Launcher / rendezvous</text>
<rect x="406" y="120" width="380" height="42" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="596.0" y="145.9" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">torchrun · rank 建组</text>
<text x="815" y="148" font-size="13.5" font-weight="400" fill="#4A473F" text-anchor="start">建组，不是梯度中转站</text>
<polyline points="593,165 593,182" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="48" y="185" width="1144" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="223" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">框架与 autograd</text>
<rect x="406" y="195" width="380" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="596.0" y="220.9" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">DDP / FSDP hooks</text>
<text x="815" y="223" font-size="13.5" font-weight="400" fill="#4A473F" text-anchor="start">决定数据、分组与启动时机</text>
<polyline points="593,240 593,257" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="48" y="260" width="1144" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="298" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">torch.distributed / c10d</text>
<rect x="406" y="270" width="380" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="596.0" y="295.9" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">all_reduce / all_gather 等</text>
<text x="815" y="298" font-size="13.5" font-weight="400" fill="#4A473F" text-anchor="start">选择 ProcessGroup 与 backend</text>
<polyline points="593,315 593,332" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="48" y="335" width="1144" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="373" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">ProcessGroupNCCL</text>
<rect x="406" y="345" width="380" height="42" rx="7" fill="#EDEAF3" stroke="#8F80A8" stroke-width="1.3"/>
<text x="596.0" y="370.9" font-size="14" font-weight="700" fill="#6B5B95" text-anchor="middle">Work · CUDA stream 依赖</text>
<text x="815" y="373" font-size="13.5" font-weight="400" fill="#4A473F" text-anchor="start">提交与工作状态，不是 optimizer</text>
<polyline points="593,390 593,407" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="48" y="410" width="1144" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="448" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">NCCL / CUDA</text>
<rect x="406" y="420" width="380" height="42" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="596.0" y="445.9" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">communicator · collective</text>
<text x="815" y="448" font-size="13.5" font-weight="400" fill="#4A473F" text-anchor="start">设备执行与通信协作</text>
<polyline points="593,465 593,482" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="48" y="485" width="1144" height="62" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="523" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">GPU / 互连 / 网络</text>
<rect x="406" y="495" width="380" height="42" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="596.0" y="520.9" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">GPU / NVLink / NIC</text>
<text x="815" y="523" font-size="13.5" font-weight="400" fill="#4A473F" text-anchor="start">真实资源与争用边界</text>
<rect x="48" y="569" width="541" height="39" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="318.5" y="593.4" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">rank0：自己的计算与通信路径</text>
<rect x="649" y="569" width="543" height="39" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="920.5" y="593.4" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">rank1：自己的计算与通信路径</text>
<line x1="594" y1="589" x2="643" y2="589" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="48" y1="623" x2="1192" y2="623" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="48" y="643" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">Rendezvous 的 master 地址 ≠ 所有梯度都经过 rank0 CPU；图中分层也不意味着每层独占一个线程。</text>
</svg>