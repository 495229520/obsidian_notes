<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<title>中断合并：通知等待与批量收益放在同一条时间轴</title>
<desc>教学模型：首个事件启动定时器；T = 8 μs 或 N = 4，先满足者通知。非通用硬件规范。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="52" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">中断合并：通知等待与批量收益放在同一条时间轴</text>
<text x="48" y="82" font-size="14" fill="#6B675C" text-anchor="start" data-role="subtitle">教学模型：首个事件启动定时器；T = 8 μs 或 N = 4，先满足者通知。非通用硬件规范。</text>
<rect x="48" y="110" width="1144" height="333" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="67" y="139" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">A · 相同配置，不同到达形态</text>
<path d="M330,175 L330,374" fill="none" stroke="#E4E0D5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="330" y="406" font-size="12" fill="#6B675C" text-anchor="middle" data-role="body">0</text>
<path d="M416,175 L416,374" fill="none" stroke="#E4E0D5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="416" y="406" font-size="12" fill="#6B675C" text-anchor="middle" data-role="body">1</text>
<path d="M502,175 L502,374" fill="none" stroke="#E4E0D5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="502" y="406" font-size="12" fill="#6B675C" text-anchor="middle" data-role="body">2</text>
<path d="M588,175 L588,374" fill="none" stroke="#E4E0D5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="588" y="406" font-size="12" fill="#6B675C" text-anchor="middle" data-role="body">3</text>
<path d="M674,175 L674,374" fill="none" stroke="#E4E0D5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="674" y="406" font-size="12" fill="#6B675C" text-anchor="middle" data-role="body">4</text>
<path d="M760,175 L760,374" fill="none" stroke="#E4E0D5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="760" y="406" font-size="12" fill="#6B675C" text-anchor="middle" data-role="body">5</text>
<path d="M846,175 L846,374" fill="none" stroke="#E4E0D5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="846" y="406" font-size="12" fill="#6B675C" text-anchor="middle" data-role="body">6</text>
<path d="M932,175 L932,374" fill="none" stroke="#E4E0D5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="932" y="406" font-size="12" fill="#6B675C" text-anchor="middle" data-role="body">7</text>
<path d="M1018,175 L1018,374" fill="none" stroke="#E4E0D5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="1018" y="406" font-size="12" fill="#6B675C" text-anchor="middle" data-role="body">8</text>
<path d="M1104,175 L1104,374" fill="none" stroke="#E4E0D5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="1104" y="406" font-size="12" fill="#6B675C" text-anchor="middle" data-role="body">9</text>
<text x="1150" y="406" font-size="13" fill="#6B675C" text-anchor="start" data-role="body">μs</text>
<text x="72" y="202" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">轻载：单个事件</text>
<text x="72" y="226" font-size="13" fill="#6B675C" text-anchor="start" data-role="body">数量阈值未满足</text>
<path d="M330,245 L1148,245" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="330" y="202" width="688" height="29" rx="0" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="674" y="222" font-size="13" fill="#6B4E28" text-anchor="middle" data-role="body">通知等待区间</text>
<rect x="324" y="232" width="12" height="26" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="330" y="184" font-size="12" fill="#2C4460" text-anchor="middle" data-role="body">事件 1</text>
<path d="M1018,198 L1018,263" fill="none" stroke="#A64B3C" stroke-width="2" marker-end="url(#redarr)"/>
<text x="1018" y="184" font-size="13" fill="#733428" text-anchor="middle" data-role="body">8 μs：时间到</text>
<text x="72" y="321" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">突发：四个事件</text>
<text x="72" y="345" font-size="13" fill="#6B675C" text-anchor="start" data-role="body">0 / 2 / 4 / 6 μs</text>
<path d="M330,371 L1148,371" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="330" y="323" width="516" height="29" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="588" y="343" font-size="13" fill="#24473F" text-anchor="middle" data-role="body">数量阈值先满足</text>
<rect x="324" y="358" width="12" height="26" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="330" y="306" font-size="12" fill="#2C4460" text-anchor="middle" data-role="body">事件 1</text>
<rect x="496" y="358" width="12" height="26" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="502" y="306" font-size="12" fill="#2C4460" text-anchor="middle" data-role="body">事件 2</text>
<rect x="668" y="358" width="12" height="26" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="674" y="306" font-size="12" fill="#2C4460" text-anchor="middle" data-role="body">事件 3</text>
<rect x="840" y="358" width="12" height="26" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="846" y="306" font-size="12" fill="#2C4460" text-anchor="middle" data-role="body">事件 4</text>
<path d="M846,319 L846,389" fill="none" stroke="#A64B3C" stroke-width="2" marker-end="url(#redarr)"/>
<text x="870" y="341" font-size="13" fill="#733428" text-anchor="start" data-role="body">6 μs：通知</text>
<rect x="48" y="460" width="1144" height="147" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="67" y="488" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">B · 不要把三个机制合成一个“攒包开关”</text>
<text x="75" y="520" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">硬件 moderation</text>
<text x="75" y="546" font-size="13" fill="#4A473F" text-anchor="start" data-role="body">何时通知 CPU</text>
<text x="75" y="574" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="body">时间 / 数量 / 自适应</text>
<text x="452" y="520" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">NAPI poll</text>
<text x="452" y="546" font-size="13" fill="#4A473F" text-anchor="start" data-role="body">已有工作怎样分批推进</text>
<text x="452" y="574" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="body">budget ≠ 等够才处理</text>
<text x="831" y="520" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">GRO</text>
<text x="831" y="546" font-size="13" fill="#4A473F" text-anchor="start" data-role="body">兼容报文怎样合成对象</text>
<text x="831" y="574" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="body">聚合 ≠ 中断定时器</text>
<path d="M48,621 L1192,621" fill="none" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="651" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="footer">边界：计时模式与自适应策略依驱动而定；更少 IRQ 不保证更低 p99。</text>
</svg>