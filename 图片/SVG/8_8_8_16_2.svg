<text x="714" y="486" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700">q = D_TP / P_TP = 2</text>
<text x="714" y="519" font-size="13" fill="#2B2A26" text-anchor="start">P_rank = floor(D_rank / q)</text>
<text x="714" y="548" font-size="13" fill="#2B2A26" text-anchor="start">split = D_rank mod q</text>
