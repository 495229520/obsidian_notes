<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Rebuild 的时间账：one-to-one vs declustered</title>
  <desc>对比传统 RAID 热备盘重建与 declustered 多对多重建的带宽分母差异，以及 degraded 风险窗口的量级变化。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">Rebuild 的时间账：重建带宽的分母决定 degraded 风险窗口</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">同样丢一块 16 TB 盘：T_rebuild ≈ C_failed ÷ B_effective —— 分母是一块盘还是全集群，差两个数量级</text>

  <!-- Panel A: RAID one-to-one -->
  <rect x="48" y="104" width="556" height="416" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="13" font-weight="700" fill="#4A473F">A · 传统 RAID：one-to-one，热备盘是漏斗</text>

  <!-- surviving disks row -->
  <g>
    <rect x="84" y="160" width="88" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
    <text x="128" y="192" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">D1 幸存</text>
    <text x="128" y="212" font-size="10" fill="#2C4460" text-anchor="middle">全盘读</text>

    <rect x="192" y="160" width="88" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
    <text x="236" y="192" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">D2 幸存</text>
    <text x="236" y="212" font-size="10" fill="#2C4460" text-anchor="middle">全盘读</text>

    <rect x="300" y="160" width="88" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
    <text x="344" y="192" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">D3 幸存</text>
    <text x="344" y="212" font-size="10" fill="#2C4460" text-anchor="middle">全盘读</text>

    <rect x="408" y="160" width="88" height="72" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
    <text x="452" y="192" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">D4 故障</text>
    <line x1="416" y1="168" x2="488" y2="224" stroke="#A64B3C" stroke-width="1.6"/>
    <line x1="488" y1="168" x2="416" y2="224" stroke="#A64B3C" stroke-width="1.6"/>
  </g>

  <!-- funnel arrows into hot spare -->
  <path d="M128,232 L266,318" stroke="#5A564B" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M236,232 L282,314" stroke="#5A564B" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M344,232 L306,314" stroke="#5A564B" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <rect x="232" y="322" width="124" height="72" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="294" y="352" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">热备盘（1 块）</text>
  <text x="294" y="374" font-size="10.5" fill="#6B4E28" text-anchor="middle">重算后写入</text>

  <text x="404" y="352" font-size="11" fill="#A64B3C" font-weight="700">← 写入瓶颈：</text>
  <text x="404" y="370" font-size="11" fill="#A64B3C">单盘 ≈150 MB/s</text>

  <rect x="72" y="420" width="508" height="76" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="92" y="448" font-size="12.5" font-weight="700" fill="#733428">分母 = 单盘写带宽</text>
  <text x="92" y="472" font-size="12" fill="#733428">16 TB ÷ 150 MB/s ≈ 30 小时 —— 期间同组再坏一盘（RAID5）即丢数据</text>

  <!-- Panel B: declustered -->
  <rect x="636" y="104" width="556" height="416" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="660" y="134" font-size="13" font-weight="700" fill="#4A473F">B · Declustered：many-to-many，全集群摊带宽</text>

  <!-- disk grid: sources (row1) -->
  <g>
    <rect x="672" y="160" width="60" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="702" y="190" font-size="10.5" fill="#2C4460" text-anchor="middle">源1</text>
    <rect x="744" y="160" width="60" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="774" y="190" font-size="10.5" fill="#2C4460" text-anchor="middle">源2</text>
    <rect x="816" y="160" width="60" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="846" y="190" font-size="10.5" fill="#2C4460" text-anchor="middle">源3</text>
    <rect x="888" y="160" width="60" height="52" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
    <text x="918" y="190" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">坏盘</text>
    <line x1="893" y1="165" x2="943" y2="207" stroke="#A64B3C" stroke-width="1.4"/>
    <rect x="960" y="160" width="60" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="990" y="190" font-size="10.5" fill="#2C4460" text-anchor="middle">源4</text>
    <rect x="1032" y="160" width="60" height="52" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
    <text x="1062" y="190" font-size="10.5" fill="#2C4460" text-anchor="middle">源5</text>
    <text x="1126" y="190" font-size="12" fill="#6B675C">…</text>
  </g>
  <text x="672" y="236" font-size="10.5" fill="#6B675C">坏盘分片的幸存副本散在几十块盘上，各自读一小段</text>

  <!-- crisscross arrows to targets -->
  <path d="M702,212 L742,306" stroke="#5A564B" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M774,212 L892,306" stroke="#5A564B" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M846,212 L774,306" stroke="#5A564B" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M990,212 L1040,306" stroke="#5A564B" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M1062,212 L926,306" stroke="#5A564B" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <!-- targets (row2) -->
  <g>
    <rect x="708" y="310" width="60" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="738" y="340" font-size="10.5" fill="#24473F" text-anchor="middle">目标1</text>
    <rect x="780" y="310" width="60" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="810" y="340" font-size="10.5" fill="#24473F" text-anchor="middle">目标2</text>
    <rect x="852" y="310" width="60" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="882" y="340" font-size="10.5" fill="#24473F" text-anchor="middle">目标3</text>
    <rect x="924" y="310" width="60" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="954" y="340" font-size="10.5" fill="#24473F" text-anchor="middle">目标4</text>
    <rect x="996" y="310" width="60" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
    <text x="1026" y="340" font-size="10.5" fill="#24473F" text-anchor="middle">目标5</text>
    <text x="1090" y="340" font-size="12" fill="#6B675C">…</text>
  </g>
  <text x="708" y="386" font-size="10.5" fill="#6B675C">新位置也分散：几十块盘并行写，无单点漏斗</text>

  <rect x="660" y="420" width="508" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="680" y="448" font-size="12.5" font-weight="700" fill="#24473F">分母 = 参与盘数 × 每盘让渡给重建的带宽</text>
  <text x="680" y="472" font-size="12" fill="#24473F">100 盘 × 50 MB/s ≈ 5 GB/s → 16 TB ≈ 1 小时内；代价：全集群都被打扰</text>

  <!-- Bottom strip: risk window comparison -->
  <rect x="48" y="544" width="1144" height="196" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="576" font-size="13" font-weight="700" fill="#4A473F">C · degraded 风险窗口对比：重建速度本身就是可靠性参数</text>

  <text x="88" y="612" font-size="11.5" fill="#4A473F">one-to-one</text>
  <rect x="200" y="598" width="900" height="20" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="650" y="612" font-size="11" fill="#733428" text-anchor="middle">degraded ≈ 30 小时（窗口内二次故障 = 丢数据）</text>

  <text x="88" y="650" font-size="11.5" fill="#4A473F">declustered</text>
  <rect x="200" y="636" width="60" height="20" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="276" y="650" font-size="11" fill="#24473F">≈ 30 分钟 —— 二次故障概率随窗口缩短约两个数量级下降</text>

  <line x1="72" y1="672" x2="1168" y2="672" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="700" font-size="11.5" fill="#6B675C">边界条件：并行度↑ 意味着重建流量摊到全集群的盘和网 → 必须节流（静态限速 → 并发度 → 优先级 → 动态反馈），</text>
  <text x="88" y="720" font-size="11.5" fill="#6B675C">且保底最低速率 —— 无限让路给前台 = 把 degraded 窗口拉到无限长（见 §4）</text>
</svg>
