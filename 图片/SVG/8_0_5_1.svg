<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>双路 NUMA：本地访问与远端访问</title>
  <desc>上半：双 Socket 结构，每侧含 CPU、本地内存与 PCIe 设备。中部：本地 vs 远端访存/DMA 路径。下半：术语与 distance 提醒。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">NUMA：地址空间统一，访问代价取决于拓扑距离</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">本 Socket 走本地内存控制器 · 跨 Socket 走 UPI / Infinity Fabric · 通道是共享资源</text>

  <!-- ============ Panel A：双路结构 ============ -->
  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">A · 双路服务器结构：两间相连的仓库</text>

  <!-- Node 0 -->
  <rect x="48" y="128" width="500" height="320" rx="10" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.8"/>
  <rect x="48" y="128" width="500" height="36" rx="10" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.8"/>
  <rect x="48" y="152" width="500" height="12" fill="#E3EAF4"/>
  <text x="68" y="152" font-size="14" font-weight="700" fill="#2C4460">NUMA Node 0 · Socket 0</text>

  <rect x="72" y="184" width="140" height="70" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="142" y="214" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">CPU 核心</text>
  <text x="142" y="234" font-size="11" fill="#3D5A80" text-anchor="middle">+ LLC</text>

  <rect x="232" y="184" width="140" height="70" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="302" y="214" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">本地内存</text>
  <text x="302" y="234" font-size="11" fill="#2F6B5E" text-anchor="middle">DIMM + IMC</text>

  <rect x="392" y="184" width="130" height="70" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="457" y="214" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">PCIe 设备</text>
  <text x="457" y="234" font-size="11" fill="#8A6A3A" text-anchor="middle">NIC / NVMe</text>

  <!-- local arrows node0 -->
  <path d="M212,219 L232,219" fill="none" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrg)"/>
  <text x="187" y="272" font-size="11" fill="#2F6B5E" text-anchor="middle">本地访存</text>

  <path d="M392,219 L372,219" fill="none" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrn)"/>
  <text x="380" y="272" font-size="11" fill="#8A6A3A" text-anchor="middle">本地 DMA</text>

  <rect x="72" y="340" width="450" height="80" rx="7" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="92" y="368" font-size="12" font-weight="700" fill="#2C4460">本侧闭环</text>
  <text x="92" y="390" font-size="12" fill="#4A473F">核心 → 本地内存控制器 → 本地 DIMM</text>
  <text x="92" y="410" font-size="12" fill="#4A473F">设备 → 本地 Root Complex → 本地页</text>

  <!-- interconnect -->
  <rect x="564" y="250" width="112" height="80" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="620" y="280" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">UPI /</text>
  <text x="620" y="300" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">Infinity Fabric</text>
  <text x="620" y="318" font-size="10.5" fill="#A64B3C" text-anchor="middle">共享互联</text>

  <path d="M548,290 L564,290" fill="none" stroke="#A64B3C" stroke-width="1.8"/>
  <path d="M676,290 L692,290" fill="none" stroke="#A64B3C" stroke-width="1.8"/>

  <!-- Node 1 -->
  <rect x="692" y="128" width="500" height="320" rx="10" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.8"/>
  <rect x="692" y="128" width="500" height="36" rx="10" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.8"/>
  <rect x="692" y="152" width="500" height="12" fill="#EFE7DA"/>
  <text x="712" y="152" font-size="14" font-weight="700" fill="#6B4E28">NUMA Node 1 · Socket 1</text>

  <rect x="716" y="184" width="140" height="70" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="786" y="214" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">CPU 核心</text>
  <text x="786" y="234" font-size="11" fill="#3D5A80" text-anchor="middle">+ LLC</text>

  <rect x="876" y="184" width="140" height="70" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="946" y="214" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">本地内存</text>
  <text x="946" y="234" font-size="11" fill="#2F6B5E" text-anchor="middle">DIMM + IMC</text>

  <rect x="1036" y="184" width="130" height="70" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="1101" y="214" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">PCIe 设备</text>
  <text x="1101" y="234" font-size="11" fill="#8A6A3A" text-anchor="middle">NIC / NVMe</text>

  <path d="M856,219 L876,219" fill="none" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrg)"/>
  <text x="831" y="272" font-size="11" fill="#2F6B5E" text-anchor="middle">本地访存</text>

  <path d="M1036,219 L1016,219" fill="none" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrn)"/>
  <text x="1024" y="272" font-size="11" fill="#8A6A3A" text-anchor="middle">本地 DMA</text>

  <rect x="716" y="340" width="450" height="80" rx="7" fill="#F4EDE4" stroke="#D8D5C8" stroke-width="1"/>
  <text x="736" y="368" font-size="12" font-weight="700" fill="#6B4E28">本侧闭环</text>
  <text x="736" y="390" font-size="12" fill="#4A473F">对称结构 · 各有内存控制器与 Root Complex</text>
  <text x="736" y="410" font-size="12" fill="#4A473F">与 Node 0 功能对等，仅拓扑位置不同</text>

  <!-- ============ Panel B：远端路径 ============ -->
  <text x="48" y="484" font-size="13" font-weight="700" fill="#4A473F">B · 远端路径：功能正确，但多交一笔“互联税”</text>

  <rect x="48" y="498" width="560" height="150" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="48" y="498" width="560" height="32" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="48" y="518" width="560" height="12" fill="#DCE9E3"/>
  <text x="68" y="520" font-size="13" font-weight="700" fill="#24473F">本地访问 · 理想</text>
  <text x="68" y="556" font-size="13" fill="#4A473F">Node0 CPU  →  本侧 IMC  →  Node0 内存</text>
  <text x="68" y="582" font-size="13" fill="#4A473F">Node0 NVMe  →  本地 DMA  →  Node0 buffer</text>
  <text x="68" y="612" font-size="12" fill="#2F6B5E">延迟低 · 不挤占跨 Socket 带宽</text>
  <text x="68" y="632" font-size="12" fill="#6B675C">高频数据路径应尽量保持这种闭环</text>

  <rect x="632" y="498" width="560" height="150" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="632" y="498" width="560" height="32" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="632" y="518" width="560" height="12" fill="#F0E0DB"/>
  <text x="652" y="520" font-size="13" font-weight="700" fill="#733428">远端访问 · 可工作但更贵</text>
  <text x="652" y="556" font-size="13" fill="#4A473F">Node0 CPU  →  UPI/IF  →  Node1 内存</text>
  <text x="652" y="582" font-size="13" fill="#4A473F">Node0 NVMe  →  跨节点 DMA  →  Node1 buffer</text>
  <text x="652" y="612" font-size="12" fill="#A64B3C">延迟↑ · 共享互联排队 · p99 更易毛刺</text>
  <text x="652" y="632" font-size="12" fill="#6B675C">校验仍正确 · 问题常伪装成“CPU 变贵”</text>

  <!-- ============ Panel C：术语条 ============ -->
  <rect x="48" y="674" width="1144" height="148" rx="8" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="704" font-size="13" font-weight="700" fill="#4A473F">术语边界 · 不要用编号猜拓扑</text>
  <text x="68" y="732" font-size="12" fill="#4A473F">Socket ≠ Core ≠ Logical CPU · NUMA node 常对应 Socket，但不能永远假定一一对应</text>
  <text x="68" y="756" font-size="12" fill="#4A473F">Local / Remote 是相对访问者而言 · “本地”对另一 Socket 的核心可能是远端</text>
  <text x="68" y="780" font-size="12" fill="#4A473F">NUMA distance 是固件相对权重，不是纳秒 · 不能跨机器直接比较数值</text>
  <text x="68" y="804" font-size="12" fill="#3D5A80">观察：lscpu -e · numactl --hardware · lstopo-no-graphics</text>
</svg>
