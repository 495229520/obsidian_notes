<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07A3E"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A05248"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">GC 与写放大：擦除按块，有效页必须先搬家</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">WAF = NAND 实际写 ÷ 主机写 = 1/(1−u)；OP 越足、TRIM 越勤，牺牲块越空，搬运费越低</text>

  <!-- 牺牲块 -->
  <text x="70" y="132" font-size="13" font-weight="700" fill="#2B2A26">① 挑牺牲块：有效页最少者（贪心）</text>
  <!-- 4x4 grid, cell 46x30 gap5; 失效: 1,2,5,7,8,11,13,14 -->
  <rect x="70" y="146" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="93" y="165" font-size="9.5" fill="#24473F" text-anchor="middle">有效</text>
  <rect x="121" y="146" width="46" height="30" rx="4" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.2"/>
  <text x="144" y="165" font-size="9.5" fill="#7A5426" text-anchor="middle">失效</text>
  <rect x="172" y="146" width="46" height="30" rx="4" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.2"/>
  <text x="195" y="165" font-size="9.5" fill="#7A5426" text-anchor="middle">失效</text>
  <rect x="223" y="146" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="246" y="165" font-size="9.5" fill="#24473F" text-anchor="middle">有效</text>
  <rect x="70" y="181" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="93" y="200" font-size="9.5" fill="#24473F" text-anchor="middle">有效</text>
  <rect x="121" y="181" width="46" height="30" rx="4" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.2"/>
  <text x="144" y="200" font-size="9.5" fill="#7A5426" text-anchor="middle">失效</text>
  <rect x="172" y="181" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="195" y="200" font-size="9.5" fill="#24473F" text-anchor="middle">有效</text>
  <rect x="223" y="181" width="46" height="30" rx="4" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.2"/>
  <text x="246" y="200" font-size="9.5" fill="#7A5426" text-anchor="middle">失效</text>
  <rect x="70" y="216" width="46" height="30" rx="4" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.2"/>
  <text x="93" y="235" font-size="9.5" fill="#7A5426" text-anchor="middle">失效</text>
  <rect x="121" y="216" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="144" y="235" font-size="9.5" fill="#24473F" text-anchor="middle">有效</text>
  <rect x="172" y="216" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="195" y="235" font-size="9.5" fill="#24473F" text-anchor="middle">有效</text>
  <rect x="223" y="216" width="46" height="30" rx="4" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.2"/>
  <text x="246" y="235" font-size="9.5" fill="#7A5426" text-anchor="middle">失效</text>
  <rect x="70" y="251" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="93" y="270" font-size="9.5" fill="#24473F" text-anchor="middle">有效</text>
  <rect x="121" y="251" width="46" height="30" rx="4" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.2"/>
  <text x="144" y="270" font-size="9.5" fill="#7A5426" text-anchor="middle">失效</text>
  <rect x="172" y="251" width="46" height="30" rx="4" fill="#F0E3D3" stroke="#B07A3E" stroke-width="1.2"/>
  <text x="195" y="270" font-size="9.5" fill="#7A5426" text-anchor="middle">失效</text>
  <rect x="223" y="251" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="246" y="270" font-size="9.5" fill="#24473F" text-anchor="middle">有效</text>
  <text x="110" y="303" font-size="11" fill="#2B2A26">u = 有效页占比 = 8/16 = 0.5</text>

  <!-- 搬运箭头 -->
  <line x1="273" y1="213" x2="398" y2="213" stroke="#B07A3E" stroke-width="1.8" marker-end="url(#arrm)"/>
  <text x="282" y="204" font-size="10.5" fill="#7A5426">② 搬运 8 个有效页</text>
  <text x="282" y="232" font-size="10.5" fill="#7A5426">= 8 次额外 NAND 写</text>

  <!-- GC 目的块 -->
  <text x="402" y="132" font-size="13" font-weight="700" fill="#2B2A26">GC 目的块（干净块）</text>
  <rect x="402" y="146" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="425" y="165" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">搬入</text>
  <rect x="453" y="146" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="476" y="165" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">搬入</text>
  <rect x="504" y="146" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="527" y="165" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">搬入</text>
  <rect x="555" y="146" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="578" y="165" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">搬入</text>
  <rect x="402" y="181" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="425" y="200" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">搬入</text>
  <rect x="453" y="181" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="476" y="200" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">搬入</text>
  <rect x="504" y="181" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="527" y="200" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">搬入</text>
  <rect x="555" y="181" width="46" height="30" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="578" y="200" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">搬入</text>
  <rect x="402" y="216" width="46" height="30" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="453" y="216" width="46" height="30" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="504" y="216" width="46" height="30" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="555" y="216" width="46" height="30" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="402" y="251" width="46" height="30" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="453" y="251" width="46" height="30" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="504" y="251" width="46" height="30" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="555" y="251" width="46" height="30" rx="4" fill="#F5F4ED" stroke="#9B968A" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="402" y="303" font-size="10.5" fill="#6B675C">剩 8 页空闲 → 才能吸收 8 页主机写</text>

  <!-- 擦除箭头与空闲池 -->
  <line x1="93" y1="285" x2="93" y2="342" stroke="#A05248" stroke-width="1.8" marker-end="url(#arrr)"/>
  <text x="106" y="332" font-size="10.5" fill="#7A392F">③ 整块擦除（唯一能擦的粒度）</text>
  <rect x="70" y="350" width="330" height="58" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="86" y="374" font-size="12.5" font-weight="700" fill="#24473F">空闲块池 +1</text>
  <text x="86" y="394" font-size="10.5" fill="#24473F">④ 之后充当活跃块 / GC 目的块，接住后续写入</text>

  <!-- 账本 -->
  <rect x="680" y="132" width="500" height="140" rx="7" fill="#F0EFE8" stroke="#9B968A" stroke-width="1.3"/>
  <text x="696" y="158" font-size="13" font-weight="700" fill="#2B2A26">这一轮回收的账（u = 0.5，块 = 16 页）</text>
  <text x="696" y="184" font-size="11.5" fill="#6B675C">整块擦除腾出 16 页，其中 8 页立刻被搬运数据占回</text>
  <text x="696" y="206" font-size="11.5" fill="#6B675C">净收益 = 8 个空闲页 → 只够吸收 8 页主机写</text>
  <text x="696" y="228" font-size="11.5" fill="#6B675C">NAND 实际写 = 8（主机）+ 8（搬运）= 16 页</text>
  <text x="696" y="252" font-size="11.5" font-weight="700" fill="#2B2A26">WAF = 16 ÷ 8 = 2：主机每写 1 页，介质被写 2 页</text>

  <!-- WAF 曲线 -->
  <text x="680" y="312" font-size="13" font-weight="700" fill="#2B2A26">WAF = 1/(1−u)：u 越高，账越恐怖</text>
  <line x1="720" y1="330" x2="720" y2="500" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="720" y1="500" x2="1155" y2="500" stroke="#9B968A" stroke-width="1.2"/>
  <text x="720" y="324" font-size="10" fill="#6B675C" text-anchor="middle">WAF</text>
  <text x="940" y="528" font-size="10.5" fill="#6B675C">牺牲块有效比 u</text>
  <line x1="714" y1="490" x2="720" y2="490" stroke="#9B968A" stroke-width="1"/>
  <text x="708" y="494" font-size="10" fill="#6B675C" text-anchor="end">1</text>
  <line x1="714" y1="423" x2="720" y2="423" stroke="#9B968A" stroke-width="1"/>
  <text x="708" y="427" font-size="10" fill="#6B675C" text-anchor="end">5</text>
  <line x1="714" y1="340" x2="720" y2="340" stroke="#9B968A" stroke-width="1"/>
  <text x="708" y="344" font-size="10" fill="#6B675C" text-anchor="end">10</text>
  <text x="720" y="514" font-size="10" fill="#6B675C" text-anchor="middle">0</text>
  <text x="935" y="514" font-size="10" fill="#6B675C" text-anchor="middle">0.5</text>
  <text x="1064" y="514" font-size="10" fill="#6B675C" text-anchor="middle">0.8</text>
  <text x="1107" y="514" font-size="10" fill="#6B675C" text-anchor="middle">0.9</text>
  <polyline points="720,490 806,486 892,479 935,473 978,465 1021,451 1064,423 1086,396 1107,340"
            fill="none" stroke="#3D5A80" stroke-width="2.2"/>
  <circle cx="935" cy="473" r="3.5" fill="#3D5A80"/>
  <text x="928" y="460" font-size="10" fill="#2C4460" text-anchor="end">u=0.5 → 2</text>
  <circle cx="1064" cy="423" r="3.5" fill="#3D5A80"/>
  <text x="1000" y="412" font-size="10" fill="#2C4460">u=0.8 → 5</text>
  <circle cx="1107" cy="340" r="3.5" fill="#3D5A80"/>
  <text x="1042" y="345" font-size="10" fill="#2C4460">u=0.9 → 10</text>
  <line x1="1150" y1="330" x2="1150" y2="500" stroke="#A05248" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="1146" y="324" font-size="10" fill="#7A392F" text-anchor="end">u→1：WAF→∞</text>

  <!-- OP 容量条 -->
  <text x="48" y="560" font-size="13" font-weight="700" fill="#2B2A26">Over-Provisioning：永远留给 GC 的腾挪余地</text>
  <rect x="48" y="574" width="960" height="54" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="528" y="606" font-size="12" fill="#2C4460" text-anchor="middle">标称容量 = LBA 可寻址空间（主机能看到的全部）</text>
  <rect x="1008" y="574" width="172" height="54" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1094" y="597" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">OP 保留区</text>
  <text x="1094" y="616" font-size="9.5" fill="#24473F" text-anchor="middle">主机不可见</text>
  <text x="48" y="656" font-size="11" fill="#2B2A26">OP = (物理容量 − 标称容量) ÷ 标称容量：消费级 ≈ 7%（GiB 与 GB 之差），企业级 28% 以上【量级】</text>
  <text x="48" y="678" font-size="11" fill="#2B2A26">OP 越大 → 牺牲块越空 → WAF 越低。本文模拟器实测：7% → 7.8，28% → 2.5（均匀随机写 + 贪心 GC）</text>
  <text x="48" y="700" font-size="11" fill="#2B2A26">TRIM / Deallocate 让 FTL 提前知道哪些 LBA 已是死数据 → 不再搬运，效果 ≈ 临时加大 OP</text>
  <text x="48" y="732" font-size="10.5" fill="#6B675C">自制 OP：整盘 blkdiscard 后只分区 85–90%，其余永不写入 —— 关键是让 FTL 确信那片 LBA 是空的</text>
</svg>
