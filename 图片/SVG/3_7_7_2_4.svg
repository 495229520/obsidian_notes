<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>广播风暴防御体系：STP、VLAN 与 Storm Control</title>
  <desc>二层网络防御广播风暴的三道防线：STP 逻辑破环、VLAN 广播域隔离、Storm Control 硬件限速熔断架构对比。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>

  <!-- 顶部标题区 -->
  <text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26">广播风暴防御体系：STP、VLAN 与 Storm Control</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">STP 交互 BPDU 逻辑破环治本；VLAN 划分广播域控制爆炸半径；Storm Control 端口硬件限速兜底</text>

  <!-- ========================================================================= -->
  <!-- Panel A: STP / RSTP (左侧) -->
  <!-- ========================================================================= -->
  <rect x="48" y="96" width="360" height="516" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="48" y="96" width="360" height="34" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="64" y="118" font-size="13.5" font-weight="700" fill="#24473F">A · 生成树协议 (STP/RSTP) · 拓扑破环</text>

  <!-- 根交换机 -->
  <rect x="178" y="146" width="100" height="36" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="228" y="169" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">根交换机 Root</text>

  <!-- 交换机 B -->
  <rect x="68" y="236" width="94" height="36" rx="6" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.2"/>
  <text x="115" y="259" font-size="11" font-weight="700" fill="#2B2A26" text-anchor="middle">交换机 B</text>

  <!-- 交换机 C -->
  <rect x="294" y="236" width="94" height="36" rx="6" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.2"/>
  <text x="341" y="259" font-size="11" font-weight="700" fill="#2B2A26" text-anchor="middle">交换机 C</text>

  <!-- 活动链路 A-B -->
  <line x1="200" y1="182" x2="135" y2="236" stroke="#2F6B5E" stroke-width="2.2"/>
  <text x="145" y="206" font-size="9.5" font-weight="700" fill="#2F6B5E">转发 (Forwarding)</text>

  <!-- 活动链路 A-C -->
  <line x1="256" y1="182" x2="321" y2="236" stroke="#2F6B5E" stroke-width="2.2"/>
  <text x="311" y="206" font-size="9.5" font-weight="700" fill="#2F6B5E">转发 (Forwarding)</text>

  <!-- 冗余链路 B-C (被阻塞) -->
  <line x1="162" y1="254" x2="294" y2="254" stroke="#A64B3C" stroke-width="1.8" stroke-dasharray="4 4"/>
  <rect x="202" y="240" width="80" height="28" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="242" y="258" font-size="9.5" font-weight="700" fill="#733428" text-anchor="middle">✖ 阻塞端口</text>

  <!-- 机制说明卡片 -->
  <rect x="64" y="292" width="328" height="236" rx="6" fill="#F8F7F2" stroke="#D8D5C8" stroke-width="1"/>
  
  <text x="78" y="316" font-size="11" font-weight="700" fill="#24473F">核心机制：</text>
  <text x="78" y="338" font-size="10.5" fill="#4A473F">• 交互 BPDU 报文选举根桥与计算路径</text>
  <text x="78" y="360" font-size="10.5" fill="#4A473F">• 闭环端口置为阻塞（Blocking / Discarding）</text>
  <text x="78" y="382" font-size="10.5" fill="#4A473F">• 阻塞端口不转发数据帧、不学习 MAC</text>
  <text x="78" y="404" font-size="10.5" fill="#4A473F">• 阻塞端口持续监听 BPDU 监控链路状态</text>
  <text x="78" y="426" font-size="10.5" fill="#4A473F">• 主链路故障时自动转为转发（RSTP 秒级）</text>

  <rect x="78" y="446" width="300" height="66" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="90" y="468" font-size="10.5" font-weight="700" fill="#24473F">工程定位：治本</text>
  <text x="90" y="488" font-size="10" fill="#24473F">物理保留环路冗余，逻辑修剪为无环树</text>
  <text x="90" y="504" font-size="9.5" fill="#6B675C">局限：收敛震荡期可能短暂停机</text>

  <text x="64" y="546" font-size="10.5" fill="#6B675C">IEEE 标准 · 802.1D (STP) / 802.1w (RSTP)</text>

  <!-- ========================================================================= -->
  <!-- Panel B: VLAN (中间) -->
  <!-- ========================================================================= -->
  <rect x="440" y="96" width="360" height="516" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="440" y="96" width="360" height="34" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="456" y="118" font-size="13.5" font-weight="700" fill="#2C4460">B · 虚拟局域网 (VLAN) · 广播隔离</text>

  <!-- 802.1Q 帧结构 -->
  <rect x="456" y="142" width="328" height="42" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="466" y="158" font-size="9.5" fill="#6B675C">802.1Q 帧标记：</text>
  <rect x="466" y="162" width="56" height="18" rx="2" fill="#FFFFFF" stroke="#9B968A" stroke-width="0.8"/>
  <text x="494" y="174" font-size="9.5" fill="#4A473F" text-anchor="middle">DMAC</text>
  <rect x="524" y="162" width="56" height="18" rx="2" fill="#FFFFFF" stroke="#9B968A" stroke-width="0.8"/>
  <text x="552" y="174" font-size="9.5" fill="#4A473F" text-anchor="middle">SMAC</text>
  <rect x="582" y="162" width="102" height="18" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="633" y="174" font-size="9.5" font-weight="700" fill="#2C4460" text-anchor="middle">802.1Q (VID 12b)</text>
  <rect x="686" y="162" width="46" height="18" rx="2" fill="#FFFFFF" stroke="#9B968A" stroke-width="0.8"/>
  <text x="709" y="174" font-size="9.5" fill="#4A473F" text-anchor="middle">Type</text>
  <rect x="734" y="162" width="42" height="18" rx="2" fill="#FFFFFF" stroke="#9B968A" stroke-width="0.8"/>
  <text x="755" y="174" font-size="9.5" fill="#4A473F" text-anchor="middle">Data</text>

  <!-- 广播隔离示意图 -->
  <rect x="456" y="196" width="154" height="96" rx="5" fill="#EBF2FA" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="533" y="214" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">VLAN 10 (业务网)</text>
  <rect x="466" y="224" width="60" height="24" rx="3" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.8"/>
  <text x="496" y="239" font-size="9.5" fill="#2C4460" text-anchor="middle">主机 1 (发播)</text>
  <line x1="526" y1="236" x2="540" y2="236" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="542" y="224" width="60" height="24" rx="3" fill="#FFFFFF" stroke="#3D5A80" stroke-width="0.8"/>
  <text x="572" y="239" font-size="9.5" fill="#2C4460" text-anchor="middle">主机 2 (接收)</text>
  <text x="533" y="274" font-size="9.5" fill="#2F6B5E" text-anchor="middle">✓ 广播帧在组内泛洪</text>

  <!-- 阻隔标识 -->
  <line x1="620" y1="202" x2="620" y2="286" stroke="#A64B3C" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="620" y="295" font-size="9.5" font-weight="700" fill="#A64B3C" text-anchor="middle">隔离壁垒</text>

  <rect x="630" y="196" width="154" height="96" rx="5" fill="#EFEBF5" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="707" y="214" font-size="10.5" font-weight="700" fill="#4A3F68" text-anchor="middle">VLAN 20 (办公网)</text>
  <rect x="640" y="224" width="60" height="24" rx="3" fill="#FFFFFF" stroke="#6B5B95" stroke-width="0.8"/>
  <text x="670" y="239" font-size="9.5" fill="#4A3F68" text-anchor="middle">主机 3</text>
  <rect x="716" y="224" width="60" height="24" rx="3" fill="#FFFFFF" stroke="#6B5B95" stroke-width="0.8"/>
  <text x="746" y="239" font-size="9.5" fill="#4A3F68" text-anchor="middle">主机 4</text>
  <text x="707" y="274" font-size="9.5" fill="#A64B3C" text-anchor="middle">🚫 绝不接收跨组广播</text>

  <!-- 机制说明卡片 -->
  <rect x="456" y="306" width="328" height="222" rx="6" fill="#F8F7F2" stroke="#D8D5C8" stroke-width="1"/>
  <text x="470" y="328" font-size="11" font-weight="700" fill="#2C4460">核心机制：</text>
  <text x="470" y="348" font-size="10.5" fill="#4A473F">• 将单台物理交换机拆分为多个逻辑广播域</text>
  <text x="470" y="368" font-size="10.5" fill="#4A473F">• 交换机二层转发广播时绝不越界泛洪</text>
  <text x="470" y="388" font-size="10.5" fill="#4A473F">• Access 端口接终端，Trunk 端口跨机透传</text>
  <text x="470" y="408" font-size="10.5" fill="#4A473F">• 跨 VLAN 通信强制上送三层网关路由</text>

  <rect x="470" y="428" width="300" height="66" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="482" y="450" font-size="10.5" font-weight="700" fill="#2C4460">工程定位：控域</text>
  <text x="482" y="470" font-size="10" fill="#2C4460">缩小爆炸半径，避免单网段污染整网</text>
  <text x="482" y="486" font-size="9.5" fill="#6B675C">局限：VLAN 内部若成环仍需 STP 防御</text>

  <text x="456" y="546" font-size="10.5" fill="#6B675C">IEEE 标准 · 802.1Q (VLAN Tagging)</text>

  <!-- ========================================================================= -->
  <!-- Panel C: Storm Control (右侧) -->
  <!-- ========================================================================= -->
  <rect x="832" y="96" width="360" height="516" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="832" y="96" width="360" height="34" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="848" y="118" font-size="13.5" font-weight="700" fill="#6B4E28">C · 风暴控制 (Storm Control) · 硬件兜底</text>

  <!-- 限速门示意 -->
  <rect x="848" y="142" width="110" height="42" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="903" y="160" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">端口入向泛洪</text>
  <text x="903" y="174" font-size="9.5" fill="#A64B3C" text-anchor="middle">突发 100k pps</text>

  <line x1="958" y1="163" x2="982" y2="163" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="984" y="142" width="94" height="42" rx="4" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="1031" y="160" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">ASIC 限速门</text>
  <text x="1031" y="174" font-size="9.5" fill="#6B4E28" text-anchor="middle">阈值 1k pps</text>

  <!-- 分流输出 -->
  <line x1="1078" y1="154" x2="1102" y2="154" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="1104" y="138" width="76" height="24" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="1142" y="154" font-size="9.5" font-weight="700" fill="#24473F" text-anchor="middle">放行 1k</text>

  <line x1="1078" y1="172" x2="1102" y2="172" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="1104" y="166" width="76" height="24" rx="3" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="1142" y="182" font-size="9.5" font-weight="700" fill="#733428" text-anchor="middle">丢弃 99k</text>

  <!-- 处置模式对比 -->
  <rect x="848" y="196" width="328" height="54" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="860" y="214" font-size="10" font-weight="700" fill="#4A473F">超额动作策略：</text>
  <text x="860" y="230" font-size="9.5" fill="#4A473F">• drop 模式：仅静默丢弃超额广播，业务单播不中断</text>
  <text x="860" y="244" font-size="9.5" fill="#733428">• err-disable 模式：超限直接物理关闭端口保护整机</text>

  <!-- 机制说明卡片 -->
  <rect x="848" y="260" width="328" height="268" rx="6" fill="#F8F7F2" stroke="#D8D5C8" stroke-width="1"/>
  <text x="862" y="282" font-size="11" font-weight="700" fill="#6B4E28">核心机制：</text>
  <text x="862" y="302" font-size="10.5" fill="#4A473F">• 监控三类泛洪帧：广播、未知单播、未知组播</text>
  <text x="862" y="322" font-size="10.5" fill="#4A473F">• 以 pps（包每秒）硬性计数，不看带宽字节数</text>
  <text x="862" y="342" font-size="10.5" fill="#4A473F">• 在 PHY/MAC 芯片阻断，消耗 0 交换机 CPU</text>
  <text x="862" y="362" font-size="10.5" fill="#4A473F">• 防范傻瓜 Hub 自环、网卡发疯与 ARP 洪水</text>

  <rect x="862" y="382" width="300" height="66" rx="4" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1"/>
  <text x="874" y="404" font-size="10.5" font-weight="700" fill="#6B4E28">工程定位：止血</text>
  <text x="874" y="424" font-size="10" fill="#6B4E28">端口级硬件硬限速，防止单点故障拖垮全网</text>
  <text x="874" y="440" font-size="9.5" fill="#6B675C">局限：只止血不根治环路</text>

  <text x="848" y="546" font-size="10.5" fill="#6B675C">芯片级特性 · ASIC Ingress Port Rate Limiting</text>

  <!-- ========================================================================= -->
  <!-- 底部防线协同条 -->
  <!-- ========================================================================= -->
  <rect x="48" y="626" width="1144" height="48" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="64" y="655" font-size="12" font-weight="700" fill="#2B2A26">协同防御纵深：</text>
  <text x="160" y="655" font-size="12" fill="#4A473F">STP 从拓扑消除环路（治本） → VLAN 约束广播扩散边界（控域） → Storm Control 端口硬件限速熔断（兜底止血）</text>
</svg>
