<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-labelledby="title desc">
  <title id="title">共享数据经过哪些硬件结构</title>
  <desc id="desc">两个核心的执行单元、Store Buffer、L1 和 L2 缓存，经一致性互连交换请求与数据。Invalidate Queue 用虚线表示可选的教学模型。收到确认、写入缓存和读线程实际读取是不同事件。</desc>
  <rect x="0" y="0" width="1240" height="690" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#526778"/></marker>
    <marker id="amber" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a77728"/></marker>
  </defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243746">
    <text x="42" y="43" font-size="24" font-weight="700">共享数据经过哪些硬件结构</text>
    <text x="42" y="73" font-size="15" fill="#526778">普通可缓存内存 · 两核示意 · 数据不必先写回 DRAM，另一核就能取得新值</text>
    <rect x="40" y="103" width="540" height="393" rx="12" fill="#f9faf9" stroke="#bbc8d0"/>
    <rect x="660" y="103" width="540" height="393" rx="12" fill="#f9faf9" stroke="#bbc8d0"/>
    <text x="60" y="131" font-size="18" font-weight="700">CPU 0 · 写线程当前运行处</text>
    <text x="680" y="131" font-size="18" font-weight="700">CPU 1 · 读线程当前运行处</text>
    <rect x="70" y="153" width="300" height="47" rx="6" fill="#dfeaf5" stroke="#7394b5"/>
    <text x="88" y="182" font-size="17">执行 store：data = 42</text>
    <rect x="690" y="153" width="300" height="47" rx="6" fill="#dfeaf5" stroke="#7394b5"/>
    <text x="708" y="182" font-size="17">执行 load：读取 data</text>
    <rect x="70" y="239" width="300" height="61" rx="6" fill="#e5eafa" stroke="#8997c2"/>
    <text x="88" y="264" font-size="17" font-weight="700">Store Buffer</text>
    <text x="88" y="286" font-size="14">待传播的写 · 地址 + 数据</text>
    <rect x="690" y="239" width="300" height="61" rx="6" fill="#e5eafa" stroke="#8997c2"/>
    <text x="708" y="264" font-size="17" font-weight="700">Store Buffer</text>
    <text x="708" y="286" font-size="14">本核也有 · 本例不用于发布</text>
    <path d="M220 200 V237" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="233" y="224" font-size="13">先暂存</text>
    <rect x="70" y="338" width="300" height="59" rx="6" fill="#e3eee6" stroke="#81a08b"/>
    <text x="88" y="363" font-size="17" font-weight="700">L1 数据缓存</text>
    <text x="88" y="385" font-size="14">缓存行数据 + 一致性状态</text>
    <rect x="690" y="338" width="300" height="59" rx="6" fill="#e3eee6" stroke="#81a08b"/>
    <text x="708" y="363" font-size="17" font-weight="700">L1 数据缓存</text>
    <text x="708" y="385" font-size="14">有效命中可用 · 失效后重新请求</text>
    <path d="M220 300 V336" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="233" y="323" font-size="13">写权限就绪后</text>
    <path d="M690 367 H677 V176 H688" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="70" y="430" width="300" height="40" rx="6" fill="#edf1f3" stroke="#a1b2bf"/>
    <text x="88" y="456" font-size="16">L2 缓存（示例为私有）</text>
    <rect x="690" y="430" width="300" height="40" rx="6" fill="#edf1f3" stroke="#a1b2bf"/>
    <text x="708" y="456" font-size="16">L2 缓存（示例为私有）</text>
    <path d="M220 397 V428" fill="none" stroke="#526778" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M840 397 V428" fill="none" stroke="#526778" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="405" y="239" width="150" height="158" rx="7" fill="#f8efdc" stroke="#a77728" stroke-dasharray="6 4"/>
    <rect x="1025" y="239" width="150" height="158" rx="7" fill="#f8efdc" stroke="#a77728" stroke-dasharray="6 4"/>
    <g font-size="15">
      <text x="420" y="266">Invalidate</text><text x="420" y="288">Queue（示意）</text>
      <text x="420" y="326">待处理失效请求</text><text x="420" y="353">处理后更新状态</text>
      <text x="1040" y="266">Invalidate</text><text x="1040" y="288">Queue（示意）</text>
      <text x="1040" y="326">待处理失效请求</text><text x="1040" y="353">处理后更新状态</text>
    </g>
    <path d="M405 367 H372" fill="none" stroke="#a77728" stroke-width="2" marker-end="url(#amber)"/>
    <path d="M1025 367 H992" fill="none" stroke="#a77728" stroke-width="2" marker-end="url(#amber)"/>
    <path d="M220 470 V520" fill="none" stroke="#526778" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M840 470 V520" fill="none" stroke="#526778" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M480 520 V399" fill="none" stroke="#a77728" stroke-width="2" marker-end="url(#amber)"/>
    <path d="M1100 520 V399" fill="none" stroke="#a77728" stroke-width="2" marker-end="url(#amber)"/>
    <text x="494" y="446" font-size="13" fill="#8b6323">失效请求</text>
    <text x="1114" y="446" font-size="13" fill="#8b6323">失效请求</text>
    <rect x="40" y="522" width="1160" height="52" rx="7" fill="#dfeaf5" stroke="#7394b5"/>
    <text x="62" y="545" font-size="17" font-weight="700">一致性互连 · 目录 / Snoop Filter · LLC（末级缓存）</text>
    <text x="62" y="565" font-size="13">读请求 / RFO / 失效 / ACK / 缓存行转发；目录可定位共享者，未必向所有核心广播</text>
    <path d="M620 574 V594" fill="none" stroke="#526778" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="400" y="596" width="440" height="36" rx="6" fill="#edf1f3" stroke="#a1b2bf"/>
    <text x="447" y="620" font-size="16">内存控制器 · DRAM</text>
    <text x="42" y="664" font-size="14" fill="#526778">虚线队列是解释延迟处理的模型；实际拓扑、队列与瞬态由 CPU 实现决定，仍须遵守 ISA 内存序。</text>
  </g>
</svg>
