<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 视觉系统对齐 8_0_1 / 8_0_2 -->
  <title>五状态、pin 边界与 Scatter-Gather</title>
  <desc>上半：pageable/locked/pinned/mapped/registered 五状态对照。中部：未 pin 时设备持旧地址的两条后果。下半：VA 连续 / PA 离散 / IOVA 可连续，SG 与 IOMMU 互补。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">mlock ≠ pin ≠ DMA map ≠ register —— 四件事解决四个问题</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">页面不能搬 · 设备用什么地址 · 允许访问哪一段 · 何时可复用缓冲区</text>

  <!-- ============ Panel A：五状态 ============ -->
  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">A · 五个词对照：保证什么？是否足以让设备 DMA？</text>

  <!-- headers -->
  <rect x="48" y="128" width="180" height="36" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="138" y="152" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">状态 / 动作</text>
  <rect x="236" y="128" width="520" height="36" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="496" y="152" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">它保证什么</text>
  <rect x="764" y="128" width="428" height="36" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="978" y="152" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">能否让设备 DMA</text>

  <!-- row 1 pageable -->
  <rect x="48" y="172" width="180" height="48" rx="7" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
  <text x="138" y="201" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">Pageable</text>
  <rect x="236" y="172" width="520" height="48" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="256" y="201" font-size="12" fill="#4A473F">普通虚拟内存 · 可回收 / 换出 / 迁移</text>
  <rect x="764" y="172" width="428" height="48" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="978" y="201" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">否</text>

  <!-- row 2 locked -->
  <rect x="48" y="228" width="180" height="48" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="138" y="257" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">Locked</text>
  <rect x="236" y="228" width="520" height="48" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="256" y="257" font-size="12" fill="#4A473F">用户请求驻留 · 如 mlock 语义</text>
  <rect x="764" y="228" width="428" height="48" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="978" y="257" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">否 · 不自动建立设备映射</text>

  <!-- row 3 pinned -->
  <rect x="48" y="284" width="180" height="48" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="138" y="313" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">Pinned</text>
  <rect x="236" y="284" width="520" height="48" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="256" y="313" font-size="12" fill="#4A473F">I/O 生命周期固定物理页 · 阻迁移/回收</text>
  <rect x="764" y="284" width="428" height="48" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="978" y="313" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">仍不够 · 还需 DMA mapping</text>

  <!-- row 4 mapped -->
  <rect x="48" y="340" width="180" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="138" y="369" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">DMA-mapped</text>
  <rect x="236" y="340" width="520" height="48" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="256" y="369" font-size="12" fill="#4A473F">为特定设备建立 DMA 地址 · 方向 · 属性</text>
  <rect x="764" y="340" width="428" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="978" y="369" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">是 · 在映射与所有权约束内</text>

  <!-- row 5 registered -->
  <rect x="48" y="396" width="180" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="138" y="425" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">Registered</text>
  <rect x="236" y="396" width="520" height="48" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="256" y="425" font-size="12" fill="#4A473F">子系统提前登记页 / 映射 / 权限 / 元数据</text>
  <rect x="764" y="396" width="428" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="978" y="425" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">取决于具体 API</text>

  <!-- ============ Panel B：为何必须 pin ============ -->
  <text x="48" y="484" font-size="13" font-weight="700" fill="#4A473F">B · 为什么必须 pin：设备异步使用旧地址时，页面不能搬家</text>

  <rect x="48" y="500" width="560" height="168" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="72" y="520" width="200" height="48" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="172" y="540" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">设备保存旧 DMA 地址</text>
  <text x="172" y="558" font-size="10.5" fill="#8A6A3A" text-anchor="middle">未来异步时刻才用</text>

  <path d="M172,570 L172,596" fill="none" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrr)"/>

  <rect x="72" y="600" width="200" height="48" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="172" y="620" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">页面迁移 / 回收 / 再分配</text>
  <text x="172" y="638" font-size="10.5" fill="#A64B3C" text-anchor="middle">旧地址含义已变</text>

  <path d="M280,624 L320,624" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>

  <rect x="328" y="520" width="250" height="60" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="453" y="544" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">无 IOMMU</text>
  <text x="453" y="564" font-size="11" fill="#A64B3C" text-anchor="middle">可能写坏其他对象 · 静默损坏</text>

  <rect x="328" y="596" width="250" height="60" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="453" y="620" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">有 IOMMU · 旧映射已撤</text>
  <text x="453" y="640" font-size="11" fill="#8A6A3A" text-anchor="middle">可触发 IOMMU fault（可观测）</text>

  <rect x="628" y="500" width="564" height="168" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="648" y="532" font-size="13" font-weight="700" fill="#4A473F">pin 的时间边界</text>
  <text x="648" y="562" font-size="12.5" fill="#2B2A26">从设备可能开始使用该地址</text>
  <text x="648" y="586" font-size="12.5" fill="#2B2A26">到软件确认设备不再使用该地址</text>

  <rect x="648" y="608" width="524" height="40" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="668" y="634" font-size="12" fill="#6B4E28">不是“分配就永久 pin” · 异步 I/O 必须等对应 completion</text>

  <!-- ============ Panel C：SG 布局 ============ -->
  <text x="48" y="708" font-size="13" font-weight="700" fill="#4A473F">C · Scatter-Gather：虚拟连续 · 物理可以离散 · IOVA 可由 IOMMU 拼成连续</text>

  <rect x="48" y="724" width="1144" height="160" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <!-- VA row -->
  <text x="72" y="760" font-size="12" font-weight="700" fill="#2C4460">用户 VA</text>
  <rect x="160" y="740" width="100" height="32" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="210" y="761" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">Page 0</text>
  <rect x="264" y="740" width="100" height="32" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="314" y="761" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">Page 1</text>
  <rect x="368" y="740" width="100" height="32" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="418" y="761" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">Page 2</text>
  <text x="490" y="761" font-size="12" fill="#3D5A80">连续</text>

  <!-- PA row -->
  <text x="72" y="812" font-size="12" font-weight="700" fill="#24473F">物理 PA</text>
  <rect x="160" y="792" width="90" height="32" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="205" y="813" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">PA A</text>
  <rect x="300" y="792" width="90" height="32" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="345" y="813" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">PA F</text>
  <rect x="440" y="792" width="90" height="32" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="485" y="813" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">PA C</text>
  <text x="550" y="813" font-size="12" fill="#2F6B5E">离散</text>

  <!-- mapping lines VA to PA -->
  <path d="M210,774 L205,790" fill="none" stroke="#5A564B" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M314,774 L345,790" fill="none" stroke="#5A564B" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M418,774 L485,790" fill="none" stroke="#5A564B" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- IOVA row -->
  <text x="640" y="760" font-size="12" font-weight="700" fill="#6B4E28">设备 IOVA</text>
  <rect x="730" y="740" width="300" height="32" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="880" y="761" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">IOVA X 连续区间</text>
  <text x="1050" y="761" font-size="12" fill="#8A6A3A">可连续</text>

  <!-- two means -->
  <rect x="640" y="792" width="250" height="68" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="660" y="818" font-size="12" font-weight="700" fill="#4A3F68">手段 1 · IOMMU 重映射</text>
  <text x="660" y="840" font-size="11" fill="#6B5B95">连续 IOVA → 离散 PA</text>

  <rect x="910" y="792" width="250" height="68" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="930" y="818" font-size="12" font-weight="700" fill="#2C4460">手段 2 · Scatter-Gather</text>
  <text x="930" y="840" font-size="11" fill="#3D5A80">多段 DMA 地址 + 长度</text>
</svg>
