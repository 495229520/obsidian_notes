<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">从局部验证到可验证计算：模型、密码学工具与安全属性分层</title>
<desc id="desc">交互式证明和固定证明的局部查询作为两个概念入口，IOP结合交互与预言机查询。承诺和适用的Fiat-Shamir等编译生成具体论证系统。SNARK与STARK名称强调不同属性而非互斥类别。零知识单独标注为额外安全轴。</desc>
<defs>
<marker id="arr-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A7EA4"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<text id="t0" x="48" y="49" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">从局部验证到可验证计算：模型、密码学工具与安全属性分层</text>
<text id="t1" x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">这是认知地图，不是所有证明系统都必须依次执行的流水线。零知识是额外属性，不是验证正确性的别名。</text>
<rect x="48" y="111" width="336" height="275" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t2" x="64" y="137" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start" data-role="section">A · 验证模型</text>
<rect x="68" y="157" width="296" height="65" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text id="t3" x="216.0" y="185.5" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Interactive Proof</text>
<text id="t4" x="216.0" y="207.5" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">交互消息 + 随机挑战</text>
<rect x="68" y="245" width="296" height="65" rx="8" fill="#EDEAF3" stroke="#8A7EA4" stroke-width="1.2"/>
<text id="t5" x="216.0" y="273.5" font-size="15" font-weight="700" fill="#6B5B95" text-anchor="middle" data-role="body">PCP</text>
<text id="t6" x="216.0" y="295.5" font-size="13" font-weight="400" fill="#6B5B95" text-anchor="middle" data-role="body">固定证明 + 局部查询</text>
<text id="t7" x="69" y="345" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">IOP：交互 + 大对象的局部访问</text>
<text id="t8" x="69" y="369" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">关注：完备性 / 可靠性</text>
<rect x="415" y="111" width="358" height="275" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t9" x="431" y="137" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="section">B · 密码学落地</text>
<rect x="435" y="157" width="318" height="65" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text id="t10" x="594.0" y="185.5" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">Commitment / Opening</text>
<text id="t11" x="594.0" y="207.5" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">先固定，再回答挑战</text>
<rect x="435" y="245" width="318" height="65" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text id="t12" x="594.0" y="273.5" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">适用的密码学编译</text>
<text id="t13" x="594.0" y="295.5" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">Fiat–Shamir 等变换</text>
<text id="t14" x="436" y="345" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">安全假设 + 规范编码 + 域分离</text>
<text id="t15" x="436" y="369" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">不能对任意协议直接“换成 Hash”</text>
<line x1="388" y1="243" x2="411" y2="243" stroke="#3D5A80" stroke-width="1.7" marker-end="url(#arr-blue)"/>
<rect x="804" y="111" width="388" height="275" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t16" x="820" y="137" font-size="15" font-weight="700" fill="#24473F" text-anchor="start" data-role="section">C · 具体论证系统</text>
<text id="t17" x="824" y="166" font-size="18" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">SNARK</text>
<text id="t18" x="824" y="191" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">简洁 / 非交互 / 知识论证</text>
<text id="t19" x="824" y="231" font-size="18" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">STARK</text>
<text id="t20" x="824" y="256" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">可扩展 / 透明 / 知识论证</text>
<line x1="824" y1="273" x2="1170" y2="273" stroke="#9B968A" stroke-width="1.7"/>
<text id="t21" x="824" y="303" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">名称属性有重叠，并非互斥集合</text>
<text id="t22" x="824" y="335" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">看实例：设置 / 承诺 / 安全参数</text>
<text id="t23" x="824" y="359" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">例：Groth16 · PLONK · STARK 路线</text>
<line x1="777" y1="243" x2="800" y2="243" stroke="#8A6A3A" stroke-width="1.7" marker-end="url(#arr-amber)"/>
<path d="M1000,390 L1000,408 L599,408 L599,428" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-green)"/>
<rect x="48" y="432" width="720" height="161" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t24" x="64" y="458" font-size="15" font-weight="700" fill="#24473F" text-anchor="start" data-role="section">D · 应用最终验证的仍是一个关系</text>
<text id="t25" x="70" y="487" font-size="23" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">R(s, w) = 1</text>
<text id="t26" x="300" y="482" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">s：公开语句</text>
<text id="t27" x="300" y="506" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">输入 / 输出 / 程序 / 承诺</text>
<text id="t28" x="551" y="482" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">w：见证</text>
<text id="t29" x="551" y="506" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">私有值 / 轨迹</text>
<text id="t30" x="70" y="559" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">Verifiable Computation → zkML 等应用</text>
<rect x="798" y="432" width="394" height="161" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t31" x="814" y="458" font-size="15" font-weight="700" fill="#6B5B95" text-anchor="start" data-role="section">额外轴 · Zero-Knowledge</text>
<text id="t32" x="819" y="485" font-size="15" font-weight="700" fill="#6B5B95" text-anchor="start" data-role="body">隐藏约定的私有见证</text>
<text id="t33" x="819" y="515" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">取决于具体构造与配置</text>
<text id="t34" x="819" y="555" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">公开 s 与输出的信息不会消失</text>
<rect x="48" y="618" width="1144" height="54" rx="7" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t35" x="64" y="641" font-size="14" font-weight="700" fill="#4A473F" text-anchor="start" data-role="footer">读法：先说清声明，再问如何验证；先核对具体安全性质，再讨论“快”或“隐私”。</text>
<text id="t36" x="64" y="662" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">概念重组图 · 非协议实现图 · 不要求证明 PCP 定理 · 对应笔记 §1、§2、§4、§6</text>
</svg>