<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 630" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>六个应用层协议：端口、传输层与消息边界</title>
  <desc>把 HTTP、HTTPS、SSH、DNS、FTP、SMTP 六个协议按端口、传输层协议、消息边界机制和报文形态列表对照，右侧按分隔符、长度前缀、数据报边界三类归纳边界办法，底部标出这些端口在端口空间中的位置。</desc>

  <rect x="0" y="0" width="1240" height="630" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">六个应用层协议：端口、传输层与消息边界</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">端口决定找谁，传输层决定可靠性，边界机制决定一条消息从哪读到哪</text>

  <!-- ============ Panel A: 对照表 ============ -->
  <rect x="48" y="104" width="700" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 六个协议的端口与边界机制</text>

  <rect x="72" y="146" width="652" height="28" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="84" y="165" font-size="11.5" font-weight="700" fill="#4A473F">协议</text>
  <text x="227" y="165" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">端口</text>
  <text x="337" y="165" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">传输层</text>
  <text x="414" y="165" font-size="11.5" font-weight="700" fill="#4A473F">边界机制</text>
  <text x="688" y="165" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">形态</text>

  <rect x="72" y="174" width="652" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="0.8"/>
  <rect x="72" y="208" width="652" height="34" fill="#F4F2EA" stroke="#D8D5C8" stroke-width="0.8"/>
  <rect x="72" y="242" width="652" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="0.8"/>
  <rect x="72" y="276" width="652" height="34" fill="#F4F2EA" stroke="#D8D5C8" stroke-width="0.8"/>
  <rect x="72" y="310" width="652" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="0.8"/>
  <rect x="72" y="344" width="652" height="34" fill="#F4F2EA" stroke="#D8D5C8" stroke-width="0.8"/>

  <line x1="182" y1="146" x2="182" y2="378" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="272" y1="146" x2="272" y2="378" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="402" y1="146" x2="402" y2="378" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="652" y1="146" x2="652" y2="378" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="72" y="146" width="652" height="232" fill="none" stroke="#9B968A" stroke-width="1.2"/>

  <text x="84" y="196" font-size="12" font-weight="700" fill="#2B2A26">HTTP</text>
  <text x="227" y="196" font-size="11.5" fill="#4A473F" text-anchor="middle">80</text>
  <text x="337" y="196" font-size="11.5" fill="#4A473F" text-anchor="middle">TCP</text>
  <text x="414" y="196" font-size="11.5" fill="#4A473F">CRLF + 空行 + Content-Length</text>
  <rect x="662" y="182" width="52" height="20" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="688" y="196" font-size="10.5" fill="#24473F" text-anchor="middle">文本</text>

  <text x="84" y="230" font-size="12" font-weight="700" fill="#2B2A26">HTTPS</text>
  <text x="227" y="230" font-size="11.5" fill="#4A473F" text-anchor="middle">443</text>
  <text x="337" y="230" font-size="11.5" fill="#4A473F" text-anchor="middle">TCP</text>
  <text x="414" y="230" font-size="11.5" fill="#4A473F">TLS 记录头自带 2 字节长度</text>
  <rect x="662" y="216" width="52" height="20" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="688" y="230" font-size="10.5" fill="#2C4460" text-anchor="middle">二进制</text>

  <text x="84" y="264" font-size="12" font-weight="700" fill="#2B2A26">SSH</text>
  <text x="227" y="264" font-size="11.5" fill="#4A473F" text-anchor="middle">22</text>
  <text x="337" y="264" font-size="11.5" fill="#4A473F" text-anchor="middle">TCP</text>
  <text x="414" y="264" font-size="11.5" fill="#4A473F">4 字节长度前缀</text>
  <rect x="662" y="250" width="52" height="20" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="688" y="264" font-size="10.5" fill="#2C4460" text-anchor="middle">二进制</text>

  <text x="84" y="298" font-size="12" font-weight="700" fill="#2B2A26">DNS</text>
  <text x="227" y="298" font-size="11.5" fill="#4A473F" text-anchor="middle">53</text>
  <text x="337" y="298" font-size="11.5" fill="#4A473F" text-anchor="middle">UDP 为主</text>
  <text x="414" y="298" font-size="11.5" fill="#4A473F">数据报边界；走 TCP 加 2 字节长度</text>
  <rect x="662" y="284" width="52" height="20" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="688" y="298" font-size="10.5" fill="#2C4460" text-anchor="middle">二进制</text>

  <text x="84" y="332" font-size="12" font-weight="700" fill="#2B2A26">FTP</text>
  <text x="227" y="332" font-size="11.5" fill="#4A473F" text-anchor="middle">20 / 21</text>
  <text x="337" y="332" font-size="11.5" fill="#4A473F" text-anchor="middle">TCP ×2</text>
  <text x="414" y="332" font-size="11.5" fill="#4A473F">控制连接用 CRLF，数据连接靠关闭</text>
  <rect x="662" y="318" width="52" height="20" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="688" y="332" font-size="10.5" fill="#24473F" text-anchor="middle">文本</text>

  <text x="84" y="366" font-size="12" font-weight="700" fill="#2B2A26">SMTP</text>
  <text x="227" y="366" font-size="11.5" fill="#4A473F" text-anchor="middle">25</text>
  <text x="337" y="366" font-size="11.5" fill="#4A473F" text-anchor="middle">TCP</text>
  <text x="414" y="366" font-size="11.5" fill="#4A473F">CRLF；正文以单独一行的 . 结束</text>
  <rect x="662" y="352" width="52" height="20" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="688" y="366" font-size="10.5" fill="#24473F" text-anchor="middle">文本</text>

  <!-- ============ Panel B: 三种边界办法 ============ -->
  <rect x="772" y="104" width="420" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="796" y="132" font-size="15" font-weight="700" fill="#4A473F">B · 边界只有三种办法</text>

  <rect x="796" y="148" width="372" height="72" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="812" y="170" font-size="12.5" font-weight="700" fill="#6B4E28">① 分隔符</text>
  <text x="812" y="190" font-size="11" fill="#6B4E28">HTTP · FTP 控制连接 · SMTP</text>
  <text x="812" y="210" font-size="10.5" fill="#8A6A3A">要逐字节扫，正文不能含分隔符</text>

  <rect x="796" y="228" width="372" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="812" y="250" font-size="12.5" font-weight="700" fill="#2C4460">② 长度前缀</text>
  <text x="812" y="270" font-size="11" fill="#2C4460">SSH · TLS 记录层 · DNS over TCP</text>
  <text x="812" y="290" font-size="10.5" fill="#3D5A80">读一次长度就精确切分，必须设上限</text>

  <rect x="796" y="308" width="372" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="812" y="330" font-size="12.5" font-weight="700" fill="#24473F">③ 数据报天然边界</text>
  <text x="812" y="350" font-size="11" fill="#24473F">DNS over UDP</text>
  <text x="812" y="370" font-size="10.5" fill="#2F6B5E">一次 sendto 对应一次 recvfrom</text>

  <!-- ============ Panel C: 端口空间 ============ -->
  <rect x="48" y="428" width="1144" height="156" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="456" font-size="15" font-weight="700" fill="#4A473F">C · 这些端口落在端口空间的哪一段</text>

  <rect x="72" y="472" width="380" height="44" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="262" y="490" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">知名端口 0–1023</text>
  <text x="262" y="508" font-size="10.5" fill="#8A6A3A" text-anchor="middle">IANA 指派，绑定需特权</text>

  <rect x="452" y="472" width="380" height="44" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="642" y="490" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">注册端口 1024–49151</text>
  <text x="642" y="508" font-size="10.5" fill="#6B675C" text-anchor="middle">厂商登记，普通用户可绑</text>

  <rect x="832" y="472" width="336" height="44" fill="#F4F2EA" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1000" y="490" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">动态端口 49152–65535</text>
  <text x="1000" y="508" font-size="10.5" fill="#6B675C" text-anchor="middle">内核分配给客户端</text>

  <rect x="72" y="534" width="46" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="95" y="551" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">20</text>
  <rect x="124" y="534" width="46" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="147" y="551" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">21</text>
  <rect x="176" y="534" width="46" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="199" y="551" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">22</text>
  <rect x="228" y="534" width="46" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="251" y="551" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">25</text>
  <rect x="280" y="534" width="46" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="303" y="551" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">53</text>
  <rect x="332" y="534" width="46" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="355" y="551" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">80</text>
  <rect x="384" y="534" width="46" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="407" y="551" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">443</text>

  <line x1="262" y1="516" x2="262" y2="532" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="452" y="551" font-size="11.5" fill="#4A473F">六个协议的服务端口全部小于 1024，普通用户进程绑不上</text>
</svg>
