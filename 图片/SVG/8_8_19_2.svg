<rect x="0" y="0" width="1240" height="680" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="52" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">Chunk 与 Step：上半看切分，下半看有界空间</text>
<text x="48" y="81" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">教学参数：32 MiB / rank，2 个 Channel，4 rank；所有块大小与槽位数均非 NCCL 默认值。</text>
<text x="64" y="120" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">A · 数据空间：消息 → 通道 → 循环 → 分片</text>
