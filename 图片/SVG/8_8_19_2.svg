<text x="725" y="489" font-size="17" fill="#2B2A26" font-weight="700" text-anchor="start">slot = step mod S</text>
<text x="725" y="520" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start">producer − reclaimed &lt; S</text>
<text x="725" y="555" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">空间可写 ≠ 数据可读 ≠ 允许覆盖</text>
