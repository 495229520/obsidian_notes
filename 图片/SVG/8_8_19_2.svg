<text x="48" y="637" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">框架 bucket、Channel partition、Chunk、Slice、Step、网络 MTU 属于不同层次；不要用一个“块大小”概括。</text>
<text x="48" y="660" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">对应 8.19 §4、§5；槽位状态是教学抽象，不是固定版本所有 head / tail 的字段定义。</text>
