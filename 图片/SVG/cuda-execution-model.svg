<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <linearGradient id="gpu" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="cpu" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2933; }
      .h2 { font: 700 20px Arial, sans-serif; fill: #263238; }
      .text { font: 15px Arial, sans-serif; fill: #37474f; }
      .small { font: 13px Arial, sans-serif; fill: #455a64; }
      .box { stroke: #607d8b; stroke-width: 2; rx: 14; }
      .block { fill: #fff8e1; stroke: #f9a825; stroke-width: 2; rx: 10; }
      .thread { fill: #fff; stroke: #8d6e63; stroke-width: 1.4; rx: 5; }
      .arrow { stroke: #455a64; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .note { fill: #f5f5f5; stroke: #b0bec5; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>

  <rect width="980" height="560" fill="#ffffff"/>
  <text x="40" y="46" class="title">CUDA 执行模型：CPU 负责调度，GPU 批量执行线程</text>

  <rect x="40" y="90" width="250" height="380" fill="url(#cpu)" class="box"/>
  <text x="70" y="130" class="h2">Host / CPU</text>
  <text x="70" y="165" class="text">1. 准备输入数据</text>
  <text x="70" y="195" class="text">2. 分配 device memory</text>
  <text x="70" y="225" class="text">3. 拷贝数据到 GPU</text>
  <text x="70" y="255" class="text">4. 启动 kernel</text>
  <text x="70" y="285" class="text">5. 等待 GPU 完成</text>
  <text x="70" y="315" class="text">6. 拷回结果并校验</text>

  <rect x="70" y="355" width="190" height="70" class="note"/>
  <text x="88" y="382" class="small">CPU 不直接执行 kernel</text>
  <text x="88" y="405" class="small">它只是发起 GPU 工作</text>

  <path d="M300 250 C360 250, 370 250, 430 250" class="arrow"/>
  <text x="325" y="232" class="small">kernel launch</text>
  <text x="322" y="274" class="small"><<<grid, block>>></text>

  <rect x="430" y="90" width="510" height="380" fill="url(#gpu)" class="box"/>
  <text x="460" y="130" class="h2">Device / GPU</text>
  <text x="460" y="158" class="text">Grid：一次 kernel launch 产生的全部线程集合</text>

  <rect x="470" y="190" width="130" height="170" class="block"/>
  <text x="502" y="218" class="text">Block 0</text>
  <rect x="490" y="245" width="38" height="30" class="thread"/><text x="500" y="265" class="small">T0</text>
  <rect x="540" y="245" width="38" height="30" class="thread"/><text x="550" y="265" class="small">T1</text>
  <rect x="490" y="290" width="38" height="30" class="thread"/><text x="500" y="310" class="small">T2</text>
  <rect x="540" y="290" width="38" height="30" class="thread"/><text x="550" y="310" class="small">T3</text>
  <text x="496" y="342" class="small">threadIdx.x</text>

  <rect x="635" y="190" width="130" height="170" class="block"/>
  <text x="667" y="218" class="text">Block 1</text>
  <rect x="655" y="245" width="38" height="30" class="thread"/><text x="665" y="265" class="small">T0</text>
  <rect x="705" y="245" width="38" height="30" class="thread"/><text x="715" y="265" class="small">T1</text>
  <rect x="655" y="290" width="38" height="30" class="thread"/><text x="665" y="310" class="small">T2</text>
  <rect x="705" y="290" width="38" height="30" class="thread"/><text x="715" y="310" class="small">T3</text>
  <text x="661" y="342" class="small">blockIdx.x = 1</text>

  <rect x="800" y="190" width="100" height="170" class="block"/>
  <text x="825" y="218" class="text">...</text>
  <text x="818" y="275" class="small">更多</text>
  <text x="815" y="300" class="small">Block</text>

  <rect x="505" y="395" width="355" height="45" class="note"/>
  <text x="525" y="423" class="text">全局下标：idx = blockIdx.x × blockDim.x + threadIdx.x</text>

  <text x="40" y="520" class="small">核心理解：CUDA 把一个大任务拆成大量线程；CPU 负责发起任务，GPU 负责用许多线程并行执行。</text>
</svg>
