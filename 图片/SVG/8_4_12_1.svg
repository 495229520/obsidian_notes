<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>rkey / lkey 生命周期</title>
  <desc>四幕生命周期、lkey 与 rkey 双泳道时间线上的三个危险窗口、四种撤销武器的成本对照</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">rkey / lkey 生命周期：四幕、两条泳道与三个危险窗口</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">网卡只认钥匙不认人 —— 断连不等于撤销；buffer 复用之前必须先收回授权</text>

  <!-- A · 四幕 -->
  <text x="56" y="118" font-size="13" font-weight="700" fill="#4A473F">A · 四幕：出生 → 出境 → 在途使用 → 失效</text>

  <rect x="56" y="132" width="248" height="86" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="180" y="156" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 出生 · ibv_reg_mr</text>
  <text x="180" y="176" font-size="10.5" fill="#2C4460" text-anchor="middle">pin + 下发翻译表 + 铸两把钥匙</text>
  <text x="180" y="194" font-size="10.5" fill="#2C4460" text-anchor="middle">系统调用，GB 级毫秒计（4.4）</text>

  <rect x="352" y="132" width="248" height="86" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="476" y="156" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">② 出境 · rkey 交给远端</text>
  <text x="476" y="176" font-size="10.5" fill="#6B4E28" text-anchor="middle">CM private_data / 握手 SEND /</text>
  <text x="476" y="194" font-size="10.5" fill="#6B4E28" text-anchor="middle">每 IO 命令捎带 —— 授权自此外泄</text>

  <rect x="648" y="132" width="248" height="86" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="772" y="156" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">③ 在途使用</text>
  <text x="772" y="176" font-size="10.5" fill="#24473F" text-anchor="middle">本端 SGE 消费 lkey；远端携带 rkey</text>
  <text x="772" y="194" font-size="10.5" fill="#24473F" text-anchor="middle">网卡逐次验卡：范围 · PD · 权限</text>

  <rect x="944" y="132" width="248" height="86" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.5"/>
  <text x="1068" y="156" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">④ 失效 · 显式撤销</text>
  <text x="1068" y="176" font-size="10.5" fill="#4A473F" text-anchor="middle">dereg / rereg / MW 关窗 /</text>
  <text x="1068" y="194" font-size="10.5" fill="#4A473F" text-anchor="middle">远端 invalidate —— 唯一收回手段</text>

  <line x1="304" y1="175" x2="346" y2="175" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="600" y1="175" x2="642" y2="175" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="896" y1="175" x2="938" y2="175" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- B · 时间线泳道 -->
  <text x="56" y="262" font-size="13" font-weight="700" fill="#4A473F">B · 有效期时间线：钥匙的生死与三个危险窗口</text>

  <!-- 时间轴 -->
  <line x1="200" y1="286" x2="1180" y2="286" stroke="#9B968A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="1186" y="278" font-size="10" fill="#6B675C" text-anchor="end">时间</text>
  <!-- 事件刻度 -->
  <g font-size="10" fill="#6B675C" text-anchor="middle">
    <line x1="220" y1="280" x2="220" y2="292" stroke="#6B675C" stroke-width="1.2"/>
    <text x="220" y="274">reg_mr</text>
    <line x1="400" y1="280" x2="400" y2="292" stroke="#6B675C" stroke-width="1.2"/>
    <text x="400" y="274">rkey 出境</text>
    <line x1="520" y1="280" x2="520" y2="292" stroke="#6B675C" stroke-width="1.2"/>
    <text x="520" y="274">post WR</text>
    <line x1="700" y1="280" x2="700" y2="292" stroke="#6B675C" stroke-width="1.2"/>
    <text x="700" y="274">CQE 收割</text>
    <line x1="800" y1="280" x2="800" y2="292" stroke="#6B675C" stroke-width="1.2"/>
    <text x="800" y="274">QP 断连</text>
    <line x1="930" y1="280" x2="930" y2="292" stroke="#6B675C" stroke-width="1.2"/>
    <text x="930" y="274">buffer 挪用?</text>
    <line x1="1080" y1="280" x2="1080" y2="292" stroke="#6B675C" stroke-width="1.2"/>
    <text x="1080" y="274">撤销</text>
  </g>

  <!-- lkey 泳道 -->
  <rect x="56" y="302" width="1128" height="116" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="324" font-size="12" font-weight="700" fill="#3D5A80">lkey · 只在本端活动</text>
  <rect x="220" y="336" width="860" height="30" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="650" y="356" font-size="11" fill="#2C4460" text-anchor="middle">lkey 有效期 = 注册 → 注销（期间被任意多个 WQE 的 SGE 引用）</text>
  <rect x="520" y="374" width="180" height="32" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="610" y="388" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">危险窗口 1 · 在途 WR 引用中</text>
  <text x="610" y="401" font-size="9.5" fill="#733428" text-anchor="middle">此区间 dereg → LOC_PROT / DMA 竞态</text>

  <!-- rkey 泳道 -->
  <rect x="56" y="432" width="1128" height="150" rx="8" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="454" font-size="12" font-weight="700" fill="#6B5B95">rkey · 出境后散落在远端</text>
  <rect x="400" y="466" width="680" height="30" rx="5" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
  <text x="740" y="486" font-size="11" fill="#6B4E28" text-anchor="middle">rkey 副本在远端手中 —— 有效性绑定 MR + PD，与任何 QP / 连接无关</text>

  <line x1="800" y1="466" x2="800" y2="540" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="712" y="540" width="240" height="34" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="832" y="554" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">危险窗口 3 · 断连 ≠ 撤销</text>
  <text x="832" y="568" font-size="9.5" fill="#733428" text-anchor="middle">QP 销毁后旧钥匙照样验卡通过</text>

  <rect x="930" y="504" width="150" height="34" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1005" y="518" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">危险窗口 2 · 复用早于撤销</text>
  <text x="1005" y="531" font-size="9.5" fill="#733428" text-anchor="middle">迟到 WRITE 静默覆盖新数据</text>

  <rect x="1080" y="466" width="8" height="30" fill="#4A473F"/>
  <text x="1096" y="486" font-size="10.5" fill="#4A473F">撤销点：</text>
  <text x="1096" y="500" font-size="10.5" fill="#4A473F">唯一终点</text>

  <!-- C · 撤销武器 -->
  <text x="56" y="626" font-size="13" font-weight="700" fill="#4A473F">C · 撤销的四种武器：成本差三个数量级</text>

  <rect x="56" y="640" width="262" height="140" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.3"/>
  <text x="187" y="664" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">ibv_dereg_mr</text>
  <text x="187" y="684" font-size="10.5" fill="#4A473F" text-anchor="middle">拆翻译表 + 解 pin</text>
  <text x="187" y="702" font-size="10.5" fill="#4A473F" text-anchor="middle">系统调用 · 毫秒级</text>
  <text x="187" y="720" font-size="10.5" fill="#4A473F" text-anchor="middle">粒度：整个 MR</text>
  <text x="187" y="744" font-size="10" fill="#6B675C" text-anchor="middle">场景：池销毁 / 进程退出</text>
  <text x="187" y="762" font-size="10" fill="#6B675C" text-anchor="middle">（生命周期终点）</text>

  <rect x="350" y="640" width="262" height="140" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.3"/>
  <text x="481" y="664" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">ibv_rereg_mr</text>
  <text x="481" y="684" font-size="10.5" fill="#4A473F" text-anchor="middle">原地换钥匙（rkey 轮换）</text>
  <text x="481" y="702" font-size="10.5" fill="#4A473F" text-anchor="middle">系统调用 · 与 dereg 同量级</text>
  <text x="481" y="720" font-size="10.5" fill="#4A473F" text-anchor="middle">粒度：整个 MR</text>
  <text x="481" y="744" font-size="10" fill="#6B675C" text-anchor="middle">场景：低频换锁</text>
  <text x="481" y="762" font-size="10" fill="#6B675C" text-anchor="middle">（怀疑泄露 / 周期轮换）</text>

  <rect x="644" y="640" width="262" height="140" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="775" y="664" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">Memory Window bind</text>
  <text x="775" y="684" font-size="10.5" fill="#24473F" text-anchor="middle">在已注册 MR 上开窗 / 关窗</text>
  <text x="775" y="702" font-size="10.5" fill="#24473F" text-anchor="middle">WQE 级 · 微秒以内</text>
  <text x="775" y="720" font-size="10.5" fill="#24473F" text-anchor="middle">粒度：任意子区间，每次换新 rkey</text>
  <text x="775" y="744" font-size="10" fill="#42604F" text-anchor="middle">场景：每请求开窗</text>
  <text x="775" y="762" font-size="10" fill="#42604F" text-anchor="middle">（内核态对应物：FRWR）</text>

  <rect x="938" y="640" width="262" height="140" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="1069" y="664" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">SEND with Invalidate</text>
  <text x="1069" y="684" font-size="10.5" fill="#2C4460" text-anchor="middle">远端在响应里捎带失效指令</text>
  <text x="1069" y="702" font-size="10.5" fill="#2C4460" text-anchor="middle">零额外消息 · 收尾即撤销</text>
  <text x="1069" y="720" font-size="10.5" fill="#2C4460" text-anchor="middle">粒度：一把 rkey</text>
  <text x="1069" y="744" font-size="10" fill="#3E5570" text-anchor="middle">场景：请求-响应协议（NVMe-oF）</text>
  <text x="1069" y="762" font-size="10" fill="#3E5570" text-anchor="middle">必须验证 IBV_WC_WITH_INV</text>

  <!-- 底部准则条 -->
  <rect x="56" y="804" width="1144" height="56" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="628" y="827" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">选型准则：授权变更频率决定武器 —— 每 IO 换钥匙必须 WQE 级（MW / FRWR / 远端 invalidate）</text>
  <text x="628" y="847" font-size="11" fill="#6B675C" text-anchor="middle">reg / dereg 只配出现在初始化与销毁；出境的每一把钥匙都要有对应的"确认收回"步骤</text>
</svg>
