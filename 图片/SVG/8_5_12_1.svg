<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 890" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>共享加锁 vs thread-per-core</title>
  <desc>左侧为共享数据加锁模型的缓存行弹跳与锁排队，右侧为 thread-per-core 的私有数据与有界消息环，底部为背压机制。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="890" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">无锁 thread-per-core：不是"锁变快了"，是"共享消失了"</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">数据只属于一个核；想动别人的数据，发消息请所有者代劳 · 唯一的同步点收敛到消息环的头尾指针上</text>

  <!-- ============ A: 共享 + 锁 ============ -->
  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">A · 共享 + 锁：数据是大家的，锁和缓存行是瓶颈</text>
  <rect x="48" y="126" width="552" height="440" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="68" y="146" width="112" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="124" y="164" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">Core 0</text>
  <text x="124" y="180" font-size="9.5" fill="#3D5A80" text-anchor="middle">线程 T0</text>
  <rect x="198" y="146" width="112" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="254" y="164" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">Core 1</text>
  <text x="254" y="180" font-size="9.5" fill="#3D5A80" text-anchor="middle">线程 T1</text>
  <rect x="328" y="146" width="112" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="384" y="164" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">Core 2</text>
  <text x="384" y="180" font-size="9.5" fill="#3D5A80" text-anchor="middle">线程 T2</text>
  <rect x="458" y="146" width="112" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="514" y="164" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">Core 3</text>
  <text x="514" y="180" font-size="9.5" fill="#3D5A80" text-anchor="middle">线程 T3</text>

  <line x1="124" y1="190" x2="270" y2="273" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrr)"/>
  <line x1="254" y1="190" x2="300" y2="273" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrr)"/>
  <line x1="384" y1="190" x2="340" y2="273" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrr)"/>
  <line x1="514" y1="190" x2="372" y2="273" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrr)"/>
  <text x="90" y="240" font-size="10" fill="#A64B3C">4 个核抢同一把锁、同一批缓存行</text>

  <rect x="188" y="278" width="272" height="84" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="324" y="304" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">共享队列 / 共享计数器 / 共享连接表</text>
  <text x="324" y="324" font-size="10.5" fill="#733428" text-anchor="middle">std::mutex 或 std::atomic 保护</text>
  <text x="324" y="344" font-size="10.5" fill="#733428" text-anchor="middle">同一时刻只有一个核真正在推进</text>

  <rect x="68" y="386" width="512" height="78" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
  <text x="84" y="408" font-size="11" font-weight="700" fill="#6B4E28">缓存行弹跳（MESI 失效风暴）</text>
  <text x="84" y="426" font-size="10.5" fill="#6B4E28">锁字和被保护的数据所在的 cache line 在 4 个核的 L1 之间来回搬家：</text>
  <text x="84" y="442" font-size="10.5" fill="#6B4E28">每次写都要先让其他核的副本失效，再跨核取回独占权</text>

  <rect x="68" y="478" width="512" height="76" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="84" y="500" font-size="11" font-weight="700" fill="#733428">成本量级（大致）</text>
  <text x="84" y="518" font-size="10.5" fill="#733428">无争用 atomic ~10ns · 争用的跨核 RMW 数十~上百 ns</text>
  <text x="84" y="534" font-size="10.5" fill="#733428">mutex 抢不到 → futex 陷入内核 + 调度唤醒 ~μs 级 → 锁队列一深，p99 起飞</text>

  <!-- ============ B: thread-per-core ============ -->
  <text x="640" y="112" font-size="13" font-weight="700" fill="#4A473F">B · thread-per-core：数据私有，跨核只递消息</text>
  <rect x="640" y="126" width="552" height="440" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="660" y="146" width="220" height="234" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="676" y="168" font-size="11.5" font-weight="700" fill="#3D5A80">Core 0 · reactor</text>
  <rect x="676" y="180" width="188" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="770" y="200" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">私有数据</text>
  <text x="770" y="218" font-size="10" fill="#2F6B5E" text-anchor="middle">qpair · io_channel</text>
  <text x="770" y="234" font-size="10" fill="#2F6B5E" text-anchor="middle">连接分片 · 元数据分片</text>
  <rect x="676" y="262" width="188" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="770" y="280" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">poller 循环</text>
  <text x="770" y="296" font-size="9.5" fill="#3D5A80" text-anchor="middle">单线程访问，无锁无 atomic</text>
  <text x="676" y="336" font-size="10" fill="#6B675C">本核的数据只有本核碰；</text>
  <text x="676" y="352" font-size="10" fill="#6B675C">别的核想改 → 发消息来</text>

  <rect x="972" y="146" width="200" height="234" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="988" y="168" font-size="11.5" font-weight="700" fill="#3D5A80">Core 1 · reactor</text>
  <rect x="988" y="180" width="168" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1072" y="200" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">私有数据</text>
  <text x="1072" y="218" font-size="10" fill="#2F6B5E" text-anchor="middle">自己的 qpair</text>
  <text x="1072" y="234" font-size="10" fill="#2F6B5E" text-anchor="middle">自己的连接分片</text>
  <rect x="988" y="262" width="168" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1072" y="280" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">poller 循环</text>
  <text x="1072" y="296" font-size="9.5" fill="#3D5A80" text-anchor="middle">消息在这里被执行</text>
  <text x="988" y="336" font-size="10" fill="#6B675C">收到消息 → fn(ctx) 由</text>
  <text x="988" y="352" font-size="10" fill="#6B675C">所有者线程亲自执行</text>

  <!-- 消息环 -->
  <rect x="888" y="216" width="76" height="60" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.3"/>
  <text x="926" y="238" font-size="10" font-weight="700" fill="#4A473F" text-anchor="middle">有界</text>
  <text x="926" y="252" font-size="10" font-weight="700" fill="#4A473F" text-anchor="middle">无锁环</text>
  <text x="926" y="266" font-size="9" fill="#6B675C" text-anchor="middle">×2 方向</text>
  <line x1="864" y1="232" x2="885" y2="232" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrg)"/>
  <line x1="964" y1="232" x2="985" y2="232" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrg)"/>
  <line x1="988" y1="260" x2="967" y2="260" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>
  <line x1="888" y1="260" x2="867" y2="260" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>
  <text x="926" y="206" font-size="9.5" fill="#24473F" text-anchor="middle">请求 →</text>
  <text x="926" y="292" font-size="9.5" fill="#4A473F" text-anchor="middle">← 完成回执</text>

  <rect x="660" y="396" width="512" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="676" y="418" font-size="11" font-weight="700" fill="#24473F">数据路径 0 锁</text>
  <text x="676" y="436" font-size="10.5" fill="#24473F">私有数据单线程访问，连 atomic 都不需要；唯一的同步点是消息环的</text>
  <text x="676" y="452" font-size="10.5" fill="#24473F">头尾指针——入队 release、出队 acquire，跨核 happens-before 由环保证</text>

  <rect x="660" y="482" width="512" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="676" y="504" font-size="11" font-weight="700" fill="#2C4460">所有权转移 ≈ 把 unique_ptr move 进队列</text>
  <text x="676" y="522" font-size="10.5" fill="#2C4460">消息发出后发送方不再触碰 ctx——"同一时刻只有一个线程能看到这份</text>
  <text x="676" y="538" font-size="10.5" fill="#2C4460">数据"，数据竞争在设计层面被消灭，而不是靠锁压制</text>

  <!-- ============ C: 背压 ============ -->
  <text x="48" y="594" font-size="13" font-weight="700" fill="#4A473F">C · 背压：有界队列把"太快"变成"可控的慢"，而不是"迟到的雪崩"</text>
  <rect x="48" y="606" width="1144" height="248" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <rect x="68" y="630" width="196" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="166" y="653" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">上游提交 IO</text>
  <text x="166" y="670" font-size="9.5" fill="#3D5A80" text-anchor="middle">网络请求 / bdev 提交</text>
  <rect x="306" y="630" width="196" height="56" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.3"/>
  <text x="404" y="653" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">有界队列 / 环 / qpair</text>
  <text x="404" y="670" font-size="9.5" fill="#6B675C" text-anchor="middle">深度固定，满了就是满了</text>
  <rect x="544" y="630" width="196" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="642" y="653" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">满 → 立即返回 -ENOMEM</text>
  <text x="642" y="670" font-size="9.5" fill="#A64B3C" text-anchor="middle">不阻塞、不悄悄堆积</text>
  <rect x="782" y="630" width="196" height="56" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
  <text x="880" y="653" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">上游放慢 / 排队重试</text>
  <text x="880" y="670" font-size="9.5" fill="#8A6A3A" text-anchor="middle">注册"有空位再叫我"回调</text>
  <rect x="1020" y="630" width="152" height="56" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1096" y="653" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">延迟有上界</text>
  <text x="1096" y="670" font-size="9.5" fill="#2F6B5E" text-anchor="middle">深度有界 ⇒ 等待有界</text>
  <line x1="264" y1="658" x2="303" y2="658" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>
  <line x1="502" y1="658" x2="541" y2="658" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>
  <line x1="740" y1="658" x2="779" y2="658" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>
  <line x1="978" y1="658" x2="1017" y2="658" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrn)"/>

  <rect x="68" y="710" width="1104" height="40" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.1"/>
  <text x="84" y="735" font-size="11" fill="#4A473F">Little's law：队列里平均滞留 L = λ × W。深度 L 有界、到达率 λ 不降 ⇒ 等待 W 有界；无界队列则相反——W 随积压无限膨胀</text>

  <rect x="68" y="762" width="1104" height="40" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.1"/>
  <text x="84" y="787" font-size="11" fill="#733428">无界队列不是"没有背压"，是把背压推迟成内存耗尽和分钟级延迟——故障时最先炸的就是它</text>

  <text x="68" y="832" font-size="11" fill="#6B675C">SPDK 实践：spdk_thread_send_msg 环满返回错误；qpair 满时提交函数返回 -ENOMEM，调用方用 spdk_bdev_queue_io_wait 注册回调等空位再重试</text>
</svg>
