<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 15px; fill: #334155; }
      .small { font-size: 13px; fill: #475569; }
    </style>
  </defs>
  <text font-family="Inter, Arial, sans-serif" x="70" y="70" class="title">Prefix Cache: Reuse Shared Prefill Results</text>
  <text font-family="Inter, Arial, sans-serif" x="70" y="105" class="subtitle">shared system prompt / tools schema / long document prefix can skip repeated prefill</text>
  <rect x="80" y="175" width="500" height="390" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="120" y="225" class="label">Without prefix cache</text>
  <text font-family="Inter, Arial, sans-serif" x="120" y="260" class="text">Every request recomputes shared prefix</text>
  <rect x="120" y="300" width="160" height="38" rx="8" fill="#fb923c"/>
  <rect x="285" y="300" width="160" height="38" rx="8" fill="#fb923c"/>
  <rect x="450" y="300" width="78" height="38" rx="8" fill="#94a3b8"/>
  <text font-family="Inter, Arial, sans-serif" x="142" y="324" class="small">system prompt</text>
  <text font-family="Inter, Arial, sans-serif" x="315" y="324" class="small">tools schema</text>
  <text font-family="Inter, Arial, sans-serif" x="467" y="324" class="small">query A</text>
  <rect x="120" y="370" width="160" height="38" rx="8" fill="#fb923c"/>
  <rect x="285" y="370" width="160" height="38" rx="8" fill="#fb923c"/>
  <rect x="450" y="370" width="78" height="38" rx="8" fill="#94a3b8"/>
  <text font-family="Inter, Arial, sans-serif" x="142" y="394" class="small">system prompt</text>
  <text font-family="Inter, Arial, sans-serif" x="315" y="394" class="small">tools schema</text>
  <text font-family="Inter, Arial, sans-serif" x="467" y="394" class="small">query B</text>
  <text font-family="Inter, Arial, sans-serif" x="120" y="485" class="text">Result: repeated prefill, higher TTFT, more prompt compute</text>
  <rect x="700" y="175" width="500" height="390" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="740" y="225" class="label">With prefix cache</text>
  <text font-family="Inter, Arial, sans-serif" x="740" y="260" class="text">Shared prefix K/V blocks are reused</text>
  <rect x="740" y="300" width="326" height="45" rx="10" fill="#16a34a"/>
  <text font-family="Inter, Arial, sans-serif" x="795" y="329" class="small" fill="#ffffff">cached shared prefix KV blocks</text>
  <rect x="1082" y="300" width="78" height="38" rx="8" fill="#94a3b8"/>
  <text font-family="Inter, Arial, sans-serif" x="1099" y="324" class="small">query A</text>
  <path d="M903 348 V383 H1082" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1082" y="385" width="78" height="38" rx="8" fill="#94a3b8"/>
  <text font-family="Inter, Arial, sans-serif" x="1099" y="409" class="small">query B</text>
  <text font-family="Inter, Arial, sans-serif" x="740" y="485" class="text">Result: lower repeated prefill cost, lower TTFT when prefix hits</text>
  <rect x="300" y="620" width="680" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="342" y="656" class="text">Prefix cache does not change model output; it reuses identical prefix prefill K/V.</text>
</svg>
