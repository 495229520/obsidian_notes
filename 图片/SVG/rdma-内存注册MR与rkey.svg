<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">内存注册：pin 页 ＋ 网卡页表 ＋ 一对钥匙</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">注册是毫秒级慢操作【量级】——预注册内存池摊销；lkey 自己用，rkey 是交给远端的门禁卡</text>

  <!-- 左：主机内存 -->
  <rect x="48" y="106" width="560" height="440" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="68" y="132" font-size="13" font-weight="700" fill="#4A473F">用户态进程 + 主机内存</text>

  <rect x="76" y="140" width="230" height="200" rx="8" fill="#FBFAF5" stroke="#B9B4A4" stroke-width="1.2"/>
  <text x="86" y="162" font-size="11" font-weight="700" fill="#6B675C">进程虚拟地址空间</text>
  <rect x="96" y="170" width="180" height="36" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="186" y="193" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2C4460" text-anchor="middle">虚拟页 VA0</text>
  <rect x="96" y="228" width="180" height="36" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="186" y="251" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2C4460" text-anchor="middle">虚拟页 VA1</text>
  <rect x="96" y="286" width="180" height="36" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="186" y="309" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2C4460" text-anchor="middle">虚拟页 VA2</text>

  <rect x="360" y="140" width="220" height="200" rx="8" fill="#FBFAF5" stroke="#B9B4A4" stroke-width="1.2"/>
  <text x="370" y="162" font-size="11" font-weight="700" fill="#6B675C">物理内存 DRAM（不连续）</text>
  <rect x="380" y="170" width="180" height="36" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="470" y="193" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">物理页 PA7</text>
  <rect x="380" y="228" width="180" height="36" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="470" y="251" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">物理页 PA3</text>
  <rect x="380" y="286" width="180" height="36" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="470" y="309" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">物理页 PA9</text>

  <line x1="276" y1="188" x2="376" y2="188" stroke="#5A564B" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="276" y1="246" x2="376" y2="246" stroke="#5A564B" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="276" y1="304" x2="376" y2="304" stroke="#5A564B" stroke-width="1.3" marker-end="url(#arr)"/>

  <text x="360" y="360" font-size="10.5" fill="#733428">① pin（get_user_pages）：钉住物理页——</text>
  <text x="360" y="376" font-size="10.5" fill="#733428">不能 swap / 迁移；计入 RLIMIT_MEMLOCK</text>

  <rect x="76" y="388" width="504" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="328" y="409" font-size="12" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">ibv_reg_mr(pd, addr, len, access)</text>
  <text x="328" y="429" font-size="10.5" fill="#24473F" text-anchor="middle">一次调用三件事：① pin 物理页　② 下发翻译表　③ 造两把钥匙</text>

  <line x1="200" y1="440" x2="200" y2="460" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="460" y1="440" x2="460" y2="460" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="76" y="464" width="240" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="196" y="484" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">③ lkey：本地钥匙</text>
  <text x="196" y="502" font-size="9.5" fill="#2C4460" text-anchor="middle">填进本端 WQE 的 SGE 项（4.3）</text>

  <rect x="340" y="464" width="240" height="48" rx="7" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="460" y="484" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">③ rkey：远端钥匙【风险】</text>
  <text x="460" y="502" font-size="9.5" fill="#733428" text-anchor="middle">带外交给对端，用于单边 READ/WRITE（4.5）</text>

  <!-- 右：RNIC -->
  <rect x="680" y="106" width="512" height="440" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="700" y="132" font-size="13" font-weight="700" fill="#4A473F">RDMA 网卡（RNIC）</text>

  <rect x="708" y="150" width="210" height="64" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="813" y="174" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">DMA 引擎</text>
  <text x="813" y="192" font-size="10" fill="#4A3F68" text-anchor="middle">直读直写物理页</text>

  <rect x="944" y="150" width="224" height="64" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="1056" y="174" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">MTT 地址翻译表</text>
  <text x="1056" y="192" font-size="10" fill="#4A3F68" text-anchor="middle">MR 的 VA→PA 映射（有缓存）</text>

  <line x1="940" y1="182" x2="922" y2="182" stroke="#4A3F68" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="708" y="250" width="460" height="104" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="728" y="274" font-size="12" font-weight="700" fill="#4A3F68">每次 DMA 前的硬件三连查</text>
  <text x="728" y="298" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#4A3F68">地址 ∈ MR 范围？——否 → LOC_LEN / LOC_PROT_ERR</text>
  <text x="728" y="318" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#4A3F68">MR 的 PD == QP 的 PD？——否 → 访问被拒</text>
  <text x="728" y="338" font-size="10.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#4A3F68">access flags 允许该操作？——否 → REM_ACCESS_ERR</text>

  <text x="708" y="386" font-size="10.5" fill="#24473F">数据路径：DMA 经 MTT 翻译，直读直写已 pin 的物理页——CPU 全程 0 次接触</text>
  <text x="708" y="460" font-size="10.5" fill="#6B675C">校验失败以 WC 错误浮出（4.3 排障表）；错误的 rkey/PD 在硬件层被拒，</text>
  <text x="708" y="478" font-size="10.5" fill="#6B675C">但正确 rkey + 错误逻辑不会被拦——rkey 就是完整的写权限。</text>

  <!-- 控制路径：下发翻译表 -->
  <polyline points="580,408 1180,408 1180,196 1172,196" fill="none" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="700" y="400" font-size="10.5" fill="#733428">② 注册时下发翻译表（控制路径：慢，毫秒级）</text>

  <!-- 数据路径：DMA 直达 -->
  <line x1="704" y1="188" x2="584" y2="188" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="600" y="176" font-size="10" font-weight="700" fill="#24473F">零拷贝</text>

  <!-- 底部三卡 -->
  <rect x="48" y="580" width="368" height="180" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="68" y="606" font-size="12" font-weight="700" fill="#4A473F">成本与摊销【量级】</text>
  <text x="68" y="630" font-size="10.5" fill="#4A473F">注册 = 逐页 pin ＋ 页表下发：</text>
  <text x="68" y="648" font-size="10.5" fill="#4A473F">GB 级区域毫秒级；dereg 同样贵。</text>
  <text x="68" y="666" font-size="10.5" fill="#4A473F">热路径 reg/dereg = p99 毫秒尖刺。</text>
  <text x="68" y="690" font-size="10.5" fill="#4A473F">纪律：启动期注册大块内存池，</text>
  <text x="68" y="708" font-size="10.5" fill="#4A473F">运行期只借还——与 io_uring 的</text>
  <text x="68" y="726" font-size="10.5" fill="#4A473F">registered buffers 同一思想（2.4）。</text>

  <rect x="436" y="580" width="368" height="180" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="456" y="606" font-size="12" font-weight="700" fill="#4A473F">生命周期纪律</text>
  <text x="456" y="630" font-size="10.5" fill="#4A473F">提交 → 完成之间 buffer 归网卡；</text>
  <text x="456" y="648" font-size="10.5" fill="#4A473F">dereg / free 前必须确认无在途 WQE。</text>
  <text x="456" y="672" font-size="10.5" fill="#4A473F">违反的后果是静默数据损坏而非崩溃：</text>
  <text x="456" y="690" font-size="10.5" fill="#4A473F">网卡按物理地址写，MMU 拦不住</text>
  <text x="456" y="708" font-size="10.5" fill="#4A473F">（IOMMU 可拦，但有性能与配置代价）。</text>
  <text x="456" y="732" font-size="10.5" fill="#733428">fork 的 COW 是同类坑：MADV_DONTFORK。</text>

  <rect x="824" y="580" width="368" height="180" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="844" y="606" font-size="12" font-weight="700" fill="#4A473F">钥匙即边界【风险】</text>
  <text x="844" y="630" font-size="10.5" fill="#4A473F">rkey 一旦交出，对端可在 access</text>
  <text x="844" y="648" font-size="10.5" fill="#4A473F">范围内读写整个 MR——没有更细的锁。</text>
  <text x="844" y="672" font-size="10.5" fill="#4A473F">最小权限：只开必要的 flags；</text>
  <text x="844" y="690" font-size="10.5" fill="#4A473F">按连接拆 PD、按对象拆 MR；</text>
  <text x="844" y="708" font-size="10.5" fill="#4A473F">失效靠 dereg / rereg 轮换 rkey。</text>
</svg>
