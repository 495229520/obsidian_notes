<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 688" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <title>FTP：一个会话两条 TCP 连接，主动与被动模式</title>
  <desc>上方展示 FTP 的控制连接与其上以回车换行分行的命令应答样例；下方左右对照主动模式与被动模式：主动模式由服务端从二十号端口反向连接客户端，被动模式由客户端连接服务端给出的高端口，并给出各自在网络地址转换环境下的后果。</desc>

  <rect x="0" y="0" width="1240" height="688" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">FTP：一个会话开两条 TCP 连接</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">控制连接从登录开到退出，数据连接每传一次文件开一条、传完就关</text>

  <!-- ============ Panel A: 控制连接 ============ -->
  <rect x="48" y="104" width="1144" height="290" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 控制连接：文本命令，靠 CRLF 分行</text>

  <rect x="72" y="156" width="170" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="157" y="185" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">客户端</text>

  <rect x="998" y="156" width="170" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1083" y="185" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">服务端</text>

  <line x1="248" y1="180" x2="992" y2="180" stroke="#5A564B" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="490" y="166" width="260" height="28" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="620" y="185" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">控制连接　端口 21　全程不关</text>

  <rect x="280" y="228" width="680" height="30" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="296" y="248" font-size="11" fill="#2C4460">C → S　USER alice　然后 PASS ******</text>

  <rect x="280" y="262" width="680" height="30" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="296" y="282" font-size="11" fill="#24473F">S → C　230 登录成功</text>

  <rect x="280" y="296" width="680" height="30" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="296" y="316" font-size="11" fill="#2C4460">C → S　PASV　请求被动模式</text>

  <rect x="280" y="330" width="680" height="30" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="296" y="350" font-size="11" font-weight="700" fill="#6B4E28">S → C　227 (…,196,44)　数据端口 = 196×256 + 44</text>

  <text x="296" y="380" font-size="11" fill="#4A473F">每条应答都以三位数字状态码开头，2xx 成功、3xx 待续、4xx 和 5xx 失败</text>

  <!-- ============ Panel B: 主动模式 ============ -->
  <rect x="48" y="418" width="560" height="230" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="446" font-size="15" font-weight="700" fill="#4A473F">B · 主动模式 PORT</text>

  <rect x="72" y="470" width="150" height="50" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="147" y="491" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">客户端</text>
  <text x="147" y="509" font-size="10" fill="#3D5A80" text-anchor="middle">开高端口 N 等着</text>

  <rect x="434" y="470" width="150" height="50" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="509" y="491" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">服务端</text>
  <text x="509" y="509" font-size="10" fill="#2F6B5E" text-anchor="middle">从端口 20 发起</text>

  <line x1="428" y1="495" x2="230" y2="495" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrR)"/>
  <text x="329" y="486" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">数据连接 20 → N</text>

  <rect x="72" y="540" width="512" height="86" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="88" y="562" font-size="11.5" font-weight="700" fill="#733428">方向反了：服务端主动连客户端</text>
  <text x="88" y="584" font-size="11" fill="#733428">客户端在 NAT 或防火墙后面，这条连不进来</text>
  <text x="88" y="606" font-size="10.5" fill="#A64B3C">这就是端口 20 的来历，今天基本用不上了</text>

  <!-- ============ Panel C: 被动模式 ============ -->
  <rect x="632" y="418" width="560" height="230" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="656" y="446" font-size="15" font-weight="700" fill="#4A473F">C · 被动模式 PASV</text>

  <rect x="656" y="470" width="150" height="50" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="731" y="491" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">客户端</text>
  <text x="731" y="509" font-size="10" fill="#3D5A80" text-anchor="middle">两条连接都它发起</text>

  <rect x="1018" y="470" width="150" height="50" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1093" y="491" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">服务端</text>
  <text x="1093" y="509" font-size="10" fill="#2F6B5E" text-anchor="middle">开高端口 P 等着</text>

  <line x1="812" y1="495" x2="1012" y2="495" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="912" y="486" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">数据连接 → P</text>

  <rect x="656" y="540" width="512" height="86" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="672" y="562" font-size="11.5" font-weight="700" fill="#24473F">方向一致：客户端连服务端</text>
  <text x="672" y="584" font-size="11" fill="#24473F">穿 NAT 没问题，所以成了默认做法</text>
  <text x="672" y="606" font-size="10.5" fill="#2F6B5E">代价是服务端要放开一整段高端口</text>
</svg>
