<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>供需基本框架：均衡的形成与「冲击」的定义</title>
  <desc>左panel：S/D 曲线相交于均衡点，价高于均衡时出现超额供给并压低价格，价低于均衡时出现超额需求并抬高价格。右panel：区分沿曲线移动（需求量的变化）与整条曲线移动（需求的变化）。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">供需框架：均衡从哪来，什么才算「冲击」</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">价格是把供给量和需求量拉到相等的那个变量；能让整条曲线搬家的外部事件，才是冲击</text>

  <!-- ================= A · 均衡的形成 ================= -->
  <g transform="translate(48,104)">
    <rect x="0" y="0" width="562" height="396" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
    <rect x="14" y="15" width="4" height="15" rx="2" fill="#3D5A80"/>
    <text x="26" y="27" font-size="13.5" font-weight="700" fill="#2B2A26">A · 均衡：价格把供给量和需求量拉平</text>

    <line x1="76" y1="352" x2="76" y2="60" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="76" y1="352" x2="520" y2="352" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="66" y="66" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">P</text>
    <text x="516" y="344" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">Q</text>

    <line x1="76" y1="219" x2="260" y2="219" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="260" y1="219" x2="260" y2="352" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="70" y1="160" x2="76" y2="160" stroke="#5A564B" stroke-width="1.2"/>
    <line x1="70" y1="278" x2="76" y2="278" stroke="#5A564B" stroke-width="1.2"/>

    <path d="M90,338 L430,100" fill="none" stroke="#3D5A80" stroke-width="2.4"/>
    <path d="M90,100 L430,338" fill="none" stroke="#A64B3C" stroke-width="2.4"/>
    <text x="438" y="96" font-size="12.5" font-weight="700" fill="#3D5A80">S</text>
    <text x="438" y="344" font-size="12.5" font-weight="700" fill="#A64B3C">D</text>

    <line x1="176" y1="160" x2="344" y2="160" stroke="#8A6A3A" stroke-width="1.6"/>
    <line x1="176" y1="154" x2="176" y2="166" stroke="#8A6A3A" stroke-width="1.6"/>
    <line x1="344" y1="154" x2="344" y2="166" stroke="#8A6A3A" stroke-width="1.6"/>
    <text x="176" y="148" font-size="11" fill="#6B4E28">超额供给：Qs &gt; Qd</text>

    <line x1="176" y1="278" x2="344" y2="278" stroke="#8A6A3A" stroke-width="1.6"/>
    <line x1="176" y1="272" x2="176" y2="284" stroke="#8A6A3A" stroke-width="1.6"/>
    <line x1="344" y1="272" x2="344" y2="284" stroke="#8A6A3A" stroke-width="1.6"/>
    <text x="176" y="298" font-size="11" fill="#6B4E28">超额需求：Qd &gt; Qs</text>

    <line x1="92" y1="172" x2="92" y2="204" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrA)"/>
    <line x1="92" y1="266" x2="92" y2="234" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrA)"/>
    <text x="102" y="192" font-size="10.5" fill="#6B4E28">价格下压</text>
    <text x="102" y="254" font-size="10.5" fill="#6B4E28">价格上抬</text>

    <circle cx="260" cy="219" r="5" fill="#2B2A26"/>
    <text x="300" y="215" font-size="11.5" font-weight="700" fill="#2B2A26">E*</text>
    <text x="66" y="223" font-size="11" fill="#2B2A26" text-anchor="end">P*</text>
    <text x="260" y="370" font-size="11" fill="#2B2A26" text-anchor="middle">Q*</text>
    <text x="66" y="164" font-size="10" fill="#6B675C" text-anchor="end">高于 P*</text>
    <text x="66" y="282" font-size="10" fill="#6B675C" text-anchor="end">低于 P*</text>
  </g>

  <!-- ================= B · 两种「变化」 ================= -->
  <g transform="translate(630,104)">
    <rect x="0" y="0" width="562" height="396" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
    <rect x="14" y="15" width="4" height="15" rx="2" fill="#A64B3C"/>
    <text x="26" y="27" font-size="13.5" font-weight="700" fill="#2B2A26">B · 点在曲线上滑 ≠ 整条曲线搬家</text>
    <line x1="297" y1="84" x2="297" y2="384" stroke="#E0DDD2" stroke-width="1"/>

    <!-- B1 沿曲线移动 -->
    <line x1="56" y1="320" x2="56" y2="92" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="56" y1="320" x2="272" y2="320" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="48" y="98" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">P</text>
    <text x="268" y="312" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">Q</text>

    <line x1="56" y1="140" x2="96" y2="140" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="96" y1="140" x2="96" y2="320" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="56" y1="251" x2="201" y2="251" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="201" y1="251" x2="201" y2="320" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>

    <path d="M68,110 L248,300" fill="none" stroke="#A64B3C" stroke-width="2.4"/>
    <text x="74" y="104" font-size="11.5" font-weight="700" fill="#A64B3C">D</text>
    <path d="M108,138 Q185,170 206,246" fill="none" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrA)"/>

    <circle cx="96" cy="140" r="4" fill="#FBFBF6" stroke="#4A473F" stroke-width="1.6"/>
    <circle cx="201" cy="251" r="4.5" fill="#2B2A26"/>
    <text x="50" y="144" font-size="10" fill="#6B675C" text-anchor="end">P₁</text>
    <text x="50" y="255" font-size="10" fill="#6B675C" text-anchor="end">P₂</text>
    <text x="96" y="336" font-size="10" fill="#6B675C" text-anchor="middle">Q₁</text>
    <text x="201" y="336" font-size="10" fill="#6B675C" text-anchor="middle">Q₂</text>

    <text x="56" y="360" font-size="12" font-weight="700" fill="#2B2A26">① 需求量的变化</text>
    <text x="56" y="378" font-size="10.5" fill="#6B675C">价格动，点沿 D 滑</text>

    <!-- B2 曲线整体移动 -->
    <line x1="326" y1="320" x2="326" y2="92" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="326" y1="320" x2="542" y2="320" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="318" y="98" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">P</text>
    <text x="538" y="312" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">Q</text>

    <line x1="326" y1="170" x2="431" y2="170" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="395" y1="170" x2="395" y2="320" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="431" y1="170" x2="431" y2="320" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>

    <path d="M338,110 L502,283" fill="none" stroke="#CFA79E" stroke-width="1.8" stroke-dasharray="6,4"/>
    <path d="M374,110 L538,283" fill="none" stroke="#A64B3C" stroke-width="2.6"/>
    <text x="344" y="104" font-size="11.5" fill="#9B968A">D</text>
    <text x="380" y="104" font-size="11.5" font-weight="700" fill="#A64B3C">D′</text>
    <line x1="362" y1="130" x2="386" y2="130" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrD)"/>

    <circle cx="395" cy="170" r="4" fill="#FBFBF6" stroke="#4A473F" stroke-width="1.6"/>
    <circle cx="431" cy="170" r="4.5" fill="#2B2A26"/>
    <text x="320" y="174" font-size="10" fill="#6B675C" text-anchor="end">P₀</text>
    <text x="395" y="336" font-size="10" fill="#6B675C" text-anchor="middle">Q₁</text>
    <text x="431" y="336" font-size="10" fill="#6B675C" text-anchor="middle">Q₂</text>

    <text x="326" y="360" font-size="12" font-weight="700" fill="#2B2A26">② 需求的变化</text>
    <text x="326" y="378" font-size="10.5" fill="#6B675C">同一价格，要的量变了</text>
  </g>

  <text x="48" y="532" font-size="11.5" fill="#6B675C">只有 B② 才叫「冲击」：下一张图的四种冲击，动的都是整条曲线，不是曲线上的点。B① 只是沿着不动的曲线换了个位置</text>
</svg>
