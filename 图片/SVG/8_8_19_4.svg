<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
<title>两条 CUDA Stream：API 入队与 Event 完成是两种时刻</title><desc>主机箭头表示提交依赖，不表示目标 GPU 此刻已执行完成；示意不按真实时间比例。。原创教学示意；数字不是硬件实测；详细条件与出处见对应 Markdown 笔记。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="52" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">两条 CUDA Stream：API 入队与 Event 完成是两种时刻</text>
<text x="48" y="81" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">主机箭头表示提交依赖，不表示目标 GPU 此刻已执行完成；示意不按真实时间比例。</text>
<rect x="56" y="111" width="210" height="44" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="161.0" y="138.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">应用主机线程</text>
<rect x="355" y="111" width="220" height="44" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="465.0" y="138.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">GPU · compute</text>
<rect x="798" y="111" width="236" height="44" rx="8" fill="#EDEAF3" stroke="#82709B" stroke-width="1.3"/>
<text x="916.0" y="138.0" font-size="14" fill="#625476" font-weight="700" text-anchor="middle">GPU · communication</text>
<line x1="161" y1="160" x2="161" y2="584" stroke="#B4AFA2" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="465" y1="160" x2="465" y2="584" stroke="#B4AFA2" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="916" y1="160" x2="916" y2="584" stroke="#B4AFA2" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="449" y="163" width="32" height="111" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="491" y="181" font-size="13" fill="#24473F" font-weight="400" text-anchor="start">生产输入</text>
<rect x="899" y="237" width="34" height="62" rx="3" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="948" y="244" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">等待 ready</text>
<rect x="899" y="345" width="34" height="155" rx="3" fill="#EDEAF3" stroke="#82709B" stroke-width="1.3"/>
<text x="948" y="432" font-size="13" fill="#625476" font-weight="400" text-anchor="start">通信内核执行</text>
<rect x="449" y="431" width="32" height="87" rx="3" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="490" y="451" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">等待 done</text>
<rect x="449" y="539" width="32" height="42" rx="3" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="491" y="565" font-size="13" fill="#24473F" font-weight="400" text-anchor="start">消费 output</text>
<line x1="169" y1="192" x2="443" y2="192" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#blue)"/>
<text x="306.0" y="184" font-size="12" fill="#2C4460" font-weight="400" text-anchor="middle">cudaEventRecord(ready)</text>
<line x1="169" y1="226" x2="893" y2="226" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#blue)"/>
<text x="612" y="218" font-size="12" fill="#2C4460" font-weight="400" text-anchor="start">cudaStreamWaitEvent(ready)</text>
<line x1="169" y1="328" x2="893" y2="328" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#blue)"/>
<text x="612" y="320" font-size="12" fill="#2C4460" font-weight="400" text-anchor="start">ncclAllReduce(...)</text>
<line x1="169" y1="376" x2="893" y2="376" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#blue)"/>
<text x="612" y="368" font-size="12" fill="#2C4460" font-weight="400" text-anchor="start">cudaEventRecord(done)</text>
<line x1="169" y1="415" x2="443" y2="415" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#blue)"/>
<text x="306.0" y="407" font-size="12" fill="#2C4460" font-weight="400" text-anchor="middle">cudaStreamWaitEvent(done)</text>
<circle cx="465" cy="283" r="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.7"/>
<text x="465" y="288.6" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle"></text>
<line x1="480" y1="283" x2="892" y2="283" stroke="#2F6B5E" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#green)"/>
<text x="665" y="270" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">ready 在设备上完成</text>
<circle cx="916" cy="516" r="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.7"/>
<text x="916" y="521.6" font-size="16" fill="#24473F" font-weight="700" text-anchor="middle"></text>
<line x1="900" y1="516" x2="486" y2="516" stroke="#2F6B5E" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#green)"/>
<text x="690" y="504" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">done 在设备上完成</text>
<rect x="74" y="460" width="174" height="56" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="161.0" y="482.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">enqueue_sum 返回</text>
<text x="161.0" y="504.0" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle">GPU 仍可能执行</text>
<text x="1060" y="355" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">入队不等于</text>
<text x="1060" y="379" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">数据已就绪</text>
<line x1="48" y1="609" x2="1192" y2="609" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="637" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">compute 后续依赖输出的工作等 done；真正独立的计算要安排在不被该等待阻塞的位置或其他正确管理的 stream。</text>
<text x="48" y="660" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">对应 8.19 §8 的 C++17 片段；此图不包含 nonblocking communicator 的额外主机状态机。</text>
</svg>