<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">ATS：缓存地址转换，不缓存业务数据</title><desc id="desc">三泳道展示设备 ATC、IOMMU 转换服务与内存。下方把 ATS、PASID、PRI 分开解释，并强调映射回收不能只刷新 CPU TLB。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">ATS：缓存地址转换，不缓存业务数据</text>
<text x="48" y="77" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">ATC miss、命中访问与失效确认属于同一个映射生命周期。</text>
<rect x="40" y="106" width="1160" height="340" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="134" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 转换与失效路径（逻辑示意）</text>
<rect x="103" y="153" width="214" height="60" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="210.0" y="180.0" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">设备 + ATC</text>
<text x="210.0" y="202.0" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">转换缓存</text>
<line x1="210" y1="222" x2="210" y2="421" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<rect x="538" y="153" width="214" height="60" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="645.0" y="180.0" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">IOMMU / 转换服务</text>
<text x="645.0" y="202.0" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">映射与权限上下文</text>
<line x1="645" y1="222" x2="645" y2="421" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<rect x="943" y="153" width="214" height="60" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1050.0" y="180.0" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">目标内存</text>
<text x="1050.0" y="202.0" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">主机或受支持资源</text>
<line x1="1050" y1="222" x2="1050" y2="421" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<line x1="210" y1="245" x2="645" y2="245" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="427.5" y="235" font-size="13" font-weight="500" fill="#3D5A80" text-anchor="middle" data-role="body">① ATC miss → 翻译请求</text>
<line x1="645" y1="286" x2="210" y2="286" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#amber)"/>
<text x="427.5" y="276" font-size="13" font-weight="500" fill="#8A6A3A" text-anchor="middle" data-role="body">② 返回转换结果</text>
<line x1="210" y1="335" x2="1050" y2="335" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#green)"/>
<text x="648" y="325" font-size="13" font-weight="500" fill="#2F6B5E" text-anchor="middle" data-role="body">③ ATC hit → 按转换结果发起访问</text>
<line x1="645" y1="380" x2="210" y2="380" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#red)"/>
<text x="427.5" y="370" font-size="13" font-weight="500" fill="#A64B3C" text-anchor="middle" data-role="body">④ 映射变化 → 设备失效请求</text>
<line x1="210" y1="418" x2="645" y2="418" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="427.5" y="408" font-size="13" font-weight="500" fill="#3D5A80" text-anchor="middle" data-role="body">⑤ 失效确认</text>
<text x="825" y="393" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">实际检查与路由</text>
<text x="825" y="416" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">仍取决于平台</text>
<rect x="48" y="469" width="362" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="229.0" y="497.0" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">ATS</text>
<text x="68" y="543" font-size="14" font-weight="500" fill="#2B2A26" text-anchor="start" data-role="body">缓存转换</text>
<text x="68" y="570" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">不是数据 Cache</text>
<rect x="439" y="469" width="362" height="46" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="620.0" y="497.0" font-size="15" font-weight="600" fill="#4A3F68" text-anchor="middle" data-role="body">PASID</text>
<text x="459" y="543" font-size="14" font-weight="500" fill="#2B2A26" text-anchor="start" data-role="body">选择地址空间上下文</text>
<text x="459" y="570" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">不是 DMA 完成通知</text>
<rect x="830" y="469" width="362" height="46" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="1011.0" y="497.0" font-size="15" font-weight="600" fill="#6B4E28" text-anchor="middle" data-role="body">PRI</text>
<text x="850" y="543" font-size="14" font-weight="500" fill="#2B2A26" text-anchor="start" data-role="body">发起页面请求</text>
<text x="850" y="570" font-size="13" font-weight="400" fill="#733428" text-anchor="start" data-role="body">不单独构成 pageable DMA</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="642" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">回收必须处理在途 DMA、设备转换失效与页面生命周期；这里只示意因果，不定义某款 IOMMU 的完整协议。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">ATS 不等于 IOMMU bypass、任意指针 DMA、GPU Cache coherence，也不自动保证 GPUDirect 可用。</text>
</svg>