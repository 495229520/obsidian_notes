<text x="1018.0" y="603.9" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">退出实验后恢复 baseline</text>
<polyline points="403,599 440,599" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="801,599 838,599" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<line x1="48" y1="623" x2="1192" y2="623" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="48" y="643" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">增大 timeout 不能补回缺失的 collective；abort communicator 也不等于恢复模型状态。</text>
</svg>