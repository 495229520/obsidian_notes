<line x1="64" y1="468" x2="1176" y2="468" stroke="#D8D5C8" stroke-width="1.2"/>
<rect x="68" y="481" width="292" height="46" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="214.0" y="508.9" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">5 · Fabric</text>
<text x="415" y="509" font-size="13.5" font-weight="400" fill="#2B2A26" text-anchor="start">端口增量；队列；ECN / PFC / drop</text>
<text x="825" y="509" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start">时间对齐；逐节点 / 逐路径二分</text>
<rect x="48" y="580" width="350" height="38" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="223.0" y="603.9" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">一次只改一个变量</text>
<rect x="446" y="580" width="350" height="38" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="621.0" y="603.9" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">保存日志与原始结果</text>
