<text x="415" y="433" font-size="13.5" font-weight="400" fill="#2B2A26" text-anchor="start">NUMA；GPU-NIC；权限与资源</text>
<text x="825" y="433" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start">单节点 / 单链路；绑定对照</text>
