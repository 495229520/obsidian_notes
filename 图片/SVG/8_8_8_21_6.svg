<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">NCCL timeout：先找最早错误，再向硬件二分</title><desc id="desc">8.21 · 图 6　左侧定位顺序；右侧每一步需要的证据和对照。原创教学图，非实测数据。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="red-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">NCCL timeout：先找最早错误，再向硬件二分</text>
<text x="48" y="78" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">8.21 · 图 6　左侧定位顺序；右侧每一步需要的证据和对照</text>
<rect x="48" y="111" width="1144" height="458" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="69" y="144" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">检查层</text>
<text x="415" y="144" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">关键证据</text>
<text x="825" y="144" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">下一步 / 对照</text>
<line x1="64" y1="164" x2="1176" y2="164" stroke="#D8D5C8" stroke-width="1.2"/>
<rect x="68" y="177" width="292" height="46" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="214.0" y="204.9" font-size="14" font-weight="700" fill="#733428" text-anchor="middle">1 · 程序与 rank</text>
<text x="415" y="205" font-size="13.5" font-weight="400" fill="#2B2A26" text-anchor="start">首个异常；step / collective 序号</text>
<text x="825" y="205" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start">先修 OOM、缺失 rank、协议不匹配</text>
<polyline points="210,224 210,240" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<line x1="64" y1="240" x2="1176" y2="240" stroke="#D8D5C8" stroke-width="1.2"/>
<rect x="68" y="253" width="292" height="46" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="214.0" y="280.9" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">2 · Stream 与设备</text>
<text x="415" y="281" font-size="13.5" font-weight="400" fill="#2B2A26" text-anchor="start">producer 就绪；wait；CUDA 错误</text>
<text x="825" y="281" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start">对比早到 / 晚到 rank 的 trace</text>
<polyline points="210,300 210,316" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<line x1="64" y1="316" x2="1176" y2="316" stroke="#D8D5C8" stroke-width="1.2"/>
<rect x="68" y="329" width="292" height="46" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="214.0" y="356.9" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">3 · 实际 transport</text>
<text x="415" y="357" font-size="13.5" font-weight="400" fill="#2B2A26" text-anchor="start">INIT / NET / GRAPH 日志</text>
<text x="825" y="357" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start">确认插件、HCA、P2P 与回退</text>
<polyline points="210,376 210,392" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
