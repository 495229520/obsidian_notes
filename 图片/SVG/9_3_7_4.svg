<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="700px" viewBox="0 0 1280 700" version="1.1">
  <title>CUDA Week 3 shared memory bank conflict and padding</title>
  <desc>Contrasts a 32 by 32 shared memory tile column read with a padded 32 by 33 tile that spreads accesses across banks.</desc>
  <rect x="0" y="0" width="1280" height="700" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="lineArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#2f3f46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #18282f; }
      .section { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #26343a; }
      .label { font: 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #34464d; }
      .small { font: 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526168; }
      .code { font: 15px Menlo, Consolas, monospace; fill: #26343a; }
      .panel { fill: #fffdf8; stroke: #2f3f46; stroke-width: 1.6; }
      .tile { fill: #eef3f8; stroke: #8fa4bd; stroke-width: 1.4; }
      .hot { fill: #f8e1dd; stroke: #bd7a6c; stroke-width: 1.8; }
      .good { fill: #eaf4ef; stroke: #7b9d8e; stroke-width: 1.8; }
      .pad { fill: #fff8e8; stroke: #b79d58; stroke-width: 1.4; }
      .bank { fill: #f6f3ea; stroke: #9aa28f; stroke-width: 1.1; }
      .arrow { stroke: #2f3f46; stroke-width: 2.1; fill: none; marker-end: url(#lineArrow); }
      .badLine { stroke: #bd6f61; stroke-width: 3.2; stroke-linecap: round; }
      .goodLine { stroke: #4f8b6d; stroke-width: 3.2; stroke-linecap: round; }
    </style>
  </defs>

  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="title" x="640" y="42" text-anchor="middle">Bank conflict 与 padding 的核心直觉</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="640" y="76" text-anchor="middle">同样是读 shared memory 的一列，行跨度 32 会挤到同一 bank；行跨度 33 会把访问打散</text>

  <rect class="panel" x="55" y="112" width="560" height="505" rx="10"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="335" y="148" text-anchor="middle">不加 padding: tile[32][32]</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="335" y="176" text-anchor="middle">offset = row * 32 + col</text>

  <g transform="translate(125 215)">
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="120" y="-18" text-anchor="middle">shared tile 读一列</text>
    <rect class="tile" x="0" y="0" width="240" height="240" rx="8"/>
    <g>
      <line x1="60" y1="0" x2="60" y2="240" stroke="#8fa4bd" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="240" stroke="#8fa4bd" stroke-width="1"/>
      <line x1="180" y1="0" x2="180" y2="240" stroke="#8fa4bd" stroke-width="1"/>
      <line x1="0" y1="60" x2="240" y2="60" stroke="#8fa4bd" stroke-width="1"/>
      <line x1="0" y1="120" x2="240" y2="120" stroke="#8fa4bd" stroke-width="1"/>
      <line x1="0" y1="180" x2="240" y2="180" stroke="#8fa4bd" stroke-width="1"/>
    </g>
    <rect class="hot" x="60" y="0" width="60" height="60"/>
    <rect class="hot" x="60" y="60" width="60" height="60"/>
    <rect class="hot" x="60" y="120" width="60" height="60"/>
    <rect class="hot" x="60" y="180" width="60" height="60"/>
    <line class="badLine" x1="90" y1="18" x2="90" y2="222"/>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="120" y="270" text-anchor="middle">threadIdx.x 连续时读取 tile[tx][ty]</text>
  </g>

  <path class="arrow" d="M385 330 C425 330, 455 330, 490 330"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="438" y="306" text-anchor="middle">mod 32</text>

  <g transform="translate(485 235)">
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="40" y="-15" text-anchor="middle">bank</text>
    <rect class="hot" x="0" y="0" width="80" height="60" rx="6"/>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="40" y="36" text-anchor="middle">bank ty</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="40" y="85" text-anchor="middle">多线程挤到同一 bank</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="40" y="108" text-anchor="middle">访问被拆开处理</text>
  </g>

  <rect x="115" y="520" width="440" height="55" rx="8" fill="#f8e1dd" stroke="#bd7a6c" stroke-width="1.4"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="335" y="543" text-anchor="middle">offset: ty, 32 + ty, 64 + ty ...</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="335" y="565" text-anchor="middle">对 32 个 bank 取模后，bank 编号相同</text>

  <rect class="panel" x="665" y="112" width="560" height="505" rx="10"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="945" y="148" text-anchor="middle">加 padding: tile[32][33]</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="945" y="176" text-anchor="middle">offset = row * 33 + col</text>

  <g transform="translate(735 215)">
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="135" y="-18" text-anchor="middle">有效 tile + 1 列 padding</text>
    <rect class="tile" x="0" y="0" width="240" height="240" rx="8"/>
    <rect class="pad" x="240" y="0" width="36" height="240" rx="6"/>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="258" y="126" text-anchor="middle" transform="rotate(90 258 126)">padding</text>
    <g>
      <line x1="60" y1="0" x2="60" y2="240" stroke="#8fa4bd" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="240" stroke="#8fa4bd" stroke-width="1"/>
      <line x1="180" y1="0" x2="180" y2="240" stroke="#8fa4bd" stroke-width="1"/>
      <line x1="0" y1="60" x2="276" y2="60" stroke="#8fa4bd" stroke-width="1"/>
      <line x1="0" y1="120" x2="276" y2="120" stroke="#8fa4bd" stroke-width="1"/>
      <line x1="0" y1="180" x2="276" y2="180" stroke="#8fa4bd" stroke-width="1"/>
    </g>
    <rect class="good" x="60" y="0" width="60" height="60"/>
    <rect class="good" x="60" y="60" width="60" height="60"/>
    <rect class="good" x="60" y="120" width="60" height="60"/>
    <rect class="good" x="60" y="180" width="60" height="60"/>
    <path class="goodLine" d="M88 22 C112 74, 64 112, 95 162 C113 190, 99 210, 90 225"/>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="138" y="270" text-anchor="middle">仍然读一列，但每行跨度从 32 变成 33</text>
  </g>

  <path class="arrow" d="M995 330 C1035 330, 1065 330, 1100 330"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="1048" y="306" text-anchor="middle">mod 32</text>

  <g transform="translate(1088 228)">
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="52" y="-8" text-anchor="middle">banks</text>
    <rect class="good" x="0" y="0" width="104" height="32" rx="5"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="52" y="22" text-anchor="middle">ty</text>
    <rect class="good" x="0" y="42" width="104" height="32" rx="5"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="52" y="64" text-anchor="middle">ty + 1</text>
    <rect class="good" x="0" y="84" width="104" height="32" rx="5"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="52" y="106" text-anchor="middle">ty + 2</text>
    <rect class="good" x="0" y="126" width="104" height="32" rx="5"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="52" y="148" text-anchor="middle">...</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="52" y="188" text-anchor="middle">bank 编号依次变化</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="52" y="211" text-anchor="middle">冲突明显减少</text>
  </g>

  <rect x="725" y="520" width="440" height="55" rx="8" fill="#eaf4ef" stroke="#7b9d8e" stroke-width="1.4"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="945" y="543" text-anchor="middle">offset: ty, 33 + ty, 66 + ty ...</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="945" y="565" text-anchor="middle">对 32 个 bank 取模后，bank 编号依次错开</text>

  <rect x="335" y="642" width="610" height="38" rx="8" fill="#fff8e8" stroke="#b79d58" stroke-width="1.4"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="640" y="666" text-anchor="middle">padding 的作用不是存更多有效数据，而是改变 shared memory 的行跨度</text>
</svg>
