<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<title>撤销时序：STOP_ACK 与 invalidate 完成之间还隔着一道门</title>
<desc>合作式正常路径示意：父 MR 保留，子 MW 按适用的失效机制撤销。。中文教学示意；状态编号与时间间距不代表实测延迟。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="49" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">撤销时序：STOP_ACK 与 invalidate 完成之间还隔着一道门</text>
<text x="48" y="79" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start">合作式正常路径示意：父 MR 保留，子 MW 按适用的失效机制撤销。</text>
<text x="145" y="126" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">所有者 / grant 管理器</text>
<line x1="145" y1="142" x2="145" y2="606" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="4 5"/>
<text x="435" y="126" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">远端提交线程</text>
<line x1="435" y1="142" x2="435" y2="606" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="4 5"/>
<text x="750" y="126" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">远端 CQ / progress</text>
<line x1="750" y1="142" x2="750" y2="606" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="4 5"/>
<text x="1082" y="126" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">所有者 RNIC / CQ</text>
<line x1="1082" y1="142" x2="1082" y2="606" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="4 5"/>
<text x="60" y="165" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="start">QUIESCING</text>
<line x1="151" y1="189" x2="428" y2="189" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="287" y="179" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">REVOKE(identity)</text>
<rect x="347" y="210" width="176" height="51" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="435.0" y="230.0" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="middle">冻结提交门</text>
<text x="435.0" y="251.0" font-size="12" fill="#6B4E28" font-weight="400" text-anchor="middle">记录每 QP 截止</text>
<line x1="442" y1="282" x2="742" y2="282" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="592" y="272" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">等待 cutoff 之前的 WR</text>
<rect x="666" y="298" width="168" height="67" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="750" y="324" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="middle">ibv_poll_cq()</text>
<text x="750" y="349" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">持续 progress</text>
<text x="858" y="323" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="start">等待区 ①</text>
<text x="858" y="346" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start">旧访问完成</text>
<line x1="742" y1="389" x2="442" y2="389" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="592" y="379" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">排空证据 / 完成水位</text>
<line x1="428" y1="423" x2="151" y2="423" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="287" y="413" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="middle">STOP_ACK(identity, cutoff)</text>
<line x1="151" y1="465" x2="1074" y2="465" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="612" y="455" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">ibv_post_send(LOCAL_INV) 〔适用的 Type 2 MW〕</text>
<rect x="997" y="478" width="170" height="59" rx="8" fill="#EDEAF3" stroke="#82749E" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="1082" y="501" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="middle">等待区 ②</text>
<text x="1082" y="525" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">失效成功完成</text>
<line x1="1074" y1="558" x2="151" y2="558" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="611" y="548" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle">成功 CQE：再核对旧访问已经排空</text>
<rect x="58" y="580" width="175" height="39" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="145.5" y="604.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">RETIRED</text>
<text x="272" y="606" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">此后才允许 slot 复用；父 MR 仍可缓存。</text>
<line x1="48" y1="635" x2="1192" y2="635" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="664" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">post 成功 ≠ 操作完成；一个失效 CQE ≠ 所有 QP 已排空；失败或缺证据 → QUARANTINED。</text>
</svg>