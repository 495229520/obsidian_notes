<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">错误假设 sizeof(U) 等于 5 的数组布局</title>
  <desc id="desc">arr0 从地址 1000 开始占 5 字节，arr1 从 1005 开始，不能满足 4 字节对齐。</desc>
  <rect width="1040" height="360" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#b44a4a" stroke-width="1.6"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
    .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
    .addr { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #5f6b76; }
    .cellText { font: 700 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #26323d; }
    .note { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5f6b76; }
    .warn { font: 700 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #a33e3e; }
    .arr0 { fill: #e8f3ff; stroke: #4f86c6; stroke-width: 1.5; }
    .arr1 { fill: #fff1e6; stroke: #d47a3c; stroke-width: 1.5; }
    .grid { stroke: #cfd6d9; stroke-width: 1; }
    .badLine { stroke: #b44a4a; stroke-width: 2; stroke-dasharray: 5 5; }
  </style>

  <text x="60" y="44" class="title">错误假设：sizeof(U) = 5</text>
  <text x="60" y="72" class="note">arr[0] 从 1000 开始满足 4 字节对齐，但 arr[1] 会从 1005 开始，地址不能被 4 整除。</text>

  <g transform="translate(60 120)">
    <text x="0" y="25" class="label">地址</text>
    <g transform="translate(120 0)">
      <text x="30" y="25" text-anchor="middle" class="addr">1000</text>
      <text x="90" y="25" text-anchor="middle" class="addr">1001</text>
      <text x="150" y="25" text-anchor="middle" class="addr">1002</text>
      <text x="210" y="25" text-anchor="middle" class="addr">1003</text>
      <text x="270" y="25" text-anchor="middle" class="addr">1004</text>
      <text x="330" y="25" text-anchor="middle" class="addr">1005</text>
      <text x="390" y="25" text-anchor="middle" class="addr">1006</text>
      <text x="450" y="25" text-anchor="middle" class="addr">1007</text>
      <text x="510" y="25" text-anchor="middle" class="addr">1008</text>
      <text x="570" y="25" text-anchor="middle" class="addr">1009</text>

      <rect x="0" y="48" width="300" height="64" class="arr0"/>
      <rect x="300" y="48" width="300" height="64" class="arr1"/>
      <line x1="60" y1="48" x2="60" y2="112" class="grid"/>
      <line x1="120" y1="48" x2="120" y2="112" class="grid"/>
      <line x1="180" y1="48" x2="180" y2="112" class="grid"/>
      <line x1="240" y1="48" x2="240" y2="112" class="grid"/>
      <line x1="300" y1="40" x2="300" y2="232" class="badLine"/>
      <line x1="360" y1="48" x2="360" y2="112" class="grid"/>
      <line x1="420" y1="48" x2="420" y2="112" class="grid"/>
      <line x1="480" y1="48" x2="480" y2="112" class="grid"/>
      <line x1="540" y1="48" x2="540" y2="112" class="grid"/>
      <text x="150" y="86" text-anchor="middle" class="cellText">arr0 的 buf[5]</text>
      <text x="450" y="86" text-anchor="middle" class="cellText">arr1 的 buf[5]</text>

      <path d="M 300 198 L 300 122" fill="none" stroke="#b44a4a" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="318" y="184" class="warn">arr[1].i 从 1005 开始</text>
      <text x="318" y="210" class="warn">不满足 4 字节对齐</text>
    </g>
  </g>
</svg>
