<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>基本 Route Type：不要用端点路由替代成员与前缀</title>
<desc>左侧是共享非零 ESI 的双归属接入，右侧是端点 Type-2、成员 Type-3 和 IP-VRF Type-5 的不同作用对象。不是 EVPN 全部扩展类型的清单。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">基本 Route Type：不要用端点路由替代成员与前缀</text>
<text x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">Type-2/3 是单归属 L2 主线；Type-1/4 处理多归属，Type-5 表达 IP 前缀。</text>
<rect x="32" y="112" width="574" height="420" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="628" y="112" width="580" height="420" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="52" y="139" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · 多归属接入 Segment</text>
<rect x="74" y="184" width="200" height="79" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="174.0" y="217.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">PE-A</text>
<text x="174.0" y="239.5" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">连接同一个 ES</text>
<rect x="350" y="184" width="200" height="79" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="450.0" y="217.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">PE-B</text>
<text x="450.0" y="239.5" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">连接同一个 ES</text>
<path d="M278,223 L346,223" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="7 5"/>
<text x="312" y="198" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle">Type-4</text>
<text x="312" y="286" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">ES 发现 → DF 候选信息</text>
<path d="M174,267 L174,353" fill="none" stroke="#9B968A" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M450,267 L450,353" fill="none" stroke="#9B968A" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="213" y="305" width="200" height="43" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="313.0" y="331.5" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">Type-1 · A-D</text>
<rect x="106" y="359" width="412" height="44" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="312.0" y="386.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">共享 Ethernet Segment / 非零 ESI</text>
<path d="M312,407 L312,450" fill="none" stroke="#2F6B5E" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="52" y="430" font-size="14" font-weight="400" fill="#24473F" text-anchor="start">DF：向 ES 交付 BUM</text>
<rect x="211" y="455" width="202" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="312.0" y="487.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">双归属 CE / 主机</text>
<text x="650" y="139" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · 单归属端点、广播域与前缀</text>
<rect x="652" y="177" width="140" height="60" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="722.0" y="201.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">H2</text>
<text x="722.0" y="223.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">MAC / IP</text>
<rect x="854" y="177" width="170" height="60" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="939.0" y="201.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">VTEP-B</text>
<text x="939.0" y="223.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">端点位置</text>
<path d="M796,207 L850,207" fill="none" stroke="#2F6B5E" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="1062" y="201" font-size="15" font-weight="700" fill="#24473F" text-anchor="start">Type-2</text>
<text x="1062" y="227" font-size="13" font-weight="400" fill="#24473F" text-anchor="start">端点绑定</text>
<rect x="652" y="268" width="528" height="113" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="671" y="294" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="start">Type-3 · 同服务的 IMET 成员</text>
<rect x="676" y="311" width="143" height="51" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="747.5" y="330.5" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">VTEP-A</text>
<text x="747.5" y="352.5" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">VNI 10100</text>
<rect x="844" y="311" width="143" height="51" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="915.5" y="330.5" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">VTEP-B</text>
<text x="915.5" y="352.5" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">VNI 10100</text>
<rect x="1012" y="311" width="143" height="51" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="1083.5" y="330.5" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">VTEP-C</text>
<text x="1083.5" y="352.5" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">VNI 10100</text>
<rect x="652" y="435" width="160" height="64" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="732.0" y="461.0" font-size="14" font-weight="700" fill="#4A3F68" text-anchor="middle">IP-VRF</text>
<text x="732.0" y="483.0" font-size="14" font-weight="400" fill="#4A3F68" text-anchor="middle">租户路由</text>
<path d="M816,467 L906,467" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="861" y="448" font-size="14" font-weight="400" fill="#4A3F68" text-anchor="middle">Type-5</text>
<rect x="910" y="435" width="270" height="64" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1045.0" y="461.0" font-size="14" font-weight="700" fill="#4A3F68" text-anchor="middle">192.168.200.0/24</text>
<text x="1045.0" y="483.0" font-size="14" font-weight="400" fill="#4A3F68" text-anchor="middle">IP 前缀，而非逐主机 MAC</text>
<rect x="48" y="562" width="1144" height="78" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="592" font-size="15" font-weight="700" fill="#24473F" text-anchor="start">二层主线：Type-2 + Type-3</text>
<text x="654" y="592" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start">多归属加读：Type-1 + Type-4</text>
<text x="68" y="622" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">前缀路由：Type-5 + IP-VRF / IRB</text>
<text x="654" y="622" font-size="14" font-weight="400" fill="#733428" text-anchor="start">DF ≠ 全网领导者 ≠ 所有单播的唯一出口</text>
<path d="M48,655 L1192,655" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="48" y="680" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">左侧为多归属职责示意，不是完整报文路径；Type-1–4 来自 RFC 7432，Type-5 来自 RFC 9136，非全部类型穷举。</text>
</svg>
