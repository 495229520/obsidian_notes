<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200px" height="620px" viewBox="0 0 1200 620" version="1.1"><title>CUDA Week 2 benchmark and profiling workflow</title><desc>A workflow from correctness checking to CUDA event benchmark, benchmark matrix, Nsight profiling, and profiling.md evidence.</desc><rect x="0" y="0" width="1200" height="620" fill="rgb(245, 244, 237)" /><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#31424a" /></marker><marker id="thinArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b6f5d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect fill="rgb(245, 244, 237)" x="0" y="0" width="1200" height="620" /><text fill="#18282f" font-size="30" font-weight="700" font-family="Arial, sans-serif" x="600" y="54" text-anchor="middle" dominant-baseline="middle">Reduction Benchmark + Profiling Workflow</text><rect fill="#fdfbf4" stroke="#31424a" stroke-width="2" x="76" y="125" width="188" height="92" rx="10" ry="10" /><text fill="#18282f" font-size="18" font-weight="700" font-family="Arial, sans-serif" x="170" y="171" text-anchor="middle" dominant-baseline="middle">1. Correctness<tspan x="170" dy="23.4">PASS before timing</tspan></text><rect fill="#eef5f0" stroke="#31424a" stroke-width="2" x="330" y="125" width="188" height="92" rx="10" ry="10" /><text fill="#18282f" font-size="18" font-weight="700" font-family="Arial, sans-serif" x="424" y="171" text-anchor="middle" dominant-baseline="middle">2. CUDA Event<tspan x="424" dy="23.4">kernel-only time</tspan></text><rect fill="#f4f0e4" stroke="#31424a" stroke-width="2" x="584" y="125" width="188" height="92" rx="10" ry="10" /><text fill="#18282f" font-size="18" font-weight="700" font-family="Arial, sans-serif" x="678" y="171" text-anchor="middle" dominant-baseline="middle">3. Matrix<tspan x="678" dy="23.4">same N, same rules</tspan></text><rect fill="#edf1f5" stroke="#31424a" stroke-width="2" x="838" y="125" width="188" height="92" rx="10" ry="10" /><text fill="#18282f" font-size="18" font-weight="700" font-family="Arial, sans-serif" x="932" y="171" text-anchor="middle" dominant-baseline="middle">4. Nsight<tspan x="932" dy="23.4">explain why</tspan></text><line stroke="#31424a" stroke-width="2.5" marker-end="url(#arrow)" x1="264" y1="171" x2="320" y2="171" /><line stroke="#31424a" stroke-width="2.5" marker-end="url(#arrow)" x1="518" y1="171" x2="574" y2="171" /><line stroke="#31424a" stroke-width="2.5" marker-end="url(#arrow)" x1="772" y1="171" x2="828" y2="171" /><rect fill="#fffdf8" stroke="#c7b98f" stroke-width="2" x="112" y="310" width="264" height="118" rx="10" ry="10" /><text fill="#3e3527" font-size="17" font-family="Arial, sans-serif" x="244" y="369" text-anchor="middle" dominant-baseline="middle">Bad result can look fast<tspan x="244" dy="22.44">because it may skip work.</tspan><tspan x="244" dy="22.44">Check column guards trust.</tspan></text><rect fill="#fffdf8" stroke="#7b9d8e" stroke-width="2" x="468" y="300" width="264" height="138" rx="10" ry="10" /><text fill="#273b34" font-size="17" font-family="Arial, sans-serif" x="600" y="369" text-anchor="middle" dominant-baseline="middle">Warm up -&gt; repeat -&gt; sync<tspan x="600" dy="22.44">record avg/min time</tspan><tspan x="600" dy="22.44">compute effective GB/s</tspan></text><rect fill="#fffdf8" stroke="#8fa4bd" stroke-width="2" x="824" y="310" width="264" height="118" rx="10" ry="10" /><text fill="#263543" font-size="17" font-family="Arial, sans-serif" x="956" y="369" text-anchor="middle" dominant-baseline="middle">Profiler is not a timer.<tspan x="956" dy="22.44">Use it after timing</tspan><tspan x="956" dy="22.44">to explain bottlenecks.</tspan></text><line stroke="#6b6f5d" stroke-width="2" marker-end="url(#thinArrow)" x1="205" y1="218" x2="244" y2="300" /><line stroke="#6b6f5d" stroke-width="2" marker-end="url(#thinArrow)" x1="424" y1="218" x2="560" y2="292" /><line stroke="#6b6f5d" stroke-width="2" marker-end="url(#thinArrow)" x1="932" y1="218" x2="956" y2="300" /><rect fill="#e9efe8" stroke="#31424a" stroke-width="2" x="300" y="505" width="600" height="54" rx="8" ry="8" /><text fill="#18282f" font-size="18" font-weight="700" font-family="Arial, sans-serif" x="600" y="532" text-anchor="middle" dominant-baseline="middle">profiling.md = conclusion + benchmark fact + Nsight evidence + next step</text></svg>