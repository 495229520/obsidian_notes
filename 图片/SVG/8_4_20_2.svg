<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">ECMP 选下一跳，LAG 选物理成员</title><desc id="desc">两个选择范围可以串接；协议成员状态不等于实时负载均衡。</desc>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<defs>
<marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A26"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5B95"/></marker>
</defs>
<text x="48" y="51" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">ECMP 选下一跳，LAG 选物理成员</text>
<text x="48" y="80" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">两个选择范围可以串接；协议成员状态不等于实时负载均衡。</text>
<rect x="40" y="111" width="555" height="266" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="616" y="111" width="584" height="266" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="62" y="142" font-size="15" fill="#3D5A80" text-anchor="start" font-weight="700" data-role="body">① 路由下一跳组</text>
<rect x="63" y="177" width="124" height="60" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="125.0" y="201.5" font-size="13" fill="#9B968A" text-anchor="middle" font-weight="700" data-role="body">报文</text>
<text x="125.0" y="222.5" font-size="12" fill="#9B968A" text-anchor="middle" font-weight="400" data-role="body">目的前缀</text>
<rect x="223" y="177" width="145" height="60" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="295.5" y="201.5" font-size="13" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">ECMP 哈希</text>
<text x="295.5" y="222.5" font-size="12" fill="#3D5A80" text-anchor="middle" font-weight="400" data-role="body">组内选择</text>
<line x1="190" y1="207" x2="217" y2="207" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arr-blue)"/>
<rect x="417" y="166" width="142" height="46" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="488.0" y="194.0" font-size="13" fill="#9B968A" text-anchor="middle" font-weight="700" data-role="body">下一跳 A</text>
<rect x="417" y="271" width="142" height="46" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="488.0" y="299.0" font-size="13" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">下一跳 B</text>
<path d="M370,207 H389 V189 H412" fill="none" stroke="#9B968A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-gray)"/>
<path d="M370,207 H389 V294 H412" fill="none" stroke="#3D5A80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text x="62" y="352" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">成员：不同的路由下一跳</text>
<text x="640" y="142" font-size="15" fill="#8A6A3A" text-anchor="start" font-weight="700" data-role="body">② 聚合链路成员组</text>
<rect x="640" y="177" width="144" height="60" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="712.0" y="201.5" font-size="13" fill="#9B968A" text-anchor="middle" font-weight="700" data-role="body">逻辑出接口</text>
<text x="712.0" y="222.5" font-size="12" fill="#9B968A" text-anchor="middle" font-weight="400" data-role="body">PortChannel</text>
<rect x="813" y="177" width="139" height="60" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="882.5" y="201.5" font-size="13" fill="#8A6A3A" text-anchor="middle" font-weight="700" data-role="body">LAG 哈希</text>
<text x="882.5" y="222.5" font-size="12" fill="#8A6A3A" text-anchor="middle" font-weight="400" data-role="body">成员选择</text>
<line x1="789" y1="207" x2="807" y2="207" stroke="#8A6A3A" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arr-amber)"/>
<rect x="1002" y="166" width="163" height="46" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="1083.5" y="194.0" font-size="13" fill="#8A6A3A" text-anchor="middle" font-weight="700" data-role="body">成员 1 · 200G</text>
<rect x="1002" y="271" width="163" height="46" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1083.5" y="299.0" font-size="13" fill="#9B968A" text-anchor="middle" font-weight="700" data-role="body">成员 2 · 200G</text>
<path d="M954,207 H978 V189 H997" fill="none" stroke="#8A6A3A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/>
<path d="M954,207 H978 V294 H997" fill="none" stroke="#9B968A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-gray)"/>
<text x="640" y="352" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">成员：同一逻辑链路中的物理端口</text>
<text x="620" y="405" font-size="13" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">若选中的下一跳使用聚合出接口，可发生两级选择。</text>
<rect x="40" y="429" width="1160" height="207" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="63" y="460" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">一个人为构造的哈希结果</text>
<text x="63" y="505" font-size="24" fill="#3D5A80" text-anchor="start" font-weight="700" data-role="body">6 个流</text>
<text x="63" y="535" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">4 个候选成员</text>
<text x="63" y="569" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">不保证一流一路</text>
<rect x="320" y="478" width="175" height="115" rx="4" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="328" y="554" width="159" height="26" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="407.5" y="572" font-size="12" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">F1</text>
<rect x="328" y="524" width="159" height="26" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="407.5" y="542" font-size="12" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">F2</text>
<text x="407.5" y="619" font-size="13" fill="#2B2A26" text-anchor="middle" font-weight="400" data-role="body">成员 1</text>
<rect x="537" y="478" width="175" height="115" rx="4" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="624.5" y="544" font-size="13" fill="#6B675C" text-anchor="middle" font-weight="400" data-role="body">空桶</text>
<text x="624.5" y="619" font-size="13" fill="#2B2A26" text-anchor="middle" font-weight="400" data-role="body">成员 2</text>
<rect x="754" y="478" width="175" height="115" rx="4" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.3"/>
<rect x="762" y="554" width="159" height="26" rx="3" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="841.5" y="572" font-size="12" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">F3</text>
<rect x="762" y="524" width="159" height="26" rx="3" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="841.5" y="542" font-size="12" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">F4</text>
<rect x="762" y="494" width="159" height="26" rx="3" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="841.5" y="512" font-size="12" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">F5</text>
<text x="841.5" y="619" font-size="13" fill="#2B2A26" text-anchor="middle" font-weight="400" data-role="body">成员 3</text>
<rect x="971" y="478" width="175" height="115" rx="4" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="979" y="554" width="159" height="26" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1058.5" y="572" font-size="12" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">F6</text>
<text x="1058.5" y="619" font-size="13" fill="#2B2A26" text-anchor="middle" font-weight="400" data-role="body">成员 4</text>
<text x="48" y="658" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">桶内流数不是字节负载；本图的 2×200G 聚合仅为独立示例。</text>
</svg>