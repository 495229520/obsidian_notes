<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="620px" viewBox="0 0 1280 620" version="1.1">
  <title>CUDA Week 3 row-major transpose index mapping</title>
  <desc>Shows how a 3 by 4 row-major input matrix maps to linear memory and then to a 4 by 3 transposed output matrix.</desc>
  <rect x="0" y="0" width="1280" height="620" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="lineArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#2f3f46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #18282f; }
      .section { font: 700 18px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #26343a; }
      .label { font: 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #34464d; }
      .small { font: 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526168; }
      .code { font: 15px Menlo, Consolas, monospace; fill: #26343a; }
      .cellText { font: 700 16px Menlo, Consolas, monospace; fill: #18282f; }
      .indexText { font: 12px Menlo, Consolas, monospace; fill: #6b756d; }
      .box { fill: #fffdf8; stroke: #2f3f46; stroke-width: 1.6; }
      .softBox { fill: #eef5f0; stroke: #7b9d8e; stroke-width: 1.4; }
      .hot { fill: #f7e5b8; stroke: #b79d58; stroke-width: 2.2; }
      .cool { fill: #e7eef7; stroke: #8fa4bd; stroke-width: 2.2; }
      .arrow { stroke: #2f3f46; stroke-width: 2.2; fill: none; marker-end: url(#lineArrow); }
    </style>
  </defs>

  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="title" x="640" y="42" text-anchor="middle">Row-major 内存布局与 transpose 下标</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="640" y="76" text-anchor="middle">输入矩阵按行连续存储；转置时 in(row, col) 变成 out(col, row)</text>

  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="175" y="118" text-anchor="middle">Input matrix</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="175" y="143" text-anchor="middle">height = 3, width = 4</text>

  <g transform="translate(55 190)">
    <rect class="box" x="0" y="0" width="240" height="180" rx="8"/>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="-12" y="34" text-anchor="end">row 0</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="-12" y="94" text-anchor="end">row 1</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="-12" y="154" text-anchor="end">row 2</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="30" y="-20" text-anchor="middle">col 0</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="90" y="-20" text-anchor="middle">col 1</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="150" y="-20" text-anchor="middle">col 2</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="210" y="-20" text-anchor="middle">col 3</text>
    <g>
      <rect class="softBox" x="0" y="0" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="30" y="35" text-anchor="middle">a00</text>
      <rect class="softBox" x="60" y="0" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="90" y="35" text-anchor="middle">a01</text>
      <rect class="softBox" x="120" y="0" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="150" y="35" text-anchor="middle">a02</text>
      <rect class="softBox" x="180" y="0" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="210" y="35" text-anchor="middle">a03</text>
      <rect class="softBox" x="0" y="60" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="30" y="95" text-anchor="middle">a10</text>
      <rect class="softBox" x="60" y="60" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="90" y="95" text-anchor="middle">a11</text>
      <rect class="hot" x="120" y="60" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="150" y="95" text-anchor="middle">a12</text>
      <rect class="softBox" x="180" y="60" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="210" y="95" text-anchor="middle">a13</text>
      <rect class="softBox" x="0" y="120" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="30" y="155" text-anchor="middle">a20</text>
      <rect class="softBox" x="60" y="120" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="90" y="155" text-anchor="middle">a21</text>
      <rect class="softBox" x="120" y="120" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="150" y="155" text-anchor="middle">a22</text>
      <rect class="softBox" x="180" y="120" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="210" y="155" text-anchor="middle">a23</text>
    </g>
  </g>

  <path class="arrow" d="M315 280 C340 268, 357 268, 378 280"/>
  <rect x="304" y="218" width="72" height="50" rx="7" fill="rgb(245, 244, 237)" stroke="#9aa28f" stroke-width="1.1"/>
  <text style="font-family: Menlo, Consolas, monospace; font-size: 12px;" x="340" y="237" text-anchor="middle" fill="#26343a">idx =</text>
  <text style="font-family: Menlo, Consolas, monospace; font-size: 12px;" x="340" y="254" text-anchor="middle" fill="#26343a">r*w + c</text>

  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="640" y="125" text-anchor="middle">Linear memory</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="640" y="148" text-anchor="middle">row-major: 一行接一行</text>
  <g transform="translate(385 185)">
    <rect class="box" x="0" y="0" width="510" height="120" rx="8"/>
    <g transform="translate(25 28)">
      <rect class="softBox" x="0" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="19" y="27" text-anchor="middle">a00</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="19" y="62" text-anchor="middle">0</text>
      <rect class="softBox" x="38" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="57" y="27" text-anchor="middle">a01</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="57" y="62" text-anchor="middle">1</text>
      <rect class="softBox" x="76" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="95" y="27" text-anchor="middle">a02</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="95" y="62" text-anchor="middle">2</text>
      <rect class="softBox" x="114" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="133" y="27" text-anchor="middle">a03</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="133" y="62" text-anchor="middle">3</text>
      <rect class="softBox" x="152" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="171" y="27" text-anchor="middle">a10</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="171" y="62" text-anchor="middle">4</text>
      <rect class="softBox" x="190" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="209" y="27" text-anchor="middle">a11</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="209" y="62" text-anchor="middle">5</text>
      <rect class="hot" x="228" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="247" y="27" text-anchor="middle">a12</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="247" y="62" text-anchor="middle">6</text>
      <rect class="softBox" x="266" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="285" y="27" text-anchor="middle">a13</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="285" y="62" text-anchor="middle">7</text>
      <rect class="softBox" x="304" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="323" y="27" text-anchor="middle">a20</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="323" y="62" text-anchor="middle">8</text>
      <rect class="softBox" x="342" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="361" y="27" text-anchor="middle">a21</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="361" y="62" text-anchor="middle">9</text>
      <rect class="softBox" x="380" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="399" y="27" text-anchor="middle">a22</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="399" y="62" text-anchor="middle">10</text>
      <rect class="softBox" x="418" y="0" width="38" height="44"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="437" y="27" text-anchor="middle">a23</text><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="indexText" x="437" y="62" text-anchor="middle">11</text>
    </g>
  </g>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="640" y="340" text-anchor="middle">a12: row = 1, col = 2, idx = 1 * 4 + 2 = 6</text>

  <path class="arrow" d="M900 252 C922 242, 948 242, 972 252"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="925" y="205" text-anchor="middle">out(col, row)</text>

  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="1105" y="118" text-anchor="middle">Output matrix</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="1105" y="143" text-anchor="middle">height = 4, width = 3</text>
  <g transform="translate(1015 190)">
    <rect class="box" x="0" y="0" width="180" height="240" rx="8"/>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="-12" y="34" text-anchor="end">row 0</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="-12" y="94" text-anchor="end">row 1</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="-12" y="154" text-anchor="end">row 2</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="-12" y="214" text-anchor="end">row 3</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="30" y="-20" text-anchor="middle">col 0</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="90" y="-20" text-anchor="middle">col 1</text>
    <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="small" x="150" y="-20" text-anchor="middle">col 2</text>
    <rect class="cool" x="0" y="0" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="30" y="35" text-anchor="middle">a00</text>
    <rect class="cool" x="60" y="0" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="90" y="35" text-anchor="middle">a10</text>
    <rect class="cool" x="120" y="0" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="150" y="35" text-anchor="middle">a20</text>
    <rect class="cool" x="0" y="60" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="30" y="95" text-anchor="middle">a01</text>
    <rect class="cool" x="60" y="60" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="90" y="95" text-anchor="middle">a11</text>
    <rect class="cool" x="120" y="60" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="150" y="95" text-anchor="middle">a21</text>
    <rect class="cool" x="0" y="120" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="30" y="155" text-anchor="middle">a02</text>
    <rect class="hot" x="60" y="120" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="90" y="155" text-anchor="middle">a12</text>
    <rect class="cool" x="120" y="120" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="150" y="155" text-anchor="middle">a22</text>
    <rect class="cool" x="0" y="180" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="30" y="215" text-anchor="middle">a03</text>
    <rect class="cool" x="60" y="180" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="90" y="215" text-anchor="middle">a13</text>
    <rect class="cool" x="120" y="180" width="60" height="60"/><text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="cellText" x="150" y="215" text-anchor="middle">a23</text>
  </g>

  <rect x="300" y="455" width="680" height="92" rx="10" fill="#fff8e8" stroke="#b79d58" stroke-width="1.8"/>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="section" x="640" y="485" text-anchor="middle">核心公式</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="code" x="640" y="516" text-anchor="middle">out[col * height + row] = in[row * width + col]</text>
  <text style="font-family: Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;" class="label" x="640" y="540" text-anchor="middle">输入每行长度用 width；输出每行长度变成原来的 height</text>
</svg>
