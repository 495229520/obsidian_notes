<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">轮询预算不是限速睡眠：有积压就轮转，再回来</title>
  <desc id="desc">入口额度、提交公平与完成服务要一起设计；数量、字节和 CPU 时间分别计账。。图中预算、序号与布局均为教学示意，不是实测结果。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B" />
    </marker>
    <marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C" />
    </marker>
    <marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E" />
    </marker>
    <marker id="bluearr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3" />
  <text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">轮询预算不是限速睡眠：有积压就轮转，再回来</text>
  <text x="48" y="79" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">入口额度、提交公平与完成服务要一起设计；数量、字节和 CPU 时间分别计账。</text>
  <line x1="48" y1="98" x2="1192" y2="98" stroke="#D8D5C8" stroke-width="1" />
  <text x="1192" y="658" font-size="12" fill="#8B8679" font-weight="400" text-anchor="end">8 · 4 · 18 · 4</text>
  <text x="51" y="134" font-size="15" fill="#733428" font-weight="700" text-anchor="start">A · 反例：持续清空 inbox</text>
  <rect x="235" y="115" width="760" height="49" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
  <text x="258" y="146" font-size="14" fill="#733428" font-weight="400" text-anchor="start">取请求</text>
  <text x="358" y="146" font-size="14" fill="#733428" font-weight="400" text-anchor="start">取请求</text>
  <text x="458" y="146" font-size="14" fill="#733428" font-weight="400" text-anchor="start">取请求</text>
  <text x="558" y="146" font-size="14" fill="#733428" font-weight="400" text-anchor="start">取请求</text>
  <text x="658" y="146" font-size="14" fill="#733428" font-weight="400" text-anchor="start">取请求</text>
  <text x="758" y="146" font-size="14" fill="#733428" font-weight="400" text-anchor="start">取请求</text>
  <text x="858" y="146" font-size="14" fill="#733428" font-weight="400" text-anchor="start">取请求</text>
  <text x="958" y="146" font-size="14" fill="#733428" font-weight="400" text-anchor="start">取请求</text>
  <polyline points="998,139 1060,139" fill="none" stroke="#A64B3C" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#redarr)" />
  <rect x="1064" y="115" width="128" height="49" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="1128.0" y="144.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">CQ 等不到</text>
  <text x="237" y="191" font-size="14" fill="#733428" font-weight="400" text-anchor="start">生产者不断入队 → “清空后再 poll”可能永远到不了</text>
  <text x="51" y="231" font-size="15" fill="#24473F" font-weight="700" text-anchor="start">B · 有界服务周期</text>
  <rect x="48" y="250" width="118" height="54" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="107.0" y="283" font-size="15" fill="#4A473F" font-weight="700" text-anchor="middle">控制</text>
  <rect x="166" y="250" width="160" height="54" rx="0" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="246.0" y="283" font-size="15" fill="#514573" font-weight="700" text-anchor="middle">CQ A</text>
  <rect x="326" y="250" width="160" height="54" rx="0" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="406.0" y="283" font-size="15" fill="#514573" font-weight="700" text-anchor="middle">CQ B</text>
  <rect x="486" y="250" width="118" height="54" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="545.0" y="283" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">RQ</text>
  <rect x="604" y="250" width="175" height="54" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="691.5" y="283" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">Post A</text>
  <rect x="779" y="250" width="175" height="54" rx="0" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="866.5" y="283" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">Post B</text>
  <rect x="954" y="250" width="178" height="54" rx="0" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="1043.0" y="283" font-size="15" fill="#6B4E28" font-weight="700" text-anchor="middle">结果</text>
  <polyline points="1170,320 1170,341 70,341 70,309" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#greenarr)" />
  <text x="467" y="331" font-size="13" fill="#24473F" font-weight="400" text-anchor="start">保存游标，下一轮继续服务</text>
  <text x="52" y="383" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">① 入口：租户限额</text>
  <text x="467" y="383" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">② 提交：RR / DRR</text>
  <text x="882" y="383" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">③ 完成：CQ 配额</text>
  <text x="52" y="438" font-size="14" fill="#2C4460" font-weight="700" text-anchor="start">小消息</text>
  <rect x="145" y="412" width="24" height="39" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <rect x="175" y="412" width="24" height="39" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <rect x="205" y="412" width="24" height="39" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <rect x="235" y="412" width="24" height="39" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <rect x="265" y="412" width="24" height="39" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <rect x="295" y="412" width="24" height="39" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <rect x="325" y="412" width="24" height="39" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
  <text x="52" y="517" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="start">大消息</text>
  <rect x="145" y="491" width="100" height="39" rx="2" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <rect x="251" y="491" width="100" height="39" rx="2" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <rect x="464" y="414" width="278" height="108" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
  <text x="603.0" y="449.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">WR 数 / 字节 / 时间</text>
  <text x="603.0" y="473.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">每租户在途上限</text>
  <text x="603.0" y="497.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">过大请求分块或跨轮累积</text>
  <polyline points="366,451 458,451" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <polyline points="366,511 426,511 426,490 458,490" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="890" y="413" width="300" height="54" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3" />
  <text x="1040.0" y="445.0" font-size="14" fill="#514573" font-weight="700" text-anchor="middle">有限 poll → 快速对账</text>
  <rect x="890" y="489" width="300" height="54" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" />
  <text x="1040.0" y="521.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">慢业务回调移交 C</text>
  <polyline points="746,451 884,451" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <polyline points="1040,471 1040,485" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="52" y="583" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">测量三段等待</text>
  <text x="240" y="583" font-size="15" fill="#4A473F" font-weight="400" text-anchor="start">enqueue → post</text>
  <text x="480" y="583" font-size="15" fill="#4A473F" font-weight="400" text-anchor="start">post → CQE observed</text>
  <text x="880" y="583" font-size="15" fill="#4A473F" font-weight="400" text-anchor="start">CQE → callback</text>
  <rect x="48" y="612" width="1144" height="47" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
  <text x="66" y="641" font-size="14" fill="#4A473F" font-weight="700" text-anchor="start">容量</text>
  <text x="114" y="641" font-size="14" fill="#4A473F" font-weight="400" text-anchor="start">CQ 空间覆盖未 poll 窗口、突发与错误余量；配额用完不代表可以忽略积压。</text>
</svg>