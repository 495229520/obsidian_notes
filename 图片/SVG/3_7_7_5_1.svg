<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>TCP 头部 20 字节与 UDP 头部 8 字节的字段对照</title>
  <desc>按 32 位一行画出 TCP 固定首部的六行字段与六个标志位，再画出 UDP 的两行首部，最后用能力表说明多出来的 12 字节分别买到了排序、确认重传、流量控制这三项机制。</desc>

  <rect x="0" y="0" width="1240" height="800" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">TCP 头 20 字节，UDP 头 8 字节：多出的 12 字节买了什么</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">每个字段对应一项机制；UDP 少了哪几个字段，就少了哪几项能力</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="388" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · TCP 固定首部：每行 32 位</text>

  <line x1="200" y1="160" x2="1160" y2="160" stroke="#9B968A" stroke-width="1"/>
  <line x1="200" y1="154" x2="200" y2="160" stroke="#9B968A" stroke-width="1"/>
  <line x1="440" y1="154" x2="440" y2="160" stroke="#9B968A" stroke-width="1"/>
  <line x1="680" y1="154" x2="680" y2="160" stroke="#9B968A" stroke-width="1"/>
  <line x1="920" y1="154" x2="920" y2="160" stroke="#9B968A" stroke-width="1"/>
  <line x1="1160" y1="154" x2="1160" y2="160" stroke="#9B968A" stroke-width="1"/>
  <text x="200" y="148" font-size="10" fill="#6B675C" text-anchor="middle">bit 0</text>
  <text x="440" y="148" font-size="10" fill="#6B675C" text-anchor="middle">8</text>
  <text x="680" y="148" font-size="10" fill="#6B675C" text-anchor="middle">16</text>
  <text x="920" y="148" font-size="10" fill="#6B675C" text-anchor="middle">24</text>
  <text x="1160" y="148" font-size="10" fill="#6B675C" text-anchor="middle">31</text>

  <!-- row1 -->
  <text x="76" y="193" font-size="10.5" fill="#6B675C">字节 0 – 3</text>
  <rect x="200" y="170" width="480" height="36" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="440" y="193" font-size="12" fill="#6B4E28" text-anchor="middle">源端口（16 位）</text>
  <rect x="680" y="170" width="480" height="36" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="920" y="193" font-size="12" fill="#6B4E28" text-anchor="middle">目的端口（16 位）</text>

  <!-- row2 -->
  <text x="76" y="233" font-size="10.5" fill="#6B675C">字节 4 – 7</text>
  <rect x="200" y="210" width="960" height="36" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="680" y="233" font-size="12" fill="#2C4460" text-anchor="middle">序号 seq（32 位）：本段第一个字节在字节流里的位置</text>

  <!-- row3 -->
  <text x="76" y="273" font-size="10.5" fill="#6B675C">字节 8 – 11</text>
  <rect x="200" y="250" width="960" height="36" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="680" y="273" font-size="12" fill="#2C4460" text-anchor="middle">确认号 ack（32 位）：期望收到的下一个字节的序号</text>

  <!-- row4 -->
  <text x="76" y="313" font-size="10.5" fill="#6B675C">字节 12 – 15</text>
  <rect x="200" y="290" width="120" height="36" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="260" y="308" font-size="10.5" fill="#4A473F" text-anchor="middle">数据偏移</text>
  <text x="260" y="321" font-size="10" fill="#6B675C" text-anchor="middle">4 位</text>
  <rect x="320" y="290" width="180" height="36" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="410" y="313" font-size="10.5" fill="#6B675C" text-anchor="middle">保留 6 位</text>
  <rect x="500" y="290" width="30" height="36" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="515" y="313" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">U</text>
  <rect x="530" y="290" width="30" height="36" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="545" y="313" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">A</text>
  <rect x="560" y="290" width="30" height="36" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="575" y="313" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">P</text>
  <rect x="590" y="290" width="30" height="36" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="605" y="313" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">R</text>
  <rect x="620" y="290" width="30" height="36" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="635" y="313" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">S</text>
  <rect x="650" y="290" width="30" height="36" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="665" y="313" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">F</text>
  <rect x="680" y="290" width="480" height="36" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="920" y="313" font-size="12" fill="#24473F" text-anchor="middle">窗口 win（16 位）：我还能收多少字节</text>

  <!-- row5 -->
  <text x="76" y="353" font-size="10.5" fill="#6B675C">字节 16 – 19</text>
  <rect x="200" y="330" width="480" height="36" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="440" y="353" font-size="12" fill="#4A473F" text-anchor="middle">检验和（16 位）</text>
  <rect x="680" y="330" width="480" height="36" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="920" y="353" font-size="12" fill="#6B675C" text-anchor="middle">紧急指针（16 位，几乎不用）</text>

  <!-- row6 -->
  <text x="76" y="393" font-size="10.5" fill="#6B675C">字节 20 起</text>
  <rect x="200" y="370" width="960" height="36" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="680" y="393" font-size="12" fill="#4A3F68" text-anchor="middle">选项（长度可变，最多 40 字节）：MSS、窗口扩大、SACK、时间戳</text>

  <!-- 标志位图例 -->
  <rect x="200" y="420" width="150" height="34" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="275" y="436" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">URG</text>
  <text x="275" y="449" font-size="10" fill="#733428" text-anchor="middle">紧急指针有效</text>
  <rect x="360" y="420" width="150" height="34" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="435" y="436" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">ACK</text>
  <text x="435" y="449" font-size="10" fill="#733428" text-anchor="middle">确认号字段有效</text>
  <rect x="520" y="420" width="150" height="34" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="595" y="436" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">PSH</text>
  <text x="595" y="449" font-size="10" fill="#733428" text-anchor="middle">尽快交给应用</text>
  <rect x="680" y="420" width="150" height="34" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="755" y="436" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">RST</text>
  <text x="755" y="449" font-size="10" fill="#733428" text-anchor="middle">强制断开连接</text>
  <rect x="840" y="420" width="150" height="34" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="915" y="436" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">SYN</text>
  <text x="915" y="449" font-size="10" fill="#733428" text-anchor="middle">请求建立连接</text>
  <rect x="1000" y="420" width="150" height="34" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="1075" y="436" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">FIN</text>
  <text x="1075" y="449" font-size="10" fill="#733428" text-anchor="middle">关闭本方向</text>

  <text x="76" y="478" font-size="11" fill="#6B675C">数据偏移 4 位、以 4 字节为单位，所以 TCP 头最长 60 字节</text>

  <!-- ================= Panel B ================= -->
  <rect x="48" y="508" width="652" height="232" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="534" font-size="15" font-weight="700" fill="#4A473F">B · UDP 首部：一共就 8 字节</text>

  <line x1="90" y1="560" x2="650" y2="560" stroke="#9B968A" stroke-width="1"/>
  <text x="90" y="554" font-size="10" fill="#6B675C" text-anchor="middle">bit 0</text>
  <text x="370" y="554" font-size="10" fill="#6B675C" text-anchor="middle">16</text>
  <text x="650" y="554" font-size="10" fill="#6B675C" text-anchor="middle">31</text>

  <rect x="90" y="568" width="280" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="230" y="590" font-size="11.5" fill="#6B4E28" text-anchor="middle">源端口（16 位）</text>
  <rect x="370" y="568" width="280" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="510" y="590" font-size="11.5" fill="#6B4E28" text-anchor="middle">目的端口（16 位）</text>
  <rect x="90" y="606" width="280" height="34" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="230" y="628" font-size="11.5" fill="#4A473F" text-anchor="middle">长度（16 位）</text>
  <rect x="370" y="606" width="280" height="34" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="510" y="628" font-size="11.5" fill="#4A473F" text-anchor="middle">检验和（16 位）</text>

  <text x="72" y="668" font-size="11.5" fill="#4A473F">没有序号，所以不知道先后</text>
  <text x="72" y="690" font-size="11.5" fill="#4A473F">没有确认号，所以发出去就不管了</text>
  <text x="72" y="712" font-size="11.5" fill="#4A473F">没有窗口，所以发多快全凭应用自己控制</text>

  <rect x="716" y="508" width="476" height="232" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="740" y="534" font-size="15" font-weight="700" fill="#4A473F">C · 字段决定能力</text>

  <rect x="740" y="546" width="428" height="24" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="740" y="570" width="428" height="24" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="740" y="594" width="428" height="24" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="740" y="618" width="428" height="24" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="740" y="642" width="428" height="24" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="740" y="666" width="428" height="24" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="740" y="690" width="428" height="24" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <line x1="1020" y1="546" x2="1020" y2="714" stroke="#9B968A" stroke-width="1"/>
  <line x1="1094" y1="546" x2="1094" y2="714" stroke="#9B968A" stroke-width="1"/>

  <text x="756" y="563" font-size="11" font-weight="700" fill="#4A473F">靠哪个字段实现</text>
  <text x="1057" y="563" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">TCP</text>
  <text x="1131" y="563" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">UDP</text>

  <text x="756" y="587" font-size="11" fill="#4A473F">分用：源端口 + 目的端口</text>
  <text x="1057" y="587" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">有</text>
  <text x="1131" y="587" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">有</text>

  <text x="756" y="611" font-size="11" fill="#4A473F">检错：检验和</text>
  <text x="1057" y="611" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">有</text>
  <text x="1131" y="611" font-size="11" fill="#6B675C" text-anchor="middle">可选</text>

  <text x="756" y="635" font-size="11" fill="#4A473F">排序去重：序号</text>
  <text x="1057" y="635" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">有</text>
  <text x="1131" y="635" font-size="11" font-weight="700" fill="#A64B3C" text-anchor="middle">无</text>

  <text x="756" y="659" font-size="11" fill="#4A473F">确认重传：确认号 + ACK</text>
  <text x="1057" y="659" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">有</text>
  <text x="1131" y="659" font-size="11" font-weight="700" fill="#A64B3C" text-anchor="middle">无</text>

  <text x="756" y="683" font-size="11" fill="#4A473F">流量控制：窗口</text>
  <text x="1057" y="683" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">有</text>
  <text x="1131" y="683" font-size="11" font-weight="700" fill="#A64B3C" text-anchor="middle">无</text>

  <text x="756" y="707" font-size="11" fill="#4A473F">连接建立：SYN / FIN 标志</text>
  <text x="1057" y="707" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">有</text>
  <text x="1131" y="707" font-size="11" font-weight="700" fill="#A64B3C" text-anchor="middle">无</text>

  <text x="48" y="768" font-size="11.5" fill="#4A473F">「UDP 快」不是因为它跑得快，而是因为它什么都不做：没有握手的一个 RTT，没有确认等待，没有丢包时的重传退避。</text>
  <text x="48" y="790" font-size="11.5" fill="#4A473F">需要可靠性时，这些工作只是从内核挪到了你的应用代码里，总开销不会凭空消失。</text>
</svg>
