<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>TCP 的 11 个状态与两条关闭路径</title>
  <desc>把 TCP 状态机按主动关闭方和被动关闭方分成左右两列，标出每次状态迁移由哪个事件触发；右侧对照四种状态堆积各自说明什么问题。</desc>

  <rect x="0" y="0" width="1240" height="800" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">TCP 的 11 个状态：分清谁先发 FIN，图就读顺了</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">左右两列不是客户端和服务端，是主动关闭方和被动关闭方；谁先调 close 谁走左边</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="772" height="642" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 状态迁移全图</text>

  <text x="230" y="158" font-size="11.5" font-weight="700" fill="#8A6A3A" text-anchor="middle">主动关闭方</text>
  <text x="640" y="158" font-size="11.5" font-weight="700" fill="#6B5B95" text-anchor="middle">被动关闭方</text>

  <!-- 状态框 -->
  <rect x="360" y="176" width="150" height="38" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="435" y="200" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">CLOSED</text>

  <rect x="155" y="250" width="150" height="38" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="230" y="274" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">SYN_SENT</text>

  <rect x="565" y="250" width="150" height="38" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="640" y="274" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">LISTEN</text>

  <rect x="565" y="318" width="150" height="38" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="640" y="342" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">SYN_RCVD</text>

  <rect x="360" y="392" width="150" height="38" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="2"/>
  <text x="435" y="416" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">ESTABLISHED</text>

  <rect x="155" y="466" width="150" height="38" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="230" y="490" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">FIN_WAIT_1</text>

  <rect x="565" y="466" width="150" height="38" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="640" y="490" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">CLOSE_WAIT</text>

  <rect x="155" y="540" width="150" height="38" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="230" y="564" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">FIN_WAIT_2</text>

  <rect x="360" y="540" width="150" height="38" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="435" y="564" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">CLOSING</text>

  <rect x="565" y="540" width="150" height="38" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="640" y="564" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">LAST_ACK</text>

  <rect x="155" y="614" width="150" height="38" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.8"/>
  <text x="230" y="638" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">TIME_WAIT</text>

  <rect x="360" y="688" width="150" height="38" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="435" y="712" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">CLOSED</text>

  <!-- 迁移箭头 -->
  <line x1="400" y1="214" x2="256" y2="246" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="316" y="226" font-size="10.5" fill="#4A473F" text-anchor="middle">connect</text>

  <line x1="470" y1="214" x2="614" y2="246" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="554" y="226" font-size="10.5" fill="#4A473F" text-anchor="middle">listen</text>

  <line x1="640" y1="288" x2="640" y2="314" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="652" y="306" font-size="10.5" fill="#4A473F">收 SYN，回 SYN+ACK</text>

  <line x1="230" y1="288" x2="378" y2="388" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="243" y="330" font-size="10.5" fill="#4A473F">收 SYN+ACK</text>

  <line x1="640" y1="356" x2="492" y2="388" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="590" y="378" font-size="10.5" fill="#4A473F" text-anchor="middle">收 ACK</text>

  <line x1="400" y1="430" x2="256" y2="462" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="312" y="442" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">close 发 FIN</text>

  <line x1="470" y1="430" x2="614" y2="462" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="442" font-size="10.5" font-weight="700" fill="#4A3F68" text-anchor="middle">收到 FIN</text>

  <line x1="200" y1="504" x2="200" y2="536" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="188" y="526" font-size="10.5" fill="#4A473F" text-anchor="end">收 ACK</text>

  <line x1="292" y1="504" x2="382" y2="536" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="348" y="518" font-size="10.5" fill="#6B675C" text-anchor="middle">同时关闭</text>

  <line x1="200" y1="578" x2="200" y2="610" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="188" y="600" font-size="10.5" fill="#4A473F" text-anchor="end">收 FIN</text>

  <line x1="400" y1="578" x2="300" y2="612" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="602" font-size="10.5" fill="#4A473F" text-anchor="middle">收 ACK</text>

  <line x1="640" y1="504" x2="640" y2="536" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="652" y="526" font-size="10.5" font-weight="700" fill="#4A3F68">close 发 FIN</text>

  <path d="M640,578 V660 H524 V690" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="652" y="620" font-size="10.5" fill="#4A473F">收 ACK</text>

  <line x1="256" y1="652" x2="382" y2="684" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="300" y="678" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">2MSL 超时</text>

  <text x="72" y="736" font-size="11" fill="#6B675C">CLOSING 是虚线：只有双方几乎同时调 close 才会经过它，正常流程走不到</text>

  <!-- ================= Panel B ================= -->
  <rect x="836" y="104" width="356" height="642" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="860" y="130" font-size="15" font-weight="700" fill="#4A473F">B · 哪个状态堆积说明什么</text>

  <rect x="860" y="150" width="308" height="120" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="880" y="174" font-size="12.5" font-weight="700" fill="#733428">TIME_WAIT 很多</text>
  <text x="880" y="198" font-size="11.5" fill="#733428">出现在主动关闭的一方</text>
  <text x="880" y="220" font-size="11.5" fill="#733428">短连接高频时属于正常</text>
  <text x="880" y="242" font-size="11.5" fill="#733428">Linux 固定等 60 秒</text>
  <text x="880" y="262" font-size="11" fill="#733428">根治办法是改用长连接</text>

  <rect x="860" y="282" width="308" height="120" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="880" y="306" font-size="12.5" font-weight="700" fill="#4A3F68">CLOSE_WAIT 很多</text>
  <text x="880" y="330" font-size="11.5" fill="#4A3F68">出现在被动关闭的一方</text>
  <text x="880" y="352" font-size="11.5" font-weight="700" fill="#4A3F68">这一定是代码 bug</text>
  <text x="880" y="374" font-size="11.5" fill="#4A3F68">read 返回 0 后没调 close</text>
  <text x="880" y="394" font-size="11" fill="#4A3F68">查异常分支里漏掉的关闭</text>

  <rect x="860" y="414" width="308" height="120" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="880" y="438" font-size="12.5" font-weight="700" fill="#2C4460">SYN_RCVD 很多</text>
  <text x="880" y="462" font-size="11.5" fill="#2C4460">半连接队列被占满</text>
  <text x="880" y="484" font-size="11.5" fill="#2C4460">对方发了 SYN 却不回 ACK</text>
  <text x="880" y="506" font-size="11.5" fill="#2C4460">典型的 SYN flood 特征</text>
  <text x="880" y="526" font-size="11" fill="#2C4460">开 syncookies 可以顶住</text>

  <rect x="860" y="546" width="308" height="120" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="880" y="570" font-size="12.5" font-weight="700" fill="#6B4E28">FIN_WAIT_2 很多</text>
  <text x="880" y="594" font-size="11.5" fill="#6B4E28">自己的 FIN 已经被确认</text>
  <text x="880" y="616" font-size="11.5" fill="#6B4E28">对端迟迟不发它的 FIN</text>
  <text x="880" y="638" font-size="11.5" fill="#6B4E28">问题在对端应用不在自己</text>
  <text x="880" y="658" font-size="11" fill="#6B4E28">对端多半也堆着 CLOSE_WAIT</text>

  <text x="860" y="694" font-size="11" fill="#6B675C">按状态计数：</text>
  <text x="860" y="716" font-size="11" fill="#6B675C">ss -tan | awk '{print $1}' | sort | uniq -c</text>

  <text x="48" y="774" font-size="11.5" fill="#4A473F">TIME_WAIT 和 CLOSE_WAIT 是两种完全不同的信号：前者是协议要求的等待，后者是你的程序忘了收尾。看到 CLOSE_WAIT 堆积不要去调内核参数。</text>
</svg>
