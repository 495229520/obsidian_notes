<text x="297" y="251" font-size="14" fill="#24473F" text-anchor="middle" font-weight="500">输入 0–1</text>
<rect x="360" y="294" width="630" height="34" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="675" y="316" font-size="14" fill="#24473F" text-anchor="middle" font-weight="500">独立计算 1.00–6.00</text>
<rect x="271.8" y="359" width="113.4" height="34" rx="4" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3" stroke-dasharray="5 3"/>
