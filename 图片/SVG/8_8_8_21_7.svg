<rect x="385.2" y="359" width="504" height="34" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="637.2" y="381" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="500">通信 kernel 1.20–5.20</text>
<rect x="990" y="424" width="126" height="34" rx="4" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1053" y="446" font-size="14" fill="#4A3F68" text-anchor="middle" font-weight="500">消费</text>
<line x1="990" y1="275" x2="990" y2="474" stroke="#2F6B5E" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="990" y="496" font-size="12" fill="#24473F" text-anchor="middle" font-weight="400">6.0：消费就绪</text>
<text x="69" y="550" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700">观察口径</text>
<rect x="230" y="530" width="258" height="61" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="246" y="554" font-size="13" fill="#2C4460" text-anchor="start" font-weight="400">Host 调用</text>
<text x="472" y="572" font-size="21" fill="#2C4460" text-anchor="end" font-weight="700">0.10 ms</text>
<rect x="518" y="530" width="280" height="61" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="534" y="554" font-size="13" fill="#2C4460" text-anchor="start" font-weight="400">GPU 通信区间</text>
<text x="782" y="572" font-size="21" fill="#2C4460" text-anchor="end" font-weight="700">4.00 ms</text>
<rect x="829" y="530" width="336" height="61" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="845" y="554" font-size="13" fill="#24473F" text-anchor="start" font-weight="400">完整 step</text>
<text x="1149" y="572" font-size="21" fill="#24473F" text-anchor="end" font-weight="700">7.00 ms</text>
<line x1="48" y1="629" x2="1192" y2="629" stroke="#D8D5C8" stroke-width="1.5"/>
<text x="48" y="658" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400">提交后间隙 0.90 ms = 已知依赖 0.70 ms + 未分解 0.20 ms；通信完成提前，不代表消费者更早启动。</text>
</svg>