<text x="66" y="382" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700">GPU 通信</text>
<line x1="234" y1="401" x2="1157" y2="401" stroke="#D8D5C8" stroke-width="0.8"/>
<text x="66" y="447" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700">GPU 消费</text>
<line x1="234" y1="466" x2="1157" y2="466" stroke="#D8D5C8" stroke-width="0.8"/>
<rect x="259.2" y="164" width="12.6" height="34" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<line x1="271.8" y1="181" x2="366.3" y2="181" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="378.9" y="186" font-size="14" fill="#2C4460" text-anchor="start" font-weight="400">API 0.20–0.30  /  0.10 ms</text>
