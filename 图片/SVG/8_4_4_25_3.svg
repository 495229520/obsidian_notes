<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>先测两条 rail 的容量，再测单个应用是否真正受益</title>
<desc>阶段 A：独立微基准并行；阶段 B：真实工作负载分流。两个阶段的结论不能互相代替。</desc>
<defs>
<marker id="8_4_4_25_3-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="8_4_4_25_3-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="8_4_4_25_3-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="8_4_4_25_3-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="45" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">先测两条 rail 的容量，再测单个应用是否真正受益</text>
<text x="48" y="74" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">阶段 A：独立微基准并行；阶段 B：真实工作负载分流。两个阶段的结论不能互相代替。</text>
<text x="48" y="113" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 主机并行容量（教学算例，非实测）</text>
<rect x="48" y="132" width="552" height="256" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<line x1="178" y1="160" x2="178" y2="324" stroke="#D8D5C8" stroke-width="1"/>
<text x="178" y="345" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">0</text>
<line x1="268" y1="160" x2="268" y2="324" stroke="#D8D5C8" stroke-width="1"/>
<text x="268" y="345" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">10</text>
<line x1="358" y1="160" x2="358" y2="324" stroke="#D8D5C8" stroke-width="1"/>
<text x="358" y="345" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">20</text>
<line x1="448" y1="160" x2="448" y2="324" stroke="#D8D5C8" stroke-width="1"/>
<text x="448" y="345" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">30</text>
<line x1="538" y1="160" x2="538" y2="324" stroke="#D8D5C8" stroke-width="1"/>
<text x="538" y="345" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">40</text>
<text x="67" y="197" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">单 rail0</text>
<rect x="178" y="173" width="198" height="35" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="385" y="197" font-size="14" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">22</text>
<text x="67" y="250" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">单 rail1</text>
<rect x="178" y="226" width="189" height="35" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="376" y="250" font-size="14" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">21</text>
<text x="67" y="303" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">同时运行</text>
<rect x="178" y="279" width="261" height="35" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="448" y="303" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="body">29</text>
<text x="514" y="373" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">GB/s</text>
<text x="69" y="373" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">S ≈ 1.32     η ≈ 0.67</text>
<text x="641" y="113" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 单应用分流与端到端收益</text>
<rect x="640" y="132" width="552" height="256" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<rect x="666" y="155" width="500" height="45" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="916.0" y="182.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">同一个工作负载：UCX / NCCL / NVMe-oF</text>
<line x1="916" y1="203" x2="916" y2="226" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_25_3-arr)"/>
<rect x="667" y="233" width="235" height="55" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="784.5" y="254.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">1 rail 对照</text>
<text x="784.5" y="276.5" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">同尺寸 / 同方向</text>
<rect x="930" y="233" width="236" height="55" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="1048.0" y="254.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">2 rails 实验</text>
<text x="1048.0" y="276.5" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">保留实际设备日志</text>
<line x1="785" y1="291" x2="785" y2="315" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_25_3-arr)"/>
<line x1="1048" y1="291" x2="1048" y2="315" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_25_3-arr)"/>
<text x="917" y="339" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="middle" data-role="body">端口字节 + 应用完成 + 正确性</text>
<text x="917" y="370" font-size="13" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">两个独立进程跑满 ≠ 单应用加速</text>
<text x="48" y="424" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">C · 每个对照只改变一类变量</text>
<rect x="48" y="445" width="190" height="35" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="467.5" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">对照</text>
<rect x="238" y="445" width="260" height="35" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="250" y="467.5" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">固定 / 改变</text>
<rect x="498" y="445" width="327" height="35" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="510" y="467.5" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">必须记录</text>
<rect x="825" y="445" width="367" height="35" rx="0" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.3" />
<text x="837" y="467.5" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">能够区分</text>
<rect x="48" y="480" width="190" height="35" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="502.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">单条 → 同时</text>
<rect x="238" y="480" width="260" height="35" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="250" y="502.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">保持端点 / 负载口径</text>
<rect x="498" y="480" width="327" height="35" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="510" y="502.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">公共边与同时段字节</text>
<rect x="825" y="480" width="367" height="35" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="837" y="502.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">独立能力 / 共享瓶颈</text>
<rect x="48" y="515" width="190" height="35" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="537.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">NUMA 对照</text>
<rect x="238" y="515" width="260" height="35" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="250" y="537.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">固定 NIC 与网络</text>
<rect x="498" y="515" width="327" height="35" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="510" y="537.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">CPU / 内存放置</text>
<rect x="825" y="515" width="367" height="35" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="837" y="537.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">主机局部性代价</text>
<rect x="48" y="550" width="190" height="35" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="572.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">QP 数扫描</text>
<rect x="238" y="550" width="260" height="35" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="250" y="572.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">固定单 NIC 路径</text>
<rect x="498" y="550" width="327" height="35" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="510" y="572.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">并发 / 完成开销</text>
<rect x="825" y="550" width="367" height="35" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="837" y="572.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">多 QP / 多 NIC 收益</text>
<rect x="48" y="585" width="190" height="35" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="60" y="607.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">故障 / 恢复</text>
<rect x="238" y="585" width="260" height="35" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="250" y="607.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">仅许可测试环境</text>
<rect x="498" y="585" width="327" height="35" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="510" y="607.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">epoch / 重试 / 结果</text>
<rect x="825" y="585" width="367" height="35" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3" />
<text x="837" y="607.5" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">可用性 / 正确性</text>
<text x="48" y="670" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">S = b01 / max(b0,b1)，η = b01 / (b0+b1)；统计窗口、单位和方向必须一致，没有统一翻倍门槛。</text>
</svg>