<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">GID 是本地地址上下文；MAC 是逐跳目的地</title>
<desc id="desc">示例为无 NAT、无隧道的路由路径；地址仅用于文档演示</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="title">GID 是本地地址上下文；MAC 是逐跳目的地</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="title">示例为无 NAT、无隧道的路由路径；地址仅用于文档演示</text>
<rect x="48" y="108" width="454" height="488" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="70" y="136" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">A · 选择的是完整表项，不是单独的 index</text>
<rect x="68" y="161" width="414" height="43" rx="4" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="80" y="180" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">RDMA device / port</text>
<text x="274" y="180" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">mlx5_0 / 1</text>
<text x="80" y="228" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">本地 GID index</text>
<text x="274" y="228" font-size="13.5" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="body">3（本机槽位）</text>
<rect x="68" y="257" width="414" height="43" rx="4" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="80" y="276" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">GID value</text>
<text x="274" y="276" font-size="13.5" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="body">::ffff:192.0.2.10</text>
<text x="80" y="324" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">GID type</text>
<text x="274" y="324" font-size="13.5" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="body">RoCE v2</text>
<rect x="68" y="353" width="414" height="43" rx="4" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="80" y="372" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">关联 netdev</text>
<text x="274" y="372" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">enp65s0f0</text>
<text x="80" y="420" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">绑定意图</text>
<text x="274" y="420" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">IPv4 / 指定源地址</text>
<rect x="70" y="472" width="408" height="91" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="274.0" y="511.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">value + type + netdev + port</text>
<text x="274.0" y="534.0" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle" data-zone="body">共同约束选择；index 不出现在报文中</text>
<rect x="524" y="108" width="668" height="488" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="544" y="136" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">B · 两个路由跳：L2 换头，目的 IP 保持</text>
<rect x="549" y="184" width="120" height="77" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="609.0" y="216.0" font-size="12.5" fill="#2C4460" font-weight="700" text-anchor="middle" data-zone="body">Host A</text>
<text x="609.0" y="239.0" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-zone="body">192.0.2.10</text>
<rect x="716" y="184" width="120" height="77" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="776.0" y="216.0" font-size="12.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">Router 1</text>
<text x="776.0" y="239.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-zone="body">下一跳</text>
<rect x="883" y="184" width="120" height="77" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="943.0" y="216.0" font-size="12.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">Router 2</text>
<text x="943.0" y="239.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-zone="body">下一跳</text>
<rect x="1050" y="184" width="120" height="77" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1110.0" y="216.0" font-size="12.5" fill="#24473F" font-weight="700" text-anchor="middle" data-zone="body">Host B</text>
<text x="1110.0" y="239.0" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-zone="body">198.51.100.20</text>
<line x1="673" y1="222" x2="711" y2="222" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="840" y1="222" x2="878" y2="222" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="1007" y1="222" x2="1045" y2="222" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="570" y="294" font-size="14" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">IPv4-mapped GID</text>
<line x1="737" y1="289" x2="778" y2="289" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="793" y="294" font-size="14" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">线上可以是 IPv4</text>
<text x="549" y="338" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">链路</text>
<text x="720" y="338" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">目的 MAC</text>
<text x="966" y="338" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">目的 IP</text>
<line x1="544" y1="349" x2="1170" y2="349" stroke="#D8D5C8" stroke-width="1"/>
<text x="549" y="369" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">A → Router 1</text>
<text x="720" y="369" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">Router 1 的入接口</text>
<text x="966" y="369" font-size="13" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">198.51.100.20</text>
<line x1="544" y1="401" x2="1170" y2="401" stroke="#D8D5C8" stroke-width="1"/>
<text x="549" y="421" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">Router 1 → Router 2</text>
<text x="720" y="421" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">Router 2 的入接口</text>
<text x="966" y="421" font-size="13" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">198.51.100.20</text>
<line x1="544" y1="453" x2="1170" y2="453" stroke="#D8D5C8" stroke-width="1"/>
<text x="549" y="473" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">Router 2 → B</text>
<text x="720" y="473" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">Host B</text>
<text x="966" y="473" font-size="13" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">198.51.100.20</text>
<text x="550" y="557" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="body">TTL / Hop Limit 逐跳更新；VLAN 按链路封装</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="646" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="footer">A 的 index 3 不等于 B 的 index 3；新增地址、VLAN 或重新初始化后，应重新枚举并验证。</text>
</svg>