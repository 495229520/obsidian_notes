<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">指针访问结构体成员的底层理解</title>
  <desc id="desc">展示 puser 或 eax 保存结构体起始地址，通过基地址加偏移访问 HP 和 MP 成员。</desc>
  <rect x="0" y="0" width="1120" height="720" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,4 L1,7" fill="none" stroke="#3b5f7f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263238; }
      .subtitle { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5b6670; }
      .section { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263238; }
      .body { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #344047; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #59636b; }
      .code { font: 15px Consolas, "Cascadia Mono", monospace; fill: #263238; }
      .code-small { font: 13px Consolas, "Cascadia Mono", monospace; fill: #263238; }
      .panel { fill: #fffdf8; stroke: #c9c2b3; stroke-width: 1.4; rx: 8; }
      .chip-blue { fill: #e8f1fa; stroke: #5c83a6; stroke-width: 1.6; rx: 7; }
      .chip-green { fill: #e9f6ef; stroke: #4f8f69; stroke-width: 1.8; rx: 7; }
      .chip-amber { fill: #fff3d8; stroke: #b98431; stroke-width: 1.8; rx: 7; }
      .chip-gray { fill: #eef0ee; stroke: #8b918a; stroke-width: 1.4; rx: 7; }
      .arrow { fill: none; stroke: #3b5f7f; stroke-width: 2; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .guide { fill: none; stroke: #8b918a; stroke-width: 1.2; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <text x="560" y="42" text-anchor="middle" class="title">指针访问结构体成员 = 基地址 + 成员偏移</text>
  <text x="560" y="70" text-anchor="middle" class="subtitle">示例假设 int 占 4 字节，Role 只有 HP 和 MP 两个 int 成员</text>

  <rect x="36" y="104" width="308" height="196" class="panel"/>
  <text x="58" y="135" class="section">C++ 视角</text>
  <text x="58" y="166" class="code">struct Role {</text>
  <text x="78" y="192" class="code">int HP;  // offset 0</text>
  <text x="78" y="218" class="code">int MP;  // offset 4</text>
  <text x="58" y="244" class="code">};</text>
  <text x="58" y="276" class="code">Role* puser = &amp;user;</text>

  <rect x="36" y="332" width="308" height="142" class="panel"/>
  <text x="58" y="363" class="section">寄存器 / 指针值</text>
  <rect x="58" y="384" width="116" height="46" class="chip-blue"/>
  <text x="116" y="412" text-anchor="middle" class="code">eax</text>
  <text x="194" y="399" class="body">保存的是地址 A</text>
  <text x="194" y="423" class="small">A 就是 user 的起始地址</text>
  <text x="58" y="454" class="code-small">puser == A, eax == A</text>

  <rect x="396" y="104" width="684" height="256" class="panel"/>
  <text x="420" y="135" class="section">内存视角：Role user 的连续存储</text>
  <text x="420" y="162" class="small">结构体对象从地址 A 开始，每个成员在固定偏移处占据一段字节。</text>

  <text x="430" y="197" class="small">地址 A</text>
  <line x1="458" y1="206" x2="458" y2="286" class="guide"/>
  <rect x="458" y="208" width="282" height="84" class="chip-green"/>
  <text x="599" y="242" text-anchor="middle" class="section">HP</text>
  <text x="599" y="269" text-anchor="middle" class="body">offset +0, 4 bytes</text>

  <text x="742" y="197" class="small">地址 A + 4</text>
  <line x1="740" y1="206" x2="740" y2="286" class="guide"/>
  <rect x="740" y="208" width="282" height="84" class="chip-amber"/>
  <text x="881" y="242" text-anchor="middle" class="section">MP</text>
  <text x="881" y="269" text-anchor="middle" class="body">offset +4, 4 bytes</text>

  <rect x="458" y="305" width="70" height="28" class="chip-gray"/>
  <rect x="528" y="305" width="70" height="28" class="chip-gray"/>
  <rect x="598" y="305" width="70" height="28" class="chip-gray"/>
  <rect x="668" y="305" width="72" height="28" class="chip-gray"/>
  <rect x="740" y="305" width="70" height="28" class="chip-gray"/>
  <rect x="810" y="305" width="70" height="28" class="chip-gray"/>
  <rect x="880" y="305" width="70" height="28" class="chip-gray"/>
  <rect x="950" y="305" width="72" height="28" class="chip-gray"/>
  <text x="493" y="324" text-anchor="middle" class="small">A+0</text>
  <text x="563" y="324" text-anchor="middle" class="small">A+1</text>
  <text x="633" y="324" text-anchor="middle" class="small">A+2</text>
  <text x="704" y="324" text-anchor="middle" class="small">A+3</text>
  <text x="775" y="324" text-anchor="middle" class="small">A+4</text>
  <text x="845" y="324" text-anchor="middle" class="small">A+5</text>
  <text x="915" y="324" text-anchor="middle" class="small">A+6</text>
  <text x="986" y="324" text-anchor="middle" class="small">A+7</text>

  <path d="M176 407 C260 407, 326 250, 448 250" class="arrow"/>
  <text x="256" y="381" class="small">eax 指向起始地址 A</text>

  <rect x="36" y="508" width="308" height="142" class="panel"/>
  <text x="58" y="539" class="section">栈帧里的两个局部量</text>
  <text x="58" y="570" class="code-small">[ebp-10h]  user 对象</text>
  <text x="58" y="598" class="code-small">[ebp-1Ch]  puser 指针</text>
  <text x="58" y="629" class="small">puser 这个变量本身在栈上，</text>
  <text x="58" y="649" class="small">它里面存放的值是 user 的地址 A。</text>

  <rect x="396" y="392" width="684" height="258" class="panel"/>
  <text x="420" y="423" class="section">汇编寻址如何落到成员上</text>

  <rect x="426" y="448" width="286" height="72" class="chip-green"/>
  <text x="446" y="477" class="code">mov dword ptr [eax], 32h</text>
  <text x="446" y="502" class="body">[eax] = [A] = HP 的起始位置</text>

  <rect x="764" y="448" width="286" height="72" class="chip-amber"/>
  <text x="784" y="477" class="code">mov dword ptr [eax+4], 32h</text>
  <text x="784" y="502" class="body">[eax+4] = [A+4] = MP 的起始位置</text>

  <path d="M560 448 C550 392, 560 334, 584 294" class="arrow"/>
  <path d="M910 448 C900 392, 900 334, 884 294" class="arrow"/>

  <line x1="738" y1="536" x2="738" y2="612" stroke="#c9c2b3" stroke-width="1"/>
  <text x="430" y="564" class="body">puser-&gt;HP 等价于：从 A + 0 处读写 4 字节</text>
  <text x="430" y="594" class="body">puser-&gt;MP 等价于：从 A + 4 处读写 4 字节</text>
  <text x="764" y="564" class="body">关键点：+4 是“字节偏移”</text>
  <text x="764" y="594" class="body">真实偏移由成员类型大小和对齐规则决定</text>

  <rect x="36" y="674" width="1044" height="30" fill="#efe6d4" stroke="#cbbd9f" stroke-width="1.2" rx="8"/>
  <text x="558" y="694" text-anchor="middle" class="small">一句话记忆：指针不是“知道成员名”，而是拿到对象起始地址后，按编译器已确定的偏移量去访问对应内存。</text>
</svg>
