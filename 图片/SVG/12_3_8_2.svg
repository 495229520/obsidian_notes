<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 750" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>四种供需冲击的曲线移动与新旧均衡</title>
  <desc>2×2 面板：需求增加、需求减少、供给增加、供给减少。每个面板给出 S/D 曲线、移动前后的位置、新旧均衡点，以及价格与数量的方向。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="750" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">四种供需冲击：曲线怎么移，P 和 Q 往哪走</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">同一组 S/D 曲线，每次只换一条线的位置 —— 移动的是需求还是供给，决定了价格与数量是同向还是反向</text>

  <!-- ================= ① 需求增加 ================= -->
  <g transform="translate(48,104)">
    <rect x="0" y="0" width="562" height="272" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
    <rect x="14" y="15" width="4" height="15" rx="2" fill="#A64B3C"/>
    <text x="26" y="27" font-size="13.5" font-weight="700" fill="#2B2A26">① 需求增加 · D 右移</text>

    <line x1="64" y1="238" x2="64" y2="46" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="64" y1="238" x2="392" y2="238" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="54" y="52" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">P</text>
    <text x="390" y="230" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">Q</text>

    <line x1="64" y1="142" x2="208" y2="142" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="208" y1="142" x2="208" y2="238" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="64" y1="124.5" x2="236" y2="124.5" stroke="#8A6A3A" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="236" y1="124.5" x2="236" y2="238" stroke="#8A6A3A" stroke-width="1" stroke-dasharray="4,3"/>

    <path d="M72,227 L328,67" fill="none" stroke="#3D5A80" stroke-width="2"/>
    <path d="M72,57 L328,217" fill="none" stroke="#CFA79E" stroke-width="1.6" stroke-dasharray="6,4"/>
    <path d="M128,57 L384,217" fill="none" stroke="#A64B3C" stroke-width="2.6"/>
    <line x1="138" y1="95" x2="181" y2="95" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrD)"/>

    <text x="96" y="79" font-size="11.5" fill="#9B968A" text-anchor="end">D₀</text>
    <text x="152" y="79" font-size="11.5" font-weight="700" fill="#A64B3C" text-anchor="end">D₁</text>
    <text x="322" y="52" font-size="11.5" font-weight="700" fill="#3D5A80" text-anchor="end">S</text>

    <circle cx="208" cy="142" r="4" fill="#FBFBF6" stroke="#4A473F" stroke-width="1.6"/>
    <circle cx="236" cy="124.5" r="4.5" fill="#2B2A26"/>
    <text x="58" y="146" font-size="10" fill="#6B675C" text-anchor="end">P₀</text>
    <text x="58" y="128.5" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="end">P₁</text>
    <text x="208" y="252" font-size="10" fill="#6B675C" text-anchor="middle">Q₀</text>
    <text x="236" y="252" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">Q₁</text>

    <rect x="402" y="44" width="144" height="70" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
    <text x="416" y="72" font-size="13.5" font-weight="700" fill="#2B2A26">价格 P ↑</text>
    <text x="416" y="100" font-size="13.5" font-weight="700" fill="#2B2A26">数量 Q ↑</text>
    <text x="402" y="142" font-size="10.5" fill="#6B675C">典型触发</text>
    <text x="402" y="160" font-size="11.5" fill="#2B2A26">AI 算力需求爆发</text>
    <text x="402" y="188" font-size="10.5" fill="#6B675C">谁受益</text>
    <text x="402" y="206" font-size="11.5" fill="#2B2A26">有现货产能的卖方</text>
  </g>

  <!-- ================= ② 需求减少 ================= -->
  <g transform="translate(630,104)">
    <rect x="0" y="0" width="562" height="272" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
    <rect x="14" y="15" width="4" height="15" rx="2" fill="#A64B3C"/>
    <text x="26" y="27" font-size="13.5" font-weight="700" fill="#2B2A26">② 需求减少 · D 左移</text>

    <line x1="64" y1="238" x2="64" y2="46" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="64" y1="238" x2="392" y2="238" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="54" y="52" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">P</text>
    <text x="390" y="230" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">Q</text>

    <line x1="64" y1="124.5" x2="236" y2="124.5" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="236" y1="124.5" x2="236" y2="238" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="64" y1="142" x2="208" y2="142" stroke="#8A6A3A" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="208" y1="142" x2="208" y2="238" stroke="#8A6A3A" stroke-width="1" stroke-dasharray="4,3"/>

    <path d="M72,227 L328,67" fill="none" stroke="#3D5A80" stroke-width="2"/>
    <path d="M128,57 L384,217" fill="none" stroke="#CFA79E" stroke-width="1.6" stroke-dasharray="6,4"/>
    <path d="M72,57 L328,217" fill="none" stroke="#A64B3C" stroke-width="2.6"/>
    <line x1="181" y1="95" x2="138" y2="95" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrD)"/>

    <text x="96" y="79" font-size="11.5" font-weight="700" fill="#A64B3C" text-anchor="end">D₁</text>
    <text x="152" y="79" font-size="11.5" fill="#9B968A" text-anchor="end">D₀</text>
    <text x="322" y="52" font-size="11.5" font-weight="700" fill="#3D5A80" text-anchor="end">S</text>

    <circle cx="236" cy="124.5" r="4" fill="#FBFBF6" stroke="#4A473F" stroke-width="1.6"/>
    <circle cx="208" cy="142" r="4.5" fill="#2B2A26"/>
    <text x="58" y="128.5" font-size="10" fill="#6B675C" text-anchor="end">P₀</text>
    <text x="58" y="146" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="end">P₁</text>
    <text x="236" y="252" font-size="10" fill="#6B675C" text-anchor="middle">Q₀</text>
    <text x="208" y="252" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">Q₁</text>

    <rect x="402" y="44" width="144" height="70" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
    <text x="416" y="72" font-size="13.5" font-weight="700" fill="#2B2A26">价格 P ↓</text>
    <text x="416" y="100" font-size="13.5" font-weight="700" fill="#2B2A26">数量 Q ↓</text>
    <text x="402" y="142" font-size="10.5" fill="#6B675C">典型触发</text>
    <text x="402" y="160" font-size="11.5" fill="#2B2A26">衰退，可选消费降级</text>
    <text x="402" y="188" font-size="10.5" fill="#6B675C">谁受损</text>
    <text x="402" y="206" font-size="11.5" fill="#2B2A26">高固定成本厂商</text>
  </g>

  <!-- ================= ③ 供给增加 ================= -->
  <g transform="translate(48,392)">
    <rect x="0" y="0" width="562" height="272" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
    <rect x="14" y="15" width="4" height="15" rx="2" fill="#3D5A80"/>
    <text x="26" y="27" font-size="13.5" font-weight="700" fill="#2B2A26">③ 供给增加 · S 右移</text>

    <line x1="64" y1="238" x2="64" y2="46" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="64" y1="238" x2="392" y2="238" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="54" y="52" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">P</text>
    <text x="390" y="230" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">Q</text>

    <line x1="64" y1="142" x2="208" y2="142" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="208" y1="142" x2="208" y2="238" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="64" y1="159.5" x2="236" y2="159.5" stroke="#8A6A3A" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="236" y1="159.5" x2="236" y2="238" stroke="#8A6A3A" stroke-width="1" stroke-dasharray="4,3"/>

    <path d="M72,57 L328,217" fill="none" stroke="#A64B3C" stroke-width="2"/>
    <path d="M72,227 L328,67" fill="none" stroke="#93A9C4" stroke-width="1.6" stroke-dasharray="6,4"/>
    <path d="M128,227 L384,67" fill="none" stroke="#3D5A80" stroke-width="2.6"/>
    <line x1="128" y1="195" x2="172" y2="195" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrS)"/>

    <text x="96" y="79" font-size="11.5" font-weight="700" fill="#A64B3C" text-anchor="end">D</text>
    <text x="322" y="52" font-size="11.5" fill="#9B968A" text-anchor="end">S₀</text>
    <text x="378" y="52" font-size="11.5" font-weight="700" fill="#3D5A80" text-anchor="end">S₁</text>

    <circle cx="208" cy="142" r="4" fill="#FBFBF6" stroke="#4A473F" stroke-width="1.6"/>
    <circle cx="236" cy="159.5" r="4.5" fill="#2B2A26"/>
    <text x="58" y="146" font-size="10" fill="#6B675C" text-anchor="end">P₀</text>
    <text x="58" y="163.5" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="end">P₁</text>
    <text x="208" y="252" font-size="10" fill="#6B675C" text-anchor="middle">Q₀</text>
    <text x="236" y="252" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">Q₁</text>

    <rect x="402" y="44" width="144" height="70" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
    <text x="416" y="72" font-size="13.5" font-weight="700" fill="#2B2A26">价格 P ↓</text>
    <text x="416" y="100" font-size="13.5" font-weight="700" fill="#2B2A26">数量 Q ↑</text>
    <text x="402" y="142" font-size="10.5" fill="#6B675C">典型触发</text>
    <text x="402" y="160" font-size="11.5" fill="#2B2A26">新产能集中投产</text>
    <text x="402" y="188" font-size="10.5" fill="#6B675C">谁受损</text>
    <text x="402" y="206" font-size="11.5" fill="#2B2A26">高成本边际产能</text>
  </g>

  <!-- ================= ④ 供给减少 ================= -->
  <g transform="translate(630,392)">
    <rect x="0" y="0" width="562" height="272" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
    <rect x="14" y="15" width="4" height="15" rx="2" fill="#3D5A80"/>
    <text x="26" y="27" font-size="13.5" font-weight="700" fill="#2B2A26">④ 供给减少 · S 左移</text>

    <line x1="64" y1="238" x2="64" y2="46" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="64" y1="238" x2="392" y2="238" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="54" y="52" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">P</text>
    <text x="390" y="230" font-size="11.5" font-weight="700" fill="#6B675C" text-anchor="end">Q</text>

    <line x1="64" y1="159.5" x2="236" y2="159.5" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="236" y1="159.5" x2="236" y2="238" stroke="#9B968A" stroke-width="0.9" stroke-dasharray="3,3"/>
    <line x1="64" y1="142" x2="208" y2="142" stroke="#8A6A3A" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="208" y1="142" x2="208" y2="238" stroke="#8A6A3A" stroke-width="1" stroke-dasharray="4,3"/>

    <path d="M72,57 L328,217" fill="none" stroke="#A64B3C" stroke-width="2"/>
    <path d="M128,227 L384,67" fill="none" stroke="#93A9C4" stroke-width="1.6" stroke-dasharray="6,4"/>
    <path d="M72,227 L328,67" fill="none" stroke="#3D5A80" stroke-width="2.6"/>
    <line x1="172" y1="195" x2="128" y2="195" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrS)"/>

    <text x="96" y="79" font-size="11.5" font-weight="700" fill="#A64B3C" text-anchor="end">D</text>
    <text x="322" y="52" font-size="11.5" font-weight="700" fill="#3D5A80" text-anchor="end">S₁</text>
    <text x="378" y="52" font-size="11.5" fill="#9B968A" text-anchor="end">S₀</text>

    <circle cx="236" cy="159.5" r="4" fill="#FBFBF6" stroke="#4A473F" stroke-width="1.6"/>
    <circle cx="208" cy="142" r="4.5" fill="#2B2A26"/>
    <text x="58" y="163.5" font-size="10" fill="#6B675C" text-anchor="end">P₀</text>
    <text x="58" y="146" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="end">P₁</text>
    <text x="236" y="252" font-size="10" fill="#6B675C" text-anchor="middle">Q₀</text>
    <text x="208" y="252" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">Q₁</text>

    <rect x="402" y="44" width="144" height="70" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
    <text x="416" y="72" font-size="13.5" font-weight="700" fill="#2B2A26">价格 P ↑</text>
    <text x="416" y="100" font-size="13.5" font-weight="700" fill="#2B2A26">数量 Q ↓</text>
    <text x="402" y="142" font-size="10.5" fill="#6B675C">典型触发</text>
    <text x="402" y="160" font-size="11.5" fill="#2B2A26">断供、减产、天灾</text>
    <text x="402" y="188" font-size="10.5" fill="#6B675C">谁受益</text>
    <text x="402" y="206" font-size="11.5" fill="#2B2A26">有库存的持有方</text>
  </g>

  <text x="48" y="698" font-size="12" font-weight="700" fill="#2B2A26">读法：需求移动 → P 与 Q 同向；供给移动 → P 与 Q 反向</text>
  <text x="48" y="722" font-size="10.5" fill="#6B675C">虚线＝移动前，实线＝移动后；空心点 E₀ 是原均衡，实心点 E₁ 是新均衡。方向由哪条曲线在动决定，幅度由另一条曲线的弹性决定</text>
</svg>
