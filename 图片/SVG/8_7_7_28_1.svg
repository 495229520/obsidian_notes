<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-labelledby="title desc">
<title id="title">元数据的权威归属：两类复制域与本地索引</title><desc id="desc">系统管理数据库与池容器相关RDB是不同复制域；各target上的VOS维护对象索引、版本和DTX，SMD维护本地设备映射。DDB只作为诊断工具读取结构，不是一个在线复制数据库。</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3D5A80"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6B5E"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8A6A3A"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A64B3C"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8B8679"/></marker>
</defs>
<style>text {font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;}</style>
<rect id="background" x="0" y="0" width="1240" height="690" fill="rgb(245, 244, 237)"/>
<text id="txt-1" x="48" y="49" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="title">元数据的权威归属：两类复制域与本地索引</text>
<text id="txt-2" x="48" y="78" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">示例副本数不是默认配置 · 逻辑作用域不同，不代表每个 container 都有独立 Raft 集群</text>
<rect id="grid" x="40" y="103" width="1160" height="501" rx="12" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect id="header" x="41" y="104" width="1158" height="44" rx="10" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text id="txt-3" x="64" y="133" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">逻辑作用域</text>
<text id="txt-4" x="322" y="133" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">权威状态 / 复制责任</text>
<text id="txt-5" x="848" y="133" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">不应混淆的边界</text>
<path d="M 41 278 H 1199" fill="none" stroke="#8B8679" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 41 438 H 1199" fill="none" stroke="#8B8679" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 293 149 V 603" fill="none" stroke="#8B8679" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 818 149 V 603" fill="none" stroke="#8B8679" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text id="txt-6" x="64" y="202" font-size="20" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">System</text>
<text id="txt-7" x="64" y="232" font-size="15" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">系统成员与管理</text>
<text id="txt-8" x="322" y="176" font-size="17" fill="#6B4E28" text-anchor="start" font-weight="600" data-role="body">Go 管理服务数据库</text>
<circle id="ms0" cx="414" cy="212" r="23" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
<text id="txt-9" x="414.0" y="218.88" font-size="16" fill="#6B4E28" text-anchor="middle" font-weight="600" data-role="body" data-owner="ms0">F1</text>
<circle id="ms1" cx="560" cy="212" r="23" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
<text id="txt-10" x="560.0" y="218.88" font-size="16" fill="#6B4E28" text-anchor="middle" font-weight="600" data-role="body" data-owner="ms1">L</text>
<circle id="ms2" cx="706" cy="212" r="23" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
<text id="txt-11" x="706.0" y="218.88" font-size="16" fill="#6B4E28" text-anchor="middle" font-weight="600" data-role="body" data-owner="ms2">F2</text>
<path d="M 439 212 H 535" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
<path d="M 585 212 H 681" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
<text id="txt-12" x="322" y="260" font-size="14.5" fill="#6B4E28" text-anchor="start" font-weight="400" data-role="body">成员 / rank / pool service 记录</text>
<text id="txt-13" x="848" y="203" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">不是全局对象索引表</text>
<text id="txt-14" x="848" y="235" font-size="15" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">不代理每次用户写入</text>
<text id="txt-15" x="848" y="261" font-size="13.5" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">L：当前 leader；F：其他副本</text>
<text id="txt-16" x="64" y="330" font-size="20" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">Pool</text>
<path d="M 73 345 V 370" fill="none" stroke="#8B8679" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-neutral)"/>
<text id="txt-17" x="64" y="402" font-size="20" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">Container</text>
<text id="txt-18" x="322" y="305" font-size="17" fill="#24473F" text-anchor="start" font-weight="600" data-role="body">Pool / Container 服务 · RDB</text>
<circle id="rdb0" cx="414" cy="351" r="23" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
<text id="txt-19" x="414.0" y="357.88" font-size="16" fill="#24473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="rdb0">F1</text>
<circle id="rdb1" cx="560" cy="351" r="23" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
<text id="txt-20" x="560.0" y="357.88" font-size="16" fill="#24473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="rdb1">L</text>
<circle id="rdb2" cx="706" cy="351" r="23" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
<text id="txt-21" x="706.0" y="357.88" font-size="16" fill="#24473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="rdb2">F2</text>
<path d="M 439 351 H 535" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
<path d="M 585 351 H 681" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
<text id="txt-22" x="322" y="395" font-size="14.5" fill="#24473F" text-anchor="start" font-weight="400" data-role="body">Pool Map / 属性 / 句柄 / 快照记录</text>
<text id="txt-23" x="322" y="422" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">各服务按自己的复制域处理领导权</text>
<text id="txt-24" x="848" y="331" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">服务副本集合</text>
<text id="txt-25" x="848" y="361" font-size="16" fill="#733428" text-anchor="start" font-weight="400" data-role="body">≠ 对象数据副本集合</text>
<text id="txt-26" x="848" y="397" font-size="14.5" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">Raft quorum 不替代对象保护</text>
<text id="txt-27" x="64" y="484" font-size="20" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body">Object</text>
<text id="txt-28" x="64" y="517" font-size="16" fill="#24473F" text-anchor="start" font-weight="400" data-role="body">dkey → akey</text>
<text id="txt-29" x="64" y="550" font-size="14.5" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">epoch / extent / value</text>
<text id="txt-30" x="322" y="466" font-size="17" fill="#24473F" text-anchor="start" font-weight="600" data-role="body">各 target 的 VOS 本地结构</text>
<rect id="vos0" x="322" y="486" width="147" height="92" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text id="txt-31" x="395.5" y="515.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="vos0">target 0</text>
<text id="txt-32" x="395.5" y="538.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="vos0">索引 / 版本</text>
<text id="txt-33" x="395.5" y="561.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="vos0">DTX / ilog</text>
<rect id="vos1" x="485" y="486" width="147" height="92" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text id="txt-34" x="558.5" y="515.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="vos1">target 1</text>
<text id="txt-35" x="558.5" y="538.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="vos1">索引 / 版本</text>
<text id="txt-36" x="558.5" y="561.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="vos1">DTX / ilog</text>
<rect id="vos2" x="648" y="486" width="147" height="92" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text id="txt-37" x="721.5" y="515.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="600" data-role="body" data-owner="vos2">target 2</text>
<text id="txt-38" x="721.5" y="538.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="vos2">索引 / 版本</text>
<text id="txt-39" x="721.5" y="561.45" font-size="15" fill="#24473F" text-anchor="middle" font-weight="400" data-role="body" data-owner="vos2">DTX / ilog</text>
<rect id="ddb" x="848" y="479" width="326" height="94" rx="10" fill="#F1EFE8" stroke="#8B8679" stroke-width="1.3"/>
<text id="txt-40" x="866" y="505" font-size="16" fill="#2B2A26" text-anchor="start" font-weight="600" data-role="body" data-owner="ddb">ddb · DAOS Debug Tool</text>
<text id="txt-41" x="866" y="532" font-size="15" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body" data-owner="ddb">离线 / 一致副本 / 只读起步</text>
<text id="txt-42" x="866" y="558" font-size="14.5" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body" data-owner="ddb">不是复制数据库或业务代理</text>
<path d="M 842 548 H 800" fill="none" stroke="#8B8679" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow-neutral)"/>
<rect id="smd" x="40" y="619" width="1160" height="37" rx="12" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text id="txt-43" x="64" y="644" font-size="14.5" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">SMD：本地设备、执行流与 pool/blob 映射；不是全局对象索引。</text>
<text id="txt-44" x="48" y="682" font-size="14" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">关键：先定位权威状态，再判断持久化、领导权、布局版本和跨服务副作用。</text>
</svg>
