<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">逐跳 QoS 合同：内部编号可不同，处理关系必须闭合</title>
<desc id="desc">下表为允许相应重映射时的教学假设，不是任何厂商的默认配置</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="title">逐跳 QoS 合同：内部编号可不同，处理关系必须闭合</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="title">下表为允许相应重映射时的教学假设，不是任何厂商的默认配置</text>
<rect x="48" y="108" width="1144" height="272" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="69" y="136" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">A · 兼容的逐跳处理：DSCP 相同，不要求本地 Queue ID 相同</text>
<rect x="70" y="150" width="266" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="203.0" y="175.0" font-size="13.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">核对项</text>
<rect x="342" y="150" width="272" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="478.0" y="175.0" font-size="13.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">设备 A / 当前跳</text>
<rect x="620" y="150" width="272" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="756.0" y="175.0" font-size="13.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">设备 B / 当前跳</text>
<rect x="898" y="150" width="272" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1034.0" y="175.0" font-size="13.5" fill="#4A473F" font-weight="700" text-anchor="middle" data-zone="body">设备 C / 当前跳</text>
<rect x="70" y="194" width="1100" height="34" rx="3" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="82" y="217" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">线上业务标记</text>
<text x="354" y="217" font-size="13.5" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">DSCP26 / ECT(0)</text>
<text x="632" y="217" font-size="13.5" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">DSCP26 / CE</text>
<text x="910" y="217" font-size="13.5" fill="#2C4460" font-weight="700" text-anchor="start" data-zone="body">DSCP26 / CE</text>
<text x="82" y="256" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">本地内部类别</text>
<text x="354" y="256" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">3</text>
<text x="632" y="256" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">5</text>
<text x="910" y="256" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">1</text>
<rect x="70" y="272" width="1100" height="34" rx="3" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="82" y="295" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">实际出口队列</text>
<text x="354" y="295" font-size="13.5" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="body">Q3 + ECN</text>
<text x="632" y="295" font-size="13.5" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="body">Q5 + ECN</text>
<text x="910" y="295" font-size="13.5" fill="#2B2A26" font-weight="700" text-anchor="start" data-zone="body">Q1 + ECN</text>
<text x="82" y="334" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">本链路受控 priority</text>
<text x="354" y="334" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">3 → 正确发送资源</text>
<text x="632" y="334" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">3 → 正确发送资源</text>
<text x="910" y="334" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">3 → 正确发送资源</text>
<text x="68" y="414" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start" data-zone="section">B · 三种断点：错误发生在不同映射边界</text>
<rect x="70" y="438" width="347" height="158" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="87" y="463" font-size="14" fill="#733428" font-weight="700" text-anchor="start" data-zone="body">① 匹配了完整 tc8</text>
<text x="89" y="493" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">要求 tc8 = 106</text>
<line x1="374" y1="489" x2="374" y2="513" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)"/>
<text x="89" y="527" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">CE 后变成 107</text>
<line x1="374" y1="523" x2="374" y2="547" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)"/>
<text x="89" y="561" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">下一跳落入默认类</text>
<rect x="447" y="438" width="347" height="158" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="464" y="463" font-size="14" fill="#733428" font-weight="700" text-anchor="start" data-zone="body">② 只改 DSCP 却清 ECN</text>
<text x="466" y="493" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">原字节携带 CE</text>
<line x1="751" y1="489" x2="751" y2="513" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)"/>
<text x="466" y="527" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">整字节被覆盖</text>
<line x1="751" y1="523" x2="751" y2="547" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)"/>
<text x="466" y="561" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">拥塞信息被擦除</text>
<rect x="824" y="438" width="347" height="158" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="841" y="463" font-size="14" fill="#733428" font-weight="700" text-anchor="start" data-zone="body">③ 丢掉了唯一的 PCP 输入</text>
<text x="843" y="493" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">无标签 + 只 trust PCP</text>
<line x1="1128" y1="489" x2="1128" y2="513" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)"/>
<text x="843" y="527" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">按策略使用默认类别</text>
<line x1="1128" y1="523" x2="1128" y2="547" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)"/>
<text x="843" y="561" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-zone="body">数据偏离目标 Queue</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="646" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-zone="footer">先读入口 Trust，再追 PG/Queue/profile；检查出口 Remark 和下一跳解释，覆盖反向及全部候选路径。</text>
</svg>