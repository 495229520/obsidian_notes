<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">一次“写完”，到底完成了哪一层？</title><desc id="desc">左右比较 Posted Write 与 Memory Read，底部列出软件提交、链路确认、事务返回和设备协议完成四层边界。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">一次“写完”，到底完成了哪一层？</text>
<text x="48" y="77" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">Posted Write 没有普通 Completion；链路 ACK 与设备 CQE 都不能冒充它。</text>
<rect x="40" y="106" width="565" height="319" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="134" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · Posted Memory Write</text>
<rect x="635" y="106" width="565" height="319" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="653" y="134" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · Non-Posted Memory Read</text>
<rect x="95" y="154" width="150" height="39" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="170.0" y="178.5" font-size="15" font-weight="600" fill="#4A473F" text-anchor="middle" data-role="body">Requester</text>
<line x1="170" y1="196" x2="170" y2="398" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<rect x="400" y="154" width="150" height="39" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="475.0" y="178.5" font-size="15" font-weight="600" fill="#4A473F" text-anchor="middle" data-role="body">Endpoint</text>
<line x1="475" y1="196" x2="475" y2="398" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<rect x="695" y="154" width="150" height="39" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="770.0" y="178.5" font-size="15" font-weight="600" fill="#4A473F" text-anchor="middle" data-role="body">Requester</text>
<line x1="770" y1="196" x2="770" y2="398" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<rect x="1015" y="154" width="150" height="39" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1090.0" y="178.5" font-size="15" font-weight="600" fill="#4A473F" text-anchor="middle" data-role="body">Completer</text>
<line x1="1090" y1="196" x2="1090" y2="398" stroke="#B5B1A6" stroke-width="1.6" stroke-dasharray="4 5"/>
<line x1="170" y1="225" x2="475" y2="225" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="322.5" y="215" font-size="13" font-weight="500" fill="#3D5A80" text-anchor="middle" data-role="body">MWr · Doorbell</text>
<rect x="80" y="242" width="181" height="43" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="170.5" y="268.5" font-size="15" font-weight="600" fill="#24473F" text-anchor="middle" data-role="body">writel() 返回</text>
<line x1="353" y1="306" x2="170" y2="306" stroke="#8A6A3A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#amber)"/>
<text x="260" y="297" font-size="13" font-weight="500" fill="#8A6A3A" text-anchor="middle" data-role="body">本跳 ACK</text>
<text x="354" y="311" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">链路伙伴</text>
<rect x="375" y="339" width="199" height="46" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="474.5" y="367.0" font-size="15" font-weight="600" fill="#4A473F" text-anchor="middle" data-role="body">设备随后处理</text>
<text x="92" y="403" font-size="14" font-weight="600" fill="#733428" text-anchor="start" data-role="body">没有“MWr → CplD”这条响应链</text>
<line x1="770" y1="225" x2="1090" y2="225" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="930.0" y="215" font-size="13" font-weight="500" fill="#3D5A80" text-anchor="middle" data-role="body">MRd · Tag = 7</text>
<rect x="758" y="238" width="24" height="119" rx="3" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="806" y="250" font-size="12" font-weight="400" fill="#6B4E28" text-anchor="start" data-role="body">在途资源保留</text>
<line x1="1090" y1="293" x2="787" y2="293" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#green)"/>
<text x="938.5" y="283" font-size="13" font-weight="500" fill="#2F6B5E" text-anchor="middle" data-role="body">CplD · 分片 1</text>
<line x1="1090" y1="350" x2="787" y2="350" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#green)"/>
<text x="938.5" y="340" font-size="13" font-weight="500" fill="#2F6B5E" text-anchor="middle" data-role="body">CplD · 最后一片</text>
<text x="686" y="403" font-size="14" font-weight="600" fill="#24473F" text-anchor="start" data-role="body">最后一片到达后，读事务才可收口</text>
<rect x="48" y="458" width="265" height="43" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="180.5" y="484.5" font-size="15" font-weight="600" fill="#2C4460" text-anchor="middle" data-role="body">① 软件提交</text>
<text x="60" y="530" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">CPU 访问接口返回</text>
<text x="60" y="560" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">不代表设备业务已完成</text>
<rect x="341" y="458" width="265" height="43" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="473.5" y="484.5" font-size="15" font-weight="600" fill="#6B4E28" text-anchor="middle" data-role="body">② 链路收妥</text>
<text x="353" y="530" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">邻接端可靠接收</text>
<text x="353" y="560" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">不代表最终端执行完</text>
<rect x="634" y="458" width="265" height="43" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="766.5" y="484.5" font-size="15" font-weight="600" fill="#24473F" text-anchor="middle" data-role="body">③ 事务完成</text>
<text x="646" y="530" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">Non-Posted 收到响应</text>
<text x="646" y="560" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">不代表存储持久化</text>
<rect x="927" y="458" width="265" height="43" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1059.5" y="484.5" font-size="15" font-weight="600" fill="#4A3F68" text-anchor="middle" data-role="body">④ 协议完成</text>
<text x="939" y="530" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">按 CQE / Owner 判断</text>
<text x="939" y="560" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">按上层契约回收资源</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="642" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">读图边界：时序仅表示因果；ACK/Replay 采用传统非 FLIT 链路教学模型。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">Completion TLP ≠ NVMe CQE ≠ 应用消费 ≠ GPU 可见性；详细条件见正文第 3–6 节。</text>
</svg>