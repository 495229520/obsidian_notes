<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">回溯题型分流与剪枝去重</title>
  <desc id="desc">展示回溯算法按子集组合、排列、切割括号、棋盘和网格搜索分流，并说明各自的关键状态、剪枝和去重方法。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#33495c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .small { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4b5b6b; }
      .tiny { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5b6976; }
      .center { fill: #f8e7ae; stroke: #c28a1d; stroke-width: 1.9; rx: 8; }
      .blue { fill: #e6f0f7; stroke: #4d7fa3; stroke-width: 1.7; rx: 8; }
      .green { fill: #d8ead8; stroke: #4f9a68; stroke-width: 1.7; rx: 8; }
      .red { fill: #f4d6cf; stroke: #c65d52; stroke-width: 1.7; rx: 8; }
      .card { fill: #fbfaf4; stroke: #d8cfbf; stroke-width: 1.4; rx: 8; }
      .line { stroke: #33495c; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="470" y="44" text-anchor="middle" class="title">回溯题型：同一框架，不同状态</text>
  <text x="470" y="72" text-anchor="middle" class="small">先判断选择是否可重复、答案记录时机，再决定剪枝和去重方式</text>

  <g transform="translate(360 104)">
    <rect x="0" y="0" width="220" height="76" class="center"/>
    <text x="110" y="28" text-anchor="middle" class="label">回溯三件套</text>
    <text x="110" y="52" text-anchor="middle" class="small">path / choices / end</text>
  </g>

  <g transform="translate(54 224)">
    <rect x="0" y="0" width="234" height="104" class="blue"/>
    <text x="117" y="26" text-anchor="middle" class="label">子集 / 组合</text>
    <text x="117" y="50" text-anchor="middle" class="small">使用 startIndex</text>
    <text x="117" y="72" text-anchor="middle" class="tiny">组合按剩余数量剪枝</text>
    <text x="117" y="92" text-anchor="middle" class="tiny">同层重复值跳过</text>
  </g>

  <g transform="translate(352 224)">
    <rect x="0" y="0" width="234" height="104" class="green"/>
    <text x="117" y="26" text-anchor="middle" class="label">排列</text>
    <text x="117" y="50" text-anchor="middle" class="small">使用 used 数组</text>
    <text x="117" y="72" text-anchor="middle" class="tiny">叶子节点才记录答案</text>
    <text x="117" y="92" text-anchor="middle" class="tiny">排序后做同层去重</text>
  </g>

  <g transform="translate(650 224)">
    <rect x="0" y="0" width="234" height="104" class="red"/>
    <text x="117" y="26" text-anchor="middle" class="label">切割 / 括号</text>
    <text x="117" y="50" text-anchor="middle" class="small">选择一个片段或字符</text>
    <text x="117" y="72" text-anchor="middle" class="tiny">片段不合法直接跳过</text>
    <text x="117" y="92" text-anchor="middle" class="tiny">括号保持前缀合法</text>
  </g>

  <g transform="translate(204 376)">
    <rect x="0" y="0" width="234" height="88" class="card"/>
    <text x="117" y="26" text-anchor="middle" class="label">棋盘类</text>
    <text x="117" y="50" text-anchor="middle" class="small">逐行选择列</text>
    <text x="117" y="72" text-anchor="middle" class="tiny">列与两条对角线剪枝</text>
  </g>

  <g transform="translate(502 376)">
    <rect x="0" y="0" width="234" height="88" class="card"/>
    <text x="117" y="26" text-anchor="middle" class="label">网格搜索</text>
    <text x="117" y="50" text-anchor="middle" class="small">临时标记 visited</text>
    <text x="117" y="72" text-anchor="middle" class="tiny">回溯时恢复格子状态</text>
  </g>

  <path d="M 424 182 C 328 196, 230 206, 174 220" class="line"/>
  <path d="M 470 182 C 470 198, 470 208, 470 220" class="line"/>
  <path d="M 516 182 C 612 196, 710 206, 766 220" class="line"/>
  <path d="M 400 330 C 358 346, 330 356, 322 372" class="line"/>
  <path d="M 540 330 C 582 346, 610 356, 620 372" class="line"/>
</svg>
