<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 890" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A3F68"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="890" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">Admin Queue 与 IO Queue：控制面搭台，数据面唱戏</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">队列 0 由寄存器直接创建——「建队列的命令也需要队列」的自举解；IO 队列由 Admin 命令按核创建，MSI-X 定向回提交核</text>

  <!-- 初始化时间轴 -->
  <text x="48" y="122" font-size="12.5" font-weight="700" fill="#4A473F">控制器初始化（一次性慢路径）</text>

  <rect x="48" y="134" width="132" height="46" rx="6" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="114" y="153" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">PCIe 枚举</text>
  <text x="114" y="170" font-size="10" fill="#733428" text-anchor="middle">映射 BAR0</text>
  <rect x="190" y="134" width="110" height="46" rx="6" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="245" y="153" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">CC.EN=0</text>
  <text x="245" y="170" font-size="10" fill="#733428" text-anchor="middle">控制器复位</text>
  <rect x="310" y="134" width="170" height="46" rx="6" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="395" y="153" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">写 AQA / ASQ / ACQ</text>
  <text x="395" y="170" font-size="10" fill="#733428" text-anchor="middle">建 Admin QP</text>
  <rect x="490" y="134" width="112" height="46" rx="6" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="546" y="153" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">CC.EN=1</text>
  <text x="546" y="170" font-size="10" fill="#733428" text-anchor="middle">等 RDY=1</text>
  <rect x="612" y="134" width="104" height="46" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.3"/>
  <text x="664" y="153" font-size="10.5" font-weight="700" fill="#4A3F68" text-anchor="middle">Identify</text>
  <text x="664" y="170" font-size="10" fill="#4A3F68" text-anchor="middle">控制器 / NS</text>
  <rect x="726" y="134" width="150" height="46" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.3"/>
  <text x="801" y="153" font-size="10.5" font-weight="700" fill="#4A3F68" text-anchor="middle">Set Features</text>
  <text x="801" y="170" font-size="10" fill="#4A3F68" text-anchor="middle">协商队列数</text>
  <rect x="886" y="134" width="176" height="46" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.3"/>
  <text x="974" y="153" font-size="10.5" font-weight="700" fill="#4A3F68" text-anchor="middle">Create IO CQ / SQ</text>
  <text x="974" y="170" font-size="10" fill="#4A3F68" text-anchor="middle">每核一对 ×N</text>
  <rect x="1072" y="134" width="120" height="46" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1132" y="161" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">数据面就绪</text>

  <line x1="180" y1="157" x2="188" y2="157" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="300" y1="157" x2="308" y2="157" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="480" y1="157" x2="488" y2="157" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="602" y1="157" x2="610" y2="157" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="716" y1="157" x2="724" y2="157" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="876" y1="157" x2="884" y2="157" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="1062" y1="157" x2="1070" y2="157" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>

  <polyline points="48,194 48,200 602,200 602,194" fill="none" stroke="#A64B3C" stroke-width="1.1"/>
  <text x="325" y="218" font-size="10.5" fill="#733428" text-anchor="middle">寄存器阶段：还没有任何队列，只能走 MMIO——慢，但一次性</text>
  <polyline points="612,194 612,200 1062,200 1062,194" fill="none" stroke="#4A3F68" stroke-width="1.1"/>
  <text x="837" y="218" font-size="10.5" fill="#4A3F68" text-anchor="middle">Admin 命令阶段：全部走队列 0</text>
  <text x="1132" y="218" font-size="10.5" fill="#24473F" text-anchor="middle">此后是热路径</text>

  <!-- CPU 列 -->
  <rect x="60" y="270" width="150" height="50" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="135" y="299" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">CPU0 · 提交线程</text>
  <rect x="60" y="350" width="150" height="50" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="135" y="379" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">CPU1 · 提交线程</text>
  <rect x="60" y="430" width="150" height="50" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="135" y="459" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">CPU2 · 提交线程</text>
  <rect x="60" y="510" width="150" height="50" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="135" y="539" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">CPU3 · 提交线程</text>

  <!-- IO QP 列 -->
  <rect x="300" y="270" width="250" height="50" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="425" y="291" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">IO SQ1 ＋ IO CQ1</text>
  <text x="425" y="309" font-size="10" fill="#24473F" text-anchor="middle">本核独占：提交无锁</text>
  <rect x="300" y="350" width="250" height="50" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="425" y="371" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">IO SQ2 ＋ IO CQ2</text>
  <text x="425" y="389" font-size="10" fill="#24473F" text-anchor="middle">本核独占：提交无锁</text>
  <rect x="300" y="430" width="250" height="50" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="425" y="451" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">IO SQ3 ＋ IO CQ3</text>
  <text x="425" y="469" font-size="10" fill="#24473F" text-anchor="middle">本核独占：提交无锁</text>
  <rect x="300" y="510" width="250" height="50" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="425" y="531" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">IO SQ4 ＋ IO CQ4</text>
  <text x="425" y="549" font-size="10" fill="#24473F" text-anchor="middle">本核独占：提交无锁</text>

  <line x1="210" y1="295" x2="296" y2="295" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="210" y1="375" x2="296" y2="375" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="210" y1="455" x2="296" y2="455" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="210" y1="535" x2="296" y2="535" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Admin -->
  <rect x="60" y="596" width="190" height="112" rx="8" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="76" y="618" font-size="11.5" font-weight="700" fill="#4A473F">Admin 命令（低频）</text>
  <text x="76" y="640" font-size="10" fill="#4A473F">Identify / Get·Set Features</text>
  <text x="76" y="658" font-size="10" fill="#4A473F">Create·Delete IO SQ/CQ</text>
  <text x="76" y="676" font-size="10" fill="#4A473F">Get Log Page / Abort</text>
  <text x="76" y="694" font-size="10" fill="#4A473F">Format / Firmware</text>

  <rect x="300" y="612" width="250" height="54" rx="7" fill="#EFEDE3" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="425" y="634" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">Admin QP（队列 0）</text>
  <text x="425" y="652" font-size="10" fill="#4A3F68" text-anchor="middle">SQ0 ＋ CQ0：由寄存器创建，深度小</text>

  <line x1="250" y1="644" x2="296" y2="640" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <polyline points="550,639 640,639 640,370 700,370" fill="none" stroke="#4A3F68" stroke-width="1.3" marker-end="url(#arrP)"/>

  <!-- 设备容器 -->
  <rect x="680" y="256" width="512" height="450" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="700" y="282" font-size="13" font-weight="700" fill="#4A473F">NVMe 控制器</text>

  <rect x="704" y="310" width="200" height="74" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="804" y="334" font-size="13" font-weight="700" fill="#4A3F68" text-anchor="middle">仲裁器</text>
  <text x="804" y="354" font-size="10" fill="#4A3F68" text-anchor="middle">RR 轮询各 SQ 取命令</text>
  <text x="804" y="370" font-size="10" fill="#4A3F68" text-anchor="middle">（可选 WRR＋Urgent【取舍】）</text>

  <rect x="704" y="430" width="200" height="60" rx="7" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.4"/>
  <text x="804" y="454" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">MSI-X 向量表</text>
  <text x="804" y="472" font-size="10" fill="#4A3F68" text-anchor="middle">每 CQ 绑一个向量 → 定向核</text>

  <text x="950" y="322" font-size="11.5" font-weight="700" fill="#4A3F68">通道 × 裸片（并行后端）</text>
  <rect x="950"  y="334" width="100" height="44" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.2"/>
  <rect x="1058" y="334" width="100" height="44" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.2"/>
  <rect x="950"  y="386" width="100" height="44" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.2"/>
  <rect x="1058" y="386" width="100" height="44" rx="6" fill="#E7E2EF" stroke="#4A3F68" stroke-width="1.2"/>
  <text x="1000" y="360" font-size="10.5" fill="#4A3F68" text-anchor="middle">通道·裸片</text>
  <text x="1108" y="360" font-size="10.5" fill="#4A3F68" text-anchor="middle">通道·裸片</text>
  <text x="1000" y="412" font-size="10.5" fill="#4A3F68" text-anchor="middle">通道·裸片</text>
  <text x="1108" y="412" font-size="10.5" fill="#4A3F68" text-anchor="middle">通道·裸片</text>
  <text x="950" y="456" font-size="10" fill="#6B675C">吞吐拐点 = 内部并行度（2.3）</text>

  <line x1="904" y1="347" x2="946" y2="352" stroke="#4A3F68" stroke-width="1.4" marker-end="url(#arrP)"/>

  <!-- SQ → 仲裁器 -->
  <line x1="550" y1="295" x2="700" y2="330" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arrP)"/>
  <line x1="550" y1="375" x2="700" y2="344" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arrP)"/>
  <line x1="550" y1="455" x2="700" y2="358" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arrP)"/>
  <line x1="550" y1="535" x2="700" y2="372" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arrP)"/>
  <text x="560" y="268" font-size="10.5" fill="#6B675C">N 条 SQ 并行提交，仲裁器轮询取命令</text>

  <!-- MSI-X 完成中断返回（每行走行间空隙） -->
  <polyline points="680,332 135,332 135,324" fill="none" stroke="#A64B3C" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <polyline points="680,412 135,412 135,404" fill="none" stroke="#A64B3C" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <polyline points="680,492 135,492 135,484" fill="none" stroke="#A64B3C" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <polyline points="680,572 135,572 135,564" fill="none" stroke="#A64B3C" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="560" y="345" font-size="10" fill="#A64B3C">MSI-X：完成中断定向回提交核（cache 热）</text>

  <!-- 底部三张卡 -->
  <rect x="48" y="730" width="368" height="124" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="68" y="756" font-size="12" font-weight="700" fill="#4A473F">控制面：低频、允许慢</text>
  <text x="68" y="780" font-size="10.5" fill="#4A473F">贵操作集中在初始化与运维；寄存器 MMIO</text>
  <text x="68" y="798" font-size="10.5" fill="#4A473F">只在自举阶段大量出现，一次性成本。</text>
  <text x="68" y="816" font-size="10.5" fill="#4A473F">C++ 对应：构造函数做贵的 setup，</text>
  <text x="68" y="834" font-size="10.5" fill="#4A473F">热路径零分配、零锁。</text>

  <rect x="436" y="730" width="368" height="124" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="456" y="756" font-size="12" font-weight="700" fill="#4A473F">数据面：每核一对 QP、无共享</text>
  <text x="456" y="780" font-size="10.5" fill="#4A473F">与 blk-mq 硬件队列 1:1 映射（1.7）；</text>
  <text x="456" y="798" font-size="10.5" fill="#4A473F">提交、执行、完成中断都在本核闭环。</text>
  <text x="456" y="816" font-size="10.5" fill="#4A473F">C++ 对应：per-thread 队列的 sharded</text>
  <text x="456" y="834" font-size="10.5" fill="#4A473F">executor——消灭共享，而不是加锁。</text>

  <rect x="824" y="730" width="368" height="124" rx="10" fill="#EFEDE3" stroke="#C7C2B2" stroke-width="1.2"/>
  <text x="844" y="756" font-size="12" font-weight="700" fill="#4A473F">数量与深度是协商出来的</text>
  <text x="844" y="780" font-size="10.5" fill="#4A473F">队列数 = min(驱动请求, 设备上限)；</text>
  <text x="844" y="798" font-size="10.5" fill="#4A473F">每队列深度上限 = CAP.MQES＋1。</text>
  <text x="844" y="816" font-size="10.5" fill="#4A473F">核多队少 → 多核共享一队：锁与</text>
  <text x="844" y="834" font-size="10.5" fill="#4A473F">跨核中断又回来了【取舍】。</text>
</svg>
