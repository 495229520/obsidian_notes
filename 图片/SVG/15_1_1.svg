<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#4f6f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .subtitle { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .box-title { font: 700 17px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .box-text { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #31465a; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .io { fill: #edf7ed; stroke: #4f8f55; stroke-width: 2.3; rx: 20; }
      .queue { fill: #f0f6ff; stroke: #2f7ab8; stroke-width: 2.2; rx: 20; }
      .worker { fill: #fff8e8; stroke: #d49b38; stroke-width: 2; rx: 18; }
      .db { fill: #fff0f0; stroke: #c96b6b; stroke-width: 2; rx: 18; }
      .note { fill: #fffdf5; stroke: #c6b178; stroke-width: 1.5; rx: 14; }
      .line { stroke: #4f6f8f; stroke-width: 2.2; fill: none; marker-end: url(#arrow-hollow); }
      .soft-line { stroke: #7b8b9b; stroke-width: 1.8; fill: none; marker-end: url(#arrow-hollow); }
    </style>
  </defs>

  <text x="560" y="48" text-anchor="middle" class="title">MySQL 连接池与 DB 线程池架构</text>
  <text x="560" y="76" text-anchor="middle" class="subtitle">EventLoop 只负责网络 I/O，阻塞式 SQL 交给 DB worker，连接池限制数据库并发</text>

  <rect x="70" y="132" width="220" height="110" class="io"/>
  <text x="180" y="166" text-anchor="middle" class="box-title">EventLoop</text>
  <text x="180" y="192" text-anchor="middle" class="box-text">epoll + 协议解析</text>
  <text x="180" y="216" text-anchor="middle" class="small">不能阻塞等待 MySQL</text>

  <rect x="375" y="132" width="250" height="110" class="queue"/>
  <text x="500" y="166" text-anchor="middle" class="box-title">DBTask 有界队列</text>
  <text x="500" y="192" text-anchor="middle" class="box-text">queue_capacity</text>
  <text x="500" y="216" text-anchor="middle" class="small">满了就限流 / 拒绝</text>

  <rect x="720" y="132" width="250" height="110" class="worker"/>
  <text x="845" y="166" text-anchor="middle" class="box-title">DB 线程池</text>
  <text x="845" y="192" text-anchor="middle" class="box-text">固定 worker</text>
  <text x="845" y="216" text-anchor="middle" class="small">执行同步 SQL</text>

  <path d="M 290 187 L 373 187" class="line"/>
  <text x="332" y="171" text-anchor="middle" class="small">提交任务</text>
  <path d="M 625 187 L 718 187" class="line"/>
  <text x="672" y="171" text-anchor="middle" class="small">取任务</text>

  <rect x="255" y="362" width="260" height="124" class="db"/>
  <text x="385" y="398" text-anchor="middle" class="box-title">MySQL 连接池</text>
  <text x="385" y="424" text-anchor="middle" class="box-text">idle / in-use connections</text>
  <text x="385" y="448" text-anchor="middle" class="small">acquire timeout + health check</text>

  <rect x="640" y="362" width="260" height="124" class="db"/>
  <text x="770" y="398" text-anchor="middle" class="box-title">MySQL Server</text>
  <text x="770" y="424" text-anchor="middle" class="box-text">有限 max_connections</text>
  <text x="770" y="448" text-anchor="middle" class="small">慢查询 / 锁等待会放大延迟</text>

  <path d="M 820 242 C 760 300 505 300 430 360" class="soft-line"/>
  <text x="622" y="314" text-anchor="middle" class="small">acquire / release</text>

  <path d="M 515 424 L 638 424" class="line"/>
  <text x="576" y="407" text-anchor="middle" class="small">复用物理连接</text>

  <path d="M 810 362 C 910 300 1040 282 1000 196" class="soft-line"/>
  <text x="1002" y="262" text-anchor="middle" class="small">执行结果</text>

  <path d="M 720 220 C 600 300 258 300 180 244" class="soft-line"/>
  <text x="450" y="306" text-anchor="middle" class="small">结果通过 queueInLoop 回到所属 EventLoop</text>

  <rect x="120" y="548" width="392" height="62" class="note"/>
  <text x="316" y="576" text-anchor="middle" class="box-title">反压边界</text>
  <text x="316" y="598" text-anchor="middle" class="small">DB 队列和连接池都要有上限，不能把过载藏进排队</text>

  <rect x="608" y="548" width="392" height="62" class="note"/>
  <text x="804" y="576" text-anchor="middle" class="box-title">线程边界</text>
  <text x="804" y="598" text-anchor="middle" class="small">DB worker 不直接操作 socket，只把响应投递回 EventLoop</text>
</svg>
