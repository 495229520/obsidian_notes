<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">碰撞预算：单次错误候选，与整个命名空间不是一回事</title><desc id="desc">数学示意：不同输入的摘要近似均匀独立；不是任意 CRC 错误模式或对抗性输入的保证。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">碰撞预算：单次错误候选，与整个命名空间不是一回事</text>
<text x="48" y="80" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">数学示意：不同输入的摘要近似均匀独立；不是任意 CRC 错误模式或对抗性输入的保证。</text>
<rect x="48" y="111" width="552" height="147" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="66" y="140" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">A · 对照一份已知摘要</text>
<text x="72" y="184" font-size="22" fill="#2C4460" font-weight="600" text-anchor="start">一个错误候选：P ≈ 2^(-b)</text>
<text x="72" y="220" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">K 次错误比较：P ≈ K / 2^b（小概率时）</text>
<rect x="625" y="111" width="567" height="147" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="643" y="140" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">B · n 个不同对象中的任意一对</text>
<text x="649" y="182" font-size="22" fill="#24473F" font-weight="600" text-anchor="start">λ = n(n − 1) / 2^(b+1)</text>
<text x="649" y="220" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">P(any collision) ≈ 1 − exp(−λ)</text>
<text x="62" y="301" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">对象数 n</text>
<text x="246" y="301" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">位数</text>
<text x="359" y="301" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">任意碰撞概率</text>
<line x1="58" y1="320" x2="595" y2="320" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="62" y="348" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">10^6</text>
<text x="246" y="348" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">32</text>
<text x="359" y="348" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">约 1</text>
<line x1="58" y1="372" x2="595" y2="372" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="62" y="400" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">10^6</text>
<text x="246" y="400" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">64</text>
<text x="359" y="400" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">2.71 × 10^-8</text>
<line x1="58" y1="424" x2="595" y2="424" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="62" y="452" font-size="15" fill="#733428" font-weight="700" text-anchor="start">10^9</text>
<text x="246" y="452" font-size="15" fill="#733428" font-weight="700" text-anchor="start">64</text>
<text x="359" y="452" font-size="15" fill="#733428" font-weight="700" text-anchor="start">约 2.67%</text>
<line x1="58" y1="476" x2="595" y2="476" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="62" y="504" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">10^9</text>
<text x="246" y="504" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">128</text>
<text x="359" y="504" font-size="15" fill="#2B2A26" font-weight="400" text-anchor="start">1.47 × 10^-21</text>
<text x="64" y="574" font-size="16" fill="#2C4460" font-weight="700" text-anchor="start">K ≠ 所有正常 I/O 次数</text>
<text x="64" y="600" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="start">短指纹可用于筛选，不必承担最终身份判断。</text>
<text x="719" y="290" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">均匀模型：概率随对象数增长</text>
<line x1="721" y1="323.0" x2="1167" y2="323.0" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="709" y="327.0" font-size="11.5" fill="#6B675C" font-weight="400" text-anchor="end">1</text>
<line x1="721" y1="402.66666666666663" x2="1167" y2="402.66666666666663" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="709" y="406.66666666666663" font-size="11.5" fill="#6B675C" font-weight="400" text-anchor="end">10^-12</text>
<line x1="721" y1="482.3333333333333" x2="1167" y2="482.3333333333333" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="709" y="486.3333333333333" font-size="11.5" fill="#6B675C" font-weight="400" text-anchor="end">10^-24</text>
<line x1="721" y1="562.0" x2="1167" y2="562.0" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="709" y="566.0" font-size="11.5" fill="#6B675C" font-weight="400" text-anchor="end">10^-36</text>
<line x1="721.0" y1="323" x2="721.0" y2="562" stroke="#E4E0D6" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="721.0" y="583" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">10^3</text>
<line x1="869.6666666666666" y1="323" x2="869.6666666666666" y2="562" stroke="#E4E0D6" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="869.6666666666666" y="583" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">10^6</text>
<line x1="1018.3333333333333" y1="323" x2="1018.3333333333333" y2="562" stroke="#E4E0D6" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="1018.3333333333333" y="583" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">10^9</text>
<line x1="1167.0" y1="323" x2="1167.0" y2="562" stroke="#E4E0D6" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="1167.0" y="583" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle">10^12</text>
