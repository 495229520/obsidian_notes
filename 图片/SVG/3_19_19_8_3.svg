<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>零拷贝账本：少的是特定 CPU copy，不是全部工作</title><desc>矩阵区分用户内核复制与DMA及剩余CPU工作，下部对比非inline引用与inline复制入WQE。</desc>
<defs>
<marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">零拷贝账本：少的是特定 CPU copy，不是全部工作</text>
<text x="48" y="81" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">限定：主机内存、可用硬件支持；“可避免”不等于每个包、每个后端都保证。</text>
<rect x="56" y="113" width="1128" height="315" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="72" y="138" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">A · 把不同成本分开记账</text>
<text x="78" y="169" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">路径 / 模式</text>
<text x="282" y="169" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">中间 payload copy</text>
<text x="620" y="169" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">NIC DMA</text>
<text x="815" y="169" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">仍然需要的工作</text>
<polyline points="74,183 1165,183" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<rect x="72" y="191" width="1095" height="35" rx="3" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="78" y="212" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">普通 socket</text>
<text x="282" y="212" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">基线通常有 user / kernel copy</text>
<text x="620" y="212" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="start" data-role="body">存在</text>
<text x="815" y="212" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">协议 / 队列 / 用户处理</text>
<text x="78" y="252" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">native XDP</text>
<text x="282" y="252" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">DROP 不向应用交付 payload</text>
<text x="620" y="252" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="start" data-role="body">存在</text>
<text x="815" y="252" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">BPF / 驱动 / action</text>
<rect x="72" y="271" width="1095" height="35" rx="3" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="78" y="292" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">AF_XDP ZC</text>
<text x="282" y="292" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">可避免 driver buffer → UMEM</text>
<text x="620" y="292" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="start" data-role="body">存在</text>
<text x="815" y="292" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">驱动 / rings / 用户处理</text>
<text x="78" y="332" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">DPDK direct</text>
<text x="282" y="332" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">可直接处理 packet buffer</text>
<text x="620" y="332" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="start" data-role="body">存在</text>
<text x="815" y="332" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">PMD / 队列 / 用户协议</text>
<rect x="72" y="351" width="1095" height="35" rx="3" fill="#F1EFE8" stroke="none" stroke-width="1.3"/>
<text x="78" y="372" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">硬件 RDMA</text>
<text x="282" y="372" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">可直接访问已注册 buffer</text>
<text x="620" y="372" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="start" data-role="body">存在</text>
<text x="815" y="372" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">WR / CQ / 注册 / 业务</text>
<rect x="56" y="447" width="1128" height="183" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="72" y="472" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">B · Inline 是一个明确的复制例外：可能用 CPU copy 换提交效率</text>
<text x="82" y="516" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">非 inline</text>
<rect x="225" y="490" width="230" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="340.0" y="514.0" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">应用 buffer</text>
<rect x="619" y="490" width="205" height="40" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="721.5" y="514.0" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">WQE：地址 / 长度</text>
<rect x="986" y="490" width="168" height="40" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1070.0" y="514.0" font-size="13" fill="#4A3F68" font-weight="700" text-anchor="middle" data-role="body">NIC</text>
<polyline points="457,510 615,510" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)" stroke-dasharray="5 4"/>
<text x="535" y="502" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">引用</text>
<polyline points="828,510 982,510" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text x="905" y="502" font-size="12" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">获取 WQE</text>
<polyline points="455,532 455,550 1068,550 1068,534" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text x="746" y="542" font-size="12" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">NIC 读取 payload</text>
<text x="82" y="600" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">inline</text>
<rect x="225" y="574" width="230" height="40" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="340.0" y="598.0" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">应用 buffer</text>
<rect x="619" y="574" width="205" height="40" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="721.5" y="598.0" font-size="13" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body">WQE：内嵌 payload</text>
<rect x="986" y="574" width="168" height="40" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1070.0" y="598.0" font-size="13" fill="#4A3F68" font-weight="700" text-anchor="middle" data-role="body">NIC</text>
<polyline points="459,594 615,594" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="535" y="586" font-size="12" fill="#6B4E28" font-weight="400" text-anchor="middle" data-role="body">CPU copy</text>
<polyline points="828,594 982,594" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text x="905" y="586" font-size="12" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">获取 WQE</text>
<text x="48" y="673" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">另记：序列化、TLS、重组、应用 buffer 转换、空轮询、跨 NUMA；没有 memcpy 也不等于没有 CPU 成本。</text>
</svg>