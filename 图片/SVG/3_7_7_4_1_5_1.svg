<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>RDMA Verbs 与 CQ 非阻塞 RPC</title>
  <desc>展示 RC SEND/RECV 方案中预贴接收、注册内存、工作请求、完成队列和 request_id 的关系。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect width="1240" height="700" fill="#F5F4ED"/>
  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">RDMA Verbs/CQ 非阻塞 RPC：先预贴缓冲，再由 WC 推进</text>
  <text x="48" y="82" font-size="13.5" fill="#6B675C">基线采用 RC SEND/RECV：消息边界由一对 WR 保留，业务关联仍由 14 B 帧头的 request_id 完成</text>

  <!-- identity cards -->
  <rect x="760" y="34" width="192" height="54" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="856" y="55" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">wr_id = local token</text>
  <text x="856" y="75" font-size="10.5" fill="#4A3F68" text-anchor="middle">WR ↔ WC · 不上网</text>
  <rect x="968" y="34" width="216" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1076" y="55" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">request_id = 42</text>
  <text x="1076" y="75" font-size="10.5" fill="#24473F" text-anchor="middle">Request ↔ Response · 上网</text>

  <!-- side panels -->
  <rect x="56" y="112" width="482" height="428" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="76" y="138" font-size="15" font-weight="700" fill="#3D5A80">客户端</text>
  <rect x="702" y="112" width="482" height="428" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="722" y="138" font-size="15" font-weight="700" fill="#A64B3C">服务端</text>

  <!-- fabric -->
  <rect x="566" y="156" width="108" height="334" rx="12" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
  <text x="620" y="181" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">RNIC</text>
  <text x="620" y="199" font-size="10.5" fill="#6B675C" text-anchor="middle">RC QP</text>
  <line x1="620" y1="222" x2="620" y2="456" stroke="#C7C3B8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="620" y="338" font-size="11" fill="#6B675C" text-anchor="middle" transform="rotate(-90 620 338)">可靠有序传输</text>

  <!-- client blocks -->
  <rect x="76" y="156" width="210" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="181" y="178" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">pending[42]</text>
  <text x="181" y="198" font-size="10.5" fill="#2C4460" text-anchor="middle">continuation + deadline</text>
  <text x="181" y="214" font-size="10.2" fill="#2C4460" text-anchor="middle">等待 Response，不等 Send WC</text>

  <rect x="308" y="156" width="210" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="413" y="178" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">① Encode Request</text>
  <text x="413" y="198" font-size="10.5" fill="#2C4460" text-anchor="middle">22 B · id=42 · Add(3,4)</text>
  <text x="413" y="214" font-size="10.2" fill="#2C4460" text-anchor="middle">写入注册 SendSlot</text>

  <rect x="76" y="244" width="210" height="66" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="181" y="266" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">注册 RecvSlot 池</text>
  <text x="181" y="286" font-size="10.5" fill="#4A3F68" text-anchor="middle">MR + lkey · 固定地址</text>
  <text x="181" y="303" font-size="10.2" fill="#4A3F68" text-anchor="middle">持续 ibv_post_recv</text>

  <rect x="308" y="244" width="210" height="66" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="413" y="266" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">② ibv_post_send</text>
  <text x="413" y="286" font-size="10.5" fill="#4A3F68" text-anchor="middle">wr_id = SendReq token</text>
  <text x="413" y="303" font-size="10.2" fill="#4A3F68" text-anchor="middle">SGE → SendSlot</text>

  <rect x="76" y="334" width="210" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="181" y="356" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">客户端 CQ</text>
  <text x="181" y="376" font-size="10.5" fill="#24473F" text-anchor="middle">Send WC：槽位可复用</text>
  <text x="181" y="393" font-size="10.2" fill="#24473F" text-anchor="middle">Receive WC：响应已到达</text>

  <rect x="308" y="334" width="210" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="413" y="356" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">⑦ Parse Response</text>
  <text x="413" y="376" font-size="10.5" fill="#24473F" text-anchor="middle">WC.byte_len → Frame</text>
  <text x="413" y="393" font-size="10.2" fill="#24473F" text-anchor="middle">id=42 → resume pending</text>

  <rect x="76" y="428" width="442" height="82" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="96" y="451" font-size="11.5" font-weight="700" fill="#4A473F">客户端接收补给</text>
  <text x="96" y="472" font-size="10.5" fill="#4A473F">每消费一个 Receive WC：校验 → 解析 → 清空 → 重新 post</text>
  <text x="96" y="492" font-size="10.5" fill="#A64B3C">远端 credit 为 0 时停止发新请求，避免 RNR 与资源挤爆</text>

  <!-- server blocks -->
  <rect x="722" y="156" width="210" height="64" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="827" y="178" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">③ Receive WC</text>
  <text x="827" y="198" font-size="10.5" fill="#733428" text-anchor="middle">opcode=RECV · 22 B</text>
  <text x="827" y="214" font-size="10.2" fill="#733428" text-anchor="middle">对应已预贴 RecvSlot</text>

  <rect x="954" y="156" width="210" height="64" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1059" y="178" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">④ Dispatch Add</text>
  <text x="1059" y="198" font-size="10.5" fill="#733428" text-anchor="middle">Decode a=3, b=4</text>
  <text x="1059" y="214" font-size="10.2" fill="#733428" text-anchor="middle">结果 sum=7</text>

  <rect x="722" y="244" width="210" height="66" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="827" y="266" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">服务端 RecvSlot 池</text>
  <text x="827" y="286" font-size="10.5" fill="#4A3F68" text-anchor="middle">启动时预贴 N 个 WR</text>
  <text x="827" y="303" font-size="10.2" fill="#4A3F68" text-anchor="middle">消费后立即补回</text>

  <rect x="954" y="244" width="210" height="66" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="1059" y="266" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">⑤ Encode + post_send</text>
  <text x="1059" y="286" font-size="10.5" fill="#4A3F68" text-anchor="middle">18 B Response · id=42</text>
  <text x="1059" y="303" font-size="10.2" fill="#4A3F68" text-anchor="middle">wr_id = SendResp token</text>

  <rect x="722" y="334" width="210" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="827" y="356" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">服务端 CQ</text>
  <text x="827" y="376" font-size="10.5" fill="#24473F" text-anchor="middle">poll 或 notify + poll</text>
  <text x="827" y="393" font-size="10.2" fill="#24473F" text-anchor="middle">批量 drain WC</text>

  <rect x="954" y="334" width="210" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1059" y="356" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">⑥ Send WC</text>
  <text x="1059" y="376" font-size="10.5" fill="#24473F" text-anchor="middle">响应 SendSlot 可回收</text>
  <text x="1059" y="393" font-size="10.2" fill="#24473F" text-anchor="middle">不是客户端 RPC 成功</text>

  <rect x="722" y="428" width="442" height="82" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
  <text x="742" y="451" font-size="11.5" font-weight="700" fill="#4A473F">服务端接收不变量</text>
  <text x="742" y="472" font-size="10.5" fill="#4A473F">RQ 必须先有 Receive WR，发送端才能安全投递消息</text>
  <text x="742" y="492" font-size="10.5" fill="#A64B3C">CQ overrun / QP error：连接级失败，唤醒全部 pending</text>

  <!-- cross-fabric request and response arrows -->
  <path d="M518 278 L566 278 L674 278 L718 188" fill="none" stroke="#3D5A80" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <text x="620" y="264" font-size="10.8" font-weight="700" fill="#3D5A80" text-anchor="middle">Request SEND · 22 B</text>
  <path d="M954 278 L674 420 L566 420 L518 369" fill="none" stroke="#A64B3C" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <text x="620" y="438" font-size="10.8" font-weight="700" fill="#A64B3C" text-anchor="middle">Response SEND · 18 B</text>

  <!-- local arrows -->
  <line x1="286" y1="188" x2="304" y2="188" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="413" y1="224" x2="413" y2="240" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M286 369 L304 369" fill="none" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arrGreen)"/>
  <path d="M413 330 L413 314" fill="none" stroke="#5A564B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="932" y1="188" x2="950" y2="188" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1059" y1="224" x2="1059" y2="240" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="932" y1="369" x2="950" y2="369" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M827 330 L827 314" fill="none" stroke="#5A564B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- bottom summary -->
  <text x="56" y="576" font-size="14.5" font-weight="700" fill="#2B2A26">三层完成语义不能混用</text>
  <rect x="56" y="594" width="352" height="70" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="76" y="618" font-size="12" font-weight="700" fill="#6B5B95">Send WC</text>
  <text x="76" y="640" font-size="10.8" fill="#4A473F">本地 NIC 已消费发送描述符</text>
  <text x="76" y="657" font-size="10.8" fill="#4A473F">只允许回收本地 SendSlot</text>

  <rect x="430" y="594" width="352" height="70" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="450" y="618" font-size="12" font-weight="700" fill="#2F6B5E">Receive WC + 完整 Frame</text>
  <text x="450" y="640" font-size="10.8" fill="#4A473F">一条远端消息已经到达并可解析</text>
  <text x="450" y="657" font-size="10.8" fill="#4A473F">仍需检查 type、id、status</text>

  <rect x="804" y="594" width="380" height="70" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="824" y="618" font-size="12" font-weight="700" fill="#A64B3C">Response(status=OK)</text>
  <text x="824" y="640" font-size="10.8" fill="#4A473F">客户端才可完成本次 RPC</text>
  <text x="824" y="657" font-size="10.8" fill="#4A473F">超时仍不等于服务端未执行</text>
</svg>
