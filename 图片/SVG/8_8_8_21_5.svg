<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">计时之前，先画清楚结束点等待了谁</title><desc id="desc">8.21 · 图 5　host 提交、GPU 通信和完整窗口是三种测量，不可相互替代。原创教学图，非实测数据。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="red-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">计时之前，先画清楚结束点等待了谁</text>
<text x="48" y="78" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">8.21 · 图 5　host 提交、GPU 通信和完整窗口是三种测量，不可相互替代</text>
<rect x="48" y="110" width="1144" height="85" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="136" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">CPU 时钟</text>
<rect x="243" y="133" width="213" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="349.5" y="158.9" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">ncclAllReduce()</text>
<rect x="488" y="133" width="245" height="42" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="610.5" y="158.9" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">API 已返回</text>
<rect x="767" y="133" width="396" height="42" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="965.0" y="159.0" font-size="13" font-weight="400" fill="#4A473F" text-anchor="middle">cudaEventSynchronize(stop)</text>
<rect x="48" y="223" width="1144" height="105" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="249" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">Comm stream</text>
<rect x="242" y="253" width="122" height="43" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="303.0" y="279.4" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">start event</text>
<rect x="389" y="253" width="620" height="43" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="699.0" y="279.4" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">通信 kernel · 可能含等待对端</text>
<rect x="1035" y="253" width="128" height="43" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1099.0" y="279.4" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">stop event</text>
<polyline points="368,275 385,275" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="1014,275 1030,275" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="1098,251 1098,199 1098,178" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="48" y="355" width="1144" height="100" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="381" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">Compute stream</text>
<rect x="243" y="386" width="301" height="43" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="393.5" y="412.4" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">独立计算</text>
<rect x="560" y="386" width="188" height="43" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="654.0" y="412.4" font-size="14" font-weight="700" fill="#733428" text-anchor="middle">错误结束点</text>
<rect x="765" y="386" width="245" height="43" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="887.5" y="412.5" font-size="13" font-weight="400" fill="#4A473F" text-anchor="middle">等待通信完成</text>
<rect x="1035" y="386" width="128" height="43" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1099.0" y="412.4" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">消费 / 尾部</text>
<polyline points="1000,297 1000,353 887,353 887,382" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="48" y="482" width="1144" height="109" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="510" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">完整工作窗口：各 rank 完成相关设备工作后，再比较窗口耗时</text>
<text x="72" y="551" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">rank0：先到，等待 peer</text>
<text x="452" y="551" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">rank1：晚到，拖长共同完成点</text>
<text x="917" y="551" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">报告：范围 + 聚合口径</text>
<line x1="48" y1="606" x2="1192" y2="606" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="48" y="626" font-size="13" font-weight="400" fill="#4A473F" text-anchor="start">stop 与 NCCL 必须在正确的依赖链上；只测 CPU API 或未汇合的 compute 尾部会漏计。</text>
<text x="48" y="649" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start">图中宽度只表达先后关系，不是延迟测量。通信 kernel 时长不等于纯链路线速传输时间。</text>
</svg>