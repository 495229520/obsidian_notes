<text x="1095" y="301" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end" class="mono">__syncthreads()</text>
<text x="120" y="349" font-size="15" font-weight="800" fill="#334155" text-anchor="start">stride=32</text>
<rect x="245" y="329" width="102.5" height="28" rx="8" fill="#059669" stroke="#CBD5E1" stroke-width="0" opacity="1"/>
<rect x="347.5" y="329" width="717.5" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
