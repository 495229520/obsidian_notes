<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Shared Memory 活跃线程时间线</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">11 Shared Reduce：256 线程 block 的活跃度与 barrier</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“11.7 线程活跃度与 Warp Divergence”后</text>
<rect x="85" y="145" width="1080" height="470" rx="20" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="120" y="205" font-size="15" font-weight="800" fill="#334155" text-anchor="start">load</text>
<rect x="245" y="185" width="820.0" height="28" rx="8" fill="#2563EB" stroke="#CBD5E1" stroke-width="0" opacity="1"/>
<rect x="1065.0" y="185" width="0.0" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="1055.0" y="205" font-size="13" font-weight="800" fill="white" text-anchor="end">256 active</text>
<text x="120" y="253" font-size="15" font-weight="800" fill="#334155" text-anchor="start">stride=128</text>
<rect x="245" y="233" width="410.0" height="28" rx="8" fill="#059669" stroke="#CBD5E1" stroke-width="0" opacity="1"/>
<rect x="655.0" y="233" width="410.0" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="645.0" y="253" font-size="13" font-weight="800" fill="white" text-anchor="end">128 active</text>
<text x="1095" y="253" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end" class="mono">__syncthreads()</text>
<text x="120" y="301" font-size="15" font-weight="800" fill="#334155" text-anchor="start">stride=64</text>
<rect x="245" y="281" width="205.0" height="28" rx="8" fill="#059669" stroke="#CBD5E1" stroke-width="0" opacity="1"/>
<rect x="450.0" y="281" width="615.0" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
