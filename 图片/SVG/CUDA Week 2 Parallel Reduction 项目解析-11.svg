<text x="1095" y="349" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end" class="mono">__syncthreads()</text>
<text x="120" y="397" font-size="15" font-weight="800" fill="#334155" text-anchor="start">stride=16</text>
<rect x="245" y="377" width="51.25" height="28" rx="8" fill="#F59E0B" stroke="#CBD5E1" stroke-width="0" opacity="1"/>
<rect x="296.25" y="377" width="768.75" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="306.25" y="397" font-size="13" font-weight="800" fill="#F59E0B" text-anchor="start">16 active</text>
<text x="1095" y="397" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end" class="mono">__syncthreads()</text>
<text x="120" y="445" font-size="15" font-weight="800" fill="#334155" text-anchor="start">stride=8</text>
<rect x="245" y="425" width="25.625" height="28" rx="8" fill="#F59E0B" stroke="#CBD5E1" stroke-width="0" opacity="1"/>
<rect x="270.625" y="425" width="794.375" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="280.625" y="445" font-size="13" font-weight="800" fill="#F59E0B" text-anchor="start">8 active</text>
<text x="1095" y="445" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end" class="mono">__syncthreads()</text>
<text x="120" y="493" font-size="15" font-weight="800" fill="#334155" text-anchor="start">stride=4</text>
<rect x="245" y="473" width="12.8125" height="28" rx="8" fill="#F59E0B" stroke="#CBD5E1" stroke-width="0" opacity="1"/>
<rect x="257.8125" y="473" width="807.1875" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="267.8125" y="493" font-size="13" font-weight="800" fill="#F59E0B" text-anchor="start">4 active</text>
<text x="1095" y="493" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end" class="mono">__syncthreads()</text>
<text x="120" y="541" font-size="15" font-weight="800" fill="#334155" text-anchor="start">stride=2</text>
<rect x="245" y="521" width="6.40625" height="28" rx="8" fill="#DC2626" stroke="#CBD5E1" stroke-width="0" opacity="1"/>
<rect x="251.40625" y="521" width="813.59375" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="261.40625" y="541" font-size="13" font-weight="800" fill="#DC2626" text-anchor="start">2 active</text>
<text x="1095" y="541" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end" class="mono">__syncthreads()</text>
<text x="120" y="589" font-size="15" font-weight="800" fill="#334155" text-anchor="start">stride=1</text>
<rect x="245" y="569" width="6" height="28" rx="8" fill="#DC2626" stroke="#CBD5E1" stroke-width="0" opacity="1"/>
<rect x="251" y="569" width="814" height="28" rx="8" fill="#E2E8F0" opacity="1"/>
<text x="261" y="589" font-size="13" font-weight="800" fill="#DC2626" text-anchor="start">1 active</text>
<text x="1095" y="589" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end" class="mono">__syncthreads()</text>
<line x1="245" y1="640" x2="1065" y2="640" stroke="#334155" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="655" y="667" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle">时间 / 归约轮次</text>
<rect x="465" y="92" width="420" height="34" rx="17.0" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" opacity="1"/>
<text x="675.0" y="114.0" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">前 3 轮 warp 全活跃；stride&lt;32 后 warp0 内部出现 divergence</text>
</svg>
