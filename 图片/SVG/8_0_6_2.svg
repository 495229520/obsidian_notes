<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>中断路径与上下文切换：三者不是同一件事</title>
  <desc>上半：中断完成路径泳道（设备→硬中断→延后处理→唤醒→调度）。中部：中断 / 内核态切换 / 上下文切换三者区分。下半：上下文切换直接成本与间接缓存成本。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">中断路径：硬中断短、延后处理、批量化；≠ 必然 context switch</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">中断发生 · 用户/内核态切换 · 上下文切换 是三件不同的事 · 一次中断可能返回原任务，也可能唤醒另一线程</text>

  <!-- ============ A: 中断完成路径泳道 ============ -->
  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">A · 中断完成路径泳道：设备完成后的软件开销链</text>

  <!-- Lanes -->
  <rect x="48" y="128" width="1144" height="88" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="64" y="150" font-size="11.5" font-weight="700" fill="#3D5A80">用户态 · 等待线程</text>

  <rect x="48" y="224" width="1144" height="88" rx="8" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1"/>
  <text x="64" y="246" font-size="11.5" font-weight="700" fill="#2F6B5E">内核 · 中断 / softirq / 调度</text>

  <rect x="48" y="320" width="1144" height="88" rx="8" fill="#F4E9E4" stroke="#D8D5C8" stroke-width="1"/>
  <text x="64" y="342" font-size="11.5" font-weight="700" fill="#A64B3C">硬件 · 设备 + MSI-X</text>

  <!-- User steps -->
  <rect x="200" y="158" width="160" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="280" y="176" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 提交后阻塞</text>
  <text x="280" y="192" font-size="10" fill="#3D5A80" text-anchor="middle">睡眠 · 让出 CPU</text>

  <rect x="900" y="158" width="180" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="990" y="176" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">⑥ 再次运行</text>
  <text x="990" y="192" font-size="10" fill="#3D5A80" text-anchor="middle">处理完成结果</text>

  <rect x="400" y="166" width="460" height="28" rx="6" fill="#ECEAE0" stroke="#8A8574" stroke-width="1.1" stroke-dasharray="5 3"/>
  <text x="630" y="185" font-size="11" fill="#4A473F" text-anchor="middle">睡眠窗口 · 可能发生 1–2 次 context switch（自愿 + 被唤醒后调度）</text>

  <!-- Kernel steps -->
  <rect x="360" y="254" width="150" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="435" y="272" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">③ 硬中断入口</text>
  <text x="435" y="288" font-size="10" fill="#2F6B5E" text-anchor="middle">确认 + 抑制重复</text>

  <rect x="540" y="254" width="170" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="625" y="272" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">④ 延后批量处理</text>
  <text x="625" y="288" font-size="10" fill="#2F6B5E" text-anchor="middle">softirq / 工作队列</text>

  <rect x="740" y="254" width="170" height="42" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="825" y="272" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">⑤ 唤醒 + 调度</text>
  <text x="825" y="288" font-size="10" fill="#8A6A3A" text-anchor="middle">标记 runnable · 选核</text>

  <!-- Device steps -->
  <rect x="200" y="350" width="160" height="42" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="280" y="368" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">② DMA 写 CQE</text>
  <text x="280" y="384" font-size="10" fill="#A64B3C" text-anchor="middle">数据 + 完成项</text>

  <rect x="400" y="350" width="160" height="42" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="480" y="368" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">发 MSI-X 中断</text>
  <text x="480" y="384" font-size="10" fill="#A64B3C" text-anchor="middle">可合并 coalescing</text>

  <!-- Arrows -->
  <path d="M280,202 L280,346" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>
  <path d="M360,371 L396,371" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>
  <path d="M480,348 L480,300" fill="none" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arrr)"/>
  <path d="M510,275 L536,275" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>
  <path d="M710,275 L736,275" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>
  <path d="M825,252 L825,204" fill="none" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arra)"/>
  <path d="M910,179 L896,179" fill="none" stroke="#5A564B" stroke-width="1.4"/>

  <!-- ============ B: 三者区分 ============ -->
  <text x="48" y="444" font-size="13" font-weight="700" fill="#4A473F">B · 不要混为一谈：中断 · 特权级切换 · 上下文切换</text>

  <rect x="48" y="458" width="370" height="150" rx="8" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="68" y="486" font-size="13" font-weight="700" fill="#733428">① 中断发生</text>
  <text x="68" y="512" font-size="12" fill="#4A473F">CPU 暂停当前指令流</text>
  <text x="68" y="534" font-size="12" fill="#4A473F">转入中断处理入口</text>
  <text x="68" y="556" font-size="12" fill="#4A473F">硬中断上下文必须尽量短</text>
  <text x="68" y="586" font-size="11" fill="#A64B3C">≠ 换了另一个线程</text>

  <rect x="434" y="458" width="370" height="150" rx="8" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="454" y="486" font-size="13" font-weight="700" fill="#2C4460">② 用户态 / 内核态切换</text>
  <text x="454" y="512" font-size="12" fill="#4A473F">特权级与执行路径变化</text>
  <text x="454" y="534" font-size="12" fill="#4A473F">syscall / 中断 / 异常都可能</text>
  <text x="454" y="556" font-size="12" fill="#4A473F">仍可能回到同一线程</text>
  <text x="454" y="586" font-size="11" fill="#3D5A80">≠ 调度器换了执行者</text>

  <rect x="820" y="458" width="372" height="150" rx="8" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="840" y="486" font-size="13" font-weight="700" fill="#6B4E28">③ 上下文切换</text>
  <text x="840" y="512" font-size="12" fill="#4A473F">调度器换可调度实体</text>
  <text x="840" y="534" font-size="12" fill="#4A473F">保存旧任务 · 恢复新任务</text>
  <text x="840" y="556" font-size="12" fill="#4A473F">PC / 栈 / 寄存器 / 调度状态</text>
  <text x="840" y="586" font-size="11" fill="#8A6A3A">自愿（阻塞）或非自愿（抢占）</text>

  <!-- ============ C: 成本结构 ============ -->
  <text x="48" y="646" font-size="13" font-weight="700" fill="#4A473F">C · Context Switch 成本：直接调度 + 间接缓存冷启动（后者常更重）</text>

  <rect x="48" y="660" width="560" height="200" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="688" font-size="12.5" font-weight="700" fill="#2C4460">直接成本（调度路径本身）</text>

  <rect x="68" y="708" width="100" height="56" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="118" y="732" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">进内核</text>
  <text x="118" y="750" font-size="10" fill="#3D5A80" text-anchor="middle">调度入口</text>

  <path d="M172,736 L192,736" fill="none" stroke="#5A564B" stroke-width="1.3" marker-end="url(#arrn)"/>

  <rect x="196" y="708" width="100" height="56" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="246" y="732" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">保存现场</text>
  <text x="246" y="750" font-size="10" fill="#3D5A80" text-anchor="middle">旧任务状态</text>

  <path d="M300,736 L320,736" fill="none" stroke="#5A564B" stroke-width="1.3" marker-end="url(#arrn)"/>

  <rect x="324" y="708" width="100" height="56" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="374" y="732" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">选下一个</text>
  <text x="374" y="750" font-size="10" fill="#3D5A80" text-anchor="middle">调度器决策</text>

  <path d="M428,736 L448,736" fill="none" stroke="#5A564B" stroke-width="1.3" marker-end="url(#arrn)"/>

  <rect x="452" y="708" width="130" height="56" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="517" y="732" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">恢复 + 返回</text>
  <text x="517" y="750" font-size="10" fill="#3D5A80" text-anchor="middle">新任务继续</text>

  <text x="68" y="800" font-size="11" fill="#6B675C">不要背诵「一次切换 = N 纳秒」：微架构、地址空间、工作集、migration、虚拟化都会改数字</text>
  <text x="68" y="840" font-size="11.5" fill="#4A473F">目标机器 + 目标负载 + 绑核策略下实测 · 同时看 cache / migration / p99</text>

  <rect x="632" y="660" width="560" height="200" rx="8" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="652" y="688" font-size="12.5" font-weight="700" fill="#733428">间接成本（工作集变冷 · 往往主导）</text>

  <!-- Cache hierarchy simulation -->
  <rect x="652" y="708" width="90" height="40" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="697" y="733" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">L1 I/D</text>
  <rect x="758" y="708" width="90" height="40" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="803" y="733" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">L2</text>
  <rect x="864" y="708" width="90" height="40" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="909" y="733" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">LLC</text>
  <rect x="970" y="708" width="90" height="40" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="1015" y="733" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">TLB</text>
  <rect x="1076" y="708" width="90" height="40" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="1121" y="733" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">分支预测</text>

  <text x="652" y="776" font-size="11.5" fill="#733428">切换后新任务工作集未必仍热 · miss 上升</text>
  <text x="652" y="800" font-size="11.5" fill="#733428">跨 CPU migration → 更明显的冷启动</text>
  <text x="652" y="824" font-size="11.5" fill="#733428">共享队列 / 锁的 cache line 在核间乒乓</text>
  <text x="652" y="848" font-size="11" fill="#6B675C">所以「测一次切换」≠「对真实数据路径的全部影响」</text>

  <!-- bottom bar -->
  <rect x="48" y="880" width="1144" height="40" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.1"/>
  <text x="68" y="906" font-size="12" fill="#4A473F">中断等待模型常伴随「睡眠 → 唤醒 → 再调度」· 忙轮询用固定线程持续运行，减少这类切换（但未消灭全部干扰）</text>
</svg>
