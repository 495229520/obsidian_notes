<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 524" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <title>dup2 文件描述符重定向的前后对比</title>
  <desc>左图为重定向前 fd 表，右图为 dup2(3,1) 之后 fd 1 改指 file.txt 并与 fd 3 共享同一打开文件。</desc>

  <rect x="0" y="0" width="1240" height="524" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">dup2 重定向：把 fd 表项改指到同一个打开文件</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">dup2(oldfd, newfd)：先关闭 newfd，再让它复制 oldfd —— 之后两个 fd 指向同一打开文件，共享偏移量与状态标志</text>

  <!-- Panel A -->
  <rect x="48" y="104" width="520" height="330" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="14" font-weight="700" fill="#4A473F">A · 重定向前</text>
  <text x="150" y="164" font-size="12" font-weight="700" fill="#6B675C" text-anchor="middle">进程 fd 表</text>

  <!-- fd table A -->
  <rect x="72" y="180" width="156" height="200" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="118" y1="180" x2="118" y2="380" stroke="#9B968A" stroke-width="1"/>
  <line x1="72" y1="230" x2="228" y2="230" stroke="#9B968A" stroke-width="1"/>
  <line x1="72" y1="280" x2="228" y2="280" stroke="#9B968A" stroke-width="1"/>
  <line x1="72" y1="330" x2="228" y2="330" stroke="#9B968A" stroke-width="1"/>
  <text x="95" y="211" font-size="16" font-weight="700" fill="#4A473F" text-anchor="middle">0</text>
  <text x="132" y="210" font-size="10.5" fill="#6B675C">STDIN</text>
  <text x="95" y="261" font-size="16" font-weight="700" fill="#4A473F" text-anchor="middle">1</text>
  <text x="132" y="260" font-size="10.5" fill="#6B675C">STDOUT</text>
  <text x="95" y="311" font-size="16" font-weight="700" fill="#4A473F" text-anchor="middle">2</text>
  <text x="132" y="310" font-size="10.5" fill="#6B675C">STDERR</text>
  <text x="95" y="361" font-size="16" font-weight="700" fill="#4A473F" text-anchor="middle">3</text>
  <text x="132" y="360" font-size="10.5" fill="#6B675C">open</text>

  <!-- targets A -->
  <rect x="340" y="183" width="188" height="44" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="434" y="210" font-size="11.5" fill="#4A473F" text-anchor="middle">标准输入设备</text>
  <rect x="340" y="233" width="188" height="44" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="434" y="260" font-size="11.5" fill="#2C4460" text-anchor="middle">终端 tty</text>
  <rect x="340" y="283" width="188" height="44" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="434" y="310" font-size="11.5" fill="#4A473F" text-anchor="middle">标准错误 (终端)</text>
  <rect x="340" y="333" width="188" height="44" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="434" y="360" font-size="12" font-weight="700" fill="#7A5518" text-anchor="middle">file.txt</text>

  <line x1="230" y1="205" x2="336" y2="205" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="230" y1="255" x2="336" y2="255" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="230" y1="305" x2="336" y2="305" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="230" y1="355" x2="336" y2="355" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="300" y="414" font-size="11" fill="#6B675C" text-anchor="middle">初始：每个 fd 指向各自的目标</text>

  <!-- center transform -->
  <text x="620" y="256" font-size="13" font-weight="700" fill="#A64B3C" text-anchor="middle">dup2(3, 1)</text>
  <line x1="576" y1="272" x2="664" y2="272" stroke="#A64B3C" stroke-width="2.4" marker-end="url(#arrRed)"/>
  <text x="620" y="296" font-size="9.5" fill="#8A6A3A" text-anchor="middle">复制 fd 3 → fd 1</text>

  <!-- Panel B -->
  <rect x="672" y="104" width="520" height="330" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="696" y="132" font-size="14" font-weight="700" fill="#4A473F">B · dup2(3, 1) 之后</text>
  <text x="774" y="164" font-size="12" font-weight="700" fill="#6B675C" text-anchor="middle">进程 fd 表</text>

  <!-- fd table B -->
  <rect x="696" y="180" width="156" height="200" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <rect x="697" y="231" width="154" height="48" fill="#F9EFD8"/>
  <line x1="742" y1="180" x2="742" y2="380" stroke="#9B968A" stroke-width="1"/>
  <line x1="696" y1="230" x2="852" y2="230" stroke="#9B968A" stroke-width="1"/>
  <line x1="696" y1="280" x2="852" y2="280" stroke="#9B968A" stroke-width="1"/>
  <line x1="696" y1="330" x2="852" y2="330" stroke="#9B968A" stroke-width="1"/>
  <text x="719" y="211" font-size="16" font-weight="700" fill="#4A473F" text-anchor="middle">0</text>
  <text x="756" y="210" font-size="10.5" fill="#6B675C">STDIN</text>
  <text x="719" y="261" font-size="16" font-weight="700" fill="#B07D2B" text-anchor="middle">1</text>
  <text x="756" y="260" font-size="10.5" font-weight="700" fill="#8A6A3A">STDOUT</text>
  <text x="719" y="311" font-size="16" font-weight="700" fill="#4A473F" text-anchor="middle">2</text>
  <text x="756" y="310" font-size="10.5" fill="#6B675C">STDERR</text>
  <text x="719" y="361" font-size="16" font-weight="700" fill="#4A473F" text-anchor="middle">3</text>
  <text x="756" y="360" font-size="10.5" fill="#6B675C">open</text>

  <!-- targets B -->
  <rect x="964" y="183" width="188" height="44" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1058" y="210" font-size="11.5" fill="#4A473F" text-anchor="middle">标准输入设备</text>

  <rect x="964" y="233" width="188" height="44" rx="6" fill="#ECEBE6" stroke="#C9C6BC" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="1058" y="252" font-size="11" fill="#9B968A" text-anchor="middle">终端 tty</text>
  <text x="1058" y="269" font-size="9.5" font-weight="700" fill="#A64B3C" text-anchor="middle">✕ 引用归零 → 关闭</text>

  <rect x="964" y="283" width="188" height="44" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1058" y="310" font-size="11.5" fill="#4A473F" text-anchor="middle">标准错误 (终端)</text>

  <rect x="964" y="330" width="188" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="1058" y="352" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">file.txt</text>
  <text x="1058" y="370" font-size="9.5" fill="#2F6B5E" text-anchor="middle">fd 1 与 fd 3 共享此打开文件</text>

  <line x1="854" y1="205" x2="960" y2="205" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="854" y1="255" x2="957" y2="350" stroke="#A64B3C" stroke-width="2.4" marker-end="url(#arrRed)"/>
  <line x1="854" y1="305" x2="960" y2="305" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="854" y1="357" x2="957" y2="357" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <text x="932" y="414" font-size="11" font-weight="700" fill="#8A6A3A" text-anchor="middle">重定向后：fd 1 改指 file.txt，与 fd 3 汇聚</text>

  <!-- bottom takeaway -->
  <rect x="48" y="452" width="1144" height="56" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="478" font-size="12" font-weight="700" fill="#2B2A26">关键：dup2(3, 1) 先关闭 fd 1 原来的 stdout，再把 fd 3 复制给 fd 1。</text>
  <text x="68" y="498" font-size="11.5" fill="#4A473F">此后 fd 1 与 fd 3 指向同一打开文件（共享偏移量与状态标志）；写往 stdout 的数据（如 printf）全部落入 file.txt。</text>
</svg>
