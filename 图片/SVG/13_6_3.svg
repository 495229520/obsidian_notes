<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100px" height="720px" viewBox="0 0 1100 720" version="1.1"><rect width="100%" height="100%" fill="rgb(245, 244, 237)"/><defs><marker id="arrow-main" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f5f8f" /></marker><marker id="arrow-soft" markerWidth="8" markerHeight="8" refX="7" refY="5" orient="auto" viewBox="0 0 8 10"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#6f7f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="28" font-weight="700" fill="#243447" x="550" y="44" text-anchor="middle" dominant-baseline="middle">Reactor 中的 Modern C++ 回调分发</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="400" fill="#5b6773" x="550" y="76" text-anchor="middle" dominant-baseline="middle">epoll 发现 fd 就绪，EventLoop 调度 Channel，Channel 再触发已注册的 std::function / lambda</text><rect fill="#fff8e8" stroke="#d49b38" stroke-width="2.2" x="50" y="130" width="190" height="88" rx="18" ry="18" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="700" fill="#243447" x="145" y="158" text-anchor="middle" dominant-baseline="middle">fd 就绪</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="400" fill="#5b6773" x="145" y="187" text-anchor="middle" dominant-baseline="middle">listen_fd<tspan x="145" dy="16.9">conn_fd</tspan></text><rect fill="#eaf4ff" stroke="#2f7ab8" stroke-width="2.5" x="300" y="130" width="210" height="88" rx="20" ry="20" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="700" fill="#243447" x="405" y="158" text-anchor="middle" dominant-baseline="middle">EpollPoller</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="400" fill="#31465a" x="405" y="188" text-anchor="middle" dominant-baseline="middle">epoll_wait()</text><rect fill="#edf7ed" stroke="#4f8f55" stroke-width="2.5" x="570" y="130" width="210" height="88" rx="20" ry="20" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="700" fill="#243447" x="675" y="158" text-anchor="middle" dominant-baseline="middle">EventLoop</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="400" fill="#31465a" x="675" y="188" text-anchor="middle" dominant-baseline="middle">遍历 activeChannels</text><rect fill="#fff0f0" stroke="#c96b6b" stroke-width="2.3" x="840" y="130" width="220" height="88" rx="18" ry="18" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="700" fill="#243447" x="950" y="158" text-anchor="middle" dominant-baseline="middle">Channel</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="400" fill="#31465a" x="950" y="188" text-anchor="middle" dominant-baseline="middle">handleEvent()</text><path fill="none" stroke="#2f5f8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-main)" d="M240 174 L297 174" /><path fill="none" stroke="#2f5f8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-main)" d="M510 174 L567 174" /><path fill="none" stroke="#2f5f8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-main)" d="M780 174 L837 174" /><rect fill="#fffdf5" stroke="#c6b178" stroke-width="1.7" x="340" y="270" width="420" height="88" rx="16" ry="16" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="700" fill="#243447" x="550" y="296" text-anchor="middle" dominant-baseline="middle">Channel 保存的是“fd + 事件 bit + 回调对象”</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="400" fill="#5b6773" x="550" y="327" text-anchor="middle" dominant-baseline="middle">events_ / revents_<tspan x="550" dy="18.2">readCallback_ / writeCallback_ / closeCallback_ / errorCallback_</tspan></text><path fill="none" stroke="#6f7f8f" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-soft)" d="M950 218 C950 255 825 283 765 304" /><rect fill="#eaf4ff" stroke="#2f7ab8" stroke-width="2" x="70" y="430" width="210" height="96" rx="16" ry="16" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" font-weight="700" fill="#243447" x="175" y="455" text-anchor="middle" dominant-baseline="middle">readCallback_</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="400" fill="#5b6773" x="175" y="483" text-anchor="middle" dominant-baseline="middle">EPOLLIN / accept</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="400" fill="#31465a" x="175" y="506" text-anchor="middle" dominant-baseline="middle">handleRead()</text><rect fill="#edf7ed" stroke="#4f8f55" stroke-width="2" x="320" y="430" width="210" height="96" rx="16" ry="16" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" font-weight="700" fill="#243447" x="425" y="455" text-anchor="middle" dominant-baseline="middle">writeCallback_</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="400" fill="#5b6773" x="425" y="483" text-anchor="middle" dominant-baseline="middle">EPOLLOUT</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="400" fill="#31465a" x="425" y="506" text-anchor="middle" dominant-baseline="middle">handleWrite()</text><rect fill="#fff8e8" stroke="#d49b38" stroke-width="2" x="570" y="430" width="210" height="96" rx="16" ry="16" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" font-weight="700" fill="#243447" x="675" y="455" text-anchor="middle" dominant-baseline="middle">closeCallback_</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="400" fill="#5b6773" x="675" y="483" text-anchor="middle" dominant-baseline="middle">EPOLLHUP / RDHUP</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="400" fill="#31465a" x="675" y="506" text-anchor="middle" dominant-baseline="middle">handleClose()</text><rect fill="#fff0f0" stroke="#c96b6b" stroke-width="2" x="820" y="430" width="210" height="96" rx="16" ry="16" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" font-weight="700" fill="#243447" x="925" y="455" text-anchor="middle" dominant-baseline="middle">errorCallback_</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="400" fill="#5b6773" x="925" y="483" text-anchor="middle" dominant-baseline="middle">EPOLLERR</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="400" fill="#31465a" x="925" y="506" text-anchor="middle" dominant-baseline="middle">handleError()</text><path fill="none" stroke="#6f7f8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-soft)" d="M915 218 C800 330 255 350 175 427" /><path fill="none" stroke="#6f7f8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-soft)" d="M940 218 C835 330 500 355 425 427" /><path fill="none" stroke="#6f7f8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-soft)" d="M960 218 C905 330 690 355 675 427" /><path fill="none" stroke="#6f7f8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-soft)" d="M980 218 C1005 330 940 365 925 427" /><rect fill="#f7f3ff" stroke="#7a6bb3" stroke-width="2.4" x="265" y="595" width="570" height="82" rx="20" ry="20" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" font-weight="700" fill="#243447" x="550" y="622" text-anchor="middle" dominant-baseline="middle">Concrete Handler：Acceptor / TcpConnection</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="400" fill="#5b6773" x="550" y="653" text-anchor="middle" dominant-baseline="middle">lambda 捕获对象后，最终调用成员函数处理 accept / read / write / close</text><path fill="none" stroke="#6f7f8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-soft)" d="M175 526 C250 575 350 595 405 592" /><path fill="none" stroke="#6f7f8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-soft)" d="M425 526 C455 560 495 575 525 592" /><path fill="none" stroke="#6f7f8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-soft)" d="M675 526 C650 560 610 575 575 592" /><path fill="none" stroke="#6f7f8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-soft)" d="M925 526 C855 575 735 595 695 592" /><rect fill="#fffdf5" stroke="#c6b178" stroke-width="1.6" x="62" y="265" width="215" height="98" rx="14" ry="14" /><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="700" fill="#243447" x="169" y="292" text-anchor="middle" dominant-baseline="middle">不是 map 选一个 key</text><text font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="400" fill="#5b6773" x="169" y="324" text-anchor="middle" dominant-baseline="middle">revents_ 是 bit mask<tspan x="169" dy="16.9">多个回调可能同轮触发</tspan></text><path fill="none" stroke="#6f7f8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-soft)" d="M278 314 L337 314" /></svg>