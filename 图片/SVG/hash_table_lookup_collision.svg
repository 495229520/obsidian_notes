<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <style>
      .title { font: 700 26px 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 600 18px 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif; fill: #374151; }
      .text { font: 15px 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif; fill: #374151; }
      .small { font: 13px 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif; fill: #4b5563; }
      .code { font: 14px 'Consolas', 'Menlo', monospace; fill: #111827; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .array { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 8; }
      .bucket { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 8; }
      .node { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 8; }
      .hit { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 8; }
      .warn { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 8; }
      .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-green { stroke: #059669; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-red { stroke: #dc2626; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#059669" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1060" height="580" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="18"/>
  <text x="550" y="62" text-anchor="middle" class="title">哈希表：用空间换平均 O(1) 查找</text>
  <text x="550" y="92" text-anchor="middle" class="text">适合“是否出现过 / 出现几次 / key 到 value 映射”这类反复查找问题</text>

  <rect x="55" y="125" width="465" height="205" class="box"/>
  <text x="80" y="160" class="subtitle">线性查找：每次从头扫</text>
  <text x="80" y="190" class="text">查找 7 是否存在，需要逐个比较。</text>

  <rect x="82" y="220" width="64" height="48" class="array"/>
  <text x="114" y="250" text-anchor="middle" class="code">3</text>
  <rect x="155" y="220" width="64" height="48" class="array"/>
  <text x="187" y="250" text-anchor="middle" class="code">8</text>
  <rect x="228" y="220" width="64" height="48" class="array"/>
  <text x="260" y="250" text-anchor="middle" class="code">1</text>
  <rect x="301" y="220" width="64" height="48" class="hit"/>
  <text x="333" y="250" text-anchor="middle" class="code">7</text>
  <rect x="374" y="220" width="64" height="48" class="array"/>
  <text x="406" y="250" text-anchor="middle" class="code">9</text>

  <path d="M113 284 C165 310, 260 310, 332 284" class="arrow-red" marker-end="url(#arrowRed)"/>
  <text x="222" y="312" text-anchor="middle" class="small">最坏要比较 n 次：O(n)</text>

  <rect x="580" y="125" width="465" height="205" class="box"/>
  <text x="605" y="160" class="subtitle">哈希查找：先定位 bucket</text>
  <text x="605" y="190" class="text">对 key 做 hash，直接跳到可能的位置。</text>

  <rect x="610" y="220" width="110" height="52" class="soft"/>
  <text x="665" y="242" text-anchor="middle" class="code">key = 7</text>
  <text x="665" y="262" text-anchor="middle" class="small">待查找值</text>

  <path d="M728 246 L805 246" class="arrow-green" marker-end="url(#arrowGreen)"/>
  <rect x="815" y="220" width="110" height="52" class="soft"/>
  <text x="870" y="242" text-anchor="middle" class="code">hash(7)</text>
  <text x="870" y="262" text-anchor="middle" class="small">计算桶下标</text>

  <path d="M934 246 L986 246" class="arrow-green" marker-end="url(#arrowGreen)"/>
  <rect x="980" y="220" width="40" height="52" class="hit"/>
  <text x="1000" y="250" text-anchor="middle" class="code">B2</text>
  <text x="812" y="308" text-anchor="middle" class="small">平均只检查目标 bucket 附近：O(1)</text>

  <rect x="55" y="365" width="990" height="185" class="box"/>
  <text x="80" y="400" class="subtitle">哈希冲突：多个 key 落到同一个 bucket</text>
  <text x="80" y="428" class="text">冲突少时，每个 bucket 很短；冲突严重时，bucket 内部查找会退化。</text>

  <rect x="95" y="460" width="120" height="40" class="bucket"/>
  <text x="155" y="485" text-anchor="middle" class="code">bucket 0</text>
  <rect x="95" y="505" width="120" height="40" class="bucket"/>
  <text x="155" y="530" text-anchor="middle" class="code">bucket 1</text>

  <path d="M218 480 L275 480" class="arrow" marker-end="url(#arrow)"/>
  <rect x="285" y="460" width="80" height="40" class="node"/>
  <text x="325" y="485" text-anchor="middle" class="code">17</text>
  <path d="M368 480 L425 480" class="arrow" marker-end="url(#arrow)"/>
  <rect x="435" y="460" width="80" height="40" class="node"/>
  <text x="475" y="485" text-anchor="middle" class="code">29</text>

  <path d="M218 525 L275 525" class="arrow" marker-end="url(#arrow)"/>
  <rect x="285" y="505" width="80" height="40" class="node"/>
  <text x="325" y="530" text-anchor="middle" class="code">8</text>
  <path d="M368 525 L425 525" class="arrow" marker-end="url(#arrow)"/>
  <rect x="435" y="505" width="80" height="40" class="node"/>
  <text x="475" y="530" text-anchor="middle" class="code">20</text>
  <path d="M518 525 L575 525" class="arrow" marker-end="url(#arrow)"/>
  <rect x="585" y="505" width="80" height="40" class="warn"/>
  <text x="625" y="530" text-anchor="middle" class="code">31</text>

  <rect x="725" y="462" width="270" height="80" class="soft"/>
  <text x="860" y="490" text-anchor="middle" class="text">平均复杂度取决于冲突是否可控</text>
  <text x="860" y="516" text-anchor="middle" class="small">bucket 很短 → 平均 O(1)</text>
  <text x="860" y="536" text-anchor="middle" class="small">bucket 很长 → 最坏 O(n)</text>
</svg>
