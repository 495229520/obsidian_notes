<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 850" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="850" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">blk-mq：每核一条软件队列，直连设备硬件队列</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">与多线程编程同一张药方：消灭共享锁 → 每核本地队列 + 有界并发（tag）+ 发布/获取式通知</text>

  <!-- CPU 提交线程 -->
  <rect x="80" y="132" width="190" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="175" y="159" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">CPU0 · 提交线程</text>
  <rect x="290" y="132" width="190" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="385" y="159" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">CPU1 · 提交线程</text>
  <rect x="500" y="132" width="190" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="595" y="159" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">CPU2 · 提交线程</text>
  <rect x="710" y="132" width="190" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="805" y="159" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">CPU3 · 提交线程</text>

  <line x1="175" y1="178" x2="175" y2="200" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="385" y1="178" x2="385" y2="200" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="595" y1="178" x2="595" y2="200" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="805" y1="178" x2="805" y2="200" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="920" y="196" font-size="10.5" fill="#6B675C">↑ 提交前先 plug：本线程攒一小批再下发</text>

  <!-- 软件队列 -->
  <rect x="80" y="206" width="190" height="56" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="175" y="228" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">软件队列 ctx0</text>
  <text x="175" y="248" font-size="10.5" fill="#24473F" text-anchor="middle">本核独占：无锁入队</text>
  <rect x="290" y="206" width="190" height="56" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="385" y="228" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">软件队列 ctx1</text>
  <text x="385" y="248" font-size="10.5" fill="#24473F" text-anchor="middle">类比 thread-local 队列</text>
  <rect x="500" y="206" width="190" height="56" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="595" y="228" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">软件队列 ctx2</text>
  <text x="595" y="248" font-size="10.5" fill="#24473F" text-anchor="middle">无跨核缓存行弹跳</text>
  <rect x="710" y="206" width="190" height="56" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="805" y="228" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">软件队列 ctx3</text>
  <text x="805" y="248" font-size="10.5" fill="#24473F" text-anchor="middle">告别全局大锁时代</text>

  <!-- 合并与调度带 -->
  <rect x="80" y="290" width="820" height="30" rx="6" fill="#ECEAE0" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="490" y="310" font-size="11.5" fill="#4A473F" text-anchor="middle">请求合并（相邻扇区拼成大请求）· IO 调度器：none / mq-deadline / kyber / bfq【取舍】</text>

  <line x1="175" y1="266" x2="290" y2="342" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="385" y1="266" x2="330" y2="342" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="595" y1="266" x2="650" y2="342" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="805" y1="266" x2="690" y2="342" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 硬件队列 -->
  <rect x="170" y="346" width="300" height="64" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="320" y="372" font-size="13.5" font-weight="700" fill="#4A3F68" text-anchor="middle">硬件派发队列 hctx0</text>
  <text x="320" y="394" font-size="10.5" fill="#4A3F68" text-anchor="middle">tag 池 = 有界并发（如 1023 个在途请求）</text>
  <rect x="510" y="346" width="300" height="64" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="660" y="372" font-size="13.5" font-weight="700" fill="#4A3F68" text-anchor="middle">硬件派发队列 hctx1</text>
  <text x="660" y="394" font-size="10.5" fill="#4A3F68" text-anchor="middle">与 NVMe 队列对一一映射（第3章）</text>

  <line x1="320" y1="414" x2="320" y2="452" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="414" x2="660" y2="452" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="490" y="440" font-size="11.5" fill="#4A473F" text-anchor="middle">驱动：填 SQE（普通内存写）→ 写屏障 → 敲 Doorbell（MMIO）</text>

  <!-- NVMe 设备 -->
  <rect x="170" y="458" width="640" height="104" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="190" y="486" font-size="13.5" font-weight="700" fill="#733428">NVMe 设备（细节见第3章）</text>
  <text x="190" y="510" font-size="11.5" fill="#733428" font-family="'SF Mono',Menlo,Consolas,monospace">SQ 提交环：设备 DMA 读取命令</text>
  <text x="190" y="530" font-size="11.5" fill="#733428" font-family="'SF Mono',Menlo,Consolas,monospace">CQ 完成环：设备 DMA 写入结果 + phase 位翻转</text>
  <text x="190" y="550" font-size="11.5" fill="#733428" font-family="'SF Mono',Menlo,Consolas,monospace">Doorbell：提交 / 完成各一个门铃寄存器</text>

  <!-- 完成路径 -->
  <path d="M250,562 L250,608" fill="none" stroke="#2F6B5E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrt)"/>
  <rect x="170" y="612" width="440" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="390" y="638" font-size="13.5" font-weight="700" fill="#24473F" text-anchor="middle">完成路径:CQE → 中断（或轮询）→ softirq</text>
  <text x="390" y="660" font-size="11" fill="#24473F" text-anchor="middle">bio_endio → 解锁 folio → 唤醒等待进程（1.2 的睡眠到此结束）</text>

  <!-- 门铃协议卡 -->
  <rect x="880" y="346" width="312" height="286" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="900" y="376" font-size="13.5" font-weight="700" fill="#2B2A26">门铃协议 ≈ release / acquire</text>
  <text x="900" y="404" font-size="11.5" fill="#4A473F">提交：填 SQE → 写屏障 → 敲门铃</text>
  <text x="900" y="426" font-size="11.5" fill="#4A473F">≈ store-release：设备看到门铃时，</text>
  <text x="900" y="444" font-size="11.5" fill="#4A473F">SQE 内容必定已完整可见</text>
  <text x="900" y="472" font-size="11.5" fill="#4A473F">完成：先读 phase 位，再读 CQE 内容</text>
  <text x="900" y="494" font-size="11.5" fill="#4A473F">≈ load-acquire</text>
  <text x="900" y="522" font-size="11.5" fill="#4A473F">C++ 对应：std::atomic 的</text>
  <text x="900" y="540" font-size="11.5" fill="#4A473F">memory_order_release / acquire</text>
  <text x="900" y="568" font-size="11.5" fill="#4A473F">内核对应：wmb() / dma_wmb()</text>
  <text x="900" y="596" font-size="11" fill="#A64B3C">【类比】设备不是 C++ 抽象机里的线程，</text>
  <text x="900" y="614" font-size="11" fill="#A64B3C">但"先发布数据、再发布信号"的问题同源</text>

  <!-- 背压卡 -->
  <rect x="80" y="712" width="1112" height="108" rx="8" fill="#F2DEDA" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="104" y="742" font-size="13.5" font-weight="700" fill="#733428">背压：tag 是有界并发的信号量</text>
  <text x="104" y="770" font-size="12" fill="#733428">tag 数固定 = counting_semaphore 的初值；tag 用尽时提交线程睡眠等释放 —— 正是"有界队列满了 push 阻塞"</text>
  <text x="104" y="796" font-size="12" fill="#733428">传导链：设备慢 → tag 紧 → 写回慢 → 脏页涨 → write() 被限速（1.2 / 1.4）；全链路图见 1.8</text>
</svg>
