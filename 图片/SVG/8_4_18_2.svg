  <title id="title">QP/CQ 的四种安排：把应用并发与硬件队列解耦</title>
  <desc id="desc">选择依据是争用、跨核交接、资源数量与故障域，而不是“线程越多越快”。。图中预算、序号与布局均为教学示意，不是实测结果。</desc>
