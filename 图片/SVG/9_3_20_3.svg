<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
  <rect x="0" y="0" width="1200" height="610" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .label { font: 700 19px Arial, 'PingFang SC', sans-serif; fill: #111827; }
      .small { font: 14px Arial, 'PingFang SC', sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, 'PingFang SC', sans-serif; fill: #4b5563; }
      .section { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .amber { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .rose { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="56" y="55" class="title">README 是作品集入口，不是完整论文</text>
  <text x="56" y="88" class="small">新读者先看 README，要能理解项目价值、运行方式、结果和限制。</text>

  <rect x="80" y="140" width="230" height="95" class="blue"/>
  <text x="110" y="176" class="label">Project Goal</text>
  <text x="110" y="205" class="small">为什么做 GEMM lab</text>
  <path d="M320 188 H395" class="line"/>

  <rect x="410" y="140" width="230" height="95" class="section"/>
  <text x="440" y="176" class="label">Implemented Kernels</text>
  <text x="440" y="205" class="small">CUDA / Triton</text>
  <path d="M650 188 H725" class="line"/>

  <rect x="740" y="140" width="230" height="95" class="green"/>
  <text x="770" y="176" class="label">Baselines</text>
  <text x="770" y="205" class="small">CUTLASS / cuBLAS / Lt</text>

  <rect x="80" y="295" width="230" height="95" class="section"/>
  <text x="110" y="331" class="label">Correctness</text>
  <text x="110" y="360" class="small">reference / tolerance</text>
  <path d="M320 343 H395" class="line"/>

  <rect x="410" y="295" width="230" height="95" class="amber"/>
  <text x="440" y="331" class="label">Benchmark Protocol</text>
  <text x="440" y="360" class="small">warmup / repeat / scope</text>
  <path d="M650 343 H725" class="line"/>

  <rect x="740" y="295" width="230" height="95" class="section"/>
  <text x="770" y="331" class="label">Results Summary</text>
  <text x="770" y="360" class="small">tables + one-line read</text>

  <rect x="80" y="450" width="230" height="95" class="section"/>
  <text x="110" y="486" class="label">Reproduce</text>
  <text x="110" y="515" class="small">copyable commands</text>
  <path d="M320 498 H395" class="line"/>

  <rect x="410" y="450" width="230" height="95" class="rose"/>
  <text x="440" y="486" class="label">Limitations</text>
  <text x="440" y="515" class="small">what is not proven</text>
  <path d="M650 498 H725" class="line"/>

  <rect x="740" y="450" width="230" height="95" class="green"/>
  <text x="770" y="486" class="label">Next Steps</text>
  <text x="770" y="515" class="small">LLM kernels / serving</text>

  <text x="1000" y="220" class="tiny">README: fast path</text>
  <text x="1000" y="250" class="tiny">Report: deep proof</text>
  <text x="1000" y="280" class="tiny">Artifacts: evidence map</text>
</svg>
