<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 338：DP 递推统计比特位</title>
  <desc id="desc">展示 bits[i] = bits[i &gt;&gt; 1] + (i &amp; 1) 的递推关系，以及 n = 0..7 的完整 DP 数组构建过程。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9aa4ad" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#e08830" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #65717d; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; fill: #4d5965; }
      .idx { font-size: 13px; fill: #65717d; }
      .val { font-size: 28px; font-weight: 700; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 14px; fill: #22313f; }
      .mono-sm { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; fill: #4d5965; }
      .box { fill: #fffaf0; stroke: #d2b46f; stroke-width: 1.6; }
      .dep { fill: #dcefe4; stroke: #4d9465; stroke-width: 1.8; }
      .cur { fill: #fff3e0; stroke: #e08830; stroke-width: 1.8; }
      .note { fill: #fffaf0; stroke: #d2b46f; stroke-width: 1.6; }
    </style>
  </defs>

  <!-- 标题 -->
  <text class="title" x="48" y="46">338. 比特位计数 — DP 递推</text>
  <text class="subtitle" x="48" y="72">核心递推：bits[i] = bits[i &gt;&gt; 1] + (i &amp; 1)，自底向上构建。以 n = 7 为例。</text>

  <!-- 递推公式说明 -->
  <rect class="note" x="48" y="96" width="864" height="54" rx="8"/>
  <text class="small" x="72" y="120">i &gt;&gt; 1：去掉最低位后的数（一定小于 i，已经算过）。</text>
  <text class="small" x="72" y="140">i &amp; 1：最低位是不是 1（0 或 1）。两者相加即为 i 的 1 的个数。</text>

  <!-- DP 数组标签 -->
  <text class="label" x="48" y="180">DP 数组 bits[]</text>

  <!-- 8 个单元格 i = 0..7 -->
  <!-- 中心 x = 96 + i*108 -->
  <!-- 0 -->
  <rect class="box" x="48" y="192" width="96" height="92" rx="8"/>
  <text class="idx" x="96" y="214" text-anchor="middle">i = 0</text>
  <text class="val" x="96" y="252" text-anchor="middle">0</text>
  <text class="mono-sm" x="96" y="276" text-anchor="middle">0b000</text>
  <!-- 1 -->
  <rect class="box" x="156" y="192" width="96" height="92" rx="8"/>
  <text class="idx" x="204" y="214" text-anchor="middle">i = 1</text>
  <text class="val" x="204" y="252" text-anchor="middle">1</text>
  <text class="mono-sm" x="204" y="276" text-anchor="middle">0b001</text>
  <!-- 2 (依赖) -->
  <rect class="dep" x="264" y="192" width="96" height="92" rx="8"/>
  <text class="idx" x="312" y="214" text-anchor="middle">i = 2</text>
  <text class="val" x="312" y="252" text-anchor="middle">1</text>
  <text class="mono-sm" x="312" y="276" text-anchor="middle">0b010</text>
  <!-- 3 -->
  <rect class="box" x="372" y="192" width="96" height="92" rx="8"/>
  <text class="idx" x="420" y="214" text-anchor="middle">i = 3</text>
  <text class="val" x="420" y="252" text-anchor="middle">2</text>
  <text class="mono-sm" x="420" y="276" text-anchor="middle">0b011</text>
  <!-- 4 -->
  <rect class="box" x="480" y="192" width="96" height="92" rx="8"/>
  <text class="idx" x="528" y="214" text-anchor="middle">i = 4</text>
  <text class="val" x="528" y="252" text-anchor="middle">1</text>
  <text class="mono-sm" x="528" y="276" text-anchor="middle">0b100</text>
  <!-- 5 (当前) -->
  <rect class="cur" x="588" y="192" width="96" height="92" rx="8"/>
  <text class="idx" x="636" y="214" text-anchor="middle">i = 5</text>
  <text class="val" x="636" y="252" text-anchor="middle">2</text>
  <text class="mono-sm" x="636" y="276" text-anchor="middle">0b101</text>
  <!-- 6 -->
  <rect class="box" x="696" y="192" width="96" height="92" rx="8"/>
  <text class="idx" x="744" y="214" text-anchor="middle">i = 6</text>
  <text class="val" x="744" y="252" text-anchor="middle">2</text>
  <text class="mono-sm" x="744" y="276" text-anchor="middle">0b110</text>
  <!-- 7 -->
  <rect class="box" x="804" y="192" width="96" height="92" rx="8"/>
  <text class="idx" x="852" y="214" text-anchor="middle">i = 7</text>
  <text class="val" x="852" y="252" text-anchor="middle">3</text>
  <text class="mono-sm" x="852" y="276" text-anchor="middle">0b111</text>

  <!-- 依赖箭头：i -> i>>1 -->
  <path d="M 204 284 Q 150 312 96 284" fill="none" stroke="#9aa4ad" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 312 284 Q 258 312 204 284" fill="none" stroke="#9aa4ad" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 420 284 Q 312 344 204 284" fill="none" stroke="#9aa4ad" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 528 284 Q 420 344 312 284" fill="none" stroke="#9aa4ad" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 636 284 Q 474 376 312 284" fill="none" stroke="#e08830" stroke-width="1.8" marker-end="url(#arrowHi)"/>
  <path d="M 744 284 Q 582 376 420 284" fill="none" stroke="#9aa4ad" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 852 284 Q 636 404 420 284" fill="none" stroke="#9aa4ad" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text class="small" x="660" y="372" fill="#e08830">bits[5] 回看 bits[5 &gt;&gt; 1] = bits[2]</text>

  <!-- 递推展开示例 -->
  <rect class="note" x="48" y="430" width="864" height="120" rx="8"/>
  <text class="label" x="72" y="458">递推展开：以 i = 5 为例</text>
  <text class="mono" x="72" y="486">5        = 0b 1 0 1</text>
  <text class="mono" x="72" y="508">5 &gt;&gt; 1   = 0b 1 0  = 2     → 去掉最低位，bits[2] 已算过 = 1</text>
  <text class="mono" x="72" y="530">5 &amp; 1    = 1                → 最低位是 1</text>
  <text class="mono" x="560" y="486" fill="#e08830">bits[5] = bits[2] + (5 &amp; 1)</text>
  <text class="mono" x="560" y="508" fill="#e08830">        = 1 + 1</text>
  <text class="mono" x="560" y="530" fill="#e08830">        = 2</text>

  <text class="subtitle" x="48" y="578">时间 O(n)，空间 O(n)（仅输出数组）。一次遍历，每个数 O(1) 由更小的数推出。</text>
</svg>
