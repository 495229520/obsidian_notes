<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1000" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统：底色 rgb(245,244,237)；面板 #FAF9F2/#8A8574；步骤框 #E3EAF4/#3D5A80/#2C4460；
       运输层专色 #EFE7D6/#8A6D3B/#5C4A28；相同处 #2F6B5E；与本库既有 SVG 同一套 -->
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6D3B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1000" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">NVMe-oF：命令模型原封不动，把 PCIe 换成网络</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">应用与块层一行不改——connect 之后远端盘就是 /dev/nvmeXnY；变的只是同一个 64B SQE 的运输方式</text>

  <!-- 左：本地 NVMe -->
  <rect x="48" y="104" width="520" height="576" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="72" y="132" font-size="14" font-weight="700" fill="#4A473F">本地 NVMe（运输 = PCIe）</text>

  <rect x="88" y="148" width="440" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="308" y="169" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">应用：read() / io_uring 提交一笔 IO</text>
  <text x="308" y="189" font-size="10.5" fill="#2C4460" text-anchor="middle">用户态，浑然不知盘在哪</text>
  <path d="M308,200 L308,220" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="88" y="224" width="440" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="308" y="245" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">VFS + 块层 blk-mq</text>
  <text x="308" y="265" font-size="10.5" fill="#2C4460" text-anchor="middle">每核软件队列 → 硬件队列（1.7）</text>
  <path d="M308,276 L308,296" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="88" y="300" width="440" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="308" y="321" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">nvme 驱动：填 64B SQE → 敲 MMIO doorbell</text>
  <text x="308" y="341" font-size="10.5" fill="#2C4460" text-anchor="middle">3.1 / 3.2 的命令模型</text>
  <path d="M308,352 L308,372" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="88" y="376" width="440" height="52" rx="7" fill="#EFE7D6" stroke="#8A6D3B" stroke-width="1.6"/>
  <text x="308" y="397" font-size="12.5" font-weight="700" fill="#5C4A28" text-anchor="middle">运输：PCIe 总线</text>
  <text x="308" y="417" font-size="10.5" fill="#5C4A28" text-anchor="middle">doorbell 通知 + 设备 DMA 搬运 + MSI-X 中断</text>
  <path d="M308,428 L308,448" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="88" y="452" width="440" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="308" y="473" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">SSD 控制器：执行命令、DMA 数据、写 CQE</text>
  <text x="308" y="493" font-size="10.5" fill="#2C4460" text-anchor="middle">几十 μs 量级的真实服务时间</text>

  <text x="308" y="560" font-size="11.5" fill="#6B675C" text-anchor="middle">「运输层」的三件事：提交通知（doorbell）·</text>
  <text x="308" y="582" font-size="11.5" fill="#6B675C" text-anchor="middle">数据搬运（DMA）· 完成通知（中断 / 轮询）</text>
  <text x="308" y="620" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">Fabrics 换掉的正是这三件事的载体</text>

  <!-- 右：NVMe-oF -->
  <rect x="672" y="104" width="520" height="576" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="696" y="132" font-size="14" font-weight="700" fill="#4A473F">NVMe-oF（运输 = 网络）</text>

  <rect x="712" y="148" width="440" height="52" rx="7" fill="#E3EAF4" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="932" y="169" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">应用：同一行代码</text>
  <text x="932" y="189" font-size="10.5" font-weight="700" fill="#2F6B5E" text-anchor="middle">与左侧完全相同——用户代码零改动</text>
  <path d="M932,200 L932,220" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="712" y="224" width="440" height="52" rx="7" fill="#E3EAF4" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="932" y="245" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">VFS + 块层 blk-mq</text>
  <text x="932" y="265" font-size="10.5" font-weight="700" fill="#2F6B5E" text-anchor="middle">与左侧完全相同——多队列形状原样保留</text>
  <path d="M932,276 L932,296" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="712" y="300" width="440" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="932" y="321" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">nvme-fabrics：同一个 64B SQE 装进 capsule</text>
  <text x="932" y="341" font-size="10.5" fill="#2C4460" text-anchor="middle">没有 doorbell——消息到达本身就是通知</text>
  <path d="M932,352 L932,372" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="712" y="376" width="440" height="52" rx="7" fill="#EFE7D6" stroke="#8A6D3B" stroke-width="1.6"/>
  <text x="932" y="397" font-size="12.5" font-weight="700" fill="#5C4A28" text-anchor="middle">运输：每条 NVMe 队列 ↔ 一条 RC QP / TCP 连接</text>
  <text x="932" y="417" font-size="10.5" fill="#5C4A28" text-anchor="middle">RDMA transport：命令走 SEND，数据走 READ / WRITE</text>
  <path d="M932,428 L932,448" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="712" y="452" width="440" height="52" rx="7" fill="#EFE7D6" stroke="#8A6D3B" stroke-width="1.6"/>
  <text x="932" y="473" font-size="12.5" font-weight="700" fill="#5C4A28" text-anchor="middle">运输：机房网络</text>
  <text x="932" y="493" font-size="10.5" fill="#5C4A28" text-anchor="middle">RTT ~几 μs 到几十 μs【量级】——与盘同量级，所以可行</text>
  <path d="M932,504 L932,524" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="712" y="528" width="440" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="932" y="549" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">Target（nvmet / SPDK）：解 capsule → 转本地命令</text>
  <text x="932" y="569" font-size="10.5" fill="#2C4460" text-anchor="middle">盘的持有者；内核态与用户态两种实现（5.6 / 5.7）</text>
  <path d="M932,580 L932,600" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <rect x="712" y="604" width="440" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="932" y="625" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">本地 NVMe 驱动 + SSD</text>
  <text x="932" y="645" font-size="10.5" fill="#2C4460" text-anchor="middle">与左图最后两步完全一样</text>

  <!-- 运输层等价连线 -->
  <path d="M532,402 L708,402" fill="none" stroke="#8A6D3B" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#arrb)" marker-end="url(#arrb)"/>
  <text x="620" y="390" font-size="11" font-weight="700" fill="#5C4A28" text-anchor="middle">换掉的只有这层</text>

  <!-- 底部：控制面 + 队列映射 -->
  <rect x="48" y="704" width="1144" height="270" rx="10" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.5"/>
  <text x="72" y="732" font-size="14" font-weight="700" fill="#4A473F">控制面名词 + 队列映射：nvme connect 前后发生了什么</text>

  <text x="72" y="768" font-size="12" fill="#4A473F"><tspan font-weight="700">NQN</tspan>：host 与 subsystem 的全网唯一名字（nqn.2014-08.org...）</text>
  <text x="72" y="802" font-size="12" fill="#4A473F"><tspan font-weight="700">subsystem</tspan>：导出单元，装着若干 namespace</text>
  <text x="72" y="836" font-size="12" fill="#4A473F"><tspan font-weight="700">controller</tspan>：每个 host 的连接得到一个控制器实例</text>
  <text x="72" y="870" font-size="12" fill="#4A473F"><tspan font-weight="700">namespace</tspan>：connect 后呈现为 /dev/nvmeXnY 的那块「盘」</text>
  <text x="72" y="904" font-size="12" fill="#4A473F"><tspan font-weight="700">discovery</tspan>：目录服务（well-known NQN），报告能连什么、在哪</text>

  <rect x="660" y="756" width="210" height="168" rx="8" fill="#FFFFFF" fill-opacity="0.6" stroke="#8A8574" stroke-width="1.2"/>
  <text x="765" y="778" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">Host（每核一条）</text>
  <rect x="676" y="788" width="178" height="26" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="765" y="805" font-size="10.5" fill="#2C4460" text-anchor="middle">Admin Queue</text>
  <rect x="676" y="820" width="178" height="26" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="765" y="837" font-size="10.5" fill="#2C4460" text-anchor="middle">IO Queue · 核 0</text>
  <rect x="676" y="852" width="178" height="26" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="765" y="869" font-size="10.5" fill="#2C4460" text-anchor="middle">IO Queue · 核 1</text>
  <rect x="676" y="884" width="178" height="26" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="765" y="901" font-size="10.5" fill="#2C4460" text-anchor="middle">IO Queue · 核 N</text>

  <rect x="990" y="756" width="180" height="168" rx="8" fill="#FFFFFF" fill-opacity="0.6" stroke="#8A8574" stroke-width="1.2"/>
  <text x="1080" y="778" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">Target 端队列</text>
  <rect x="1006" y="788" width="148" height="26" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="1080" y="805" font-size="10.5" fill="#2C4460" text-anchor="middle">Admin 对端</text>
  <rect x="1006" y="820" width="148" height="26" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="1080" y="837" font-size="10.5" fill="#2C4460" text-anchor="middle">IO 对端 · 0</text>
  <rect x="1006" y="852" width="148" height="26" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="1080" y="869" font-size="10.5" fill="#2C4460" text-anchor="middle">IO 对端 · 1</text>
  <rect x="1006" y="884" width="148" height="26" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="1080" y="901" font-size="10.5" fill="#2C4460" text-anchor="middle">IO 对端 · N</text>

  <path d="M854,801 L986,801" fill="none" stroke="#8A6D3B" stroke-width="1.6" marker-end="url(#arrb)"/>
  <path d="M854,833 L986,833" fill="none" stroke="#8A6D3B" stroke-width="1.6" marker-end="url(#arrb)"/>
  <path d="M854,865 L986,865" fill="none" stroke="#8A6D3B" stroke-width="1.6" marker-end="url(#arrb)"/>
  <path d="M854,897 L986,897" fill="none" stroke="#8A6D3B" stroke-width="1.6" marker-end="url(#arrb)"/>

  <text x="925" y="950" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">每条队列一条独立 QP / TCP 连接——多队列端到端，核与核互不串行</text>
</svg>
