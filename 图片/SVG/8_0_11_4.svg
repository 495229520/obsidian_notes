<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">同一 Switch 下，Peer 流量也不一定直达</title><desc id="desc">左图显示 NIC 和 GPU 位于同一 Switch，绿色代表条件允许的本地 P2P，琥珀色代表可能被 ACS 重定向的上行。右侧分离拓扑、策略、映射与同步检查。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">同一 Switch 下，Peer 流量也不一定直达</text>
<text x="48" y="77" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">ACS 的路由控制与平台支持，决定“物理上相邻”能否成为可用的 P2P 路径。</text>
<rect x="40" y="106" width="734" height="490" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="58" y="134" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · 路由示意：NIC → GPU</text>
<rect x="245" y="159" width="325" height="66" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="407.5" y="189.0" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">Root Complex / 平台检查</text>
<text x="407.5" y="211.0" font-size="12.5" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">地址与转发能力依平台而定</text>
<rect x="130" y="299" width="580" height="156" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="420" y="332" font-size="16" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">PCIe Switch</text>
<text x="420" y="357" font-size="13" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">ACS 控制所在路径需逐跳核查</text>
<rect x="82" y="486" width="236" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="200.0" y="516.0" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">NIC Endpoint</text>
<text x="200.0" y="538.0" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">发起 Peer DMA</text>
<rect x="506" y="486" width="236" height="66" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="624.0" y="516.0" font-size="15" font-weight="700" fill="#4A3F68" text-anchor="middle" data-role="body">GPU Endpoint</text>
<text x="624.0" y="538.0" font-size="12.5" font-weight="400" fill="#4A3F68" text-anchor="middle" data-role="body">已注册的 GPU 内存</text>
<line x1="407" y1="225" x2="407" y2="298" stroke="#B5B1A6" stroke-width="3"/>
<line x1="200" y1="455" x2="200" y2="486" stroke="#B5B1A6" stroke-width="3"/>
<line x1="624" y1="455" x2="624" y2="486" stroke="#B5B1A6" stroke-width="3"/>
<path d="M 200,486 L 200,412 L 624,412 L 624,482" fill="none" stroke="#2F6B5E" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="420" y="402" font-size="13" font-weight="600" fill="#24473F" text-anchor="middle" data-role="body">允许时：Switch 内 P2P</text>
<path d="M 181,480 L 181,270 L 328,270 L 328,230" fill="none" stroke="#8A6A3A" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)"/>
<path d="M 494,230 L 494,271 L 655,271 L 655,480" fill="none" stroke="#8A6A3A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#amber)"/>
<text x="79" y="258" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="start" data-role="body">重定向到上游</text>
<text x="525" y="258" font-size="12" font-weight="400" fill="#6B4E28" text-anchor="start" data-role="body">能否下返：依平台</text>
<text x="85" y="578" font-size="15" font-weight="600" fill="#733428" text-anchor="start" data-role="body">路径经过 RC ≠ CPU 执行 memcpy</text>
<rect x="796" y="106" width="404" height="490" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="814" y="134" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 四道检查，缺一不可</text>
<rect x="818" y="164" width="360" height="66" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="998.0" y="194.0" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">① 拓扑</text>
<text x="998.0" y="216.0" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">Switch / Root Port / NUMA</text>
<rect x="818" y="253" width="360" height="66" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="998.0" y="283.0" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">② 策略</text>
<text x="998.0" y="305.0" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">ACSCap ≠ ACSCtl</text>
<rect x="818" y="342" width="360" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="998.0" y="372.0" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">③ 映射</text>
<text x="998.0" y="394.0" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">GPU 注册 / IOMMU / 驱动</text>
<rect x="818" y="431" width="360" height="66" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="998.0" y="461.0" font-size="15" font-weight="700" fill="#4A3F68" text-anchor="middle" data-role="body">④ 可见性</text>
<text x="998.0" y="483.0" font-size="12.5" font-weight="400" fill="#4A3F68" text-anchor="middle" data-role="body">CUDA 与通信协议同步</text>
<text x="820" y="558" font-size="13" font-weight="600" fill="#733428" text-anchor="start" data-role="body">不能只凭 lspci 拓扑宣布 P2P 生效</text>
<line x1="48" y1="617" x2="1192" y2="617" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="642" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">绿色与琥珀色是可能路径，不是本机抓包结果；Linux P2PDMA 与 GPU 厂商还各有支持边界。</text>
<text x="48" y="663" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">本图不建议关闭 ACS / IOMMU；多租户与虚拟化环境必须保留经过验证的隔离假设。</text>
</svg>