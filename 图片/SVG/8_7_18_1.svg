<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>过载的形状：goodput 崩塌曲线与重试放大环</title>
  <desc>左：有/无过载保护时 goodput 随到达负载的变化；右：重试放大环及四个切断点；底部：四层防线流程条。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">过载不是变慢，是崩溃：goodput 曲线与重试放大环</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">验收准则：150% 负载下 goodput 是否平稳 —— 而不是 100% 负载时性能多好</text>

  <!-- Panel A: goodput curve -->
  <rect x="48" y="104" width="560" height="436" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="13" font-weight="700" fill="#4A473F">A · goodput vs 到达负载</text>

  <!-- axes -->
  <line x1="112" y1="472" x2="576" y2="472" stroke="#4A473F" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="112" y1="472" x2="112" y2="160" stroke="#4A473F" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="344" y="502" font-size="11.5" fill="#4A473F" text-anchor="middle">到达负载（% 容量，含重试）</text>
  <text x="84" y="170" font-size="11.5" fill="#4A473F">goodput</text>

  <!-- x ticks: 100% at x=342, 200% at x=560 -->
  <line x1="342" y1="472" x2="342" y2="478" stroke="#4A473F" stroke-width="1.2"/>
  <text x="342" y="492" font-size="10.5" fill="#6B675C" text-anchor="middle">100%</text>
  <line x1="550" y1="472" x2="550" y2="478" stroke="#4A473F" stroke-width="1.2"/>
  <text x="550" y="492" font-size="10.5" fill="#6B675C" text-anchor="middle">200%</text>

  <!-- capacity dashed vline -->
  <line x1="342" y1="180" x2="342" y2="472" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="348" y="196" font-size="10.5" fill="#6B675C">容量线</text>

  <!-- protected curve (green): linear then flat -->
  <path d="M112,472 L342,236 L550,242" stroke="#2F6B5E" stroke-width="2.4" fill="none"/>
  <text x="452" y="228" font-size="11.5" font-weight="700" fill="#24473F">有保护：拒绝超额，goodput 守住平台</text>

  <!-- unprotected curve (red): linear then collapse -->
  <path d="M112,472 L342,236 C400,270 448,380 520,450 L550,456" stroke="#A64B3C" stroke-width="2.4" fill="none"/>
  <text x="368" y="330" font-size="11.5" font-weight="700" fill="#733428">无保护：队列排满 +</text>
  <text x="368" y="348" font-size="11.5" font-weight="700" fill="#733428">超时死工作 → 崩塌</text>

  <rect x="376" y="404" width="200" height="52" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="388" y="426" font-size="10.5" fill="#733428">资源 100% 忙，但处理的全是</text>
  <text x="388" y="444" font-size="10.5" fill="#733428">客户端已放弃的请求（死工作）</text>

  <!-- Panel B: retry loop -->
  <rect x="632" y="104" width="560" height="436" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="656" y="134" font-size="13" font-weight="700" fill="#4A473F">B · 重试放大环：4 个切断点</text>

  <!-- loop boxes -->
  <rect x="826" y="152" width="180" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="916" y="176" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">到达负载</text>
  <text x="916" y="194" font-size="10" fill="#2C4460" text-anchor="middle">= 用户请求 + 重试流量</text>

  <rect x="996" y="260" width="172" height="56" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="1082" y="284" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">队列堆积</text>
  <text x="1082" y="302" font-size="10" fill="#6B4E28" text-anchor="middle">排队时间 &gt; 延迟预算</text>

  <rect x="906" y="382" width="180" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="996" y="406" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">客户端超时</text>
  <text x="996" y="424" font-size="10" fill="#733428" text-anchor="middle">请求已被放弃 = 死工作</text>

  <rect x="668" y="382" width="172" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="754" y="406" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">重试 ×N</text>
  <text x="754" y="424" font-size="10" fill="#733428" text-anchor="middle">多层叠乘：3×3×3=27 倍</text>

  <rect x="664" y="260" width="172" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="750" y="284" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">到达量放大</text>
  <text x="750" y="302" font-size="10" fill="#733428" text-anchor="middle">诱因消失也不恢复（亚稳态）</text>

  <!-- loop arrows (red) -->
  <path d="M968,208 L1044,256" stroke="#A64B3C" stroke-width="1.8" fill="none" marker-end="url(#arrr)"/>
  <path d="M1066,316 L1022,378" stroke="#A64B3C" stroke-width="1.8" fill="none" marker-end="url(#arrr)"/>
  <path d="M906,410 L844,410" stroke="#A64B3C" stroke-width="1.8" fill="none" marker-end="url(#arrr)"/>
  <path d="M752,382 L750,320" stroke="#A64B3C" stroke-width="1.8" fill="none" marker-end="url(#arrr)"/>
  <path d="M792,260 L862,212" stroke="#A64B3C" stroke-width="1.8" fill="none" marker-end="url(#arrr)"/>

  <!-- cut points (green) -->
  <rect x="1018" y="196" width="158" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1030" y="212" font-size="10" font-weight="700" fill="#24473F">① 有界队列 + 快速拒绝</text>
  <text x="1030" y="226" font-size="9.5" fill="#24473F">满了立刻还错误，不排队</text>

  <rect x="1018" y="330" width="158" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1030" y="346" font-size="10" font-weight="700" fill="#24473F">② 出队 shedding</text>
  <text x="1030" y="360" font-size="9.5" fill="#24473F">排队超预算的直接丢弃</text>

  <rect x="852" y="452" width="158" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="864" y="468" font-size="10" font-weight="700" fill="#24473F">③ 重试预算（≤10%）</text>
  <text x="864" y="482" font-size="9.5" fill="#24473F">限总量而非限单请求次数</text>

  <rect x="664" y="452" width="158" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="676" y="468" font-size="10" font-weight="700" fill="#24473F">④ 指数退避 + jitter</text>
  <text x="676" y="482" font-size="9.5" fill="#24473F">打散同步重试冲击波</text>

  <line x1="1044" y1="234" x2="1024" y2="248" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arrg)"/>
  <line x1="1080" y1="330" x2="1064" y2="344" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arrg)"/>
  <line x1="930" y1="452" x2="912" y2="434" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arrg)"/>
  <line x1="742" y1="452" x2="752" y2="442" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arrg)"/>

  <!-- Bottom strip: four-layer defense -->
  <rect x="48" y="564" width="1144" height="196" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="596" font-size="13" font-weight="700" fill="#4A473F">C · 四层防线：压力必须一路传导到负载来源</text>

  <rect x="72" y="616" width="244" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="88" y="640" font-size="12" font-weight="700" fill="#2C4460">1 入口准入</text>
  <text x="88" y="660" font-size="10.5" fill="#2C4460">有界队列 · 快速拒绝</text>
  <text x="88" y="676" font-size="10.5" fill="#2C4460">过载切 LIFO · 分级准入</text>

  <rect x="356" y="616" width="244" height="72" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="372" y="640" font-size="12" font-weight="700" fill="#2C4460">2 限流 / 自适应并发</text>
  <text x="372" y="660" font-size="10.5" fill="#2C4460">令牌桶控速率</text>
  <text x="372" y="676" font-size="10.5" fill="#2C4460">在途上限 + AIMD（Little 定律）</text>

  <rect x="640" y="616" width="244" height="72" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="656" y="640" font-size="12" font-weight="700" fill="#6B4E28">3 降级</text>
  <text x="656" y="660" font-size="10.5" fill="#6B4E28">先掐内部客户：scrub 暂停</text>
  <text x="656" y="676" font-size="10.5" fill="#6B4E28">重建压到保底配额</text>

  <rect x="924" y="616" width="244" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="940" y="640" font-size="12" font-weight="700" fill="#24473F">4 客户端配合</text>
  <text x="940" y="660" font-size="10.5" fill="#24473F">退避+jitter · 重试预算</text>
  <text x="940" y="676" font-size="10.5" fill="#24473F">熔断 · deadline 逐跳传递</text>

  <line x1="316" y1="652" x2="352" y2="652" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="600" y1="652" x2="636" y2="652" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="884" y1="652" x2="920" y2="652" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="72" y="726" font-size="11.5" fill="#6B675C">口径提醒：配额按字节/成本记账（不是请求数）；拒绝数 / 丢弃数 / 预算耗尽数必须导出为指标 —— 否则保护生效时会被当成故障关掉</text>
</svg>
