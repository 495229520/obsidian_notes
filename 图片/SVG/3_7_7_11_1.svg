<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 812" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>IPv6 基本首部与 IPv4 字段的下落</title>
  <desc>上半部分是 IPv6 固定 40 字节基本首部的位图，按字节偏移分四行；下半部分用两张表说明 IPv4 的每个首部字段在 IPv6 里是保留改名、还是被删除搬走。</desc>

  <rect x="0" y="0" width="1240" height="812" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">IPv6 基本首部：固定 40 字节，字段从 13 个减到 8 个</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">判断准则：长度固定就不需要 IHL，路由器不改地址也不分片就不需要校验和</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="320" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F" dominant-baseline="central">A · 基本首部位图（每行 32 位，左侧是字节偏移）</text>

  <text x="136" y="164" font-size="10" fill="#6B675C" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="392" y="164" font-size="10" fill="#6B675C" text-anchor="middle" dominant-baseline="central">8</text>
  <text x="648" y="164" font-size="10" fill="#6B675C" text-anchor="middle" dominant-baseline="central">16</text>
  <text x="904" y="164" font-size="10" fill="#6B675C" text-anchor="middle" dominant-baseline="central">24</text>
  <text x="1128" y="164" font-size="10" fill="#6B675C" text-anchor="middle" dominant-baseline="central">31</text>
  <line x1="120" y1="174" x2="1144" y2="174" stroke="#D8D5C8" stroke-width="1"/>

  <!-- 第 1 行 -->
  <text x="96" y="200" font-size="10.5" fill="#6B675C" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="120" y="178" width="128" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="184" y="195" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">Version</text>
  <text x="184" y="211" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">4 位 · 填 6</text>
  <rect x="248" y="178" width="256" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="376" y="195" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">Traffic Class</text>
  <text x="376" y="211" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">8 位 · 对应 IPv4 的 DSCP + ECN</text>
  <rect x="504" y="178" width="640" height="44" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="824" y="195" font-size="11.5" font-weight="700" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">Flow Label</text>
  <text x="824" y="211" font-size="10" fill="#6B5B95" text-anchor="middle" dominant-baseline="central">20 位 · IPv4 没有的新字段，标记同一条流</text>

  <!-- 第 2 行 -->
  <text x="96" y="244" font-size="10.5" fill="#6B675C" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="120" y="222" width="512" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="376" y="239" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle" dominant-baseline="central">Payload Length</text>
  <text x="376" y="255" font-size="10" fill="#2C4460" text-anchor="middle" dominant-baseline="central">16 位 · 不含这 40 字节基本首部</text>
  <rect x="632" y="222" width="256" height="44" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="760" y="239" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle" dominant-baseline="central">Next Header</text>
  <text x="760" y="255" font-size="10" fill="#6B4E28" text-anchor="middle" dominant-baseline="central">8 位 · 兼作扩展首部链的指针</text>
  <rect x="888" y="222" width="256" height="44" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="1016" y="239" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle" dominant-baseline="central">Hop Limit</text>
  <text x="1016" y="255" font-size="10" fill="#6B4E28" text-anchor="middle" dominant-baseline="central">8 位 · 就是改了名的 TTL</text>

  <!-- 第 3 行 -->
  <text x="96" y="294" font-size="10.5" fill="#6B675C" text-anchor="middle" dominant-baseline="central">8</text>
  <rect x="120" y="266" width="1024" height="56" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="632" y="286" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle" dominant-baseline="central">Source Address</text>
  <text x="632" y="304" font-size="10" fill="#24473F" text-anchor="middle" dominant-baseline="central">128 位，占满 4 行</text>

  <!-- 第 4 行 -->
  <text x="96" y="350" font-size="10.5" fill="#6B675C" text-anchor="middle" dominant-baseline="central">24</text>
  <rect x="120" y="322" width="1024" height="56" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="632" y="342" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle" dominant-baseline="central">Destination Address</text>
  <text x="632" y="360" font-size="10" fill="#24473F" text-anchor="middle" dominant-baseline="central">128 位，占满 4 行</text>

  <text x="120" y="400" font-size="11.5" fill="#6B675C" dominant-baseline="central">8 + 32 = 40 字节，长度写死；地址占了其中 32 字节，真正的控制信息只剩 8 字节</text>

  <!-- ================= Panel B ================= -->
  <rect x="48" y="444" width="1144" height="316" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="472" font-size="15" font-weight="700" fill="#4A473F" dominant-baseline="central">B · IPv4 的每个字段在 IPv6 里去了哪</text>

  <text x="72" y="496" font-size="12.5" font-weight="700" fill="#2F6B5E" dominant-baseline="central">留下来了，只是改名或加宽</text>
  <text x="656" y="496" font-size="12.5" font-weight="700" fill="#A64B3C" dominant-baseline="central">删掉了，或者搬去别处</text>

  <!-- 左表 -->
  <rect x="72" y="512" width="200" height="32" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="272" y="512" width="332" height="32" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="528" font-size="11.5" font-weight="700" fill="#4A473F" dominant-baseline="central">IPv4 字段</text>
  <text x="288" y="528" font-size="11.5" font-weight="700" fill="#4A473F" dominant-baseline="central">IPv6 里的样子</text>

  <rect x="72" y="544" width="200" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="272" y="544" width="332" height="32" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="560" font-size="11.5" fill="#4A473F" dominant-baseline="central">Version</text>
  <text x="288" y="560" font-size="11.5" fill="#24473F" dominant-baseline="central">保留，值填 6</text>

  <rect x="72" y="576" width="200" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="272" y="576" width="332" height="32" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="592" font-size="11.5" fill="#4A473F" dominant-baseline="central">DSCP / ECN</text>
  <text x="288" y="592" font-size="11.5" fill="#24473F" dominant-baseline="central">合并改名为 Traffic Class</text>

  <rect x="72" y="608" width="200" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="272" y="608" width="332" height="32" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="624" font-size="11.5" fill="#4A473F" dominant-baseline="central">Total Length</text>
  <text x="288" y="624" font-size="11.5" fill="#24473F" dominant-baseline="central">改为 Payload Length，不含首部</text>

  <rect x="72" y="640" width="200" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="272" y="640" width="332" height="32" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="656" font-size="11.5" fill="#4A473F" dominant-baseline="central">TTL</text>
  <text x="288" y="656" font-size="11.5" fill="#24473F" dominant-baseline="central">改名 Hop Limit，语义不变</text>

  <rect x="72" y="672" width="200" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="272" y="672" width="332" height="32" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="688" font-size="11.5" fill="#4A473F" dominant-baseline="central">Protocol</text>
  <text x="288" y="688" font-size="11.5" fill="#24473F" dominant-baseline="central">改名 Next Header，多兼一职</text>

  <rect x="72" y="704" width="200" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="272" y="704" width="332" height="32" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="720" font-size="11.5" fill="#4A473F" dominant-baseline="central">源 / 目的地址</text>
  <text x="288" y="720" font-size="11.5" fill="#24473F" dominant-baseline="central">32 位扩到 128 位</text>

  <!-- 右表 -->
  <rect x="656" y="512" width="210" height="32" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="866" y="512" width="302" height="32" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="672" y="528" font-size="11.5" font-weight="700" fill="#4A473F" dominant-baseline="central">IPv4 字段</text>
  <text x="882" y="528" font-size="11.5" font-weight="700" fill="#4A473F" dominant-baseline="central">下落</text>

  <rect x="656" y="544" width="210" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="866" y="544" width="302" height="32" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1"/>
  <text x="672" y="560" font-size="11.5" fill="#4A473F" dominant-baseline="central">IHL</text>
  <text x="882" y="560" font-size="11.5" fill="#733428" dominant-baseline="central">删除，首部固定 40 字节</text>

  <rect x="656" y="576" width="210" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="866" y="576" width="302" height="32" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1"/>
  <text x="672" y="592" font-size="11.5" fill="#4A473F" dominant-baseline="central">Header Checksum</text>
  <text x="882" y="592" font-size="11.5" fill="#733428" dominant-baseline="central">删除，交给链路层和传输层</text>

  <rect x="656" y="608" width="210" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="866" y="608" width="302" height="32" fill="#EFE7DA" stroke="#D8D5C8" stroke-width="1"/>
  <text x="672" y="624" font-size="11.5" fill="#4A473F" dominant-baseline="central">分片三件套</text>
  <text x="882" y="624" font-size="11.5" fill="#6B4E28" dominant-baseline="central">搬进 Fragment 扩展首部</text>

  <rect x="656" y="640" width="210" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="866" y="640" width="302" height="32" fill="#EFE7DA" stroke="#D8D5C8" stroke-width="1"/>
  <text x="672" y="656" font-size="11.5" fill="#4A473F" dominant-baseline="central">Options + Padding</text>
  <text x="882" y="656" font-size="11.5" fill="#6B4E28" dominant-baseline="central">搬进扩展首部链</text>

  <rect x="656" y="672" width="210" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="866" y="672" width="302" height="32" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1"/>
  <text x="672" y="688" font-size="11.5" fill="#4A473F" dominant-baseline="central">广播地址</text>
  <text x="882" y="688" font-size="11.5" fill="#733428" dominant-baseline="central">删除，一律改用组播</text>

  <rect x="656" y="704" width="210" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="866" y="704" width="302" height="32" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="672" y="720" font-size="11.5" fill="#4A473F" dominant-baseline="central">IPv4 里没有</text>
  <text x="882" y="720" font-size="11.5" fill="#6B5B95" dominant-baseline="central">新增 Flow Label，20 位</text>

  <text x="48" y="786" font-size="11.5" fill="#6B675C" dominant-baseline="central">口径：字段划分依 RFC 8200；分片三件套指 IPv4 的 Identification、Flags 与 Fragment Offset，在 IPv6 里只有源主机能用</text>
</svg>
