<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"
     role="img" aria-labelledby="t2 d2">
  <title id="t2">控制访问边界 · 下位机是唯一裁决者</title>
  <desc id="d2">中台只做鉴权、风险提示、透传与审计；下位机独占控制权存储、原子裁决与执行前置安全校验</desc>
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1240" height="760" fill="rgb(245, 244, 237)"/>

  <!-- Top Title & Architecture Subtitle -->
  <text x="48" y="44" font-size="22" font-weight="700" fill="#2B2A26">控制访问边界 · 下位机是唯一裁决者</text>
  <text x="48" y="68" font-size="13" fill="#6B675C">中台只做鉴权、风险提示、透传与审计；下位机独占控制权存储、原子裁决与执行前置安全校验</text>

  <rect x="948" y="30" width="256" height="38" rx="6" fill="#FFF3F1" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1076" y="54" font-size="11.5" font-weight="700" fill="#A64B3C" text-anchor="middle">v0.3 架构基线 · 严禁中台仲裁锁</text>

  <!-- ==================== LEFT: CLIENT ==================== -->
  <rect x="36" y="100" width="175" height="395" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="123" y="126" font-size="13.5" font-weight="700" fill="#2C4460" text-anchor="middle">开发者客户端</text>
  <text x="123" y="146" font-size="11" fill="#6B675C" text-anchor="middle">工程师 · 运维工作台</text>
  <line x1="48" y1="156" x2="198" y2="156" stroke="#D8D5C8" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="46" y="168" width="155" height="66" rx="5" fill="#FFFFFF" stroke="#3D5A80" stroke-width="1"/>
  <text x="54" y="186" font-size="11" font-weight="700" fill="#2C4460">① 观察控制上下文</text>
  <text x="54" y="204" font-size="10" fill="#4A473F">· 运单 / 设备 / 持有者</text>
  <text x="54" y="222" font-size="10" fill="#6B675C">· 质量 UNKNOWN 禁调</text>

  <!-- Step 2 -->
  <rect x="46" y="246" width="155" height="66" rx="5" fill="#FFF3F1" stroke="#A64B3C" stroke-width="1"/>
  <text x="54" y="264" font-size="11" font-weight="700" fill="#733428">② 确认风险填写理由</text>
  <text x="54" y="282" font-size="10" fill="#4A473F">· 普通申请 / 强制强夺</text>
  <text x="54" y="300" font-size="10" font-weight="700" fill="#A64B3C">· 强夺必须填 reason</text>

  <!-- Step 3 -->
  <rect x="46" y="324" width="155" height="66" rx="5" fill="#FFFFFF" stroke="#3D5A80" stroke-width="1"/>
  <text x="54" y="342" font-size="11" font-weight="700" fill="#2C4460">③ 发起控制权申请</text>
  <text x="54" y="360" font-size="10" fill="#4A473F">· 调 ControlAccess</text>
  <text x="54" y="378" font-size="10" fill="#6B675C">· 等待下位机裁决终态</text>

  <!-- Step 4 -->
  <rect x="46" y="402" width="155" height="78" rx="5" fill="#FFFFFF" stroke="#3D5A80" stroke-width="1"/>
  <text x="54" y="420" font-size="11" font-weight="700" fill="#2C4460">④ 持权后下发指令</text>
  <text x="54" y="438" font-size="10" fill="#4A473F">· jog · nav · robot · IO</text>
  <text x="54" y="456" font-size="10" fill="#4A473F">· 下位机执行前再校验</text>
  <text x="54" y="472" font-size="9.5" fill="#6B675C">· 无权或不安全即拒绝</text>

  <!-- ==================== CENTER-LEFT: MID-PLATFORM ==================== -->
  <rect x="230" y="96" width="470" height="399" rx="10" fill="#FBFBF6" stroke="#3D5A80" stroke-width="2"/>
  <text x="465" y="122" font-size="14.5" font-weight="700" fill="#2C4460" text-anchor="middle">MFMS 数据中台 · 控制访问边界</text>
  <text x="465" y="140" font-size="11" fill="#6B675C" text-anchor="middle">无锁设计 · 透传调用 · 审计记录 · 辅助展示</text>

  <!-- Submodule 1: 权限与风险提示 -->
  <rect x="246" y="154" width="214" height="84" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="353" y="174" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">权限校验与风险提示</text>
  <text x="256" y="194" font-size="10" fill="#4A473F">· 用户角色与操作鉴权</text>
  <text x="256" y="212" font-size="10" font-weight="700" fill="#A64B3C">· 强夺必须填入 reason</text>
  <text x="256" y="230" font-size="9.5" fill="#6B675C">· 弹窗二次确认与风险告知</text>

  <!-- Submodule 2: ControlAccessService -->
  <rect x="468" y="154" width="218" height="84" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="577" y="174" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">ControlAccessService</text>
  <text x="478" y="194" font-size="10" fill="#4A473F">· 透传调用下位机控制接口</text>
  <text x="478" y="212" font-size="10" fill="#4A473F">· LowerMachineControlClient</text>
  <text x="478" y="230" font-size="9.5" fill="#6B675C">· 映射下位机结果为稳定 DTO</text>

  <!-- Submodule 3: ControlSnapshot (只读) -->
  <rect x="246" y="246" width="214" height="84" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="353" y="266" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">ControlSnapshot (只读)</text>
  <text x="256" y="286" font-size="10" fill="#4A473F">· 仅供前端页面辅助展示</text>
  <text x="256" y="304" font-size="10" fill="#4A473F">· 超时断流置 UNKNOWN</text>
  <text x="256" y="322" font-size="9.5" font-weight="700" fill="#A64B3C">· 绝不可作为持权证明</text>

  <!-- Submodule 4: DebugCommandService -->
  <rect x="468" y="246" width="218" height="84" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="577" y="266" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">DebugCommandService</text>
  <text x="478" y="286" font-size="10" fill="#4A473F">· jog · nav · robot · IO</text>
  <text x="478" y="304" font-size="10" fill="#4A473F">· 参数校验与审计入库</text>
  <text x="478" y="322" font-size="9.5" fill="#6B675C">· 命令透传下位机二次校验</text>

  <!-- Prohibited Red Box: 中台明确不拥有 -->
  <rect x="246" y="338" width="440" height="144" rx="7" fill="#FFF3F1" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="466" y="360" font-size="12" font-weight="700" fill="#A64B3C" text-anchor="middle">中台明确不拥有【红线禁区 · 严禁实现】</text>
  <line x1="256" y1="368" x2="676" y2="368" stroke="#F0E0DB" stroke-width="1"/>
  <text x="260" y="388" font-size="10.5" fill="#733428">✕ 控制权状态机 · 锁表 · lease 租约维护</text>
  <text x="260" y="410" font-size="10.5" fill="#733428">✕ fencing token · control epoch · 确认 token</text>
  <text x="260" y="432" font-size="10.5" fill="#733428">✕ 跨系统夺权分布式事务 · 协调 Adapter 暂停</text>
  <text x="260" y="454" font-size="10.5" fill="#733428">✕ 调度运单暂停推进 · 跨组件仲裁控制权归属</text>
  <text x="260" y="474" font-size="10" fill="#6B675C">中台定位：控制权申请者与观察者，绝非仲裁者</text>

  <!-- ==================== BOUNDARY SEPARATOR ==================== -->
  <line x1="722" y1="96" x2="722" y2="495" stroke="#A64B3C" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="664" y="278" width="116" height="24" rx="4" fill="#A64B3C"/>
  <text x="722" y="294" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">控制权权威边界</text>

  <!-- ==================== RIGHT: LOWER MACHINE ==================== -->
  <rect x="742" y="96" width="462" height="399" rx="10" fill="#FFF3F1" stroke="#A64B3C" stroke-width="2"/>
  <text x="973" y="122" font-size="14.5" font-weight="700" fill="#733428" text-anchor="middle">下位机 · 唯一控制权权威与裁决者</text>
  <text x="973" y="140" font-size="11" fill="#A64B3C" text-anchor="middle">物理设备直控 · 独占状态存储 · 强一致原子裁决</text>

  <!-- Feature Block 1: 控制权原子裁决 -->
  <rect x="760" y="154" width="426" height="98" rx="6" fill="#FFFFFF" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="973" y="174" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">真实控制权状态存储与原子裁决</text>
  <text x="772" y="194" font-size="10" fill="#4A473F">· 独占存储当前持有者 (owner_ip / port / type / time)</text>
  <text x="772" y="212" font-size="10" fill="#4A473F">· 裁决接口：QueryControl / AcquireControl</text>
  <text x="772" y="230" font-size="10" fill="#4A473F">· 强夺接口：ForceAcquireControl (原子剥夺旧持有者)</text>
  <text x="772" y="246" font-size="9.5" fill="#6B675C">· 释放接口：ReleaseControl / 租约超时自然失效</text>

  <!-- Feature Block 2: 命令执行前置校验 -->
  <rect x="760" y="260" width="426" height="100" rx="6" fill="#FFFFFF" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="973" y="280" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">命令执行前置校验与安全防御</text>
  <text x="772" y="300" font-size="10" fill="#4A473F">· 收到调试/控制命令前，二次校验当前持有者身份</text>
  <text x="772" y="318" font-size="10" fill="#4A473F">· 校验机构物理安全 (急停/防碰撞/限位/联锁)</text>
  <text x="772" y="336" font-size="10" font-weight="700" fill="#A64B3C">· 无权或不安全立即拒绝 (CONTROL_NOT_OWNED / REJECT)</text>
  <text x="772" y="352" font-size="9.5" fill="#6B675C">· 杜绝任何绕过下位机裁决的直接物理动作</text>

  <!-- Feature Block 3: 实时物理事实发布 -->
  <rect x="760" y="368" width="426" height="114" rx="6" fill="#FFFFFF" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="973" y="388" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">实时物理事实发布 (Redis Stream)</text>
  <text x="772" y="408" font-size="10" fill="#4A473F">· 发布 AgvControl 事实信封 (状态变更即刻广播)</text>
  <text x="772" y="426" font-size="10" fill="#4A473F">· 发布 SeerCtrlState / VirtAgvState / 机器人遥测</text>
  <text x="772" y="444" font-size="10" fill="#4A473F">· 供中台 StateManager 接入形成页面展示快照</text>
  <text x="772" y="462" font-size="9.5" fill="#6B675C">· 强夺造成旧命令失效由下位机通知 Adapter，中台只观察</text>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- 客户端 → 中台鉴权 -->
  <path d="M211 200 H246" fill="none" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arr-b)"/>

  <!-- 中台 ControlAccessService → 下位机原子裁决 -->
  <path d="M686 196 H752" fill="none" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arr-r)"/>
  <rect x="692" y="184" width="56" height="17" rx="3" fill="#FFF3F1"/>
  <text x="720" y="196" font-size="9.8" font-weight="700" fill="#A64B3C" text-anchor="middle">申请/强夺</text>

  <!-- 下位机 → 中台 (返回裁决结果) -->
  <path d="M760 220 H694" fill="none" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arr-r)"/>
  <rect x="698" y="222" width="56" height="17" rx="3" fill="#FFF3F1"/>
  <text x="726" y="234" font-size="9.8" font-weight="700" fill="#A64B3C" text-anchor="middle">裁决结果</text>

  <!-- 中台 DebugCommandService → 下位机执行前校验 -->
  <path d="M686 288 H752" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-b)"/>
  <rect x="692" y="276" width="56" height="17" rx="3" fill="#E3EAF4"/>
  <text x="720" y="288" font-size="9.8" font-weight="700" fill="#2C4460" text-anchor="middle">发送指令</text>

  <!-- ==================== BOTTOM: OBSERVATION VS DECISION ==================== -->
  <!-- Left Bottom Panel: 只读状态观察链 -->
  <rect x="36" y="512" width="570" height="142" rx="8" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="52" y="536" font-size="12.5" font-weight="700" fill="#24473F">A · 只读状态观察链 (异步解耦 · 不参与控权)</text>

  <!-- Pipeline Step Cards -->
  <rect x="52" y="548" width="118" height="34" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="111" y="569" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">下位机发布事实</text>

  <path d="M170 565 H186" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="188" y="548" width="124" height="34" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="250" y="569" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">Redis Stream 信封</text>

  <path d="M312 565 H328" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="330" y="548" width="124" height="34" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="392" y="569" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">StateManager 快照</text>

  <path d="M454 565 H470" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="472" y="548" width="120" height="34" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="532" y="569" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">前端页面展示</text>

  <!-- Rules of observation chain -->
  <text x="52" y="602" font-size="10" fill="#4A473F">· 仅用于开发者页面感知当前占用者、运单进度与设备遥测</text>
  <text x="52" y="620" font-size="10" fill="#4A473F">· 快照超时或断流置 STALE / UNKNOWN，页面默认禁用调试操作</text>
  <text x="52" y="638" font-size="9.5" font-weight="700" fill="#A64B3C">· 严禁将快照作为持权证明；能否执行始终以下位机实时响应为准</text>

  <!-- Right Bottom Panel: 同步控制决策链 -->
  <rect x="624" y="512" width="580" height="142" rx="8" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="640" y="536" font-size="12.5" font-weight="700" fill="#733428">B · 同步控制决策链与异常处理 (强一致 · 严防越权)</text>

  <!-- Decision Pipeline Step Cards -->
  <rect x="640" y="548" width="122" height="34" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="701" y="569" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">客户端鉴权/理由</text>

  <path d="M762 565 H778" fill="none" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="780" y="548" width="128" height="34" rx="4" fill="#FFF3F1" stroke="#A64B3C" stroke-width="1"/>
  <text x="844" y="569" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">下位机原子裁决</text>

  <path d="M908 565 H924" fill="none" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="926" y="548" width="124" height="34" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="988" y="569" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">审计入库与返回</text>

  <path d="M1050 565 H1066" fill="none" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="1068" y="548" width="122" height="34" rx="4" fill="#FFF3F1" stroke="#A64B3C" stroke-width="1"/>
  <text x="1129" y="569" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">执行前安全校验</text>

  <!-- Rules of decision chain -->
  <text x="640" y="602" font-size="10" fill="#4A473F">· 夺权成功后方可下发命令，命令执行前下位机再次校验持有者与物理安全</text>
  <text x="640" y="620" font-size="10" fill="#4A473F">· 下位机调用超时属于“结果未知”，先 QueryControl 确认，绝不盲目重试强夺</text>
  <text x="640" y="638" font-size="9.5" fill="#6B675C">· 强夺造成旧命令失效由下位机通知 Adapter，中台只观察结果</text>

  <!-- ==================== BOTTOM PRINCIPLES ==================== -->
  <rect x="36" y="668" width="1168" height="74" rx="8" fill="#FFFFFF" stroke="#D8D5C8" stroke-width="1.2"/>

  <circle cx="56" cy="690" r="4.5" fill="#A64B3C"/>
  <text x="66" y="694" font-size="11" font-weight="700" fill="#733428">权威唯一</text>
  <text x="122" y="694" font-size="10.5" fill="#4A473F">下位机是控制权与物理安全的唯一仲裁者，中台绝不实现锁算法与租约</text>

  <circle cx="620" cy="690" r="4.5" fill="#2F6B5E"/>
  <text x="630" y="694" font-size="11" font-weight="700" fill="#24473F">展示解耦</text>
  <text x="686" y="694" font-size="10.5" fill="#4A473F">StateManager 快照只读展示；过期显式置 UNKNOWN 并关闭调试按钮</text>

  <circle cx="56" cy="722" r="4.5" fill="#3D5A80"/>
  <text x="66" y="726" font-size="11" font-weight="700" fill="#2C4460">双重防线</text>
  <text x="122" y="726" font-size="10.5" fill="#4A473F">中台做业务层权限与原因收集，下位机做执行前硬件级安全与持有者校验</text>

  <circle cx="620" cy="722" r="4.5" fill="#8A6A3A"/>
  <text x="630" y="726" font-size="11" font-weight="700" fill="#6B4E28">超时审慎</text>
  <text x="686" y="726" font-size="10.5" fill="#4A473F">任何控制操作超时绝不盲目重试强夺，必须通过显式 Query 重新校准状态</text>
</svg>