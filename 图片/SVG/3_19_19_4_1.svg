<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<title>GSO / TSO 与 GRO：改变处理粒度，不改变线上 MTU</title>
<desc>理想示例：IPv4/TCP 无选项；MTU 1500、MSS 1460。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<text x="48" y="52" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">GSO / TSO 与 GRO：改变处理粒度，不改变线上 MTU</text>
<text x="48" y="82" font-size="14" fill="#6B675C" text-anchor="start" data-role="subtitle">理想示例：IPv4/TCP 无选项；MTU 1500、MSS 1460。</text>
<rect x="48" y="110" width="1144" height="290" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="139" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">A · 发送：大对象携带分段元数据，CPU 或 NIC 承担拆分</text>
<rect x="71" y="205" width="211" height="106" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="176.5" y="242.76" font-size="14" fill="#2C4460" text-anchor="middle" font-weight="700" data-role="body">大 skb</text>
<text x="176.5" y="262.76" font-size="14" fill="#2C4460" text-anchor="middle" data-role="body">payload 5840 B</text>
<text x="176.5" y="282.76" font-size="14" fill="#2C4460" text-anchor="middle" data-role="body">gso_size = 1460</text>
<rect x="385" y="163" width="261" height="70" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="515.5" y="192.76" font-size="14" fill="#6B4E28" text-anchor="middle" font-weight="700" data-role="body">软件分段路径</text>
<text x="515.5" y="212.76" font-size="14" fill="#6B4E28" text-anchor="middle" data-role="body">CPU 按 GSO 信息拆分</text>
<rect x="385" y="292" width="261" height="70" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="515.5" y="321.76" font-size="14" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">硬件分段路径</text>
<text x="515.5" y="341.76" font-size="14" fill="#24473F" text-anchor="middle" data-role="body">NIC 执行 TSO</text>
<path d="M285,242 L337,242 L337,198 L381,198" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M337,242 L337,327 L381,327" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="401" y="261" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="body">选择取决于能力和当前报文</text>
<path d="M650,198 L712,198 L712,252 L781,252" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M650,327 L712,327 L712,252" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="792" y="182" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">线上：四个独立 TCP 段</text>
<rect x="790" y="223" width="80" height="63" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<rect x="790" y="223" width="80" height="19" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="830" y="237" font-size="11.5" fill="#4A473F" text-anchor="middle" data-role="body">IP / TCP</text>
<text x="830" y="270" font-size="12.5" fill="#2C4460" text-anchor="middle" data-role="body">1460 B</text>
<rect x="884" y="223" width="80" height="63" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<rect x="884" y="223" width="80" height="19" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="924" y="237" font-size="11.5" fill="#4A473F" text-anchor="middle" data-role="body">IP / TCP</text>
<text x="924" y="270" font-size="12.5" fill="#2C4460" text-anchor="middle" data-role="body">1460 B</text>
<rect x="978" y="223" width="80" height="63" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<rect x="978" y="223" width="80" height="19" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1018" y="237" font-size="11.5" fill="#4A473F" text-anchor="middle" data-role="body">IP / TCP</text>
<text x="1018" y="270" font-size="12.5" fill="#2C4460" text-anchor="middle" data-role="body">1460 B</text>
<rect x="1072" y="223" width="80" height="63" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<rect x="1072" y="223" width="80" height="19" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1112" y="237" font-size="11.5" fill="#4A473F" text-anchor="middle" data-role="body">IP / TCP</text>
<text x="1112" y="270" font-size="12.5" fill="#2C4460" text-anchor="middle" data-role="body">1460 B</text>
<text x="790" y="313" font-size="13" fill="#2C4460" text-anchor="start" data-role="body">每个 IP 包 1500 B（本例）</text>
<text x="790" y="340" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="body">链路头、FCS 与 IFG 另计</text>
<rect x="48" y="419" width="1144" height="188" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="448" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="section">B · 接收：原始包已经过链路与网卡，再聚合后续处理对象</text>
<rect x="73" y="479" width="61" height="51" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="103.5" y="509" font-size="11.5" fill="#2C4460" text-anchor="middle" data-role="body">1460 B</text>
<rect x="146" y="479" width="61" height="51" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="176.5" y="509" font-size="11.5" fill="#2C4460" text-anchor="middle" data-role="body">1460 B</text>
<rect x="219" y="479" width="61" height="51" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="249.5" y="509" font-size="11.5" fill="#2C4460" text-anchor="middle" data-role="body">1460 B</text>
<rect x="292" y="479" width="61" height="51" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="322.5" y="509" font-size="11.5" fill="#2C4460" text-anchor="middle" data-role="body">1460 B</text>
<rect x="441" y="477" width="216" height="57" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="549.0" y="499.92" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700" data-role="body">GRO</text>
<text x="549.0" y="519.92" font-size="13" fill="#24473F" text-anchor="middle" data-role="body">同流、顺序与头部条件</text>
<rect x="759" y="477" width="397" height="57" rx="7" fill="#EDEAF3" stroke="#82759D" stroke-width="1.3"/>
<text x="957.5" y="499.92" font-size="13" fill="#6B5B95" text-anchor="middle" font-weight="700" data-role="body">聚合 skb → 后续协议栈</text>
<text x="957.5" y="519.92" font-size="13" fill="#6B5B95" text-anchor="middle" data-role="body">payload 可为 5840 B（理想本例）</text>
<path d="M356,505 L437,505" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M661,505 L755,505" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="75" y="571" font-size="13" fill="#733428" text-anchor="start" data-role="body">线上包数没有减少</text>
<text x="442" y="571" font-size="13" fill="#24473F" text-anchor="start" data-role="body">不是任意包拼接</text>
<text x="759" y="571" font-size="13" fill="#6B5B95" text-anchor="start" data-role="body">上层对象数减少 ≠ 全路径零拷贝</text>
<path d="M48,621 L1192,621" fill="none" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="651" font-size="12.5" fill="#6B675C" text-anchor="start" data-role="footer">边界：GSO 与 TSO 可以同时开启；UDP、隧道与硬件 GRO 需分别核验。</text>
</svg>