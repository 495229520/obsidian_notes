<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<title>取消不是撤销 DMA：先隔离，再等退役，最后回收</title>
<desc>加固状态机示意；不是声称 vLLM v0.11.0 已具备所有这些状态</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="690" fill="#F5F4ED"/>
<text x="48" y="49" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">取消不是撤销 DMA：先隔离，再等退役，最后回收</text>
<text x="48" y="78" font-size="13" fill="#6B675C" text-anchor="start">加固状态机示意；不是声称 vLLM v0.11.0 已具备所有这些状态</text>
<rect x="48" y="110" width="1144" height="181" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="70" y="140" font-size="15" fill="#733428" text-anchor="start" font-weight="700">A · 危险捷径</text>
<rect x="78" y="182" width="230" height="70" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="193.0" y="212.0" font-size="13" fill="#733428" text-anchor="middle" font-weight="700">INFLIGHT</text>
<text x="193.0" y="232.0" font-size="12" fill="#733428" text-anchor="middle">旧操作仍在硬件中</text>
<rect x="358" y="182" width="230" height="70" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="473.0" y="212.0" font-size="13" fill="#733428" text-anchor="middle" font-weight="700">cancel + epoch++</text>
<text x="473.0" y="232.0" font-size="12" fill="#733428" text-anchor="middle">只改变软件身份</text>
<rect x="638" y="182" width="230" height="70" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="753.0" y="212.0" font-size="13" fill="#733428" text-anchor="middle" font-weight="700">立即复用 block</text>
<text x="753.0" y="232.0" font-size="12" fill="#733428" text-anchor="middle">交给新请求</text>
<rect x="918" y="182" width="230" height="70" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="1033.0" y="212.0" font-size="13" fill="#733428" text-anchor="middle" font-weight="700">旧 DMA 迟到</text>
<text x="1033.0" y="232.0" font-size="12" fill="#733428" text-anchor="middle">读错源 / 覆盖新目标</text>
<line x1="314" y1="217" x2="352" y2="217" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="594" y1="217" x2="632" y2="217" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="874" y1="217" x2="912" y2="217" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="48" y="313" width="1144" height="223" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="70" y="344" font-size="15" fill="#24473F" text-anchor="start" font-weight="700">B · 安全回收条件</text>
<rect x="78" y="381" width="230" height="78" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="193.0" y="415.0" font-size="13" fill="#6B4E28" text-anchor="middle" font-weight="700">关闭新提交</text>
<text x="193.0" y="435.0" font-size="12" fill="#6B4E28" text-anchor="middle">取消 descriptor 发放</text>
<rect x="358" y="381" width="230" height="78" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="473.0" y="415.0" font-size="13" fill="#6B4E28" text-anchor="middle" font-weight="700">QUARANTINED</text>
<text x="473.0" y="435.0" font-size="12" fill="#6B4E28" text-anchor="middle">allocation 仍被保留</text>
<rect x="638" y="381" width="230" height="78" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="753.0" y="415.0" font-size="13" fill="#2C4460" text-anchor="middle" font-weight="700">operations retired</text>
<text x="753.0" y="435.0" font-size="12" fill="#2C4460" text-anchor="middle">完成 / 安全停止 + drain</text>
<rect x="918" y="381" width="230" height="78" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1033.0" y="415.0" font-size="13" fill="#24473F" text-anchor="middle" font-weight="700">RECLAIMED</text>
<text x="1033.0" y="435.0" font-size="12" fill="#24473F" text-anchor="middle">无在途者，再提升 epoch</text>
<line x1="314" y1="420" x2="352" y2="420" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="594" y1="420" x2="632" y2="420" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="874" y1="420" x2="912" y2="420" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M365,480 L365,494 L864,494 L864,480" fill="none" stroke="#8A6A3A" stroke-width="1.6"/>
<text x="615" y="520" font-size="12" fill="#6B4E28" text-anchor="middle">此窗口：不发布 ready，也不允许物理复用</text>
<text x="79" y="579" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700">旧 completion 可以丢弃；旧 DMA 必须有物理退役证据</text>
<line x1="48" y1="629" x2="1192" y2="629" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="659" font-size="12" fill="#6B675C" text-anchor="start">8.16 / 取消与生命周期</text>
<text x="1192" y="659" font-size="12" fill="#6B675C" text-anchor="end">软件 generation ≠ 硬件 rkey 撤权</text>
</svg>