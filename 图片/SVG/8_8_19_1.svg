<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
<title>一次 NCCL 调用：主机、GPU、Proxy 与 NIC 各自做什么</title><desc>传统 host API + NET 路径示意；箭头区分提交、进度与数据，API 返回不是 GPU 完成。。原创教学示意；数字不是硬件实测；详细条件与出处见对应 Markdown 笔记。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="52" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">一次 NCCL 调用：主机、GPU、Proxy 与 NIC 各自做什么</text>
<text x="48" y="81" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">传统 host API + NET 路径示意；箭头区分提交、进度与数据，API 返回不是 GPU 完成。</text>
<rect x="48" y="110" width="1144" height="90" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="140" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">主机线程</text>
<text x="65" y="165" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">规划与提交</text>
<rect x="48" y="215" width="1144" height="113" rx="8" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="245" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">GPU（两端）</text>
<text x="65" y="270" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">归约与转发</text>
<rect x="48" y="344" width="1144" height="107" rx="8" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="374" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">CPU Proxy</text>
<text x="65" y="399" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">网络进度</text>
<rect x="48" y="468" width="1144" height="113" rx="8" fill="#F3E8D3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="498" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">NIC / Fabric</text>
<text x="65" y="523" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">DMA 与网络</text>
<rect x="230" y="129" width="205" height="51" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="332.5" y="159.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">选择算法 / 协议</text>
<rect x="478" y="129" width="205" height="51" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="580.5" y="159.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">划分 Channel / Chunk</text>
<rect x="726" y="129" width="205" height="51" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="828.5" y="159.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">投递设备工作</text>
<rect x="974" y="129" width="193" height="51" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1070.5" y="159.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">主机可以返回</text>
<line x1="438" y1="154" x2="474" y2="154" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="686" y1="154" x2="722" y2="154" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="934" y1="154" x2="970" y2="154" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="230" y="242" width="205" height="57" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="332.5" y="275.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">等待输入依赖</text>
<rect x="478" y="242" width="205" height="57" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="580.5" y="275.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">准备 / 归约数据</text>
<rect x="974" y="242" width="193" height="57" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1070.5" y="275.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">消费并写输出</text>
<line x1="438" y1="270" x2="474" y2="270" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 829,182 L 829,224 L 580,224 L 580,238" fill="none" stroke="#5A564B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="478" y="369" width="205" height="56" rx="8" fill="#EDEAF3" stroke="#82709B" stroke-width="1.3"/>
<text x="580.5" y="402.0" font-size="14" fill="#625476" font-weight="700" text-anchor="middle">检查 buffer / flags</text>
<rect x="726" y="369" width="205" height="56" rx="8" fill="#EDEAF3" stroke="#82709B" stroke-width="1.3"/>
<text x="828.5" y="402.0" font-size="14" fill="#625476" font-weight="700" text-anchor="middle">isend / irecv</text>
<rect x="974" y="369" width="193" height="56" rx="8" fill="#EDEAF3" stroke="#82709B" stroke-width="1.3"/>
<text x="1070.5" y="402.0" font-size="14" fill="#625476" font-weight="700" text-anchor="middle">test / 可见性处理</text>
<line x1="580" y1="303" x2="580" y2="365" stroke="#5A564B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="596" y="330" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">发布就绪</text>
<line x1="687" y1="397" x2="722" y2="397" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="726" y="497" width="205" height="56" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="828.5" y="530.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">读 / 写数据缓冲区</text>
<rect x="974" y="497" width="193" height="56" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="1070.5" y="530.0" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">网络传输与完成</text>
<line x1="829" y1="429" x2="829" y2="493" stroke="#5A564B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<line x1="935" y1="525" x2="970" y2="525" stroke="#8A6A3A" stroke-width="3" marker-end="url(#amber)"/>
<line x1="1070" y1="493" x2="1070" y2="429" stroke="#5A564B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<line x1="1070" y1="365" x2="1070" y2="303" stroke="#5A564B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M 683,280 L 702,280 L 702,527 L 722,527" fill="none" stroke="#2F6B5E" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="230" y="510" font-size="13" fill="#24473F" font-weight="400" text-anchor="start">粗线：payload 路径</text>
<text x="230" y="537" font-size="13" fill="#625476" font-weight="400" text-anchor="start">虚线：控制 / 进度</text>
<line x1="48" y1="609" x2="1192" y2="609" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="637" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">Proxy 参与网络推进，不等于 CPU 复制整个张量；本图不要求所有本地 P2P、卸载或新 device API 路径照搬。</text>
<text x="48" y="660" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">对应 8.19 §2、§7；网络完成、设备可见性与应用可消费是不同边界。</text>
</svg>