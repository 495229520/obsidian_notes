<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<title id="title">Direct 与真正的 Host staging：端点相同，数据路径不同</title><desc id="desc">两条GPU到GPU数据路径对照：直接NIC访问显存和通过两端pinned Host中转；底部仅为串行模型，不是实测数据。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">Direct 与真正的 Host staging：端点相同，数据路径不同</text>
<text x="48" y="82" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">普通 Host↔Host perftest 不是 GPU-to-GPU staging；后者必须计入 D2H 与 H2D。</text>
<rect x="48" y="115" width="1144" height="165" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text x="70" y="144" font-size="14" font-weight="700" fill="#2C4460" text-anchor="start" data-role="section">DIRECT · 显存注册</text>
<rect x="90" y="179" width="190" height="65" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="185.0" y="216.26" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">GPU A</text>
<rect x="380" y="179" width="190" height="65" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="475.0" y="216.26" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">RNIC A</text>
<rect x="670" y="179" width="190" height="65" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="765.0" y="216.26" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">RNIC B</text>
<rect x="960" y="179" width="190" height="65" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="1055.0" y="216.26" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">GPU B</text>
<path d="M284,211 L375,211" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="330.0" y="194" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">peer read</text>
<path d="M574,211 L665,211" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="620.0" y="194" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">RDMA</text>
<path d="M864,211 L955,211" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="910.0" y="194" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">peer write</text>
<rect x="48" y="309" width="1144" height="180" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text x="70" y="339" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="section">STAGING · 网络 MR 指向 Host buffer</text>
<rect x="60" y="378" width="145" height="74" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="132.5" y="419.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">GPU A</text>
<rect x="255" y="378" width="145" height="74" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="327.5" y="409.26" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">Host A</text>
<text x="327.5" y="430.26" font-size="12" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">pinned / MR</text>
<rect x="450" y="378" width="145" height="74" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="522.5" y="419.76" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">RNIC A</text>
<rect x="645" y="378" width="145" height="74" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="717.5" y="419.76" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">RNIC B</text>
<rect x="840" y="378" width="145" height="74" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="912.5" y="409.26" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">Host B</text>
<text x="912.5" y="430.26" font-size="12" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">pinned / MR</text>
<rect x="1035" y="378" width="145" height="74" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="1107.5" y="419.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">GPU B</text>
<path d="M208,415 L251,415" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="230.0" y="370" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">D2H</text>
<path d="M403,415 L446,415" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="425.0" y="370" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">DMA 读</text>
<path d="M598,415 L641,415" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="620.0" y="370" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">RDMA</text>
<path d="M793,415 L836,415" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="815.0" y="370" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">DMA 写</text>
<path d="M988,415 L1031,415" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="1010.0" y="370" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">H2D</text>
<text x="68" y="531" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">串行模型 · 非实测</text>
<text x="68" y="557" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">1 MiB / 每阶段 25 GB/s</text>
<text x="358" y="528" font-size="12" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">direct</text>
<text x="358" y="584" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="start" data-role="body">staging</text>
<rect x="445" y="507" width="212" height="36" rx="3" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="551" y="530" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">约 41.94 μs</text>
<rect x="445" y="563" width="212" height="36" rx="3" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="551" y="586" font-size="12" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">D2H ≈ 41.94 μs</text>
<rect x="657" y="563" width="212" height="36" rx="3" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="763" y="586" font-size="12" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">RDMA ≈ 41.94 μs</text>
<rect x="869" y="563" width="212" height="36" rx="3" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="975" y="586" font-size="12" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">H2D ≈ 41.94 μs</text>
<text x="694" y="530" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">未计控制、校验与端点瓶颈</text>
<text x="48" y="653" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="scope">充分流水化后由瓶颈阶段限制稳态吞吐；不能把串行模型当作固定三倍提升。</text>
</svg>