<?xml version="1.0" encoding="utf-8"?>
<svg width="1120" height="660" viewBox="0 0 1120 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MFMS 数据中台架构图">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="mfmsArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
    <style><![CDATA[
      .box2 { fill:#eef6ff; stroke:#2563eb; stroke-width:1.4; }
      .box3 { fill:#f6fef9; stroke:#15803d; stroke-width:1.4; }
      .box4 { fill:#fff7ed; stroke:#c2410c; stroke-width:1.4; }
      .box5 { fill:#fdf2f8; stroke:#be185d; stroke-width:1.4; }
      .label { font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#0f172a; font-weight:700; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#334155; }
      .title { font: 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight:700; fill:#0f172a; }
      .arrow { stroke:#475569; stroke-width:1.5; marker-end:url(#mfmsArrow); fill:none; }
      .dash { stroke:#64748b; stroke-width:1.4; stroke-dasharray:6 5; marker-end:url(#mfmsArrow); fill:none; }
    ]]></style>
  </defs>

  <text x="28" y="36" class="title">MFMS 数据中台总览</text>

  <rect x="30" y="70" width="180" height="105" rx="8" ry="8" class="box2"/>
