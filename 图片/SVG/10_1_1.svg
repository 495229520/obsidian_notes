  <path d="M945 177 C870 230 725 230 630 285" class="arrow"/>
  <path d="M900 177 C700 250 400 235 250 285" class="arrow"/>
  <path d="M212 405 L212 500" class="arrow"/>
  <path d="M562 405 L562 500" class="arrow"/>
  <path d="M912 405 L912 500" class="arrow"/>
