<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">Underlay 与 Overlay：两套地址空间，一组物理设备</title>
<desc id="desc">例子把 VTEP 放在 Leaf；虚线是租户逻辑邻接，蓝色实线仅标出一条物理候选路径。</desc>
<defs>
<marker id="arr-bs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-gs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/></marker>
<marker id="arr-rs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-ns" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8574"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="46" font-size="23" fill="#2B2A26" font-weight="700" text-anchor="start">Underlay 与 Overlay：两套地址空间，一组物理设备</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">例子把 VTEP 放在 Leaf；虚线是租户逻辑邻接，蓝色实线仅标出一条物理候选路径。</text>
<rect x="48" y="110" width="1144" height="138" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="66" y="136" font-size="16" fill="#24473F" font-weight="700" text-anchor="start" class="section">Overlay：VNI 10010 / 同一二层域</text>
<rect x="86" y="160" width="252" height="60" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="212.0" y="183.5" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">A：10.79.0.1</text>
<text x="212.0" y="206.5" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">内层 MAC A</text>
<rect x="902" y="160" width="252" height="60" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1028.0" y="183.5" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">B：10.79.0.2</text>
<text x="1028.0" y="206.5" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">内层 MAC B</text>
<line x1="344" y1="188" x2="896" y2="188" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-gs)" stroke-dasharray="8 6"/>
<rect x="457" y="174" width="326" height="28" rx="0" fill="#DCE9E3" stroke="none" stroke-width="1.3"/>
<text x="620" y="194" font-size="14" fill="#24473F" font-weight="400" text-anchor="middle">逻辑同网段，不是额外网线</text>
<rect x="48" y="268" width="1144" height="338" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="296" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">Underlay：IP 路由、ECMP、MTU 与物理端口</text>
<line x1="213.0" y1="494" x2="485.0" y2="404" stroke="#8A8574" stroke-width="1.5"/>
<line x1="213.0" y1="494" x2="787.0" y2="404" stroke="#8A8574" stroke-width="1.5"/>
<line x1="620.0" y1="494" x2="485.0" y2="404" stroke="#8A8574" stroke-width="1.5"/>
<line x1="620.0" y1="494" x2="787.0" y2="404" stroke="#8A8574" stroke-width="1.5"/>
<line x1="1027.0" y1="494" x2="485.0" y2="404" stroke="#8A8574" stroke-width="1.5"/>
<line x1="1027.0" y1="494" x2="787.0" y2="404" stroke="#8A8574" stroke-width="1.5"/>
<path d="M213,494 L485,404" fill="none" stroke="#3D5A80" stroke-width="3.2"/>
<path d="M485,404 L1027,494" fill="none" stroke="#3D5A80" stroke-width="3.2" marker-end="url(#arr-bs)"/>
<rect x="370" y="332" width="230" height="72" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="485.0" y="361.5" font-size="15" fill="#4A473F" font-weight="700" text-anchor="middle">Spine 1</text>
<text x="485.0" y="384.5" font-size="15" fill="#4A473F" font-weight="400" text-anchor="middle">只需承载外层 IP</text>
<rect x="672" y="332" width="230" height="72" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="787.0" y="361.5" font-size="15" fill="#4A473F" font-weight="700" text-anchor="middle">Spine 2</text>
<text x="787.0" y="384.5" font-size="15" fill="#4A473F" font-weight="400" text-anchor="middle">只需承载外层 IP</text>
<rect x="88" y="494" width="250" height="80" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="213.0" y="527.5" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">Leaf A / VTEP-A</text>
<text x="213.0" y="550.5" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle">192.0.2.11</text>
<rect x="495" y="494" width="250" height="80" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="620.0" y="527.5" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">Leaf C</text>
<text x="620.0" y="550.5" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle">其他租户接入</text>
<rect x="902" y="494" width="250" height="80" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1027.0" y="527.5" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">Leaf B / VTEP-B</text>
<text x="1027.0" y="550.5" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle">192.0.2.12</text>
<path d="M213,220 L213,255 L70,255 L70,534 L84,534" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-gs)"/>
<path d="M1156,534 L1174,534 L1174,255 L1027,255 L1027,224" fill="none" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr-gs)"/>
<line x1="392" y1="589" x2="430" y2="589" stroke="#3D5A80" stroke-width="3"/>
<text x="441" y="594" font-size="13" fill="#3D5A80" font-weight="400" text-anchor="start">选中路径</text>
<line x1="642" y1="589" x2="680" y2="589" stroke="#8A8574" stroke-width="1.5"/>
<text x="691" y="594" font-size="13" fill="#8A8574" font-weight="400" text-anchor="start">其他候选</text>
<text x="48" y="640" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">内层 IP：A → B；外层 IP：VTEP-A → VTEP-B；外层 MAC 随每条路由链路变化。</text>
<text x="48" y="674" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">两级设备不等于两个交换阶段；跨 Leaf 路径为源 Leaf → Spine → 目的 Leaf。</text>
</svg>