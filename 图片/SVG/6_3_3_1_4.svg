<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>会话时限时间轴</title>
  <desc>会话从 Start() 起 60 分钟限额；第 55 分钟 ShouldPrompt 触发弹出延长按钮；第 60 分钟 IsExpired 终止；若已 Extend 则到期点右移到 75 分钟。</desc>
  <rect x="0" y="0" width="900" height="300" fill="rgb(245, 244, 237)"/>

  <text x="450" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#444441">会话时限时间轴</text>

  <!-- axis segments -->
  <path d="M120 160 L360 160" fill="none" stroke="#5F5E5A" stroke-width="2"/>
  <path d="M360 160 L560 160" fill="none" stroke="#854F0B" stroke-width="2"/>
  <path d="M560 160 L780 160" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- ticks -->
  <path d="M120 150 L120 170" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
  <path d="M360 150 L360 170" fill="none" stroke="#854F0B" stroke-width="1.5"/>
  <path d="M560 150 L560 170" fill="none" stroke="#854F0B" stroke-width="1.5"/>
  <path d="M780 150 L780 170" fill="none" stroke="#185FA5" stroke-width="1.5"/>

  <!-- point markers -->
  <circle cx="120" cy="160" r="5" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="0.5"/>
  <circle cx="360" cy="160" r="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <circle cx="560" cy="160" r="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <circle cx="780" cy="160" r="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>

  <!-- time labels (above) -->
  <text x="120" y="130" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">0 min</text>
  <text x="360" y="130" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">55 min</text>
  <text x="560" y="130" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">60 min</text>
  <text x="780" y="130" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">75 min</text>

  <!-- event labels (below) -->
  <text x="120" y="192" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">Start()</text>
  <text x="120" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">会话开始 · 限额 60min</text>

  <text x="360" y="192" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">ShouldPrompt = true</text>
  <text x="360" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">弹出延长按钮</text>

  <text x="560" y="192" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">IsExpired</text>
  <text x="560" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">会话终止</text>

  <text x="780" y="192" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">若已 Extend</text>
  <text x="780" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">新的到期点</text>

  <text x="450" y="258" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">时间轴非等比，仅示意关键节点；每次 Extend +15min 把到期点右移并重新允许提示。</text>
</svg>
