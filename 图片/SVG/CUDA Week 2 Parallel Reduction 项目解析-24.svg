<rect x="925" y="210" width="280" height="34" rx="17.0" fill="#F1F5F9" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="1065.0" y="232.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Register shuffle + tiny smem</text>
<text x="935" y="270" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">同步模式</text>
<text x="935" y="300" font-size="15" font-weight="600" fill="#334155" text-anchor="start">warp 内天然同步 + 1 barrier</text>
<text x="935" y="345" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">线程活跃</text>
<text x="935" y="375" font-size="15" font-weight="600" fill="#334155" text-anchor="start">warp 级通信</text>
<text x="935" y="420" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">学习重点</text>
<text x="935" y="450" font-size="15" font-weight="600" fill="#334155" text-anchor="start">减少 smem 与同步开销</text>
