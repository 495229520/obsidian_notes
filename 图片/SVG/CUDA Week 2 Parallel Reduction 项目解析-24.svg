<text x="530" y="270" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">同步模式</text>
<text x="530" y="300" font-size="15" font-weight="600" fill="#334155" text-anchor="start">每轮 __syncthreads</text>
<text x="530" y="345" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">线程活跃</text>
<text x="530" y="375" font-size="15" font-weight="600" fill="#334155" text-anchor="start">log2(blockDim) 轮</text>
<text x="530" y="420" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">学习重点</text>
<text x="530" y="450" font-size="15" font-weight="600" fill="#334155" text-anchor="start">block-level cooperation</text>
