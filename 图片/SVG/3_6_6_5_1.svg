<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <title>fseek 的三个基准与越过 EOF 写入形成的空洞</title>
  <desc>上半部分在一个 16 字节文件上并列画出 SEEK_SET、SEEK_CUR、SEEK_END 三个基准以及各自的正负偏移；下半部分展示 seek 到 1 MiB 处再写 1 字节后，文件逻辑长度与实际占用磁盘块的差别。</desc>

  <rect x="0" y="0" width="1240" height="820" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">fseek 的三个基准，与越过 EOF 写入形成的空洞</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">上半：同一个 16 字节文件、当前位置 pos = 6，三种 fromwhere 各自从哪里起算　下半：seek 到远处再写 1 字节的后果</text>

  <!-- ===================== Panel A ===================== -->
  <rect x="48" y="104" width="1144" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="15" font-weight="700" fill="#4A473F">A · 三个基准：SEEK_SET / SEEK_CUR / SEEK_END</text>

  <!-- ruler -->
  <text x="72" y="177" font-size="11.5" fill="#6B675C">文件内容</text>
  <rect x="250" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="302" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="354" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="406" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="458" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="510" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="562" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="614" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="666" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="718" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="770" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="822" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="874" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="926" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="978" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <rect x="1030" y="152" width="52" height="40" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="276" y="176" font-size="11" fill="#4A473F" text-anchor="middle">0</text>
  <text x="328" y="176" font-size="11" fill="#4A473F" text-anchor="middle">1</text>
  <text x="380" y="176" font-size="11" fill="#4A473F" text-anchor="middle">2</text>
  <text x="432" y="176" font-size="11" fill="#4A473F" text-anchor="middle">3</text>
  <text x="484" y="176" font-size="11" fill="#4A473F" text-anchor="middle">4</text>
  <text x="536" y="176" font-size="11" fill="#4A473F" text-anchor="middle">5</text>
  <text x="588" y="176" font-size="11" fill="#4A473F" text-anchor="middle">6</text>
  <text x="640" y="176" font-size="11" fill="#4A473F" text-anchor="middle">7</text>
  <text x="692" y="176" font-size="11" fill="#4A473F" text-anchor="middle">8</text>
  <text x="744" y="176" font-size="11" fill="#4A473F" text-anchor="middle">9</text>
  <text x="796" y="176" font-size="11" fill="#4A473F" text-anchor="middle">10</text>
  <text x="848" y="176" font-size="11" fill="#4A473F" text-anchor="middle">11</text>
  <text x="900" y="176" font-size="11" fill="#4A473F" text-anchor="middle">12</text>
  <text x="952" y="176" font-size="11" fill="#4A473F" text-anchor="middle">13</text>
  <text x="1004" y="176" font-size="11" fill="#4A473F" text-anchor="middle">14</text>
  <text x="1056" y="176" font-size="11" fill="#4A473F" text-anchor="middle">15</text>

  <!-- base ticks -->
  <line x1="250" y1="140" x2="250" y2="200" stroke="#3D5A80" stroke-width="2.2"/>
  <line x1="562" y1="140" x2="562" y2="200" stroke="#A64B3C" stroke-width="2.2"/>
  <line x1="1082" y1="140" x2="1082" y2="200" stroke="#2F6B5E" stroke-width="2.2"/>
  <text x="250" y="222" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">SEEK_SET · 0</text>
  <text x="562" y="222" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">SEEK_CUR · 当前位置 6</text>
  <text x="1082" y="222" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">SEEK_END · 16</text>

  <!-- drop lines from base to its row -->
  <line x1="250" y1="230" x2="250" y2="262" stroke="#3D5A80" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="562" y1="230" x2="562" y2="306" stroke="#A64B3C" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="1082" y1="230" x2="1082" y2="350" stroke="#2F6B5E" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- row 1 : SEEK_SET -->
  <line x1="250" y1="262" x2="1082" y2="262" stroke="#E3E0D6" stroke-width="1"/>
  <text x="72" y="266" font-size="11.5" font-weight="700" fill="#2C4460">① fseek(fp, 3, SEEK_SET)</text>
  <line x1="250" y1="262" x2="406" y2="262" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="328" y="253" font-size="9.5" fill="#2C4460" text-anchor="middle">offset = +3</text>
  <text x="1098" y="266" font-size="11.5" font-weight="700" fill="#4A473F">pos = 3</text>

  <!-- row 2 : SEEK_CUR -->
  <line x1="250" y1="306" x2="1082" y2="306" stroke="#E3E0D6" stroke-width="1"/>
  <text x="72" y="310" font-size="11.5" font-weight="700" fill="#733428">② fseek(fp, -2, SEEK_CUR)</text>
  <line x1="562" y1="306" x2="458" y2="306" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="510" y="297" font-size="9.5" fill="#733428" text-anchor="middle">offset = -2</text>
  <text x="1098" y="310" font-size="11.5" font-weight="700" fill="#4A473F">pos = 4</text>

  <!-- row 3 : SEEK_END -->
  <line x1="250" y1="350" x2="1082" y2="350" stroke="#E3E0D6" stroke-width="1"/>
  <text x="72" y="354" font-size="11.5" font-weight="700" fill="#24473F">③ fseek(fp, -5, SEEK_END)</text>
  <line x1="1082" y1="350" x2="822" y2="350" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <text x="952" y="341" font-size="9.5" fill="#24473F" text-anchor="middle">offset = -5</text>
  <text x="1098" y="354" font-size="11.5" font-weight="700" fill="#4A473F">pos = 11</text>

  <text x="72" y="386" font-size="11" fill="#6B675C">SEEK_END 的基准是最后一个字节之后，不是最后一个字节：fseek(fp, 0, SEEK_END) 之后 ftell 得到的就是文件字节数，所以它的 offset 一般取 0 或负数</text>

  <!-- ===================== Panel B ===================== -->
  <rect x="48" y="428" width="1144" height="216" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="456" font-size="15" font-weight="700" fill="#4A473F">B · 越过 EOF 写入：文件被撑大，中间成为空洞</text>

  <text x="72" y="482" font-size="11.5" font-weight="700" fill="#2C4460">① fputs("HELLO", fp);</text>
  <text x="340" y="482" font-size="11.5" fill="#4A473F">文件长度 5 字节</text>
  <text x="72" y="504" font-size="11.5" font-weight="700" fill="#733428">② fseek(fp, 1048576, SEEK_SET);</text>
  <text x="340" y="504" font-size="11.5" fill="#4A473F">只移动位置指示器，文件长度仍然是 5 字节</text>
  <text x="72" y="526" font-size="11.5" font-weight="700" fill="#24473F">③ fputc('X', fp);</text>
  <text x="340" y="526" font-size="11.5" fill="#4A473F">这一次写入才把文件撑到 1048577 字节</text>

  <!-- bar -->
  <rect x="250" y="552" width="52" height="40" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="302" y="552" width="728" height="40" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="1030" y="552" width="52" height="40" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="276" y="577" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">HELLO</text>
  <text x="666" y="568" font-size="11" fill="#6B675C" text-anchor="middle">空洞：字节 5 ~ 1048575 从未写入，读出来全是 0（POSIX 保证）</text>
  <text x="666" y="586" font-size="9.5" fill="#8A8578" text-anchor="middle">块粒度上，0 号块因为装着 HELLO 已被分配，真正不占盘的是 4096 ~ 1048575</text>
  <text x="1056" y="577" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">X</text>

  <line x1="250" y1="592" x2="250" y2="600" stroke="#9B968A" stroke-width="1"/>
  <line x1="302" y1="592" x2="302" y2="600" stroke="#9B968A" stroke-width="1"/>
  <line x1="1030" y1="592" x2="1030" y2="600" stroke="#9B968A" stroke-width="1"/>
  <line x1="1082" y1="592" x2="1082" y2="600" stroke="#9B968A" stroke-width="1"/>
  <text x="250" y="612" font-size="9.5" fill="#6B675C" text-anchor="middle">0</text>
  <text x="302" y="612" font-size="9.5" fill="#6B675C" text-anchor="middle">5</text>
  <text x="1030" y="612" font-size="9.5" fill="#6B675C" text-anchor="middle">1048576</text>
  <text x="1082" y="612" font-size="9.5" fill="#6B675C" text-anchor="middle">1048577</text>

  <text x="72" y="632" font-size="11" fill="#6B675C">空洞是文件系统的能力：ext4 / XFS / Btrfs 支持；FAT32、exFAT 不支持，同样的代码会真的分配 1 MiB 的块并写满 0</text>

  <!-- ===================== Cards ===================== -->
  <rect x="48" y="664" width="700" height="126" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="692" font-size="13" font-weight="700" fill="#4A473F">同一个文件的两种「大小」</text>
  <text x="72" y="714" font-size="10.5" font-weight="700" fill="#6B675C">命令</text>
  <text x="300" y="714" font-size="10.5" font-weight="700" fill="#6B675C">输出</text>
  <text x="430" y="714" font-size="10.5" font-weight="700" fill="#6B675C">含义</text>
  <line x1="72" y1="722" x2="724" y2="722" stroke="#D8D5C8" stroke-width="1"/>
  <text x="72" y="742" font-size="11" fill="#4A473F">ls -l sparse.bin</text>
  <text x="300" y="742" font-size="11" font-weight="700" fill="#2C4460">1048577</text>
  <text x="430" y="742" font-size="11" fill="#4A473F">逻辑长度，把空洞算在内</text>
  <text x="72" y="764" font-size="11" fill="#4A473F">du -h sparse.bin</text>
  <text x="300" y="764" font-size="11" font-weight="700" fill="#733428">8.0K</text>
  <text x="430" y="764" font-size="11" fill="#4A473F">实际分配的块（ext4，4 KiB × 2）</text>
  <text x="72" y="782" font-size="9.5" fill="#8A8578">du --apparent-size 改报逻辑长度，与 ls -l 一致；具体数值随文件系统和块大小变化</text>

  <rect x="768" y="664" width="424" height="126" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="792" y="692" font-size="13" font-weight="700" fill="#4A473F">不可 seek 的流</text>
  <text x="792" y="716" font-size="11" fill="#4A473F">管道 / FIFO / socket / 终端：fseek、ftell 都失败</text>
  <text x="792" y="740" font-size="11" fill="#4A473F">errno = ESPIPE；rewind 无返回值，失败看不见</text>
  <text x="792" y="766" font-size="11" font-weight="700" fill="#6B4E28">探测：fseek(fp, 0, SEEK_CUR) == 0 说明可定位</text>

  <text x="48" y="812" font-size="11" fill="#6B675C">fseek 本身只改位置、不产生 IO，也不改变文件大小；文件真正变大发生在越过 EOF 的那次写入上</text>
</svg>
