<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 604" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>SMTP：一问一答的命令应答，正文以单独一行的点结束</title>
  <desc>左侧按顺序列出一次 SMTP 投递的完整命令应答交换，从问候到入队；右上说明这个协议有两层不同的消息边界：命令行用回车换行，正文用回车换行加点加回车换行；右下用一个以点开头的正文行演示发送端补点、接收端删点的处理。</desc>

  <rect x="0" y="0" width="1240" height="604" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">SMTP：一问一答，正文用一行点收尾</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">同一条连接上有两种边界：命令行看 CRLF，正文看单独一行的点</text>

  <!-- ============ Panel A: 会话 ============ -->
  <rect x="48" y="104" width="700" height="460" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 投一封信的完整交换</text>

  <rect x="72" y="152" width="652" height="28" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="88" y="171" font-size="11" fill="#24473F">S → C　220 mail.example.com ESMTP</text>

  <rect x="72" y="184" width="652" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="88" y="203" font-size="11" fill="#2C4460">C → S　EHLO client.example.org</text>

  <rect x="72" y="216" width="652" height="28" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="88" y="235" font-size="11" fill="#24473F">S → C　250 SIZE 35882577</text>

  <rect x="72" y="248" width="652" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="88" y="267" font-size="11" fill="#2C4460">C → S　MAIL FROM:&lt;alice@a.org&gt;</text>

  <rect x="72" y="280" width="652" height="28" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="88" y="299" font-size="11" fill="#24473F">S → C　250 OK</text>

  <rect x="72" y="312" width="652" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="88" y="331" font-size="11" fill="#2C4460">C → S　RCPT TO:&lt;bob@b.com&gt;</text>

  <rect x="72" y="344" width="652" height="28" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="88" y="363" font-size="11" fill="#24473F">S → C　250 Accepted</text>

  <rect x="72" y="376" width="652" height="28" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="88" y="395" font-size="11" font-weight="700" fill="#6B4E28">C → S　DATA　从这里开始换一套边界</text>

  <rect x="72" y="408" width="652" height="28" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="88" y="427" font-size="11" fill="#24473F">S → C　354 结束请用单独一行的点</text>

  <rect x="72" y="440" width="652" height="28" rx="5" fill="#F4F2EA" stroke="#9B968A" stroke-width="1"/>
  <text x="88" y="459" font-size="11" fill="#4A473F">C → S　邮件头 + 空行 + 正文（可以很长）</text>

  <rect x="72" y="472" width="652" height="28" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="88" y="491" font-size="11" font-weight="700" fill="#733428">C → S　.　单独一行的点，正文到此为止</text>

  <rect x="72" y="504" width="652" height="28" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="88" y="523" font-size="11" fill="#24473F">S → C　250 已入队，随后 QUIT / 221</text>

  <!-- ============ Panel B: 两层边界 ============ -->
  <rect x="772" y="104" width="420" height="210" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="796" y="132" font-size="15" font-weight="700" fill="#4A473F">B · 一条连接上的两套边界</text>

  <rect x="796" y="148" width="372" height="54" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="812" y="170" font-size="11.5" font-weight="700" fill="#6B4E28">命令与应答：一行一条</text>
  <text x="812" y="190" font-size="10.5" fill="#8A6A3A">边界就是 CRLF</text>

  <rect x="796" y="210" width="372" height="54" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="812" y="232" font-size="11.5" font-weight="700" fill="#733428">正文：边界是 CRLF . CRLF</text>
  <text x="812" y="252" font-size="10.5" fill="#A64B3C">正文本身可以含任意多个 CRLF</text>

  <text x="796" y="292" font-size="11" fill="#4A473F">应答码首位定性：2 成功、3 待续、4 暂时失败、5 永久失败</text>

  <!-- ============ Panel C: 点填充 ============ -->
  <rect x="772" y="338" width="420" height="226" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="796" y="366" font-size="15" font-weight="700" fill="#4A473F">C · 正文里出现点开头的行怎么办</text>

  <text x="796" y="390" font-size="11" fill="#6B675C">应用交给 SMTP 的原文</text>
  <rect x="796" y="398" width="372" height="32" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="812" y="419" font-size="11.5" fill="#4A473F">.hidden 也会一并备份</text>

  <line x1="982" y1="434" x2="982" y2="454" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="996" y="449" font-size="10.5" fill="#6B675C">发送端补一个点</text>

  <rect x="796" y="458" width="372" height="32" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="812" y="479" font-size="11.5" font-weight="700" fill="#6B4E28">..hidden 也会一并备份</text>

  <text x="796" y="516" font-size="11" fill="#4A473F">接收端把行首多出来的那个点删回去</text>
  <text x="796" y="538" font-size="11" fill="#733428">不这么做，正文里的点会被当成结束符</text>
</svg>
