<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>shared_ptr：两个指针，两段生命周期</title>
  <desc>普通非别名构造示例：p1 与 p2 共享对象和控制块，w1 观察同一控制块。蓝线表示存储指针，紫线表示控制块指针。下方按 reset 操作展示对象先销毁、控制块后释放。强弱数量采用逻辑口径，字段布局与内部编码由实现决定。</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5A80"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B5B95"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6B5E"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B675C"/></marker>
  </defs>
  <rect width="1240" height="860" fill="rgb(245, 244, 237)"/>
  <text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700">shared_ptr：两个指针，两段生命周期</text>
  <text x="48" y="77" font-size="14" fill="#6B675C">ptr 用于访问对象，cb 用于共享所有权；对象销毁后，weak_ptr 仍可保留控制块。</text>
  <text x="48" y="116" font-size="15" fill="#2B2A26" font-weight="700">A · 内部结构：p2 = p1，w1 由 p1 构造</text>
  <path d="M851 111 H882" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <text x="891" y="116" font-size="12" fill="#3D5A80">存储指针</text>
  <path d="M1011 111 H1042" fill="none" stroke="#6B5B95" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-purple)"/>
  <text x="1051" y="116" font-size="12" fill="#6B5B95">控制块指针</text>
  <rect x="72" y="162" width="250" height="100" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="88" y="184" font-size="14" fill="#2C4460" font-weight="700">p1 : shared_ptr&lt;T&gt;</text>
  <rect x="84" y="193" width="226" height="27" rx="4" fill="#FBFBF6" stroke="#C5D3E8" stroke-width="1.2"/>
  <text x="96" y="212" font-size="13" fill="#2C4460">T* ptr</text>
  <text x="298" y="212" font-size="12" fill="#6B675C" text-anchor="end">8 B</text>
  <rect x="84" y="225" width="226" height="27" rx="4" fill="#EDEAF3" stroke="#D3CCE3" stroke-width="1.2"/>
  <text x="96" y="244" font-size="13" fill="#6B5B95">ControlBlock* cb</text>
  <text x="298" y="244" font-size="12" fill="#6B675C" text-anchor="end">8 B</text>
  <rect x="352" y="162" width="250" height="100" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="368" y="184" font-size="14" fill="#2C4460" font-weight="700">p2 : shared_ptr&lt;T&gt;</text>
  <rect x="364" y="193" width="226" height="27" rx="4" fill="#FBFBF6" stroke="#C5D3E8" stroke-width="1.2"/>
  <text x="376" y="212" font-size="13" fill="#2C4460">T* ptr</text>
  <text x="578" y="212" font-size="12" fill="#6B675C" text-anchor="end">8 B</text>
  <rect x="364" y="225" width="226" height="27" rx="4" fill="#EDEAF3" stroke="#D3CCE3" stroke-width="1.2"/>
  <text x="376" y="244" font-size="13" fill="#6B5B95">ControlBlock* cb</text>
  <text x="578" y="244" font-size="12" fill="#6B675C" text-anchor="end">8 B</text>
  <rect x="908" y="162" width="260" height="100" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="928" y="188" font-size="16" fill="#24473F" font-weight="700">托管对象 T</text>
  <text x="928" y="214" font-size="14" fill="#24473F">用户数据</text>
  <text x="928" y="243" font-size="12" fill="#4A473F">本例：普通 new 构造</text>
  <path d="M310 206 H336 V144 H892 V206 H908" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <path d="M590 206 H892" fill="none" stroke="#3D5A80" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="668" y="193" font-size="12" fill="#2C4460">get() / operator* / operator-&gt;</text>
  <rect x="374" y="306" width="444" height="148" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="394" y="331" font-size="16" fill="#4A3F6B" font-weight="700">同一个控制块</text>
  <text x="798" y="331" font-size="12" fill="#6B5B95" text-anchor="end">Control Block</text>
  <path d="M390 343 H802" fill="none" stroke="#D8D5C8" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="394" y="366" font-size="14" fill="#2C4460" font-weight="700">强引用数  2</text>
  <text x="598" y="366" font-size="14" fill="#6B5B95" font-weight="700">弱观察者数  1</text>
  <text x="394" y="391" font-size="13" fill="#4A473F">资源指针 / 对象存储</text>
  <text x="394" y="415" font-size="13" fill="#4A473F">销毁逻辑 · 删除器</text>
  <text x="598" y="415" font-size="13" fill="#4A473F">分配器状态（按需）</text>
  <text x="394" y="441" font-size="12" fill="#6B5B95">自定义删除器经类型擦除保存</text>
  <path d="M310 239 H336 V330 H374" fill="none" stroke="#6B5B95" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-purple)"/>
  <path d="M477 252 V306" fill="none" stroke="#6B5B95" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-purple)"/>
  <text x="491" y="285" font-size="12" fill="#6B5B95">共享计数，不复制 T</text>
  <path d="M818 327 H857 V245 H908" fill="none" stroke="#2F6B5E" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-green)" stroke-dasharray="5 4"/>
  <text x="876" y="287" font-size="12" fill="#2F6B5E">强引用归零 → 销毁资源</text>
  <rect x="908" y="324" width="260" height="130" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="928" y="349" font-size="14" fill="#4A473F" font-weight="700">w1 : weak_ptr&lt;T&gt;</text>
  <text x="928" y="377" font-size="13" fill="#4A473F">ptr（不可直接解引用）</text>
  <rect x="920" y="387" width="236" height="27" rx="4" fill="#EDEAF3" stroke="#D3CCE3" stroke-width="1.2"/>
  <text x="932" y="406" font-size="13" fill="#6B5B95">ControlBlock* cb</text>
  <path d="M920 400 H818" fill="none" stroke="#6B5B95" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-purple)"/>
  <text x="928" y="440" font-size="12" fill="#4A473F">lock() 成功后取得 shared_ptr</text>
  <text x="72" y="321" font-size="14" fill="#2B2A26" font-weight="700">常见 64 位实现</text>
  <text x="72" y="347" font-size="13" fill="#4A473F">两个指针，通常共 16 B</text>
  <text x="72" y="370" font-size="12" fill="#6B675C">大小与布局不由标准固定</text>
  <text x="72" y="408" font-size="12" fill="#2C4460">ptr 可直接访问，无需绕经控制块</text>
  <text x="72" y="431" font-size="12" fill="#6B675C">别名构造时，ptr 可指向子对象</text>
  <text x="72" y="454" font-size="12" fill="#6B675C">智能指针本身不限于栈上存放</text>
  <text x="48" y="497" font-size="15" fill="#2B2A26" font-weight="700">B · 依次 reset：对象先销毁，控制块后释放</text>
  <rect x="48" y="514" width="1144" height="158" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="545" font-size="13" fill="#2B2A26" font-weight="700">执行后的状态</text>
  <text x="72" y="578" font-size="13" fill="#4A473F">逻辑数量</text>
  <text x="72" y="613" font-size="13" fill="#24473F" font-weight="700">托管对象 T</text>
  <text x="72" y="649" font-size="13" fill="#4A3F6B" font-weight="700">控制块</text>
  <text x="447" y="545" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">初始</text>
  <text x="447" y="578" font-size="13" fill="#4A473F" text-anchor="middle">强 2 / 弱 1</text>
  <rect x="356" y="592" width="182" height="29" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="447" y="612" font-size="13" fill="#2F6B5E" text-anchor="middle">存活</text>
  <rect x="356" y="628" width="182" height="29" rx="5" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="447" y="648" font-size="13" fill="#6B5B95" text-anchor="middle">保留</text>
  <text x="657" y="545" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">p1.reset()</text>
  <text x="657" y="578" font-size="13" fill="#4A473F" text-anchor="middle">强 1 / 弱 1</text>
  <rect x="566" y="592" width="182" height="29" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="657" y="612" font-size="13" fill="#2F6B5E" text-anchor="middle">存活</text>
  <rect x="566" y="628" width="182" height="29" rx="5" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="657" y="648" font-size="13" fill="#6B5B95" text-anchor="middle">保留</text>
  <text x="867" y="545" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">p2.reset()</text>
  <text x="867" y="578" font-size="13" fill="#4A473F" text-anchor="middle">强 0 / 弱 1</text>
  <rect x="776" y="592" width="182" height="29" rx="5" fill="#F1EFE8" stroke="#C2BDB0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="867" y="612" font-size="13" fill="#6B675C" text-anchor="middle">已销毁</text>
  <rect x="776" y="628" width="182" height="29" rx="5" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="867" y="648" font-size="13" fill="#6B5B95" text-anchor="middle">保留</text>
  <text x="1077" y="545" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="middle">w1.reset()</text>
  <text x="1077" y="578" font-size="13" fill="#4A473F" text-anchor="middle">强 0 / 弱 0</text>
  <rect x="986" y="592" width="182" height="29" rx="5" fill="#F1EFE8" stroke="#C2BDB0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1077" y="612" font-size="13" fill="#6B675C" text-anchor="middle">已销毁</text>
  <rect x="986" y="628" width="182" height="29" rx="5" fill="#F1EFE8" stroke="#C2BDB0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1077" y="648" font-size="13" fill="#6B675C" text-anchor="middle">已释放</text>
  <text x="48" y="696" font-size="12" fill="#6B675C">计数口径：图中“弱”指 weak_ptr 数量；内部弱计数可能另含强引用尚存时的一份隐式引用。</text>
  <rect x="48" y="716" width="1144" height="100" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="742" font-size="13" fill="#2B2A26" font-weight="700">分开分配：shared_ptr&lt;T&gt;(new T)</text>
  <text x="68" y="766" font-size="13" fill="#24473F">强引用归零：delete T</text>
  <text x="68" y="792" font-size="12" fill="#4A473F">控制块等到弱观察者归零后释放</text>
  <path d="M437 731 V801" fill="none" stroke="#D8D5C8" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="457" y="742" font-size="13" fill="#2B2A26" font-weight="700">通常合并分配：make_shared&lt;T&gt;()</text>
  <text x="457" y="766" font-size="13" fill="#24473F">强引用归零：析构 T</text>
  <text x="457" y="792" font-size="12" fill="#4A473F">合并内存等到控制块释放时归还</text>
  <path d="M829 731 V801" fill="none" stroke="#D8D5C8" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="849" y="742" font-size="13" fill="#2B2A26" font-weight="700">并发访问边界</text>
  <text x="849" y="766" font-size="12" fill="#4A473F">不同 shared_ptr：可共享计数</text>
  <text x="849" y="792" font-size="12" fill="#4A473F">同一指针的修改 / T 的读写：需同步</text>
  <text x="48" y="844" font-size="12" fill="#6B675C">本图按普通对象与默认销毁行为示意；自定义删除器决定资源释放动作。</text>
</svg>
