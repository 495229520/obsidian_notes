<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system,'PingFang SC','Microsoft YaHei',Segoe UI,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="rgb(245, 244, 237)"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">模板在编译期「收差异」，多态在运行期「统一调用」</text>

  <!-- 编译期 zone -->
  <rect x="16" y="52" width="868" height="252" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="34" y="78" font-size="15" font-weight="700" fill="#2563eb">① 编译期 · 模板适配差异</text>

  <!-- 运行期 zone -->
  <rect x="16" y="318" width="868" height="266" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="34" y="344" font-size="15" font-weight="700" fill="#ea580c">② 运行期 · 多态统一调用</text>

  <!-- signature boxes -->
  <g font-size="13" text-anchor="middle">
    <g>
      <rect x="30" y="92" width="180" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="120" y="113" fill="#1e3a8a" font-weight="600">普通函数</text>
      <text x="120" y="132" fill="#475569" font-family="ui-monospace,Consolas,monospace" font-size="12">LogTest</text>
    </g>
    <g>
      <rect x="250" y="92" width="180" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="340" y="113" fill="#1e3a8a" font-weight="600">成员函数</text>
      <text x="340" y="132" fill="#475569" font-family="ui-monospace,Consolas,monospace" font-size="11">&amp;Pool::TaskDispatch</text>
    </g>
    <g>
      <rect x="470" y="92" width="180" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="560" y="113" fill="#1e3a8a" font-weight="600">带参函数</text>
      <text x="560" y="132" fill="#475569" font-family="ui-monospace,Consolas,monospace" font-size="12">f(a, b)</text>
    </g>
    <g>
      <rect x="690" y="92" width="180" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="780" y="113" fill="#1e3a8a" font-weight="600">lambda</text>
      <text x="780" y="132" fill="#475569" font-family="ui-monospace,Consolas,monospace" font-size="12">[]{ ... }</text>
    </g>
  </g>

  <!-- arrows sig -> CFunction -->
  <g stroke="#475569" stroke-width="1.6" marker-end="url(#ah)">
    <line x1="120" y1="144" x2="120" y2="172"/>
    <line x1="340" y1="144" x2="340" y2="172"/>
    <line x1="560" y1="144" x2="560" y2="172"/>
    <line x1="780" y1="144" x2="780" y2="172"/>
  </g>
  <text x="450" y="166" text-anchor="middle" font-size="11" fill="#2563eb" font-style="italic">每种签名 → 编译期实例化出独立类型</text>

  <!-- CFunction instances -->
  <g font-size="12" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">
    <rect x="30" y="176" width="180" height="40" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="120" y="201" fill="#1e40af">CFunction&lt;LogTest_t&gt;</text>
    <rect x="250" y="176" width="180" height="40" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="340" y="201" fill="#1e40af">CFunction&lt;Member_t&gt;</text>
    <rect x="470" y="176" width="180" height="40" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="560" y="201" fill="#1e40af">CFunction&lt;Args_t&gt;</text>
    <rect x="690" y="176" width="180" height="40" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="780" y="201" fill="#1e40af">CFunction&lt;Lambda_t&gt;</text>
  </g>

  <!-- arrows CFunction -> base -->
  <g stroke="#16a34a" stroke-width="1.6" marker-end="url(#ah)">
    <line x1="120" y1="216" x2="120" y2="248"/>
    <line x1="340" y1="216" x2="340" y2="248"/>
    <line x1="560" y1="216" x2="560" y2="248"/>
    <line x1="780" y1="216" x2="780" y2="248"/>
  </g>
  <text x="450" y="242" text-anchor="middle" font-size="11" fill="#16a34a" font-style="italic">全部 public 继承 ↓</text>

  <!-- base class bar -->
  <rect x="30" y="252" width="840" height="44" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="450" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#166534" font-family="ui-monospace,Consolas,monospace">class CFunctionBase { virtual int operator()() ; ... }  ← 唯一抽象接口</text>

  <!-- base -> scheduler -->
  <line x1="450" y1="296" x2="450" y2="372" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="462" y="338" font-size="12" fill="#c2410c">调度层只拿到一个 CFunctionBase* base</text>

  <!-- scheduler box -->
  <rect x="180" y="374" width="540" height="56" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="450" y="398" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">调度层　CThread / CThreadPool</text>
  <text x="450" y="418" text-anchor="middle" font-size="12" fill="#7c2d12" font-family="ui-monospace,Consolas,monospace">持有 CFunctionBase* base，对真实签名完全无感</text>

  <!-- scheduler -> vtable -->
  <line x1="450" y1="430" x2="450" y2="470" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="462" y="456" font-size="12" fill="#c2410c">(*base)() 经 vtable 虚分发</text>

  <!-- vtable dispatch box -->
  <rect x="180" y="472" width="540" height="86" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="450" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">运行期：vptr → 实际类型的虚表 → 真正的 operator()()</text>
  <text x="450" y="522" text-anchor="middle" font-size="12" fill="#7c2d12" font-family="ui-monospace,Consolas,monospace">分发到对应 CFunction&lt;...&gt;::m_binder()</text>
  <text x="450" y="544" text-anchor="middle" font-size="12" fill="#9a3412">调度器不知道、也不需要知道原函数是什么</text>
</svg>
