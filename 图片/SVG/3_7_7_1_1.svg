<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 886" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>封装与解封装：每层加了多少字节，以及 MTU 与 MSS 的范围定义</title>
  <desc>A 区为 OSI 七层自上而下逐层加头的阶梯图；B 区用以太网帧算清头部开销与有效载荷；C 区用几何范围与对比表清晰展示 MTU 与 MSS 的计算与层级差异。</desc>

  <rect x="0" y="0" width="1240" height="886" fill="rgb(245, 244, 237)"/>

  <text x="48" y="44" font-size="22" font-weight="700" fill="#2B2A26">封装与解封装：每一层都在往前面塞自己的头</text>
  <text x="48" y="68" font-size="13" fill="#6B675C">下行时逐层加头，上行时逐层剥头；明确 MTU 与 MSS 的层级范围是理解数据分段与避免 IP 分片的前提</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="86" width="1144" height="274" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="110" font-size="15" font-weight="700" fill="#4A473F">A · 七层的逐层封装</text>

  <!-- 方向箭头 -->
  <line x1="60" y1="128" x2="60" y2="330" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="1184" y1="330" x2="1184" y2="128" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 发送端栈 -->
  <text x="144" y="122" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">发送端 · 加头</text>

  <rect x="76" y="128" width="136" height="26" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="144" y="145" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">应用层</text>

