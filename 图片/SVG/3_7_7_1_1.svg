  <text x="144" y="235" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">传输层 (+TCP头)</text>

  <rect x="76" y="248" width="136" height="26" rx="5" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="144" y="265" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">网络层 (+IP头)</text>

