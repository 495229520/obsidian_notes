  <rect x="504" y="159" width="56" height="24" rx="4" fill="#EDEAF3" stroke="#3D5A80" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="532" y="175" font-size="10" fill="#2C4460" text-anchor="middle">PH</text>
