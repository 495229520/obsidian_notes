  <text x="144" y="295" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">链路层 (+帧头尾)</text>

  <rect x="76" y="308" width="136" height="26" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="144" y="325" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">物理层 (信号)</text>

  <!-- PDU 名称 -->
  <text x="244" y="145" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">报文</text>
  <text x="244" y="235" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">段</text>
  <text x="244" y="265" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">数据报</text>
  <text x="244" y="295" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">帧</text>
  <text x="244" y="325" font-size="11" font-weight="700" fill="#6B675C" text-anchor="middle">比特流</text>

  <!-- 阶梯：数据块固定，头部向左累积 -->
  <!-- r1 应用层 -->
  <rect x="560" y="129" width="300" height="24" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
