<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200px" height="860px" viewBox="0 0 1200 860" version="1.1"><title>IPC 机制选择指南</title><desc>A decision tree for choosing between socket, semaphore, shared memory, pipe, and message queue.</desc><rect x="0" y="0" width="1200" height="860" fill="rgb(245, 244, 237)" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6b5b4b" /></marker></defs><rect fill="#faf8f2" stroke="#d8cfbf" stroke-width="2" x="24" y="24" width="1152" height="812" rx="26" ry="26" /><text fill="#2f251d" font-size="30" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="600" y="64" text-anchor="middle" dominant-baseline="middle">IPC 机制选择指南</text><text fill="#7a6a58" font-size="16" font-weight="500" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="600" y="100" text-anchor="middle" dominant-baseline="middle">先问需求，再选机制</text><rect fill="#fff7e8" stroke="#c89f67" stroke-width="2.4" x="405" y="130" width="390" height="76" rx="20" ry="20" /><text fill="#47321f" font-size="24" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="600" y="168" text-anchor="middle" dominant-baseline="middle">需要跨网络吗？</text><rect fill="#e8f4ff" stroke="#7aa7d8" stroke-width="2.2" x="70" y="252" width="240" height="92" rx="18" ry="18" /><text fill="#20415f" font-size="22" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="190" y="288" text-anchor="middle" dominant-baseline="middle">是<tspan x="190" dy="29.7">套接字</tspan></text><text fill="#55799a" font-size="14" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="188" y="364" text-anchor="middle" dominant-baseline="middle">支持跨主机 / 跨网络通信</text><rect fill="#f3ecff" stroke="#9a82cf" stroke-width="2.2" x="430" y="252" width="340" height="92" rx="18" ry="18" /><text fill="#4d3b73" font-size="22" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="600" y="288" text-anchor="middle" dominant-baseline="middle">否<tspan x="600" dy="29.7">需要传递数据吗？</tspan></text><text fill="#7b68a8" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="772" y="295" text-anchor="start" dominant-baseline="middle">不传数据就看同步需求</text><rect fill="#fff0f0" stroke="#db8d8d" stroke-width="2.2" x="820" y="250" width="300" height="92" rx="18" ry="18" /><text fill="#7a3131" font-size="22" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="970" y="288" text-anchor="middle" dominant-baseline="middle">否<tspan x="970" dy="29.7">信号量</tspan></text><text fill="#af6868" font-size="14" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="970" y="364" text-anchor="middle" dominant-baseline="middle">只做同步，不负责传数据</text><rect fill="#f9efe0" stroke="#d2a566" stroke-width="2.2" x="430" y="402" width="340" height="92" rx="18" ry="18" /><text fill="#6b4d1d" font-size="22" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="600" y="439" text-anchor="middle" dominant-baseline="middle">是<tspan x="600" dy="29.7">数据量大吗？</tspan></text><text fill="#ad8a55" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="772" y="446" text-anchor="start" dominant-baseline="middle">这是决定“共享内存”还是“管道/消息队列”的关键</text><rect fill="#def3e7" stroke="#74b48c" stroke-width="2.2" x="250" y="585" width="280" height="112" rx="20" ry="20" /><text fill="#24573b" font-size="22" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="390" y="627" text-anchor="middle" dominant-baseline="middle">是<tspan x="390" dy="29.7">共享内存 + 信号量</tspan></text><text fill="#4d8566" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="390" y="677" text-anchor="middle" dominant-baseline="middle">适合大量数据，配合信号量防止并发冲突</text><rect fill="#eef0f7" stroke="#7d8db8" stroke-width="2.2" x="670" y="585" width="280" height="112" rx="20" ry="20" /><text fill="#384366" font-size="22" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="810" y="627" text-anchor="middle" dominant-baseline="middle">否<tspan x="810" dy="29.7">管道 / 消息队列</tspan></text><text fill="#5d6890" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="810" y="677" text-anchor="middle" dominant-baseline="middle">适合中小数据量，结构更简单</text><line stroke="#6b5b4b" stroke-width="2.4" marker-end="url(#arrow)" x1="405" y1="168" x2="330" y2="298" /><text fill="#6b5b4b" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="356" y="230" text-anchor="middle" dominant-baseline="middle">是</text><line stroke="#6b5b4b" stroke-width="2.4" marker-end="url(#arrow)" x1="600" y1="206" x2="600" y2="252" /><text fill="#6b5b4b" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="616" y="232" text-anchor="start" dominant-baseline="middle">否</text><line stroke="#6b5b4b" stroke-width="2.4" marker-end="url(#arrow)" x1="770" y1="298" x2="820" y2="298" /><text fill="#6b5b4b" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="792" y="284" text-anchor="middle" dominant-baseline="middle">否</text><line stroke="#6b5b4b" stroke-width="2.4" marker-end="url(#arrow)" x1="600" y1="344" x2="600" y2="402" /><text fill="#6b5b4b" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="616" y="377" text-anchor="start" dominant-baseline="middle">是</text><line stroke="#6b5b4b" stroke-width="2.4" marker-end="url(#arrow)" x1="530" y1="494" x2="430" y2="585" /><text fill="#6b5b4b" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="476" y="534" text-anchor="middle" dominant-baseline="middle">是</text><line stroke="#6b5b4b" stroke-width="2.4" marker-end="url(#arrow)" x1="670" y1="494" x2="770" y2="585" /><text fill="#6b5b4b" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="720" y="534" text-anchor="middle" dominant-baseline="middle">否</text><text fill="#6e6257" font-size="14" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" x="600" y="758" text-anchor="middle" dominant-baseline="middle">一句话记忆：跨网络选套接字，不跨网络但要传数据时，先看数据量大小；不传数据就选信号量。</text></svg>