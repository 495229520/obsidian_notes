<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Noto Sans CJK SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Checksum / Hash 选型：先问契约，再问吞吐</title><desc id="desc">CRC 是错误检测机制；密码学摘要不自动等于认证；快速指纹不自动等于唯一身份。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#F5F4ED"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">Checksum / Hash 选型：先问契约，再问吞吐</text>
<text x="48" y="80" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">CRC 是错误检测机制；密码学摘要不自动等于认证；快速指纹不自动等于唯一身份。</text>
<rect x="65" y="119" width="210" height="59" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.2"/>
<text x="170.0" y="145.5" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle">格式已经规定算法？</text>
<text x="170.0" y="167.5" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle">先看兼容性约束</text>
<line x1="279" y1="148" x2="352" y2="148" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="317" y="135" font-size="13" fill="#2B2A26" font-weight="600" text-anchor="middle">是</text>
<rect x="359" y="120" width="393" height="57" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="555.5" y="145.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">严格匹配协议参数</text>
<text x="555.5" y="167.5" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle">算法 / 覆盖范围 / 初值 / 字节序</text>
<path d="M 170,181 L 170,224 L 352,224" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="193" y="213" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start">否：允许设计</text>
<rect x="359" y="200" width="220" height="47" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="469.0" y="228.5" font-size="14" fill="#6B4E28" font-weight="600" text-anchor="middle">错误 / 威胁模型</text>
<line x1="583" y1="224" x2="630" y2="224" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="637" y="200" width="231" height="47" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="752.5" y="228.5" font-size="14" fill="#24473F" font-weight="600" text-anchor="middle">输入语义 + 摘要位数</text>
<line x1="872" y1="224" x2="920" y2="224" stroke="#5A564B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="927" y="200" width="247" height="47" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text x="1050.5" y="228.5" font-size="14" fill="#24473F" font-weight="600" text-anchor="middle">可信依据 + 成本验证</text>
<text x="65" y="294" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">算法</text>
<text x="243" y="294" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">常用位数</text>
<text x="365" y="294" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">适用职责</text>
<text x="650" y="294" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">不是它的保证</text>
<text x="971" y="294" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">加速机会</text>
<rect x="54" y="308" width="1132" height="43" rx="0" fill="#FBFBF6"/>
<line x1="54" y1="308" x2="1186" y2="308" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="337" font-size="13.5" fill="#2B2A26" font-weight="600" text-anchor="start">CRC32C</text>
<text x="243" y="337" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">32</text>
<text x="365" y="337" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">协议 / 意外错误检测</text>
<text x="650" y="337" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">防恶意篡改</text>
<text x="971" y="337" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">CRC ISA / folding</text>
<rect x="54" y="357" width="1132" height="43" rx="0" fill="#FBFBF6"/>
<line x1="54" y1="357" x2="1186" y2="357" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="386" font-size="13.5" fill="#2B2A26" font-weight="600" text-anchor="start">XXH64</text>
<text x="243" y="386" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">64</text>
<text x="365" y="386" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">快速分桶 / 指纹</text>
<text x="650" y="386" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">身份数学唯一</text>
<text x="971" y="386" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">整数并行</text>
<rect x="54" y="406" width="1132" height="43" rx="0" fill="#FBFBF6"/>
<line x1="54" y1="406" x2="1186" y2="406" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="435" font-size="13.5" fill="#2B2A26" font-weight="600" text-anchor="start">XXH3</text>
<text x="243" y="435" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">64 / 128</text>
<text x="365" y="435" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">小键 / 大块快速指纹</text>
<text x="650" y="435" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">secret 等于 MAC</text>
<text x="971" y="435" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">SIMD</text>
<rect x="54" y="455" width="1132" height="43" rx="0" fill="#FBFBF6"/>
<line x1="54" y1="455" x2="1186" y2="455" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="484" font-size="13.5" fill="#2B2A26" font-weight="600" text-anchor="start">SHA-256</text>
<text x="243" y="484" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">256</text>
<text x="365" y="484" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">通用密码学摘要</text>
<text x="650" y="484" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">裸 Hash 认证来源</text>
<text x="971" y="484" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">SHA ISA</text>
<rect x="54" y="504" width="1132" height="43" rx="0" fill="#FBFBF6"/>
<line x1="54" y1="504" x2="1186" y2="504" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="65" y="533" font-size="13.5" fill="#2B2A26" font-weight="600" text-anchor="start">BLAKE3</text>
<text x="243" y="533" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">默认 256</text>
<text x="365" y="533" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">树形密码学摘要</text>
<text x="650" y="533" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">普通 update 自动多核</text>
<text x="971" y="533" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start">SIMD / 树并行</text>
<rect x="54" y="579" width="1132" height="45" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text x="620" y="608" font-size="14" fill="#733428" font-weight="600" text-anchor="middle">需要来源认证：另设计 MAC / 签名与可信根；需要新鲜性：另设计版本策略。</text>
<text x="48" y="650" font-size="13" fill="#2B2A26" font-weight="500" text-anchor="start">不同职责可以组合，但不能把 CRC、Hash、MAC 的位数简单相加成“总安全强度”。</text>
</svg>
