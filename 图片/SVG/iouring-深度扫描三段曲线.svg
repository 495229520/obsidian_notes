<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 736" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>iodepth 扫描三段曲线</title>
  <desc>左图为吞吐随 iodepth 先线性增长后在拐点封顶的示意曲线，右图为平均延迟与 p99 延迟在拐点后线性上升的示意曲线，底部为实验纪律清单。示意数据沿用单笔延迟 80 微秒、并行度约 32 的模型。</desc>

  <rect x="0" y="0" width="1240" height="736" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">iodepth 扫描：三段曲线怎么读（示意曲线，非实测）</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">模型沿用 2.3：单笔延迟 80 μs、设备并行度 ≈ 32——曲线形状可迁移，拐点位置必须用自己的机器扫出来</text>

  <!-- 左面板：吞吐 -->
  <rect x="64" y="108" width="536" height="440" rx="8" fill="#FAF9F3" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="88" y="134" font-size="13" font-weight="700" fill="#2B2A26">吞吐 vs 深度</text>
  <text x="88" y="164" font-size="11" fill="#6B675C">千 IOPS（示意）</text>

  <rect x="150" y="180" width="255" height="290" fill="#E1F5EE" opacity="0.45"/>
  <rect x="405" y="180" width="153" height="290" fill="#FAEEDA" opacity="0.5"/>

  <line x1="150" y1="406" x2="558" y2="406" stroke="#DDD9CC" stroke-width="1"/>
  <line x1="150" y1="341" x2="558" y2="341" stroke="#DDD9CC" stroke-width="1"/>
  <line x1="150" y1="277" x2="558" y2="277" stroke="#DDD9CC" stroke-width="1"/>
  <line x1="150" y1="212" x2="558" y2="212" stroke="#DDD9CC" stroke-width="1"/>

  <line x1="150" y1="180" x2="150" y2="470" stroke="#6B675C" stroke-width="1.2"/>
  <line x1="150" y1="470" x2="558" y2="470" stroke="#6B675C" stroke-width="1.2"/>

  <text x="142" y="474" font-size="10" fill="#6B675C" text-anchor="end">0</text>
  <text x="142" y="410" font-size="10" fill="#6B675C" text-anchor="end">100</text>
  <text x="142" y="345" font-size="10" fill="#6B675C" text-anchor="end">200</text>
  <text x="142" y="281" font-size="10" fill="#6B675C" text-anchor="end">300</text>
  <text x="142" y="216" font-size="10" fill="#6B675C" text-anchor="end">400</text>

  <polyline points="150,462 201,454 252,438 303,406 354,344 405,257 456,215 507,212 558,212"
            fill="none" stroke="#3D5A80" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <line x1="405" y1="180" x2="405" y2="470" stroke="#A64B3C" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="405" y="172" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">拐点 QD ≈ 32——设备内部并行度（通道 × 裸片）</text>

  <text x="262" y="205" font-size="10.5" fill="#085041" text-anchor="middle">线性区：加深 ≈ 线性涨吞吐</text>
  <text x="482" y="205" font-size="10.5" fill="#633806" text-anchor="middle">平台区：吞吐封顶</text>

  <text x="150" y="488" font-size="10" fill="#6B675C" text-anchor="middle">1</text>
  <text x="201" y="488" font-size="10" fill="#6B675C" text-anchor="middle">2</text>
  <text x="252" y="488" font-size="10" fill="#6B675C" text-anchor="middle">4</text>
  <text x="303" y="488" font-size="10" fill="#6B675C" text-anchor="middle">8</text>
  <text x="354" y="488" font-size="10" fill="#6B675C" text-anchor="middle">16</text>
  <text x="405" y="488" font-size="10" fill="#6B675C" text-anchor="middle">32</text>
  <text x="456" y="488" font-size="10" fill="#6B675C" text-anchor="middle">64</text>
  <text x="507" y="488" font-size="10" fill="#6B675C" text-anchor="middle">128</text>
  <text x="558" y="488" font-size="10" fill="#6B675C" text-anchor="middle">256</text>
  <text x="354" y="510" font-size="11" fill="#6B675C" text-anchor="middle">iodepth（log₂ 刻度）</text>

  <!-- 右面板：延迟 -->
  <rect x="640" y="108" width="536" height="440" rx="8" fill="#FAF9F3" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="664" y="134" font-size="13" font-weight="700" fill="#2B2A26">延迟 vs 深度：平均与 p99</text>
  <text x="664" y="164" font-size="11" fill="#6B675C">μs（示意）</text>

  <line x1="730" y1="398" x2="1138" y2="398" stroke="#DDD9CC" stroke-width="1"/>
  <line x1="730" y1="325" x2="1138" y2="325" stroke="#DDD9CC" stroke-width="1"/>
  <line x1="730" y1="253" x2="1138" y2="253" stroke="#DDD9CC" stroke-width="1"/>
  <line x1="730" y1="180" x2="1138" y2="180" stroke="#DDD9CC" stroke-width="1"/>

  <line x1="730" y1="180" x2="730" y2="470" stroke="#6B675C" stroke-width="1.2"/>
  <line x1="730" y1="470" x2="1138" y2="470" stroke="#6B675C" stroke-width="1.2"/>

  <text x="722" y="474" font-size="10" fill="#6B675C" text-anchor="end">0</text>
  <text x="722" y="402" font-size="10" fill="#6B675C" text-anchor="end">200</text>
  <text x="722" y="329" font-size="10" fill="#6B675C" text-anchor="end">400</text>
  <text x="722" y="257" font-size="10" fill="#6B675C" text-anchor="end">600</text>
  <text x="722" y="184" font-size="10" fill="#6B675C" text-anchor="end">800</text>

  <polyline points="730,441 781,441 832,441 883,440 934,438 985,435 1036,412 1087,354 1138,238"
            fill="none" stroke="#0F6E56" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="730,437 781,437 832,436 883,433 934,427 985,416 1036,354 1087,245 1138,187"
            fill="none" stroke="#A64B3C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <line x1="985" y1="180" x2="985" y2="470" stroke="#A64B3C" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="985" y="172" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">拐点之前延迟几乎不动，之后按深度线性涨</text>

  <line x1="756" y1="203" x2="784" y2="203" stroke="#0F6E56" stroke-width="2.5"/>
  <text x="792" y="207" font-size="10.5" fill="#085041" text-anchor="start">平均延迟</text>
  <line x1="756" y1="223" x2="784" y2="223" stroke="#A64B3C" stroke-width="2.5"/>
  <text x="792" y="227" font-size="10.5" fill="#733428" text-anchor="start">p99</text>

  <text x="1020" y="300" font-size="10.5" fill="#633806" text-anchor="middle">平台区：延迟 ≈ QD ÷ 平台吞吐</text>
  <text x="1020" y="316" font-size="10.5" fill="#633806" text-anchor="middle">多出的深度全变成排队（2.3）</text>

  <text x="730" y="488" font-size="10" fill="#6B675C" text-anchor="middle">1</text>
  <text x="781" y="488" font-size="10" fill="#6B675C" text-anchor="middle">2</text>
  <text x="832" y="488" font-size="10" fill="#6B675C" text-anchor="middle">4</text>
  <text x="883" y="488" font-size="10" fill="#6B675C" text-anchor="middle">8</text>
  <text x="934" y="488" font-size="10" fill="#6B675C" text-anchor="middle">16</text>
  <text x="985" y="488" font-size="10" fill="#6B675C" text-anchor="middle">32</text>
  <text x="1036" y="488" font-size="10" fill="#6B675C" text-anchor="middle">64</text>
  <text x="1087" y="488" font-size="10" fill="#6B675C" text-anchor="middle">128</text>
  <text x="1138" y="488" font-size="10" fill="#6B675C" text-anchor="middle">256</text>
  <text x="934" y="510" font-size="11" fill="#6B675C" text-anchor="middle">iodepth（log₂ 刻度）</text>

  <!-- 纪律卡 -->
  <rect x="64" y="572" width="1112" height="124" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="88" y="600" font-size="13" font-weight="700" fill="#2B2A26">把曲线读成结论之前，先过四条纪律</text>
  <text x="88" y="624" font-size="11" fill="#4A473F">① direct=1 且文件预先写满——否则测的是页缓存或文件系统的「空洞返零」，不是盘（1.3）</text>
  <text x="88" y="644" font-size="11" fill="#4A473F">② 恒满窗维持深度（2.3），并用 iostat 的 aqu-sz 验证达成深度（9.2）——设了 ≠ 达到了</text>
  <text x="88" y="664" font-size="11" fill="#4A473F">③ 每个点跑 3 次取中位数；ramp_time 越过 SLC 缓存与空盘新鲜态的虚高（3.6）</text>
  <text x="88" y="684" font-size="11" fill="#4A473F">④ 一次只改一个变量；记录内核、设备、文件系统与挂载参数——没有环境快照的数字无法比较</text>
</svg>
