<text id="t37" x="933" y="460" font-size="19" font-weight="700" fill="#2B2A26" text-anchor="middle" data-role="body">+</text>
<text id="t38" x="705" y="518" font-size="15" font-weight="700" fill="#733428" text-anchor="start" data-role="body">只有路径正确 ≠ 整个计算正确</text>
<text id="t39" x="705" y="547" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">绑定性 ≠ 隐藏性 ≠ 对象可信来源</text>
<text id="t40" x="705" y="574" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">这张树是概念示意，非完整 PCP 编译器</text>
<rect x="48" y="618" width="1144" height="54" rx="7" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t41" x="64" y="641" font-size="14" font-weight="700" fill="#4A473F" text-anchor="start" data-role="footer">量词要点：PCP 可靠性约束“假声明下的所有固定证明”，不是对真命题证明的任意翻转都承诺同一检出率。</text>
<text id="t42" x="64" y="662" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">N/q 的概率为本文计数例子；其他几何均为机制示意 · 对应笔记 §3、§4</text>
