<title id="title">PCP 不是原始文件抽样：特殊证明结构 + 先固定再挑战</title>
<desc id="desc">左上少量原始数据抽样可能漏过稀有错误。左下通过结构化证明和查询检查表达PCP直觉，并明确矩阵不是实际编码。右侧先提交root再挑战，检查认证路径和验证谓词两个独立步骤。</desc>
