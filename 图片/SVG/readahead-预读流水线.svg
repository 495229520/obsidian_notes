<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">readahead：内核替你开的预取流水线</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">窗口像 TCP 拥塞窗口一样试探增长；应用消费与设备预取重叠，顺序读只等第一次盘</text>

  <!-- Part A: 窗口增长 -->
  <text x="64" y="134" font-size="14" font-weight="700" fill="#2B2A26">窗口增长：存储版的"慢启动"</text>

  <text x="64" y="172" font-size="11.5" fill="#4A473F">首次未命中</text>
  <rect x="230" y="156" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="259" y="156" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="288" y="156" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="317" y="156" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="366" y="172" font-size="11.5" fill="#6B675C">同步预读：初始窗口 —— 应用在等，索性一并多读几页</text>

  <text x="64" y="216" font-size="11.5" fill="#4A473F">顺序确认 ×1</text>
  <rect x="230" y="200" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="259" y="200" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="288" y="200" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="317" y="200" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="346" y="200" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="2"/>
  <circle cx="359" cy="212" r="3.5" fill="#A64B3C"/>
  <rect x="375" y="200" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="404" y="200" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="433" y="200" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="490" y="216" font-size="11.5" fill="#6B675C">窗口 ×2，并埋下"标记页"（红点）：消费到它就触发下一窗</text>

  <text x="64" y="260" font-size="11.5" fill="#4A473F">顺序确认 ×2</text>
  <rect x="230" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="259" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="288" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="317" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="346" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="375" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="404" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="433" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="2"/>
  <circle cx="446" cy="256" r="3.5" fill="#A64B3C"/>
  <rect x="462" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="491" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="520" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="549" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="578" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="607" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="636" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="665" y="244" width="26" height="24" rx="3" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="724" y="260" font-size="11.5" fill="#6B675C">增长到 read_ahead_kb 上限（常见默认 128 KiB）</text>

  <!-- Part B: 流水线 -->
  <text x="64" y="326" font-size="14" font-weight="700" fill="#2B2A26">流水线：消费与预取重叠（生产者-消费者）</text>

  <text x="64" y="398" font-size="12" font-weight="700" fill="#3D5A80">应用（消费者）</text>
  <text x="64" y="492" font-size="12" font-weight="700" fill="#B07D2B">内核+设备（生产者）</text>

  <rect x="230" y="370" width="150" height="44" rx="7" fill="#ECEAE0" stroke="#8A8574" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="305" y="389" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">阻塞等待</text>
  <text x="305" y="405" font-size="10.5" fill="#6B675C" text-anchor="middle">唯一一次等盘</text>

  <rect x="400" y="370" width="230" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="515" y="389" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">消费页 0–7</text>
  <text x="515" y="405" font-size="10.5" fill="#24473F" text-anchor="middle">全命中，只剩 CPU 拷贝</text>

  <rect x="650" y="370" width="230" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="765" y="389" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">消费页 8–15</text>
  <text x="765" y="405" font-size="10.5" fill="#24473F" text-anchor="middle">依旧全命中</text>

  <rect x="900" y="370" width="230" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1015" y="389" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">消费页 16–31 …</text>
  <text x="1015" y="405" font-size="10.5" fill="#24473F" text-anchor="middle">流水线稳定运转</text>

  <rect x="230" y="465" width="150" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="305" y="484" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">同步读 0–7</text>
  <text x="305" y="500" font-size="10.5" fill="#733428" text-anchor="middle">应用在等这一次</text>

  <rect x="470" y="465" width="180" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="560" y="484" font-size="12" font-weight="700" fill="#7A5518" text-anchor="middle">异步预读 8–15</text>
  <text x="560" y="500" font-size="10.5" fill="#7A5518" text-anchor="middle">与消费重叠进行</text>

  <rect x="720" y="465" width="180" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="810" y="484" font-size="12" font-weight="700" fill="#7A5518" text-anchor="middle">异步预读 16–31</text>
  <text x="810" y="500" font-size="10.5" fill="#7A5518" text-anchor="middle">窗口继续滑动</text>

  <rect x="970" y="465" width="160" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="1050" y="484" font-size="12" font-weight="700" fill="#7A5518" text-anchor="middle">异步预读 32–…</text>

  <path d="M382,465 C394,450 397,432 400,418" fill="none" stroke="#5A564B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M470,414 C470,438 478,448 484,461" fill="none" stroke="#2F6B5E" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrt)"/>
  <text x="452" y="444" font-size="10.5" fill="#2F6B5E" text-anchor="end">碰到标记页 → 触发下一窗</text>
  <path d="M720,414 C720,438 728,448 734,461" fill="none" stroke="#2F6B5E" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrt)"/>

  <line x1="230" y1="545" x2="1180" y2="545" stroke="#8A8574" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="1128" y="566" font-size="11.5" fill="#6B675C">时间 →</text>

  <!-- Part C: 三种局面 -->
  <rect x="64" y="600" width="360" height="104" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="86" y="628" font-size="13" font-weight="700" fill="#24473F">跟上了：read 不再阻塞</text>
  <text x="86" y="654" font-size="11.5" fill="#24473F">缓存里永远有货，read 只剩一次 CPU 拷贝</text>
  <text x="86" y="676" font-size="11.5" fill="#24473F">生产者稳定领先消费者一个窗口</text>

  <rect x="444" y="600" width="360" height="104" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="466" y="628" font-size="13" font-weight="700" fill="#7A5518">断流了：阻塞在 folio 锁上</text>
  <text x="466" y="654" font-size="11.5" fill="#7A5518">消费者在"条件变量"上等生产者（1.2）</text>
  <text x="466" y="676" font-size="11.5" fill="#7A5518">原因：设备带宽不够，或窗口上限太小</text>

  <rect x="824" y="600" width="360" height="104" rx="8" fill="#EFEDE3" stroke="#8A8574" stroke-width="1.5"/>
  <text x="846" y="628" font-size="13" font-weight="700" fill="#2B2A26">随机访问：预读是纯浪费</text>
  <text x="846" y="654" font-size="11.5" fill="#4A473F">内核检测到不连续会收缩窗口</text>
  <text x="846" y="676" font-size="11.5" fill="#4A473F">fadvise(RANDOM) 可显式关闭（见正文）</text>
</svg>
