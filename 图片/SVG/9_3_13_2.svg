<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #23313f; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #627282; }
      .node-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; fill: #435363; }
      .tag { font-size: 13px; font-weight: 650; fill: #586678; }
      .question { font-size: 15px; fill: #334155; }
    </style>
  </defs>

  <text x="56" y="54" class="title">GEMM Lab 的三条证据链</text>
  <text x="56" y="83" class="subtitle">每个实现都必须走过同一条路：算对、测准、解释清楚</text>

  <rect x="76" y="158" width="170" height="110" rx="8" fill="#e8f0f6" stroke="#8eaecd" stroke-width="2"/>
  <text x="104" y="196" class="node-title">Reference</text>
  <text x="104" y="225" class="body">CPU / PyTorch</text>
  <text x="104" y="248" class="body">固定随机种子</text>

  <rect x="318" y="138" width="190" height="150" rx="8" fill="#e9f3e4" stroke="#92b47e" stroke-width="2"/>
  <text x="354" y="176" class="node-title">Correctness</text>
  <text x="350" y="207" class="body">max abs error</text>
  <text x="350" y="230" class="body">RMS error</text>
  <text x="350" y="253" class="body">pass / fail</text>

  <rect x="580" y="138" width="190" height="150" rx="8" fill="#f4ead7" stroke="#c8a966" stroke-width="2"/>
  <text x="625" y="176" class="node-title">Benchmark</text>
  <text x="612" y="207" class="body">warmup / repeat</text>
  <text x="612" y="230" class="body">CUDA event timing</text>
  <text x="612" y="253" class="body">TFLOPS / ratio</text>

  <rect x="842" y="138" width="190" height="150" rx="8" fill="#efe8f6" stroke="#ad94c8" stroke-width="2"/>
  <text x="884" y="176" class="node-title">Profiling</text>
  <text x="874" y="207" class="body">occupancy</text>
  <text x="874" y="230" class="body">register count</text>
  <text x="874" y="253" class="body">stall reason</text>

  <line x1="258" y1="213" x2="304" y2="213" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="520" y1="213" x2="566" y2="213" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="782" y1="213" x2="828" y2="213" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="156" y="358" width="808" height="116" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="205" y="397" class="tag">结论模板</text>
  <text x="205" y="431" class="question">现象：tiled CUDA 比 naive 快</text>
  <text x="444" y="431" class="question">证据：global load 减少 / SM 更忙</text>
  <text x="205" y="459" class="question">解释：A/B tile 被 block 内复用</text>
  <text x="444" y="459" class="question">限制：仍远低于 cuBLAS 的工业优化</text>
</svg>
