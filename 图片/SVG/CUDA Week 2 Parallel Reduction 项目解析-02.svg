<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
  <title id="title">Week 2 当前 reduction 数据流</title>
  <desc id="desc">输入在 GPU 上按 block 归约为 partial sums，再通过 cudaMemcpy 拷回 CPU 做最终累加。</desc>
  <rect x="0" y="0" width="1040" height="470" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="520" y="34" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#0C447C">当前实现：GPU 产生 partial sums，CPU 做最终汇总</text>
  <text x="520" y="60" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#444441">这解释了为什么 benchmark 不能被误读为纯 kernel-only 时间</text>

  <!-- GPU device container -->
  <rect x="32" y="92" width="746" height="300" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <text x="56" y="116" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#0C447C">GPU device</text>
  <text x="746" y="116" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#185FA5">grid = num_blocks 个 block 并行</text>

  <!-- input row -->
  <rect x="64" y="140" width="142" height="54" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <text x="135" y="159" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#633806">input[0..255]</text>
  <text x="135" y="178" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#633806">Block 0</text>

  <rect x="240" y="140" width="142" height="54" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <text x="311" y="159" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#633806">input[256..511]</text>
  <text x="311" y="178" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#633806">Block 1</text>

  <rect x="416" y="140" width="142" height="54" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <text x="487" y="159" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">· · ·</text>
  <text x="487" y="178" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#633806">更多 block</text>

  <rect x="592" y="140" width="142" height="54" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <text x="663" y="159" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#633806">input[last]</text>
  <text x="663" y="178" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#633806">边界补 0</text>

  <line x1="135" y1="194" x2="135" y2="252" stroke="#5F5E5A" stroke-width="1.7" marker-end="url(#arrow)"/>
  <line x1="311" y1="194" x2="311" y2="252" stroke="#5F5E5A" stroke-width="1.7" marker-end="url(#arrow)"/>
  <line x1="487" y1="194" x2="487" y2="252" stroke="#5F5E5A" stroke-width="1.7" marker-end="url(#arrow)"/>
  <line x1="663" y1="194" x2="663" y2="252" stroke="#5F5E5A" stroke-width="1.7" marker-end="url(#arrow)"/>

  <!-- block reduce row -->
  <rect x="64" y="252" width="142" height="60" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="135" y="272" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">block reduce</text>
  <text x="135" y="294" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">partial[0]</text>

  <rect x="240" y="252" width="142" height="60" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="311" y="272" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">block reduce</text>
  <text x="311" y="294" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">partial[1]</text>

  <rect x="416" y="252" width="142" height="60" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="487" y="272" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041">· · ·</text>
  <text x="487" y="294" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">partial[k]</text>

  <rect x="592" y="252" width="142" height="60" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="663" y="272" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">block reduce</text>
  <text x="663" y="294" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">partial[last]</text>

  <rect x="64" y="338" width="670" height="34" rx="8" fill="#EFEAFB" stroke="#534AB7" stroke-width="1"/>
  <text x="399" y="356" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">d_partial：每个 block 写出一个 partial sum（存放在 GPU global memory）</text>

  <!-- cudaMemcpy boundary -->
  <line x1="778" y1="282" x2="852" y2="282" stroke="#5F5E5A" stroke-width="1.9" marker-end="url(#arrow)"/>
  <text x="815" y="262" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#444441">cudaMemcpy</text>
  <text x="815" y="300" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5F5E5A">D2H</text>

  <!-- CPU host container -->
  <rect x="858" y="150" width="150" height="242" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
  <text x="933" y="174" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#444441">CPU host</text>

  <rect x="876" y="252" width="114" height="60" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="933" y="273" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#3C3489">累加 partials</text>
  <text x="933" y="294" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#3C3489">double 累加</text>

  <line x1="933" y1="312" x2="933" y2="344" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="876" y="344" width="114" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="933" y="362" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0C447C">最终 sum</text>
</svg>
