<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" role="img" aria-labelledby="title desc">
  <title id="title">Week 2 当前 reduction 数据流</title>
  <desc id="desc">输入在 GPU 上按 block 归约为 partial sums，再拷回 CPU 做最终累加。</desc>
  <rect x="0" y="0" width="1040" height="460" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="520" y="34" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" font-weight="500" fill="#0C447C">当前实现：GPU 产生 partial sums，CPU 做最终汇总</text>
  <text x="520" y="60" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">这解释了为什么 benchmark 不能被误读为纯 kernel-only 时间</text>

  <path d="M40 92H770Q778 92 778 100V372Q778 380 770 380H40Q32 380 32 372V100Q32 92 40 92Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="405" y="116" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">GPU device</text>

  <rect x="80" y="146" width="120" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="140" y="164" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">input[0..255]</text>
  <text x="140" y="184" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">Block 0</text>

  <rect x="260" y="146" width="120" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="320" y="164" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">input[256..511]</text>
  <text x="320" y="184" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">Block 1</text>

  <rect x="440" y="146" width="120" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="500" y="164" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">...</text>
  <text x="500" y="184" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">更多 block</text>

  <rect x="620" y="146" width="120" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="680" y="164" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">input[last]</text>
  <text x="680" y="184" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">边界补 0</text>

  <line x1="140" y1="198" x2="140" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="198" x2="320" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="198" x2="500" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="198" x2="680" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="260" width="120" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="140" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">block reduce</text>
  <text x="140" y="302" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">partial[0]</text>

  <rect x="260" y="260" width="120" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="320" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">block reduce</text>
  <text x="320" y="302" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">partial[1]</text>

  <rect x="440" y="260" width="120" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="500" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">...</text>
  <text x="500" y="302" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">partial[k]</text>

  <rect x="620" y="260" width="120" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="680" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">block reduce</text>
  <text x="680" y="302" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">partial[last]</text>

  <text x="405" y="352" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">d_partial：每个 block 写出一个 partial sum</text>

  <line x1="778" y1="289" x2="850" y2="289" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="814" y="268" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">cudaMemcpy</text>

  <path d="M858 214H1000Q1008 214 1008 222V374Q1008 382 1000 382H858Q850 382 850 374V222Q850 214 858 214Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="929" y="242" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441">CPU host</text>
  <rect x="864" y="278" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="929" y="300" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">累加 partials</text>
  <line x1="929" y1="322" x2="929" y2="348" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="929" y="362" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">最终 sum</text>
</svg>
