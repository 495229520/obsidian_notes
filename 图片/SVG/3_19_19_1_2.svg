<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>RX 内存：描述符可复用，不代表旧 payload 已经无人使用</title><desc>左侧画两次资源快照；右侧画 skb 与数据存储。矩形面积不代表真实字节比例。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker><marker id="ctrl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="51" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">RX 内存：描述符可复用，不代表旧 payload 已经无人使用</text>
<text x="48" y="80" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">左侧画两次资源快照；右侧画 skb 与数据存储。矩形面积不代表真实字节比例。</text>
<rect x="48" y="112" width="580" height="492" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="140" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · RX slot 的生命周期</text>
<text x="72" y="170" font-size="13" font-weight="700" fill="#3D5A80" text-anchor="start">t0 · 交给设备</text>
<rect x="80" y="187" width="65" height="42" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="112" y="214" font-size="12.5" font-weight="400" fill="#2B2A26" text-anchor="middle">desc 0</text>
<rect x="158" y="187" width="65" height="42" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="190" y="214" font-size="12.5" font-weight="400" fill="#2B2A26" text-anchor="middle">desc 1</text>
<rect x="236" y="187" width="65" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="268" y="214" font-size="12.5" font-weight="400" fill="#2B2A26" text-anchor="middle">desc 2</text>
<rect x="314" y="187" width="65" height="42" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="346" y="214" font-size="12.5" font-weight="400" fill="#2B2A26" text-anchor="middle">desc 3</text>
<text x="83" y="251" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start">主机内存中的 RX Ring</text>
<rect x="443" y="180" width="154" height="63" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="520.0" y="205.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">Page A</text>
<text x="520.0" y="227.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle">设备可写区域</text>
<path d="M 268,232 L 268,264 L 425,264 L 425,212 L 439,212" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="347" y="279" font-size="11.5" font-weight="400" fill="#3D5A80" text-anchor="middle">DMA 地址</text>
<text x="72" y="298" font-size="13" font-weight="700" fill="#2F6B5E" text-anchor="start">t1 · 完成后，内核接管旧数据</text>
<rect x="80" y="316" width="196" height="58" rx="7" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="178.0" y="339.0" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">desc 2 · 已消费</text>
<text x="178.0" y="361.0" font-size="12.5" font-weight="400" fill="#6B4E28" text-anchor="middle">slot 等待补充</text>
<rect x="443" y="312" width="154" height="65" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="520.0" y="338.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">Page A</text>
<text x="520.0" y="360.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle">skb / TCP 持有</text>
<path d="M 279,345 L 439,345" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="345" y="333" font-size="12" font-weight="400" fill="#2F6B5E" text-anchor="middle">引用移交</text>
<text x="72" y="425" font-size="13" font-weight="700" fill="#3D5A80" text-anchor="start">t2 · 同一 slot 指向新的可写区域</text>
<rect x="80" y="445" width="196" height="61" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="178.0" y="469.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">desc 2 · 已 refill</text>
<text x="178.0" y="491.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle">可再次交给 NIC</text>
<rect x="443" y="436" width="154" height="53" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="520.0" y="456.5" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">Page B</text>
<text x="520.0" y="478.5" font-size="12.5" font-weight="400" fill="#2C4460" text-anchor="middle">新接收区域</text>
<path d="M 280,470 L 350,470 L 350,462 L 439,462" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="443" y="521" width="154" height="53" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="520.0" y="541.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">Page A</text>
<text x="520.0" y="563.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle">最后引用未释放</text>
<path d="M 520,380 L 615,380 L 615,548 L 601,548" fill="none" stroke="#8A6A3A" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ctrl)"/>
<text x="80" y="543" font-size="14" font-weight="700" fill="#3D5A80" text-anchor="start">Ring slot 周转</text>
<text x="80" y="567" font-size="13" font-weight="400" fill="#733428" text-anchor="start">≠ 同一页立即重新 DMA 写入</text>
<rect x="652" y="112" width="540" height="492" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="672" y="140" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · skb 是元数据，不是整包本体</text>
<rect x="679" y="166" width="210" height="163" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="784.0" y="208.5" font-size="14" font-weight="700" fill="#51416D" text-anchor="middle">struct sk_buff</text>
<text x="784.0" y="230.5" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">len / data_len</text>
<text x="784.0" y="252.5" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">head / data</text>
<text x="784.0" y="274.5" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">tail / end</text>
<text x="784.0" y="296.5" font-size="12.5" font-weight="400" fill="#51416D" text-anchor="middle">truesize / 引用</text>
<rect x="928" y="173" width="235" height="57" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1045.5" y="195.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">线性存储区</text>
<text x="1045.5" y="217.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle">head 指向起点</text>
<rect x="928" y="269" width="235" height="57" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1045.5" y="291.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">页片段</text>
<text x="1045.5" y="313.5" font-size="12.5" font-weight="400" fill="#24473F" text-anchor="middle">frags[] 引用</text>
<path d="M 890,208 L 924,208" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 890,296 L 924,296" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="680" y="372" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start">线性存储：指针/偏移边界</text>
<rect x="680" y="414" width="68" height="56" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="714.0" y="447" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">headroom</text>
<rect x="748" y="414" width="190" height="56" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="843.0" y="447" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">线性有效数据</text>
<rect x="938" y="414" width="90" height="56" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="983.0" y="447" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">tailroom</text>
<rect x="1028" y="414" width="134" height="56" rx="0" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1095.0" y="447" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">shared_info</text>
<text x="680" y="395" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle">head</text>
<path d="M 680,399 L 680,411" fill="none" stroke="#5A564B" stroke-width="1.7"/>
<text x="748" y="395" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle">data</text>
<path d="M 748,399 L 748,411" fill="none" stroke="#5A564B" stroke-width="1.7"/>
<text x="938" y="395" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle">tail</text>
<path d="M 938,399 L 938,411" fill="none" stroke="#5A564B" stroke-width="1.7"/>
<text x="1028" y="395" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle">end</text>
<path d="M 1028,399 L 1028,411" fill="none" stroke="#5A564B" stroke-width="1.7"/>
<text x="680" y="495" font-size="13" font-weight="400" fill="#2F6B5E" text-anchor="start">len = 线性长度 + data_len</text>
<rect x="697" y="528" width="171" height="47" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="782.5" y="556.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">非线性 page 0</text>
<rect x="899" y="528" width="171" height="47" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="984.5" y="556.5" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">非线性 page 1</text>
<path d="M 1095,472 L 1095,513 L 782,513 L 782,524" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M 1095,513 L 985,513 L 985,524" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="48" y="635" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start">读图规则</text>
<text x="157" y="635" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start">slot 生命周期、DMA 可访问区域、page 引用计数：分开推理，再检查交接处。</text>
<text x="48" y="684" font-size="12.5" font-weight="400" fill="#6B675C" text-anchor="start">Page A/B 是不同可写区域的示意，不要求每轮分配整页；页池、页片段复用与 copybreak 取决于驱动。</text>
</svg>