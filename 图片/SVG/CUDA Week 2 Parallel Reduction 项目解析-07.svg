<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">CUDA_CHECK 错误处理流</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">07 CUDA_CHECK：宏捕获调用点，函数执行检查</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“6. 基础设施：cuda_check.cuh”中</text>
<rect x="80" y="230" width="230" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="80" y="230" width="230" height="8" rx="18" fill="#2563EB" opacity="1"/>
<text x="100" y="264" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">CUDA Runtime API</text>
<text x="100" y="294" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cudaMalloc</text>
<text x="100" y="315" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cudaMemcpy</text>
<text x="100" y="336" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cudaEvent</text>
<text x="100" y="357" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cudaGetLastError</text>
<rect x="365" y="230" width="230" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="365" y="230" width="230" height="8" rx="18" fill="#7C3AED" opacity="1"/>
<text x="385" y="264" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">CUDA_CHECK(expr)</text>
<text x="385" y="294" font-size="14" font-weight="400" fill="#334155" text-anchor="start">传入 status + #expr + __FILE__ + __LINE__</text>
<rect x="670" y="230" width="230" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="670" y="230" width="230" height="8" rx="18" fill="#F59E0B" opacity="1"/>
<text x="690" y="264" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">check_cuda(...)</text>
<text x="690" y="294" font-size="14" font-weight="400" fill="#334155" text-anchor="start">status == cudaSuccess ? return : throw runtime_error</text>
<rect x="975" y="230" width="230" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="975" y="230" width="230" height="8" rx="18" fill="#059669" opacity="1"/>
<text x="995" y="264" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">RAII 清理链</text>
<text x="995" y="294" font-size="14" font-weight="400" fill="#334155" text-anchor="start">异常传播时 DeviceBuffer 析构释放 cudaFree</text>
<line x1="310" y1="305" x2="365" y2="305" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="595" y1="305" x2="650" y2="305" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="900" y1="305" x2="955" y2="305" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 785 380 C 790 490 965 500 1030 380" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowOrange)"/>
<rect x="790" y="500" width="260" height="34" rx="17.0" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" opacity="1"/>
<text x="920.0" y="522.0" font-size="13" font-weight="700" fill="#DC2626" text-anchor="middle">error path：包含错误名、表达式、源码位置</text>
<rect x="130" y="465" width="520" height="120" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="148" y="493" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="start">宏只负责调用点信息</text>
<text x="148" y="520" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">#define CUDA_CHECK(expr) \</text>
<text x="148" y="540" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">  check_cuda((expr), #expr, __FILE__, __LINE__)</text>
<text x="148" y="560" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">// kernel launch 后：cudaGetLastError + cudaDeviceSynchronize</text>
<rect x="700" y="465" width="400" height="120" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="718" y="493" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="start">函数负责类型安全检查</text>
<text x="718" y="520" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">throw std::runtime_error(</text>
<text x="718" y="540" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="start" class="mono">  &quot;CUDA error: ...\n expression: ...\n location: file:line&quot;);</text>
</svg>
