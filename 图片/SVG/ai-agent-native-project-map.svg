<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Native 项目总图</title>
  <desc id="desc">按能力主线和项目阶段重绘的项目总图，减少交叉线，突出依赖路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2937; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .laneTitle { font-size: 20px; font-weight: 700; fill: #ffffff; }
      .colTitle { font-size: 20px; font-weight: 700; }
      .tag { font-size: 13px; fill: #475569; }
      .cardTitle { font-size: 18px; font-weight: 700; }
      .cardText { font-size: 14px; fill: #475569; }
      .foot { font-size: 13px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>

  <text class="title" x="60" y="58">项目总图</text>
  <text class="subtitle" x="60" y="88">把原来“能力线 + 项目依赖”混在一起的 Mermaid，改成左侧能力主线、右侧项目阶段、底部作品集出口的结构。</text>

  <rect x="60" y="130" width="250" height="690" rx="24" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <text class="colTitle" x="92" y="168">能力主线</text>
  <text class="tag" x="92" y="192">每条主线连接到它重点支撑的项目</text>

  <rect x="92" y="220" width="186" height="90" rx="18" fill="#2563eb"/>
  <text class="laneTitle" x="185" y="258" text-anchor="middle">Agent 工程流</text>
  <text x="185" y="285" text-anchor="middle" fill="#dbeafe" style="font-size:14px;">workflow / review / 自动化</text>

  <rect x="92" y="340" width="186" height="90" rx="18" fill="#0f766e"/>
  <text class="laneTitle" x="185" y="378" text-anchor="middle">Kernel 能力</text>
  <text x="185" y="405" text-anchor="middle" fill="#ccfbf1" style="font-size:14px;">CUDA / Triton / 算子</text>

  <rect x="92" y="460" width="186" height="90" rx="18" fill="#7c3aed"/>
  <text class="laneTitle" x="185" y="498" text-anchor="middle">GPU Profiling</text>
  <text x="185" y="525" text-anchor="middle" fill="#ede9fe" style="font-size:14px;">Nsight / benchmark / 诊断</text>

  <rect x="92" y="580" width="186" height="90" rx="18" fill="#ea580c"/>
  <text class="laneTitle" x="185" y="618" text-anchor="middle">LLM 推理系统</text>
  <text x="185" y="645" text-anchor="middle" fill="#ffedd5" style="font-size:14px;">serving / KV cache / 调度</text>

  <rect x="92" y="700" width="186" height="90" rx="18" fill="#be123c"/>
  <text class="laneTitle" x="185" y="738" text-anchor="middle">推理成本优化</text>
  <text x="185" y="765" text-anchor="middle" fill="#ffe4e6" style="font-size:14px;">TTFT / TPOT / TPS / cost</text>

  <rect x="360" y="130" width="1180" height="690" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="colTitle" x="392" y="168">项目阶段</text>
  <text class="tag" x="392" y="192">从暑期实习版到秋招增强版，项目依赖按列展开</text>

  <line x1="753" y1="210" x2="753" y2="790" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="1146" y1="210" x2="1146" y2="790" stroke="#e2e8f0" stroke-width="2"/>

  <text class="colTitle" x="430" y="230">阶段一 · 起步项目</text>
  <text class="colTitle" x="820" y="230">阶段二 · 强化项目</text>
  <text class="colTitle" x="1210" y="230">阶段三 · 作品集收口</text>

  <rect x="410" y="270" width="300" height="110" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="cardTitle" x="430" y="306">agentic-cuda-kernel-playground</text>
  <text class="cardText" x="430" y="332">基础 CUDA kernel + benchmark</text>
  <text class="cardText" x="430" y="353">也是 Agent workflow 的起点</text>

  <rect x="410" y="410" width="300" height="110" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="cardTitle" x="430" y="446">torch-triton-rmsnorm</text>
  <text class="cardText" x="430" y="472">第一个真正贴近 LLM 的</text>
  <text class="cardText" x="430" y="493">CUDA + Triton 小算子项目</text>

  <rect x="410" y="550" width="300" height="110" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="cardTitle" x="430" y="586">llm-inference-cost-lab-v0</text>
  <text class="cardText" x="430" y="612">开始记录 TTFT / TPOT / TPS</text>
  <text class="cardText" x="430" y="633">和 cost</text>

  <rect x="802" y="260" width="300" height="110" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="cardTitle" x="822" y="296">matmul-lab-cuda-triton-cutlass</text>
  <text class="cardText" x="822" y="322">系统比较 CUDA / Triton / CUTLASS</text>
  <text class="cardText" x="822" y="343">和 cuBLAS 的差异</text>

  <rect x="802" y="400" width="300" height="110" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="cardTitle" x="822" y="436">tiny-llm-kernels</text>
  <text class="cardText" x="822" y="462">收集 RMSNorm / RoPE / Softmax</text>
  <text class="cardText" x="822" y="483">sampling / dequant 等算子</text>

  <rect x="802" y="540" width="300" height="110" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="cardTitle" x="822" y="576">llm-serving-cost-benchmark</text>
  <text class="cardText" x="822" y="602">对比 vLLM / SGLang / TensorRT-LLM</text>
  <text class="cardText" x="822" y="623">的吞吐、延迟和成本</text>

  <rect x="802" y="680" width="300" height="110" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="cardTitle" x="822" y="716">agentic-infra-workflow</text>
  <text class="cardText" x="822" y="742">沉淀 CLAUDE.md / prompts</text>
  <text class="cardText" x="822" y="763">和 correctness / review 流程</text>

  <rect x="1194" y="310" width="300" height="110" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="cardTitle" x="1214" y="346">llm-kernel-benchmark-suite</text>
  <text class="cardText" x="1214" y="372">统一展示 kernel、benchmark</text>
  <text class="cardText" x="1214" y="393">和 profiling 能力</text>

  <rect x="1194" y="470" width="300" height="110" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="cardTitle" x="1214" y="506">mini-vllm-style-kv-cache</text>
  <text class="cardText" x="1214" y="532">用 toy engine 证明你理解</text>
  <text class="cardText" x="1214" y="553">推理调度和 KV cache</text>

  <rect x="1194" y="630" width="300" height="110" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="cardTitle" x="1214" y="666">秋招作品集</text>
  <text class="cardText" x="1214" y="692">把 kernel、serving、成本、</text>
  <text class="cardText" x="1214" y="713">Agent 工程流汇成一个故事</text>

  <path d="M278 265 C320 270, 360 285, 410 305" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M278 380 C320 365, 360 338, 410 325" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M278 385 C322 400, 362 430, 410 465" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M278 500 C320 450, 360 385, 410 345" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M278 620 C322 618, 366 612, 410 605" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M278 740 C320 712, 364 650, 410 625" stroke="#be123c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <path d="M710 325 C748 322, 776 318, 802 315" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M710 465 C748 462, 776 458, 802 455" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M710 605 C748 602, 776 598, 802 595" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M710 325 C742 390, 770 560, 802 715" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M1102 315 C1136 322, 1164 334, 1194 345" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1102 455 C1136 422, 1164 392, 1194 365" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1102 595 C1136 574, 1164 546, 1194 525" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1102 715 C1134 640, 1164 470, 1194 385" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1102 715 C1134 660, 1164 565, 1194 545" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <line x1="1344" y1="420" x2="1344" y2="470" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1344" y1="580" x2="1344" y2="630" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="foot" x="60" y="930">阅读顺序：左边看“你要练什么”，中间看“先做哪些项目”，右边看“最后如何汇成作品集”。这样能显著减少原 Mermaid 的交叉感。</text>
</svg>
