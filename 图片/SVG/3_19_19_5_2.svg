<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">XDP_REDIRECT：目标类型决定后端与责任边界</title><desc id="desc">并列展示 DEVMAP、CPUMAP 与 XSKMAP 的目标对象、执行主体与检查边界。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">XDP_REDIRECT：目标类型决定后端与责任边界</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">map 存目标引用；选择目标不等于交付成功。三种后端保留不同的执行与资源约束。</text>
<rect x="48" y="118" width="1144" height="145" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="145" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">A · DEVMAP / DEVMAP_HASH</text>
<rect x="77" y="166" width="215" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="184.5" y="186.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="77,166,215,52">设备引用</text>
<text x="184.5" y="207.5" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="77,166,215,52">由 map 选择 netdev</text>
<rect x="418" y="166" width="283" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="559.5" y="186.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="418,166,283,52">目标设备 TX</text>
<text x="559.5" y="207.5" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="418,166,283,52">驱动与硬件发送</text>
<rect x="851" y="166" width="305" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1003.5" y="186.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="851,166,305,52">发往网络</text>
<text x="1003.5" y="207.5" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="851,166,305,52">报文仍需正确</text>
<path d="M292,192 L412,192" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M701,192 L845,192" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="354" y="179" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-region="body">入队 / 交接</text>
<text x="776" y="179" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-region="body">后端推进</text>
<text x="77" y="245" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">边界：不是自动路由；下一跳、TTL、邻居与校验和由设计明确负责。</text>
<rect x="48" y="281" width="1144" height="145" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="308" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">B · CPUMAP</text>
<rect x="77" y="329" width="215" height="52" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="184.5" y="349.5" font-size="14" fill="#4A3F68" font-weight="700" text-anchor="middle" data-region="body" data-box="77,329,215,52">CPU 处理队列</text>
<text x="184.5" y="370.5" font-size="12.5" fill="#4A3F68" font-weight="400" text-anchor="middle" data-region="body" data-box="77,329,215,52">迁移后续工作</text>
<rect x="418" y="329" width="283" height="52" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="559.5" y="349.5" font-size="14" fill="#4A3F68" font-weight="700" text-anchor="middle" data-region="body" data-box="418,329,283,52">目标内核线程</text>
<text x="559.5" y="370.5" font-size="12.5" fill="#4A3F68" font-weight="400" text-anchor="middle" data-region="body" data-box="418,329,283,52">可接二级 XDP</text>
<rect x="851" y="329" width="305" height="52" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1003.5" y="349.5" font-size="14" fill="#4A3F68" font-weight="700" text-anchor="middle" data-region="body" data-box="851,329,305,52">后续处理</text>
<text x="1003.5" y="370.5" font-size="12.5" fill="#4A3F68" font-weight="400" text-anchor="middle" data-region="body" data-box="851,329,305,52">或进入 skb 路径</text>
<path d="M292,355 L412,355" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M701,355 L845,355" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="354" y="342" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-region="body">入队 / 交接</text>
<text x="776" y="342" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-region="body">后端推进</text>
<text x="77" y="408" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">边界：初始 RX 轮询与 DMA 已经发生；目标 CPU 不等于硬件 RX queue。</text>
<rect x="48" y="444" width="1144" height="145" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="471" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">C · XSKMAP</text>
<rect x="77" y="492" width="215" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="184.5" y="512.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-region="body" data-box="77,492,215,52">已绑定的 XSK</text>
<text x="184.5" y="533.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body" data-box="77,492,215,52">socket 引用</text>
<rect x="418" y="492" width="283" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="559.5" y="512.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-region="body" data-box="418,492,283,52">AF_XDP 接收</text>
<text x="559.5" y="533.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body" data-box="418,492,283,52">检查来源设备 / queue</text>
<rect x="851" y="492" width="305" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1003.5" y="512.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-region="body" data-box="851,492,305,52">用户态 worker</text>
<text x="1003.5" y="533.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body" data-box="851,492,305,52">消费 RX 描述符</text>
<path d="M292,518 L412,518" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M701,518 L845,518" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="354" y="505" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-region="body">入队 / 交接</text>
<text x="776" y="505" font-size="12" fill="#6B675C" font-weight="400" text-anchor="middle" data-region="body">后端推进</text>
<text x="77" y="571" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">边界：还需要正确绑定与 UMEM 供应；下标不负责硬件 queue steering。</text>
<rect x="48" y="632" width="1144" height="38" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="657" font-size="13" fill="#4A473F" font-weight="400" text-anchor="start" data-region="caption">Native 典型实现：helper 准备目标 → 驱动 xdp_do_redirect() → xdp_do_flush()；失败需在对应后端观测。</text>
</svg>
