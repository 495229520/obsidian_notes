<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">GPU 内存层次与三种 reduction 的映射</title>
  <desc id="desc">从 Registers 到 Global Memory 延迟逐层升高、容量逐层增大；warp shuffle 在寄存器、shared memory 在片上 SRAM、naive 直接打 global memory，因此性能依次递减。</desc>
  <rect x="0" y="0" width="1040" height="560" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="520" y="34" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#0C447C">GPU 内存层次与三种 reduction 的映射</text>
  <text x="520" y="60" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#444441">通信介质所在的层级，直接决定了 naive / shared / shuffle 的延迟与性能差距</text>

  <!-- pyramid tiers -->
  <!-- tier 1 Registers -->
  <rect x="210" y="120" width="180" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
  <text x="226" y="152" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3C3489">Registers</text>
  <text x="374" y="152" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#534AB7">~1 cyc · 64KB/SM</text>

  <!-- tier 2 Shared Memory -->
  <rect x="170" y="192" width="260" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="186" y="224" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#085041">Shared Memory</text>
  <text x="414" y="224" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0F6E56">~20-30 cyc · 48-96KB/SM</text>

  <!-- tier 3 L1 -->
  <rect x="130" y="264" width="340" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <text x="146" y="296" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0C447C">L1 Cache</text>
  <text x="454" y="296" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#185FA5">~30-40 cyc · 自动缓存</text>

  <!-- tier 4 L2 -->
  <rect x="90" y="336" width="420" height="64" rx="8" fill="#EDF2F8" stroke="#6E8AAE" stroke-width="1.3"/>
  <text x="106" y="368" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3A567A">L2 Cache</text>
  <text x="494" y="368" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5C7494">~200 cyc · 全 GPU 共享</text>

  <!-- tier 5 Global -->
  <rect x="50" y="408" width="500" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.3"/>
  <text x="66" y="440" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#633806">Global Memory (DRAM)</text>
  <text x="534" y="440" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#854F0B">~400-800 cyc · GDDR6/HBM</text>

  <!-- vertical axis hint -->
  <text x="30" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#7A7872" transform="rotate(-90 30 160)">快 · 小</text>
  <text x="30" y="432" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#7A7872" transform="rotate(-90 30 432)">慢 · 大</text>

  <!-- mapping cards -->
  <!-- Card A: Shuffle -> Registers -->
  <rect x="650" y="120" width="330" height="72" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
  <text x="668" y="146" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#3C3489">Warp Shuffle Reduce</text>
  <text x="668" y="170" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#3C3489">寄存器↔寄存器交换，~1 cycle，几乎无同步</text>
  <line x1="650" y1="156" x2="396" y2="152" stroke="#534AB7" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Card B: Shared -> Shared Memory -->
  <rect x="650" y="210" width="330" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="668" y="236" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#085041">Shared Memory Reduce</text>
  <text x="668" y="260" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#085041">block 内 on-chip 通信，每轮 __syncthreads()</text>
  <line x1="650" y1="246" x2="436" y2="224" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Card C: Naive -> Global -->
  <rect x="650" y="378" width="330" height="72" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.3"/>
  <text x="668" y="404" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#633806">Naive Reduce</text>
  <text x="668" y="428" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#633806">线程 0 串行读 DRAM，延迟无法被隐藏</text>
  <line x1="650" y1="414" x2="556" y2="440" stroke="#854F0B" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- footer -->
  <rect x="210" y="500" width="620" height="34" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="520" y="518" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#444441">速度：上 → 下递减　|　容量：上 → 下递增　|　通信层级越高，reduction 越快</text>
</svg>
