<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
  <title id="title">堆的完全二叉树与数组存储</title>
  <desc id="desc">展示 priority_queue 底层堆可以看作完全二叉树，并用数组下标保存父子关系。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#33495c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23313f; }
      .small { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4b5b6b; }
      .tiny { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5b6976; }
      .node { fill: #e6f0f7; stroke: #4d7fa3; stroke-width: 1.8; }
      .top { fill: #f8e7ae; stroke: #c28a1d; stroke-width: 2; }
      .array { fill: #fbfaf4; stroke: #d8cfbf; stroke-width: 1.4; rx: 6; }
      .box { fill: #d8ead8; stroke: #4f9a68; stroke-width: 1.6; rx: 8; }
      .line { stroke: #7b6970; stroke-width: 1.7; fill: none; }
      .arrow { stroke: #33495c; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="470" y="44" text-anchor="middle" class="title">堆：用数组保存的完全二叉树</text>
  <text x="470" y="72" text-anchor="middle" class="small">大根堆堆顶最大，小根堆堆顶最小；priority_queue 默认是大根堆</text>

  <g transform="translate(110 108)">
    <circle cx="230" cy="42" r="30" class="top"/>
    <circle cx="130" cy="130" r="28" class="node"/>
    <circle cx="330" cy="130" r="28" class="node"/>
    <circle cx="70" cy="218" r="26" class="node"/>
    <circle cx="190" cy="218" r="26" class="node"/>
    <circle cx="285" cy="218" r="26" class="node"/>
    <circle cx="375" cy="218" r="26" class="node"/>

    <path d="M 211 66 L 149 108" class="line"/>
    <path d="M 249 66 L 311 108" class="line"/>
    <path d="M 116 154 L 84 195" class="line"/>
    <path d="M 144 154 L 176 195" class="line"/>
    <path d="M 318 154 L 296 195" class="line"/>
    <path d="M 342 154 L 366 195" class="line"/>

    <text x="230" y="48" text-anchor="middle" class="label">90</text>
    <text x="130" y="136" text-anchor="middle" class="label">72</text>
    <text x="330" y="136" text-anchor="middle" class="label">61</text>
    <text x="70" y="224" text-anchor="middle" class="label">40</text>
    <text x="190" y="224" text-anchor="middle" class="label">55</text>
    <text x="285" y="224" text-anchor="middle" class="label">18</text>
    <text x="375" y="224" text-anchor="middle" class="label">30</text>

    <text x="230" y="4" text-anchor="middle" class="tiny">top()</text>
    <text x="230" y="282" text-anchor="middle" class="small">父节点优先级不低于子节点</text>
  </g>

  <path d="M 545 238 C 585 238, 615 238, 652 238" class="arrow"/>

  <g transform="translate(640 116)">
    <rect x="0" y="0" width="236" height="78" class="box"/>
    <text x="118" y="28" text-anchor="middle" class="label">数组下标关系</text>
    <text x="118" y="52" text-anchor="middle" class="small">父: (i - 1) / 2</text>
  </g>

  <g transform="translate(622 236)">
    <rect x="0" y="0" width="42" height="42" class="array"/>
    <rect x="42" y="0" width="42" height="42" class="array"/>
    <rect x="84" y="0" width="42" height="42" class="array"/>
    <rect x="126" y="0" width="42" height="42" class="array"/>
    <rect x="168" y="0" width="42" height="42" class="array"/>
    <rect x="210" y="0" width="42" height="42" class="array"/>
    <rect x="252" y="0" width="42" height="42" class="array"/>

    <text x="21" y="26" text-anchor="middle" class="label">90</text>
    <text x="63" y="26" text-anchor="middle" class="label">72</text>
    <text x="105" y="26" text-anchor="middle" class="label">61</text>
    <text x="147" y="26" text-anchor="middle" class="label">40</text>
    <text x="189" y="26" text-anchor="middle" class="label">55</text>
    <text x="231" y="26" text-anchor="middle" class="label">18</text>
    <text x="273" y="26" text-anchor="middle" class="label">30</text>

    <text x="21" y="64" text-anchor="middle" class="tiny">0</text>
    <text x="63" y="64" text-anchor="middle" class="tiny">1</text>
    <text x="105" y="64" text-anchor="middle" class="tiny">2</text>
    <text x="147" y="64" text-anchor="middle" class="tiny">3</text>
    <text x="189" y="64" text-anchor="middle" class="tiny">4</text>
    <text x="231" y="64" text-anchor="middle" class="tiny">5</text>
    <text x="273" y="64" text-anchor="middle" class="tiny">6</text>
  </g>

  <g transform="translate(640 338)">
    <rect x="0" y="0" width="236" height="56" class="box"/>
    <text x="118" y="23" text-anchor="middle" class="small">左孩子: 2 * i + 1</text>
    <text x="118" y="43" text-anchor="middle" class="small">右孩子: 2 * i + 2</text>
  </g>
</svg>
