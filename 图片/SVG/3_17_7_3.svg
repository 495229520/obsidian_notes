<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440">
  <rect x="0" y="0" width="940" height="440" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>fcntl 记录锁：按字节范围加锁</title>
  <desc>不同进程可锁定同一文件的不同字节区间；只有区间重叠且至少含一个写锁时才冲突。</desc>

  <text x="470" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    fcntl 记录锁：按字节范围加锁
  </text>
  <text x="470" y="54" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">
    不同进程可锁文件的不同区间；区间重叠且含写锁才冲突
  </text>

  <text x="140" y="110" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#633806">进程 A：写锁 F_WRLCK</text>
  <text x="548" y="110" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">进程 B：读锁 F_RDLCK</text>

  <!-- 文件条（path 容器） -->
  <path d="M88 140 H852 A8 8 0 0 1 860 148 V188 A8 8 0 0 1 852 196 H88 A8 8 0 0 1 80 188 V148 A8 8 0 0 1 88 140 Z"
        fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <!-- A 写锁区间 [0,1024) -->
  <rect x="80" y="140" width="120" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <!-- B 读锁区间 [4096,8192) -->
  <rect x="392" y="140" width="312" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="296" y="168" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">未加锁区间</text>

  <text x="80" y="212" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">0</text>
  <text x="200" y="212" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">1024</text>
  <text x="392" y="212" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">4096</text>
  <text x="704" y="212" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">8192</text>
  <text x="860" y="212" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">EOF</text>

  <rect x="120" y="290" width="280" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="260" y="312" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C">进程 C：申请写锁 [512, 2048)</text>
  <text x="260" y="334" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">与 A 区间重叠 → 阻塞 / EAGAIN</text>
  <path d="M180 290 L150 196" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="700" y="312" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#085041">读锁可共享：另一进程对 [4096,8192) 再加读锁可共存</text>

  <text x="470" y="400" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    读锁共享、写锁排他；锁随进程绑定，进程退出或关闭 fd 即自动释放
  </text>
</svg>
