<rect x="479" y="552" width="191" height="49" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="574.5" y="581.4" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body" data-region="485,556,179,41">同窗相关</text>
