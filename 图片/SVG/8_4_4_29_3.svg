<text x="268" y="187" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="263,155,186,54">反馈活跃</text>
<rect x="458" y="150" width="231" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="472" y="187" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="467,155,213,54">仍有进展</text>
<rect x="689" y="150" width="503" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="703" y="187" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="698,155,485,54">比较输入、尾延迟与公平性</text>
