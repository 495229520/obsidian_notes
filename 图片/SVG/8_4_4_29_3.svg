<rect x="721" y="552" width="191" height="49" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="816.5" y="581.4" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle" data-role="body" data-region="727,556,179,41">机制假设</text>
<polyline points="919,577 956,577" fill="none" stroke="#5A564B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_n)"/>
<rect x="963" y="552" width="191" height="49" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1058.5" y="581.4" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body" data-region="969,556,179,41">受控反证</text>
<text x="48" y="638" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">缺失 ≠ 零　·　重试 ≠ 丢包数　·　handled ≠ 已证明控制效果良好</text>
<text x="48" y="665" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">表格是工程排查入口，不是自动根因分类器；单个事件和单条曲线都不足以完成归因。</text>
