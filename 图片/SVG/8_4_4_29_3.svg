<text x="268" y="251" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="263,219,186,54">可能不足</text>
<rect x="458" y="214" width="231" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="472" y="251" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="467,219,213,54">goodput 下跌</text>
<rect x="689" y="214" width="503" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="703" y="251" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="698,219,485,54">沿邻接端口追背压方向</text>
