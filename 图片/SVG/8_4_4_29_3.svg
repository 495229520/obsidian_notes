<text x="62" y="379" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="57,347,188,54">交换机无异常</text>
<rect x="254" y="342" width="204" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="268" y="379" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="263,347,186,54">无明显活动</text>
<rect x="458" y="342" width="231" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="472" y="379" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="467,347,213,54">RNR / refill 慢</text>
<rect x="689" y="342" width="503" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="703" y="379" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="698,347,485,54">查 SRQ、CQ、CPU 与 NUMA</text>
<rect x="48" y="406" width="206" height="64" rx="0" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1"/>
<text x="62" y="443" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="57,411,188,54">链路错误</text>
<rect x="254" y="406" width="204" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="268" y="443" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="263,411,186,54">不作直接判据</text>
<rect x="458" y="406" width="231" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="472" y="443" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="467,411,213,54">重试随之增加</text>
<rect x="689" y="406" width="503" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="703" y="443" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="698,411,485,54">对照邻端事件、线缆与模块</text>
<rect x="48" y="470" width="206" height="64" rx="0" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
