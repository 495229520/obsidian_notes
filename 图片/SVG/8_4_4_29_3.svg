<rect x="254" y="278" width="204" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="268" y="315" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="263,283,186,54">反馈缺口</text>
<rect x="458" y="278" width="231" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
