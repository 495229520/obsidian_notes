<rect x="458" y="470" width="231" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="472" y="507" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="467,475,213,54">仅应用 P99 高</text>
<rect x="689" y="470" width="503" height="64" rx="0" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
<text x="703" y="507" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body" data-region="698,475,485,54">查软件排队、MR、PCIe 与路径</text>
