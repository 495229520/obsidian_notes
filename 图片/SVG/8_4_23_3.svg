<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">入口求行和，出口求列和：阈值不能直接排成一条线</title><desc id="desc">两个静态教学反例：不同记账对象，可能得到不同的触发先后。</desc>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<defs>
<marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A26"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5B95"/></marker>
</defs>
<text x="48" y="51" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">入口求行和，出口求列和：阈值不能直接排成一条线</text>
<text x="48" y="80" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">两个静态教学反例：不同记账对象，可能得到不同的触发先后。</text>
<rect x="40" y="110" width="1160" height="233" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="142" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">A · 一个入口，三个出口</text>
<rect x="96" y="203" width="222" height="65" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="207.0" y="230.0" font-size="14" fill="#A64B3C" text-anchor="middle" font-weight="700" data-role="body">Ingress PG</text>
<text x="207.0" y="251.0" font-size="13" fill="#A64B3C" text-anchor="middle" font-weight="400" data-role="body">I = 180 kB</text>
<rect x="652" y="165" width="220" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="762.0" y="190.0" font-size="13" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">Queue D · 60 kB</text>
<path d="M322,235 H499 V185 H646" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<rect x="652" y="228" width="220" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="762.0" y="253.0" font-size="13" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">Queue E · 60 kB</text>
<path d="M322,235 H499 V248 H646" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<rect x="652" y="291" width="220" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="762.0" y="316.0" font-size="13" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">Queue F · 60 kB</text>
<path d="M322,235 H499 V311 H646" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text x="388" y="179" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">60 + 60 + 60</text>
<text x="927" y="214" font-size="15" fill="#A64B3C" text-anchor="start" font-weight="700" data-role="body">PG 已达暂停水位</text>
<text x="927" y="247" font-size="14" fill="#3D5A80" text-anchor="start" font-weight="400" data-role="body">各出口尚未达 ECN</text>
<rect x="40" y="365" width="1160" height="236" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="397" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="body">B · 三个入口，一个出口</text>
<rect x="96" y="418" width="222" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="207.0" y="443.0" font-size="13" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">PG A · 60 kB</text>
<path d="M322,438 H499 V499 H646" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<rect x="96" y="479" width="222" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="207.0" y="504.0" font-size="13" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">PG B · 60 kB</text>
<path d="M322,499 H499 V499 H646" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<rect x="96" y="540" width="222" height="40" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="207.0" y="565.0" font-size="13" fill="#3D5A80" text-anchor="middle" font-weight="700" data-role="body">PG C · 60 kB</text>
<path d="M322,560 H499 V499 H646" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<rect x="652" y="466" width="220" height="66" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="762.0" y="493.5" font-size="14" fill="#8A6A3A" text-anchor="middle" font-weight="700" data-role="body">Egress Queue</text>
<text x="762.0" y="514.5" font-size="13" fill="#8A6A3A" text-anchor="middle" font-weight="400" data-role="body">E = 180 kB</text>
<text x="385" y="421" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">60 + 60 + 60</text>
<text x="927" y="483" font-size="15" fill="#8A6A3A" text-anchor="start" font-weight="700" data-role="body">出口已达 ECN</text>
<text x="927" y="516" font-size="14" fill="#3D5A80" text-anchor="start" font-weight="400" data-role="body">各 PG 尚未暂停</text>
<text x="64" y="631" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">教学阈值：ECN = 100 kB；PG 暂停水位 = 160 kB。</text>
<text x="48" y="658" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">这里均按“已用空间”定义水位；不代表 NOS 的 xoff 字段语义。</text>
</svg>