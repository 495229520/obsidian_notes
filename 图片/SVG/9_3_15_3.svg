<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243241; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607080; }
      .head { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 14px; fill: #435363; text-anchor: middle; }
      .small { font-size: 13px; fill: #526475; text-anchor: middle; }
    </style>
  </defs>
  <text x="56" y="54" class="title">CUTLASS GEMM hierarchy</text>
  <text x="56" y="83" class="subtitle">从问题规模到硬件指令：tile 越来越细，数据位置从 global / shared 走向 registers / MMA</text>

  <rect x="72" y="150" width="184" height="160" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="164" y="188" class="head">Problem</text>
  <text x="164" y="226" class="body">GEMM M,N,K</text>
  <text x="164" y="254" class="small">whole matrix</text>

  <rect x="310" y="132" width="184" height="196" rx="8" fill="#e8f0f6" stroke="#86a8c4" stroke-width="2"/>
  <text x="402" y="170" class="head">Threadblock tile</text>
  <text x="402" y="210" class="body">CtaTileM/N/K</text>
  <text x="402" y="238" class="body">global -> shared</text>
  <text x="402" y="284" class="small">block-level concurrency</text>

  <rect x="548" y="132" width="184" height="196" rx="8" fill="#efe8f6" stroke="#aa92c5" stroke-width="2"/>
  <text x="640" y="170" class="head">Warp tile</text>
  <text x="640" y="210" class="body">WarpTileM/N/K</text>
  <text x="640" y="238" class="body">shared -> registers</text>
  <text x="640" y="284" class="small">warp-level parallelism</text>

  <rect x="786" y="132" width="184" height="196" rx="8" fill="#f4ead7" stroke="#c6a661" stroke-width="2"/>
  <text x="878" y="170" class="head">Instruction tile</text>
  <text x="878" y="210" class="body">MmaM/N/K</text>
  <text x="878" y="238" class="body">MMA / SIMT</text>
  <text x="878" y="284" class="small">CUDA / Tensor Cores</text>

  <line x1="268" y1="230" x2="296" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="506" y1="230" x2="534" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="744" y1="230" x2="772" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="238" y="408" width="300" height="76" rx="8" fill="#e7efe3" stroke="#84a96d"/>
  <text x="388" y="438" class="head">Mainloop</text>
  <text x="388" y="466" class="body">K-loop load + MMA accumulation</text>

  <rect x="582" y="408" width="300" height="76" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="732" y="438" class="head">Epilogue</text>
  <text x="732" y="466" class="body">accumulator -> global writeback</text>
</svg>
