<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect x="0" y="0" width="960" height="600" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    乐观锁的版本号机制：提交时检测冲突，失配则重试
  </text>
  <text x="480" y="56" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#888">
    两事务都读到 version=5，谁先提交谁成功，后者因 version 已变而失败
  </text>

  <!-- center column: shared row state -->
  <text x="480" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#888">数据库行（共享）</text>
  <line x1="480" y1="98" x2="480" y2="500" stroke="#BBBAB2" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- lane headers -->
  <rect x="60" y="98" width="300" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="116" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">事务 T1</text>
  <rect x="600" y="98" width="300" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="750" y="116" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">事务 T2</text>

  <!-- t1: both read -->
  <rect x="60" y="156" width="300" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="176" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">① 读取 value=100, version=5</text>
  <rect x="600" y="156" width="300" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="750" y="176" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">① 读取 value=100, version=5</text>

  <rect x="430" y="158" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#888" stroke-width="0.8"/>
  <text x="480" y="176" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#444441">v=5</text>

  <!-- t2: T1 commits -->
  <rect x="60" y="226" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="210" y="241" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">② UPDATE ... SET version=6</text>
  <text x="210" y="258" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">WHERE version=5 → 影响 1 行 ✓</text>

  <rect x="430" y="230" width="100" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="480" y="248" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">v=6</text>
  <path d="M360 248 L428 248" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- t3: T2 commit fails -->
  <rect x="600" y="296" width="300" height="44" rx="8" fill="#FBE9E7" stroke="#B3261E" stroke-width="0.5"/>
  <text x="750" y="311" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#7A1B14">③ UPDATE ... WHERE version=5</text>
  <text x="750" y="328" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#7A1B14">→ 影响 0 行 ✗（version 已是 6）</text>
  <path d="M600 318 L532 318" fill="none" stroke="#B3261E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="566" y="306" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B3261E">读 v=6≠5</text>

  <!-- t4: T2 retry -->
  <rect x="600" y="366" width="300" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="750" y="381" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">④ 重新读取 version=6，基于</text>
  <text x="750" y="398" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">最新值重算后再次提交 ↺</text>
  <path d="M750 340 L750 364" fill="none" stroke="#854F0B" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="180" y="450" width="600" height="56" rx="8" fill="#F3EFE4" stroke="#854F0B" stroke-width="0.5"/>
  <text x="480" y="470" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">关键：version 把「读时」与「写时」绑定起来</text>
  <text x="480" y="490" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">UPDATE 的 WHERE version=旧值 是原子的「比较并交换」——这正是 CAS 的数据库版本</text>

  <text x="480" y="540" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#888">
    冲突罕见时几乎不重试；冲突频繁时重试代价高 → 应改用悲观锁
  </text>
</svg>
