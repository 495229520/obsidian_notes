<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>一次 ARP 解析的四步时序与同网段跨网段的解析对象</title>
  <desc>上半部分按四台主机的时间线画出 ARP 请求广播出去、无关主机丢弃、目标主机单播应答、双方各自更新邻居表的完整过程；下半部分对照同网段与跨网段两种目标，说明 ARP 解析的永远是下一跳。</desc>

  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">一次 ARP 解析：广播出去，单播回来，两边都记住</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">解析的永远是下一跳；目标不在本网段时，问的是网关的 MAC，不是目标的</text>

  <!-- ============ Panel A ============ -->
  <rect x="48" y="102" width="1144" height="350" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · A 要给 10.0.0.20 发包，但不知道它的 MAC</text>

  <rect x="88" y="152" width="200" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="188" y="175" font-size="12.5" fill="#2C4460" text-anchor="middle">主机 A</text>
  <text x="188" y="193" font-size="11" fill="#2C4460" text-anchor="middle">10.0.0.10 · aa:aa</text>

  <rect x="368" y="152" width="200" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="468" y="175" font-size="12.5" fill="#24473F" text-anchor="middle">主机 B</text>
  <text x="468" y="193" font-size="11" fill="#24473F" text-anchor="middle">10.0.0.20 · bb:bb</text>

  <rect x="648" y="152" width="200" height="52" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.4"/>
  <text x="748" y="175" font-size="12.5" fill="#4A473F" text-anchor="middle">主机 C</text>
  <text x="748" y="193" font-size="11" fill="#6B675C" text-anchor="middle">10.0.0.30 · cc:cc</text>

  <rect x="928" y="152" width="200" height="52" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="1028" y="175" font-size="12.5" fill="#6B4E28" text-anchor="middle">网关 R</text>
  <text x="1028" y="193" font-size="11" fill="#6B4E28" text-anchor="middle">10.0.0.1 · rr:rr</text>

  <line x1="188" y1="204" x2="188" y2="430" stroke="#C9C5B8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="468" y1="204" x2="468" y2="430" stroke="#C9C5B8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="748" y1="204" x2="748" y2="430" stroke="#C9C5B8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="1028" y1="204" x2="1028" y2="430" stroke="#C9C5B8" stroke-width="1.2" stroke-dasharray="5 5"/>

  <text x="88" y="232" font-size="12" font-weight="700" fill="#6B4E28">① A 广播 ARP Request：谁是 10.0.0.20，请告诉 aa:aa</text>
  <line x1="188" y1="248" x2="1028" y2="248" stroke="#8A6A3A" stroke-width="2"/>
  <line x1="468" y1="248" x2="468" y2="264" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrA)"/>
  <line x1="748" y1="248" x2="748" y2="264" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrA)"/>
  <line x1="1028" y1="248" x2="1028" y2="264" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrA)"/>

  <text x="88" y="292" font-size="12" font-weight="700" fill="#4A473F">② 每台机器都要拆开看一眼，TPA 不是自己就丢掉</text>
  <rect x="658" y="302" width="180" height="32" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="748" y="323" font-size="11" fill="#6B675C" text-anchor="middle">不是我，丢弃</text>
  <rect x="938" y="302" width="180" height="32" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1028" y="323" font-size="11" fill="#6B675C" text-anchor="middle">不是我，丢弃</text>

  <text x="88" y="360" font-size="12" font-weight="700" fill="#24473F">③ 只有 B 应答，目的 MAC 填 aa:aa，这一步是单播</text>
  <line x1="464" y1="376" x2="196" y2="376" stroke="#2F6B5E" stroke-width="2" marker-end="url(#arrG)"/>

  <text x="88" y="406" font-size="12" font-weight="700" fill="#2C4460">④ 两边的邻居表各多了一条</text>
  <rect x="88" y="416" width="256" height="30" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="216" y="436" font-size="11" fill="#2C4460" text-anchor="middle">A：10.0.0.20 → bb:bb</text>
  <rect x="368" y="416" width="330" height="30" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="533" y="436" font-size="11" fill="#24473F" text-anchor="middle">B：10.0.0.10 → aa:aa，从请求里顺手学的</text>

  <!-- ============ Panel B ============ -->
  <rect x="48" y="470" width="1144" height="190" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="498" font-size="15" font-weight="700" fill="#4A473F">B · 同一台主机 A 发两个包，ARP 问的对象完全不同</text>

  <rect x="72" y="512" width="530" height="130" rx="7" fill="#F4F2EA" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="92" y="537" font-size="12.5" font-weight="700" fill="#24473F">目标 10.0.0.20 · 同网段</text>
  <text x="92" y="565" font-size="11.5" fill="#2B2A26">IP 与掩码相与后同网段，下一跳就是目标本身</text>
  <text x="92" y="590" font-size="11.5" fill="#2B2A26">ARP 问：10.0.0.20 的 MAC 是多少</text>
  <text x="92" y="617" font-size="11.5" fill="#24473F">帧的目的 MAC = bb:bb</text>

  <rect x="638" y="512" width="530" height="130" rx="7" fill="#F4F2EA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="658" y="537" font-size="12.5" font-weight="700" fill="#6B4E28">目标 203.0.113.9 · 跨网段</text>
  <text x="658" y="565" font-size="11.5" fill="#2B2A26">不在本网段，查路由表得到下一跳 10.0.0.1</text>
  <text x="658" y="590" font-size="11.5" fill="#2B2A26">ARP 问：10.0.0.1 的 MAC，不问 203.0.113.9</text>
  <text x="658" y="617" font-size="11.5" fill="#6B4E28">帧目的 MAC = rr:rr，IP 目的仍是 203.0.113.9</text>

  <text x="48" y="686" font-size="11.5" fill="#6B675C">口径提醒：ARP 请求是二层广播，路由器不会转发，所以它只能解析本链路上的地址</text>
</svg>
