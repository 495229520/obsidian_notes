<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">两条反馈路径：PFC 逐跳，CNP 端到端</title><desc id="desc">以 Leaf-B 为拥塞点；反向 CNP 不要求沿原数据路径返回。</desc>
<rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>
<defs>
<marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A26"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5B95"/></marker>
</defs>
<text x="48" y="51" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700" data-role="title">两条反馈路径：PFC 逐跳，CNP 端到端</text>
<text x="48" y="80" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="subtitle">以 Leaf-B 为拥塞点；反向 CNP 不要求沿原数据路径返回。</text>
<rect x="64" y="117" width="152" height="50" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="140.0" y="147.0" font-size="13" fill="#9B968A" text-anchor="middle" font-weight="700" data-role="body">发送 RNIC</text>
<line x1="140" y1="174" x2="140" y2="551" stroke="#9B968A" stroke-width="1.1" stroke-linecap="round" opacity="0.5" stroke-dasharray="4 6"/>
<rect x="294" y="117" width="152" height="50" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="370.0" y="147.0" font-size="13" fill="#9B968A" text-anchor="middle" font-weight="700" data-role="body">Leaf-A</text>
<line x1="370" y1="174" x2="370" y2="551" stroke="#9B968A" stroke-width="1.1" stroke-linecap="round" opacity="0.5" stroke-dasharray="4 6"/>
<rect x="524" y="117" width="152" height="50" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="600.0" y="147.0" font-size="13" fill="#9B968A" text-anchor="middle" font-weight="700" data-role="body">Spine</text>
<line x1="600" y1="174" x2="600" y2="551" stroke="#9B968A" stroke-width="1.1" stroke-linecap="round" opacity="0.5" stroke-dasharray="4 6"/>
<rect x="754" y="117" width="152" height="50" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="830.0" y="147.0" font-size="13" fill="#9B968A" text-anchor="middle" font-weight="700" data-role="body">Leaf-B</text>
<line x1="830" y1="174" x2="830" y2="551" stroke="#9B968A" stroke-width="1.1" stroke-linecap="round" opacity="0.5" stroke-dasharray="4 6"/>
<rect x="1024" y="117" width="152" height="50" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1100.0" y="147.0" font-size="13" fill="#9B968A" text-anchor="middle" font-weight="700" data-role="body">接收 RNIC</text>
<line x1="1100" y1="174" x2="1100" y2="551" stroke="#9B968A" stroke-width="1.1" stroke-linecap="round" opacity="0.5" stroke-dasharray="4 6"/>
<rect x="48" y="184" width="1144" height="75" rx="5" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="206" font-size="12" fill="#3D5A80" text-anchor="start" font-weight="700" data-role="body">数据向前</text>
<line x1="140" y1="230" x2="362" y2="230" stroke="#3D5A80" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr-blue)"/>
<line x1="370" y1="230" x2="592" y2="230" stroke="#3D5A80" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr-blue)"/>
<line x1="600" y1="230" x2="822" y2="230" stroke="#3D5A80" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr-blue)"/>
<line x1="830" y1="230" x2="1092" y2="230" stroke="#3D5A80" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr-blue)"/>
<circle cx="830" cy="230" r="6" fill="#6B5B95" stroke="#6B5B95"/>
<text x="830" y="213" font-size="12" fill="#6B5B95" text-anchor="middle" font-weight="700" data-role="body">CE 标记</text>
<rect x="48" y="280" width="1144" height="118" rx="5" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="307" font-size="14" fill="#A64B3C" text-anchor="start" font-weight="700" data-role="body">PFC：只到相邻上游</text>
<line x1="822" y1="348" x2="609" y2="348" stroke="#A64B3C" stroke-width="2.8" stroke-linecap="round" opacity="1" marker-end="url(#arr-red)"/>
<text x="715" y="330" font-size="13" fill="#A64B3C" text-anchor="middle" font-weight="400" data-role="body">priority p</text>
<text x="914" y="346" font-size="13" fill="#A64B3C" text-anchor="start" font-weight="400" data-role="body">约束 Spine 的后续发送</text>
<text x="140" y="379" font-size="13" fill="#6B675C" text-anchor="start" font-weight="400" data-role="body">按优先级控制一条链路，不识别单条 QP 流。</text>
<rect x="48" y="419" width="1144" height="120" rx="5" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="66" y="446" font-size="14" fill="#2F6B5E" text-anchor="start" font-weight="700" data-role="body">CNP：接收端通知发送端</text>
<line x1="1100" y1="483" x2="838" y2="483" stroke="#2F6B5E" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr-green)"/>
<line x1="830" y1="483" x2="608" y2="483" stroke="#2F6B5E" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr-green)"/>
<line x1="600" y1="483" x2="378" y2="483" stroke="#2F6B5E" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr-green)"/>
<line x1="370" y1="483" x2="148" y2="483" stroke="#2F6B5E" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr-green)"/>
<text x="619" y="515" font-size="12" fill="#2F6B5E" text-anchor="middle" font-weight="400" data-role="body">沿返回路由转发</text>
<rect x="64" y="554" width="152" height="51" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="140.0" y="584.5" font-size="13" fill="#2F6B5E" text-anchor="middle" font-weight="700" data-role="body">发送端调速</text>
<line x1="140" y1="536" x2="140" y2="550" stroke="#2F6B5E" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arr-green)"/>
<text x="275" y="581" font-size="13" fill="#2B2A26" text-anchor="start" font-weight="400" data-role="body">先看到 CE，不等于反馈已送达，更不等于发送速率已经下降。</text>
<text x="48" y="658" font-size="12" fill="#6B675C" text-anchor="start" font-weight="400" data-role="footer">PFC 的“传播”通常是上游再次积压并生成新 PFC，不是转发同一个控制帧。</text>
</svg>