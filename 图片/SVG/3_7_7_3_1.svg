<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>端口号空间：IANA 划分与 Linux 实际临时端口范围</title>
  <desc>把 0 到 65535 的端口空间按 IANA 的三段规范画在一条轴上，再叠上 Linux 默认的临时端口范围 32768 到 60999，指出两者错位的区间才是服务器绑定会撞车的地方，并给出三种规避做法。</desc>

  <rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">65536 个端口号：规范怎么分，内核实际怎么用</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">会跟你抢端口的不是 IANA 的分段，是内核的临时端口范围，两者并不重合</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 同一条轴上的三种划分（宽度为示意，非按比例）</text>

  <!-- 行1 IANA -->
  <text x="76" y="156" font-size="11.5" font-weight="700" fill="#6B675C">IANA 规范划分</text>
  <rect x="76" y="164" width="280" height="40" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="216" y="181" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">知名端口</text>
  <text x="216" y="197" font-size="10.5" fill="#733428" text-anchor="middle">0 – 1023</text>
  <rect x="356" y="164" width="400" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="556" y="181" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">注册端口</text>
  <text x="556" y="197" font-size="10.5" fill="#24473F" text-anchor="middle">1024 – 49151</text>
  <rect x="756" y="164" width="408" height="40" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="960" y="181" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">动态 / 私有端口</text>
  <text x="960" y="197" font-size="10.5" fill="#2C4460" text-anchor="middle">49152 – 65535</text>

  <!-- 刻度 -->
  <line x1="76" y1="204" x2="76" y2="214" stroke="#9B968A" stroke-width="1"/>
  <line x1="356" y1="204" x2="356" y2="214" stroke="#9B968A" stroke-width="1"/>
  <line x1="756" y1="204" x2="756" y2="214" stroke="#9B968A" stroke-width="1"/>
  <line x1="1164" y1="204" x2="1164" y2="214" stroke="#9B968A" stroke-width="1"/>
  <text x="76" y="226" font-size="10" fill="#6B675C" text-anchor="middle">0</text>
  <text x="356" y="226" font-size="10" fill="#6B675C" text-anchor="middle">1024</text>
  <text x="756" y="226" font-size="10" fill="#6B675C" text-anchor="middle">49152</text>
  <text x="1164" y="226" font-size="10" fill="#6B675C" text-anchor="middle">65535</text>

  <!-- 行2 Linux 临时端口 -->
  <text x="76" y="254" font-size="11.5" font-weight="700" fill="#6B675C">Linux 默认临时端口范围（内核发起出站连接时从这里取源端口）</text>
  <rect x="76" y="262" width="544" height="36" fill="#F1EFE8" stroke="#9B968A" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="348" y="285" font-size="11" fill="#6B675C" text-anchor="middle">内核不会从这里取</text>
  <rect x="620" y="262" width="431" height="36" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.6"/>
  <text x="835" y="285" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">32768 – 60999：内核随机占用</text>
  <rect x="1051" y="262" width="113" height="36" fill="#F1EFE8" stroke="#9B968A" stroke-width="1" stroke-dasharray="5 3"/>

  <line x1="620" y1="298" x2="620" y2="308" stroke="#B07D2B" stroke-width="1.2"/>
  <line x1="1051" y1="298" x2="1051" y2="308" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="620" y="320" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">32768</text>
  <text x="1051" y="320" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">60999</text>

  <!-- 行3 绑定建议 -->
  <text x="76" y="348" font-size="11.5" font-weight="700" fill="#6B675C">服务器该绑在哪</text>
  <rect x="76" y="356" width="280" height="36" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="216" y="379" font-size="11" fill="#733428" text-anchor="middle">需 root 或 CAP_NET_BIND_SERVICE</text>
  <rect x="356" y="356" width="264" height="36" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="488" y="379" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">1024 – 32767：最省心</text>
  <rect x="620" y="356" width="431" height="36" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.6"/>
  <text x="835" y="379" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">与临时端口重叠，可能被抢先占用</text>
  <rect x="1051" y="356" width="113" height="36" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1107" y="379" font-size="10.5" fill="#24473F" text-anchor="middle">61000 起可用</text>

  <!-- ================= Panel B ================= -->
  <rect x="48" y="420" width="1144" height="200" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="446" font-size="15" font-weight="700" fill="#4A473F">B · 撞车是怎么发生的，以及三种避法</text>

  <rect x="72" y="458" width="358" height="148" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="94" y="482" font-size="12" font-weight="700" fill="#733428">故障现场</text>
  <text x="94" y="506" font-size="11.5" fill="#733428">服务配置成监听 50000 端口</text>
  <text x="94" y="528" font-size="11.5" fill="#733428">重启前，本机某个出站连接</text>
  <text x="94" y="548" font-size="11.5" fill="#733428">已被内核随机分到 50000</text>
  <text x="94" y="572" font-size="11.5" font-weight="700" fill="#733428">bind() 返回 EADDRINUSE</text>
  <text x="94" y="594" font-size="11" fill="#733428">偶发、重启才复现，最难排查</text>

  <rect x="446" y="458" width="358" height="148" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="468" y="482" font-size="12" font-weight="700" fill="#2C4460">先查本机的实际范围</text>
  <text x="468" y="508" font-size="11.5" fill="#2C4460">sysctl net.ipv4.ip_local_port_range</text>
  <text x="468" y="532" font-size="11.5" fill="#2C4460">多数发行版输出：32768　60999</text>
  <text x="468" y="556" font-size="11.5" fill="#2C4460">容器镜像和云主机常被改过</text>
  <text x="468" y="580" font-size="11" fill="#2C4460">别照抄 49152 这个规范值</text>

  <rect x="820" y="458" width="348" height="148" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="842" y="482" font-size="12" font-weight="700" fill="#24473F">三种避法，按优先级</text>
  <text x="842" y="508" font-size="11.5" fill="#24473F">① 服务端口选在 1024 – 32767</text>
  <text x="842" y="532" font-size="11.5" fill="#24473F">② 调窄 ip_local_port_range</text>
  <text x="842" y="556" font-size="11.5" fill="#24473F">③ ip_local_reserved_ports 预留</text>
  <text x="842" y="580" font-size="11" fill="#24473F">③ 能挖洞，不必整体让出区间</text>

  <text x="48" y="648" font-size="11.5" fill="#4A473F">监听 0 端口是另一回事：bind 时传端口 0 表示「随便给一个」，内核从临时端口范围里挑，再用 getsockname 读回实际端口。</text>
  <text x="48" y="670" font-size="11.5" fill="#4A473F">被动测试程序常这么写，既拿到可用端口，又不会和别的服务撞。</text>
</svg>
