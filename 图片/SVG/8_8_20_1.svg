<text x="48" y="637" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">线路交叉处不表示额外连接；本图展示两类关系，不指定真实 NCCL 环顺序或一定选择的 GPU-NIC 路由。</text>
<text x="48" y="660" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start">对应 8.20 §1–§3；多节点 NVLink、C2C 和虚拟化平台应按实际系统拓扑重画。</text>
