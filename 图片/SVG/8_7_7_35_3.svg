<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<title>Degraded Read：等待的是合格输入，而不是最先到达的 k 个响应</title><desc>客户端、读取协调器、并行 helper 与可信控制面四个泳道。先固定 manifest，再读取与筛选有效输入、解码、验证输出并回复。客户端等待覆盖整个恢复过程。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A64B3C"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6B5E"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5A80"/></marker>
</defs>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">Degraded Read：等待的是合格输入，而不是最先到达的 k 个响应</text>
<text x="48" y="82" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">逻辑时序示意；多个 helper 并行执行。身份、输入、输出三道门均通过后才交付。</text>
<rect x="58.0" y="111" width="184" height="47" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="150.0" y="139.6" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">客户端</text>
<line x1="150" y1="160" x2="150" y2="624" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="328.0" y="111" width="220" height="47" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="438.0" y="139.6" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">读取协调器</text>
<line x1="438" y1="160" x2="438" y2="624" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="654.0" y="111" width="220" height="47" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="764.0" y="139.6" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Helpers · 并行</text>
<line x1="764" y1="160" x2="764" y2="624" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="968.0" y="111" width="224" height="47" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1080.0" y="139.6" font-size="15" font-weight="700" fill="#4A3F68" text-anchor="middle" data-role="body">可信 manifest</text>
<line x1="1080" y1="160" x2="1080" y2="624" stroke="#D8D5C8" stroke-width="1.2" stroke-dasharray="5 5"/>
<line x1="150" y1="196" x2="438" y2="196" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="181" y="184" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">Range GET：目标片不可用</text>
<rect x="94" y="218" width="112" height="412" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="150" y="367" font-size="15" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">等待</text>
<text x="150" y="397" font-size="15" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">有效输入</text>
<text x="150" y="427" font-size="15" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">与输出</text>
<text x="150" y="457" font-size="15" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">验证完成</text>
<line x1="438" y1="234" x2="1080" y2="234" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="474" y="223" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">获取对象版本与可信期望摘要</text>
<line x1="1080" y1="276" x2="438" y2="276" stroke="#6B5B95" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="512" y="265" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">固定 generation / codec / 范围</text>
<line x1="438" y1="322" x2="764" y2="322" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="465" y="310" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">并行请求不同编码位置</text>
<line x1="764" y1="367" x2="438" y2="367" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="467" y="355" font-size="14" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">返回字节、身份与状态</text>
<rect x="298" y="391" width="280" height="66" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="438.0" y="416.76" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">① 身份与版本  ② 输入校验</text>
<text x="438.0" y="440.76" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">仅合格位置进入 usable 集合</text>
<line x1="578" y1="424" x2="713" y2="424" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#red)"/>
<rect x="719" y="395" width="455" height="58" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="946.5" y="416.76" font-size="14" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">坏片 / 旧片 / 重复位置：拒绝</text>
<text x="946.5" y="440.76" font-size="14" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">需要时请求替代 helper</text>
<line x1="438" y1="457" x2="438" y2="475" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="298" y="480" width="280" height="49" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="438.0" y="509.6" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">独立方程足够 → 解码</text>
<line x1="438" y1="529" x2="438" y2="546" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="298" y="551" width="280" height="49" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="438.0" y="580.6" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">③ 输出匹配可信期望值</text>
<line x1="438" y1="630" x2="150" y2="630" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#green)"/>
<text x="222" y="618" font-size="14" font-weight="400" fill="#24473F" text-anchor="start" data-role="body">交付已验证的请求范围</text>
<text x="704" y="504" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">RS：k 个独立有效位置</text>
<text x="704" y="536" font-size="15" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">LRC：按布局检查可解码性</text>
<text x="704" y="583" font-size="15" font-weight="400" fill="#6B4E28" text-anchor="start" data-role="body">Range 读成功 ≠ 后台冗余已补回</text>
<line x1="48" y1="643" x2="1192" y2="643" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="671" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">拒绝路径不把超时直接认定为永久损坏；迟到响应仍受 generation 与请求生命周期约束。</text>
</svg>