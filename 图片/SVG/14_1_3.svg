<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"
     role="img" aria-labelledby="title desc">
  <title id="title">MFMS v0.4 需求、订单与运单数据权威</title>
  <desc id="desc">数据中台单写需求，调度系统将需求拆分为订单与运单；订单字段包含站点别名、上下料类型、IDs、时间戳、数量与优先级。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect width="1240" height="700" fill="rgb(245, 244, 237)"/>

  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">v0.4 数据权威：中台需求 → 调度订单 → 调度运单</text>
  <text x="48" y="77" font-size="13" fill="#6B675C">职责边界已确认；表名、物理列型、拆分基数、运单字段与生命周期仍待联合评审</text>

  <!-- A · 责任链 -->
  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 从业务意图到物理执行</text>

  <rect x="48" y="128" width="238" height="96" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="167" y="154" font-size="13.5" font-weight="700" fill="#2C4460" text-anchor="middle">MFMS 数据中台</text>
  <text x="167" y="178" font-size="11" fill="#4A473F" text-anchor="middle">接收 · 校验 · 持久化需求</text>
  <text x="167" y="201" font-size="10.5" fill="#6B675C" text-anchor="middle">只写 requirement</text>

  <rect x="356" y="128" width="252" height="96" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="482" y="154" font-size="13.5" font-weight="700" fill="#6B4E28" text-anchor="middle">调度系统</text>
  <text x="482" y="178" font-size="11" fill="#4A473F" text-anchor="middle">读取需求 · 拆分订单/运单</text>
  <text x="482" y="201" font-size="10.5" fill="#6B675C" text-anchor="middle">单写 order 与 waybill</text>

  <rect x="678" y="128" width="238" height="96" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="797" y="154" font-size="13.5" font-weight="700" fill="#24473F" text-anchor="middle">Adapter</text>
  <text x="797" y="178" font-size="11" fill="#4A473F" text-anchor="middle">接收并执行运单</text>
  <text x="797" y="201" font-size="10.5" fill="#6B675C" text-anchor="middle">发布运单实时事实</text>

  <rect x="986" y="128" width="206" height="96" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="1089" y="154" font-size="13.5" font-weight="700" fill="#733428" text-anchor="middle">下位机</text>
  <text x="1089" y="178" font-size="11" fill="#4A473F" text-anchor="middle">执行设备动作</text>
  <text x="1089" y="201" font-size="10.5" fill="#6B675C" text-anchor="middle">唯一控制权裁决者</text>

  <path d="M286 176 H348" fill="none" stroke="#3D5A80" stroke-width="1.7" marker-end="url(#arrBlue)"/>
  <text x="317" y="165" font-size="9.5" fill="#3D5A80" text-anchor="middle">需求</text>
  <path d="M608 176 H670" fill="none" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="639" y="165" font-size="9.5" fill="#4A473F" text-anchor="middle">运单</text>
  <path d="M916 176 H978" fill="none" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arrTeal)"/>
  <text x="947" y="165" font-size="9.5" fill="#2F6B5E" text-anchor="middle">ADK</text>

  <!-- B · 三类数据 -->
  <rect x="48" y="252" width="650" height="370" rx="9" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="66" y="280" font-size="14" font-weight="700" fill="#4A473F">B · MySQL 三类核心记录与血缘</text>

  <rect x="70" y="302" width="606" height="82" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="88" y="327" font-size="13" font-weight="700" fill="#2C4460">mfms_requirement</text>
  <rect x="558" y="312" width="96" height="22" rx="5" fill="#3D5A80"/>
  <text x="606" y="327" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">中台单写</text>
  <text x="88" y="352" font-size="11" fill="#4A473F">requirement_uid · schema_version · payload_json</text>
  <text x="88" y="371" font-size="10" fill="#6B675C">原始需求与接入审计；不包含调度拆单结果</text>

  <path d="M373 384 V409" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="384" y="401" font-size="9.5" fill="#6B675C">1..N 待确认</text>

  <rect x="70" y="414" width="606" height="86" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="88" y="439" font-size="13" font-weight="700" fill="#6B4E28">mfms_order</text>
  <rect x="558" y="424" width="96" height="22" rx="5" fill="#8A6A3A"/>
  <text x="606" y="439" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">调度单写</text>
  <text x="88" y="464" font-size="11" fill="#4A473F">order_uid · requirement_uid · 六个业务字段</text>
  <text x="88" y="484" font-size="10" fill="#6B675C">中台只读；不得创建、推进、修复或取消</text>

  <path d="M373 500 V525" fill="none" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="384" y="517" font-size="9.5" fill="#6B675C">0..N 待确认</text>

  <rect x="70" y="530" width="606" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="88" y="555" font-size="13" font-weight="700" fill="#24473F">mfms_waybill</text>
  <rect x="558" y="540" width="96" height="22" rx="5" fill="#2F6B5E"/>
  <text x="606" y="555" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">调度单写</text>
  <text x="88" y="578" font-size="10.5" fill="#4A473F">waybill_uid · order_uid · requirement_uid</text>
  <text x="88" y="596" font-size="9.5" fill="#6B675C">经评审的 ID 关联 Adapter 实时事实</text>

  <!-- C · 订单字段 -->
  <rect x="724" y="252" width="468" height="370" rx="9" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="742" y="280" font-size="14" font-weight="700" fill="#4A473F">C · 订单最小逻辑字段【已确认】</text>

  <rect x="746" y="302" width="424" height="214" rx="7" fill="#F7F2E8" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="764" y="330" font-size="11.5" font-weight="700" fill="#6B4E28">工作站点名称 / 别名</text>
  <line x1="756" y1="341" x2="1160" y2="341" stroke="#D8D5C8"/>
  <text x="764" y="365" font-size="11.5" font-weight="700" fill="#6B4E28">type</text>
  <text x="930" y="365" font-size="10.5" fill="#4A473F">上料 / 下料（LOAD / UNLOAD 候选）</text>
  <line x1="756" y1="378" x2="1160" y2="378" stroke="#D8D5C8"/>
  <text x="764" y="402" font-size="11.5" font-weight="700" fill="#6B4E28">ids[]</text>
  <text x="930" y="402" font-size="10.5" fill="#4A473F">元素含义、顺序与存储待确认</text>
  <line x1="756" y1="415" x2="1160" y2="415" stroke="#D8D5C8"/>
  <text x="764" y="439" font-size="11.5" font-weight="700" fill="#6B4E28">时间戳</text>
  <text x="930" y="439" font-size="10.5" fill="#4A473F">请求 / 计划 / 创建含义待确认</text>
  <line x1="756" y1="452" x2="1160" y2="452" stroke="#D8D5C8"/>
  <text x="764" y="476" font-size="11.5" font-weight="700" fill="#6B4E28">数量</text>
  <text x="930" y="476" font-size="10.5" fill="#4A473F">单位及与 ids[] 的关系待确认</text>
  <line x1="756" y1="489" x2="1160" y2="489" stroke="#D8D5C8"/>
  <text x="764" y="511" font-size="11.5" font-weight="700" fill="#6B4E28">优先级</text>
  <text x="930" y="511" font-size="10.5" fill="#4A473F">范围、方向、默认和并列规则待确认</text>

  <rect x="746" y="536" width="424" height="66" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="764" y="560" font-size="11" font-weight="700" fill="#733428">中台禁区</text>
  <text x="850" y="560" font-size="10.5" fill="#4A473F">需求拆分 · order/waybill 写入</text>
  <text x="764" y="584" font-size="10.5" fill="#4A473F">Stream 静默或控制权变化不得推进持久终态</text>

  <rect x="48" y="646" width="1144" height="34" rx="7" fill="#F1EFE8" stroke="#9B968A"/>
  <text x="620" y="668" font-size="11" fill="#4A473F" text-anchor="middle">推荐物理列：workstation_alias · operation_type · item_ids · business_timestamp · quantity · priority</text>
</svg>
