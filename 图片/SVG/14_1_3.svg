<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc">
  <rect width="1240" height="700" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1E4F6F"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2A7F76"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C58A2A"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24323D; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #53636F; }
      .card-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #53636F; }
      .edge { fill: none; stroke-width: 2.2; }
    </style>
  </defs>
  <title id="title">MFMS v0.3 数据权威与单写者边界</title>
  <desc id="desc">展示订单四张表的字段所有权，以及下位机和 Adapter 通过 Redis Stream 发布实时事实、中台只接入展示的边界。</desc>

  <text x="40" y="46" class="title">数据权威 · 订单单写者与实时事实来源</text>
  <text x="40" y="72" class="subtitle">MySQL 表按所有权写入；Redis Stream 信封由中台冻结，事实由源系统发布</text>

  <rect x="40" y="108" width="250" height="90" rx="12" fill="#EEF5F8" stroke="#1E4F6F" stroke-width="2"/>
  <text x="165" y="141" text-anchor="middle" class="card-title">MFMS 数据中台</text>
  <text x="165" y="166" text-anchor="middle" class="body">接单 · 变更请求 · 组合查询</text>
  <text x="165" y="187" text-anchor="middle" class="small">接入实时事实，不改写源端状态</text>

  <rect x="330" y="108" width="250" height="90" rx="12" fill="#FFF8EE" stroke="#C58A2A" stroke-width="2"/>
  <text x="455" y="141" text-anchor="middle" class="card-title">调度实例</text>
  <text x="455" y="166" text-anchor="middle" class="body">竞争接管 · 拆解 · 汇总结果</text>
  <text x="455" y="187" text-anchor="middle" class="small">初期以 order_uid 唯一约束认领</text>

  <rect x="660" y="108" width="230" height="90" rx="12" fill="#ECF7F4" stroke="#2A7F76" stroke-width="2"/>
  <text x="775" y="141" text-anchor="middle" class="card-title">Adapter</text>
  <text x="775" y="166" text-anchor="middle" class="body">发布 AGV 运单执行事实</text>
  <text x="775" y="187" text-anchor="middle" class="small">进度 · 拒绝 · 故障 · 完成</text>

  <rect x="930" y="108" width="270" height="90" rx="12" fill="#FFF3F1" stroke="#B85555" stroke-width="2"/>
  <text x="1065" y="141" text-anchor="middle" class="card-title">下位机</text>
  <text x="1065" y="166" text-anchor="middle" class="body">发布设备、传感器、控制权事实</text>
  <text x="1065" y="187" text-anchor="middle" class="small">控制权与物理设备的唯一权威</text>

  <rect x="40" y="250" width="710" height="374" rx="18" fill="#FFFFFF" stroke="#C58A2A" stroke-width="2.5"/>
  <text x="395" y="287" text-anchor="middle" class="card-title">MySQL · 四张核心表【推荐基线】</text>

  <rect x="70" y="316" width="310" height="112" rx="10" fill="#EEF5F8" stroke="#1E4F6F" stroke-width="1.6"/>
  <text x="92" y="346" class="card-title">mfms_order_request</text>
  <rect x="272" y="329" width="88" height="25" rx="12" fill="#1E4F6F"/>
  <text x="316" y="347" text-anchor="middle" class="small" fill="#FFFFFF">中台写</text>
  <text x="92" y="378" class="body">原始业务意图 · payload · 状态入口</text>
  <text x="92" y="403" class="small">调度只读，不回写同一行</text>

  <rect x="410" y="316" width="310" height="112" rx="10" fill="#FFF8EE" stroke="#C58A2A" stroke-width="1.6"/>
  <text x="432" y="346" class="card-title">mfms_order_execution</text>
  <rect x="612" y="329" width="88" height="25" rx="12" fill="#C58A2A"/>
  <text x="656" y="347" text-anchor="middle" class="small" fill="#FFFFFF">调度写</text>
  <text x="432" y="378" class="body">接管者 · 执行状态 · 结果摘要</text>
  <text x="432" y="403" class="small">order_uid 唯一约束用于初期认领</text>

  <rect x="70" y="458" width="310" height="112" rx="10" fill="#FFF8EE" stroke="#C58A2A" stroke-width="1.6"/>
  <text x="92" y="488" class="card-title">mfms_order_execution_binding</text>
  <rect x="272" y="471" width="88" height="25" rx="12" fill="#C58A2A"/>
  <text x="316" y="489" text-anchor="middle" class="small" fill="#FFFFFF">调度写</text>
  <text x="92" y="520" class="body">execution ↔ AGV/Adapter 执行单元</text>
  <text x="92" y="545" class="small">支撑统一 OrderView 与追踪</text>

  <rect x="410" y="458" width="310" height="112" rx="10" fill="#F7F2E8" stroke="#8A7653" stroke-width="1.6"/>
  <text x="432" y="488" class="card-title">mfms_order_change_request</text>
  <text x="432" y="520" class="body">中台写：请求字段、原因、申请人</text>
  <text x="432" y="545" class="body">调度写：处理状态、结果、完成时间</text>

  <rect x="790" y="250" width="410" height="374" rx="18" fill="#FFFFFF" stroke="#2A7F76" stroke-width="2.5"/>
  <text x="995" y="287" text-anchor="middle" class="card-title">Redis Stream · 统一消息信封</text>

  <rect x="820" y="316" width="350" height="120" rx="10" fill="#ECF7F4" stroke="#2A7F76" stroke-width="1.6"/>
  <text x="995" y="342" text-anchor="middle" class="body" font-weight="700">生产者必须提供</text>
  <text x="995" y="370" text-anchor="middle" class="small">message_type · schema_version · factory_id</text>
  <text x="995" y="393" text-anchor="middle" class="small">device_id · source_type · source_instance_id</text>
  <text x="995" y="416" text-anchor="middle" class="small">sequence · observed_at · payload</text>

  <rect x="820" y="450" width="350" height="136" rx="10" fill="#EEF5F8" stroke="#1E4F6F" stroke-width="1.6"/>
  <text x="995" y="477" text-anchor="middle" class="body" font-weight="700">中台补充并形成快照</text>
  <text x="995" y="503" text-anchor="middle" class="small">received_at · stream_entry_id</text>
  <text x="995" y="528" text-anchor="middle" class="small">StateManager：UNKNOWN · FRESH</text>
  <text x="995" y="551" text-anchor="middle" class="small">STALE · UNSUPPORTED</text>
  <text x="995" y="574" text-anchor="middle" class="small">同源查重/乱序；不同来源不互相覆盖</text>

  <path d="M165 198 V224 H225 V316" class="edge" stroke="#1E4F6F" marker-end="url(#arrow-blue)"/>
  <text x="112" y="231" class="small">request / 请求字段</text>
  <path d="M455 198 V224 H565 V316" class="edge" stroke="#C58A2A" marker-end="url(#arrow-amber)"/>
  <text x="470" y="231" class="small">execution / binding / 结果字段</text>

  <path d="M775 198 V224 H900 V316" class="edge" stroke="#2A7F76" marker-end="url(#arrow-teal)"/>
  <path d="M1065 198 V316" class="edge" stroke="#2A7F76" marker-end="url(#arrow-teal)"/>
  <path d="M820 510 H770 V224 H190 V198" class="edge" stroke="#1E4F6F" marker-end="url(#arrow-blue)"/>
  <text x="774" y="492" text-anchor="end" class="small">接入/缓存/展示</text>

  <text x="40" y="665" class="small">边界原则：写者按表或字段唯一；中台不把实时缓存变成业务主数据，也不介入调度实例选主。</text>
</svg>
