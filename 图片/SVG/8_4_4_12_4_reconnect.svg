<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<title>重连后：保留 MR，不保留旧 descriptor 的提交资格</title>
<desc>示例故意保持地址、rkey、对象代次不变，只更换会话与 grant 身份。。中文教学示意；状态编号与时间间距不代表实测延迟。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="redarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="greenarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="690" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="49" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start">重连后：保留 MR，不保留旧 descriptor 的提交资格</text>
<text x="48" y="79" font-size="13.5" fill="#6B675C" font-weight="400" text-anchor="start">示例故意保持地址、rkey、对象代次不变，只更换会话与 grant 身份。</text>
<rect x="40" y="111" width="375" height="339" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="465" y="111" width="319" height="339" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="835" y="111" width="365" height="339" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="60" y="141" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">A · 远端元数据缓存</text>
<rect x="61" y="162" width="331" height="99" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="226.5" y="195.5" font-size="14" fill="#6B4E28" font-weight="700" text-anchor="middle">旧副本 D41</text>
<text x="226.5" y="216.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">session 41 · grant 90</text>
<text x="226.5" y="237.5" font-size="13" fill="#6B4E28" font-weight="400" text-anchor="middle">base A · rkey K · gen 8</text>
<rect x="61" y="314" width="331" height="99" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="226.5" y="347.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">新副本 D42</text>
<text x="226.5" y="368.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">session 42 · grant 91</text>
<text x="226.5" y="389.5" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">base A · rkey K · gen 8</text>
<text x="486" y="141" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">B · 新会话提交门</text>
<text x="491" y="181" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start">session 42 · READY</text>
<text x="491" y="215" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">只匹配当前权威 D42</text>
<text x="491" y="248" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start">grant 必须 ACTIVE</text>
<line x1="418" y1="217" x2="459" y2="217" stroke="#A64B3C" stroke-width="1.7"/>
<line x1="437" y1="210" x2="451" y2="224" stroke="#A64B3C" stroke-width="2.5"/>
<line x1="437" y1="224" x2="451" y2="210" stroke="#A64B3C" stroke-width="2.5"/>
<text x="491" y="284" font-size="13" fill="#733428" font-weight="700" text-anchor="start">D41：STALE_SESSION</text>
<line x1="418" y1="363" x2="459" y2="363" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#greenarr)"/>
<text x="491" y="368" font-size="14" fill="#24473F" font-weight="700" text-anchor="start">D42：允许保留并提交</text>
<text x="856" y="141" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">C · 数据路径</text>
<rect x="859" y="172" width="316" height="75" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1017.0" y="204.0" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle">新 QP / 同一 PD</text>
<text x="1017.0" y="225.0" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle">MR 可继续保留</text>
<rect x="859" y="314" width="316" height="83" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1017.0" y="350.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle">目标 RNIC</text>
<text x="1017.0" y="371.0" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle">校验地址 A / key K</text>
<line x1="790" y1="364" x2="852" y2="364" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#greenarr)"/>
<text x="858" y="278" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="start">session 不是普通 MR 的硬件字段</text>
<text x="54" y="488" font-size="15" fill="#4A473F" font-weight="700" text-anchor="start">D · 绕过软件门会怎样？</text>
<path d="M68,530 L1150,530 L1150,455" fill="none" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#redarr)" stroke-dasharray="6 4"/>
<text x="70" y="521" font-size="13" fill="#733428" font-weight="400" text-anchor="start">旧 rkey 仍有效时，软件 generation 无法阻止直接发起的旧授权访问</text>
<text x="70" y="570" font-size="14" fill="#733428" font-weight="700" text-anchor="start">强制边界：失效适用的 MW / 独立 MR，或隔离全部旧访问路径。</text>
<line x1="48" y1="625" x2="1192" y2="625" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="654" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start">这里防的是“旧副本在新 QP 上重新 post”，不是声称旧 QP 的网络包会自动变成新 QP 的合法包。</text>
</svg>