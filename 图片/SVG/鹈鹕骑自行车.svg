<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只戴着红色头盔的鹈鹕骑着蓝色自行车，沿着海边小路前进。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE5F2"/>
      <stop offset="1" stop-color="#F8E9C7"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73C5D7"/>
      <stop offset="1" stop-color="#A6E0DE"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="rgb(245, 244, 237)"/>
  <rect x="0" y="0" width="1200" height="470" fill="url(#sky)"/>
  <circle cx="980" cy="125" r="54" fill="#FFF0B7" opacity="0.9"/>
  <circle cx="980" cy="125" r="76" fill="none" stroke="#FFF0B7" stroke-width="3" opacity="0.45"/>

  <g fill="#FFFFFF" opacity="0.72">
    <path d="M128 145c18-25 56-25 73 0 23-19 65-4 67 25H96c2-17 14-25 32-25z"/>
    <path d="M720 92c14-20 45-20 59 0 19-15 49-3 51 20H694c2-13 11-20 26-20z"/>
    <path d="M410 205c13-19 42-19 56 0 18-14 46-3 48 19H386c2-12 10-19 24-19z"/>
  </g>

  <path d="M0 330 C180 300 300 350 470 325 S800 290 1200 330 L1200 470 L0 470Z" fill="url(#water)"/>
  <g fill="none" stroke="#D8F3ED" stroke-width="4" opacity="0.7">
    <path d="M35 370c60-18 120-18 180 0s120 18 180 0"/>
    <path d="M740 385c58-18 118-18 176 0s118 18 176 0"/>
    <path d="M230 420c50-14 100-14 150 0s100 14 150 0"/>
  </g>

  <path d="M0 430 C170 397 345 420 520 405 S890 396 1200 425 L1200 700 L0 700Z" fill="#D7E6BE"/>
  <path d="M0 515 C245 470 480 520 690 500 S1000 475 1200 515 L1200 700 L0 700Z" fill="#E4C88F"/>
  <path d="M0 608 C240 570 480 620 700 595 S1010 575 1200 610 L1200 700 L0 700Z" fill="#6C9B62"/>
  <path d="M0 610 C230 575 470 620 700 595 S1015 580 1200 610" fill="none" stroke="#4B734B" stroke-width="5" opacity="0.8"/>

  <g fill="#67955D" opacity="0.85">
    <path d="M90 505l13-45 13 45zM122 508l18-60 18 60zM1020 492l15-52 15 52zM1080 500l18-64 18 64z"/>
  </g>
  <g fill="#F2B25C">
    <circle cx="160" cy="535" r="6"/><circle cx="184" cy="525" r="5"/><circle cx="1035" cy="540" r="6"/><circle cx="1060" cy="528" r="5"/>
  </g>

  <!-- bicycle shadow -->
  <ellipse cx="600" cy="598" rx="245" ry="24" fill="#3E5A49" opacity="0.18"/>

  <!-- bicycle -->
  <g filter="url(#softShadow)">
    <circle cx="430" cy="555" r="83" fill="none" stroke="#244D70" stroke-width="10"/>
    <circle cx="775" cy="555" r="83" fill="none" stroke="#244D70" stroke-width="10"/>
    <g fill="none" stroke="#8EB7C7" stroke-width="2" opacity="0.8">
      <path d="M430 472v166M347 555h166M371 496l118 118M489 496L371 614"/>
      <path d="M775 472v166M692 555h166M716 496l118 118M834 496L716 614"/>
    </g>
    <path d="M430 555 L558 455 L675 555 L430 555 L594 555 L558 455" fill="none" stroke="#2B668B" stroke-width="11" stroke-linejoin="round"/>
    <path d="M675 555 L745 458 L775 555" fill="none" stroke="#2B668B" stroke-width="11" stroke-linejoin="round"/>
    <path d="M745 458h39" stroke="#2B668B" stroke-width="10" stroke-linecap="round"/>
    <path d="M548 450l-13-25" stroke="#2B668B" stroke-width="10" stroke-linecap="round"/>
    <path d="M520 423h32" stroke="#2B668B" stroke-width="9" stroke-linecap="round"/>
    <circle cx="594" cy="555" r="16" fill="#E9B85F" stroke="#7A5427" stroke-width="5"/>
    <path d="M594 555l53-23M594 555l-36 31" stroke="#7A5427" stroke-width="6" stroke-linecap="round"/>
    <path d="M648 532l25 8M558 586l-25 8" stroke="#7A5427" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- pelican body and legs -->
  <g filter="url(#softShadow)">
    <ellipse cx="594" cy="351" rx="105" ry="122" fill="#F5F1E7" stroke="#6F7F7E" stroke-width="4"/>
    <path d="M527 414c18 22 36 37 62 43 23 5 45-2 63-16" fill="none" stroke="#C9D0C6" stroke-width="15" stroke-linecap="round"/>
    <path d="M550 432 L530 515 L570 530" fill="none" stroke="#D36C3C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M636 432 L664 515 L700 518" fill="none" stroke="#D36C3C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="530" cy="515" r="9" fill="#D36C3C"/><circle cx="664" cy="515" r="9" fill="#D36C3C"/>

    <!-- neck and head -->
    <path d="M620 285c10-58 30-87 70-110" fill="none" stroke="#F5F1E7" stroke-width="47" stroke-linecap="round"/>
    <path d="M620 285c10-58 30-87 70-110" fill="none" stroke="#6F7F7E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="691" cy="165" r="73" fill="#F5F1E7" stroke="#6F7F7E" stroke-width="4"/>
    <!-- helmet -->
    <path d="M632 145c9-48 77-72 118-24 9 10 15 23 17 39l-17 8-102-4z" fill="#D94F45" stroke="#8E332D" stroke-width="4"/>
    <path d="M645 145c31-17 77-18 112 1" fill="none" stroke="#F58A6E" stroke-width="7" stroke-linecap="round"/>
    <path d="M658 127l-5-18M685 119l1-21M713 122l8-20" stroke="#8E332D" stroke-width="4" stroke-linecap="round"/>
    <!-- beak -->
    <path d="M721 172 C794 160 846 183 849 206 C817 224 772 221 721 199Z" fill="#F0A94B" stroke="#9D6326" stroke-width="4"/>
    <path d="M726 193c37 8 76 5 110-8" fill="none" stroke="#D77B32" stroke-width="4"/>
    <circle cx="718" cy="159" r="8" fill="#2B2A26"/>
    <circle cx="721" cy="156" r="2.5" fill="#FFFFFF"/>
    <!-- wing -->
    <path d="M537 305c-54 35-69 104-36 153 27 5 61-23 80-63 18-39 14-70-7-90z" fill="#E5E5DA" stroke="#6F7F7E" stroke-width="4"/>
    <path d="M515 354c18 15 36 28 57 36M507 379c20 12 38 20 57 24" fill="none" stroke="#B7C1B7" stroke-width="4" stroke-linecap="round"/>

    <!-- handlebars grip -->
    <path d="M648 284c16 2 32 9 45 19" fill="none" stroke="#D36C3C" stroke-width="10" stroke-linecap="round"/>
    <circle cx="696" cy="303" r="10" fill="#D36C3C"/>
  </g>

  <!-- little motion marks -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M245 553h50M230 574h34"/>
    <path d="M890 520h42M905 542h27"/>
  </g>

  <text x="52" y="65" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="700" fill="#2B2A26">鹈鹕骑自行车</text>
  <text x="54" y="94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" fill="#5D6E68">海风、车轮，还有一段轻快的沿海小路</text>
</svg>
