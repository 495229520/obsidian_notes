<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">AF_XDP Zero-Copy：省的是复制，不是数据传输</title><desc id="desc">Copy 模式从驱动缓冲复制到 UMEM，Zero-Copy 使用 UMEM 对应主机页供 NIC DMA；chunk 中的报文地址与 frame base 不同。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="48" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">AF_XDP Zero-Copy：省的是复制，不是数据传输</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">上半图比较典型 RX 数据主体路径；下半图区分 frame 身份与 packet 起点。布局不是时延或字节比例。</text>
<rect x="48" y="113" width="1144" height="217" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="67" y="140" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">A · RX 路径</text>
<text x="75" y="188" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="body">Copy</text>
<rect x="160" y="158" width="145" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="232.5" y="179.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="160,158,145,54">NIC</text>
<text x="232.5" y="200.5" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="160,158,145,54">DMA</text>
<rect x="369" y="158" width="229" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="483.5" y="179.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="369,158,229,54">驱动接收缓冲</text>
<text x="483.5" y="200.5" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="369,158,229,54">主机内存</text>
<rect x="742" y="158" width="216" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="850.0" y="179.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-region="body" data-box="742,158,216,54">UMEM frame</text>
<text x="850.0" y="200.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body" data-box="742,158,216,54">主机内存</text>
<rect x="1024" y="158" width="147" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1097.5" y="179.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-region="body" data-box="1024,158,147,54">应用读取</text>
<text x="1097.5" y="200.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body" data-box="1024,158,147,54">同一份 UMEM</text>
<path d="M305,185 L363,185" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M598,185 L736,185" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M958,185 L1018,185" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="666" y="170" font-size="13" fill="#733428" font-weight="400" text-anchor="middle" data-region="body">CPU copy</text>
<text x="69" y="281" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="body">Zero-Copy</text>
<rect x="160" y="249" width="145" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="232.5" y="270.5" font-size="14" fill="#2C4460" font-weight="700" text-anchor="middle" data-region="body" data-box="160,249,145,54">NIC</text>
<text x="232.5" y="291.5" font-size="12.5" fill="#2C4460" font-weight="400" text-anchor="middle" data-region="body" data-box="160,249,145,54">DMA</text>
<rect x="742" y="249" width="216" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="850.0" y="270.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-region="body" data-box="742,249,216,54">UMEM frame</text>
<text x="850.0" y="291.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body" data-box="742,249,216,54">注册 / 映射的主机页</text>
<rect x="1024" y="249" width="147" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="1097.5" y="270.5" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-region="body" data-box="1024,249,147,54">应用读取</text>
<text x="1097.5" y="291.5" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body" data-box="1024,249,147,54">同一份 UMEM</text>
<path d="M305,276 L736,276" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M958,276 L1018,276" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="518" y="264" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body">NIC 直接 DMA 到 UMEM 对应页面</text>
<text x="518" y="307" font-size="12.5" fill="#6B675C" font-weight="400" text-anchor="middle" data-region="body">驱动仍协调队列、映射与所有权</text>
<rect x="48" y="355" width="1144" height="246" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="67" y="383" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="caption">B · 一个 aligned chunk：packet 起点由描述符给出</text>
<rect x="77" y="417" width="190" height="67" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="172.0" y="445.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-region="body" data-box="77,417,190,67">保留空间</text>
<text x="172.0" y="466.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-region="body" data-box="77,417,190,67">依接收路径</text>
<rect x="267" y="417" width="243" height="67" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="388.5" y="445.0" font-size="14" fill="#4A3F68" font-weight="700" text-anchor="middle" data-region="body" data-box="267,417,243,67">headroom / metadata</text>
<text x="388.5" y="466.0" font-size="12.5" fill="#4A3F68" font-weight="400" text-anchor="middle" data-region="body" data-box="267,417,243,67">按配置与约定</text>
<rect x="510" y="417" width="450" height="67" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="735.0" y="445.0" font-size="14" fill="#24473F" font-weight="700" text-anchor="middle" data-region="body" data-box="510,417,450,67">packet 数据</text>
<text x="735.0" y="466.0" font-size="12.5" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body" data-box="510,417,450,67">协议头 + payload</text>
<rect x="960" y="417" width="211" height="67" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1065.5" y="445.0" font-size="14" fill="#4A473F" font-weight="700" text-anchor="middle" data-region="body" data-box="960,417,211,67">剩余空间</text>
<text x="1065.5" y="466.0" font-size="12.5" fill="#4A473F" font-weight="400" text-anchor="middle" data-region="body" data-box="960,417,211,67">不是有效 packet</text>
<path d="M77,540 L77,489" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="77" y="563" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="body">chunk base</text>
<path d="M510,540 L510,489" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="510" y="563" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="body">desc.addr</text>
<path d="M960,540 L960,489" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="972" y="563" font-size="13" fill="#2B2A26" font-weight="700" text-anchor="start" data-region="body">addr + len</text>
<path d="M518,523 L953,523" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<path d="M518,518 L518,528" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<path d="M953,518 L953,528" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<text x="735" y="515" font-size="13" fill="#24473F" font-weight="400" text-anchor="middle" data-region="body">desc.len · packet 长度</text>
<text x="77" y="590" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-region="caption">读取：UMEM base + offset；回收：按 frame ID 归还。</text>
<rect x="48" y="632" width="1144" height="38" rx="7" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="65" y="657" font-size="13" fill="#4A473F" font-weight="400" text-anchor="start" data-region="caption">示例采用 4096 B aligned chunk；headroom 不按比例。unaligned / multi-buffer 必须使用对应地址与分段规则。</text>
</svg>
