<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<title id="title">从一条 WR 到 WQE：请求单位与硬件块单位不同</title><desc id="desc">上方将通用WR映射为三个16字节设备segment与对齐空余；中部演示WR跨多个基本块和影子映射；底部展示传统链表的部分提交。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.4"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">从一条 WR 到 WQE：请求单位与硬件块单位不同</text>
<text x="48" y="82" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">RC WRITE / 非 inline / 单个非零 SGE：48 B 描述符，按 64 B WQEBB 推进。</text>
<rect x="48" y="132" width="278" height="159" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="187.0" y="187.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">应用 WR</text>
<text x="187.0" y="206.76" font-size="12" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">opcode = WRITE</text>
<text x="187.0" y="225.76" font-size="12" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">SGE → 4 KiB payload</text>
<text x="187.0" y="244.76" font-size="12" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">wr_id = 应用标记</text>
<path d="M331,212 L417,212" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="374" y="192" font-size="12" font-weight="700" fill="#2B2A26" text-anchor="middle" data-role="body">编码</text>
<text x="434" y="139" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">一个 WQEBB · 64 B</text>
<rect x="430" y="179" width="188" height="97" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="524.0" y="221.42" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Control</text>
<text x="524.0" y="242.42" font-size="12" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">16 B</text>
<rect x="618" y="179" width="188" height="97" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="712.0" y="221.42" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">Remote addr</text>
<text x="712.0" y="242.42" font-size="12" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">16 B / rkey</text>
<rect x="806" y="179" width="188" height="97" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="900.0" y="221.42" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">Data</text>
<text x="900.0" y="242.42" font-size="12" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">16 B / lkey</text>
<rect x="994" y="179" width="188" height="97" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
<text x="1088.0" y="221.42" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">对齐空余</text>
<text x="1088.0" y="242.42" font-size="12" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">16 B</text>
<line x1="431" y1="162" x2="994" y2="162" stroke="#3D5A80" stroke-width="1.3"/>
<text x="712" y="153" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">DS = 3 → 48 B</text>
<text x="433" y="304" font-size="13" font-weight="700" fill="#2C4460" text-anchor="start" data-role="body">payload 不在非 inline WQE 内</text>
<rect x="48" y="326" width="1144" height="186" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text x="68" y="355" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">SQ 环：本示例 A 占 1 块，B 占 2 块，C 占 1 块</text>
<rect x="376" y="380" width="96" height="58" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
<text x="424.0" y="413.42" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">A</text>
<text x="424" y="457" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">0</text>
<rect x="475" y="380" width="96" height="58" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="523.0" y="413.42" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">B</text>
<text x="523" y="457" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">1</text>
<rect x="574" y="380" width="96" height="58" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="622.0" y="413.42" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">B 续块</text>
<text x="622" y="457" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">2</text>
<rect x="673" y="380" width="96" height="58" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
<text x="721.0" y="413.42" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">C</text>
<text x="721" y="457" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">3</text>
<rect x="772" y="380" width="96" height="58" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
<text x="820.0" y="413.42" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">空闲</text>
<text x="820" y="457" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">4</text>
<rect x="871" y="380" width="96" height="58" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
<text x="919.0" y="413.42" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">空闲</text>
<text x="919" y="457" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">5</text>
<rect x="970" y="380" width="96" height="58" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
<text x="1018.0" y="413.42" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">空闲</text>
<text x="1018" y="457" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">6</text>
<rect x="1069" y="380" width="96" height="58" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
<text x="1117.0" y="413.42" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">空闲</text>
<text x="1117" y="457" font-size="11" font-weight="400" fill="#6B675C" text-anchor="middle" data-role="body">7</text>
<text x="68" y="396" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">head / tail：WR 单位</text>
<text x="68" y="424" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">cur_post：WQEBB 单位</text>
<text x="68" y="478" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">shadow：起始块 → wr_id 与 WR 序号</text>
<text x="642" y="489" font-size="12" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">CQE counter → 起始块 → 回收 WR</text>
<rect x="48" y="535" width="1144" height="110" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
<text x="68" y="563" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">传统 WR 链表失败：已接受前缀仍可能发布</text>
<rect x="72" y="584" width="242" height="42" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="193.0" y="609.42" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">WR0 · 已接受</text>
<rect x="360" y="584" width="242" height="42" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
<text x="481.0" y="609.42" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">WR1 · 已接受</text>
<rect x="648" y="584" width="242" height="42" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
<text x="769.0" y="609.42" font-size="13" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">WR2 · bad_wr</text>
<rect x="936" y="584" width="232" height="42" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
<text x="1052.0" y="609.42" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">WR3 · 未处理</text>
<path d="M317,605 L356,605" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M605,605 L644,605" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M893,605 L932,605" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="48" y="673" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="scope">固定 mlx5 布局示例；更多 SGE、不同操作或 inline 会改变 WQE 长度，不可推广为所有 provider。</text>
</svg>