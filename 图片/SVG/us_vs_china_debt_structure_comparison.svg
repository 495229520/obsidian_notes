<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #475569; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
    .section-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #64748b; }
    .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #1e293b; font-weight: 600; }
    .val-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; }
    .footnote { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #64748b; }
    .grid-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 8px; }
    .highlight-card { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 8px; }
    .metric-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #475569; }
    .metric-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 11.5px; fill: #1e293b; }
  </style>
  <text x="60" y="36" class="title">中美政府端债务底层特征深度对比：持有人结构与全球闭环机制</text>
  <text x="60" y="60" class="subtitle">美国国债(~24%外债+全球美元循环) vs 中国政府债(&gt;96%内债+国内商业银行承接闭环)</text>
  <rect x="60" y="85" width="495" height="260" class="grid-card"/>
  <text x="80" y="115" class="card-title" fill="#2563EB">🇺🇸 美国国债持有人结构 (总规模 ~$35.5万亿美元)</text>
  <text x="80" y="135" class="section-desc">全球化外债属性极高，但本土养老金与共同基金依然占大头</text>
  <text x="80" y="167" class="label-text">海外投资者 (官方央行+私人外资)</text>
  <text x="420" y="167" class="val-text" text-anchor="start">24.5%</text>
  <rect x="80" y="173" width="455" height="8" fill="#e2e8f0" rx="3"/>
  <rect x="80" y="173" width="111.5" height="8" fill="#3B82F6" rx="3"/>
  <text x="80" y="203" class="label-text">国内共同基金与商业银行</text>
  <text x="420" y="203" class="val-text" text-anchor="start">31.0%</text>
  <rect x="80" y="209" width="455" height="8" fill="#e2e8f0" rx="3"/>
  <rect x="80" y="209" width="141.1" height="8" fill="#60A5FA" rx="3"/>
  <text x="80" y="239" class="label-text">国内联邦社保与养老基金</text>
  <text x="420" y="239" class="val-text" text-anchor="start">21.0%</text>
  <rect x="80" y="245" width="455" height="8" fill="#e2e8f0" rx="3"/>
  <rect x="80" y="245" width="95.5" height="8" fill="#93C5FD" rx="3"/>
  <text x="80" y="275" class="label-text">美联储 (Federal Reserve)</text>
  <text x="420" y="275" class="val-text" text-anchor="start">13.5%</text>
  <rect x="80" y="281" width="455" height="8" fill="#e2e8f0" rx="3"/>
  <rect x="80" y="281" width="61.4" height="8" fill="#BFDBFE" rx="3"/>
  <text x="80" y="311" class="label-text">个人与企业其他投资者</text>
  <text x="420" y="311" class="val-text" text-anchor="start">10.0%</text>
  <rect x="80" y="317" width="455" height="8" fill="#e2e8f0" rx="3"/>
  <rect x="80" y="317" width="45.5" height="8" fill="#DBEAFE" rx="3"/>
  <rect x="605" y="85" width="495" height="260" class="grid-card"/>
  <text x="625" y="115" class="card-title" fill="#DC2626">🇨🇳 中国法定政府债券持有人结构 (总规模 ~¥100.6万亿元)</text>
  <text x="625" y="135" class="section-desc">典型的纯内部循环（内债），商业银行吸收了超三分之二份额</text>
  <text x="625" y="167" class="label-text">国内商业银行 (四大行+股份行+城农商)</text>
  <text x="965" y="167" class="val-text" text-anchor="start">66.5%</text>
  <rect x="625" y="173" width="455" height="8" fill="#e2e8f0" rx="3"/>
  <rect x="625" y="173" width="302.6" height="8" fill="#EF4444" rx="3"/>
  <text x="625" y="203" class="label-text">非银机构 (保险公司+公募理财基金)</text>
  <text x="965" y="203" class="val-text" text-anchor="start">17.5%</text>
  <rect x="625" y="209" width="455" height="8" fill="#e2e8f0" rx="3"/>
  <rect x="625" y="209" width="79.6" height="8" fill="#F87171" rx="3"/>
  <text x="625" y="239" class="label-text">政策性银行与中国人民银行(央行)</text>
  <text x="965" y="239" class="val-text" text-anchor="start">8.5%</text>
  <rect x="625" y="245" width="455" height="8" fill="#e2e8f0" rx="3"/>
  <rect x="625" y="245" width="38.7" height="8" fill="#FCA5A5" rx="3"/>
  <text x="625" y="275" class="label-text">境外机构投资者 (外债口径)</text>
  <text x="965" y="275" class="val-text" text-anchor="start">3.5%</text>
  <rect x="625" y="281" width="455" height="8" fill="#e2e8f0" rx="3"/>
  <rect x="625" y="281" width="15.9" height="8" fill="#FECACA" rx="3"/>
  <text x="625" y="311" class="label-text">其他国内机构与个人</text>
  <text x="965" y="311" class="val-text" text-anchor="start">4.0%</text>
  <rect x="625" y="317" width="455" height="8" fill="#e2e8f0" rx="3"/>
  <rect x="625" y="317" width="18.2" height="8" fill="#FEE2E2" rx="3"/>
  <rect x="60" y="365" width="1040" height="240" class="highlight-card"/>
  <text x="80" y="395" class="card-title" fill="#0f172a">⚖️ 中美政府债务的四大底层本质差异对比表</text>
  <line x1="80" y1="410" x2="1080" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="428" class="metric-title">比较维度</text>
  <text x="230" y="428" class="metric-title">🇺🇸 美国国债 (US Treasuries)</text>
  <text x="660" y="428" class="metric-title">🇨🇳 中国政府债 (China Gov Bonds)</text>
  <text x="80" y="455" class="label-text" font-weight="700" fill="#0f172a">① 外债占比与性质</text>
  <text x="230" y="455" class="metric-body">外债占比约 24.5%（全球最高，超8.7万亿美元由海外持有，外生性极强）</text>
  <text x="660" y="455" class="metric-body">外债占比不足 3.5%（极度纯粹的内债，肉烂在锅里，几乎无外债挤兑风险）</text>
  <line x1="80" y1="467" x2="1080" y2="467" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="489" class="label-text" font-weight="700" fill="#0f172a">② 计价货币与霸权</text>
  <text x="230" y="489" class="metric-body">以全球第一储备货币【美元】计价，拥有全球铸币税，理论上无本币违约可能</text>
  <text x="660" y="489" class="metric-body">以主权货币【人民币】计价，主要服务于国内资本循环，无汇率硬性逼仓风险</text>
  <line x1="80" y1="501" x2="1080" y2="501" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="523" class="label-text" font-weight="700" fill="#0f172a">③ 债务承接机制</text>
  <text x="230" y="523" class="metric-body">全球央行储备资产+全球资本配置底仓+美联储最后兜底</text>
  <text x="660" y="523" class="metric-body">以国内商业银行为绝对持仓底仓(66.5%)+央行买卖国债与再融资协同</text>
  <line x1="80" y1="535" x2="1080" y2="535" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="557" class="label-text" font-weight="700" fill="#0f172a">④ 风险最终表现</text>
  <text x="230" y="557" class="metric-body">美债失控表现为【美元贬值、全球通胀与长端美债收益率暴冲】</text>
  <text x="660" y="557" class="metric-body">中国债务承压表现为【资金在银行间淤积、财政利息吞噬预算与低物价资产荒】</text>
  <line x1="80" y1="569" x2="1080" y2="569" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="642" class="footnote">数据综合自美国财政部(TIC报告)、美联储Flow of Funds、中国人民银行、中债登(CCDC)、Wind资讯</text>
</svg>