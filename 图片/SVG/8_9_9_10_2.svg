<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>跨层归因：先定位区间，再验证机制</title><desc>上方展示分位数反例，下方诊断阶梯按观测区间连接 CPU、NUMA、PCIe、Fabric、RDMA 和后端证据。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs><rect width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="47" font-size="22" fill="#2B2A26" font-weight="700">跨层归因：先定位区间，再验证机制</text>
<text x="48" y="77" font-size="14" fill="#6B675C">满核、PFC、长回调都是线索；可逆干预与同负载复测才形成证据链</text>
<rect x="48" y="107" width="1144" height="105" rx="7" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<text x="64" y="134" font-size="15" fill="#2B2A26" font-weight="700">A · 100 个请求的反例（μs；框宽不编码数量占比）</text>
<text x="64" y="160" font-size="13" fill="#2B2A26" font-weight="700">A 段</text>
<rect x="64" y="171" width="238" height="25" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="183.0" y="189" font-size="12" fill="#2B2A26" text-anchor="middle">99 × 1</text>
<rect x="307" y="171" width="66" height="25" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="340.0" y="189" font-size="12" fill="#2B2A26" text-anchor="middle">1 × 101</text>
<text x="448" y="160" font-size="13" fill="#2B2A26" font-weight="700">B 段</text>
<rect x="448" y="171" width="238" height="25" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="567.0" y="189" font-size="12" fill="#2B2A26" text-anchor="middle">99 × 1</text>
<rect x="691" y="171" width="66" height="25" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="724.0" y="189" font-size="12" fill="#2B2A26" text-anchor="middle">1 × 101</text>
<text x="832" y="160" font-size="13" fill="#2B2A26" font-weight="700">总和</text>
<rect x="832" y="171" width="238" height="25" rx="2" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="951.0" y="189" font-size="12" fill="#2B2A26" text-anchor="middle">98 × 2</text>
<rect x="1075" y="171" width="66" height="25" rx="2" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="1108.0" y="189" font-size="12" fill="#2B2A26" text-anchor="middle">2 × 102</text>
<text x="48" y="246" font-size="15" fill="#2B2A26" font-weight="700">B · 哪个观测区间先变长？</text>
<text x="460" y="246" font-size="14" fill="#2B2A26" font-weight="700">证据</text>
<text x="885" y="246" font-size="14" fill="#2B2A26" font-weight="700">可逆干预 / 复测</text>
<rect x="48" y="265" width="1144" height="51" rx="3" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<rect x="62" y="275" width="18" height="29" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="90" y="296" font-size="14" fill="#2B2A26" font-weight="700">Host 提交 / 完成</text>
<text x="460" y="296" font-size="14" fill="#2B2A26">CPU / 实际 QD / 调度</text>
<text x="885" y="296" font-size="13" fill="#2B2A26">固定负载，隔离干扰线程</text>
<line x1="843" y1="275" x2="843" y2="306" stroke="#D8D5C8" stroke-width="1.6"/>
<rect x="48" y="324" width="1144" height="51" rx="3" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<rect x="82" y="334" width="18" height="29" rx="2" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="110" y="355" font-size="14" fill="#2B2A26" font-weight="700">Target 资源 pending</text>
<text x="460" y="355" font-size="14" fill="#2B2A26">缓冲 / RQ / RDMA READ 窗口</text>
<text x="885" y="355" font-size="13" fill="#2B2A26">验证资源配置与恢复推进</text>
<line x1="843" y1="334" x2="843" y2="365" stroke="#D8D5C8" stroke-width="1.6"/>
<rect x="48" y="383" width="1144" height="51" rx="3" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<rect x="102" y="393" width="18" height="29" rx="2" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="130" y="414" font-size="14" fill="#2B2A26" font-weight="700">后端提交 → 回调</text>
<text x="460" y="414" font-size="14" fill="#2B2A26">bdev / SSD / CQ 观察间隔</text>
<text x="885" y="414" font-size="13" fill="#2B2A26">原位 trace + 同后端对照</text>
<line x1="843" y1="393" x2="843" y2="424" stroke="#D8D5C8" stroke-width="1.6"/>
<rect x="48" y="442" width="1144" height="51" rx="3" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<rect x="122" y="452" width="18" height="29" rx="2" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="150" y="473" font-size="14" fill="#2B2A26" font-weight="700">传输与未覆盖区间</text>
<text x="460" y="473" font-size="14" fill="#2B2A26">NIC / Switch / QP / 突发</text>
<text x="885" y="473" font-size="13" fill="#2B2A26">匹配平均负载，改变突发</text>
<line x1="843" y1="452" x2="843" y2="483" stroke="#D8D5C8" stroke-width="1.6"/>
<rect x="48" y="501" width="1144" height="51" rx="3" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
<rect x="142" y="511" width="18" height="29" rx="2" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="170" y="532" font-size="14" fill="#2B2A26" font-weight="700">跨段共同变化</text>
<text x="460" y="532" font-size="14" fill="#2B2A26">NUMA / PCIe / 内存带宽</text>
<text x="885" y="532" font-size="13" fill="#2B2A26">核对实际位置与协商链路</text>
<line x1="843" y1="511" x2="843" y2="542" stroke="#D8D5C8" stroke-width="1.6"/>
<rect x="48" y="584" width="1144" height="39" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="66" y="609" font-size="14" fill="#24473F" font-weight="700">固定合同 → 关联请求 → 提出假设 → A / B / A → 检查错误、吞吐、正确性与恢复</text>
<line x1="48" y1="646" x2="1192" y2="646" stroke="#5A564B" stroke-width="1.6"/>
<text x="48" y="674" font-size="13" fill="#6B675C">A、B 的 P99 都为 1 μs，总和 P99 却为 102 μs。P50 同样不可加减；合并桶计数，不平均分位数。</text>
</svg>