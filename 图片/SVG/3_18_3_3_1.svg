<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>

  <!-- 顶部标题区 -->
  <text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26">业务线程与 EventLoop 异步解耦时序</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">业务调用线程发起即返回，单 EventLoop 线程以 epoll_wait 承接多路网络等待与结果唤醒</text>

  <!-- 4 条参与者泳道头部 -->
  <rect x="68" y="98" width="220" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="178" y="125" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">业务调用线程 (App)</text>

  <rect x="362" y="98" width="220" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="472" y="125" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">客户端门面 (AsyncRpcClient)</text>

  <rect x="656" y="98" width="220" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="766" y="125" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">EventLoop 线程 (Reactor)</text>

  <rect x="950" y="98" width="220" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1060" y="125" font-size="13" font-weight="700" fill="#733428" text-anchor="middle">远端连接 (Peer Server)</text>

  <!-- 垂直虚线生命线 -->
  <line x1="178" y1="142" x2="178" y2="528" stroke="#B8B4A8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="472" y1="142" x2="472" y2="528" stroke="#B8B4A8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="766" y1="142" x2="766" y2="528" stroke="#B8B4A8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="1060" y1="142" x2="1060" y2="528" stroke="#B8B4A8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 阶段 1: 发起与快速返回 -->
  <rect x="172" y="156" width="12" height="106" rx="3" fill="#3D5A80"/>
  <rect x="466" y="166" width="12" height="86" rx="3" fill="#3D5A80"/>
  <rect x="760" y="186" width="12" height="66" rx="3" fill="#2F6B5E"/>

  <!-- 调用箭头1: App -> Client -->
  <line x1="184" y1="168" x2="464" y2="168" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="324" y="162" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">① AddViaRpcAsync(3, 4, deadline, cb)</text>

  <!-- 调用箭头2: Client -> Loop -->
  <line x1="478" y1="190" x2="758" y2="190" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="618" y="184" font-size="11.5" fill="#2C4460" text-anchor="middle">② CallAsync(method=Add, 8B body)</text>

  <!-- Loop 自调用: 登记 pending_calls -->
  <path d="M 772 204 L 810 204 L 810 224 L 774 224" fill="none" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <text x="818" y="218" font-size="10.5" fill="#24473F">③ 登记 pending_calls[id]</text>

  <!-- 返回箭头4: Loop/Client -> App (立即返回) -->
  <line x1="466" y1="246" x2="186" y2="246" stroke="#3D5A80" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr-blue)"/>
  <text x="324" y="240" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">④ 立即返回（调用栈退出，耗时 ~微秒）</text>

  <!-- 阶段 2: 异步等待与解耦区间 -->
  <rect x="80" y="278" width="196" height="96" rx="6" fill="#EDF1F7" stroke="#3D5A80" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="178" y="306" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">业务线程处于自由状态</text>
  <text x="178" y="328" font-size="10.5" fill="#4A473F" text-anchor="middle">无任何网络阻塞与休眠</text>
  <text x="178" y="348" font-size="10.5" fill="#4A473F" text-anchor="middle">可并行处理其他业务计算</text>

  <rect x="668" y="278" width="196" height="96" rx="6" fill="#E6EFEA" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="766" y="306" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">EventLoop 阻塞在 epoll_wait</text>
  <text x="766" y="328" font-size="10.5" fill="#4A473F" text-anchor="middle">单线程多路复用监听</text>
  <text x="766" y="348" font-size="10.5" fill="#4A473F" text-anchor="middle">等待内核套接字就绪事件</text>

  <rect x="962" y="278" width="196" height="96" rx="6" fill="#F4E9E4" stroke="#A64B3C" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1060" y="306" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">服务端执行 Add 计算</text>
  <text x="1060" y="328" font-size="10.5" fill="#4A473F" text-anchor="middle">计算 3 + 4 = 7</text>
  <text x="1060" y="348" font-size="10.5" fill="#4A473F" text-anchor="middle">编码 14B头 + 4B响应体</text>

  <!-- 阶段 3: 事件就绪与唤醒回调 -->
  <rect x="1054" y="394" width="12" height="30" rx="3" fill="#A64B3C"/>
  <rect x="760" y="408" width="12" height="110" rx="3" fill="#2F6B5E"/>
  <rect x="172" y="494" width="12" height="34" rx="3" fill="#3D5A80"/>

  <!-- 响应传输: Peer -> Loop -->
  <line x1="1054" y1="414" x2="774" y2="414" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="914" y="406" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">⑤ Response(id, OK, body=4B) 到达</text>

  <!-- Loop 解包: 自调用 -->
  <path d="M 772 432 L 810 432 L 810 452 L 774 452" fill="none" stroke="#2F6B5E" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <text x="818" y="446" font-size="10.5" fill="#24473F">⑥ epoll 唤醒 → 恢复 Frame → ReadU32</text>

  <!-- 回调唤醒: Loop -> App -->
  <line x1="760" y1="504" x2="186" y2="504" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <text x="472" y="496" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">⑦ 执行 callback(AddResult{7})</text>

  <!-- 底部对比总结卡片区 -->
  <rect x="48" y="552" width="360" height="96" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="66" y="578" font-size="13" font-weight="700" fill="#3D5A80">业务调用方 · 零阻塞</text>
  <text x="66" y="602" font-size="11" fill="#4A473F">发起请求仅需入队与登记，立即返回</text>
  <text x="66" y="624" font-size="11" fill="#4A473F">通过 Callback / Promise 接收计算结果</text>

  <rect x="440" y="552" width="360" height="96" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="458" y="578" font-size="13" font-weight="700" fill="#2F6B5E">EventLoop · 多路事件收口</text>
  <text x="458" y="602" font-size="11" fill="#4A473F">单线程以 epoll_wait 统一承接全部连接等待</text>
  <text x="458" y="624" font-size="11" fill="#4A473F">按 request_id 路由响应，无线程切换代价</text>

  <rect x="832" y="552" width="360" height="96" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="850" y="578" font-size="13" font-weight="700" fill="#A64B3C">模型优势 · 高并发支撑</text>
  <text x="850" y="602" font-size="11" fill="#4A473F">阻塞模型：并发受限于线程数量与栈内存</text>
  <text x="850" y="624" font-size="11" fill="#4A473F">非阻塞模型：万级连接仅需极少线程与状态</text>
</svg>
