<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">PCIe 是交换网络：带宽 = 代际 × 宽度，以协商结果为准</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">每条链路点对点独享带宽；插错槽、接触不良会静默降速——功能完全正常、速度打折，只有验收能看见</text>

  <!-- Root Complex -->
  <rect x="440" y="110" width="360" height="76" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="620" y="138" font-size="13.5" font-weight="700" fill="#2C4460" text-anchor="middle">CPU / Root Complex</text>
  <text x="620" y="162" font-size="10.5" fill="#2C4460" text-anchor="middle">每路直出 64–128 lane（稀缺资源）</text>

  <!-- 三条下行链路 -->
  <path d="M540,186 C430,220 300,244 222,294" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <text x="290" y="230" font-size="10.5" font-weight="700" fill="#4A473F">每盘一条 ×4 链路</text>

  <path d="M620,186 L620,294" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <text x="634" y="240" font-size="10.5" font-weight="700" fill="#4A473F">上行 Gen4 ×16</text>

  <path d="M700,186 C820,220 950,244 1024,294" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <text x="880" y="230" font-size="10.5" font-weight="700" fill="#4A473F">Gen4 ×16 ≈ 31.5 GB/s</text>

  <!-- 直连 SSD（叠影表示 ×8） -->
  <rect x="98" y="306" width="250" height="76" rx="7" fill="#F7EBE6" stroke="#C89A8E" stroke-width="1.2"/>
  <rect x="90" y="298" width="250" height="76" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="215" y="324" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">NVMe SSD × 8（直连）</text>
  <text x="215" y="348" font-size="10.5" fill="#733428" text-anchor="middle">每盘 Gen4 ×4 ≈ 7.9 GB/s 单向</text>

  <!-- Switch -->
  <rect x="430" y="298" width="380" height="76" rx="7" fill="#FAF9F2" stroke="#8A8574" stroke-width="1.4"/>
  <text x="620" y="324" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">PCIe Switch（扇出）</text>
  <text x="620" y="348" font-size="10.5" fill="#4A473F" text-anchor="middle">上行 ×16 ≈ 31.5 GB/s——下挂设备合计封顶</text>

  <!-- NIC -->
  <rect x="920" y="298" width="230" height="76" rx="7" fill="#E2E9ED" stroke="#4E6E81" stroke-width="1.4"/>
  <text x="1035" y="324" font-size="12.5" font-weight="700" fill="#33505F" text-anchor="middle">200G RDMA 网卡</text>
  <text x="1035" y="348" font-size="10.5" fill="#33505F" text-anchor="middle">25 GB/s 出口，必须给足 ×16</text>

  <!-- Switch 下挂三盘 -->
  <path d="M500,374 L478,454" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <path d="M620,374 L620,454" fill="none" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <path d="M740,374 L762,450" fill="none" stroke="#A64B3C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrr)"/>

  <rect x="400" y="458" width="150" height="64" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="475" y="480" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">NVMe ×4</text>
  <text x="475" y="502" font-size="10.5" fill="#2F6B5E" text-anchor="middle">≈ 7.9 GB/s ✓</text>

  <rect x="545" y="458" width="150" height="64" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="620" y="480" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">NVMe ×4</text>
  <text x="620" y="502" font-size="10.5" fill="#2F6B5E" text-anchor="middle">≈ 7.9 GB/s ✓</text>

  <rect x="690" y="458" width="170" height="64" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="775" y="480" font-size="12" font-weight="700" fill="#A64B3C" text-anchor="middle">NVMe 协商降速</text>
  <text x="775" y="502" font-size="10.5" fill="#A64B3C" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace">8 GT/s ×2 → ~2 GB/s</text>

  <text x="690" y="548" font-size="10.5" font-weight="700" fill="#A64B3C">LnkCap 说能跑 Gen4 ×4，LnkSta 实际 Gen3 ×2——功能正常、上限只剩四分之一</text>

  <!-- 底部三卡 -->
  <rect x="70" y="600" width="353" height="168" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="94" y="630" font-size="13" font-weight="700" fill="#2B2A26">每 lane 单向有效带宽【量级】</text>
  <text x="94" y="658" font-size="11.5" fill="#4A473F">Gen3 ≈ 1　Gen4 ≈ 2　Gen5 ≈ 4 GB/s</text>
  <text x="94" y="682" font-size="11.5" fill="#4A473F">盘位 ×4、网卡/插槽 ×16 照乘</text>
  <text x="94" y="706" font-size="11.5" fill="#4A473F">已扣 128b/130b 编码；TLP 包头再扣 5–10%</text>
  <text x="94" y="730" font-size="11.5" fill="#4A473F">收发双向各自独享（全双工）</text>

  <rect x="443" y="600" width="353" height="168" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="467" y="630" font-size="13" font-weight="700" fill="#2B2A26">链路验收命令</text>
  <text x="467" y="658" font-size="10.5" fill="#4A473F" font-family="'SF Mono',Menlo,Consolas,monospace">lspci -tv        # 整机拓扑树</text>
  <text x="467" y="682" font-size="10.5" fill="#4A473F" font-family="'SF Mono',Menlo,Consolas,monospace">lspci -vv -s BDF | grep -E 'LnkCap|LnkSta'</text>
  <text x="467" y="706" font-size="10.5" fill="#4A473F" font-family="'SF Mono',Menlo,Consolas,monospace">/sys/bus/pci/devices/BDF/current_link_speed</text>
  <text x="467" y="730" font-size="10.5" fill="#4A473F" font-family="'SF Mono',Menlo,Consolas,monospace">/sys/bus/pci/devices/BDF/current_link_width</text>

  <rect x="816" y="600" width="353" height="168" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="840" y="630" font-size="13" font-weight="700" fill="#2B2A26">降速 → p99 的因果链</text>
  <text x="840" y="658" font-size="11.5" fill="#4A473F">协商 = 两端代际、宽度各取最小</text>
  <text x="840" y="682" font-size="11.5" fill="#4A473F">降速盘上限变低 → 同负载下它先排队</text>
  <text x="840" y="706" font-size="11.5" fill="#4A473F">条带读被最慢分片拖住（木桶效应）</text>
  <text x="840" y="730" font-size="11.5" font-weight="700" fill="#A64B3C">→ 一块盘的暗伤抬高全节点 p99</text>
</svg>
