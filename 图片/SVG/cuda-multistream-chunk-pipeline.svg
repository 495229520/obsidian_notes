<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1040" viewBox="0 0 1380 1040">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #1f2933; }
      .h2 { font: 700 22px Arial, sans-serif; fill: #263238; }
      .h3 { font: 700 16px Arial, sans-serif; fill: #263238; }
      .text { font: 15px Arial, sans-serif; fill: #37474f; }
      .small { font: 13px Arial, sans-serif; fill: #455a64; }
      .tiny { font: 12px Arial, sans-serif; fill: #546e7a; }
      .panel { fill: #ffffff; stroke: #90a4ae; stroke-width: 1.7; rx: 16; }
      .note { fill: #e0f2f1; stroke: #00897b; stroke-width: 1.5; rx: 12; }
      .chunk0 { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.6; rx: 10; }
      .chunk1 { fill: #ede7f6; stroke: #673ab7; stroke-width: 1.6; rx: 10; }
      .chunk2 { fill: #e0f2f1; stroke: #00897b; stroke-width: 1.6; rx: 10; }
      .chunk3 { fill: #fff3e0; stroke: #ef6c00; stroke-width: 1.6; rx: 10; }
      .gray { fill: #f5f5f5; stroke: #9e9e9e; stroke-width: 1.4; rx: 10; }
      .h2d { fill: #e1f5fe; stroke: #0288d1; stroke-width: 1.7; rx: 9; }
      .kernel { fill: #fff8e1; stroke: #f9a825; stroke-width: 1.7; rx: 9; }
      .d2h { fill: #f3e5f5; stroke: #8e24aa; stroke-width: 1.7; rx: 9; }
      .lane { stroke: #b0bec5; stroke-width: 1.2; }
      .grid { stroke: #d7dee2; stroke-width: 1; stroke-dasharray: 7 8; }
      .arrow { stroke: #455a64; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .mapLine { stroke: #616161; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1380" height="1040" fill="rgb(245, 244, 237)"/>
  <text x="44" y="58" class="title">多个 chunk + 多个 stream 的流水线 overlap</text>

  <rect x="44" y="98" width="1292" height="140" class="panel"/>
  <text x="78" y="134" class="h2">第 1 步：大数组切成多个 chunk</text>
  <text x="78" y="164" class="small">chunk 只是人为切出来的数据片段，方便交给不同 stream 排队处理。</text>

  <rect x="92" y="184" width="196" height="42" class="chunk0"/>
  <text x="154" y="211" class="text">chunk 0</text>
  <rect x="342" y="184" width="196" height="42" class="chunk1"/>
  <text x="404" y="211" class="text">chunk 1</text>
  <rect x="592" y="184" width="196" height="42" class="chunk2"/>
  <text x="654" y="211" class="text">chunk 2</text>
  <rect x="842" y="184" width="196" height="42" class="chunk3"/>
  <text x="904" y="211" class="text">chunk 3</text>
  <rect x="1092" y="184" width="150" height="42" class="gray"/>
  <text x="1156" y="211" class="text">...</text>

  <path d="M190 226 L190 284" class="mapLine"/>
  <path d="M440 226 L440 354" class="mapLine"/>
  <path d="M690 226 L690 424" class="mapLine"/>
  <path d="M940 226 L940 494" class="mapLine"/>

  <rect x="44" y="284" width="1292" height="370" class="panel"/>
  <text x="78" y="322" class="h2">第 2 步：每个 chunk 进入一个 stream，行内顺序不变</text>
  <text x="78" y="352" class="small">同一行内部仍然是 H2D -> Kernel -> D2H；不同 stream 之间才有机会错开执行。</text>

  <text x="78" y="400" class="h3">Stream 0</text>
  <text x="78" y="470" class="h3">Stream 1</text>
  <text x="78" y="540" class="h3">Stream 2</text>
  <text x="78" y="610" class="h3">Stream 3</text>

  <line x1="210" y1="400" x2="1284" y2="400" class="lane"/>
  <line x1="210" y1="470" x2="1284" y2="470" class="lane"/>
  <line x1="210" y1="540" x2="1284" y2="540" class="lane"/>
  <line x1="210" y1="610" x2="1284" y2="610" class="lane"/>

  <line x1="320" y1="372" x2="320" y2="632" class="grid"/>
  <line x1="500" y1="372" x2="500" y2="632" class="grid"/>
  <line x1="680" y1="372" x2="680" y2="632" class="grid"/>
  <line x1="860" y1="372" x2="860" y2="632" class="grid"/>
  <line x1="1040" y1="372" x2="1040" y2="632" class="grid"/>
  <line x1="1220" y1="372" x2="1220" y2="632" class="grid"/>

  <rect x="246" y="378" width="145" height="44" class="h2d"/><text x="290" y="406" class="small">H2D c0</text>
  <rect x="426" y="378" width="145" height="44" class="kernel"/><text x="464" y="406" class="small">Kernel c0</text>
  <rect x="606" y="378" width="145" height="44" class="d2h"/><text x="653" y="406" class="small">D2H c0</text>

  <rect x="426" y="448" width="145" height="44" class="h2d"/><text x="470" y="476" class="small">H2D c1</text>
  <rect x="606" y="448" width="145" height="44" class="kernel"/><text x="644" y="476" class="small">Kernel c1</text>
  <rect x="786" y="448" width="145" height="44" class="d2h"/><text x="833" y="476" class="small">D2H c1</text>

  <rect x="606" y="518" width="145" height="44" class="h2d"/><text x="650" y="546" class="small">H2D c2</text>
  <rect x="786" y="518" width="145" height="44" class="kernel"/><text x="824" y="546" class="small">Kernel c2</text>
  <rect x="966" y="518" width="145" height="44" class="d2h"/><text x="1013" y="546" class="small">D2H c2</text>

  <rect x="786" y="588" width="145" height="44" class="h2d"/><text x="830" y="616" class="small">H2D c3</text>
  <rect x="966" y="588" width="145" height="44" class="kernel"/><text x="1004" y="616" class="small">Kernel c3</text>
  <rect x="1146" y="588" width="145" height="44" class="d2h"/><text x="1193" y="616" class="small">D2H c3</text>

  <rect x="44" y="690" width="1292" height="240" class="panel"/>
  <text x="78" y="728" class="h2">第 3 步：换成硬件资源视角，就能看到 overlap</text>
  <text x="78" y="758" class="small">同一时间段里，copy engine 和 SM 可以分别处理不同 chunk，这就是流水线重叠。</text>

  <text x="78" y="800" class="h3">H2D copy engine</text>
  <text x="78" y="852" class="h3">SM compute</text>
  <text x="78" y="890" class="h3">D2H copy engine</text>

  <rect x="300" y="780" width="132" height="36" class="h2d"/><text x="340" y="803" class="small">H2D c0</text>
  <rect x="480" y="780" width="132" height="36" class="h2d"/><text x="520" y="803" class="small">H2D c1</text>
  <rect x="660" y="780" width="132" height="36" class="h2d"/><text x="700" y="803" class="small">H2D c2</text>
  <rect x="840" y="780" width="132" height="36" class="h2d"/><text x="880" y="803" class="small">H2D c3</text>

  <rect x="480" y="832" width="132" height="36" class="kernel"/><text x="512" y="855" class="small">Kernel c0</text>
  <rect x="660" y="832" width="132" height="36" class="kernel"/><text x="692" y="855" class="small">Kernel c1</text>
  <rect x="840" y="832" width="132" height="36" class="kernel"/><text x="872" y="855" class="small">Kernel c2</text>
  <rect x="1020" y="832" width="132" height="36" class="kernel"/><text x="1052" y="855" class="small">Kernel c3</text>

  <rect x="660" y="874" width="132" height="36" class="d2h"/><text x="700" y="897" class="small">D2H c0</text>
  <rect x="840" y="874" width="132" height="36" class="d2h"/><text x="880" y="897" class="small">D2H c1</text>
  <rect x="1020" y="874" width="132" height="36" class="d2h"/><text x="1060" y="897" class="small">D2H c2</text>
  <rect x="1200" y="874" width="108" height="36" class="d2h"/><text x="1234" y="897" class="small">D2H c3</text>

  <rect x="44" y="960" width="1292" height="54" class="note"/>
  <text x="78" y="984" class="small">读图口诀：每个 chunk 在自己的 stream 内仍然串行；多个 stream 错开提交后，不同硬件资源可以同时处理不同 chunk。</text>
  <text x="78" y="1004" class="tiny">真正是否 overlap，要看 Nsight Systems timeline 中这些矩形是否在时间上重叠。</text>
</svg>
