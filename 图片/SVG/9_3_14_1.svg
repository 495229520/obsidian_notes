  <line x1="310" y1="243" x2="428" y2="243" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="692" y1="243" x2="808" y2="243" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="158" y="418" width="804" height="52" rx="8" fill="#fffaf0" stroke="#d6be82"/>
  <text x="214" y="450" class="tag">核心原则：</text>
