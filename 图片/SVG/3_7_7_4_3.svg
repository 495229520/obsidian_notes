<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 608" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <title>HTTPS：TLS 记录层给密文加上长度前缀</title>
  <desc>上方左侧展示 HTTP 报文被 TLS 记录层切成多条记录再交给 TCP 字节流；右侧展开 TLS 记录头的五个字节，标出内容类型、遗留版本号和长度三个字段；下方用一条时间轴给出建连到首字节之间的往返开销。</desc>

  <rect x="0" y="0" width="1240" height="608" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">HTTPS：TLS 记录层给密文加长度前缀</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">HTTP 报文一个字节都没改，只是被 TLS 切成一条条自带长度的记录</text>

  <!-- ============ Panel A: 分层切片 ============ -->
  <rect x="48" y="104" width="620" height="276" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 一条 HTTP 报文怎么变成多条记录</text>

  <text x="86" y="176" font-size="11" fill="#6B675C">应用层</text>
  <rect x="180" y="150" width="464" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="412" y="176" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">HTTP 报文（明文，1200 字节）</text>

  <line x1="412" y1="194" x2="412" y2="220" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="428" y="212" font-size="10.5" fill="#6B675C">加密并切片</text>

  <text x="86" y="254" font-size="11" fill="#6B675C">TLS 记录层</text>
  <rect x="180" y="228" width="150" height="46" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <rect x="180" y="228" width="26" height="46" fill="#8A6A3A"/>
  <text x="193" y="256" font-size="9.5" font-weight="700" fill="#FBFBF6" text-anchor="middle">5B</text>
  <text x="268" y="256" font-size="11" fill="#6B4E28" text-anchor="middle">记录 1 密文</text>

  <rect x="337" y="228" width="150" height="46" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <rect x="337" y="228" width="26" height="46" fill="#8A6A3A"/>
  <text x="350" y="256" font-size="9.5" font-weight="700" fill="#FBFBF6" text-anchor="middle">5B</text>
  <text x="425" y="256" font-size="11" fill="#6B4E28" text-anchor="middle">记录 2 密文</text>

  <rect x="494" y="228" width="150" height="46" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <rect x="494" y="228" width="26" height="46" fill="#8A6A3A"/>
  <text x="507" y="256" font-size="9.5" font-weight="700" fill="#FBFBF6" text-anchor="middle">5B</text>
  <text x="582" y="256" font-size="11" fill="#6B4E28" text-anchor="middle">记录 3 密文</text>

  <line x1="412" y1="276" x2="412" y2="302" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="86" y="334" font-size="11" fill="#6B675C">传输层</text>
  <rect x="180" y="310" width="464" height="42" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="412" y="336" font-size="11.5" fill="#4A473F" text-anchor="middle">TCP 字节流：只保序，不认记录边界</text>

  <!-- ============ Panel B: 记录头字节图 ============ -->
  <rect x="692" y="104" width="500" height="276" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="716" y="132" font-size="15" font-weight="700" fill="#4A473F">B · 记录头固定 5 字节</text>

  <text x="738" y="164" font-size="9.5" fill="#9B968A" text-anchor="middle">0</text>
  <text x="782" y="164" font-size="9.5" fill="#9B968A" text-anchor="middle">1</text>
  <text x="826" y="164" font-size="9.5" fill="#9B968A" text-anchor="middle">2</text>
  <text x="870" y="164" font-size="9.5" fill="#9B968A" text-anchor="middle">3</text>
  <text x="914" y="164" font-size="9.5" fill="#9B968A" text-anchor="middle">4</text>
  <text x="1052" y="164" font-size="9.5" fill="#9B968A" text-anchor="middle">5 …</text>

  <rect x="716" y="170" width="44" height="46" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="738" y="198" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">0x17</text>

  <rect x="760" y="170" width="88" height="46" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="804" y="198" font-size="10.5" fill="#4A473F" text-anchor="middle">0x0303</text>

  <rect x="848" y="170" width="88" height="46" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.6"/>
  <text x="892" y="198" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">length</text>

  <rect x="936" y="170" width="232" height="46" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1052" y="198" font-size="11" fill="#2C4460" text-anchor="middle">加密后的 payload</text>

  <text x="738" y="238" font-size="10" fill="#733428" text-anchor="middle">类型 1B</text>
  <text x="804" y="238" font-size="10" fill="#6B675C" text-anchor="middle">遗留版本 2B</text>
  <text x="892" y="238" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">长度 2B</text>

  <rect x="716" y="254" width="452" height="106" rx="7" fill="#F4F2EA" stroke="#D8D5C8" stroke-width="1"/>
  <text x="732" y="276" font-size="11" fill="#4A473F">0x17 表示这是应用数据记录</text>
  <text x="732" y="298" font-size="11" fill="#4A473F">0x0303 是兼容用的固定值，别拿它判版本</text>
  <text x="732" y="320" font-size="11" font-weight="700" fill="#6B4E28">length 上限 2^14 + 256 字节</text>
  <text x="732" y="342" font-size="11" fill="#4A473F">收方先读 5 字节，再精确读 length 字节</text>

  <!-- ============ Panel C: 首字节前的往返 ============ -->
  <rect x="48" y="404" width="1144" height="164" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="432" font-size="15" font-weight="700" fill="#4A473F">C · 加密不是免费的：首字节之前要付几个往返</text>

  <rect x="72" y="450" width="240" height="50" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="192" y="472" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">TCP 三次握手</text>
  <text x="192" y="490" font-size="10.5" fill="#6B675C" text-anchor="middle">1 RTT</text>

  <rect x="312" y="450" width="300" height="50" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="462" y="472" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">TLS 1.3 握手：密钥协商 + 证书</text>
  <text x="462" y="490" font-size="10.5" fill="#3D5A80" text-anchor="middle">1 RTT（TLS 1.2 要 2 RTT）</text>

  <rect x="612" y="450" width="556" height="50" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="890" y="472" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">应用数据：每条 HTTP 报文都走记录层</text>
  <text x="890" y="490" font-size="10.5" fill="#2F6B5E" text-anchor="middle">连接复用时这段可以一直跑下去</text>

  <text x="72" y="528" font-size="11.5" fill="#4A473F">会话复用能省掉 TLS 那一段，0-RTT 还能让首个请求跟着 ClientHello 一起发出去</text>
  <text x="72" y="550" font-size="11.5" fill="#733428">代价是 0-RTT 数据可被重放，不能用在会改状态的请求上</text>
</svg>
