<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180px" height="720px" viewBox="0 0 1180 720" version="1.1"><rect width="100%" height="100%" fill="rgb(245, 244, 237)" /><title>数值分析到 GPU Kernel 工程闭环</title><desc>展示误差理论如何转化为 GPU kernel correctness、低精度和推理上线判断。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3f627e" /></marker></defs><rect fill="rgb(245, 244, 237)" x="0" y="0" width="1180" height="720" /><text fill="#223142" font-size="28" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="590" y="46" text-anchor="middle" dominant-baseline="middle">数值分析 → GPU Kernel / 推理 Infra 的工程闭环</text><rect fill="#fffdf8" stroke="#a74722" stroke-width="2.2" x="60" y="100" width="300" height="500" rx="18" ry="18" /><text fill="#a74722" font-size="25" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="210" y="136" text-anchor="middle" dominant-baseline="middle">数学 / 误差理论</text><text fill="#333333" font-size="22" font-weight="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="88" y="190">舍入误差<tspan x="88" dy="34.1">绝对 / 相对误差</tspan><tspan x="88" dy="34.1">有效数字</tspan><tspan x="88" dy="34.1">误差传播</tspan><tspan x="88" dy="34.1">条件数 / 病态问题</tspan><tspan x="88" dy="34.1">数值稳定性</tspan><tspan x="88" dy="34.1">数值实验</tspan></text><rect fill="#fffdf8" stroke="#3f627e" stroke-width="2.2" x="440" y="100" width="300" height="500" rx="18" ry="18" /><text fill="#3f627e" font-size="25" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="590" y="136" text-anchor="middle" dominant-baseline="middle">Kernel 代码实践</text><text fill="#333333" font-size="22" font-weight="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="468" y="190">PyTorch / CPU reference<tspan x="468" dy="34.1">atol / rtol 误差阈值</tspan><tspan x="468" dy="34.1">FP32 accumulation</tspan><tspan x="468" dy="34.1">stable softmax</tspan><tspan x="468" dy="34.1">FP16 / BF16 / FP8</tspan><tspan x="468" dy="34.1">INT8 dequant / scale</tspan><tspan x="468" dy="34.1">edge cases 覆盖</tspan></text><rect fill="#fffdf8" stroke="#0b6b2b" stroke-width="2.2" x="820" y="100" width="300" height="500" rx="18" ry="18" /><text fill="#0b6b2b" font-size="25" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="970" y="136" text-anchor="middle" dominant-baseline="middle">上线 / 面试判断</text><text fill="#333333" font-size="22" font-weight="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="848" y="190">correctness 是否可信<tspan x="848" dy="34.1">benchmark 是否公平</tspan><tspan x="848" dy="34.1">Nsight 指标是否支持</tspan><tspan x="848" dy="34.1">低精度收益是否真实</tspan><tspan x="848" dy="34.1">质量退化是否可接受</tspan><tspan x="848" dy="34.1">Agent 代码能否审查</tspan><tspan x="848" dy="34.1">是否值得上线</tspan></text><line stroke="#3f627e" stroke-width="3" marker-end="url(#arrow)" x1="370" y1="350" x2="430" y2="350" /><line stroke="#3f627e" stroke-width="3" marker-end="url(#arrow)" x1="750" y1="350" x2="810" y2="350" /><rect fill="#e9f1f7" stroke="#3f627e" stroke-width="1.8" x="138" y="628" width="904" height="54" rx="12" ry="12" /><text fill="#223142" font-size="20" font-weight="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" x="590" y="656" text-anchor="middle" dominant-baseline="middle">核心原则：数学公式不等于可靠代码；必须用 reference、误差阈值、边界样例、benchmark 和 profiler 闭环验证</text></svg>