<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#F5F4ED"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">Bitcask：内存哈希 + 追加日志——put 一次顺序写，get 一次随机读</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">全部键在内存（keydir），全部值在盘上（日志文件）；「日志即数据库」推到极致的形态</text>

  <!-- ======== keydir ======== -->
  <rect x="440" y="110" width="360" height="150" rx="8" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="620" y="136" font-size="13.5" font-weight="700" fill="#4A3F68" text-anchor="middle">keydir（内存哈希表）</text>
  <text x="620" y="156" font-size="11" fill="#4A3F68" text-anchor="middle">key → { file_id, offset, size, tstamp }</text>

  <g font-size="10.5" fill="#4A3F68">
    <rect x="462" y="170" width="316" height="24" rx="4" fill="#F5F4ED" stroke="#6B5B95" stroke-width="0.8"/>
    <text x="474" y="186">"sess:9527"　→　{ file 7, off 88 KiB, 1.1 KiB }</text>
    <rect x="462" y="200" width="316" height="24" rx="4" fill="#F5F4ED" stroke="#6B5B95" stroke-width="0.8"/>
    <text x="474" y="216">"sess:0042"　→　{ file 3, off 4 MiB, 0.9 KiB }</text>
  </g>
  <text x="620" y="248" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">前提：所有键必须装进内存（值不用）</text>

  <!-- ======== put 路径 ======== -->
  <text x="150" y="128" font-size="14" font-weight="700" fill="#2F6B5E">put(k, v)：两步</text>
  <rect x="80" y="146" width="270" height="64" rx="8" fill="#E9EFDA" stroke="#48562B" stroke-width="1.5"/>
  <text x="215" y="172" font-size="12" font-weight="700" fill="#48562B" text-anchor="middle">① 追加到 active file 尾部</text>
  <text x="215" y="192" font-size="10.5" fill="#48562B" text-anchor="middle">record = crc | klen | vlen | key | value</text>

  <line x1="350" y1="178" x2="438" y2="178" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrTeal)"/>
  <text x="394" y="166" font-size="10.5" fill="#2F6B5E" text-anchor="middle">② 更新 keydir</text>
  <text x="394" y="196" font-size="10" fill="#6B675C" text-anchor="middle">指向新位置</text>

  <!-- ======== get 路径 ======== -->
  <text x="1010" y="128" font-size="14" font-weight="700" fill="#2C4460">get(k)：两步</text>
  <line x1="800" y1="165" x2="890" y2="165" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="845" y="153" font-size="10.5" fill="#2C4460" text-anchor="middle">① 查哈希（内存，~百 ns）</text>
  <rect x="892" y="146" width="270" height="64" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="1027" y="172" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">② pread(file, offset, size)</text>
  <text x="1027" y="192" font-size="10.5" fill="#2C4460" text-anchor="middle">恰好一次盘随机读（几十 μs）——O(1)</text>

  <!-- ======== 盘上文件 ======== -->
  <text x="70" y="316" font-size="14" font-weight="700" fill="#4A473F">盘上：一个 active + 一串 immutable 日志文件</text>

  <rect x="70" y="336" width="200" height="70" rx="8" fill="#EFEDE3" stroke="#5A564B" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="170" y="364" font-size="12" font-weight="700" fill="#6B675C" text-anchor="middle">file 3（immutable）</text>
  <text x="170" y="384" font-size="10.5" fill="#6B675C" text-anchor="middle">写满即封存，只读</text>

  <rect x="290" y="336" width="200" height="70" rx="8" fill="#EFEDE3" stroke="#5A564B" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="390" y="364" font-size="12" font-weight="700" fill="#6B675C" text-anchor="middle">file 5（immutable）</text>
  <text x="390" y="384" font-size="10.5" fill="#6B675C" text-anchor="middle">含大量被覆盖的旧值</text>

  <rect x="510" y="336" width="200" height="70" rx="8" fill="#E9EFDA" stroke="#48562B" stroke-width="1.8"/>
  <text x="610" y="364" font-size="12" font-weight="700" fill="#48562B" text-anchor="middle">file 7（active）</text>
  <text x="610" y="384" font-size="10.5" fill="#48562B" text-anchor="middle">唯一可写，只在尾部追加 →</text>

  <!-- 删除即墓碑 -->
  <text x="820" y="360" font-size="11.5" fill="#4A473F">删除 = 追加一条墓碑（tombstone）record，</text>
  <text x="820" y="380" font-size="11.5" fill="#4A473F">keydir 删项；盘上旧值先留着，等 merge 回收</text>

  <!-- ======== merge ======== -->
  <text x="70" y="466" font-size="14" font-weight="700" fill="#B07D2B">merge：把「活着的值」抄出来，旧文件整个删掉</text>

  <line x1="170" y1="406" x2="170" y2="486" stroke="#B07D2B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="406" x2="390" y2="486" stroke="#B07D2B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="70" y="488" width="440" height="76" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="290" y="514" font-size="12.5" font-weight="700" fill="#7A5518" text-anchor="middle">merge 进程：按 keydir 只读取仍被引用的 record</text>
  <text x="290" y="534" font-size="10.5" fill="#7A5518" text-anchor="middle">顺序读旧文件 → 顺序写新文件 → 原子切换 keydir 指向</text>
  <text x="290" y="552" font-size="10.5" fill="#7A5518" text-anchor="middle">被覆盖的旧值与墓碑在这里真正消失（空间回收）</text>

  <line x1="510" y1="526" x2="580" y2="526" stroke="#B07D2B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="582" y="488" width="200" height="76" rx="8" fill="#E9EFDA" stroke="#48562B" stroke-width="1.5"/>
  <text x="682" y="516" font-size="12" font-weight="700" fill="#48562B" text-anchor="middle">merged file（紧凑）</text>
  <text x="682" y="536" font-size="10.5" fill="#48562B" text-anchor="middle">只含每个键的最新值</text>

  <rect x="802" y="488" width="200" height="76" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="902" y="516" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">hint file（索引快照）</text>
  <text x="902" y="536" font-size="10.5" fill="#2C4460" text-anchor="middle">key → 位置，不含值：</text>
  <text x="902" y="552" font-size="10.5" fill="#2C4460" text-anchor="middle">重启时免扫全量数据重建 keydir</text>

  <!-- ======== 底部账本 ======== -->
  <rect x="70" y="596" width="1110" height="100" rx="8" fill="#EFEDE3" stroke="#5A564B" stroke-width="1.2"/>
  <text x="96" y="624" font-size="13" font-weight="700" fill="#2B2A26">贯穿负载的账（1 亿键 × 1 KiB，读写 9:1）：</text>
  <text x="96" y="650" font-size="12" fill="#4A473F">内存：1 亿键 × ~60 B/项 ≈ 6 GiB（keydir，全键常驻）　·　写：1 万/s × 1 KiB = 10 MB/s 纯顺序，盘毫无压力</text>
  <text x="96" y="676" font-size="12" fill="#4A473F">读：9 万/s 随机 pread，NVMe 轻松承接；p99 的敌人不是读本身，而是 merge 抢盘带宽的那几分钟（对策见正文）</text>
</svg>
