<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>Latch Crabbing：safe 节点是向上传播的停止边界</title>
<desc>例：B 能接收一次 Leaf split；释放 B 上方的祖先，但 B 的写 latch 继续保留</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3" />
<text x="48" y="52" font-size="22" fill="#2B2A26" text-anchor="start" font-weight="700">Latch Crabbing：safe 节点是向上传播的停止边界</text>
<text x="48" y="82" font-size="14" fill="#6B675C" text-anchor="start">例：B 能接收一次 Leaf split；释放 B 上方的祖先，但 B 的写 latch 继续保留</text>
<rect x="48" y="116" width="364" height="514" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="68" y="150" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700">① A 不安全，继续保留祖先</text>
<path d="M230,226 V259" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="107" y="184" width="246" height="42" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="230.0" y="210.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">Header · W</text>
<path d="M230,305 V338" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="107" y="263" width="246" height="42" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="230.0" y="289.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">Root · W · unsafe</text>
<path d="M230,384 V417" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="107" y="342" width="246" height="42" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="230.0" y="368.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">A · W · unsafe</text>
<rect x="107" y="421" width="246" height="42" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="230.0" y="447.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">B</text>
<path d="M230,465 V498" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="147" y="503" width="166" height="42" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="230.0" y="529.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">Leaf · 待访问</text>
<text x="68" y="582" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700">持有：Header、Root、A</text>
<text x="68" y="608" font-size="13" fill="#6B675C" text-anchor="start">尚不能证明变化止于 A</text>
<rect x="438" y="116" width="364" height="514" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="458" y="150" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700">② B 安全，释放更高祖先</text>
<path d="M620,226 V259" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="497" y="184" width="246" height="42" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="620.0" y="210.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">Header</text>
<path d="M620,305 V338" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="497" y="263" width="246" height="42" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="620.0" y="289.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">Root</text>
<path d="M620,384 V417" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="497" y="342" width="246" height="42" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="620.0" y="368.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">A</text>
<rect x="497" y="421" width="246" height="42" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="620.0" y="447.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">B · W · safe</text>
<path d="M620,465 V498" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="537" y="503" width="166" height="42" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="620.0" y="529.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">Leaf · 待访问</text>
<text x="458" y="582" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700">持有：B</text>
<text x="458" y="608" font-size="13" fill="#6B675C" text-anchor="start">B 以上已释放，不再回头补锁</text>
<rect x="828" y="116" width="364" height="514" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3" />
<text x="848" y="150" font-size="15" fill="#2B2A26" text-anchor="start" font-weight="700">③ Leaf 分裂，由 B 吸收</text>
<path d="M1010,226 V259" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="887" y="184" width="246" height="42" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="1010.0" y="210.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">Header</text>
<path d="M1010,305 V338" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="887" y="263" width="246" height="42" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="1010.0" y="289.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">Root</text>
<path d="M1010,384 V417" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="887" y="342" width="246" height="42" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="1010.0" y="368.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">A</text>
<rect x="887" y="421" width="246" height="42" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="1010.0" y="447.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">B · W · 增加 separator</text>
<path d="M1010,465 V482 H921 V499" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M1010,482 H1098 V499" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="848" y="503" width="146" height="42" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="921.0" y="529.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">左叶 L · W</text>
<rect x="1026" y="503" width="146" height="42" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="1099.0" y="529.0" font-size="14" fill="#2B2A26" text-anchor="middle" font-weight="700">右叶 R · W</text>
<text x="848" y="582" font-size="14" fill="#2B2A26" text-anchor="start" font-weight="700">持有：B、L、R</text>
<text x="848" y="608" font-size="13" fill="#6B675C" text-anchor="start">使用已有 B guard 更新，不向上抢锁</text>
<text x="48" y="670" font-size="14" fill="#6B675C" text-anchor="start">Safe 的依据是本次变化无需越过此节点；不是“没人访问”，也不是不区分策略的一条 size 公式。</text>
</svg>
