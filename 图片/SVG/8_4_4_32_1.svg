<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">三条协议时间线：先发 payload，还是先确认资源</title><desc id="desc">三个面板比较Eager、pull rendezvous与push rendezvous；RTS/CTS/DONE/FIN/CONSUMED是教学控制消息名，非OFI API。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">三条协议时间线：先发 payload，还是先确认资源</text>
<text x="48" y="83" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">Eager / Rendezvous 决定主体数据的启动条件；RMA READ / WRITE 可以承载 Rendezvous</text>
<rect x="48" y="119" width="370" height="456" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="66" y="148" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · Eager</text>
<text x="66" y="171" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">直接发主体数据</text>
<text x="124" y="201" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">发送源端</text>
<text x="339" y="201" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">接收端</text>
<line x1="124" y1="213" x2="124" y2="544" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="339" y1="213" x2="339" y2="544" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="124" y1="245" x2="339" y2="245" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="231.5" y="236" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">header + payload</text>
<rect x="281" y="268" width="117" height="95" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="339" y="295" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">未匹配</text>
<text x="339" y="321" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle">unexpected</text>
<text x="339" y="346" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">等待应用接收</text>
<circle cx="124" cy="330" r="5" fill="#2F6B5E"/>
<text x="138" y="389" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="start">按本地条件</text>
<text x="138" y="410" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="start">复用源缓冲</text>
<circle cx="339" cy="416" r="5" fill="#2F6B5E"/>
<text x="339" y="443" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">业务消费</text>
<line x1="339" y1="488" x2="124" y2="488" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="231.5" y="479" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">CONSUMED / credit</text>
<text x="233" y="559" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle">已匹配时可走最终接收缓冲</text>
<rect x="435" y="119" width="370" height="456" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="453" y="148" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · Rendezvous · Pull</text>
<text x="453" y="171" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">接收端拉取</text>
<text x="511" y="201" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">发送源端</text>
<text x="726" y="201" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">接收端</text>
<line x1="511" y1="213" x2="511" y2="544" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="726" y1="213" x2="726" y2="544" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="4 4"/>
<rect x="504" y="255" width="14" height="242" rx="3" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<line x1="511" y1="245" x2="726" y2="245" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="618.5" y="236" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">RTS：源地址 / key</text>
<rect x="674" y="266" width="106" height="49" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="726" y="296" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">等目标就绪</text>
<line x1="726" y1="345" x2="511" y2="345" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="618.5" y="336" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">RMA READ 请求</text>
<line x1="511" y1="409" x2="726" y2="409" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="618.5" y="400" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">bulk data</text>
<circle cx="726" cy="443" r="5" fill="#2F6B5E"/>
<text x="726" y="465" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">READ 完成</text>
<line x1="726" y1="501" x2="511" y2="501" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="618.5" y="492" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">DONE</text>
<text x="620" y="559" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle">源保持稳定，直到 DONE / 等价确认</text>
<rect x="822" y="119" width="370" height="456" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text x="840" y="148" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">C · Rendezvous · Push</text>
<text x="840" y="171" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">发送端写入</text>
<text x="898" y="201" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">发送源端</text>
<text x="1113" y="201" font-size="13" font-weight="700" fill="#2B2A26" text-anchor="middle">接收端</text>
<line x1="898" y1="213" x2="898" y2="544" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="1113" y1="213" x2="1113" y2="544" stroke="#9B968A" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="898" y1="239" x2="1113" y2="239" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1005.5" y="230" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">RTS</text>
<line x1="1113" y1="293" x2="898" y2="293" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1005.5" y="284" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">CTS：目标 slot / key</text>
<line x1="898" y1="355" x2="1113" y2="355" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1005.5" y="346" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">RMA WRITE</text>
<rect x="886" y="367" width="24" height="62" rx="3" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="1001" y="398" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">先建立数据可见保证</text>
<line x1="898" y1="447" x2="1113" y2="447" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1005.5" y="438" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">FIN / 等价通知</text>
<circle cx="1113" cy="472" r="5" fill="#2F6B5E"/>
<text x="1113" y="493" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">消费完成</text>
<line x1="1113" y1="530" x2="898" y2="530" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1005.5" y="521" font-size="12" font-weight="400" fill="#2B2A26" text-anchor="middle">CONSUMED / credit</text>
<text x="1007" y="559" font-size="12" font-weight="400" fill="#6B675C" text-anchor="middle">普通本地 CQE 不自动证明远端可见</text>
<rect x="48" y="597" width="553" height="48" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text x="324.5" y="626.25" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle">协议策略：主体数据何时发？</text>
<rect x="624" y="597" width="568" height="48" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
<text x="908.0" y="626.25" font-size="15" font-weight="700" fill="#2C4460" text-anchor="middle">RMA 操作：谁读、谁写、访问哪里？</text>
<line x1="48" y1="660" x2="1192" y2="660" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="683" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start">机制示意；握手和确认可合并或变化，并非固定 RTT。等待框表示资源或可见性条件尚未满足。</text>
</svg>