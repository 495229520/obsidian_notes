<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>VXLAN 封装与 MTU：同一个“50 B”，先问比较口径</title>
<desc>展示普通 VXLAN over IPv4 的报文结构、8 字节 VXLAN 头，以及 IPv4/IPv6 外层下的 MTU 方程。无 VLAN，无 IP 选项和扩展头。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start">VXLAN 封装与 MTU：同一个“50 B”，先问比较口径</text>
<text x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">Underlay IP MTU 要容纳内层 Ethernet；外层 Ethernet 不属于外层 IP 包。</text>
<text x="48" y="119" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">A · 报文嵌套（格宽不按字节比例）</text>
<rect x="48" y="138" width="130" height="70" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="113.0" y="167.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">外层 Ethernet</text>
<text x="113.0" y="189.0" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle">14 B</text>
<rect x="178" y="138" width="140" height="70" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="248.0" y="167.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">外层 IPv4</text>
<text x="248.0" y="189.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">20 B</text>
<rect x="318" y="138" width="104" height="70" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="370.0" y="167.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">UDP</text>
<text x="370.0" y="189.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle">8 B</text>
<rect x="422" y="138" width="120" height="70" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="482.0" y="167.0" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">VXLAN</text>
<text x="482.0" y="189.0" font-size="14" font-weight="400" fill="#6B4E28" text-anchor="middle">8 B</text>
<rect x="542" y="138" width="150" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="617.0" y="167.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">内层 Ethernet</text>
<text x="617.0" y="189.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">14 B</text>
<rect x="692" y="138" width="500" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="942.0" y="167.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">内层 IP 包</text>
<text x="942.0" y="189.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle">T = 1500 B</text>
<path d="M178,219 L178,230 L1192,230 L1192,219" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linejoin="round"/>
<text x="685" y="252" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">外层 IP 包 = 20 + 8 + 8 + 14 + T = 1550 B</text>
<text x="48" y="292" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">B · 基本 VXLAN 头：8 字节 / 64 bit</text>
<rect x="48" y="315" width="88" height="86" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="92.0" y="341.0" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">Flags</text>
<text x="92.0" y="363.0" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">8 bit</text>
<text x="92.0" y="385.0" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">0x08</text>
<rect x="136" y="315" width="264" height="86" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="268.0" y="341.0" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">Reserved</text>
<text x="268.0" y="363.0" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">24 bit</text>
<text x="268.0" y="385.0" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">0x000000</text>
<rect x="400" y="315" width="264" height="86" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="532.0" y="341.0" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">VNI</text>
<text x="532.0" y="363.0" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">24 bit</text>
<text x="532.0" y="385.0" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">0x002774</text>
<rect x="664" y="315" width="88" height="86" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="708.0" y="341.0" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">Reserved</text>
<text x="708.0" y="363.0" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">8 bit</text>
<text x="708.0" y="385.0" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle">0x00</text>
<rect x="788" y="315" width="404" height="86" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="990.0" y="341.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">I = 1：VNI 有效</text>
<text x="990.0" y="363.0" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle">VNI 10100 = 0x002774</text>
<text x="990.0" y="385.0" font-size="14" font-weight="400" fill="#4A473F" text-anchor="middle">基本头中没有 BUM 标志</text>
<text x="48" y="426" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">字节序列</text>
<rect x="155" y="407" width="45" height="31" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="177.5" y="427.5" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">08</text>
<rect x="210" y="407" width="45" height="31" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="232.5" y="427.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">00</text>
<rect x="265" y="407" width="45" height="31" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="287.5" y="427.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">00</text>
<rect x="320" y="407" width="45" height="31" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="342.5" y="427.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">00</text>
<rect x="375" y="407" width="45" height="31" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="397.5" y="427.5" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">00</text>
<rect x="430" y="407" width="45" height="31" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="452.5" y="427.5" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">27</text>
<rect x="485" y="407" width="45" height="31" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.3"/>
<text x="507.5" y="427.5" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">74</text>
<rect x="540" y="407" width="45" height="31" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="562.5" y="427.5" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">00</text>
<text x="788" y="426" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">原始 Inner FCS 不在隧道载荷中</text>
<text x="48" y="471" font-size="15" font-weight="700" fill="#4A473F" text-anchor="start">C · 精确长度预算（单位：B）</text>
<rect x="48" y="487" width="724" height="152" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="518" font-size="14" font-weight="700" fill="#2C4460" text-anchor="start">外层 IPv4</text>
<text x="208" y="518" font-size="15" font-weight="400" fill="#2B2A26" text-anchor="start">20 + 8 + 8 + 14 + 1500</text>
<text x="715" y="520" font-size="20" font-weight="700" fill="#2C4460" text-anchor="end">= 1550</text>
<text x="68" y="565" font-size="14" font-weight="700" fill="#4A3F68" text-anchor="start">外层 IPv6</text>
<text x="208" y="565" font-size="15" font-weight="400" fill="#2B2A26" text-anchor="start">40 + 8 + 8 + 14 + 1500</text>
<text x="715" y="567" font-size="20" font-weight="700" fill="#4A3F68" text-anchor="end">= 1570</text>
<text x="68" y="610" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start">外层 IPv4 帧：不含 FCS 1564；含 FCS 1568</text>
<rect x="800" y="487" width="392" height="152" rx="8" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="820" y="518" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start">Underlay IP MTU = 1500</text>
<text x="820" y="563" font-size="15" font-weight="400" fill="#2C4460" text-anchor="start">IPv4 外层 → 内层 IP ≤ 1450</text>
<text x="820" y="608" font-size="15" font-weight="400" fill="#4A3F68" text-anchor="start">IPv6 外层 → 内层 IP ≤ 1430</text>
<path d="M48,655 L1192,655" fill="none" stroke="#D8D5C8" stroke-width="1" stroke-linejoin="round"/>
<text x="48" y="680" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start">口径：无内层 VLAN、无外层 IP 选项/扩展头；不计前导码和 IFG；保留一个内层 VLAN tag 另加 4 B。</text>
</svg>
