<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">密钥轮换不是一个动作：换 KEK、重包 DEK、重加密载荷</title>
<desc id="desc">三行分别比较KMS新版本生效、DEK重包、DEK更换后的载荷重加密，底部强调快照备份和冷缓存恢复是历史密钥退役前的检查项。</desc>
<defs>
<marker id="arr-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A7EA4"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<text id="t0" x="48" y="49" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">密钥轮换不是一个动作：换 KEK、重包 DEK、重加密载荷</text>
<text id="t1" x="48" y="79" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">先问“哪些字节改变、旧数据还依赖谁”，再决定何时停用或销毁历史密钥。</text>
<text id="t2" x="65" y="121" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">操作</text>
<text id="t3" x="329" y="121" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">变更前</text>
<text id="t4" x="695" y="121" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">变更后</text>
<text id="t5" x="1025" y="121" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">工作范围</text>
<rect x="48" y="136" width="1144" height="113" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<rect x="48" y="264" width="1144" height="113" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<rect x="48" y="392" width="1144" height="113" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t6" x="67" y="164" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">A · KEK 轮换</text>
<text id="t7" x="67" y="189" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">新写入切换版本</text>
<text id="t8" x="67" y="212" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="start" data-role="body">旧包装仍需旧版本</text>
<rect x="284" y="153" width="224" height="75" rx="8" fill="#EDEAF3" stroke="#8A7EA4" stroke-width="1.2"/>
<text id="t9" x="396.0" y="186.5" font-size="15" font-weight="700" fill="#6B5B95" text-anchor="middle" data-role="body">主版本 k7</text>
<text id="t10" x="396.0" y="208.5" font-size="13" font-weight="400" fill="#6B5B95" text-anchor="middle" data-role="body">新写 → W(k7, DEK)</text>
<rect x="635" y="153" width="254" height="75" rx="8" fill="#EDEAF3" stroke="#8A7EA4" stroke-width="1.2"/>
<text id="t11" x="762.0" y="186.5" font-size="15" font-weight="700" fill="#6B5B95" text-anchor="middle" data-role="body">主版本 k8</text>
<text id="t12" x="762.0" y="208.5" font-size="13" font-weight="400" fill="#6B5B95" text-anchor="middle" data-role="body">新写 → W(k8, 新 DEK)</text>
<line x1="512" y1="192" x2="631" y2="192" stroke="#8A7EA4" stroke-width="1.7" marker-end="url(#arr-purple)"/>
<text id="t13" x="570" y="178" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle" data-role="body">版本切换</text>
<text id="t14" x="943" y="179" font-size="14" font-weight="700" fill="#24473F" text-anchor="start" data-role="body">不重写历史 C</text>
<text id="t15" x="943" y="204" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">不自动重包历史 W</text>
<text id="t16" x="67" y="293" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">B · Rewrap</text>
<text id="t17" x="67" y="318" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">同一把 DEK</text>
<text id="t18" x="67" y="340" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">包装记录更新</text>
<rect x="284" y="281" width="224" height="75" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text id="t19" x="396.0" y="314.5" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">W(k7, DEK a)</text>
<text id="t20" x="396.0" y="336.5" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">载荷 C(a) 保持不变</text>
<rect x="635" y="281" width="254" height="75" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text id="t21" x="762.0" y="314.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">W(k8, DEK a)</text>
<text id="t22" x="762.0" y="336.5" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">载荷 C(a) 保持不变</text>
<line x1="512" y1="320" x2="631" y2="320" stroke="#8A6A3A" stroke-width="1.7" marker-end="url(#arr-amber)"/>
<text id="t23" x="570" y="306" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle" data-role="body">重新包装</text>
<text id="t24" x="943" y="307" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">主要处理小元数据</text>
<text id="t25" x="943" y="332" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">发布须崩溃一致</text>
<text id="t26" x="67" y="420" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="section">C · DEK 更换</text>
<text id="t27" x="67" y="445" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">a → b</text>
<text id="t28" x="67" y="468" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">新的 nonce / tag</text>
<rect x="284" y="409" width="224" height="75" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text id="t29" x="396.0" y="442.5" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">C(a) + tag(a)</text>
<text id="t30" x="396.0" y="464.5" font-size="13" font-weight="400" fill="#4A473F" text-anchor="middle" data-role="body">由 DEK a 加密</text>
<rect x="635" y="409" width="254" height="75" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
<text id="t31" x="762.0" y="442.5" font-size="15" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">C(b) + tag(b)</text>
<text id="t32" x="762.0" y="464.5" font-size="13" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">由 DEK b 重新加密</text>
<line x1="512" y1="448" x2="631" y2="448" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#arr-red)"/>
<text id="t33" x="570" y="434" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="middle" data-role="body">重读 / 重写</text>
<text id="t34" x="943" y="435" font-size="14" font-weight="700" fill="#733428" text-anchor="start" data-role="body">触达完整载荷</text>
<text id="t35" x="943" y="460" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">冷备份也要纳入</text>
<text id="t36" x="65" y="540" font-size="15" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="body">退役旧密钥前</text>
<rect x="248" y="519" width="116" height="34" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text id="t37" x="306.0" y="541.0" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">在线对象</text>
<rect x="378" y="519" width="116" height="34" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text id="t38" x="436.0" y="541.0" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">历史快照</text>
<rect x="508" y="519" width="116" height="34" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text id="t39" x="566.0" y="541.0" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">异地备份</text>
<rect x="638" y="519" width="145" height="34" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
<text id="t40" x="710.5" y="541.0" font-size="15" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">冷缓存恢复</text>
<line x1="787" y1="536" x2="825" y2="536" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#arr-red)"/>
<rect x="831" y="511" width="170" height="50" rx="8" fill="#F3E8D3" stroke="#8A6A3A" stroke-width="1.2"/>
<text id="t41" x="916.0" y="541.0" font-size="15" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">全部依赖核清</text>
<line x1="1005" y1="536" x2="1030" y2="536" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#arr-red)"/>
<rect x="1036" y="511" width="139" height="50" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
<text id="t42" x="1105.5" y="541.0" font-size="15" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">才评审销毁</text>
<text id="t43" x="249" y="584" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">证书轮换是另一条生命周期：它不改对象 DEK，也不重加密 Checkpoint。</text>
<rect x="48" y="618" width="1144" height="54" rx="7" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.2"/>
<text id="t44" x="64" y="641" font-size="14" font-weight="700" fill="#4A473F" text-anchor="start" data-role="footer">泄漏应急 ≠ 例行轮换：rewrap 无法收回已泄漏的 DEK 或已复制的明文；缓存也会延迟撤销生效。</text>
<text id="t45" x="64" y="662" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">关系示意，非时间比例图 · k7/k8 与 a/b 是教学标识 · 对应笔记 §5、§6</text>
</svg>