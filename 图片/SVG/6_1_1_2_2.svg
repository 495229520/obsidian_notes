<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" viewBox="0 0 740 280">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>Hello 载荷文本格式</title>
  <desc>Hello 载荷为纯文本，用单个 \n 分隔会话码（6 位 ASCII 数字）与 Helper 名称（UTF-8，≤64 宽字符）。</desc>
  <rect x="0" y="0" width="740" height="280" fill="rgb(245, 244, 237)"/>

  <text x="370" y="44" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Hello 载荷格式（纯文本，单个 \n 分隔两字段）</text>

  <rect x="110" y="80" width="520" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <line x1="350" y1="80" x2="350" y2="136" stroke="#185FA5" stroke-width="1"/>
  <line x1="410" y1="80" x2="410" y2="136" stroke="#185FA5" stroke-width="1"/>
  <text x="230" y="108" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">123456</text>
  <text x="380" y="108" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">\n</text>
  <text x="520" y="108" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Alice</text>

  <line x1="230" y1="136" x2="230" y2="158" stroke="#185FA5" stroke-width="1"/>
  <line x1="380" y1="136" x2="380" y2="158" stroke="#185FA5" stroke-width="1"/>
  <line x1="520" y1="136" x2="520" y2="158" stroke="#185FA5" stroke-width="1"/>

  <text x="230" y="173" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">会话码</text>
  <text x="230" y="192" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">6 位 ASCII 数字</text>
  <text x="380" y="173" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">分隔符</text>
  <text x="380" y="192" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">单个 '\n'</text>
  <text x="520" y="173" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Helper 名称</text>
  <text x="520" y="192" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">UTF-8 · ≤64 宽字符</text>

  <text x="370" y="232" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">约束：恰好 1 个 \n、禁止 \r（防 CRLF 注入）</text>
</svg>
