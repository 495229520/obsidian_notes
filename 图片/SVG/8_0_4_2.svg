<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>BAR 是 aperture，不是寄存器本身</title>
  <desc>上半：配置空间中的 BAR 字段指向地址窗口。中部：窗口内部布局示意。下半：三种地址表示与 CPU VA→BAR 路径，对照设备 IOVA→PA。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">BAR 声明资源窗口；offset 语义才由设备规范定义</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">BAR 字段 ≠ Doorbell · 映射后的 VA ≠ BAR resource · 更不是 DMA address / IOVA</text>

  <!-- ============ Panel A：Config space → BAR → aperture ============ -->
  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">A · Configuration Space 里的 BAR：需求声明与地址分配入口</text>

  <rect x="48" y="124" width="380" height="280" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="48" y="124" width="380" height="34" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="48" y="146" width="380" height="12" fill="#E3EAF4"/>
  <text x="68" y="147" font-size="13" font-weight="700" fill="#2C4460">PCI Configuration Space</text>

  <rect x="72" y="176" width="332" height="36" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="199" font-size="12" fill="#4A473F">Vendor / Device ID · Class Code</text>

  <rect x="72" y="220" width="332" height="36" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="243" font-size="12" fill="#4A473F">Command / Status</text>

  <rect x="72" y="264" width="332" height="48" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="88" y="285" font-size="13" font-weight="700" fill="#6B4E28">BAR0 … BARn</text>
  <text x="88" y="303" font-size="11" fill="#8A6A3A">size · 32/64-bit · Memory/I/O · pref</text>

  <rect x="72" y="324" width="332" height="52" rx="5" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="345" font-size="12" fill="#4A473F">Capability 链</text>
  <text x="88" y="363" font-size="11" fill="#6B675C">MSI-X · PCIe · AER …</text>

  <path d="M428,288 L480,288" fill="none" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arra)"/>
  <text x="434" y="274" font-size="11" fill="#8A6A3A">指向</text>

  <!-- Aperture window -->
  <rect x="492" y="124" width="700" height="280" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="492" y="124" width="700" height="34" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <rect x="492" y="146" width="700" height="12" fill="#EFE7DA"/>
  <text x="512" y="147" font-size="13" font-weight="700" fill="#6B4E28">BAR aperture / window（系统地址区间）</text>

  <!-- memory layout strips -->
  <rect x="520" y="180" width="644" height="44" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="540" y="200" font-size="12" font-weight="700" fill="#2C4460">控制 / 状态寄存器</text>
  <text x="540" y="216" font-size="10.5" fill="#3D5A80">offset 语义由设备规范定义</text>

  <rect x="520" y="232" width="200" height="44" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="620" y="252" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">Doorbell</text>
  <text x="620" y="268" font-size="10.5" fill="#8A6A3A" text-anchor="middle">SQ Tail / CQ Head</text>

  <rect x="732" y="232" width="200" height="44" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="832" y="252" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">设备内存窗口</text>
  <text x="832" y="268" font-size="10.5" fill="#2F6B5E" text-anchor="middle">可选 · 如 CMB</text>

  <rect x="944" y="232" width="220" height="44" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1054" y="252" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">MSI-X Table / PBA</text>
  <text x="1054" y="268" font-size="10.5" fill="#A64B3C" text-anchor="middle">BIR + offset 定位</text>

  <rect x="520" y="288" width="644" height="40" rx="5" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="540" y="313" font-size="12" fill="#4A473F">厂商自定义区域 · 保留位 · 未文档化 offset 不可扫</text>

  <text x="520" y="356" font-size="12" fill="#6B675C">属性：Memory BAR · 32/64-bit · Prefetchable（≠ 可缓存 DRAM）· Size 由枚举探测分配</text>
  <text x="520" y="378" font-size="12" fill="#A64B3C">控制寄存器有副作用，不能因 Memory BAR 就任意预取/合并</text>

  <!-- ============ Panel B：三种地址 ============ -->
  <text x="48" y="440" font-size="13" font-weight="700" fill="#4A473F">B · 同一 BAR 的三种地址表示：不能混用</text>

  <rect x="48" y="454" width="370" height="130" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="48" y="454" width="370" height="32" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <rect x="48" y="474" width="370" height="12" fill="#EFE7DA"/>
  <text x="68" y="476" font-size="12" font-weight="700" fill="#6B4E28">① BAR resource address</text>
  <text x="68" y="510" font-size="12" fill="#4A473F">谁看：平台 / PCI 资源管理</text>
  <text x="68" y="532" font-size="12" fill="#4A473F">含义：分配给 aperture 的系统资源区间</text>
  <text x="68" y="556" font-size="11" fill="#6B675C">不是普通 DRAM PA</text>

  <rect x="434" y="454" width="370" height="130" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="434" y="454" width="370" height="32" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="434" y="474" width="370" height="12" fill="#E3EAF4"/>
  <text x="454" y="476" font-size="12" font-weight="700" fill="#2C4460">② /sys/.../resource 区间</text>
  <text x="454" y="510" font-size="12" fill="#4A473F">谁看：Linux 用户（元数据）</text>
  <text x="454" y="532" font-size="12" fill="#4A473F">含义：内核公布的起止 + flags</text>
  <text x="454" y="556" font-size="11" fill="#6B675C">读 resource 文件 ≠ 读 BAR 内容</text>

  <rect x="820" y="454" width="372" height="130" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="820" y="454" width="372" height="32" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="820" y="474" width="372" height="12" fill="#DCE9E3"/>
  <text x="840" y="476" font-size="12" font-weight="700" fill="#24473F">③ ioremap / VFIO mmap VA</text>
  <text x="840" y="510" font-size="12" fill="#4A473F">谁看：内核驱动或用户进程</text>
  <text x="840" y="532" font-size="12" fill="#4A473F">含义：CPU 页表中的 I/O mapping VA</text>
  <text x="840" y="556" font-size="11" fill="#6B675C">用户 VA ≠ BAR resource address</text>

  <!-- ============ Panel C：两条路径对照 ============ -->
  <text x="48" y="620" font-size="13" font-weight="700" fill="#4A473F">C · 两条反向路径：CPU 访问设备 vs 设备访问主机</text>

  <rect x="48" y="634" width="560" height="230" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="48" y="634" width="560" height="34" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <rect x="48" y="656" width="560" height="12" fill="#E3EAF4"/>
  <text x="68" y="657" font-size="13" font-weight="700" fill="#2C4460">本章：CPU VA → BAR aperture</text>

  <rect x="80" y="690" width="140" height="44" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="150" y="717" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">I/O mapping VA</text>

  <path d="M220,712 L250,712" fill="none" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrb)"/>

  <rect x="254" y="690" width="150" height="44" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="329" y="717" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">平台路由</text>

  <path d="M404,712 L434,712" fill="none" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrb)"/>

  <rect x="438" y="690" width="140" height="44" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="508" y="717" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">设备 BAR</text>

  <text x="80" y="764" font-size="12" fill="#4A473F">claim → ioremap/pci_iomap 或 VFIO mmap</text>
  <text x="80" y="786" font-size="12" fill="#4A473F">用 readl/writel 等 accessor，不是普通指针</text>
  <text x="80" y="808" font-size="12" fill="#A64B3C">mmap 后仍不是普通 RAM · 有副作用</text>
  <text x="80" y="832" font-size="11.5" fill="#6B675C">服务于：CPU 访问设备资源（控制面）</text>

  <rect x="632" y="634" width="560" height="230" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="632" y="634" width="560" height="34" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <rect x="632" y="656" width="560" height="12" fill="#EFE7DA"/>
  <text x="652" y="657" font-size="13" font-weight="700" fill="#6B4E28">上章：设备 IOVA → PA</text>

  <rect x="664" y="690" width="140" height="44" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="734" y="717" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">DMA / IOVA</text>

  <path d="M804,712 L834,712" fill="none" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arra)"/>

  <rect x="838" y="690" width="140" height="44" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="908" y="717" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">IOMMU</text>

  <path d="M978,712 L1008,712" fill="none" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arra)"/>

  <rect x="1012" y="690" width="140" height="44" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1082" y="717" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">主机 PA</text>

  <text x="664" y="764" font-size="12" fill="#4A473F">pin + DMA map + 描述符填写</text>
  <text x="664" y="786" font-size="12" fill="#4A473F">设备按 IOVA 读写主机页面</text>
  <text x="664" y="808" font-size="12" fill="#2F6B5E">与 CPU 页表是两套系统</text>
  <text x="664" y="832" font-size="11.5" fill="#6B675C">服务于：设备访问主机内存（数据面）</text>
</svg>
