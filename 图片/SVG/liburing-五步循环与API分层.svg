<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 736" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>liburing 五步循环与 API 分层</title>
  <desc>上层为应用代码的五步调用，中层为 liburing 封装的内存屏障、SQPOLL 唤醒判断、mmap 管理与特性探测，下层为内核的共享双环与 io_uring_enter，底部为两层错误通道说明。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="736" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">liburing：五步循环，以及它替你封装掉的苦差</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">上层是你写的五个调用；中层是 liburing 代管的屏障、唤醒判断与 mmap；真正的陷入点只剩 submit 里那一次 enter</text>

  <!-- 应用层 -->
  <rect x="64" y="104" width="1112" height="168" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="88" y="130" font-size="13.5" font-weight="700" fill="#2C4460">应用代码：一次 IO 的五步（填单 → 提交 → 收割）</text>

  <rect x="88" y="148" width="196" height="92" rx="7" fill="#F7F9FC" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="186" y="173" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace">① io_uring_get_sqe</text>
  <text x="186" y="195" font-size="10.5" fill="#2C4460" text-anchor="middle">从 SQE 数组拿空槽</text>
  <text x="186" y="213" font-size="10.5" fill="#2C4460" text-anchor="middle">满了返回 nullptr：先提交</text>

  <line x1="284" y1="194" x2="304" y2="194" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="306" y="148" width="196" height="92" rx="7" fill="#F7F9FC" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="404" y="173" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace">② io_uring_prep_*</text>
  <text x="404" y="195" font-size="10.5" fill="#2C4460" text-anchor="middle">只是填 64 B 的操作描述</text>
  <text x="404" y="213" font-size="10.5" fill="#2C4460" text-anchor="middle">此刻什么都没发生【易错】</text>

  <line x1="502" y1="194" x2="522" y2="194" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="524" y="148" width="196" height="92" rx="7" fill="#F7F9FC" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="622" y="173" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace">③ sqe_set_data64</text>
  <text x="622" y="195" font-size="10.5" fill="#2C4460" text-anchor="middle">塞 user_data 用于对号</text>
  <text x="622" y="213" font-size="10.5" fill="#2C4460" text-anchor="middle">完成乱序，全靠它关联</text>

  <line x1="720" y1="194" x2="740" y2="194" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="742" y="148" width="196" height="92" rx="7" fill="#F7F9FC" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="840" y="173" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace">④ io_uring_submit</text>
  <text x="840" y="195" font-size="10.5" fill="#2C4460" text-anchor="middle">store-release 推 SQ tail</text>
  <text x="840" y="213" font-size="10.5" fill="#2C4460" text-anchor="middle">需要时才真的调 enter</text>

  <line x1="938" y1="194" x2="958" y2="194" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="960" y="148" width="196" height="92" rx="7" fill="#F7F9FC" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1058" y="173" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace">⑤ wait / peek + seen</text>
  <text x="1058" y="195" font-size="10.5" fill="#2C4460" text-anchor="middle">acquire 收割，res 必查</text>
  <text x="1058" y="213" font-size="10.5" fill="#2C4460" text-anchor="middle">seen / advance 推 head 还位</text>

  <path d="M1058,240 L1058,254 L186,254 L186,242" fill="none" stroke="#2F6B5E" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrt)"/>
  <text x="622" y="267" font-size="10.5" fill="#24473F" text-anchor="middle">循环骨架：收 1 补 1、窗口恒满（2.3 的恒满窗）</text>

  <line x1="620" y1="272" x2="620" y2="294" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- liburing 层 -->
  <rect x="64" y="298" width="1112" height="140" rx="8" fill="#ECEAE0" stroke="#9B9685" stroke-width="1.5"/>
  <text x="88" y="324" font-size="13.5" font-weight="700" fill="#4A473F">liburing 替你封装的四件苦差（裸 syscall 全要手写，写错不崩、数据静默坏）</text>

  <rect x="88" y="342" width="250" height="76" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="213" y="366" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">内存屏障</text>
  <text x="213" y="386" font-size="10" fill="#4A3F68" text-anchor="middle">store-release 推 tail、acquire 读 CQ</text>
  <text x="213" y="403" font-size="10" fill="#4A3F68" text-anchor="middle">2.1 §4 门铃协议的正确实现</text>

  <rect x="364" y="342" width="250" height="76" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="489" y="366" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">SQPOLL 唤醒判断</text>
  <text x="489" y="386" font-size="10" fill="#4A3F68" text-anchor="middle">检查 NEED_WAKEUP 标志</text>
  <text x="489" y="403" font-size="10" fill="#4A3F68" text-anchor="middle">需要时才补一次 enter（2.4）</text>

  <rect x="640" y="342" width="250" height="76" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="765" y="366" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">mmap 与内存布局</text>
  <text x="765" y="386" font-size="10" fill="#4A3F68" text-anchor="middle">SQ / CQ / SQE 三段映射与 offset</text>
  <text x="765" y="403" font-size="10" fill="#4A3F68" text-anchor="middle">适配 SINGLE_MMAP 等特性位</text>

  <rect x="916" y="342" width="250" height="76" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="1041" y="366" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">特性探测</text>
  <text x="1041" y="386" font-size="10" fill="#4A3F68" text-anchor="middle">get_probe 按 opcode 询问内核</text>
  <text x="1041" y="403" font-size="10" fill="#4A3F68" text-anchor="middle">跨内核版本安全降级</text>

  <line x1="620" y1="438" x2="620" y2="460" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 内核层 -->
  <rect x="64" y="464" width="1112" height="88" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="88" y="492" font-size="13.5" font-weight="700" fill="#24473F">内核：mmap 共享双环 + io_uring_enter（整条路径唯一的陷入点）</text>
  <text x="88" y="514" font-size="10.5" fill="#24473F">submit 里那一次 enter 是仅存的系统调用——SQPOLL 打开后连它也常为零（2.4）</text>
  <text x="88" y="532" font-size="10.5" fill="#24473F">环上的生产/消费协议见 2.1；liburing 只是把协议封装成了普通函数调用</text>

  <!-- 错误通道卡 -->
  <rect x="64" y="580" width="1112" height="116" rx="8" fill="#EFEDE3" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="88" y="608" font-size="13" font-weight="700" fill="#2B2A26">错误通道有两层，各查各的</text>
  <text x="88" y="632" font-size="11" fill="#4A473F">库调用层：liburing API 返回 0 或负值（-errno）——queue_init、submit、wait_cqe 都要检查</text>
  <text x="88" y="652" font-size="11" fill="#4A473F">单笔 IO 层：cqe->res 负值 = -errno；read/write 非负还可能短读——每个 CQE 都要看</text>
  <text x="88" y="672" font-size="11" fill="#A64B3C">wait_cqe 返回 0 只说明「等到了一个 CQE」，不代表那笔 IO 成功</text>
</svg>
