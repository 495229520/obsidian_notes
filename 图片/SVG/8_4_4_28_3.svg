<text x="48" y="665" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">方格为结构示意，不是等容量压测；WRITE_WITH_IMM 的 payload 地址与接收通知 WQE 的 SGE 必须分开理解。</text>
