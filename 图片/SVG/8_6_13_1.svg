<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>点查读路径的四道闸</title>
  <desc>bloom filter、block cache、页缓存、盘读的探测顺序、等待点与数据拷贝，以及 bloom 的数字漏斗</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">点查读路径的四道闸：让探测止步得尽量早</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">bloom 治「不在」—— 把无谓探测挡在用户态内存；block cache 治「在」—— 把热块留在解压后的内存</text>

  <!-- Panel A -->
  <rect x="56" y="104" width="1128" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="126" font-size="13" font-weight="700" fill="#4A473F">A · 一次 Get(k) 在单个 SST 文件上的探测顺序（自左向右穿闸，任一步命中即返回）</text>

  <rect x="80" y="150" width="232" height="130" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="94" y="172" font-size="12.5" font-weight="700" fill="#2C4460">① bloom filter</text>
  <text x="94" y="190" font-size="10" font-weight="700" fill="#3D5A80">用户态内存 · ~百 ns</text>
  <text x="94" y="212" font-size="10" fill="#2C4460">k 次哈希查位图（filter block）</text>
  <text x="94" y="230" font-size="10" fill="#2C4460">「肯定不在」→ 跳过整个文件</text>
  <text x="94" y="248" font-size="10" fill="#2C4460">「可能在」（≈1% 假阳）→ 放行</text>

  <rect x="368" y="150" width="232" height="130" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="382" y="172" font-size="12.5" font-weight="700" fill="#24473F">② block cache</text>
  <text x="382" y="190" font-size="10" font-weight="700" fill="#2F6B5E">用户态内存 · ~μs 级</text>
  <text x="382" y="212" font-size="10" fill="#24473F">分片 LRU，存解压后 data block</text>
  <text x="382" y="230" font-size="10" fill="#24473F">shard 锁 = 多线程下的等待点</text>
  <text x="382" y="248" font-size="10" fill="#24473F">命中 → 块内二分找 key，返回</text>

  <rect x="656" y="150" width="232" height="130" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="670" y="172" font-size="12.5" font-weight="700" fill="#6B4E28">③ 页缓存（内核）</text>
  <text x="670" y="190" font-size="10" font-weight="700" fill="#8A6A3A">内核内存 · ~十 μs 级</text>
  <text x="670" y="212" font-size="10" fill="#6B4E28">pread 陷入内核，存压缩块（1.2）</text>
  <text x="670" y="230" font-size="10" fill="#6B4E28">命中 → CPU 拷贝到用户 buf，</text>
  <text x="670" y="248" font-size="10" fill="#6B4E28">解压后装入 block cache</text>

  <rect x="944" y="150" width="232" height="130" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="958" y="172" font-size="12.5" font-weight="700" fill="#733428">④ 盘读（NVMe）</text>
  <text x="958" y="190" font-size="10" font-weight="700" fill="#A64B3C">硬件 · ~百 μs 级</text>
  <text x="958" y="212" font-size="10" fill="#733428">线程睡眠等中断（1.8）</text>
  <text x="958" y="230" font-size="10" fill="#733428">DMA：盘 → 页缓存，不占 CPU</text>
  <text x="958" y="248" font-size="10" fill="#733428">之后走 ③ 的拷贝与解压</text>

  <line x1="316" y1="215" x2="364" y2="215" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="340" y="205" font-size="9.5" fill="#6B675C" text-anchor="middle">miss</text>
  <line x1="604" y1="215" x2="652" y2="215" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="628" y="205" font-size="9.5" fill="#6B675C" text-anchor="middle">miss</text>
  <line x1="892" y1="215" x2="940" y2="215" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="916" y="205" font-size="9.5" fill="#6B675C" text-anchor="middle">miss</text>

  <text x="196" y="302" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle">命中零额外拷贝：引用缓存块</text>
  <text x="772" y="302" font-size="10" font-weight="700" fill="#A64B3C" text-anchor="middle">CPU 拷贝 ×1 ＋ 解压 ×1</text>
  <text x="1060" y="302" font-size="10" font-weight="700" fill="#A64B3C" text-anchor="middle">DMA ×1（非 CPU 搬运）</text>

  <line x1="1060" y1="316" x2="490" y2="316" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="775" y="336" font-size="10" fill="#733428" text-anchor="middle">miss 回填链：盘 → 页缓存 →（拷贝 + 解压）→ block cache —— 下次同块命中止步更早</text>

  <text x="76" y="374" font-size="10.5" font-weight="700" fill="#4A473F">①② 全程用户态、零系统调用；从 ③ 起才陷入内核，到 ④ 才碰硬件 —— 读延迟优化的全部目标：让探测在越早的闸口终止</text>

  <!-- Panel B -->
  <rect x="56" y="424" width="1128" height="170" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="446" font-size="13" font-weight="700" fill="#3D5A80">B · 1000 次「key 不存在」的点查探测（bloom 10 bits/key）—— 条宽为示意，非线性比例</text>

  <rect x="90" y="462" width="780" height="28" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="104" y="481" font-size="10.5" fill="#2C4460">1000 次探测抵达 bloom（若没有 bloom：每次都要 index block + data block 两趟 IO）</text>

  <rect x="90" y="500" width="200" height="28" rx="5" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
  <text x="104" y="519" font-size="10.5" fill="#6B4E28">~10 次穿透（假阳性）</text>
  <text x="310" y="519" font-size="10.5" fill="#4A473F">← 挡掉 ~990 次：bloom 的全部价值 —— 一次内存哈希查询，换掉一趟盘 IO</text>

  <rect x="90" y="538" width="90" height="28" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="196" y="557" font-size="10.5" fill="#733428">真正落盘 ≤ 10 次（穿透者还要再被 block cache / 页缓存各挡一道）</text>

  <!-- Panel C -->
  <rect x="56" y="614" width="1128" height="122" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="636" font-size="13" font-weight="700" fill="#4A473F">C · 两级缓存的内存账 —— 容量规划必须把两级加在一起算</text>

  <rect x="76" y="650" width="348" height="70" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="90" y="672" font-size="11" font-weight="700" fill="#24473F">block cache（引擎自管）</text>
  <text x="90" y="692" font-size="9.5" fill="#24473F">存解压块 · 命中最快 · 内存密度低</text>
  <text x="90" y="708" font-size="9.5" fill="#24473F">大小显式可控（默认很小，生产必须配置）</text>

  <rect x="446" y="650" width="348" height="70" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="460" y="672" font-size="11" font-weight="700" fill="#6B4E28">页缓存（内核代管）</text>
  <text x="460" y="692" font-size="9.5" fill="#6B4E28">存压缩块 · 命中要再解压 · 内存密度高</text>
  <text x="460" y="708" font-size="9.5" fill="#6B4E28">引擎只能用 fadvise 施加影响（1.6）</text>

  <rect x="816" y="650" width="348" height="70" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="830" y="672" font-size="11" font-weight="700" fill="#444441">重复驻留与单级化</text>
  <text x="830" y="692" font-size="9.5" fill="#444441">同一块数据可能两级各占一份内存</text>
  <text x="830" y="708" font-size="9.5" fill="#444441">O_DIRECT + 大 block cache = 只留一级（6.9）</text>
</svg>
