<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200px" height="760px" viewBox="0 0 1200 760" version="1.1">
  <title>Request rate versus max concurrency</title>
  <desc>Diagram explaining arrival rate, queueing, max concurrency, scheduling, and tail latency.</desc>
  <rect x="0" y="0" width="1200" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#42545a"/>
    </marker>
  </defs>
  <text x="600" y="44" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#263238">Request Rate vs Max Concurrency</text>
  <text x="600" y="82" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#455a64">到达率控制外部流量，并发上限控制同时执行；共同影响排队和 p95</text>

  <rect x="52" y="150" width="260" height="430" rx="16" ry="16" fill="#fffaf0" stroke="#c8bea7" stroke-width="2"/>
  <text x="182" y="190" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2f3b3f">Client Load Generator</text>
  <text x="182" y="230" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#8a4f12">request_rate = 4/s</text>
  <circle cx="110" cy="292" r="18" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="2"/>
  <circle cx="170" cy="292" r="18" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="2"/>
  <circle cx="230" cy="292" r="18" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="2"/>
  <circle cx="140" cy="362" r="18" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="2"/>
  <circle cx="200" cy="362" r="18" fill="#e8f3ee" stroke="#8fa6a0" stroke-width="2"/>
  <text x="182" y="448" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">外部流量压力</text>
  <text x="182" y="474" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">可能均匀，也可能 bursty</text>

  <path d="M318 360 L410 360" fill="none" stroke="#42545a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="416" y="150" width="300" height="430" rx="16" ry="16" fill="#f8fbff" stroke="#b8c4d6" stroke-width="2"/>
  <text x="566" y="190" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2f3b3f">Queue + Gate</text>
  <text x="566" y="230" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#5c4770">max_concurrency = 32</text>
  <rect x="458" y="286" width="216" height="54" rx="10" ry="10" fill="#eee7f5" stroke="#b09cc7" stroke-width="1.5"/>
  <text x="566" y="319" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5c4770">最多 32 个请求同时执行</text>
  <rect x="458" y="372" width="216" height="54" rx="10" ry="10" fill="#fff1dc" stroke="#d48b2a" stroke-width="1.5"/>
  <text x="566" y="405" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#7a4a16">超过能力就排队</text>
  <text x="566" y="492" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#607077">排队时间会进入 TTFT / E2E</text>

  <path d="M720 360 L812 360" fill="none" stroke="#42545a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="818" y="150" width="330" height="430" rx="16" ry="16" fill="#fffaf0" stroke="#c8bea7" stroke-width="2"/>
  <text x="983" y="190" text-anchor="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2f3b3f">LLM Server</text>
  <rect x="866" y="252" width="234" height="70" rx="12" ry="12" fill="#eef3ef" stroke="#8fa6a0" stroke-width="1.5"/>
  <text x="983" y="282" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1d5c63">scheduler / batching</text>
  <text x="983" y="306" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1d5c63">更多并发可能提高 TPS</text>
  <rect x="866" y="364" width="234" height="70" rx="12" ry="12" fill="#f7eadc" stroke="#d6ad86" stroke-width="1.5"/>
  <text x="983" y="394" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#734821">tail latency / failures</text>
  <text x="983" y="418" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#734821">压力过高会恶化</text>

  <rect x="184" y="636" width="832" height="48" rx="12" ry="12" fill="#eef3ef" stroke="#afbeb6" stroke-width="1.5"/>
  <text x="600" y="664" text-anchor="middle" dominant-baseline="middle" font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#33464b">典型现象：TPS 上升，但 TTFT / TPOT p95 也上升</text>
</svg>
