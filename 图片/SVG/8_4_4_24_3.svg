<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<title>分层排障：先找到不再前进的位置，再决定干预</title>
<desc>保留正常窗口与异常窗口；任何配置变更都要有证据、作用域和撤销方式。</desc>
<defs>
<marker id="8_4_4_24_3-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="8_4_4_24_3-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="8_4_4_24_3-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="8_4_4_24_3-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>
<text x="48" y="45" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="heading">分层排障：先找到不再前进的位置，再决定干预</text>
<text x="48" y="74" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="heading">保留正常窗口与异常窗口；任何配置变更都要有证据、作用域和撤销方式。</text>
<rect x="48" y="126" width="344" height="78" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="220.0" y="170.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">物理错误同窗增加？</text>
<line x1="392" y1="165" x2="481" y2="165" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_3-arr)"/>
<text x="425" y="152" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">是</text>
<rect x="488" y="126" width="704" height="78" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3" />
<text x="840.0" y="159.0" font-size="14" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">链路域：端口 / 模块 / 协商</text>
<text x="840.0" y="181.0" font-size="14" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">CRC、不可纠正错误、link flap</text>
<line x1="220" y1="204" x2="220" y2="240" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_3-arr)"/>
<text x="234" y="229" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">否 / 未证实</text>
<rect x="48" y="244" width="344" height="78" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="220.0" y="288.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">相关优先级持续被暂停？</text>
<line x1="392" y1="283" x2="481" y2="283" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_3-arr)"/>
<text x="425" y="270" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">是</text>
<rect x="488" y="244" width="704" height="78" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3" />
<text x="840.0" y="277.0" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">沿数据方向追 RX / TX pause</text>
<text x="840.0" y="299.0" font-size="14" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">ingress PG → egress TC → 接收吸收</text>
<line x1="220" y1="322" x2="220" y2="358" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_3-arr)"/>
<text x="234" y="347" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">否 / 未证实</text>
<rect x="48" y="362" width="344" height="78" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="220.0" y="406.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">CE → NP → RP 有断点？</text>
<line x1="392" y1="401" x2="481" y2="401" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_3-arr)"/>
<text x="425" y="388" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">是</text>
<rect x="488" y="362" width="704" height="78" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3" />
<text x="840.0" y="395.0" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">反馈域：分类 / ECT / 回程</text>
<text x="840.0" y="417.0" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">核对真实队列、CNP QoS 与 RP 处理</text>
<line x1="220" y1="440" x2="220" y2="476" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_3-arr)"/>
<text x="234" y="465" font-size="12" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">否 / 未证实</text>
<rect x="48" y="480" width="344" height="78" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="220.0" y="524.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">RNR 或 CQ/RQ 无进展？</text>
<line x1="392" y1="519" x2="481" y2="519" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_3-arr)"/>
<text x="425" y="506" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">是</text>
<rect x="488" y="480" width="704" height="78" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3" />
<text x="840.0" y="513.0" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">主机与 verbs：资源 / 提交 / 完成</text>
<text x="840.0" y="535.0" font-size="14" font-weight="400" fill="#24473F" text-anchor="middle" data-role="body">CQ 线程、RQ 补充、NUMA / PCIe</text>
<text x="48" y="588" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">证据不足：继续端点 / 路径对照，不写“已确认根因”。</text>
<rect x="48" y="609" width="246" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="171.0" y="634.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">① 保全现场</text>
<rect x="347" y="609" width="246" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="470.0" y="634.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">② 降低影响</text>
<rect x="646" y="609" width="246" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="769.0" y="634.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">③ 定点干预</text>
<rect x="945" y="609" width="247" height="40" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3" />
<text x="1068.5" y="634.0" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">④ 业务级复验</text>
<line x1="298" y1="629" x2="341" y2="629" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_3-arr)"/>
<line x1="597" y1="629" x2="640" y2="629" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_3-arr)"/>
<line x1="896" y1="629" x2="939" y2="629" stroke="#5A564B" stroke-width="1.7" marker-end="url(#8_4_4_24_3-arr)"/>
<text x="48" y="670" font-size="13" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">watchdog 可能以丢包换取恢复进展；端口恢复转发不等于请求结果和业务一致性已经恢复。</text>
</svg>