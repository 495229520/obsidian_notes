<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5B95"/>
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>

  <!-- 顶部标题区 -->
  <text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26">EventLoop 事件循环与 epoll 状态机驱动时序</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">线程统一睡眠在 epoll_wait；就绪后单次派发推演有限字节，并动态调整 EPOLLIN / EPOLLOUT 兴趣集</text>

  <!-- 4 条参与者泳道头部 -->
  <rect x="68" y="98" width="220" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="178" y="125" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">EventLoop 线程 (Reactor)</text>

  <rect x="362" y="98" width="220" height="44" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="472" y="125" font-size="13" font-weight="700" fill="#6B5B95" text-anchor="middle">epoll 内核对象 (sys_epoll)</text>

  <rect x="656" y="98" width="220" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="766" y="125" font-size="13" font-weight="700" fill="#733428" text-anchor="middle">socket 内核缓冲 (rx/tx)</text>

  <rect x="950" y="98" width="220" height="44" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="1060" y="125" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">Connection 状态机 (用户态)</text>

  <!-- 垂直虚线生命线 -->
  <line x1="178" y1="142" x2="178" y2="528" stroke="#B8B4A8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="472" y1="142" x2="472" y2="528" stroke="#B8B4A8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="766" y1="142" x2="766" y2="528" stroke="#B8B4A8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="1060" y1="142" x2="1060" y2="528" stroke="#B8B4A8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 阶段 1: 等待与捕获 -->
  <rect x="172" y="156" width="12" height="110" rx="3" fill="#2F6B5E"/>
  <rect x="466" y="166" width="12" height="100" rx="3" fill="#6B5B95"/>

  <!-- 调用箭头1: Loop -> EP (epoll_wait) -->
  <line x1="184" y1="168" x2="464" y2="168" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="324" y="162" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">① epoll_wait(epfd, events, ...)</text>

  <!-- 线程睡眠卡片 -->
  <rect x="80" y="186" width="196" height="54" rx="6" fill="#ECEAE0" stroke="#8A8574" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="178" y="208" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">无就绪事件时线程睡眠</text>
  <text x="178" y="226" font-size="10.5" fill="#4A473F" text-anchor="middle">让出 CPU 核心，零开销等待</text>

  <!-- 内核数据到达: Sock -> EP -->
  <line x1="766" y1="210" x2="478" y2="210" stroke="#A64B3C" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="622" y="204" font-size="11.5" fill="#733428" text-anchor="middle">② 网卡 DMA 到达 / 发送窗口就绪</text>

  <!-- epoll 返回: EP -> Loop -->
  <line x1="466" y1="256" x2="186" y2="256" stroke="#6B5B95" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="324" y="248" font-size="11.5" font-weight="700" fill="#6B5B95" text-anchor="middle">③ 唤醒返回就绪事件集 (EPOLLIN | EPOLLOUT)</text>

  <!-- 阶段 2: 派发与推进 -->
  <rect x="172" y="280" width="12" height="120" rx="3" fill="#2F6B5E"/>
  <rect x="1054" y="292" width="12" height="190" rx="3" fill="#8A6A3A"/>

  <!-- 事件派发: Loop -> Conn -->
  <line x1="184" y1="296" x2="1052" y2="296" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="618" y="288" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">④ HandleEvents(events) 派发到连接</text>

  <!-- 连接推进 IO: Conn -> Sock -->
  <line x1="1054" y1="334" x2="774" y2="334" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="914" y="326" font-size="11.5" fill="#6B4E28" text-anchor="middle">⑤ 非阻塞 read() / send() 推进有限字节</text>

  <!-- 状态机更新卡片 -->
  <rect x="962" y="354" width="196" height="54" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="1060" y="375" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">推演 parse_state_ 状态</text>
  <text x="1060" y="394" font-size="10.5" fill="#4A473F" text-anchor="middle">更新 output_queue_ 发送偏移</text>

  <!-- 阶段 3: 兴趣集动态调谐 -->
  <!-- Conn -> EP: epoll_ctl MOD -->
  <line x1="1054" y1="432" x2="478" y2="432" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="766" y="424" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">⑥ epoll_ctl(EPOLL_CTL_MOD) 调谐兴趣集</text>

  <!-- 兴趣集说明卡片 -->
  <rect x="374" y="446" width="196" height="42" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="472" y="464" font-size="10.5" fill="#6B5B95" text-anchor="middle">队列空: 仅 EPOLLIN</text>
  <text x="472" y="479" font-size="10.5" fill="#6B5B95" text-anchor="middle">队列非空: IN | OUT</text>

  <!-- Conn 完成: 返回 Loop -->
  <line x1="1054" y1="498" x2="186" y2="498" stroke="#8A6A3A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr-amber)"/>
  <text x="618" y="490" font-size="11.5" fill="#24473F" text-anchor="middle">⑦ 本轮推进完成，处理超时与任务</text>

  <!-- 底部对比总结卡片区 -->
  <rect x="48" y="552" width="360" height="96" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="66" y="578" font-size="13" font-weight="700" fill="#2F6B5E">统一睡眠 · 消除专线等待</text>
  <text x="66" y="602" font-size="11" fill="#4A473F">线程不再阻塞在单条连接的 ReadExactly 上</text>
  <text x="66" y="624" font-size="11" fill="#4A473F">统一在 epoll_wait 睡眠，由内核事件驱动唤醒</text>

  <rect x="440" y="552" width="360" height="96" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="458" y="578" font-size="13" font-weight="700" fill="#8A6A3A">有限推进 · 状态机保存半途</text>
  <text x="458" y="602" font-size="11" fill="#4A473F">每次就绪只读写有限字节，防止单连接饿死全局</text>
  <text x="458" y="624" font-size="11" fill="#4A473F">短读短写由缓冲区与 parse_state 保存下次继续</text>

  <rect x="832" y="552" width="360" height="96" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="850" y="578" font-size="13" font-weight="700" fill="#6B5B95">按需挂载 · 避免忙轮询</text>
  <text x="850" y="602" font-size="11" fill="#4A473F">output_queue 非空时才开启 EPOLLOUT 监听</text>
  <text x="850" y="624" font-size="11" fill="#4A473F">数据写完立即关掉 EPOLLOUT，杜绝 CPU 空转</text>
</svg>
