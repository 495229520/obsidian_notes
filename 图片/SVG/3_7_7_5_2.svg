<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 770" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>滑动窗口的四个区域与流量控制</title>
  <desc>把发送方的字节流按已确认、已发送未确认、可立即发送、暂不能发四段画出来，标出三个边界指针；再列出窗口滑动、张开、合拢、零窗口四种变化，最后对照流量控制与拥塞控制的区别。</desc>

  <rect x="0" y="0" width="1240" height="770" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">滑动窗口：能发多少，由接收方说了算</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">窗口把发送方的字节流切成四段；右沿的位置就是对端在 ACK 里通告的 win</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="236" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 发送方眼里的字节流</text>

  <!-- 窗口括号 -->
  <line x1="316" y1="164" x2="916" y2="164" stroke="#8A6A3A" stroke-width="1.4"/>
  <line x1="316" y1="164" x2="316" y2="176" stroke="#8A6A3A" stroke-width="1.4"/>
  <line x1="916" y1="164" x2="916" y2="176" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="616" y="157" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">发送窗口 = 对端通告的 win</text>

  <!-- 四段 -->
  <rect x="76" y="180" width="240" height="50" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="196" y="203" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">① 已发送并已确认</text>
  <text x="196" y="220" font-size="10.5" fill="#6B675C" text-anchor="middle">缓冲区可以释放</text>

  <rect x="316" y="180" width="240" height="50" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="436" y="203" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">② 已发送，未确认</text>
  <text x="436" y="220" font-size="10.5" fill="#6B4E28" text-anchor="middle">必须留着，可能要重传</text>

  <rect x="556" y="180" width="360" height="50" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="736" y="203" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">③ 可以立即发送</text>
  <text x="736" y="220" font-size="10.5" fill="#24473F" text-anchor="middle">对端还留着这么多空间</text>

  <rect x="916" y="180" width="248" height="50" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1040" y="203" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">④ 暂时不能发</text>
  <text x="1040" y="220" font-size="10.5" fill="#733428" text-anchor="middle">超出了窗口右沿</text>

  <!-- 指针 -->
  <line x1="316" y1="230" x2="316" y2="250" stroke="#5A564B" stroke-width="1.2"/>
  <line x1="556" y1="230" x2="556" y2="250" stroke="#5A564B" stroke-width="1.2"/>
  <line x1="916" y1="230" x2="916" y2="250" stroke="#5A564B" stroke-width="1.2"/>

  <text x="316" y="266" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">SND.UNA</text>
  <text x="316" y="282" font-size="10.5" fill="#6B675C" text-anchor="middle">最早未确认的字节</text>
  <text x="556" y="266" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">SND.NXT</text>
  <text x="556" y="282" font-size="10.5" fill="#6B675C" text-anchor="middle">下一个要发的字节</text>
  <text x="916" y="266" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">SND.UNA + win</text>
  <text x="916" y="282" font-size="10.5" fill="#6B675C" text-anchor="middle">窗口右沿</text>

  <text x="76" y="316" font-size="11" fill="#6B675C">在途未确认字节数 = SND.NXT − SND.UNA，不能超过 win</text>

  <!-- ================= Panel B ================= -->
  <rect x="48" y="356" width="1144" height="164" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="382" font-size="15" font-weight="700" fill="#4A473F">B · 窗口的四种变化</text>

  <rect x="72" y="394" width="264" height="110" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="92" y="418" font-size="12" font-weight="700" fill="#24473F">滑动：收到新的 ACK</text>
  <text x="92" y="442" font-size="11.5" fill="#24473F">左沿右移，整体向右滑</text>
  <text x="92" y="464" font-size="11.5" fill="#24473F">①区变大，②区变小</text>
  <text x="92" y="488" font-size="11" fill="#24473F">这是最常见的一种</text>

  <rect x="352" y="394" width="264" height="110" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="372" y="418" font-size="12" font-weight="700" fill="#2C4460">张开：对端 win 变大</text>
  <text x="372" y="442" font-size="11.5" fill="#2C4460">右沿右移，窗口变宽</text>
  <text x="372" y="464" font-size="11.5" fill="#2C4460">应用把数据读走了</text>
  <text x="372" y="488" font-size="11" fill="#2C4460">③区变大，能发更多</text>

  <rect x="632" y="394" width="264" height="110" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="652" y="418" font-size="12" font-weight="700" fill="#6B4E28">合拢：对端 win 变小</text>
  <text x="652" y="442" font-size="11.5" fill="#6B4E28">右沿停住，窗口变窄</text>
  <text x="652" y="464" font-size="11.5" fill="#6B4E28">对端读得比收得慢</text>
  <text x="652" y="488" font-size="11" fill="#6B4E28">协议禁止右沿往左退</text>

  <rect x="912" y="394" width="264" height="110" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="932" y="418" font-size="12" font-weight="700" fill="#733428">零窗口：win = 0</text>
  <text x="932" y="442" font-size="11.5" fill="#733428">接收缓冲区已经满了</text>
  <text x="932" y="464" font-size="11.5" fill="#733428">发送方立即停发</text>
  <text x="932" y="488" font-size="11" fill="#733428">靠持续计时器定期探测</text>

  <!-- ================= Panel C ================= -->
  <rect x="48" y="536" width="1144" height="176" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="562" font-size="15" font-weight="700" fill="#4A473F">C · 流量控制不是拥塞控制</text>

  <rect x="76" y="576" width="1088" height="24" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="600" width="1088" height="24" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="624" width="1088" height="24" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="648" width="1088" height="24" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="672" width="1088" height="26" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <line x1="276" y1="576" x2="276" y2="698" stroke="#9B968A" stroke-width="1"/>
  <line x1="726" y1="576" x2="726" y2="672" stroke="#9B968A" stroke-width="1"/>

  <text x="176" y="593" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">对比维度</text>
  <text x="501" y="593" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">流量控制</text>
  <text x="945" y="593" font-size="11" font-weight="700" fill="#4A3F68" text-anchor="middle">拥塞控制</text>

  <text x="176" y="617" font-size="11" fill="#4A473F" text-anchor="middle">怕压垮谁</text>
  <text x="501" y="617" font-size="11" fill="#4A473F" text-anchor="middle">接收方的缓冲区</text>
  <text x="945" y="617" font-size="11" fill="#4A473F" text-anchor="middle">中间路由器的队列</text>

  <text x="176" y="641" font-size="11" fill="#4A473F" text-anchor="middle">看哪个变量</text>
  <text x="501" y="641" font-size="11" fill="#4A473F" text-anchor="middle">对端通告的 win</text>
  <text x="945" y="641" font-size="11" fill="#4A473F" text-anchor="middle">自己维护的 cwnd</text>

  <text x="176" y="665" font-size="11" fill="#4A473F" text-anchor="middle">数据从哪来</text>
  <text x="501" y="665" font-size="11" fill="#4A473F" text-anchor="middle">对端明确写在 TCP 头里</text>
  <text x="945" y="665" font-size="11" fill="#4A473F" text-anchor="middle">没人告诉，靠丢包和延迟推测</text>

  <text x="176" y="690" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">实际能发多少</text>
  <text x="720" y="690" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">取两者的最小值：在途字节数 ≤ min(win, cwnd)</text>

  <text x="48" y="740" font-size="11.5" fill="#4A473F">win 是对方写给你的，cwnd 是你自己猜的。吞吐上不去时先看是哪一个卡住：抓包能直接读到 win，cwnd 只能用 ss -i 观察。</text>
  <text x="48" y="762" font-size="11.5" fill="#4A473F">16 位的 win 最大只能表示 65535 字节，高带宽长延迟链路上不够用，靠「窗口扩大选项」把它左移最多 14 位。</text>
</svg>
