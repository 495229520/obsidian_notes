<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 750" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <title>协议就是格式约定：三种报文的实际长相</title>
  <desc>把抽象的协议定义落到三个具体报文上：HTTP 用回车换行和空行划分结构，DNS 用定长的十二字节头部，自定义协议用长度前缀；底部对照定长、分隔符、长度前缀三种消息边界方案。</desc>

  <rect x="0" y="0" width="1240" height="750" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">协议就是格式约定：三种报文实际长什么样</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">所有协议都要回答同一个问题：收到一串字节，从哪到哪算一条完整消息</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="592" height="296" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · HTTP：文本行协议</text>

  <rect x="72" y="150" width="544" height="30" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="88" y="170" font-size="11.5" fill="#2C4460">GET /index.html HTTP/1.1</text>
  <text x="600" y="170" font-size="10.5" fill="#6B675C" text-anchor="end">请求行</text>

  <rect x="72" y="184" width="544" height="30" fill="#EDF1F7" stroke="#3D5A80" stroke-width="1"/>
  <text x="88" y="204" font-size="11.5" fill="#2C4460">Host: example.com</text>
  <text x="600" y="204" font-size="10.5" fill="#6B675C" text-anchor="end">头字段</text>

  <rect x="72" y="218" width="544" height="30" fill="#EDF1F7" stroke="#3D5A80" stroke-width="1"/>
  <text x="88" y="238" font-size="11.5" fill="#2C4460">Connection: keep-alive</text>
  <text x="600" y="238" font-size="10.5" fill="#6B675C" text-anchor="end">头字段</text>

  <rect x="72" y="252" width="544" height="30" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="88" y="272" font-size="11.5" font-weight="700" fill="#6B4E28">Content-Length: 17</text>
  <text x="600" y="272" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="end">声明实体长度</text>

  <rect x="72" y="286" width="544" height="30" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="88" y="306" font-size="11.5" font-weight="700" fill="#733428">（空行）</text>
  <text x="600" y="306" font-size="10.5" font-weight="700" fill="#733428" text-anchor="end">头部到此结束</text>

  <rect x="72" y="320" width="544" height="30" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="88" y="340" font-size="11.5" fill="#24473F">name=alice&amp;age=30</text>
  <text x="600" y="340" font-size="10.5" fill="#6B675C" text-anchor="end">实体，正好 17 字节</text>

  <text x="72" y="372" font-size="11" fill="#6B675C">每行以 CRLF 结尾；头部与实体之间空一行</text>

  <!-- ================= Panel B ================= -->
  <rect x="656" y="104" width="536" height="296" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="680" y="130" font-size="15" font-weight="700" fill="#4A473F">B · DNS：定长二进制头</text>

  <line x1="690" y1="160" x2="1160" y2="160" stroke="#9B968A" stroke-width="1"/>
  <text x="690" y="152" font-size="10" fill="#6B675C" text-anchor="middle">bit 0</text>
  <text x="925" y="152" font-size="10" fill="#6B675C" text-anchor="middle">16</text>
  <text x="1160" y="152" font-size="10" fill="#6B675C" text-anchor="middle">31</text>

  <rect x="690" y="170" width="235" height="34" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="807" y="192" font-size="11.5" fill="#4A3F68" text-anchor="middle">事务 ID</text>
  <rect x="925" y="170" width="235" height="34" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="1042" y="192" font-size="11.5" fill="#4A3F68" text-anchor="middle">标志位</text>

  <rect x="690" y="208" width="235" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="807" y="230" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">问题数</text>
  <rect x="925" y="208" width="235" height="34" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="1042" y="230" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">回答数</text>

  <rect x="690" y="246" width="235" height="34" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="807" y="268" font-size="11.5" fill="#4A473F" text-anchor="middle">授权记录数</text>
  <rect x="925" y="246" width="235" height="34" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1042" y="268" font-size="11.5" fill="#4A473F" text-anchor="middle">附加记录数</text>

  <rect x="690" y="290" width="470" height="34" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="925" y="312" font-size="11.5" fill="#24473F" text-anchor="middle">问题区 · 回答区（变长，条数由上面四个计数决定）</text>

  <text x="680" y="350" font-size="11" fill="#6B675C">头部恒为 12 字节：先读满 12 字节，</text>
  <text x="680" y="370" font-size="11" fill="#6B675C">就知道后面要解析几条记录</text>

  <!-- ================= Panel C ================= -->
  <rect x="48" y="416" width="1144" height="224" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="442" font-size="15" font-weight="700" fill="#4A473F">C · 自定义协议：长度前缀，以及三种定边界的办法</text>

  <rect x="76" y="452" width="120" height="40" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="136" y="469" font-size="11.5" fill="#4A3F68" text-anchor="middle">魔数</text>
  <text x="136" y="484" font-size="10" fill="#4A3F68" text-anchor="middle">2 B</text>
  <rect x="196" y="452" width="90" height="40" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="241" y="469" font-size="11.5" fill="#4A3F68" text-anchor="middle">版本</text>
  <text x="241" y="484" font-size="10" fill="#4A3F68" text-anchor="middle">1 B</text>
  <rect x="286" y="452" width="90" height="40" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="331" y="469" font-size="11.5" fill="#4A3F68" text-anchor="middle">类型</text>
  <text x="331" y="484" font-size="10" fill="#4A3F68" text-anchor="middle">1 B</text>
  <rect x="376" y="452" width="160" height="40" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="456" y="469" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">负载长度</text>
  <text x="456" y="484" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">4 B，网络字节序</text>
  <rect x="536" y="452" width="628" height="40" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="850" y="476" font-size="11.5" fill="#24473F" text-anchor="middle">负载：正好这么多字节</text>

  <path d="M456,492 V506 H850 V496" fill="none" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <rect x="76" y="518" width="1088" height="24" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="542" width="1088" height="26" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="568" width="1088" height="26" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="594" width="1088" height="26" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <line x1="216" y1="518" x2="216" y2="620" stroke="#9B968A" stroke-width="1"/>
  <line x1="546" y1="518" x2="546" y2="620" stroke="#9B968A" stroke-width="1"/>
  <line x1="866" y1="518" x2="866" y2="620" stroke="#9B968A" stroke-width="1"/>

  <text x="146" y="535" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">定边界的办法</text>
  <text x="381" y="535" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">接收方怎么切</text>
  <text x="706" y="535" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">代价</text>
  <text x="1015" y="535" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">谁在用</text>

  <text x="146" y="560" font-size="11" fill="#4A473F" text-anchor="middle">定长</text>
  <text x="381" y="560" font-size="11" fill="#4A473F" text-anchor="middle">每 N 字节切一刀</text>
  <text x="706" y="560" font-size="11" fill="#4A473F" text-anchor="middle">短消息也占满 N 字节</text>
  <text x="1015" y="560" font-size="11" fill="#4A473F" text-anchor="middle">部分硬件与工控协议</text>

  <text x="146" y="586" font-size="11" fill="#4A473F" text-anchor="middle">分隔符</text>
  <text x="381" y="586" font-size="11" fill="#4A473F" text-anchor="middle">扫到 CRLF 就是一条</text>
  <text x="706" y="586" font-size="11" fill="#4A473F" text-anchor="middle">正文含分隔符时要转义</text>
  <text x="1015" y="586" font-size="11" fill="#4A473F" text-anchor="middle">HTTP 头部、Redis RESP</text>

  <text x="146" y="612" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">长度前缀</text>
  <text x="381" y="612" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">先读长度，再读那么多</text>
  <text x="706" y="612" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">必须给长度设上限</text>
  <text x="1015" y="612" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">DNS、gRPC、多数自定义协议</text>

  <text x="48" y="688" font-size="11.5" fill="#4A473F">HTTP 其实两种都用：头部靠 CRLF 和空行切，实体靠 Content-Length 这个长度字段切。分块传输时改用 chunked，每块自带长度。</text>
  <text x="48" y="710" font-size="11.5" fill="#4A473F">长度字段不设上限是真实的攻击面：对方声明 4 GB，接收端照着分配内存就被打垮了。</text>
</svg>
