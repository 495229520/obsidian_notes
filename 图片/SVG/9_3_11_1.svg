<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-size: 18px; fill: #475569; }
      .box-title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 16px; fill: #334155; }
      .pill { font-size: 15px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <text font-family="Inter, Arial, sans-serif" x="70" y="70" class="title">Week 6 Observability -&gt; Week 7 Cache Layout</text>
  <text font-family="Inter, Arial, sans-serif" x="70" y="105" class="subtitle">从看到 metrics 变化，推进到解释 KV / Prefix / Paged KV 为什么影响 serving</text>
  <rect x="70" y="170" width="310" height="350" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="100" y="202" width="118" height="34" rx="17" fill="#2563eb"/>
  <text font-family="Inter, Arial, sans-serif" x="121" y="225" class="pill">Week 6</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="275" class="box-title">Observability</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="320" class="text">TTFT / TPOT p95</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="355" class="text">KV cache usage</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="390" class="text">running / waiting</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="425" class="text">failed requests</text>
  <text font-family="Inter, Arial, sans-serif" x="100" y="460" class="text">cost / 1M tokens</text>
  <rect x="485" y="170" width="310" height="350" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="515" y="202" width="118" height="34" rx="17" fill="#16a34a"/>
  <text font-family="Inter, Arial, sans-serif" x="536" y="225" class="pill">Week 7</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="275" class="box-title">Cache Mechanisms</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="320" class="text">KV cache memory model</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="355" class="text">prefix cache reuse</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="390" class="text">paged KV block table</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="425" class="text">page size tradeoff</text>
  <text font-family="Inter, Arial, sans-serif" x="515" y="460" class="text">FlashInfer / vLLM baseline</text>
  <rect x="900" y="170" width="310" height="350" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <rect x="930" y="202" width="128" height="34" rx="17" fill="#ea580c"/>
  <text font-family="Inter, Arial, sans-serif" x="950" y="225" class="pill">Output</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="275" class="box-title">Serving Explanation</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="320" class="text">why TTFT drops / rises</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="355" class="text">why TPOT changes</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="390" class="text">why cache hits matter</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="425" class="text">why memory fragments</text>
  <text font-family="Inter, Arial, sans-serif" x="930" y="460" class="text">why cost changes</text>
  <path d="M395 345 H465" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M810 345 H880" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="230" y="585" width="820" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text font-family="Inter, Arial, sans-serif" x="270" y="622" class="text">benchmark workload + live metrics + cache layout = defensible serving diagnosis</text>
