<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>
<title>多数派复制 ≠ 内容真实性</title><desc>左侧三节点 Raft 消息时序展示 B 未落盘却 ACK；右侧展示错误输入 90 被摘要与三份副本一致保存，二者均不在完整性保证内。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5A564B"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A64B3C"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6B5E"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5A80"/></marker>
</defs>
<text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26" text-anchor="start" data-role="title">多数派复制 ≠ 内容真实性</text>
<text x="48" y="82" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="subtitle">两种构造反例：一张 ACK 不再代表持久化承诺；或者错误发生在摘要与复制之前。</text>
<rect x="48" y="116" width="558" height="446" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<rect x="638" y="116" width="554" height="446" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="68" y="148" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">A · ACK 失信，破坏持久化前提</text>
<rect x="84" y="170" width="132" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="150.0" y="197.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">A · Leader</text>
<line x1="150" y1="216" x2="150" y2="498" stroke="#D8D5C8" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="272" y="170" width="132" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="338.0" y="197.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">B · Follower</text>
<line x1="338" y1="216" x2="338" y2="498" stroke="#D8D5C8" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="456" y="170" width="132" height="46" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="522.0" y="197.76" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">C · Follower</text>
<line x1="522" y1="216" x2="522" y2="498" stroke="#D8D5C8" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="150" y1="258" x2="338" y2="258" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="164" y="246" font-size="13" font-weight="400" fill="#2B2A26" text-anchor="start" data-role="body">L：term=8, index=12</text>
<rect x="273" y="278" width="130" height="46" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="338.0" y="305.76" font-size="14" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">未持久化</text>
<line x1="338" y1="346" x2="150" y2="346" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#red)"/>
<text x="174" y="334" font-size="14" font-weight="400" fill="#733428" text-anchor="start" data-role="body">却回复成功 ACK</text>
<rect x="79" y="366" width="142" height="58" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="150.0" y="387.42" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">A + B = 2/3</text>
<text x="150.0" y="411.42" font-size="13" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">客户端收到成功</text>
<text x="460" y="269" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="body">尚未收到 L</text>
<rect x="79" y="452" width="142" height="45" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="150.0" y="479.26" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle" data-role="body">随后 A 宕机</text>
<text x="69" y="527" font-size="14" font-weight="400" fill="#733428" text-anchor="start" data-role="body">两票的数量成立；“两份稳定承诺”并未成立。</text>
<text x="658" y="148" font-size="16" font-weight="700" fill="#4A473F" text-anchor="start" data-role="section">B · 摘要生成前，输入已经错了</text>
<rect x="658" y="180" width="208" height="90" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
<text x="762.0" y="218.44" font-size="16" font-weight="700" fill="#733428" text-anchor="middle" data-role="body">原始意图：10</text>
<text x="762.0" y="242.44" font-size="16" font-weight="400" fill="#733428" text-anchor="middle" data-role="body">缓冲区误写：90</text>
<line x1="866" y1="225" x2="918" y2="225" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="920" y="180" width="252" height="90" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1046.0" y="218.44" font-size="16" font-weight="700" fill="#6B4E28" text-anchor="middle" data-role="body">对 90 生成摘要</text>
<text x="1046.0" y="242.44" font-size="16" font-weight="400" fill="#6B4E28" text-anchor="middle" data-role="body">H(90) → 开始复制</text>
<rect x="662" y="366" width="158" height="103" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="741.0" y="398.26" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">数据：90</text>
<text x="741.0" y="422.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">摘要：H(90)</text>
<text x="741.0" y="446.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">同一 generation</text>
<rect x="836" y="366" width="158" height="103" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="915.0" y="398.26" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">数据：90</text>
<text x="915.0" y="422.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">摘要：H(90)</text>
<text x="915.0" y="446.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">同一 generation</text>
<rect x="1010" y="366" width="158" height="103" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="1089.0" y="398.26" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle" data-role="body">数据：90</text>
<text x="1089.0" y="422.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">摘要：H(90)</text>
<text x="1089.0" y="446.26" font-size="14" font-weight="400" fill="#2C4460" text-anchor="middle" data-role="body">同一 generation</text>
<path d="M1046,270 L1046,310 L741,310 L741,366" fill="none" stroke="#3D5A80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1046,310 L915,310 L915,366" fill="none" stroke="#3D5A80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1046,310 L1089,310 L1089,366" fill="none" stroke="#3D5A80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="658" y="512" font-size="15" font-weight="400" fill="#733428" text-anchor="start" data-role="body">三份数据与摘要一致。</text>
<text x="658" y="537" font-size="15" font-weight="400" fill="#733428" text-anchor="start" data-role="body">但没有证据证明 90 是原本的正确输入。</text>
<rect x="48" y="585" width="1144" height="46" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="620.0" y="613.44" font-size="16" font-weight="700" fill="#24473F" text-anchor="middle" data-role="body">协议历史一致、字节完整、业务语义正确：需要三份不同的契约。</text>
<line x1="48" y1="643" x2="1192" y2="643" stroke="#D8D5C8" stroke-width="1"/>
<text x="48" y="671" font-size="14" font-weight="400" fill="#6B675C" text-anchor="start" data-role="footer">构造反例用于审计模型边界，不表示基础 Raft 自身违反了它在非拜占庭与稳定存储假设下的保证。</text>
</svg>