<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>ZNS Zone 模型与状态机</title>
  <desc>上：namespace 切成定长 zone，单个 zone 的写指针、ZCAP 与 ZSZE；中：zone 状态机与 open/active 资源上限；下：常规 SSD 与 ZNS 的责任划分对照。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#EDEBE3"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9B968A" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">ZNS：把地址空间切成只能顺序写的 zone</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">FTL 不再替你隐藏"异地更新 + 整块擦除"，而是把这两条物理约束原样搬进接口——换来 WAF≈1 与可预测的尾延迟</text>

  <!-- A · Zone 模型 -->
  <text x="64" y="126" font-size="14" font-weight="700" fill="#2B2A26">A · Zone 模型：namespace = 一排定长 zone，每个 zone 一支只前进的写指针</text>

  <!-- namespace 条 -->
  <text x="64" y="158" font-size="11" fill="#4A473F">namespace</text>
  <rect x="150" y="142" width="126" height="34" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="213" y="163" font-size="10.5" fill="#24473F" text-anchor="middle">zone 0 · FULL</text>
  <rect x="276" y="142" width="126" height="34" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="339" y="163" font-size="10.5" fill="#24473F" text-anchor="middle">zone 1 · FULL</text>
  <rect x="402" y="142" width="126" height="34" fill="#F3E8D3" stroke="#B07D2B" stroke-width="2"/>
  <text x="465" y="163" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">zone 2 · OPEN</text>
  <rect x="528" y="142" width="126" height="34" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="591" y="163" font-size="10.5" fill="#6B4E28" text-anchor="middle">zone 3 · CLOSED</text>
  <rect x="654" y="142" width="126" height="34" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="717" y="163" font-size="10.5" fill="#4A473F" text-anchor="middle">zone 4 · EMPTY</text>
  <rect x="780" y="142" width="126" height="34" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="843" y="163" font-size="10.5" fill="#4A473F" text-anchor="middle">zone 5 · EMPTY</text>
  <rect x="906" y="142" width="126" height="34" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="969" y="163" font-size="10.5" fill="#4A473F" text-anchor="middle">zone 6 · EMPTY</text>
  <rect x="1032" y="142" width="126" height="34" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1095" y="163" font-size="10.5" fill="#4A473F" text-anchor="middle">zone 7 · EMPTY</text>

  <!-- 放大线 -->
  <line x1="402" y1="176" x2="120" y2="228" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="528" y1="176" x2="1160" y2="228" stroke="#9B968A" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- 单 zone 放大 -->
  <rect x="120" y="230" width="1040" height="56" fill="#FBFBF6" stroke="#4A473F" stroke-width="1.4"/>
  <rect x="120" y="230" width="380" height="56" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="310" y="263" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">已写数据（严格按 LBA 递增写入）</text>
  <rect x="500" y="230" width="400" height="56" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1"/>
  <text x="700" y="263" font-size="11.5" fill="#6B4E28" text-anchor="middle">可写区：下一笔写必须精确落在 WP 上</text>
  <rect x="900" y="230" width="260" height="56" fill="url(#hatch)" stroke="#9B968A" stroke-width="1"/>
  <text x="1030" y="263" font-size="11" fill="#4A473F" text-anchor="middle">ZCAP 之外：不可写的洞</text>

  <line x1="500" y1="222" x2="500" y2="294" stroke="#A64B3C" stroke-width="2.5"/>
  <text x="500" y="214" font-size="11.5" font-weight="700" fill="#A64B3C" text-anchor="middle">WP（写指针）</text>

  <line x1="120" y1="300" x2="120" y2="310" stroke="#4A473F" stroke-width="1"/>
  <text x="120" y="326" font-size="10.5" fill="#4A473F" text-anchor="middle">ZSLBA（zone 起始 LBA）</text>
  <line x1="900" y1="300" x2="900" y2="310" stroke="#4A473F" stroke-width="1"/>
  <text x="900" y="326" font-size="10.5" fill="#4A473F" text-anchor="middle">ZCAP（zone capacity，可写容量）</text>
  <line x1="1160" y1="300" x2="1160" y2="310" stroke="#4A473F" stroke-width="1"/>
  <text x="1148" y="326" font-size="10.5" fill="#4A473F" text-anchor="middle">ZSZE（zone size，编址大小）</text>

  <text x="120" y="356" font-size="11.5" fill="#4A473F">不落在 WP 上的写 → Zone Invalid Write 错误；Zone Reset 把 WP 拉回 ZSLBA、整 zone 数据失效——"整块擦除"从 FTL 内部动作变成了接口上的显式命令。</text>

  <!-- B · 状态机 -->
  <text x="64" y="404" font-size="14" font-weight="700" fill="#2B2A26">B · Zone 状态机：谁在消耗 open / active 资源</text>

  <rect x="90" y="440" width="180" height="64" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.5"/>
  <text x="180" y="466" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">EMPTY</text>
  <text x="180" y="486" font-size="10.5" fill="#4A473F" text-anchor="middle">WP = ZSLBA，无数据</text>

  <rect x="400" y="440" width="220" height="64" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.8"/>
  <text x="510" y="462" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">OPEN（隐式 / 显式）</text>
  <text x="510" y="480" font-size="10.5" fill="#6B4E28" text-anchor="middle">正在接收写；占 open + active 资源</text>
  <text x="510" y="495" font-size="10.5" fill="#6B4E28" text-anchor="middle">直接写 → 隐式；Zone Open 命令 → 显式</text>

  <rect x="400" y="560" width="220" height="58" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="510" y="583" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">CLOSED</text>
  <text x="510" y="602" font-size="10.5" fill="#6B4E28" text-anchor="middle">暂停写入：释放 open、仍占 active</text>

  <rect x="820" y="440" width="200" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="920" y="466" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">FULL</text>
  <text x="920" y="486" font-size="10.5" fill="#24473F" text-anchor="middle">只读；不占任何资源</text>

  <rect x="1070" y="440" width="110" height="40" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1125" y="464" font-size="11" fill="#733428" text-anchor="middle">READ ONLY</text>
  <rect x="1070" y="492" width="110" height="40" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1125" y="516" font-size="11" fill="#733428" text-anchor="middle">OFFLINE</text>
  <text x="1125" y="552" font-size="9.5" fill="#733428" text-anchor="middle">介质异常态（设备判定）</text>

  <line x1="274" y1="472" x2="396" y2="472" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="335" y="462" font-size="10.5" fill="#4A473F" text-anchor="middle">写第一笔 / Open</text>
  <line x1="624" y1="472" x2="816" y2="472" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="720" y="462" font-size="10.5" fill="#4A473F" text-anchor="middle">写满 ZCAP 或 Zone Finish</text>
  <line x1="490" y1="508" x2="490" y2="556" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="478" y="536" font-size="10.5" fill="#4A473F" text-anchor="end">Zone Close</text>
  <line x1="530" y1="556" x2="530" y2="508" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="542" y="536" font-size="10.5" fill="#4A473F">继续写</text>
  <path d="M 920 508 L 920 650 L 180 650 L 180 508" fill="none" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#arrr)"/>
  <text x="550" y="642" font-size="11" font-weight="700" fill="#A64B3C" text-anchor="middle">Zone Reset：WP 归位、数据全部失效（对应 3.15 里"整段 TRIM"的角色）</text>

  <rect x="680" y="560" width="300" height="58" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="696" y="582" font-size="11" font-weight="700" fill="#4A473F">资源上限（Identify 上报）</text>
  <text x="696" y="600" font-size="10.5" fill="#4A473F">同时 OPEN ≤ MOR；OPEN + CLOSED ≤ MAR</text>
  <text x="696" y="613" font-size="9.5" fill="#6B675C">超限再 open 新 zone → Too Many Active/Open Zones</text>

  <!-- C · 责任划分 -->
  <text x="64" y="700" font-size="14" font-weight="700" fill="#2B2A26">C · 责任划分：谁来对付"异地更新 + 整块擦除"</text>

  <rect x="80" y="718" width="520" height="118" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="96" y="742" font-size="12" font-weight="700" fill="#733428">常规 SSD：设备端 FTL 全包</text>
  <text x="96" y="762" font-size="10.5" fill="#733428">主机随便写 → FTL 页级映射吸收随机写 → GC 事后搬运清算</text>
  <text x="96" y="780" font-size="10.5" fill="#733428">代价：WAF &gt; 1、留 OP（7%~28%）、GC 何时发作不可控</text>
  <text x="96" y="798" font-size="10.5" fill="#733428">映射表量级：页级 ≈ 容量的 1/1000（1 TB 盘 ≈ 1 GB DRAM）</text>
  <text x="96" y="822" font-size="10.5" font-weight="700" fill="#733428">尾延迟：p99 由 GC 决定，主机只能猜</text>

  <rect x="640" y="718" width="520" height="118" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="656" y="742" font-size="12" font-weight="700" fill="#24473F">ZNS：约束上移，主机负责放置与回收</text>
  <text x="656" y="762" font-size="10.5" fill="#24473F">主机按 zone 顺序写、自选数据分组、自定回收时机（Reset）</text>
  <text x="656" y="780" font-size="10.5" fill="#24473F">收益：设备 WAF ≈ 1、OP ≈ 0、映射粒度 zone 级（表小三个量级）</text>
  <text x="656" y="798" font-size="10.5" fill="#24473F">尾延迟可预测：没有设备侧 GC 在背后抢带宽</text>
  <text x="656" y="822" font-size="10.5" font-weight="700" fill="#24473F">代价：上层软件必须改造成追加写（f2fs / ZenFS / 自研）</text>

  <text x="80" y="872" font-size="11.5" fill="#4A473F">一句话判断：ZNS 不是"更快的 SSD"，而是一份新契约——设备放弃替你兜底随机写，主机用顺序写换回确定性；</text>
  <text x="80" y="892" font-size="11.5" fill="#4A473F">workload 本来就是追加型（LSM-tree、日志、对象存储）时收益最大，纯随机写场景等于把 FTL 重新在主机实现一遍。</text>
</svg>
