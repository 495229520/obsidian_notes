<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <title id="title">并发同步机制全景图</title>
  <desc id="desc">以并发同步为中心，分出互斥、协调、无锁、数据传递、跨进程、工程落地六大类机制及对应章节。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      .title { font: 700 27px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .hub   { font: 700 22px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .cat   { font: 700 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2b34; }
      .item  { font: 500 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #37474f; }
      .ref   { font: 600 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8a6d3b; }
    </style>
  </defs>

  <text class="title" x="500" y="44" text-anchor="middle">并发同步机制全景图</text>

  <!-- edges from hub -->
  <g stroke-width="2.4" fill="none">
    <path d="M420 330 C300 330 280 175 250 158" stroke="#42677c"/>
    <path d="M420 345 C300 360 280 460 250 478" stroke="#4f7b58"/>
    <path d="M460 388 C440 470 430 540 420 568" stroke="#b07d37"/>
    <path d="M580 388 C600 470 610 540 620 568" stroke="#7e57c2"/>
    <path d="M580 345 C700 360 720 460 750 478" stroke="#c0392b"/>
    <path d="M580 330 C700 330 720 175 750 158" stroke="#00838f"/>
  </g>

  <!-- hub -->
  <circle cx="500" cy="345" r="78" fill="#263238" stroke="#0f171b" stroke-width="3"/>
  <text class="hub" x="500" y="338" text-anchor="middle">并发同步</text>
  <text x="500" y="364" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="500" font-size="14" fill="#cfd8dc">共享可变状态</text>

  <!-- 1 互斥 (top-left) -->
  <rect x="70" y="108" width="290" height="100" rx="14" fill="#e8f1f7" stroke="#42677c" stroke-width="2.2"/>
  <text class="cat"  x="90" y="138">① 互斥访问</text>
  <text class="item" x="90" y="164">互斥锁 / 自旋锁 / 读写锁 / 递归锁</text>
  <text class="item" x="90" y="184">死锁的成因与排查</text>
  <text class="ref"  x="90" y="202">→ 17.3 锁机制、死锁与故障</text>

  <!-- 2 协调 (left) -->
  <rect x="60" y="430" width="290" height="100" rx="14" fill="#dfeede" stroke="#4f7b58" stroke-width="2.2"/>
  <text class="cat"  x="80" y="460">② 等待—通知 / 计数</text>
  <text class="item" x="80" y="486">条件变量、信号量</text>
  <text class="item" x="80" y="506">生产者—消费者协调</text>
  <text class="ref"  x="80" y="524">→ 17.4 条件同步</text>

  <!-- 3 无锁 (bottom-left) -->
  <rect x="270" y="560" width="290" height="86" rx="14" fill="#fdf2e3" stroke="#b07d37" stroke-width="2.2"/>
  <text class="cat"  x="290" y="588">③ 无锁更新</text>
  <text class="item" x="290" y="612">原子操作 / CAS / 乐观锁 vs 悲观锁</text>
  <text class="ref"  x="290" y="632">→ 17.5 无锁编程</text>

  <!-- 4 数据传递 (bottom-right) -->
  <rect x="580" y="560" width="290" height="86" rx="14" fill="#ede7f6" stroke="#7e57c2" stroke-width="2.2"/>
  <text class="cat"  x="600" y="588">④ 线程间传递数据</text>
  <text class="item" x="600" y="612">并发队列：有界队列 / 无锁队列</text>
  <text class="ref"  x="600" y="632">→ 17.6 并发队列</text>

  <!-- 5 跨进程 (right) -->
  <rect x="650" y="430" width="290" height="100" rx="14" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
  <text class="cat"  x="670" y="460">⑤ 跨进程协调</text>
  <text class="item" x="670" y="486">命名信号量、文件锁</text>
  <text class="item" x="670" y="506">共享内存 + 同步原语</text>
  <text class="ref"  x="670" y="524">→ 17.7 进程间同步</text>

  <!-- 6 工程 (top-right) -->
  <rect x="640" y="108" width="290" height="100" rx="14" fill="#e0f2f1" stroke="#00838f" stroke-width="2.2"/>
  <text class="cat"  x="660" y="138">⑥ 工程落地</text>
  <text class="item" x="660" y="164">Modern C++ 同步设施</text>
  <text class="item" x="660" y="184">实战并发模式（线程池等）</text>
  <text class="ref"  x="660" y="202">→ 17.8 Modern C++ 实战</text>
</svg>
