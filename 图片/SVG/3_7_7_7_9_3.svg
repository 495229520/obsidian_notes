<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title id="title">先填表，再转发：Overlay 与 Underlay 两次不同的查找</title>
<desc id="desc">示意 EVPN/VXLAN 组合；底部失败点分开观测。小实验以静态配置代替 EVPN。</desc>
<defs>
<marker id="arr-bs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-gs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/></marker>
<marker id="arr-rs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
<marker id="arr-ns" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8574"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="#F5F4ED" stroke="none" stroke-width="1.3"/>
<text x="48" y="46" font-size="23" fill="#2B2A26" font-weight="700" text-anchor="start">先填表，再转发：Overlay 与 Underlay 两次不同的查找</text>
<text x="48" y="78" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">示意 EVPN/VXLAN 组合；底部失败点分开观测。小实验以静态配置代替 EVPN。</text>
<rect x="48" y="112" width="1144" height="191" rx="8" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="139" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">控制平面：分发可达性与成员</text>
<rect x="80" y="166" width="220" height="75" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="190.0" y="197.0" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">EVPN Type 2</text>
<text x="190.0" y="220.0" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle">MAC / 可选 IP</text>
<rect x="332" y="166" width="220" height="75" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="442.0" y="197.0" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">EVPN Type 3</text>
<text x="442.0" y="220.0" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">BUM 成员</text>
<rect x="584" y="166" width="220" height="75" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="694.0" y="197.0" font-size="15" fill="#73531F" font-weight="700" text-anchor="middle">EVPN Type 5</text>
<text x="694.0" y="220.0" font-size="15" fill="#73531F" font-weight="400" text-anchor="middle">IP Prefix</text>
<rect x="900" y="166" width="260" height="75" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.3"/>
<text x="1030.0" y="197.0" font-size="15" fill="#4A473F" font-weight="700" text-anchor="middle">Underlay 路由</text>
<text x="1030.0" y="220.0" font-size="15" fill="#4A473F" font-weight="400" text-anchor="middle">VTEP IP 可达性</text>
<text x="80" y="279" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">RD：路由区分</text>
<text x="332" y="279" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">RT：导入/导出策略</text>
<text x="584" y="279" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">不是逐包 BGP 封装</text>
<rect x="48" y="327" width="1144" height="258" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="64" y="354" font-size="16" fill="#2B2A26" font-weight="700" text-anchor="start" class="section">数据平面：远端已知单播</text>
<rect x="70" y="411" width="180" height="84" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="160.0" y="446.5" font-size="15" fill="#24473F" font-weight="700" text-anchor="middle">接入分类</text>
<text x="160.0" y="469.5" font-size="15" fill="#24473F" font-weight="400" text-anchor="middle">得到 BD / VNI</text>
<rect x="294" y="411" width="264" height="84" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="426.0" y="446.5" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">Overlay FDB</text>
<text x="426.0" y="469.5" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle">MAC B → VTEP-B</text>
<rect x="602" y="411" width="256" height="84" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="730.0" y="446.5" font-size="15" fill="#2C4460" font-weight="700" text-anchor="middle">Underlay FIB</text>
<text x="730.0" y="469.5" font-size="15" fill="#2C4460" font-weight="400" text-anchor="middle">VTEP-B IP → 下一跳</text>
<rect x="902" y="411" width="268" height="84" rx="8" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.3"/>
<text x="1036.0" y="446.5" font-size="15" fill="#73531F" font-weight="700" text-anchor="middle">封装与发送</text>
<text x="1036.0" y="469.5" font-size="15" fill="#73531F" font-weight="400" text-anchor="middle">UDP 4789 / VNI</text>
<line x1="254" y1="453" x2="289" y2="453" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)"/>
<line x1="562" y1="453" x2="597" y2="453" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)"/>
<line x1="862" y1="453" x2="897" y2="453" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)"/>
<path d="M302,203 L316,203 L316,390 L426,390 L426,407" fill="none" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arr-bs)" stroke-dasharray="6 4"/>
<path d="M1030,243 L1030,314 L730,314 L730,407" fill="none" stroke="#8A8574" stroke-width="1.8" marker-end="url(#arr-ns)" stroke-dasharray="6 4"/>
<text x="82" y="537" font-size="14" fill="#733428" font-weight="400" text-anchor="start">入口映射错误</text>
<text x="310" y="537" font-size="14" fill="#733428" font-weight="400" text-anchor="start">服务 / 远端映射错误</text>
<text x="618" y="537" font-size="14" fill="#733428" font-weight="400" text-anchor="start">路由 / 邻居 / MTU</text>
<text x="918" y="537" font-size="14" fill="#733428" font-weight="400" text-anchor="start">端口 / ACL / 解封装</text>
<text x="48" y="626" font-size="15" fill="#2B2A26" font-weight="700" text-anchor="start">BGP Established ≠ 表项正确 ≠ 数据面可达；ICMP 可达也不证明 UDP 隧道与 VNI 正确。</text>
<text x="48" y="669" font-size="14" fill="#6B675C" font-weight="400" text-anchor="start">Type 3 服务 BUM，Type 5 服务租户前缀；它们不是本例 MAC 单播逐包查找的三个串行阶段。</text>
</svg>