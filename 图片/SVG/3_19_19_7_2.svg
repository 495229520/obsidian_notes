<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>mbuf 描述报文；descriptor 引用缓冲区</title><desc>mbuf元数据和数据区分离展示，data_off与data_len表示单段边界，多段packet只在链首表示总长度。</desc>
<defs>
<marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" rx="0" fill="rgb(245, 244, 237)" stroke="none" stroke-width="1.3"/>
<text x="48" y="51" font-size="22" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">mbuf 描述报文；descriptor 引用缓冲区</text>
<text x="48" y="81" font-size="13" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">packet、mbuf segment、数据区与硬件 descriptor：四种对象，不强行一一对应。</text>
<rect x="56" y="112" width="1128" height="246" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="72" y="137" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">A · 一个直接 mbuf segment：结构示意，不按固定字节数绘制</text>
<rect x="79" y="160" width="258" height="167" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="208.0" y="207.5" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">rte_mbuf 元数据</text>
<text x="208.0" y="227.5" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">buf_addr / data_off</text>
<text x="208.0" y="247.5" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">data_len / pkt_len</text>
<text x="208.0" y="267.5" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">nb_segs / next / pool</text>
<text x="208.0" y="287.5" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">ol_flags / refcnt</text>
<text x="384" y="166" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">backing buffer</text>
<rect x="387" y="202" width="140" height="65" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="457.0" y="240" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">Headroom</text>
<rect x="527" y="202" width="457" height="65" rx="0" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="755.5" y="240" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">有效 packet 数据</text>
<rect x="984" y="202" width="149" height="65" rx="0" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.3"/>
<text x="1058.5" y="240" font-size="13" fill="#4A473F" font-weight="700" text-anchor="middle" data-role="body">Tailroom</text>
<polyline points="337,205 365,205 365,192 387,192 387,201" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="387" y="185" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">buf_addr</text>
<text x="532" y="185" font-size="12" fill="#24473F" font-weight="400" text-anchor="start" data-role="body">buf_addr + data_off</text>
<polyline points="387,286 527,286" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<polyline points="387,278 387,292" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<polyline points="527,278 527,292" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<text x="457" y="307" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">data_off</text>
<polyline points="527,286 984,286" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<polyline points="984,278 984,292" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round"/>
<text x="756" y="307" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">data_len</text>
<text x="1058" y="307" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">剩余容量</text>
<text x="387" y="334" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" data-role="body">headroom + data_len + tailroom = buf_len</text>
<rect x="56" y="379" width="1128" height="237" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
<text x="72" y="404" font-size="14" fill="#2B2A26" font-weight="700" text-anchor="start" data-role="body">B · 一个 packet 可以跨多个 segment：示意长度合计 1,800 B</text>
<rect x="79" y="430" width="350" height="73" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="254.0" y="460.5" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">链首 mbuf：pkt_len = 1800</text>
<text x="254.0" y="480.5" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">nb_segs = 2 / data_len = 1000</text>
<rect x="524" y="430" width="350" height="73" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
<text x="699.0" y="460.5" font-size="13" fill="#2C4460" font-weight="700" text-anchor="middle" data-role="body">下一 mbuf：data_len = 800</text>
<text x="699.0" y="480.5" font-size="13" fill="#2C4460" font-weight="400" text-anchor="middle" data-role="body">next = nullptr</text>
<polyline points="432,467 520,467" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="478" y="450" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="middle" data-role="body">next</text>
<rect x="79" y="526" width="350" height="51" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="254.0" y="555.5" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">segment 0 数据：1,000 B</text>
<rect x="524" y="526" width="350" height="51" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
<text x="699.0" y="555.5" font-size="13" fill="#24473F" font-weight="700" text-anchor="middle" data-role="body">segment 1 数据：800 B</text>
<polyline points="254,505 254,522" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<polyline points="699,505 699,522" fill="none" stroke="#5A564B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="934" y="430" width="224" height="147" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
<text x="1046.0" y="477.5" font-size="12.5" fill="#4A3F68" font-weight="700" text-anchor="middle" data-role="body">NIC descriptors</text>
<text x="1046.0" y="497.5" font-size="12.5" fill="#4A3F68" font-weight="400" text-anchor="middle" data-role="body">地址 / 长度 / 控制</text>
<text x="1046.0" y="517.5" font-size="12.5" fill="#4A3F68" font-weight="400" text-anchor="middle" data-role="body">不是 payload 本体</text>
<text x="1046.0" y="537.5" font-size="12.5" fill="#4A3F68" font-weight="400" text-anchor="middle" data-role="body">不是 rte_mbuf 本体</text>
<text x="79" y="599" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start" data-role="body">读取完整 packet：不能只对链首指针连续读 pkt_len 字节。</text>
<text x="48" y="673" font-size="12" fill="#6B675C" font-weight="400" text-anchor="start" data-role="footer">clone / external buffer：元数据与数据区的生命周期还可能分离；共享引用不赋予并发写权限。</text>
</svg>