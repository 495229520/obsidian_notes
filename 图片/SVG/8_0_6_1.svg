<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>三种完成通知模型：Interrupt / Busy Polling / Hybrid</title>
  <desc>同一份设备完成状态，CPU 可通过中断、忙轮询或混合策略发现。上半为提交-完成闭环与 CQ 内存结构；下半为三条发现路径对照。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="22" font-weight="700" fill="#2B2A26">同一份完成状态：CPU 如何发现？三种通知模型</text>
  <text x="48" y="74" font-size="13" fill="#6B675C">研究的是完成路径第二步 · 设备已做完 → 软件何时开始处理 CQE · Interrupt 省 CPU · Polling 省发现延迟</text>

  <!-- ============ A: 提交-完成闭环 + CQ 结构 ============ -->
  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">A · 闭环：提交队列 / 完成队列在主机 DRAM；设备 DMA 写回，软件只读自家内存</text>

  <rect x="48" y="126" width="1144" height="248" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>

  <!-- 主机侧 -->
  <rect x="68" y="144" width="560" height="210" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="84" y="168" font-size="12" font-weight="700" fill="#3D5A80">主机 DRAM + CPU</text>

  <rect x="84" y="184" width="120" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="144" y="204" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">应用 / 驱动</text>
  <text x="144" y="220" font-size="10" fill="#3D5A80" text-anchor="middle">提交 + 收割</text>

  <!-- SQ ring -->
  <text x="224" y="180" font-size="11" font-weight="700" fill="#24473F">SQ（提交环）</text>
  <rect x="224" y="188" width="40" height="28" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.1"/>
  <rect x="264" y="188" width="40" height="28" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.1"/>
  <rect x="304" y="188" width="40" height="28" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.1"/>
  <rect x="344" y="188" width="40" height="28" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.1"/>
  <rect x="384" y="188" width="40" height="28" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.1"/>
  <text x="244" y="206" font-size="9" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SQE</text>
  <text x="284" y="206" font-size="9" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#24473F" text-anchor="middle">SQE</text>

  <!-- CQ ring with phase -->
  <text x="224" y="248" font-size="11" font-weight="700" fill="#733428">CQ（完成环 · phase bit）</text>
  <rect x="224" y="256" width="48" height="36" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="272" y="256" width="48" height="36" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="320" y="256" width="48" height="36" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <rect x="368" y="256" width="48" height="36" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.1"/>
  <rect x="416" y="256" width="48" height="36" fill="#FBFAF5" stroke="#C7C2B2" stroke-width="1.1"/>
  <text x="248" y="272" font-size="9" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#733428" text-anchor="middle">CQE</text>
  <text x="248" y="285" font-size="8.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#A64B3C" text-anchor="middle">P=1</text>
  <text x="296" y="272" font-size="9" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#733428" text-anchor="middle">CQE</text>
  <text x="296" y="285" font-size="8.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#A64B3C" text-anchor="middle">P=1</text>
  <text x="344" y="272" font-size="9" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#733428" text-anchor="middle">CQE</text>
  <text x="344" y="285" font-size="8.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#A64B3C" text-anchor="middle">P=1</text>
  <text x="392" y="278" font-size="8.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#9B968A" text-anchor="middle">P=0</text>
  <text x="440" y="278" font-size="8.5" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#9B968A" text-anchor="middle">P=0</text>
  <line x1="368" y1="298" x2="368" y2="308" stroke="#2C4460" stroke-width="1.4"/>
  <text x="368" y="322" font-size="9.5" font-weight="700" fill="#2C4460" text-anchor="middle">head（软件消费）</text>

  <text x="84" y="330" font-size="10.5" fill="#4A473F">发现完成 = 读下一槽 P 位 ≟ 期望相位 · 只 load 主机 DRAM，0 次 MMIO 读</text>

  <!-- 设备侧 -->
  <rect x="660" y="144" width="510" height="210" rx="8" fill="#F4E9E4" stroke="#D8D5C8" stroke-width="1"/>
  <text x="676" y="168" font-size="12" font-weight="700" fill="#A64B3C">NVMe / 设备</text>

  <rect x="684" y="188" width="200" height="56" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="784" y="212" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">① 执行读写</text>
  <text x="784" y="230" font-size="10.5" fill="#8A6A3A" text-anchor="middle">介质 + 控制器</text>

  <rect x="920" y="188" width="220" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1030" y="212" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">② DMA 写数据缓冲</text>
  <text x="1030" y="230" font-size="10.5" fill="#A64B3C" text-anchor="middle">再 DMA 写 CQE + 翻 P</text>

  <rect x="684" y="268" width="456" height="60" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="912" y="292" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">③ 完成状态已在主机 CQ 中</text>
  <text x="912" y="312" font-size="11" fill="#6B5B95" text-anchor="middle">问题：CPU 怎样知道？→ 中断 / 轮询 / 混合</text>

  <path d="M628,280 L656,280" fill="none" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrr)"/>
  <text x="620" y="268" font-size="10" fill="#A64B3C" text-anchor="end">DMA 写 CQ</text>

  <!-- ============ B: 三条路径 ============ -->
  <text x="48" y="408" font-size="13" font-weight="700" fill="#4A473F">B · 三条发现路径：同一 CQE，不同「叫醒」策略</text>

  <!-- Interrupt -->
  <rect x="48" y="422" width="370" height="360" rx="10" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.5"/>
  <rect x="48" y="422" width="370" height="36" rx="10" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <rect x="48" y="446" width="370" height="12" fill="#E3EAF4"/>
  <text x="68" y="446" font-size="13" font-weight="700" fill="#2C4460">Interrupt · 有事再叫我</text>

  <rect x="68" y="478" width="330" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="233" y="504" font-size="12" fill="#2C4460" text-anchor="middle">线程睡眠 / 去做别的事</text>

  <path d="M233,522 L233,540" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>

  <rect x="68" y="544" width="330" height="42" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="233" y="570" font-size="12" fill="#733428" text-anchor="middle">设备 MSI-X → 硬中断</text>

  <path d="M233,588 L233,606" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>

  <rect x="68" y="610" width="330" height="42" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="233" y="636" font-size="12" fill="#6B4E28" text-anchor="middle">内核确认 · 唤醒等待线程</text>

  <path d="M233,654 L233,672" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>

  <rect x="68" y="676" width="330" height="42" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="233" y="702" font-size="12" fill="#4A3F68" text-anchor="middle">调度器选中 · 可能 context switch</text>

  <text x="233" y="748" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">空闲 CPU 低 · 发现延迟含唤醒/调度</text>
  <text x="233" y="768" font-size="10.5" fill="#6B675C" text-anchor="middle">适合低占空比 / 多租户 / 通用服务器</text>

  <!-- Busy Polling -->
  <rect x="434" y="422" width="370" height="360" rx="10" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.5"/>
  <rect x="434" y="422" width="370" height="36" rx="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <rect x="434" y="446" width="370" height="12" fill="#DCE9E3"/>
  <text x="454" y="446" font-size="13" font-weight="700" fill="#24473F">Busy Polling · 我一直看着</text>

  <rect x="454" y="478" width="330" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="619" y="504" font-size="12" fill="#24473F" text-anchor="middle">线程不睡眠 · 循环 load CQ</text>

  <path d="M619,522 L619,540" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>

  <rect x="454" y="544" width="330" height="42" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="619" y="570" font-size="12" fill="#6B4E28" text-anchor="middle">设备 DMA 写 CQE（无中断）</text>

  <path d="M619,588 L619,606" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>

  <rect x="454" y="610" width="330" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="619" y="636" font-size="12" fill="#24473F" text-anchor="middle">下一次 poll 立刻看见 P 位翻转</text>

  <path d="M619,654 L619,672" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>

  <rect x="454" y="676" width="330" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="619" y="702" font-size="12" fill="#24473F" text-anchor="middle">同线程直接处理 · 无唤醒</text>

  <text x="619" y="748" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">发现延迟短且稳 · 烧专核 CPU</text>
  <text x="619" y="768" font-size="10.5" fill="#6B675C" text-anchor="middle">适合持续高负载 / 专用数据面</text>

  <!-- Hybrid -->
  <rect x="820" y="422" width="372" height="360" rx="10" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1.5"/>
  <rect x="820" y="422" width="372" height="36" rx="10" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <rect x="820" y="446" width="372" height="12" fill="#EFE7DA"/>
  <text x="840" y="446" font-size="13" font-weight="700" fill="#6B4E28">Hybrid · 先轮询后等待</text>

  <rect x="840" y="478" width="332" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1006" y="504" font-size="12" fill="#24473F" text-anchor="middle">短暂 busy poll 窗口</text>

  <path d="M1006,522 L1006,540" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>

  <rect x="840" y="544" width="150" height="56" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="915" y="568" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">完成已到</text>
  <text x="915" y="586" font-size="10" fill="#2F6B5E" text-anchor="middle">立即处理</text>

  <rect x="1022" y="544" width="150" height="56" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1097" y="568" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">窗口空转</text>
  <text x="1097" y="586" font-size="10" fill="#3D5A80" text-anchor="middle">→ 阻塞等中断</text>

  <path d="M1097,602 L1097,620" fill="none" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arrn)"/>

  <rect x="840" y="624" width="332" height="42" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1006" y="650" font-size="12" fill="#733428" text-anchor="middle">中断唤醒 · 再处理</text>

  <rect x="840" y="686" width="332" height="42" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="1006" y="712" font-size="11.5" fill="#6B4E28" text-anchor="middle">按到达间隔 / CPU 预算 / SLO 调窗口</text>

  <text x="1006" y="748" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">短等待≈轮询 · 长空闲≈中断</text>
  <text x="1006" y="768" font-size="10.5" fill="#6B675C" text-anchor="middle">负载变化大时的折中</text>

  <!-- 底栏 -->
  <rect x="48" y="800" width="1144" height="92" rx="8" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="830" font-size="12.5" font-weight="700" fill="#4A473F">判断准则</text>
  <text x="68" y="854" font-size="12" fill="#4A473F">核心矛盾：Interrupt 优先节省 CPU · Busy Polling 优先降低「设备完成 → 软件发现」延迟 · 不存在脱离负载与 SLO 的永远最优</text>
  <text x="68" y="876" font-size="11.5" fill="#6B675C">NAPI 是网络侧的中断→轮询混合类比 · NVMe CQ / SPDK poller / io_uring IOPOLL 各自有接口约束，不能混称 NAPI</text>
</svg>
