<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 880" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <title>Lustre 控制、元数据与数据服务架构</title>
  <desc>展示 Lustre 客户端、MGS/MGT、MDS/MDT、OSS/OST 的职责与 mount、元数据、数据三条路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1320" height="880" fill="rgb(245, 244, 237)"/>

  <text x="48" y="48" font-size="24" font-weight="700" fill="#444441" dominant-baseline="central">Lustre：控制、元数据、数据三类服务角色</text>
  <text x="48" y="82" font-size="13" fill="#5F5E5A" dominant-baseline="central">MGS 管配置；MDS/MDT 管命名空间与布局；客户端并行直连 OSS/OST</text>

  <g>
    <rect x="500" y="130" width="320" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="660" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#0C447C" dominant-baseline="central">Lustre Client · 计算节点</text>
    <text x="660" y="188" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">VFS / Page Cache / LOV · LMV / LNet</text>
  </g>

  <g>
    <rect x="70" y="330" width="260" height="94" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="200" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#633806" dominant-baseline="central">MGS</text>
    <text x="200" y="386" text-anchor="middle" font-size="12" fill="#633806" dominant-baseline="central">Management Server</text>
    <text x="200" y="408" text-anchor="middle" font-size="11" fill="#633806" dominant-baseline="central">挂载发现 · 配置日志</text>
  </g>

  <g>
    <rect x="530" y="330" width="260" height="94" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="660" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#3C3489" dominant-baseline="central">MDS</text>
    <text x="660" y="386" text-anchor="middle" font-size="12" fill="#3C3489" dominant-baseline="central">Metadata Server</text>
    <text x="660" y="408" text-anchor="middle" font-size="11" fill="#3C3489" dominant-baseline="central">命名空间 · 布局 · 元数据锁</text>
  </g>

  <g>
    <rect x="990" y="330" width="260" height="94" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="1120" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#085041" dominant-baseline="central">OSS × N</text>
    <text x="1120" y="386" text-anchor="middle" font-size="12" fill="#085041" dominant-baseline="central">Object Storage Server</text>
    <text x="1120" y="408" text-anchor="middle" font-size="11" fill="#085041" dominant-baseline="central">对象 I/O · 数据 extent 锁</text>
  </g>

  <g>
    <rect x="70" y="590" width="260" height="86" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="200" y="620" text-anchor="middle" font-size="16" font-weight="700" fill="#444441" dominant-baseline="central">MGT</text>
    <text x="200" y="650" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">Management Target · 配置持久化</text>
  </g>

  <g>
    <rect x="530" y="590" width="260" height="86" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="660" y="620" text-anchor="middle" font-size="16" font-weight="700" fill="#444441" dominant-baseline="central">MDT × M</text>
    <text x="660" y="650" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">Metadata Target · inode / dir / layout</text>
  </g>

  <g>
    <rect x="990" y="590" width="260" height="86" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="1120" y="620" text-anchor="middle" font-size="16" font-weight="700" fill="#444441" dominant-baseline="central">OST × K</text>
    <text x="1120" y="650" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">Object Storage Target · 文件对象</text>
  </g>

  <path d="M575 214 C470 258, 300 260, 220 330" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="270" font-size="11" fill="#633806" dominant-baseline="central">① mount：读取配置与服务地址</text>

  <path d="M660 214 L660 330" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="735" y="273" font-size="11" fill="#3C3489" dominant-baseline="central">② open / create / stat：取布局</text>

  <path d="M745 214 C870 250, 1030 260, 1100 330" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="935" y="258" font-size="11" fill="#0C447C" dominant-baseline="central">③ read / write：按条带并行直达</text>

  <path d="M200 424 L200 590" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M660 424 L660 590" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1120 424 L1120 590" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M790 377 L990 377" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="890" y="350" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">创建对象 · 记录 FID / 布局</text>

  <text x="48" y="738" font-size="13" font-weight="700" fill="#444441" dominant-baseline="central">关键边界</text>
  <text x="48" y="774" font-size="12" fill="#5F5E5A" dominant-baseline="central">MGS 不是每次 I/O 的必经层；MDS 返回布局后，批量数据不再绕经 MDS。</text>
  <text x="48" y="806" font-size="12" fill="#5F5E5A" dominant-baseline="central">Server 是服务节点/进程；Target 是持久化存储目标。</text>
  <text x="48" y="832" font-size="12" fill="#5F5E5A" dominant-baseline="central">二者职责不同，不要混同。</text>
</svg>
