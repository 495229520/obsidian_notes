<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1180" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/>
    </marker>
  </defs>

  <title>逐跳转发与 ARP：IP 决定送到哪，MAC 决定这一跳交给谁</title>
  <desc>上半部分是一个数据包从发送端主机经交换机、路由器到达接收端主机的路径，交换机只解封装到数据链路层，路由器只到网络层，只有两端主机走完全部五层。中间部分用一个两网段的具体拓扑，展示 ARP 如何在每一跳把「下一跳 IP」解析成「下一跳 MAC」：目的 IP 全程是 B 不变，目的 MAC 每跳重写，TTL 每过一个路由器减一。下方对照三类设备各自看哪个头、查什么表、改什么字段。</desc>

  <rect x="0" y="0" width="1240" height="1180" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">逐跳转发：中间设备只往上爬到它需要的那一层</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">走完五层的只有两端主机；交换机停在二层、路由器停在三层，这是它们转发快的原因</text>

  <!-- ================= Panel A ================= -->
  <rect x="48" y="104" width="1144" height="344" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 一个包的实际路径</text>

  <!-- 设备名 -->
  <rect x="240" y="140" width="160" height="36" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="320" y="157" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">发送端主机</text>
  <text x="320" y="171" font-size="10.5" fill="#2C4460" text-anchor="middle">走完五层</text>

  <rect x="480" y="140" width="160" height="36" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="560" y="157" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">交换机</text>
  <text x="560" y="171" font-size="10.5" fill="#6B4E28" text-anchor="middle">只上到二层</text>

  <rect x="720" y="140" width="160" height="36" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="800" y="157" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">路由器</text>
  <text x="800" y="171" font-size="10.5" fill="#4A3F68" text-anchor="middle">只上到三层</text>

  <rect x="960" y="140" width="160" height="36" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="1040" y="157" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">接收端主机</text>
  <text x="1040" y="171" font-size="10.5" fill="#2C4460" text-anchor="middle">走完五层</text>

  <!-- 层泳道 -->
  <rect x="76" y="186" width="1088" height="44" rx="6" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="92" y="212" font-size="11.5" font-weight="700" fill="#3D5A80">5 应用层</text>
  <rect x="76" y="236" width="1088" height="44" rx="6" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1"/>
  <text x="92" y="262" font-size="11.5" font-weight="700" fill="#2F6B5E">4 传输层</text>
  <rect x="76" y="286" width="1088" height="44" rx="6" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="92" y="312" font-size="11.5" font-weight="700" fill="#6B5B95">3 网络层</text>
  <rect x="76" y="336" width="1088" height="44" rx="6" fill="#F3EDE2" stroke="#D8D5C8" stroke-width="1"/>
  <text x="92" y="362" font-size="11.5" font-weight="700" fill="#8A6A3A">2 链路层</text>
  <rect x="76" y="386" width="1088" height="44" rx="6" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="92" y="412" font-size="11.5" font-weight="700" fill="#4A473F">1 物理层</text>

  <!-- 设备覆盖范围 -->
  <rect x="240" y="186" width="160" height="244" rx="7" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="480" y="336" width="160" height="94" rx="7" fill="none" stroke="#8A6A3A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="720" y="286" width="160" height="144" rx="7" fill="none" stroke="#6B5B95" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="960" y="186" width="160" height="244" rx="7" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 数据路径 -->
  <path d="M320,208 V408 H540 V358 H580 V408 H780 V308 H820 V408 H1040 V208"
        fill="none" stroke="#A64B3C" stroke-width="2.2" marker-end="url(#arrRed)"/>

  <circle cx="320" cy="208" r="4" fill="#A64B3C"/>
  <circle cx="560" cy="358" r="4" fill="#A64B3C"/>
  <circle cx="800" cy="308" r="4" fill="#A64B3C"/>
  <circle cx="1040" cy="208" r="4" fill="#A64B3C"/>

  <text x="336" y="230" font-size="11" font-weight="700" fill="#733428">① 逐层加头</text>
  <text x="560" y="348" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">② 查 MAC 表</text>
  <text x="800" y="298" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">③ 查路由表</text>
  <text x="1024" y="230" font-size="11" font-weight="700" fill="#733428" text-anchor="end">④ 逐层剥头</text>

  <text x="440" y="404" font-size="10.5" fill="#6B675C" text-anchor="middle">同一网段</text>
  <text x="680" y="404" font-size="10.5" fill="#6B675C" text-anchor="middle">上行链路</text>
  <text x="920" y="404" font-size="10.5" fill="#6B675C" text-anchor="middle">跨网段</text>

  <!-- ================= Panel B：ARP ================= -->
  <rect x="48" y="464" width="1144" height="400" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="490" font-size="15" font-weight="700" fill="#4A473F">B · ARP：把「送到哪」和「这一跳交给谁」接起来</text>
  <text x="72" y="511" font-size="11.5" fill="#6B675C">IP 决定送到哪（端到端不变，路由表定方向）；MAC 决定这一跳交给谁（逐跳重写，交换机按它转发）；ARP 在每一跳把两者接起来。</text>

  <!-- 拓扑 -->
  <line x1="232" y1="556" x2="296" y2="556" stroke="#9B968A" stroke-width="1.6"/>
  <line x1="416" y1="556" x2="480" y2="556" stroke="#9B968A" stroke-width="1.6"/>
  <line x1="720" y1="556" x2="1008" y2="556" stroke="#9B968A" stroke-width="1.6"/>

  <rect x="76" y="528" width="156" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="154" y="547" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">主机 A</text>
  <text x="154" y="562" font-size="9.5" fill="#2C4460" text-anchor="middle">192.168.1.10</text>
  <text x="154" y="576" font-size="9.5" fill="#2C4460" text-anchor="middle">MAC-A</text>

  <rect x="296" y="528" width="120" height="56" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="356" y="550" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">交换机</text>
  <text x="356" y="568" font-size="9.5" fill="#6B4E28" text-anchor="middle">只看目的 MAC</text>

  <rect x="480" y="528" width="240" height="56" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.4"/>
  <line x1="600" y1="528" x2="600" y2="584" stroke="#6B5B95" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="600" y="545" font-size="12" font-weight="700" fill="#4A3F68" text-anchor="middle">路由器 R</text>
  <text x="540" y="562" font-size="9.5" fill="#4A3F68" text-anchor="middle">左口 192.168.1.1</text>
  <text x="540" y="576" font-size="9.5" fill="#4A3F68" text-anchor="middle">MAC-R1</text>
  <text x="660" y="562" font-size="9.5" fill="#4A3F68" text-anchor="middle">右口 10.0.0.1</text>
  <text x="660" y="576" font-size="9.5" fill="#4A3F68" text-anchor="middle">MAC-R2</text>

  <rect x="1008" y="528" width="156" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="1086" y="547" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">主机 B</text>
  <text x="1086" y="562" font-size="9.5" fill="#2C4460" text-anchor="middle">10.0.0.20</text>
  <text x="1086" y="576" font-size="9.5" fill="#2C4460" text-anchor="middle">MAC-B</text>

  <!-- 网段标注 -->
  <path d="M76,597 V592 H600 V597" fill="none" stroke="#9B968A" stroke-width="1"/>
  <path d="M600,597 V592 H1164 V597" fill="none" stroke="#9B968A" stroke-width="1"/>
  <text x="338" y="607" font-size="10" fill="#6B675C" text-anchor="middle">网段 1 · 192.168.1.0/24</text>
  <text x="882" y="607" font-size="10" fill="#6B675C" text-anchor="middle">网段 2 · 10.0.0.0/24</text>

  <!-- ARP 解析气泡 -->
  <rect x="76" y="614" width="512" height="54" rx="7" fill="#E6EFEA" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="92" y="634" font-size="10.5" font-weight="700" fill="#22564A">ARP 1 · A 查路由表：10.0.0.20 不在本网段，下一跳是 192.168.1.1</text>
  <text x="92" y="653" font-size="10" fill="#22564A">ARP 问 who has 192.168.1.1 → MAC-R1。下一跳 IP 只拿来问 MAC，从不写进 IP 头</text>

  <rect x="652" y="614" width="512" height="54" rx="7" fill="#E6EFEA" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="668" y="634" font-size="10.5" font-weight="700" fill="#22564A">ARP 2 · R 查路由表：10.0.0.20 与右口直连，下一跳就是 B 自己</text>
  <text x="668" y="653" font-size="10" fill="#22564A">ARP 问 who has 10.0.0.20 → MAC-B。这是最后一跳，目的 MAC 终于是 B</text>

  <!-- 逐跳字段对照表 -->
  <rect x="76" y="682" width="1088" height="26" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="708" width="1088" height="26" fill="#EFF5F1" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="734" width="1088" height="26" fill="#EFF5F1" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="760" width="1088" height="26" fill="#F7EFE6" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="786" width="1088" height="26" fill="#F7EFE6" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="812" width="1088" height="26" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <line x1="206" y1="682" x2="206" y2="838" stroke="#9B968A" stroke-width="1"/>
  <line x1="546" y1="682" x2="546" y2="838" stroke="#9B968A" stroke-width="1"/>
  <line x1="786" y1="682" x2="786" y2="838" stroke="#9B968A" stroke-width="1"/>

  <text x="141" y="700" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">字段</text>
  <text x="376" y="700" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">① A 发出（第一跳）</text>
  <text x="666" y="700" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">② 交换机转发</text>
  <text x="975" y="700" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">③ R 发出（第二跳）</text>

  <text x="141" y="726" font-size="11" font-weight="700" fill="#22564A" text-anchor="middle">目的 IP</text>
  <text x="376" y="726" font-size="11" fill="#4A473F" text-anchor="middle">10.0.0.20（B）</text>
  <text x="666" y="726" font-size="11" fill="#6B675C" text-anchor="middle">看不到，也不改</text>
  <text x="975" y="726" font-size="11" fill="#4A473F" text-anchor="middle">10.0.0.20（B）</text>

  <text x="141" y="752" font-size="11" font-weight="700" fill="#22564A" text-anchor="middle">源 IP</text>
  <text x="376" y="752" font-size="11" fill="#4A473F" text-anchor="middle">192.168.1.10（A）</text>
  <text x="666" y="752" font-size="11" fill="#6B675C" text-anchor="middle">看不到，也不改</text>
  <text x="975" y="752" font-size="11" fill="#4A473F" text-anchor="middle">192.168.1.10（A）</text>

  <text x="141" y="778" font-size="11" font-weight="700" fill="#8A5A2A" text-anchor="middle">目的 MAC</text>
  <text x="376" y="778" font-size="11" fill="#4A473F" text-anchor="middle">MAC-R1（网关，ARP 1 问来）</text>
  <text x="666" y="778" font-size="11" fill="#6B675C" text-anchor="middle">按它查表选口，不改</text>
  <text x="975" y="778" font-size="11" fill="#4A473F" text-anchor="middle">MAC-B（B 本人，ARP 2 问来）</text>

  <text x="141" y="804" font-size="11" font-weight="700" fill="#8A5A2A" text-anchor="middle">源 MAC</text>
  <text x="376" y="804" font-size="11" fill="#4A473F" text-anchor="middle">MAC-A（A）</text>
  <text x="666" y="804" font-size="11" fill="#6B675C" text-anchor="middle">不改</text>
  <text x="975" y="804" font-size="11" fill="#4A473F" text-anchor="middle">MAC-R2（R 的右口）</text>

  <text x="141" y="830" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">TTL</text>
  <text x="376" y="830" font-size="11" fill="#4A473F" text-anchor="middle">64</text>
  <text x="666" y="830" font-size="11" fill="#6B675C" text-anchor="middle">不改</text>
  <text x="975" y="830" font-size="11" fill="#4A473F" text-anchor="middle">63（过路由器减 1）</text>

  <text x="76" y="854" font-size="10.5" fill="#4A473F">绿色两行全程不变，橙色两行每跳重写。包就是这样「目的 IP 一路不变、MAC 一层一层换」地往前递进，直到最后一跳交给 B。MAC 此处用简写表示。</text>

  <!-- ================= Panel C ================= -->
  <rect x="48" y="880" width="1144" height="186" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="72" y="906" font-size="15" font-weight="700" fill="#4A473F">C · 三类设备各自看什么、改什么</text>

  <rect x="76" y="922" width="754" height="26" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="948" width="754" height="28" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="976" width="754" height="28" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <rect x="76" y="1004" width="754" height="28" fill="#FBFBF6" stroke="#9B968A" stroke-width="1"/>
  <line x1="196" y1="922" x2="196" y2="1032" stroke="#9B968A" stroke-width="1"/>
  <line x1="386" y1="922" x2="386" y2="1032" stroke="#9B968A" stroke-width="1"/>
  <line x1="586" y1="922" x2="586" y2="1032" stroke="#9B968A" stroke-width="1"/>

  <text x="136" y="940" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">设备</text>
  <text x="291" y="940" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">解封装到哪个头</text>
  <text x="486" y="940" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">依据什么表转发</text>
  <text x="708" y="940" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">对这个包做了什么</text>

  <text x="136" y="967" font-size="11" fill="#4A473F" text-anchor="middle">集线器</text>
  <text x="291" y="967" font-size="11" fill="#4A473F" text-anchor="middle">不解封装</text>
  <text x="486" y="967" font-size="11" fill="#4A473F" text-anchor="middle">没有表</text>
  <text x="708" y="967" font-size="11" fill="#4A473F" text-anchor="middle">原样复制到其余所有口</text>

  <text x="136" y="995" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">交换机</text>
  <text x="291" y="995" font-size="11" fill="#4A473F" text-anchor="middle">以太网帧头</text>
  <text x="486" y="995" font-size="11" fill="#4A473F" text-anchor="middle">MAC 地址表</text>
  <text x="708" y="995" font-size="11" fill="#4A473F" text-anchor="middle">只挑一个口发出，不动内容</text>

  <text x="136" y="1023" font-size="11" font-weight="700" fill="#4A3F68" text-anchor="middle">路由器</text>
  <text x="291" y="1023" font-size="11" fill="#4A473F" text-anchor="middle">帧头 + IP 头</text>
  <text x="486" y="1023" font-size="11" fill="#4A473F" text-anchor="middle">路由表（最长前缀）</text>
  <text x="708" y="1023" font-size="11" fill="#4A473F" text-anchor="middle">重写帧头，TTL 减 1，重算校验</text>

  <rect x="858" y="922" width="306" height="110" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="880" y="946" font-size="12" font-weight="700" fill="#733428">全程不变 vs 每跳重写</text>
  <text x="880" y="970" font-size="11.5" fill="#733428">源/目的 IP：端到端不变</text>
  <text x="880" y="992" font-size="11.5" fill="#733428">源/目的 MAC：每跳都换（ARP 问出来）</text>
  <text x="880" y="1014" font-size="11.5" fill="#733428">TTL：每过一个路由器减 1</text>

  <text x="48" y="1102" font-size="11.5" fill="#4A473F">「MAC 逐跳变、IP 端到端不变」是理解 traceroute 的前提：它靠把 TTL 从 1 开始逐次加一，逼每一跳路由器回一个 ICMP 超时报文，从而把路径打印出来。</text>
  <text x="48" y="1124" font-size="11.5" fill="#4A473F">同理，抓包时若只在本机看到目的 MAC 是网关而目的 IP 是公网地址，说明包要出网段，这不是配置错误。</text>
  <text x="48" y="1146" font-size="11.5" fill="#4A473F">若 A、B 之间是 TCP 连接，发数据前还有三次握手；但握手报文走的也是上面这条路径——握手是 IP 之上的机制，ARP、路由与帧转发是每一跳底下都在发生的事。</text>
</svg>
