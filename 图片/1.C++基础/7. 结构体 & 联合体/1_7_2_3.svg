<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
  <title id="title">正确的 sizeof(U) 等于 8 的数组布局</title>
  <desc id="desc">arr0 从地址 1000 开始，buf 占 5 字节后追加 3 字节尾部 padding，使 arr1 从 1008 开始并满足 4 字节对齐。</desc>
  <rect width="1120" height="380" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4f7f5c" stroke-width="1.6"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
    .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24313f; }
    .addr { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #5f6b76; }
    .cellText { font: 700 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #26323d; }
    .note { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5f6b76; }
    .ok { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #3f7a55; }
    .buf { fill: #e8f3ff; stroke: #4f86c6; stroke-width: 1.5; }
    .pad { fill: #f2e7d5; stroke: #c58a45; stroke-width: 1.5; }
    .arr1 { fill: #e8f7ee; stroke: #4f9b69; stroke-width: 1.5; }
    .grid { stroke: #cfd6d9; stroke-width: 1; }
    .alignLine { stroke: #4f7f5c; stroke-width: 2; stroke-dasharray: 5 5; }
  </style>

  <text x="60" y="44" class="title">正确情况：sizeof(U) = 8</text>
  <text x="60" y="72" class="note">编译器把 5 字节向上补齐到 4 的倍数，尾部 padding 保证数组中每个 U 都满足整体对齐。</text>

  <g transform="translate(60 120)">
    <text x="0" y="25" class="label">地址</text>
    <g transform="translate(120 0)">
      <text x="30" y="25" text-anchor="middle" class="addr">1000</text>
      <text x="90" y="25" text-anchor="middle" class="addr">1001</text>
      <text x="150" y="25" text-anchor="middle" class="addr">1002</text>
      <text x="210" y="25" text-anchor="middle" class="addr">1003</text>
      <text x="270" y="25" text-anchor="middle" class="addr">1004</text>
      <text x="330" y="25" text-anchor="middle" class="addr">1005</text>
      <text x="390" y="25" text-anchor="middle" class="addr">1006</text>
      <text x="450" y="25" text-anchor="middle" class="addr">1007</text>
      <text x="510" y="25" text-anchor="middle" class="addr">1008</text>
      <text x="570" y="25" text-anchor="middle" class="addr">1009</text>
      <text x="630" y="25" text-anchor="middle" class="addr">1010</text>
      <text x="690" y="25" text-anchor="middle" class="addr">1011</text>

      <rect x="0" y="48" width="300" height="64" class="buf"/>
      <rect x="300" y="48" width="180" height="64" class="pad"/>
      <rect x="480" y="48" width="240" height="64" class="arr1"/>
      <line x1="60" y1="48" x2="60" y2="112" class="grid"/>
      <line x1="120" y1="48" x2="120" y2="112" class="grid"/>
      <line x1="180" y1="48" x2="180" y2="112" class="grid"/>
      <line x1="240" y1="48" x2="240" y2="112" class="grid"/>
      <line x1="300" y1="48" x2="300" y2="112" class="grid"/>
      <line x1="360" y1="48" x2="360" y2="112" class="grid"/>
      <line x1="420" y1="48" x2="420" y2="112" class="grid"/>
      <line x1="480" y1="40" x2="480" y2="245" class="alignLine"/>
      <line x1="540" y1="48" x2="540" y2="112" class="grid"/>
      <line x1="600" y1="48" x2="600" y2="112" class="grid"/>
      <line x1="660" y1="48" x2="660" y2="112" class="grid"/>
      <text x="150" y="86" text-anchor="middle" class="cellText">arr0 的 buf[5]</text>
      <text x="390" y="86" text-anchor="middle" class="cellText">pad pad pad</text>
      <text x="600" y="86" text-anchor="middle" class="cellText">arr1 ...</text>

      <path d="M 0 198 L 0 122" fill="none" stroke="#4f7f5c" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M 480 198 L 480 122" fill="none" stroke="#4f7f5c" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="12" y="184" class="ok">arr[0] 起始地址 1000</text>
      <text x="12" y="210" class="ok">满足 4 字节对齐</text>
      <text x="492" y="184" class="ok">arr[1] 起始地址 1008</text>
      <text x="492" y="210" class="ok">也满足 4 字节对齐</text>
    </g>
  </g>
</svg>
