<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">栈结构图</title>
  <desc id="desc">展示 x86 函数栈帧中 esp 指向小地址栈顶，ebp 指向较大地址的栈帧底部，栈向低地址增长。</desc>
  <rect x="0" y="0" width="720" height="520" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2f5f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#9a6722" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#52616f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="Microsoft YaHei, SimHei, sans-serif" fill="#24313d">
    <text x="360" y="44" text-anchor="middle" font-size="26" font-weight="700">栈结构图</text>
    <text x="360" y="72" text-anchor="middle" font-size="15" fill="#62717f">当前函数栈帧：esp 位于低地址栈顶，ebp 位于较高地址的栈帧底部</text>

    <g transform="translate(235 105)">
      <text x="125" y="-16" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5f8f">栈顶</text>

      <rect x="0" y="0" width="250" height="310" rx="10" fill="#fffdf7" stroke="#405261" stroke-width="2"/>
      <rect x="1" y="1" width="248" height="198" rx="9" fill="#e7f0fb" stroke="#5d89b3" stroke-width="1.5"/>
      <rect x="1" y="199" width="248" height="110" rx="9" fill="#fff2d8" stroke="#b68436" stroke-width="1.5"/>
      <line x1="0" y1="199" x2="250" y2="199" stroke="#405261" stroke-width="2"/>

      <text x="125" y="78" text-anchor="middle" font-size="24" font-weight="700" fill="#244c73">局部变量</text>
      <text x="125" y="110" text-anchor="middle" font-size="15" fill="#49677f">临时对象、局部数组等</text>
      <text x="125" y="246" text-anchor="middle" font-size="22" font-weight="700" fill="#76501d">栈帧底部</text>
      <text x="125" y="276" text-anchor="middle" font-size="15" fill="#70572c">保存的 ebp / 返回地址</text>

      <text x="125" y="346" text-anchor="middle" font-size="18" font-weight="700" fill="#6a4a21">栈底</text>
    </g>

    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M 138 125 L 232 125" fill="none" stroke="#2f5f8f" stroke-width="2" marker-end="url(#arrow-blue)"/>
      <text x="88" y="121" font-size="17" font-weight="700" fill="#2f5f8f">esp</text>
      <text x="84" y="145" font-size="14" fill="#54718b">小地址</text>

      <path d="M 582 304 L 488 304" fill="none" stroke="#9a6722" stroke-width="2" marker-end="url(#arrow-gold)"/>
      <text x="596" y="300" font-size="17" font-weight="700" fill="#9a6722">ebp</text>
      <text x="596" y="324" font-size="14" fill="#77592d">大地址</text>

      <path d="M 615 394 L 615 132" fill="none" stroke="#52616f" stroke-width="2" marker-end="url(#arrow-gray)"/>
      <text x="638" y="166" font-size="15" fill="#52616f">地址变小</text>
      <text x="638" y="252" font-size="17" font-weight="700" fill="#405261">栈增长方向</text>
      <text x="638" y="384" font-size="15" fill="#52616f">地址变大</text>
    </g>

    <g fill="#62717f" font-size="14">
      <text x="235" y="454">压栈时 esp 减小，栈向低地址扩展；出栈时 esp 增大。</text>
    </g>
  </g>
</svg>
