<line x1="342" y1="361" x2="1126" y2="361" stroke="#e2e0d7" stroke-width="0.5"/>
<line x1="342" y1="403" x2="1126" y2="403" stroke="#e2e0d7" stroke-width="0.5"/>
<line x1="342" y1="445" x2="1126" y2="445" stroke="#e2e0d7" stroke-width="0.5"/>
<line x1="376" y1="130" x2="376" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="376" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 376 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">0 · 调用前</text>
<line x1="448" y1="130" x2="448" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="448" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 448 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">1 · push 20</text>
<line x1="520" y1="130" x2="520" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="520" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 520 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">2 · push 10</text>
<line x1="592" y1="130" x2="592" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="592" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 592 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">3 · call sum</text>
<line x1="664" y1="130" x2="664" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="664" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 664 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">4 · push ebp</text>
<line x1="736" y1="130" x2="736" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="736" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 736 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">5 · mov ebp,esp</text>
<line x1="808" y1="130" x2="808" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="808" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 808 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">6 · sub esp,10h</text>
<line x1="880" y1="130" x2="880" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="880" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 880 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">7 · mov esp,ebp</text>
<line x1="952" y1="130" x2="952" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="952" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 952 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">8 · pop ebp</text>
<line x1="1024" y1="130" x2="1024" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="1024" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 1024 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">9 · ret</text>
<line x1="1096" y1="130" x2="1096" y2="462" stroke="#e2e0d7" stroke-width="0.5"/>
<text x="1096" y="70" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 1096 70)" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#444441">10 · add esp,8</text>
