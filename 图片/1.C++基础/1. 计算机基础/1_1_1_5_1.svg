<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="566" viewBox="0 0 1240 566">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<title>函数调用栈变化图</title>
<desc>main 调用 sum(10,20)，逐帧展示 push→call→序言→尾声→ret 中 esp 与 ebp 的移动轨迹</desc>
<rect x="0" y="0" width="1240" height="566" fill="rgb(245, 244, 237)"/>
<text x="24" y="26" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#444441">函数调用栈变化图 · main 调用 sum(10, 20)</text>
<text x="24" y="46" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">左：完整栈帧布局（上=高地址，下=低地址）　右：11 步中 esp / ebp 位置轨迹</text>
<!-- 左侧栈帧布局 -->
<text x="86" y="151" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">0x1020</text>
<rect x="95" y="134" width="205" height="34" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="197.5" y="151" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">main 帧（保存的旧 ebp 起点）</text>
<text x="86" y="193" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">0x1000</text>
<rect x="95" y="176" width="205" height="34" rx="8" fill="none" stroke="#c9c7bf" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="197.5" y="193" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#8a887f">（main 栈顶起点）</text>
<text x="86" y="235" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">0x0FFC</text>
<rect x="95" y="218" width="205" height="34" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="197.5" y="235" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">b = 20    ebp+12</text>
<text x="86" y="277" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">0x0FF8</text>
<rect x="95" y="260" width="205" height="34" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="197.5" y="277" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">a = 10    ebp+8</text>
<text x="86" y="319" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">0x0FF4</text>
<rect x="95" y="302" width="205" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="197.5" y="319" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">返回地址    ebp+4</text>
<text x="86" y="361" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">0x0FF0</text>
<rect x="95" y="344" width="205" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="197.5" y="361" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">saved ebp    ebp+0</text>
<text x="86" y="403" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">0x0FEC</text>
<rect x="95" y="386" width="205" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="197.5" y="403" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">c 局部变量    ebp-4</text>
<text x="86" y="445" text-anchor="end" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">0x0FE0</text>
<rect x="95" y="428" width="205" height="34" rx="8" fill="none" stroke="#c9c7bf" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="197.5" y="445" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#8a887f">（sub 后的新栈顶）</text>
<!-- 阶段分组条 -->
<rect x="342" y="52" width="68" height="18" rx="6" fill="#F1EFE8" stroke="#c9c7bf" stroke-width="0.5"/>
<text x="376" y="61" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#5F5E5A">调用前</text>
<rect x="422" y="52" width="228" height="18" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="536" y="61" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#633806">main：压参 + call</text>
<rect x="662" y="52" width="228" height="18" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="776" y="61" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#0C447C">sum 序言（建帧）</text>
<rect x="902" y="52" width="228" height="18" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="1016" y="61" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#085041">sum 尾声（拆帧 + ret）</text>
<rect x="1142" y="52" width="68" height="18" rx="6" fill="#F1EFE8" stroke="#c9c7bf" stroke-width="0.5"/>
<text x="1176" y="61" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#5F5E5A">main 清栈</text>
<!-- 步骤标签（横排：上=步骤号，下=指令） -->
<text x="376" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">0</text>
<text x="376" y="104" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#444441">调用前</text>
<text x="456" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">1</text>
<text x="456" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="500" fill="#444441">push 20</text>
<text x="536" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">2</text>
<text x="536" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="500" fill="#444441">push 10</text>
<text x="616" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">3</text>
<text x="616" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="500" fill="#444441">call sum</text>
<text x="696" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">4</text>
<text x="696" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="500" fill="#444441">push ebp</text>
<text x="776" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">5</text>
<text x="776" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="500" fill="#444441">mov ebp,esp</text>
<text x="856" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">6</text>
<text x="856" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="500" fill="#444441">sub esp,10h</text>
<text x="936" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">7</text>
<text x="936" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="500" fill="#444441">mov esp,ebp</text>
<text x="1016" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">8</text>
<text x="1016" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="500" fill="#444441">pop ebp</text>
<text x="1096" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">9</text>
<text x="1096" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="500" fill="#444441">ret</text>
<text x="1176" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8a887f">10</text>
<text x="1176" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="500" fill="#444441">add esp,8</text>
