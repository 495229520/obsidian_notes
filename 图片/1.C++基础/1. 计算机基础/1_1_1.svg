<svg xmlns="http://www.w3.org/2000/svg" width="900" height="770" viewBox="0 0 900 770">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>ELF 文件的两种视图：Section 与 Segment</title>
  <desc>左侧为链接视图，链接器以 Section（节）为单位；右侧为执行视图，加载器以 Segment（段）为单位。加载器把权限相同的多个 Section 合并成一个 Segment。</desc>

  <rect x="0" y="0" width="900" height="770" fill="rgb(245, 244, 237)"/>

  <!-- 顶部标题 -->
  <text x="450" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#444441">同一个 ELF 文件，两种视图：Section（节） vs Segment（段）</text>

  <!-- 列标题 -->
  <text x="180" y="80" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">① 链接视图：链接器看 Section（节）</text>
  <text x="700" y="80" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">② 执行视图：加载器看 Segment（段）</text>

  <!-- 中间合并说明 -->
  <text x="422" y="296" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#5F5E5A">加载器</text>
  <text x="422" y="315" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">按权限合并</text>

  <!-- ===== 左侧：Section ===== -->
  <!-- .text -->
  <rect x="75" y="110" width="210" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="180" y="126" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">.text</text>
  <text x="180" y="145" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">代码 (R / E)</text>

  <!-- .rodata -->
  <rect x="75" y="220" width="210" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="180" y="236" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">.rodata</text>
  <text x="180" y="255" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">只读数据 (R)</text>

  <!-- .data -->
  <rect x="75" y="330" width="210" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="180" y="346" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">.data</text>
  <text x="180" y="365" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">已初始化数据 (R / W)</text>

  <!-- .bss -->
  <rect x="75" y="440" width="210" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="180" y="456" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">.bss</text>
  <text x="180" y="475" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">未初始化数据 (R / W)</text>

  <!-- .symtab -->
  <rect x="75" y="550" width="210" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="180" y="566" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441">.symtab</text>
  <text x="180" y="585" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">符号表 (不加载)</text>

  <!-- ===== 右侧：Segment ===== -->
  <!-- LOAD 段 ① R/E -->
  <rect x="560" y="157" width="280" height="66" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="700" y="180" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">LOAD 段 ①  ·  R/E（只读可执行）</text>
  <text x="700" y="201" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">= .text + .rodata</text>

  <!-- LOAD 段 ② R/W -->
  <rect x="560" y="377" width="280" height="66" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="700" y="400" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">LOAD 段 ②  ·  R/W（可读可写）</text>
  <text x="700" y="421" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">= .data + .bss</text>

  <!-- 不加载 -->
  <rect x="560" y="550" width="280" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="700" y="566" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441">不映射进内存</text>
  <text x="700" y="585" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">仅供链接器 / 调试器使用</text>

  <!-- ===== 合并箭头 ===== -->
  <line x1="285" y1="135" x2="558" y2="180" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="285" y1="245" x2="558" y2="204" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="285" y1="355" x2="558" y2="400" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="285" y1="465" x2="558" y2="424" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="285" y1="575" x2="558" y2="575" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 底部注释 ===== -->
  <rect x="60" y="660" width="780" height="62" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="450" y="682" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#444441">记忆：链接看 Section（细分信息），运行看 Segment（装载信息）。</text>
  <text x="450" y="704" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">一个 Segment 可包含多个 Section——加载器把权限相同的节合并成一个加载区域，一次性映射进虚拟地址空间。</text>
</svg>
