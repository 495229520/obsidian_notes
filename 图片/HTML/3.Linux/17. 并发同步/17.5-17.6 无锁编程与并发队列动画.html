<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%2F%3E">
<title>无锁编程与并发队列动画</title>
<!--
Visual system: 22 / 17 / 15 / 13 / 11px type scale; warm paper #F5F4ED and panel #FBFBF6;
8px rhythm with 14px framed surfaces; blue = 线程A/生产者, green = 线程B/消费者/读者,
amber = 插队/复用/回收警示, red = 失败/悬垂; all transitions share the 520ms cubic-bezier motion language.
Engine: build-once + mutate（与 17.2.1 同一套步进引擎），#scene=xxx&step=n 深链。
-->
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFBF6;--ink:#2B2A26;--muted:#6B675C;--faint:#9B968A;
  --line:#D8D5C8;--grid:#D8D5C8;--gray:#F1EFE8;
  --blue:#2467A6;--bluebg:#E1EFFA;--bluetx:#1A4F84;
  --green:#087A5C;--greenbg:#DCF3E9;--greentx:#075A43;
  --amber:#A66408;--amberbg:#FFF0D7;--ambertx:#764600;
  --danger:#C34935;--dangerbg:#FAE1DC;--dangertx:#8F2B1C;
  --code:#2E2C27;--codetext:#E8E3D6;--arrow:#5A564B;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 48px;text-wrap:pretty;}
button{font:inherit;}
.wrap{max-width:1240px;margin:0 auto;}
header h1{font-size:22px;font-weight:700;line-height:1.3;text-wrap:balance;}
header p{font-size:13px;color:var(--muted);margin-top:6px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.tabs{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.tab{min-height:48px;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel);border:1.2px solid var(--line);border-radius:11px;padding:9px 16px;cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease);display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;}
.tab:hover{border-color:var(--muted);transform:translateY(-1px);}
.tab:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:3px solid rgba(36,103,166,.35);outline-offset:2px;}
.tab .t{font-weight:700;color:var(--ink);}.tab .s{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 10px rgba(43,42,38,.16);}
.tab.on .t,.tab.on .s{color:var(--paper);}.tab.on .s{opacity:.75;}

.layout{display:grid;grid-template-columns:minmax(0,680px) minmax(0,1fr);gap:28px;margin-top:22px;align-items:start;}
@media(max-width:1280px){.layout{grid-template-columns:minmax(0,1fr);}}
.viz{background:var(--panel);border:1.2px solid var(--grid);border-radius:14px;padding:24px;min-height:500px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,55,40,.04);overflow:hidden;}
.viz .vcap{font-size:13px;color:var(--muted);margin-bottom:16px;text-align:center;}.viz .vcap b{font-weight:700;color:var(--ink);}
.stage-frame{position:relative;width:min(632px,100%);height:420px;margin:0 auto;}
.stage{position:absolute;left:0;top:0;width:632px;height:420px;transform-origin:top left;}
.layout > .right{display:flex;flex-direction:column;gap:16px;min-width:0;}
.desc-card{background:var(--panel);border:1.2px solid var(--grid);border-radius:14px;padding:18px 20px;min-height:196px;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}.desc-head .st{font-size:17px;font-weight:700;}
#stAct{margin-top:14px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1.2px solid var(--line);padding:10px 14px;border-radius:9px;}
#stDesc{font-size:14px;color:var(--muted);margin-top:11px;}.chip{font-size:11px;font-weight:700;padding:3px 11px;border-radius:999px;border:1.2px solid;}
.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}.cb{color:var(--bluetx);border-color:var(--blue);background:var(--bluebg);}.cg{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}.ca{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}.cd{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}

.codebox{background:var(--code);border:1px solid #24231F;border-radius:10px;padding:12px 0;color:var(--codetext);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden;box-shadow:0 1px 3px rgba(60,55,40,.08);}
.codebox .cl{min-height:24px;padding:2px 14px;white-space:pre-wrap;overflow-wrap:anywhere;transition:background .3s var(--ease),color .3s var(--ease),box-shadow .3s var(--ease);}
.codebox .cl.hl{background:rgba(52,122,198,.52);box-shadow:inset 4px 0 0 #82B4E8;color:#F7F4EA;}.codebox .cl.hl .cmt{color:#CCC8BA;}
.codebox .kw{color:#D9B177;}.codebox .type{color:#8EB5DC;}.codebox .ord{color:#A7D7BF;}.codebox .num{color:#E0A797;}.codebox .str{color:#C8B694;}.codebox .cmt{color:#9A968B;}

.controls{margin-top:22px;background:var(--panel);border:1.2px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.btn{min-height:40px;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1.2px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s var(--ease);}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}.btn:active:not(:disabled){transform:scale(.96);}.btn:disabled{opacity:.4;cursor:default;}.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:92px;}
.dots{display:flex;gap:7px;margin:0 auto;flex-wrap:wrap;}.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:background .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease);}.dot:hover{border-color:var(--muted);transform:scale(1.25);}.dot.done{background:var(--line);border-color:var(--line);}.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}

/* Shared connector language: persistent path, quiet hints, filled triangle heads. */
.arr-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.wire{--wc:var(--arrow);fill:none;stroke:var(--wc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity var(--dur) var(--ease),stroke-dashoffset var(--dur) var(--ease);}
.warrow{--wc:var(--arrow);fill:var(--wc);stroke:none;opacity:0;transition:opacity 240ms var(--ease);}.wport{--wc:var(--arrow);fill:var(--panel);stroke:var(--wc);stroke-width:2;opacity:0;transition:opacity 240ms var(--ease);}
.wire.on,.warrow.on,.wport.on{opacity:1;}.wire.hint{stroke-width:2;opacity:.1;}.warrow.hint,.wport.hint{opacity:.1;}.warrow.drawing{transition-delay:200ms;}
.wire.blue,.warrow.blue,.wport.blue{--wc:var(--blue);}.wire.green,.warrow.green,.wport.green{--wc:var(--green);}.wire.amber,.warrow.amber,.wport.amber{--wc:var(--amber);}.wire.danger,.warrow.danger,.wport.danger{--wc:var(--danger);}

/* Shared bottom note bar. */
.snote{position:absolute;left:16px;top:352px;width:600px;min-height:52px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);padding:8px 14px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);}
.snote.blue{color:var(--bluetx);border-color:var(--blue);background:var(--bluebg);}.snote.green{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}.snote.amber{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}.snote.danger{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}

/* Scene 1: CAS retry loop. */
.value-pod{position:absolute;left:241px;top:12px;width:150px;min-height:64px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.value-pod .n{font-family:var(--mono);font-size:28px;font-weight:700;line-height:1;transition:color var(--dur) var(--ease);}.value-pod .l{font-family:var(--mono);font-size:11px;color:var(--faint);}
.value-pod.warn{border-color:var(--amber);background:var(--amberbg);}.value-pod.warn .n{color:var(--amber);}
.value-pod.bad{border-color:var(--danger);background:var(--dangerbg);}.value-pod.bad .n{color:var(--danger);}
.value-pod.ok{border-color:var(--green);background:var(--greenbg);box-shadow:0 0 0 2px rgba(8,122,92,.12);}.value-pod.ok .n{color:var(--green);}
.cas-thread{position:absolute;top:92px;width:226px;min-height:252px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 14px;transition:opacity var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.cas-thread.a{left:36px;border-color:var(--blue);}.cas-thread.b{left:370px;border-color:var(--green);}.cas-thread.active{box-shadow:0 0 0 2px rgba(36,103,166,.12);}.cas-thread.dim{opacity:.5;}
.thread-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;}.thread-head span{font-family:var(--mono);font-size:10.5px;color:var(--faint);}.cas-thread.a .thread-head span{color:var(--blue);}.cas-thread.b .thread-head span{color:var(--green);}
.op-stack{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.cas-op{min-height:34px;border:1px solid var(--grid);border-radius:7px;background:var(--gray);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--faint);padding:7px 9px;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.cas-op.active{color:var(--ink);border-color:var(--ink);background:var(--paper);transform:scale(1.025);box-shadow:0 0 0 1px rgba(43,42,38,.1);}
.cas-op.done{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.cas-op.fail{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.cas-regs{display:flex;gap:8px;margin-top:11px;}
.cas-reg{flex:1;border:1px solid var(--grid);border-radius:6px;background:var(--panel);padding:5px 8px;font-family:var(--mono);font-size:10px;color:var(--faint);transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);}
.cas-reg b{display:block;font-size:13px;color:var(--ink);transition:color var(--dur) var(--ease);}
.cas-reg.lit{border-color:var(--blue);background:var(--bluebg);}.cas-reg.lit b{color:var(--bluetx);}
.cas-reg.warn{border-color:var(--amber);background:var(--amberbg);}.cas-reg.warn b{color:var(--ambertx);}
.cas-summary{position:absolute;left:95px;top:358px;width:442px;min-height:48px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:7px 14px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);}
.cas-summary.bad{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}.cas-summary.ok{color:var(--green);border-color:var(--green);background:var(--greenbg);}.cas-summary.warn{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}

/* Scene 2: ABA on a lock-free stack. */
.ab-headpod{position:absolute;left:22px;top:44px;width:100px;min-height:56px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);}
.ab-headpod .l{font-family:var(--mono);font-size:10px;color:var(--faint);}.ab-headpod .v{font-family:var(--mono);font-size:13px;font-weight:700;transition:color var(--dur) var(--ease);}
.ab-headpod.bad{border-color:var(--danger);background:var(--dangerbg);}.ab-headpod.bad .v{color:var(--danger);}
.ab-headpod.safe{border-color:var(--green);background:var(--greenbg);}.ab-headpod.safe .v{color:var(--greentx);}
.ab-node{position:absolute;top:40px;width:128px;min-height:64px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),opacity var(--dur) var(--ease),transform var(--dur) var(--ease);}
.ab-node .addr{font-family:var(--mono);font-size:10px;color:var(--faint);}.ab-node .nm{font-size:15px;font-weight:700;transition:color var(--dur) var(--ease);}.ab-node .st{font-family:var(--mono);font-size:9.5px;color:var(--faint);transition:color var(--dur) var(--ease);}
.ab-node.dim{opacity:.45;}
.ab-node.freed{border-style:dashed;border-color:var(--danger);background:var(--dangerbg);opacity:.75;}.ab-node.freed .nm{color:var(--dangertx);text-decoration:line-through;}.ab-node.freed .st{color:var(--dangertx);}
.ab-node.reused{border-color:var(--amber);background:var(--amberbg);transform:scale(1.03);}.ab-node.reused .nm{color:var(--ambertx);}.ab-node.reused .st{color:var(--ambertx);}
.ab-node.okv{border-color:var(--green);background:var(--greenbg);}.ab-node.okv .nm{color:var(--greentx);}.ab-node.okv .st{color:var(--greentx);}
.ab-thread{position:absolute;top:180px;width:290px;min-height:152px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:11px 13px;transition:opacity var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.ab-thread.t1{left:16px;border-color:var(--blue);}.ab-thread.t2{left:326px;border-color:var(--green);}
.ab-thread.active{box-shadow:0 0 0 2px rgba(36,103,166,.12);}.ab-thread.dim{opacity:.5;}
.ab-thread .thread-head span{font-family:var(--mono);font-size:10px;}
.ab-thread.t1 .thread-head span{color:var(--blue);}.ab-thread.t2 .thread-head span{color:var(--green);}
.pausechip{font-size:9.5px;font-weight:700;font-family:var(--mono);color:var(--ambertx);border:1px solid var(--amber);background:var(--amberbg);border-radius:999px;padding:1px 8px;opacity:0;transition:opacity var(--dur) var(--ease);}
.pausechip.on{opacity:1;}
.ab-op{min-height:30px;border:1px solid var(--grid);border-radius:6px;background:var(--gray);font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--faint);padding:5px 8px;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);}
.ab-op.active{color:var(--ink);border-color:var(--ink);background:var(--paper);}
.ab-op.done{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.ab-op.bad{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.ab-op.warn{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}
.ab-thread .op-stack{gap:7px;margin-top:10px;}

/* Scene 3: SPSC ring buffer. */
.sp-card{position:absolute;top:14px;width:290px;min-height:84px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:11px 14px;transition:opacity var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.sp-card.prod{left:16px;border-color:var(--blue);}.sp-card.cons{left:326px;border-color:var(--green);}
.sp-card.active{box-shadow:0 0 0 2px rgba(36,103,166,.12);}.sp-card.dim{opacity:.55;}
.sp-card .thread-head span{font-family:var(--mono);font-size:10px;}
.sp-card.prod .thread-head span{color:var(--blue);}.sp-card.cons .thread-head span{color:var(--green);}
.sp-op{margin-top:9px;min-height:32px;border:1px solid var(--grid);border-radius:6px;background:var(--gray);font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--faint);padding:6px 9px;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);}
.sp-op.blue{color:var(--bluetx);border-color:var(--blue);background:var(--bluebg);}
.sp-op.green{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.sp-op.bad{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}
.sp-array{position:absolute;left:56px;top:196px;display:flex;gap:8px;}
.sp-slot{width:58px;height:56px;border:1.5px dashed var(--line);border-radius:9px;background:var(--gray);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px;font-weight:700;color:var(--faint);transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),transform var(--dur) var(--ease);}
.sp-slot.fill{border-style:solid;border-color:var(--ink);background:var(--panel);color:var(--ink);}
.sp-slot.writing{border-style:solid;border-color:var(--blue);background:var(--bluebg);color:var(--bluetx);transform:translateY(-3px);}
.sp-slot.reading{border-style:solid;border-color:var(--green);background:var(--greenbg);color:var(--greentx);transform:translateY(3px);}
.sp-slot.guard{border-color:var(--amber);background:var(--amberbg);color:var(--ambertx);font-size:9.5px;}
.sp-idx{position:absolute;left:56px;top:258px;display:flex;gap:8px;}
.sp-idx span{width:58px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--faint);}
.sp-ptr{position:absolute;width:86px;min-height:26px;border-radius:999px;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;font-weight:700;transition:left var(--dur) var(--ease),background-color var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.sp-ptr.tail{top:158px;color:var(--bluetx);border-color:var(--blue);background:var(--bluebg);}
.sp-ptr.head{top:290px;color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.sp-ptr.lit{box-shadow:0 0 0 2px rgba(36,103,166,.18);}

/* Scene 4: MPMC Michael-Scott queue. */
.mq-card{position:absolute;top:14px;width:195px;min-height:88px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;transition:opacity var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.mq-card.p1{left:10px;border-color:var(--blue);}.mq-card.p2{left:218px;border-color:var(--amber);}.mq-card.co{left:426px;border-color:var(--green);}
.mq-card.active{box-shadow:0 0 0 2px rgba(36,103,166,.12);}.mq-card.dim{opacity:.55;}
.mq-card .thread-head{font-size:12px;}
.mq-card .thread-head span{font-family:var(--mono);font-size:9.5px;}
.mq-card.p1 .thread-head span{color:var(--blue);}.mq-card.p2 .thread-head span{color:var(--amber);}.mq-card.co .thread-head span{color:var(--green);}
.mq-op{margin-top:8px;min-height:36px;border:1px solid var(--grid);border-radius:6px;background:var(--gray);font-family:var(--mono);font-size:10px;font-weight:700;color:var(--faint);padding:5px 8px;display:flex;align-items:center;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);}
.mq-op.active{color:var(--ink);border-color:var(--ink);background:var(--paper);}
.mq-op.done{color:var(--green);border-color:var(--green);background:var(--greenbg);}

<body>
<div class="wrap">
  <header>

    <p>配套笔记《17.5 无锁编程》《17.6 并发队列》 · CAS 重试 · ABA · SPSC 环形缓冲 · MPMC 队列 · hazard pointer　·　上方切场景，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

<script>
const viz=document.getElementById('viz');
const el=id=>document.getElementById(id);
const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

function escapeHtml(text){return text.replace(/[&<>]/g,ch=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[ch]));}
function highlightCpp(line){
  const parts=line.match(/^(.*?)(\/\/.*)?$/);
  let code=parts ? parts[1] : line;
  const comment=parts && parts[2] ? parts[2] : '';
  const strings=[];
  code=code.replace(/"(?:\\.|[^"\\])*"/g,value=>{
    strings.push(escapeHtml(value));
    return '\u0001'+String.fromCharCode(65+strings.length-1)+'\u0001';
  });
  code=escapeHtml(code)
    .replace(/\b(std|atomic|bool|int|size_t|Node|T|void|const|while|if|do|for|return|break|else|struct)\b/g,'<span class="type">$1</span>')
    .replace(/\b(memory_order_relaxed|memory_order_release|memory_order_acquire|relaxed|release|acquire|nullptr|true|false)\b/g,'<span class="ord">$1</span>')
    .replace(/\b(load|store|compare_exchange_weak|compare_exchange_strong|fetch_add|CAS|push|pop|use|retire|inHazard|delete|new)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(0x[0-9a-fA-F]+)\b/g,'<span class="num">$1</span>')
    .replace(/\b(\d+)\b/g,'<span class="num">$1</span>')
    .replace(/\u0001([A-Z])\u0001/g,(_,name)=>'<span class="str">'+strings[name.charCodeAt(0)-65]+'</span>');
  return code+(comment ? '<span class="cmt">'+escapeHtml(comment)+'</span>' : '');
}
function codePanel(lines){return lines.map((line,index)=>'<div class="cl" id="cl'+index+'">'+(line ? highlightCpp(line) : '&nbsp;')+'</div>').join('');}
function stageFrame(id,classes,html){return '<div class="stage-frame" id="'+id+'Frame"><div class="stage '+classes+'" id="'+id+'Stage">'+html+'</div></div>';}
function fitStage(id){
  const base=id.endsWith('Stage')?id.slice(0,-5):id;
  const stage=el(id),frame=el(base+'Frame');
  if(!stage||!frame)return;
  const scale=Math.min(1,frame.clientWidth/632);
  stage.style.transform='scale('+scale+')';
  frame.style.height=(420*scale)+'px';
}

function wireHTML(id){return '<path id="'+id+'" class="wire"></path><path id="'+id+'-head" class="warrow"></path><circle id="'+id+'-port" class="wport" r="4"></circle>';}
function wireNodes(id){return [el(id),el(id+'-head'),el(id+'-port')];}
function setWire(id,state,color){
  const [path,head,port]=wireNodes(id);
  if(!path||!head||!port)return;
  const suffix=(state?' '+state:'')+(color?' '+color:'');
  path.setAttribute('class','wire'+suffix);
  head.setAttribute('class','warrow'+suffix);
  port.setAttribute('class','wport'+suffix);
  if(state!=='on'){
    path.style.strokeDasharray='';
    path.style.strokeDashoffset='';
    path.style.transition='';
    head.classList.remove('drawing');
  }
}
function drawWire(id,color,timers){
  setWire(id,'on',color);
  const [path,head]=wireNodes(id);
  if(!path||reducedMotion())return;
  const length=path.getTotalLength();
  path.style.transition='none';
  path.style.strokeDasharray=length;
  path.style.strokeDashoffset=length;
  head.classList.add('drawing');
  void path.getBoundingClientRect();
  path.style.transition='';
  path.style.strokeDashoffset='0';
  const timer=setTimeout(()=>{
    path.style.strokeDasharray='';
    path.style.strokeDashoffset='';
    head.classList.remove('drawing');
  },560);
  timers.push(timer);
}
function wireController(ids,colors){
  let active=new Set();
  let timers=[];
  return {
    sync(nextIds,hints=false){
      timers.forEach(clearTimeout);timers=[];
      const next=new Set(nextIds);
      const any=next.size>0;
      ids.forEach(id=>{
        const state=next.has(id)?'on':(!any&&hints?'hint':'');
        if(next.has(id)&&!active.has(id))drawWire(id,colors[id],timers);
        else setWire(id,state,colors[id]);
      });
      active=next;
    },
    destroy(){timers.forEach(clearTimeout);timers=[];active.clear();}
  };
}
function relRect(stageRect,id){
  const rect=el(id).getBoundingClientRect();
  return {left:rect.left-stageRect.left,right:rect.right-stageRect.left,top:rect.top-stageRect.top,bottom:rect.bottom-stageRect.top,cx:(rect.left+rect.right)/2-stageRect.left,cy:(rect.top+rect.bottom)/2-stageRect.top};
}
function point(rect,side,offset=0){
  if(side==='left')return {x:rect.left,y:rect.cy+offset};
  if(side==='right')return {x:rect.right,y:rect.cy+offset};
  return {x:rect.cx,y:rect.cy+offset};
}
function bezierArrow(id,from,to){
  const path=el(id),head=el(id+'-head'),port=el(id+'-port');
  if(!path||!head||!port)return;
  const direction=to.x>=from.x?1:-1;
  const baseX=to.x-direction*9;
  const gap=Math.max(1,Math.abs(baseX-from.x));
  const c1=from.x+direction*gap*.45;
  const c2=baseX-direction*gap*.45;
  path.setAttribute('d','M '+from.x+' '+from.y+' C '+c1+' '+from.y+', '+c2+' '+to.y+', '+baseX+' '+to.y);
  head.setAttribute('d','M '+to.x+' '+to.y+' L '+baseX+' '+(to.y-5)+' L '+baseX+' '+(to.y+5)+' Z');
  port.setAttribute('cx',from.x);port.setAttribute('cy',from.y);
}
function classes(id,value){el(id).className=value;}

/* ---------- Scene 1 · CAS 重试循环 ---------- */
const casScene=(()=>{
  const code=[
    'T expected = a.load(std::memory_order_relaxed);',
    'T desired;',
    'do {',
    '    desired = f(expected);        // 基于旧值计算',
    '} while (!a.compare_exchange_weak(',
    '    expected, desired,            // 失败时 expected 自动刷新',
    '    std::memory_order_release,    // 成功: 发布本次修改',
    '    std::memory_order_relaxed));  // 失败: 只需重新读取'
  ];
  const steps=[
    {title:'步骤 0 · CAS 范式：读 → 算 → 提交',chip:'lock-free',chipC:'c0',lines:[0,2,4],a:['','',''],b:['','',''],aC:'',bC:'',value:'5',valueC:'',aExp:'?',aDes:'?',aRegC:['',''],bExp:'?',bDes:'?',summary:'任何"读-改-写"都能改成这个无锁范式：提交失败就用刷新后的当前值重算。',summaryC:''},
    {title:'步骤 1 · Thread A 读取 expected = 5',chip:'load',chipC:'cb',lines:[0],a:['active','',''],b:['','',''],aC:'active',bC:'dim',value:'5',valueC:'',aExp:'5',aDes:'?',aRegC:['lit',''],bExp:'?',bDes:'?',summary:'A 的快照拿到旧值 5，之后的一切计算都基于它。',summaryC:''},
    {title:'步骤 2 · Thread A 计算 desired = 6',chip:'compute',chipC:'cb',lines:[3],a:['done','active',''],b:['','',''],aC:'active',bC:'dim',value:'5',valueC:'',aExp:'5',aDes:'6',aRegC:['lit','lit'],bExp:'?',bDes:'?',summary:'计算发生在本地，不加任何锁——这正是"乐观"：先干活，提交时再查冲突。',summaryC:''},
    {title:'步骤 3 · Thread B 插队，先提交成功 a = 6',chip:'被插队',chipC:'ca',lines:[4],a:['done','done',''],b:['done','done','done'],aC:'dim',bC:'active',value:'6',valueC:'warn',aExp:'5',aDes:'6',aRegC:['warn','lit'],bExp:'5',bDes:'6',summary:'就在 A 计算期间，B 完成了自己的 CAS(5→6)。A 手里的 expected=5 已经过期。',summaryC:'warn'},
    {title:'步骤 4 · A 提交 CAS(5→6)：失败',chip:'CAS fail',chipC:'cd',lines:[4,5],a:['done','done','fail'],b:['done','done','done'],aC:'active',bC:'dim',value:'6',valueC:'',aExp:'5→6',aDes:'6',aRegC:['warn','lit'],bExp:'5',bDes:'6',summary:'内存值 6 ≠ expected 5，硬件拒绝写入。关键副作用：expected 被自动刷新成当前值 6，无需再手动 load。',summaryC:'bad'},
    {title:'步骤 5 · A 用刷新值重算 desired = 7',chip:'retry',chipC:'ca',lines:[2,3],a:['done','active',''],b:['done','done','done'],aC:'active',bC:'dim',value:'6',valueC:'',aExp:'6',aDes:'7',aRegC:['lit','lit'],bExp:'5',bDes:'6',summary:'循环里用 _weak：即使 LL/SC 平台伪失败，再转一圈就是——反正循环本来就要重试。',summaryC:''},
    {title:'步骤 6 · A 再次 CAS(6→7)：成功，a = 7',chip:'lock-free 推进',chipC:'cg',lines:[4,6],a:['done','done','done'],b:['done','done','done'],aC:'active',bC:'',value:'7',valueC:'ok',aExp:'6',aDes:'7',aRegC:['lit','lit'],bExp:'5',bDes:'6',summary:'A 的失败恰恰证明 B 成功了——整个系统总有线程在推进，这就是 lock-free（但单个线程可能被饿死）。',summaryC:'ok'}
  ];
  let observer=null;
  function mount(){
    const html='<div class="vcap"><b>CAS 重试循环</b>：乐观提交，失败拿最新值重算</div>'+stageFrame('cs','cas-stage',
      '<div class="value-pod" id="csValue"><span class="l">atomic a</span><span class="n" id="csNum">5</span></div>'+
      '<div class="cas-thread a" id="csA"><div class="thread-head">Thread A <span>retry loop</span></div>'+
        '<div class="op-stack"><div class="cas-op" id="csA0">① expected = a.load()</div><div class="cas-op" id="csA1">② desired = f(expected)</div><div class="cas-op" id="csA2">③ CAS(expected → desired)</div></div>'+
        '<div class="cas-regs"><div class="cas-reg" id="csARegE">expected<b id="csAExp">?</b></div><div class="cas-reg" id="csARegD">desired<b id="csADes">?</b></div></div></div>'+

        '<div class="cas-regs"><div class="cas-reg" id="csBRegE">expected<b id="csBExp">?</b></div><div class="cas-reg" id="csBRegD">desired<b id="csBDes">?</b></div></div></div>'+

    viz.innerHTML=html;

    observer=new ResizeObserver(()=>fitStage('csStage'));observer.observe(el('csFrame'));
  }
  function paint(s){
    classes('csA','cas-thread a '+s.aC);classes('csB','cas-thread b '+s.bC);
    s.a.forEach((state,index)=>classes('csA'+index,'cas-op '+state));
    s.b.forEach((state,index)=>classes('csB'+index,'cas-op '+state));
    classes('csValue','value-pod '+s.valueC);el('csNum').textContent=s.value;
    el('csAExp').textContent=s.aExp;el('csADes').textContent=s.aDes;
    classes('csARegE','cas-reg '+s.aRegC[0]);classes('csARegD','cas-reg '+s.aRegC[1]);
    el('csBExp').textContent=s.bExp;el('csBDes').textContent=s.bDes;
    classes('csSummary','cas-summary '+s.summaryC);el('csSummary').textContent=s.summary;
  }
  function destroy(){observer?.disconnect();}
  return {id:'cas',label:'CAS 重试',sub:'compare_exchange_weak',steps,mount,paint,code,destroy};
})();

/* ---------- Scene 2 · ABA 问题（无锁栈） ---------- */
const abaScene=(()=>{
  const code=[
    '// 无锁栈 pop —— 简化版（有 ABA 隐患）',
    'Node* old  = head.load();            // A (0x100)',
    'Node* next = old->next;              // B (0x200)',
    '// …被抢占期间: pop A, pop B, push D(复用 0x100)',
    'head.compare_exchange_strong(old, next);',
    '// 0x100 == 0x100 → 成功, head 指向已释放的 0x200',
    '// 解法: {指针,版本号} 双字 CAS · hazard pointer · RCU'
  ];
  const wires=['hA','hB','hB2','hC','ab','bc','dc'];
  const colors={hA:'blue',hB:'green',hB2:'danger',hC:'blue',ab:'',bc:'',dc:'amber'};
  const controller=wireController(wires,colors);
  let observer=null;
  const steps=[
    {title:'步骤 0 · 初始栈 head → A → B → C',chip:'无锁栈',chipC:'c0',lines:[0],head:'0x100',headC:'',n1:['0x100','A','in stack',''],n2:['0x200','B','in stack',''],n3:['0x300','C','in stack',''],w:['hA','ab','bc'],t1C:'',t2C:'dim',t1:['','',''],t1o2:'③ CAS(head, 0x100 → 0x200)',pause:false,t2:['','',''],note:'三个节点地址 0x100 / 0x200 / 0x300。线程 1 准备 pop，线程 2 也要动这个栈。',noteC:''},
    {title:'步骤 1 · 线程 1 读完 old 与 next，随即被抢占',chip:'快照',chipC:'cb',lines:[1,2],head:'0x100',headC:'',n1:['0x100','A','in stack',''],n2:['0x200','B','in stack',''],n3:['0x300','C','in stack',''],w:['hA','ab','bc'],t1C:'active',t2C:'dim',t1:['done','done',''],t1o2:'③ CAS(head, 0x100 → 0x200)',pause:true,t2:['','',''],note:'线程 1 的快照：old = 0x100，next = 0x200。还没来得及 CAS 就被调度器切走。',noteC:'blue'},

      '<div class="mq-node" id="mqN1" style="left:256px;"><span class="nm" id="mqN1n">n1</span><span class="st" id="mqN1s">待入队</span></div>'+
      '<div class="mq-node" id="mqN2" style="left:436px;"><span class="nm" id="mqN2n">n2</span><span class="st" id="mqN2s">待入队</span></div>'+
      '<div class="mq-ptr tl" id="mqTl">Tail</div>'+
      '<svg class="arr-layer" id="mqSvg" preserveAspectRatio="none">'+wires.map(wireHTML).join('')+'</svg>'+
      '<div class="snote" id="mqNote"></div>');
    viz.innerHTML=html;
    el('mqHd').style.left=(nodeCX[0]-42)+'px';el('mqTl').style.left=(nodeCX[0]-42)+'px';
    layout();observer=new ResizeObserver(layout);observer.observe(el('mqFrame'));
  }
  function setNode(id,data){el(id+'n').textContent=data[0];el(id+'s').textContent=data[1];el(id).className='mq-node '+data[2];}
  function paint(s){
    layout();
    setNode('mqN0',s.n0);setNode('mqN1',s.n1);setNode('mqN2',s.n2);
    el('mqHd').style.left=(nodeCX[s.hd]-42)+'px';el('mqTl').style.left=(nodeCX[s.tl]-42)+'px';
    el('mqHd').className='mq-ptr hd'+(s.hdLit?' lit':'');el('mqTl').className='mq-ptr tl'+(s.tlLit?' lit':'');
    classes('mqP1','mq-card p1 '+s.p1C);classes('mqP2','mq-card p2 '+s.p2C);classes('mqCo','mq-card co '+s.coC);
    el('mqP1op').textContent=s.p1[0];classes('mqP1op','mq-op '+s.p1[1]);
    el('mqP2op').textContent=s.p2[0];classes('mqP2op','mq-op '+s.p2[1]);
    el('mqCoop').textContent=s.co[0];classes('mqCoop','mq-op '+s.co[1]);
    classes('mqNote','snote '+s.noteC);el('mqNote').textContent=s.note;
    controller.sync(s.w,false);
  }
  function destroy(){observer?.disconnect();controller.destroy();}
  return {id:'mpmc',label:'MPMC 队列',sub:'Michael-Scott',steps,mount,paint,code,destroy};
})();

/* ---------- Scene 5 · 无锁内存回收（hazard pointer） ---------- */
const reclaimScene=(()=>{
  const code=[
    '// 何时才能 delete? —— 裸 delete = use-after-free',
    'Node* p = head.load();',
    'hp[me].store(p);              // ① 登记: 我在用 p',
    'if (p == head.load()) use(p); // ② 复核后安全访问',
    'hp[me].store(nullptr);        // ③ 用完撤销保护',
    '// —— 回收线程 ——',
    'retireList.push(node);        // 摘下的节点先入链',
    'for (Node* n : retireList)',
    '  if (!inHazard(n)) delete n; // 无人登记才真正释放'
  ];
  const wires=['wReg','wUse','wScan','wDel','wFree'];
  const colors={wReg:'green',wUse:'green',wScan:'amber',wDel:'danger',wFree:'green'};
  const controller=wireController(wires,colors);
  let observer=null;
  const steps=[
    {title:'步骤 0 · 难题：摘下的节点何时能 delete？',chip:'内存回收',chipC:'c0',lines:[0],node:['A · 0x100','在链表中',''],hpR:'∅',hpRC:'',retire:'retire 链：空',retireC:'',w:[],rC:'',wC:'dim',r:['','',''],wo:['','',''],note:'W 想把 A 摘下并释放，但 R 可能仍拿着指向 A 的指针——直接 delete 就是 use-after-free。这是无锁结构最难的一环。',noteC:''},
    {title:'步骤 1 · R 发布保护：hp[R] = 0x100',chip:'登记',chipC:'cg',lines:[1,2],node:['A · 0x100','在链表中',''],hpR:'0x100',hpRC:'lit',retire:'retire 链：空',retireC:'',w:['wReg'],rC:'active',wC:'dim',r:['done','',''],wo:['','',''],note:'读者先把"我正在用 0x100"写进全局 hazard 表，复核指针仍有效后才访问。这张表所有线程可见。',noteC:'green'},
    {title:'步骤 2 · R 正在遍历访问节点 A',chip:'访问中',chipC:'cg',lines:[3],node:['A · 0x100','被 R 保护中','prot'],hpR:'0x100',hpRC:'lit',retire:'retire 链：空',retireC:'',w:['wReg','wUse'],rC:'active',wC:'dim',r:['done','active',''],wo:['','',''],note:'只要 hazard 表里登记着 0x100，这块内存就不许被任何人释放——保护由约定 + 扫描共同兑现。',noteC:''},
    {title:'步骤 3 · W 把 A 摘下，放入 retire 链',chip:'retire',chipC:'ca',lines:[5,6],node:['A · 0x100','已摘下 · retire 链中','retired'],hpR:'0x100',hpRC:'lit',retire:'retire 链：A(0x100)',retireC:'hold',w:['wReg','wUse'],rC:'dim',wC:'active',r:['done','active',''],wo:['done','',''],note:'摘除（逻辑删除）用 CAS 完成，链表里已经看不到 A；但物理释放被推迟——先挂进 W 自己的 retire 链。',noteC:'amber'},
    {title:'步骤 4 · W 扫描 hazard 表：0x100 被保护 → 不能删',chip:'推迟释放',chipC:'cd',lines:[7,8],node:['A · 0x100','已摘下 · 仍被保护','retired'],hpR:'0x100',hpRC:'lit',retire:'retire 链：A(0x100)',retireC:'hold',w:['wScan','wDel'],rC:'dim',wC:'active',r:['done','active',''],wo:['done','bad',''],note:'扫描发现 R 登记了 0x100 → 本轮跳过，A 继续留在 retire 链。delete 被挡下，use-after-free 不可能发生。',noteC:'danger'},
    {title:'步骤 5 · R 用完，清空 hp[R] = ∅',chip:'解除保护',chipC:'cg',lines:[4],node:['A · 0x100','已摘下 · 无人引用','retired'],hpR:'∅',hpRC:'',retire:'retire 链：A(0x100)',retireC:'hold',w:[],rC:'active',wC:'dim',r:['done','done','done'],wo:['done','bad',''],note:'读者退出临界区，撤下保护。此后不会再有新读者拿到 A——它早已从链表摘除，不可达。',noteC:'green'},
    {title:'步骤 6 · W 再扫：无人保护 → 安全 delete',chip:'safe free',chipC:'cg',lines:[7,8],node:['A · 0x100','已安全释放','freed'],hpR:'∅',hpRC:'',retire:'retire 链：空',retireC:'',w:['wScan','wFree'],rC:'dim',wC:'active',r:['done','done','done'],wo:['done','done','done'],note:'hazard pointer 按指针精确保护；RCU 则用"宽限期"整体等所有读者退出再回收。同一思想：读者在场，绝不释放。',noteC:'green'}
  ];
  function layout(){
    fitStage('rcStage');
    const stage=el('rcStage'),svg=el('rcSvg');if(!stage||!svg)return;
    const sr=stage.getBoundingClientRect();svg.setAttribute('viewBox','0 0 '+sr.width+' '+sr.height);
    const rcard=relRect(sr,'rcR'),wcard=relRect(sr,'rcW'),node=relRect(sr,'rcNode'),hpr=relRect(sr,'rcHpR'),table=relRect(sr,'rcTable');
    bezierArrow('wReg',point(rcard,'right',-24),point(hpr,'left'));
    bezierArrow('wUse',point(rcard,'right',-72),point(node,'left'));
    bezierArrow('wScan',point(wcard,'left',-24),point(table,'right',10));
    bezierArrow('wDel',point(wcard,'left',-72),point(node,'right',-8));
    bezierArrow('wFree',point(wcard,'left',-72),point(node,'right',8));
  }
  function mount(){
    const html='<div class="vcap"><b>无锁内存回收</b>：读者在场，绝不释放 —— hazard pointer</div>'+stageFrame('rc','reclaim-stage',
      '<div class="rc-node" id="rcNode"><span class="nm" id="rcNodeN">A · 0x100</span><span class="st" id="rcNodeS">在链表中</span></div>'+
      '<div class="rc-table" id="rcTable"><div class="tt">hazard 表（全局）</div><div class="rc-hp" id="rcHpR">HP[R]<b id="rcHpRv">∅</b></div><div class="rc-hp" id="rcHpW">HP[W]<b>∅</b></div></div>'+
      '<div class="rc-side rd" id="rcR"><div class="thread-head">读者线程 R <span>reader</span></div>'+
        '<div class="op-stack"><div class="ab-op" id="rcR0">① hp[R] = 0x100 登记</div><div class="ab-op" id="rcR1">② 安全访问节点 A</div><div class="ab-op" id="rcR2">③ hp[R] = ∅ 撤销</div></div></div>'+
      '<div class="rc-side wr" id="rcW"><div class="thread-head">回收线程 W <span>reclaimer</span></div>'+
        '<div class="op-stack"><div class="ab-op" id="rcW0">① 摘下 A → retire 链</div><div class="ab-op" id="rcW1">② 扫描 hazard 表</div><div class="ab-op" id="rcW2">③ 无人保护才 delete</div></div>'+
        '<div class="rc-retire" id="rcRetire">retire 链：空</div></div>'+
      '<svg class="arr-layer" id="rcSvg" preserveAspectRatio="none">'+wires.map(wireHTML).join('')+'</svg>'+
      '<div class="snote" id="rcNote"></div>');
    viz.innerHTML=html;
    layout();observer=new ResizeObserver(layout);observer.observe(el('rcFrame'));
  }
  function paint(s){
    layout();
    el('rcNodeN').textContent=s.node[0];el('rcNodeS').textContent=s.node[1];classes('rcNode','rc-node '+s.node[2]);
    el('rcHpRv').textContent=s.hpR;classes('rcHpR','rc-hp '+s.hpRC);
    el('rcRetire').textContent=s.retire;classes('rcRetire','rc-retire '+s.retireC);
    classes('rcR','rc-side rd '+s.rC);classes('rcW','rc-side wr '+s.wC);
    s.r.forEach((state,index)=>classes('rcR'+index,'ab-op '+state));
    s.wo.forEach((state,index)=>classes('rcW'+index,'ab-op '+state));
    classes('rcNote','snote '+s.noteC);el('rcNote').textContent=s.note;
    controller.sync(s.w,false);
  }
  function destroy(){observer?.disconnect();controller.destroy();}
  return {id:'reclaim',label:'内存回收',sub:'hazard pointer',steps,mount,paint,code,destroy};
})();

/* ---------- 步进引擎 ---------- */
const SCENES=[casScene,abaScene,spscScene,mpmcScene,reclaimScene];
const tabsBox=el('tabs');
const stTitle=el('stTitle'),stChip=el('stChip'),stAct=el('stAct'),stDesc=el('stDesc');
const codeBox=el('codeBox'),readout=el('readout'),dotsBox=el('dots');
const btnPrev=el('btnPrev'),btnNext=el('btnNext'),btnPlay=el('btnPlay');
SCENES.forEach((scene,index)=>{
  const tab=document.createElement('button');
  tab.type='button';tab.className='tab';tab.innerHTML='<span class="t">'+scene.label+'</span><span class="s">'+scene.sub+'</span>';
  tab.addEventListener('click',()=>{stop();switchScene(index);});tabsBox.appendChild(tab);
});

let sceneIndex=0,stepIndex=0,dotEls=[],timer=null;
function switchScene(index){
  SCENES[sceneIndex]?.destroy?.();
  sceneIndex=index;stepIndex=0;
  [...tabsBox.children].forEach((tab,i)=>tab.classList.toggle('on',i===sceneIndex));
  const scene=SCENES[sceneIndex];
  scene.mount();
  codeBox.innerHTML=codePanel(scene.code);
  dotsBox.innerHTML='';dotEls=[];
  scene.steps.forEach((step,index)=>{
    const dot=document.createElement('button');
    dot.type='button';dot.className='dot';dot.title=step.title;dot.setAttribute('aria-label',step.title);
    dot.addEventListener('click',()=>{stop();go(index);});dotsBox.appendChild(dot);dotEls.push(dot);
  });
  go(0);
}
function go(index){
  const steps=SCENES[sceneIndex].steps;
  stepIndex=Math.max(0,Math.min(steps.length-1,index));
  const step=steps[stepIndex];
  SCENES[sceneIndex].paint(step);
  codeBox.querySelectorAll('.cl').forEach((line,i)=>line.classList.toggle('hl',Boolean(step.lines&&step.lines.includes(i))));
  stTitle.textContent=SCENES[sceneIndex].label;stChip.textContent=step.chip;stChip.className='chip '+step.chipC;stAct.textContent='▸ '+step.title;
  stDesc.textContent=step.desc||step.note||step.summary||'从初始状态开始，逐步观察每一次 CAS 的成败与指针的走向。';
  dotEls.forEach((dot,i)=>{dot.classList.toggle('now',i===stepIndex);dot.classList.toggle('done',i<stepIndex);});
  readout.textContent=stepIndex+' / '+(steps.length-1);btnPrev.disabled=stepIndex===0;btnNext.disabled=stepIndex===steps.length-1;
  try{history.replaceState(null,'','#scene='+SCENES[sceneIndex].id+'&step='+stepIndex);}catch(error){}
  if(stepIndex===steps.length-1)stop();
}
function play(){
  const steps=SCENES[sceneIndex].steps;
  if(stepIndex===steps.length-1)go(0);
  btnPlay.textContent='暂停';
  timer=setInterval(()=>{stepIndex<steps.length-1?go(stepIndex+1):stop();},2700);
}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='播放';}
btnPlay.addEventListener('click',()=>timer?stop():play());
btnPrev.addEventListener('click',()=>{stop();go(stepIndex-1);});
btnNext.addEventListener('click',()=>{stop();go(stepIndex+1);});
document.addEventListener('keydown',event=>{
  if(event.key==='ArrowRight'){stop();go(stepIndex+1);}else if(event.key==='ArrowLeft'){stop();go(stepIndex-1);}else if(event.key===' '){event.preventDefault();timer?stop():play();}
});
const hashScene=location.hash.match(/scene=(\w+)/);const hashStep=location.hash.match(/step=(\d+)/);
let initialScene=0;if(hashScene){const found=SCENES.findIndex(scene=>scene.id===hashScene[1]);if(found>=0)initialScene=found;}
switchScene(initialScene);if(hashStep)go(Number(hashStep[1]));
</script>
