<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCP 原理动画 · Seq/Ack 按字节推进 / SYN·FIN 占序号 / 连接全生命周期</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#3E3D39;--muted:#5F5E5A;--faint:#8a887f;
  --line:#c9c7bf;--grid:#e2e0d7;
  --blue:#185FA5;--bluebg:#E6F1FB;
  --green:#0F6E56;--greenbg:#E1F5EE;
  --brown:#9A5B0E;--brownbg:#FAEEDA;
  --danger:#B3402F;--dangerbg:#F6E0DB;
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 44px;text-wrap:pretty;}
.wrap{max-width:1180px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.4px;}
header p{font-size:13px;color:var(--muted);margin-top:5px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
.tab{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 17px;cursor:pointer;transition:all .18s var(--ease);display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
.tab:hover{border-color:var(--muted);transform:translateY(-1px);}
.tab .t{font-weight:600;color:var(--ink);}
.tab .s{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 10px rgba(62,61,57,.18);}
.tab.on .t,.tab.on .s{color:var(--paper);}
.tab.on .s{opacity:.75;}

.layout{display:grid;grid-template-columns:626px 1fr;gap:26px;margin-top:22px;align-items:start;}
@media(max-width:1080px){.layout{grid-template-columns:1fr;}}
.viz{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:22px;min-height:466px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.viz .vcap{font-size:12px;color:var(--muted);margin-bottom:12px;}
.viz .vcap b{color:var(--ink);}

/* ---------- 场景 1：字节流标尺 ---------- */
.byte{width:35px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--mono);font-size:15px;font-weight:700;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--faint);transition:all var(--dur) var(--ease);box-shadow:0 1px 2px rgba(60,55,40,.05);}
.byte .bnum{font-size:8.5px;font-weight:400;color:var(--faint);transition:color var(--dur) var(--ease);}
.byte.sent{color:var(--blue);background:var(--bluebg);border-color:var(--blue);}
.byte.sent .bnum{color:var(--blue);}
.byte.acked{color:var(--green);background:var(--greenbg);border-color:var(--green);}
.byte.acked .bnum{color:var(--green);}
.byte.lost{color:var(--danger);background:var(--dangerbg);border-color:var(--danger);border-style:dashed;animation:segPulse 1.1s ease-in-out infinite;}
.byte.lost .bnum{color:var(--danger);}
.byte.buf{color:var(--brown);background:var(--brownbg);border-color:var(--brown);}
.byte.buf .bnum{color:var(--brown);}
.byte.dots{border-style:dashed;opacity:.55;}
@keyframes segPulse{50%{opacity:.45;}}
@keyframes pop{0%{transform:scale(.7);}70%{transform:scale(1.14);}100%{transform:scale(1);}}

.sa-wrap{position:relative;padding:38px 0 42px;margin-top:8px;}
.sa-ruler{display:flex;gap:3px;justify-content:center;}
.seg{position:absolute;top:94px;height:26px;font-family:var(--mono);font-size:10.5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;border:1.5px solid var(--line);border-top:none;border-radius:0 0 8px 8px;color:var(--faint);opacity:0;transition:all var(--dur) var(--ease);white-space:nowrap;}
.seg.fly{opacity:1;border-color:var(--blue);color:var(--blue);background:var(--bluebg);}
.seg.lost{opacity:1;border-color:var(--danger);color:var(--danger);background:var(--dangerbg);border-style:dashed;border-top:none;animation:segPulse 1.1s ease-in-out infinite;}
.seg.buf{opacity:1;border-color:var(--brown);color:var(--brown);background:var(--brownbg);}
.seg.ok{opacity:.55;border-color:var(--green);color:var(--green);background:var(--greenbg);}

.ackbadge{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--green);background:var(--greenbg);border:1.5px solid var(--green);border-radius:999px;padding:2px 10px;white-space:nowrap;z-index:2;transition:left var(--dur) var(--ease),top var(--dur) var(--ease),opacity .3s var(--ease),color .3s,border-color .3s,background .3s;}
.ackbadge::after{content:'';position:absolute;left:50%;transform:translateX(-50%);top:100%;border:5px solid transparent;border-top-color:var(--green);transition:border-color .3s;}
.ackbadge.stuck{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);animation:segPulse 1.1s ease-in-out infinite;}
.ackbadge.stuck::after{border-top-color:var(--danger);}
.ackbadge.up::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--green);}

.water{margin-top:2px;text-align:center;}
.wlbl{font-family:var(--mono);font-size:10.5px;color:var(--faint);display:block;margin-bottom:5px;}
.wtrack{height:10px;border-radius:5px;background:var(--gray);border:1px solid var(--grid);margin:0 auto;position:relative;overflow:hidden;}
.wfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--green),#2E9C7F);border-radius:5px;transition:width var(--dur) var(--ease);}

.op-note{text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:10px;}
.op-note b{color:var(--ink);}

/* ---------- 场景 2：序号轴 + 迷你生命线 ---------- */
.sf-axes{position:relative;}
.sf-row{display:flex;gap:3px;justify-content:center;align-items:center;}
.sf-row.a{margin-bottom:40px;}
.sf-row.b{margin-bottom:36px;}
.rtag{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:56px;text-align:right;margin-right:10px;}
.byte.ctrl{color:var(--paper);background:var(--ink);border-color:var(--ink);}
.byte.ctrl .bnum{color:var(--paper);opacity:.85;}
.byte.data{color:var(--blue);background:var(--bluebg);border-color:var(--blue);}
.byte.data .bnum{color:var(--blue);}

.mini-life{position:relative;height:194px;margin-top:12px;border-top:1px dashed var(--grid);}
.ml-head{position:absolute;top:8px;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--blue);background:var(--bluebg);border:1px solid var(--blue);border-radius:8px;padding:2px 10px;z-index:1;white-space:nowrap;}
.ml-head.s{color:var(--brown);background:var(--brownbg);border-color:var(--brown);}
.ml-line{position:absolute;top:38px;bottom:4px;width:2px;transform:translateX(-50%);background:var(--blue);opacity:.25;}
.ml-line.s{background:var(--brown);}
.mchip{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1.5px solid;white-space:nowrap;opacity:0;transition:left var(--dur) var(--ease),opacity .35s var(--ease),box-shadow .3s var(--ease);}
.mchip.c2s{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.mchip.s2c{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.mchip.now{opacity:1;z-index:3;box-shadow:0 3px 10px rgba(62,61,57,.2);}
.mchip.past{opacity:.42;}

/* ---------- 场景 3：双生命线全生命周期 ---------- */
.life{position:relative;height:404px;margin-top:2px;}
.lf-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
.lf-svg path.msg{fill:none;stroke-width:2;opacity:0;transition:stroke-dashoffset .52s var(--ease),opacity .3s var(--ease),stroke-width .3s var(--ease);}
.lf-svg path.msg.now{opacity:1;stroke-width:3;}
.lf-svg path.msg.past{opacity:.3;}
.lf-svg .arrow{stroke:none;opacity:0;transition:opacity .25s var(--ease);}
.lf-svg .arrow.now{opacity:1;transition-delay:200ms;}
.lf-svg .arrow.past{opacity:.3;transition-delay:0ms;}
.lf-svg .port{stroke-width:2;opacity:0;transition:opacity .25s var(--ease);}
.lf-svg .port.now{opacity:1;}
.lf-svg .port.past{opacity:.3;}
.ll-head{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;font-weight:600;color:var(--blue);background:var(--bluebg);border:1px solid var(--blue);border-radius:9px;padding:4px 14px;z-index:2;white-space:nowrap;}
.ll-head.s{color:var(--brown);background:var(--brownbg);border-color:var(--brown);}
.stbadge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.3px;}
.stbadge.pop{animation:pop .5s var(--ease);}
.ll-line{position:absolute;top:58px;width:3px;height:26px;border-radius:2px;transform:translateX(-50%);background:var(--blue);opacity:.3;transition:height var(--dur) var(--ease);}
.ll-line.s{background:var(--brown);}
.phase{position:absolute;left:4px;writing-mode:vertical-rl;font-size:11px;font-family:var(--mono);color:var(--faint);opacity:.5;letter-spacing:2px;transition:all .3s var(--ease);}
.phase.on{color:var(--ink);opacity:1;font-weight:700;}
.twbox{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--danger);border:1.5px dashed var(--danger);background:var(--dangerbg);border-radius:8px;padding:3px 10px;opacity:0;white-space:nowrap;transition:opacity .4s var(--ease);}
.twbox.on{opacity:1;}

/* ---------- 右侧 ---------- */
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:18px 20px;min-height:196px;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.act{margin-top:14px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:9px 13px;border-radius:9px;}
.chip{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;border:1px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cb{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.desc-body{margin-top:10px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .bl{color:var(--blue);font-weight:600;}
.desc-body .gr{color:var(--green);font-weight:600;}
.desc-body .dg{color:var(--danger);font-weight:600;}
.desc-body .br{color:var(--brown);font-weight:600;}

.codebox{background:#2E2C27;border-radius:11px;padding:12px 0;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:#D8D5CC;overflow-x:auto;box-shadow:0 2px 8px rgba(46,44,39,.18);}
.codebox .cl{padding:2px 14px;white-space:pre;transition:background .3s var(--ease),color .3s var(--ease),box-shadow .3s var(--ease);}
.codebox .cl.hl{background:rgba(52,122,198,.52);box-shadow:inset 4px 0 0 #82B4E8;color:#F7F4EA;}
.codebox .cl.hl .cmt{color:#CCC8BA;}
.codebox .cl.hl .str{color:#C6E2A8;}
.codebox .cmt{color:#8F8B80;} .codebox .kw{color:#E3A44C;} .codebox .str{color:#9CC078;}

.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:92px;}
.dots{display:flex;gap:7px;margin:0 auto;flex-wrap:wrap;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TCP 原理动画 · Seq/Ack 按字节推进 / SYN·FIN 占序号 / 连接全生命周期</h1>
    <p>TCP 编号的是字节流不是"第几个包" · SYN/FIN 各占一个序号 · 建连 3 包 / 断连 4 包　·　上方切场景，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <section class="viz" id="viz"></section>
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="act" id="stAct"></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
      <div class="codebox" id="codeBox"></div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
const viz=document.getElementById('viz');
function el(id){return document.getElementById(id);}
function hlLines(pfx,total,on){
  for(let i=0;i<total;i++){
    const e=el(pfx+'-l'+i);
    if(e)e.classList.toggle('hl',!!on&&on.includes(i));
  }
}
function drawIn(p){
  const L=p.getTotalLength();
  p.style.transition='none';
  p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
  void p.getBoundingClientRect();
  p.style.transition='';
  p.style.strokeDashoffset='0';
  clearTimeout(p._t);
  p._t=setTimeout(()=>{p.style.strokeDasharray='';p.style.strokeDashoffset='';},560);
}

/* ========== 场景 1：Seq/Ack 按字节推进 ========== */
const seqScene=(()=>{
  const N=15,CH='HelloWorldAgain'.split('');
  let cellL=[],cellW=35,cellREnd=0;
  const code=[
    '<span class="cmt"># 伪 tcpdump · C=客户端  S=服务器</span>',
    'C→S  seq=1000 len=5  <span class="str">"Hello"</span>',
    'S→C  ack=1005            <span class="cmt"># 1005 之前都收到了</span>',
    'C→S  seq=1005 len=5  <span class="str">"World"</span>   <span class="cmt"># 途中丢失</span>',
    'C→S  seq=1010 len=5  <span class="str">"Again"</span>',
    'S→C  ack=1005            <span class="cmt"># 缺口卡住, ack 不动</span>',
    'C→S  seq=1005 len=5  <span class="str">"World"</span>   <span class="cmt"># 重传</span>',
    'S→C  ack=1015            <span class="cmt"># 缺口补齐, 一次跳 10 字节</span>'
  ].map((l,i)=>'<div class="cl" id="sa-l'+i+'">'+l+'</div>').join('');
  const mk=spec=>{const a=Array(N).fill('');for(const k in spec)spec[k].forEach(r=>{for(let i=r[0];i<=r[1];i++)a[i]=k;});return a;};
  const steps=[
    {title:'步骤 0 · 字节流编号 1000~1014',chip:'字节流编号',chipC:'c0',cells:mk({}),segs:['','',''],ack:1000,hl:[0],
     note:'灰=未发送 · <span style="color:var(--blue)">蓝=已发出</span> · <span style="color:var(--green)">绿=已确认</span> · <span style="color:var(--danger)">红=丢失</span> · <span style="color:var(--brown)">橙=乱序暂存</span>',
     desc:'TCP 把应用层数据看成<b>一条连续的字节流</b>，给每个字节编号。本例这 15 个字节从 <b>1000</b> 号开始：<code>H</code>=1000、<code>o</code>=1004 … <code>n</code>=1014。TCP 心里想的不是"我发的是第几个包"，而是"<b>这段数据从第几个字节开始</b>"。'},
    {title:'步骤 1 · 发送 seq=1000, len=5（Hello）',chip:'seq=1000 len=5',chipC:'cb',cells:mk({sent:[[0,4]]}),segs:['fly','',''],ack:1000,hl:[1],
     note:'报文段括号罩住 1000~1004 这 5 个字节',
     desc:'Seq 标记<b>本报文段第一个数据字节的编号</b>。前 5 字节 "Hello" 装进一个报文段：<span class="bl">seq=1000, len=5</span> —— "我这次发的数据从 1000 号字节开始，共 5 个字节"，而不是"这是第 1000 个包"。'},
    {title:'步骤 2 · 接收方回 ack=1005',chip:'ack=1005',chipC:'cg',cells:mk({acked:[[0,4]]}),segs:['ok','',''],ack:1005,hl:[2],
     note:'ack=1005：1005 之前全收到, 下次从 1005 发',
     desc:'接收方连续收到 1000~1004，回 <span class="gr">ack=1005</span>。这不是说"我收到 1005 了"，而是<b>累计确认</b>："<b>1005 之前的字节我都收到了，下次请从 1005 开始发</b>"。绿色水位线推进到 1005。'},
    {title:'步骤 3 · 发送 seq=1005, len=5（World）',chip:'seq=1005 len=5',chipC:'cb',cells:mk({acked:[[0,4]],sent:[[5,9]]}),segs:['ok','fly',''],ack:1005,hl:[3],
     note:'第二段覆盖 1005~1009',
     desc:'发送方继续发 "World"：<span class="bl">seq=1005, len=5</span>，覆盖字节 1005~1009 —— 起始编号正好接在上一段确认号之后。'},
    {title:'步骤 4 · 1005 段丢了, 1010 段先发出',chip:'丢包 + 乱序',chipC:'cd',cells:mk({acked:[[0,4]],lost:[[5,9]],sent:[[10,14]]}),segs:['ok','lost','fly'],ack:1005,hl:[3,4],
     note:'丢包与乱序同时发生：seq=1005 丢失, seq=1010 在路上',
     desc:'seq=1005 这一段<span class="dg">在途中丢失（或迟到）</span>。发送方并不知情，又发出了下一段 <span class="bl">seq=1010, len=5</span>（"Again"，1010~1014）—— 真实网络里，后发的报文完全可能先到。'},
    {title:'步骤 5 · ack 卡在缺口 1005',chip:'ack 卡在 1005',chipC:'cd',cells:mk({acked:[[0,4]],lost:[[5,9]],buf:[[10,14]]}),segs:['ok','lost','buf'],ack:1005,stuck:true,hl:[5],
     note:'ack 不动 · 1010 段先放进接收缓冲区(橙色)',
     desc:'接收方收到了 1010~1014，但 <span class="dg">1005~1009 还缺着</span>。累计确认只认"连续"：<b>ack 卡在缺口处，仍然是 1005</b>；先到的 1010 段放进接收缓冲区暂存（橙色），还不能交付给应用层。'},
    {title:'步骤 6 · 重传 1005 到达, ack 跳到 1015',chip:'ack=1015',chipC:'cg',cells:mk({acked:[[0,14]]}),segs:['ok','ok','ok'],ack:1015,hl:[6,7],
     note:'缺口补齐 → ack 从 1005 一步跳到 1015',
     desc:'重传（或迟到）的 1005 段终于到达，<b>缺口补齐</b>。1005~1014 变成连续字节一起交付，ack 从 1005 <span class="gr">直接跳到 1015</span> —— 一个 ACK 一次性确认了 10 个字节。'},
    {title:'步骤 7 · 为什么按字节而不是按包编号',chip:'按字节编号',chipC:'cg',cells:mk({acked:[[0,14]]}),segs:['ok','ok','ok'],ack:1015,hl:[],
     note:'按字节编号 = 拆包 / 合包 / 乱序 / 重传 全兼容',
     desc:'因为编号落在<b>字节</b>上，无论拆包、合包、乱序还是重传，双方永远能对齐"哪些字节到了、哪些缺了、从哪里续传"。这就是 Seq/Ack 设计成<b>按字节</b>而不是按包的原因。读报文口诀：<b>先看 Seq（数据从哪个字节开始），再看 Ack（对方期待哪个字节）</b>。'},
  ];
  function mount(){
    let cells='';
    for(let i=0;i<N;i++)cells+='<div class="byte" id="sa-b'+i+'">'+CH[i]+'<span class="bnum">'+(1000+i)+'</span></div>';
    viz.innerHTML='<div class="vcap"><b>Seq/Ack 按字节推进</b>：TCP 编号的是字节流，Ack = 下一个期待的字节</div>'+
      '<div class="sa-wrap" id="saWrap">'+
        '<div class="sa-ruler" id="saRuler">'+cells+'</div>'+
        '<div class="seg" id="sa-s0">seq=1000 len=5</div>'+
        '<div class="seg" id="sa-s1">seq=1005 len=5</div>'+
        '<div class="seg" id="sa-s2">seq=1010 len=5</div>'+
        '<div class="ackbadge" id="saAck">ack=1000</div>'+
      '</div>'+
      '<div class="water"><span class="wlbl">接收方"已连续收到"水位（随 ack 推进）</span><div class="wtrack" id="saTrack"><div class="wfill" id="saFill"></div></div></div>'+
      '<div class="op-note" id="saNote"></div>';
    layout();
  }
  function layout(){
    cellL=[];let last=null;
    for(let i=0;i<N;i++){const e=el('sa-b'+i);cellL.push(e.offsetLeft);last=e;}
    cellW=last.offsetWidth;
    cellREnd=last.offsetLeft+last.offsetWidth;
    [[0,4],[5,9],[10,14]].forEach((r,i)=>{
      const e=el('sa-s'+i);
      e.style.left=cellL[r[0]]+'px';
      e.style.width=(cellL[r[1]]+cellW-cellL[r[0]])+'px';
    });
    el('saTrack').style.width=(cellREnd-cellL[0])+'px';
  }
  function bx(ack){
    const idx=ack-1000;
    return idx<N?cellL[idx]-1.5:cellREnd+1.5;
  }
  function paint(s){
    for(let i=0;i<N;i++){
      el('sa-b'+i).className='byte'+(s.cells[i]?' '+s.cells[i]:'');
    }
    s.segs.forEach((c,i)=>{el('sa-s'+i).className='seg'+(c?' '+c:'');});
    const b=el('saAck');
    b.textContent='ack='+s.ack;
    b.style.left=bx(s.ack)+'px';
    b.classList.toggle('stuck',!!s.stuck);
    el('saFill').style.width=Math.max(0,bx(s.ack)-cellL[0])+'px';
    el('saNote').innerHTML=s.note||'';
    hlLines('sa',8,s.hl);
  }
  return {id:'seqack',label:'Seq/Ack 字节推进',sub:'ack = 下一个期待字节',steps,mount,paint,layout,code};
})();

/* ========== 场景 2：SYN / FIN 占序号 ========== */

    {dir:'s2c',lbl:'ACK（ack=501）',at:5},
  ];
  const steps=[
    {title:'步骤 0 · SYN 没带数据, 为什么 ack=101?',chip:'先抛问题',chipC:'c0',ack:null,hl:[0],
     note:'序号轴 = 客户端 → 服务器方向, 每个格子一个序号',
     desc:'三次握手里客户端发 <code>SYN(seq=100)</code>，服务器却回 <code>ack=101</code> —— SYN 明明<b>没带任何业务数据</b>，为什么确认号不是 100？下面用"序号轴"看清这件事：<b>SYN 和 FIN 都要在序号轴上占一个格子</b>。'},
    {title:'步骤 1 · 客户端发 SYN（seq=100）',chip:'SYN 占住 100',chipC:'cb',ack:null,hl:[1],
     note:'SYN 是序号轴上 100 号格子的占用者',
     desc:'客户端发起连接：<span class="bl">SYN（seq=100）</span>。它虽然不携带业务数据，但在客户端发送方向的序号轴上，SYN <b>占住了 100 号格子</b> —— 相当于这条字节流"第 100 号位置"被它用掉了。'},
    {title:'步骤 2 · 服务器回 ack=101',chip:'ack = 100 + 1',chipC:'ch',ack:101,hl:[2],
     note:'SYN 消耗一个序号 → ack = 100 + 1 = 101',
     desc:'服务器回 <span class="br">SYN+ACK（seq=300, ack=101）</span>：ack=101 的意思是"<b>你的 SYN(seq=100) 我收到了，下一步请从 101 开始</b>"。因为 SYN 占了 100 号，确认号才是 100+1。seq=300 是服务器自己发送方向的初始序号。'},
    {title:'步骤 3 · 业务数据从 seq=101 开始',chip:'数据紧跟 SYN',chipC:'cb',ack:101,hl:[3],
     note:'数据编号 101、102、103 … 100 号不再给数据用',
     desc:'连接建立后，正式业务数据<b>紧跟在 SYN 之后</b>，从 <span class="bl">seq=101</span> 开始编号 —— 101、102、103……SYN 占掉的 100 号不会再分配给数据。'},
    {title:'步骤 4 · 客户端发 FIN（seq=500）',chip:'FIN 占住 500',chipC:'cb',ack:101,hl:[4],
     note:'数据发到 499 为止, FIN 占住 500 号格子',
     desc:'假设数据一直发到 499 号字节。客户端没有数据要发了，发出 <span class="bl">FIN（seq=500）</span> —— FIN 同样不带业务数据，但也在序号轴上<b>占住 500 号格子</b>。'},
    {title:'步骤 5 · 服务器回 ack=501',chip:'ack = 500 + 1',chipC:'ch',ack:501,hl:[5],
     note:'FIN 消耗一个序号 → ack = 500 + 1 = 501',
     desc:'服务器回 <span class="br">ACK（ack=501）</span>："<b>你这个 FIN 我收到了，你的发送流到 500 为止，下一个编号应该是 501</b>"。FIN 和 SYN 一样，各消耗一个序号。'},
    {title:'步骤 6 · 口诀：SYN/FIN 各占一号',chip:'SYN/FIN 各占一号',chipC:'cg',ack:501,hl:[6],
     note:'Seq 看起点 · Ack 看期待 · SYN/FIN 各占一号',
     desc:'读 TCP 报文三步走：先看 <b>Seq</b> —— 这段数据从哪个字节开始；再看 <b>Ack</b> —— 对方期待哪个字节；最后看标志位 —— 建连、确认还是断连。并记住：<b>SYN/FIN 不带数据但各占一号，所以对它们的确认 Ack 会 +1</b>。'},
  ];
  function cellCls(row,i,st){
    if(row==='a'){
      if(i===1&&st>=1)return 'ctrl';
      if(i>=2&&i<=4&&st>=3)return 'data';
    }else{
      if(i===1&&st>=4)return 'data';
      if(i===2&&st>=4)return 'ctrl';
    }
    return '';
  }
  function mount(){
    const cells=(arr,sub,pfx)=>arr.map((v,i)=>'<div class="byte'+(v==='…'?' dots':'')+'" id="sf-'+pfx+i+'">'+v+'<span class="bnum">'+(sub[i]||'&nbsp;')+'</span></div>').join('');
    let chips='';
    MS.forEach((m,i)=>{
      chips+='<div class="mchip '+m.dir+'" id="sf-m'+i+'" style="top:'+(44+i*28)+'px">'+(m.dir==='c2s'?m.lbl+' ▸':'◂ '+m.lbl)+'</div>';
    });
    viz.innerHTML='<div class="vcap"><b>SYN / FIN 占序号</b>：不带业务数据，但各消耗一个序号（下图为客户端发送方向的序号轴）</div>'+
      '<div class="sf-axes" id="sfAxes">'+

        '<div class="ackbadge up" id="sfAck" style="opacity:0">ack=?</div>'+
      '</div>'+
      '<div class="mini-life" id="sfLife">'+
        '<div class="ml-head" style="left:15%">客户端</div>'+
        '<div class="ml-head s" style="left:85%">服务器</div>'+
        '<div class="ml-line" style="left:15%"></div>'+
        '<div class="ml-line s" style="left:85%"></div>'+
        chips+
      '</div>'+
      '<div class="op-note" id="sfNote"></div>';
    layout();
  }
  function layout(){
    const a=el('sf-a2'),b=el('sf-b3'); // 101 号格子 与 501 号格子
    posA={x:a.offsetLeft-1.5,y:a.offsetTop+a.offsetHeight+8};
    posB={x:b.offsetLeft-1.5,y:b.offsetTop+b.offsetHeight+8};
  }
  function paint(s){
    const st=s._i;
    A.forEach((v,i)=>{
      const c=cellCls('a',i,st);
      el('sf-a'+i).className='byte'+(v==='…'?' dots':'')+(c?' '+c:'');
    });
    B.forEach((v,i)=>{
      const c=cellCls('b',i,st);
      el('sf-b'+i).className='byte'+(v==='…'?' dots':'')+(c?' '+c:'');
    });
    const badge=el('sfAck');
    if(s.ack===null){badge.style.opacity='0';}
    else{
      const p=s.ack===101?posA:posB;
      badge.style.opacity='1';
      badge.style.left=p.x+'px';badge.style.top=p.y+'px';
      badge.textContent='ack='+s.ack;
    }
    MS.forEach((m,i)=>{
      const chip=el('sf-m'+i);
      const from=m.dir==='c2s'?15:85,to=m.dir==='c2s'?85:15;
      const mode=st<m.at?'pre':(st===m.at?'now':'past');
      chip.style.left=(mode==='pre'?from:to)+'%';
      chip.className='mchip '+m.dir+' '+mode;
    });
    el('sfNote').innerHTML=s.note||'';
    hlLines('sf',7,s.hl);
  }
  return {id:'synfin',label:'SYN/FIN 占序号',sub:'ack 为什么要 +1',steps,mount,paint,layout,code};
})();

/* ========== 场景 3：连接全生命周期 ========== */
const lifeScene=(()=>{
  const MS=[
    {dir:'c2s',lbl:'SYN（seq=100）',at:1},

    {dir:'s2c',lbl:'FIN（seq=900）',at:8},
    {dir:'c2s',lbl:'ACK（ack=901）',at:9},
  ];
  const stC=['CLOSED','SYN_SENT','SYN_SENT','ESTABLISHED','ESTABLISHED','ESTABLISHED','FIN_WAIT_1','FIN_WAIT_2','FIN_WAIT_2','TIME_WAIT','TIME_WAIT·2MSL','CLOSED'];
  const stS=['LISTEN','LISTEN','SYN_RCVD','ESTABLISHED','ESTABLISHED','ESTABLISHED','ESTABLISHED','CLOSE_WAIT','LAST_ACK','LAST_ACK','CLOSED','CLOSED'];
  const lit=new Set();
  let xC=180,xS=440;
  const rowY=i=>96+i*30;
  const code=[
    '<span class="cmt">// 服务器先就位</span>',
    'S: socket(); bind(); listen();',
    '<span class="cmt">// 建立连接 —— 三次握手</span>',
    'C: connect();              <span class="cmt">// SYN → SYN+ACK → ACK</span>',
    'S: accept() 返回;           <span class="cmt">// 双方 ESTABLISHED</span>',
    '<span class="cmt">// 数据传输 —— 按字节累计确认</span>',
    'C: write(buf);             <span class="cmt">// 数据 seq=101</span>',
    'S: read(buf); 回 ACK;       <span class="cmt">// ack=102+ 持续推进</span>',
    '<span class="cmt">// 断开连接 —— 四次挥手</span>',
    'C: close();                <span class="cmt">// FIN(seq=500) → 收 ack=501</span>',
    'S: read()==0; close();     <span class="cmt">// FIN(seq=900) → 收 ack=901</span>',
    'C: TIME_WAIT 等 2MSL → CLOSED'
  ].map((l,i)=>'<div class="cl" id="lf-l'+i+'">'+l+'</div>').join('');
  const steps=[
    {title:'步骤 0 · 服务器 LISTEN, 客户端 CLOSED',chip:'LISTEN 就位',chipC:'c0',hl:[1],
     desc:'服务器先 <code>socket() → bind() → listen()</code> 进入 <b>LISTEN</b>，被动等待连接；客户端此时还是 CLOSED。接下来客户端调用 <code>connect()</code>，触发三次握手。'},
    {title:'步骤 1 · 握手① SYN（seq=100）',chip:'握手 1/3',chipC:'cb',hl:[3],
     desc:'握手 ①：客户端发 <span class="bl">SYN（seq=100）</span>，进入 <b>SYN_SENT</b>。这一步只能证明"<b>客户端能发</b>"。'},
    {title:'步骤 2 · 握手② SYN+ACK（seq=300, ack=101）',chip:'握手 2/3',chipC:'ch',hl:[3],
     desc:'握手 ②：服务器回 <span class="br">SYN+ACK（seq=300, ack=101）</span>，进入 <b>SYN_RCVD</b>。它证明"<b>服务器能收、也能发</b>"；ack=101 是因为 SYN 占了一个序号。'},
    {title:'步骤 3 · 握手③ ACK（seq=101, ack=301）→ 建立',chip:'ESTABLISHED',chipC:'cg',hl:[4],
     desc:'握手 ③：客户端回 <span class="bl">ACK（seq=101, ack=301）</span>，双方进入 <b>ESTABLISHED</b>，<code>accept()</code> 返回。三次握手补齐了"<b>双向都能收发</b>"的最小确认链路 —— 这就是为什么必须三次而不是两次。'},
    {title:'步骤 4 · 数据（seq=101）',chip:'seq=101',chipC:'cb',hl:[6],

    {title:'步骤 5 · ACK（ack=102+）累计确认推进',chip:'ack=102+',chipC:'ch',hl:[7],
     desc:'服务器回 <span class="br">ACK（ack=102+）</span>：收到多少连续字节，ack 就推进到多少 —— <b>累计确认持续推进</b>，这就是数据传输阶段的日常节奏。'},
    {title:'步骤 6 · 挥手① FIN（seq=500）',chip:'挥手 1/4',chipC:'cb',hl:[9],

    {title:'步骤 7 · 挥手② ACK（ack=501）',chip:'挥手 2/4',chipC:'ch',hl:[9],
     desc:'挥手 ②：服务器先回 <span class="br">ACK（ack=501）</span>（FIN 占一号，500+1），进入 <b>CLOSE_WAIT</b>；客户端进入 FIN_WAIT_2。此时服务器<b>可能还有剩余数据要发</b> —— 这就是"确认 FIN"和"我也关闭"不能合并、挥手要四次的原因。'},
    {title:'步骤 8 · 挥手③ FIN（seq=900）',chip:'挥手 3/4',chipC:'ch',hl:[10],

      '<div class="life" id="lfBox">'+
        '<svg class="lf-svg" id="lfSvg"></svg>'+

  function layout(){
    const box=el('lfBox');

      el('lf-m'+i).style.top=(y-24)+'px';
    });
    svg.innerHTML=sv;
    el('lfP0').style.top='92px';
    el('lfP1').style.top='184px';
    el('lfP2').style.top='262px';
    const tw=el('lfTw');
    tw.style.left=xC+'px';tw.style.top=(rowY(9)-10)+'px';
  }
  function lineH(st){
    if(st===0)return 26;
    if(st<=9)return rowY(st-1)+14-58;
    return rowY(9)+18-58;
  }
  function setBadge(e,txt){
    if(e.textContent!==txt){
      e.textContent=txt;
      e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');
    }
  }
  function paint(s){
    const st=s._i;
    el('lfLc').style.height=lineH(st)+'px';
    el('lfLs').style.height=lineH(st)+'px';
    setBadge(el('lfSc'),stC[st]);
    setBadge(el('lfSs'),stS[st]);
    MS.forEach((m,i)=>{
      const chip=el('lf-m'+i),p=el('lf-p'+i),a=el('lf-a'+i),o=el('lf-o'+i);
      const from=m.dir==='c2s'?xC:xS,to=m.dir==='c2s'?xS:xC;
      const mode=st<m.at?'pre':(st===m.at?'now':'past');
      chip.style.left=(mode==='pre'?from:to)+'px';
      chip.className='mchip '+m.dir+' '+mode;
      p.setAttribute('class','msg '+mode);
      a.setAttribute('class','arrow '+mode);
      o.setAttribute('class','port '+mode);
      if(mode==='now'&&!lit.has(i)){drawIn(p);lit.add(i);}
      if(mode==='past')lit.add(i);
      if(mode==='pre')lit.delete(i);
    });
    el('lfP0').classList.toggle('on',(st>=1&&st<=3)||st===11);
    el('lfP1').classList.toggle('on',(st>=4&&st<=5)||st===11);
    el('lfP2').classList.toggle('on',(st>=6&&st<=10)||st===11);
    el('lfTw').classList.toggle('on',st>=10);
    hlLines('lf',12,s.hl);
  }
  return {id:'lifecycle',label:'连接全生命周期',sub:'3 包建连 · 4 包断连',steps,mount,paint,layout,code};
})();

/* ========== 引擎 ========== */
const SCENES=[seqScene,synScene,lifeScene];
SCENES.forEach(sc=>sc.steps.forEach((s,i)=>{s._i=i;}));
const tabsBox=document.getElementById('tabs');
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stAct=document.getElementById('stAct'),stDesc=document.getElementById('stDesc');
const codeBox=document.getElementById('codeBox'),readout=document.getElementById('readout'),dotsBox=document.getElementById('dots');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');

SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML='<span class="t">'+sc.label+'</span><span class="s">'+sc.sub+'</span>';b.onclick=()=>{stop();switchScene(i);};tabsBox.appendChild(b);});
let si=0,cur=0,dotEls=[];
function switchScene(i){
  si=i;cur=0;
  [...tabsBox.children].forEach((t,idx)=>t.classList.toggle('on',idx===si));
  SCENES[si].mount();codeBox.innerHTML=SCENES[si].code;
  dotsBox.innerHTML='';dotEls=[];
  SCENES[si].steps.forEach((s,idx)=>{const d=document.createElement('button');d.className='dot';d.title=s.title;d.onclick=()=>{stop();go(idx);};dotsBox.appendChild(d);dotEls.push(d);});
  go(0);
}
function go(i){
  const steps=SCENES[si].steps;cur=Math.max(0,Math.min(steps.length-1,i));const s=steps[cur];
  SCENES[si].paint(s);
  stTitle.textContent=SCENES[si].label;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;stAct.innerHTML='▸ '+s.title;stDesc.innerHTML=s.desc;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(steps.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
  if(cur===steps.length-1)stop();
}
let timer=null,ms=2500;
function play(){const steps=SCENES[si].steps;if(cur===steps.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<SCENES[si].steps.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
window.addEventListener('resize',()=>{const sc=SCENES[si];if(sc.layout)sc.layout();sc.paint(sc.steps[cur]);});
const hm=location.hash.match(/scene=(\w+)/),sm=location.hash.match(/step=(\d+)/);
let initScene=0;if(hm){const idx=SCENES.findIndex(x=>x.id===hm[1]);if(idx>=0)initScene=idx;}
switchScene(initScene);if(sm)go(+sm[1]);
</script>
