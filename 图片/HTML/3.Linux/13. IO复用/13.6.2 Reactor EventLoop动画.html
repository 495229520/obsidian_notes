<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reactor 与 EventLoop 动画 · 角色映射 · 事件循环 · 读写路径 · one loop per thread</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFBF6;--ink:#2B2A26;--muted:#6B675C;--faint:#9B968A;
  --line:#D8D5C8;--grid:#D8D5C8;
  --blue:#3D5A80;--bluebg:#E3EAF4;--bluetx:#2C4460;
  --green:#2F6B5E;--greenbg:#DCE9E3;--greentx:#24473F;
  --amber:#8A6A3A;--amberbg:#EFE7DA;--ambertx:#6B4E28;
  --danger:#A64B3C;--dangerbg:#F0E0DB;--dangertx:#733428;
  --gray:#F1EFE8;--arrow:#5A564B;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 48px;text-wrap:pretty;}
.wrap{max-width:1240px;margin:0 auto;}
header h1{font-size:22px;font-weight:700;letter-spacing:.2px;color:var(--ink);}
header p{font-size:13px;color:var(--muted);margin-top:6px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.tabs{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.tab{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel);border:1.2px solid var(--line);border-radius:11px;padding:10px 18px;cursor:pointer;transition:all .18s var(--ease);display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
.tab:hover{border-color:var(--muted);transform:translateY(-1px);}
.tab .t{font-weight:700;color:var(--ink);}
.tab .s{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 10px rgba(43,42,38,.16);}
.tab.on .t,.tab.on .s{color:var(--paper);}
.tab.on .s{opacity:.75;}

.layout{display:grid;grid-template-columns:680px 1fr;gap:28px;margin-top:22px;align-items:start;}
@media(max-width:1280px){.layout{grid-template-columns:1fr;}}
.viz{background:var(--panel);border:1.2px solid var(--grid);border-radius:14px;padding:24px;min-height:520px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.viz .vcap{font-size:13px;color:var(--muted);margin-bottom:16px;}
.viz .vcap b{color:var(--ink);font-weight:700;}

/* ===== 统一连线系统：端口圆 + 线 + 实心三角 ===== */
.arr-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.wire{--wc:var(--arrow);fill:none;stroke:var(--wc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity var(--dur) var(--ease),stroke-dashoffset var(--dur) var(--ease);}
.warrow{--wc:var(--arrow);fill:var(--wc);stroke:none;opacity:0;transition:opacity 240ms var(--ease);}
.wport{--wc:var(--arrow);fill:var(--panel);stroke:var(--wc);stroke-width:2;opacity:0;transition:opacity 240ms var(--ease);}
.wire.on,.warrow.on,.wport.on{opacity:1;}
.wire.hint{stroke-width:2;opacity:.1;}
.warrow.hint,.wport.hint{opacity:.1;}
.warrow.drawing{transition-delay:200ms;}
.wire.blue,.warrow.blue,.wport.blue{--wc:var(--blue);}
.wire.green,.warrow.green,.wport.green{--wc:var(--green);}
.wire.amber,.warrow.amber,.wport.amber{--wc:var(--amber);}
.wire.danger,.warrow.danger,.wport.danger{--wc:var(--danger);}
.wlabel{position:absolute;z-index:3;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:2px 7px;border-radius:6px;opacity:0;transform:translate(-50%,-50%);transition:opacity var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease);white-space:nowrap;pointer-events:none;}
.wlabel.on{opacity:1;}
.wlabel.blue{color:var(--bluetx);border-color:var(--blue);}
.wlabel.green{color:var(--greentx);border-color:var(--green);}
.wlabel.amber{color:var(--ambertx);border-color:var(--amber);}

/* ===== 角色映射 ===== */
.role-stage{position:relative;width:632px;height:420px;margin:0 auto;}
.role-box{position:absolute;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);transform:scale(1);transform-origin:center;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);opacity:.32;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 12px;gap:3px;}
.role-box.lit{opacity:1;border-color:var(--ink);box-shadow:0 0 0 1.5px rgba(43,42,38,.08);transform:scale(1.012);}
.role-box.b{border-color:var(--blue);background:var(--bluebg);}
.role-box.g{border-color:var(--green);background:var(--greenbg);}
.role-box.h{border-color:var(--amber);background:var(--amberbg);}
.role-box .zt{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--faint);line-height:1.2;}
.role-box.b .zt{color:var(--blue);}
.role-box.g .zt{color:var(--green);}
.role-box.h .zt{color:var(--amber);}
.role-box .nm{font-size:14px;font-weight:700;color:var(--ink);line-height:1.25;white-space:nowrap;}
.role-box .ds{font-size:11.5px;color:var(--muted);line-height:1.35;white-space:nowrap;}
.role-badge{position:absolute;left:50%;top:392px;transform:translateX(-50%);font-size:12px;font-weight:700;border:1.5px solid;border-radius:999px;padding:5px 14px;opacity:0;transition:opacity var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);white-space:nowrap;text-align:center;}
.role-badge.on{opacity:1;}
.role-badge.b{color:var(--bluetx);border-color:var(--blue);background:var(--bluebg);}
.role-badge.g{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.role-badge.h{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}

/* ===== 事件循环 ===== */
.loop-stage{position:relative;width:632px;height:420px;margin:0 auto;}
.loop-shell{position:absolute;inset:4px;border:1.5px solid var(--grid);border-radius:14px;background:var(--paper);transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);}
.loop-shell.lit{border-color:var(--ink);background:#F9F8F2;}
.loop-shell-title{position:absolute;left:18px;top:10px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);}
.loop-shell-sub{position:absolute;right:18px;top:10px;font-size:11px;color:var(--faint);}
.loop-track{position:absolute;font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.3px;}
.loop-box{position:absolute;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;opacity:.28;transform:scale(.985);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.loop-box.preview{opacity:.35;border-style:dashed;}
.loop-box.on{opacity:1;transform:scale(1);border-style:solid;}
.loop-box.active{transform:scale(1.025);box-shadow:0 0 0 1.5px rgba(43,42,38,.08);}
.loop-box.done{opacity:.66;}
.loop-box.blue{border-color:var(--blue);background:var(--bluebg);}
.loop-box.green{border-color:var(--green);background:var(--greenbg);}
.loop-box.amber{border-color:var(--amber);background:var(--amberbg);}
.loop-box .k{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;}
.loop-box .s,.loop-status{font-size:10.5px;color:var(--muted);white-space:nowrap;}
.loop-list{justify-content:flex-start;padding-top:9px;}
.loop-list .k{margin-bottom:4px;}
.loop-item{position:absolute;left:10px;right:10px;height:31px;border:1.5px solid var(--line);border-radius:7px;background:var(--gray);font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateX(-5px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);white-space:nowrap;}
.loop-item.on{opacity:1;transform:translateX(0);}
.loop-item.current{border-color:var(--green);background:var(--greenbg);color:var(--green);box-shadow:0 0 0 1.5px rgba(47,107,94,.14);transform:scale(1.025);}
.loop-item.done{border-color:var(--blue);background:var(--bluebg);color:var(--blue);}
.loop-item.task{border-color:var(--amber);background:var(--amberbg);color:var(--amber);}
.loop-empty{position:absolute;left:10px;right:10px;bottom:10px;height:31px;border:1.5px dashed var(--line);border-radius:7px;font-family:var(--mono);font-size:10.5px;color:var(--faint);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur) var(--ease);}
.loop-empty.on{opacity:1;}
.loop-note{position:absolute;left:50%;top:378px;transform:translateX(-50%);width:max-content;max-width:580px;border:1.5px solid var(--line);border-radius:999px;padding:5px 13px;font-size:11px;font-weight:700;color:var(--muted);background:var(--panel);opacity:0;transition:opacity var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),background-color var(--dur) var(--ease);white-space:nowrap;z-index:4;}
.loop-note.on{opacity:1;}.loop-note.g{border-color:var(--green);color:var(--green);background:var(--greenbg);}.loop-note.h{border-color:var(--amber);color:var(--amber);background:var(--amberbg);}.loop-note.d{border-color:var(--danger);color:var(--danger);background:var(--dangerbg);}

/* ===== 读写路径 ===== */
.path-stage{position:relative;width:632px;height:420px;margin:0 auto;}
.path-lane{position:absolute;left:4px;right:4px;height:108px;border:1.5px solid var(--grid);border-radius:12px;background:var(--paper);transform:scale(1);transform-origin:center;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);opacity:.35;}
.path-lane.lit{opacity:1;transform:scale(1.006);}
.path-lane.done{opacity:.66;}
.path-lane.future{opacity:.3;}
#pl1.lit{border-color:var(--blue);background:#F8FAFC;}
#pl2.lit{border-color:var(--green);background:#F7FAF8;}
#pl3.lit{border-color:var(--amber);background:#FBF9F5;}
.path-lane .zt{position:absolute;top:10px;left:16px;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--faint);white-space:nowrap;transition:color var(--dur) var(--ease),transform var(--dur) var(--ease);}
#pl1.lit .zt{color:var(--blue);transform:translateX(3px);}
#pl2.lit .zt{color:var(--green);transform:translateX(3px);}
#pl3.lit .zt{color:var(--amber);transform:translateX(3px);}
.path-step{position:absolute;height:40px;min-width:96px;border-radius:8px;border:1.5px solid var(--line);background:var(--gray);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0 10px;transform:scale(1);transform-origin:center;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);opacity:0;white-space:nowrap;text-align:center;}
.path-step.on{opacity:1;}
.path-step.preview{opacity:.25;transform:scale(.985);background:transparent;border-style:dashed;}
.path-step.enter{animation:pathStepIn 360ms var(--ease) both;}
.path-step.act{border-color:var(--blue);background:var(--bluebg);color:var(--blue);box-shadow:0 0 0 1.5px rgba(61,90,128,.16);transform:scale(1.04);}
.path-step.ok{border-color:var(--green);background:var(--greenbg);color:var(--green);}
.path-step.warn{border-color:var(--amber);background:var(--amberbg);color:var(--amber);}
.path-step.bad{border-color:var(--danger);background:var(--dangerbg);color:var(--danger);}
@keyframes pathStepIn{from{opacity:0;transform:translateX(-7px) scale(.98);}to{opacity:1;}}
.path-tag{position:absolute;font-size:12px;font-weight:700;border-radius:999px;border:1.5px solid;padding:6px 14px;opacity:0;transition:opacity var(--dur) var(--ease);white-space:nowrap;text-align:center;}
.path-tag.on{opacity:1;}
.path-tag.g{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.path-tag.d{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}
.path-tag.h{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}

/* ===== 多线程 ===== */
.mt-stage{position:relative;width:632px;height:420px;margin:0 auto;}
.mt-box{position:absolute;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);transform:scale(1);transform-origin:center;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);opacity:.35;display:flex;flex-direction:column;align-items:center;padding:12px 12px 14px;}
.mt-box.lit{opacity:1;border-color:var(--ink);box-shadow:0 0 0 2px rgba(43,42,38,.08);transform:scale(1.012);}
.mt-box.main{border-color:var(--blue);background:linear-gradient(180deg,#F7FAFD 0%,var(--paper) 48%);}
.mt-box.sub{border-color:var(--green);background:linear-gradient(180deg,#F5FAF7 0%,var(--paper) 48%);}
.mt-box.work{border-color:var(--amber);background:linear-gradient(180deg,#FBF7F0 0%,var(--paper) 48%);}
.mt-box.lit.main{background:var(--bluebg);}
.mt-box.lit.sub{background:var(--greenbg);}
.mt-box.lit.work{background:var(--amberbg);}
.mt-box .zt{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--faint);white-space:nowrap;line-height:1.2;}
.mt-box.main .zt{color:var(--blue);}
.mt-box.sub .zt{color:var(--green);}
.mt-box.work .zt{color:var(--amber);}
.mt-box .nm{margin-top:4px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;text-align:center;line-height:1.25;}
.mt-box .subline{margin-top:2px;font-size:11px;color:var(--muted);white-space:nowrap;text-align:center;}
.mt-chip{position:absolute;height:38px;min-width:0;border-radius:8px;border:1.5px solid var(--line);background:var(--gray);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0 10px;transform:scale(1);transform-origin:center;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);opacity:0;white-space:nowrap;text-align:center;}
.mt-chip.on{opacity:1;}
.mt-chip.b{border-color:var(--blue);background:var(--bluebg);color:var(--blue);}
.mt-chip.g{border-color:var(--green);background:var(--greenbg);color:var(--green);}
.mt-chip.h{border-color:var(--amber);background:var(--amberbg);color:var(--amber);}
.mt-chip.fly{box-shadow:0 0 0 2px rgba(138,106,58,.22);transform:scale(1.045);}
.mt-note{position:absolute;left:50%;width:max-content;max-width:590px;transform:translateX(-50%);font-size:12.5px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;padding:8px 18px;opacity:0;transition:opacity var(--dur) var(--ease);white-space:nowrap;text-align:center;}
.mt-note.on{opacity:1;}
.mt-note.g{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.mt-note.d{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}
.mt-note.h{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}

/* 右侧 */
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1.2px solid var(--grid);border-radius:14px;padding:18px 20px;min-height:196px;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:700;}
#stAct{margin-top:14px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1.2px solid var(--line);padding:10px 14px;border-radius:9px;}
.chip{font-size:11px;font-weight:700;padding:3px 11px;border-radius:999px;border:1.2px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cb{color:var(--bluetx);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}
.chip.cd{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}
.desc-body{margin-top:10px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .bl{color:var(--blue);font-weight:700;}
.desc-body .gr{color:var(--green);font-weight:700;}
.desc-body .dg{color:var(--danger);font-weight:700;}
.desc-body .hb{color:var(--amber);font-weight:700;}
.codebox{background:#2E2C27;border-radius:11px;padding:12px 0;font-family:var(--mono);font-size:13px;line-height:1.6;color:#D8D5CC;white-space:pre;box-shadow:0 2px 8px rgba(46,44,39,.18);}
.codebox .cmt{color:#8F8B80;} .codebox .kw{color:#E3A44C;}
.codebox .cl{padding:2px 16px;transition:background .3s var(--ease),color .3s var(--ease);}
.codebox .cl.hl{background:rgba(52,122,198,.52);box-shadow:inset 4px 0 0 #82B4E8;color:#F7F4EA;}
.codebox .cl.hl .cmt{color:#CCC8BA;}

.controls{margin-top:22px;background:var(--panel);border:1.2px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1.2px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:92px;}
.dots{display:flex;gap:7px;margin:0 auto;flex-wrap:wrap;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Reactor 与 EventLoop · 从 epoll 就绪到对象回调</h1>
    <p>配套笔记《13.6 Reactor模式与EventLoop》《13.6.1 回调函数与Reactor事件分发》 · epoll 发现就绪 · EventLoop 分发 · Channel 回调 · EPOLLOUT 按需 · one loop per thread　·　上方切场景，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <section class="viz" id="viz"></section>
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="act" id="stAct"></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
      <div class="codebox" id="codeBox"></div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
const viz=document.getElementById('viz');
const el=id=>document.getElementById(id);
const codeOf=lines=>lines.map(l=>'<div class="cl">'+l+'</div>').join('');

/* ===== 共享连线引擎：每条连线 = 线 path + 三角 head + 端口 circle ===== */
const trioHTML=id=>`<path id="${id}" class="wire"/><path id="${id}-head" class="warrow"/><circle id="${id}-port" class="wport" r="4"/>`;
const trio=id=>[el(id),el(id+'-head'),el(id+'-port')];
function motionKit(){
  let timers=[],token=0;
  const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  return {
    reduced,
    schedule(fn,delay){const t=token;if(reduced())fn();else timers.push(setTimeout(()=>{if(t===token)fn();},delay));},
    later(fn,delay){const t=token;timers.push(setTimeout(()=>{if(t===token)fn();},delay));},
    clear(){token++;timers.forEach(clearTimeout);timers=[];}
  };
}
function setW(id,state='',color=''){
  const sfx=(state?' '+state:'')+(color?' '+color:'');
  const [p,a,o]=trio(id);
  p.setAttribute('class','wire'+sfx);a.setAttribute('class','warrow'+sfx);o.setAttribute('class','wport'+sfx);
  p.style.strokeDasharray='';p.style.strokeDashoffset='';p.style.transition='';a.classList.remove('drawing');
}
function drawW(motion,id,color){
  setW(id,'on',color);
  const [p,a]=trio(id);
  if(motion.reduced())return;
  const L=p.getTotalLength();
  p.style.transition='none';p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
  a.classList.add('drawing');void p.getBoundingClientRect();
  p.style.transition='';p.style.strokeDashoffset='0';
  motion.later(()=>{p.style.strokeDasharray='';p.style.strokeDashoffset='';a.classList.remove('drawing');},560);
}
/* 折线箭头：最后一段水平或垂直，三角顶点顶到终点 */
function polyArrow(id,points){
  const p=el(id),a=el(id+'-head'),o=el(id+'-port');
  const start=points[0],tip=points[points.length-1],prev=points[points.length-2];
  let base={x:tip.x,y:tip.y},dHead;
  const horizontal=Math.abs(tip.x-prev.x)>=Math.abs(tip.y-prev.y);
  if(horizontal){const dir=Math.sign(tip.x-prev.x)||1;base.x=tip.x-dir*9;dHead=`M ${tip.x} ${tip.y} L ${base.x} ${tip.y-5} L ${base.x} ${tip.y+5} Z`;}
  else{const dir=Math.sign(tip.y-prev.y)||1;base.y=tip.y-dir*9;dHead=`M ${tip.x} ${tip.y} L ${tip.x-5} ${base.y} L ${tip.x+5} ${base.y} Z`;}
  const pts=[...points.slice(0,-1),base];
  let d=`M ${pts[0].x} ${pts[0].y}`;for(let i=1;i<pts.length;i++)d+=` L ${pts[i].x} ${pts[i].y}`;
  p.setAttribute('d',d);a.setAttribute('d',dHead);o.setAttribute('cx',start.x);o.setAttribute('cy',start.y);
}
/* 贝塞尔箭头：左出右进，两端水平切线 */
function bezierArrow(id,x1,y1,tipX,tipY){
  const baseX=tipX-9,gap=Math.max(1,baseX-x1),c1=x1+gap*.45,c2=x1+gap*.55;
  el(id).setAttribute('d',`M ${x1} ${y1} C ${c1} ${y1}, ${c2} ${tipY}, ${baseX} ${tipY}`);
  el(id+'-head').setAttribute('d',`M ${tipX} ${tipY} L ${baseX} ${tipY-5} L ${baseX} ${tipY+5} Z`);
  el(id+'-port').setAttribute('cx',x1);el(id+'-port').setAttribute('cy',y1);
}
const relRect=(stageR,id)=>{
  const q=el(id).getBoundingClientRect();
  return {l:q.left-stageR.left,r:q.right-stageR.left,t:q.top-stageR.top,b:q.bottom-stageR.top,
          cx:(q.left+q.right)/2-stageR.left,cy:(q.top+q.bottom)/2-stageR.top};
};
const placeLabel=(id,x,y)=>{const n=el(id);n.style.left=x+'px';n.style.top=y+'px';};

/* ========== 场景 1：角色映射 ========== */
const rolesScene=(()=>{
  const code=codeOf([
    '<span class="cmt">// epoll：发现谁就绪</span>',
    'n = epoll_wait(epfd, events, MAX, -1);',
    '',
    '<span class="cmt">// Reactor：把就绪分发给对象回调</span>',
    'channel = events[i].data.ptr;',
    'channel->handleEvent();  <span class="cmt">// → conn->handleRead</span>'
  ]);
  const steps=[
    {title:'步骤 0 · epoll 只回答「谁就绪」',chip:'epoll 边界',chipC:'c0',lines:[0,1],
     lit:['ep'],wires:[],badge:'',
     desc:'学完 epoll 后，已知一个线程能高效等待大量 fd。但 <code>epoll_wait</code> 只回答：<b>哪些 fd 可读/可写/异常</b>——不回答「这个 fd 是谁、该调哪个回调」。'},
    {title:'步骤 1 · Handle = fd / socket',chip:'Handle',chipC:'cb',lines:[1],
     lit:['ep','hd'],wires:['rw1'],badge:'b',
     desc:'事件源是 <span class="bl">Handle</span>：<code>listen_fd</code> 或 <code>conn_fd</code>。epoll 面向的是这些整数 fd，还不知道背后的连接对象。'},
    {title:'步骤 2 · Demultiplexer = epoll_wait',chip:'Demultiplexer',chipC:'cb',lines:[0,1],
     lit:['ep','hd','dm'],wires:['rw1','rw2'],badge:'b',
     desc:'<span class="bl">Synchronous Event Demultiplexer</span> 在 Linux 上就是 <code>epoll_wait</code>（或 select/poll）：同步阻塞，直到有就绪事件返回。'},
    {title:'步骤 3 · EventLoop 负责分发',chip:'EventLoop',chipC:'ch',lines:[3,4],
     lit:['ep','hd','dm','lp'],wires:['rw1','rw2','rw3'],badge:'h',
     desc:'<span class="hb">EventLoop / Dispatcher</span> 取出本轮活跃 Channel，逐个调用 <code>handleEvent()</code>，并在循环末尾执行 <code>doPendingFunctors()</code>。'},
    {title:'步骤 4 · Channel 绑定 fd + 回调',chip:'Channel',chipC:'cg',lines:[4,5],
     lit:['ep','hd','dm','lp','ch'],wires:['rw1','rw2','rw3','rw4'],badge:'g',
     desc:'<span class="gr">Channel</span> 不拥有 fd，只绑定「fd + 关注事件 + 回调」。<code>epoll_event.data.ptr</code> 常指向它——生命周期必须清晰。'},
    {title:'步骤 5 · Concrete Handler 做真实 IO',chip:'Acceptor / Conn',chipC:'cg',lines:[5],
     lit:['ep','hd','dm','lp','ch','hn'],wires:['rw1','rw2','rw3','rw4','rw5'],badge:'g',
     desc:'真正的 <code>accept</code> / <code>read</code> / <code>write</code> / <code>close</code> 在 <span class="gr">Acceptor</span> 与 <span class="gr">TcpConnection</span> 里完成。一句话：<b>epoll 面向 fd，Reactor 面向对象和回调</b>。'},
  ];
  const WIRES={rw1:'blue',rw2:'blue',rw3:'amber',rw4:'green',rw5:'green'};
  const LABELS={rw3:'rl3',rw4:'rl4',rw5:'rl5'};
  let litW=new Set(),motion=motionKit(),observer=null;
  function layout(){
    const stage=el('roleStage'),svg=el('roleSvg');if(!stage||!svg)return;
    const sr=stage.getBoundingClientRect();
    svg.setAttribute('viewBox',`0 0 ${sr.width} ${sr.height}`);
    const hd=relRect(sr,'rb-hd'),ep=relRect(sr,'rb-ep'),dm=relRect(sr,'rb-dm'),
          lp=relRect(sr,'rb-lp'),ch=relRect(sr,'rb-ch'),hn=relRect(sr,'rb-hn');
    polyArrow('rw1',[{x:hd.r,y:hd.cy},{x:ep.l,y:ep.cy}]);
    polyArrow('rw2',[{x:ep.r,y:ep.cy},{x:dm.l,y:dm.cy}]);
    const my=(dm.b+lp.t)/2;
    polyArrow('rw3',[{x:dm.cx,y:dm.b},{x:dm.cx,y:my},{x:lp.cx,y:my},{x:lp.cx,y:lp.t}]);
    polyArrow('rw4',[{x:lp.r,y:lp.cy},{x:ch.l,y:ch.cy}]);
    polyArrow('rw5',[{x:ch.cx,y:ch.b},{x:ch.cx,y:hn.t}]);
    placeLabel('rl3',(dm.cx+lp.cx)/2,my);
    placeLabel('rl4',(lp.r+ch.l)/2,lp.cy);
    placeLabel('rl5',ch.cx-72,(ch.b+hn.t)/2);
  }
  function mount(){
    cancel();litW=new Set();
    let h='';
    h+='<div class="role-box" id="rb-hd" style="left:16px;top:14px;width:180px;height:84px"><span class="zt">Handle</span><div class="nm">fd / socket</div><div class="ds">listen_fd · conn_fd</div></div>';
    h+='<div class="role-box" id="rb-ep" style="left:226px;top:14px;width:180px;height:84px"><span class="zt">内核机制</span><div class="nm">epoll</div><div class="ds">发现「谁就绪了」</div></div>';
    h+='<div class="role-box" id="rb-dm" style="left:436px;top:14px;width:180px;height:84px"><span class="zt">Demultiplexer</span><div class="nm">epoll_wait</div><div class="ds">同步等待就绪</div></div>';
    h+='<div class="role-box" id="rb-lp" style="left:16px;top:162px;width:270px;height:100px"><span class="zt">Dispatcher</span><div class="nm">EventLoop</div><div class="ds">poll → handleEvent → functors</div></div>';
    h+='<div class="role-box" id="rb-ch" style="left:346px;top:162px;width:270px;height:100px"><span class="zt">Event Handler</span><div class="nm">Channel</div><div class="ds">fd + events + callbacks</div></div>';
    h+='<div class="role-box" id="rb-hn" style="left:96px;top:306px;width:440px;height:68px"><span class="zt">Concrete Handler</span><div class="nm">Acceptor / TcpConnection</div><div class="ds">accept · read · write · close 真实逻辑</div></div>';
    h+='<svg class="arr-layer" id="roleSvg" preserveAspectRatio="none">';
    Object.keys(WIRES).forEach(id=>h+=trioHTML(id));
    h+='</svg>';
    h+='<span class="wlabel amber" id="rl3">返回就绪列表</span>';
    h+='<span class="wlabel green" id="rl4">handleEvent</span>';
    h+='<span class="wlabel green" id="rl5">触发回调</span>';
    h+='<span class="role-badge b" id="rBadge">epoll 面向 fd · Reactor 面向对象</span>';
    viz.innerHTML='<div class="vcap"><b>角色映射</b>：epoll 发现就绪 · Reactor 分发到对象回调</div><div class="role-stage" id="roleStage">'+h+'</div>';
    layout();observer=new ResizeObserver(layout);observer.observe(el('roleStage'));
  }
  function paint(s){
    motion.clear();layout();
    ['ep','hd','dm','lp','ch','hn'].forEach(k=>{
      const e=el('rb-'+k);
      const on=s.lit.includes(k);
      let c='role-box'+(on?' lit':'');
      if(k==='ep'||k==='hd'||k==='dm')c+=' b';
      else if(k==='lp')c+=' h';
      else c+=' g';
      e.className=c;
    });
    const want=new Set(s.wires);
    const anyActive=want.size>0;
    let stagger=0;
    Object.entries(WIRES).forEach(([id,color])=>{
      const lblId=LABELS[id];
      if(want.has(id)){
        if(!litW.has(id)){motion.schedule(()=>drawW(motion,id,color),120+stagger*260);stagger++;}
        else setW(id,'on',color);
        if(lblId)motion.schedule(()=>el(lblId).classList.add('on'),360+(stagger?(stagger-1)*260:0));
      }else{
        setW(id,anyActive?'':'hint',color);
        if(lblId)el(lblId).classList.remove('on');
      }
    });
    litW=want;
    const b=el('rBadge');
    b.className='role-badge '+(s.badge||'b')+(s.badge?' on':'');
    b.textContent=s.badge==='g'?'epoll 面向 fd · Reactor 面向对象':s.badge==='h'?'EventLoop 把就绪变成回调':s.badge==='b'?'Handle + Demultiplexer 仍是底层':'';
  }
  function cancel(){motion.clear();if(observer){observer.disconnect();observer=null;}}
  return {id:'roles',label:'角色映射',sub:'epoll → Channel → Handler',steps,mount,paint,cancel,code};
})();

/* ========== 场景 2：EventLoop 循环 ========== */
const loopScene=(()=>{
  const code=codeOf([
    '<span class="kw">while</span> (!quit) {',
    '  activeChannels = poller.poll(timeout);',
    '  <span class="kw">for</span> (Channel* ch : activeChannels)',
    '    ch->handleEvent();',
    '  doPendingFunctors();',
    '}'
  ]);
  const steps=[
    {phase:'overview',title:'步骤 0 · EventLoop 是一轮轮迭代',chip:'loop()',chipC:'c0',lines:[0,5],desc:'<code>EventLoop::loop()</code> 是外层回环；poll、逐个 Channel 分发、循环尾检查 pending functors，都是<span class="bl">同一线程的一轮</span>。'},
    {phase:'poll',title:'步骤 1 · poller.poll 阻塞等待',chip:'poll',chipC:'cb',lines:[1],desc:'<code>poller.poll()</code> 封装 <code>epoll_wait()</code>。没有就绪事件时线程睡在这里；此时 activeChannels 尚未返回，pending 队列也可以为空。'},
    {phase:'ready',title:'步骤 2 · 唤醒后返回 activeChannels',chip:'就绪列表',chipC:'cg',lines:[1,2],desc:'本轮示例：其他线程先投递任务，再写 <code>eventfd</code> 唤醒 poll。poll 返回普通 socket Channel 与 wakeupChannel；<b>普通轮次不一定包含 wakeupChannel</b>。'},
    {phase:'dispatch',title:'步骤 3 · for 循环逐个分发 Channel',chip:'逐个分发',chipC:'cg',lines:[2,3],desc:'同一 loop 线程依次调用 <code>Channel::handleEvent()</code>。wakeupChannel 的回调会 <code>read(eventfd)</code> 消费通知，但不会在这里直接执行 pending 任务。'},
    {phase:'pending',title:'步骤 4 · 循环尾检查 pending functors',chip:'loop-tail work',chipC:'ch',lines:[4],desc:'activeChannels 全部处理完后才进入 loop-tail。<code>doPendingFunctors()</code> 独立检查投递队列：可能执行若干任务，也可能队列为空而立即返回。'},
    {phase:'next',title:'步骤 5 · 短任务结束，进入下一轮 poll',chip:'下一轮',chipC:'cb',lines:[0,5],desc:'本轮完成后回到下一次 poll。I/O 回调和 functor 都必须<span class="dg">短小且不阻塞</span>；DB、重计算、慢磁盘应交给线程池。'}
  ];
  const wireIds=['lwPollActive','lwActiveHandle','lwHandleTail','lwQueuePending','lwWakePoll','lwPendingRun','lwReturnPoll'];
  let motion=motionKit(),observer=null;
  function layout(){
    const s=el('loopStage'),svg=el('loopSvg');if(!s||!svg)return;
    const r=s.getBoundingClientRect();
    svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);
    const poll=relRect(r,'lPoll'),active=relRect(r,'lActive'),handle=relRect(r,'lHandle'),
          producer=relRect(r,'lProducer'),pending=relRect(r,'lPending'),run=relRect(r,'lDoPending');
    polyArrow('lwPollActive',[{x:poll.r,y:poll.cy},{x:active.l,y:active.cy}]);
    polyArrow('lwActiveHandle',[{x:active.r,y:active.cy},{x:handle.l,y:handle.cy}]);
    polyArrow('lwHandleTail',[{x:handle.cx,y:handle.b},{x:handle.cx,y:run.t}]);
    polyArrow('lwQueuePending',[{x:producer.r,y:producer.cy},{x:pending.l,y:pending.cy}]);
    polyArrow('lwPendingRun',[{x:pending.r,y:pending.cy},{x:run.l,y:run.cy}]);
    polyArrow('lwWakePoll',[{x:producer.cx,y:producer.t},{x:16,y:producer.t},{x:16,y:poll.cy},{x:poll.l,y:poll.cy}]);
    polyArrow('lwReturnPoll',[{x:run.cx,y:run.b},{x:run.cx,y:366},{x:16,y:366},{x:16,y:poll.cy+18},{x:poll.l,y:poll.cy+18}]);
    placeLabel('llWake',76,(producer.t+poll.cy)/2+34);
    placeLabel('llTail',handle.cx+46,(handle.b+run.t)/2);
    placeLabel('llReturn',300,366);
  }
  function mount(){
    cancel();
    let h='<div class="loop-shell lit" id="loopShell"><span class="loop-shell-title">EventLoop::loop()</span><span class="loop-shell-sub">同一线程 · 一轮一轮迭代</span></div>';
    h+='<span class="loop-track" style="left:28px;top:42px">I/O 就绪与 Channel 分发</span><span class="loop-track" style="left:28px;top:226px">独立投递的 loop-tail work</span>';
    h+='<div class="loop-box" id="lPoll" style="left:28px;top:72px;width:142px;height:68px"><span class="k">poller.poll</span><span class="s" id="lPollState">epoll_wait</span></div>';
    h+='<div class="loop-box loop-list" id="lActive" style="left:214px;top:58px;width:190px;height:146px"><span class="k">activeChannels</span><span class="loop-status" id="lActiveState">尚未返回</span><div class="loop-item" id="lAcConn" style="top:58px">conn8Channel · EPOLLIN</div><div class="loop-item" id="lAcWake" style="top:99px">wakeupChannel · EPOLLIN</div></div>';
    h+='<div class="loop-box" id="lHandle" style="left:446px;top:72px;width:158px;height:68px"><span class="k">Channel::handleEvent</span><span class="s" id="lHandleState">idle</span></div>';
    h+='<div class="loop-box" id="lProducer" style="left:28px;top:260px;width:142px;height:70px"><span class="k">其他线程</span><span class="s" id="lProducerState">queueInLoop(task)</span></div>';
    h+='<div class="loop-box loop-list" id="lPending" style="left:214px;top:246px;width:190px;height:108px"><span class="k">pendingFunctors_</span><span class="loop-status" id="lPendingState">0 pending · 可为空</span><div class="loop-item task" id="lFnTask" style="top:58px">writeResponse()</div><div class="loop-empty on" id="lFnEmpty">empty · 0 tasks</div></div>';
    h+='<div class="loop-box" id="lDoPending" style="left:446px;top:260px;width:158px;height:70px"><span class="k">doPendingFunctors</span><span class="s" id="lDoState">循环尾检查</span></div>';
    h+='<span class="loop-note" id="lLoopNote"></span><svg class="arr-layer" id="loopSvg" preserveAspectRatio="none">';
    wireIds.forEach(id=>h+=trioHTML(id));
    h+='</svg>';
    h+='<span class="wlabel blue" id="llWake">write(eventfd)</span><span class="wlabel green" id="llTail">for 结束</span><span class="wlabel blue" id="llReturn">下一轮：再次 poll</span>';
    viz.innerHTML='<div class="vcap"><b>EventLoop 一轮</b>：poll → activeChannels → Channel::handleEvent → pending → next poll</div><div class="loop-stage" id="loopStage">'+h+'</div>';
    layout();observer=new ResizeObserver(layout);observer.observe(el('loopStage'));
  }
  function note(text,kind='g'){const n=el('lLoopNote');n.textContent=text;n.className='loop-note on '+kind;}
  function setBox(id,state='preview',color=''){const list=id==='lActive'||id==='lPending'?' loop-list':'';el(id).className='loop-box'+list+' '+state+(color?' '+color:'');}
  function channels(state='on'){el('lAcConn').className='loop-item '+state;el('lAcWake').className='loop-item '+state;el('lActiveState').textContent='2 active Channels';}
  function queued(){el('lFnEmpty').className='loop-empty';el('lFnTask').className='loop-item task on';el('lPendingState').textContent='1 pending';}
  function baseline(){
    motion.clear();layout();
    ['lPoll','lActive','lHandle','lProducer','lPending','lDoPending'].forEach(id=>setBox(id));
    wireIds.forEach(id=>setW(id));
    el('lAcConn').className=el('lAcWake').className='loop-item';
    el('lFnTask').className='loop-item task';el('lFnEmpty').className='loop-empty on';
    el('lPollState').textContent='epoll_wait';el('lActiveState').textContent='尚未返回';
    el('lHandleState').textContent='idle';el('lProducerState').textContent='queueInLoop(task)';
    el('lPendingState').textContent='0 pending · 可为空';el('lDoState').textContent='循环尾检查';
    el('lLoopNote').className='loop-note';
    ['llWake','llTail','llReturn'].forEach(id=>el(id).classList.remove('on'));
  }
  function paint(s){
    baseline();
    const schedule=motion.schedule;
    if(s.phase==='overview'){['lPoll','lActive','lHandle','lProducer','lPending','lDoPending'].forEach(id=>setBox(id,'preview'));wireIds.forEach((id,i)=>schedule(()=>setW(id,'hint',i===3||i===5?'amber':i<3?'green':'blue'),i*45));note('一轮：poll → 逐个 Channel → 检查 pending → 下一轮');return;}
    if(s.phase==='poll'){setBox('lPoll','on active','blue');setBox('lActive','preview');setBox('lPending','preview');el('lPollState').textContent='waiting…';note('没有就绪事件时，loop 睡在 epoll_wait','g');return;}

    if(s.phase==='ready'){setBox('lProducer','on active','amber');setBox('lActive','on active','green');setW('lwQueuePending');setW('lwWakePoll');setW('lwPollActive');el('lAcConn').className=el('lAcWake').className='loop-item';schedule(()=>drawW(motion,'lwQueuePending','amber'),120);schedule(()=>queued(),360);schedule(()=>{el('lProducerState').textContent='write(eventfd)';el('llWake').classList.add('on');drawW(motion,'lwWakePoll','blue');},520);schedule(()=>{el('lPollState').textContent='2 ready';drawW(motion,'lwPollActive','blue');},900);schedule(()=>{el('lAcConn').className='loop-item on';},1120);schedule(()=>{el('lAcWake').className='loop-item on';el('lActiveState').textContent='2 active Channels';},1300);note('本轮示例：socket 就绪 + eventfd 唤醒','g');return;}

const SCENES=[rolesScene,loopScene,pathScene,multiScene];
const tabsBox=document.getElementById('tabs');
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stAct=document.getElementById('stAct'),stDesc=document.getElementById('stDesc');
const codeBox=document.getElementById('codeBox'),readout=document.getElementById('readout'),dotsBox=document.getElementById('dots');

SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML='<span class="t">'+sc.label+'</span><span class="s">'+sc.sub+'</span>';b.onclick=()=>{stop();switchScene(i);};tabsBox.appendChild(b);});
let si=0,cur=0,dotEls=[];
function switchScene(i){
  SCENES[si]?.cancel?.();
  si=i;cur=0;
  [...tabsBox.children].forEach((t,idx)=>t.classList.toggle('on',idx===si));
  SCENES[si].mount();codeBox.innerHTML=SCENES[si].code;
  dotsBox.innerHTML='';dotEls=[];

  go(0);
}
function go(i){
  const steps=SCENES[si].steps;cur=Math.max(0,Math.min(steps.length-1,i));const s=steps[cur];
  SCENES[si].paint(s);
  codeBox.querySelectorAll('.cl').forEach((ln,idx)=>ln.classList.toggle('hl',!!(s.lines&&s.lines.includes(idx))));
  stTitle.textContent=SCENES[si].label;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;stAct.innerHTML='▸ '+s.title;stDesc.innerHTML=s.desc;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(steps.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
  try{history.replaceState(null,'','#scene='+SCENES[si].id+'&step='+cur);}catch(e){}
  if(cur===steps.length-1)stop();
}
let timer=null,ms=2500;
function play(){const steps=SCENES[si].steps;if(cur===steps.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<SCENES[si].steps.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const hm=location.hash.match(/scene=(\w+)/),sm=location.hash.match(/step=(\d+)/);
let initScene=0;if(hm){const idx=SCENES.findIndex(x=>x.id===hm[1]);if(idx>=0)initScene=idx;}
switchScene(initScene);if(sm)go(+sm[1]);
</script>
</body>
