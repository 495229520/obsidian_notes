<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互斥量 · 条件变量 · 线程池动画 · 竞态 · 死锁 · 任务流转</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#3E3D39;--muted:#5F5E5A;--faint:#8a887f;
  --line:#c9c7bf;--grid:#e2e0d7;
  --blue:#185FA5;--bluebg:#E6F1FB;
  --green:#0F6E56;--greenbg:#E1F5EE;
  --brown:#9A5B0E;--brownbg:#FAEEDA;
  --danger:#B3402F;--dangerbg:#F6E0DB;
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 44px;text-wrap:pretty;}
.wrap{max-width:1180px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.4px;}
header p{font-size:13px;color:var(--muted);margin-top:5px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
.tab{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 17px;cursor:pointer;transition:all .18s var(--ease);display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
.tab:hover{border-color:var(--muted);transform:translateY(-1px);}
.tab .t{font-weight:600;color:var(--ink);}
.tab .s{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 10px rgba(62,61,57,.18);}
.tab.on .t,.tab.on .s{color:var(--paper);}
.tab.on .s{opacity:.75;}

.layout{display:grid;grid-template-columns:626px 1fr;gap:26px;margin-top:22px;align-items:start;}
@media(max-width:1080px){.layout{grid-template-columns:1fr;}}
.viz{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:20px 22px 18px;min-height:500px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.viz .vcap{font-size:12px;color:var(--muted);margin-bottom:14px;text-align:center;}
.viz .vcap b{color:var(--ink);}

/* ===== 竞态 + mutex ===== */
.rc-stage{width:578px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px;}
.rc-top{display:flex;flex-direction:column;align-items:center;gap:10px;}
.rc-num{
  font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ink);
  padding:8px 28px;border-radius:12px;border:2px solid var(--line);background:var(--paper);
  transition:all var(--dur) var(--ease);text-align:center;min-width:140px;
}
.rc-num.bad{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.rc-num.ok{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.rc-lock{
  font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 14px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--gray);color:var(--muted);
  transition:all var(--dur) var(--ease);white-space:nowrap;text-align:center;
}
.rc-lock.free{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.rc-lock.held{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.rc-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;}
.rc-th{
  border:1.5px solid var(--line);border-radius:12px;background:var(--paper);
  padding:12px 14px 14px;min-height:168px;
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),opacity var(--dur) var(--ease);
  display:flex;flex-direction:column;gap:10px;
}
.rc-th.a{border-color:var(--blue);}
.rc-th.b{border-color:var(--green);}
.rc-th.glow{box-shadow:0 0 0 3px rgba(24,95,165,.2);}
.rc-th.glow-g{box-shadow:0 0 0 3px rgba(15,110,86,.2);}
.rc-th.blocked{opacity:.5;}
.rc-thh{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.rc-thh .tag{font-family:var(--mono);font-size:10px;font-weight:700;}
.rc-th.a .tag{color:var(--blue);}
.rc-th.b .tag{color:var(--green);}
.rc-steps{display:flex;flex-direction:column;gap:8px;}
.rc-s{
  font-family:var(--mono);font-size:11px;padding:7px 10px;border-radius:8px;
  border:1px solid var(--grid);background:var(--gray);color:var(--faint);
  transition:all var(--dur) var(--ease);text-align:left;
}
.rc-s.on{color:var(--ink);border-color:var(--ink);background:var(--paper);font-weight:700;}
.rc-s.done{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.rc-s.lost{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);text-decoration:line-through;}
.rc-banner{
  width:100%;text-align:center;font-size:12px;font-weight:700;padding:9px 12px;border-radius:9px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--muted);
  transition:all var(--dur) var(--ease);min-height:38px;display:flex;align-items:center;justify-content:center;
}
.rc-banner.bad{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.rc-banner.ok{color:var(--green);border-color:var(--green);background:var(--greenbg);}

/* ===== 死锁 ===== */
.dl-stage{width:578px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.dl-top{display:grid;grid-template-columns:1fr 110px 1fr;gap:14px;align-items:center;}
.dl-th{
  border:1.5px solid var(--line);border-radius:12px;background:var(--paper);
  padding:14px 14px 16px;min-height:130px;
  transition:all var(--dur) var(--ease);
  display:flex;flex-direction:column;gap:8px;
}
.dl-th.t1{border-color:var(--blue);}
.dl-th.t2{border-color:var(--green);}
.dl-th.dead{border-color:var(--danger);background:var(--dangerbg);box-shadow:0 0 0 3px rgba(179,64,47,.18);}
.dl-th.ok{border-color:var(--green);background:var(--greenbg);}
.dl-thh{font-size:13px;font-weight:700;text-align:center;}
.dl-st{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;min-height:32px;line-height:1.35;}
.dl-holds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:auto;}
.dl-lock{
  font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--gray);color:var(--muted);
  transition:all var(--dur) var(--ease);white-space:nowrap;
}
.dl-lock.held-a{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.dl-lock.held-b{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.dl-lock.wait{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);animation:pulse .9s ease infinite;}
@keyframes pulse{50%{transform:scale(1.05);}}
.dl-center{display:flex;align-items:center;justify-content:center;}
.dl-cycle{
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--danger);
  border:1.5px solid var(--danger);background:var(--dangerbg);border-radius:10px;
  padding:12px 10px;text-align:center;opacity:0;transition:opacity var(--dur) var(--ease);
  line-height:1.4;width:100%;
}
.dl-cycle.show{opacity:1;}
.dl-fix{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dl-card{
  border:1.5px solid var(--grid);border-radius:10px;padding:12px 14px;background:var(--paper);
  opacity:.32;transition:all var(--dur) var(--ease);text-align:center;min-height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.dl-card.lit{opacity:1;border-color:var(--ink);}
.dl-card b{display:block;font-size:12px;}
.dl-card span{font-size:11px;color:var(--muted);}
.dl-msg{
  text-align:center;font-size:12px;font-weight:700;padding:9px 12px;border-radius:9px;
  border:1.5px solid var(--line);color:var(--muted);background:var(--paper);
  transition:all var(--dur) var(--ease);min-height:38px;
  display:flex;align-items:center;justify-content:center;
}
.dl-msg.bad{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.dl-msg.ok{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.dl-msg.warn{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}

/* ===== 条件变量 + 线程池 ===== */
.tp-stage{width:578px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.tp-row1{
  display:grid;grid-template-columns:132px 36px 1fr 36px;gap:10px;align-items:center;
  min-height:128px;
}
.tp-io{
  height:100%;min-height:110px;border:1.5px solid var(--blue);border-radius:12px;background:var(--bluebg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:box-shadow var(--dur) var(--ease);padding:10px 8px;text-align:center;
}
.tp-io.glow{box-shadow:0 0 0 3px rgba(24,95,165,.22);}
.tp-io b{font-size:12.5px;}
.tp-io span{font-family:var(--mono);font-size:10px;color:var(--blue);}
.tp-arr{
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brown);
  text-align:center;opacity:0;transition:opacity var(--dur) var(--ease);white-space:nowrap;
}
.tp-arr.show{opacity:1;}
.tp-q{
  height:100%;min-height:110px;border:1.5px solid var(--brown);border-radius:12px;background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden;
}
.tp-qh{
  flex:none;height:28px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--brown);border-bottom:1px solid var(--grid);
  background:rgba(250,238,218,.45);
}
.tp-slots{flex:1;display:flex;flex-direction:column;gap:6px;padding:10px 12px;justify-content:center;}
.tp-task{
  height:24px;border-radius:7px;border:1.5px solid var(--brown);background:var(--brownbg);
  color:var(--brown);font-family:var(--mono);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateX(-10px);transition:all var(--dur) var(--ease);
}
.tp-task.on{opacity:1;transform:translateX(0);}
.tp-task.out{opacity:0;transform:translateX(14px);}
.tp-qfoot{
  flex:none;padding:0 10px 8px;display:flex;justify-content:flex-end;
}
.tp-lock{
  font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--gray);color:var(--muted);
  transition:all var(--dur) var(--ease);white-space:nowrap;
}
.tp-lock.held{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.tp-spacer{/* 右侧留白，对齐三列网格 */}
.tp-cond{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 0 0 0;}
.tp-c{
  text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;
  padding:9px 8px;border-radius:9px;border:1.5px solid var(--grid);background:var(--paper);
  color:var(--faint);transition:all var(--dur) var(--ease);
}
.tp-c.fire{color:var(--green);border-color:var(--green);background:var(--greenbg);box-shadow:0 0 0 3px rgba(15,110,86,.12);}
.tp-workers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.tp-w{
  min-height:108px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);
  padding:12px 12px 10px;transition:all var(--dur) var(--ease);
  display:flex;flex-direction:column;gap:6px;
}
.tp-w.sleep{border-color:var(--line);opacity:.72;}
.tp-w.busy{border-color:var(--green);background:var(--greenbg);box-shadow:0 0 0 2px rgba(15,110,86,.12);opacity:1;}
.tp-w.wait{border-color:var(--brown);background:var(--brownbg);opacity:1;}
.tp-wn{font-size:12.5px;font-weight:700;text-align:center;}
.tp-ws{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center;min-height:16px;}
.tp-wt{
  margin-top:auto;height:28px;border-radius:7px;border:1.5px dashed var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--faint);
  transition:all var(--dur) var(--ease);
}
.tp-wt.has{border-style:solid;border-color:var(--green);color:var(--green);background:rgba(15,110,86,.08);}
.tp-msg{
  text-align:center;font-size:12px;font-weight:700;padding:9px 12px;border-radius:9px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--muted);
  transition:all var(--dur) var(--ease);min-height:38px;
  display:flex;align-items:center;justify-content:center;
}
.tp-msg.ok{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.tp-msg.warn{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}

/* 右侧 */
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:18px 20px;min-height:196px;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.act{margin-top:14px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:9px 13px;border-radius:9px;}
.chip{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;border:1px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cb{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.desc-body{margin-top:10px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .bl{color:var(--blue);font-weight:600;}
.desc-body .gr{color:var(--green);font-weight:600;}
.desc-body .dg{color:var(--danger);font-weight:600;}
.desc-body .hb{color:var(--brown);font-weight:600;}
.codebox{background:#2E2C27;border-radius:11px;padding:12px 0;font-family:var(--mono);font-size:12px;line-height:1.65;color:#D8D5CC;white-space:pre;overflow-x:auto;box-shadow:0 2px 8px rgba(46,44,39,.18);}
.codebox .cmt{color:#8F8B80;} .codebox .kw{color:#E3A44C;}
.codebox .cl{padding:2px 17px;transition:background .3s var(--ease),color .3s var(--ease);}
.codebox .cl.hl{background:rgba(52,122,198,.52);box-shadow:inset 4px 0 0 #82B4E8;color:#F7F4EA;}
.codebox .cl.hl .cmt{color:#CCC8BA;}

.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:92px;}
.dots{display:flex;gap:7px;margin:0 auto;flex-wrap:wrap;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>互斥量 · 条件变量 · 线程池动画 · 竞态 · 死锁 · 任务流转</h1>
    <p>配套笔记《12.3 互斥量》《12.7 条件变量与线程池》 · num++ 竞态、AB-BA 死锁、cond+队列+worker 流转　·　上方切场景，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <section class="viz" id="viz"></section>
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="act" id="stAct"></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
      <div class="codebox" id="codeBox"></div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
const viz=document.getElementById('viz');
const el=id=>document.getElementById(id);
const codeOf=lines=>lines.map(l=>'<div class="cl">'+l+'</div>').join('');

/* ========== 场景 1：竞态 + mutex ========== */
const raceScene=(()=>{
  const code=codeOf([
    '<span class="kw">int</span> num = 0;',
    '<span class="cmt">// 无锁时：load → add → store 可交错</span>',
    'num++;  <span class="cmt">// 非原子</span>',
    'pthread_mutex_lock(&m);',
    'num++;  <span class="cmt">// 临界区</span>',
    'pthread_mutex_unlock(&m);',
    '<span class="cmt">// 有锁：结果恒为期望值</span>',
  ]);
  const steps=[
    {title:'步骤 0 · 共享变量 num = 0',chip:'起点',chipC:'c0',lines:[0],
     num:0,numC:'',lock:'mutex 未使用',lockC:'',
     a:[0,0,0],b:[0,0,0],ag:0,bg:0,ab:0,bb:0,
     ban:'两个线程都要做 num++',banC:'',
     desc:'共享变量 <code>num=0</code>。线程 A / B 都要执行 <code>num++</code>。看起来一步，CPU 上其实是 <b>load → add → store</b> 三步。'},
    {title:'步骤 1 · 无锁：A 读到 0',chip:'竞态开始',chipC:'cd',lines:[1,2],
     num:0,numC:'',lock:'无锁 · 危险',lockC:'',
     a:[1,0,0],b:[0,0,0],ag:1,bg:0,ab:0,bb:0,
     ban:'A: load num → reg=0',banC:'',
     desc:'线程 A 把 <code>num</code> 从内存<span class="bl">读进寄存器</span>（regA=0）。此刻 B 还没开始，看起来一切正常。'},
    {title:'步骤 2 · 无锁：B 也读到 0',chip:'交错',chipC:'cd',lines:[1,2],
     num:0,numC:'bad',lock:'无锁 · 危险',lockC:'',
     a:[1,0,0],b:[1,0,0],ag:0,bg:1,ab:0,bb:0,
     ban:'B: load num → reg=0（读到同一旧值）',banC:'bad',
     desc:'线程 B 也 load，同样读到 0。两次 ++ 都基于旧值——这就是<span class="dg">数据竞争</span>的根。'},
    {title:'步骤 3 · 双方都写回 1 · 丢一次更新',chip:'丢更新',chipC:'cd',lines:[2],
     num:1,numC:'bad',lock:'无锁 · 危险',lockC:'',
     a:[2,2,1],b:[2,2,1],ag:0,bg:0,ab:0,bb:0,
     ban:'期望 2 · 实际 1 · 丢了一次 ++',banC:'bad',

/* ========== 引擎 ========== */
const SCENES=[raceScene,deadScene,poolScene];
const tabsBox=document.getElementById('tabs');
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stAct=document.getElementById('stAct'),stDesc=document.getElementById('stDesc');
const codeBox=document.getElementById('codeBox'),readout=document.getElementById('readout'),dotsBox=document.getElementById('dots');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');

SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML='<span class="t">'+sc.label+'</span><span class="s">'+sc.sub+'</span>';b.onclick=()=>{stop();switchScene(i);};tabsBox.appendChild(b);});
let si=0,cur=0,dotEls=[];
function switchScene(i){
  si=i;cur=0;
  [...tabsBox.children].forEach((t,idx)=>t.classList.toggle('on',idx===si));
  SCENES[si].mount();codeBox.innerHTML=SCENES[si].code;
  dotsBox.innerHTML='';dotEls=[];
  SCENES[si].steps.forEach((s,idx)=>{const d=document.createElement('button');d.className='dot';d.title=s.title;d.onclick=()=>{stop();go(idx);};dotsBox.appendChild(d);dotEls.push(d);});
  go(0);
}
function go(i){
  const steps=SCENES[si].steps;cur=Math.max(0,Math.min(steps.length-1,i));const s=steps[cur];
  SCENES[si].paint(s);
  codeBox.querySelectorAll('.cl').forEach((ln,idx)=>ln.classList.toggle('hl',!!(s.lines&&s.lines.includes(idx))));
  stTitle.textContent=SCENES[si].label;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;stAct.innerHTML='▸ '+s.title;stDesc.innerHTML=s.desc;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(steps.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
  try{history.replaceState(null,'','#scene='+SCENES[si].id+'&step='+cur);}catch(e){}
  if(cur===steps.length-1)stop();
}
let timer=null,ms=2600;
function play(){const steps=SCENES[si].steps;if(cur===steps.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<SCENES[si].steps.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const hm=location.hash.match(/scene=(\w+)/),sm=location.hash.match(/step=(\d+)/);
let initScene=0;if(hm){const idx=SCENES.findIndex(x=>x.id===hm[1]);if(idx>=0)initScene=idx;}
switchScene(initScene);if(sm)go(+sm[1]);
</script>
</body>
