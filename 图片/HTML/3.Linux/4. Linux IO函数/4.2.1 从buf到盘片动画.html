<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从 buf[] 到盘片 · write / fsync 全路径</title>
<!-- Visual system: shared with the 3.Linux animation series — warm paper #F5F4ED, quiet panels, semantic blue(用户态)/amber(内核)/green(持久)/danger(丢失), 8px rhythm. -->
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFBF6;--ink:#2B2A26;--muted:#625F56;--faint:#918D83;
  --line:#D8D5C8;--grid:#E4E1D6;--gray:#F0EEE6;
  --blue:#2467A6;--bluebg:#E1EEF9;--bluetx:#1C4D7A;
  --green:#087A5C;--greenbg:#DAF0E7;--greentx:#075B45;
  --amber:#A66408;--amberbg:#F7E9D4;--ambertx:#7C4A05;
  --danger:#C34935;--dangerbg:#F7DFDA;--dangertx:#913025;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 48px;text-wrap:pretty;}
.wrap{max-width:1320px;margin:0 auto;}
header h1{font-size:22px;font-weight:700;color:var(--ink);}
header p{font-size:13px;color:var(--muted);margin-top:6px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.tabs{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.tab{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:10px 16px;cursor:pointer;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform .18s var(--ease);display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
.tab:hover{border-color:var(--ink);transform:translateY(-1px);}
.tab .t{font-weight:700;color:var(--ink);}.tab .s{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 10px rgba(43,42,38,.14);}.tab.on .t,.tab.on .s{color:var(--paper);}.tab.on .s{opacity:.78;}

.layout{display:grid;grid-template-columns:minmax(0,760px) minmax(300px,1fr);gap:28px;margin-top:22px;align-items:start;}
.viz{background:var(--panel);border:1.5px solid var(--grid);border-radius:10px;padding:22px;min-height:520px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,55,40,.04);overflow:hidden;}
.vcap{font-size:13px;color:var(--muted);margin-bottom:15px;}.vcap b{color:var(--ink);font-weight:700;}
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1.5px solid var(--grid);border-radius:10px;padding:18px 20px;min-height:212px;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}.desc-head .st{font-size:17px;font-weight:700;}
#stAct{margin-top:14px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:7px;padding:9px 12px;}
#stDesc{margin-top:10px;font-size:14px;color:var(--muted);}
.blue{color:var(--blue);font-weight:700;}.green{color:var(--green);font-weight:700;}.amber{color:var(--amber);font-weight:700;}.danger{color:var(--danger);font-weight:700;}
.chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;border:1.5px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cb{color:var(--bluetx);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.chip.ca{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}
.chip.cd{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}

.codebox{align-self:flex-start;width:100%;background:#2E2C27;border-radius:8px;padding:10px 0;font-family:var(--mono);font-size:12.5px;line-height:1.5;color:#D8D5CC;box-shadow:0 2px 8px rgba(46,44,39,.18);overflow:hidden;}
.codebox .cl{min-height:22px;padding:2px 14px;white-space:pre-wrap;overflow-wrap:anywhere;transition:background var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);}
.codebox .cmt{color:#918D83;}.codebox .kw{color:#E9AC50;}.codebox .type{color:#95C7EF;}.codebox .fn{color:#83C9B2;}.codebox .num{color:#F0BE7E;}.codebox .str{color:#D9CE9F;}
.codebox .cl.hl-blue{background:rgba(52,122,198,.54);box-shadow:inset 4px 0 0 #91C7F5;color:#F7F4EA;}
.codebox .cl.hl-green{background:rgba(22,143,107,.54);box-shadow:inset 4px 0 0 #90DFC2;color:#F7F4EA;}
.codebox .cl.hl-amber{background:rgba(185,112,16,.58);box-shadow:inset 4px 0 0 #FFD08A;color:#F7F4EA;}
.codebox .cl.hl-danger{background:rgba(198,73,53,.58);box-shadow:inset 4px 0 0 #FFAA98;color:#F7F4EA;}
.codebox .cl[class*="hl-"] .cmt{color:#D5D0C1;}

.controls{margin-top:22px;background:var(--panel);border:1.5px solid var(--grid);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:7px;padding:8px 15px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--ink);}.btn:active:not(:disabled){transform:scale(.96);}.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:86px;}
.dots{display:flex;gap:7px;margin:0 auto;flex-wrap:wrap;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}.dot.done{background:var(--line);border-color:var(--line);}.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}

/* Shared connector layer: paths, filled triangle heads and source ports stay mounted; endpoints come from live element rectangles. */
.stage{position:relative;width:100%;}
.wire-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1;}
.wire-line{--wc:var(--muted);fill:none;stroke:var(--wc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity var(--dur) var(--ease),stroke-dashoffset var(--dur) var(--ease);}
.wire-head{--wc:var(--muted);fill:var(--wc);stroke:none;opacity:0;transition:opacity 240ms var(--ease);}
.wire-port{--wc:var(--muted);fill:var(--panel);stroke:var(--wc);stroke-width:2;opacity:0;transition:opacity 240ms var(--ease);}
.wire-line.on,.wire-head.on,.wire-port.on{opacity:1;}
.wire-line.hint{stroke-width:2;opacity:.1;}.wire-head.hint,.wire-port.hint{opacity:.1;}
.wire-head.drawing{transition-delay:200ms;}
.wire-line.blue,.wire-head.blue,.wire-port.blue{--wc:var(--blue);}
.wire-line.green,.wire-head.green,.wire-port.green{--wc:var(--green);}
.wire-line.amber,.wire-head.amber,.wire-port.amber{--wc:var(--amber);}
.wire-line.danger,.wire-head.danger,.wire-port.danger{--wc:var(--danger);}

/* ---------- persistence ladder: 4 storage layers, 3 boundaries ---------- */
.fs-stage{display:grid;grid-template-rows:64px 32px 64px 32px 60px 32px 60px 34px 26px;row-gap:9px;min-height:472px;}
.layer{position:relative;z-index:2;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);
  display:grid;grid-template-columns:20px 134px minmax(0,1fr) 98px;align-items:center;gap:9px;padding:6px 11px;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),opacity var(--dur) var(--ease),border-style var(--dur) var(--ease);}
.layer .lnum{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--faint);transition:color var(--dur) var(--ease);}
.lname{display:flex;flex-direction:column;gap:1px;min-width:0;}
.lname b{font-size:12.5px;font-weight:700;color:var(--ink);}
.lname em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lbody{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:9px;min-width:0;}
.layer.on-blue{border-color:var(--blue);background:var(--bluebg);}.layer.on-blue .lnum{color:var(--blue);}
.layer.on-amber{border-color:var(--amber);background:var(--amberbg);}.layer.on-amber .lnum{color:var(--amber);}
.layer.on-green{border-color:var(--green);background:var(--greenbg);}.layer.on-green .lnum{color:var(--green);}
.layer.on-danger{border-color:var(--danger);background:var(--dangerbg);}.layer.on-danger .lnum{color:var(--danger);}
.layer.dim{opacity:.36;}
.layer.bypass{border-style:dashed;border-color:var(--line);
  background:repeating-linear-gradient(-45deg,transparent,transparent 6px,rgba(145,141,131,.08) 6px,rgba(145,141,131,.08) 12px);}
.layer.bypass .lnum,.layer.bypass .lname b{color:var(--faint);}
.layer.bypass .station,.layer.bypass .pgs{opacity:.4;}

.station{position:relative;z-index:2;min-height:40px;border:1.5px solid var(--line);border-radius:7px;background:var(--gray);
  display:flex;align-items:center;gap:9px;padding:5px 9px;font-size:11px;color:var(--muted);min-width:0;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur) var(--ease);}
.station .sk{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--faint);flex:0 0 auto;transition:color var(--dur) var(--ease);}
.station .stx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ram-tag{flex:0 1 auto;min-width:0;border:1px solid var(--amber);border-radius:999px;background:var(--amberbg);color:var(--ambertx);
  padding:1px 7px;font-family:var(--mono);font-size:9px;font-weight:700;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.station.on-blue{border-color:var(--blue);background:var(--bluebg);color:var(--bluetx);}.station.on-blue .sk{color:var(--blue);}
.station.on-amber{border-color:var(--amber);background:var(--amberbg);color:var(--ambertx);}.station.on-amber .sk{color:var(--amber);}
.station.on-green{border-color:var(--green);background:var(--greenbg);color:var(--greentx);}.station.on-green .sk{color:var(--green);}
.station.on-danger{border-color:var(--danger);background:var(--dangerbg);color:var(--dangertx);}.station.on-danger .sk{color:var(--danger);}

.dock{margin-left:auto;flex:0 0 64px;height:25px;border:1.5px dashed var(--line);border-radius:6px;background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--faint);
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease);}
.dock.ok{border-style:solid;border-color:var(--green);background:var(--greenbg);color:var(--greentx);}
.dock.warn{border-style:solid;border-color:var(--amber);background:var(--amberbg);color:var(--ambertx);}
.dock.lost{border-style:solid;border-color:var(--danger);background:var(--dangerbg);color:var(--dangertx);text-decoration:line-through;}

.risk{justify-self:end;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:4px 9px;border-radius:999px;
  border:1.5px solid var(--line);color:var(--faint);background:var(--panel);white-space:nowrap;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease),opacity var(--dur) var(--ease);}
.risk:empty{opacity:0;}
.risk.lost{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}
.risk.safe{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.risk.warn{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}

.edge{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:7px;
  border:1.5px dashed var(--line);background:var(--gray);
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),border-style var(--dur) var(--ease),opacity var(--dur) var(--ease);}
.edge .ecap{font-size:10.5px;font-weight:700;color:var(--faint);white-space:nowrap;transition:color var(--dur) var(--ease);}
.echips{display:flex;gap:6px;flex-wrap:wrap;}
.echips i{font-style:normal;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:5px;
  border:1px solid var(--line);background:var(--panel);color:var(--faint);
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease);}
.edge.on{border-style:solid;border-color:var(--amber);background:var(--amberbg);}
.edge.on .ecap{color:var(--ambertx);}
.edge.on .echips i.lit{border-color:var(--amber);background:var(--panel);color:var(--ambertx);}
.edge.on-green{border-style:solid;border-color:var(--green);background:var(--greenbg);}
.edge.on-green .ecap{color:var(--greentx);}
.edge.on-green .echips i.lit{border-color:var(--green);background:var(--panel);color:var(--greentx);}
.edge.dim{opacity:.34;}

.pgs{display:flex;gap:5px;margin-left:auto;}
.pgs i{display:block;width:24px;height:15px;border-radius:3px;border:1.5px solid var(--line);background:var(--panel);
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),background-image var(--dur) var(--ease);}
.pgs i.clean{border-color:var(--blue);background:var(--bluebg);}
.pgs i.dirty{border-color:var(--danger);background:var(--dangerbg);background-image:repeating-linear-gradient(-45deg,transparent,transparent 3px,rgba(195,73,53,.30) 3px,rgba(195,73,53,.30) 6px);}
.pgs i.writing{border-color:var(--amber);background:var(--amberbg);}
.pgs i.done{border-color:var(--green);background:var(--greenbg);}

.counts{display:flex;gap:10px;justify-content:center;align-items:center;}
.count{border:1.5px solid var(--line);border-radius:999px;background:var(--panel);padding:5px 13px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--muted);
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease),opacity var(--dur) var(--ease);}
.count:empty{opacity:0;}
.count.lit-blue{border-color:var(--blue);background:var(--bluebg);color:var(--bluetx);}
.count.lit-amber{border-color:var(--amber);background:var(--amberbg);color:var(--ambertx);}
.count.lit-green{border-color:var(--green);background:var(--greenbg);color:var(--greentx);}
.count.lit-danger{border-color:var(--danger);background:var(--dangerbg);color:var(--dangertx);}

.pillrow{display:flex;align-items:center;justify-content:center;}
.pill{border:1.5px solid var(--line);border-radius:999px;background:var(--panel);padding:4px 12px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--muted);
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),background var(--dur) var(--ease);}
.pill.green{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.pill.amber{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}
.pill.blue{color:var(--bluetx);border-color:var(--blue);background:var(--bluebg);}
.pill.danger{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}

.ctoken{position:absolute;z-index:4;min-width:64px;height:25px;padding:0 7px;border:1.5px solid var(--green);border-radius:6px;
  background:var(--greenbg);color:var(--greentx);font-family:var(--mono);font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;opacity:0;transform:translate(-50%,-50%);
  transition:left var(--dur) var(--ease),top var(--dur) var(--ease),opacity var(--dur) var(--ease),border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease);}
.ctoken.on{opacity:1;}
.ctoken.blue{border-color:var(--blue);background:var(--bluebg);color:var(--bluetx);}
.ctoken.amber{border-color:var(--amber);background:var(--amberbg);color:var(--ambertx);}
.ctoken.danger{border-color:var(--danger);background:var(--dangerbg);color:var(--dangertx);}

/* ---------- locate-chain stage: fd table -> struct file -> inode ---------- */
.ch-stage{display:grid;grid-template-columns:1fr 1fr 1.24fr;column-gap:34px;grid-template-rows:392px 30px;row-gap:14px;min-height:436px;}
.gcard{position:relative;z-index:2;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);padding:12px 13px;
  display:flex;flex-direction:column;justify-content:center;gap:6px;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),opacity var(--dur) var(--ease);}
.gcard .k{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--faint);transition:color var(--dur) var(--ease);}
.gcard .n{font-size:13px;font-weight:700;}
.gcard.blue{border-color:var(--blue);}.gcard.blue .k{color:var(--blue);}
.gcard.green{border-color:var(--green);}.gcard.green .k{color:var(--green);}
.gcard.amber{border-color:var(--amber);}.gcard.amber .k{color:var(--amber);}
.gcard.blue.active{background:var(--bluebg);}.gcard.green.active{background:var(--greenbg);}.gcard.amber.active{background:var(--amberbg);}
.gcard.dim{opacity:.4;}
.fdrow,.kv{display:flex;align-items:center;gap:8px;min-height:30px;border:1.5px solid var(--line);border-radius:6px;background:var(--gray);
  padding:4px 9px;font-size:11px;color:var(--muted);
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease),opacity var(--dur) var(--ease),transform var(--dur) var(--ease);}
.fdrow b,.kv b{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:0 0 auto;transition:color var(--dur) var(--ease);}
.kv span{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink);}
.fdrow.on,.kv.on{border-color:var(--blue);background:var(--bluebg);color:var(--bluetx);transform:translateX(2px);}
.fdrow.on b,.kv.on b{color:var(--blue);}
.kv.hot{border-color:var(--amber);background:var(--amberbg);color:var(--ambertx);}
.kv.hot b{color:var(--amber);}
.fdrow.ghost,.kv.ghost{border-style:dashed;opacity:.34;}
.isec{border:1.5px solid var(--line);border-radius:6px;background:var(--gray);padding:7px 9px;display:flex;flex-direction:column;gap:5px;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),opacity var(--dur) var(--ease);}
.isec .it{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--faint);transition:color var(--dur) var(--ease);}
.isec .iv{font-size:10.5px;color:var(--muted);}
.isec.on{border-color:var(--green);background:var(--greenbg);}.isec.on .it{color:var(--greentx);}.isec.on .iv{color:var(--greentx);}
.isec.hot{border-color:var(--amber);background:var(--amberbg);}.isec.hot .it{color:var(--ambertx);}.isec.hot .iv{color:var(--ambertx);}
.isec.dim{opacity:.36;}
.isec .pgs{margin-left:0;}

/* ---------- writeback stage: dirty-page meter + three triggers ---------- */
.wb-stage{display:grid;grid-template-rows:104px 1fr 88px 30px;row-gap:14px;min-height:472px;}
.panel-box{position:relative;z-index:2;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);padding:30px 14px 12px;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);}
.panel-title{position:absolute;left:13px;top:9px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--faint);}
.meter{position:relative;height:32px;border:1.5px solid var(--line);border-radius:7px;background:var(--gray);margin-top:6px;}
.mfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px 0 0 5px;background:var(--bluebg);border-right:2.5px solid var(--blue);
  transition:width var(--dur) var(--ease),background var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.mfill.warn{background:var(--amberbg);border-right-color:var(--amber);}
.mfill.bad{background:var(--dangerbg);border-right-color:var(--danger);}
.mark{position:absolute;top:-16px;bottom:-2px;width:0;border-left:1.5px dashed var(--muted);}
.mark em{position:absolute;right:5px;top:-3px;font-style:normal;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--muted);white-space:nowrap;}
.mark.bg{border-color:var(--amber);}.mark.bg em{color:var(--ambertx);}
.mark.hi{border-color:var(--danger);}.mark.hi em{color:var(--dangertx);}
.mlegend{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--muted);}
.trigbox{display:flex;flex-direction:column;gap:9px;justify-content:center;}
.rrow{min-height:38px;border:1.5px solid var(--line);border-radius:6px;background:var(--gray);font-size:11px;color:var(--muted);
  display:flex;align-items:center;padding:6px 11px;gap:9px;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease),opacity var(--dur) var(--ease),transform var(--dur) var(--ease);}
.rrow b{font-family:var(--mono);font-size:10.5px;flex:0 0 auto;color:var(--faint);transition:color var(--dur) var(--ease);}
.rrow .rtx{min-width:0;}
.rrow.on{border-color:var(--green);background:var(--greenbg);color:var(--greentx);transform:translateX(2px);}
.rrow.on b{color:var(--green);}
.rrow.warn{border-color:var(--amber);background:var(--amberbg);color:var(--ambertx);}.rrow.warn b{color:var(--amber);}
.rrow.bad{border-color:var(--danger);background:var(--dangerbg);color:var(--dangertx);}.rrow.bad b{color:var(--danger);}
.rrow.dim{opacity:.34;}
.tbar{margin-left:auto;flex:0 0 74px;height:8px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);overflow:hidden;}
.tbar i{display:block;height:100%;width:0;background:var(--amber);transition:width var(--dur) var(--ease),background var(--dur) var(--ease);}
.wb-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.gcard .s{font-size:11px;color:var(--muted);}
.gcard.bad{border-color:var(--danger);background:var(--dangerbg);}
.gcard.good{border-color:var(--green);background:var(--greenbg);}

.fs-stage{grid-template-rows:none;grid-auto-rows:auto;row-gap:10px;min-height:0;}

.layer .lnum{grid-area:n;}.lname{grid-area:m;}.lbody{grid-area:b;grid-auto-flow:row;}
.edge{padding:7px 11px;flex-wrap:wrap;}
.risk{display:none;}
.echips{flex-wrap:wrap;}

@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}

</head>
<body>
<div class="wrap">
  <header>
    <h1>从 buf[] 到盘片 · write / fsync 的四层存储与两条边界</h1>
    <p>配套笔记《4.2 重定向、同步》「详细流转：从 buf[] 到盘片」 · 全链路 · 定位链与元数据 · 回写时机 · 丢失边界 · O_DIRECT 与 mmap　·　<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="layout">
    <section class="viz" id="viz"></section>
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div id="stAct"></div>
        <div id="stDesc"></div>
      </div>
      <div class="codebox" id="codeBox" aria-label="当前场景代码"></div>
    </section>
  </div>
  <div class="controls">
    <button class="btn" id="btnPrev" type="button">‹ 上一步</button>
    <button class="btn primary" id="btnPlay" type="button">播放</button>
    <button class="btn" id="btnNext" type="button">下一步 ›</button>
    <div class="dots" id="dots" aria-label="步骤导航"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
const viz=document.getElementById('viz');
const el=id=>document.getElementById(id);
const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const SENTINEL=String.fromCharCode(1);

function escapeHtml(text){return text.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));}
/* Comment is split off first, string literals parked behind digit-free sentinels,
   so no later pass can ever match inside the span markup it just inserted. */
function highlightC(line){
  const parts=line.match(/^(.*?)(\/\/.*)?$/);
  let code=parts?parts[1]:line;
  const comment=parts&&parts[2]?parts[2]:'';
  const strings=[];
  code=code.replace(/"(?:\\.|[^"\\])*"/g,value=>{strings.push(escapeHtml(value));return SENTINEL+String.fromCharCode(65+strings.length-1)+SENTINEL;});
  code=escapeHtml(code)
    .replace(/\b(int|void|char|ssize_t|size_t|off_t|struct|FILE)\b/g,'<span class="type">$1</span>')
    .replace(/\b(open|write|read|fwrite|fflush|fsync|fdatasync|lseek|dup|close|mmap|msync|memcpy|posix_memalign)\b/g,'<span class="fn">$1</span>')
    .replace(/\b(fd2|fd|buf|fp|len|O_RDWR|O_DIRECT|O_APPEND|SEEK_SET|PROT_WRITE|MAP_SHARED|MS_SYNC)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(\d+)\b/g,'<span class="num">$1</span>')
    .replace(new RegExp(SENTINEL+'([A-Z])'+SENTINEL,'g'),(_,name)=>'<span class="str">'+strings[name.charCodeAt(0)-65]+'</span>');
  return code+(comment?'<span class="cmt">'+escapeHtml(comment)+'</span>':'');
}
function codePanel(lines){return lines.map((line,index)=>'<div class="cl" id="codeLine'+index+'">'+highlightC(line||' ')+'</div>').join('');}
function classes(id,value){const node=el(id);if(node)node.className=value;}
function setPill(id,text,tone){const node=el(id);if(!node)return;node.textContent=text||'';node.className='pill'+(tone?' '+tone:'');}

/* Persistent arrow controller: one path + filled triangle head + source port per wire, created once. */
function createWires(stageId,specs){
  const stage=el(stageId);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id=stageId+'-svg';svg.classList.add('wire-svg');svg.setAttribute('preserveAspectRatio','none');stage.appendChild(svg);
  const entries=specs.map(spec=>{
    const line=document.createElementNS('http://www.w3.org/2000/svg','path');
    const head=document.createElementNS('http://www.w3.org/2000/svg','path');
    const port=document.createElementNS('http://www.w3.org/2000/svg','circle');
    line.id=stageId+'-'+spec.id;head.id=line.id+'-head';port.id=line.id+'-port';port.setAttribute('r','4');
    line.classList.add('wire-line',spec.color);head.classList.add('wire-head',spec.color);port.classList.add('wire-port',spec.color);
    svg.append(line,head,port);return {...spec,line,head,port};
  });
  let active=new Set();let timers=[];
  function geometry(item){
    const sr=stage.getBoundingClientRect(),source=el(item.from)?.getBoundingClientRect(),target=el(item.to)?.getBoundingClientRect();
    if(!source||!target)return;
    const sx=source.left-sr.left,sy=source.top-sr.top,sw=source.width,sh=source.height;
    const tx=target.left-sr.left,ty=target.top-sr.top,tw=target.width,th=target.height;
    const scx=sx+sw/2,scy=sy+sh/2,tcx=tx+tw/2,tcy=ty+th/2;
    const horizontal=Math.abs(tcx-scx)>=Math.abs(tcy-scy);
    const spread=item.spread||0;
    let x1,y1,x2,y2;
    if(horizontal){const right=tcx>=scx;x1=right?sx+sw:sx;y1=scy;x2=right?tx:tx+tw;y2=tcy+spread;}
    else{const down=tcy>=scy;x1=scx;y1=down?sy+sh:sy;x2=tcx+spread;y2=down?ty:ty+th;}
    const dx=x2-x1,dy=y2-y1,length=Math.hypot(dx,dy)||1,ux=dx/length,uy=dy/length,baseX=x2-ux*9,baseY=y2-uy*9;
    const d=horizontal?`M ${x1} ${y1} C ${x1+dx*.45} ${y1}, ${baseX-dx*.45} ${baseY}, ${baseX} ${baseY}`:`M ${x1} ${y1} C ${x1} ${y1+dy*.45}, ${baseX} ${baseY-dy*.45}, ${baseX} ${baseY}`;
    const px=-uy*5,py=ux*5;
    item.line.setAttribute('d',d);item.head.setAttribute('d',`M ${x2} ${y2} L ${baseX+px} ${baseY+py} L ${baseX-px} ${baseY-py} Z`);
    item.port.setAttribute('cx',x1);item.port.setAttribute('cy',y1);
  }
  function layout(){const rect=stage.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);entries.forEach(geometry);}
  function draw(item){
    const length=item.line.getTotalLength();
    item.line.style.transition='none';item.line.style.strokeDasharray=length;item.line.style.strokeDashoffset=length;
    void item.line.getBoundingClientRect();
    item.line.style.transition='';item.line.style.strokeDashoffset='0';
    const timeout=setTimeout(()=>{item.line.style.strokeDasharray='';item.line.style.strokeDashoffset='';},560);timers.push(timeout);
  }
  function setClass(item,state){
    const suffix=' '+item.color+(state?' '+state:'');
    item.line.className.baseVal='wire-line'+suffix;item.head.className.baseVal='wire-head'+suffix;item.port.className.baseVal='wire-port'+suffix;
    if(state==='on')item.head.classList.add('drawing');
  }
  function sync(ids){
    layout();const wanted=new Set(ids||[]),hasAny=wanted.size>0;let stagger=0;
    entries.forEach(item=>{
      if(wanted.has(item.id)){setClass(item,'on');if(!active.has(item.id)&&!reducedMotion()){const delay=stagger++*160;timers.push(setTimeout(()=>draw(item),delay));}}
      else setClass(item,hasAny?'':'hint');
    });active=wanted;
  }
  const observer=new ResizeObserver(layout);observer.observe(stage);window.addEventListener('resize',layout);layout();
  return {sync,layout,destroy(){observer.disconnect();window.removeEventListener('resize',layout);timers.forEach(clearTimeout);timers=[];}};
}

/* The data token glides between docks; positions come from the live dock rectangles. */
function makePlacer(stageId){
  return function place(tokenId,slotId,extra){
    const token=el(tokenId);if(!token)return;
    if(!slotId){token.className='ctoken';return;}
    const stage=el(stageId),slot=el(slotId);if(!stage||!slot)return;
    const sr=stage.getBoundingClientRect(),r=slot.getBoundingClientRect();
    token.style.left=(r.left-sr.left+r.width/2)+'px';
    token.style.top=(r.top-sr.top+r.height/2)+'px';
    token.className='ctoken on'+(extra?' '+extra:'');
  };
}

/* ============================ 持久性阶梯（三个场景共用） ============================ */
const DOCKS=['Buf','Stdio','PC','DC','Media'];
function ladderStageHtml(p,caption){
  return '<div class="vcap">'+caption+'</div><div class="stage fs-stage" id="'+p+'Stage">'+
  '<section class="layer" id="'+p+'L1"><span class="lnum">①</span>'+
    '<span class="lname"><b>用户态内存</b><em>进程虚拟内存 · 内核不知情</em></span>'+
    '<div class="lbody">'+
      '<div class="station" id="'+p+'Buf"><span class="sk">buf[]</span><span class="stx">应用缓冲区</span><span class="dock" id="'+p+'BufDock"></span></div>'+
      '<div class="station" id="'+p+'Stdio"><span class="sk">FILE*</span><span class="stx">stdio 库缓冲</span><span class="dock" id="'+p+'StdioDock"></span></div>'+
    '</div><span class="risk" id="'+p+'R1"></span></section>'+
  '<div class="edge" id="'+p+'E1"><span class="ecap">↓ 边界一 用户态 / 内核态</span><span class="echips">'+
    '<i id="'+p+'E1c0">trap</i><i id="'+p+'E1c1">fd→file→inode</i><i id="'+p+'E1c2">copy_from_user</i><i id="'+p+'E1c3">PG_dirty</i></span></div>'+
  '<section class="layer" id="'+p+'L2"><span class="lnum">②</span>'+
    '<span class="lname"><b>内核页缓存</b><em>位于 RAM · i_mapping · 4KB 页</em></span>'+
    '<div class="lbody">'+
      '<div class="station" id="'+p+'PC"><span class="sk">page cache</span>'+
        '<span class="ram-tag" title="Page Cache 位于 RAM（物理内存）">RAM · 物理内存</span>'+
        '<span class="pgs" id="'+p+'Pgs"><i></i><i></i><i></i><i></i></span>'+
        '<span class="dock" id="'+p+'PCDock"></span></div>'+
    '</div><span class="risk" id="'+p+'R2"></span></section>'+
  '<div class="edge" id="'+p+'E2"><span class="ecap">↓ 边界二 内核 / 硬件</span><span class="echips">'+
    '<i id="'+p+'E2c0">bio</i><i id="'+p+'E2c1">blk-mq</i><i id="'+p+'E2c2">驱动</i><i id="'+p+'E2c3">DMA</i></span></div>'+
  '<section class="layer" id="'+p+'L3"><span class="lnum">③</span>'+
    '<span class="lname"><b>盘上 DRAM 缓存</b><em>控制器写缓存 · 易失</em></span>'+
    '<div class="lbody">'+
      '<div class="station" id="'+p+'DC"><span class="sk">disk cache</span><span class="stx">盘回复「写完了」≠ 已上介质</span><span class="dock" id="'+p+'DCDock"></span></div>'+
    '</div><span class="risk" id="'+p+'R3"></span></section>'+
  '<div class="edge" id="'+p+'E3"><span class="ecap">↓ 缓存 / 介质</span><span class="echips">'+
    '<i id="'+p+'E3c0">FLUSH</i><i id="'+p+'E3c1">FUA</i><i id="'+p+'E3c2">PLP 超级电容</i></span></div>'+
  '<section class="layer" id="'+p+'L4"><span class="lnum">④</span>'+
    '<span class="lname"><b>盘片 / NAND</b><em>持久介质</em></span>'+
    '<div class="lbody">'+
      '<div class="station" id="'+p+'Media"><span class="sk">persistent media</span><span class="stx">数据到底了</span><span class="dock" id="'+p+'MediaDock"></span></div>'+
    '</div><span class="risk" id="'+p+'R4"></span></section>'+
  '<div class="counts"><span class="count" id="'+p+'C0"></span><span class="count" id="'+p+'C1"></span><span class="count" id="'+p+'C2"></span></div>'+
  '<div class="pillrow"><span class="pill" id="'+p+'Pill"></span></div>'+
  '<div class="ctoken" id="'+p+'Data">4KB 数据</div></div>';
}
function makeLadderScene(opts){
  const p=opts.prefix;let observer,current=null;
  const place=makePlacer(p+'Stage');
  function mount(){
    viz.innerHTML=ladderStageHtml(p,opts.caption);
    observer=new ResizeObserver(()=>{if(current)place(p+'Data',current.at?p+current.at+'Dock':null,current.tokenCls);});
    observer.observe(el(p+'Stage'));
  }
  function paint(s){
    current=s;
    [1,2,3,4].forEach(n=>{
      const tone=s.lay&&s.lay[n];
      classes(p+'L'+n,'layer'+(tone?' on-'+tone:'')+(s.dim&&s.dim.includes(n)?' dim':'')+(s.bypass===n?' bypass':''));
      const badge=el(p+'R'+n),cfg=s.risk&&s.risk[n];
      badge.textContent=cfg?cfg[0]:'';badge.className='risk'+(cfg?' '+cfg[1]:'');
    });
    [1,2,3].forEach(n=>{
      const cfg=s.edge&&s.edge[n];
      classes(p+'E'+n,'edge'+(cfg?(cfg.tone==='green'?' on-green':' on'):'')+(s.edim&&s.edim.includes(n)?' dim':''));
      [0,1,2,3].forEach(i=>{const chip=el(p+'E'+n+'c'+i);if(chip)chip.classList.toggle('lit',!!(cfg&&cfg.chips&&cfg.chips.includes(i)));});
    });
    ['Buf','Stdio','PC','DC','Media'].forEach(name=>{
      const node=el(p+name);if(node)node.className='station'+((s.st&&s.st[name])?' on-'+s.st[name]:'');
    });
    el(p+'Pgs').querySelectorAll('i').forEach((page,i)=>{page.className=(s.pgs&&s.pgs[i])||'';});
    DOCKS.forEach(name=>{
      const dock=el(p+name+'Dock'),cfg=s.docks&&s.docks[name];
      dock.textContent=cfg?cfg[0]:'';dock.className='dock'+(cfg?' '+cfg[1]:'');
    });
    place(p+'Data',s.at?p+s.at+'Dock':null,s.tokenCls);
    [0,1,2].forEach(i=>{
      const node=el(p+'C'+i),cfg=s.cnt&&s.cnt[i];
      node.textContent=cfg?cfg[0]:'';node.className='count'+(cfg&&cfg[1]?' lit-'+cfg[1]:'');
    });
    setPill(p+'Pill',s.pill,s.pillC);
  }
  return {id:opts.id,label:opts.label,sub:opts.sub,steps:opts.steps,code:opts.code,mount,paint,destroy(){observer?.disconnect();}};
}

/* ============================ 场景一 · 全链路 ============================ */
const pathScene=makeLadderScene({
  id:'path',prefix:'pa',label:'全链路 · buf[] → 盘片',sub:'4 layers · 2 boundaries',
  caption:'<b>一次写入的完整旅程</b>：4 层存储、2 条边界。每一层都有各自的「谁来推它」和「怎么丢」。',
  code:[
    'char buf[4096];',
    'fwrite(buf, 1, n, fp);  // 只 memcpy 进 stdio 库缓冲',
    'fflush(fp);             // 库缓冲 -> write()，跨过 ①',
    'write(fd, buf, n);      // copy_from_user -> 页缓存',
    '                        // 打上 PG_dirty，立即返回',
    'fsync(fd);              // 提交 bio + 等待 + FLUSH',
    '                        // 它返回时数据才真在盘片上',
    'close(fd);'
  ],
  steps:[
    {chip:'总览',chipC:'c0',title:'四层存储，两条边界',
     desc:'一份数据从 <code>buf[]</code> 走到磁盘介质，要穿过 <b>4 层存储</b>（用户态内存 → 内核页缓存 → 盘上缓存 → 持久介质），跨过 <b>2 条边界</b>（用户态/内核态、内核/硬件）。看懂这张梯子，后面所有问题都是它的推论。',
     lines:[0],hl:'blue',at:null,lay:{},risk:{},edge:{},pgs:[],st:{},
     cnt:[['CPU 拷贝 0'],['系统调用 0'],['数据最深 —']],
     pill:'4 layers, 2 boundaries',pillC:''},

    {chip:'① 用户态',chipC:'cb',title:'printf / fwrite 只是 memcpy 到库缓冲',
     desc:'<span class="blue">stdio 库缓冲</span>就在进程自己的内存里：<code>fwrite</code> 把字节 memcpy 进去就返回了，<b>此时还没有任何系统调用</b>。默认模式：普通文件<b>全缓冲</b>（缓冲区通常取文件系统块大小，如 4096 字节），连到终端是<b>行缓冲</b>，<code>stderr</code> <b>无缓冲</b>。',
     lines:[0,1],hl:'blue',at:'Stdio',tokenCls:'blue',lay:{1:'blue'},dim:[2,3,4],edim:[1,2,3],
     risk:{1:['kill -9 即丢','lost']},edge:{},pgs:[],st:{Stdio:'blue'},
     cnt:[['CPU 拷贝 0'],['系统调用 0'],['数据最深 ①','blue']],
     pill:'no syscall yet — bytes are still yours',pillC:'blue'},

    {chip:'① 谁来推',chipC:'cd',title:'这块内存内核完全不知情',
     desc:'进程被 <code>kill -9</code>、或段错误崩溃时，库缓冲里还没 <code>write</code> 出去的数据<b class="danger">直接消失</b>——内核根本不知道它存在。只有三件事能把它推到下一层：<code>fflush()</code>、<b>缓冲写满</b>、进程<b>正常</b>退出（<code>exit</code> 会刷 stdio 缓冲，<code>_exit</code> 和被信号杀死则不会）。',
     lines:[1,2],hl:'danger',at:'Stdio',tokenCls:'danger',lay:{1:'danger'},dim:[2,3,4],edim:[1,2,3],
     risk:{1:['kill -9 即丢','lost']},edge:{},pgs:[],st:{Stdio:'danger'},

/* ============================ 步进引擎 ============================ */
const SCENES=[pathScene,chainScene,writebackScene,lossScene,bypassScene];
const tabsBox=el('tabs'),stTitle=el('stTitle'),stChip=el('stChip'),stAct=el('stAct'),stDesc=el('stDesc'),
      codeBox=el('codeBox'),readout=el('readout'),dotsBox=el('dots'),btnPrev=el('btnPrev'),btnNext=el('btnNext'),btnPlay=el('btnPlay');
SCENES.forEach((scene,index)=>{
  const tab=document.createElement('button');tab.type='button';tab.className='tab';
  tab.innerHTML='<span class="t">'+scene.label+'</span><span class="s">'+scene.sub+'</span>';
  tab.addEventListener('click',()=>{stop();switchScene(index);});tabsBox.appendChild(tab);
});
let sceneIndex=0,stepIndex=0,dotEls=[],timer=null;
function switchScene(index){
  SCENES[sceneIndex]?.destroy?.();
  sceneIndex=index;stepIndex=0;
  [...tabsBox.children].forEach((tab,i)=>tab.classList.toggle('on',i===sceneIndex));
  const scene=SCENES[sceneIndex];
  scene.mount();codeBox.innerHTML=codePanel(scene.code);dotsBox.innerHTML='';dotEls=[];
  scene.steps.forEach((step,i)=>{
    const dot=document.createElement('button');dot.type='button';dot.className='dot';
    dot.title=step.title;dot.setAttribute('aria-label',step.title);
    dot.addEventListener('click',()=>{stop();go(i);});dotsBox.appendChild(dot);dotEls.push(dot);
  });
  go(0);
}
function go(index){
  const steps=SCENES[sceneIndex].steps;
  stepIndex=Math.max(0,Math.min(steps.length-1,index));
  const step=steps[stepIndex];
  SCENES[sceneIndex].paint(step);
  codeBox.querySelectorAll('.cl').forEach((line,i)=>line.className='cl '+(step.lines.includes(i)?'hl-'+step.hl:''));
  stTitle.textContent=SCENES[sceneIndex].label;
  stChip.textContent=step.chip;stChip.className='chip '+step.chipC;
  stAct.textContent='▸ '+step.title;stDesc.innerHTML=step.desc;
  dotEls.forEach((dot,i)=>{dot.classList.toggle('now',i===stepIndex);dot.classList.toggle('done',i<stepIndex);});
  readout.textContent=stepIndex+' / '+(steps.length-1);
  btnPrev.disabled=stepIndex===0;btnNext.disabled=stepIndex===steps.length-1;
  try{history.replaceState(null,'','#scene='+SCENES[sceneIndex].id+'&step='+stepIndex);}catch(error){}
  if(stepIndex===steps.length-1)stop();
}
function play(){
  if(stepIndex===SCENES[sceneIndex].steps.length-1)go(0);
  btnPlay.textContent='暂停';
  timer=setInterval(()=>{stepIndex<SCENES[sceneIndex].steps.length-1?go(stepIndex+1):stop();},3200);
}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='播放';}
btnPlay.addEventListener('click',()=>timer?stop():play());
btnPrev.addEventListener('click',()=>{stop();go(stepIndex-1);});
btnNext.addEventListener('click',()=>{stop();go(stepIndex+1);});
document.addEventListener('keydown',event=>{
  if(event.key==='ArrowRight'){stop();go(stepIndex+1);}
  else if(event.key==='ArrowLeft'){stop();go(stepIndex-1);}
  else if(event.key===' '){event.preventDefault();timer?stop():play();}
});
const hashScene=location.hash.match(/scene=(\w+)/),hashStep=location.hash.match(/step=(\d+)/);
let initialScene=0;
if(hashScene){const found=SCENES.findIndex(scene=>scene.id===hashScene[1]);if(found>=0)initialScene=found;}
switchScene(initialScene);
if(hashStep)go(Number(hashStep[1]));
</script>
</body>
