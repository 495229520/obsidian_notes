<?xml version="1.0" encoding="utf-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1160px"
    height="560px"
    viewBox="0 0 1160 560"
    version="1.1"
    shape-rendering="geometricPrecision"
>
    <title>epoll ET 非阻塞读空边界</title>
    <desc>Explain why edge-triggered epoll requires non-blocking read until EAGAIN, and why blocking read can stall the event loop.</desc>

    <rect x="0" y="0" width="1160" height="560" fill="rgb(245, 244, 237)" />

    <defs>
        <marker id="arrowDark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
            <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
        <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
            <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
        <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
            <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.22" />
        </filter>
    </defs>

    <text
        x="580"
        y="38"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#1f2937"
        font-size="28"
        font-weight="700"
        font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"
    >epoll ET：为什么必须非阻塞读到 EAGAIN</text>

    <g id="data-path">
        <rect x="60" y="82" width="1040" height="108" rx="22" fill="#ecfeff" stroke="#06b6d4" stroke-width="2.2" filter="url(#shadow)" />
        <text x="94" y="112" fill="#164e63" font-size="19" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">数据搬运路径</text>

        <rect x="100" y="132" width="150" height="42" rx="14" fill="#ffffff" stroke="#475569" stroke-width="1.8" />
        <text x="175" y="153" text-anchor="middle" dominant-baseline="middle" fill="#1f2937" font-size="16" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">网络数据到达</text>

        <rect x="340" y="122" width="220" height="62" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
        <text x="450" y="145" text-anchor="middle" dominant-baseline="middle" fill="#1e3a8a" font-size="17" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">内核接收缓冲区</text>
        <text x="450" y="169" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="13" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">fd 是否可读看这里</text>

        <rect x="650" y="132" width="150" height="42" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="1.8" />
        <text x="725" y="153" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="16" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">read / recv</text>

        <rect x="890" y="122" width="160" height="62" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
        <text x="970" y="145" text-anchor="middle" dominant-baseline="middle" fill="#166534" font-size="17" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">用户态 buf</text>
        <text x="970" y="169" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="13" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">交给业务解析</text>

        <line x1="250" y1="153" x2="334" y2="153" stroke="#475569" stroke-width="2.2" marker-end="url(#arrowDark)" />
        <line x1="560" y1="153" x2="644" y2="153" stroke="#475569" stroke-width="2.2" marker-end="url(#arrowDark)" />
        <line x1="800" y1="153" x2="884" y2="153" stroke="#475569" stroke-width="2.2" marker-end="url(#arrowDark)" />
    </g>

    <g id="lt-panel">
        <rect x="60" y="230" width="500" height="236" rx="24" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.2" filter="url(#shadow)" />
        <rect x="190" y="250" width="240" height="46" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
        <text x="310" y="273" text-anchor="middle" dominant-baseline="middle" fill="#166534" font-size="19" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">LT：只要还有数据就提醒</text>

        <rect x="104" y="326" width="144" height="54" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" />
        <text x="176" y="345" text-anchor="middle" dominant-baseline="middle" fill="#14532d" font-size="15" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">缓冲区仍有数据</text>
        <text x="176" y="366" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="13" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">未读完</text>

        <rect x="376" y="326" width="144" height="54" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" />
        <text x="448" y="345" text-anchor="middle" dominant-baseline="middle" fill="#14532d" font-size="15" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">下次 epoll_wait</text>
        <text x="448" y="366" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="13" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">继续返回</text>

        <line x1="248" y1="353" x2="370" y2="353" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrowGreen)" />
        <text x="310" y="335" text-anchor="middle" dominant-baseline="middle" fill="#166534" font-size="13" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">水平触发</text>

        <text x="310" y="422" text-anchor="middle" dominant-baseline="middle" fill="#14532d" font-size="15" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
            <tspan x="310" dy="0">可以分批读；只要接收缓冲区还有数据，</tspan>
            <tspan x="310" dy="22">后续仍会收到可读通知。</tspan>
        </text>
    </g>

    <g id="et-panel">
        <rect x="600" y="230" width="500" height="236" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="2.2" filter="url(#shadow)" />
        <rect x="730" y="250" width="240" height="46" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="2" />
        <text x="850" y="273" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="19" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">ET：状态变化只提醒一次</text>

        <rect x="636" y="322" width="132" height="58" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="1.8" />
        <text x="702" y="342" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="15" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">新数据到达</text>
        <text x="702" y="364" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="13" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">触发一次</text>

        <rect x="820" y="322" width="132" height="58" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="1.8" />
        <text x="886" y="342" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="15" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">循环读取</text>
        <text x="886" y="364" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="13" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">直到读空</text>

        <rect x="996" y="322" width="72" height="58" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8" />
        <text x="1032" y="342" text-anchor="middle" dominant-baseline="middle" fill="#991b1b" font-size="15" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">EAGAIN</text>
        <text x="1032" y="364" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="12" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">停下边界</text>

        <line x1="768" y1="351" x2="814" y2="351" stroke="#475569" stroke-width="2.2" marker-end="url(#arrowDark)" />
        <line x1="952" y1="351" x2="990" y2="351" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrowRed)" />

        <text x="850" y="422" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="15" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
            <tspan x="850" dy="0">非阻塞 fd 读空时返回 -1 + EAGAIN；</tspan>
            <tspan x="850" dy="22">阻塞 fd 会睡眠，事件循环被卡住。</tspan>
        </text>
    </g>

    <g id="bottom-rule">
        <rect x="180" y="500" width="800" height="36" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.8" />
        <text x="580" y="518" text-anchor="middle" dominant-baseline="middle" fill="#5b21b6" font-size="16" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
            记忆：ET 要把当前接收缓冲区读空，并用 EAGAIN / EWOULDBLOCK 作为本轮结束信号
        </text>
    </g>
</svg>
