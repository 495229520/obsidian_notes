<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>连接对象的所有权边界</title>
  <desc>左侧为连接表、TcpConnection、Socket、Channel、EventLoop 与内核 fd 之间的三类边：独占、共享、观察；右侧为三种边的图例，以及把边画反之后的后果。</desc>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B968A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="600" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">所有权边界：谁负责 close(fd)，谁只是看着它</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">同一张图上有三种边 —— 独占、共享、观察。虚线那一类是用来防悬空指针和引用环的</text>

  <!-- ============ A 区 ============ -->
  <text x="48" y="118" font-size="15" font-weight="700" fill="#4A473F">A · 对象之间的三类边</text>
  <rect x="48" y="132" width="700" height="400" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="310" y="150" width="340" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="480" y="172" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">TcpServer 连接表</text>
  <text x="480" y="191" font-size="10.5" fill="#2C4460" text-anchor="middle">map&lt;string, shared_ptr&lt;TcpConnection&gt;&gt;</text>

  <line x1="476" y1="206" x2="476" y2="246" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="484" y1="206" x2="484" y2="246" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="498" y="232" font-size="10" fill="#4A473F">shared_ptr · 共享拥有</text>

  <rect x="230" y="250" width="400" height="150" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="248" y="272" font-size="13" font-weight="700" fill="#24473F">TcpConnection</text>

  <rect x="248" y="282" width="364" height="30" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="430" y="302" font-size="10.5" fill="#4A473F" text-anchor="middle">input / output buffer · 连接状态机</text>

  <rect x="248" y="324" width="176" height="60" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="336" y="346" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">Socket / UniqueFd</text>
  <text x="336" y="365" font-size="10" fill="#6B4E28" text-anchor="middle">析构时 close(fd)</text>

  <rect x="436" y="324" width="176" height="60" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="524" y="346" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">Channel</text>
  <text x="524" y="365" font-size="10" fill="#4A3F68" text-anchor="middle">fd + events + 回调</text>

  <rect x="62" y="250" width="140" height="66" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="132" y="272" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">EventLoop · Poller</text>
  <text x="132" y="290" font-size="10" fill="#6B675C" text-anchor="middle">epoll_wait()</text>
  <text x="132" y="306" font-size="10" fill="#6B675C" text-anchor="middle">只存 Channel*</text>
  <line x1="204" y1="283" x2="226" y2="283" stroke="#9B968A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrG)"/>

  <rect x="62" y="334" width="140" height="66" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="132" y="356" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">定时器 · 异步回调</text>
  <text x="132" y="374" font-size="10" fill="#6B675C" text-anchor="middle">weak_ptr 观察</text>
  <text x="132" y="390" font-size="10" fill="#6B675C" text-anchor="middle">lock() 成功才用</text>
  <line x1="204" y1="367" x2="226" y2="367" stroke="#9B968A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrG)"/>

  <rect x="300" y="456" width="290" height="54" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="445" y="478" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">内核：conn_fd</text>
  <text x="445" y="497" font-size="10" fill="#733428" text-anchor="middle">关掉后号码立刻可被复用</text>

  <line x1="336" y1="400" x2="336" y2="452" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr2)"/>
  <text x="192" y="432" font-size="10" fill="#4A473F">独占：只有它 close</text>
  <line x1="524" y1="400" x2="524" y2="452" stroke="#9B968A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <text x="536" y="432" font-size="10" fill="#4A473F">观察：只关注事件</text>

  <!-- ============ B 区 ============ -->
  <text x="768" y="118" font-size="15" font-weight="700" fill="#4A473F">B · 边的语义，与画反之后的后果</text>
  <rect x="768" y="132" width="424" height="400" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <text x="784" y="160" font-size="11" font-weight="700" fill="#6B675C">三种边</text>

  <line x1="784" y1="182" x2="844" y2="182" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arr2)"/>
  <text x="856" y="186" font-size="10.5" fill="#4A473F">独占：唯一的 RAII 拥有者</text>

  <line x1="784" y1="208" x2="844" y2="208" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="784" y1="215" x2="844" y2="215" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="856" y="215" font-size="10.5" fill="#4A473F">共享：连接表与回调共同延寿</text>

  <line x1="784" y1="243" x2="844" y2="243" stroke="#9B968A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <text x="856" y="247" font-size="10.5" fill="#4A473F">观察：不延寿，用前先检查</text>

  <rect x="784" y="275" width="180" height="28" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="964" y="275" width="212" height="28" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="794" y="294" font-size="11" font-weight="700" fill="#4A473F">把边画反了</text>
  <text x="974" y="294" font-size="11" font-weight="700" fill="#4A473F">后果</text>

  <rect x="784" y="303" width="180" height="44" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="964" y="303" width="212" height="44" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="794" y="330" font-size="10.5" fill="#4A473F">Channel 也 close(fd)</text>
  <text x="974" y="322" font-size="10.5" fill="#733428">重复 close，第二次关掉</text>
  <text x="974" y="338" font-size="10.5" fill="#733428">的是被复用的新连接</text>

  <rect x="784" y="347" width="180" height="44" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="964" y="347" width="212" height="44" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="794" y="374" font-size="10.5" fill="#4A473F">Channel 强持 shared_ptr</text>
  <text x="974" y="366" font-size="10.5" fill="#733428">Conn ⇄ Channel 引用环</text>
  <text x="974" y="382" font-size="10.5" fill="#733428">计数永远降不到 0</text>

  <rect x="784" y="391" width="180" height="44" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="964" y="391" width="212" height="44" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="794" y="418" font-size="10.5" fill="#4A473F">回调裸捕获 this</text>
  <text x="974" y="410" font-size="10.5" fill="#733428">回调排队期间对象析构</text>
  <text x="974" y="426" font-size="10.5" fill="#733428">执行时访问悬空内存</text>

  <text x="784" y="470" font-size="11" font-weight="700" fill="#6B675C">怎么记</text>
  <text x="784" y="492" font-size="10.5" fill="#4A473F">需要它活着 → shared_ptr</text>
  <text x="784" y="510" font-size="10.5" fill="#4A473F">只想知道它还在不在 → weak_ptr</text>

  <text x="48" y="572" font-size="11.5" fill="#4A473F">一个 fd 只能有一个 RAII 拥有者；别的对象要么共享连接对象的生命周期，要么退回到观察关系，没有第三种。</text>
</svg>
