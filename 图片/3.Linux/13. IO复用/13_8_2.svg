<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#4f6f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .subtitle { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .box-title { font: 700 17px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .box-text { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #31465a; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .owner { fill: #edf7ed; stroke: #4f8f55; stroke-width: 2.3; rx: 20; }
      .observer { fill: #f0f6ff; stroke: #2f7ab8; stroke-width: 2; rx: 18; }
      .resource { fill: #fff8e8; stroke: #d49b38; stroke-width: 2; rx: 18; }
      .danger { fill: #fff0f0; stroke: #c96b6b; stroke-width: 2; rx: 18; }
      .note { fill: #fffdf5; stroke: #c6b178; stroke-width: 1.5; rx: 14; }
      .own-line { stroke: #4f6f8f; stroke-width: 2.2; fill: none; marker-end: url(#arrow-hollow); }
      .weak-line { stroke: #7b8b9b; stroke-width: 1.8; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow-hollow); }
    </style>
  </defs>

  <text x="550" y="48" text-anchor="middle" class="title">连接对象的所有权边界</text>
  <text x="550" y="76" text-anchor="middle" class="subtitle">Socket / unique_fd 独占 fd，Channel 观察 fd，回调用 weak_ptr 防止悬空和引用环</text>

  <rect x="72" y="136" width="220" height="104" class="owner"/>
  <text x="182" y="168" text-anchor="middle" class="box-title">连接表</text>
  <text x="182" y="194" text-anchor="middle" class="box-text">map&lt;name, shared_ptr&gt;</text>
  <text x="182" y="216" text-anchor="middle" class="small">拥有活跃 TcpConnection</text>

  <rect x="424" y="126" width="252" height="124" class="owner"/>
  <text x="550" y="162" text-anchor="middle" class="box-title">TcpConnection</text>
  <text x="550" y="188" text-anchor="middle" class="box-text">连接状态 + buffer + 回调</text>
  <text x="550" y="212" text-anchor="middle" class="small">组合 Socket 与 Channel</text>

  <rect x="812" y="136" width="220" height="104" class="observer"/>
  <text x="922" y="168" text-anchor="middle" class="box-title">EventLoop / Poller</text>
  <text x="922" y="194" text-anchor="middle" class="box-text">epoll_wait()</text>
  <text x="922" y="216" text-anchor="middle" class="small">只监听和分发事件</text>

  <path d="M 292 188 L 422 188" class="own-line"/>
  <text x="356" y="174" text-anchor="middle" class="small">shared_ptr</text>
  <path d="M 676 188 L 810 188" class="weak-line"/>
  <text x="742" y="174" text-anchor="middle" class="small">注册事件，不拥有连接</text>

  <rect x="182" y="344" width="220" height="104" class="resource"/>
  <text x="292" y="376" text-anchor="middle" class="box-title">Socket / unique_fd</text>
  <text x="292" y="402" text-anchor="middle" class="box-text">独占 fd 所有权</text>
  <text x="292" y="424" text-anchor="middle" class="small">析构时 close(fd)</text>

  <rect x="500" y="344" width="220" height="104" class="observer"/>
  <text x="610" y="376" text-anchor="middle" class="box-title">Channel</text>
  <text x="610" y="402" text-anchor="middle" class="box-text">fd + events + callbacks</text>
  <text x="610" y="424" text-anchor="middle" class="small">观察 fd，不 close(fd)</text>

  <rect x="806" y="344" width="220" height="104" class="danger"/>
  <text x="916" y="376" text-anchor="middle" class="box-title">回调 / Timer</text>
  <text x="916" y="402" text-anchor="middle" class="box-text">weak_ptr.lock()</text>
  <text x="916" y="424" text-anchor="middle" class="small">对象存在才执行</text>

  <path d="M 498 248 C 430 290 344 306 302 342" class="own-line"/>
  <text x="390" y="302" text-anchor="middle" class="small">unique ownership</text>

  <path d="M 590 250 C 602 288 608 306 610 342" class="own-line"/>
  <text x="655" y="302" text-anchor="middle" class="small">组合</text>

  <path d="M 720 396 L 804 396" class="weak-line"/>
  <text x="760" y="382" text-anchor="middle" class="small">weak_ptr tie</text>

  <path d="M 610 344 C 672 296 800 284 922 242" class="weak-line"/>
  <text x="778" y="300" text-anchor="middle" class="small">epoll 中可保存 Channel 指针</text>

  <rect x="128" y="516" width="385" height="64" class="note"/>
  <text x="320" y="544" text-anchor="middle" class="box-title">拥有关系</text>
  <text x="320" y="566" text-anchor="middle" class="small">连接表和临时回调用 shared_ptr，fd 用独占 RAII 对象管理</text>

  <rect x="588" y="516" width="385" height="64" class="note"/>
  <text x="780" y="544" text-anchor="middle" class="box-title">观察关系</text>
  <text x="780" y="566" text-anchor="middle" class="small">Channel / Timer / 异步回调不强拥有连接，避免悬空和引用环</text>
</svg>
