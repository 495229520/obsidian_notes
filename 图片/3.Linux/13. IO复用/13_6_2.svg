<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5f8f"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f8f55"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8d6e63" stroke-width="1.8"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .subtitle { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .box-title { font: 700 18px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .box-text { font: 15px Arial, "Microsoft YaHei", sans-serif; fill: #31465a; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .main-loop { fill: #eaf4ff; stroke: #2f7ab8; stroke-width: 2.5; rx: 22; }
      .sub-loop { fill: #edf7ed; stroke: #4f8f55; stroke-width: 2.5; rx: 20; }
      .conn { fill: #fff8e8; stroke: #d49b38; stroke-width: 1.8; rx: 12; }
      .worker { fill: #fff0f0; stroke: #c96b6b; stroke-width: 2.5; rx: 22; }
      .note { fill: #fffdf5; stroke: #c6b178; stroke-width: 1.5; rx: 14; }
      .blue-line { stroke: #2f5f8f; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .green-line { stroke: #4f8f55; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .dash-line { stroke: #8d6e63; stroke-width: 2.3; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow-dash); }
    </style>
  </defs>

  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="550" y="48" text-anchor="middle" class="title">多线程 Reactor：one loop per thread</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="550" y="76" text-anchor="middle" class="subtitle">main loop 接收连接，sub loops 管理 I/O，worker pool 执行耗时业务</text>

  <rect x="55" y="195" width="220" height="170" class="main-loop"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="165" y="238" text-anchor="middle" class="box-title">Main EventLoop</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="165" y="270" text-anchor="middle" class="box-text">Acceptor</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="165" y="296" text-anchor="middle" class="small">listen_fd 可读</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="165" y="318" text-anchor="middle" class="small">accept 新连接</text>

  <rect x="378" y="122" width="265" height="128" class="sub-loop"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="510" y="152" text-anchor="middle" class="box-title">Sub EventLoop 0</text>
  <rect x="408" y="174" width="95" height="42" class="conn"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="455" y="200" text-anchor="middle" class="small">Conn A</text>
  <rect x="518" y="174" width="95" height="42" class="conn"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="565" y="200" text-anchor="middle" class="small">Conn B</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="510" y="236" text-anchor="middle" class="small">read / write / close</text>

  <rect x="378" y="286" width="265" height="128" class="sub-loop"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="510" y="316" text-anchor="middle" class="box-title">Sub EventLoop 1</text>
  <rect x="408" y="338" width="95" height="42" class="conn"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="455" y="364" text-anchor="middle" class="small">Conn C</text>
  <rect x="518" y="338" width="95" height="42" class="conn"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="565" y="364" text-anchor="middle" class="small">Conn D</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="510" y="400" text-anchor="middle" class="small">read / write / close</text>

  <rect x="378" y="450" width="265" height="128" class="sub-loop"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="510" y="480" text-anchor="middle" class="box-title">Sub EventLoop N</text>
  <rect x="408" y="502" width="95" height="42" class="conn"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="455" y="528" text-anchor="middle" class="small">Conn X</text>
  <rect x="518" y="502" width="95" height="42" class="conn"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="565" y="528" text-anchor="middle" class="small">Conn Y</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="510" y="564" text-anchor="middle" class="small">read / write / close</text>

  <rect x="790" y="240" width="250" height="190" class="worker"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="915" y="282" text-anchor="middle" class="box-title">Worker Thread Pool</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="915" y="316" text-anchor="middle" class="box-text">耗时业务处理</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="915" y="344" text-anchor="middle" class="small">数据库 / 计算 / 外部调用</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="915" y="376" text-anchor="middle" class="small">完成后 queueInLoop()</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="915" y="398" text-anchor="middle" class="small">eventfd wakeup 所属 loop</text>

  <path d="M 275 260 C 318 210 340 176 376 172" class="blue-line"/>
  <path d="M 275 280 L 376 350" class="blue-line"/>
  <path d="M 275 312 C 318 396 340 506 376 514" class="blue-line"/>

  <path d="M 643 185 C 700 205 735 260 788 300" class="green-line"/>
  <path d="M 643 350 L 788 335" class="green-line"/>
  <path d="M 643 520 C 704 500 740 420 788 380" class="green-line"/>

  <path d="M 790 410 C 710 555 560 625 510 582" class="dash-line"/>
  <path d="M 790 392 C 710 470 565 455 510 416" class="dash-line"/>
  <path d="M 790 305 C 716 208 575 248 510 252" class="dash-line"/>

  <rect x="86" y="470" width="230" height="92" class="note"/>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="201" y="500" text-anchor="middle" class="box-title">分工原则</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="201" y="526" text-anchor="middle" class="small">一个连接只归属一个 EventLoop</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="201" y="548" text-anchor="middle" class="small">worker 不直接长期占有 fd</text>

  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="324" y="210" text-anchor="middle" class="small">分配新连接</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="718" y="288" text-anchor="middle" class="small">投递业务</text>
  <text font-family="Arial, 'Microsoft YaHei', sans-serif" x="706" y="600" text-anchor="middle" class="small">回投写响应</text>
</svg>
