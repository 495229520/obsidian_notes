<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>poll：数组换掉位图，两次 O(n) 一个没少</title>
  <desc>pollfd 数组的 events/revents 分离与内核处理路径：拷入整个数组、按块挂等待队列、逐项调用 f_op-&gt;poll、只回写 revents。附与 select 的逐项对照和数组管理的三个工程坑。</desc>

  <rect x="0" y="0" width="1240" height="660" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26">poll：数组换掉位图，两次 O(n) 一个没少</text>
  <text x="48" y="74" font-size="14" fill="#6B675C">events 和 revents 分开，省下的只是「每轮重建」这一步</text>

  <!-- A 区 -->
  <rect x="40" y="96" width="1160" height="224" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="60" y="122" font-size="15" font-weight="700" fill="#4A473F">A · 一个 pollfd 数组，和内核对它做的四件事</text>

  <rect x="62" y="140" width="110" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="172" y="140" width="160" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="332" y="140" width="170" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="117" y="160" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4A473F">fd</text>
  <text x="252" y="160" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2C4460">events 你填</text>
  <text x="417" y="160" font-size="11.5" font-weight="700" text-anchor="middle" fill="#733428">revents 内核填</text>

  <rect x="62" y="170" width="110" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="172" y="170" width="160" height="34" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="332" y="170" width="170" height="34" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="117" y="192" font-size="11.5" text-anchor="middle" fill="#4A473F">3 监听</text>
  <text x="252" y="192" font-size="11.5" text-anchor="middle" fill="#2C4460">POLLIN</text>
  <text x="417" y="192" font-size="11.5" text-anchor="middle" fill="#24473F">POLLIN 有新连接</text>

  <rect x="62" y="204" width="110" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="172" y="204" width="160" height="34" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="332" y="204" width="170" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="117" y="226" font-size="11.5" text-anchor="middle" fill="#4A473F">7</text>
  <text x="252" y="226" font-size="11.5" text-anchor="middle" fill="#2C4460">POLLIN</text>
  <text x="417" y="226" font-size="11.5" text-anchor="middle" fill="#9B968A">0 什么都没发生</text>

  <rect x="62" y="238" width="110" height="34" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="172" y="238" width="160" height="34" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="332" y="238" width="170" height="34" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="117" y="260" font-size="11.5" font-weight="700" text-anchor="middle" fill="#6B4E28">-1</text>
  <text x="252" y="260" font-size="11.5" text-anchor="middle" fill="#9B968A">内核跳过这项</text>
  <text x="417" y="260" font-size="11.5" text-anchor="middle" fill="#9B968A">0</text>

  <rect x="62" y="272" width="110" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="172" y="272" width="160" height="34" fill="#E3EAF4" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="332" y="272" width="170" height="34" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1"/>
  <text x="117" y="294" font-size="11.5" text-anchor="middle" fill="#4A473F">9</text>
  <text x="252" y="294" font-size="11.5" text-anchor="middle" fill="#2C4460">POLLIN</text>
  <text x="417" y="294" font-size="11.5" text-anchor="middle" fill="#733428">POLLERR 没申请也来</text>

  <rect x="540" y="172" width="146" height="70" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.8"/>
  <text x="613" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#6B4E28">copy_from_user</text>
  <text x="613" y="214" font-size="10.5" text-anchor="middle" fill="#6B4E28">整个数组拷进去</text>
  <text x="613" y="231" font-size="10.5" text-anchor="middle" fill="#6B4E28">成本随 nfds 涨</text>

  <rect x="704" y="172" width="146" height="70" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="777" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#2C4460">poll_list 分块</text>
  <text x="777" y="214" font-size="10.5" text-anchor="middle" fill="#4A473F">每块约一页大小</text>
  <text x="777" y="231" font-size="10.5" text-anchor="middle" fill="#4A473F">避开大块分配</text>

  <rect x="868" y="172" width="146" height="70" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.8"/>
  <text x="941" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#6B4E28">逐项 f_op-&gt;poll</text>
  <text x="941" y="214" font-size="10.5" text-anchor="middle" fill="#6B4E28">挂等待队列再问</text>
  <text x="941" y="231" font-size="10.5" text-anchor="middle" fill="#6B4E28">一项都不能少</text>

  <rect x="1032" y="172" width="146" height="70" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1105" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#24473F">只回写 revents</text>
  <text x="1105" y="214" font-size="10.5" text-anchor="middle" fill="#24473F">events 原样不动</text>
  <text x="1105" y="231" font-size="10.5" text-anchor="middle" fill="#24473F">所以不用重建</text>

  <line x1="688" y1="207" x2="700" y2="207" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="852" y1="207" x2="864" y2="207" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1016" y1="207" x2="1028" y2="207" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="540" y="272" font-size="11.5" fill="#24473F">绿色那格就是 poll 相对 select 唯一省下的一步</text>
  <text x="540" y="296" font-size="11.5" fill="#6B4E28">琥珀两格照旧：拷贝和线性扫描一次没少</text>

  <!-- B 区 -->
  <rect x="40" y="336" width="590" height="192" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="60" y="362" font-size="15" font-weight="700" fill="#4A473F">B · 和 select 的差别只在两处</text>

  <rect x="62" y="378" width="170" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="232" y="378" width="180" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="412" y="378" width="176" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="147" y="398" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4A473F">维度</text>
  <text x="322" y="398" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4A473F">select</text>
  <text x="500" y="398" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4A473F">poll</text>

  <rect x="62" y="408" width="170" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="232" y="408" width="180" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="412" y="408" width="176" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="147" y="428" font-size="11.5" text-anchor="middle" fill="#4A473F">集合表示</text>
  <text x="322" y="428" font-size="11.5" text-anchor="middle" fill="#4A473F">位图 fd_set</text>
  <text x="500" y="428" font-size="11.5" text-anchor="middle" fill="#4A473F">pollfd 数组</text>

  <rect x="62" y="438" width="170" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="232" y="438" width="180" height="30" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="412" y="438" width="176" height="30" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="147" y="458" font-size="11.5" text-anchor="middle" fill="#4A473F">数量上限</text>
  <text x="322" y="458" font-size="11.5" text-anchor="middle" fill="#733428">FD_SETSIZE 1024</text>
  <text x="500" y="458" font-size="11.5" text-anchor="middle" fill="#24473F">受 RLIMIT_NOFILE</text>

  <rect x="62" y="468" width="170" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="232" y="468" width="180" height="30" fill="#F0E0DB" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="412" y="468" width="176" height="30" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="147" y="488" font-size="11.5" text-anchor="middle" fill="#4A473F">每轮重建</text>
  <text x="322" y="488" font-size="11.5" text-anchor="middle" fill="#733428">必须 FD_ZERO</text>
  <text x="500" y="488" font-size="11.5" text-anchor="middle" fill="#24473F">不用</text>

  <rect x="62" y="498" width="170" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="232" y="498" width="180" height="30" fill="#F3E8D3" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="412" y="498" width="176" height="30" fill="#F3E8D3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="147" y="518" font-size="11.5" text-anchor="middle" fill="#4A473F">每轮复杂度</text>
  <text x="322" y="518" font-size="11.5" text-anchor="middle" fill="#6B4E28">O(n)</text>
  <text x="500" y="518" font-size="11.5" text-anchor="middle" fill="#6B4E28">O(n)</text>

  <!-- C 区 -->
  <rect x="650" y="336" width="550" height="192" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="670" y="362" font-size="15" font-weight="700" fill="#4A473F">C · 数组自己管，三个坑</text>

  <rect x="672" y="376" width="506" height="46" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="690" y="396" font-size="12.5" font-weight="700" fill="#733428">nfds 只增不减</text>
  <text x="690" y="414" font-size="11" fill="#733428">连接断完了还按历史最大长度扫</text>

  <rect x="672" y="428" width="506" height="46" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="690" y="448" font-size="12.5" font-weight="700" fill="#6B4E28">fd = -1 留下空洞</text>
  <text x="690" y="466" font-size="11" fill="#6B4E28">内核跳过它，但拷贝时照样要搬</text>

  <rect x="672" y="480" width="506" height="46" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="690" y="500" font-size="12.5" font-weight="700" fill="#2C4460">删除用 swap-and-pop</text>
  <text x="690" y="518" font-size="11" fill="#4A473F">末尾元素换过来时别漏扫这一项</text>

  <rect x="40" y="544" width="1160" height="60" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="620" y="580" font-size="13" font-weight="700" text-anchor="middle" fill="#4A473F">poll 解掉的是 1024 上限和每轮重建；拷贝与两次线性扫描，要到 epoll 才消失</text>

  <text x="48" y="636" font-size="13" fill="#6B675C">选型口径：几十个 fd 用哪个都行；上千并发只有 epoll 的成本跟着「就绪个数」走</text>
</svg>
