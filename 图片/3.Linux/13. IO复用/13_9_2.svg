<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#4f6f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .subtitle { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .box-title { font: 700 17px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .box-text { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #31465a; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .client { fill: #fff8e8; stroke: #d49b38; stroke-width: 2; rx: 18; }
      .server { fill: #edf7ed; stroke: #4f8f55; stroke-width: 2.3; rx: 20; }
      .timer { fill: #f0f6ff; stroke: #2f7ab8; stroke-width: 2; rx: 18; }
      .danger { fill: #fff0f0; stroke: #c96b6b; stroke-width: 2; rx: 18; }
      .note { fill: #fffdf5; stroke: #c6b178; stroke-width: 1.5; rx: 14; }
      .line { stroke: #4f6f8f; stroke-width: 2.2; fill: none; marker-end: url(#arrow-hollow); }
      .soft-line { stroke: #7b8b9b; stroke-width: 1.8; fill: none; marker-end: url(#arrow-hollow); }
      .dash { stroke: #8a98a8; stroke-width: 1.6; stroke-dasharray: 7 7; fill: none; }
    </style>
  </defs>

  <text x="550" y="48" text-anchor="middle" class="title">应用心跳与连接超时</text>
  <text x="550" y="76" text-anchor="middle" class="subtitle">心跳是协议层活性检测；超时关闭仍要回到连接所属 EventLoop</text>

  <rect x="80" y="132" width="210" height="96" class="client"/>
  <text x="185" y="164" text-anchor="middle" class="box-title">客户端</text>
  <text x="185" y="190" text-anchor="middle" class="box-text">回复 pong</text>
  <text x="185" y="211" text-anchor="middle" class="small">或发送业务数据</text>

  <rect x="445" y="132" width="210" height="96" class="server"/>
  <text x="550" y="164" text-anchor="middle" class="box-title">EventLoop</text>
  <text x="550" y="190" text-anchor="middle" class="box-text">维护连接状态</text>
  <text x="550" y="211" text-anchor="middle" class="small">lastActiveTime / missed</text>

  <rect x="810" y="132" width="210" height="96" class="timer"/>
  <text x="915" y="164" text-anchor="middle" class="box-title">TimerQueue</text>
  <text x="915" y="190" text-anchor="middle" class="box-text">周期检查</text>
  <text x="915" y="211" text-anchor="middle" class="small">heartbeatInterval</text>

  <path d="M 655 174 L 808 174" class="line"/>
  <text x="732" y="158" text-anchor="middle" class="small">注册检查任务</text>

  <path d="M 445 202 L 292 202" class="line"/>
  <text x="368" y="226" text-anchor="middle" class="small">ping</text>

  <path d="M 290 164 L 443 164" class="line"/>
  <text x="367" y="148" text-anchor="middle" class="small">pong / 业务包</text>

  <rect x="110" y="332" width="220" height="98" class="timer"/>
  <text x="220" y="365" text-anchor="middle" class="box-title">刷新活跃时间</text>
  <text x="220" y="391" text-anchor="middle" class="box-text">lastActiveTime = now</text>
  <text x="220" y="412" text-anchor="middle" class="small">收到有效数据就刷新</text>

  <rect x="440" y="332" width="220" height="98" class="timer"/>
  <text x="550" y="365" text-anchor="middle" class="box-title">超时判断</text>
  <text x="550" y="391" text-anchor="middle" class="box-text">now - lastActiveTime</text>
  <text x="550" y="412" text-anchor="middle" class="small">或连续 missedLimit 次</text>

  <rect x="770" y="332" width="220" height="98" class="danger"/>
  <text x="880" y="365" text-anchor="middle" class="box-title">关闭失活连接</text>
  <text x="880" y="391" text-anchor="middle" class="box-text">queueInLoop(close)</text>
  <text x="880" y="412" text-anchor="middle" class="small">remove Channel + RAII close</text>

  <path d="M 550 228 C 490 280 300 275 220 330" class="soft-line"/>
  <path d="M 915 228 C 900 290 650 280 550 330" class="line"/>
  <path d="M 660 381 L 768 381" class="line"/>

  <path d="M 330 381 L 438 381" class="soft-line"/>
  <text x="384" y="365" text-anchor="middle" class="small">检查时比较</text>

  <rect x="126" y="512" width="385" height="64" class="note"/>
  <text x="318" y="540" text-anchor="middle" class="box-title">TCP keepalive</text>
  <text x="318" y="562" text-anchor="middle" class="small">内核层探活，默认周期通常较长，不能表达业务语义</text>

  <rect x="590" y="512" width="385" height="64" class="note"/>
  <text x="782" y="540" text-anchor="middle" class="box-title">应用心跳</text>
  <text x="782" y="562" text-anchor="middle" class="small">协议层消息，可按业务设置间隔、容忍次数和关闭策略</text>

  <path d="M 880 430 C 880 478 820 478 782 510" class="dash"/>
</svg>
