<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>心跳容忍计数与时间轮踢空闲连接</title>
  <desc>上半部分是 ping/pong 时间线与 missed 计数累积到上限才关闭连接；下半部分是 8 个桶的时间轮，靠 shared_ptr 引用计数归零自动关闭空闲连接。</desc>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">两种活性判断：心跳的容忍计数，与时间轮的引用计数踢除</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">心跳要允许连丢几次再断；踢空闲连接则连遍历都不做，靠最后一个 shared_ptr 消失自己关</text>

  <!-- ============ A 区 ============ -->
  <text x="48" y="118" font-size="15" font-weight="700" fill="#4A473F">A · 心跳：连丢 missedLimit 次才关，单次丢包不算数</text>
  <rect x="48" y="130" width="1144" height="240" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <line x1="140" y1="185" x2="1160" y2="185" stroke="#D8D5C8" stroke-width="1.5"/>
  <line x1="140" y1="275" x2="1160" y2="275" stroke="#D8D5C8" stroke-width="1.5"/>
  <text x="62" y="189" font-size="11" font-weight="700" fill="#3D5A80">服务端</text>
  <text x="62" y="279" font-size="11" font-weight="700" fill="#2F6B5E">客户端</text>

  <text x="210" y="160" font-size="9.5" fill="#6B675C" text-anchor="middle">t = 0s</text>
  <text x="406" y="160" font-size="9.5" fill="#6B675C" text-anchor="middle">t = 5s</text>
  <text x="602" y="160" font-size="9.5" fill="#6B675C" text-anchor="middle">t = 10s</text>
  <text x="798" y="160" font-size="9.5" fill="#6B675C" text-anchor="middle">t = 15s</text>
  <text x="994" y="160" font-size="9.5" fill="#6B675C" text-anchor="middle">t = 20s</text>

  <!-- 第 1 轮 -->
  <text x="174" y="178" font-size="10" fill="#2C4460">ping</text>
  <line x1="170" y1="192" x2="208" y2="266" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <text x="232" y="178" font-size="10" fill="#24473F">pong</text>
  <line x1="212" y1="268" x2="250" y2="194" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <rect x="170" y="300" width="110" height="30" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="225" y="320" font-size="10.5" fill="#24473F" text-anchor="middle">missed = 0</text>

  <!-- 第 2 轮 -->
  <text x="370" y="178" font-size="10" fill="#2C4460">ping</text>
  <line x1="366" y1="192" x2="404" y2="266" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <text x="428" y="178" font-size="10" fill="#24473F">pong</text>
  <line x1="408" y1="268" x2="446" y2="194" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <rect x="366" y="300" width="110" height="30" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="421" y="320" font-size="10.5" fill="#24473F" text-anchor="middle">missed = 0</text>

  <!-- 第 3 轮 -->
  <text x="566" y="178" font-size="10" fill="#2C4460">ping</text>
  <line x1="562" y1="192" x2="600" y2="266" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <text x="612" y="262" font-size="10" fill="#A64B3C">无响应</text>
  <rect x="562" y="300" width="110" height="30" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="617" y="320" font-size="10.5" fill="#6B4E28" text-anchor="middle">missed = 1</text>

  <!-- 第 4 轮 -->
  <text x="762" y="178" font-size="10" fill="#2C4460">ping</text>
  <line x1="758" y1="192" x2="796" y2="266" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <text x="808" y="262" font-size="10" fill="#A64B3C">无响应</text>
  <rect x="758" y="300" width="110" height="30" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="813" y="320" font-size="10.5" fill="#6B4E28" text-anchor="middle">missed = 2</text>

  <!-- 第 5 轮 -->
  <text x="958" y="178" font-size="10" fill="#2C4460">ping</text>
  <line x1="954" y1="192" x2="992" y2="266" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <text x="1004" y="262" font-size="10" fill="#A64B3C">无响应</text>
  <rect x="954" y="300" width="110" height="30" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="1009" y="320" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">missed = 3 · 关闭</text>

  <line x1="1064" y1="315" x2="1096" y2="315" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrR4)"/>
  <text x="1102" y="311" font-size="10" fill="#733428">queueInLoop</text>
  <text x="1102" y="325" font-size="10" fill="#733428">(closeInLoop)</text>

  <text x="62" y="354" font-size="10.5" fill="#4A473F">间隔 5 秒、上限 3 次 → 最坏 15 秒才判定失活；要更灵敏就缩短间隔，别把上限降到 1</text>

  <!-- ============ B 区 ============ -->
  <text x="48" y="404" font-size="15" font-weight="700" fill="#4A473F">B · 踢空闲连接：时间轮 + shared_ptr，不遍历也不比时间戳</text>
  <rect x="48" y="416" width="1144" height="228" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <line x1="1050" y1="444" x2="96" y2="444" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <text x="573" y="438" font-size="10.5" fill="#4A473F" text-anchor="middle">每秒整体前移一格</text>

  <rect x="90" y="470" width="112" height="64" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.8"/>
  <text x="146" y="462" font-size="10" font-weight="700" fill="#733428" text-anchor="middle">队首 · pop_front</text>
  <text x="146" y="496" font-size="10.5" fill="#733428" text-anchor="middle">8 秒前的桶</text>
  <text x="146" y="516" font-size="10.5" fill="#733428" text-anchor="middle">整桶丢弃</text>

  <rect x="212" y="470" width="112" height="64" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="268" y="496" font-size="10.5" fill="#6B4E28" text-anchor="middle">7 秒前</text>
  <text x="268" y="516" font-size="10.5" fill="#6B4E28" text-anchor="middle">Entry ×3</text>

  <rect x="334" y="470" width="112" height="64" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="390" y="496" font-size="10.5" fill="#6B4E28" text-anchor="middle">6 秒前</text>
  <text x="390" y="516" font-size="10.5" fill="#6B4E28" text-anchor="middle">Entry ×1</text>

  <rect x="456" y="470" width="112" height="64" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="512" y="496" font-size="10.5" fill="#4A473F" text-anchor="middle">5 秒前</text>
  <text x="512" y="516" font-size="10.5" fill="#4A473F" text-anchor="middle">Entry ×4</text>

  <rect x="578" y="470" width="112" height="64" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="634" y="496" font-size="10.5" fill="#4A473F" text-anchor="middle">4 秒前</text>
  <text x="634" y="516" font-size="10.5" fill="#4A473F" text-anchor="middle">Entry ×2</text>

  <rect x="700" y="470" width="112" height="64" rx="7" fill="#E6EFEA" stroke="#9B968A" stroke-width="1.2"/>
  <text x="756" y="496" font-size="10.5" fill="#24473F" text-anchor="middle">3 秒前</text>
  <text x="756" y="516" font-size="10.5" fill="#24473F" text-anchor="middle">Entry ×6</text>

  <rect x="822" y="470" width="112" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="878" y="496" font-size="10.5" fill="#24473F" text-anchor="middle">2 秒前</text>
  <text x="878" y="516" font-size="10.5" fill="#24473F" text-anchor="middle">Entry ×5</text>

  <rect x="944" y="470" width="112" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="1000" y="462" font-size="10" font-weight="700" fill="#24473F" text-anchor="middle">队尾 · push_back</text>
  <text x="1000" y="496" font-size="10.5" fill="#24473F" text-anchor="middle">本秒新建</text>
  <text x="1000" y="516" font-size="10.5" fill="#24473F" text-anchor="middle">活跃连接进这里</text>

  <rect x="90" y="560" width="300" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="104" y="582" font-size="11.5" font-weight="700" fill="#2C4460">连接来了数据</text>
  <text x="104" y="602" font-size="10.5" fill="#2C4460">把它的 shared_ptr&lt;Entry&gt; 再塞一份进队尾桶</text>

  <rect x="410" y="560" width="300" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="424" y="582" font-size="11.5" font-weight="700" fill="#2C4460">每秒推进一格</text>
  <text x="424" y="602" font-size="10.5" fill="#2C4460">队首整桶析构，桶里那批引用一起消失</text>

  <rect x="730" y="560" width="326" height="56" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="744" y="582" font-size="11.5" font-weight="700" fill="#24473F">某个 Entry 计数归零</text>
  <text x="744" y="602" font-size="10.5" fill="#24473F">~Entry() 里 lock() 到连接，走正常关闭流程</text>

  <text x="48" y="676" font-size="11.5" fill="#4A473F">时间轮省掉的不只是遍历：连「现在几点、上次活跃是几点」都不必记录，桶的位置本身就是时间。</text>
</svg>
