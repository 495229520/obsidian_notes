<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>连接写路径：EPOLLOUT 按需注册与 output buffer 水位</title>
  <desc>左侧是一次发送的完整状态流转，含注册与取消 EPOLLOUT 的两个时机；右侧是 output buffer 堆积的四种走法与水位分段。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">连接写路径：EPOLLOUT 按需注册与 output buffer 水位</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">先直接 send 一次，发不完才注册写事件；buffer 涨起来说明对端读不动，不是本机发得慢</text>

  <!-- ============ 面板 A ============ -->
  <rect x="48" y="104" width="760" height="548" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="66" y="129" font-size="15" font-weight="700" fill="#4A473F">A · 一次发送的状态流转</text>

  <rect x="288" y="152" width="280" height="50" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="428" y="172" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 响应数据进 output buffer</text>
  <text x="428" y="190" font-size="10.5" fill="#2C4460" text-anchor="middle">必须在连接所属的 loop 线程</text>

  <rect x="288" y="222" width="280" height="50" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="428" y="242" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">② 立即 send() 一次</text>
  <text x="428" y="260" font-size="10.5" fill="#2C4460" text-anchor="middle">不先注册写事件，省一轮 poll</text>

  <rect x="288" y="292" width="280" height="46" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.5"/>
  <text x="428" y="320" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">③ 一次发完了吗</text>

  <rect x="600" y="292" width="190" height="46" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="695" y="311" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">④ 全程不注册</text>
  <text x="695" y="328" font-size="10.5" fill="#24473F" text-anchor="middle">回调 writeComplete</text>

  <rect x="288" y="364" width="280" height="50" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="428" y="384" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">⑤ 注册 EPOLLOUT</text>
  <text x="428" y="402" font-size="10.5" fill="#6B4E28" text-anchor="middle">剩余字节留在 buffer 里</text>

  <rect x="288" y="434" width="280" height="50" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="428" y="454" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">⑥ handleWrite() 续发</text>
  <text x="428" y="472" font-size="10.5" fill="#6B4E28" text-anchor="middle">下一次可写时才发生</text>

  <rect x="600" y="434" width="190" height="50" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="695" y="454" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">越过高水位</text>
  <text x="695" y="472" font-size="10.5" fill="#733428" text-anchor="middle">回调上层，让它停手</text>

  <rect x="90" y="504" width="180" height="46" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="180" y="523" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">⑧ 保持 EPOLLOUT</text>
  <text x="180" y="540" font-size="10.5" fill="#6B4E28" text-anchor="middle">等下一次可写</text>

  <rect x="288" y="504" width="280" height="46" rx="7" fill="#F1EFE8" stroke="#4A473F" stroke-width="1.5"/>
  <text x="428" y="532" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">⑦ buffer 清空了吗</text>

  <rect x="288" y="574" width="280" height="50" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="428" y="594" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">⑨ 取消 EPOLLOUT</text>
  <text x="428" y="612" font-size="10.5" fill="#24473F" text-anchor="middle">有 shutdown 挂起就在这关写端</text>

  <line x1="428" y1="202" x2="428" y2="220" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="428" y1="272" x2="428" y2="290" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="568" y1="315" x2="598" y2="315" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="583" y="306" font-size="10.5" fill="#6B675C" text-anchor="middle">是</text>
  <line x1="428" y1="338" x2="428" y2="362" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="443" y="354" font-size="10.5" fill="#6B675C">否</text>
  <line x1="428" y1="414" x2="428" y2="432" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="568" y1="459" x2="598" y2="459" stroke="#A64B3C" stroke-width="1.4" marker-end="url(#arrw)"/>
  <line x1="428" y1="484" x2="428" y2="502" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="288" y1="527" x2="272" y2="527" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="279" y="497" font-size="10.5" fill="#6B675C" text-anchor="middle">否</text>
  <path d="M180,504 L180,459 L286,459" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="428" y1="550" x2="428" y2="572" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="443" y="566" font-size="10.5" fill="#6B675C">是</text>

  <!-- ============ 面板 B ============ -->
  <rect x="832" y="104" width="360" height="548" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="850" y="129" font-size="15" font-weight="700" fill="#4A473F">B · buffer 堆积的四种走法</text>

  <rect x="846" y="150" width="170" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="1016" y="150" width="160" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="858" y="170" font-size="11.5" font-weight="700" fill="#4A473F">现象</text>
  <text x="1028" y="170" font-size="11.5" font-weight="700" fill="#4A473F">对策</text>

  <rect x="846" y="180" width="170" height="72" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="1016" y="180" width="160" height="72" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="858" y="206" font-size="11" fill="#4A473F">对端一直不读</text>
  <text x="858" y="228" font-size="11" fill="#6B675C">窗口收缩到 0</text>
  <text x="1028" y="206" font-size="11" fill="#4A473F">高水位回调</text>
  <text x="1028" y="228" font-size="11" fill="#6B675C">让上层暂停产数据</text>

  <rect x="846" y="252" width="170" height="72" fill="rgb(245, 244, 237)" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="1016" y="252" width="160" height="72" fill="rgb(245, 244, 237)" stroke="#D8D5C8" stroke-width="1"/>
  <text x="858" y="278" font-size="11" fill="#4A473F">buffer 不设上限</text>
  <text x="858" y="300" font-size="11" fill="#6B675C">单连接吃光内存</text>
  <text x="1028" y="278" font-size="11" fill="#4A473F">设字节硬上限</text>
  <text x="1028" y="300" font-size="11" fill="#6B675C">超了直接断连接</text>

  <rect x="846" y="324" width="170" height="72" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="1016" y="324" width="160" height="72" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="858" y="350" font-size="11" fill="#4A473F">EPOLLOUT 常驻</text>
  <text x="858" y="372" font-size="11" fill="#6B675C">poll 空转，CPU 打满</text>
  <text x="1028" y="350" font-size="11" fill="#4A473F">发完立刻取消</text>
  <text x="1028" y="372" font-size="11" fill="#6B675C">buffer 空即摘掉</text>

  <rect x="846" y="396" width="170" height="72" fill="rgb(245, 244, 237)" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="1016" y="396" width="160" height="72" fill="rgb(245, 244, 237)" stroke="#D8D5C8" stroke-width="1"/>
  <text x="858" y="422" font-size="11" fill="#4A473F">没发完就 close</text>
  <text x="858" y="444" font-size="11" fill="#6B675C">尾部数据丢失</text>
  <text x="1028" y="422" font-size="11" fill="#4A473F">置 shutdown 标志</text>
  <text x="1028" y="444" font-size="11" fill="#6B675C">清空后再关写端</text>

  <text x="846" y="504" font-size="12" font-weight="700" fill="#4A473F">output buffer 字节数</text>
  <rect x="846" y="518" width="160" height="26" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="1006" y="518" width="90" height="26" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <rect x="1096" y="518" width="80" height="26" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="926" y="536" font-size="11" fill="#24473F" text-anchor="middle">正常</text>
  <text x="1051" y="536" font-size="11" fill="#6B4E28" text-anchor="middle">高水位</text>
  <text x="1136" y="536" font-size="11" fill="#733428" text-anchor="middle">硬上限</text>

  <text x="846" y="576" font-size="11" fill="#6B675C">高水位是软信号：只通知上层别再产数据</text>
  <text x="846" y="600" font-size="11" fill="#6B675C">硬上限才保命：超了就断，宁可丢这条连接</text>
  <text x="846" y="624" font-size="11" fill="#6B675C">两个阈值都按连接算，不是按整个进程算</text>

  <text x="48" y="682" font-size="13" fill="#6B675C">写事件是异常态不是常态：只有“这一次没发完”才需要它，发完必须当场取消，否则一条空闲连接也会把 loop 唤醒到打满 CPU</text>
</svg>
