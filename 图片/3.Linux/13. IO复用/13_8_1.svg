<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>连接对象的五个阶段与安全关闭顺序</title>
  <desc>上半部分为一条 TcpConnection 从 accept 到析构的五个阶段，分别标注对象持有者与内核侧状态；下半部分为六步安全关闭流程，以及三种抄近路写法的后果。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">连接对象的生命周期：五个阶段与安全关闭顺序</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">先让 epoll 与连接表放手，再让对象析构，最后才由 RAII 关掉 fd —— 顺序反了就踩悬空指针</text>

  <!-- ============ A 区 ============ -->
  <text x="48" y="118" font-size="15" font-weight="700" fill="#4A473F">A · 一条连接的五个阶段：谁持有它，内核那边是什么状态</text>
  <rect x="48" y="130" width="1144" height="246" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <text x="60" y="182" font-size="11" font-weight="700" fill="#6B675C">阶段</text>
  <text x="60" y="254" font-size="11" font-weight="700" fill="#6B675C">谁持有对象</text>
  <text x="60" y="324" font-size="11" font-weight="700" fill="#6B675C">内核侧</text>

  <!-- 列 1 -->
  <rect x="152" y="150" width="190" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="247" y="174" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 创建</text>
  <text x="247" y="194" font-size="10.5" fill="#2C4460" text-anchor="middle">accept4() 得到 conn_fd</text>
  <rect x="152" y="226" width="190" height="46" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="247" y="245" font-size="11" fill="#4A473F" text-anchor="middle">栈上局部变量</text>
  <text x="247" y="261" font-size="10" fill="#6B675C" text-anchor="middle">use_count = 1</text>
  <rect x="152" y="296" width="190" height="46" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="247" y="315" font-size="11" fill="#4A473F" text-anchor="middle">fd 已分配</text>
  <text x="247" y="331" font-size="10" fill="#6B675C" text-anchor="middle">尚未进 epoll</text>

  <!-- 列 2 -->
  <rect x="361" y="150" width="190" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="456" y="174" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">② 建立</text>
  <text x="456" y="194" font-size="10.5" fill="#2C4460" text-anchor="middle">入连接表 + epoll ADD</text>
  <rect x="361" y="226" width="190" height="46" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="456" y="245" font-size="11" fill="#4A473F" text-anchor="middle">连接表持有</text>
  <text x="456" y="261" font-size="10" fill="#6B675C" text-anchor="middle">use_count = 1</text>
  <rect x="361" y="296" width="190" height="46" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="456" y="315" font-size="11" fill="#4A473F" text-anchor="middle">epoll_ctl(ADD)</text>
  <text x="456" y="331" font-size="10" fill="#6B675C" text-anchor="middle">内核记下 Channel*</text>

  <!-- 列 3 -->
  <rect x="570" y="150" width="190" height="58" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="665" y="174" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">③ 活跃</text>
  <text x="665" y="194" font-size="10.5" fill="#24473F" text-anchor="middle">EPOLLIN / EPOLLOUT</text>
  <rect x="570" y="226" width="190" height="46" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="665" y="245" font-size="11" fill="#4A473F" text-anchor="middle">回调期 tie_.lock()</text>
  <text x="665" y="261" font-size="10" fill="#6B675C" text-anchor="middle">use_count 临时 +1</text>
  <rect x="570" y="296" width="190" height="46" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="665" y="315" font-size="11" fill="#4A473F" text-anchor="middle">epoll 反复返回</text>
  <text x="665" y="331" font-size="10" fill="#6B675C" text-anchor="middle">同一个 Channel*</text>

  <!-- 列 4 -->
  <rect x="779" y="150" width="190" height="58" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="874" y="174" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">④ 关闭中</text>
  <text x="874" y="194" font-size="10.5" fill="#6B4E28" text-anchor="middle">disableAll + removeChannel</text>
  <rect x="779" y="226" width="190" height="46" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="874" y="245" font-size="11" fill="#4A473F" text-anchor="middle">连接表 erase</text>
  <text x="874" y="261" font-size="10" fill="#6B675C" text-anchor="middle">use_count 减 1</text>
  <rect x="779" y="296" width="190" height="46" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="874" y="315" font-size="11" fill="#4A473F" text-anchor="middle">epoll_ctl(DEL)</text>
  <text x="874" y="331" font-size="10" fill="#6B675C" text-anchor="middle">内核不再持有指针</text>

  <!-- 列 5 -->
  <rect x="988" y="150" width="190" height="58" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.8"/>
  <text x="1083" y="174" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">⑤ 销毁</text>
  <text x="1083" y="194" font-size="10.5" fill="#733428" text-anchor="middle">~TcpConnection → ~Socket</text>
  <rect x="988" y="226" width="190" height="46" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1083" y="245" font-size="11" fill="#4A473F" text-anchor="middle">use_count = 0</text>
  <text x="1083" y="261" font-size="10" fill="#6B675C" text-anchor="middle">最后一个引用离开</text>
  <rect x="988" y="296" width="190" height="46" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1083" y="315" font-size="11" fill="#4A473F" text-anchor="middle">close(fd)</text>
  <text x="1083" y="331" font-size="10" fill="#6B675C" text-anchor="middle">fd 号可被内核复用</text>

  <line x1="342" y1="179" x2="357" y2="179" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="551" y1="179" x2="566" y2="179" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="760" y1="179" x2="775" y2="179" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="969" y1="179" x2="984" y2="179" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ============ B 区 ============ -->
  <text x="48" y="412" font-size="15" font-weight="700" fill="#4A473F">B · 安全关闭的六步，以及三种抄近路的后果</text>

  <rect x="48" y="428" width="172" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="134" y="450" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 回到所属 loop</text>
  <text x="134" y="468" font-size="10" fill="#2C4460" text-anchor="middle">queueInLoop(closeInLoop)</text>

  <rect x="237" y="428" width="172" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="323" y="450" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">② disableAll()</text>
  <text x="323" y="468" font-size="10" fill="#2C4460" text-anchor="middle">不再关注读写事件</text>

  <rect x="426" y="428" width="172" height="54" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="512" y="450" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">③ removeChannel</text>
  <text x="512" y="468" font-size="10" fill="#6B4E28" text-anchor="middle">epoll_ctl(DEL)</text>

  <rect x="615" y="428" width="172" height="54" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="701" y="450" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">④ 连接表 erase</text>
  <text x="701" y="468" font-size="10" fill="#6B4E28" text-anchor="middle">use_count 减 1</text>

  <rect x="804" y="428" width="172" height="54" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="890" y="450" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">⑤ connectDestroyed</text>
  <text x="890" y="468" font-size="10" fill="#4A3F68" text-anchor="middle">再投递一轮，延后析构</text>

  <rect x="993" y="428" width="172" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1079" y="450" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">⑥ use_count = 0</text>
  <text x="1079" y="468" font-size="10" fill="#24473F" text-anchor="middle">~Socket 里 close(fd)</text>

  <line x1="220" y1="455" x2="233" y2="455" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="409" y1="455" x2="422" y2="455" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="598" y1="455" x2="611" y2="455" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="787" y1="455" x2="800" y2="455" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="976" y1="455" x2="989" y2="455" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 反例表 -->
  <rect x="48" y="510" width="286" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="334" y="510" width="400" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="734" y="510" width="431" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="60" y="530" font-size="11" font-weight="700" fill="#4A473F">抄近路的写法</text>
  <text x="346" y="530" font-size="11" font-weight="700" fill="#4A473F">立刻发生什么</text>
  <text x="746" y="530" font-size="11" font-weight="700" fill="#4A473F">表现出来的症状</text>

  <rect x="48" y="540" width="286" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="334" y="540" width="400" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="734" y="540" width="431" height="32" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="60" y="561" font-size="10.5" fill="#4A473F">直接 close(fd)，跳过 DEL</text>
  <text x="346" y="561" font-size="10.5" fill="#4A473F">epoll 事件数组里还留着这个 Channel*</text>
  <text x="746" y="561" font-size="10.5" fill="#733428">事件命中已被复用的 fd，或访问悬空对象</text>

  <rect x="48" y="572" width="286" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="334" y="572" width="400" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="734" y="572" width="431" height="32" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="60" y="593" font-size="10.5" fill="#4A473F">在 handleEvent 栈里析构 Channel</text>
  <text x="346" y="593" font-size="10.5" fill="#4A473F">本轮 activeChannels 后面的元素失效</text>
  <text x="746" y="593" font-size="10.5" fill="#733428">同一次 epoll_wait 循环内崩溃</text>

  <rect x="48" y="604" width="286" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="334" y="604" width="400" height="32" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="734" y="604" width="431" height="32" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="60" y="625" font-size="10.5" fill="#4A473F">Channel 与 Socket 各关一次</text>
  <text x="346" y="625" font-size="10.5" fill="#4A473F">第二次 close 关掉的是别人的 fd</text>
  <text x="746" y="625" font-size="10.5" fill="#733428">随机连接被踢掉，难以复现</text>

  <text x="48" y="668" font-size="11.5" fill="#4A473F">①–⑥ 全部在连接所属的 EventLoop 线程内执行；别的线程只能 queueInLoop 投递任务，不能直接改连接状态。</text>
</svg>
