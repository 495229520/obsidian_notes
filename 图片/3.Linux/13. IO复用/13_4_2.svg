<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>epoll 内核三件套：红黑树、就绪链表与回调</title>
  <desc>epfd 背后的 struct eventpoll 包含红黑树 rbr、就绪链表 rdllist 和等待队列 wq；三个系统调用各自动了什么；数据到达时 ep_poll_callback 的回调链；LT 与 ET 的差别落在就绪链表的回填上。</desc>

  <rect x="0" y="0" width="1240" height="860" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26">epfd 背后：一棵红黑树、一条就绪链表、一个回调</text>
  <text x="48" y="74" font-size="14" fill="#6B675C">把这三样看清楚，「为什么不用每轮扫」和「LT 与 ET 差在哪」就是同一个问题</text>

  <!-- ============ A 区 ============ -->
  <rect x="40" y="96" width="1160" height="204" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="60" y="122" font-size="15" font-weight="700" fill="#4A473F">A · epfd 只是一个句柄，真正的东西在 struct eventpoll 里</text>

  <rect x="62" y="140" width="580" height="146" rx="8" fill="#EDEBE3" stroke="#4A473F" stroke-width="1.5"/>
  <text x="78" y="162" font-size="12.5" font-weight="700" fill="#4A473F">struct eventpoll</text>

  <rect x="78" y="172" width="172" height="98" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="164" y="196" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2C4460">rbr 红黑树</text>
  <text x="164" y="218" font-size="11" text-anchor="middle" fill="#4A473F">装全部监控项</text>
  <text x="164" y="238" font-size="11" text-anchor="middle" fill="#4A473F">节点叫 epitem</text>
  <text x="164" y="258" font-size="11" text-anchor="middle" fill="#4A473F">增删改 O(log n)</text>

  <rect x="267" y="172" width="172" height="98" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="353" y="196" font-size="12.5" font-weight="700" text-anchor="middle" fill="#24473F">rdllist 就绪链表</text>
  <text x="353" y="218" font-size="11" text-anchor="middle" fill="#24473F">只装已就绪的</text>
  <text x="353" y="238" font-size="11" text-anchor="middle" fill="#24473F">通常远短于树</text>
  <text x="353" y="258" font-size="11" text-anchor="middle" fill="#24473F">wait 只碰这条</text>

  <rect x="456" y="172" width="172" height="98" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="542" y="196" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4A473F">wq 等待队列</text>
  <text x="542" y="218" font-size="11" text-anchor="middle" fill="#6B675C">链表空就睡这</text>
  <text x="542" y="238" font-size="11" text-anchor="middle" fill="#6B675C">睡的是调用线程</text>
  <text x="542" y="258" font-size="11" text-anchor="middle" fill="#6B675C">回调负责唤醒</text>

  <rect x="960" y="172" width="218" height="98" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.8"/>
  <text x="1069" y="196" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6B4E28">每个被监控 fd</text>
  <text x="1069" y="218" font-size="11" text-anchor="middle" fill="#6B4E28">自带一个等待队列</text>
  <text x="1069" y="238" font-size="11" text-anchor="middle" fill="#6B4E28">队列里挂着</text>
  <text x="1069" y="258" font-size="11" text-anchor="middle" fill="#6B4E28">ep_poll_callback</text>

  <line x1="650" y1="212" x2="954" y2="212" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="800" y="202" font-size="11.5" text-anchor="middle" fill="#6B675C">epoll_ctl 注册时挂上去</text>
  <text x="800" y="236" font-size="11.5" text-anchor="middle" fill="#6B675C">挂一次就长期有效</text>

  <!-- ============ B 区 ============ -->
  <rect x="40" y="316" width="590" height="240" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="60" y="342" font-size="15" font-weight="700" fill="#4A473F">B · 三个系统调用分别做了什么</text>

  <rect x="62" y="358" width="180" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="152" y="392" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2C4460">epoll_create1()</text>
  <rect x="262" y="358" width="306" height="56" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="415" y="384" font-size="11.5" text-anchor="middle" fill="#4A473F">建一个 eventpoll</text>
  <text x="415" y="403" font-size="11.5" text-anchor="middle" fill="#6B675C">树和链表这时都是空的</text>

  <rect x="62" y="422" width="180" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="152" y="456" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2C4460">epoll_ctl(ADD)</text>
  <rect x="262" y="422" width="306" height="56" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="415" y="448" font-size="11.5" text-anchor="middle" fill="#4A473F">建 epitem 插进红黑树</text>
  <text x="415" y="467" font-size="11.5" text-anchor="middle" fill="#6B4E28">顺手把回调挂到 fd 的队列</text>

  <rect x="62" y="486" width="180" height="56" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="152" y="520" font-size="12.5" font-weight="700" text-anchor="middle" fill="#24473F">epoll_wait()</text>
  <rect x="262" y="486" width="306" height="56" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="415" y="512" font-size="11.5" text-anchor="middle" fill="#4A473F">看 rdllist 空不空</text>
  <text x="415" y="531" font-size="11.5" text-anchor="middle" fill="#24473F">空就睡 wq，不空就搬给用户</text>

  <!-- ============ C 区 ============ -->
  <rect x="650" y="316" width="550" height="240" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="670" y="342" font-size="15" font-weight="700" fill="#4A473F">C · 数据到达那一刻，谁调了谁</text>

  <rect x="672" y="356" width="506" height="34" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="690" y="378" font-size="11.5" fill="#4A473F">① 网卡收包，软中断里走完协议栈</text>

  <rect x="672" y="394" width="506" height="34" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="690" y="416" font-size="11.5" fill="#2C4460">② 数据进 socket，内核调 sk_data_ready()</text>

  <rect x="672" y="432" width="506" height="34" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.8"/>
  <text x="690" y="454" font-size="11.5" fill="#6B4E28">③ 唤醒该 fd 的等待队列，回调被调到</text>

  <rect x="672" y="470" width="506" height="34" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="690" y="492" font-size="11.5" fill="#24473F">④ ep_poll_callback 把 epitem 挂进 rdllist</text>

  <rect x="672" y="508" width="506" height="34" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="690" y="530" font-size="11.5" fill="#24473F">⑤ 顺带唤醒睡在 wq 上的 epoll_wait</text>

  <!-- ============ D 区 ============ -->
  <rect x="40" y="572" width="1160" height="224" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="60" y="598" font-size="15" font-weight="700" fill="#4A473F">D · LT 与 ET 的分歧，只发生在就绪链表的最后一步</text>

  <rect x="62" y="610" width="546" height="176" rx="8" fill="#F1F4F0" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="80" y="634" font-size="13" font-weight="700" fill="#24473F">LT · 摘下来还要放回去</text>
  <rect x="80" y="642" width="506" height="32" rx="6" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="96" y="663" font-size="11.5" fill="#4A473F">① epoll_wait 把 epitem 从链表摘下</text>
  <rect x="80" y="678" width="506" height="32" rx="6" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="96" y="699" font-size="11.5" fill="#4A473F">② 你的 handler 读一次就返回</text>
  <rect x="80" y="714" width="506" height="32" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="96" y="735" font-size="11.5" fill="#24473F">③ 内核回填：这个 fd 还可读吗</text>
  <rect x="80" y="750" width="506" height="32" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="96" y="771" font-size="11.5" fill="#24473F">④ 还可读就重新挂回 rdllist</text>

  <rect x="632" y="610" width="546" height="176" rx="8" fill="#F6F1EA" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="650" y="634" font-size="13" font-weight="700" fill="#6B4E28">ET · 摘下来就不回头</text>
  <rect x="650" y="642" width="506" height="32" rx="6" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="666" y="663" font-size="11.5" fill="#4A473F">① epoll_wait 把 epitem 从链表摘下</text>
  <rect x="650" y="678" width="506" height="32" rx="6" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="666" y="699" font-size="11.5" fill="#4A473F">② 你的 handler 必须读到 EAGAIN</text>
  <rect x="650" y="714" width="506" height="32" rx="6" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="666" y="735" font-size="11.5" fill="#6B4E28">③ 没有回填这一步</text>
  <rect x="650" y="750" width="506" height="32" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="666" y="771" font-size="11.5" fill="#733428">④ 只有新数据触发回调才会再挂</text>

  <text x="48" y="832" font-size="13" fill="#6B675C">ET 省掉的是内核那次回填检查；漏读的数据没人替你放回链表，代价也从这里来</text>
</svg>
