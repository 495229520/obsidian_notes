<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>
  <title>timerfd 到期次数的累积与 expirations 的处理策略</title>
  <desc>周期 100ms 的 timerfd 遇上一次 320ms 的慢回调，内核计数器累积到 3；下方给出 itimerspec 字段语义与拿到 expirations 后的四种做法。</desc>

  <rect x="0" y="0" width="1240" height="680" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">timerfd 读出来的不是「到期了」，是「你欠了几次」</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">周期 100ms 的定时器，EventLoop 卡了 320ms —— 一次 read 拿到 3，回调到底跑几次得你自己定</text>

  <text x="56" y="116" font-size="14" font-weight="700" fill="#4A473F">A · 一个 100ms 周期定时器，遇上一次 320ms 的慢回调</text>

  <rect x="56" y="128" width="1128" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <text x="72" y="152" font-size="11.5" font-weight="700" fill="#8A6A3A">内核里 timerfd 的到期计数</text>

  <!-- 计数台阶 -->
  <path d="M140,246 H390 V220 H640 V194 H890 V168 H940 V246 H1140" fill="none" stroke="#B07D2B" stroke-width="2"/>
  <circle cx="390" cy="220" r="3.5" fill="#B07D2B"/>
  <circle cx="640" cy="194" r="3.5" fill="#B07D2B"/>
  <circle cx="890" cy="168" r="3.5" fill="#B07D2B"/>

  <text x="265" y="238" font-size="11" fill="#6B4E28" text-anchor="middle">0</text>
  <text x="515" y="212" font-size="11" fill="#6B4E28" text-anchor="middle">1</text>
  <text x="765" y="186" font-size="11" fill="#6B4E28" text-anchor="middle">2</text>
  <text x="915" y="160" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">3</text>
  <text x="1040" y="238" font-size="11" fill="#6B4E28" text-anchor="middle">0</text>

  <text x="962" y="196" font-size="11.5" font-weight="700" fill="#A64B3C">read() 一次取走 3</text>

  <!-- 到期竖虚线 -->
  <line x1="390" y1="222" x2="390" y2="330" stroke="#C3B79E" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="640" y1="196" x2="640" y2="330" stroke="#C3B79E" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="890" y1="170" x2="890" y2="330" stroke="#C3B79E" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="940" y1="170" x2="940" y2="330" stroke="#A64B3C" stroke-width="1.2" stroke-dasharray="4 4"/>

  <text x="72" y="266" font-size="11.5" font-weight="700" fill="#2F6B5E">EventLoop 在干什么</text>

  <rect x="140" y="276" width="150" height="26" rx="4" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <text x="215" y="294" font-size="10.5" fill="#4A473F" text-anchor="middle">空闲</text>

  <rect x="290" y="276" width="650" height="26" rx="4" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
  <text x="615" y="294" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">卡在一个 320ms 的慢回调里，回不到 epoll_wait</text>

  <rect x="940" y="276" width="200" height="26" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1040" y="294" font-size="10.5" fill="#24473F" text-anchor="middle">读 timerfd 并派发</text>

  <!-- 时间轴 -->
  <line x1="140" y1="330" x2="1150" y2="330" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="140" y1="330" x2="140" y2="337" stroke="#5A564B" stroke-width="1"/>
  <line x1="390" y1="330" x2="390" y2="337" stroke="#5A564B" stroke-width="1"/>
  <line x1="640" y1="330" x2="640" y2="337" stroke="#5A564B" stroke-width="1"/>
  <line x1="890" y1="330" x2="890" y2="337" stroke="#5A564B" stroke-width="1"/>
  <line x1="1140" y1="330" x2="1140" y2="337" stroke="#5A564B" stroke-width="1"/>

  <text x="140" y="354" font-size="10" fill="#6B675C" text-anchor="middle">0</text>
  <text x="390" y="354" font-size="10" fill="#6B675C" text-anchor="middle">100</text>
  <text x="640" y="354" font-size="10" fill="#6B675C" text-anchor="middle">200</text>
  <text x="890" y="354" font-size="10" fill="#6B675C" text-anchor="middle">300</text>
  <text x="1140" y="354" font-size="10" fill="#6B675C" text-anchor="middle">400</text>
  <text x="1168" y="336" font-size="10" fill="#6B675C">ms</text>

  <!-- B 区：itimerspec -->
  <text x="56" y="406" font-size="14" font-weight="700" fill="#4A473F">B · itimerspec：一次性还是周期，由这两个字段决定</text>

  <rect x="56" y="418" width="548" height="28" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="68" y="437" font-size="11.5" font-weight="700" fill="#4A473F">字段 / 取值</text>
  <text x="248" y="437" font-size="11.5" font-weight="700" fill="#4A473F">语义</text>

  <rect x="56" y="446" width="548" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="68" y="466" font-size="11" font-weight="700" fill="#2C4460">it_value</text>
  <text x="248" y="466" font-size="11" fill="#4A473F">第一次到期时间，设 0 等于停表</text>

  <rect x="56" y="476" width="548" height="30" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="68" y="496" font-size="11" font-weight="700" fill="#2C4460">it_interval</text>
  <text x="248" y="496" font-size="11" fill="#4A473F">之后的重复周期，0 表示只响一次</text>

  <rect x="56" y="506" width="548" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="68" y="526" font-size="11" font-weight="700" fill="#2C4460">flags = 0</text>
  <text x="248" y="526" font-size="11" fill="#4A473F">it_value 按相对当前时刻算</text>

  <rect x="56" y="536" width="548" height="30" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="68" y="556" font-size="11" font-weight="700" fill="#2C4460">TFD_TIMER_ABSTIME</text>
  <text x="248" y="556" font-size="11" fill="#4A473F">it_value 按绝对时刻算</text>

  <!-- C 区：处理策略 -->
  <text x="636" y="406" font-size="14" font-weight="700" fill="#4A473F">C · 拿到 expirations = 3 之后，回调跑几次</text>

  <rect x="636" y="418" width="548" height="28" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="648" y="437" font-size="11.5" font-weight="700" fill="#4A473F">做法</text>
  <text x="846" y="437" font-size="11.5" font-weight="700" fill="#4A473F">后果</text>

  <rect x="636" y="446" width="548" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="648" y="466" font-size="11" fill="#4A473F">读了但忽略次数</text>
  <text x="846" y="466" font-size="11" fill="#4A473F">少跑两次，节奏被慢回调拉长</text>

  <rect x="636" y="476" width="548" height="30" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="648" y="496" font-size="11" fill="#4A473F">补跑 3 次</text>
  <text x="846" y="496" font-size="11" fill="#4A473F">追平进度，但可能连锁雪崩</text>

  <rect x="636" y="506" width="548" height="30" fill="#E6EFEA" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="648" y="526" font-size="11" font-weight="700" fill="#24473F">跑 1 次 + 重排下次</text>
  <text x="846" y="526" font-size="11" font-weight="700" fill="#24473F">心跳与超时检查的常见选择</text>

  <rect x="636" y="536" width="548" height="30" fill="#F4E9E4" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="648" y="556" font-size="11" font-weight="700" fill="#733428">干脆不 read</text>
  <text x="846" y="556" font-size="11" fill="#733428">LT 下 fd 一直可读，循环空转跑满 CPU</text>

  <text x="56" y="612" font-size="11.5" fill="#4A473F">read() 返回的 uint64_t 是「自上次 read 以来累计到期几次」，不是「现在到期了」—— EventLoop 越忙，这个数越大。</text>
  <text x="56" y="638" font-size="11.5" fill="#4A473F">timerfd 只提供一个到期时刻。上百个业务定时任务的排序、取消与重排，仍要靠最小堆或时间轮，见 13.9。</text>
</svg>
