<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>
  <title>Reactor 回调分发全链路与 revents_ 位判定</title>
  <desc>注册期把可调用对象存进 Channel，运行期 epoll_wait 返回后由 EventLoop 逐个分派，最后按 revents_ 的 bit 决定调用哪几个回调。</desc>

  <rect x="0" y="0" width="1240" height="780" fill="#F5F4ED"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">回调分发全链路：注册一次，触发无数次</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">epoll 只知道 fd 号码；能从 fd 找回对象和行为的，是注册期埋下的 Channel* 与 std::function</text>

  <!-- ================= A 区：注册期 ================= -->
  <text x="56" y="118" font-size="14" font-weight="700" fill="#4A473F">A · 注册期：每条连接建立时只走一遍</text>

  <rect x="56" y="130" width="1128" height="104" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="76" y="152" width="248" height="64" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="200" y="178" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 构造 TcpConnection</text>
  <text x="200" y="198" font-size="10.5" fill="#2C4460" text-anchor="middle">持有 connFd 和自己的 Channel</text>

  <rect x="352" y="152" width="248" height="64" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="476" y="178" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">② setReadCallback([this]{…})</text>
  <text x="476" y="198" font-size="10.5" fill="#2C4460" text-anchor="middle">捕获 this，此刻一个字节都不读</text>

  <rect x="628" y="152" width="248" height="64" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="752" y="178" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">③ Channel 存下 std::function</text>
  <text x="752" y="198" font-size="10.5" fill="#2C4460" text-anchor="middle">read / write / close / error 四个</text>

  <rect x="904" y="152" width="248" height="64" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="1028" y="178" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">④ epoll_ctl(EPOLL_CTL_ADD)</text>
  <text x="1028" y="198" font-size="10.5" fill="#2C4460" text-anchor="middle">data.ptr 存的是 Channel* 地址</text>

  <line x1="328" y1="184" x2="348" y2="184" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="604" y1="184" x2="624" y2="184" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="880" y1="184" x2="900" y2="184" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <line x1="1028" y1="238" x2="1028" y2="280" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="1042" y="264" font-size="10.5" fill="#6B675C">此后每轮都走 B</text>

  <!-- ================= B 区：运行期 ================= -->
  <text x="56" y="272" font-size="14" font-weight="700" fill="#4A473F">B · 运行期：epoll_wait 每返回一次，就重走一遍</text>

  <rect x="56" y="284" width="1128" height="170" rx="8" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1"/>

  <text x="174" y="312" font-size="11" font-weight="700" fill="#2F6B5E" text-anchor="middle">内核 · epoll 实例</text>
  <text x="394" y="312" font-size="11" font-weight="700" fill="#2F6B5E" text-anchor="middle">EpollPoller</text>
  <text x="614" y="312" font-size="11" font-weight="700" fill="#2F6B5E" text-anchor="middle">EventLoop::loop()</text>
  <text x="834" y="312" font-size="11" font-weight="700" fill="#2F6B5E" text-anchor="middle">Channel</text>
  <text x="1054" y="312" font-size="11" font-weight="700" fill="#2F6B5E" text-anchor="middle">TcpConnection / Acceptor</text>

  <rect x="76" y="326" width="196" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="174" y="354" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">⑤ epoll_wait() 返回 n</text>
  <text x="174" y="376" font-size="10.5" fill="#24473F" text-anchor="middle">内核填好 events[i]</text>

  <rect x="296" y="326" width="196" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="394" y="354" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">⑥ 从 data.ptr 还原</text>
  <text x="394" y="376" font-size="10.5" fill="#24473F" text-anchor="middle">setRevents(ev.events)</text>

  <rect x="516" y="326" width="196" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="614" y="354" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">⑦ 遍历 activeChannels_</text>
  <text x="614" y="376" font-size="10.5" fill="#24473F" text-anchor="middle">逐个 handleEvent()</text>

  <rect x="736" y="326" width="196" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="834" y="354" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">⑧ 按 revents_ 位分派</text>
  <text x="834" y="376" font-size="10.5" fill="#24473F" text-anchor="middle">一轮可触发多个回调</text>

  <rect x="956" y="326" width="196" height="76" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1054" y="354" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">⑨ handleRead() 里 recv()</text>
  <text x="1054" y="376" font-size="10.5" fill="#24473F" text-anchor="middle">epoll 不替你读数据</text>

  <line x1="276" y1="364" x2="292" y2="364" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="496" y1="364" x2="512" y2="364" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="716" y1="364" x2="732" y2="364" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="936" y1="364" x2="952" y2="364" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="76" y="414" width="1076" height="28" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="614" y="433" font-size="11.5" fill="#733428" text-anchor="middle">⑧ 的危险区：回调里 close 自己 → Channel 已析构，后续分支即 UAF</text>

  <!-- ================= C 区：revents 位判定表 ================= -->
  <text x="56" y="482" font-size="14" font-weight="700" fill="#4A473F">C · handleEvent() 的分支顺序：为什么 EPOLLHUP 必须先看 EPOLLIN</text>

  <rect x="56" y="496" width="1128" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="68" y="516" font-size="11.5" font-weight="700" fill="#4A473F">revents_ 位</text>
  <text x="278" y="516" font-size="11.5" font-weight="700" fill="#4A473F">这一位到底在说什么</text>
  <text x="548" y="516" font-size="11.5" font-weight="700" fill="#4A473F">触发的回调</text>
  <text x="758" y="516" font-size="11.5" font-weight="700" fill="#4A473F">判定要点</text>

  <rect x="56" y="526" width="1128" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="68" y="548" font-size="11.5" font-weight="700" fill="#2C4460">EPOLLIN</text>
  <text x="278" y="548" font-size="11" fill="#4A473F">可读，或对端已关闭</text>
  <text x="548" y="548" font-size="11" fill="#4A473F">readCallback_</text>
  <text x="758" y="548" font-size="11" fill="#4A473F">read() 返回 0 才是对端关闭，不是靠 HUP</text>

  <rect x="56" y="560" width="1128" height="34" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="68" y="582" font-size="11.5" font-weight="700" fill="#2C4460">EPOLLRDHUP</text>
  <text x="278" y="582" font-size="11" fill="#4A473F">对端半关闭了写端</text>
  <text x="548" y="582" font-size="11" fill="#4A473F">readCallback_</text>
  <text x="758" y="582" font-size="11" fill="#4A473F">不主动注册就收不到，只能靠 read()==0 兜底</text>

  <rect x="56" y="594" width="1128" height="34" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="68" y="616" font-size="11.5" font-weight="700" fill="#2C4460">EPOLLOUT</text>
  <text x="278" y="616" font-size="11" fill="#4A473F">发送缓冲区有空位</text>
  <text x="548" y="616" font-size="11" fill="#4A473F">writeCallback_</text>
  <text x="758" y="616" font-size="11" fill="#4A473F">常态不注册；output buffer 有积压时才开</text>

  <rect x="56" y="628" width="1128" height="34" fill="#F4E9E4" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="68" y="650" font-size="11.5" font-weight="700" fill="#733428">EPOLLHUP</text>
  <text x="278" y="650" font-size="11" fill="#733428">两端都挂断了</text>
  <text x="548" y="650" font-size="11" fill="#733428">closeCallback_</text>
  <text x="758" y="650" font-size="11" font-weight="700" fill="#733428">必须写成 HUP &amp;&amp; !IN，否则丢掉最后一批数据</text>

  <rect x="56" y="662" width="1128" height="34" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="68" y="684" font-size="11.5" font-weight="700" fill="#2C4460">EPOLLERR</text>
  <text x="278" y="684" font-size="11" fill="#4A473F">fd 上发生了错误</text>
  <text x="548" y="684" font-size="11" fill="#4A473F">errorCallback_</text>
  <text x="758" y="684" font-size="11" fill="#4A473F">错误码要用 getsockopt(SO_ERROR) 单独取</text>

  <text x="56" y="726" font-size="11.5" fill="#4A473F">EPOLLERR 和 EPOLLHUP 不需要注册，内核总会上报；EPOLLIN / EPOLLOUT / EPOLLRDHUP 必须自己写进 events_ 才收得到。</text>
  <text x="56" y="748" font-size="11.5" fill="#4A473F">分支之间不要写 else —— revents_ 是 bit mask，一个 fd 在同一轮里同时可读又可写是常态。</text>
</svg>
