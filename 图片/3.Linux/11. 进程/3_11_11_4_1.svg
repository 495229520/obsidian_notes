<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <title>共享内存页表映射示意图</title>
  <desc>进程 A 和进程 B 保留各自独立的虚拟地址空间，通过各自页表把不同虚拟地址映射到同一组共享物理页。</desc>
  <defs>
    <marker id="arrowA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowKernel" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="48" text-anchor="middle" dominant-baseline="middle" fill="#2f251d" font-size="34" font-weight="800">共享内存：两个进程映射到同一组物理页</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="86" text-anchor="middle" dominant-baseline="middle" fill="#6f6255" font-size="18" font-weight="600">虚拟地址可以不同；真正共享的是底层物理内存页，数据不在进程之间复制</text>

    <rect x="58" y="130" width="396" height="286" rx="28" ry="28" fill="#fff7e8" stroke="#d6a96b" stroke-width="2.4"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="256" y="174" text-anchor="middle" dominant-baseline="middle" fill="#6b3f14" font-size="28" font-weight="800">进程 A</text>
    <rect x="98" y="214" width="316" height="150" rx="22" ry="22" fill="#fffbeb" stroke="#e6bc75" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="256" y="244" text-anchor="middle" dominant-baseline="middle" fill="#8a5a22" font-size="18" font-weight="800">独立用户虚拟地址空间</text>
    <rect x="134" y="278" width="244" height="66" rx="16" ry="16" fill="#fef3c7" stroke="#d99a32" stroke-width="2.2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="256" y="302" text-anchor="middle" dominant-baseline="middle" fill="#51320f" font-size="20" font-weight="800">VA_A：虚拟地址</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="256" y="328" text-anchor="middle" dominant-baseline="middle" fill="#7c5a25" font-size="14" font-weight="700">shmat() 返回，如 0x7f10...</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="256" y="390" text-anchor="middle" dominant-baseline="middle" fill="#8a5a22" font-size="14" font-weight="700">页表属于进程 A 自己</text>

    <rect x="826" y="130" width="396" height="286" rx="28" ry="28" fill="#eaf7ef" stroke="#74b48c" stroke-width="2.4"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1024" y="174" text-anchor="middle" dominant-baseline="middle" fill="#24573b" font-size="28" font-weight="800">进程 B</text>
    <rect x="866" y="214" width="316" height="150" rx="22" ry="22" fill="#f0fdf4" stroke="#95cda6" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1024" y="244" text-anchor="middle" dominant-baseline="middle" fill="#4d8566" font-size="18" font-weight="800">独立用户虚拟地址空间</text>
    <rect x="902" y="278" width="244" height="66" rx="16" ry="16" fill="#dcfce7" stroke="#6fb98a" stroke-width="2.2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1024" y="302" text-anchor="middle" dominant-baseline="middle" fill="#174b2b" font-size="20" font-weight="800">VA_B：虚拟地址</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1024" y="328" text-anchor="middle" dominant-baseline="middle" fill="#3b7253" font-size="14" font-weight="700">同一 shmid，地址可不同</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1024" y="390" text-anchor="middle" dominant-baseline="middle" fill="#4d8566" font-size="14" font-weight="700">页表属于进程 B 自己</text>

    <rect x="502" y="150" width="276" height="132" rx="24" ry="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="184" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="22" font-weight="800">内核维护 shm 对象</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="218" text-anchor="middle" dominant-baseline="middle" fill="#475569" font-size="16" font-weight="700">key → shmid → 物理页列表</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="248" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="14" font-weight="600">记录大小、权限、连接计数</text>
    <path d="M502 216 C470 216 448 250 404 300" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrowKernel)"/>
    <path d="M778 216 C810 216 832 250 876 300" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrowKernel)"/>

    <rect x="168" y="456" width="236" height="80" rx="18" ry="18" fill="#fffaf0" stroke="#dcc8a8" stroke-width="1.8"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="286" y="486" text-anchor="middle" dominant-baseline="middle" fill="#7a4a14" font-size="18" font-weight="800">进程 A 页表项</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="286" y="514" text-anchor="middle" dominant-baseline="middle" fill="#9a621b" font-size="14" font-weight="700">VA_A 页号 → 共享物理页</text>

    <rect x="876" y="456" width="236" height="80" rx="18" ry="18" fill="#f0fdfa" stroke="#99d7cd" stroke-width="1.8"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="994" y="486" text-anchor="middle" dominant-baseline="middle" fill="#0f6158" font-size="18" font-weight="800">进程 B 页表项</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="994" y="514" text-anchor="middle" dominant-baseline="middle" fill="#247067" font-size="14" font-weight="700">VA_B 页号 → 同一物理页</text>

    <path d="M256 348 L256 436" fill="none" stroke="#b45309" stroke-width="3.4" stroke-linecap="round" marker-end="url(#arrowA)"/>
    <path d="M1024 348 L1024 436" fill="none" stroke="#047857" stroke-width="3.4" stroke-linecap="round" marker-end="url(#arrowB)"/>

    <rect x="302" y="588" width="676" height="118" rx="28" ry="28" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.6"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="622" text-anchor="middle" dominant-baseline="middle" fill="#075985" font-size="25" font-weight="800">共享内存区域：同一组物理内存页</text>
    <g>
      <rect x="356" y="648" width="110" height="34" rx="10" ry="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.6"/>
      <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="411" y="666" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="13" font-weight="700">普通页</text>
      <rect x="484" y="642" width="136" height="46" rx="12" ry="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2.2"/>
      <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="552" y="660" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" font-size="14" font-weight="800">共享页 PFN#42</text>
      <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="552" y="678" text-anchor="middle" dominant-baseline="middle" fill="#2563eb" font-size="12" font-weight="700">data buffer</text>
      <rect x="660" y="642" width="136" height="46" rx="12" ry="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2.2"/>
      <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="728" y="660" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" font-size="14" font-weight="800">共享页 PFN#43</text>
      <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="728" y="678" text-anchor="middle" dominant-baseline="middle" fill="#2563eb" font-size="12" font-weight="700">data buffer</text>
      <rect x="814" y="648" width="110" height="34" rx="10" ry="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.6"/>
      <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="869" y="666" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="13" font-weight="700">普通页</text>
    </g>

    <path d="M286 536 C286 574 334 606 420 626 C456 638 474 652 484 665" fill="none" stroke="#b45309" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowA)"/>
    <path d="M994 536 C994 574 946 606 860 626 C824 638 806 652 796 665" fill="none" stroke="#047857" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/>

    <rect x="382" y="716" width="516" height="32" rx="16" ry="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="733" text-anchor="middle" dominant-baseline="middle" fill="#475569" font-size="14" font-weight="800">共享内存只解决“同一片数据”；并发一致性仍要配合信号量 / 互斥锁</text>
  </g>
</svg>
