<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" version="1.1">
  <rect x="0" y="0" width="1280" height="840" fill="rgb(245, 244, 237)"/>
  <title>System V 信号量创建控制流程与同步流程</title>
  <desc>上半部分展示 ftok、semget、semctl 的创建和控制生命周期，下半部分展示 semop 的 P/V 同步过程。</desc>

  <g font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="42" text-anchor="middle" dominant-baseline="middle" fill="#2f251d" font-size="34" font-weight="800">System V 信号量：创建、控制与同步</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="78" text-anchor="middle" dominant-baseline="middle" fill="#6f6255" font-size="18" font-weight="700">先用 key 找到内核对象，再用 semctl 管理状态，最后用 semop 做原子 P/V</text>

    <rect x="56" y="116" width="1168" height="286" rx="28" ry="28" fill="#fffaf0" stroke="#d6cfc4" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="96" y="150" text-anchor="start" dominant-baseline="middle" fill="#7c2d12" font-size="19" font-weight="900">A. 创建与控制流程：对象生命周期</text>

    <rect x="86" y="188" width="178" height="118" rx="20" ry="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="116" cy="218" r="18" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="116" y="218" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="19" font-weight="900">1</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="175" y="218" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="19" font-weight="900">ftok()</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="175" y="254" text-anchor="middle" dominant-baseline="middle" fill="#7c2d12" font-size="14" font-weight="700">路径 + 项目 id</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="175" y="278" text-anchor="middle" dominant-baseline="middle" fill="#7c2d12" font-size="14" font-weight="700">生成 key</text>

    <path d="M276 247 L326 247 M314 239 L326 247 L314 255" fill="none" stroke="#92400e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="338" y="188" width="202" height="118" rx="20" ry="20" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="370" cy="218" r="18" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="370" y="218" text-anchor="middle" dominant-baseline="middle" fill="#92400e" font-size="19" font-weight="900">2</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="439" y="218" text-anchor="middle" dominant-baseline="middle" fill="#92400e" font-size="19" font-weight="900">semget()</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="439" y="254" text-anchor="middle" dominant-baseline="middle" fill="#78350f" font-size="14" font-weight="700">IPC_CREAT | 权限</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="439" y="278" text-anchor="middle" dominant-baseline="middle" fill="#78350f" font-size="14" font-weight="700">返回 semid</text>

    <path d="M552 247 L602 247 M590 239 L602 247 L590 255" fill="none" stroke="#92400e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="614" y="188" width="202" height="118" rx="20" ry="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <circle cx="646" cy="218" r="18" fill="#bbf7d0" stroke="#4ade80" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="646" y="218" text-anchor="middle" dominant-baseline="middle" fill="#047857" font-size="19" font-weight="900">3</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="715" y="218" text-anchor="middle" dominant-baseline="middle" fill="#047857" font-size="19" font-weight="900">SETVAL</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="715" y="254" text-anchor="middle" dominant-baseline="middle" fill="#14532d" font-size="14" font-weight="700">semctl 初始化</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="715" y="278" text-anchor="middle" dominant-baseline="middle" fill="#14532d" font-size="14" font-weight="700">二进制常设为 1</text>

    <path d="M828 247 L878 247 M866 239 L878 247 L866 255" fill="none" stroke="#92400e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="890" y="188" width="140" height="118" rx="20" ry="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="918" cy="218" r="18" fill="#bfdbfe" stroke="#60a5fa" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="918" y="218" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" font-size="19" font-weight="900">4</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="966" y="218" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" font-size="18" font-weight="900">查询</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="960" y="254" text-anchor="middle" dominant-baseline="middle" fill="#1e3a8a" font-size="14" font-weight="700">GETVAL</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="960" y="278" text-anchor="middle" dominant-baseline="middle" fill="#1e3a8a" font-size="14" font-weight="700">IPC_STAT</text>

    <path d="M1042 247 L1086 247 M1074 239 L1086 247 L1074 255" fill="none" stroke="#92400e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1098" y="188" width="96" height="118" rx="20" ry="20" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <circle cx="1124" cy="218" r="18" fill="#fecaca" stroke="#f87171" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1124" y="218" text-anchor="middle" dominant-baseline="middle" fill="#b91c1c" font-size="19" font-weight="900">5</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1152" y="250" text-anchor="middle" dominant-baseline="middle" fill="#991b1b" font-size="15" font-weight="900">IPC_RMID</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1152" y="276" text-anchor="middle" dominant-baseline="middle" fill="#991b1b" font-size="14" font-weight="700">删除</text>

    <rect x="338" y="334" width="478" height="42" rx="21" ry="21" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="577" y="356" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="15" font-weight="800">创建后，多个进程只要拿到同一个 semid，就在操作同一个内核信号量集</text>
    <path d="M716 306 C716 322 700 330 672 334" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 7"/>

    <rect x="56" y="430" width="1168" height="246" rx="28" ry="28" fill="#f8fafc" stroke="#d6cfc4" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="96" y="464" text-anchor="start" dominant-baseline="middle" fill="#1f3b57" font-size="19" font-weight="900">B. 使用与同步流程：许可如何流转</text>

    <rect x="98" y="506" width="226" height="110" rx="20" ry="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="211" y="536" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" font-size="22" font-weight="900">P：申请许可</text>
    <rect x="132" y="558" width="158" height="34" rx="12" ry="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="211" y="576" text-anchor="middle" dominant-baseline="middle" fill="#1e3a8a" font-size="15" font-weight="900">semop(-1)</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="211" y="602" text-anchor="middle" dominant-baseline="middle" fill="#2563eb" font-size="16" font-weight="900">semval：1 → 0</text>

    <path d="M338 560 L414 560 M402 552 L414 560 L402 568" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="428" y="506" width="224" height="110" rx="20" ry="20" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2.2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="540" y="536" text-anchor="middle" dominant-baseline="middle" fill="#3730a3" font-size="22" font-weight="900">等待队列</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="540" y="570" text-anchor="middle" dominant-baseline="middle" fill="#312e81" font-size="15" font-weight="800">若 semval 已是 0</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="540" y="596" text-anchor="middle" dominant-baseline="middle" fill="#312e81" font-size="15" font-weight="800">新的 P 操作会睡眠</text>

    <path d="M666 560 L742 560 M730 552 L742 560 L730 568" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="756" y="506" width="224" height="110" rx="20" ry="20" fill="#ecfeff" stroke="#22d3ee" stroke-width="2.2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="868" y="536" text-anchor="middle" dominant-baseline="middle" fill="#155e75" font-size="22" font-weight="900">访问共享资源</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="868" y="570" text-anchor="middle" dominant-baseline="middle" fill="#075985" font-size="15" font-weight="800">共享内存 / 文件 / 槽位</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="868" y="596" text-anchor="middle" dominant-baseline="middle" fill="#075985" font-size="15" font-weight="800">业务数据放在这里</text>

    <path d="M994 560 L1070 560 M1058 552 L1070 560 L1058 568" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1084" y="506" width="110" height="110" rx="20" ry="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="2.2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1139" y="536" text-anchor="middle" dominant-baseline="middle" fill="#047857" font-size="21" font-weight="900">V：释放</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1139" y="570" text-anchor="middle" dominant-baseline="middle" fill="#14532d" font-size="15" font-weight="900">semop(+1)</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1139" y="596" text-anchor="middle" dominant-baseline="middle" fill="#047857" font-size="16" font-weight="900">0 → 1</text>

    <rect x="98" y="636" width="1096" height="28" rx="14" ry="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.4"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="646" y="651" text-anchor="middle" dominant-baseline="middle" fill="#3730a3" font-size="13" font-weight="800">V 操作释放许可后，内核唤醒等待队列中的进程；整个检查、修改、阻塞、唤醒过程由 semop 原子完成</text>

    <rect x="86" y="714" width="330" height="70" rx="20" ry="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="251" y="738" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="19" font-weight="900">semget()</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="251" y="762" text-anchor="middle" dominant-baseline="middle" fill="#7c2d12" font-size="14" font-weight="800">创建/获取对象，拿到 semid</text>

    <rect x="475" y="714" width="330" height="70" rx="20" ry="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="738" text-anchor="middle" dominant-baseline="middle" fill="#166534" font-size="19" font-weight="900">semctl()</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="762" text-anchor="middle" dominant-baseline="middle" fill="#14532d" font-size="14" font-weight="800">SETVAL / GETVAL / IPC_STAT / IPC_RMID</text>

    <rect x="864" y="714" width="330" height="70" rx="20" ry="20" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1029" y="738" text-anchor="middle" dominant-baseline="middle" fill="#3730a3" font-size="19" font-weight="900">semop()</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1029" y="762" text-anchor="middle" dominant-baseline="middle" fill="#312e81" font-size="14" font-weight="800">真正执行 P/V 同步操作</text>
  </g>
</svg>
