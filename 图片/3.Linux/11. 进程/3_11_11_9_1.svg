<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180px" height="620px" viewBox="0 0 1180 620" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)" />
  <title>管道半双工通信示意图</title>
  <desc>Process A writes bytes into a kernel pipe buffer, and Process B reads them from the other end.</desc>
  <defs>
    <marker id="arrowMain" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L8 5 L2 8" fill="none" stroke="#8b6b3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <g font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="590" y="58" text-anchor="middle" dominant-baseline="middle" fill="#2f251d" font-size="34" font-weight="800">管道：一个方向的字节流通道</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="590" y="96" text-anchor="middle" dominant-baseline="middle" fill="#7a6a58" font-size="17" font-weight="600">匿名管道把一个写入端和一个读取端连接起来；单个管道本身是半双工的</text>

    <rect x="70" y="170" width="250" height="250" rx="26" ry="26" fill="#fff7e8" stroke="#d6a96b" stroke-width="2.4" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="195" y="220" text-anchor="middle" dominant-baseline="middle" fill="#6b3f14" font-size="27" font-weight="800">进程 A</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="195" y="260" text-anchor="middle" dominant-baseline="middle" fill="#8a5a22" font-size="18" font-weight="700">写入端 writer</text>
    <rect x="118" y="295" width="154" height="66" rx="15" ry="15" fill="#fffbeb" stroke="#d9a751" stroke-width="2" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="195" y="322" text-anchor="middle" dominant-baseline="middle" fill="#51320f" font-size="22" font-weight="800">fd[1]</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="195" y="350" text-anchor="middle" dominant-baseline="middle" fill="#7c5a25" font-size="15" font-weight="600">write()</text>

    <rect x="428" y="150" width="324" height="290" rx="28" ry="28" fill="#f8fafc" stroke="#64748b" stroke-width="2.4" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="590" y="196" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="25" font-weight="800">内核管道缓冲区</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="590" y="228" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="16" font-weight="600">kernel pipe buffer</text>

    <rect x="478" y="274" width="224" height="82" rx="24" ry="24" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.2" />
    <circle cx="522" cy="315" r="13" fill="#2563eb" opacity="0.92" />
    <circle cx="570" cy="315" r="13" fill="#2563eb" opacity="0.78" />
    <circle cx="618" cy="315" r="13" fill="#2563eb" opacity="0.64" />
    <circle cx="666" cy="315" r="13" fill="#2563eb" opacity="0.5" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="590" y="392" text-anchor="middle" dominant-baseline="middle" fill="#475569" font-size="16" font-weight="700">按字节顺序进入，按字节顺序读出</text>

    <rect x="860" y="170" width="250" height="250" rx="26" ry="26" fill="#eaf7ef" stroke="#74b48c" stroke-width="2.4" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="985" y="220" text-anchor="middle" dominant-baseline="middle" fill="#24573b" font-size="27" font-weight="800">进程 B</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="985" y="260" text-anchor="middle" dominant-baseline="middle" fill="#4d8566" font-size="18" font-weight="700">读取端 reader</text>
    <rect x="908" y="295" width="154" height="66" rx="15" ry="15" fill="#f0fdf4" stroke="#86c69a" stroke-width="2" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="985" y="322" text-anchor="middle" dominant-baseline="middle" fill="#174b2b" font-size="22" font-weight="800">fd[0]</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="985" y="350" text-anchor="middle" dominant-baseline="middle" fill="#3b7253" font-size="15" font-weight="600">read()</text>

    <path d="M272 328 C338 328 360 314 426 314" fill="none" stroke="#2563eb" stroke-width="4.2" stroke-linecap="round" marker-end="url(#arrowMain)" />
    <path d="M702 314 C768 314 794 328 908 328" fill="none" stroke="#2563eb" stroke-width="4.2" stroke-linecap="round" marker-end="url(#arrowMain)" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="350" y="285" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" font-size="17" font-weight="800">写入字节</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="806" y="285" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" font-size="17" font-weight="800">读取字节</text>

    <path d="M860 426 C690 498 488 498 320 426" fill="none" stroke="#8b6b3f" stroke-width="2.4" stroke-dasharray="8 8" stroke-linecap="round" marker-end="url(#arrowSoft)" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="590" y="495" text-anchor="middle" dominant-baseline="middle" fill="#7a5b33" font-size="16" font-weight="700">反向通信不能靠同一个方向返回，通常再创建第二个管道</text>

    <rect x="108" y="524" width="224" height="52" rx="18" ry="18" fill="#fffaf0" stroke="#dcc8a8" stroke-width="1.8" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="220" y="551" text-anchor="middle" dominant-baseline="middle" fill="#6b4d1d" font-size="17" font-weight="800">半双工：单向流动</text>
    <rect x="478" y="524" width="224" height="52" rx="18" ry="18" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.8" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="590" y="551" text-anchor="middle" dominant-baseline="middle" fill="#075985" font-size="17" font-weight="800">字节流：没有消息边界</text>
    <rect x="848" y="524" width="224" height="52" rx="18" ry="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8" />
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="960" y="551" text-anchor="middle" dominant-baseline="middle" fill="#166534" font-size="17" font-weight="800">常用于父子进程</text>
  </g>
</svg>
