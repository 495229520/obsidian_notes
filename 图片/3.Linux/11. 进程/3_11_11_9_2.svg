<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="820" viewBox="0 0 1260 820" version="1.1">
  <title>匿名管道 pipe fork close 的文件描述符关系</title>
  <desc>父进程先 pipe 创建读端和写端，fork 后父子进程各有一组相同编号的文件描述符。父进程关闭读端并写入，子进程关闭写端并读取，数据经过内核管道缓冲区。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1260" height="820" fill="rgb(245, 244, 237)"/>

  <text x="630" y="48" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#444441">匿名管道：pipe()、fork() 与关闭不用端</text>
  <text x="630" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#5F5E5A">示例方向：父进程写入 fd[1]，子进程读取 fd[0]；反向通信时关闭端对调</text>

  <rect x="80" y="120" width="1100" height="96" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <circle cx="124" cy="168" r="20" fill="#854F0B"/>
  <text x="124" y="168" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FAEEDA">1</text>
  <text x="168" y="150" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#633806">父进程调用 pipe(fd)</text>
  <text x="168" y="184" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#633806">内核创建管道缓冲区，并在父进程中返回 fd[0]=读端、fd[1]=写端</text>
  <text x="950" y="150" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#633806">fd[0] = 3</text>
  <text x="950" y="182" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#633806">读取端</text>
  <text x="1080" y="150" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#633806">fd[1] = 4</text>
  <text x="1080" y="182" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#633806">写入端</text>

  <path d="M630 216 L630 276" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="630" y="250" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#3C3489">fork()</text>

  <path d="M630 286 C470 304 340 318 256 352" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M630 286 C790 304 920 318 1004 352" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <rect x="80" y="350" width="500" height="190" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <circle cx="124" cy="394" r="20" fill="#185FA5"/>
  <text x="124" y="394" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#E6F1FB">2</text>
  <text x="168" y="376" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#0C447C">父进程：保留同一组 fd</text>
  <text x="168" y="414" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#0C447C">fork 后仍能看到 fd[0]=3、fd[1]=4</text>
  <text x="168" y="456" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#0C447C">作为写入方：</text>
  <text x="168" y="490" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#0C447C">关闭 fd[0]，只保留 fd[1] 执行 write()</text>

  <rect x="680" y="350" width="500" height="190" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="724" cy="394" r="20" fill="#0F6E56"/>
  <text x="724" y="394" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#E1F5EE">2</text>
  <text x="768" y="376" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#085041">子进程：复制同一组 fd</text>
  <text x="768" y="414" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#085041">fork 后也能看到 fd[0]=3、fd[1]=4</text>
  <text x="768" y="456" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#085041">作为读取方：</text>
  <text x="768" y="490" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#085041">关闭 fd[1]，只保留 fd[0] 执行 read()</text>

  <path d="M330 540 L330 628" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M930 540 L930 628" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="430" y="640" width="400" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="630" y="664" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="21" font-weight="600" fill="#3C3489">内核管道缓冲区</text>
  <text x="630" y="694" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#3C3489">字节按 FIFO 顺序从写端流向读端</text>

  <path d="M330 668 L430 668" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M830 668 L930 668" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="724" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#0C447C">父进程 fd[1] write()</text>
  <text x="930" y="724" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#085041">子进程 fd[0] read()</text>

  <text x="630" y="768" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#444441">关键点：fork 复制的是文件描述符表项；通信方向由双方关闭哪个端来确定</text>
</svg>
