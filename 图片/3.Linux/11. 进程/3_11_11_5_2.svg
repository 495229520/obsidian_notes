<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" version="1.1">
  <rect x="0" y="0" width="1280" height="840" fill="rgb(245, 244, 237)"/>
  <title>两个进程通过信号量和共享内存协作</title>
  <desc>用从左到右的时间轴说明生产者和消费者如何借助 empty/full 信号量协调共享内存读写。</desc>

  <g font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="42" text-anchor="middle" dominant-baseline="middle" fill="#2f251d" font-size="34" font-weight="800">两个进程如何“通过信号量通讯”</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="78" text-anchor="middle" dominant-baseline="middle" fill="#6f6255" font-size="18" font-weight="700">信号量负责事件通知和访问顺序；共享内存负责真正传数据</text>

    <rect x="56" y="112" width="1168" height="434" rx="28" ry="28" fill="#f8fafc" stroke="#d6cfc4" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="96" y="150" text-anchor="start" dominant-baseline="middle" fill="#475569" font-size="18" font-weight="900">一次完整通信的时间轴</text>

    <rect x="86" y="184" width="156" height="204" rx="22" ry="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="116" cy="216" r="18" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="116" y="216" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="19" font-weight="900">1</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="178" y="216" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="19" font-weight="900">初始状态</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="164" y="260" text-anchor="middle" dominant-baseline="middle" fill="#7c2d12" font-size="16" font-weight="800">empty = 1</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="164" y="286" text-anchor="middle" dominant-baseline="middle" fill="#7c2d12" font-size="16" font-weight="800">full = 0</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="164" y="334" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="13" font-weight="700">可写，但还没有数据可读</text>

    <path d="M252 286 L302 286 M290 278 L302 286 L290 294" fill="none" stroke="#334155" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="312" y="184" width="156" height="204" rx="22" ry="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="342" cy="216" r="18" fill="#bfdbfe" stroke="#60a5fa" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="342" y="216" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" font-size="19" font-weight="900">2</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="406" y="216" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" font-size="19" font-weight="900">A 申请写</text>
    <rect x="336" y="248" width="108" height="36" rx="12" ry="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="390" y="267" text-anchor="middle" dominant-baseline="middle" fill="#1e3a8a" font-size="13" font-weight="900">wait(empty)</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="390" y="314" text-anchor="middle" dominant-baseline="middle" fill="#2563eb" font-size="17" font-weight="900">empty: 1 → 0</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="390" y="344" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="13" font-weight="700">A 获得写入许可</text>

    <path d="M478 286 L528 286 M516 278 L528 286 L516 294" fill="none" stroke="#334155" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="538" y="184" width="156" height="204" rx="22" ry="22" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="568" cy="216" r="18" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="568" y="216" text-anchor="middle" dominant-baseline="middle" fill="#155e75" font-size="19" font-weight="900">3</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="632" y="216" text-anchor="middle" dominant-baseline="middle" fill="#155e75" font-size="19" font-weight="900">A 写数据</text>
    <rect x="560" y="248" width="112" height="36" rx="12" ry="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="616" y="267" text-anchor="middle" dominant-baseline="middle" fill="#075985" font-size="13" font-weight="900">共享内存</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="616" y="314" text-anchor="middle" dominant-baseline="middle" fill="#075985" font-size="15" font-weight="900">message 写入 buffer</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="616" y="344" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="13" font-weight="700">数据不经过信号量</text>

    <path d="M704 286 L754 286 M742 278 L754 286 L742 294" fill="none" stroke="#334155" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="764" y="184" width="156" height="204" rx="22" ry="22" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <circle cx="794" cy="216" r="18" fill="#c7d2fe" stroke="#818cf8" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="794" y="216" text-anchor="middle" dominant-baseline="middle" fill="#3730a3" font-size="19" font-weight="900">4</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="858" y="216" text-anchor="middle" dominant-baseline="middle" fill="#3730a3" font-size="19" font-weight="900">A 通知 B</text>
    <rect x="788" y="248" width="108" height="36" rx="12" ry="12" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="842" y="267" text-anchor="middle" dominant-baseline="middle" fill="#312e81" font-size="13" font-weight="900">post(full)</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="842" y="314" text-anchor="middle" dominant-baseline="middle" fill="#4f46e5" font-size="17" font-weight="900">full: 0 → 1</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="842" y="344" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="13" font-weight="700">B 从等待中被唤醒</text>

    <path d="M930 286 L980 286 M968 278 L980 286 L968 294" fill="none" stroke="#334155" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="990" y="184" width="156" height="204" rx="22" ry="22" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
    <circle cx="1020" cy="216" r="18" fill="#bbf7d0" stroke="#4ade80" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1020" y="216" text-anchor="middle" dominant-baseline="middle" fill="#047857" font-size="19" font-weight="900">5</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1084" y="216" text-anchor="middle" dominant-baseline="middle" fill="#047857" font-size="19" font-weight="900">B 读取</text>
    <rect x="1012" y="248" width="112" height="36" rx="12" ry="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1068" y="267" text-anchor="middle" dominant-baseline="middle" fill="#14532d" font-size="13" font-weight="900">wait(full)</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1068" y="314" text-anchor="middle" dominant-baseline="middle" fill="#047857" font-size="17" font-weight="900">full: 1 → 0</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1068" y="344" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="13" font-weight="700">读取 buffer 中的数据</text>

    <path d="M1068 398 C1068 426 992 438 890 438 L234 438 C164 438 144 420 144 398 M136 410 L144 398 L152 410" fill="none" stroke="#047857" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="616" y="424" text-anchor="middle" dominant-baseline="middle" fill="#047857" font-size="13" font-weight="900">6. B 读完后 post(empty)：empty 0 → 1，A 可以再次写入</text>

    <rect x="104" y="470" width="1072" height="48" rx="20" ry="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="495" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-size="16" font-weight="900">从左到右读：A 先拿 empty 写数据，再用 full 通知 B；B 读完后把 empty 还给 A</text>

    <rect x="70" y="594" width="1140" height="162" rx="28" ry="28" fill="#f8fafc" stroke="#d6cfc4" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="108" y="628" text-anchor="start" dominant-baseline="middle" fill="#475569" font-size="18" font-weight="900">三个对象各自负责什么</text>

    <rect x="112" y="660" width="286" height="60" rx="18" ry="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="255" y="684" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-size="18" font-weight="900">empty 信号量</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="255" y="708" text-anchor="middle" dominant-baseline="middle" fill="#7c2d12" font-size="14" font-weight="800">控制“是否还有空槽位可写”</text>

    <rect x="497" y="660" width="286" height="60" rx="18" ry="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="684" text-anchor="middle" dominant-baseline="middle" fill="#075985" font-size="18" font-weight="900">共享内存 buffer</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="708" text-anchor="middle" dominant-baseline="middle" fill="#0c4a6e" font-size="14" font-weight="800">保存 message 等真正业务数据</text>

    <rect x="882" y="660" width="286" height="60" rx="18" ry="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1025" y="684" text-anchor="middle" dominant-baseline="middle" fill="#3730a3" font-size="18" font-weight="900">full 信号量</text>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="1025" y="708" text-anchor="middle" dominant-baseline="middle" fill="#312e81" font-size="14" font-weight="800">控制“是否已有数据可读”</text>

    <rect x="206" y="786" width="868" height="34" rx="17" ry="17" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
    <text font-family="PingFang SC, Microsoft YaHei, Inter, system-ui, sans-serif" x="640" y="804" text-anchor="middle" dominant-baseline="middle" fill="#92400e" font-size="14" font-weight="900">严格说：信号量不是数据通道，而是“事件通知 + 访问顺序”的同步通道</text>
  </g>
</svg>
