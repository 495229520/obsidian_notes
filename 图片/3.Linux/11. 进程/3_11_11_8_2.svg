<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>IPC 机制对照：消息边界、拷贝次数、能否进 epoll</title>
  <desc>上方是七种 IPC 机制在五个决定性属性上的对照表；左下是两次拷贝与零拷贝的路径示意；右下是 System V、POSIX、套接字三代接口的取舍。</desc>
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">选 IPC 先问四件事：传的是什么、给谁、要不要消息边界、要不要能进 epoll</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">「哪个最快」几乎从来不是决定因素，能不能和现有的事件循环拼在一起才是</text>

  <!-- ============ Panel A ============ -->
  <rect x="56" y="112" width="1128" height="316" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="72" y="140" font-size="13" font-weight="700" fill="#4A473F">A · 七种机制在五个决定性属性上的对照</text>

  <rect x="76" y="148" width="250" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="330" y="148" width="110" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="444" y="148" width="110" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="558" y="148" width="230" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="792" y="148" width="180" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <rect x="976" y="148" width="188" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="88" y="168" font-size="10.5" font-weight="700" fill="#4A473F">机制</text>
  <text x="385" y="168" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">传什么</text>
  <text x="499" y="168" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">消息边界</text>
  <text x="673" y="168" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">谁能用</text>
  <text x="882" y="168" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">每条数据的拷贝次数</text>
  <text x="1070" y="168" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">能进 epoll 吗</text>

  <!-- R1 -->
  <rect x="76" y="178" width="250" height="30" fill="#F5F4EE" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="330" y="178" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="444" y="178" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="558" y="178" width="230" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="792" y="178" width="180" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="976" y="178" width="188" height="30" fill="#E9F1EC" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="198" font-size="10.5" fill="#4A473F">匿名管道 pipe()</text>
  <text x="385" y="198" font-size="10" fill="#4A473F" text-anchor="middle">字节流</text>
  <text x="499" y="198" font-size="10" font-weight="700" fill="#A64B3C" text-anchor="middle">没有</text>
  <text x="673" y="198" font-size="10" fill="#4A473F" text-anchor="middle">有亲缘关系的进程，单向</text>
  <text x="882" y="198" font-size="10" fill="#4A473F" text-anchor="middle">2 次</text>
  <text x="1070" y="198" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle">能，它本来就是 fd</text>

  <!-- R2 -->
  <rect x="76" y="208" width="250" height="30" fill="#F5F4EE" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="330" y="208" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="444" y="208" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="558" y="208" width="230" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="792" y="208" width="180" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="976" y="208" width="188" height="30" fill="#E9F1EC" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="228" font-size="10.5" fill="#4A473F">命名管道 FIFO</text>
  <text x="385" y="228" font-size="10" fill="#4A473F" text-anchor="middle">字节流</text>
  <text x="499" y="228" font-size="10" font-weight="700" fill="#A64B3C" text-anchor="middle">没有</text>
  <text x="673" y="228" font-size="10" fill="#4A473F" text-anchor="middle">任意进程，单向</text>
  <text x="882" y="228" font-size="10" fill="#4A473F" text-anchor="middle">2 次</text>
  <text x="1070" y="228" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle">能</text>

  <!-- R3 -->
  <rect x="76" y="238" width="250" height="30" fill="#F5F4EE" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="330" y="238" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="444" y="238" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="558" y="238" width="230" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="792" y="238" width="180" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="976" y="238" width="188" height="30" fill="#F7ECE8" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="88" y="258" font-size="10.5" fill="#4A473F">System V 消息队列 msgget</text>
  <text x="385" y="258" font-size="10" fill="#4A473F" text-anchor="middle">带类型的消息</text>
  <text x="499" y="258" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle">有</text>
  <text x="673" y="258" font-size="10" fill="#4A473F" text-anchor="middle">任意进程，同一队列可双向</text>
  <text x="882" y="258" font-size="10" fill="#4A473F" text-anchor="middle">2 次</text>
  <text x="1070" y="258" font-size="10" font-weight="700" fill="#A64B3C" text-anchor="middle">不能，msqid 不是 fd</text>

  <!-- R4 -->
  <rect x="76" y="268" width="250" height="30" fill="#F5F4EE" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="330" y="268" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="444" y="268" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="558" y="268" width="230" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="792" y="268" width="180" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="976" y="268" width="188" height="30" fill="#E9F1EC" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="288" font-size="10.5" fill="#4A473F">POSIX 消息队列 mq_open</text>
  <text x="385" y="288" font-size="10" fill="#4A473F" text-anchor="middle">带优先级的消息</text>
  <text x="499" y="288" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle">有</text>
  <text x="673" y="288" font-size="10" fill="#4A473F" text-anchor="middle">任意进程</text>
  <text x="882" y="288" font-size="10" fill="#4A473F" text-anchor="middle">2 次</text>
  <text x="1070" y="288" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle">能，Linux 上就是 fd</text>

  <!-- R5 -->
  <rect x="76" y="298" width="250" height="30" fill="#F5F4EE" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="330" y="298" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="444" y="298" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="558" y="298" width="230" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="792" y="298" width="180" height="30" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <rect x="976" y="298" width="188" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="318" font-size="10.5" fill="#4A473F">System V 共享内存 shmget</text>
  <text x="385" y="318" font-size="10" fill="#4A473F" text-anchor="middle">裸内存</text>
  <text x="499" y="318" font-size="10" font-weight="700" fill="#A64B3C" text-anchor="middle">没有</text>
  <text x="673" y="318" font-size="10" fill="#4A473F" text-anchor="middle">任意进程</text>
  <text x="882" y="318" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">0 次</text>
  <text x="1070" y="318" font-size="10" fill="#6B675C" text-anchor="middle">不适用，得另配通知</text>

  <!-- R6 -->
  <rect x="76" y="328" width="250" height="30" fill="#F5F4EE" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="330" y="328" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="444" y="328" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="558" y="328" width="230" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="792" y="328" width="180" height="30" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <rect x="976" y="328" width="188" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="348" font-size="10.5" fill="#4A473F">POSIX 共享内存 shm_open</text>
  <text x="385" y="348" font-size="10" fill="#4A473F" text-anchor="middle">裸内存</text>
  <text x="499" y="348" font-size="10" font-weight="700" fill="#A64B3C" text-anchor="middle">没有</text>
  <text x="673" y="348" font-size="10" fill="#4A473F" text-anchor="middle">任意进程，句柄是 fd</text>
  <text x="882" y="348" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">0 次</text>
  <text x="1070" y="348" font-size="10" fill="#6B675C" text-anchor="middle">不适用，得另配通知</text>

  <!-- R7 -->
  <rect x="76" y="358" width="250" height="30" fill="#F5F4EE" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="330" y="358" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="444" y="358" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="558" y="358" width="230" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="792" y="358" width="180" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="976" y="358" width="188" height="30" fill="#E9F1EC" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="88" y="378" font-size="10.5" fill="#4A473F">Unix 域套接字</text>
  <text x="385" y="378" font-size="10" fill="#4A473F" text-anchor="middle">字节流或数据报</text>
  <text x="499" y="378" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle">看类型</text>
  <text x="673" y="378" font-size="10" fill="#4A473F" text-anchor="middle">任意进程，还能传 fd</text>
  <text x="882" y="378" font-size="10" fill="#4A473F" text-anchor="middle">2 次</text>
  <text x="1070" y="378" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle">能，和网络代码同一套</text>

  <!-- R8 -->
  <rect x="76" y="388" width="250" height="30" fill="#F5F4EE" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="330" y="388" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="444" y="388" width="110" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="558" y="388" width="230" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="792" y="388" width="180" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="976" y="388" width="188" height="30" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="88" y="408" font-size="10.5" fill="#4A473F">信号量 / eventfd</text>
  <text x="385" y="408" font-size="10" fill="#4A473F" text-anchor="middle">不传数据</text>
  <text x="499" y="408" font-size="10" fill="#6B675C" text-anchor="middle">不适用</text>
  <text x="673" y="408" font-size="10" fill="#4A473F" text-anchor="middle">任意进程</text>
  <text x="882" y="408" font-size="10" fill="#6B675C" text-anchor="middle">不适用</text>
  <text x="1070" y="408" font-size="10" fill="#4A473F" text-anchor="middle">eventfd 能，semget 不能</text>

  <!-- ============ Panel B ============ -->
  <rect x="56" y="448" width="552" height="230" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="72" y="476" font-size="13" font-weight="700" fill="#4A473F">B · 数据要过几次手</text>

  <rect x="88" y="492" width="120" height="46" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="148" y="512" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">进程 A</text>
  <text x="148" y="528" font-size="9.5" fill="#2C4460" text-anchor="middle">用户态缓冲区</text>
  <rect x="250" y="492" width="140" height="46" rx="6" fill="#EFE7DA" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="320" y="512" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">内核缓冲区</text>
  <text x="320" y="528" font-size="9.5" fill="#6B4E28" text-anchor="middle">管道 / 队列 / socket</text>
  <rect x="432" y="492" width="120" height="46" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="492" y="512" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">进程 B</text>
  <text x="492" y="528" font-size="9.5" fill="#2C4460" text-anchor="middle">用户态缓冲区</text>
  <line x1="208" y1="515" x2="248" y2="515" stroke="#5A564B" stroke-width="1.5" marker-end="url(#b1)"/>
  <line x1="390" y1="515" x2="430" y2="515" stroke="#5A564B" stroke-width="1.5" marker-end="url(#b1)"/>
  <text x="228" y="486" font-size="9" fill="#6B675C" text-anchor="middle">拷贝 1</text>
  <text x="410" y="486" font-size="9" fill="#6B675C" text-anchor="middle">拷贝 2</text>
  <text x="88" y="556" font-size="10" fill="#4A473F">每条数据两次 CPU 拷贝，加上至少两次系统调用。</text>

  <rect x="88" y="586" width="120" height="46" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="148" y="606" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">进程 A</text>
  <text x="148" y="622" font-size="9.5" fill="#24473F" text-anchor="middle">虚拟地址 0x7f..a000</text>
  <rect x="250" y="586" width="140" height="46" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="320" y="606" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">同一批物理页帧</text>
  <text x="320" y="622" font-size="9.5" fill="#733428" text-anchor="middle">映射建好就不再进内核</text>
  <rect x="432" y="586" width="120" height="46" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="492" y="606" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">进程 B</text>
  <text x="492" y="622" font-size="9.5" fill="#24473F" text-anchor="middle">虚拟地址 0x7f..b000</text>
  <line x1="208" y1="609" x2="248" y2="609" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#b2)" marker-start="url(#b2)"/>
  <line x1="390" y1="609" x2="430" y2="609" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#b2)" marker-start="url(#b2)"/>
  <text x="88" y="652" font-size="10" fill="#4A473F">共享内存零次拷贝，代价是同步、通知都要自己搭。</text>

  <!-- ============ Panel C ============ -->
  <rect x="632" y="448" width="552" height="230" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="648" y="476" font-size="13" font-weight="700" fill="#4A473F">C · 三代接口怎么选</text>

  <rect x="648" y="490" width="520" height="56" rx="6" fill="#F6F0E4" stroke="#B07D2B" stroke-width="1.4"/>
  <text x="664" y="510" font-size="11" font-weight="700" fill="#6B4E28">第一代 System V：shmget / msgget / semget</text>
  <text x="664" y="528" font-size="9.5" fill="#6B4E28">句柄是 ipcid 不是 fd，进不了 epoll；靠 key 而不是路径寻址；</text>
  <text x="664" y="542" font-size="9.5" fill="#6B4E28">忘了 IPC_RMID 就一直留在内核里。课程和老代码里最常见。</text>

  <rect x="648" y="552" width="520" height="56" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="664" y="572" font-size="11" font-weight="700" fill="#2C4460">第二代 POSIX：shm_open / mq_open / sem_open</text>
  <text x="664" y="590" font-size="9.5" fill="#2C4460">句柄是 fd 或类 fd，用文件权限和路径管理，在 /dev/shm 下看得见，</text>
  <text x="664" y="604" font-size="9.5" fill="#2C4460">unlink 语义清晰。新写 System V 风格的代码时优先换成它。</text>

  <rect x="648" y="614" width="520" height="56" rx="6" fill="#E9F1EC" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="664" y="634" font-size="11" font-weight="700" fill="#24473F">第三代 Unix 域套接字 + eventfd / memfd</text>
  <text x="664" y="652" font-size="9.5" fill="#24473F">今天本机 IPC 的默认答案：能用 SCM_RIGHTS 把 fd 直接递给对端，</text>
  <text x="664" y="666" font-size="9.5" fill="#24473F">天然进 epoll，和网络代码共用同一套读写逻辑。</text>

  <text x="72" y="710" font-size="11" fill="#6B675C">两次拷贝在今天并不贵：一条 4 KB 消息走管道大约几微秒。真正需要共享内存的是 GB 级吞吐，或者拷贝次数乘上频率之后才显出来的场景。</text>
</svg>
