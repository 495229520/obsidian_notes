<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" role="img" aria-label="NAT 的映射行为与过滤行为对照" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>NAT 的两套行为：映射决定对端该打哪个地址，过滤决定这个包进不进得来</title>
  <desc>上半部分列出三种映射行为 EIM、ADM、APDM，用同一个 socket 发往三个不同目标时 NAT 分配的公网端口来区分；下半部分列出三种过滤行为 EIF、ADF、APDF，用三种回包来源是否放行来区分；底部给出三种组合下裸打洞的可行性。</desc>

  <rect x="0" y="0" width="1240" height="720" fill="rgb(245, 244, 237)"/>

  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">映射与过滤：NAT 其实在管两件不同的事</text>
  <text x="48" y="78" font-size="13" fill="#6B675C">地址交换成功不等于能直连。映射决定"对端该打哪个地址"，过滤决定"这个包进不进得来"</text>

  <!-- ============ A 映射 ============ -->
  <text x="48" y="112" font-size="14" font-weight="700" fill="#2B2A26">A · 映射（Mapping）：我在公网上是哪个端口</text>
  <text x="48" y="134" font-size="11.5" fill="#6B675C">同一个 socket S₀ 依次发往三个目标，看 NAT 给它分配的公网端口是不是同一个</text>

  <!-- A1 EIM -->
  <rect x="48" y="146" width="344" height="184" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="58" y="156" width="324" height="26" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="220" y="174" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">EIM · 端点无关映射</text>
  <text x="70" y="200" font-size="11" fill="#6B675C">目标怎么换，公网端口不变</text>
  <rect x="58" y="210" width="324" height="22" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="70" y="225" font-size="10.5" font-weight="700" fill="#4A473F">发往的目标</text>
  <text x="319" y="225" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">公网端口</text>
  <rect x="58" y="232" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="70" y="247" font-size="11" fill="#2B2A26">1.1.1.1:80</text>
  <rect x="258" y="234" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="319" y="247" font-size="10.5" fill="#24473F" text-anchor="middle">:62000</text>
  <rect x="58" y="254" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="70" y="269" font-size="11" fill="#2B2A26">1.1.1.1:90　同 IP 换端口</text>
  <rect x="258" y="256" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="319" y="269" font-size="10.5" fill="#24473F" text-anchor="middle">:62000</text>
  <rect x="58" y="276" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="70" y="291" font-size="11" fill="#2B2A26">2.2.2.2:80　换 IP</text>
  <rect x="258" y="278" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="319" y="291" font-size="10.5" fill="#24473F" text-anchor="middle">:62000</text>
  <rect x="58" y="300" width="324" height="24" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="220" y="316" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">S 看到的地址一直有效，最好打</text>

  <!-- A2 ADM -->
  <rect x="448" y="146" width="344" height="184" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="458" y="156" width="324" height="26" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="620" y="174" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">ADM · 地址相关映射</text>
  <text x="470" y="200" font-size="11" fill="#6B675C">目标 IP 一变，公网端口跟着变</text>
  <rect x="458" y="210" width="324" height="22" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="470" y="225" font-size="10.5" font-weight="700" fill="#4A473F">发往的目标</text>
  <text x="719" y="225" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">公网端口</text>
  <rect x="458" y="232" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="470" y="247" font-size="11" fill="#2B2A26">1.1.1.1:80</text>
  <rect x="658" y="234" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="719" y="247" font-size="10.5" fill="#24473F" text-anchor="middle">:62000</text>
  <rect x="458" y="254" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="470" y="269" font-size="11" fill="#2B2A26">1.1.1.1:90　同 IP 换端口</text>
  <rect x="658" y="256" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="719" y="269" font-size="10.5" fill="#24473F" text-anchor="middle">:62000</text>
  <rect x="458" y="276" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="470" y="291" font-size="11" fill="#2B2A26">2.2.2.2:80　换 IP</text>
  <rect x="658" y="278" width="122" height="18" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="719" y="291" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">:63100　变了</text>
  <rect x="458" y="300" width="324" height="24" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="620" y="316" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">S 看到的端口未必能用来找对端</text>

  <!-- A3 APDM -->
  <rect x="848" y="146" width="344" height="184" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="858" y="156" width="324" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1020" y="174" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">APDM · 地址端口相关映射</text>
  <text x="870" y="200" font-size="11" fill="#6B675C">IP 或端口任一变，公网端口就变</text>
  <rect x="858" y="210" width="324" height="22" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="870" y="225" font-size="10.5" font-weight="700" fill="#4A473F">发往的目标</text>
  <text x="1119" y="225" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">公网端口</text>
  <rect x="858" y="232" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="870" y="247" font-size="11" fill="#2B2A26">1.1.1.1:80</text>
  <rect x="1058" y="234" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="1119" y="247" font-size="10.5" fill="#24473F" text-anchor="middle">:62000</text>
  <rect x="858" y="254" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="870" y="269" font-size="11" fill="#2B2A26">1.1.1.1:90　同 IP 换端口</text>
  <rect x="1058" y="256" width="122" height="18" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="1119" y="269" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">:63100　变了</text>
  <rect x="858" y="276" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="870" y="291" font-size="11" fill="#2B2A26">2.2.2.2:80　换 IP</text>
  <rect x="1058" y="278" width="122" height="18" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="1119" y="291" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">:64200　变了</text>
  <rect x="858" y="300" width="324" height="24" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1020" y="316" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">即对称 NAT，裸打洞基本失败</text>

  <!-- ============ B 过滤 ============ -->
  <text x="48" y="362" font-size="14" font-weight="700" fill="#2B2A26">B · 过滤（Filtering）：谁的包能从公网进来</text>
  <text x="48" y="384" font-size="11.5" fill="#6B675C">前提：A 只向 1.1.1.1:80 发过包。此刻从公网回来三种包，看 NAT 放不放行</text>

  <!-- B1 EIF -->
  <rect x="48" y="396" width="344" height="184" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="58" y="406" width="324" height="26" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="220" y="424" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">EIF · 端点无关过滤</text>
  <text x="70" y="450" font-size="11" fill="#6B675C">只要向外发过包，谁都能回</text>
  <rect x="58" y="460" width="324" height="22" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="70" y="475" font-size="10.5" font-weight="700" fill="#4A473F">回包的来源</text>
  <text x="319" y="475" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">NAT 的处理</text>
  <rect x="58" y="482" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="70" y="497" font-size="11" fill="#2B2A26">1.1.1.1:80　联系过</text>
  <rect x="258" y="484" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="319" y="497" font-size="10.5" fill="#24473F" text-anchor="middle">放行</text>
  <rect x="58" y="504" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="70" y="519" font-size="11" fill="#2B2A26">1.1.1.1:90　同 IP 别的口</text>
  <rect x="258" y="506" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="319" y="519" font-size="10.5" fill="#24473F" text-anchor="middle">放行</text>
  <rect x="58" y="526" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="70" y="541" font-size="11" fill="#2B2A26">3.3.3.3:99　完全陌生</text>
  <rect x="258" y="528" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="319" y="541" font-size="10.5" fill="#24473F" text-anchor="middle">放行</text>
  <rect x="58" y="550" width="324" height="24" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="220" y="566" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">最宽松，一方先发就够了</text>

  <!-- B2 ADF -->
  <rect x="448" y="396" width="344" height="184" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="458" y="406" width="324" height="26" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="620" y="424" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">ADF · 地址相关过滤</text>
  <text x="470" y="450" font-size="11" fill="#6B675C">只认联系过的那个 IP</text>
  <rect x="458" y="460" width="324" height="22" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="470" y="475" font-size="10.5" font-weight="700" fill="#4A473F">回包的来源</text>
  <text x="719" y="475" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">NAT 的处理</text>
  <rect x="458" y="482" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="470" y="497" font-size="11" fill="#2B2A26">1.1.1.1:80　联系过</text>
  <rect x="658" y="484" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="719" y="497" font-size="10.5" fill="#24473F" text-anchor="middle">放行</text>
  <rect x="458" y="504" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="470" y="519" font-size="11" fill="#2B2A26">1.1.1.1:90　同 IP 别的口</text>
  <rect x="658" y="506" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="719" y="519" font-size="10.5" fill="#24473F" text-anchor="middle">放行</text>
  <rect x="458" y="526" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="470" y="541" font-size="11" fill="#2B2A26">3.3.3.3:99　完全陌生</text>
  <rect x="658" y="528" width="122" height="18" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="719" y="541" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">丢弃</text>
  <rect x="458" y="550" width="324" height="24" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="620" y="566" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">IP 对上就行，端口可以不同</text>

  <!-- B3 APDF -->
  <rect x="848" y="396" width="344" height="184" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="858" y="406" width="324" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1020" y="424" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">APDF · 地址端口相关过滤</text>
  <text x="870" y="450" font-size="11" fill="#6B675C">只认精确的那个 IP:port</text>
  <rect x="858" y="460" width="324" height="22" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="870" y="475" font-size="10.5" font-weight="700" fill="#4A473F">回包的来源</text>
  <text x="1119" y="475" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">NAT 的处理</text>
  <rect x="858" y="482" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="870" y="497" font-size="11" fill="#2B2A26">1.1.1.1:80　联系过</text>
  <rect x="1058" y="484" width="122" height="18" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="1119" y="497" font-size="10.5" fill="#24473F" text-anchor="middle">放行</text>
  <rect x="858" y="504" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="870" y="519" font-size="11" fill="#2B2A26">1.1.1.1:90　同 IP 别的口</text>
  <rect x="1058" y="506" width="122" height="18" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="1119" y="519" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">丢弃</text>
  <rect x="858" y="526" width="324" height="22" rx="4" fill="#FBFBF6" stroke="#E4E1D6" stroke-width="1"/>
  <text x="870" y="541" font-size="11" fill="#2B2A26">3.3.3.3:99　完全陌生</text>
  <rect x="1058" y="528" width="122" height="18" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="1119" y="541" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">丢弃</text>
  <rect x="858" y="550" width="324" height="24" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1020" y="566" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">必须双方互发，才认得对方</text>

  <!-- ============ C 组合 ============ -->
  <text x="48" y="612" font-size="14" font-weight="700" fill="#2B2A26">C · 两者组合起来，才决定这次能不能裸打洞</text>

  <rect x="48" y="624" width="368" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="66" y="644" font-size="12" font-weight="700" fill="#24473F">EIM ＋ EIF / ADF</text>
  <text x="66" y="664" font-size="11" fill="#24473F">地址稳定、过滤宽松，一打就通</text>

  <rect x="436" y="624" width="368" height="48" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="454" y="644" font-size="12" font-weight="700" fill="#6B4E28">EIM ＋ APDF</text>
  <text x="454" y="664" font-size="11" fill="#6B4E28">地址稳但门严，靠双方同时连发撑开</text>

  <rect x="824" y="624" width="368" height="48" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="842" y="644" font-size="12" font-weight="700" fill="#733428">任一侧 APDM（对称 NAT）</text>
  <text x="842" y="664" font-size="11" fill="#733428">端口不可预测，直接安排 TURN 兜底</text>

  <text x="48" y="702" font-size="12" fill="#6B675C">先判映射决定"该打哪个地址"，再判过滤决定"这个包进不进得来"，两件事分开看才不会误判</text>
</svg>
