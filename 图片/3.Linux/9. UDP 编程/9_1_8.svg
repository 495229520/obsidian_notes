<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" role="img" aria-label="典型 UDP 服务端工程结构" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统：底色 rgb(245,244,237)；绿/socket #DCE9E3/#2F6B5E；蓝/RX #E3EAF4/#3D5A80；琥珀/队列 #EFE7DA/#8A6A3A；中性/Worker #F1EFE8/#8A8574；淡紫/TX+会话表 #EDEAF3/#6B5B95 -->
  <title>典型 UDP 服务端工程结构：收包 + 业务 + 发包三线程，队列解耦</title>
  <desc>左侧 UDP Socket 为唯一进出端点；上行（蓝）入向收包：Socket → RX 线程 recvfrom → 接收队列 → Worker Pool 业务处理；下行（绿）出向发包：Worker Pool 产出 → 发送队列 → TX 线程 sendto → 回到 Socket；Worker 下方挂会话表；底部条带强调可靠性、顺序、保活、流控都需应用层自补。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="500" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">典型 UDP 服务端工程结构：收包 + 业务 + 发包三线程，队列解耦</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">协议层很薄：sendto / recvfrom 只负责进出；可靠性、顺序、保活、流控全在应用层线程与队列里自己补</text>

  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">入向收包（蓝）与出向发包（绿）双流 · 队列解耦线程</text>

  <!-- ============ UDP Socket（唯一端点，绿，贯穿两行） ============ -->
  <rect x="48" y="132" width="190" height="248" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="143" y="210" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">UDP Socket</text>
  <text x="143" y="238" font-size="11" fill="#24473F" text-anchor="middle">bind 固定端口</text>
  <text x="143" y="262" font-size="11" fill="#24473F" text-anchor="middle">sendto / recvfrom</text>
  <text x="143" y="286" font-size="11" fill="#24473F" text-anchor="middle">进出唯一端点</text>

  <!-- ============ 上行：入向（收包） ============ -->
  <rect x="280" y="132" width="200" height="80" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="380" y="158" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">RX Thread</text>
  <text x="380" y="182" font-size="10.5" fill="#2C4460" text-anchor="middle">recvfrom() 取包</text>
  <text x="380" y="202" font-size="10.5" fill="#2C4460" text-anchor="middle">解析来源地址</text>

  <rect x="522" y="132" width="200" height="80" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="622" y="158" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">接收队列</text>
  <text x="622" y="182" font-size="10.5" fill="#6B4E28" text-anchor="middle">消息体 + 来源端点</text>
  <text x="622" y="202" font-size="10.5" fill="#6B4E28" text-anchor="middle">线程间解耦</text>

  <rect x="764" y="132" width="428" height="80" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.5"/>
  <text x="978" y="158" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">Worker Pool · 业务处理</text>
  <text x="978" y="182" font-size="10.5" fill="#4A473F" text-anchor="middle">解析 / 校验 / 去重 / 顺序控制</text>
  <text x="978" y="202" font-size="10.5" fill="#4A473F" text-anchor="middle">必要时补 ACK / 超时重传</text>

  <!-- 上行箭头 -->
  <line x1="238" y1="172" x2="280" y2="172" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrb)"/>
  <text x="259" y="162" font-size="10.5" font-weight="700" fill="#3D5A80" text-anchor="middle">入向</text>
  <line x1="480" y1="172" x2="522" y2="172" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <line x1="722" y1="172" x2="764" y2="172" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <!-- ============ 下行：出向（发包） ============ -->
  <rect x="764" y="298" width="200" height="80" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="864" y="324" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">发送队列</text>
  <text x="864" y="348" font-size="10.5" fill="#6B4E28" text-anchor="middle">目标端点 + 响应体</text>

  <rect x="522" y="298" width="200" height="80" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="622" y="324" font-size="13" font-weight="700" fill="#54457A" text-anchor="middle">TX Thread</text>
  <text x="622" y="348" font-size="10.5" fill="#54457A" text-anchor="middle">sendto() 批量发包</text>

  <rect x="1004" y="298" width="188" height="80" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="1098" y="324" font-size="13" font-weight="700" fill="#54457A" text-anchor="middle">会话表</text>
  <text x="1098" y="348" font-size="10.5" fill="#54457A" text-anchor="middle">client_ip:port</text>
  <text x="1098" y="368" font-size="10.5" fill="#54457A" text-anchor="middle">最近序号 / 心跳</text>

  <!-- 下行箭头（回环到 socket） -->
  <path d="M978 212 V250 H864 V294" fill="none" stroke="#5A564B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrn)"/>
  <text x="910" y="242" font-size="10.5" fill="#5A564B" text-anchor="middle">业务产出</text>
  <line x1="1098" y1="212" x2="1098" y2="298" stroke="#5A564B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrn)"/>
  <text x="1106" y="250" font-size="10.5" fill="#5A564B">读 / 写</text>

  <line x1="764" y1="338" x2="722" y2="338" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrg)"/>
  <line x1="522" y1="338" x2="238" y2="338" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text x="380" y="328" font-size="10.5" font-weight="700" fill="#2F6B5E" text-anchor="middle">出向 · 回环到 Socket</text>

  <!-- 底部条带 -->
  <rect x="48" y="430" width="1144" height="42" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="448" font-size="12" font-weight="700" fill="#4A473F">UDP 协议很薄，工程不简单</text>
  <text x="220" y="448" font-size="11" fill="#6B675C">可靠性 / 顺序 / 去重 / 保活 / 流控 —— 全要在应用层线程与队列里自己补</text>
  <text x="68" y="466" font-size="10.5" fill="#6B675C">真正复杂的不在「怎么发一个包」，而在「补哪些机制、放在哪个线程」</text>
</svg>
