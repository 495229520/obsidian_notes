<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" role="img" aria-label="NAT STUN ICE TURN 的分工与 ICE 候选阶梯" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>NAT 制造问题，STUN 照镜子，ICE 试路，TURN 兜底；ICE 按 host、srflx、relay 三级候选逐级降级</title>
  <desc>左侧四行分别说明 NAT、STUN、ICE、TURN 在穿透中承担的角色；右侧是 ICE 的三级候选阶梯，从本机地址到 STUN 反射地址再到 TURN 中继地址，每一级失败后降到下一级。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="rgb(245, 244, 237)"/>

  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">NAT 制造问题，STUN 照镜子，ICE 试路，TURN 兜底</text>
  <text x="48" y="78" font-size="13" fill="#6B675C">四个名词不是一层层的替代关系，而是一条流水线上四个不同的岗位</text>

  <!-- A 区 -->
  <text x="48" y="118" font-size="14" font-weight="700" fill="#2B2A26">A · 各管一段</text>

  <rect x="48" y="134" width="544" height="68" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="62" y="148" width="98" height="30" rx="5" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="111" y="168" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">NAT</text>
  <text x="180" y="164" font-size="12" font-weight="700" fill="#2B2A26">制造问题的那一层</text>
  <text x="180" y="186" font-size="11" fill="#6B675C">内网端点在公网上没有可直接寻址的身份</text>

  <rect x="48" y="214" width="544" height="68" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="62" y="228" width="98" height="30" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="111" y="248" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">STUN</text>
  <text x="180" y="244" font-size="12" font-weight="700" fill="#2B2A26">照镜子</text>
  <text x="180" y="266" font-size="11" fill="#6B675C">告诉你此刻对外暴露的是哪个 IP:port</text>

  <rect x="48" y="294" width="544" height="68" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="62" y="308" width="98" height="30" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="111" y="328" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">ICE</text>
  <text x="180" y="324" font-size="12" font-weight="700" fill="#2B2A26">试路</text>
  <text x="180" y="346" font-size="11" fill="#6B675C">收集候选、排优先级、逐条做连通性检查</text>

  <rect x="48" y="374" width="544" height="68" rx="7" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="62" y="388" width="98" height="30" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="111" y="408" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">TURN</text>
  <text x="180" y="404" font-size="12" font-weight="700" fill="#2B2A26">兜底</text>
  <text x="180" y="426" font-size="11" fill="#6B675C">直连失败时，把数据改成经服务器转发</text>

  <!-- B 区 -->
  <text x="620" y="118" font-size="14" font-weight="700" fill="#2B2A26">B · ICE 的候选阶梯：先试最好的，通不了就降一级</text>

  <rect x="620" y="134" width="580" height="84" rx="7" fill="#F2F7F4" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="638" y="160" font-size="12.5" font-weight="700" fill="#24473F">① host · 本机的 LAN 地址</text>
  <text x="638" y="182" font-size="11" fill="#24473F">同网段直连，零额外设施，延迟最低</text>
  <text x="638" y="204" font-size="11" fill="#6B675C">跨了网段就完全用不上</text>
  <rect x="1044" y="146" width="140" height="24" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="1114" y="163" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">优先级最高</text>

  <line x1="700" y1="220" x2="700" y2="242" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="716" y="238" font-size="10.5" fill="#6B675C">不通，降一级</text>

  <rect x="620" y="246" width="580" height="84" rx="7" fill="#F6F8FB" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="638" y="272" font-size="12.5" font-weight="700" fill="#2C4460">② srflx · STUN 照出来的公网端点</text>
  <text x="638" y="294" font-size="11" fill="#2C4460">打洞的主力，跨 NAT 建立点对点直连</text>
  <text x="638" y="316" font-size="11" fill="#6B675C">对称 NAT 下公网端口不可预测，会失败</text>
  <rect x="1044" y="258" width="140" height="24" rx="5" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="1114" y="275" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">日常主路径</text>

  <line x1="700" y1="332" x2="700" y2="354" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="716" y="350" font-size="10.5" fill="#6B675C">还是不通，再降一级</text>

  <rect x="620" y="358" width="580" height="84" rx="7" fill="#FCF8F2" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="638" y="384" font-size="12.5" font-weight="700" fill="#6B4E28">③ relay · TURN 分配的中继地址</text>
  <text x="638" y="406" font-size="11" fill="#6B4E28">一定能通，代价是延迟和服务器带宽</text>
  <text x="638" y="428" font-size="11" fill="#6B675C">只在前两级都失败时才启用</text>
  <rect x="1044" y="370" width="140" height="24" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="1114" y="387" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">最后兜底</text>

  <!-- 底部 -->
  <rect x="40" y="462" width="1160" height="42" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="620" y="488" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">ICE 把候选并行试一遍，用成功且优先级最高的那条；WebRTC 就建在这套框架上</text>

  <text x="48" y="534" font-size="12" fill="#6B675C">两个常见误会：STUN 不等于打洞，它只负责发现公网映射地址；地址交换完成也不等于流程结束</text>
</svg>
