<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" role="img" aria-label="NAT 映射超时与 keepalive" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>洞会自己关上：映射空闲超时与 keepalive 心跳的对照时间轴</title>
  <desc>两条同起点的时间轴。上轴没有保活，通信停止后映射在空闲超时点被回收，随后的数据包被丢弃并需要重新打洞；下轴每 20 秒发一次心跳，空闲计时反复归零，映射一直存活。底部列出选取心跳周期的依据。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="470" fill="rgb(245, 244, 237)"/>

  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">洞打通之后还会自己关上</text>
  <text x="48" y="78" font-size="13" fill="#6B675C">NAT 映射是一条有空闲计时器的软状态；没有流量喂它，路由器就把这条记录回收掉</text>

  <!-- 上轴：无保活 -->
  <text x="48" y="120" font-size="14" font-weight="700" fill="#733428">A · 没有保活：静默一段时间后映射被回收</text>

  <line x1="120" y1="176" x2="1180" y2="176" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="120" y="164" width="300" height="24" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="270" y="181" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">有数据往来，映射被不断刷新</text>
  <rect x="420" y="164" width="340" height="24" rx="4" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="590" y="181" font-size="11" fill="#4A473F" text-anchor="middle">应用静默，空闲计时器在走</text>
  <rect x="760" y="164" width="420" height="24" rx="4" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="970" y="181" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">映射已回收，对端发来的包一律被丢</text>

  <line x1="760" y1="152" x2="760" y2="200" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="760" y="146" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">空闲超时点</text>
  <text x="120" y="214" font-size="10.5" fill="#6B675C">t = 0</text>
  <text x="760" y="214" font-size="10.5" fill="#733428" text-anchor="middle">常见 30 秒 ~ 数分钟，路由器之间差异很大</text>
  <rect x="820" y="222" width="360" height="26" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1000" y="240" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">只能回到引介服务器，重新打一次洞</text>

  <!-- 下轴：有保活 -->
  <text x="48" y="290" font-size="14" font-weight="700" fill="#24473F">B · 每 20 秒一个心跳：空闲计时反复归零</text>

  <line x1="120" y1="346" x2="1180" y2="346" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="120" y="334" width="1060" height="24" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>

  <g fill="#2F6B5E">
    <circle cx="180" cy="346" r="5"/><circle cx="300" cy="346" r="5"/><circle cx="420" cy="346" r="5"/>
    <circle cx="540" cy="346" r="5"/><circle cx="660" cy="346" r="5"/><circle cx="780" cy="346" r="5"/>
    <circle cx="900" cy="346" r="5"/><circle cx="1020" cy="346" r="5"/><circle cx="1140" cy="346" r="5"/>
  </g>
  <text x="180" y="322" font-size="10.5" fill="#24473F" text-anchor="middle">心跳</text>
  <text x="660" y="322" font-size="10.5" fill="#24473F" text-anchor="middle">心跳</text>
  <text x="1140" y="322" font-size="10.5" fill="#24473F" text-anchor="middle">心跳</text>
  <text x="240" y="374" font-size="10.5" fill="#6B675C" text-anchor="middle">20s</text>
  <text x="720" y="374" font-size="10.5" fill="#6B675C" text-anchor="middle">20s</text>
  <text x="1180" y="374" font-size="11" font-weight="700" fill="#24473F" text-anchor="end">映射一直存活，直连随时可用</text>

  <!-- 底部三格 -->
  <rect x="40" y="396" width="374" height="48" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="58" y="416" font-size="12" font-weight="700" fill="#6B4E28">周期怎么定</text>
  <text x="58" y="436" font-size="11" fill="#6B4E28">按最短的那一档超时取一半，十几到二十几秒</text>

  <rect x="434" y="396" width="374" height="48" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="452" y="416" font-size="12" font-weight="700" fill="#2C4460">走哪条路</text>
  <text x="452" y="436" font-size="11" fill="#2C4460">必须用打通的那个 socket 和对端端点</text>

  <rect x="828" y="396" width="372" height="48" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="846" y="416" font-size="12" font-weight="700" fill="#733428">还会断在哪</text>
  <text x="846" y="436" font-size="11" fill="#733428">进程休眠、切网、断网抖动，都得能重打</text>
</svg>
