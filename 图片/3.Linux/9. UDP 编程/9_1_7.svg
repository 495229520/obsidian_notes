<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 430" role="img" aria-label="UDP 报文格式" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统：底色 rgb(245,244,237)；蓝/信息 #E3EAF4/#3D5A80；琥珀/强调 8 字节 #EFE7DA/#8A6A3A；绿/Payload #DCE9E3/#2F6B5E；中性 #F1EFE8/#D8D5C8 -->
  <title>UDP 报文格式：头部固定 8 字节（4 × 16 bit），其余全是应用数据</title>
  <desc>UDP 头由源端口、目标端口、长度、校验和四个等宽 16-bit 字段组成，共固定 8 字节；其后是变长的应用数据。底部区分 UDP 长度字段的理论上限与 IPv4 无选项时的单报上限。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="430" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">UDP 报文格式：头部固定 8 字节（4 × 16 bit），其余全是应用数据</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">头小 → 开销低；但这 8 字节不含序号，也解释不了「UDP 为什么不可靠」</text>

  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">A · UDP 头部（8 字节）</text>

  <!-- 头部容器：标题行和字段行分开，避免边框压字 -->
  <rect x="48" y="124" width="1136" height="112" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="68" y="148" font-size="12" font-weight="700" fill="#6B4E28">UDP 头部 · 固定 8 字节</text>
  <rect x="1010" y="133" width="150" height="24" rx="12" fill="#FBFBF6" stroke="#8A6A3A" stroke-width="1"/>
  <text x="1085" y="149" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">4 × 16 bit = 8 B</text>

  <rect x="72" y="166" width="256" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="200" y="187" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">源端口</text>
  <text x="200" y="207" font-size="10.5" fill="#2C4460" text-anchor="middle">16 bit</text>

  <rect x="352" y="166" width="256" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="480" y="187" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">目标端口</text>
  <text x="480" y="207" font-size="10.5" fill="#2C4460" text-anchor="middle">16 bit</text>

  <rect x="632" y="166" width="256" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="760" y="187" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">长度</text>
  <text x="760" y="207" font-size="10.5" fill="#2C4460" text-anchor="middle">16 bit · 头部 + 数据</text>

  <rect x="912" y="166" width="248" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="1036" y="187" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">校验和</text>
  <text x="1036" y="207" font-size="10.5" fill="#2C4460" text-anchor="middle">16 bit</text>

  <text x="48" y="268" font-size="13" font-weight="700" fill="#4A473F">B · Payload（应用层数据）</text>

  <!-- Payload 容器 -->
  <rect x="48" y="280" width="1136" height="64" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="68" y="306" font-size="12" font-weight="700" fill="#24473F">Payload · 变长，受 IP 报文上限与路径 MTU 限制</text>
  <text x="68" y="329" font-size="10.5" fill="#24473F">一次 sendto() 的内容 = 一个独立数据报；recvfrom() 保留报文边界</text>

  <!-- 长度 → Payload 的包含关系（虚线箭头） -->
  <line x1="760" y1="218" x2="760" y2="276" stroke="#5A564B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrn)"/>
  <text x="774" y="252" font-size="10.5" font-weight="700" fill="#5A564B">包含关系</text>

  <!-- 底部条带 -->
  <rect x="48" y="362" width="1136" height="50" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="382" font-size="11.5" font-weight="700" fill="#4A473F">上限要分清</text>
  <text x="160" y="382" font-size="10.5" fill="#6B675C">UDP 长度字段：65535 − 8 = 65527 B 数据；IPv4 无选项：65535 − 20 − 8 = 65507 B 数据</text>
  <text x="68" y="401" font-size="10.5" fill="#6B675C">校验和覆盖「伪头 + UDP 头 + 数据」；超过路径 MTU 可能触发 IP 分片，工程上通常应避免大包</text>
</svg>
