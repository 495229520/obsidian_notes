<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" role="img" aria-label="NAT 为什么让两端互相打不进来" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>NAT 之下的初始态：两侧映射表都是空的，谁主动打进来都会被丢</title>
  <desc>左右各一台内网主机与它的 NAT，中间是公网。两条红色虚线表示双方主动打向对方公网地址的包，都在对端 NAT 处被丢弃。底部三行表列出 NAT 对出向包、有映射入向包、无映射入向包的处理。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="500" fill="rgb(245, 244, 237)"/>

  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">NAT 之下的初始态：两边都打不进对方</text>
  <text x="48" y="78" font-size="13" fill="#6B675C">难点从来不是"不知道对方 IP"，而是对端 NAT 的映射表里没有这条记录，包到门口就被丢掉</text>

  <!-- 公网 -->
  <ellipse cx="620" cy="196" rx="86" ry="40" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="620" y="192" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">公网</text>
  <text x="620" y="211" font-size="10.5" fill="#6B675C" text-anchor="middle">无状态转发</text>

  <!-- A 侧 -->
  <text x="60" y="122" font-size="12" font-weight="700" fill="#6B675C">私网 A</text>
  <rect x="48" y="160" width="164" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="130" y="186" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">主机 A</text>
  <text x="130" y="208" font-size="11.5" fill="#24473F" text-anchor="middle">192.168.1.5:4000</text>

  <rect x="258" y="146" width="192" height="100" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="354" y="172" font-size="13" font-weight="700" fill="#4A3E70" text-anchor="middle">NAT A</text>
  <text x="354" y="193" font-size="11.5" fill="#4A3E70" text-anchor="middle">公网 1.2.3.4</text>
  <rect x="274" y="204" width="160" height="28" rx="5" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="354" y="223" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">映射表：空</text>

  <!-- B 侧 -->
  <text x="1122" y="122" font-size="12" font-weight="700" fill="#6B675C">私网 B</text>
  <rect x="1028" y="160" width="164" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1110" y="186" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">主机 B</text>
  <text x="1110" y="208" font-size="11.5" fill="#24473F" text-anchor="middle">192.168.2.7:4000</text>

  <rect x="790" y="146" width="192" height="100" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="886" y="172" font-size="13" font-weight="700" fill="#4A3E70" text-anchor="middle">NAT B</text>
  <text x="886" y="193" font-size="11.5" fill="#4A3E70" text-anchor="middle">公网 5.6.7.8</text>
  <rect x="806" y="204" width="160" height="28" rx="5" fill="#FBFBF6" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="886" y="223" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">映射表：空</text>

  <!-- 链路 -->
  <line x1="212" y1="196" x2="252" y2="196" stroke="#5A564B" stroke-width="1.5"/>
  <line x1="450" y1="196" x2="530" y2="196" stroke="#5A564B" stroke-width="1.5"/>
  <line x1="710" y1="196" x2="784" y2="196" stroke="#5A564B" stroke-width="1.5"/>
  <line x1="982" y1="196" x2="1022" y2="196" stroke="#5A564B" stroke-width="1.5"/>

  <!-- 被拦的两个方向 -->
  <path d="M1028 292 H478" fill="none" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="760" y="282" font-size="11.5" fill="#733428" text-anchor="middle">B 主动打 1.2.3.4:50001</text>
  <line x1="446" y1="284" x2="466" y2="300" stroke="#A64B3C" stroke-width="2" stroke-linecap="round"/>
  <line x1="446" y1="300" x2="466" y2="284" stroke="#A64B3C" stroke-width="2" stroke-linecap="round"/>
  <text x="380" y="296" font-size="11" font-weight="700" fill="#733428" text-anchor="end">NAT A 丢弃</text>

  <path d="M212 340 H762" fill="none" stroke="#A64B3C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="480" y="330" font-size="11.5" fill="#733428" text-anchor="middle">A 主动打 5.6.7.8:50002</text>
  <line x1="774" y1="332" x2="794" y2="348" stroke="#A64B3C" stroke-width="2" stroke-linecap="round"/>
  <line x1="774" y1="348" x2="794" y2="332" stroke="#A64B3C" stroke-width="2" stroke-linecap="round"/>
  <text x="860" y="344" font-size="11" font-weight="700" fill="#733428">NAT B 丢弃</text>

  <!-- 规则表 -->
  <text x="48" y="392" font-size="14" font-weight="700" fill="#2B2A26">NAT 收到一个 UDP 包时只看一件事：映射表里有没有它</text>

  <rect x="48" y="406" width="300" height="28" rx="5" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.1"/>
  <rect x="348" y="406" width="330" height="28" rx="5" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.1"/>
  <rect x="678" y="406" width="514" height="28" rx="5" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.1"/>
  <text x="64" y="425" font-size="11.5" font-weight="700" fill="#4A473F">包的方向</text>
  <text x="364" y="425" font-size="11.5" font-weight="700" fill="#4A473F">映射表命中？</text>
  <text x="694" y="425" font-size="11.5" font-weight="700" fill="#4A473F">NAT 的处理</text>

  <rect x="48" y="436" width="300" height="26" rx="4" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.1"/>
  <rect x="348" y="436" width="330" height="26" rx="4" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="678" y="436" width="514" height="26" rx="4" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <text x="64" y="454" font-size="11.5" fill="#24473F">内网 → 公网（出向）</text>
  <text x="364" y="454" font-size="11.5" fill="#4A473F">没有就现建一条</text>
  <text x="694" y="454" font-size="11.5" fill="#4A473F">改写源地址后放行，映射从此存在</text>

  <rect x="48" y="464" width="300" height="26" rx="4" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <rect x="348" y="464" width="330" height="26" rx="4" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="678" y="464" width="514" height="26" rx="4" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <text x="64" y="482" font-size="11.5" fill="#2C4460">公网 → 内网（入向）</text>
  <text x="364" y="482" font-size="11.5" fill="#4A473F">命中 / 不命中</text>
  <text x="694" y="482" font-size="11.5" fill="#4A473F">命中按映射改写回内网；不命中直接丢弃</text>
</svg>
