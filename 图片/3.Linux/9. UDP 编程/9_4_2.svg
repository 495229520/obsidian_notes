<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" role="img" aria-label="UDP 打洞全流程泳道" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>UDP 打洞全流程：注册 → 交换端点 → 同时 PUNCH → 直连</title>
  <desc>五条泳道分别是 Peer A、NAT A、引介服务器 S、NAT B、Peer B。四个阶段依次展示注册并发现公网端点、引介服务器交叉交换端点、双方同 socket 连发 PUNCH 碰开 NAT（含初次丢包说明）、直连建立与保活。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <!-- 画布背景 -->
  <rect x="0" y="0" width="1240" height="780" fill="rgb(245, 244, 237)"/>

  <!-- 标题与核心准则 -->
  <text x="48" y="46" font-size="22" font-weight="700" fill="#2B2A26">打洞全流程：注册 → 交换端点 → 同时 PUNCH → 直连</text>
  <text x="48" y="72" font-size="13" fill="#6B675C">服务器只负责引介与观察端点；真正打通链路的，是双方复用同一 socket 几乎同时向外发包建立回流状态</text>

  <!-- 泳道表头 (y=96, h=36) -->
  <rect x="48" y="96" width="180" height="36" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="138" y="113" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">Peer A</text>
  <text x="138" y="126" font-size="10.5" fill="#5A6D85" text-anchor="middle">:50000（内网端点）</text>

  <rect x="258" y="96" width="180" height="36" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="348" y="113" font-size="13" font-weight="700" fill="#4A3E70" text-anchor="middle">NAT A</text>
  <text x="348" y="126" font-size="10.5" fill="#6E6288" text-anchor="middle">映射 1.2.3.4:50001</text>

  <rect x="500" y="96" width="240" height="36" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="620" y="113" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">引介服务器 S（公网）</text>
  <text x="620" y="126" font-size="10.5" fill="#8A6A3A" text-anchor="middle">203.0.113.10:40000</text>

  <rect x="802" y="96" width="180" height="36" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="892" y="113" font-size="13" font-weight="700" fill="#4A3E70" text-anchor="middle">NAT B</text>
  <text x="892" y="126" font-size="10.5" fill="#6E6288" text-anchor="middle">映射 5.6.7.8:50002</text>

  <rect x="1012" y="96" width="180" height="36" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="1102" y="113" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">Peer B</text>
  <text x="1102" y="126" font-size="10.5" fill="#5A6D85" text-anchor="middle">:50000（内网端点）</text>

  <!-- 泳道竖向分割虚线 -->
  <line x1="243" y1="138" x2="243" y2="720" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="470" y1="138" x2="470" y2="720" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="771" y1="138" x2="771" y2="720" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="997" y1="138" x2="997" y2="720" stroke="#D8D5C8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ==================== ① 注册与端点发现 ==================== -->
  <rect x="40" y="142" width="1160" height="142" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="52" y="150" width="158" height="24" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="131" y="166" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">① 注册与端点发现</text>

  <!-- A 发送 REG -->
  <rect x="52" y="184" width="176" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="140" y="201" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">socket S₀ 发送 REG</text>
  <text x="140" y="217" font-size="10" fill="#5A6D85" text-anchor="middle">目标 S: 203.0.113.10:40000</text>

  <line x1="228" y1="205" x2="258" y2="205" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="262" y="182" width="172" height="46" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="348" y="200" font-size="11" font-weight="700" fill="#4A3E70" text-anchor="middle">分配 NAT 映射并放行</text>
  <text x="348" y="218" font-size="10.5" fill="#6E6288" text-anchor="middle">:50000 ↔ 1.2.3.4:50001</text>

  <line x1="434" y1="205" x2="494" y2="205" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- 服务器 S 记录 -->
  <rect x="500" y="180" width="240" height="92" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="620" y="201" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">以 recvfrom 源地址为准</text>
  <text x="620" y="222" font-size="11" fill="#2C4460" text-anchor="middle">A_pub = 1.2.3.4:50001</text>
  <text x="620" y="242" font-size="11" fill="#2C4460" text-anchor="middle">B_pub = 5.6.7.8:50002</text>
  <text x="620" y="261" font-size="10" fill="#8A6A3A" text-anchor="middle">不采信客户端自报的私网地址</text>

  <!-- B 发送 REG -->
  <line x1="746" y1="246" x2="804" y2="246" stroke="#3D5A80" stroke-width="1.5" marker-start="url(#arrB)"/>

  <rect x="806" y="223" width="172" height="46" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="892" y="241" font-size="11" font-weight="700" fill="#4A3E70" text-anchor="middle">分配 NAT 映射并放行</text>
  <text x="892" y="259" font-size="10.5" fill="#6E6288" text-anchor="middle">:50000 ↔ 5.6.7.8:50002</text>

  <line x1="978" y1="246" x2="1008" y2="246" stroke="#3D5A80" stroke-width="1.5" marker-start="url(#arrB)"/>

  <rect x="1012" y="225" width="176" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1100" y="242" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">socket S₀ 发送 REG</text>
  <text x="1100" y="258" font-size="10" fill="#5A6D85" text-anchor="middle">目标 S: 203.0.113.10:40000</text>

  <!-- ==================== ② 交换公网端点 ==================== -->
  <rect x="40" y="294" width="1160" height="106" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="52" y="302" width="158" height="24" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="131" y="318" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">② 交换公网端点</text>

  <rect x="500" y="336" width="240" height="50" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="620" y="356" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">S 交叉下发对端端点</text>
  <text x="620" y="374" font-size="10.5" fill="#8A6A3A" text-anchor="middle">通知双方：立即开始向对端发包</text>

  <!-- 下发给 A（经过 NAT A 转发） -->
  <line x1="496" y1="358" x2="438" y2="358" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="262" y="338" width="172" height="46" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="348" y="356" font-size="11" font-weight="700" fill="#4A3E70" text-anchor="middle">命中先前映射规则</text>
  <text x="348" y="373" font-size="10" fill="#6E6288" text-anchor="middle">从公网口回流给 A</text>
  <line x1="258" y1="358" x2="232" y2="358" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="52" y="338" width="176" height="46" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="140" y="356" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">拿到 B_pub</text>
  <text x="140" y="374" font-size="10.5" fill="#2C4460" text-anchor="middle">5.6.7.8:50002</text>

  <!-- 下发给 B（经过 NAT B 转发） -->
  <line x1="744" y1="358" x2="802" y2="358" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="806" y="338" width="172" height="46" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="892" y="356" font-size="11" font-weight="700" fill="#4A3E70" text-anchor="middle">命中先前映射规则</text>
  <text x="892" y="373" font-size="10" fill="#6E6288" text-anchor="middle">从公网口回流给 B</text>
  <line x1="982" y1="358" x2="1008" y2="358" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="1012" y="338" width="176" height="46" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1100" y="356" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">拿到 A_pub</text>
  <text x="1100" y="374" font-size="10.5" fill="#2C4460" text-anchor="middle">1.2.3.4:50001</text>

  <!-- ==================== ③ 双端同时连发 PUNCH ==================== -->
  <rect x="40" y="410" width="1160" height="202" rx="8" fill="#FFFDF9" stroke="#B07D2B" stroke-width="1.2"/>
  <rect x="52" y="418" width="220" height="24" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="162" y="434" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">③ 双方连发 PUNCH（核心打洞）</text>

  <rect x="430" y="418" width="380" height="24" rx="5" fill="#FAEEDA" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="620" y="434" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">关键：继续复用 socket S₀！S 此时已退出主通信路径</text>

  <!-- 步骤 3.1: A 发出第一批 PUNCH，开启 NAT A 回流，但被 NAT B 拦截 -->
  <rect x="52" y="450" width="176" height="44" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="140" y="468" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">复用 S₀ 连发 PUNCH</text>
  <text x="140" y="484" font-size="10" fill="#5A6D85" text-anchor="middle">目标 B_pub（200ms 一包）</text>

  <line x1="228" y1="472" x2="258" y2="472" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="262" y="450" width="172" height="44" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="348" y="468" font-size="11" font-weight="700" fill="#4A3E70" text-anchor="middle">记下对端 5.6.7.8:50002</text>
  <text x="348" y="484" font-size="10.5" fill="#2F6B5E" text-anchor="middle">A 侧回流通道已开启 ✓</text>

  <!-- PUNCH A->B 飞行并在 NAT B 丢弃 -->
  <line x1="434" y1="472" x2="784" y2="472" stroke="#3D5A80" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="660" y="454" width="138" height="34" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="729" y="469" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">初次 PUNCH 被丢弃 ✕</text>
  <text x="729" y="483" font-size="10" fill="#A64B3C" text-anchor="middle">NAT B 尚无对 A 出向记录</text>

  <!-- 步骤 3.2: B 几乎同时发出 PUNCH，开启 NAT B 回流；且该包命中 NAT A 成功穿透 -->
  <rect x="1012" y="504" width="176" height="44" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1100" y="522" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">复用 S₀ 连发 PUNCH</text>
  <text x="1100" y="538" font-size="10" fill="#5A6D85" text-anchor="middle">目标 A_pub（200ms 一包）</text>

  <line x1="1008" y1="526" x2="982" y2="526" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>

  <rect x="806" y="504" width="172" height="44" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="892" y="522" font-size="11" font-weight="700" fill="#4A3E70" text-anchor="middle">记下对端 1.2.3.4:50001</text>
  <text x="892" y="538" font-size="10.5" fill="#2F6B5E" text-anchor="middle">B 侧回流通道也开启 ✓</text>

  <!-- PUNCH B->A 穿透 NAT A 并送达 Peer A -->
  <line x1="802" y1="526" x2="442" y2="526" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>

  <rect x="466" y="510" width="190" height="32" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="561" y="524" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">命中 NAT A 预留规则！放行</text>
  <text x="561" y="537" font-size="9.5" fill="#2F6B5E" text-anchor="middle">PUNCH 成功穿透 NAT A</text>

  <line x1="258" y1="526" x2="232" y2="526" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- 阶段 3 底部因果总结条（正文重点强调的红框机制） -->
  <rect x="258" y="566" width="724" height="34" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="620" y="581" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">核心机制：头几包互相被丢是正常现象，绝不是出错，千万不要停发！</text>
  <text x="620" y="595" font-size="10.5" fill="#A64B3C" text-anchor="middle">主动发包的真正作用是让本侧 NAT 先为对端建立放行状态；一旦两边都发出过包，回包即可穿透</text>

  <!-- ==================== ④ 双向直连建立 ==================== -->
  <rect x="40" y="622" width="1160" height="88" rx="8" fill="#F2F7F4" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="52" y="630" width="158" height="24" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="131" y="646" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">④ 双向直连建立</text>

  <rect x="52" y="658" width="176" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="140" y="675" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">Peer A（直连）</text>
  <text x="140" y="691" font-size="10" fill="#2F6B5E" text-anchor="middle">以实际收到的源端点通信</text>

  <line x1="232" y1="675" x2="258" y2="675" stroke="#2F6B5E" stroke-width="1.6"/>
  <line x1="258" y1="685" x2="232" y2="685" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>

  <rect x="262" y="658" width="172" height="42" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="348" y="675" font-size="11" font-weight="700" fill="#4A3E70" text-anchor="middle">NAT A 规则激活</text>
  <text x="348" y="691" font-size="10.5" fill="#6E6288" text-anchor="middle">双向平滑转发</text>

  <!-- 中间双向数据箭头与服务器退场卡片 -->
  <line x1="438" y1="673" x2="800" y2="673" stroke="#2F6B5E" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="800" y1="687" x2="438" y2="687" stroke="#2F6B5E" stroke-width="2" marker-end="url(#arrG)"/>

  <rect x="510" y="658" width="220" height="42" rx="6" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="620" y="675" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">DATA 业务流量直通</text>
  <text x="620" y="691" font-size="10.5" fill="#8A6A3A" text-anchor="middle">引介服务器 S 已彻底退场</text>

  <rect x="806" y="658" width="172" height="42" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="892" y="675" font-size="11" font-weight="700" fill="#4A3E70" text-anchor="middle">NAT B 规则激活</text>
  <text x="892" y="691" font-size="10.5" fill="#6E6288" text-anchor="middle">双向平滑转发</text>

  <line x1="982" y1="673" x2="1008" y2="673" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="1008" y1="687" x2="982" y2="687" stroke="#2F6B5E" stroke-width="1.6"/>

  <rect x="1012" y="658" width="176" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1100" y="675" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">Peer B（直连）</text>
  <text x="1100" y="691" font-size="10" fill="#2F6B5E" text-anchor="middle">以实际收到的源端点通信</text>

  <!-- ==================== 底部工程口径条 ==================== -->
  <rect x="40" y="720" width="1160" height="48" rx="6" fill="#EDEBE3" stroke="#9B968A" stroke-width="1"/>
  <text x="620" y="739" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">保活要求：NAT 映射具有空闲老化计时器（几十秒至几分钟）；直连建立后必须定期发送 Keepalive 心跳，否则洞口会自动关闭</text>
  <text x="620" y="756" font-size="10.5" fill="#6B675C" text-anchor="middle">兜底机制：若遭遇对称 NAT（APDM）或严格企业防火墙导致打洞失败，必须具备自动降级至 TURN 服务器中继转发的容灾能力</text>
</svg>