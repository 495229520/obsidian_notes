<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" role="img" aria-label="UDP 打洞全流程泳道" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>UDP 打洞全流程：注册 → 交换端点 → 同时 PUNCH → 直连</title>
  <desc>五条泳道分别是 Peer A、NAT A、引介服务器 S、NAT B、Peer B。四个编号band依次是注册、交换公网端点、双方同时连发 PUNCH、建立直连。底部提示映射会超时。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="rgb(245, 244, 237)"/>

  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">打洞全流程：注册 → 交换端点 → 同时 PUNCH → 直连</text>
  <text x="48" y="78" font-size="13" fill="#6B675C">服务器只负责引介；真正把路打通的，是双方从同一个 socket 几乎同时发出去的那串包</text>

  <!-- 泳道表头 -->
  <rect x="48" y="104" width="180" height="30" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <rect x="258" y="104" width="180" height="30" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <rect x="500" y="104" width="240" height="30" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <rect x="802" y="104" width="180" height="30" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <rect x="1012" y="104" width="180" height="30" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="138" y="124" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">Peer A</text>
  <text x="348" y="124" font-size="12.5" font-weight="700" fill="#4A3E70" text-anchor="middle">NAT A</text>
  <text x="620" y="124" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">引介服务器 S（公网）</text>
  <text x="892" y="124" font-size="12.5" font-weight="700" fill="#4A3E70" text-anchor="middle">NAT B</text>
  <text x="1102" y="124" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">Peer B</text>

  <line x1="243" y1="140" x2="243" y2="686" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="469" y1="140" x2="469" y2="686" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="771" y1="140" x2="771" y2="686" stroke="#D8D5C8" stroke-width="1"/>
  <line x1="997" y1="140" x2="997" y2="686" stroke="#D8D5C8" stroke-width="1"/>

  <!-- ① 注册 -->
  <rect x="40" y="150" width="1160" height="156" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="52" y="158" width="72" height="24" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="88" y="175" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">① 注册</text>

  <rect x="500" y="190" width="240" height="100" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="620" y="216" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">以 recvfrom 的源地址为准</text>
  <text x="620" y="240" font-size="11.5" fill="#6B4E28" text-anchor="middle">A_pub = 1.2.3.4:50001</text>
  <text x="620" y="262" font-size="11.5" fill="#6B4E28" text-anchor="middle">B_pub = 5.6.7.8:50002</text>
  <text x="620" y="282" font-size="10.5" fill="#8A6A3A" text-anchor="middle">不信客户端自报的地址</text>

  <rect x="52" y="196" width="176" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="140" y="222" font-size="11.5" fill="#2C4460" text-anchor="middle">用 socket S₀ 发 REG</text>
  <rect x="262" y="190" width="172" height="56" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="348" y="212" font-size="11.5" font-weight="700" fill="#4A3E70" text-anchor="middle">建映射</text>
  <text x="348" y="232" font-size="11" fill="#4A3E70" text-anchor="middle">→ 1.2.3.4:50001</text>
  <line x1="230" y1="218" x2="256" y2="218" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="436" y1="218" x2="494" y2="218" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="1012" y="248" width="176" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="1100" y="274" font-size="11.5" fill="#2C4460" text-anchor="middle">用 socket S₀ 发 REG</text>
  <rect x="806" y="242" width="172" height="56" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="892" y="264" font-size="11.5" font-weight="700" fill="#4A3E70" text-anchor="middle">建映射</text>
  <text x="892" y="284" font-size="11" fill="#4A3E70" text-anchor="middle">→ 5.6.7.8:50002</text>
  <line x1="1010" y1="270" x2="984" y2="270" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="804" y1="270" x2="746" y2="270" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- ② 交换 -->
  <rect x="40" y="318" width="1160" height="96" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="52" y="326" width="72" height="24" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="88" y="343" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">② 交换</text>

  <rect x="500" y="356" width="240" height="44" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="620" y="382" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">把端点交叉告诉对方</text>
  <rect x="52" y="356" width="176" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="140" y="382" font-size="11.5" fill="#2C4460" text-anchor="middle">记下 B_pub</text>
  <rect x="1012" y="356" width="176" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="1100" y="382" font-size="11.5" fill="#2C4460" text-anchor="middle">记下 A_pub</text>
  <line x1="498" y1="378" x2="232" y2="378" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="742" y1="378" x2="1008" y2="378" stroke="#8A6A3A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="366" y="370" font-size="10.5" fill="#6B4E28" text-anchor="middle">5.6.7.8:50002</text>
  <text x="874" y="370" font-size="10.5" fill="#6B4E28" text-anchor="middle">1.2.3.4:50001</text>

  <!-- ③ PUNCH -->
  <rect x="40" y="426" width="1160" height="174" rx="8" fill="#FFFBF3" stroke="#D8D5C8" stroke-width="1.1"/>
  <rect x="52" y="434" width="82" height="24" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="93" y="451" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">③ PUNCH</text>

  <rect x="368" y="434" width="504" height="26" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="620" y="452" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">关键：双方几乎同时，仍用 socket S₀ 连发 PUNCH</text>

  <rect x="52" y="474" width="176" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="140" y="496" font-size="11.5" fill="#2C4460" text-anchor="middle">向 B_pub 连发</text>
  <text x="140" y="517" font-size="11" fill="#2C4460" text-anchor="middle">200ms 一包 × 40</text>
  <rect x="262" y="474" width="172" height="58" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="348" y="496" font-size="11.5" fill="#4A3E70" text-anchor="middle">记下目标 B_pub</text>
  <text x="348" y="517" font-size="11" fill="#4A3E70" text-anchor="middle">B 的回包能进了</text>

  <rect x="500" y="474" width="240" height="58" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="620" y="496" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">头几包互相被丢</text>
  <text x="620" y="517" font-size="11" fill="#733428" text-anchor="middle">正常现象，别停手</text>

  <rect x="806" y="474" width="172" height="58" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="892" y="496" font-size="11.5" fill="#4A3E70" text-anchor="middle">记下目标 A_pub</text>
  <text x="892" y="517" font-size="11" fill="#4A3E70" text-anchor="middle">A 的回包能进了</text>
  <rect x="1012" y="474" width="176" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="1100" y="496" font-size="11.5" fill="#2C4460" text-anchor="middle">向 A_pub 连发</text>
  <text x="1100" y="517" font-size="11" fill="#2C4460" text-anchor="middle">200ms 一包 × 40</text>

  <line x1="60" y1="558" x2="1180" y2="558" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="1180" y1="582" x2="60" y2="582" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arrG)"/>
  <rect x="516" y="547" width="208" height="22" rx="5" fill="#FBFBF6" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="620" y="562" font-size="10.5" fill="#2C4460" text-anchor="middle">PUNCH　A → 5.6.7.8:50002</text>
  <rect x="516" y="571" width="208" height="22" rx="5" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="620" y="586" font-size="10.5" fill="#24473F" text-anchor="middle">PUNCH　B → 1.2.3.4:50001</text>

  <!-- ④ 直连 -->
  <rect x="40" y="612" width="1160" height="66" rx="8" fill="#F2F7F4" stroke="#2F6B5E" stroke-width="1.2"/>
  <rect x="52" y="620" width="72" height="24" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="88" y="637" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">④ 直连</text>

  <rect x="140" y="638" width="120" height="32" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="200" y="659" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">Peer A</text>
  <rect x="980" y="638" width="120" height="32" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="1040" y="659" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">Peer B</text>
  <line x1="270" y1="654" x2="970" y2="654" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrG)" marker-start="url(#arrG)"/>
  <rect x="496" y="643" width="248" height="24" rx="5" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="620" y="659" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">DATA 直走，S 从此退场</text>

  <text x="48" y="704" font-size="12" fill="#6B675C">收到对端包之后，以「实际收到的源地址」为准继续发；映射会超时，所以直连建立不等于一劳永逸</text>
</svg>
