<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" role="img" aria-label="UDP 在网络栈中的位置" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 设计系统：底色 rgb(245,244,237)；蓝/应用 #E3EAF4/#3D5A80；绿/UDP 主角 #DCE9E3/#2F6B5E；琥珀/IP #EFE7DA/#8A6A3A；中性/网卡 #F1EFE8/#8A8574；与库内教学图同一套 -->
  <title>UDP 在网络栈中的位置：socket 是应用的边界，UDP 按端口分用，IP 负责主机间转发</title>
  <desc>左侧客户端沿应用、UDP、IP、网卡向下封装并发送；数据报经网络到达右侧服务器网卡后，再沿 IP、UDP、socket 向上解包和分用。底部条带说明四元组定位方式。</desc>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="480" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">UDP 在网络栈中的位置：socket 是应用的边界，UDP 按端口分用，IP 负责主机间转发</text>
  <text x="48" y="79" font-size="13" fill="#6B675C">应用真正打交道的是 socket；UDP 按端口号区分不同应用，IP 把数据报从一台主机转发到另一台主机</text>

  <text x="48" y="112" font-size="13" font-weight="700" fill="#4A473F">A · 左侧向下封装 → 网络传输 → 右侧向上解包</text>

  <!-- ============ 客户端栈（左） ============ -->
  <rect x="48" y="124" width="260" height="62" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="68" y="148" font-size="13" font-weight="700" fill="#2C4460">应用进程</text>
  <text x="68" y="170" font-size="10.5" fill="#2C4460">socket · 应用 ↔ 协议栈边界</text>

  <rect x="48" y="202" width="260" height="74" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="68" y="226" font-size="13" font-weight="700" fill="#24473F">UDP · 按端口分用</text>
  <text x="68" y="248" font-size="10.5" fill="#24473F">封装源 / 目标端口</text>

  <rect x="48" y="292" width="260" height="54" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="68" y="315" font-size="13" font-weight="700" fill="#6B4E28">IP · 主机间转发</text>
  <text x="68" y="336" font-size="10.5" fill="#6B4E28">数据报跨主机路由</text>

  <rect x="48" y="362" width="260" height="48" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.5"/>
  <text x="68" y="390" font-size="13" font-weight="700" fill="#4A473F">网卡 · 链路层</text>

  <line x1="178" y1="186" x2="178" y2="202" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <line x1="178" y1="276" x2="178" y2="292" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <line x1="178" y1="346" x2="178" y2="362" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <!-- ============ 服务器栈（右） ============ -->
  <rect x="932" y="124" width="260" height="62" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="952" y="148" font-size="13" font-weight="700" fill="#2C4460">应用进程</text>
  <text x="952" y="170" font-size="10.5" fill="#2C4460">socket · 按端口分发</text>

  <rect x="932" y="202" width="260" height="74" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="952" y="226" font-size="13" font-weight="700" fill="#24473F">UDP · 按端口分用</text>
  <text x="952" y="248" font-size="10.5" fill="#24473F">按目标端口投递</text>

  <rect x="932" y="292" width="260" height="54" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="952" y="315" font-size="13" font-weight="700" fill="#6B4E28">IP · 主机间转发</text>
  <text x="952" y="336" font-size="10.5" fill="#6B4E28">校验目标 IP 并上交</text>

  <rect x="932" y="362" width="260" height="48" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.5"/>
  <text x="952" y="390" font-size="13" font-weight="700" fill="#4A473F">网卡 · 链路层</text>

  <line x1="1062" y1="202" x2="1062" y2="190" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <line x1="1062" y1="292" x2="1062" y2="280" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <line x1="1062" y1="362" x2="1062" y2="350" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>

  <!-- ============ 中间网络 ============ -->
  <rect x="396" y="300" width="448" height="110" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="620" y="344" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="middle">网络</text>
  <text x="620" y="370" font-size="11" fill="#6B675C" text-anchor="middle">IP 负责跨主机转发数据报</text>
  <text x="620" y="390" font-size="11" fill="#6B675C" text-anchor="middle">丢失 / 乱序 / 重复在此发生</text>

  <!-- 数据报的主方向：客户端网卡 → 网络 → 服务器网卡 -->
  <line x1="308" y1="384" x2="396" y2="384" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <line x1="844" y1="384" x2="932" y2="384" stroke="#5A564B" stroke-width="1.8" marker-end="url(#arrn)"/>
  <text x="352" y="374" font-size="10.5" fill="#5A564B" text-anchor="middle">发出</text>
  <text x="888" y="374" font-size="10.5" fill="#5A564B" text-anchor="middle">到达</text>

  <!-- ============ B 区 · 定位方式条带 ============ -->
  <rect x="48" y="432" width="1144" height="42" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="68" y="450" font-size="12" font-weight="700" fill="#4A473F">数据报定位 = 源 IP : 源端口 → 目标 IP : 目标端口</text>
  <text x="68" y="466" font-size="10.5" fill="#6B675C">内核按目标端口把数据报投递给对应 socket —— 通信靠「IP + 端口 + socket」三者配合</text>
</svg>
