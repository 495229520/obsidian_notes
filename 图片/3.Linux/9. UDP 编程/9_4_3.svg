<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" role="img" aria-label="复用同一个 socket 与中途换端口的对照" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>为什么必须复用同一个 UDP socket：复用与换端口的逐步对照</title>
  <desc>左右两个面板对照同一条流程的四个步骤：注册时的本地端点、NAT 建立的映射、服务器告知对端的地址、打洞时实际使用的本地端点。左侧全程复用同一个 socket，对端打中映射；右侧打洞时换了本地端口，NAT 另起一条映射，对端打的旧地址成为黑洞。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="rgb(245, 244, 237)"/>

  <text x="48" y="50" font-size="22" font-weight="700" fill="#2B2A26">同一个 socket 是打洞的前提，不是编码风格</text>
  <text x="48" y="78" font-size="13" fill="#6B675C">对比同一条流程的四步：只有第 ④ 步不同，结果就从"能直连"变成"怎么打都不通"</text>

  <!-- A 面板 -->
  <text x="48" y="128" font-size="14" font-weight="700" fill="#24473F">A · 注册、打洞、通信全程复用 socket S₀</text>
  <rect x="40" y="142" width="572" height="252" rx="8" fill="#F4F8F6" stroke="#2F6B5E" stroke-width="1.3"/>

  <text x="60" y="185" font-size="11.5" fill="#4A473F">① 注册时的本地端点</text>
  <rect x="222" y="166" width="370" height="28" rx="5" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <text x="238" y="185" font-size="11.5" fill="#2B2A26">192.168.1.10:50000</text>

  <text x="60" y="221" font-size="11.5" fill="#4A473F">② NAT 建立的映射</text>
  <rect x="222" y="202" width="370" height="28" rx="5" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.1"/>
  <text x="238" y="221" font-size="11.5" fill="#4A3E70">→ 198.51.100.8:62000</text>

  <text x="60" y="257" font-size="11.5" fill="#4A473F">③ S 告知对端的地址</text>
  <rect x="222" y="238" width="370" height="28" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="238" y="257" font-size="11.5" fill="#6B4E28">198.51.100.8:62000</text>

  <text x="60" y="293" font-size="11.5" fill="#4A473F">④ 打洞时的本地端点</text>
  <rect x="222" y="274" width="370" height="28" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="238" y="293" font-size="11.5" font-weight="700" fill="#24473F">192.168.1.10:50000</text>
  <text x="470" y="293" font-size="10.5" fill="#2F6B5E">和 ① 一致</text>

  <rect x="60" y="316" width="532" height="62" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="80" y="340" font-size="12" font-weight="700" fill="#24473F">NAT 沿用同一条映射</text>
  <text x="80" y="362" font-size="11.5" fill="#24473F">对端打的 :62000 正好落在这条记录上，包被放进来</text>

  <!-- B 面板 -->
  <text x="628" y="128" font-size="14" font-weight="700" fill="#733428">B · 打洞时新开了一个 socket S₁</text>
  <rect x="628" y="142" width="572" height="252" rx="8" fill="#FCF4F2" stroke="#A64B3C" stroke-width="1.3"/>

  <text x="648" y="185" font-size="11.5" fill="#4A473F">① 注册时的本地端点</text>
  <rect x="810" y="166" width="370" height="28" rx="5" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.1"/>
  <text x="826" y="185" font-size="11.5" fill="#2B2A26">192.168.1.10:50000</text>

  <text x="648" y="221" font-size="11.5" fill="#4A473F">② NAT 建立的映射</text>
  <rect x="810" y="202" width="370" height="28" rx="5" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.1"/>
  <text x="826" y="221" font-size="11.5" fill="#4A3E70">→ 198.51.100.8:62000</text>

  <text x="648" y="257" font-size="11.5" fill="#4A473F">③ S 告知对端的地址</text>
  <rect x="810" y="238" width="370" height="28" rx="5" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.1"/>
  <text x="826" y="257" font-size="11.5" fill="#6B4E28">198.51.100.8:62000</text>

  <text x="648" y="293" font-size="11.5" fill="#4A473F">④ 打洞时的本地端点</text>
  <rect x="810" y="274" width="370" height="28" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="826" y="293" font-size="11.5" font-weight="700" fill="#733428">192.168.1.10:50001</text>
  <text x="1058" y="293" font-size="10.5" font-weight="700" fill="#A64B3C">≠ ①</text>

  <rect x="648" y="316" width="532" height="62" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="668" y="340" font-size="12" font-weight="700" fill="#733428">NAT 另起一条：→ 198.51.100.8:63000</text>
  <text x="668" y="362" font-size="11.5" fill="#733428">对端还在打 :62000，那条映射已成黑洞，包全丢</text>

  <!-- 底部 -->
  <rect x="40" y="416" width="1160" height="42" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="620" y="442" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">流程一步不少却始终打不通，先查这一条：注册、打洞、通信用的是不是同一个 socket</text>

  <text x="48" y="488" font-size="12" fill="#6B675C">bind() 到固定端口只保证本地端点不变；公网端口稳不稳定还取决于 NAT 的映射行为，见下一张图</text>
</svg>
