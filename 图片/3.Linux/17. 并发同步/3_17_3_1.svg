<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#F5F4ED"/>

  <title>futex：无竞争的快路径留在用户态，有竞争才陷入内核</title>
  <desc>上半部分是一次 lock() 的两条路径（用户态泳道与内核泳道），下半部分是 glibc futex 字的三态与两条路径的代价对照。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">futex：把无竞争的加锁整个留在用户态</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">你为「可能发生的竞争」付费，而不是为「每一次加锁」付费 —— 这是 Linux 互斥锁快的全部原因</text>

  <text x="48" y="108" font-size="14" font-weight="700" fill="#4A473F">A · 一次 lock() 的两条路径</text>

  <!-- 泳道背景 -->
  <rect x="56" y="118" width="1128" height="150" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="140" font-size="12" font-weight="700" fill="#3D5A80">用户态 · 调用线程</text>
  <rect x="56" y="278" width="1128" height="150" rx="8" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="300" font-size="12" font-weight="700" fill="#2F6B5E">内核 · futex 子系统</text>

  <!-- 用户态步骤 -->
  <rect x="76" y="160" width="180" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="166" y="184" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 线程调用 lock()</text>
  <text x="166" y="204" font-size="10.5" fill="#2C4460" text-anchor="middle">申请进入临界区</text>

  <rect x="280" y="160" width="204" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="382" y="184" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">② 原子 CAS：0 → 1</text>
  <text x="382" y="204" font-size="10.5" fill="#2C4460" text-anchor="middle">一条指令，不碰内核</text>

  <rect x="508" y="160" width="212" height="58" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="2"/>
  <text x="614" y="184" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">③ 成功 = 无竞争，持锁返回</text>
  <text x="614" y="204" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">系统调用 0 次，切换 0 次</text>

  <rect x="740" y="174" width="228" height="32" rx="6" fill="#ECEAE0" stroke="#8A8574" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="854" y="195" font-size="11" fill="#4A473F" text-anchor="middle">④–⑦ 期间线程不在 CPU 上</text>

  <rect x="990" y="160" width="188" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="1084" y="184" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">⑧ 醒来，重试 CAS</text>
  <text x="1084" y="204" font-size="10.5" fill="#2C4460" text-anchor="middle">抢到才算真正持锁</text>

  <text x="80" y="246" font-size="11" fill="#4A473F">自适应锁（ADAPTIVE_NP）：在 ② 处先空转重试，超阈值才走 ④</text>

  <!-- 内核步骤 -->
  <rect x="280" y="320" width="204" height="58" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="382" y="344" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">④ futex(FUTEX_WAIT)</text>
  <text x="382" y="364" font-size="10.5" fill="#6B4E28" text-anchor="middle">先置字为 2，再等值 = 2</text>

  <rect x="508" y="320" width="212" height="58" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="614" y="344" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">⑤ 挂入等待队列</text>
  <text x="614" y="364" font-size="10.5" fill="#6B4E28" text-anchor="middle">按 futex 字地址哈希入桶</text>

  <rect x="740" y="320" width="228" height="58" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.5"/>
  <text x="854" y="344" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">⑥ 睡眠，让出 CPU</text>
  <text x="854" y="364" font-size="10.5" fill="#4A473F" text-anchor="middle">调度器切走，不占核</text>

  <rect x="990" y="320" width="188" height="58" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1084" y="344" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">⑦ FUTEX_WAKE</text>
  <text x="1084" y="364" font-size="10.5" fill="#24473F" text-anchor="middle">由 unlock 方触发，唤一个</text>

  <text x="284" y="406" font-size="11" fill="#4A473F">④ 里「再检查一次」是为了堵住竞态窗口：刚要睡下去，锁却已经被放了</text>

  <!-- 箭头 -->
  <line x1="256" y1="189" x2="276" y2="189" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="484" y1="189" x2="504" y2="189" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="494" y="150" font-size="10.5" font-weight="700" fill="#2F6B5E" text-anchor="middle">快路径</text>
  <line x1="382" y1="218" x2="382" y2="316" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="394" y="272" font-size="11" font-weight="700" fill="#8A6A3A">慢路径：CAS 失败，说明有人持有</text>
  <line x1="484" y1="349" x2="504" y2="349" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="720" y1="349" x2="736" y2="349" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="968" y1="349" x2="986" y2="349" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="1084" y1="316" x2="1084" y2="222" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- B 区 -->
  <text x="48" y="462" font-size="14" font-weight="700" fill="#4A473F">B · unlock 凭什么知道要不要进内核，以及两条路径各值多少</text>

  <rect x="56" y="474" width="560" height="140" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="494" font-size="12" font-weight="700" fill="#4A473F">futex 字的三个状态（glibc 实现）</text>

  <rect x="68" y="506" width="176" height="52" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="156" y="527" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">0 · 空闲</text>
  <text x="156" y="546" font-size="10.5" fill="#24473F" text-anchor="middle">无人持有</text>

  <rect x="252" y="506" width="176" height="52" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="340" y="527" font-size="12" font-weight="700" fill="#6B4E28" text-anchor="middle">1 · 占用，无等待者</text>
  <text x="340" y="546" font-size="10.5" fill="#6B4E28" text-anchor="middle">unlock 置 0 即可</text>

  <rect x="436" y="506" width="176" height="52" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="524" y="527" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">2 · 占用，有等待者</text>
  <text x="524" y="546" font-size="10.5" fill="#733428" text-anchor="middle">unlock 必须发 WAKE</text>

  <text x="70" y="582" font-size="11.5" fill="#4A473F">读到 1 就直接置 0 走人，全程用户态；只有读到 2 才值得为唤醒进一次内核。</text>
  <text x="70" y="602" font-size="11.5" fill="#6B675C">三态是 libc 的实现约定，不是 futex 系统调用本身的规定。</text>

  <rect x="632" y="474" width="552" height="140" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="646" y="494" font-size="12" font-weight="700" fill="#4A473F">两条路径的代价对照</text>

  <rect x="644" y="504" width="528" height="26" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="654" y="522" font-size="11" font-weight="700" fill="#4A473F">场景</text>
  <text x="850" y="522" font-size="11" font-weight="700" fill="#4A473F">系统调用</text>
  <text x="954" y="522" font-size="11" font-weight="700" fill="#4A473F">上下文切换</text>
  <text x="1066" y="522" font-size="11" font-weight="700" fill="#4A473F">量级</text>

  <line x1="644" y1="530" x2="1172" y2="530" stroke="#D8D5C8" stroke-width="1"/>
  <text x="654" y="548" font-size="11" fill="#24473F">无竞争 lock / unlock</text>
  <text x="850" y="548" font-size="11" fill="#24473F">0 次</text>
  <text x="954" y="548" font-size="11" fill="#24473F">0 次</text>
  <text x="1066" y="548" font-size="11" font-weight="700" fill="#24473F">ns 级</text>

  <line x1="644" y1="556" x2="1172" y2="556" stroke="#D8D5C8" stroke-width="1"/>
  <text x="654" y="574" font-size="11" fill="#733428">有竞争 lock</text>
  <text x="850" y="574" font-size="11" fill="#733428">1 次 WAIT</text>
  <text x="954" y="574" font-size="11" fill="#733428">2 次（睡 + 醒）</text>
  <text x="1066" y="574" font-size="11" font-weight="700" fill="#733428">数百 ns ~ μs</text>

  <line x1="644" y1="582" x2="1172" y2="582" stroke="#D8D5C8" stroke-width="1"/>
  <text x="654" y="600" font-size="11" fill="#6B4E28">有等待者的 unlock</text>
  <text x="850" y="600" font-size="11" fill="#6B4E28">1 次 WAKE</text>
  <text x="954" y="600" font-size="11" fill="#6B4E28">0 次</text>
  <text x="1066" y="600" font-size="11" fill="#6B4E28">数百 ns ~ μs</text>

  <line x1="644" y1="608" x2="1172" y2="608" stroke="#D8D5C8" stroke-width="1"/>

  <text x="48" y="648" font-size="11.5" fill="#4A473F">现实负载里绝大多数加锁是无竞争的，所以把常见情况按 ns 级收费、把罕见情况按 μs 级收费，总账才划算。</text>
  <text x="48" y="670" font-size="11.5" fill="#4A473F">反过来，一旦竞争变频繁，慢路径那两次上下文切换就会主导延迟 —— 这时才轮到自旋锁的取舍登场（1.4）。</text>
</svg>
