<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700"
     font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>银行家算法：多资源安全序列推演</title>
  <desc>依据 Modern Operating Systems 图 6-12 的五进程四资源示例，展示初始矩阵、安全序列以及两个请求的判定。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <text x="48" y="45" font-size="22" font-weight="700" fill="#2B2A26">多资源示例：D → A → B → C → E 为什么是一条安全序列</text>
  <text x="48" y="73" font-size="14" fill="#6B675C">资源顺序：磁带机 T · 绘图仪 Pl · 打印机 Pr · 蓝光机 B；Work 表示当前可支配资源</text>

  <rect x="40" y="100" width="500" height="420" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="64" y="132" font-size="15" font-weight="700" fill="#4A473F">A · 初始状态</text>

  <text x="70" y="164" font-size="13" font-weight="700" fill="#2C4460">Allocation</text>
  <rect x="64" y="176" width="210" height="216" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <line x1="64" y1="212" x2="274" y2="212" stroke="#3D5A80" stroke-width="1"/>
  <line x1="104" y1="176" x2="104" y2="392" stroke="#3D5A80" stroke-width="1"/>
  <line x1="146" y1="176" x2="146" y2="392" stroke="#9AAAC0" stroke-width="0.8"/>
  <line x1="188" y1="176" x2="188" y2="392" stroke="#9AAAC0" stroke-width="0.8"/>
  <line x1="230" y1="176" x2="230" y2="392" stroke="#9AAAC0" stroke-width="0.8"/>
  <g font-size="11.5" fill="#2C4460" text-anchor="middle">
    <text x="84" y="199" font-weight="700">P</text><text x="125" y="199" font-weight="700">T</text><text x="167" y="199" font-weight="700">Pl</text><text x="209" y="199" font-weight="700">Pr</text><text x="251" y="199" font-weight="700">B</text>
    <text x="84" y="238" font-weight="700">A</text><text x="125" y="238">3</text><text x="167" y="238">0</text><text x="209" y="238">1</text><text x="251" y="238">1</text>
    <text x="84" y="274" font-weight="700">B</text><text x="125" y="274">0</text><text x="167" y="274">1</text><text x="209" y="274">0</text><text x="251" y="274">0</text>
    <text x="84" y="310" font-weight="700">C</text><text x="125" y="310">1</text><text x="167" y="310">1</text><text x="209" y="310">1</text><text x="251" y="310">0</text>
    <text x="84" y="346" font-weight="700">D</text><text x="125" y="346">1</text><text x="167" y="346">1</text><text x="209" y="346">0</text><text x="251" y="346">1</text>
    <text x="84" y="382" font-weight="700">E</text><text x="125" y="382">0</text><text x="167" y="382">0</text><text x="209" y="382">0</text><text x="251" y="382">0</text>
  </g>
  <g stroke="#9AAAC0" stroke-width="0.75">
    <line x1="64" y1="248" x2="274" y2="248"/><line x1="64" y1="284" x2="274" y2="284"/><line x1="64" y1="320" x2="274" y2="320"/><line x1="64" y1="356" x2="274" y2="356"/>
  </g>

  <text x="314" y="164" font-size="13" font-weight="700" fill="#6B4E28">Need</text>
  <rect x="306" y="176" width="210" height="216" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <line x1="306" y1="212" x2="516" y2="212" stroke="#8A6A3A" stroke-width="1"/>
  <line x1="346" y1="176" x2="346" y2="392" stroke="#8A6A3A" stroke-width="1"/>
  <line x1="388" y1="176" x2="388" y2="392" stroke="#B9A98B" stroke-width="0.8"/>
  <line x1="430" y1="176" x2="430" y2="392" stroke="#B9A98B" stroke-width="0.8"/>
  <line x1="472" y1="176" x2="472" y2="392" stroke="#B9A98B" stroke-width="0.8"/>
  <g font-size="11.5" fill="#6B4E28" text-anchor="middle">
    <text x="326" y="199" font-weight="700">P</text><text x="367" y="199" font-weight="700">T</text><text x="409" y="199" font-weight="700">Pl</text><text x="451" y="199" font-weight="700">Pr</text><text x="493" y="199" font-weight="700">B</text>
    <text x="326" y="238" font-weight="700">A</text><text x="367" y="238">1</text><text x="409" y="238">1</text><text x="451" y="238">0</text><text x="493" y="238">0</text>
    <text x="326" y="274" font-weight="700">B</text><text x="367" y="274">0</text><text x="409" y="274">1</text><text x="451" y="274">1</text><text x="493" y="274">2</text>
    <text x="326" y="310" font-weight="700">C</text><text x="367" y="310">3</text><text x="409" y="310">1</text><text x="451" y="310">0</text><text x="493" y="310">0</text>
    <text x="326" y="346" font-weight="700">D</text><text x="367" y="346">0</text><text x="409" y="346">0</text><text x="451" y="346">1</text><text x="493" y="346">0</text>
    <text x="326" y="382" font-weight="700">E</text><text x="367" y="382">2</text><text x="409" y="382">1</text><text x="451" y="382">1</text><text x="493" y="382">0</text>
  </g>
  <g stroke="#B9A98B" stroke-width="0.75">
    <line x1="306" y1="248" x2="516" y2="248"/><line x1="306" y1="284" x2="516" y2="284"/><line x1="306" y1="320" x2="516" y2="320"/><line x1="306" y1="356" x2="516" y2="356"/>
  </g>

  <rect x="64" y="416" width="452" height="82" rx="8" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.1"/>
  <g font-size="11.5" fill="#4A473F">
    <text x="84" y="441" font-weight="700">Total</text><text x="155" y="441">(6, 3, 4, 2)</text>
    <text x="84" y="465" font-weight="700">Assigned</text><text x="155" y="465">(5, 3, 2, 2)</text>
    <text x="84" y="489" font-weight="700">Available</text><text x="155" y="489" fill="#2C4460" font-weight="700">(1, 0, 2, 0)</text>
    <text x="322" y="453" font-weight="700">不变量</text>
    <text x="322" y="477">Total = Assigned + Available</text>
  </g>

  <rect x="564" y="100" width="636" height="420" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="588" y="132" font-size="15" font-weight="700" fill="#4A473F">B · Safety check 的逐行“放行账”</text>
  <text x="588" y="156" font-size="12" fill="#6B675C">满足 Need ≤ Work 的进程可假设完成；净效果是 Work += 原 Allocation</text>

  <rect x="586" y="176" width="590" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.1"/>
  <g font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">
    <text x="617" y="202">进程</text><text x="706" y="202">Need</text><text x="834" y="202">Work 前</text><text x="968" y="202">释放 Allocation</text><text x="1111" y="202">Work 后</text>
  </g>
  <g stroke="#9AAAC0" stroke-width="0.8">
    <line x1="650" y1="176" x2="650" y2="493"/><line x1="762" y1="176" x2="762" y2="493"/><line x1="906" y1="176" x2="906" y2="493"/><line x1="1034" y1="176" x2="1034" y2="493"/>
  </g>

  <g font-size="11.5" fill="#4A473F" text-anchor="middle">
    <rect x="586" y="218" width="590" height="55" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="0.7"/>
    <text x="617" y="250" font-weight="700" fill="#24473F">D</text><text x="706" y="250">(0,0,1,0)</text><text x="834" y="250">(1,0,2,0)</text><text x="968" y="250">+(1,1,0,1)</text><text x="1111" y="250" font-weight="700">(2,1,2,1)</text>
    <rect x="586" y="273" width="590" height="55" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="0.7"/>
    <text x="617" y="305" font-weight="700" fill="#24473F">A</text><text x="706" y="305">(1,1,0,0)</text><text x="834" y="305">(2,1,2,1)</text><text x="968" y="305">+(3,0,1,1)</text><text x="1111" y="305" font-weight="700">(5,1,3,2)</text>
    <rect x="586" y="328" width="590" height="55" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="0.7"/>
    <text x="617" y="360" font-weight="700" fill="#24473F">B</text><text x="706" y="360">(0,1,1,2)</text><text x="834" y="360">(5,1,3,2)</text><text x="968" y="360">+(0,1,0,0)</text><text x="1111" y="360" font-weight="700">(5,2,3,2)</text>
    <rect x="586" y="383" width="590" height="55" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="0.7"/>
    <text x="617" y="415" font-weight="700" fill="#24473F">C</text><text x="706" y="415">(3,1,0,0)</text><text x="834" y="415">(5,2,3,2)</text><text x="968" y="415">+(1,1,1,0)</text><text x="1111" y="415" font-weight="700">(6,3,4,2)</text>
    <rect x="586" y="438" width="590" height="55" fill="#DCE9E3" stroke="#D8D5C8" stroke-width="0.7"/>
    <text x="617" y="470" font-weight="700" fill="#24473F">E</text><text x="706" y="470">(2,1,1,0)</text><text x="834" y="470">(6,3,4,2)</text><text x="968" y="470">+(0,0,0,0)</text><text x="1111" y="470" font-weight="700">(6,3,4,2)</text>
  </g>

  <rect x="40" y="540" width="550" height="120" rx="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="64" y="570" font-size="14" font-weight="700" fill="#24473F">请求一：B 再要 1 台打印机</text>
  <g font-size="11.5" fill="#24473F" text-anchor="middle">
    <rect x="66" y="590" width="118" height="42" rx="7" fill="#FBFBF6" stroke="#2F6B5E"/><text x="125" y="616">A=(1,0,2,0)</text>
    <path d="M184 611 H220" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arr-green)"/>
    <rect x="222" y="590" width="126" height="42" rx="7" fill="#FBFBF6" stroke="#2F6B5E"/><text x="285" y="608">试分配</text><text x="285" y="624">A=(1,0,1,0)</text>
    <path d="M348 611 H384" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arr-green)"/>
    <rect x="386" y="590" width="172" height="42" rx="7" fill="#FBFBF6" stroke="#2F6B5E"/><text x="472" y="608" font-weight="700">仍有安全序列</text><text x="472" y="624">批准并提交</text>
  </g>

  <rect x="610" y="540" width="590" height="120" rx="10" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="634" y="570" font-size="14" font-weight="700" fill="#733428">请求二：随后 E 再要最后 1 台打印机</text>
  <g font-size="11.5" fill="#733428" text-anchor="middle">
    <rect x="636" y="590" width="126" height="42" rx="7" fill="#FBFBF6" stroke="#A64B3C"/><text x="699" y="616">A=(1,0,1,0)</text>
    <path d="M762 611 H800" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arr-red)"/>
    <rect x="802" y="590" width="132" height="42" rx="7" fill="#FBFBF6" stroke="#A64B3C"/><text x="868" y="608">试分配</text><text x="868" y="624">A=(1,0,0,0)</text>
    <path d="M934 611 H972" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arr-red)"/>
    <rect x="974" y="590" width="194" height="42" rx="7" fill="#FBFBF6" stroke="#A64B3C"/><text x="1071" y="608" font-weight="700">无可完成进程</text><text x="1071" y="624">回滚并推迟请求</text>
  </g>
</svg>
