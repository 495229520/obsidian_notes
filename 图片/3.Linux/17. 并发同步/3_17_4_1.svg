<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#F5F4ED"/>

  <title>pthread_cond_wait 的原子性，以及为什么等待必须写成 while</title>
  <desc>上半是等待线程与通知线程的两条泳道时序，标出放锁与睡下的原子步；下半是被唤醒的三种来源与对应处理，以及 signal 与 broadcast 的选择。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">cond_wait 的原子性，和 while 存在的理由</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">放锁与睡下必须是同一步；而被唤醒只说明「有人动过状态」，从不说明「你要的条件已经成立」</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 等待方的五步，与通知方的交错</text>

  <!-- 等待方泳道 -->
  <rect x="56" y="124" width="1128" height="170" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="150" font-size="12" font-weight="700" fill="#3D5A80">等待线程 · 消费者</text>

  <path d="M1066,182 L1066,164 L397,164 L397,176" fill="none" stroke="#2F6B5E" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="566" y="158" font-size="10.5" font-weight="700" fill="#2F6B5E">谓词不成立 → 回到 ②，再睡一轮</text>

  <rect x="76" y="182" width="196" height="62" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="174" y="206" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 持锁，读谓词</text>
  <text x="174" y="226" font-size="10.5" fill="#2C4460" text-anchor="middle">队列为空，走不下去</text>

  <rect x="299" y="182" width="196" height="62" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="397" y="206" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">② 调用 cond_wait</text>
  <text x="397" y="226" font-size="10.5" fill="#2C4460" text-anchor="middle">把持有的锁一并交出</text>

  <rect x="522" y="182" width="196" height="62" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="2"/>
  <text x="620" y="206" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">③ 放锁与睡下是一步</text>
  <text x="620" y="226" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">中间没有可乘的缝</text>

  <rect x="745" y="182" width="196" height="62" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="843" y="206" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">④ 醒来，重抢 mutex</text>
  <text x="843" y="226" font-size="10.5" fill="#6B4E28" text-anchor="middle">抢到才从 wait 返回</text>

  <rect x="968" y="182" width="196" height="62" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1066" y="206" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">⑤ while 重查谓词</text>
  <text x="1066" y="226" font-size="10.5" fill="#24473F" text-anchor="middle">成立才算真正等到</text>

  <line x1="272" y1="213" x2="295" y2="213" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="495" y1="213" x2="518" y2="213" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="718" y1="213" x2="741" y2="213" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="941" y1="213" x2="964" y2="213" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="76" y="274" font-size="11" fill="#4A473F">全程只有 ③ 这一段不持锁，其余每一步都握着 mutex</text>

  <!-- 通知方泳道 -->
  <rect x="56" y="332" width="1128" height="170" rx="8" fill="#F2ECE1" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="358" font-size="12" font-weight="700" fill="#8A6A3A">通知线程 · 生产者</text>

  <text x="76" y="390" font-size="11.5" font-weight="700" fill="#6B4E28">通知方也必须持锁改谓词</text>
  <text x="76" y="412" font-size="11" fill="#6B4E28">signal 发在 unlock 之前</text>
  <text x="76" y="434" font-size="11" fill="#6B4E28">此刻无人等 → 信号丢弃</text>

  <rect x="299" y="372" width="196" height="62" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="397" y="396" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">ⓐ 持锁修改谓词</text>
  <text x="397" y="416" font-size="10.5" fill="#6B4E28" text-anchor="middle">入队一个任务，size 变 1</text>

  <rect x="522" y="372" width="196" height="62" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="620" y="396" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">ⓑ signal / broadcast</text>
  <text x="620" y="416" font-size="10.5" fill="#6B4E28" text-anchor="middle">从等待队列上唤醒</text>

  <rect x="745" y="372" width="196" height="62" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="843" y="396" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">ⓒ unlock(mutex)</text>
  <text x="843" y="416" font-size="10.5" fill="#6B4E28" text-anchor="middle">等待方这才抢得到锁</text>

  <rect x="968" y="372" width="196" height="62" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1066" y="396" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">反例 · 若 ③ 不原子</text>
  <text x="1066" y="416" font-size="10.5" fill="#733428" text-anchor="middle">ⓑ 落进缝里就丢了</text>

  <line x1="495" y1="403" x2="518" y2="403" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="718" y1="403" x2="741" y2="403" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <line x1="620" y1="368" x2="620" y2="248" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="632" y="314" font-size="11" font-weight="700" fill="#8A6A3A">唤醒信号</text>
  <line x1="843" y1="368" x2="843" y2="248" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="855" y="314" font-size="11" font-weight="700" fill="#8A6A3A">锁被放开</text>

  <text x="299" y="464" font-size="11" fill="#4A473F">上下同列 = 同一时刻</text>

  <!-- B 区 -->
  <text x="48" y="538" font-size="14" font-weight="700" fill="#4A473F">B · 醒来不等于条件成立：三种来源，一个处理</text>

  <rect x="56" y="550" width="700" height="160" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="572" font-size="12" font-weight="700" fill="#4A473F">被唤醒的三种来源</text>

  <rect x="68" y="582" width="676" height="26" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="600" font-size="11" font-weight="700" fill="#4A473F">来源</text>
  <text x="268" y="600" font-size="11" font-weight="700" fill="#4A473F">醒来时谓词成立吗</text>
  <text x="490" y="600" font-size="11" font-weight="700" fill="#4A473F">正确处理</text>

  <text x="80" y="626" font-size="11" fill="#4A473F">signal 点名唤醒</text>
  <text x="268" y="626" font-size="11" fill="#4A473F">可能已被先到者取走</text>
  <text x="490" y="626" font-size="11" fill="#24473F">回到 while 重查</text>
  <line x1="68" y1="634" x2="744" y2="634" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="652" font-size="11" fill="#4A473F">broadcast 惊群</text>
  <text x="268" y="652" font-size="11" fill="#4A473F">只有一个抢得到</text>
  <text x="490" y="652" font-size="11" fill="#24473F">其余线程再睡回去</text>
  <line x1="68" y1="660" x2="744" y2="660" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="678" font-size="11" fill="#733428">虚假唤醒</text>
  <text x="268" y="678" font-size="11" fill="#733428">根本没人通知过</text>
  <text x="490" y="678" font-size="11" fill="#24473F">回到 while 重查</text>
  <line x1="68" y1="686" x2="744" y2="686" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="772" y="550" width="412" height="160" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="786" y="572" font-size="12" font-weight="700" fill="#4A473F">signal 还是 broadcast</text>

  <rect x="784" y="582" width="388" height="48" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="798" y="602" font-size="11.5" font-weight="700" fill="#2C4460">signal · 至少唤醒一个</text>
  <text x="798" y="620" font-size="10.5" fill="#2C4460">只有一个等待者能获益，如入队一个任务</text>

  <rect x="784" y="638" width="388" height="48" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="798" y="658" font-size="11.5" font-weight="700" fill="#24473F">broadcast · 全部唤醒</text>
  <text x="798" y="676" font-size="10.5" fill="#24473F">状态变化对所有等待者都有意义，如关池</text>

  <text x="48" y="742" font-size="11.5" fill="#4A473F">③ 一旦不原子，signal 就可能落在「已放锁、还没睡」的那道缝里，等待方从此睡到天亮 —— 这就是唤醒丢失。</text>
  <text x="48" y="764" font-size="11.5" fill="#4A473F">拿不准 signal 还是 broadcast 就选 broadcast：多醒几个只是开销，而少醒一个是 bug。</text>
</svg>
