<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#F5F4ED"/>

  <title>死锁：四个必要条件同时成立，破坏任意一条即可</title>
  <desc>左上是反序加锁的资源分配图与成环；右上把四个必要条件对到这个例子上；下半部分是破坏各条件的四种工程手段及其代价。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">死锁：四个条件缺一不可，所以拆掉一条就够了</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">防死锁不是「小心一点」，而是在设计上永久拿掉其中一条 —— 靠自觉守住的顺序，迟早会被新代码破坏</text>

  <text x="48" y="108" font-size="14" font-weight="700" fill="#4A473F">A · 反序加锁的两把锁，怎么把四个条件凑齐</text>

  <!-- 左：资源分配图 -->
  <rect x="56" y="118" width="552" height="322" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="140" font-size="12" font-weight="700" fill="#4A473F">资源分配图：实线 = 已持有，虚线 = 正在等</text>

  <rect x="92" y="162" width="180" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="182" y="185" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">线程 A</text>
  <text x="182" y="204" font-size="10.5" fill="#2C4460" text-anchor="middle">lock(m1) → lock(m2)</text>

  <rect x="392" y="162" width="180" height="54" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="482" y="185" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">线程 B</text>
  <text x="482" y="204" font-size="10.5" fill="#6B4E28" text-anchor="middle">lock(m2) → lock(m1)</text>

  <rect x="92" y="322" width="180" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="182" y="345" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">mutex1</text>
  <text x="182" y="364" font-size="10.5" fill="#24473F" text-anchor="middle">持有者：A</text>

  <rect x="392" y="322" width="180" height="54" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="482" y="345" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">mutex2</text>
  <text x="482" y="364" font-size="10.5" fill="#4A3F68" text-anchor="middle">持有者：B</text>

  <line x1="140" y1="322" x2="140" y2="220" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="128" y="274" font-size="11" font-weight="700" fill="#2F6B5E" text-anchor="end">持有</text>

  <line x1="524" y1="322" x2="524" y2="220" stroke="#6B5B95" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="536" y="274" font-size="11" font-weight="700" fill="#6B5B95">持有</text>

  <line x1="266" y1="212" x2="392" y2="326" stroke="#3D5A80" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrB)"/>
  <text x="278" y="238" font-size="11" font-weight="700" fill="#3D5A80" text-anchor="end">A 等 m2</text>

  <line x1="398" y1="212" x2="272" y2="326" stroke="#8A6A3A" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <text x="386" y="238" font-size="11" font-weight="700" fill="#8A6A3A">B 等 m1</text>

  <text x="70" y="410" font-size="11.5" font-weight="700" fill="#733428">A → m2 → B → m1 → A 闭合成环</text>
  <text x="70" y="430" font-size="11.5" fill="#4A473F">环一旦出现就已经是死锁，不是「快要死锁」—— 没有线程还能推进一步。</text>

  <!-- 右：四条件对照表 -->
  <rect x="624" y="118" width="560" height="322" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="638" y="140" font-size="12" font-weight="700" fill="#4A473F">四个必要条件 —— 在这个例子里长什么样</text>

  <rect x="638" y="152" width="532" height="28" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="650" y="171" font-size="11" font-weight="700" fill="#4A473F">必要条件</text>
  <text x="812" y="171" font-size="11" font-weight="700" fill="#4A473F">在反序加锁例子中的体现</text>

  <line x1="638" y1="180" x2="1170" y2="180" stroke="#D8D5C8" stroke-width="1"/>
  <text x="650" y="205" font-size="11.5" font-weight="700" fill="#4A473F">① 互斥</text>
  <text x="812" y="205" font-size="11.5" fill="#4A473F">mutex 同一时刻只容一个持有者</text>
  <text x="812" y="223" font-size="10.5" fill="#6B675C">锁的定义本身，动不了</text>

  <line x1="638" y1="238" x2="1170" y2="238" stroke="#D8D5C8" stroke-width="1"/>
  <text x="650" y="263" font-size="11.5" font-weight="700" fill="#4A473F">② 持有并等待</text>
  <text x="812" y="263" font-size="11.5" fill="#4A473F">A 攥着 m1 不放，又去申请 m2</text>
  <text x="812" y="281" font-size="10.5" fill="#6B675C">两次 lock 之间的窗口就是病灶</text>

  <line x1="638" y1="296" x2="1170" y2="296" stroke="#D8D5C8" stroke-width="1"/>
  <text x="650" y="321" font-size="11.5" font-weight="700" fill="#4A473F">③ 不可剥夺</text>
  <text x="812" y="321" font-size="11.5" fill="#4A473F">谁都不能把 m2 从 B 手里抢走</text>
  <text x="812" y="339" font-size="10.5" fill="#6B675C">只能持有者自己释放</text>

  <line x1="638" y1="354" x2="1170" y2="354" stroke="#D8D5C8" stroke-width="1"/>
  <text x="650" y="379" font-size="11.5" font-weight="700" fill="#733428">④ 循环等待</text>
  <text x="812" y="379" font-size="11.5" font-weight="700" fill="#733428">左图那个环，A 等 B、B 等 A</text>
  <text x="812" y="397" font-size="10.5" fill="#733428">工程上最好下手的一条</text>

  <line x1="638" y1="412" x2="1170" y2="412" stroke="#D8D5C8" stroke-width="1"/>
  <text x="650" y="430" font-size="11" fill="#6B675C">前三条是 mutex 的固有语义，几乎改不动。</text>

  <!-- B 区 -->
  <text x="48" y="474" font-size="14" font-weight="700" fill="#4A473F">B · 破坏其中一条：四种工程手段及其代价</text>

  <rect x="56" y="486" width="1128" height="176" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="68" y="498" width="1104" height="28" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="517" font-size="11" font-weight="700" fill="#4A473F">手段</text>
  <text x="288" y="517" font-size="11" font-weight="700" fill="#4A473F">具体做法</text>
  <text x="716" y="517" font-size="11" font-weight="700" fill="#4A473F">破坏的条件</text>
  <text x="860" y="517" font-size="11" font-weight="700" fill="#4A473F">代价 / 注意</text>

  <line x1="68" y1="526" x2="1172" y2="526" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="547" font-size="11.5" font-weight="700" fill="#24473F">统一加锁顺序</text>
  <text x="288" y="547" font-size="11.5" fill="#4A473F">全局约定顺序，如按对象地址从小到大</text>
  <text x="716" y="547" font-size="11.5" fill="#733428">④ 循环等待</text>
  <text x="860" y="547" font-size="11.5" fill="#4A473F">成本最低，但要人人遵守</text>

  <line x1="68" y1="558" x2="1172" y2="558" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="579" font-size="11.5" font-weight="700" fill="#24473F">std::scoped_lock</text>
  <text x="288" y="579" font-size="11.5" fill="#4A473F">一次性锁多把，要么全拿、要么全不拿</text>
  <text x="716" y="579" font-size="11.5" fill="#4A473F">② 持有并等待</text>
  <text x="860" y="579" font-size="11.5" font-weight="700" fill="#24473F">Modern C++ 首选，无窗口</text>

  <line x1="68" y1="590" x2="1172" y2="590" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="611" font-size="11.5" font-weight="700" fill="#6B4E28">try_lock + 回退</text>
  <text x="288" y="611" font-size="11.5" fill="#4A473F">拿不到就放掉已持有的，退避后重试</text>
  <text x="716" y="611" font-size="11.5" fill="#4A473F">③ 不可剥夺</text>
  <text x="860" y="611" font-size="11.5" fill="#733428">退避不随机会变活锁（2.4）</text>

  <line x1="68" y1="622" x2="1172" y2="622" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="643" font-size="11.5" font-weight="700" fill="#6B4E28">超时放弃</text>
  <text x="288" y="643" font-size="11.5" fill="#4A473F">timed_mutex / pthread_mutex_timedlock</text>
  <text x="716" y="643" font-size="11.5" fill="#4A473F">② 持有并等待</text>
  <text x="860" y="643" font-size="11.5" fill="#4A473F">失败分支必须自己写好</text>

  <line x1="68" y1="654" x2="1172" y2="654" stroke="#D8D5C8" stroke-width="1"/>

  <text x="48" y="690" font-size="11.5" fill="#4A473F">表里没有破坏「① 互斥」的行 —— 那等于不要锁了。可选的入口只有 ②③④ 三条。</text>
  <text x="48" y="710" font-size="11.5" fill="#4A473F">死锁依赖特定时序、生产环境难复现，所以预防胜于检测：先用 scoped_lock 和统一顺序把它设计掉（2.3）。</text>
</svg>
