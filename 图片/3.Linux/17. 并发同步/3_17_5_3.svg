<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 810" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="810" fill="#F5F4ED"/>

  <title>CAS 循环更新范式，以及 weak 与 strong 的取舍</title>
  <desc>左侧是读、算、带条件写、失败回边的四步流程，右侧是对应的模板代码；下半是 weak 与 strong 的对照表和伪失败的来源。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">CAS 循环范式：读 → 算 → 带条件地写，失败就换最新值重算</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">compare_exchange 失败时会把 expected 改写成内存当前值，所以循环体里不必再 load 一次</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 任何「读-改-写」都能改写成这四步</text>

  <rect x="56" y="124" width="560" height="390" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="96" y="148" width="300" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="246" y="172" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① expected = a.load()</text>
  <text x="246" y="192" font-size="10.5" fill="#2C4460" text-anchor="middle">取一份当下的快照</text>

  <rect x="96" y="228" width="300" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="246" y="252" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">② desired = f(expected)</text>
  <text x="246" y="272" font-size="10.5" fill="#2C4460" text-anchor="middle">在本地算，不碰共享变量</text>

  <polygon points="246,306 366,358 246,410 126,358" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.6"/>
  <text x="246" y="352" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">③ 内存值仍等于</text>
  <text x="246" y="372" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">expected 吗</text>

  <rect x="96" y="436" width="300" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="246" y="460" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">④ 写入 desired，退出</text>
  <text x="246" y="480" font-size="10.5" fill="#24473F" text-anchor="middle">这一次更新才算生效</text>

  <line x1="246" y1="202" x2="246" y2="224" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="246" y1="282" x2="246" y2="302" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="246" y1="410" x2="246" y2="432" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="262" y="426" font-size="11" font-weight="700" fill="#2F6B5E">是</text>

  <path d="M366,358 L444,358 L444,175 L400,175" fill="none" stroke="#A64B3C" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="458" y="302" font-size="11.5" font-weight="700" fill="#A64B3C">否 · 别人抢先改过</text>
  <text x="458" y="324" font-size="10.5" fill="#A64B3C">expected 已被刷新</text>
  <text x="458" y="346" font-size="10.5" fill="#A64B3C">直接重算，不必 load</text>
  <text x="458" y="368" font-size="10.5" fill="#A64B3C">失败即别人成功了</text>

  <rect x="648" y="124" width="536" height="390" rx="8" fill="#2B2B28" stroke="#4A473F" stroke-width="1"/>
  <text xml:space="preserve" x="670" y="152" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#7FB0E0">template &lt;class T, class F&gt;</text>
  <text xml:space="preserve" x="670" y="173" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#C8C8C0">void atomic_update(std::atomic&lt;T&gt;&amp; a, F f) {</text>
  <text xml:space="preserve" x="670" y="194" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#C8C8C0">    T expected = a.load(</text>
  <text xml:space="preserve" x="670" y="215" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#C8C8C0">        std::memory_order_relaxed);</text>
  <text xml:space="preserve" x="670" y="236" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#C8C8C0">    T desired;</text>
  <text xml:space="preserve" x="670" y="257" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#E0A85F">    do {</text>
  <text xml:space="preserve" x="670" y="278" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#C8C8C0">        desired = f(expected);</text>
  <text xml:space="preserve" x="670" y="299" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#E0A85F">    } while (!a.compare_exchange_weak(</text>
  <text xml:space="preserve" x="670" y="320" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#C8C8C0">                 expected, desired,</text>
  <text xml:space="preserve" x="670" y="341" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#C8C8C0">                 std::memory_order_release,</text>
  <text xml:space="preserve" x="670" y="362" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#C8C8C0">                 std::memory_order_relaxed));</text>
  <text xml:space="preserve" x="670" y="383" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#C8C8C0">}</text>

  <line x1="670" y1="404" x2="1162" y2="404" stroke="#4A473F" stroke-width="1"/>
  <text xml:space="preserve" x="670" y="430" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8FA98F">// release：成功时发布本次修改</text>
  <text xml:space="preserve" x="670" y="452" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8FA98F">// relaxed：失败时只是重新读一遍</text>
  <text xml:space="preserve" x="670" y="474" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8FA98F">// 循环体里没有 load，靠 expected</text>
  <text xml:space="preserve" x="670" y="496" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8FA98F">// 被自动刷新拿到最新基准</text>

  <!-- ===== B 区 ===== -->
  <text x="48" y="550" font-size="14" font-weight="700" fill="#4A473F">B · weak 与 strong：差别只在「值相等也可能失败」</text>

  <rect x="56" y="562" width="700" height="178" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="584" font-size="12" font-weight="700" fill="#4A473F">两个版本的取舍</text>

  <rect x="68" y="594" width="676" height="26" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="612" font-size="11" font-weight="700" fill="#4A473F">维度</text>
  <text x="240" y="612" font-size="11" font-weight="700" fill="#4A473F">_strong</text>
  <text x="500" y="612" font-size="11" font-weight="700" fill="#4A473F">_weak</text>

  <text x="80" y="638" font-size="11" fill="#4A473F">值匹配时</text>
  <text x="240" y="638" font-size="11" fill="#4A473F">一定成功</text>
  <text x="500" y="638" font-size="11" fill="#733428">可能伪失败</text>
  <line x1="68" y1="646" x2="744" y2="646" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="664" font-size="11" fill="#4A473F">对底层</text>
  <text x="240" y="664" font-size="11" fill="#4A473F">屏蔽 LL/SC 伪失败</text>
  <text x="500" y="664" font-size="11" fill="#4A473F">直接暴露 LL/SC</text>
  <line x1="68" y1="672" x2="744" y2="672" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="690" font-size="11" fill="#4A473F">单次开销</text>
  <text x="240" y="690" font-size="11" fill="#4A473F">多一层重试包装</text>
  <text x="500" y="690" font-size="11" fill="#24473F">更低</text>
  <line x1="68" y1="698" x2="744" y2="698" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="716" font-size="11" fill="#4A473F">该用在</text>
  <text x="240" y="716" font-size="11" fill="#4A473F">循环之外的单次判断</text>
  <text x="500" y="716" font-size="11" font-weight="700" fill="#24473F">循环体内</text>

  <rect x="776" y="562" width="408" height="178" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="790" y="584" font-size="12" font-weight="700" fill="#4A473F">伪失败从哪来</text>

  <text x="790" y="610" font-size="11" fill="#4A473F">ARM / PowerPC 靠 LL/SC 实现 CAS</text>
  <text x="790" y="632" font-size="11" fill="#4A473F">缓存行被别的核碰过，SC 就会失败</text>
  <text x="790" y="654" font-size="11" fill="#4A473F">此时值其实没变，只是被打断了</text>

  <rect x="788" y="668" width="384" height="30" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="800" y="688" font-size="11" font-weight="700" fill="#24473F">循环本来就要重试 → 循环里用 weak</text>

  <text x="790" y="722" font-size="11" fill="#4A473F">x86 上两者生成的代码基本一致</text>

  <text x="48" y="768" font-size="11.5" fill="#4A473F">本质：把「读-改-写」的最后一步换成带前置条件的原子写，条件不成立就整段重来。</text>
  <text x="48" y="790" font-size="11.5" fill="#4A473F">这就是 lock-free：CAS 失败说明别人成功了，系统整体在推进，但本线程可能一直重试。</text>
</svg>
