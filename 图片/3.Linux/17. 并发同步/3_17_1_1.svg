<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <title id="title">并发问题的危险三角</title>
  <desc id="desc">共享、可变、并发访问三个条件同时满足时才会产生数据竞争，三圆交集处为出问题的区域。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      .title { font: 700 27px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .ring  { font: 700 22px "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub   { font: 500 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #455a64; }
      .core  { font: 700 21px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b71c1c; }
      .coreSub { font: 600 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #c0392b; }
      .cap   { font: 500 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #37474f; }
    </style>
  </defs>

  <text class="title" x="450" y="48" text-anchor="middle">并发问题的「危险三角」</text>
  <text class="cap" x="450" y="80" text-anchor="middle">共享 ∧ 可变 ∧ 并发访问 —— 三者同时成立才会出问题</text>

  <!-- circles -->
  <circle cx="450" cy="280" r="165" fill="#4f7b58" fill-opacity="0.32" stroke="#4f7b58" stroke-width="2.5"/>
  <circle cx="360" cy="430" r="165" fill="#42677c" fill-opacity="0.32" stroke="#42677c" stroke-width="2.5"/>
  <circle cx="540" cy="430" r="165" fill="#b07d37" fill-opacity="0.32" stroke="#b07d37" stroke-width="2.5"/>

  <!-- ring labels -->
  <text class="ring" x="450" y="165" text-anchor="middle" fill="#33543b">共享 Shared</text>
  <text class="sub"  x="450" y="190" text-anchor="middle">全局变量 / 堆对象 / 共享内存</text>

  <text class="ring" x="250" y="500" text-anchor="middle" fill="#33495a">可变 Mutable</text>
  <text class="sub"  x="250" y="524" text-anchor="middle">存在写操作</text>

  <text class="ring" x="650" y="500" text-anchor="middle" fill="#7a5520">并发 Concurrent</text>
  <text class="sub"  x="650" y="524" text-anchor="middle">多执行流同时访问</text>

  <!-- core intersection -->
  <text class="core" x="450" y="372" text-anchor="middle">数据竞争</text>
  <text class="coreSub" x="450" y="396" text-anchor="middle">Race Condition</text>
</svg>
