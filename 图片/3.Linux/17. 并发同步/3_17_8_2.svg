<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 848" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="848" fill="#F5F4ED"/>

  <title>双重检查锁定的重排隐患与三种正确的单例写法</title>
  <desc>上半把 new 表达式拆成分配、构造、发布指针三步，展示重排后线程 B 在危险窗口内读到非空但未构造完的对象；下半是 magic static、call_once、atomic 配 release/acquire 三种正确写法的对照。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">双重检查锁定为什么会翻车：new 的三步之间没人保证顺序</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">指针先被写出去、对象后构造完，另一个线程就会拿到一个非空却还没成形的对象</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 一行 new，三件事，允许被重排</text>

  <rect x="56" y="124" width="1128" height="330" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="76" y="148" width="340" height="286" rx="8" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="246" y="172" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">源码一行，机器做三件事</text>

  <rect x="92" y="184" width="308" height="30" rx="6" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="246" y="204" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">instance = new Singleton();</text>

  <rect x="92" y="228" width="308" height="54" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="246" y="250" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">① 分配一块 raw 内存</text>
  <text x="246" y="270" font-size="10" fill="#2C4460" text-anchor="middle">operator new，此刻还没有对象</text>

  <rect x="92" y="292" width="308" height="54" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="246" y="314" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">② 在这块内存上跑构造函数</text>
  <text x="246" y="334" font-size="10" fill="#2C4460" text-anchor="middle">成员这时候才被初始化</text>

  <rect x="92" y="356" width="308" height="54" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="246" y="378" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">③ 把地址写进 instance</text>
  <text x="246" y="398" font-size="10" fill="#2C4460" text-anchor="middle">一次普通的指针写，没有屏障</text>

  <text x="246" y="426" font-size="10" fill="#733428" text-anchor="middle">② 和 ③ 之间没有数据依赖，可以对调</text>

  <rect x="436" y="148" width="736" height="286" rx="8" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="452" y="172" font-size="12" font-weight="700" fill="#733428">重排之后：③ 跑到了 ② 前面</text>

  <rect x="452" y="186" width="704" height="56" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="466" y="219" font-size="10.5" font-weight="700" fill="#4A473F">线程 A</text>
  <rect x="452" y="254" width="704" height="56" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="466" y="287" font-size="10.5" font-weight="700" fill="#4A473F">线程 B</text>

  <rect x="524" y="196" width="120" height="36" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="584" y="219" font-size="10.5" fill="#2C4460" text-anchor="middle">① 分配内存</text>
  <rect x="664" y="196" width="164" height="36" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="746" y="219" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">③ 写 instance 指针</text>
  <rect x="960" y="196" width="164" height="36" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1042" y="219" font-size="10.5" fill="#2C4460" text-anchor="middle">② 构造函数这时才跑</text>

  <rect x="672" y="264" width="130" height="36" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="737" y="287" font-size="10.5" fill="#6B4E28" text-anchor="middle">if 判空通过</text>
  <rect x="812" y="264" width="134" height="36" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="879" y="287" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">解引用 → UB</text>

  <rect x="656" y="190" width="298" height="126" fill="#A64B3C" fill-opacity="0.09" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="805" y="334" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">危险窗口：指针已非空，对象还没构造完</text>

  <line x1="470" y1="352" x2="1150" y2="352" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1120" y="344" font-size="10" fill="#6B675C">时间</text>

  <text x="452" y="380" font-size="10.5" fill="#4A473F">单线程看不出任何差别，所以编译器和 CPU 都有权这么排</text>
  <text x="452" y="402" font-size="10.5" fill="#4A473F">加锁也救不了：线程 B 的第一次判空本来就在锁外面</text>
  <text x="452" y="424" font-size="10.5" font-weight="700" fill="#733428">缺的不是互斥，是「构造完成」与「指针可见」之间的顺序</text>

  <text x="48" y="488" font-size="14" font-weight="700" fill="#4A473F">B · 三种正确写法，优先级从左到右递减</text>

  <rect x="56" y="500" width="1128" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="68" y="522" width="352" height="182" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <rect x="330" y="530" width="80" height="20" rx="4" fill="#2F6B5E"/>
  <text x="370" y="545" font-size="10" font-weight="700" fill="#FBFBF6" text-anchor="middle">首选</text>
  <text x="84" y="546" font-size="11.5" font-weight="700" fill="#24473F">magic static</text>
  <text x="84" y="570" font-size="10.5" font-weight="700" fill="#24473F">static Singleton inst;</text>
  <text x="84" y="594" font-size="10.5" fill="#24473F">C++11 起标准保证只初始化一次</text>
  <text x="84" y="616" font-size="10.5" fill="#24473F">编译器生成 guard 变量，之后只是一次读</text>
  <text x="84" y="638" font-size="10.5" fill="#24473F">析构顺序也由标准管，不必自己 delete</text>
  <text x="84" y="660" font-size="10.5" fill="#24473F">代码最短，同步开销几乎为零</text>
  <text x="84" y="686" font-size="10" fill="#6B675C">限制：初始化必须写在函数体内</text>

  <rect x="444" y="522" width="352" height="182" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="460" y="546" font-size="11.5" font-weight="700" fill="#2C4460">std::call_once</text>
  <text x="460" y="570" font-size="10.5" font-weight="700" fill="#2C4460">std::call_once(flag, init);</text>
  <text x="460" y="594" font-size="10.5" fill="#2C4460">同样保证全程只跑一次</text>
  <text x="460" y="616" font-size="10.5" fill="#2C4460">init 抛异常时，下一个线程会重试</text>
  <text x="460" y="638" font-size="10.5" fill="#2C4460">适合初始化逻辑不方便塞进函数静态</text>
  <text x="460" y="660" font-size="10.5" fill="#2C4460">once_flag 要和被保护的对象同生命周期</text>
  <text x="460" y="686" font-size="10" fill="#6B675C">开销略高：一次原子读 + 偶尔走慢路径</text>

  <rect x="820" y="522" width="352" height="182" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <rect x="1042" y="530" width="120" height="20" rx="4" fill="#8A6A3A"/>
  <text x="1102" y="545" font-size="10" font-weight="700" fill="#FBFBF6" text-anchor="middle">没必要别写</text>
  <text x="836" y="546" font-size="11.5" font-weight="700" fill="#6B4E28">手写 DCLP</text>
  <text x="836" y="570" font-size="10.5" font-weight="700" fill="#6B4E28">std::atomic&lt;Singleton*&gt; p;</text>
  <text x="836" y="594" font-size="10.5" fill="#6B4E28">写侧 p.store(q, memory_order_release)</text>
  <text x="836" y="616" font-size="10.5" fill="#6B4E28">读侧 p.load(memory_order_acquire)</text>
  <text x="836" y="638" font-size="10.5" fill="#6B4E28">release 把 ② 钉在 ③ 之前</text>
  <text x="836" y="660" font-size="10.5" fill="#6B4E28">acquire 保证读到指针就读得到构造结果</text>
  <text x="836" y="686" font-size="10" fill="#733428">少写一个内存序，就退回上半张图的 UB</text>

  <text x="48" y="784" font-size="11.5" fill="#4A473F">三种写法本质相同：都是在「对象构造完」和「别人看见指针」之间插一道顺序约束，只是谁来插的区别。</text>
  <text x="48" y="806" font-size="11.5" fill="#4A473F">volatile 不解决这个问题——它约束的是编译器对该变量的优化，不提供跨线程的可见性与顺序保证。</text>
  <text x="48" y="828" font-size="11.5" fill="#4A473F">同一道理适用于任何「先建对象、再发布指针」的场景，单例只是最常被写错的那个例子。</text>
</svg>
