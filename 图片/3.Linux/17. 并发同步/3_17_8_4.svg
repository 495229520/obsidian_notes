<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 858" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="858" fill="#F5F4ED"/>

  <title>伪共享：一条 cache line 的字节账与所有权来回</title>
  <desc>上半用 64 字节的字节条画出默认布局下八个计数器挤在同一条 cache line 里，以及 alignas(64) 之后各占一行；下半是同一条行的所有权在两核之间来回搬的时间条，以及定位手段与对策。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">伪共享：代码里没有共享，硬件层面共享了同一条 cache line</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">缓存一致性的最小单位是一整行 64 字节，不是单个变量；同行不同字节，在硬件看来一样要抢</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 把字节数摆出来：8 个 long 正好塞满一条行</text>

  <rect x="56" y="124" width="1128" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="68" y="146" width="552" height="266" rx="7" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="82" y="170" font-size="12" font-weight="700" fill="#733428">默认布局 · sizeof(Counter) = 8</text>
  <text x="82" y="190" font-size="10" fill="#6B675C">struct Counter { std::atomic&lt;long&gt; n; };</text>
  <text x="302" y="190" font-size="10" fill="#6B675C">Counter c[8];</text>

  <rect x="88" y="202" width="512" height="44" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.4"/>
  <rect x="88" y="202" width="64" height="44" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.6"/>
  <rect x="152" y="202" width="64" height="44" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.6"/>
  <line x1="216" y1="202" x2="216" y2="246" stroke="#9B968A" stroke-width="0.9"/>
  <line x1="280" y1="202" x2="280" y2="246" stroke="#9B968A" stroke-width="0.9"/>
  <line x1="344" y1="202" x2="344" y2="246" stroke="#9B968A" stroke-width="0.9"/>
  <line x1="408" y1="202" x2="408" y2="246" stroke="#9B968A" stroke-width="0.9"/>
  <line x1="472" y1="202" x2="472" y2="246" stroke="#9B968A" stroke-width="0.9"/>
  <line x1="536" y1="202" x2="536" y2="246" stroke="#9B968A" stroke-width="0.9"/>

  <text x="120" y="222" font-size="10" font-weight="700" fill="#2C4460" text-anchor="middle">c[0].n</text>
  <text x="120" y="238" font-size="9.5" fill="#2C4460" text-anchor="middle">核 0 写</text>
  <text x="184" y="222" font-size="10" font-weight="700" fill="#6B4E28" text-anchor="middle">c[1].n</text>
  <text x="184" y="238" font-size="9.5" fill="#6B4E28" text-anchor="middle">核 1 写</text>
  <text x="248" y="228" font-size="10" fill="#4A473F" text-anchor="middle">c[2]</text>
  <text x="312" y="228" font-size="10" fill="#4A473F" text-anchor="middle">c[3]</text>
  <text x="376" y="228" font-size="10" fill="#4A473F" text-anchor="middle">c[4]</text>
  <text x="440" y="228" font-size="10" fill="#4A473F" text-anchor="middle">c[5]</text>
  <text x="504" y="228" font-size="10" fill="#4A473F" text-anchor="middle">c[6]</text>
  <text x="568" y="228" font-size="10" fill="#4A473F" text-anchor="middle">c[7]</text>

  <text x="88" y="262" font-size="9.5" fill="#6B675C" text-anchor="middle">0</text>
  <text x="216" y="262" font-size="9.5" fill="#6B675C" text-anchor="middle">16</text>
  <text x="344" y="262" font-size="9.5" fill="#6B675C" text-anchor="middle">32</text>
  <text x="472" y="262" font-size="9.5" fill="#6B675C" text-anchor="middle">48</text>
  <text x="600" y="262" font-size="9.5" fill="#6B675C" text-anchor="middle">64 B</text>

  <text x="88" y="284" font-size="10.5" font-weight="700" fill="#4A473F">整个数组就在这一条 cache line 里</text>

  <rect x="88" y="296" width="512" height="100" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="102" y="318" font-size="10.5" font-weight="700" fill="#733428">核 0 只碰 c[0]，核 1 只碰 c[1]，代码上毫无共享</text>
  <text x="102" y="340" font-size="10.5" fill="#733428">但一致性协议按整行走：核 0 一写，核 1 那份就作废</text>
  <text x="102" y="362" font-size="10.5" fill="#733428">两个核轮流把行抢过来，谁都留不住</text>
  <text x="102" y="384" font-size="10.5" font-weight="700" fill="#733428">线程越多退化越狠，加核反而更慢</text>

  <rect x="636" y="146" width="536" height="266" rx="7" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="650" y="170" font-size="12" font-weight="700" fill="#24473F">对齐之后 · sizeof(Counter) = 64</text>
  <text x="650" y="190" font-size="10" fill="#6B675C">struct alignas(64) Counter {</text>
  <text x="812" y="190" font-size="10" fill="#6B675C">std::atomic&lt;long&gt; n; };</text>

  <text x="650" y="228" font-size="10" font-weight="700" fill="#4A473F">行 0</text>
  <rect x="700" y="206" width="448" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <rect x="700" y="206" width="56" height="30" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="728" y="226" font-size="9.5" font-weight="700" fill="#2C4460" text-anchor="middle">c[0].n</text>
  <text x="952" y="226" font-size="9.5" fill="#6B675C" text-anchor="middle">填充 56 B</text>

  <text x="650" y="268" font-size="10" font-weight="700" fill="#4A473F">行 1</text>
  <rect x="700" y="246" width="448" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <rect x="700" y="246" width="56" height="30" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="728" y="266" font-size="9.5" font-weight="700" fill="#6B4E28" text-anchor="middle">c[1].n</text>
  <text x="952" y="266" font-size="9.5" fill="#6B675C" text-anchor="middle">填充 56 B</text>

  <text x="650" y="308" font-size="10" font-weight="700" fill="#4A473F">行 2</text>
  <rect x="700" y="286" width="448" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <rect x="700" y="286" width="56" height="30" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.5"/>
  <text x="728" y="306" font-size="9.5" font-weight="700" fill="#4A473F" text-anchor="middle">c[2].n</text>
  <text x="952" y="306" font-size="9.5" fill="#6B675C" text-anchor="middle">填充 56 B</text>

  <rect x="650" y="330" width="498" height="66" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="664" y="352" font-size="10.5" font-weight="700" fill="#24473F">每个计数器独占一条行，写 c[0] 不再让 c[1] 失效</text>
  <text x="664" y="374" font-size="10.5" fill="#24473F">代价是内存 ×8：只对真正的多核热点这么做</text>

  <text x="48" y="458" font-size="14" font-weight="700" fill="#4A473F">B · 慢在哪：同一条行的所有权在两个核之间来回搬</text>

  <rect x="56" y="470" width="1128" height="290" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="68" y="492" width="600" height="256" rx="7" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="82" y="516" font-size="12" font-weight="700" fill="#4A473F">一条行的状态随时间交替</text>

  <rect x="82" y="528" width="574" height="48" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="96" y="557" font-size="10.5" font-weight="700" fill="#2C4460">核 0</text>
  <rect x="176" y="536" width="88" height="32" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="220" y="557" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">M 写 c[0]</text>
  <rect x="268" y="536" width="88" height="32" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="312" y="557" font-size="10.5" fill="#733428" text-anchor="middle">I 失效</text>
  <rect x="360" y="536" width="88" height="32" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="404" y="557" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">M 抢回来</text>
  <rect x="452" y="536" width="88" height="32" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="496" y="557" font-size="10.5" fill="#733428" text-anchor="middle">I 失效</text>
  <rect x="544" y="536" width="88" height="32" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="588" y="557" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">M 抢回来</text>

  <rect x="82" y="586" width="574" height="48" rx="6" fill="#F1EFE8" stroke="#D8D5C8" stroke-width="1"/>
  <text x="96" y="615" font-size="10.5" font-weight="700" fill="#6B4E28">核 1</text>
  <rect x="176" y="594" width="88" height="32" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="220" y="615" font-size="10.5" fill="#733428" text-anchor="middle">I 失效</text>
  <rect x="268" y="594" width="88" height="32" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="312" y="615" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">M 写 c[1]</text>
  <rect x="360" y="594" width="88" height="32" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="404" y="615" font-size="10.5" fill="#733428" text-anchor="middle">I 失效</text>
  <rect x="452" y="594" width="88" height="32" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="496" y="615" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">M 写 c[1]</text>
  <rect x="544" y="594" width="88" height="32" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="588" y="615" font-size="10.5" fill="#733428" text-anchor="middle">I 失效</text>

  <line x1="176" y1="646" x2="640" y2="646" stroke="#5A564B" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="96" y="650" font-size="10" fill="#6B675C">时间</text>

  <text x="82" y="678" font-size="10.5" fill="#4A473F">两条泳道永远互补：一个核处于 M，另一个必然是 I</text>
  <text x="82" y="700" font-size="10.5" fill="#4A473F">本该是各写各的本地自增，实际每次都要跨核往返一趟</text>
  <text x="82" y="722" font-size="10.5" font-weight="700" fill="#733428">一次往返几十到上百纳秒【量级】，而本地自增只有几纳秒</text>

  <rect x="684" y="492" width="488" height="256" rx="7" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="698" y="516" font-size="12" font-weight="700" fill="#4A473F">怎么发现，怎么修</text>

  <rect x="698" y="528" width="460" height="62" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="712" y="548" font-size="10.5" font-weight="700" fill="#6B4E28">① 现象</text>
  <text x="712" y="568" font-size="10.5" fill="#6B4E28">加线程不提速甚至更慢，扩展性曲线早早压平</text>
  <text x="712" y="584" font-size="10" fill="#6B675C">热点常常是一句看起来平平无奇的自增</text>

  <rect x="698" y="600" width="460" height="62" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="712" y="620" font-size="10.5" font-weight="700" fill="#2C4460">② 确认</text>
  <text x="712" y="640" font-size="10.5" fill="#2C4460">perf c2c 看 HITM，能直接定位到冲突的那条行</text>
  <text x="712" y="656" font-size="10" fill="#6B675C">土办法：把变量间距拉开到 64 B，对比前后吞吐</text>

  <rect x="698" y="672" width="460" height="62" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="712" y="692" font-size="10.5" font-weight="700" fill="#24473F">③ 对策</text>
  <text x="712" y="712" font-size="10.5" fill="#24473F">alignas(64)、手工 padding，或每线程私有最后汇总</text>
  <text x="712" y="728" font-size="10" fill="#6B675C">优先第三种：不共享比对齐更彻底，也不浪费内存</text>

  <text x="48" y="790" font-size="11.5" fill="#4A473F">伪共享隐蔽在于：源码层面两个线程确实各写各的变量，任何数据竞争检查工具都不会报警。</text>
  <text x="48" y="812" font-size="11.5" fill="#4A473F">别无差别地给所有结构加 alignas(64)——只有确实被多核高频写的字段值得付这笔内存代价。</text>
  <text x="48" y="834" font-size="11.5" fill="#4A473F">这也是上一张图里读写锁在读极多时会失速的原因：共享计数就是一个被所有核反复写的热点字段。</text>
</svg>
