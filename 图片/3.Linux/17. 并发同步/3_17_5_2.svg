<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#F5F4ED"/>

  <title>版本号乐观锁：两个事务读到同一版本，只有先提交者能写入</title>
  <desc>上半是 T1 与 T2 并发改同一行的时序，中列跟踪共享行的 version；下半把一条 UPDATE 拆成读、比较、交换三件事，并与 CAS 逐项对应。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">版本号乐观锁：都读到 version=5，只有先提交的那个写得进去</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">后到者不是被阻塞在门外，而是提交后发现「影响 0 行」，自己拿最新版本重来一遍</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 两个事务并发改同一行的时序</text>

  <rect x="56" y="124" width="480" height="34" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="296" y="146" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">事务 T1</text>

  <rect x="704" y="124" width="480" height="34" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="944" y="146" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">事务 T2</text>

  <text x="620" y="146" font-size="11" fill="#6B675C" text-anchor="middle">数据库行 · version</text>
  <line x1="620" y1="162" x2="620" y2="474" stroke="#BBBAB2" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 行 1：两边都读到 v=5 -->
  <rect x="76" y="174" width="440" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="296" y="198" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 读 value=100 · version=5</text>
  <text x="296" y="218" font-size="10.5" fill="#2C4460" text-anchor="middle">全程不加锁，只把版本记下来</text>

  <rect x="724" y="174" width="440" height="56" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="944" y="198" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">① 读 value=100 · version=5</text>
  <text x="944" y="218" font-size="10.5" fill="#6B4E28" text-anchor="middle">读到与 T1 完全相同的快照</text>

  <rect x="556" y="186" width="128" height="32" rx="6" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.2"/>
  <text x="620" y="207" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">v = 5</text>

  <!-- 行 2：T1 提交成功 -->
  <rect x="76" y="254" width="440" height="60" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="296" y="278" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">② 提交：SET version=6</text>
  <text x="296" y="299" font-size="10.5" fill="#24473F" text-anchor="middle">WHERE version=5 → 影响 1 行 ✓</text>

  <line x1="516" y1="284" x2="552" y2="284" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <rect x="556" y="268" width="128" height="32" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="620" y="289" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">v = 6</text>

  <!-- 行 3：T2 提交失败 -->
  <rect x="724" y="338" width="440" height="60" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="2"/>
  <text x="944" y="362" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">③ 提交：WHERE version=5</text>
  <text x="944" y="383" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">→ 影响 0 行 ✗，版本已经是 6</text>

  <line x1="688" y1="368" x2="720" y2="368" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrR)"/>
  <rect x="584" y="334" width="72" height="17" fill="#F5F4ED"/>
  <text x="620" y="347" font-size="10.5" font-weight="700" fill="#A64B3C" text-anchor="middle">v=6 ≠ 5</text>

  <!-- 行 4：T2 重试 -->
  <path d="M944,398 L944,414" fill="none" stroke="#8A6A3A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <rect x="724" y="418" width="440" height="56" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="944" y="442" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">④ 重读 version=6 后重算</text>
  <text x="944" y="462" font-size="10.5" fill="#6B4E28" text-anchor="middle">带着新版本再走一遍 ↺</text>

  <text x="76" y="352" font-size="11" fill="#4A473F">T1 没做任何额外的事，它只是先到</text>
  <text x="76" y="374" font-size="11" fill="#4A473F">冲突的代价全部落在后到者身上</text>

  <!-- ===== B 区 ===== -->
  <text x="48" y="514" font-size="14" font-weight="700" fill="#4A473F">B · 一条 UPDATE 干了三件事，它和 CAS 是同一回事</text>

  <rect x="56" y="526" width="640" height="192" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="548" font-size="12" font-weight="700" fill="#4A473F">拆开看</text>

  <rect x="68" y="558" width="616" height="26" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="576" font-size="11" font-weight="700" fill="#4A473F">SQL 片段</text>
  <text x="352" y="576" font-size="11" font-weight="700" fill="#4A473F">承担的角色</text>

  <text x="80" y="602" font-size="11" fill="#4A473F">SELECT value, version</text>
  <text x="352" y="602" font-size="11" fill="#4A473F">乐观地读，不上任何锁</text>
  <line x1="68" y1="610" x2="684" y2="610" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="628" font-size="11" fill="#4A473F">WHERE version = 旧值</text>
  <text x="352" y="628" font-size="11" fill="#2C4460">比较：期间没人动过吗</text>
  <line x1="68" y1="636" x2="684" y2="636" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="654" font-size="11" fill="#4A473F">SET value=?, version+1</text>
  <text x="352" y="654" font-size="11" fill="#24473F">交换：成立才写并推进</text>
  <line x1="68" y1="662" x2="684" y2="662" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="680" font-size="11" fill="#733428">影响行数 = 0</text>
  <text x="352" y="680" font-size="11" fill="#733428">比较失败，本次作废</text>
  <line x1="68" y1="688" x2="684" y2="688" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="706" font-size="11" fill="#4A473F">重读后重算再提交</text>
  <text x="352" y="706" font-size="11" fill="#4A473F">等价于 CAS 循环下一轮</text>

  <rect x="728" y="526" width="456" height="192" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="742" y="548" font-size="12" font-weight="700" fill="#4A473F">与 CAS 的逐项对应</text>

  <rect x="742" y="560" width="170" height="40" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="827" y="585" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">version 旧值</text>
  <line x1="920" y1="580" x2="966" y2="580" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="974" y="560" width="196" height="40" rx="6" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1072" y="585" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">expected</text>

  <rect x="742" y="612" width="170" height="40" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="827" y="637" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">算出的新 value</text>
  <line x1="920" y1="632" x2="966" y2="632" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="974" y="612" width="196" height="40" rx="6" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1072" y="637" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">desired</text>

  <rect x="742" y="664" width="170" height="40" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="827" y="689" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">影响 0 行</text>
  <line x1="920" y1="684" x2="966" y2="684" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrR)"/>
  <rect x="974" y="664" width="196" height="40" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="1072" y="689" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">返回 false</text>

  <text x="48" y="746" font-size="11.5" fill="#4A473F">WHERE 里必须带上版本列；漏掉它，UPDATE 就退化成无条件覆盖，冲突会被静默吞掉。</text>
  <text x="48" y="768" font-size="11.5" fill="#4A473F">数据库把「比较」和「写入」压进同一条语句，这正是 CAS 在数据层的等价物。</text>
</svg>
