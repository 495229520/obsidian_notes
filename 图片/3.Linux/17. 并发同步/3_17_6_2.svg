<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470">
  <rect x="0" y="0" width="940" height="470" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>SPSC 环形缓冲：head/tail 下标与 acquire-release 配对</title>
  <desc>单生产者单消费者环形缓冲，生产者用 release 发布 tail，消费者用 acquire 读取 tail，保证数据先写后见。</desc>

  <text x="470" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    SPSC 环形缓冲：head / tail 下标与 acquire-release 配对
  </text>
  <text x="470" y="56" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">
    单写单读，无需 CAS；仅靠一对 acquire/release 即可正确同步
  </text>

  <!-- 环形缓冲数组容器 -->
  <rect x="80" y="150" width="780" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <!-- 8 个槽位分隔线 -->
  <line x1="177.5" y1="150" x2="177.5" y2="210" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="275" y1="150" x2="275" y2="210" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="372.5" y1="150" x2="372.5" y2="210" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="470" y1="150" x2="470" y2="210" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="567.5" y1="150" x2="567.5" y2="210" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="665" y1="150" x2="665" y2="210" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="762.5" y1="150" x2="762.5" y2="210" stroke="#5F5E5A" stroke-width="0.5"/>
  <!-- 占用槽位标记（cell 2..5） -->
  <text x="323.75" y="180" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">数据</text>
  <text x="421.25" y="180" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">数据</text>
  <text x="518.75" y="180" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">数据</text>
  <text x="616.25" y="180" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">数据</text>
  <!-- 下标 -->
  <text x="128.75" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">0</text>
  <text x="226.25" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">1</text>
  <text x="323.75" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">2</text>
  <text x="421.25" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">3</text>
  <text x="518.75" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">4</text>
  <text x="616.25" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">5</text>
  <text x="713.75" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">6</text>
  <text x="811.25" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">7（回绕→0）</text>

  <!-- head 指针 -->
  <text x="323.75" y="108" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#854F0B">head（读取位）</text>
  <path d="M323.75 120 L323.75 150" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- tail 指针 -->
  <text x="665" y="108" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#185FA5">tail（写入位）</text>
  <path d="M665 120 L665 150" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 生产者 -->
  <rect x="80" y="300" width="360" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="260" y="322" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">生产者（单写）</text>
  <text x="260" y="346" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">① 写入槽位 buffer[tail]</text>
  <text x="260" y="368" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">② tail.store(next, release)</text>

  <!-- 消费者 -->
  <rect x="508" y="300" width="352" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="684" y="322" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">消费者（单读）</text>
  <text x="684" y="346" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">① tail.load(acquire)</text>
  <text x="684" y="368" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">② 读取槽位 buffer[head]</text>

  <path d="M440 342 L508 342" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="474" y="328" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#0F6E56">happens-before</text>

  <text x="470" y="424" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    release 配对 acquire：消费者读到新 tail 时，槽位数据必已写完，绝不会读到半成品
  </text>
</svg>
