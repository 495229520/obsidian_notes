<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 892" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="892" fill="#F5F4ED"/>

  <title>SPSC 环形缓冲：两拍发布与 acquire-release 配对</title>
  <desc>上半是八格环形数组的当前状态与 head、tail 指向；中间是生产者与消费者各四步的顺序，release 与 acquire 配对建立 happens-before；下半是判空判满的下标关系与两个工程细节。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">SPSC 环形缓冲：先写数据再发布下标，读者顺序相反</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">单写单读没有写写冲突，因此完全不需要 CAS；一对 acquire / release 就够用</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 环形数组此刻的样子</text>

  <rect x="56" y="124" width="1128" height="210" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="146" font-size="12" font-weight="700" fill="#4A473F">buffer[N]，N = 8</text>

  <text x="455" y="172" font-size="11.5" font-weight="700" fill="#8A6A3A" text-anchor="middle">head · 下次读这格</text>
  <line x1="455" y1="180" x2="455" y2="194" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="895" y="172" font-size="11.5" font-weight="700" fill="#3D5A80" text-anchor="middle">tail · 下次写这格</text>
  <line x1="895" y1="180" x2="895" y2="194" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrB)"/>

  <rect x="180" y="196" width="220" height="60" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="290" y1="196" x2="290" y2="256" stroke="#9B968A" stroke-width="0.8"/>
  <text x="235" y="232" font-size="11" fill="#6B675C" text-anchor="middle">已读走</text>
  <text x="345" y="232" font-size="11" fill="#6B675C" text-anchor="middle">已读走</text>

  <rect x="400" y="196" width="440" height="60" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <line x1="510" y1="196" x2="510" y2="256" stroke="#2F6B5E" stroke-width="0.8"/>
  <line x1="620" y1="196" x2="620" y2="256" stroke="#2F6B5E" stroke-width="0.8"/>
  <line x1="730" y1="196" x2="730" y2="256" stroke="#2F6B5E" stroke-width="0.8"/>
  <text x="455" y="232" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">数据</text>
  <text x="565" y="232" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">数据</text>
  <text x="675" y="232" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">数据</text>
  <text x="785" y="232" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">数据</text>

  <rect x="840" y="196" width="220" height="60" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="950" y1="196" x2="950" y2="256" stroke="#9B968A" stroke-width="0.8"/>
  <text x="895" y="232" font-size="11" fill="#6B675C" text-anchor="middle">空闲</text>
  <text x="1005" y="232" font-size="11" fill="#6B675C" text-anchor="middle">空闲</text>

  <text x="235" y="276" font-size="10.5" fill="#6B675C" text-anchor="middle">0</text>
  <text x="345" y="276" font-size="10.5" fill="#6B675C" text-anchor="middle">1</text>
  <text x="455" y="276" font-size="10.5" fill="#6B675C" text-anchor="middle">2</text>
  <text x="565" y="276" font-size="10.5" fill="#6B675C" text-anchor="middle">3</text>
  <text x="675" y="276" font-size="10.5" fill="#6B675C" text-anchor="middle">4</text>
  <text x="785" y="276" font-size="10.5" fill="#6B675C" text-anchor="middle">5</text>
  <text x="895" y="276" font-size="10.5" fill="#6B675C" text-anchor="middle">6</text>
  <text x="1005" y="276" font-size="10.5" fill="#6B675C" text-anchor="middle">7</text>

  <path d="M1060,226 L1104,226 L1104,306 L136,306 L136,226 L176,226" fill="none" stroke="#9B968A" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="620" y="298" font-size="10.5" fill="#4A473F" text-anchor="middle">下标走到末尾就回绕到 0</text>

  <!-- ===== B 区 ===== -->
  <text x="48" y="364" font-size="14" font-weight="700" fill="#4A473F">B · 两拍发布：写在前，发布在后；读者反过来</text>

  <rect x="56" y="376" width="1128" height="240" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="306" y="400" font-size="12" font-weight="700" fill="#3D5A80" text-anchor="middle">生产者 · push</text>
  <text x="934" y="400" font-size="12" font-weight="700" fill="#8A6A3A" text-anchor="middle">消费者 · pop</text>

  <rect x="96" y="406" width="420" height="38" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="112" y="423" font-size="11" font-weight="700" fill="#2C4460">① t = tail_.load(relaxed)</text>
  <text x="112" y="438" font-size="10" fill="#2C4460">读自己独占的下标，不必同步</text>

  <rect x="96" y="450" width="420" height="38" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="112" y="467" font-size="11" font-weight="700" fill="#2C4460">② (t+1)%N == head_.load(acquire)?</text>
  <text x="112" y="482" font-size="10" fill="#2C4460">判满，相等就返回 false</text>

  <rect x="96" y="494" width="420" height="38" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="112" y="511" font-size="11" font-weight="700" fill="#2C4460">③ buffer_[t] = v</text>
  <text x="112" y="526" font-size="10" fill="#2C4460">普通写，此时还没人能看到</text>

  <rect x="96" y="538" width="420" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="112" y="555" font-size="11" font-weight="700" fill="#24473F">④ tail_.store(next, release)</text>
  <text x="112" y="570" font-size="10" font-weight="700" fill="#24473F">发布：这一步之后数据才算交出去</text>

  <rect x="724" y="406" width="420" height="38" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1"/>
  <text x="740" y="423" font-size="11" font-weight="700" fill="#6B4E28">① h = head_.load(relaxed)</text>
  <text x="740" y="438" font-size="10" fill="#6B4E28">同样是自己独占的下标</text>

  <rect x="724" y="450" width="420" height="38" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="740" y="467" font-size="11" font-weight="700" fill="#24473F">② h == tail_.load(acquire)?</text>
  <text x="740" y="482" font-size="10" font-weight="700" fill="#24473F">判空；读到新 tail 即接住了发布</text>

  <rect x="724" y="494" width="420" height="38" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1"/>
  <text x="740" y="511" font-size="11" font-weight="700" fill="#6B4E28">③ out = buffer_[h]</text>
  <text x="740" y="526" font-size="10" fill="#6B4E28">此时槽位必然已写完</text>

  <rect x="724" y="538" width="420" height="38" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1"/>
  <text x="740" y="555" font-size="11" font-weight="700" fill="#6B4E28">④ head_.store(h+1, release)</text>
  <text x="740" y="570" font-size="10" fill="#6B4E28">腾出格子，反向发布给生产者</text>

  <path d="M516,557 L620,557 L620,469 L720,469" fill="none" stroke="#2F6B5E" stroke-width="2.2" marker-end="url(#arrG)"/>
  <text x="568" y="549" font-size="10.5" font-weight="700" fill="#2F6B5E" text-anchor="middle">release</text>
  <text x="670" y="461" font-size="10.5" font-weight="700" fill="#2F6B5E" text-anchor="middle">acquire</text>
  <text x="628" y="516" font-size="10" font-weight="700" fill="#2F6B5E">happens</text>
  <text x="628" y="530" font-size="10" font-weight="700" fill="#2F6B5E">-before</text>

  <text x="96" y="600" font-size="11" fill="#4A473F">消费者一旦看到新的 tail，③ 那一格的数据必然已经写完 —— 读不到半成品</text>

  <!-- ===== C 区 ===== -->
  <text x="48" y="646" font-size="14" font-weight="700" fill="#4A473F">C · 下标关系，以及两个不该忽略的细节</text>

  <rect x="56" y="658" width="640" height="164" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="680" font-size="12" font-weight="700" fill="#4A473F">只靠两个下标就能判断一切</text>

  <rect x="68" y="688" width="616" height="24" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="704" font-size="10.5" font-weight="700" fill="#4A473F">要判断的事</text>
  <text x="250" y="704" font-size="10.5" font-weight="700" fill="#4A473F">下标关系</text>
  <text x="500" y="704" font-size="10.5" font-weight="700" fill="#4A473F">结果</text>

  <text x="80" y="730" font-size="11" fill="#4A473F">队列空</text>
  <text x="250" y="730" font-size="11" fill="#4A473F">head == tail</text>
  <text x="500" y="730" font-size="11" fill="#4A473F">pop 返回 false</text>
  <line x1="68" y1="738" x2="684" y2="738" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="752" font-size="11" fill="#4A473F">队列满</text>
  <text x="250" y="752" font-size="11" fill="#4A473F">(tail+1)%N == head</text>
  <text x="500" y="752" font-size="11" fill="#4A473F">push 返回 false</text>
  <line x1="68" y1="760" x2="684" y2="760" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="774" font-size="11" fill="#4A473F">可读区间</text>
  <text x="250" y="774" font-size="11" fill="#24473F">head → tail</text>
  <text x="500" y="774" font-size="11" fill="#24473F">图中的 4 项</text>
  <line x1="68" y1="782" x2="684" y2="782" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="796" font-size="11" fill="#733428">为何留一格</text>
  <text x="250" y="796" font-size="11" fill="#733428">否则满与空同形</text>
  <text x="500" y="796" font-size="11" fill="#733428">N 格只装 N-1 项</text>

  <rect x="728" y="658" width="456" height="164" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="742" y="680" font-size="12" font-weight="700" fill="#4A473F">两个工程细节</text>

  <rect x="740" y="688" width="432" height="64" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="754" y="706" font-size="11" font-weight="700" fill="#24473F">为什么可以不用 CAS</text>
  <text x="754" y="724" font-size="10.5" fill="#24473F">tail_ 只被生产者写，head_ 只被消费者写</text>
  <text x="754" y="742" font-size="10.5" fill="#24473F">两端各改各的，没有写写冲突</text>

  <rect x="740" y="762" width="432" height="52" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="754" y="780" font-size="11" font-weight="700" fill="#6B4E28">别忘了缓存行</text>
  <text x="754" y="800" font-size="10.5" fill="#6B4E28">head_ 与 tail_ 挨着放会伪共享，用 alignas(64) 隔开</text>

  <text x="48" y="854" font-size="11.5" fill="#4A473F">正确性全压在 acquire / release 这一对上：把 release 换成 relaxed，消费者就可能读到半成品。</text>
  <text x="48" y="876" font-size="11.5" fill="#4A473F">这些结论只在「恰好一个生产者、恰好一个消费者」时成立；多一个线程就必须改用 CAS 仲裁。</text>
</svg>
