<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 786" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="786" fill="#F5F4ED"/>

  <title>进程间同步为什么更难：状态承载与崩溃善后</title>
  <desc>上半对照同一个 pthread_mutex_t 在线程之间与进程之间的可见性差别；下半是同步状态的三种承载方式，以及持有者崩溃在线程与进程两侧的不同后果。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">进程间同步难在哪：状态无处安放，持有者可能突然消失</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">线程共享地址空间，锁放哪都行；进程各有各的页表，锁必须住在两边都寻址得到的地方</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 同一个 pthread_mutex_t，线程之间通用，进程之间失效</text>

  <rect x="56" y="124" width="1128" height="260" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="76" y="146" width="520" height="216" rx="8" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="336" y="170" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">同一进程内的两个线程</text>

  <rect x="104" y="186" width="170" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="189" y="212" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">线程 1</text>
  <rect x="398" y="186" width="170" height="42" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="483" y="212" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">线程 2</text>

  <line x1="189" y1="228" x2="272" y2="270" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrB)"/>
  <line x1="483" y1="228" x2="400" y2="270" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrB)"/>

  <rect x="200" y="274" width="272" height="56" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="336" y="297" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">pthread_mutex_t @ 0x55f2a0</text>
  <text x="336" y="317" font-size="10" fill="#24473F" text-anchor="middle">堆或全局区，只有一份对象</text>

  <text x="336" y="352" font-size="10.5" fill="#4A473F" text-anchor="middle">同一个地址，落到同一个对象</text>

  <rect x="644" y="146" width="520" height="216" rx="8" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="904" y="170" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">两个进程，各有各的页表</text>

  <rect x="664" y="186" width="232" height="104" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="780" y="206" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">进程 A · 私有地址空间</text>
  <rect x="678" y="216" width="204" height="60" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="780" y="240" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">mutex @ 0x55f2a0</text>
  <text x="780" y="260" font-size="10" fill="#2C4460" text-anchor="middle">A 自己的一页</text>

  <rect x="912" y="186" width="232" height="104" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1028" y="206" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">进程 B · 私有地址空间</text>
  <rect x="926" y="216" width="204" height="60" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="1028" y="240" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">mutex @ 0x55f2a0</text>
  <text x="1028" y="260" font-size="10" fill="#6B4E28" text-anchor="middle">B 自己的一页</text>

  <rect x="664" y="302" width="480" height="32" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="904" y="323" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">地址数值相同，物理页不同 → 两把无关的锁</text>

  <text x="904" y="352" font-size="10.5" fill="#733428" text-anchor="middle">A 的 lock 完全挡不住 B，互斥形同虚设</text>

  <text x="48" y="418" font-size="14" font-weight="700" fill="#4A473F">B · 于是多出两笔成本：状态放哪，以及持有者死了怎么办</text>

  <rect x="56" y="430" width="640" height="290" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="452" font-size="12" font-weight="700" fill="#4A473F">成本一 · 同步状态可以放在哪</text>

  <rect x="68" y="462" width="616" height="26" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="480" font-size="10.5" font-weight="700" fill="#4A473F">承载方式</text>
  <text x="226" y="480" font-size="10.5" font-weight="700" fill="#4A473F">状态住在哪</text>
  <text x="382" y="480" font-size="10.5" font-weight="700" fill="#4A473F">谁负责清理</text>
  <text x="512" y="480" font-size="10.5" font-weight="700" fill="#4A473F">进程崩溃后</text>

  <line x1="68" y1="540" x2="684" y2="540" stroke="#E4E1D6" stroke-width="1"/>
  <line x1="68" y1="592" x2="684" y2="592" stroke="#E4E1D6" stroke-width="1"/>
  <line x1="68" y1="644" x2="684" y2="644" stroke="#E4E1D6" stroke-width="1"/>

  <text x="80" y="510" font-size="11" font-weight="700" fill="#24473F">内核信号量 / 消息队列</text>
  <text x="226" y="510" font-size="10.5" fill="#4A473F">内核数据结构</text>
  <text x="382" y="510" font-size="10.5" fill="#4A473F">ipcrm 或引用计数</text>
  <text x="512" y="510" font-size="10.5" font-weight="700" fill="#24473F">计数照旧，不受影响</text>
  <text x="80" y="530" font-size="10" fill="#6B675C">semget / sem_open</text>

  <text x="80" y="562" font-size="11" font-weight="700" fill="#2C4460">共享内存里的 pthread 锁</text>
  <text x="226" y="562" font-size="10.5" fill="#4A473F">两进程共享的物理页</text>
  <text x="382" y="562" font-size="10.5" fill="#4A473F">shm_unlink</text>
  <text x="512" y="562" font-size="10.5" font-weight="700" fill="#733428">锁停在 locked 状态</text>
  <text x="80" y="582" font-size="10" fill="#6B675C">shm_open + mmap</text>

  <text x="80" y="614" font-size="11" font-weight="700" fill="#6B4E28">文件锁</text>
  <text x="226" y="614" font-size="10.5" fill="#4A473F">内核的 inode 锁表</text>
  <text x="382" y="614" font-size="10.5" fill="#4A473F">内核自动</text>
  <text x="512" y="614" font-size="10.5" font-weight="700" fill="#24473F">随进程退出释放</text>
  <text x="80" y="634" font-size="10" fill="#6B675C">flock / fcntl / OFD</text>

  <text x="80" y="670" font-size="10.5" fill="#4A473F">选型主要看两列：谁来清理，以及崩溃后留下什么</text>
  <text x="80" y="694" font-size="10.5" font-weight="700" fill="#733428">共享内存里的锁是唯一一种进程死后还赖着不走的</text>

  <rect x="728" y="430" width="456" height="290" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="742" y="452" font-size="12" font-weight="700" fill="#4A473F">成本二 · 持有者突然消失</text>

  <rect x="740" y="462" width="432" height="112" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="756" y="486" font-size="11.5" font-weight="700" fill="#24473F">线程崩了</text>
  <text x="756" y="510" font-size="10.5" fill="#24473F">未捕获异常 / 段错误 → 整个进程退出</text>
  <text x="756" y="532" font-size="10.5" fill="#24473F">地址空间连同锁一起消失</text>
  <text x="756" y="554" font-size="10.5" fill="#24473F">不存在「遗留的锁」这回事</text>

  <rect x="740" y="588" width="432" height="124" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="756" y="612" font-size="11.5" font-weight="700" fill="#733428">进程崩了</text>
  <text x="756" y="636" font-size="10.5" fill="#733428">共享内存还在，别的进程还活着</text>
  <text x="756" y="658" font-size="10.5" fill="#733428">锁字段停在 locked，owner 是死掉的 pid</text>
  <text x="756" y="680" font-size="10.5" font-weight="700" fill="#733428">后来者 lock 无限阻塞 —— 永久死锁</text>
  <text x="756" y="702" font-size="10.5" fill="#733428">对策是 robust 锁，见 §3</text>

  <line x1="700" y1="640" x2="734" y2="640" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrR)"/>

  <text x="48" y="752" font-size="11.5" fill="#4A473F">一句话：进程间同步 = 找一块共享的地方放同步状态 + 处理某个进程中途死亡。</text>
  <text x="48" y="774" font-size="11.5" fill="#4A473F">后面共享内存锁、内核信号量、文件锁三种方案的差别，基本都能归到这两笔成本上。</text>
</svg>
