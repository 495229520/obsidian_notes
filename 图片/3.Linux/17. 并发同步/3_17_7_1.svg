<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470">
  <rect x="0" y="0" width="940" height="470" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>同步状态放在哪里：线程间 vs 进程间</title>
  <desc>线程共享地址空间，普通 mutex 即可；进程地址空间隔离，同步原语须放在内核对象或共享内存等共享区。</desc>

  <text x="470" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    同步状态放在哪里：线程间 vs 进程间
  </text>
  <text x="470" y="54" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">
    线程共享地址空间；进程地址空间隔离，同步原语须放在共享区
  </text>

  <line x1="470" y1="84" x2="470" y2="382" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- ① 线程模型 -->
  <text x="250" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">
    ① 线程间：共享地址空间
  </text>
  <path d="M78 120 H422 A8 8 0 0 1 430 128 V352 A8 8 0 0 1 422 360 H78 A8 8 0 0 1 70 352 V128 A8 8 0 0 1 78 120 Z"
        fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="250" y="138" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">进程（单一地址空间）</text>

  <rect x="100" y="160" width="120" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="160" y="185" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">线程 1</text>
  <rect x="280" y="160" width="120" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="185" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">线程 2</text>

  <rect x="155" y="280" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="250" y="300" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041">pthread_mutex</text>
  <text x="250" y="320" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#085041">（堆 / 全局变量，天然共享）</text>

  <path d="M160 210 L210 280" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 210 L290 280" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ② 进程模型 -->
  <text x="690" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">
    ② 进程间：地址空间隔离
  </text>
  <rect x="500" y="120" width="160" height="90" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="580" y="142" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">进程 A</text>
  <text x="580" y="164" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">私有地址空间</text>
  <text x="580" y="186" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">私有 mutex 不可见 ✗</text>

  <rect x="720" y="120" width="160" height="90" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="800" y="142" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">进程 B</text>
  <text x="800" y="164" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">私有地址空间</text>
  <text x="800" y="186" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">私有 mutex 不可见 ✗</text>

  <rect x="540" y="280" width="300" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="690" y="304" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3C3489">内核对象 / 共享内存</text>
  <text x="690" y="326" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#3C3489">同步状态须放在两进程都能访问的共享区</text>

  <path d="M580 210 L640 280" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M800 210 L740 280" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="470" y="420" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    普通 pthread_mutex 默认进程私有；跨进程须用共享内存中的进程共享原语、内核信号量或文件锁
  </text>
</svg>
