<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <rect x="0" y="0" width="960" height="620" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    ABA 问题：值「A→B→A」绕一圈，CAS 误判「没变过」
  </text>
  <text x="480" y="56" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#888">
    以无锁栈 pop 为例：head 又变回旧节点地址，但 CAS 看不出中间发生过什么
  </text>

  <line x1="480" y1="92" x2="480" y2="500" stroke="#BBBAB2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="480" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#888">时间 ↓</text>

  <rect x="60" y="92" width="300" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="110" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">线程 T1（执行一次 pop）</text>
  <rect x="600" y="92" width="300" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="750" y="110" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">线程 T2（穿插多次操作）</text>

  <!-- T1 step 1 -->
  <rect x="60" y="150" width="300" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="166" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">① 读 head=A，算出 newHead=A.next=B</text>
  <text x="210" y="184" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">准备 CAS(head, A→B) … 此时被抢占</text>

  <!-- T2 steps -->
  <rect x="600" y="216" width="300" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="750" y="236" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">② pop A（head=B），pop B（head=C）</text>

  <rect x="600" y="272" width="300" height="48" rx="8" fill="#FBE9E7" stroke="#B3261E" stroke-width="0.5"/>
  <text x="750" y="288" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#7A1B14">③ push A（A 复用了原地址）</text>
  <text x="750" y="306" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#7A1B14">现在 head=A，但 A.next=C（不是 B！）</text>

  <!-- T1 step 4 -->
  <rect x="60" y="336" width="300" height="48" rx="8" fill="#FBE9E7" stroke="#B3261E" stroke-width="0.5"/>
  <text x="210" y="352" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#7A1B14">④ 恢复执行 CAS(head, A→B)</text>
  <text x="210" y="370" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#7A1B14">head 仍 == A → 成功！head 被设回 B</text>

  <!-- value tracker -->
  <circle cx="480" cy="174" r="5" fill="#185FA5"/>
  <text x="480" y="174" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="9" fill="#fff">A</text>
  <circle cx="480" cy="236" r="5" fill="#854F0B"/>
  <text x="480" y="236" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="9" fill="#fff">C</text>
  <circle cx="480" cy="296" r="5" fill="#B3261E"/>
  <text x="480" y="296" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="9" fill="#fff">A</text>
  <circle cx="480" cy="360" r="5" fill="#B3261E"/>

  <path d="M360 174 L475 174" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 236 L485 236" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 296 L485 296" fill="none" stroke="#B3261E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M360 360 L475 360" fill="none" stroke="#B3261E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="424" width="600" height="58" rx="8" fill="#FBE9E7" stroke="#B3261E" stroke-width="0.5"/>
  <text x="480" y="444" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#7A1B14">后果：head 指向已被弹出/释放的 B —— 悬垂指针、数据损坏</text>
  <text x="480" y="464" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#7A1B14">CAS 只比较「地址值」相等，无法察觉 A 已经历 出栈→入栈 的轮回</text>

  <text x="480" y="520" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041">解决：给指针附带版本号（tagged pointer / DCAS）让每次修改都改变比较值</text>
  <text x="480" y="546" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">A(v1) → A(v3)，版本不同 → CAS 失败重试；或用 hazard pointer / RCU 延迟回收内存</text>
  <text x="480" y="582" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#888">
    注：纯数值计数器一般不怕 ABA；ABA 真正致命的是「指针 + 内存复用」场景
  </text>
</svg>
