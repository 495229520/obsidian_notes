<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 890" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="890" fill="#F5F4ED"/>

  <title>ABA 问题：值绕回原值，CAS 误判没变过</title>
  <desc>上半是无锁栈 pop 被打断的四步时序与 head 取值轨迹；中间用两张链表图对比 T1 以为的栈与真实的栈；下半是三条对策及其代价。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">ABA：值绕一圈变回 A，CAS 只看见「还是 A」</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">计数器不怕值相等；致命的是指针 —— 地址被回收再分配后，同一个值早已不是同一个对象</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 无锁栈 pop 被打断的四步</text>

  <rect x="56" y="124" width="480" height="34" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="296" y="146" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">线程 T1 · 执行一次 pop</text>

  <rect x="704" y="124" width="480" height="34" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="944" y="146" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">线程 T2 · 穿插多次操作</text>

  <text x="620" y="146" font-size="11" fill="#6B675C" text-anchor="middle">head 取值</text>
  <line x1="620" y1="162" x2="620" y2="446" stroke="#BBBAB2" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="76" y="174" width="440" height="56" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="296" y="198" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">① 读 head=A，算出新头 B</text>
  <text x="296" y="218" font-size="10.5" fill="#2C4460" text-anchor="middle">正要 CAS(head, A→B) 时被抢占</text>
  <line x1="516" y1="201" x2="574" y2="201" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrB)"/>
  <rect x="578" y="186" width="84" height="30" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="620" y="206" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">A</text>

  <rect x="724" y="246" width="440" height="52" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="944" y="270" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">② pop A，再 pop B</text>
  <text x="944" y="289" font-size="10.5" fill="#6B4E28" text-anchor="middle">两个节点都被弹出并释放</text>
  <line x1="720" y1="271" x2="666" y2="271" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrA)"/>
  <rect x="578" y="256" width="84" height="30" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="620" y="276" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">C</text>

  <rect x="724" y="314" width="440" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="944" y="338" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">③ push A：分配器还回原地址</text>
  <text x="944" y="358" font-size="10.5" fill="#733428" text-anchor="middle">新节点的 next 指向 C，不是 B</text>
  <line x1="720" y1="341" x2="666" y2="341" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrR)"/>
  <rect x="578" y="326" width="84" height="30" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="620" y="346" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">A</text>

  <rect x="76" y="386" width="440" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="2"/>
  <text x="296" y="410" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">④ T1 恢复，CAS(head, A→B)</text>
  <text x="296" y="430" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">head 仍等于 A → 提交成功 ✗</text>
  <line x1="516" y1="413" x2="574" y2="413" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arrR)"/>
  <rect x="578" y="398" width="84" height="30" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="620" y="418" font-size="11.5" font-weight="700" fill="#733428" text-anchor="middle">B</text>

  <text x="76" y="272" font-size="11" fill="#4A473F">A → C → A，中列绕了一圈</text>
  <text x="76" y="294" font-size="11" fill="#4A473F">CAS 只对比首尾两次取值</text>
  <text x="76" y="316" font-size="11" fill="#4A473F">中间的 C 它完全看不见</text>

  <!-- ===== B 区 ===== -->
  <text x="48" y="482" font-size="14" font-weight="700" fill="#4A473F">B · CAS 成功了，但栈早已不是 T1 以为的那个栈</text>

  <rect x="56" y="494" width="560" height="176" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="516" font-size="12" font-weight="700" fill="#3D5A80">T1 读 head 那一刻</text>

  <text x="76" y="562" font-size="11" font-weight="700" fill="#4A473F">head</text>
  <line x1="110" y1="558" x2="126" y2="558" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="134" y="536" width="100" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="184" y="563" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">A</text>
  <line x1="234" y1="558" x2="278" y2="558" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="286" y="536" width="100" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="336" y="563" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">B</text>
  <line x1="386" y1="558" x2="430" y2="558" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="438" y="536" width="100" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="488" y="563" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">C</text>

  <text x="76" y="616" font-size="11.5" fill="#4A473F">T1 据此认定：把 head 从 A 改成 B 就对了</text>
  <text x="76" y="640" font-size="11.5" fill="#4A473F">在读到的那一刻，这个判断没有错</text>

  <rect x="648" y="494" width="536" height="176" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="662" y="516" font-size="12" font-weight="700" fill="#A64B3C">CAS 提交那一刻的真实情况</text>

  <text x="668" y="562" font-size="11" font-weight="700" fill="#4A473F">head</text>
  <line x1="702" y1="558" x2="718" y2="558" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="726" y="536" width="110" height="44" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="781" y="556" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">A</text>
  <text x="781" y="572" font-size="9.5" fill="#733428" text-anchor="middle">同址新节点</text>
  <line x1="836" y1="558" x2="880" y2="558" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="888" y="536" width="100" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="938" y="563" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">C</text>

  <rect x="1030" y="536" width="130" height="44" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1095" y="563" font-size="12" fill="#6B675C" text-anchor="middle">B 已被释放</text>

  <text x="668" y="616" font-size="11.5" font-weight="700" fill="#733428">CAS 却把 head 指回了已释放的 B</text>
  <text x="668" y="640" font-size="11.5" fill="#733428">悬垂指针、双重释放、链表断裂</text>

  <!-- ===== C 区 ===== -->
  <text x="48" y="708" font-size="14" font-weight="700" fill="#4A473F">C · 三条对策：让「值相等」不再等价于「没变过」</text>

  <rect x="56" y="720" width="1128" height="126" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="68" y="730" width="1104" height="26" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="748" font-size="11" font-weight="700" fill="#4A473F">做法</text>
  <text x="320" y="748" font-size="11" font-weight="700" fill="#4A473F">怎么工作</text>
  <text x="740" y="748" font-size="11" font-weight="700" fill="#4A473F">代价与限制</text>

  <text x="80" y="774" font-size="11" fill="#2C4460">版本号 / tagged pointer</text>
  <text x="320" y="774" font-size="11" fill="#4A473F">指针与计数打包，双字 CAS 一次比完</text>
  <text x="740" y="774" font-size="11" fill="#4A473F">需要 cmpxchg16b，指针位宽受限</text>
  <line x1="68" y1="782" x2="1172" y2="782" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="800" font-size="11" fill="#2C4460">hazard pointer</text>
  <text x="320" y="800" font-size="11" fill="#4A473F">线程登记「我在用它」，登记期间不回收</text>
  <text x="740" y="800" font-size="11" fill="#4A473F">每次访问都要发布指针并扫表</text>
  <line x1="68" y1="808" x2="1172" y2="808" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="826" font-size="11" fill="#2C4460">RCU / 延迟回收</text>
  <text x="320" y="826" font-size="11" fill="#4A473F">宽限期内不真释放，读者全退出再回收</text>
  <text x="740" y="826" font-size="11" fill="#4A473F">释放被推迟，内存占用抬高</text>

  <text x="48" y="874" font-size="11.5" fill="#4A473F">纯数值计数器一般不受影响 —— 值相同则含义相同；ABA 只在「指针 + 内存复用」时才致命。</text>
</svg>
