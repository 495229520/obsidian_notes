<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 890" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="890" fill="#F5F4ED"/>

  <title>Michael-Scott 无锁队列：哨兵节点与两步 CAS 入队</title>
  <desc>上半是带哨兵节点的链表结构与 Head、Tail 原子指针；中间用三帧展示入队的两步 CAS 以及中间那个 Tail 落后的合法状态；下半是出队三步与 ABA、内存回收两个难题。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">Michael-Scott 无锁队列：哨兵节点，加上两步 CAS 的入队</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">两端都有并发写，只能靠 CAS 仲裁；失败不阻塞，重试即可 —— 难的从来不是链表，是回收</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 结构：一条带哨兵的单链表，两个原子指针</text>

  <rect x="56" y="124" width="1128" height="206" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="103" y="148" width="150" height="44" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="178" y="167" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">Head · 原子指针</text>
  <text x="178" y="184" font-size="10" fill="#2C4460" text-anchor="middle">出队端</text>

  <rect x="543" y="148" width="150" height="44" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="618" y="167" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">Tail · 原子指针</text>
  <text x="618" y="184" font-size="10" fill="#6B4E28" text-anchor="middle">入队端</text>

  <line x1="178" y1="192" x2="178" y2="228" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrB)"/>
  <line x1="618" y1="192" x2="618" y2="228" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrA)"/>

  <rect x="88" y="232" width="180" height="64" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.5"/>
  <text x="178" y="258" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">dummy · 哨兵</text>
  <text x="178" y="278" font-size="10.5" fill="#6B675C" text-anchor="middle">data 无效，只用 next</text>

  <rect x="308" y="232" width="180" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="398" y="258" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">node A</text>
  <text x="398" y="278" font-size="10.5" fill="#24473F" text-anchor="middle">data = A</text>

  <rect x="528" y="232" width="180" height="64" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="618" y="258" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">node B · 队尾</text>
  <text x="618" y="278" font-size="10.5" fill="#24473F" text-anchor="middle">next = ∅</text>

  <line x1="268" y1="264" x2="304" y2="264" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="488" y1="264" x2="524" y2="264" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="708" y1="264" x2="744" y2="264" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="756" y="268" font-size="11" fill="#6B675C">nullptr</text>

  <rect x="820" y="148" width="364" height="160" rx="8" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <text x="834" y="170" font-size="12" font-weight="700" fill="#3D5A80">哨兵节点换来了什么</text>
  <text x="834" y="196" font-size="10.5" fill="#2C4460">链表永远保留一个空头节点</text>
  <text x="834" y="218" font-size="10.5" fill="#2C4460">空队列时 Head 与 Tail 都指着它</text>
  <text x="834" y="240" font-size="10.5" fill="#2C4460">入队不必特判「链表为空」</text>
  <text x="834" y="262" font-size="10.5" fill="#2C4460">出队不必特判「只剩一个节点」</text>
  <text x="834" y="290" font-size="10.5" font-weight="700" fill="#3D5A80">多一个节点，换掉全部边界分支</text>

  <!-- ===== B 区 ===== -->
  <text x="48" y="356" font-size="14" font-weight="700" fill="#4A473F">B · 入队为什么要两步 CAS，中间那一拍算不算 bug</text>

  <rect x="56" y="368" width="1128" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <!-- 帧 1 -->
  <rect x="76" y="396" width="340" height="200" rx="8" fill="#F5F4ED" stroke="#D8D5C8" stroke-width="1"/>
  <text x="96" y="422" font-size="11.5" font-weight="700" fill="#4A473F">① CAS 之前</text>
  <rect x="116" y="440" width="90" height="30" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="161" y="460" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">Tail</text>
  <line x1="161" y1="470" x2="161" y2="496" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrA)"/>
  <rect x="106" y="500" width="110" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="161" y="527" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">B</text>
  <line x1="216" y1="522" x2="240" y2="522" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="526" font-size="11" fill="#6B675C">∅</text>
  <text x="96" y="572" font-size="10.5" fill="#4A473F">Tail 指着真尾，next 为空</text>

  <!-- 帧 2 -->
  <rect x="450" y="396" width="340" height="200" rx="8" fill="#F5F4ED" stroke="#D8D5C8" stroke-width="1"/>
  <text x="470" y="422" font-size="11.5" font-weight="700" fill="#4A473F">② CAS(B.next, ∅ → C) 成功</text>
  <rect x="490" y="440" width="90" height="30" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="535" y="460" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">Tail</text>
  <line x1="535" y1="470" x2="535" y2="496" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrA)"/>
  <rect x="480" y="500" width="110" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="535" y="527" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">B</text>
  <line x1="590" y1="522" x2="626" y2="522" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <rect x="630" y="500" width="110" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/>
  <text x="685" y="527" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">C</text>
  <line x1="590" y1="455" x2="681" y2="455" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="638" y="447" font-size="10" font-weight="700" fill="#A64B3C" text-anchor="middle">本该在这</text>
  <text x="470" y="572" font-size="10.5" font-weight="700" fill="#733428">Tail 还指着 B，暂时不是真尾</text>

  <!-- 帧 3 -->
  <rect x="824" y="396" width="340" height="200" rx="8" fill="#F5F4ED" stroke="#D8D5C8" stroke-width="1"/>
  <text x="844" y="422" font-size="11.5" font-weight="700" fill="#4A473F">③ CAS(Tail, B → C)</text>
  <rect x="1014" y="440" width="90" height="30" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="1059" y="460" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">Tail</text>
  <line x1="1059" y1="470" x2="1059" y2="496" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrA)"/>
  <rect x="854" y="500" width="110" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="909" y="527" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">B</text>
  <line x1="964" y1="522" x2="1000" y2="522" stroke="#5A564B" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="1004" y="500" width="110" height="44" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="1059" y="527" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">C</text>
  <text x="844" y="572" font-size="10.5" fill="#4A473F">谁发现 Tail 落后都能帮它推</text>

  <text x="76" y="610" font-size="11" fill="#4A473F">这一拍是合法状态：链表已经正确，只是 Tail 慢了一步，任何线程都能替它推进</text>

  <!-- ===== C 区 ===== -->
  <text x="48" y="646" font-size="14" font-weight="700" fill="#4A473F">C · 出队三步，以及两个绕不开的难题</text>

  <rect x="56" y="658" width="560" height="176" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="680" font-size="12" font-weight="700" fill="#4A473F">出队 dequeue · 多消费者</text>

  <rect x="76" y="690" width="520" height="40" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="92" y="707" font-size="11" font-weight="700" fill="#2C4460">① 读 Head，再读 Head→next</text>
  <text x="92" y="723" font-size="10" fill="#2C4460">next 为空就说明队列真的空了</text>

  <rect x="76" y="736" width="520" height="40" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="92" y="753" font-size="11" font-weight="700" fill="#2C4460">② 取出 next 里的 data</text>
  <text x="92" y="769" font-size="10" fill="#2C4460">先把数据拿到手，再动指针</text>

  <rect x="76" y="782" width="520" height="40" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="92" y="799" font-size="11" font-weight="700" fill="#24473F">③ CAS(Head, head → next)</text>
  <text x="92" y="815" font-size="10" fill="#24473F">原 head 退休，next 接任新哨兵；失败就重试</text>

  <rect x="648" y="658" width="536" height="176" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="662" y="680" font-size="12" font-weight="700" fill="#4A473F">两个难题，都在 17.5 讲过</text>

  <rect x="660" y="690" width="512" height="62" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="674" y="710" font-size="11.5" font-weight="700" fill="#733428">ABA</text>
  <text x="674" y="728" font-size="10.5" fill="#733428">节点地址被回收再分配，CAS 误判没变过</text>
  <text x="674" y="746" font-size="10.5" fill="#733428">解法：tagged pointer，指针带上版本号</text>

  <rect x="660" y="762" width="512" height="62" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="674" y="782" font-size="11.5" font-weight="700" fill="#733428">内存回收</text>
  <text x="674" y="800" font-size="10.5" fill="#733428">摘下来的节点，别的线程可能还握着</text>
  <text x="674" y="818" font-size="10.5" fill="#733428">解法：hazard pointer 或 RCU 延迟释放</text>

  <text x="48" y="864" font-size="11.5" fill="#4A473F">正确性极难验证：先用锁阻塞队列跑通并压测，实测锁竞争确实是瓶颈，再考虑换成它。</text>
</svg>
