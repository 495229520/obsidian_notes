<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 858" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="858" fill="#F5F4ED"/>

  <title>RAII 锁与四个包装器的选型</title>
  <desc>上半是同一段临界区在抛异常时手动 unlock 与 lock_guard 的分岔；下半是四个 RAII 锁包装器的能力矩阵，以及条件变量为何必须配 unique_lock、scoped_lock 如何避免 AB/BA 死锁。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">用 RAII 管锁：异常路径不会漏解锁，包装器按需要多少控制力来选</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">析构是栈展开的必经之路，所以「解锁」挂在析构上才是可靠的；能用 lock_guard 就别用 unique_lock</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 同一段临界区，两种写法在异常路径上分岔</text>

  <rect x="56" y="124" width="1128" height="326" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <text x="336" y="170" font-size="12.5" font-weight="700" fill="#733428" text-anchor="middle">手动 lock / unlock</text>
  <text x="904" y="170" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">std::lock_guard（RAII）</text>

  <rect x="76" y="184" width="520" height="42" rx="7" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="336" y="210" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">mtx.lock();</text>
  <rect x="644" y="184" width="520" height="42" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="904" y="210" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">std::lock_guard&lt;std::mutex&gt; lk(mtx);　构造即加锁</text>

  <rect x="76" y="236" width="520" height="42" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="336" y="262" font-size="11" fill="#6B4E28" text-anchor="middle">process(); 内部抛出异常</text>
  <rect x="644" y="236" width="520" height="42" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="904" y="262" font-size="11" fill="#6B4E28" text-anchor="middle">process(); 内部抛出异常</text>

  <line x1="68" y1="294" x2="1172" y2="294" stroke="#A64B3C" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="76" y="290" font-size="10.5" font-weight="700" fill="#A64B3C">分岔点：栈开始展开，只有局部对象的析构函数会被调用</text>

  <rect x="76" y="304" width="520" height="52" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="336" y="326" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">mtx.unlock(); 这一行根本没被执行</text>
  <text x="336" y="346" font-size="10" fill="#733428" text-anchor="middle">栈展开不会替你跑剩下的语句</text>

  <rect x="644" y="304" width="520" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="904" y="326" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">~lock_guard() 被调用 → unlock()</text>
  <text x="904" y="346" font-size="10" fill="#24473F" text-anchor="middle">析构是栈展开必须做的事，躲不掉</text>

  <rect x="76" y="366" width="520" height="52" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.6"/>
  <text x="336" y="388" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">锁被永久持有</text>
  <text x="336" y="408" font-size="10" fill="#733428" text-anchor="middle">之后所有 lock 全部阻塞，进程等于卡死</text>

  <rect x="644" y="366" width="520" height="52" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/>
  <text x="904" y="388" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">锁已释放，异常继续向上传播</text>
  <text x="904" y="408" font-size="10" fill="#24473F" text-anchor="middle">正常 return、break、goto 也都一样安全</text>

  <text x="76" y="438" font-size="10.5" fill="#4A473F">同一套道理适用于文件、socket、内存：让对象的生命周期替你管理资源</text>

  <text x="48" y="484" font-size="14" font-weight="700" fill="#4A473F">B · 四个包装器：控制力越强，能写错的地方越多</text>

  <rect x="56" y="496" width="648" height="284" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="68" y="516" width="624" height="26" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="534" font-size="10.5" font-weight="700" fill="#4A473F">包装器</text>
  <text x="268" y="534" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">能手动解锁</text>
  <text x="360" y="534" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">能延迟转移</text>
  <text x="452" y="534" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">一次多把</text>
  <text x="506" y="534" font-size="10.5" font-weight="700" fill="#4A473F">典型场景</text>

  <line x1="68" y1="598" x2="692" y2="598" stroke="#E4E1D6" stroke-width="1"/>
  <line x1="68" y1="654" x2="692" y2="654" stroke="#E4E1D6" stroke-width="1"/>
  <line x1="68" y1="710" x2="692" y2="710" stroke="#E4E1D6" stroke-width="1"/>

  <text x="80" y="564" font-size="11" font-weight="700" fill="#24473F">std::lock_guard</text>
  <text x="268" y="564" font-size="11" fill="#733428" text-anchor="middle">✗</text>
  <text x="360" y="564" font-size="11" fill="#733428" text-anchor="middle">✗</text>
  <text x="452" y="564" font-size="11" fill="#733428" text-anchor="middle">✗</text>
  <text x="506" y="564" font-size="10.5" font-weight="700" fill="#24473F">简单临界区，默认选它</text>
  <text x="80" y="584" font-size="10" fill="#6B675C">构造即锁、析构即解，没有第三个接口</text>

  <text x="80" y="620" font-size="11" font-weight="700" fill="#2C4460">std::unique_lock</text>
  <text x="268" y="620" font-size="11" fill="#24473F" text-anchor="middle">✓</text>
  <text x="360" y="620" font-size="11" fill="#24473F" text-anchor="middle">✓</text>
  <text x="452" y="620" font-size="10.5" fill="#4A473F" text-anchor="middle">配 std::lock</text>
  <text x="506" y="620" font-size="10.5" fill="#4A473F">条件变量 wait 只能用它</text>
  <text x="80" y="640" font-size="10" fill="#6B675C">多一个「当前是否持有」的状态位</text>

  <text x="80" y="676" font-size="11" font-weight="700" fill="#6B4E28">std::scoped_lock</text>
  <text x="268" y="676" font-size="11" fill="#733428" text-anchor="middle">✗</text>
  <text x="360" y="676" font-size="11" fill="#733428" text-anchor="middle">✗</text>
  <text x="452" y="676" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">✓</text>
  <text x="506" y="676" font-size="10.5" fill="#4A473F">同时要拿多把锁</text>
  <text x="80" y="696" font-size="10" fill="#6B675C">C++17；单把锁时等价于 lock_guard</text>

  <text x="80" y="732" font-size="11" font-weight="700" fill="#6B5B95">std::shared_lock</text>
  <text x="268" y="732" font-size="11" fill="#733428" text-anchor="middle">✗</text>
  <text x="360" y="732" font-size="11" fill="#24473F" text-anchor="middle">✓</text>
  <text x="452" y="732" font-size="11" fill="#733428" text-anchor="middle">✗</text>
  <text x="506" y="732" font-size="10.5" fill="#4A473F">shared_mutex 的读侧</text>
  <text x="80" y="752" font-size="10" fill="#6B675C">C++14；多个读者可同时持有，写者用 unique_lock</text>

  <rect x="720" y="496" width="464" height="134" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="734" y="518" font-size="12" font-weight="700" fill="#4A473F">为什么 cv.wait 只能配 unique_lock</text>

  <rect x="734" y="530" width="140" height="40" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="804" y="554" font-size="10.5" fill="#2C4460" text-anchor="middle">① unlock(mtx)</text>
  <rect x="884" y="530" width="140" height="40" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="954" y="554" font-size="10.5" fill="#6B5B95" text-anchor="middle">② 挂队列睡下</text>
  <rect x="1034" y="530" width="136" height="40" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="1102" y="554" font-size="10.5" fill="#2C4460" text-anchor="middle">③ 醒后重新 lock</text>

  <line x1="874" y1="550" x2="880" y2="550" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="1024" y1="550" x2="1030" y2="550" stroke="#5A564B" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="734" y="592" font-size="10.5" fill="#4A473F">wait 内部必须能把锁放掉再拿回来</text>
  <text x="734" y="614" font-size="10.5" font-weight="700" fill="#733428">lock_guard 没有 unlock 接口，做不了 ① 和 ③</text>

  <rect x="720" y="646" width="464" height="134" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="734" y="668" font-size="12" font-weight="700" fill="#4A473F">scoped_lock 为什么不会 AB / BA 死锁</text>

  <rect x="734" y="680" width="212" height="42" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="840" y="698" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">手写：T1 锁 A 再锁 B</text>
  <text x="840" y="715" font-size="10" fill="#733428" text-anchor="middle">T2 锁 B 再锁 A → 互等</text>

  <rect x="958" y="680" width="212" height="42" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="1064" y="698" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">scoped_lock lk(a, b);</text>
  <text x="1064" y="715" font-size="10" fill="#24473F" text-anchor="middle">统一顺序试锁，失败全退重来</text>

  <text x="734" y="744" font-size="10.5" fill="#4A473F">死锁的根因是两条路径加锁顺序相反</text>
  <text x="734" y="766" font-size="10.5" font-weight="700" fill="#24473F">别自己去排顺序，交给统一算法更稳</text>

  <text x="48" y="812" font-size="11.5" fill="#4A473F">挑包装器的顺序：先问「要不要中途解锁」，再问「要不要一次拿多把」，两个都不要就是 lock_guard。</text>
  <text x="48" y="834" font-size="11.5" fill="#4A473F">unique_lock 不是「更好的 lock_guard」，它只是多了状态和接口；用不到那些能力时选它，只是把出错面白白扩大。</text>
</svg>
