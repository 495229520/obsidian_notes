<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 485" width="940" height="485">
  <rect x="0" y="0" width="940" height="485" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>共享内存中的进程共享 mutex</title>
  <desc>两进程 mmap 同一物理页，页中存放设置了 PTHREAD_PROCESS_SHARED 的 pthread_mutex_t，从而实现跨进程互斥。</desc>

  <text x="470" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    共享内存中的进程共享 mutex
  </text>
  <text x="470" y="54" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">
    两进程 mmap 同一物理页；mutex 须设 PTHREAD_PROCESS_SHARED 才能跨进程生效
  </text>

  <!-- 进程 A -->
  <rect x="60" y="100" width="250" height="120" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="185" y="124" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">进程 A</text>
  <text x="185" y="150" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">虚拟地址 0x7f..a000</text>
  <text x="185" y="172" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">ptr = mmap(shm_fd, ...)</text>
  <text x="185" y="194" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">pthread_mutex_lock(&amp;ptr-&gt;mtx)</text>

  <!-- 进程 B -->
  <rect x="630" y="100" width="250" height="120" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="755" y="124" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">进程 B</text>
  <text x="755" y="150" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">虚拟地址 0x7f..3000（可不同）</text>
  <text x="755" y="172" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">ptr = mmap(shm_fd, ...)</text>
  <text x="755" y="194" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">pthread_mutex_lock(&amp;ptr-&gt;mtx)</text>

  <!-- 共享物理页（path 容器） -->
  <path d="M298 290 H642 A8 8 0 0 1 650 298 V392 A8 8 0 0 1 642 400 H298 A8 8 0 0 1 290 392 V298 A8 8 0 0 1 298 290 Z"
        fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="470" y="312" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3C3489">共享内存物理页</text>
  <text x="470" y="332" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#3C3489">shm_open + ftruncate</text>

  <rect x="320" y="350" width="300" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="470" y="370" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">pthread_mutex_t（PTHREAD_PROCESS_SHARED）</text>

  <path d="M185 220 L380 290" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M755 220 L560 290" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">mmap 映射</text>
  <text x="690" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#854F0B">mmap 映射</text>

  <text x="470" y="440" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    同一物理页可映射到不同虚拟地址；先 pthread_mutexattr_setpshared 再 pthread_mutex_init
  </text>
</svg>
