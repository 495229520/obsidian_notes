<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 856" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="856" fill="#F5F4ED"/>

  <title>fcntl 记录锁：字节区间、冲突判定与关闭 fd 的陷阱</title>
  <desc>上半是同一文件上四个进程的字节区间锁与冲突判定矩阵；下半是传统 fcntl 锁按「进程 + inode」记账导致关闭任一 fd 就丢锁的陷阱，以及 flock、fcntl、OFD 三种接口的绑定对象对照。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">fcntl 记录锁：锁的是字节区间，丢的却是整个进程在这个 inode 上的锁</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">冲突只发生在「区间相交 且 至少一方是写锁」；释放语义反直觉，新代码一律用 OFD 锁</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 同一个文件上的四个申请者，谁挡住谁</text>

  <rect x="56" y="124" width="1128" height="296" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <text x="82" y="152" font-size="12" font-weight="700" fill="#4A473F">文件的字节轴</text>

  <rect x="96" y="166" width="640" height="30" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <line x1="176" y1="166" x2="176" y2="196" stroke="#9B968A" stroke-width="0.8"/>
  <line x1="256" y1="166" x2="256" y2="196" stroke="#9B968A" stroke-width="0.8"/>
  <line x1="336" y1="166" x2="336" y2="196" stroke="#9B968A" stroke-width="0.8"/>
  <line x1="416" y1="166" x2="416" y2="196" stroke="#9B968A" stroke-width="0.8"/>
  <line x1="496" y1="166" x2="496" y2="196" stroke="#9B968A" stroke-width="0.8"/>
  <line x1="576" y1="166" x2="576" y2="196" stroke="#9B968A" stroke-width="0.8"/>
  <line x1="656" y1="166" x2="656" y2="196" stroke="#9B968A" stroke-width="0.8"/>

  <text x="96" y="212" font-size="9.5" fill="#6B675C" text-anchor="middle">0</text>
  <text x="176" y="212" font-size="9.5" fill="#6B675C" text-anchor="middle">1024</text>
  <text x="256" y="212" font-size="9.5" fill="#6B675C" text-anchor="middle">2048</text>
  <text x="416" y="212" font-size="9.5" fill="#6B675C" text-anchor="middle">4096</text>
  <text x="736" y="212" font-size="9.5" fill="#6B675C" text-anchor="middle">8192</text>

  <rect x="96" y="228" width="80" height="26" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="186" y="246" font-size="10.5" font-weight="700" fill="#733428">A 持有写锁 F_WRLCK [0, 1024)</text>

  <rect x="416" y="262" width="320" height="26" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="100" y="280" font-size="10.5" font-weight="700" fill="#24473F">B 持有读锁 F_RDLCK [4096, 8192)</text>

  <rect x="136" y="296" width="160" height="26" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="306" y="314" font-size="10.5" fill="#733428">C 申请写锁 [512, 2048) → 与 A 相交 → 阻塞</text>

  <rect x="416" y="330" width="320" height="26" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="100" y="348" font-size="10.5" fill="#24473F">D 申请读锁 [4096, 8192) → 读读共享 → 通过</text>

  <text x="96" y="386" font-size="10.5" fill="#4A473F">同一进程对已锁区间再加锁不会自己挡自己，内核直接合并或替换区间</text>
  <text x="96" y="406" font-size="10.5" fill="#4A473F">l_len = 0 表示锁到 EOF，之后追加的内容也自动在锁内</text>

  <rect x="784" y="146" width="384" height="184" rx="7" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="798" y="168" font-size="12" font-weight="700" fill="#4A473F">冲突判定：只看这两件事</text>

  <rect x="798" y="180" width="356" height="26" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="810" y="198" font-size="10.5" font-weight="700" fill="#4A473F">已经持有</text>
  <text x="948" y="198" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">来申请读锁</text>
  <text x="1076" y="198" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">来申请写锁</text>

  <text x="810" y="228" font-size="10.5" fill="#4A473F">已持读锁</text>
  <rect x="886" y="212" width="124" height="24" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="948" y="229" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">共存</text>
  <rect x="1014" y="212" width="124" height="24" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="1076" y="229" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">冲突</text>

  <text x="810" y="260" font-size="10.5" fill="#4A473F">已持写锁</text>
  <rect x="886" y="244" width="124" height="24" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="948" y="261" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">冲突</text>
  <rect x="1014" y="244" width="124" height="24" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <text x="1076" y="261" font-size="10.5" font-weight="700" fill="#733428" text-anchor="middle">冲突</text>

  <text x="810" y="292" font-size="10.5" fill="#4A473F">区间不相交</text>
  <rect x="886" y="276" width="252" height="24" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <text x="1012" y="293" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">共存</text>

  <text x="798" y="320" font-size="10" fill="#6B675C">F_SETLKW 冲突则睡；F_SETLK 冲突立刻返 EAGAIN</text>

  <text x="798" y="356" font-size="11" font-weight="700" fill="#733428">劝告锁：内核只记账不拦人</text>
  <text x="798" y="378" font-size="10.5" fill="#4A473F">不加锁直接 write 照样能写进去</text>
  <text x="798" y="400" font-size="10.5" fill="#4A473F">强制锁有竞态、已基本废弃，别依赖</text>

  <text x="48" y="454" font-size="14" font-weight="700" fill="#4A473F">B · 传统 fcntl 锁最著名的坑：锁记在「进程 + inode」上，不记在 fd 上</text>

  <rect x="56" y="466" width="600" height="286" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="488" font-size="12" font-weight="700" fill="#4A473F">一次无关的 close，删掉了你的锁</text>

  <rect x="68" y="500" width="576" height="150" rx="7" fill="#F7F6F0" stroke="#D8D5C8" stroke-width="1"/>
  <text x="82" y="522" font-size="11" font-weight="700" fill="#4A473F">同一个进程</text>

  <rect x="86" y="534" width="176" height="42" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="174" y="551" font-size="10.5" font-weight="700" fill="#2C4460" text-anchor="middle">fd3 = open("db")</text>
  <text x="174" y="568" font-size="10" fill="#2C4460" text-anchor="middle">你在这个 fd 上加了锁</text>

  <rect x="86" y="592" width="176" height="42" rx="6" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="174" y="609" font-size="10.5" font-weight="700" fill="#4A473F" text-anchor="middle">fd5 = open("db")</text>
  <text x="174" y="626" font-size="10" fill="#4A473F" text-anchor="middle">某个库函数自己打开的</text>

  <rect x="412" y="548" width="216" height="72" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="520" y="572" font-size="11" font-weight="700" fill="#6B5B95" text-anchor="middle">inode 上的锁表</text>
  <text x="520" y="592" font-size="10" fill="#6B5B95" text-anchor="middle">记的是 (pid, inode)</text>
  <text x="520" y="610" font-size="10" fill="#6B5B95" text-anchor="middle">压根不记是哪个 fd 加的</text>

  <line x1="262" y1="555" x2="406" y2="570" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="284" y="548" font-size="9.5" font-weight="700" fill="#3D5A80">F_SETLK [0,1024)</text>
  <line x1="262" y1="613" x2="406" y2="600" stroke="#9B968A" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="290" y="632" font-size="9.5" fill="#733428">库里一句 close(fd5)</text>

  <rect x="68" y="662" width="576" height="76" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="84" y="684" font-size="11" font-weight="700" fill="#733428">fd5 和加锁用的 fd3 毫无关系</text>
  <text x="84" y="706" font-size="10.5" fill="#733428">但内核会把本进程在该 inode 上的锁全部释放</text>
  <text x="84" y="728" font-size="10.5" font-weight="700" fill="#733428">你以为还持着锁，实际早没了 —— 数据竞争无声发生</text>

  <rect x="688" y="466" width="496" height="286" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="702" y="488" font-size="12" font-weight="700" fill="#4A473F">三种文件锁绑在什么东西上</text>

  <rect x="700" y="500" width="472" height="26" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="712" y="518" font-size="10.5" font-weight="700" fill="#4A473F">接口</text>
  <text x="828" y="518" font-size="10.5" font-weight="700" fill="#4A473F">锁绑定到</text>
  <text x="972" y="518" font-size="10.5" font-weight="700" fill="#4A473F">关掉别的 fd</text>
  <text x="1082" y="518" font-size="10.5" font-weight="700" fill="#4A473F">粒度</text>

  <line x1="700" y1="576" x2="1172" y2="576" stroke="#E4E1D6" stroke-width="1"/>
  <line x1="700" y1="632" x2="1172" y2="632" stroke="#E4E1D6" stroke-width="1"/>

  <text x="712" y="546" font-size="11" font-weight="700" fill="#4A473F">flock()</text>
  <text x="828" y="546" font-size="10.5" fill="#4A473F">打开文件表项</text>
  <text x="972" y="546" font-size="10.5" font-weight="700" fill="#24473F">不受影响</text>
  <text x="1082" y="546" font-size="10.5" fill="#4A473F">整个文件</text>
  <text x="712" y="566" font-size="10" fill="#6B675C">dup 出的 fd 共享同一把；NFS 上不可靠</text>

  <text x="712" y="602" font-size="11" font-weight="700" fill="#733428">fcntl 传统</text>
  <text x="828" y="602" font-size="10.5" fill="#733428">进程 + inode</text>
  <text x="972" y="602" font-size="10.5" font-weight="700" fill="#733428">锁全部丢失</text>
  <text x="1082" y="602" font-size="10.5" fill="#4A473F">字节区间</text>
  <text x="712" y="622" font-size="10" fill="#6B675C">fork 出的子进程不继承这些锁</text>

  <text x="712" y="658" font-size="11" font-weight="700" fill="#24473F">F_OFD_SETLK</text>
  <text x="828" y="658" font-size="10.5" fill="#24473F">打开文件描述</text>
  <text x="972" y="658" font-size="10.5" font-weight="700" fill="#24473F">不受影响</text>
  <text x="1082" y="658" font-size="10.5" fill="#4A473F">字节区间</text>
  <text x="712" y="678" font-size="10" fill="#6B675C">Linux 3.15 起；fork 后父子共享同一把</text>

  <rect x="700" y="694" width="472" height="44" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="714" y="713" font-size="10.5" font-weight="700" fill="#24473F">要区间粒度就用 OFD，结构体和 fcntl 完全一样</text>
  <text x="714" y="731" font-size="10.5" fill="#24473F">只把 F_SETLK 换成 F_OFD_SETLK，l_pid 置 0</text>

  <text x="48" y="786" font-size="11.5" fill="#4A473F">文件锁不需要共享内存，靠的是「文件是所有进程都能命名的公共资源」这一点，代价是每次加解锁都要进内核。</text>
  <text x="48" y="808" font-size="11.5" fill="#4A473F">它天生抗崩溃：进程无论怎么死，内核都会在进程退出时清掉它持有的全部记录锁，不存在共享内存锁那种残留状态。</text>
  <text x="48" y="830" font-size="11.5" fill="#4A473F">但它只是劝告锁——只有同样先加锁再访问的进程才会被挡住，绕过约定直接读写文件永远是可行的。</text>
</svg>
