<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect x="0" y="0" width="960" height="600" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    悲观锁 vs 乐观锁：两种处理冲突的策略思想
  </text>
  <text x="480" y="56" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#888">
    左：先独占再访问（先防后用）   右：先访问提交时再检测（先用后查）
  </text>

  <!-- ============ 悲观锁 lane ============ -->
  <rect x="50" y="86" width="380" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="240" y="106" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">悲观锁　假设「冲突经常发生」</text>

  <rect x="90" y="150" width="300" height="44" rx="8" fill="#FBE9E7" stroke="#B3261E" stroke-width="0.5"/>
  <text x="240" y="172" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#7A1B14">① 请求加锁 → 阻塞等待（独占）</text>

  <rect x="90" y="222" width="300" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="240" y="244" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#633806">② 获得锁，进入临界区</text>

  <rect x="90" y="294" width="300" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="240" y="316" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#633806">③ 读-改-写（无人能打断）</text>

  <rect x="90" y="366" width="300" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="240" y="388" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#633806">④ 释放锁，唤醒等待者</text>

  <path d="M240 194 L240 220" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M240 266 L240 292" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M240 338 L240 364" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="440" width="300" height="58" rx="8" fill="#F3EFE4" stroke="#854F0B" stroke-width="0.5"/>
  <text x="240" y="461" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">落地：mutex / 自旋锁 / 读写锁</text>
  <text x="240" y="481" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#633806">数据库：SELECT ... FOR UPDATE</text>

  <!-- ============ 乐观锁 lane ============ -->
  <rect x="530" y="86" width="380" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="720" y="106" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">乐观锁　假设「冲突很少发生」</text>

  <rect x="570" y="150" width="300" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="720" y="172" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#0C447C">① 不加锁，直接读 value + version</text>

  <rect x="570" y="222" width="300" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="720" y="244" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#0C447C">② 本地计算 new_value</text>

  <rect x="570" y="294" width="300" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="720" y="316" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#0C447C">③ 提交时校验：version 没变？</text>

  <rect x="570" y="366" width="142" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="641" y="388" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#085041">✓ 没变 → 写入</text>

  <rect x="728" y="366" width="142" height="44" rx="8" fill="#FBE9E7" stroke="#B3261E" stroke-width="0.5"/>
  <text x="799" y="388" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#7A1B14">✗ 变了 → 重试 ↺</text>

  <path d="M720 194 L720 220" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720 266 L720 292" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M700 338 L645 364" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M740 338 L795 364" fill="none" stroke="#B3261E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- retry loop back -->
  <path d="M799 410 L799 426 L560 426 L560 172 L568 172" fill="none" stroke="#B3261E"
        stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="570" y="440" width="300" height="58" rx="8" fill="#F3EFE4" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="720" y="461" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">落地：CAS（compare_exchange）/ 版本号</text>
  <text x="720" y="481" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#085041">数据库：UPDATE ... WHERE version=旧值</text>

  <text x="480" y="548" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    开销来源：悲观锁 = 加锁/阻塞/上下文切换　|　乐观锁 = 失败重试 / CPU 自旋
  </text>
</svg>
