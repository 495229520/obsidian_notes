<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5B95"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#F5F4ED"/>

  <title>有界阻塞队列：一把 mutex、两个条件变量与反压</title>
  <desc>上半是生产者与消费者绕同一把锁与两个条件变量构成的控制环，两条唤醒线交叉指向对侧；下半是三种占用状态下谁被挡住，以及有界与无界在内存上的差别。</desc>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">有界阻塞队列：一把锁、两个条件变量，唤醒永远发给对侧</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">notEmpty 挡住消费者，notFull 挡住生产者；队列满时阻塞上游，这就是反压</text>

  <text x="48" y="112" font-size="14" font-weight="700" fill="#4A473F">A · 一个完整的控制环</text>

  <rect x="56" y="124" width="1128" height="300" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <!-- 生产者 -->
  <rect x="76" y="148" width="300" height="176" rx="8" fill="#EDF1F7" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="226" y="174" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">生产者 · put(x)</text>

  <rect x="92" y="186" width="268" height="38" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="226" y="210" font-size="11" fill="#2C4460" text-anchor="middle">① lock(mutex_)</text>

  <rect x="92" y="234" width="268" height="38" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.6"/>
  <text x="226" y="258" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">② notFull_.wait(size &lt; N)</text>

  <rect x="92" y="282" width="268" height="38" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1"/>
  <text x="226" y="306" font-size="11" fill="#2C4460" text-anchor="middle">③ push + notEmpty_.notify_one()</text>

  <!-- 消费者 -->
  <rect x="864" y="148" width="300" height="176" rx="8" fill="#F2ECE1" stroke="#8A6A3A" stroke-width="1.2"/>
  <text x="1014" y="174" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">消费者 · take()</text>

  <rect x="880" y="186" width="268" height="38" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1"/>
  <text x="1014" y="210" font-size="11" fill="#6B4E28" text-anchor="middle">① lock(mutex_)</text>

  <rect x="880" y="234" width="268" height="38" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.6"/>
  <text x="1014" y="258" font-size="11" font-weight="700" fill="#6B4E28" text-anchor="middle">② notEmpty_.wait(!empty)</text>

  <rect x="880" y="282" width="268" height="38" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1"/>
  <text x="1014" y="306" font-size="11" fill="#6B4E28" text-anchor="middle">③ pop + notFull_.notify_one()</text>

  <!-- 队列槽位 -->
  <text x="620" y="152" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">队列 · 容量 N = 12</text>

  <rect x="428" y="162" width="224" height="52" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <rect x="652" y="162" width="160" height="52" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.4"/>
  <line x1="460" y1="162" x2="460" y2="214" stroke="#2F6B5E" stroke-width="0.8"/>
  <line x1="492" y1="162" x2="492" y2="214" stroke="#2F6B5E" stroke-width="0.8"/>
  <line x1="524" y1="162" x2="524" y2="214" stroke="#2F6B5E" stroke-width="0.8"/>
  <line x1="556" y1="162" x2="556" y2="214" stroke="#2F6B5E" stroke-width="0.8"/>
  <line x1="588" y1="162" x2="588" y2="214" stroke="#2F6B5E" stroke-width="0.8"/>
  <line x1="620" y1="162" x2="620" y2="214" stroke="#2F6B5E" stroke-width="0.8"/>
  <line x1="684" y1="162" x2="684" y2="214" stroke="#9B968A" stroke-width="0.8"/>
  <line x1="716" y1="162" x2="716" y2="214" stroke="#9B968A" stroke-width="0.8"/>
  <line x1="748" y1="162" x2="748" y2="214" stroke="#9B968A" stroke-width="0.8"/>
  <line x1="780" y1="162" x2="780" y2="214" stroke="#9B968A" stroke-width="0.8"/>

  <text x="540" y="232" font-size="10.5" font-weight="700" fill="#24473F" text-anchor="middle">已用 7</text>
  <text x="732" y="232" font-size="10.5" fill="#6B675C" text-anchor="middle">空闲 5</text>

  <line x1="376" y1="188" x2="424" y2="188" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#arrB)"/>
  <text x="400" y="180" font-size="10.5" font-weight="700" fill="#3D5A80" text-anchor="middle">入队</text>
  <line x1="812" y1="188" x2="860" y2="188" stroke="#8A6A3A" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="836" y="180" font-size="10.5" font-weight="700" fill="#8A6A3A" text-anchor="middle">出队</text>

  <!-- 条件变量 -->
  <rect x="428" y="270" width="180" height="48" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="518" y="290" font-size="11.5" font-weight="700" fill="#6B5B95" text-anchor="middle">notFull</text>
  <text x="518" y="308" font-size="10" fill="#6B5B95" text-anchor="middle">生产者睡在这</text>

  <rect x="632" y="270" width="180" height="48" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="722" y="290" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">notEmpty</text>
  <text x="722" y="308" font-size="10" fill="#24473F" text-anchor="middle">消费者睡在这</text>

  <path d="M376,253 L402,253 L402,282 L424,282" fill="none" stroke="#6B5B95" stroke-width="1.6" marker-end="url(#arrP)"/>
  <text x="406" y="245" font-size="10" font-weight="700" fill="#6B5B95" text-anchor="middle">满则睡</text>
  <path d="M864,253 L838,253 L838,282 L816,282" fill="none" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="834" y="245" font-size="10" font-weight="700" fill="#2F6B5E" text-anchor="middle">空则睡</text>

  <path d="M226,320 L226,346 L722,346 L722,322" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
  <text x="300" y="340" font-size="10.5" font-weight="700" fill="#3D5A80">push 后唤醒消费者</text>

  <path d="M1014,320 L1014,372 L518,372 L518,322" fill="none" stroke="#8A6A3A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <text x="820" y="366" font-size="10.5" font-weight="700" fill="#8A6A3A">pop 后唤醒生产者</text>

  <text x="76" y="404" font-size="11" fill="#4A473F">两条虚线是交叉的：谁改变了状态，就去唤醒对侧角色 —— 这是最容易写反的一处</text>

  <!-- ===== B 区 ===== -->
  <text x="48" y="460" font-size="14" font-weight="700" fill="#4A473F">B · 三种占用状态谁被挡住，以及有界为什么必要</text>

  <rect x="56" y="472" width="640" height="210" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="70" y="494" font-size="12" font-weight="700" fill="#4A473F">同一段代码，三种局面</text>

  <rect x="68" y="502" width="616" height="24" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="80" y="518" font-size="10.5" font-weight="700" fill="#4A473F">占用</text>
  <text x="284" y="518" font-size="10.5" font-weight="700" fill="#4A473F">状态</text>
  <text x="404" y="518" font-size="10.5" font-weight="700" fill="#4A473F">谁被挡住</text>
  <text x="556" y="518" font-size="10.5" font-weight="700" fill="#4A473F">吞吐</text>

  <rect x="76" y="534" width="176" height="24" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <line x1="98" y1="534" x2="98" y2="558" stroke="#9B968A" stroke-width="0.7"/>
  <line x1="120" y1="534" x2="120" y2="558" stroke="#9B968A" stroke-width="0.7"/>
  <line x1="142" y1="534" x2="142" y2="558" stroke="#9B968A" stroke-width="0.7"/>
  <line x1="164" y1="534" x2="164" y2="558" stroke="#9B968A" stroke-width="0.7"/>
  <line x1="186" y1="534" x2="186" y2="558" stroke="#9B968A" stroke-width="0.7"/>
  <line x1="208" y1="534" x2="208" y2="558" stroke="#9B968A" stroke-width="0.7"/>
  <line x1="230" y1="534" x2="230" y2="558" stroke="#9B968A" stroke-width="0.7"/>
  <text x="284" y="550" font-size="11" font-weight="700" fill="#4A473F">空 0/8</text>
  <text x="404" y="550" font-size="11" fill="#24473F">消费者 wait</text>
  <text x="556" y="550" font-size="11" fill="#4A473F">生产者畅通</text>

  <rect x="76" y="576" width="88" height="24" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1"/>
  <rect x="164" y="576" width="88" height="24" fill="#F1EFE8" stroke="#9B968A" stroke-width="1"/>
  <line x1="98" y1="576" x2="98" y2="600" stroke="#2F6B5E" stroke-width="0.7"/>
  <line x1="120" y1="576" x2="120" y2="600" stroke="#2F6B5E" stroke-width="0.7"/>
  <line x1="142" y1="576" x2="142" y2="600" stroke="#2F6B5E" stroke-width="0.7"/>
  <line x1="186" y1="576" x2="186" y2="600" stroke="#9B968A" stroke-width="0.7"/>
  <line x1="208" y1="576" x2="208" y2="600" stroke="#9B968A" stroke-width="0.7"/>
  <line x1="230" y1="576" x2="230" y2="600" stroke="#9B968A" stroke-width="0.7"/>
  <text x="284" y="592" font-size="11" font-weight="700" fill="#4A473F">半满 4/8</text>
  <text x="404" y="592" font-size="11" fill="#4A473F">无人阻塞</text>
  <text x="556" y="592" font-size="11" font-weight="700" fill="#24473F">最高</text>

  <rect x="76" y="618" width="176" height="24" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1"/>
  <line x1="98" y1="618" x2="98" y2="642" stroke="#A64B3C" stroke-width="0.7"/>
  <line x1="120" y1="618" x2="120" y2="642" stroke="#A64B3C" stroke-width="0.7"/>
  <line x1="142" y1="618" x2="142" y2="642" stroke="#A64B3C" stroke-width="0.7"/>
  <line x1="164" y1="618" x2="164" y2="642" stroke="#A64B3C" stroke-width="0.7"/>
  <line x1="186" y1="618" x2="186" y2="642" stroke="#A64B3C" stroke-width="0.7"/>
  <line x1="208" y1="618" x2="208" y2="642" stroke="#A64B3C" stroke-width="0.7"/>
  <line x1="230" y1="618" x2="230" y2="642" stroke="#A64B3C" stroke-width="0.7"/>
  <text x="284" y="634" font-size="11" font-weight="700" fill="#733428">满 8/8</text>
  <text x="404" y="634" font-size="11" fill="#733428">生产者 wait</text>
  <text x="556" y="634" font-size="11" font-weight="700" fill="#733428">反压上游</text>

  <text x="76" y="666" font-size="10.5" fill="#4A473F">长期贴着满线，说明消费能力不足；长期贴着空线，说明生产跟不上</text>

  <rect x="728" y="472" width="456" height="210" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>
  <text x="742" y="494" font-size="12" font-weight="700" fill="#4A473F">内存的去向</text>

  <rect x="740" y="504" width="432" height="84" rx="6" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="754" y="524" font-size="11.5" font-weight="700" fill="#733428">无界队列</text>
  <text x="754" y="546" font-size="10.5" fill="#733428">生产快于消费 → 队列一直涨</text>
  <text x="754" y="568" font-size="10.5" fill="#733428">直到 OOM，故障来得很突然</text>
  <polyline points="1000,578 1030,568 1060,552 1090,536 1120,522 1150,512" fill="none" stroke="#A64B3C" stroke-width="1.8"/>

  <rect x="740" y="598" width="432" height="76" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="754" y="618" font-size="11.5" font-weight="700" fill="#24473F">有界队列</text>
  <text x="754" y="640" font-size="10.5" fill="#24473F">满则阻塞生产者，速率被迫收敛</text>
  <text x="754" y="661" font-size="10.5" fill="#24473F">内存封顶在 N，压力传回上游</text>
  <line x1="1000" y1="626" x2="1155" y2="626" stroke="#2F6B5E" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1160" y="630" font-size="9.5" fill="#24473F">N</text>
  <polyline points="1000,664 1030,652 1060,640 1090,632 1120,630 1150,630" fill="none" stroke="#2F6B5E" stroke-width="1.8"/>

  <text x="48" y="714" font-size="11.5" fill="#4A473F">反压不是限流的副作用，而是有界队列的主要目的：把上游速率拉到下游能承受的水平。</text>
  <text x="48" y="736" font-size="11.5" fill="#4A473F">两个条件变量共用同一把 mutex；wait 必须写谓词版本，唤醒只是「状态可能变了」的提示。</text>
</svg>
