<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <rect x="0" y="0" width="960" height="620" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>可见性的硬件根源：Store Buffer 与 Invalidate Queue</title>
  <desc>CPU0 的写堵在 Store Buffer，CPU1 的失效堵在 Invalidate Queue，导致另一核暂时看不到最新值。</desc>

  <text x="480" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441">
    可见性的硬件根源：Store Buffer 与 Invalidate Queue
  </text>
  <text x="480" y="56" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">
    写不会立刻落到缓存/内存，失效也不会立刻处理 → 另一核暂时看不到最新值
  </text>

  <!-- column headers -->
  <text x="240" y="92" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">CPU 0（写者）</text>
  <text x="720" y="92" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">CPU 1（读者）</text>
  <line x1="60" y1="106" x2="420" y2="106" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="540" y1="106" x2="900" y2="106" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="480" y1="120" x2="480" y2="450" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 5"/>

  <!-- CPU0 boxes -->
  <rect x="60" y="124" width="360" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="240" y="146" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#0C447C">执行单元：x = 1;  flag = 1;</text>

  <rect x="60" y="228" width="360" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="240" y="248" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">Store Buffer（写缓冲）</text>
  <text x="240" y="268" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#633806">写先排队于此，稍后才刷入缓存</text>

  <rect x="60" y="344" width="360" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="240" y="366" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">L1 Cache</text>
  <text x="240" y="388" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#444441">x = 0    flag = 0</text>
  <text x="240" y="406" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">（尚未收到新值）</text>

  <!-- CPU1 boxes -->
  <rect x="540" y="124" width="360" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="720" y="146" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" fill="#633806">执行单元：while(flag==0); read x;</text>

  <rect x="540" y="228" width="360" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="720" y="248" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3C3489">Invalidate Queue（失效队列）</text>
  <text x="720" y="268" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#3C3489">失效消息先排队，缓存暂未更新</text>

  <rect x="540" y="344" width="360" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="720" y="366" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">L1 Cache（旧副本）</text>
  <text x="720" y="388" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#444441">x = 0    flag = 0</text>
  <text x="720" y="406" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">（仍读到旧值）</text>

  <!-- shared memory bus -->
  <rect x="300" y="484" width="360" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="480" y="506" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">主存 / 末级缓存（MESI 一致性域）</text>
  <text x="480" y="528" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#085041">缓存间通过总线交换 Read / Invalidate 消息</text>

  <!-- arrows -->
  <path d="M240 168 L240 228" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M240 284 L240 344" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="300" y="314" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#854F0B">延迟刷入</text>

  <path d="M720 284 L720 344" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="780" y="314" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="11" fill="#534AB7">延迟失效</text>

  <path d="M330 424 L370 484" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M630 484 L590 424" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="480" y="580" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" fill="#444441">
    内存屏障的作用：强制排空 Store Buffer / Invalidate Queue，使写对其他核可见
  </text>
</svg>
