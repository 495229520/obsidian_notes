<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680"
     font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>银行家算法：安全状态与请求判定</title>
  <desc>左侧区分安全、非安全和死锁状态；右侧展示请求检查、试分配、安全性检查以及提交或回滚。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A64B3C"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>

  <text x="48" y="45" font-size="22" font-weight="700" fill="#2B2A26">银行家算法：只批准“仍然可证明完成”的请求</text>
  <text x="48" y="73" font-size="14" fill="#6B675C">请求可用不等于请求安全；先试分配，再寻找覆盖全部进程的安全序列</text>

  <rect x="40" y="102" width="540" height="506" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="66" y="136" font-size="15" font-weight="700" fill="#4A473F">A · 三种状态不是同义词</text>
  <text x="66" y="160" font-size="12" fill="#6B675C">安全性问“能否保证完成”，死锁问“现在是否已经停住”</text>

  <rect x="72" y="188" width="222" height="300" rx="10" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="183" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#24473F">安全状态</text>
  <text x="183" y="258" text-anchor="middle" font-size="12.5" fill="#24473F">存在至少一条安全序列</text>
  <text x="183" y="286" text-anchor="middle" font-size="12" fill="#4A675F">即使立即索要全部 Need</text>
  <text x="183" y="311" text-anchor="middle" font-size="12" fill="#4A675F">仍可让所有进程结束</text>
  <path d="M116 372 H250" stroke="#2F6B5E" stroke-width="2" marker-end="url(#arr-green)"/>
  <circle cx="116" cy="372" r="20" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.3"/>
  <circle cx="183" cy="372" r="20" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.3"/>
  <circle cx="250" cy="372" r="20" fill="#FBFBF6" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="116" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">P2</text>
  <text x="183" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">P0</text>
  <text x="250" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#24473F">P1</text>
  <text x="183" y="421" text-anchor="middle" font-size="12" fill="#4A675F">完成一个，释放一批资源</text>
  <text x="183" y="446" text-anchor="middle" font-size="12" fill="#4A675F">Work 单调不减</text>

  <rect x="316" y="188" width="232" height="300" rx="10" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/>
  <text x="432" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#6B4E28">非安全状态</text>
  <text x="432" y="258" text-anchor="middle" font-size="12.5" fill="#6B4E28">找不到覆盖全部进程的序列</text>
  <text x="432" y="286" text-anchor="middle" font-size="12" fill="#7B6342">系统可能暂时继续运行</text>
  <text x="432" y="311" text-anchor="middle" font-size="12" fill="#7B6342">但已失去完成保证</text>

  <rect x="350" y="342" width="164" height="102" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="432" y="376" text-anchor="middle" font-size="15" font-weight="700" fill="#733428">死锁状态</text>
  <text x="432" y="405" text-anchor="middle" font-size="12" fill="#733428">互相等待</text>
  <text x="432" y="428" text-anchor="middle" font-size="12" fill="#733428">没有进程能推进</text>

  <rect x="72" y="514" width="476" height="58" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/>
  <text x="310" y="539" text-anchor="middle" font-size="14" font-weight="700" fill="#2C4460">关键：Unsafe ≠ Deadlock</text>
  <text x="310" y="560" text-anchor="middle" font-size="11.5" fill="#2C4460">非安全表示“不能保证”，不是“已经卡死”</text>

  <rect x="610" y="102" width="590" height="506" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="636" y="136" font-size="15" font-weight="700" fill="#4A473F">B · 一次资源请求的决策门</text>
  <text x="636" y="160" font-size="12" fill="#6B675C">前两关查合法性与可用性，最后一关查全局安全性</text>

  <rect x="646" y="186" width="142" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="717" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4460">Request_i</text>
  <text x="717" y="227" text-anchor="middle" font-size="11.5" fill="#2C4460">进程 i 的请求向量</text>

  <path d="M788 213 H828" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <polygon points="894,174 966,213 894,252 822,213" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="894" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#6B4E28">Request_i</text>
  <text x="894" y="224" text-anchor="middle" font-size="11" fill="#6B4E28">≤ Need_i ?</text>

  <path d="M966 213 H1010" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <rect x="1012" y="185" width="154" height="56" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/>
  <text x="1089" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#733428">否：越界请求</text>
  <text x="1089" y="227" text-anchor="middle" font-size="11" fill="#733428">违反最大需求声明</text>
  <text x="982" y="202" font-size="10.5" fill="#A64B3C">否</text>

  <path d="M894 252 V278" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="908" y="270" font-size="10.5" fill="#4A473F">是</text>
  <polygon points="894,278 974,318 894,358 814,318" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.4"/>
  <text x="894" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#6B4E28">Request_i</text>
  <text x="894" y="329" text-anchor="middle" font-size="11" fill="#6B4E28">≤ Available ?</text>

  <path d="M974 318 H1010" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="1012" y="290" width="154" height="56" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="1089" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#6B4E28">否：暂时等待</text>
  <text x="1089" y="332" text-anchor="middle" font-size="11" fill="#6B4E28">资源当前不足</text>
  <text x="982" y="307" font-size="10.5" fill="#8A6A3A">否</text>

  <path d="M894 358 V382" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="908" y="375" font-size="10.5" fill="#4A473F">是</text>
  <rect x="816" y="384" width="156" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="894" y="405" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2C4460">试分配</text>
  <text x="894" y="425" text-anchor="middle" font-size="11" fill="#2C4460">更新三项状态</text>

  <path d="M894 438 V458" stroke="#5A564B" stroke-width="1.7" marker-end="url(#arr)"/>
  <polygon points="894,458 974,498 894,538 814,498" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/>
  <text x="894" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4460">存在安全序列?</text>
  <text x="894" y="510" text-anchor="middle" font-size="11" fill="#2C4460">Safety check</text>

  <path d="M814 498 H748" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arr-green)"/>
  <rect x="646" y="470" width="104" height="56" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="698" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#24473F">是：提交</text>
  <text x="698" y="512" text-anchor="middle" font-size="11" fill="#24473F">批准请求</text>
  <text x="772" y="487" font-size="10.5" fill="#2F6B5E">是</text>

  <path d="M974 498 H1010" stroke="#A64B3C" stroke-width="1.7" marker-end="url(#arr-red)"/>
  <rect x="1012" y="470" width="154" height="56" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.4"/>
  <text x="1089" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#733428">否：回滚</text>
  <text x="1089" y="512" text-anchor="middle" font-size="11" fill="#733428">撤销试分配并等待</text>
  <text x="982" y="487" font-size="10.5" fill="#A64B3C">否</text>

  <rect x="646" y="552" width="520" height="34" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.1"/>
  <text x="906" y="574" text-anchor="middle" font-size="11.5" fill="#4A473F">试分配不是副本演示：生产代码必须原子提交，失败时完整回滚</text>
</svg>
