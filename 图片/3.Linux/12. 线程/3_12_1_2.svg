<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <title id="title">线程状态转换图</title>
  <desc id="desc">线程从新建进入就绪，被调度后运行，可能进入阻塞，也可能结束；阻塞条件满足后回到就绪。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      .title { font: 700 28px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .state-title { font: 700 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .state-desc { font: 500 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #455a64; }
      .arrow-text { font: 500 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #546e7a; }
      .note-title { font: 700 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #37474f; }
      .note { font: 500 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #455a64; }
      .create { fill: #edf4fb; stroke: #4e79a7; }
      .ready { fill: #eef6ec; stroke: #59a14f; }
      .running { fill: #fff4de; stroke: #d28b26; }
      .blocked { fill: #f4edf8; stroke: #8b6bb1; }
      .done { fill: #f7eeee; stroke: #b55d5d; }
      .box { stroke-width: 2; }
      .note-box { fill: #fbfaf4; stroke: #9aa7ad; stroke-width: 1.6; }
      .arrow { fill: none; stroke: #607d8b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #78909c; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#607d8b" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#78909c" stroke-width="1.7"/>
    </marker>
  </defs>

  <text class="title" x="480" y="48" text-anchor="middle">线程的 5 种常见状态</text>

  <g transform="translate(56 126)">
    <rect class="box create" x="0" y="0" width="140" height="86" rx="12"/>
    <text class="state-title" x="70" y="34" text-anchor="middle">新建</text>
    <text class="state-desc" x="70" y="60" text-anchor="middle">刚创建</text>
  </g>

  <g transform="translate(256 126)">
    <rect class="box ready" x="0" y="0" width="148" height="86" rx="12"/>
    <text class="state-title" x="74" y="34" text-anchor="middle">就绪</text>
    <text class="state-desc" x="74" y="60" text-anchor="middle">等待 CPU</text>
  </g>

  <g transform="translate(510 126)">
    <rect class="box running" x="0" y="0" width="148" height="86" rx="12"/>
    <text class="state-title" x="74" y="34" text-anchor="middle">运行</text>
    <text class="state-desc" x="74" y="60" text-anchor="middle">正在执行</text>
  </g>

  <g transform="translate(764 126)">
    <rect class="box done" x="0" y="0" width="140" height="86" rx="12"/>
    <text class="state-title" x="70" y="34" text-anchor="middle">终止</text>
    <text class="state-desc" x="70" y="60" text-anchor="middle">执行结束</text>
  </g>

  <g transform="translate(510 318)">
    <rect class="box blocked" x="0" y="0" width="148" height="92" rx="12"/>
    <text class="state-title" x="74" y="35" text-anchor="middle">阻塞</text>
    <text class="state-desc" x="74" y="61" text-anchor="middle">等 IO / 锁</text>
  </g>

  <path class="arrow" d="M 196 169 L 246 169"/>
  <text class="arrow-text" x="221" y="154" text-anchor="middle">start</text>

  <path class="arrow" d="M 404 154 C 438 124, 472 124, 506 154"/>
  <text class="arrow-text" x="457" y="116" text-anchor="middle">被调度</text>

  <path class="soft-arrow" d="M 510 184 C 468 226, 424 226, 384 184"/>
  <text class="arrow-text" x="457" y="238" text-anchor="middle">时间片用完 / 被抢占</text>

  <path class="arrow" d="M 658 169 L 754 169"/>
  <text class="arrow-text" x="706" y="154" text-anchor="middle">线程函数返回</text>

  <path class="arrow" d="M 584 212 L 584 308"/>
  <text class="arrow-text" x="642" y="264" text-anchor="middle">等待资源</text>

  <path class="arrow" d="M 510 364 C 414 362, 352 300, 330 224"/>
  <text class="arrow-text" x="402" y="338" text-anchor="middle">条件满足</text>

  <rect class="note-box" x="78" y="450" width="804" height="72" rx="10"/>
  <text class="note-title" x="102" y="478">记忆重点</text>
  <text class="note" x="102" y="505">新建、就绪、运行、阻塞、终止是教学中最常见的 5 状态模型；实际 Linux 内核状态更细，学习阶段先抓住这个转换关系。</text>
</svg>
