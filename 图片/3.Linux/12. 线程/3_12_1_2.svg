<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680"
     role="img" aria-labelledby="title desc"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title id="title">线程的五状态教学模型与状态转换</title>
  <desc id="desc">主轴展示线程从新建进入就绪、被调度后运行、最终终止；运行线程可以因等待资源进入阻塞，条件满足后只返回就绪队列。底部说明就绪、阻塞以及 Linux TASK_RUNNING 的含义。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">线程状态不是“身份”：它描述此刻能不能被 CPU 调度</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">主循环是就绪 ↔ 运行；等待事件进入阻塞，条件满足也只是重新获得竞争 CPU 的资格</text>

  <rect x="48" y="108" width="1144" height="354" rx="10" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.3"/>
  <text x="64" y="136" font-size="13" font-weight="700" fill="#4A473F">A · 五状态主图：先看“是否可运行”，再看“是否正在占用 CPU”</text>

  <rect x="72" y="176" width="160" height="92" rx="9" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="152" y="208" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">新建 New</text>
  <text x="152" y="236" font-size="11.5" fill="#2C4460" text-anchor="middle">已创建 · 未执行</text>

  <rect x="300" y="176" width="210" height="92" rx="9" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="405" y="208" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">就绪 Ready</text>
  <text x="405" y="236" font-size="11.5" fill="#24473F" text-anchor="middle">可运行 · 等 CPU</text>

  <rect x="665" y="176" width="210" height="92" rx="9" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="770" y="208" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">运行 Running</text>
  <text x="770" y="236" font-size="11.5" fill="#6B4E28" text-anchor="middle">正在占用 CPU</text>

  <rect x="1008" y="176" width="160" height="92" rx="9" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="1088" y="208" font-size="14" font-weight="700" fill="#733428" text-anchor="middle">终止 Exit</text>
  <text x="1088" y="236" font-size="11.5" fill="#733428" text-anchor="middle">不再参与调度</text>

  <rect x="665" y="346" width="210" height="88" rx="9" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="770" y="377" font-size="14" font-weight="700" fill="#5B4A83" text-anchor="middle">阻塞 Blocked</text>
  <text x="770" y="405" font-size="11.5" fill="#5B4A83" text-anchor="middle">不可运行 · 等事件</text>

  <path d="M232,222 L290,222" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="261" y="205" font-size="10.5" fill="#6B675C" text-anchor="middle">start</text>

  <path d="M510,202 L655,202" fill="none" stroke="#2F6B5E" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="582" y="186" font-size="10.5" fill="#2F6B5E" text-anchor="middle">调度器选中</text>

  <path d="M665,244 L520,244" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrb)"/>
  <text x="592" y="263" font-size="10.5" fill="#3D5A80" text-anchor="middle">时间片耗尽 / 被抢占</text>

  <path d="M875,222 L998,222" fill="none" stroke="#A64B3C" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="936" y="205" font-size="10.5" fill="#733428" text-anchor="middle">函数返回</text>

  <path d="M770,268 L770,336" fill="none" stroke="#6B5B95" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="789" y="307" font-size="10.5" fill="#6B5B95">等待 I/O / mutex / cond</text>

  <path d="M665,390 L570,390 L570,308 L405,308 L405,278" fill="none" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="484" y="414" font-size="10.5" fill="#6B675C" text-anchor="middle">事件完成 / 锁可用 / 被唤醒</text>

  <text x="48" y="492" font-size="13" font-weight="700" fill="#4A473F">B · 三个容易混淆的判断</text>

  <rect x="48" y="508" width="350" height="98" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/>
  <text x="68" y="536" font-size="12.5" font-weight="700" fill="#24473F">就绪 ≠ 正在运行</text>
  <text x="68" y="560" font-size="11.5" fill="#24473F">已具备运行条件，排在 run queue</text>
  <text x="68" y="582" font-size="11.5" fill="#24473F">还要等调度器分配 CPU</text>

  <rect x="420" y="508" width="350" height="98" rx="8" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.4"/>
  <text x="440" y="536" font-size="12.5" font-weight="700" fill="#5B4A83">阻塞 ≠ 排队等 CPU</text>
  <text x="440" y="560" font-size="11.5" fill="#5B4A83">条件尚未满足，不参与 CPU 调度</text>
  <text x="440" y="582" font-size="11.5" fill="#5B4A83">唤醒后先回就绪队列</text>

  <rect x="792" y="508" width="400" height="98" rx="8" fill="#F1EFE8" stroke="#8A8574" stroke-width="1.4"/>
  <text x="812" y="536" font-size="12.5" font-weight="700" fill="#2B2A26">Linux 内核对应关系</text>
  <text x="812" y="560" font-size="11.5" fill="#4A473F">TASK_RUNNING 同时覆盖“就绪 / 运行”</text>
  <text x="812" y="582" font-size="11.5" fill="#4A473F">本图是便于入门的五状态教学模型</text>

  <rect x="48" y="624" width="1144" height="32" rx="6" fill="#EFE7DA" stroke="#C9B58D" stroke-width="1"/>
  <text x="620" y="645" font-size="11.5" fill="#6B4E28" text-anchor="middle">判断顺序：能运行吗？不能 → 阻塞；能 → 就绪；此刻占着 CPU → 运行</text>
</svg>
