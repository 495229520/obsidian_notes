<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="两个信号量实现单格生产者消费者流程图" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1200" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      .title { font: 700 28px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .subtitle { font: 600 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #54666c; }
      .lane-title { font: 700 22px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .lane-sub { font: 650 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #37474f; }
      .step-main { font: 700 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .step-sub { font: 600 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #455a64; }
      .sem-main { font: 700 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f4539; }
      .sem-sub { font: 600 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5b604d; }
      .note { font: 650 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5b584d; }
      .producer { fill: #eaf3f8; stroke: #42677c; stroke-width: 2.2; }
      .middle { fill: #f1f5e5; stroke: #6f7d4d; stroke-width: 2.2; }
      .consumer { fill: #fff0c8; stroke: #a66e16; stroke-width: 2.2; }
      .step-blue { fill: #ffffff; stroke: #42677c; stroke-width: 1.8; }
      .step-orange { fill: #ffffff; stroke: #a66e16; stroke-width: 1.8; }
      .sem-two { fill: #fff7d6; stroke: #b07d37; stroke-width: 2; }
      .sem-one { fill: #e5f1db; stroke: #4f7b58; stroke-width: 2; }
      .buffer { fill: #f8f6ec; stroke: #6b6b5e; stroke-width: 2; }
      .arrow { fill: none; stroke: #37474f; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .green-arrow { fill: none; stroke: #4f7b58; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .orange-arrow { fill: none; stroke: #b07d37; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #8b6b3f; stroke-width: 2; stroke-dasharray: 8 7; stroke-linecap: round; marker-end: url(#softArrow); }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#37474f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="softArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8b6b3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="title" x="600" y="46" text-anchor="middle">两个信号量实现“单格生产者 - 消费者”</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="subtitle" x="600" y="84" text-anchor="middle">sem_two 初始为 1：输入线程先跑；sem_one 初始为 0：计算线程先等</text>

  <rect class="producer" x="60" y="120" width="330" height="500" rx="18"/>
  <rect class="middle" x="435" y="120" width="330" height="500" rx="18"/>
  <rect class="consumer" x="810" y="120" width="330" height="500" rx="18"/>

  <rect class="step-blue" x="100" y="210" width="250" height="74" rx="13"/>
  <rect class="step-blue" x="100" y="325" width="250" height="78" rx="13"/>
  <rect class="step-blue" x="100" y="475" width="250" height="78" rx="13"/>
  <rect class="sem-two" x="475" y="207" width="250" height="82" rx="16"/>
  <rect class="buffer" x="475" y="330" width="250" height="86" rx="16"/>
  <rect class="sem-one" x="475" y="480" width="250" height="82" rx="16"/>
  <rect class="step-orange" x="850" y="210" width="250" height="74" rx="13"/>
  <rect class="step-orange" x="850" y="325" width="250" height="78" rx="13"/>
  <rect class="step-orange" x="850" y="475" width="250" height="78" rx="13"/>

  <path class="arrow" d="M475 247 L360 247"/>
  <path class="arrow" d="M350 364 L465 373"/>
  <path class="green-arrow" d="M350 514 L465 521"/>
  <path class="green-arrow" d="M725 521 C790 520 805 250 840 247"/>
  <path class="arrow" d="M725 373 L840 364"/>
  <path class="orange-arrow" d="M850 514 C805 510 790 250 735 247"/>
  <path class="loop" d="M975 560 C1000 670 200 670 225 560"/>

  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="lane-title" x="225" y="153" text-anchor="middle">输入线程 Producer</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="lane-sub" x="225" y="181" text-anchor="middle">input_num()</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="lane-title" x="600" y="153" text-anchor="middle">信号量 + 共享 num</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="lane-sub" x="600" y="181" text-anchor="middle">一个槽位，轮流交接</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="lane-title" x="975" y="153" text-anchor="middle">计算线程 Consumer</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="lane-sub" x="975" y="181" text-anchor="middle">主线程 lession96()</text>

  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-main" x="225" y="242" text-anchor="middle">1. sem_wait(&amp;sem_two)</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-sub" x="225" y="266" text-anchor="middle">拿到“输入许可”</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-main" x="225" y="359" text-anchor="middle">2. scanf("%d", &amp;num)</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-sub" x="225" y="383" text-anchor="middle">生产一个数字</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-main" x="225" y="509" text-anchor="middle">3. sem_post(&amp;sem_one)</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-sub" x="225" y="533" text-anchor="middle">唤醒计算线程</text>

  <circle cx="508" cy="248" r="17" fill="#f2b84b" stroke="#8b5f21" stroke-width="1.5"/>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="sem-main" x="610" y="242" text-anchor="middle">sem_two：输入许可</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="sem-sub" x="610" y="267" text-anchor="middle">初始 1，wait 后变 0</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="sem-main" x="600" y="368" text-anchor="middle">全局变量 num</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="sem-sub" x="600" y="393" text-anchor="middle">只有一格的共享缓冲区</text>
  <circle cx="508" cy="521" r="17" fill="#75b978" stroke="#3f7046" stroke-width="1.5"/>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="sem-main" x="610" y="515" text-anchor="middle">sem_one：数据就绪</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="sem-sub" x="610" y="540" text-anchor="middle">初始 0，post 后变 1</text>

  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-main" x="975" y="242" text-anchor="middle">4. sem_wait(&amp;sem_one)</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-sub" x="975" y="266" text-anchor="middle">等输入线程交货</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-main" x="975" y="359" text-anchor="middle">5. sum += num</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-sub" x="975" y="383" text-anchor="middle">消费这个数字</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-main" x="975" y="509" text-anchor="middle">6. sem_post(&amp;sem_two)</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="step-sub" x="975" y="533" text-anchor="middle">放行下一次输入</text>

  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="note" x="600" y="681" text-anchor="middle">一轮完成后回到第 1 步，for 循环重复 count = 5 次</text>
  <rect x="120" y="705" width="960" height="34" rx="12" fill="#fbfaf0" stroke="#d4c8a3" stroke-width="1.4"/>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="note" x="600" y="728" text-anchor="middle">关键直觉：sem_two 管“能不能继续输入”，sem_one 管“有没有新数据可累加”。</text>
</svg>
