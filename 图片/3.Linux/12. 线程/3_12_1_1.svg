<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <title id="title">进程与线程资源关系</title>
  <desc id="desc">一个进程包含共享资源区域和三个线程，每个线程都有独立的栈、程序计数器和寄存器。</desc>
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <style>
      .title { font: 700 26px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .label { font: 600 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .small { font: 500 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #37474f; }
      .tiny { font: 500 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #455a64; }
      .process { fill: #f8f6ec; stroke: #263238; stroke-width: 2.5; }
      .shared { fill: #dfeede; stroke: #4f7b58; stroke-width: 2; }
      .thread { fill: #e8f1f7; stroke: #42677c; stroke-width: 2; }
      .private { fill: #fffaf0; stroke: #b07d37; stroke-width: 1.8; }
      .divider { stroke: #8d9ca3; stroke-width: 1.5; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="process" x="45" y="38" width="810" height="435" rx="18"/>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="title" x="450" y="78" text-anchor="middle">进程 Process</text>

  <rect class="shared" x="105" y="108" width="690" height="88" rx="12"/>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="label" x="450" y="144" text-anchor="middle">共享资源</text>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="small" x="450" y="174" text-anchor="middle">堆、全局变量、文件描述符、地址空间等</text>

  <line class="divider" x1="105" y1="232" x2="795" y2="232"/>
  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="tiny" x="450" y="220" text-anchor="middle">下面每个线程都有自己的执行现场</text>

  <g transform="translate(105 260)">
    <rect class="thread" x="0" y="0" width="200" height="160" rx="14"/>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="label" x="100" y="34" text-anchor="middle">线程 1</text>
    <rect class="private" x="38" y="54" width="124" height="82" rx="9"/>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="small" x="100" y="81" text-anchor="middle">栈 Stack</text>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="small" x="100" y="106" text-anchor="middle">PC</text>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="small" x="100" y="130" text-anchor="middle">寄存器</text>
  </g>

  <g transform="translate(350 260)">
    <rect class="thread" x="0" y="0" width="200" height="160" rx="14"/>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="label" x="100" y="34" text-anchor="middle">线程 2</text>
    <rect class="private" x="38" y="54" width="124" height="82" rx="9"/>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="small" x="100" y="81" text-anchor="middle">栈 Stack</text>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="small" x="100" y="106" text-anchor="middle">PC</text>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="small" x="100" y="130" text-anchor="middle">寄存器</text>
  </g>

  <g transform="translate(595 260)">
    <rect class="thread" x="0" y="0" width="200" height="160" rx="14"/>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="label" x="100" y="34" text-anchor="middle">线程 3</text>
    <rect class="private" x="38" y="54" width="124" height="82" rx="9"/>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="small" x="100" y="81" text-anchor="middle">栈 Stack</text>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="small" x="100" y="106" text-anchor="middle">PC</text>
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="small" x="100" y="130" text-anchor="middle">寄存器</text>
  </g>

  <text font-family="PingFang SC, Microsoft YaHei, sans-serif" class="tiny" x="450" y="454" text-anchor="middle">同一进程内：资源共享；每个线程：栈、PC、寄存器独立</text>
</svg>
