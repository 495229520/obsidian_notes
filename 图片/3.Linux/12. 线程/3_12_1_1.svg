<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680"
     role="img" aria-labelledby="title desc"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title id="title">一个进程，多条执行流：线程共享什么、独有什么</title>
  <desc id="desc">上半部分展示同一进程内所有线程共享的地址空间、文件描述符和进程属性；下半部分展示三个线程各自独立的栈、寄存器、程序计数器、线程 ID、信号掩码和线程局部存储。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="680" fill="rgb(245, 244, 237)"/>

  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">一个进程，多条执行流：线程共享什么、独有什么</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">共享的是进程资源；调度器保存与恢复的是每个线程自己的执行现场</text>

  <rect x="32" y="104" width="1176" height="532" rx="12" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.4"/>
  <text x="56" y="130" font-size="13" font-weight="700" fill="#4A473F">进程 Process · 一个 PID / 地址空间容器</text>

  <text x="56" y="158" font-size="13" font-weight="700" fill="#24473F">A · 进程级资源：所有线程看到同一份</text>
  <rect x="56" y="172" width="1128" height="124" rx="9" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>

  <rect x="78" y="194" width="190" height="78" rx="7" fill="#FBFBF6" stroke="#8FB1A7" stroke-width="1.1"/>
  <text x="173" y="221" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">代码段 / 映射</text>
  <text x="173" y="246" font-size="11" fill="#4A473F" text-anchor="middle">text · mmap · shared libs</text>

  <rect x="286" y="194" width="190" height="78" rx="7" fill="#FBFBF6" stroke="#8FB1A7" stroke-width="1.1"/>
  <text x="381" y="221" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">全局变量 / 堆</text>
  <text x="381" y="246" font-size="11" fill="#4A473F" text-anchor="middle">data · bss · heap</text>

  <rect x="494" y="194" width="190" height="78" rx="7" fill="#FBFBF6" stroke="#8FB1A7" stroke-width="1.1"/>
  <text x="589" y="221" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">文件描述符表</text>
  <text x="589" y="246" font-size="11" fill="#4A473F" text-anchor="middle">fd → struct file</text>

  <rect x="702" y="194" width="190" height="78" rx="7" fill="#FBFBF6" stroke="#8FB1A7" stroke-width="1.1"/>
  <text x="797" y="221" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">信号处置</text>
  <text x="797" y="246" font-size="11" fill="#4A473F" text-anchor="middle">handler / disposition</text>

  <rect x="910" y="194" width="252" height="78" rx="7" fill="#FBFBF6" stroke="#8FB1A7" stroke-width="1.1"/>
  <text x="1036" y="221" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">进程属性</text>
  <text x="1036" y="246" font-size="11" fill="#4A473F" text-anchor="middle">cwd · credentials · limits</text>

  <text x="56" y="330" font-size="13" font-weight="700" fill="#2C4460">B · 线程级执行现场：每个线程各自保存一份</text>

  <path d="M232,296 L232,350" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arrg)"/>
  <path d="M620,296 L620,350" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arrg)"/>
  <path d="M1008,296 L1008,350" fill="none" stroke="#2F6B5E" stroke-width="1.5" marker-end="url(#arrg)"/>
  <text x="646" y="318" font-size="10.5" fill="#2F6B5E">共同引用</text>

  <g>
    <rect x="56" y="356" width="352" height="220" rx="9" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
    <text x="76" y="382" font-size="13" font-weight="700" fill="#2C4460">线程 1 · Thread 1</text>
    <text x="388" y="382" font-size="10.5" fill="#6B675C" text-anchor="end">独立调度实体</text>
    <rect x="76" y="400" width="312" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
    <text x="92" y="427" font-size="11.5" font-weight="700" fill="#6B4E28">Stack</text>
    <text x="372" y="427" font-size="11" fill="#6B4E28" text-anchor="end">局部变量 · 调用帧</text>
    <rect x="76" y="456" width="312" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
    <text x="92" y="483" font-size="11.5" font-weight="700" fill="#6B4E28">CPU context</text>
    <text x="372" y="483" font-size="11" fill="#6B4E28" text-anchor="end">PC · SP · 通用寄存器</text>
    <rect x="76" y="512" width="312" height="44" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.1"/>
    <text x="92" y="539" font-size="11.5" font-weight="700" fill="#4A473F">Thread state</text>
    <text x="372" y="539" font-size="11" fill="#4A473F" text-anchor="end">TID · 信号掩码 · TLS / errno</text>
  </g>

  <g>
    <rect x="444" y="356" width="352" height="220" rx="9" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
    <text x="464" y="382" font-size="13" font-weight="700" fill="#2C4460">线程 2 · Thread 2</text>
    <text x="776" y="382" font-size="10.5" fill="#6B675C" text-anchor="end">独立调度实体</text>
    <rect x="464" y="400" width="312" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
    <text x="480" y="427" font-size="11.5" font-weight="700" fill="#6B4E28">Stack</text>
    <text x="760" y="427" font-size="11" fill="#6B4E28" text-anchor="end">局部变量 · 调用帧</text>
    <rect x="464" y="456" width="312" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
    <text x="480" y="483" font-size="11.5" font-weight="700" fill="#6B4E28">CPU context</text>
    <text x="760" y="483" font-size="11" fill="#6B4E28" text-anchor="end">PC · SP · 通用寄存器</text>
    <rect x="464" y="512" width="312" height="44" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.1"/>
    <text x="480" y="539" font-size="11.5" font-weight="700" fill="#4A473F">Thread state</text>
    <text x="760" y="539" font-size="11" fill="#4A473F" text-anchor="end">TID · 信号掩码 · TLS / errno</text>
  </g>

  <g>
    <rect x="832" y="356" width="352" height="220" rx="9" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
    <text x="852" y="382" font-size="13" font-weight="700" fill="#2C4460">线程 3 · Thread 3</text>
    <text x="1164" y="382" font-size="10.5" fill="#6B675C" text-anchor="end">独立调度实体</text>
    <rect x="852" y="400" width="312" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
    <text x="868" y="427" font-size="11.5" font-weight="700" fill="#6B4E28">Stack</text>
    <text x="1148" y="427" font-size="11" fill="#6B4E28" text-anchor="end">局部变量 · 调用帧</text>
    <rect x="852" y="456" width="312" height="44" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.2"/>
    <text x="868" y="483" font-size="11.5" font-weight="700" fill="#6B4E28">CPU context</text>
    <text x="1148" y="483" font-size="11" fill="#6B4E28" text-anchor="end">PC · SP · 通用寄存器</text>
    <rect x="852" y="512" width="312" height="44" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.1"/>
    <text x="868" y="539" font-size="11.5" font-weight="700" fill="#4A473F">Thread state</text>
    <text x="1148" y="539" font-size="11" fill="#4A473F" text-anchor="end">TID · 信号掩码 · TLS / errno</text>
  </g>

  <rect x="56" y="594" width="1128" height="28" rx="6" fill="#EFE7DA" stroke="#C9B58D" stroke-width="1"/>
  <text x="620" y="613" font-size="11.5" fill="#6B4E28" text-anchor="middle">判断边界：改全局变量 → 其他线程可能看见；改局部变量 → 留在本线程栈内</text>
</svg>
