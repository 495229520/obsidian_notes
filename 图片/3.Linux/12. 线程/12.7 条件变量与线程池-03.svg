<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>线程池关闭时序</title>
  <desc>三条泳道展示 stop 置位、broadcast 唤醒 worker 与提交者、worker 重查退出条件，再到 join 与 destroy 的回收顺序。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07D2B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="rgb(245, 244, 237)"/>

  <text x="48" y="54" font-size="22" font-weight="700" fill="#2B2A26">线程池关闭时序：stop → broadcast → 退出 → join → destroy</text>
  <text x="48" y="82" font-size="13" fill="#6B675C">销毁同步对象必须排在所有 join 之后；唤醒必须覆盖两个条件变量，否则总有人醒不过来</text>

  <text x="48" y="116" font-size="15" font-weight="700" fill="#4A473F">A · 唤醒阶段：stop 与 broadcast 在同一段临界区里完成</text>

  <rect x="56" y="128" width="1128" height="296" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <!-- 泳道背景 -->
  <rect x="68" y="146" width="1104" height="80" rx="7" fill="#EDF1F7" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="68" y="234" width="1104" height="88" rx="7" fill="#E6EFEA" stroke="#D8D5C8" stroke-width="1"/>
  <rect x="68" y="330" width="1104" height="80" rx="7" fill="#EDEAF3" stroke="#D8D5C8" stroke-width="1"/>

  <text x="80" y="182" font-size="11.5" font-weight="700" fill="#3D5A80">关闭线程</text>
  <text x="80" y="200" font-size="10.5" fill="#3D5A80">调用 destroy</text>
  <text x="80" y="282" font-size="11.5" font-weight="700" fill="#2F6B5E">worker × N</text>
  <text x="80" y="376" font-size="11.5" font-weight="700" fill="#6B5B95">提交任务方</text>

  <!-- 泳道 1 -->
  <rect x="196" y="158" width="176" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="284" y="180" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">① lock(&amp;m)</text>
  <text x="284" y="198" font-size="10.5" fill="#2C4460" text-anchor="middle">stop 也由 m 保护</text>

  <rect x="388" y="158" width="176" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="476" y="180" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">② pool-&gt;stop = 1</text>
  <text x="476" y="198" font-size="10.5" fill="#2C4460" text-anchor="middle">持锁写，杜绝竞态</text>

  <rect x="580" y="158" width="214" height="52" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="2"/>
  <text x="687" y="180" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">③ broadcast 两个 cond</text>
  <text x="687" y="198" font-size="10.5" fill="#6B4E28" text-anchor="middle">not_empty + not_full</text>

  <rect x="810" y="158" width="150" height="52" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="885" y="180" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">④ unlock(&amp;m)</text>
  <text x="885" y="198" font-size="10.5" fill="#2C4460" text-anchor="middle">等待者才能抢锁</text>

  <rect x="976" y="158" width="184" height="52" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="1068" y="180" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">若只 signal 一次</text>
  <text x="1068" y="198" font-size="10.5" fill="#733428" text-anchor="middle">其余仍睡 → join 卡死</text>

  <!-- 泳道 2 -->
  <rect x="196" y="246" width="200" height="62" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="296" y="272" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">⑤ 从 cond_wait 返回</text>
  <text x="296" y="292" font-size="10.5" fill="#24473F" text-anchor="middle">先重新抢到 m 才继续</text>

  <rect x="412" y="246" width="214" height="62" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="519" y="272" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">重查 stop &amp;&amp; size == 0</text>
  <text x="519" y="292" font-size="10.5" fill="#24473F" text-anchor="middle">成立 → unlock 后 break</text>

  <rect x="642" y="246" width="214" height="62" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="749" y="272" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">队列还有残留任务</text>
  <text x="749" y="292" font-size="10.5" fill="#24473F" text-anchor="middle">取出执行完再退出</text>

  <rect x="872" y="246" width="180" height="62" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="962" y="272" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">worker 返回 NULL</text>
  <text x="962" y="292" font-size="10.5" fill="#24473F" text-anchor="middle">等待被 join</text>

  <!-- 泳道 3 -->
  <rect x="196" y="342" width="200" height="56" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="296" y="365" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">阻塞在 not_full 上</text>
  <text x="296" y="384" font-size="10.5" fill="#4A3F68" text-anchor="middle">队列满时的提交者</text>

  <rect x="412" y="342" width="214" height="56" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="519" y="365" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">被 broadcast 唤醒</text>
  <text x="519" y="384" font-size="10.5" fill="#4A3F68" text-anchor="middle">重查发现 stop == 1</text>

  <rect x="642" y="342" width="214" height="56" rx="7" fill="#E7E2EF" stroke="#6B5B95" stroke-width="1.5"/>
  <text x="749" y="365" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">不再入队，free(task)</text>
  <text x="749" y="384" font-size="10.5" fill="#4A3F68" text-anchor="middle">返回 -1 告知调用方</text>

  <rect x="872" y="342" width="288" height="56" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="1016" y="365" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">漏了 broadcast(not_full)</text>
  <text x="1016" y="384" font-size="10.5" fill="#733428" text-anchor="middle">提交者永远睡着，join 同样卡死</text>

  <!-- 唤醒箭头 -->
  <path d="M638 210 L638 336" fill="none" stroke="#B07D2B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrAmber)"/>
  <path d="M626 210 L626 240" fill="none" stroke="#B07D2B" stroke-width="1.8" marker-end="url(#arrAmber)"/>

  <!-- B 区 -->
  <text x="56" y="452" font-size="15" font-weight="700" fill="#4A473F">B · 回收阶段：三步顺序不能颠倒</text>
  <rect x="56" y="464" width="556" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="72" y="480" width="524" height="50" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="334" y="501" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">⑥ pthread_join(threads[i]) × N</text>
  <text x="334" y="519" font-size="10.5" fill="#2C4460" text-anchor="middle">逐个等 worker 真正退出，不能跳过</text>

  <line x1="334" y1="530" x2="334" y2="540" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="72" y="542" width="524" height="50" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/>
  <text x="334" y="563" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">⑦ 排空队列里的残留 Task</text>
  <text x="334" y="581" font-size="10.5" fill="#24473F" text-anchor="middle">谁分配谁释放，别把 free 漏掉</text>

  <line x1="334" y1="592" x2="334" y2="602" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="72" y="604" width="524" height="50" rx="7" fill="#F3E8D3" stroke="#B07D2B" stroke-width="1.5"/>
  <text x="334" y="625" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">⑧ destroy mutex / cond</text>
  <text x="334" y="643" font-size="10.5" fill="#6B4E28" text-anchor="middle">此刻已确认无人再引用它们</text>

  <rect x="72" y="666" width="524" height="42" rx="7" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/>
  <text x="334" y="692" font-size="11" font-weight="700" fill="#733428" text-anchor="middle">join 之前 destroy = 销毁使用中的对象，是未定义行为</text>

  <!-- C 区 -->
  <text x="628" y="452" font-size="15" font-weight="700" fill="#4A473F">C · 关闭阶段的四个典型错法</text>
  <rect x="628" y="464" width="556" height="250" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1"/>

  <rect x="640" y="480" width="168" height="30" rx="5" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="724" y="500" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">错法</text>
  <rect x="808" y="480" width="204" height="30" rx="5" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="910" y="500" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">后果</text>
  <rect x="1012" y="480" width="160" height="30" rx="5" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.2"/>
  <text x="1092" y="500" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">正确做法</text>

  <rect x="640" y="514" width="168" height="46" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="724" y="541" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">只 signal 一次</text>
  <rect x="808" y="514" width="204" height="46" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="910" y="541" font-size="10.5" fill="#733428" text-anchor="middle">其余 worker 仍在睡，join 阻塞</text>
  <rect x="1012" y="514" width="160" height="46" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1092" y="541" font-size="10.5" fill="#24473F" text-anchor="middle">broadcast 两个 cond</text>

  <rect x="640" y="564" width="168" height="46" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="724" y="591" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">不持锁写 stop</text>
  <rect x="808" y="564" width="204" height="46" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="910" y="591" font-size="10.5" fill="#733428" text-anchor="middle">worker 刚查完就睡，错过唤醒</text>
  <rect x="1012" y="564" width="160" height="46" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1092" y="591" font-size="10.5" fill="#24473F" text-anchor="middle">在临界区内改 stop</text>

  <rect x="640" y="614" width="168" height="46" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="724" y="641" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">先 destroy 后 join</text>
  <rect x="808" y="614" width="204" height="46" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="910" y="641" font-size="10.5" fill="#733428" text-anchor="middle">销毁使用中的对象，UB</text>
  <rect x="1012" y="614" width="160" height="46" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1092" y="641" font-size="10.5" fill="#24473F" text-anchor="middle">join 全部完成再 destroy</text>

  <rect x="640" y="664" width="168" height="46" rx="5" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="724" y="691" font-size="11" font-weight="700" fill="#4A473F" text-anchor="middle">只退出主线程</text>
  <rect x="808" y="664" width="204" height="46" rx="5" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.2"/>
  <text x="910" y="691" font-size="10.5" fill="#733428" text-anchor="middle">worker 睡在 cond 上不回收</text>
  <rect x="1012" y="664" width="160" height="46" rx="5" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.2"/>
  <text x="1092" y="691" font-size="10.5" fill="#24473F" text-anchor="middle">显式 stop + join</text>

  <text x="56" y="752" font-size="11.5" fill="#4A473F">关闭语义要先定好：graceful shutdown 等队列排空再退出，immediate shutdown 丢弃残留任务立刻退出。</text>
  <text x="56" y="774" font-size="11.5" fill="#4A473F">本图画的是 graceful 版本，对应 worker 的退出条件 stop &amp;&amp; queue_size == 0。</text>
</svg>
