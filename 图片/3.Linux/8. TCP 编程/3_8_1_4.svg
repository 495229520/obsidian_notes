<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>TCP 按字节编号</title><desc>展示应用字节流被拆成两个报文段，但每个字节仍有连续编号。</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5A564B"/></marker></defs>
  <rect width="1240" height="600" fill="rgb(245, 244, 237)"/>
  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">Seq 按字节编号，不按“第几个包”编号</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">应用写入 HELLO；TCP 可以拆段，但字节位置始终连续且可重组</text>
  <text x="64" y="130" font-size="15" font-weight="700" fill="#4A473F">A · 应用字节流</text>
  <rect x="64" y="150" width="1112" height="106" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <g text-anchor="middle"><rect x="322" y="172" width="112" height="58" fill="#EDEAF3" stroke="#6B5B95"/><rect x="434" y="172" width="112" height="58" fill="#EDEAF3" stroke="#6B5B95"/><rect x="546" y="172" width="112" height="58" fill="#EDEAF3" stroke="#6B5B95"/><rect x="658" y="172" width="112" height="58" fill="#EDEAF3" stroke="#6B5B95"/><rect x="770" y="172" width="112" height="58" fill="#EDEAF3" stroke="#6B5B95"/>
  <text x="378" y="195" font-size="14" font-weight="700" fill="#4A3F68">H</text><text x="378" y="218" font-size="11" fill="#6B5B95">1000</text><text x="490" y="195" font-size="14" font-weight="700" fill="#4A3F68">E</text><text x="490" y="218" font-size="11" fill="#6B5B95">1001</text><text x="602" y="195" font-size="14" font-weight="700" fill="#4A3F68">L</text><text x="602" y="218" font-size="11" fill="#6B5B95">1002</text><text x="714" y="195" font-size="14" font-weight="700" fill="#4A3F68">L</text><text x="714" y="218" font-size="11" fill="#6B5B95">1003</text><text x="826" y="195" font-size="14" font-weight="700" fill="#4A3F68">O</text><text x="826" y="218" font-size="11" fill="#6B5B95">1004</text></g>
  <line x1="602" y1="258" x2="602" y2="298" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="64" y="330" font-size="15" font-weight="700" fill="#4A473F">B · TCP 可按路径需要拆段</text>
  <rect x="138" y="354" width="402" height="92" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.6"/><text x="339" y="384" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">报文段 A · Seq=1000 · Len=3</text><text x="339" y="410" font-size="12" fill="#2C4460" text-anchor="middle">携带 H E L · 覆盖 [1000, 1003)</text><text x="339" y="432" font-size="11" fill="#6B675C" text-anchor="middle">Seq 指向本段第一个数据字节</text>
  <rect x="700" y="354" width="402" height="92" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.6"/><text x="901" y="384" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">报文段 B · Seq=1003 · Len=2</text><text x="901" y="410" font-size="12" fill="#24473F" text-anchor="middle">携带 L O · 覆盖 [1003, 1005)</text><text x="901" y="432" font-size="11" fill="#6B675C" text-anchor="middle">分段边界不是应用消息边界</text>
  <line x1="544" y1="400" x2="692" y2="400" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="64" y="486" width="1112" height="70" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/><text x="92" y="516" font-size="13" font-weight="700" fill="#6B4E28">接收方按 Seq 排序与去重</text><text x="92" y="540" font-size="11.5" fill="#6B4E28">即使发生拆包、合包、乱序或重传，最终仍向应用交付连续的 HELLO</text>
  <text x="64" y="584" font-size="11.5" fill="#4A473F">区间记法：[Seq, Seq + Len)；因此下一段连续起点 = 当前 Seq + Len</text>
</svg>
