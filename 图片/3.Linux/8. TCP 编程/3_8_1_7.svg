<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 610" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>TCP 滑动窗口</title><desc>展示已确认、已发送未确认、可立即发送和暂不可发送四个区域，以及确认到达后的窗口滑动。</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3D5A80"/></marker></defs>
  <rect width="1240" height="610" fill="rgb(245, 244, 237)"/>
  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">滑动窗口：限制在途数据，保护接收方</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">接收方通告 rwnd；发送方只能在窗口内安排“已发未确认 + 可立即发送”的字节</text>
  <rect x="64" y="112" width="1112" height="74" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/><text x="90" y="142" font-size="14" font-weight="700" fill="#2C4460">接收方通告：rwnd = 12 KB</text><text x="90" y="166" font-size="11.5" fill="#2C4460">从当前 ACK 起，最多再接收 12 KB；窗口之外的数据暂缓发送</text>
  <text x="64" y="236" font-size="15" font-weight="700" fill="#4A473F">发送缓冲区的四个区域</text>
  <rect x="64" y="258" width="250" height="100" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/><rect x="314" y="258" width="250" height="100" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/><rect x="564" y="258" width="330" height="100" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.3"/><rect x="894" y="258" width="282" height="100" fill="#EDEBE3" stroke="#9B968A" stroke-width="1.3"/>
  <text x="189" y="294" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">已确认</text><text x="189" y="321" font-size="11.5" fill="#24473F" text-anchor="middle">可从发送队列释放</text><text x="189" y="342" font-size="11" fill="#6B675C" text-anchor="middle">窗口左侧</text>
  <text x="439" y="294" font-size="14" font-weight="700" fill="#6B4E28" text-anchor="middle">已发送未确认</text><text x="439" y="321" font-size="11.5" fill="#6B4E28" text-anchor="middle">正在网络中飞行</text><text x="439" y="342" font-size="11" fill="#6B675C" text-anchor="middle">占用窗口</text>
  <text x="729" y="294" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">可立即发送</text><text x="729" y="321" font-size="11.5" fill="#2C4460" text-anchor="middle">仍在 rwnd 允许范围</text><text x="729" y="342" font-size="11" fill="#6B675C" text-anchor="middle">窗口剩余额度</text>
  <text x="1035" y="294" font-size="14" font-weight="700" fill="#4A473F" text-anchor="middle">暂不可发送</text><text x="1035" y="321" font-size="11.5" fill="#4A473F" text-anchor="middle">超过窗口右边界</text><text x="1035" y="342" font-size="11" fill="#6B675C" text-anchor="middle">等待窗口前移</text>
  <path d="M314 388V376H894V388" fill="none" stroke="#3D5A80" stroke-width="2"/><text x="604" y="414" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">当前发送窗口 = 已发未确认 + 可立即发送</text>
  <line x1="340" y1="458" x2="780" y2="458" stroke="#3D5A80" stroke-width="2.2" marker-end="url(#arr)"/><text x="560" y="446" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">新 ACK 到达：左边界右移</text>
  <rect x="64" y="488" width="532" height="78" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/><text x="90" y="518" font-size="13" font-weight="700" fill="#24473F">窗口向右滑动</text><text x="90" y="542" font-size="11.5" fill="#24473F">确认释放旧字节，新字节获得发送资格</text>
  <rect x="620" y="488" width="556" height="78" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.3"/><text x="646" y="518" font-size="13" font-weight="700" fill="#733428">窗口不等于发送速率</text><text x="646" y="542" font-size="11.5" fill="#733428">实际可发量还受拥塞窗口 cwnd 约束：min(rwnd, cwnd)</text>
  <text x="64" y="594" font-size="11.5" fill="#4A473F">流量控制保护接收方；拥塞控制保护网络，两者共同限制在途数据</text>
</svg>
