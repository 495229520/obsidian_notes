<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>TCP 累计确认</title><desc>展示两个连续报文段如何分别推进确认号。</desc>
  <defs><marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3D5A80"/></marker><marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F6B5E"/></marker></defs>
  <rect width="1240" height="650" fill="rgb(245, 244, 237)"/>
  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">Ack 是累计确认：报告“下一个期待字节”</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">Ack=N 表示 N 之前的连续字节都已收到，不表示收到了编号 N 的字节</text>
  <rect x="86" y="112" width="220" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/><text x="196" y="144" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">发送方</text>
  <rect x="934" y="112" width="220" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/><text x="1044" y="144" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">接收方</text>
  <line x1="196" y1="164" x2="196" y2="538" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1044" y1="164" x2="1044" y2="538" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="210" y1="220" x2="1030" y2="220" stroke="#3D5A80" stroke-width="2" marker-end="url(#blue)"/><rect x="472" y="190" width="296" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/><text x="620" y="214" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">数据段 1</text><text x="620" y="234" font-size="11.5" fill="#2C4460" text-anchor="middle">Seq=1000 · Len=5</text>
  <line x1="1030" y1="304" x2="210" y2="304" stroke="#2F6B5E" stroke-width="2" marker-end="url(#green)"/><rect x="500" y="274" width="240" height="58" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/><text x="620" y="298" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">ACK=1005</text><text x="620" y="318" font-size="11.5" fill="#24473F" text-anchor="middle">已连续收到 1000–1004</text>
  <line x1="210" y1="388" x2="1030" y2="388" stroke="#3D5A80" stroke-width="2" marker-end="url(#blue)"/><rect x="472" y="358" width="296" height="58" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.4"/><text x="620" y="382" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">数据段 2</text><text x="620" y="402" font-size="11.5" fill="#2C4460" text-anchor="middle">Seq=1005 · Len=5</text>
  <line x1="1030" y1="472" x2="210" y2="472" stroke="#2F6B5E" stroke-width="2" marker-end="url(#green)"/><rect x="500" y="442" width="240" height="58" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.4"/><text x="620" y="466" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">ACK=1010</text><text x="620" y="486" font-size="11.5" fill="#24473F" text-anchor="middle">已连续收到 1000–1009</text>
  <rect x="86" y="550" width="1068" height="60" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/><text x="620" y="576" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">连续到达时：Ack = Seq + Len</text><text x="620" y="598" font-size="11.5" fill="#6B4E28" text-anchor="middle">若中间有缺口，累计 Ack 会停在缺口起点</text>
  <text x="86" y="636" font-size="11.5" fill="#4A473F">ACK 报文可能延迟或合并；图中按逐段确认展示核心语义</text>
</svg>
