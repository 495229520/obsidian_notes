<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>TCP 连接全生命周期</title><desc>总览客户端和服务器从三次握手、数据传输到四次挥手的消息与状态变化。</desc>
  <defs><marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3D5A80"/></marker><marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F6B5E"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A64B3C"/></marker></defs>
  <rect width="1240" height="700" fill="rgb(245, 244, 237)"/>
  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">TCP 全生命周期：建连 → 传输 → 断连</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">消息推动状态迁移；Seq/Ack 始终沿同一条字节编号空间前进</text>
  <text x="192" y="122" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">客户端状态</text><text x="1048" y="122" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">服务器状态</text><line x1="290" y1="104" x2="290" y2="646" stroke="#D8D5C8" stroke-width="2"/><line x1="950" y1="104" x2="950" y2="646" stroke="#D8D5C8" stroke-width="2"/>
  <rect x="328" y="108" width="584" height="34" rx="7" fill="#E3EAF4"/><text x="620" y="130" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">① 建连 · 三次握手</text>
  <text x="266" y="176" font-size="11.5" fill="#3D5A80" text-anchor="end">CLOSED → SYN_SENT</text><text x="974" y="176" font-size="11.5" fill="#2F6B5E">LISTEN</text><line x1="302" y1="184" x2="938" y2="184" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#blue)"/><text x="620" y="172" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">SYN · seq=x</text>
  <line x1="938" y1="228" x2="302" y2="228" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#green)"/><text x="620" y="216" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">SYN+ACK · seq=y · ack=x+1</text><text x="974" y="220" font-size="11.5" fill="#2F6B5E">SYN_RCVD</text>
  <line x1="302" y1="272" x2="938" y2="272" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#blue)"/><text x="620" y="260" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">ACK · ack=y+1</text><text x="266" y="264" font-size="11.5" fill="#3D5A80" text-anchor="end">ESTABLISHED</text><text x="974" y="284" font-size="11.5" fill="#2F6B5E">ESTABLISHED</text>
  <rect x="328" y="302" width="584" height="34" rx="7" fill="#DCE9E3"/><text x="620" y="324" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">② 传输 · 全双工字节流</text>
  <line x1="302" y1="372" x2="938" y2="372" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#blue)"/><text x="620" y="360" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">DATA · Seq 按字节推进</text><line x1="938" y1="414" x2="302" y2="414" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#green)"/><text x="620" y="402" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">ACK · 累计确认 + Window</text>
  <rect x="328" y="442" width="584" height="34" rx="7" fill="#F0E0DB"/><text x="620" y="464" font-size="13" font-weight="700" fill="#733428" text-anchor="middle">③ 断连 · 两个方向分别关闭</text>
  <text x="266" y="510" font-size="11.5" fill="#A64B3C" text-anchor="end">FIN_WAIT_1</text><line x1="302" y1="518" x2="938" y2="518" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#red)"/><text x="620" y="506" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">FIN</text>
  <line x1="938" y1="556" x2="302" y2="556" stroke="#2F6B5E" stroke-width="1.8" marker-end="url(#green)"/><text x="620" y="544" font-size="12" font-weight="700" fill="#24473F" text-anchor="middle">ACK</text><text x="266" y="568" font-size="11.5" fill="#3D5A80" text-anchor="end">FIN_WAIT_2</text><text x="974" y="568" font-size="11.5" fill="#2F6B5E">CLOSE_WAIT</text>
  <line x1="938" y1="594" x2="302" y2="594" stroke="#A64B3C" stroke-width="1.8" marker-end="url(#red)"/><text x="620" y="582" font-size="12" font-weight="700" fill="#733428" text-anchor="middle">FIN</text><text x="974" y="606" font-size="11.5" fill="#A64B3C">LAST_ACK</text>
  <line x1="302" y1="632" x2="938" y2="632" stroke="#3D5A80" stroke-width="1.8" marker-end="url(#blue)"/><text x="620" y="620" font-size="12" font-weight="700" fill="#2C4460" text-anchor="middle">ACK</text><text x="266" y="642" font-size="11.5" fill="#3D5A80" text-anchor="end">TIME_WAIT → CLOSED</text><text x="974" y="642" font-size="11.5" fill="#2F6B5E">CLOSED</text>
  <rect x="48" y="662" width="1144" height="26" rx="6" fill="#EDEBE3"/><text x="620" y="680" font-size="11" fill="#4A473F" text-anchor="middle">主线：SYN/FIN 各占 1 个序号 · DATA 按字节占序号 · ACK 本身不占序号</text>
</svg>
