<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>TCP 四次挥手</title><desc>展示全双工连接的两个发送方向分别关闭，以及客户端进入 TIME_WAIT。</desc>
  <defs><marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3D5A80"/></marker><marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F6B5E"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A64B3C"/></marker></defs>
  <rect width="1240" height="700" fill="rgb(245, 244, 237)"/>
  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">四次挥手：两个发送方向分别关闭</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">FIN 只表示“我不再发送”，不妨碍继续接收；因此两侧各有一组 FIN + ACK</text>
  <rect x="96" y="108" width="230" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/><text x="211" y="140" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">客户端</text><rect x="914" y="108" width="230" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/><text x="1029" y="140" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">服务器</text>
  <line x1="211" y1="160" x2="211" y2="618" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1029" y1="160" x2="1029" y2="618" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="92" y="206" font-size="11.5" font-weight="700" fill="#3D5A80">FIN_WAIT_1</text><line x1="225" y1="218" x2="1015" y2="218" stroke="#A64B3C" stroke-width="2" marker-end="url(#red)"/><text x="620" y="202" font-size="13.5" font-weight="700" fill="#733428" text-anchor="middle">① FIN · seq=500</text><text x="620" y="240" font-size="11.5" fill="#6B675C" text-anchor="middle">客户端关闭自己的发送方向</text>
  <line x1="1015" y1="286" x2="225" y2="286" stroke="#2F6B5E" stroke-width="2" marker-end="url(#green)"/><text x="620" y="271" font-size="13.5" font-weight="700" fill="#24473F" text-anchor="middle">② ACK · ack=501</text><text x="92" y="300" font-size="11.5" font-weight="700" fill="#3D5A80">FIN_WAIT_2</text><text x="1148" y="300" font-size="11.5" font-weight="700" fill="#2F6B5E" text-anchor="end">CLOSE_WAIT</text>
  <rect x="330" y="326" width="580" height="76" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/><text x="620" y="354" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">半关闭：客户端仍能接收</text><text x="620" y="380" font-size="11.5" fill="#6B4E28" text-anchor="middle">服务器可继续发送剩余数据，ACK 与 FIN 不必合并</text>
  <text x="1148" y="444" font-size="11.5" font-weight="700" fill="#A64B3C" text-anchor="end">LAST_ACK</text><line x1="1015" y1="456" x2="225" y2="456" stroke="#A64B3C" stroke-width="2" marker-end="url(#red)"/><text x="620" y="440" font-size="13.5" font-weight="700" fill="#733428" text-anchor="middle">③ FIN · seq=900</text><text x="620" y="478" font-size="11.5" fill="#6B675C" text-anchor="middle">服务器也关闭自己的发送方向</text>
  <line x1="225" y1="526" x2="1015" y2="526" stroke="#3D5A80" stroke-width="2" marker-end="url(#blue)"/><text x="620" y="511" font-size="13.5" font-weight="700" fill="#2C4460" text-anchor="middle">④ ACK · ack=901</text><text x="92" y="540" font-size="11.5" font-weight="700" fill="#3D5A80">TIME_WAIT</text><text x="1148" y="540" font-size="11.5" font-weight="700" fill="#2F6B5E" text-anchor="end">CLOSED</text>
  <rect x="96" y="578" width="1048" height="72" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/><text x="122" y="608" font-size="13" font-weight="700" fill="#2B2A26">为什么客户端要 TIME_WAIT？</text><text x="122" y="632" font-size="11.5" fill="#4A473F">允许最后 ACK 重传，并让旧连接中的迟到报文自然消失；FIN 同 SYN 一样消耗一个序号</text>
  <text x="96" y="680" font-size="11.5" fill="#4A473F">常见四步并非绝对固定：若服务器已无剩余数据，ACK 与 FIN 可能合并</text>
</svg>
