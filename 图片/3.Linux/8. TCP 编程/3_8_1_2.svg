<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>TCP 报文段结构</title><desc>用 32 位行展示 TCP 首部的关键字段，并突出序列号、确认号、标志位和窗口。</desc>
  <rect width="1240" height="650" fill="rgb(245, 244, 237)"/>
  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">TCP 报文段：四个字段读懂一次传输</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">首部最少 20 B；每行 32 bit。先看 Seq、Ack、Flags 和 Window，再追其他细节</text>
  <text x="64" y="124" font-size="12" fill="#6B675C">0</text><text x="330" y="124" font-size="12" fill="#6B675C">8</text><text x="602" y="124" font-size="12" fill="#6B675C">16</text><text x="874" y="124" font-size="12" fill="#6B675C">24</text><text x="1138" y="124" font-size="12" fill="#6B675C">31 bit</text>
  <rect x="64" y="138" width="552" height="62" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/><rect x="616" y="138" width="552" height="62" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
  <text x="340" y="166" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">源端口</text><text x="340" y="185" font-size="11" fill="#6B675C" text-anchor="middle">16 bit</text><text x="892" y="166" font-size="13" font-weight="700" fill="#4A473F" text-anchor="middle">目标端口</text><text x="892" y="185" font-size="11" fill="#6B675C" text-anchor="middle">16 bit</text>
  <rect x="64" y="200" width="1104" height="68" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.8"/><text x="616" y="229" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">序列号 Sequence Number</text><text x="616" y="250" font-size="11.5" fill="#2C4460" text-anchor="middle">本段第一个数据字节的位置</text>
  <rect x="64" y="268" width="1104" height="68" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.8"/><text x="616" y="297" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">确认号 Acknowledgment Number</text><text x="616" y="318" font-size="11.5" fill="#24473F" text-anchor="middle">下一步期待收到的字节编号</text>
  <rect x="64" y="336" width="138" height="66" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><rect x="202" y="336" width="138" height="66" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><rect x="340" y="336" width="414" height="66" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.8"/><rect x="754" y="336" width="414" height="66" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.8"/>
  <text x="133" y="365" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">首部长度</text><text x="133" y="385" font-size="10.5" fill="#6B675C" text-anchor="middle">Data Offset</text><text x="271" y="365" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">保留位</text><text x="547" y="365" font-size="13" font-weight="700" fill="#733428" text-anchor="middle">标志位 Flags</text><text x="547" y="385" font-size="11" fill="#733428" text-anchor="middle">SYN · ACK · FIN · RST · PSH · URG</text><text x="961" y="365" font-size="13" font-weight="700" fill="#6B4E28" text-anchor="middle">接收窗口 Window</text><text x="961" y="385" font-size="11" fill="#6B4E28" text-anchor="middle">接收方还能容纳多少字节</text>
  <rect x="64" y="402" width="552" height="62" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><rect x="616" y="402" width="552" height="62" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="340" y="439" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">校验和 Checksum</text><text x="892" y="439" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">紧急指针 Urgent Pointer</text>
  <rect x="64" y="464" width="1104" height="58" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/><text x="616" y="488" font-size="12.5" font-weight="700" fill="#4A3F68" text-anchor="middle">可选项 Options</text><text x="616" y="508" font-size="11" fill="#6B5B95" text-anchor="middle">MSS · Window Scale · SACK · Timestamp</text>
  <rect x="64" y="522" width="1104" height="76" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/><text x="616" y="555" font-size="14" font-weight="700" fill="#2B2A26" text-anchor="middle">数据载荷 Payload</text><text x="616" y="578" font-size="11.5" fill="#6B675C" text-anchor="middle">TCP 把载荷视为连续字节流，不保留应用消息边界</text>
  <text x="64" y="628" font-size="11.5" fill="#4A473F">读包口诀：Seq 看起点 · Ack 看缺口 · Flags 看阶段 · Window 看还能发多少</text>
</svg>
