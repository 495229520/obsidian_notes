<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>TCP 超时重传</title><desc>展示报文段丢失后发送方等待 RTO 并以相同序列号重传。</desc>
  <defs><marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3D5A80"/></marker><marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F6B5E"/></marker></defs>
  <rect width="1240" height="690" fill="rgb(245, 244, 237)"/>
  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">超时重传：确认迟迟不到，就重发缺失区间</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">重传必须沿用原 Seq；接收方据此去重，发送方据 Ack 推进确认边界</text>
  <rect x="86" y="108" width="220" height="52" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/><text x="196" y="140" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">发送方</text><rect x="934" y="108" width="220" height="52" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/><text x="1044" y="140" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">接收方</text>
  <line x1="196" y1="160" x2="196" y2="612" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1044" y1="160" x2="1044" y2="612" stroke="#9B968A" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="210" y1="204" x2="1030" y2="204" stroke="#3D5A80" stroke-width="2" marker-end="url(#blue)"/><text x="620" y="190" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">数据段 1 · Seq=1000 · Len=5</text>
  <line x1="1030" y1="262" x2="210" y2="262" stroke="#2F6B5E" stroke-width="2" marker-end="url(#green)"/><text x="620" y="250" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">ACK=1005</text>
  <line x1="210" y1="326" x2="735" y2="326" stroke="#3D5A80" stroke-width="2"/><line x1="735" y1="326" x2="914" y2="326" stroke="#A64B3C" stroke-width="2" stroke-dasharray="7 5"/><text x="560" y="312" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">数据段 2 · Seq=1005 · Len=5</text><path d="M918 310L946 338M946 310L918 338" stroke="#A64B3C" stroke-width="5" stroke-linecap="round"/><text x="942" y="292" font-size="12" font-weight="700" fill="#A64B3C" text-anchor="middle">途中丢失</text>
  <rect x="356" y="370" width="528" height="76" rx="8" fill="#F0E0DB" stroke="#A64B3C" stroke-width="1.5"/><text x="620" y="400" font-size="13" font-weight="700" fill="#733428" text-anchor="middle">RTO 到期：仍未收到推进到 1010 的 ACK</text><text x="620" y="424" font-size="11.5" fill="#733428" text-anchor="middle">判定该区间可能丢失，触发超时重传</text>
  <line x1="210" y1="498" x2="1030" y2="498" stroke="#3D5A80" stroke-width="2" marker-end="url(#blue)"/><text x="620" y="484" font-size="13" font-weight="700" fill="#2C4460" text-anchor="middle">重传数据段 2 · Seq=1005 · Len=5</text>
  <line x1="1030" y1="566" x2="210" y2="566" stroke="#2F6B5E" stroke-width="2" marker-end="url(#green)"/><text x="620" y="553" font-size="13" font-weight="700" fill="#24473F" text-anchor="middle">ACK=1010 · 累计确认推进</text>
  <rect x="86" y="620" width="1068" height="46" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.2"/><text x="620" y="649" font-size="11.5" fill="#6B4E28" text-anchor="middle">真实 TCP 还可能通过重复 ACK + SACK 触发快速重传；本图聚焦 RTO 路径</text>
</svg>
