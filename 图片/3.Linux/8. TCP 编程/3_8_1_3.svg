<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>TCP 三次握手</title><desc>通过客户端和服务器泳道说明三次握手如何确认双向收发并同步初始序列号。</desc>
  <defs><marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3D5A80"/></marker><marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F6B5E"/></marker></defs>
  <rect width="1240" height="620" fill="rgb(245, 244, 237)"/>
  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">三次握手：确认双向可达，并同步初始序列号</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">一次请求、一次响应、一次最终确认，补齐两条方向的收发证据</text>
  <rect x="110" y="110" width="240" height="54" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.5"/><text x="230" y="143" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">客户端 Client</text>
  <rect x="890" y="110" width="240" height="54" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/><text x="1010" y="143" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">服务器 Server</text>
  <line x1="230" y1="164" x2="230" y2="488" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 5"/><line x1="1010" y1="164" x2="1010" y2="488" stroke="#9B968A" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="116" y="210" font-size="11.5" font-weight="700" fill="#3D5A80">CLOSED → SYN_SENT</text><line x1="242" y1="222" x2="998" y2="222" stroke="#3D5A80" stroke-width="2" marker-end="url(#blue)"/><text x="620" y="206" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">① SYN · seq=100</text><text x="620" y="244" font-size="11.5" fill="#6B675C" text-anchor="middle">客户端给出 ISN：我的编号从 100 开始</text>
  <text x="1124" y="292" font-size="11.5" font-weight="700" fill="#2F6B5E" text-anchor="end">LISTEN → SYN_RCVD</text><line x1="998" y1="304" x2="242" y2="304" stroke="#2F6B5E" stroke-width="2" marker-end="url(#green)"/><text x="620" y="288" font-size="14" font-weight="700" fill="#24473F" text-anchor="middle">② SYN + ACK · seq=300 · ack=101</text><text x="620" y="326" font-size="11.5" fill="#6B675C" text-anchor="middle">确认客户端 SYN，同时给出服务器 ISN</text>
  <text x="116" y="374" font-size="11.5" font-weight="700" fill="#3D5A80">SYN_SENT → ESTABLISHED</text><line x1="242" y1="386" x2="998" y2="386" stroke="#3D5A80" stroke-width="2" marker-end="url(#blue)"/><text x="620" y="370" font-size="14" font-weight="700" fill="#2C4460" text-anchor="middle">③ ACK · seq=101 · ack=301</text><text x="620" y="408" font-size="11.5" fill="#6B675C" text-anchor="middle">服务器确认后也进入 ESTABLISHED</text>
  <rect x="88" y="466" width="1064" height="100" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="116" y="496" font-size="13" font-weight="700" fill="#2B2A26">三步分别证明什么？</text>
  <rect x="116" y="514" width="300" height="34" rx="6" fill="#E3EAF4"/><text x="266" y="536" font-size="11.5" fill="#2C4460" text-anchor="middle">① 客户端能发 · 服务器能收</text>
  <rect x="470" y="514" width="300" height="34" rx="6" fill="#DCE9E3"/><text x="620" y="536" font-size="11.5" fill="#24473F" text-anchor="middle">② 服务器能发 · 客户端能收</text>
  <rect x="824" y="514" width="300" height="34" rx="6" fill="#EFE7DA"/><text x="974" y="536" font-size="11.5" fill="#6B4E28" text-anchor="middle">③ 服务器收到最终确认</text>
  <text x="88" y="596" font-size="11.5" fill="#4A473F">SYN 消耗一个序号，所以对方确认时 Ack = Seq + 1</text>
</svg>
