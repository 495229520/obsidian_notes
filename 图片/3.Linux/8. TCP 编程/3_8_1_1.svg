<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>TCP/IP 网络分层与逐层封装</title>
  <desc>展示 TCP 所在的传输层，以及数据从应用数据逐层封装为帧的过程。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5A564B"/></marker>
  </defs>
  <rect width="1240" height="620" fill="rgb(245, 244, 237)"/>
  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">TCP/IP 网络分层：TCP 位于传输层</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">分层负责分工，封装负责交付；TCP 只处理端到端字节流，路由交给 IP</text>

  <text x="56" y="122" font-size="15" font-weight="700" fill="#4A473F">A · 五层职责</text>
  <rect x="56" y="142" width="500" height="70" rx="8" fill="#FBFBF6" stroke="#9B968A" stroke-width="1.3"/>
  <text x="82" y="171" font-size="14" font-weight="700" fill="#2B2A26">应用层</text><text x="190" y="171" font-size="12" fill="#4A473F">HTTP · DNS · SSH</text><text x="190" y="192" font-size="11.5" fill="#6B675C">定义应用消息与业务语义</text>
  <rect x="56" y="222" width="500" height="82" rx="8" fill="#E3EAF4" stroke="#3D5A80" stroke-width="2"/>
  <text x="82" y="254" font-size="14" font-weight="700" fill="#2C4460">传输层</text><text x="190" y="254" font-size="13" font-weight="700" fill="#2C4460">TCP · UDP</text><text x="190" y="278" font-size="11.5" fill="#2C4460">端到端交付 · 端口复用 · TCP 可靠字节流</text>
  <rect x="56" y="314" width="500" height="70" rx="8" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="82" y="343" font-size="14" font-weight="700" fill="#24473F">网络层</text><text x="190" y="343" font-size="12" fill="#24473F">IP</text><text x="190" y="364" font-size="11.5" fill="#24473F">寻址 · 路由 · 跨网络转发</text>
  <rect x="56" y="394" width="500" height="70" rx="8" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="82" y="423" font-size="14" font-weight="700" fill="#6B4E28">链路层</text><text x="190" y="423" font-size="12" fill="#6B4E28">Ethernet · Wi‑Fi</text><text x="190" y="444" font-size="11.5" fill="#6B4E28">相邻节点间传输数据帧</text>
  <rect x="56" y="474" width="500" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
  <text x="82" y="503" font-size="14" font-weight="700" fill="#4A473F">物理层</text><text x="190" y="503" font-size="12" fill="#4A473F">光纤 · 双绞线 · 无线电</text><text x="190" y="524" font-size="11.5" fill="#6B675C">把帧变成可传输的比特信号</text>

  <text x="622" y="122" font-size="15" font-weight="700" fill="#4A473F">B · 发送端逐层封装</text>
  <rect x="622" y="142" width="550" height="402" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <rect x="668" y="174" width="210" height="50" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="773" y="204" font-size="12.5" font-weight="700" fill="#4A473F" text-anchor="middle">应用数据</text>
  <line x1="773" y1="226" x2="773" y2="254" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="646" y="258" width="254" height="54" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.6"/><rect x="646" y="258" width="74" height="54" rx="7" fill="#C9D8EA"/><text x="683" y="290" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">TCP 头</text><text x="810" y="290" font-size="12.5" font-weight="700" fill="#2C4460" text-anchor="middle">TCP 报文段</text>
  <line x1="773" y1="314" x2="773" y2="342" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="624" y="346" width="298" height="54" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.5"/><rect x="624" y="346" width="72" height="54" rx="7" fill="#C6DDD3"/><text x="660" y="378" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">IP 头</text><text x="814" y="378" font-size="12.5" font-weight="700" fill="#24473F" text-anchor="middle">IP 数据包</text>
  <line x1="773" y1="402" x2="773" y2="430" stroke="#5A564B" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="602" y="434" width="342" height="54" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.5"/><rect x="602" y="434" width="82" height="54" rx="7" fill="#E4D4BA"/><text x="643" y="466" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">帧头</text><text x="814" y="466" font-size="12.5" font-weight="700" fill="#6B4E28" text-anchor="middle">链路层帧</text>
  <text x="976" y="222" font-size="11.5" font-weight="700" fill="#3D5A80">TCP 负责</text><text x="976" y="244" font-size="11.5" fill="#4A473F">可靠性 · 顺序</text><text x="976" y="265" font-size="11.5" fill="#4A473F">流量 · 拥塞</text>
  <text x="976" y="362" font-size="11.5" font-weight="700" fill="#2F6B5E">下层负责</text><text x="976" y="384" font-size="11.5" fill="#4A473F">选路与逐跳传输</text>
  <rect x="56" y="570" width="1116" height="32" rx="6" fill="#EDEBE3"/>
  <text x="614" y="591" font-size="11.5" fill="#4A473F" text-anchor="middle">接收端按相反顺序解封装：帧 → IP 数据包 → TCP 报文段 → 应用数据</text>
</svg>
