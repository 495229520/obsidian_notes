<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A564B"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5A80"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B5E"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A3A"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5B95"/>
    </marker>
  </defs>

  <title>TCP/IP 体系分层与逐层封装</title>
  <desc>展示五层协议栈体系、系统边界、发送端自顶向下逐层加头封装与接收端解封装流程，以及各层 PDU 与职责对照。</desc>

  <!-- 背景底色 -->
  <rect width="1240" height="760" fill="rgb(245, 244, 237)"/>

  <!-- 顶部标题区 -->
  <text x="48" y="52" font-size="22" font-weight="700" fill="#2B2A26">TCP/IP 体系分层：TCP 位于传输层</text>
  <text x="48" y="80" font-size="13" fill="#6B675C">端到端可靠性由传输层维系，跳到跳数据交付由 IP 与链路层承载；自顶向下加头，自底向上解包</text>

  <!-- ==================== Panel A: 五层协议栈与系统边界 ==================== -->
  <rect x="48" y="106" width="540" height="466" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="62" y="130" font-size="14" font-weight="700" fill="#4A473F">A · 五层协议栈体系与系统边界</text>

  <!-- 1. 应用层 -->
  <rect x="62" y="144" width="512" height="70" rx="7" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="76" y="172" font-size="13.5" font-weight="700" fill="#2B2A26">应用层</text>
  <text x="76" y="193" font-size="10" fill="#6B675C">用户空间 · Socket</text>
  <text x="178" y="171" font-size="12" font-weight="700" fill="#4A473F">PDU: 消息 (Message) · HTTP · DNS · SSH · RPC</text>
  <text x="178" y="193" font-size="11" fill="#6B675C">定义业务报文格式与交互逻辑；通过系统调用陷入内核</text>

  <!-- 2. 传输层（TCP高亮） -->
  <rect x="62" y="222" width="512" height="82" rx="7" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.8"/>
  <text x="76" y="253" font-size="14" font-weight="700" fill="#2C4460">传输层</text>
  <text x="76" y="275" font-size="10" font-weight="700" fill="#3D5A80">Linux 内核网络栈</text>
  <text x="178" y="251" font-size="12.5" font-weight="700" fill="#2C4460">PDU: 报文段 (Segment) · TCP · UDP</text>
  <text x="178" y="271" font-size="11" fill="#2C4460">寻址: 16 bit 端口号 (Port) 标识本地进程套接字</text>
  <text x="178" y="290" font-size="11" fill="#2C4460">端到端通信：TCP 提供可靠有序字节流、滑动窗口与拥塞控制</text>

  <!-- 3. 网络层 -->
  <rect x="62" y="312" width="512" height="72" rx="7" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="76" y="342" font-size="13.5" font-weight="700" fill="#24473F">网络层</text>
  <text x="76" y="364" font-size="10" fill="#2F6B5E">内核 IP 路由栈</text>
  <text x="178" y="341" font-size="12" font-weight="700" fill="#24473F">PDU: 数据包 / 分组 (Packet) · IPv4 · IPv6 · ICMP</text>
  <text x="178" y="364" font-size="11" fill="#24473F">寻址: IP 地址 (32/128 bit)；点对点逐跳转发与路由寻址</text>

  <!-- 4. 链路层 -->
  <rect x="62" y="392" width="512" height="72" rx="7" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="76" y="422" font-size="13.5" font-weight="700" fill="#6B4E28">链路层</text>
  <text x="76" y="444" font-size="10" fill="#8A6A3A">网卡驱动 · MAC</text>
  <text x="178" y="421" font-size="12" font-weight="700" fill="#6B4E28">PDU: 帧 (Frame) · Ethernet (以太网) · Wi‑Fi</text>
  <text x="178" y="444" font-size="11" fill="#6B4E28">寻址: 48 bit MAC 地址；局域网相邻节点帧传输与 FCS 校验</text>

  <!-- 5. 物理层 -->
  <rect x="62" y="472" width="512" height="72" rx="7" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="76" y="502" font-size="13.5" font-weight="700" fill="#4A3F68">物理层</text>
  <text x="76" y="524" font-size="10" fill="#6B5B95">物理介质 · PHY</text>
  <text x="178" y="501" font-size="12" font-weight="700" fill="#4A3F68">PDU: 比特流 (Bits) · 光纤 · 双绞线 · 无线信道</text>
  <text x="178" y="524" font-size="11" fill="#4A3F68">将二进制帧转换为电平、光脉冲或高频电磁波物理信号</text>

  <!-- ==================== Panel B: 发送端逐层封装流程 ==================== -->
  <rect x="612" y="106" width="580" height="466" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="626" y="130" font-size="14" font-weight="700" fill="#4A473F">B · 数据发送逐层封装过程（自顶向下）</text>

  <!-- 阶段 1: 应用数据 -->
  <rect x="626" y="144" width="76" height="44" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="664" y="164" font-size="11.5" font-weight="700" fill="#4A473F" text-anchor="middle">应用层</text>
  <text x="664" y="179" font-size="9.8" fill="#6B675C" text-anchor="middle">write()</text>

  <rect x="712" y="144" width="220" height="44" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="822" y="171" font-size="12" font-weight="700" fill="#4A473F" text-anchor="middle">应用数据 Payload</text>

  <text x="946" y="163" font-size="11" font-weight="700" fill="#4A473F">用户缓冲区写入</text>
  <text x="946" y="180" font-size="10.2" fill="#6B675C">拷贝进内核 Socket 发送缓冲区</text>

  <!-- 向下箭头 1 -->
  <line x1="822" y1="190" x2="822" y2="204" stroke="#3D5A80" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <text x="832" y="200" font-size="9.8" fill="#3D5A80">+ TCP 首部</text>

  <!-- 阶段 2: TCP 报文段 -->
  <rect x="626" y="208" width="76" height="46" rx="6" fill="#E3EAF4" stroke="#3D5A80" stroke-width="1.6"/>
  <text x="664" y="228" font-size="11.5" font-weight="700" fill="#2C4460" text-anchor="middle">传输层</text>
  <text x="664" y="244" font-size="9.8" fill="#3D5A80" text-anchor="middle">Segment</text>

  <rect x="712" y="208" width="86" height="46" rx="6" fill="#C9D8EA" stroke="#3D5A80" stroke-width="1.5"/>
  <text x="755" y="228" font-size="11" font-weight="700" fill="#2C4460" text-anchor="middle">TCP 头</text>
  <text x="755" y="244" font-size="9.5" fill="#2C4460" text-anchor="middle">20~60B</text>

  <rect x="802" y="208" width="130" height="46" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="867" y="235" font-size="11.5" fill="#4A473F" text-anchor="middle">应用数据 Payload</text>

  <text x="946" y="227" font-size="11" font-weight="700" fill="#2C4460">添加端到端控制首部</text>
  <text x="946" y="244" font-size="10.2" fill="#4A473F">源/目端口 · Seq/Ack · Flags · 窗口</text>

  <!-- 向下箭头 2 -->
  <line x1="822" y1="256" x2="822" y2="270" stroke="#2F6B5E" stroke-width="1.6" marker-end="url(#arrTeal)"/>
  <text x="832" y="266" font-size="9.8" fill="#2F6B5E">+ IP 首部</text>

  <!-- 阶段 3: IP 数据包 -->
  <rect x="626" y="274" width="76" height="46" rx="6" fill="#DCE9E3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="664" y="294" font-size="11.5" font-weight="700" fill="#24473F" text-anchor="middle">网络层</text>
  <text x="664" y="310" font-size="9.8" fill="#2F6B5E" text-anchor="middle">Packet</text>

  <rect x="712" y="274" width="74" height="46" rx="6" fill="#C6DDD3" stroke="#2F6B5E" stroke-width="1.3"/>
  <text x="749" y="294" font-size="11" font-weight="700" fill="#24473F" text-anchor="middle">IP 头</text>
  <text x="749" y="310" font-size="9.5" fill="#24473F" text-anchor="middle">20~60B</text>

  <rect x="790" y="274" width="66" height="46" rx="6" fill="#C9D8EA" stroke="#3D5A80" stroke-width="1.2"/>
  <text x="823" y="301" font-size="10.5" fill="#2C4460" text-anchor="middle">TCP 头</text>

  <rect x="860" y="274" width="72" height="46" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.2"/>
  <text x="896" y="301" font-size="10.5" fill="#4A473F" text-anchor="middle">数据</text>

  <text x="946" y="293" font-size="11" font-weight="700" fill="#24473F">添加主机路由首部</text>
  <text x="946" y="310" font-size="10.2" fill="#4A473F">源/目 IP · TTL 防环 · 协议号 (6=TCP)</text>

  <!-- 向下箭头 3 -->
  <line x1="822" y1="322" x2="822" y2="336" stroke="#8A6A3A" stroke-width="1.6" marker-end="url(#arrAmber)"/>
  <text x="832" y="332" font-size="9.8" fill="#8A6A3A">+ 帧头 / 帧尾</text>

  <!-- 阶段 4: 链路层帧 -->
  <rect x="626" y="340" width="76" height="46" rx="6" fill="#EFE7DA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="664" y="360" font-size="11.5" font-weight="700" fill="#6B4E28" text-anchor="middle">链路层</text>
  <text x="664" y="376" font-size="9.8" fill="#8A6A3A" text-anchor="middle">Frame</text>

  <rect x="712" y="340" width="62" height="46" rx="6" fill="#E4D4BA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="743" y="360" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">帧头</text>
  <text x="743" y="376" font-size="9.5" fill="#6B4E28" text-anchor="middle">14B</text>

  <rect x="778" y="340" width="50" height="46" rx="6" fill="#C6DDD3" stroke="#2F6B5E" stroke-width="1.1"/>
  <text x="803" y="367" font-size="10" fill="#24473F" text-anchor="middle">IP 头</text>

  <rect x="832" y="340" width="50" height="46" rx="6" fill="#C9D8EA" stroke="#3D5A80" stroke-width="1.1"/>
  <text x="857" y="367" font-size="10" fill="#2C4460" text-anchor="middle">TCP 头</text>

  <rect x="886" y="340" width="46" height="46" rx="6" fill="#F1EFE8" stroke="#9B968A" stroke-width="1.1"/>
  <text x="909" y="367" font-size="10" fill="#4A473F" text-anchor="middle">数据</text>

  <rect x="936" y="340" width="56" height="46" rx="6" fill="#E4D4BA" stroke="#8A6A3A" stroke-width="1.3"/>
  <text x="964" y="360" font-size="10.5" font-weight="700" fill="#6B4E28" text-anchor="middle">帧尾 FCS</text>
  <text x="964" y="376" font-size="9.5" fill="#6B4E28" text-anchor="middle">4B CRC</text>

  <text x="1004" y="359" font-size="11" font-weight="700" fill="#6B4E28">添加局域网物理帧封套</text>
  <text x="1004" y="376" font-size="10.2" fill="#4A473F">源/目 MAC · 类型 (0x0800) · CRC 校验</text>

  <!-- 向下箭头 4 -->
  <line x1="822" y1="388" x2="822" y2="400" stroke="#6B5B95" stroke-width="1.6" marker-end="url(#arrPurple)"/>

  <!-- 阶段 5: 物理比特流 -->
  <rect x="626" y="404" width="76" height="40" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.3"/>
  <text x="664" y="423" font-size="11.5" font-weight="700" fill="#4A3F68" text-anchor="middle">物理层</text>
  <text x="664" y="437" font-size="9.5" fill="#6B5B95" text-anchor="middle">PHY</text>

  <rect x="712" y="404" width="456" height="40" rx="6" fill="#EDEAF3" stroke="#6B5B95" stroke-width="1.2"/>
  <text x="726" y="428" font-size="10.5" font-family="monospace" fill="#6B5B95">01001110 01100101 01110100 01110111 01101111 ...</text>
  <text x="1156" y="428" font-size="10.5" font-weight="700" fill="#4A3F68" text-anchor="end">网卡 DMA → 物理比特流</text>

  <!-- 底部解封装与核心设计卡片 -->
  <rect x="626" y="456" width="548" height="96" rx="7" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="640" y="476" font-size="11.5" font-weight="700" fill="#4A473F">接收端逆向解封装与分工边界</text>
  <text x="640" y="497" font-size="10.5" font-weight="700" fill="#2C4460">逆向解封:</text>
  <text x="704" y="497" font-size="10.5" fill="#4A473F">网卡剥离帧头 → IP 校验分发 → TCP 校验重组入缓冲区 → read() 唤醒</text>
  <text x="640" y="520" font-size="10.5" font-weight="700" fill="#733428">端到端原则:</text>
  <text x="714" y="520" font-size="10.5" fill="#4A473F">TCP 连接状态仅由通信两端内核维护；中间路由器仅依 IP 头转发，完全不感知 TCP</text>
  <text x="640" y="541" font-size="10" fill="#6B675C">分工边界：IP 负责把包送到对端主机，TCP 负责把字节流准确、按序交到对端进程手中</text>

  <!-- ==================== Panel C: 各层对比对照表 ==================== -->
  <rect x="48" y="586" width="1144" height="154" rx="8" fill="#FBFBF6" stroke="#D8D5C8" stroke-width="1.2"/>
  <text x="62" y="607" font-size="13" font-weight="700" fill="#4A473F">C · 各层协议数据单元 (PDU)、寻址标识与职责边界对照</text>

  <!-- 表头 -->
  <rect x="62" y="616" width="1116" height="24" rx="4" fill="#EDEBE3" stroke="#D8D5C8" stroke-width="1"/>
  <text x="74" y="632" font-size="10.5" font-weight="700" fill="#4A473F">层级</text>
  <text x="160" y="632" font-size="10.5" font-weight="700" fill="#4A473F">代表协议</text>
  <text x="310" y="632" font-size="10.5" font-weight="700" fill="#4A473F">PDU 单元</text>
  <text x="470" y="632" font-size="10.5" font-weight="700" fill="#4A473F">寻址与作用域</text>
  <text x="680" y="632" font-size="10.5" font-weight="700" fill="#4A473F">核心控制机制与交付特征</text>

  <!-- 行 1: 应用层 -->
  <line x1="62" y1="640" x2="1178" y2="640" stroke="#D8D5C8" stroke-width="0.8"/>
  <text x="74" y="656" font-size="10.5" font-weight="700" fill="#4A473F">应用层</text>
  <text x="160" y="656" font-size="10.2" fill="#4A473F">HTTP · DNS · SSH · RPC</text>
  <text x="310" y="656" font-size="10.2" fill="#4A473F">消息 (Message)</text>
  <text x="470" y="656" font-size="10.2" fill="#4A473F">URL · 进程 PID · 业务 ID</text>
  <text x="680" y="656" font-size="10.2" fill="#4A473F">定义业务交互语义；面向用户与进程，生命周期由应用程序管理</text>

  <!-- 行 2: 传输层 -->
  <rect x="62" y="663" width="1116" height="24" rx="3" fill="#E3EAF4" fill-opacity="0.45"/>
  <text x="74" y="679" font-size="10.5" font-weight="700" fill="#2C4460">传输层</text>
  <text x="160" y="679" font-size="10.2" font-weight="700" fill="#2C4460">TCP · UDP</text>
  <text x="310" y="679" font-size="10.2" font-weight="700" fill="#2C4460">报文段 (Segment)</text>
  <text x="470" y="679" font-size="10.2" font-weight="700" fill="#2C4460">16 bit 端口号 (Port)</text>
  <text x="680" y="679" font-size="10.2" font-weight="700" fill="#2C4460">端到端进程通信；TCP 维系序号确认 (Seq/Ack)、滑动窗口与拥塞控制</text>

  <!-- 行 3: 网络层 -->
  <line x1="62" y1="687" x2="1178" y2="687" stroke="#EDEBE3" stroke-width="0.8"/>
  <text x="74" y="703" font-size="10.5" font-weight="700" fill="#24473F">网络层</text>
  <text x="160" y="703" font-size="10.2" fill="#24473F">IPv4 · IPv6 · ICMP</text>
  <text x="310" y="703" font-size="10.2" fill="#24473F">数据包 (Packet)</text>
  <text x="470" y="703" font-size="10.2" fill="#24473F">32/128 bit IP 地址</text>
  <text x="680" y="703" font-size="10.2" fill="#24473F">点对点跨网转发与路由寻址；无连接、尽力而为（不保序不重传）</text>

  <!-- 行 4: 链路与物理层 -->
  <line x1="62" y1="711" x2="1178" y2="711" stroke="#EDEBE3" stroke-width="0.8"/>
  <text x="74" y="727" font-size="10.5" font-weight="700" fill="#6B4E28">链路与物理</text>
  <text x="160" y="727" font-size="10.2" fill="#6B4E28">Ethernet · Wi‑Fi · 光纤</text>
  <text x="310" y="727" font-size="10.2" fill="#6B4E28">帧 (Frame) / 比特流</text>
  <text x="470" y="727" font-size="10.2" fill="#6B4E28">48 bit MAC 地址</text>
  <text x="680" y="727" font-size="10.2" fill="#6B4E28">局域网相邻节点直连传输；硬件 CRC-32 差错检验与物理信号调制</text>
</svg>
