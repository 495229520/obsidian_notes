<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#4f6f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .subtitle { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .box-title { font: 700 16px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .box-text { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #31465a; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .symptom { fill: #fff8e8; stroke: #d49b38; stroke-width: 2.2; rx: 20; }
      .check { fill: #f0f6ff; stroke: #2f7ab8; stroke-width: 2; rx: 18; }
      .cause { fill: #fff0f0; stroke: #c96b6b; stroke-width: 2; rx: 18; }
      .action { fill: #edf7ed; stroke: #4f8f55; stroke-width: 2; rx: 18; }
      .note { fill: #fffdf5; stroke: #c6b178; stroke-width: 1.5; rx: 14; }
      .line { stroke: #4f6f8f; stroke-width: 2.1; fill: none; marker-end: url(#arrow-hollow); }
      .soft-line { stroke: #7b8b9b; stroke-width: 1.7; fill: none; marker-end: url(#arrow-hollow); }
    </style>
  </defs>

  <text x="560" y="48" text-anchor="middle" class="title">线上排障决策流</text>
  <text x="560" y="76" text-anchor="middle" class="subtitle">先确认现象和时间线，再沿队列、EventLoop、DB、回写与系统资源逐层收敛</text>

  <rect x="418" y="116" width="284" height="76" class="symptom"/>
  <text x="560" y="145" text-anchor="middle" class="box-title">RT 升高 / 超时增多 / 错误率升高</text>
  <text x="560" y="169" text-anchor="middle" class="small">先看 QPS、P95/P99、error rate 的时间线</text>

  <rect x="412" y="244" width="296" height="76" class="check"/>
  <text x="560" y="273" text-anchor="middle" class="box-title">哪个队列最先变坏？</text>
  <text x="560" y="297" text-anchor="middle" class="small">thread queue / DB queue / output buffer</text>

  <path d="M 560 192 L 560 242" class="line"/>

  <rect x="70" y="382" width="180" height="86" class="cause"/>
  <text x="160" y="412" text-anchor="middle" class="box-title">EventLoop 阻塞</text>
  <text x="160" y="436" text-anchor="middle" class="small">loop latency 变大</text>
  <text x="160" y="456" text-anchor="middle" class="small">callback 过慢</text>

  <rect x="288" y="382" width="180" height="86" class="cause"/>
  <text x="378" y="412" text-anchor="middle" class="box-title">DB 队列堆积</text>
  <text x="378" y="436" text-anchor="middle" class="small">queue wait 增长</text>
  <text x="378" y="456" text-anchor="middle" class="small">worker busy</text>

  <rect x="506" y="382" width="180" height="86" class="cause"/>
  <text x="596" y="412" text-anchor="middle" class="box-title">连接池饱和</text>
  <text x="596" y="436" text-anchor="middle" class="small">idle = 0</text>
  <text x="596" y="456" text-anchor="middle" class="small">acquire latency 升高</text>

  <rect x="724" y="382" width="180" height="86" class="cause"/>
  <text x="814" y="412" text-anchor="middle" class="box-title">SQL 变慢</text>
  <text x="814" y="436" text-anchor="middle" class="small">slow query</text>
  <text x="814" y="456" text-anchor="middle" class="small">lock wait / 索引</text>

  <rect x="942" y="382" width="150" height="86" class="cause"/>
  <text x="1017" y="412" text-anchor="middle" class="box-title">回写受阻</text>
  <text x="1017" y="436" text-anchor="middle" class="small">output buffer</text>
  <text x="1017" y="456" text-anchor="middle" class="small">EPOLLOUT 增多</text>

  <path d="M 515 320 C 420 350 240 350 160 380" class="line"/>
  <path d="M 530 320 C 480 352 425 354 378 380" class="line"/>
  <path d="M 560 320 L 596 380" class="line"/>
  <path d="M 590 320 C 666 354 754 354 814 380" class="line"/>
  <path d="M 612 320 C 742 350 930 350 1017 380" class="line"/>

  <rect x="70" y="540" width="180" height="78" class="action"/>
  <text x="160" y="569" text-anchor="middle" class="box-title">检查慢回调</text>
  <text x="160" y="593" text-anchor="middle" class="small">日志 / CPU / 锁</text>

  <rect x="288" y="540" width="180" height="78" class="action"/>
  <text x="378" y="569" text-anchor="middle" class="box-title">拆 queue wait</text>
  <text x="378" y="593" text-anchor="middle" class="small">worker 数 / 拒绝数</text>

  <rect x="506" y="540" width="180" height="78" class="action"/>
  <text x="596" y="569" text-anchor="middle" class="box-title">查连接占用</text>
  <text x="596" y="593" text-anchor="middle" class="small">事务 / 长 SQL</text>

  <rect x="724" y="540" width="180" height="78" class="action"/>
  <text x="814" y="569" text-anchor="middle" class="box-title">查慢查询</text>
  <text x="814" y="593" text-anchor="middle" class="small">索引 / 锁等待</text>

  <rect x="942" y="540" width="150" height="78" class="action"/>
  <text x="1017" y="569" text-anchor="middle" class="box-title">查慢客户端</text>
  <text x="1017" y="593" text-anchor="middle" class="small">ss / tcpdump</text>

  <path d="M 160 468 L 160 538" class="soft-line"/>
  <path d="M 378 468 L 378 538" class="soft-line"/>
  <path d="M 596 468 L 596 538" class="soft-line"/>
  <path d="M 814 468 L 814 538" class="soft-line"/>
  <path d="M 1017 468 L 1017 538" class="soft-line"/>

  <rect x="300" y="646" width="520" height="48" class="note"/>
  <text x="560" y="674" text-anchor="middle" class="small">排障原则：找时间线上第一个异常指标，再沿该层向上下游验证，不要直接猜根因</text>
</svg>
