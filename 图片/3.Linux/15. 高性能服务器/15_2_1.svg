<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#4f6f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .subtitle { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .box-title { font: 700 16px Arial, "Microsoft YaHei", sans-serif; fill: #243447; }
      .box-text { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #31465a; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #5b6773; }
      .client { fill: #fff8e8; stroke: #d49b38; stroke-width: 2; rx: 18; }
      .io { fill: #edf7ed; stroke: #4f8f55; stroke-width: 2.2; rx: 18; }
      .queue { fill: #f0f6ff; stroke: #2f7ab8; stroke-width: 2; rx: 18; }
      .db { fill: #fff0f0; stroke: #c96b6b; stroke-width: 2; rx: 18; }
      .write { fill: #f8f0ff; stroke: #8b6bb8; stroke-width: 2; rx: 18; }
      .note { fill: #fffdf5; stroke: #c6b178; stroke-width: 1.5; rx: 14; }
      .line { stroke: #4f6f8f; stroke-width: 2.1; fill: none; marker-end: url(#arrow-hollow); }
      .soft-line { stroke: #7b8b9b; stroke-width: 1.7; fill: none; marker-end: url(#arrow-hollow); }
    </style>
  </defs>

  <text x="560" y="48" text-anchor="middle" class="title">压测链路与分层指标</text>
  <text x="560" y="76" text-anchor="middle" class="subtitle">一次请求的 RT 由多段等待和执行组成，排障要看每层的队列与耗时</text>

  <rect x="45" y="138" width="155" height="92" class="client"/>
  <text x="122" y="166" text-anchor="middle" class="box-title">压测机 / 客户端</text>
  <text x="122" y="191" text-anchor="middle" class="box-text">QPS / P95 / P99</text>
  <text x="122" y="212" text-anchor="middle" class="small">timeout / error rate</text>

  <rect x="245" y="138" width="155" height="92" class="io"/>
  <text x="322" y="166" text-anchor="middle" class="box-title">EventLoop</text>
  <text x="322" y="191" text-anchor="middle" class="box-text">read + parse</text>
  <text x="322" y="212" text-anchor="middle" class="small">loop latency</text>

  <rect x="445" y="138" width="155" height="92" class="queue"/>
  <text x="522" y="166" text-anchor="middle" class="box-title">有界任务队列</text>
  <text x="522" y="191" text-anchor="middle" class="box-text">queue length</text>
  <text x="522" y="212" text-anchor="middle" class="small">wait time / reject</text>

  <rect x="645" y="138" width="155" height="92" class="db"/>
  <text x="722" y="166" text-anchor="middle" class="box-title">MySQL 连接池</text>
  <text x="722" y="191" text-anchor="middle" class="box-text">idle / in-use</text>
  <text x="722" y="212" text-anchor="middle" class="small">acquire latency</text>

  <rect x="845" y="138" width="155" height="92" class="db"/>
  <text x="922" y="166" text-anchor="middle" class="box-title">MySQL Server</text>
  <text x="922" y="191" text-anchor="middle" class="box-text">SQL execute</text>
  <text x="922" y="212" text-anchor="middle" class="small">slow query / lock wait</text>

  <path d="M 200 184 L 243 184" class="line"/>
  <path d="M 400 184 L 443 184" class="line"/>
  <path d="M 600 184 L 643 184" class="line"/>
  <path d="M 800 184 L 843 184" class="line"/>

  <rect x="256" y="382" width="178" height="94" class="io"/>
  <text x="345" y="411" text-anchor="middle" class="box-title">queueInLoop</text>
  <text x="345" y="436" text-anchor="middle" class="box-text">eventfd 唤醒</text>
  <text x="345" y="458" text-anchor="middle" class="small">结果回到所属 loop</text>

  <rect x="512" y="382" width="178" height="94" class="write"/>
  <text x="601" y="411" text-anchor="middle" class="box-title">output buffer</text>
  <text x="601" y="436" text-anchor="middle" class="box-text">待发送响应</text>
  <text x="601" y="458" text-anchor="middle" class="small">buffer size / EPOLLOUT</text>

  <rect x="768" y="382" width="178" height="94" class="client"/>
  <text x="857" y="411" text-anchor="middle" class="box-title">客户端收到响应</text>
  <text x="857" y="436" text-anchor="middle" class="box-text">end-to-end RT</text>
  <text x="857" y="458" text-anchor="middle" class="small">P99 汇总所有等待</text>

  <path d="M 922 230 C 880 306 430 314 345 380" class="soft-line"/>
  <path d="M 434 429 L 510 429" class="line"/>
  <path d="M 690 429 L 766 429" class="line"/>
  <path d="M 768 458 C 600 556 210 532 122 232" class="soft-line"/>

  <rect x="104" y="552" width="395" height="68" class="note"/>
  <text x="301" y="580" text-anchor="middle" class="box-title">分段打点</text>
  <text x="301" y="603" text-anchor="middle" class="small">queue wait、acquire、execute、回写要分开记录，不能只看总耗时</text>

  <rect x="620" y="552" width="395" height="68" class="note"/>
  <text x="817" y="580" text-anchor="middle" class="box-title">过载信号</text>
  <text x="817" y="603" text-anchor="middle" class="small">P99 上升前，通常先出现队列增长、连接池打满或 output buffer 积压</text>
</svg>
