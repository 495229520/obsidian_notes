<svg xmlns="http://www.w3.org/2000/svg" width="800" height="780" viewBox="0 0 800 780">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>龙贝格 T 表：梯形递推 + 逐列外推 + 对角收敛判断</title>
  <desc>三角形 T 表，T0 列竖向为变步长梯形递推，横向为外推升阶，对角线为收敛判断。</desc>
  <rect x="0" y="0" width="800" height="780" fill="rgb(245, 244, 237)"/>

  <!-- 左上角说明 -->
  <text x="34" y="48" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">二分</text>
  <text x="34" y="64" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">次数</text>

  <!-- 列标题 -->
  <text x="100" y="55" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">T0 梯形</text>
  <text x="250" y="55" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">T1 Simpson</text>
  <text x="400" y="55" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">T2 Cotes</text>
  <text x="550" y="55" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">T3 Romberg</text>
  <text x="700" y="55" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">T4</text>

  <!-- 行号 -->
  <text x="34" y="100" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="34" y="210" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="34" y="320" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="34" y="430" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="34" y="540" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">4</text>

  <!-- 竖向梯形递推箭头（Amber，T0 列） -->
  <line x1="100" y1="123" x2="100" y2="187" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="233" x2="100" y2="297" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="343" x2="100" y2="407" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="453" x2="100" y2="517" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 横向外推箭头（Blue） -->
  <line x1="142" y1="210" x2="208" y2="210" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="142" y1="320" x2="208" y2="320" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="292" y1="320" x2="358" y2="320" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="142" y1="430" x2="208" y2="430" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="292" y1="430" x2="358" y2="430" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="442" y1="430" x2="508" y2="430" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="142" y1="540" x2="208" y2="540" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="292" y1="540" x2="358" y2="540" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="442" y1="540" x2="508" y2="540" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="592" y1="540" x2="658" y2="540" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 对角收敛判断箭头（Purple） -->
  <line x1="138" y1="122" x2="212" y2="188" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="288" y1="232" x2="362" y2="298" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="438" y1="342" x2="512" y2="408" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="588" y1="452" x2="662" y2="518" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 单元格 -->
  <g font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#444441" text-anchor="middle">
    <rect x="58" y="77" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="100" y="100" dominant-baseline="central">T<tspan font-size="10" dy="4">0</tspan><tspan font-size="10" dy="-8">(0)</tspan></text>

    <rect x="58" y="187" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="100" y="210" dominant-baseline="central">T<tspan font-size="10" dy="4">0</tspan><tspan font-size="10" dy="-8">(1)</tspan></text>
    <rect x="208" y="187" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="250" y="210" dominant-baseline="central">T<tspan font-size="10" dy="4">1</tspan><tspan font-size="10" dy="-8">(0)</tspan></text>

    <rect x="58" y="297" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="100" y="320" dominant-baseline="central">T<tspan font-size="10" dy="4">0</tspan><tspan font-size="10" dy="-8">(2)</tspan></text>
    <rect x="208" y="297" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="250" y="320" dominant-baseline="central">T<tspan font-size="10" dy="4">1</tspan><tspan font-size="10" dy="-8">(1)</tspan></text>
    <rect x="358" y="297" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="400" y="320" dominant-baseline="central">T<tspan font-size="10" dy="4">2</tspan><tspan font-size="10" dy="-8">(0)</tspan></text>

    <rect x="58" y="407" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="100" y="430" dominant-baseline="central">T<tspan font-size="10" dy="4">0</tspan><tspan font-size="10" dy="-8">(3)</tspan></text>
    <rect x="208" y="407" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="250" y="430" dominant-baseline="central">T<tspan font-size="10" dy="4">1</tspan><tspan font-size="10" dy="-8">(2)</tspan></text>
    <rect x="358" y="407" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="400" y="430" dominant-baseline="central">T<tspan font-size="10" dy="4">2</tspan><tspan font-size="10" dy="-8">(1)</tspan></text>
    <rect x="508" y="407" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="550" y="430" dominant-baseline="central">T<tspan font-size="10" dy="4">3</tspan><tspan font-size="10" dy="-8">(0)</tspan></text>

    <rect x="58" y="517" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="100" y="540" dominant-baseline="central">T<tspan font-size="10" dy="4">0</tspan><tspan font-size="10" dy="-8">(4)</tspan></text>
    <rect x="208" y="517" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="250" y="540" dominant-baseline="central">T<tspan font-size="10" dy="4">1</tspan><tspan font-size="10" dy="-8">(3)</tspan></text>
    <rect x="358" y="517" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="400" y="540" dominant-baseline="central">T<tspan font-size="10" dy="4">2</tspan><tspan font-size="10" dy="-8">(2)</tspan></text>
    <rect x="508" y="517" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="550" y="540" dominant-baseline="central">T<tspan font-size="10" dy="4">3</tspan><tspan font-size="10" dy="-8">(1)</tspan></text>
    <rect x="658" y="517" width="84" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="700" y="540" dominant-baseline="central">T<tspan font-size="10" dy="4">4</tspan><tspan font-size="10" dy="-8">(0)</tspan></text>
  </g>

  <!-- 图例 -->
  <line x1="58" y1="604" x2="98" y2="604" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="112" y="604" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">梯形递推（竖向）：逐次二分加密，复用旧节点 + 新增中点</text>

  <line x1="58" y1="632" x2="98" y2="632" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="112" y="632" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start" dominant-baseline="central">外推升阶（横向）：把上标 k 搬到下标 m，精度升一级</text>

  <line x1="58" y1="660" x2="98" y2="660" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="112" y="660" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="start" dominant-baseline="central">收敛判断（对角）：相邻对角差 |Tk(0) − Tk-1(0)| &lt; ε 即停</text>

  <!-- 一般式 -->
  <rect x="58" y="688" width="684" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="400" y="710" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Romberg 一般式：Tm(k) = [ 4^m · Tm-1(k+1) − Tm-1(k) ] / ( 4^m − 1 )</text>
</svg>
