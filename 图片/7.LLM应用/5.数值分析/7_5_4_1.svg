<path d="M253 362 h10 a3 3 0 0 1 3 3 v10 a3 3 0 0 1 -3 3 h-10 a3 3 0 0 1 -3 -3 v-10 a3 3 0 0 1 3 -3 z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
