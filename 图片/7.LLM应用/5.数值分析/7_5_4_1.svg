<!-- ===== bottom rule callout ===== -->
<path d="M52 392 h856 a8 8 0 0 1 8 8 v88 a8 8 0 0 1 -8 8 h-856 a8 8 0 0 1 -8 -8 v-88 a8 8 0 0 1 8 -8 z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="60" y="412" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#633806" text-anchor="start" dominant-baseline="central">唯一区别：重复节点那一行怎么填</text>
<text x="60" y="436" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">• 牛顿（节点互异）：每格照常算　f[xᵢ,xⱼ] = ( f(xⱼ) − f(xᵢ) ) / ( xⱼ − xᵢ )</text>
<text x="60" y="458" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">• 埃尔米特（节点重复）：分母 xₖ−xₖ = 0，改填导数　f[x,x] = f′(x)，　f[x,x,x] = f″(x)/2!</text>
<text x="60" y="480" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">• 导数填好后，二阶、三阶…其余格子仍按普通差商公式照常级联，方法与牛顿完全一致。</text>
</svg>
