<rect x="0" y="0" width="960" height="536" fill="rgb(245, 244, 237)"/>
<title>牛顿插值与埃尔米特插值差商表对比</title>
<desc>左侧牛顿插值节点互异，所有格子为普通差商；右侧埃尔米特插值节点重复，重合处分母为零，改填导数。</desc>
<text x="480" y="30" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">牛顿插值 vs 埃尔米特插值：差商表的唯一区别</text>
<text x="480" y="56" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">同一套差商表规则——唯一不同：重复节点处分母为 0，改填导数</text>
<text x="206" y="86" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">① 牛顿插值（节点互异）</text>
<text x="741" y="86" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">② 埃尔米特插值（节点重复）</text>

