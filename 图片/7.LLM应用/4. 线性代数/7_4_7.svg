<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <title>向量线性相关性的几何直观：共线即相关</title>
  <desc>左：两向量共线（成比例），线性相关；右：两向量不共线，张成一个平面区域，线性无关。</desc>
  <rect x="0" y="0" width="720" height="300" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="360" y="30" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">向量的线性相关性 · 几何直观</text>

  <!-- 中间分隔 -->
  <path d="M360 64 V268" stroke="#5F5E5A" stroke-width="0.5" fill="none" stroke-dasharray="4 4"/>

  <!-- ===== 左：共线 → 相关 ===== -->
  <text x="180" y="64" font-family="system-ui,sans-serif" font-size="13.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#A23838">线性相关（共线）</text>

  <!-- 共线参考线 -->
  <path d="M113 230 L304 112" stroke="#9A9893" stroke-width="0.8" fill="none" stroke-dasharray="3 3"/>
  <!-- 原点 -->
  <circle cx="140" cy="213" r="2.6" fill="#444441"/>
  <text x="128" y="224" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#444441">O</text>
  <!-- α₂（长，橙） -->
  <path d="M140 213 L283 124" stroke="#854F0B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="294" y="120" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">α₂</text>
  <!-- α₁（短，蓝） -->
  <path d="M140 213 L228 158" stroke="#185FA5" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <text x="223" y="172" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">α₁</text>

  <text x="180" y="256" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#A23838">α₂ = k·α₁（对应成比例）</text>
  <text x="180" y="276" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">|α₁ α₂| = 0，秩 = 1 &lt; 2</text>

  <!-- ===== 右：不共线 → 无关 ===== -->
  <text x="540" y="64" font-family="system-ui,sans-serif" font-size="13.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">线性无关（不共线）</text>

  <!-- 张成的平行四边形（淡） -->
  <path d="M480 213 L575 163 L610 78 L515 128 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" opacity="0.7"/>
  <!-- 原点 -->
  <circle cx="480" cy="213" r="2.6" fill="#444441"/>
  <text x="468" y="224" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#444441">O</text>
  <!-- α₁（蓝） -->
  <path d="M480 213 L575 163" stroke="#185FA5" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <text x="588" y="166" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">α₁</text>
  <!-- α₂（橙） -->
  <path d="M480 213 L515 128" stroke="#854F0B" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <text x="503" y="120" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">α₂</text>

  <text x="540" y="256" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">方向不同，张成一个平面</text>
  <text x="540" y="276" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">|α₁ α₂| ≠ 0，秩 = 2 = 个数</text>
</svg>
