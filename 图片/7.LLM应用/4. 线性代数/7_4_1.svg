<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420">
  <title>爪型行列式结构</title>
  <desc>四阶爪型行列式：非零元集中在首行、首列与主对角线，用对角元消去爪臂化为三角形。</desc>
  <rect x="0" y="0" width="680" height="420" fill="rgb(245, 244, 237)"/>
  <text x="340" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">爪型（箭形）行列式</text>

  <!-- 行列式左右竖线 -->
  <path d="M216 64 L216 276" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M464 64 L464 276" stroke="#444441" stroke-width="1.5" fill="none"/>

  <!-- 第 0 行：a0 b1 b2 b3 -->
  <path d="M224 70 H282 V120 H224 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="253" y="95" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">a₀</text>
  <path d="M282 70 H340 V120 H282 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="311" y="95" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">b₁</text>
  <path d="M340 70 H398 V120 H340 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="369" y="95" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">b₂</text>
  <path d="M398 70 H456 V120 H398 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="427" y="95" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">b₃</text>

  <!-- 第 1 行：c1 d1 0 0 -->
  <path d="M224 120 H282 V170 H224 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="253" y="145" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">c₁</text>
  <path d="M282 120 H340 V170 H282 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="311" y="145" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">d₁</text>
  <path d="M340 120 H398 V170 H340 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="369" y="145" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M398 120 H456 V170 H398 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="427" y="145" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>

  <!-- 第 2 行：c2 0 d2 0 -->
  <path d="M224 170 H282 V220 H224 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="253" y="195" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">c₂</text>
  <path d="M282 170 H340 V220 H282 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="311" y="195" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M340 170 H398 V220 H340 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="369" y="195" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">d₂</text>
  <path d="M398 170 H456 V220 H398 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="427" y="195" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>

  <!-- 第 3 行：c3 0 0 d3 -->
  <path d="M224 220 H282 V270 H224 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="253" y="245" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">c₃</text>
  <path d="M282 220 H340 V270 H282 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="311" y="245" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M340 220 H398 V270 H340 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="369" y="245" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M398 220 H456 V270 H398 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="427" y="245" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">d₃</text>

  <!-- 说明 -->
  <text x="340" y="302" font-family="system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">非零元集中在 首行 + 首列 + 主对角线，形如「爪 / 箭」</text>
  <text x="340" y="326" font-family="system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">消元：用对角元 d₁ d₂ d₃ 把首行 b₁ b₂ b₃ 消成 0 → 下三角行列式</text>

  <!-- 结果公式 -->
  <path d="M88 350 H592 V392 H88 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="371" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">D = d₁·d₂·d₃·( a₀ − b₁c₁/d₁ − b₂c₂/d₂ − b₃c₃/d₃ )</text>
</svg>
