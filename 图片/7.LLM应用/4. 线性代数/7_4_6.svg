<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380">
  <title>行阶梯形矩阵与秩</title>
  <desc>行阶梯形矩阵：每行首个非零元（主元）所在列逐行严格右移形成阶梯，全零行沉底；秩等于非零行的行数。</desc>
  <rect x="0" y="0" width="640" height="380" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="320" y="32" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">行阶梯形矩阵与秩 r(A)</text>

  <!-- 矩阵外框括号 -->
  <path d="M92 84 q-10 0 -10 14 V258 q0 14 10 14" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M328 84 q10 0 10 14 V258 q0 14 -10 14" stroke="#444441" stroke-width="1.5" fill="none"/>

  <!-- 第1行：主元 ∗ ∗ ∗ ∗ -->
  <path d="M100 90 H144 V134 H100 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="122" cy="112" r="7" fill="#0F6E56"/>
  <path d="M144 90 H188 V134 H144 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="166" y="112" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">∗</text>
  <path d="M188 90 H232 V134 H188 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="112" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">∗</text>
  <path d="M232 90 H276 V134 H232 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="254" y="112" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">∗</text>
  <path d="M276 90 H320 V134 H276 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="298" y="112" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">∗</text>

  <!-- 第2行：0 0 主元 ∗ ∗ -->
  <path d="M100 134 H144 V178 H100 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="122" y="156" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M144 134 H188 V178 H144 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="166" y="156" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M188 134 H232 V178 H188 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="210" cy="156" r="7" fill="#0F6E56"/>
  <path d="M232 134 H276 V178 H232 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="254" y="156" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">∗</text>
  <path d="M276 134 H320 V178 H276 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="298" y="156" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">∗</text>

  <!-- 第3行：0 0 0 主元 ∗ -->
  <path d="M100 178 H144 V222 H100 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="122" y="200" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M144 178 H188 V222 H144 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="166" y="200" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M188 178 H232 V222 H188 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="210" y="200" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M232 178 H276 V222 H232 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="254" cy="200" r="7" fill="#0F6E56"/>
  <path d="M276 178 H320 V222 H276 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="298" y="200" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">∗</text>

  <!-- 第4行：全零行 -->
  <path d="M100 222 H144 V266 H100 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="122" y="244" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M144 222 H188 V266 H144 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="166" y="244" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M188 222 H232 V266 H188 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="210" y="244" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M232 222 H276 V266 H232 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="254" y="244" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M276 222 H320 V266 H276 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="298" y="244" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>

  <!-- 阶梯线 -->
  <path d="M100 134 H188 V178 H232 V222 H320" stroke="#854F0B" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- 全零行标注 -->
  <path d="M392 244 H338" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="396" y="244" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="central" fill="#444441">全零行 → 沉到底部</text>

  <!-- 右侧图例 -->
  <circle cx="364" cy="106" r="7" fill="#0F6E56"/>
  <text x="378" y="106" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="central" fill="#085041">= 主元（每行首个非零元）</text>
  <text x="356" y="140" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#854F0B">主元所在列逐行严格右移，</text>
  <text x="356" y="160" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#854F0B">形成下降的「阶梯」（橙线）</text>
  <text x="356" y="200" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">∗ 表示任意数（含 0）</text>

  <!-- 秩结论 -->
  <path d="M120 300 H520 V340 H120 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="320" y="320" font-family="system-ui,sans-serif" font-size="13.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">秩 r(A) = 行阶梯形中非零行的行数 = 3</text>
</svg>
