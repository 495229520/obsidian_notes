<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470">
  <title>矩阵乘法：维度匹配与行乘列</title>
  <desc>上：矩阵相乘的合法性（内标相等）与结果维度（前行后列）；下：元素 c_ij 由 A 的第 i 行点乘 B 的第 j 列得到。</desc>
  <rect x="0" y="0" width="720" height="470" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="360" y="30" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">矩阵乘法：维度匹配与「行 × 列」</text>

  <!-- ===== 上：维度法则 ===== -->
  <text x="126" y="70" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">A</text>
  <text x="266" y="70" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">B</text>
  <text x="426" y="70" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">C = AB</text>

  <!-- A: 行m | 列n -->
  <path d="M70 82 H126 V130 H70 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="98" y="106" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">m</text>
  <path d="M126 82 H182 V130 H126 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="154" y="106" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">n</text>

  <text x="196" y="106" font-family="system-ui,sans-serif" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">·</text>

  <!-- B: 行n | 列p -->
  <path d="M210 82 H266 V130 H210 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="238" y="106" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">n</text>
  <path d="M266 82 H322 V130 H266 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="294" y="106" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">p</text>

  <text x="346" y="106" font-family="system-ui,sans-serif" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">=</text>

  <!-- C: 行m | 列p -->
  <path d="M370 82 H426 V130 H370 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="398" y="106" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">m</text>
  <path d="M426 82 H482 V130 H426 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="454" y="106" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">p</text>

  <!-- 内标相等连接线 + 标签 -->
  <path d="M154 130 L182 150" stroke="#0F6E56" stroke-width="1" fill="none"/>
  <path d="M238 130 L210 150" stroke="#0F6E56" stroke-width="1" fill="none"/>
  <path d="M112 150 H280 V174 H112 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="196" y="162" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">内标相等 → 才能相乘</text>

  <!-- 前行后列标签 -->
  <path d="M348 150 H504 V174 H348 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="426" y="162" font-family="system-ui,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">前行后列 → 结果 m × p</text>

  <!-- 右侧图例 -->
  <text x="540" y="96" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#185FA5">蓝 = 行数 m</text>
  <text x="540" y="116" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#0F6E56">绿 = 公共维 n</text>
  <text x="540" y="136" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#854F0B">橙 = 列数 p</text>

  <!-- 分隔线 -->
  <path d="M60 196 H660" stroke="#5F5E5A" stroke-width="0.5" fill="none" stroke-dasharray="4 4"/>

  <!-- ===== 下：行 × 列 ===== -->
  <text x="360" y="218" font-family="system-ui,sans-serif" font-size="13.5" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">元素法则：c_ij = A 的第 i 行 · B 的第 j 列</text>

  <!-- A 网格 3x3，第2行高亮 -->
  <text x="139" y="248" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">A</text>
  <path d="M100 284 H178 V310 H100 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <path d="M100 258 H178 V336 H100 Z" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
  <path d="M126 258 V336 M152 258 V336 M100 284 H178 M100 310 H178" stroke="#5F5E5A" stroke-width="0.5" fill="none"/>
  <text x="113" y="271" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>
  <text x="139" y="271" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>
  <text x="165" y="271" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>
  <text x="113" y="297" font-family="system-ui,sans-serif" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">a₂₁</text>
  <text x="139" y="297" font-family="system-ui,sans-serif" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">a₂₂</text>
  <text x="165" y="297" font-family="system-ui,sans-serif" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">a₂₃</text>
  <text x="113" y="323" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>
  <text x="139" y="323" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>
  <text x="165" y="323" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>

  <text x="198" y="297" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">·</text>

  <!-- B 网格 3x3，第2列高亮 -->
  <text x="257" y="248" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">B</text>
  <path d="M244 258 H270 V336 H244 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <path d="M218 258 H296 V336 H218 Z" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
  <path d="M244 258 V336 M270 258 V336 M218 284 H296 M218 310 H296" stroke="#5F5E5A" stroke-width="0.5" fill="none"/>
  <text x="231" y="271" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>
  <text x="257" y="271" font-family="system-ui,sans-serif" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">b₁₂</text>
  <text x="283" y="271" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>
  <text x="231" y="297" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>
  <text x="257" y="297" font-family="system-ui,sans-serif" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">b₂₂</text>
  <text x="283" y="297" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>
  <text x="231" y="323" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>
  <text x="257" y="323" font-family="system-ui,sans-serif" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">b₃₂</text>
  <text x="283" y="323" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#444441">∗</text>

  <text x="316" y="297" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">=</text>

  <!-- C 网格 3x3，(2,2)高亮 -->
  <text x="375" y="248" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#444441">C</text>
  <path d="M362 284 H388 V310 H362 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <path d="M336 258 H414 V336 H336 Z" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
  <path d="M362 258 V336 M388 258 V336 M336 284 H414 M336 310 H414" stroke="#5F5E5A" stroke-width="0.5" fill="none"/>
  <text x="375" y="297" font-family="system-ui,sans-serif" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">c₂₂</text>

  <!-- 指向公式的箭头 -->
  <path d="M420 297 H432" stroke="#534AB7" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 公式条 -->
  <path d="M440 278 H674 V316 H440 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="557" y="297" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">c₂₂ = a₂₁b₁₂ + a₂₂b₂₂ + a₂₃b₃₂</text>

  <!-- 具体例子 -->
  <text x="360" y="362" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">具体：行 (1, 2, 3) · 列 (3, 2, 1)ᵀ = 1·3 + 2·2 + 3·1 = 10</text>
  <text x="360" y="386" font-family="system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#085041">第 i 行（蓝）与第 j 列（橙）对应相乘求和，落到结果的 (i, j) 位置（紫）</text>
</svg>
