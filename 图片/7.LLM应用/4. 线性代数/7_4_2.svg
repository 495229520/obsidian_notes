<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340">
  <title>余子式与代数余子式</title>
  <desc>划去元素 a12 所在的第一行与第二列，余下元素构成余子式 M12；代数余子式 A12 = (-1)^(1+2) M12。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="340" fill="rgb(245, 244, 237)"/>
  <text x="237" y="40" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">余子式 M₁₂ 的构造</text>

  <!-- 行列式左右竖线 -->
  <path d="M142 78 L142 238" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M328 78 L328 238" stroke="#444441" stroke-width="1.5" fill="none"/>

  <!-- 第 0 行 -->
  <path d="M150 84 H208 V134 H150 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="179" y="109" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">a₁₁</text>
  <path d="M208 84 H266 V134 H208 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="237" y="109" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">a₁₂</text>
  <path d="M266 84 H324 V134 H266 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="295" y="109" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">a₁₃</text>

  <!-- 第 1 行 -->
  <path d="M150 134 H208 V184 H150 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="179" y="159" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">a₂₁</text>
  <path d="M208 134 H266 V184 H208 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="237" y="159" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">a₂₂</text>
  <path d="M266 134 H324 V184 H266 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="295" y="159" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">a₂₃</text>

  <!-- 第 2 行 -->
  <path d="M150 184 H208 V234 H150 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="179" y="209" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">a₃₁</text>
  <path d="M208 184 H266 V234 H208 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="237" y="209" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">a₃₂</text>
  <path d="M266 184 H324 V234 H266 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="295" y="209" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">a₃₃</text>

  <!-- 划行划列（虚线） -->
  <path d="M138 109 L332 109" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M237 76 L237 240" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <!-- 箭头到余子式 -->
  <path d="M346 159 L420 159" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="455" y="159" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">M₁₂ =</text>

  <!-- 余子式 2x2 -->
  <path d="M480 106 L480 212" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M608 106 L608 212" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M486 110 H544 V160 H486 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="515" y="135" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">a₂₁</text>
  <path d="M544 110 H602 V160 H544 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="573" y="135" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">a₂₃</text>
  <path d="M486 160 H544 V210 H486 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="515" y="185" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">a₃₁</text>
  <path d="M544 160 H602 V210 H544 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="573" y="185" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">a₃₃</text>

  <!-- 说明 -->
  <text x="340" y="262" font-family="system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">余子式 M₁₂：划去 a₁₂ 所在的「第 1 行」与「第 2 列」，余下元素按原序构成的行列式</text>
  <text x="340" y="288" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">代数余子式 A₁₂ = (−1)¹⁺² · M₁₂ = − M₁₂</text>
</svg>
