<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430">
  <title>拉普拉斯分块行列式公式</title>
  <desc>当右上角为零块时，分块行列式等于两个对角块行列式之积：det[A 0; C B] = det(A)·det(B)。</desc>
  <rect x="0" y="0" width="680" height="430" fill="rgb(245, 244, 237)"/>
  <text x="340" y="38" font-family="system-ui,sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">拉普拉斯分块公式</text>

  <!-- 行列式左右竖线 -->
  <path d="M228 72 L228 264" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M448 72 L448 264" stroke="#444441" stroke-width="1.5" fill="none"/>

  <!-- 第 0 行：5 2 | 0 0 -->
  <path d="M236 76 H288 V122 H236 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="262" y="99" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">5</text>
  <path d="M288 76 H340 V122 H288 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="314" y="99" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">2</text>
  <path d="M340 76 H392 V122 H340 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="366" y="99" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M392 76 H444 V122 H392 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="418" y="99" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>

  <!-- 第 1 行：2 1 | 0 0 -->
  <path d="M236 122 H288 V168 H236 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="262" y="145" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">2</text>
  <path d="M288 122 H340 V168 H288 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="314" y="145" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#0C447C">1</text>
  <path d="M340 122 H392 V168 H340 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="366" y="145" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>
  <path d="M392 122 H444 V168 H392 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="418" y="145" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">0</text>

  <!-- 第 2 行：1 2 | 8 3 -->
  <path d="M236 168 H288 V214 H236 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="262" y="191" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">1</text>
  <path d="M288 168 H340 V214 H288 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="314" y="191" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">2</text>
  <path d="M340 168 H392 V214 H340 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="366" y="191" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">8</text>
  <path d="M392 168 H444 V214 H392 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="418" y="191" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">3</text>

  <!-- 第 3 行：0 3 | 5 2 -->
  <path d="M236 214 H288 V260 H236 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="262" y="237" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">0</text>
  <path d="M288 214 H340 V260 H288 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="314" y="237" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#633806">3</text>
  <path d="M340 214 H392 V260 H340 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="366" y="237" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">5</text>
  <path d="M392 214 H444 V260 H392 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="418" y="237" font-family="system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">2</text>

  <!-- 分块虚线 -->
  <path d="M340 72 L340 264" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M228 168 L448 168" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <!-- 图例 -->
  <path d="M96 283 H114 V301 H96 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="122" y="292" font-family="system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">A 左上块</text>
  <path d="M232 283 H250 V301 H232 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="258" y="292" font-family="system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">0 右上零块</text>
  <path d="M392 283 H410 V301 H392 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="418" y="292" font-family="system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">C 左下块</text>
  <path d="M520 283 H538 V301 H520 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="546" y="292" font-family="system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">B 右下块</text>

  <!-- 公式与示例 -->
  <text x="340" y="328" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#3C3489">右上角为零块  ⟹  D = |A| · |B|</text>
  <path d="M70 352 H610 V394 H70 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="373" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">本例：|A| = |5 2 ; 2 1| = 1，  |B| = |8 3 ; 5 2| = 1   ⟹   D = 1 × 1 = 1</text>
</svg>
