<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">HostMainDlg 静态架构图</title>
  <desc id="desc">展示远控服务端中 MFC 应用入口、CHostMainDlg、后台 CServerSocket、授权弹窗、共享指示条、会话策略、托盘和日志之间的职责关系。</desc>
  <rect width="1600" height="900" fill="rgb(245, 244, 237)" />

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#5f6d78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#2f6f9f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#4f8068" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <style>
      text {
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
        fill: #2d2a24;
        letter-spacing: 0;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #6b665f; }
      .zone-title { font-size: 21px; font-weight: 700; }
      .zone-note { font-size: 14px; fill: #686259; }
      .node-title { font-size: 18px; font-weight: 700; }
      .node-code { font-family: Consolas, "Courier New", monospace; font-size: 15px; fill: #3a3630; }
      .node-small { font-size: 13px; fill: #5d584f; }
      .edge-label { font-size: 13px; fill: #4f5961; font-weight: 700; }
      .badge { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <text x="800" y="48" text-anchor="middle" class="title">HostMainDlg 架构：UI 协调中心 + 后台网络线程</text>
  <text x="800" y="78" text-anchor="middle" class="subtitle">主对话框负责状态协调；网络 I/O、授权等待、会话计时、Banner 和托盘各自独立，通过消息边界连接。</text>

  <rect x="48" y="118" width="1504" height="112" rx="18" fill="#eee8dc" stroke="#c9bda9" stroke-width="1.6" stroke-dasharray="8 7" />
  <text x="88" y="154" class="zone-title">进程入口与全局初始化</text>
  <text x="88" y="181" class="zone-note">CRemoteCtrlApp::InitInstance() 完成 MFC 初始化、Winsock 初始化，并以 DoModal() 启动主对话框消息循环。</text>

  <rect x="96" y="252" width="360" height="164" rx="14" fill="#f9f6ef" stroke="#bea98b" stroke-width="1.7" />
  <text x="276" y="292" text-anchor="middle" class="node-title">CRemoteCtrlApp</text>
  <text x="276" y="324" text-anchor="middle" class="node-code">InitInstance()</text>
  <text x="276" y="352" text-anchor="middle" class="node-small">WSAStartup · SetRegistryKey</text>
  <text x="276" y="376" text-anchor="middle" class="node-small">dialog.DoModal()</text>

  <rect x="574" y="252" width="452" height="236" rx="16" fill="#fbfaf5" stroke="#406f8a" stroke-width="2.2" />
  <text x="800" y="292" text-anchor="middle" class="node-title">CHostMainDlg</text>
  <text x="800" y="324" text-anchor="middle" class="node-code">UI 线程 · 消息循环</text>
  <text x="800" y="354" text-anchor="middle" class="node-small">OnInitDialog · OnServerEvent · OnConsentRequest</text>
  <text x="800" y="379" text-anchor="middle" class="node-small">OnTimer · OnTrayIcon · OnBnClickedStopSharing</text>

  <rect x="622" y="414" width="356" height="44" rx="10" fill="#edf5f8" stroke="#7ea9bd" stroke-width="1.3" />
  <text x="800" y="442" text-anchor="middle" class="node-small">统一更新窗口状态、按钮状态、会话码和历史记录</text>

  <rect x="1144" y="252" width="360" height="164" rx="14" fill="#eef6f1" stroke="#7fa58b" stroke-width="1.7" />
  <text x="1324" y="292" text-anchor="middle" class="node-title">CServerSocket</text>
  <text x="1324" y="324" text-anchor="middle" class="node-code">后台 select 线程</text>
  <text x="1324" y="352" text-anchor="middle" class="node-small">Accept · HandlePacket</text>
  <text x="1324" y="376" text-anchor="middle" class="node-small">Hello 校验 · FrameRequest 响应</text>

  <rect x="1144" y="472" width="360" height="142" rx="14" fill="#f7f1e8" stroke="#b69b72" stroke-width="1.7" />
  <text x="1324" y="510" text-anchor="middle" class="node-title">ScreenCapture</text>
  <text x="1324" y="541" text-anchor="middle" class="node-code">CaptureMonitorPng()</text>
  <text x="1324" y="570" text-anchor="middle" class="node-small">按 Viewer 请求截屏并返回 PNG 帧</text>

  <rect x="96" y="472" width="360" height="142" rx="14" fill="#f7f1e8" stroke="#b69b72" stroke-width="1.7" />
  <text x="276" y="510" text-anchor="middle" class="node-title">CConsentDialog</text>
  <text x="276" y="541" text-anchor="middle" class="node-code">DoModal()</text>
  <text x="276" y="570" text-anchor="middle" class="node-small">30 秒授权倒计时，结果写回请求对象</text>

  <rect x="96" y="676" width="320" height="126" rx="14" fill="#eef2f7" stroke="#8498ac" stroke-width="1.7" />
  <text x="256" y="714" text-anchor="middle" class="node-title">NOTIFYICONDATA</text>
  <text x="256" y="744" text-anchor="middle" class="node-code">系统托盘</text>
  <text x="256" y="772" text-anchor="middle" class="node-small">右键菜单 · 双击恢复窗口</text>

  <rect x="462" y="676" width="320" height="126" rx="14" fill="#eef2f7" stroke="#8498ac" stroke-width="1.7" />
  <text x="622" y="714" text-anchor="middle" class="node-title">CSessionPolicy</text>
  <text x="622" y="744" text-anchor="middle" class="node-code">会话时限策略</text>
  <text x="622" y="772" text-anchor="middle" class="node-small">60 分钟超时 · 55 分钟可延长</text>

  <rect x="818" y="676" width="320" height="126" rx="14" fill="#eef2f7" stroke="#8498ac" stroke-width="1.7" />
  <text x="978" y="714" text-anchor="middle" class="node-title">CShareBannerWnd</text>
  <text x="978" y="744" text-anchor="middle" class="node-code">共享指示条</text>
  <text x="978" y="772" text-anchor="middle" class="node-small">ShowBanner · UpdateIndicators · HideBanner</text>

  <rect x="1184" y="676" width="320" height="126" rx="14" fill="#eef2f7" stroke="#8498ac" stroke-width="1.7" />
  <text x="1344" y="714" text-anchor="middle" class="node-title">SessionLog</text>
  <text x="1344" y="744" text-anchor="middle" class="node-code">审计日志</text>
  <text x="1344" y="772" text-anchor="middle" class="node-small">记录连接、授权、开始、结束和异常</text>

  <path d="M 456 334 L 574 334" fill="none" stroke="#5f6d78" stroke-width="2" marker-end="url(#arrow)" />
  <text x="515" y="320" text-anchor="middle" class="edge-label">创建主窗口</text>

  <path d="M 1026 334 L 1144 334" fill="none" stroke="#2f6f9f" stroke-width="2.1" marker-end="url(#arrow-blue)" />
  <text x="1085" y="320" text-anchor="middle" class="edge-label">Start(m_hWnd, code)</text>

  <path d="M 1144 380 C 1080 430 1068 476 1018 486" fill="none" stroke="#4f8068" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-green)" />
  <text x="1092" y="454" text-anchor="middle" class="edge-label">PostMessage</text>

  <path d="M 574 472 C 488 510 488 532 456 540" fill="none" stroke="#2f6f9f" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="518" y="522" text-anchor="middle" class="edge-label">OnConsentRequest</text>

  <path d="M 456 574 C 570 626 1120 628 1238 614" fill="none" stroke="#4f8068" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-green)" />
  <text x="800" y="644" text-anchor="middle" class="edge-label">SetEvent 唤醒 WaitForSingleObject</text>

  <path d="M 1324 416 L 1324 472" fill="none" stroke="#5f6d78" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1396" y="448" text-anchor="middle" class="edge-label">FrameRequest</text>

  <path d="M 708 488 L 300 676" fill="none" stroke="#5f6d78" stroke-width="2" marker-end="url(#arrow)" />
  <text x="480" y="610" text-anchor="middle" class="edge-label">托盘事件</text>

  <path d="M 754 488 L 640 676" fill="none" stroke="#5f6d78" stroke-width="2" marker-end="url(#arrow)" />
  <text x="654" y="608" text-anchor="middle" class="edge-label">OnTimer</text>

  <path d="M 846 488 L 958 676" fill="none" stroke="#5f6d78" stroke-width="2" marker-end="url(#arrow)" />
  <text x="926" y="608" text-anchor="middle" class="edge-label">共享状态</text>

  <path d="M 892 488 L 1324 676" fill="none" stroke="#5f6d78" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1132" y="610" text-anchor="middle" class="edge-label">AppendSessionLog</text>

  <circle cx="120" cy="838" r="14" fill="#2f6f9f" />
  <text x="120" y="843" text-anchor="middle" class="badge">1</text>
  <text x="144" y="843" class="node-small">蓝色实线：生命周期创建和同步调用</text>
  <circle cx="462" cy="838" r="14" fill="#4f8068" />
  <text x="462" y="843" text-anchor="middle" class="badge">2</text>
  <text x="486" y="843" class="node-small">绿色虚线：跨线程消息或事件唤醒</text>
  <circle cx="826" cy="838" r="14" fill="#5f6d78" />
  <text x="826" y="843" text-anchor="middle" class="badge">3</text>
  <text x="850" y="843" class="node-small">灰色实线：UI 协调的状态刷新和子组件操作</text>
</svg>
