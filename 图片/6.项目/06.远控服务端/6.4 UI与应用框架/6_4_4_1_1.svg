<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="348" viewBox="0 0 1180 348">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>CHostMainDlg 协调者架构</title>
  <desc>CHostMainDlg 作为事件协调者，组合 CServerSocket、CShareBannerWnd、CSessionPolicy、NOTIFYICONDATA 四个子系统</desc>
  <rect x="0" y="0" width="1180" height="348" fill="rgb(245, 244, 237)"/>

  <text x="590" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#3C3489">CHostMainDlg 协调者架构 · 成员对象组合</text>

  <!-- Coordinator -->
  <rect x="420" y="64" width="340" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="590" y="86" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">CHostMainDlg（主窗口 · 协调者）</text>
  <text x="590" y="108" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">接收事件 · 协调子系统 · 更新 UI</text>

  <!-- Child 1: CServerSocket (Blue) -->
  <rect x="20" y="210" width="240" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="140" y="234" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">CServerSocket m_server</text>
  <text x="140" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">后台 select 线程 · PostMessage 投递</text>

  <!-- Child 2: CShareBannerWnd (Teal) -->
  <rect x="320" y="210" width="240" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="440" y="234" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041">CShareBannerWnd m_banner</text>
  <text x="440" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">屏幕顶部共享指示条</text>

  <!-- Child 3: CSessionPolicy (Amber) -->
  <rect x="620" y="210" width="240" height="68" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="740" y="234" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">CSessionPolicy m_sessionPolicy</text>
  <text x="740" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">60 分钟时限 · 延长策略</text>

  <!-- Child 4: NOTIFYICONDATA (Gray) -->
  <rect x="920" y="210" width="240" height="68" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="1040" y="234" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">NOTIFYICONDATA m_trayData</text>
  <text x="1040" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">系统托盘图标数据</text>

  <!-- Arrows coordinator -> children -->
  <polyline points="440,128 440,210" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="740,128 740,210" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="460,128 460,180 140,180 140,210" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="720,128 720,180 1040,180 1040,210" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="590" y="306" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">m_server 在独立后台线程运行（仅持有窗口句柄）；其余成员均在 UI 线程内访问</text>
</svg>
