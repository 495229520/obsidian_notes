<svg xmlns="http://www.w3.org/2000/svg" width="620" height="860" viewBox="0 0 620 860">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>帧数据形态变换流水线</title>
  <desc>一帧画面从 Host 端桌面像素捕获、PNG 编码，经网络传输，到 Viewer 端解码渲染的体积与操作变化。</desc>
  <rect x="0" y="0" width="620" height="860" fill="rgb(245, 244, 237)"/>

  <!-- 区域标签 -->
  <text x="60" y="64" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">▼ Host · CServerSocket Worker 线程</text>
  <text x="60" y="448" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">▼ Viewer · CWatchDialog UI 线程</text>

  <!-- B1 桌面帧缓冲 -->
  <rect x="60" y="88" width="228" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="174" y="108" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">桌面帧缓冲 (GetDC)</text>
  <text x="174" y="126" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">8.3 MB · BGRA 原始像素</text>

  <!-- A1 -->
  <line x1="174" y1="144" x2="174" y2="214" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="172" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">BitBlt · SRCCOPY</text>
  <text x="345" y="190" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">~5-15ms · DMA 传输</text>

  <!-- B2 DIB 内存位图 -->
  <rect x="60" y="214" width="228" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="174" y="234" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">DIB 内存位图 CImage</text>
  <text x="174" y="252" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">32-bit ARGB · CreateDIBSection</text>

  <!-- A2 编码（瓶颈） -->
  <line x1="174" y1="270" x2="174" y2="340" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="298" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806">CImage::Save → PNG 编码</text>
  <text x="345" y="316" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">~30-150ms · ★ 最大瓶颈</text>

  <!-- B3 PNG 字节流 -->
  <rect x="60" y="340" width="228" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="174" y="360" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">PNG 字节流</text>
  <text x="174" y="378" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">200 KB ~ 2 MB · DEFLATE 压缩</text>

  <!-- 网络分隔虚线 -->
  <line x1="40" y1="424" x2="580" y2="424" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- A3 网络（跨网络，虚线箭头） -->
  <line x1="174" y1="396" x2="174" y2="470" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="345" y="416" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">CPacket(6) 网络传输</text>
  <text x="345" y="434" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">~10-100ms · 取决于带宽</text>

  <!-- B4 PNG 字节流（接收） -->
  <rect x="60" y="470" width="228" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="174" y="490" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">PNG 字节流 (接收)</text>
  <text x="174" y="508" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">GlobalAlloc 内存</text>

  <!-- A4 解码 -->
  <line x1="174" y1="526" x2="174" y2="596" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="554" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3C3489">CImage::Load → PNG 解码</text>
  <text x="345" y="572" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">~10-30ms</text>

  <!-- B5 HBITMAP -->
  <rect x="60" y="596" width="228" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="174" y="616" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">HBITMAP 位图</text>
  <text x="174" y="634" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">GDI+ 解码产物</text>

  <!-- A5 渲染 -->
  <line x1="174" y1="652" x2="174" y2="722" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="680" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3C3489">StretchBlt 缩放绘制</text>
  <text x="345" y="698" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">~1-5ms · COLORONCOLOR</text>

  <!-- B6 显示 -->
  <rect x="60" y="722" width="228" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="174" y="742" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">Static 控件显示</text>
  <text x="174" y="760" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">远程桌面画面</text>

  <!-- 底部注释 -->
  <text x="310" y="812" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">整链路 ≈ 50-200ms / 帧 · 配合 500ms 定时器约 1-2 FPS · PNG 压缩使带宽降至原始的约 3%</text>
</svg>
