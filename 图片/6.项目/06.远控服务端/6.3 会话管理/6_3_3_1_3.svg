<svg xmlns="http://www.w3.org/2000/svg" width="950" height="340" viewBox="0 0 950 340">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>SessionState 状态转移</title>
  <desc>会话状态从 Idle 依次经 AwaitingHello、WaitingForConsent 到 Sharing；验证失败、拒绝/超时、结束/断开/过期均通过 ResetClient 回到 Idle。</desc>
  <rect x="0" y="0" width="950" height="340" fill="rgb(245, 244, 237)"/>

  <text x="475" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#444441">SessionState 状态转移</text>

  <!-- state boxes -->
  <rect x="40" y="120" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="115" y="142" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441">Idle</text>
  <text x="115" y="161" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">无客户端连接</text>

  <rect x="250" y="120" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="142" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">AwaitingHello</text>
  <text x="340" y="161" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">等待 Hello 握手</text>

  <rect x="490" y="120" width="210" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="595" y="142" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">WaitingForConsent</text>
  <text x="595" y="161" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">RequestConsent 阻塞</text>

  <rect x="760" y="120" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="835" y="142" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">Sharing</text>
  <text x="835" y="161" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">正在共享屏幕</text>

  <!-- start arrow into Idle -->
  <path d="M115 96 L115 117" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="100" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">初始</text>

  <!-- forward transitions -->
  <path d="M190 148 L247 148" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="106" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5">accept() 新连接</text>

  <path d="M430 148 L487 148" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="106" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#854F0B">Hello 验证通过</text>

  <path d="M700 148 L757 148" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="106" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0F6E56">Approved</text>

  <!-- return transitions (ResetClient -> Idle) -->
  <polyline points="340,176 340,215 135,215 135,178" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="237" y="204" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5">验证失败 ×3 → ResetClient</text>

  <polyline points="595,176 595,250 115,250 115,178" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="239" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#854F0B">Denied / TimedOut → ResetClient</text>

  <polyline points="835,176 835,290 95,290 95,178" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="279" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0F6E56">EndSession / 断开 / 过期 → ResetClient</text>
</svg>
