<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>模块定位：组件分工与线程边界</title>
  <desc>HostMainDlg 在 UI 线程承载事件处理、CSessionPolicy、CConsentDialog；CServerSocket 在网络线程运行 SessionState 状态机，二者通过 SetEvent 协调。</desc>
  <rect x="0" y="0" width="760" height="600" fill="rgb(245, 244, 237)"/>

  <text x="380" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#444441">模块定位：组件分工与线程边界</text>

  <!-- HostMainDlg container (path, not a rect) -->
  <path d="M40 72 h680 a10 10 0 0 1 10 10 v306 a10 10 0 0 1 -10 10 h-680 a10 10 0 0 1 -10 -10 v-306 a10 10 0 0 1 10 -10 z"
        fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="52" y="92" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">HostMainDlg（UI 线程 · MFC 消息泵）</text>

  <!-- event handlers (purple leaf rect) -->
  <rect x="60" y="110" width="640" height="130" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="80" y="130" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3C3489">事件处理入口</text>
  <text x="80" y="154" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#3C3489">OnServerEvent → StartSession / StopSession</text>
  <text x="80" y="178" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#3C3489">OnConsentRequest → CConsentDialog::DoModal</text>
  <text x="80" y="202" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#3C3489">OnTimer(kTimerId) → IsExpired / ShouldPrompt</text>
  <text x="80" y="226" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#3C3489">OnBnClickedExtendSession → Extend()</text>

  <!-- CSessionPolicy (teal leaf) -->
  <rect x="60" y="300" width="290" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="205" y="324" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">CSessionPolicy</text>
  <text x="205" y="346" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">时限计算 + 流同意（无锁）</text>

  <!-- CConsentDialog (amber leaf) -->
  <rect x="410" y="300" width="290" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="555" y="324" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">CConsentDialog</text>
  <text x="555" y="346" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">30 秒倒计时弹窗</text>

  <!-- CServerSocket (blue leaf, network thread) -->
  <rect x="60" y="440" width="640" height="120" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="80" y="462" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">CServerSocket（网络线程 · select 循环）</text>
  <text x="80" y="486" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#0C447C">SessionState 状态机</text>
  <text x="80" y="510" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#0C447C">Idle → AwaitingHello → WaitingForConsent → Sharing</text>
  <text x="80" y="534" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#0C447C">RequestConsent() → WaitForSingleObject</text>

  <!-- SetEvent arrow: CConsentDialog -> CServerSocket -->
  <path d="M555 370 L555 438" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="575" y="404" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#854F0B">SetEvent</text>
</svg>
