<svg xmlns="http://www.w3.org/2000/svg" width="810" height="480" viewBox="0 0 810 480">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>用户授权机制组件职责分工</title>
  <desc>网络线程与 UI 线程的组件划分，以及 ConsentRequest 作为跨线程数据载体的所有权关系</desc>
  <rect x="0" y="0" width="810" height="480" fill="rgb(245, 244, 237)"/>

  <text x="405" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#3C3489">用户授权机制 · 组件职责分工</text>

  <!-- 线程分隔与表头 -->
  <line x1="405" y1="84" x2="405" y2="320" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="6 4"/>
  <text x="190" y="70" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">网络线程 · CServerSocket</text>
  <text x="620" y="70" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#444441">UI 线程 · HostMainDlg</text>

  <!-- RequestConsent (Blue) -->
  <rect x="40" y="100" width="300" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="190" y="122" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">CServerSocket::RequestConsent</text>
  <text x="190" y="144" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">发起方 · 构造 / 投递 / 阻塞 / 读结果</text>

  <!-- OnConsentRequest (Purple) -->
  <rect x="470" y="100" width="300" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="620" y="122" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">HostMainDlg::OnConsentRequest</text>
  <text x="620" y="144" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">编排层 · 连接请求与对话框</text>

  <!-- CConsentDialog (Teal) -->
  <rect x="470" y="240" width="300" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="620" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">CConsentDialog (模态)</text>
  <text x="620" y="284" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">纯 UI · 展示 / 倒计时 / 捕获选择</text>

  <!-- OnConsentRequest -> CConsentDialog -->
  <polyline points="620,164 620,240" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="632" y="202" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">DoModal 展示</text>

  <!-- ConsentRequest carrier (Amber) -->
  <rect x="240" y="366" width="340" height="66" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="410" y="389" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">ConsentRequest (堆对象)</text>
  <text x="410" y="411" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">跨线程数据载体 · 请求信息 + Event + result</text>

  <!-- Network thread owns carrier -->
  <polyline points="190,164 190,336 320,336 320,364" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="198" y="351" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">独占 new / delete</text>

  <!-- UI thread borrows carrier -->
  <polyline points="620,304 620,336 500,336 500,364" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="612" y="351" text-anchor="end" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">借用 · 读写字段</text>
</svg>
