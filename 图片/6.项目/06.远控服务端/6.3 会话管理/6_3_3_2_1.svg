<svg xmlns="http://www.w3.org/2000/svg" width="880" height="610" viewBox="0 0 880 610">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>模块定位：日志写入与读取数据流</title>
  <desc>HostMainDlg 在 UI 线程调用 AppendSessionLog 补全缺省字段后转交 CSessionLog::AppendEvent 写入 sessions.log；ReadRecentSessions 读取全文回填编辑框。</desc>
  <rect x="0" y="0" width="880" height="610" fill="rgb(245, 244, 237)"/>

  <text x="440" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#444441">模块定位：日志写入与读取数据流</text>

  <!-- HostMainDlg container -->
  <path d="M40 70 h800 a10 10 0 0 1 10 10 v340 a10 10 0 0 1 -10 10 h-800 a10 10 0 0 1 -10 -10 v-340 a10 10 0 0 1 10 -10 z"
        fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="56" y="90" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489">HostMainDlg（UI 线程 · 串行调用）</text>

  <!-- AppendSessionLog (purple) -->
  <rect x="55" y="108" width="470" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="75" y="130" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3C3489">AppendSessionLog(eventType, detail, helper, peerIp)</text>
  <text x="75" y="154" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489">→ 填充缺省值 m_activeHelperName / m_activePeerIp</text>

  <!-- AppendEvent (blue) -->
  <rect x="55" y="232" width="470" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="75" y="254" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">CSessionLog::AppendEvent(helper, peerIp, event, detail)</text>
  <text x="75" y="282" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">├─ GetLogPath()      → %LOCALAPPDATA%\AssistHost\</text>
  <text x="75" y="306" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">├─ EscapeField()     → 剥离 \r \n \t</text>
  <text x="75" y="330" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">├─ FormatTimestamp() → YYYY-MM-DD HH:MM:SS</text>
  <text x="75" y="354" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C">└─ CStdioFile::Write → 追加一行 TSV</text>

  <!-- ReadRecentSessions (teal) -->
  <rect x="590" y="232" width="240" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="710" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#085041">CSessionLog::</text>
  <text x="710" y="278" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041">ReadRecentSessions()</text>
  <text x="710" y="308" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">读取全文 → 回填</text>
  <text x="710" y="330" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041">IDC_EDIT_RECENT_SESSIONS</text>

  <!-- sessions.log file (amber) -->
  <rect x="300" y="480" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="440" y="500" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#633806">%LOCALAPPDATA%\AssistHost\sessions.log</text>
  <text x="440" y="520" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806">磁盘文件 · TSV</text>

  <!-- arrows -->
  <path d="M290 172 L290 230" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="201" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#534AB7">调用</text>

  <polyline points="290,384 290,455 380,455 380,478" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="444" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#185FA5">WriteString 追加 TSV</text>

  <polyline points="560,478 560,415 710,415 710,354" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="404" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0F6E56">ReadString 逐行</text>

  <text x="440" y="568" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">所有调用均在 UI 线程串行执行，CSessionLog 为全静态工具类，无需加锁。</text>
</svg>
