<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>追加写入机制：SeekToEnd 与 modeNoTruncate</title>
  <desc>CFile 以 modeWrite|modeNoTruncate 打开后写指针在偏移 0，直接写会覆盖开头；必须 SeekToEnd() 把指针移到文件末尾才能安全追加。这与 fopen("a") 的自动追加不同。</desc>
  <rect x="0" y="0" width="860" height="480" fill="rgb(245, 244, 237)"/>

  <text x="430" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#444441">追加写入机制：SeekToEnd 与 modeNoTruncate</text>

  <!-- Lane A: no SeekToEnd -->
  <text x="60" y="66" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">① modeWrite | modeNoTruncate，未 SeekToEnd（写指针停在偏移 0）</text>
  <rect x="60" y="100" width="560" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="80" y="124" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">…旧日志行1      旧日志行2      旧日志行3      （已有内容）</text>
  <path d="M80 80 L80 98" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="94" y="84" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#854F0B">写指针 @ 0</text>
  <text x="340" y="168" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#854F0B">结果：WriteString 覆盖开头旧日志（错误）</text>

  <!-- Lane B: with SeekToEnd -->
  <text x="60" y="208" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041">② 调用 SeekToEnd() 之后（写指针移到 EOF）</text>
  <rect x="60" y="240" width="560" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="80" y="264" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">…旧日志行1      旧日志行2      旧日志行3      （已有内容）</text>
  <path d="M600 220 L600 238" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="586" y="224" text-anchor="end" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">写指针 @ EOF</text>
  <text x="340" y="308" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">结果：新行安全追加到文件末尾（正确）</text>

  <!-- note bar -->
  <rect x="40" y="350" width="780" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="60" y="376" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">对比 C 标准库 fopen("a")：每次写入自动定位到 EOF；MFC CFile 打开后指针在 0，必须手动 SeekToEnd()。</text>
  <text x="60" y="402" text-anchor="start" dominant-baseline="central"
        font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441">modeCreate 单独使用等效 O_CREAT | O_TRUNC 会清空文件，必须组合 modeNoTruncate 才能实现追加。</text>
</svg>
