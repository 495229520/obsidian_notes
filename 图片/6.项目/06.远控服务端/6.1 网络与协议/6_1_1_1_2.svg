<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>select 返回后的事件处理优先级</title>
  <desc>每轮 select 返回后自上而下依次检查 m_running、select 错误、endSession 请求、listenSocket、clientSocket。</desc>
  <rect x="0" y="0" width="440" height="660" fill="rgb(245, 244, 237)"/>

  <text x="210" y="34" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">事件处理优先级（自上而下）</text>

  <g>
    <rect x="70" y="60" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="210" y="78" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">① 检查 m_running</text>
    <text x="210" y="98" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">为 false → 退出循环</text>
  </g>
  <g>
    <rect x="70" y="176" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="210" y="194" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">② 检查 select 错误</text>
    <text x="210" y="214" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">SOCKET_ERROR → 退出</text>
  </g>
  <g>
    <rect x="70" y="292" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="210" y="310" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">③ 检查 endSession 请求</text>
    <text x="210" y="330" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central">主动断开客户端</text>
  </g>
  <g>
    <rect x="70" y="408" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="210" y="426" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">④ 检查 listenSocket</text>
    <text x="210" y="446" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">accept 新连接</text>
  </g>
  <g>
    <rect x="70" y="524" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="210" y="542" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">⑤ 检查 clientSocket</text>
    <text x="210" y="562" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">接收并处理数据</text>
  </g>

  <path d="M210 116 L210 176" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M210 232 L210 292" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M210 348 L210 408" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M210 464 L210 524" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="210" y="614" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">命中任一条件即执行对应动作；①② 命中将跳出 Run() 循环</text>
</svg>
