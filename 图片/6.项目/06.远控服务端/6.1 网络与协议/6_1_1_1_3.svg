<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>SessionState 会话状态机</title>
  <desc>Idle 经 accept 进入 AwaitingHello，握手成功转 WaitingForConsent，授权后进入 Sharing；任意异常或结束会话回到 Idle。</desc>
  <rect x="0" y="0" width="960" height="290" fill="rgb(245, 244, 237)"/>

  <text x="480" y="36" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">SessionState 会话状态机</text>

  <g>
    <rect x="40" y="80" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="110" y="108" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Idle</text>
  </g>
  <g>
    <rect x="240" y="80" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="108" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">AwaitingHello</text>
  </g>
  <g>
    <rect x="500" y="80" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="610" y="108" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">WaitingForConsent</text>
  </g>
  <g>
    <rect x="780" y="80" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="850" y="108" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Sharing</text>
  </g>

  <!-- 正向迁移 -->
  <path d="M180 108 L240 108" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="66" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">accept()</text>

  <path d="M440 108 L500 108" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="66" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Hello + 正确会话码</text>

  <path d="M720 108 L780 108" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="750" y="66" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">用户允许</text>

  <!-- 回退迁移 -->
  <path d="M340 136 L340 176 L150 176 L150 136" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="192" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">拒绝 / 超时 / 错误 → reset</text>

  <path d="M850 136 L850 224 L110 224 L110 136" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="240" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">endSession / disconnect → reset</text>
</svg>
