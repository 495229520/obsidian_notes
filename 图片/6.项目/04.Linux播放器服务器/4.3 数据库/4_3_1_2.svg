<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">字段约束位图（Attr）设计</title>
  <desc id="desc">_Field_::Attr 是一个 unsigned 位图，每个常量占一个 bit；DECLARE_MYSQL_FIELD 通过按位或组合多种约束；Create() 通过按位与检查标志位。</desc>
  <rect x="0" y="0" width="1180" height="640" fill="rgb(245, 244, 237)"/>

  <defs>
    <marker id="arrowSoftGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title-text { fill: #243447; font: 700 22px "Microsoft YaHei", system-ui, sans-serif; }
      .subtitle-text { fill: #5b6773; font: 400 14px "Microsoft YaHei", system-ui, sans-serif; }
      .section-title { fill: #243447; font: 700 16px "Microsoft YaHei", system-ui, sans-serif; }
      .label { fill: #31465a; font: 600 13px "Microsoft YaHei", system-ui, sans-serif; }
      .small { fill: #5b6773; font: 400 12px "Microsoft YaHei", system-ui, sans-serif; }
      .mono { font: 600 14px "Consolas", monospace; fill: #243447; }
      .mono-small { font: 400 12px "Consolas", monospace; fill: #5b6773; }
      .bit-box-on { fill: #185FA5; stroke: #0C447C; stroke-width: 1.5; }
      .bit-box-off { fill: #ffffff; stroke: #b0aea3; stroke-width: 1.5; }
      .bit-text-on { fill: #ffffff; font: 700 14px "Consolas", monospace; }
      .bit-text-off { fill: #b0aea3; font: 400 14px "Consolas", monospace; }
      .const-card { fill: #ffffff; stroke: #c0bca8; stroke-width: 1.2; }
      .example-card { fill: #fffdf5; stroke: #d4c98e; stroke-width: 1.2; }
      .note { fill: #854F0B; font: italic 400 12px "Microsoft YaHei", system-ui, sans-serif; }
      .stroke-soft { stroke: #5F5E5A; stroke-width: 1.5; fill: none; marker-end: url(#arrowSoftGray); }
    </style>
  </defs>

  <text x="590" y="36" text-anchor="middle" class="title-text">字段约束位图（_Field_::Attr）</text>
  <text x="590" y="62" text-anchor="middle" class="subtitle-text">一个 unsigned 同时记录多种约束 · DECLARE_MYSQL_FIELD 用 | 组合 · Create() 用 &amp; 检查</text>

  <!-- ====== Section 1: bit layout ====== -->
  <text x="40" y="100" class="section-title">① 位布局：每个常量占一个 bit</text>

  <!-- Bit boxes from bit5 (left) to bit0 (right) -->
  <!-- Row positions: bits at y=120-160; values at y=170; names at y=200 -->

  <!-- bit 5: AUTOINCREMENT = 32 -->
  <rect x="60" y="120" width="80" height="50" class="bit-box-off"/>
  <text x="100" y="152" text-anchor="middle" class="bit-text-off">0</text>
  <text x="100" y="186" text-anchor="middle" class="mono-small">bit 5</text>
  <text x="100" y="204" text-anchor="middle" class="label">AUTO</text>
  <text x="100" y="222" text-anchor="middle" class="small">= 32</text>

  <!-- bit 4: CHECK = 16 -->
  <rect x="150" y="120" width="80" height="50" class="bit-box-off"/>
  <text x="190" y="152" text-anchor="middle" class="bit-text-off">0</text>
  <text x="190" y="186" text-anchor="middle" class="mono-small">bit 4</text>
  <text x="190" y="204" text-anchor="middle" class="label">CHECK</text>
  <text x="190" y="222" text-anchor="middle" class="small">= 16</text>

  <!-- bit 3: PRIMARY_KEY = 8 -->
  <rect x="240" y="120" width="80" height="50" class="bit-box-off"/>
  <text x="280" y="152" text-anchor="middle" class="bit-text-off">0</text>
  <text x="280" y="186" text-anchor="middle" class="mono-small">bit 3</text>
  <text x="280" y="204" text-anchor="middle" class="label">PK</text>
  <text x="280" y="222" text-anchor="middle" class="small">= 8</text>

  <!-- bit 2: UNIQUE = 4 -->
  <rect x="330" y="120" width="80" height="50" class="bit-box-off"/>
  <text x="370" y="152" text-anchor="middle" class="bit-text-off">0</text>
  <text x="370" y="186" text-anchor="middle" class="mono-small">bit 2</text>
  <text x="370" y="204" text-anchor="middle" class="label">UNIQUE</text>
  <text x="370" y="222" text-anchor="middle" class="small">= 4</text>

  <!-- bit 1: DEFAULT = 2 -->
  <rect x="420" y="120" width="80" height="50" class="bit-box-off"/>
  <text x="460" y="152" text-anchor="middle" class="bit-text-off">0</text>
  <text x="460" y="186" text-anchor="middle" class="mono-small">bit 1</text>
  <text x="460" y="204" text-anchor="middle" class="label">DEFAULT</text>
  <text x="460" y="222" text-anchor="middle" class="small">= 2</text>

  <!-- bit 0: NOT_NULL = 1 -->
  <rect x="510" y="120" width="80" height="50" class="bit-box-off"/>
  <text x="550" y="152" text-anchor="middle" class="bit-text-off">0</text>
  <text x="550" y="186" text-anchor="middle" class="mono-small">bit 0</text>
  <text x="550" y="204" text-anchor="middle" class="label">NOT_NULL</text>
  <text x="550" y="222" text-anchor="middle" class="small">= 1</text>

  <text x="610" y="152" class="mono">= 0  →  NONE（无约束）</text>
  <text x="610" y="172" class="small">空状态：未设置任何标志</text>

  <!-- ====== Section 2: enum definition reference ====== -->
  <rect x="780" y="100" width="370" height="160" class="const-card"/>
  <text x="800" y="124" class="section-title">enum（来源：DatabaseHelper.h）</text>
  <text x="800" y="152" class="mono">NONE          = 0</text>
  <text x="800" y="172" class="mono">NOT_NULL      = 1</text>
  <text x="800" y="192" class="mono">DEFAULT       = 2</text>
  <text x="800" y="212" class="mono">UNIQUE        = 4</text>
  <text x="980" y="152" class="mono">PRIMARY_KEY   = 8</text>
  <text x="980" y="172" class="mono">CHECK         = 16</text>
  <text x="980" y="192" class="mono">AUTOINCREMENT = 32</text>
  <text x="980" y="220" class="note">所有值为 2^n，便于按位组合</text>

  <!-- ====== Section 3: real examples ====== -->
  <text x="40" y="280" class="section-title">② 真实字段的 Attr 值（来自 EdoyunPlayerServer.h）</text>

  <!-- Example 1: user_id -->
  <rect x="40" y="300" width="540" height="100" class="example-card"/>
  <text x="60" y="324" class="label">user_id</text>
  <text x="60" y="344" class="mono-small">NOT_NULL | PRIMARY_KEY | AUTOINCREMENT</text>
  <text x="60" y="362" class="mono-small">= 1 | 8 | 32  =  41  =  0b101001</text>

  <!-- bit pattern for user_id: bits 5, 3, 0 set -->
  <rect x="340" y="370" width="32" height="22" class="bit-box-on"/>
  <text x="356" y="386" text-anchor="middle" class="bit-text-on">1</text>
  <rect x="372" y="370" width="32" height="22" class="bit-box-off"/>
  <text x="388" y="386" text-anchor="middle" class="bit-text-off">0</text>
  <rect x="404" y="370" width="32" height="22" class="bit-box-on"/>
  <text x="420" y="386" text-anchor="middle" class="bit-text-on">1</text>
  <rect x="436" y="370" width="32" height="22" class="bit-box-off"/>
  <text x="452" y="386" text-anchor="middle" class="bit-text-off">0</text>
  <rect x="468" y="370" width="32" height="22" class="bit-box-off"/>
  <text x="484" y="386" text-anchor="middle" class="bit-text-off">0</text>
  <rect x="500" y="370" width="32" height="22" class="bit-box-on"/>
  <text x="516" y="386" text-anchor="middle" class="bit-text-on">1</text>
  <text x="540" y="386" class="small">= 41</text>

  <!-- Example 2: user_age -->
  <rect x="40" y="410" width="540" height="100" class="example-card"/>
  <text x="60" y="434" class="label">user_age</text>
  <text x="60" y="454" class="mono-small">DEFAULT | CHECK</text>
  <text x="60" y="472" class="mono-small">= 2 | 16  =  18  =  0b010010</text>

  <rect x="340" y="480" width="32" height="22" class="bit-box-off"/>
  <text x="356" y="496" text-anchor="middle" class="bit-text-off">0</text>
  <rect x="372" y="480" width="32" height="22" class="bit-box-on"/>
  <text x="388" y="496" text-anchor="middle" class="bit-text-on">1</text>
  <rect x="404" y="480" width="32" height="22" class="bit-box-off"/>
  <text x="420" y="496" text-anchor="middle" class="bit-text-off">0</text>
  <rect x="436" y="480" width="32" height="22" class="bit-box-off"/>
  <text x="452" y="496" text-anchor="middle" class="bit-text-off">0</text>
  <rect x="468" y="480" width="32" height="22" class="bit-box-on"/>
  <text x="484" y="496" text-anchor="middle" class="bit-text-on">1</text>
  <rect x="500" y="480" width="32" height="22" class="bit-box-off"/>
  <text x="516" y="496" text-anchor="middle" class="bit-text-off">0</text>
  <text x="540" y="496" class="small">= 18</text>

  <!-- Example 3: user_phone -->
  <rect x="40" y="520" width="540" height="100" class="example-card"/>
  <text x="60" y="544" class="label">user_phone</text>
  <text x="60" y="564" class="mono-small">DEFAULT</text>
  <text x="60" y="582" class="mono-small">= 2  =  0b000010</text>

  <rect x="340" y="590" width="32" height="22" class="bit-box-off"/>
  <text x="356" y="606" text-anchor="middle" class="bit-text-off">0</text>
  <rect x="372" y="590" width="32" height="22" class="bit-box-off"/>
  <text x="388" y="606" text-anchor="middle" class="bit-text-off">0</text>
  <rect x="404" y="590" width="32" height="22" class="bit-box-off"/>
  <text x="420" y="606" text-anchor="middle" class="bit-text-off">0</text>
  <rect x="436" y="590" width="32" height="22" class="bit-box-off"/>
  <text x="452" y="606" text-anchor="middle" class="bit-text-off">0</text>
  <rect x="468" y="590" width="32" height="22" class="bit-box-on"/>
  <text x="484" y="606" text-anchor="middle" class="bit-text-on">1</text>
  <rect x="500" y="590" width="32" height="22" class="bit-box-off"/>
  <text x="516" y="606" text-anchor="middle" class="bit-text-off">0</text>
  <text x="540" y="606" class="small">= 2</text>

  <!-- ====== Section 4: how Create() uses the bits ====== -->
  <text x="620" y="280" class="section-title">③ Create() 用 &amp; 按位检查标志位</text>
  <rect x="620" y="300" width="530" height="320" class="const-card"/>

  <text x="640" y="328" class="mono">// _mysql_table_::Create()</text>
  <text x="640" y="350" class="mono">for (i = 0; i &lt; FieldDefine.size(); ++i) {</text>
  <text x="640" y="372" class="mono">  sql += FieldDefine[i]-&gt;Create();</text>
  <text x="640" y="396" class="mono" fill="#185FA5">  if (FieldDefine[i]-&gt;Attr &amp; PRIMARY_KEY)</text>
  <text x="640" y="416" class="mono">    sql += "PRIMARY KEY (...)";</text>
  <text x="640" y="440" class="mono" fill="#185FA5">  if (FieldDefine[i]-&gt;Attr &amp; UNIQUE)</text>
  <text x="640" y="460" class="mono">    sql += "UNIQUE INDEX ...";</text>
  <text x="640" y="480" class="mono">}</text>

  <text x="640" y="512" class="note">→ user_id.Attr (=41) &amp; PRIMARY_KEY (=8) = 8 ≠ 0</text>
  <text x="640" y="530" class="note">  → 触发，追加 PRIMARY KEY 子句</text>

  <text x="640" y="556" class="note">→ user_id.Attr (=41) &amp; UNIQUE (=4) = 0</text>
  <text x="640" y="574" class="note">  → 不触发，不追加 UNIQUE 子句</text>

  <text x="640" y="600" class="note">⚠ 同一规则适用于 _Field_::Create()：根据</text>
  <text x="640" y="616" class="note">  Attr 决定输出 NOT NULL / DEFAULT 子句。</text>
</svg>
