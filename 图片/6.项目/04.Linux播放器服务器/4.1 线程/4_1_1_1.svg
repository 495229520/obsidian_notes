<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">易播服务器线程体系架构图</title>
  <desc id="desc">展示调用者、日志模块、线程池模块、任务抽象、线程封装、本地 socket、epoll 与 worker threads 的关系。</desc>
  <rect x="0" y="0" width="1120" height="720" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="560" y="40" fill="#444441" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">易播服务器线程体系</text>
  <text x="560" y="64" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">任务被封装成对象，通过本地 socket 投递，由 epoll 唤醒 worker threads 执行</text>

  <rect x="56" y="110" width="208" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="160" y="132" fill="#0C447C" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">调用者 main()</text>
  <text x="160" y="154" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">LogTest / AddTask</text>

  <rect x="456" y="110" width="208" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="560" y="132" fill="#633806" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">日志模块</text>
  <text x="560" y="154" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">CLoggerServer</text>

  <rect x="856" y="110" width="208" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="960" y="132" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">线程池模块</text>
  <text x="960" y="154" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">CThreadPool</text>

  <rect x="56" y="252" width="208" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="160" y="274" fill="#085041" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">任务抽象层</text>
  <text x="160" y="296" fill="#085041" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">CFunctionBase / CFunction</text>

  <rect x="456" y="252" width="208" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="560" y="274" fill="#085041" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">单线程封装层</text>
  <text x="560" y="296" fill="#085041" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">CThread + pthread</text>

  <rect x="856" y="252" width="208" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="960" y="274" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">线程池管理层</text>
  <text x="960" y="296" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">Start / AddTask</text>

  <rect x="256" y="404" width="208" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="360" y="426" fill="#444441" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">任务通道</text>
  <text x="360" y="448" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">CLocalSocket</text>

  <rect x="656" y="404" width="208" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="760" y="426" fill="#444441" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">事件分发</text>
  <text x="760" y="448" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">CEpoll / epoll_wait</text>

  <rect x="152" y="558" width="208" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="256" y="580" fill="#633806" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">日志线程</text>
  <text x="256" y="602" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">ThreadFunc 写日志</text>

  <rect x="456" y="558" width="208" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="560" y="580" fill="#0C447C" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">worker threads</text>
  <text x="560" y="602" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">多个 CThread 实例</text>

  <rect x="760" y="558" width="208" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="864" y="580" fill="#0C447C" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">TaskDispatch</text>
  <text x="864" y="602" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">取任务并执行</text>

  <path d="M264 138H456" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M664 138H856" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M160 166V252" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560 166V252" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M960 166V252" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M264 280H456" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M664 280H856" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M960 308L760 404" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M160 308L360 404" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M464 432H656" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M760 460L864 558" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M856 586H664" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560 308V558" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560 308L256 558" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="120" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">Trace / LOG</text>
  <text x="760" y="120" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">复用 CThread</text>
  <text x="360" y="262" fill="#085041" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">operator()()</text>
  <text x="760" y="262" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">创建 worker</text>
  <text x="560" y="414" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">socket 变成任务队列</text>
  <text x="760" y="520" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">EPOLLIN 唤醒</text>
</svg>
