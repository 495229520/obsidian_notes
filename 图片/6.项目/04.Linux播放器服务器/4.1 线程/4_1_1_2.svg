<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">易播线程阶段关键节点图</title>
  <desc id="desc">展示主进程、网络服务、日志服务器、测试文件描述符传递、客户端处理、数据库之间的关键调用和测试关系。</desc>
  <rect x="0" y="0" width="1180" height="760" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="590" y="44" fill="#444441" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">线程阶段关键节点：进程关系与测试链路</text>
  <text x="590" y="70" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">主进程负责组织测试，日志服务和客户端处理是被验证的服务节点</text>

  <rect x="78" y="126" width="184" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="170" y="150" fill="#633806" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">主进程</text>
  <text x="170" y="176" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">main()</text>

  <rect x="78" y="314" width="184" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="170" y="338" fill="#633806" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">网络服务</text>
  <text x="170" y="364" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">连接与分发入口</text>

  <rect x="78" y="502" width="184" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="170" y="526" fill="#633806" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">主进程结束</text>
  <text x="170" y="552" fill="#633806" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">SendFD(-1)</text>

  <rect x="390" y="126" width="218" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="499" y="150" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">进程关系图</text>
  <text x="499" y="176" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">CProcess 组织</text>

  <circle cx="499" cy="348" r="66" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="499" y="336" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">日志服务器</text>
  <text x="499" y="364" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">CLoggerServer</text>

  <rect x="390" y="540" width="218" height="86" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="499" y="566" fill="#444441" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">关键理解</text>
  <text x="499" y="592" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">方块是主流程节点</text>
  <text x="499" y="612" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">圆形是服务/处理节点</text>

  <path d="M745 304H1030L988 360H745L787 332Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="888" y="332" fill="#085041" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">测试文件描述符传递</text>

  <circle cx="888" cy="508" r="66" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="888" y="496" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">客户端处理</text>
  <text x="888" y="524" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">CreateClientServer</text>

  <circle cx="888" cy="672" r="50" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="888" y="660" fill="#3C3489" font-family="system-ui,sans-serif" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">数据库</text>
  <text x="888" y="686" fill="#3C3489" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">后续业务</text>

  <path d="M170 190V314" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="252" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">调用</text>

  <path d="M170 378V502" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="440" fill="#0C447C" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">调用</text>

  <path d="M262 158H390" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M262 190H354V294H461" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <text x="354" y="244" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">测试点</text>

  <path d="M262 346H354V452H853" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <text x="354" y="402" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">测试点</text>

  <path d="M888 360V442" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>

  <path d="M888 574V622" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <text x="932" y="598" fill="#444441" font-family="system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">网络调用</text>
</svg>
