<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system,'PingFang SC','Microsoft YaHei',Segoe UI,sans-serif">
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="rgb(245, 244, 237)"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">base 只是一个「堆地址」——同进程线程间可传，跨进程即失效</text>

  <!-- process address space frame -->
  <rect x="20" y="56" width="860" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="40" y="80" font-size="13" font-weight="700" fill="#64748b">本进程虚拟地址空间</text>

  <!-- stack box -->
  <text x="130" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">栈 / 寄存器</text>
  <rect x="40" y="128" width="180" height="78" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="130" y="156" text-anchor="middle" font-size="12" font-family="ui-monospace,Consolas,monospace" fill="#0f172a">CFunctionBase* base</text>
  <line x1="56" y1="168" x2="204" y2="168" stroke="#e2e8f0"/>
  <text x="130" y="190" text-anchor="middle" font-size="13" font-family="ui-monospace,Consolas,monospace" fill="#2563eb" font-weight="700">= 0x55f3a1c0</text>

  <!-- arrow stack -> heap -->
  <line x1="220" y1="167" x2="318" y2="167" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ah2)"/>
  <text x="268" y="158" text-anchor="middle" font-size="11" fill="#2563eb">指向</text>

  <!-- heap object -->
  <text x="450" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">堆对象　new CFunction&lt;...&gt;(LogTest)</text>
  <rect x="320" y="128" width="260" height="110" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.6"/>
  <!-- row vptr -->
  <rect x="320" y="128" width="260" height="46" rx="0" fill="#fef3c7"/>
  <text x="338" y="156" font-size="12" font-family="ui-monospace,Consolas,monospace" fill="#92400e">+0</text>
  <text x="392" y="156" font-size="13" font-family="ui-monospace,Consolas,monospace" fill="#0f172a" font-weight="700">vptr</text>
  <!-- row binder -->
  <text x="338" y="200" font-size="12" font-family="ui-monospace,Consolas,monospace" fill="#92400e">+8</text>
  <text x="392" y="196" font-size="13" font-family="ui-monospace,Consolas,monospace" fill="#0f172a" font-weight="700">m_binder</text>
  <text x="392" y="216" font-size="10.5" fill="#78716c" font-family="ui-monospace,Consolas,monospace">函数指针 + 绑定参数副本</text>
  <line x1="320" y1="174" x2="580" y2="174" stroke="#fbbf24"/>

  <!-- arrow vptr -> vtable -->
  <line x1="580" y1="150" x2="666" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#ah2)"/>

  <!-- vtable -->
  <text x="772" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">CFunction&lt;...&gt; 虚表</text>
  <rect x="668" y="128" width="208" height="78" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="772" y="158" text-anchor="middle" font-size="12" font-family="ui-monospace,Consolas,monospace" fill="#065f46">operator()() 地址</text>
  <line x1="684" y1="170" x2="860" y2="170" stroke="#d1fae5"/>
  <text x="772" y="192" text-anchor="middle" font-size="11" fill="#047857">→ 调真正的 m_binder()</text>

  <!-- note inside frame -->
  <rect x="40" y="250" width="820" height="86" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="56" y="278" font-size="13" font-weight="700" fill="#be123c">⚠ base 是「虚拟地址」，不是数据本身</text>
  <text x="56" y="302" font-size="12.5" fill="#9f1239">· 同进程：可经 socket 在线程间传 base，所有线程共享同一份地址空间 → 解引用有效（见 4.1.3）</text>
  <text x="56" y="324" font-size="12.5" fill="#9f1239">· 跨进程：对方地址空间里这个数字毫无意义 → 解引用立即崩溃。只能传「数据」，不能传「指针」</text>
</svg>
