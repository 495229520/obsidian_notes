<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080px" height="720px" viewBox="0 0 1080 720" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f4f5f"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#185FA5"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#534AB7"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0F6E56"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="540" y="38" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="26" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">易播服务器 — 加密与业务模块总体架构</text>

  <!-- ========== Client Layer ========== -->
  <rect x="360" y="66" width="360" height="56" rx="12" ry="12" fill="#FFF6E8" stroke="#C27A18" stroke-width="2"/>
  <text x="540" y="86" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="18" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">客户端 HTTP GET</text>
  <text x="540" y="108" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="14" font-weight="500" font-family="Consolas, Menlo, monospace">/login?time=X&amp;salt=Y&amp;user=Z&amp;sign=W</text>

  <!-- Arrow: Client -> CServer -->
  <line x1="540" y1="122" x2="540" y2="158" stroke="#3f4f5f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <text x="558" y="143" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">TCP :9999</text>

  <!-- ========== CServer / Network Layer ========== -->
  <rect x="60" y="160" width="960" height="100" rx="16" ry="16" fill="#E8F3FF" stroke="#6c82aa" stroke-width="2"/>
  <rect x="60" y="160" width="960" height="32" rx="16" ry="16" fill="#185FA5"/>
  <rect x="60" y="176" width="960" height="16" fill="#185FA5"/>
  <text x="540" y="180" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="17" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">网络层 — CServer + CEpoll (主进程)</text>

  <text x="160" y="214" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="15" font-weight="600" font-family="Consolas, Menlo, monospace">epoll_wait()</text>
  <text x="350" y="214" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="15" font-weight="600" font-family="Consolas, Menlo, monospace">accept()</text>
  <text x="540" y="214" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="15" font-weight="600" font-family="Consolas, Menlo, monospace">Link(pClient)</text>
  <text x="750" y="214" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="15" font-weight="600" font-family="Consolas, Menlo, monospace">SendSocket(fd, addr)</text>
  <text x="540" y="244" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">监听端口 → 接受连接 → 通过 socketpair 把客户端 fd 传给子进程</text>

  <!-- Arrow: CServer -> IPC -->
  <line x1="540" y1="260" x2="540" y2="296" stroke="#534AB7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="630" y="280" fill="#534AB7" font-size="13" font-weight="600" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">Unix socketpair + SCM_RIGHTS</text>

  <!-- ========== IPC Bar ========== -->
  <rect x="160" y="298" width="760" height="30" rx="8" ry="8" fill="#EDE9FE" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="540" y="315" text-anchor="middle" dominant-baseline="middle" fill="#534AB7" font-size="14" font-weight="600" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">进程边界 — fork() 子进程 (CProcess)</text>

  <!-- Arrow: IPC -> Business -->
  <line x1="540" y1="328" x2="540" y2="358" stroke="#534AB7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- ========== Business Layer ========== -->
  <rect x="60" y="360" width="960" height="200" rx="16" ry="16" fill="#FAFAF5" stroke="#5F5E5A" stroke-width="2"/>
  <rect x="60" y="360" width="960" height="32" rx="16" ry="16" fill="#534AB7"/>
  <rect x="60" y="376" width="960" height="16" fill="#534AB7"/>
  <text x="540" y="380" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="17" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">业务层 — CEdoyunPlayerServer::BusinessProcess() (子进程)</text>

  <!-- Sub-box: HTTP Parser -->
  <rect x="80" y="404" width="280" height="140" rx="12" ry="12" fill="#E8F3FF" stroke="#6c82aa" stroke-width="1.5"/>
  <text x="220" y="428" text-anchor="middle" dominant-baseline="middle" fill="#185FA5" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">HTTP 解析与路由</text>
  <text x="220" y="456" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="14" font-weight="500" font-family="Consolas, Menlo, monospace">CHttpParser</text>
  <text x="220" y="478" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="14" font-weight="500" font-family="Consolas, Menlo, monospace">UrlParser</text>
  <text x="220" y="502" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">解析 method / url / params</text>
  <text x="220" y="522" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">按 URI 路由到 handler</text>

  <!-- Sub-box: Crypto -->
  <rect x="400" y="404" width="280" height="140" rx="12" ry="12" fill="#FFF6E8" stroke="#C27A18" stroke-width="1.5"/>
  <text x="540" y="428" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">加密校验</text>
  <text x="540" y="458" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="14" font-weight="500" font-family="Consolas, Menlo, monospace">Crypto::MD5()</text>
  <text x="540" y="482" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">OpenSSL MD5 摘要</text>
  <text x="540" y="504" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">签名 = MD5(time+KEY+pwd+salt)</text>
  <text x="540" y="526" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">比对客户端 sign 字段</text>

  <!-- Sub-box: Response -->
  <rect x="720" y="404" width="280" height="140" rx="12" ry="12" fill="#D8F0DF" stroke="#598765" stroke-width="1.5"/>
  <text x="860" y="428" text-anchor="middle" dominant-baseline="middle" fill="#244c2e" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">响应构造</text>
  <text x="860" y="458" text-anchor="middle" dominant-baseline="middle" fill="#244c2e" font-size="14" font-weight="500" font-family="Consolas, Menlo, monospace">MakeResponse()</text>
  <text x="860" y="482" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">HTTP/1.1 200 OK</text>
  <text x="860" y="504" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">JSON: {status, message}</text>
  <text x="860" y="526" text-anchor="middle" dominant-baseline="middle" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">安全头 X-Frame / Referrer</text>

  <!-- Arrows between sub-boxes -->
  <line x1="360" y1="470" x2="398" y2="470" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <line x1="680" y1="470" x2="718" y2="470" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Arrow: Business -> DB -->
  <line x1="540" y1="560" x2="540" y2="596" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="630" y="580" fill="#0F6E56" font-size="13" font-weight="600" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">查询 user_name → 取 password</text>

  <!-- ========== Database Layer ========== -->
  <rect x="260" y="598" width="560" height="56" rx="12" ry="12" fill="#D8F0DF" stroke="#0F6E56" stroke-width="2"/>
  <rect x="260" y="598" width="560" height="28" rx="12" ry="12" fill="#0F6E56"/>
  <rect x="260" y="612" width="560" height="14" fill="#0F6E56"/>
  <text x="540" y="616" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="15" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">数据库层 — CDatabaseClient / CMysqlClient</text>
  <text x="540" y="642" text-anchor="middle" dominant-baseline="middle" fill="#244c2e" font-size="14" font-weight="500" font-family="Consolas, Menlo, monospace">edoyunLogin_user_mysql → SELECT user_password WHERE user_name=?</text>

  <!-- ========== Logger Side ========== -->
  <rect x="860" y="598" width="180" height="56" rx="12" ry="12" fill="#F5F0FF" stroke="#534AB7" stroke-width="1.5"/>
  <text x="950" y="618" text-anchor="middle" dominant-baseline="middle" fill="#534AB7" font-size="15" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">日志子进程</text>
  <text x="950" y="640" text-anchor="middle" dominant-baseline="middle" fill="#534AB7" font-size="13" font-weight="500" font-family="Consolas, Menlo, monospace">CLoggerServer</text>

  <!-- Arrow: Business -> Logger -->
  <path d="M980 560 C990 575 960 590 950 596" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <text x="994" y="576" fill="#534AB7" font-size="12" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">日志</text>

  <!-- ========== Legend ========== -->
  <rect x="60" y="672" width="960" height="36" rx="8" ry="8" fill="rgb(245, 244, 237)" stroke="#c5bda8" stroke-width="1"/>
  <rect x="76" y="684" width="14" height="14" rx="3" fill="#E8F3FF" stroke="#6c82aa" stroke-width="1"/>
  <text x="98" y="693" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">网络 / 解析</text>
  <rect x="210" y="684" width="14" height="14" rx="3" fill="#FFF6E8" stroke="#C27A18" stroke-width="1"/>
  <text x="232" y="693" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">加密校验</text>
  <rect x="340" y="684" width="14" height="14" rx="3" fill="#D8F0DF" stroke="#598765" stroke-width="1"/>
  <text x="362" y="693" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">数据库 / 响应</text>
  <rect x="490" y="684" width="14" height="14" rx="3" fill="#EDE9FE" stroke="#534AB7" stroke-width="1"/>
  <text x="512" y="693" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">进程 / 日志</text>
  <line x1="620" y1="691" x2="660" y2="691" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="670" y="693" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">异步 / 旁路</text>
  <line x1="790" y1="691" x2="830" y2="691" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="842" y="693" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">同步调用</text>
</svg>
