<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080px" height="640px" viewBox="0 0 1080 640" version="1.1">
  <rect width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f4f5f"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D94A45"/>
    </marker>
    <marker id="arr-grn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0F6E56"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="540" y="36" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-size="24" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">MD5 签名校验完整流程</text>

  <!-- ========== Step 1: Client Constructs Sign ========== -->
  <rect x="40" y="64" width="480" height="180" rx="14" ry="14" fill="#FFF6E8" stroke="#C27A18" stroke-width="2"/>
  <text x="280" y="90" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="18" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">① 客户端构造签名</text>

  <text x="60" y="122" dominant-baseline="middle" fill="#2E2A23" font-size="15" font-weight="600" font-family="Consolas, Menlo, monospace">time = "1693000000"</text>
  <text x="60" y="146" dominant-baseline="middle" fill="#2E2A23" font-size="15" font-weight="600" font-family="Consolas, Menlo, monospace">salt = "random_str"</text>
  <text x="60" y="170" dominant-baseline="middle" fill="#2E2A23" font-size="15" font-weight="600" font-family="Consolas, Menlo, monospace">user = "admin"</text>
  <text x="60" y="196" dominant-baseline="middle" fill="#D94A45" font-size="15" font-weight="700" font-family="Consolas, Menlo, monospace">sign = MD5(time + KEY + pwd + salt)</text>
  <text x="60" y="224" dominant-baseline="middle" fill="#56677a" font-size="13" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">KEY 是客户端与服务端约定的硬编码密钥</text>

  <!-- ========== MD5 KEY Box ========== -->
  <rect x="560" y="64" width="480" height="80" rx="14" ry="14" fill="#FFE4E4" stroke="#D94A45" stroke-width="2"/>
  <text x="800" y="90" text-anchor="middle" dominant-baseline="middle" fill="#B22222" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">MD5_KEY（双端共享密钥）</text>
  <text x="800" y="122" text-anchor="middle" dominant-baseline="middle" fill="#B22222" font-size="13" font-weight="500" font-family="Consolas, Menlo, monospace">"*&amp;^%$#@b.v+h-b*g/h@n!h#n$d^ssx,.kl&lt;kl"</text>

  <!-- Arrow: KEY -> Client -->
  <line x1="560" y1="104" x2="522" y2="104" stroke="#D94A45" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>

  <!-- ========== Step 2: HTTP Request ========== -->
  <rect x="560" y="166" width="480" height="78" rx="14" ry="14" fill="#E8F3FF" stroke="#6c82aa" stroke-width="2"/>
  <text x="800" y="192" text-anchor="middle" dominant-baseline="middle" fill="#185FA5" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">② HTTP GET 请求</text>
  <text x="800" y="222" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="13" font-weight="500" font-family="Consolas, Menlo, monospace">GET /login?time=X&amp;salt=Y&amp;user=Z&amp;sign=W HTTP/1.1</text>

  <!-- Arrow: Client -> HTTP -->
  <line x1="520" y1="200" x2="558" y2="200" stroke="#3f4f5f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Arrow: HTTP -> Server Parse -->
  <line x1="800" y1="244" x2="800" y2="290" stroke="#3f4f5f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ========== Step 3: Server Parse ========== -->
  <rect x="40" y="292" width="1000" height="116" rx="14" ry="14" fill="#FAFAF5" stroke="#5F5E5A" stroke-width="2"/>
  <text x="540" y="318" text-anchor="middle" dominant-baseline="middle" fill="#2E2A23" font-size="18" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">③ 服务端校验流程 — CEdoyunPlayerServer::HttpParser()</text>

  <!-- Sub-steps -->
  <rect x="60" y="338" width="220" height="56" rx="10" ry="10" fill="#E8F3FF" stroke="#6c82aa" stroke-width="1.5"/>
  <text x="170" y="358" text-anchor="middle" dominant-baseline="middle" fill="#185FA5" font-size="14" font-weight="600" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">解析 URL 参数</text>
  <text x="170" y="380" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="12" font-family="Consolas, Menlo, monospace">UrlParser[time/salt/user/sign]</text>

  <line x1="280" y1="366" x2="310" y2="366" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="312" y="338" width="220" height="56" rx="10" ry="10" fill="#D8F0DF" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="422" y="358" text-anchor="middle" dominant-baseline="middle" fill="#0F6E56" font-size="14" font-weight="600" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">数据库查密码</text>
  <text x="422" y="380" text-anchor="middle" dominant-baseline="middle" fill="#244c2e" font-size="12" font-family="Consolas, Menlo, monospace">SELECT WHERE user_name=?</text>

  <line x1="532" y1="366" x2="562" y2="366" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="564" y="338" width="220" height="56" rx="10" ry="10" fill="#FFF6E8" stroke="#C27A18" stroke-width="1.5"/>
  <text x="674" y="358" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="14" font-weight="600" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">重算 MD5</text>
  <text x="674" y="380" text-anchor="middle" dominant-baseline="middle" fill="#854F0B" font-size="12" font-family="Consolas, Menlo, monospace">MD5(time+KEY+pwd+salt)</text>

  <line x1="784" y1="366" x2="814" y2="366" stroke="#3f4f5f" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="816" y="338" width="210" height="56" rx="10" ry="10" fill="#FFE4E4" stroke="#D94A45" stroke-width="1.5"/>
  <text x="921" y="358" text-anchor="middle" dominant-baseline="middle" fill="#B22222" font-size="14" font-weight="600" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">比对 sign</text>
  <text x="921" y="380" text-anchor="middle" dominant-baseline="middle" fill="#B22222" font-size="12" font-family="Consolas, Menlo, monospace">md5 == sign ? pass : fail</text>

  <!-- Arrow: KEY -> Server -->
  <path d="M800 144 C820 160 830 220 810 290" fill="none" stroke="#D94A45" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>

  <!-- ========== Step 4: Result ========== -->
  <!-- Success path -->
  <path d="M870 408 C830 440 620 450 540 468" fill="none" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arr-grn)"/>
  <path d="M970 408 C980 440 980 450 980 468" fill="none" stroke="#D94A45" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <rect x="340" y="470" width="400" height="68" rx="14" ry="14" fill="#D8F0DF" stroke="#0F6E56" stroke-width="2"/>
  <text x="540" y="496" text-anchor="middle" dominant-baseline="middle" fill="#0F6E56" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">④ 校验通过 → status: 0</text>
  <text x="540" y="522" text-anchor="middle" dominant-baseline="middle" fill="#244c2e" font-size="14" font-weight="500" font-family="Consolas, Menlo, monospace">{"status": 0, "message": ""}</text>

  <rect x="790" y="470" width="250" height="68" rx="14" ry="14" fill="#FFE4E4" stroke="#D94A45" stroke-width="2"/>
  <text x="915" y="496" text-anchor="middle" dominant-baseline="middle" fill="#B22222" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">④ 校验失败 → 错误码</text>
  <text x="915" y="522" text-anchor="middle" dominant-baseline="middle" fill="#B22222" font-size="14" font-weight="500" font-family="Consolas, Menlo, monospace">{"status": 1/2, ...}</text>

  <!-- ========== Step 5: HTTP Response ========== -->
  <line x1="540" y1="538" x2="540" y2="572" stroke="#3f4f5f" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="915" y1="538" x2="915" y2="554" stroke="#3f4f5f" stroke-width="1.5"/>
  <line x1="915" y1="554" x2="540" y2="554" stroke="#3f4f5f" stroke-width="1.5"/>

  <rect x="280" y="574" width="520" height="52" rx="12" ry="12" fill="#E8F3FF" stroke="#6c82aa" stroke-width="2"/>
  <text x="540" y="594" text-anchor="middle" dominant-baseline="middle" fill="#185FA5" font-size="16" font-weight="700" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">⑤ MakeResponse() → HTTP/1.1 200 OK + JSON body</text>
  <text x="540" y="614" text-anchor="middle" dominant-baseline="middle" fill="#324a82" font-size="13" font-weight="500" font-family="Consolas, Menlo, monospace">pClient-&gt;Send(response) → 回包给客户端</text>
</svg>
