<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a++ 与 ++a · 反汇编级求值顺序</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#444441;--muted:#5F5E5A;--faint:#8a887f;
  --line:#c9c7bf;--grid:#e2e0d7;
  --blue:#185FA5;--bluebg:#E6F1FB;      /* a++ 版 / eax */
  --green:#0F6E56;--greenbg:#E1F5EE;    /* ++a 版 */
  --brown:#854F0B;--brownbg:#FAEEDA;    /* ecx */
  --purple:#6B5E8A;--purplebg:#ECE7F2;  /* 内存 */
  --danger:#B3402F;--dangerbg:#F6E0DB;
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);--dur:420ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 40px;text-wrap:pretty;}
.wrap{max-width:1220px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.5px;}
header p{font-size:13px;color:var(--muted);margin-top:4px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.layout{display:grid;grid-template-columns:280px 1fr;gap:26px;margin-top:24px;align-items:start;}
@media(max-width:1020px){.layout{grid-template-columns:1fr;}}

/* ---------- 左：机器状态 ---------- */
.machine{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:20px;}
.machine .cap{font-size:12px;color:var(--muted);}
.regrow{display:flex;flex-direction:column;gap:8px;}
.box{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;}
.box .bn{font-family:var(--mono);font-size:13px;font-weight:700;text-align:right;}
.box .bv{font-family:var(--mono);font-size:17px;font-weight:700;border-radius:8px;padding:6px 12px;border:1px solid var(--grid);background:var(--paper);transition:all var(--dur) var(--ease);text-align:center;}
.box.eax .bn{color:var(--blue);}
.box.ecx .bn{color:var(--brown);}
.box.mem .bn{color:var(--purple);}
.box .bv.hl{animation:hlflash .8s var(--ease);}
.box.eax .bv.hl{background:var(--bluebg);border-color:var(--blue);color:var(--blue);}
.box.ecx .bv.hl{background:var(--brownbg);border-color:var(--brown);color:var(--brown);}
.box.mem .bv.hl{background:var(--purplebg);border-color:var(--purple);color:var(--purple);}
@keyframes hlflash{0%{transform:scale(1.12);}100%{transform:scale(1);}}
.divider{border-top:1px dashed var(--grid);}

/* ---------- 右 ---------- */
.right{display:flex;flex-direction:column;gap:16px;}
.asmduo{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.asmduo{grid-template-columns:1fr;}}
.asmpanel{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 16px;transition:opacity var(--dur) var(--ease);}
.asmpanel.dim{opacity:.35;}
.asmpanel .ah{font-family:var(--mono);font-size:13px;font-weight:700;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--grid);}
.asmpanel.v1 .ah{color:var(--blue);}
.asmpanel.v2 .ah{color:var(--green);}
.aline{display:grid;grid-template-columns:22px 170px 1fr;gap:6px;font-family:var(--mono);font-size:12px;padding:4px 6px;border-radius:6px;cursor:pointer;transition:all var(--dur) var(--ease);color:var(--muted);}
.aline:hover{background:var(--gray);}
.aline .no{color:var(--faint);}
.aline .cm{color:var(--faint);font-size:11px;}
.aline.done{color:var(--faint);}
.aline.now{color:var(--ink);font-weight:700;}
.v1 .aline.now{background:var(--bluebg);box-shadow:inset 2px 0 0 var(--blue);}
.v2 .aline.now{background:var(--greenbg);box-shadow:inset 2px 0 0 var(--green);}
.result{margin-top:8px;padding-top:8px;border-top:1px dashed var(--grid);font-family:var(--mono);font-size:12px;color:var(--faint);transition:all var(--dur) var(--ease);}
.result.show{color:var(--ink);font-weight:700;}
.v1 .result.show{color:var(--blue);}
.v2 .result.show{color:var(--green);}

.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:16px 20px;min-height:130px;}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.chip{font-size:11px;font-weight:500;padding:2px 10px;border-radius:999px;border:1px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cs{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.desc-body{margin-top:10px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .v1c{color:var(--blue);font-weight:600;}
.desc-body .v2c{color:var(--green);font-weight:600;}
.desc-body .d{color:var(--danger);font-weight:600;}

/* ---------- 控制条 ---------- */
.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease);}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:88px;}
.dots{display:flex;gap:7px;margin:0 auto;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>a++ 与 ++a · 反汇编级求值顺序</h1>
    <p>同一句 <code>c = b + a□□</code>，编译器排出的指令顺序完全不同（a=10, b=100）　·　<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放，点击汇编行可跳转</p>
  </header>

  <div class="layout">
    <!-- 左：机器状态 -->
    <section class="machine">
      <div>
        <div class="cap" style="margin-bottom:8px;">寄存器</div>
        <div class="regrow">
          <div class="box eax"><span class="bn">eax</span><span class="bv" id="vEax">—</span></div>
          <div class="box ecx"><span class="bn">ecx</span><span class="bv" id="vEcx">—</span></div>
        </div>
      </div>
      <div class="divider"></div>
      <div>
        <div class="cap" style="margin-bottom:8px;">内存（局部变量）</div>
        <div class="regrow">
          <div class="box mem"><span class="bn">a</span><span class="bv" id="vA">10</span></div>
          <div class="box mem"><span class="bn">b</span><span class="bv" id="vB">100</span></div>
          <div class="box mem"><span class="bn">c</span><span class="bv" id="vC">—</span></div>
        </div>
      </div>
    </section>

    <!-- 右 -->
    <section class="right">
      <div class="asmduo">
        <div class="asmpanel v1" id="pv1">
          <div class="ah">c = b + a++;　// 后置：先用旧值，最后才自增</div>
          <div id="asm1"></div>
          <div class="result" id="res1">→ c = ?　a = ?</div>
        </div>
        <div class="asmpanel v2" id="pv2">
          <div class="ah">c = b + ++a;　// 前置：先自增，再参与运算</div>
          <div id="asm2"></div>
          <div class="result" id="res2">→ c = ?　a = ?</div>
        </div>
      </div>

      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
/* ---------- 汇编列表（来自笔记 2.2 的反汇编，地址略去） ---------- */
const ASM1=[
  ['mov  eax, [b]','eax = b = 100'],
  ['add  eax, [a]','eax += a（用 a 的旧值 10）'],
  ['mov  [c], eax','c = 110，表达式已经算完'],
  ['mov  ecx, [a]','ecx = a = 10'],
  ['add  ecx, 1','ecx = 11'],
  ['mov  [a], ecx','a = 11（自增最后才补做）'],
];
const ASM2=[
  ['mov  eax, [a]','eax = a = 10'],
  ['add  eax, 1','eax = 11（第一件事就是自增）'],
  ['mov  [a], eax','a = 11，先写回内存'],
  ['mov  ecx, [b]','ecx = b = 100'],
  ['add  ecx, [a]','ecx += a（用的是新值 11）'],
  ['mov  [c], ecx','c = 111'],
];
function buildAsm(boxId,lines,stepBase){
  const box=document.getElementById(boxId);
  lines.forEach((l,i)=>{
    const div=document.createElement('div');div.className='aline';
    div.innerHTML='<span class="no">'+(i+1)+'</span><span>'+l[0]+'</span><span class="cm">; '+l[1]+'</span>';
    div.onclick=()=>{stop();go(stepBase+i);};
    box.appendChild(div);
  });
}
buildAsm('asm1',ASM1,1);   // 步骤 1-6
buildAsm('asm2',ASM2,9);   // 步骤 9-14

/* ---------- 每一步的机器快照（可随机跳转） ---------- */
/* {eax,ecx,a,b,c, hl:[变化的格子], l1:高亮的 v1 行(1起), l2:同理, dim:'v1'|'v2'|null} */
const SNAP=[
  {eax:'—',ecx:'—',a:10,b:100,c:'—',hl:[],l1:0,l2:0,dim:null},          // 0 引入
  {eax:100,ecx:'—',a:10,b:100,c:'—',hl:['eax'],l1:1,l2:0,dim:'v2'},     // 1
  {eax:110,ecx:'—',a:10,b:100,c:'—',hl:['eax'],l1:2,l2:0,dim:'v2'},     // 2
  {eax:110,ecx:'—',a:10,b:100,c:110,hl:['c'],l1:3,l2:0,dim:'v2'},       // 3
  {eax:110,ecx:10,a:10,b:100,c:110,hl:['ecx'],l1:4,l2:0,dim:'v2'},      // 4
  {eax:110,ecx:11,a:10,b:100,c:110,hl:['ecx'],l1:5,l2:0,dim:'v2'},      // 5
  {eax:110,ecx:11,a:11,b:100,c:110,hl:['a'],l1:6,l2:0,dim:'v2'},        // 6
  {eax:110,ecx:11,a:11,b:100,c:110,hl:['c','a'],l1:6,l2:0,dim:'v2',r1:1},// 7 小结
  {eax:'—',ecx:'—',a:10,b:100,c:'—',hl:['a','b','c'],l1:0,l2:0,dim:'v1',r1:1}, // 8 重置
  {eax:10,ecx:'—',a:10,b:100,c:'—',hl:['eax'],l1:0,l2:1,dim:'v1',r1:1}, // 9
  {eax:11,ecx:'—',a:10,b:100,c:'—',hl:['eax'],l1:0,l2:2,dim:'v1',r1:1}, // 10
  {eax:11,ecx:'—',a:11,b:100,c:'—',hl:['a'],l1:0,l2:3,dim:'v1',r1:1},   // 11
  {eax:11,ecx:100,a:11,b:100,c:'—',hl:['ecx'],l1:0,l2:4,dim:'v1',r1:1}, // 12
  {eax:11,ecx:111,a:11,b:100,c:'—',hl:['ecx'],l1:0,l2:5,dim:'v1',r1:1}, // 13
  {eax:11,ecx:111,a:11,b:100,c:111,hl:['c'],l1:0,l2:6,dim:'v1',r1:1},   // 14
  {eax:11,ecx:111,a:11,b:100,c:111,hl:['c'],l1:0,l2:6,dim:null,r1:1,r2:1}, // 15 对比
];
const STEPS=[
  { t:'步骤 0 · 先说结论：单独用，没区别', c:'a++; 与 ++a;', cc:'c0',
    d:'笔记 2.2 的反汇编证明：<b>单独一句</b> <code>a++;</code> 和 <code>++a;</code> 生成的指令完全相同（取 → 加 1 → 存回），<b>没有性能差异</b>。区别只出现在<b>放进表达式里</b>的时候。现在看 <code>c = b + a++</code>（左）和 <code>c = b + ++a</code>（右），a=10、b=100。' },
  { t:'步骤 1 · 取 b', c:'c = b + a++', cc:'cs',
    d:'后置版第一步：把 <code>b</code> 从内存搬进 <b class="v1c">eax</b>。注意编译器<b>根本没先碰 a 的自增</b>——它打算先把整个表达式算完。' },
  { t:'步骤 2 · 加上 a 的旧值', c:'c = b + a++', cc:'cs',
    d:'<code>add eax, [a]</code>：直接拿内存里 <b>a 的旧值 10</b> 来加，eax = 110。这就是"后置返回旧值"在指令层面的样子——<b>先用，后改</b>。' },
  { t:'步骤 3 · 表达式算完，c 已就位', c:'c = b + a++', cc:'cs',
    d:'110 写进 <code>c</code>。注意：<b>此刻 a 还是 10</b>，自增连影子都没有。表达式的值已经定了。' },
  { t:'步骤 4 · 这才开始处理自增', c:'c = b + a++', cc:'cs',
    d:'表达式落袋后，编译器才回头补做 <code>a++</code>：先把 a 取进 <b style="color:var(--brown)">ecx</b>。' },
  { t:'步骤 5 · 加 1', c:'c = b + a++', cc:'cs',
    d:'<code>add ecx, 1</code>，ecx = 11。用了另一个寄存器，和表达式的 eax 互不干扰。' },
  { t:'步骤 6 · 写回 a', c:'c = b + a++', cc:'cs',
    d:'11 写回内存的 <code>a</code>。<b>自增是整句话的最后一件事</b>。' },
  { t:'步骤 7 · 后置版小结', c:'c=110, a=11', cc:'cs',
    d:'<b class="v1c">c = b + a++ → c = 110</b>（用旧值 10 参与运算），a 事后变成 11。顺序：<b>算表达式 → 存 c → 补自增</b>。' },
  { t:'步骤 8 · 重置，换前置版', c:'a=10 b=100', cc:'c0',
    d:'把 a、b、c 恢复原状（a=10, b=100），这次执行 <code>c = b + ++a</code>，看看指令顺序有什么不同。' },
  { t:'步骤 9 · 第一步就取 a', c:'c = b + ++a', cc:'cg',
    d:'前置版开门第一件事就是把 <code>a</code> 取进 <b class="v1c">eax</b>——因为 <code>++a</code> 必须<b>先完成自增</b>，表达式才允许用它。' },
  { t:'步骤 10 · 立刻加 1', c:'c = b + ++a', cc:'cg',
    d:'<code>add eax, 1</code>，eax = 11。<b>自增排在所有运算之前</b>，和后置版的顺序正好颠倒。' },
  { t:'步骤 11 · 先写回 a', c:'c = b + ++a', cc:'cg',
    d:'新值 11 先写回内存的 <code>a</code>。此后表达式里再读 a，读到的都是新值。' },
  { t:'步骤 12 · 取 b', c:'c = b + ++a', cc:'cg',
    d:'现在才开始算加法：<code>b</code> 进 <b style="color:var(--brown)">ecx</b>。' },
  { t:'步骤 13 · 加上 a 的新值', c:'c = b + ++a', cc:'cg',
    d:'<code>add ecx, [a]</code>：从内存重新读 a，拿到的是<b>自增后的 11</b>，ecx = 111。' },
  { t:'步骤 14 · 写 c', c:'c = b + ++a', cc:'cg',
    d:'111 写进 <code>c</code>。顺序：<b>先自增 → 写回 a → 再算表达式</b>。' },
  { t:'步骤 15 · 对比与一个彩蛋', c:'110 vs 111', cc:'cd',
    d:'同样的 a、b：<b class="v1c">后置 c = 110</b>（旧值），<b class="v2c">前置 c = 111</b>（新值），a 最终都是 11。彩蛋：<code>c = b+++a</code> 会被词法分析按<b>"最长匹配"</b>切成 <code>(b++) + a</code> 而不是 <code>b + (++a)</code>——读不懂的表达式，编译器也只按规则读，<b class="d">别写这种代码</b>。' },
];

/* ---------- 渲染 ---------- */
const V={eax:document.getElementById('vEax'),ecx:document.getElementById('vEcx'),
         a:document.getElementById('vA'),b:document.getElementById('vB'),c:document.getElementById('vC')};
const pv1=document.getElementById('pv1'),pv2=document.getElementById('pv2');
const res1=document.getElementById('res1'),res2=document.getElementById('res2');
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stDesc=document.getElementById('stDesc');
const readout=document.getElementById('readout');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');
const dotsBox=document.getElementById('dots');const dotEls=[];
STEPS.forEach((s,i)=>{const d=document.createElement('button');d.className='dot';d.title=s.t;d.onclick=()=>{stop();go(i);};dotsBox.appendChild(d);dotEls.push(d);});

let cur=0;
function setVal(el,v,hl){
  const s=String(v);
  if(el.textContent!==s){el.textContent=s;}
  if(hl){el.classList.remove('hl');void el.offsetWidth;el.classList.add('hl');}
}
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const s=STEPS[cur],sn=SNAP[cur];
  setVal(V.eax,sn.eax,sn.hl.includes('eax'));
  setVal(V.ecx,sn.ecx,sn.hl.includes('ecx'));
  setVal(V.a,sn.a,sn.hl.includes('a'));
  setVal(V.b,sn.b,sn.hl.includes('b'));
  setVal(V.c,sn.c,sn.hl.includes('c'));
  pv1.classList.toggle('dim',sn.dim==='v1');
  pv2.classList.toggle('dim',sn.dim==='v2');
  document.querySelectorAll('#asm1 .aline').forEach((l,idx)=>{
    l.classList.toggle('now',idx+1===sn.l1);
    l.classList.toggle('done',idx+1<sn.l1||!!sn.r1);
  });
  document.querySelectorAll('#asm2 .aline').forEach((l,idx)=>{
    l.classList.toggle('now',idx+1===sn.l2);
    l.classList.toggle('done',idx+1<sn.l2||!!sn.r2);
  });
  res1.textContent=sn.r1?'→ c = 110（用旧值 10）　a = 11':'→ c = ?　a = ?';
  res1.classList.toggle('show',!!sn.r1);
  res2.textContent=sn.r2?'→ c = 111（用新值 11）　a = 11':'→ c = ?　a = ?';
  res2.classList.toggle('show',!!sn.r2);
  stTitle.textContent=s.t;stChip.textContent=s.c;stChip.className='chip '+s.cc;stDesc.innerHTML=s.d;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(STEPS.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===STEPS.length-1;
  if(cur===STEPS.length-1)stop();
}

/* ---------- 播放 ---------- */
let timer=null,ms=2400;
function play(){if(cur===STEPS.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<STEPS.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const m=location.hash.match(/step=(\d+)/);go(m?+m[1]:0);
</script>
</body>
</html>
