<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编译四阶段流水线 · .c → .i → .s → .o → 可执行</title>
<style>
:root {
  --paper:#F5F4ED; --panel:#FBFAF6; --ink:#444441; --muted:#5F5E5A; --faint:#8a887f;
  --line:#c9c7bf; --grid:#e2e0d7;
  --c1:#854F0B; --c1bg:#FAEEDA;      /* 预处理·棕 */
  --c2:#185FA5; --c2bg:#E6F1FB;      /* 编译·蓝 */
  --c3:#0F6E56; --c3bg:#E1F5EE;      /* 汇编·绿 */
  --c4:#8A3A52; --c4bg:#F7E9EE;      /* 链接·酒红 */
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1); --dur:420ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 40px;text-wrap:pretty;}
.wrap{max-width:1180px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.5px;}
header p{font-size:13px;color:var(--muted);margin-top:4px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}

/* ---------- 流水线条 ---------- */
.pipe{display:flex;align-items:stretch;gap:0;margin-top:24px;}
.node{
  flex:0 0 auto;min-width:96px;
  border:1px solid var(--line);border-radius:10px;
  background:var(--panel);
  padding:12px 14px;text-align:center;
  transition:all var(--dur) var(--ease);
}
.node .ext{font-family:var(--mono);font-size:16px;font-weight:700;}
.node .cn{font-size:11px;color:var(--muted);margin-top:2px;}
.node.on{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.08);}
.node.done{opacity:.9;}
.arrow{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;padding:0 6px;min-width:90px;
}
.arrow .tool{
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--faint);
  padding:2px 8px;border-radius:999px;border:1px solid transparent;
  transition:all var(--dur) var(--ease);white-space:nowrap;
}
.arrow .cmd{font-size:10px;color:var(--faint);margin-top:3px;font-family:var(--mono);opacity:.7;}
.arrow .track{width:100%;height:2px;background:var(--grid);margin-top:6px;position:relative;border-radius:2px;}
.arrow .track::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--grid);transition:border-left-color var(--dur) var(--ease);}
.arrow .fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--line);border-radius:2px;transition:width var(--dur) var(--ease);}
/* 阶段配色 */
.node.n1.lit{border-color:var(--c1);background:var(--c1bg);} .node.n1.lit .ext{color:var(--c1);}
.node.n2.lit{border-color:var(--c2);background:var(--c2bg);} .node.n2.lit .ext{color:var(--c2);}
.node.n3.lit{border-color:var(--c3);background:var(--c3bg);} .node.n3.lit .ext{color:var(--c3);}
.node.n4.lit{border-color:var(--c4);background:var(--c4bg);} .node.n4.lit .ext{color:var(--c4);}
.node.n5.lit{border-color:var(--ink);background:var(--gray);} .node.n5.lit .ext{color:var(--ink);}
.arrow.a1.on .tool{color:var(--c1);border-color:var(--c1);background:var(--c1bg);}
.arrow.a2.on .tool{color:var(--c2);border-color:var(--c2);background:var(--c2bg);}
.arrow.a3.on .tool{color:var(--c3);border-color:var(--c3);background:var(--c3bg);}
.arrow.a4.on .tool{color:var(--c4);border-color:var(--c4);background:var(--c4bg);}
.arrow.a1.on .fill{background:var(--c1);} .arrow.a1.on .track::after{border-left-color:var(--c1);}
.arrow.a2.on .fill{background:var(--c2);} .arrow.a2.on .track::after{border-left-color:var(--c2);}
.arrow.a3.on .fill{background:var(--c3);} .arrow.a3.on .track::after{border-left-color:var(--c3);}
.arrow.a4.on .fill{background:var(--c4);} .arrow.a4.on .track::after{border-left-color:var(--c4);}

/* ---------- 主体 ---------- */
.main{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;margin-top:24px;align-items:start;}
@media(max-width:900px){.main{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:16px 20px;}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.chip{font-size:11px;font-weight:500;padding:2px 10px;border-radius:999px;border:1px solid;}
.chip.p1{color:var(--c1);border-color:var(--c1);background:var(--c1bg);}
.chip.p2{color:var(--c2);border-color:var(--c2);background:var(--c2bg);}
.chip.p3{color:var(--c3);border-color:var(--c3);background:var(--c3bg);}
.chip.p4{color:var(--c4);border-color:var(--c4);background:var(--c4bg);}
.chip.p0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.gcc{font-family:var(--mono);font-size:12.5px;background:#2E2C27;color:#E3D9C6;border-radius:8px;padding:8px 14px;margin-top:12px;white-space:pre-wrap;}
.gcc .flag{color:#E3A44C;}
.desc-body{margin-top:12px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);font-weight:600;}
.desc-body ul{margin:8px 0 0 18px;}
.desc-body li{margin:3px 0;}

/* 代码变形面板 */
.code-title{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;}
.code-title .tag{font-family:var(--mono);font-weight:600;}
.codebox{
  background:#2E2C27;border-radius:10px;padding:14px 4px;
  font-family:var(--mono);font-size:12.5px;line-height:1.55;
  min-height:340px;max-height:340px;overflow:auto;
}
.cl{padding:1px 18px;white-space:pre;color:#D8D5CC;}
.cl .cmt{color:#8F8B80;}
.cl .kw{color:#E3A44C;}
.cl .str{color:#9BBF8A;}
.cl .add{color:#9BBF8A;}
.cl .und{color:#D98A7B;}
.cl.fade{animation:fadein .5s var(--ease);}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- 控制条 ---------- */
.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease);}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:88px;}
.dots{display:flex;gap:7px;margin:0 auto;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
.speed{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.speed button{font:inherit;font-size:12px;color:var(--muted);background:transparent;border:none;padding:6px 12px;cursor:pointer;}
.speed button+button{border-left:1px solid var(--line);}
.speed button.on{background:var(--ink);color:var(--paper);}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>编译四阶段流水线 · <span style="font-family:var(--mono)">.c → .i → .s → .o → 可执行</span></h1>
    <p>一段源码如何逐步变成可执行文件：预处理 → 编译 → 汇编 → 链接　·　<kbd>←</kbd> <kbd>→</kbd> 切换，<kbd>空格</kbd> 播放</p>
  </header>

  <!-- 流水线 -->
  <div class="pipe" id="pipe">
    <div class="node n1" data-node="0"><div class="ext">.c/.cpp</div><div class="cn">源代码</div></div>
    <div class="arrow a1" data-arrow="1"><div class="tool">预处理器 cpp</div><div class="cmd">gcc -E</div><div class="track"><div class="fill"></div></div></div>
    <div class="node n2" data-node="1"><div class="ext">.i</div><div class="cn">预处理文件</div></div>
    <div class="arrow a2" data-arrow="2"><div class="tool">编译器 cc1</div><div class="cmd">gcc -S</div><div class="track"><div class="fill"></div></div></div>
    <div class="node n3" data-node="2"><div class="ext">.s</div><div class="cn">汇编代码</div></div>
    <div class="arrow a3" data-arrow="3"><div class="tool">汇编器 as</div><div class="cmd">gcc -c</div><div class="track"><div class="fill"></div></div></div>
    <div class="node n4" data-node="3"><div class="ext">.o</div><div class="cn">目标文件</div></div>
    <div class="arrow a4" data-arrow="4"><div class="tool">链接器 ld</div><div class="cmd">gcc</div><div class="track"><div class="fill"></div></div></div>
    <div class="node n5" data-node="4"><div class="ext">a.out</div><div class="cn">可执行文件</div></div>
  </div>

  <div class="main">
    <section class="card">
      <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
      <div class="gcc" id="stCmd"></div>
      <div class="desc-body" id="stDesc"></div>
    </section>

    <section class="card">
      <div class="code-title"><span id="codeName"></span><span class="tag" id="codeTag"></span></div>
      <div class="codebox" id="codebox"></div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
    <div class="speed" id="speed">
      <button data-ms="3000">慢</button>
      <button data-ms="2000" class="on">中</button>
      <button data-ms="1100">快</button>
    </div>
  </div>
</div>

<script>
/* 每步：activeNode 高亮的产物节点，activeArrow 正在执行的阶段箭头 */
const STEPS = [
  { title:'步骤 0 · 源代码', chip:'起点', chipC:'p0', node:0, arrow:0,
    cmd:'$ cat main.c        # 我们手写的源码',
    codeName:'main.c', codeTag:'源代码',
    desc:'这是程序员写的原始 <b>.c/.cpp</b> 文件，包含预处理指令（<code>#include</code>、<code>#define</code>）、注释和高级语言语句。机器还完全看不懂它。',
    code:[
      ['cmt','// main.c'],
      ['kw','#include','<stdio.h>'],
      ['kw','#define',' MAX 100'],
      ['',''],
      ['cmt','// 求和函数'],
      ['','int sum(int a, int b) {'],
      ['','    return a + b;'],
      ['','}'],
      ['',''],
      ['','int main() {'],
      ['','    printf("%d\\n", sum(1, MAX));'],
      ['','    return 0;'],
      ['','}'],
    ]},
  { title:'步骤 1 · 预处理', chip:'预处理 (Preprocessing)', chipC:'p1', node:1, arrow:1,
    cmd:'$ gcc -E main.c -o main.i',
    codeName:'main.i', codeTag:'纯文本·体积变大',
    desc:'预处理器只做<b>文本替换</b>，不懂语法：<ul><li><b>头文件展开</b>：把 <code>stdio.h</code> 的上千行内容整段插进来</li><li><b>宏替换</b>：<code>MAX</code> → <code>100</code></li><li><b>删注释</b>、处理 <code>#ifdef</code> 条件编译</li></ul>产物仍是纯文本，只是膨胀了很多。',
    code:[
      ['cmt','// stdio.h 的内容被整段插入 ↓'],
      ['add','extern int printf(const char*, ...);'],
      ['add','extern int scanf(const char*, ...);'],
      ['cmt','// ……（省略上千行声明）'],
      ['',''],
      ['cmt','// 注释已删除，宏已展开'],
      ['','int sum(int a, int b) {'],
      ['','    return a + b;'],
      ['','}'],
      ['',''],
      ['','int main() {'],
      ['add','    printf("%d\\n", sum(1, 100));'],
      ['cmt','                        //  ↑ MAX 变成 100'],
      ['','    return 0;'],
      ['','}'],
    ]},
  { title:'步骤 2 · 编译', chip:'编译 (Compilation)', chipC:'p2', node:2, arrow:2,
    cmd:'$ gcc -S main.i -o main.s',
    codeName:'main.s', codeTag:'汇编·与架构相关',
    desc:'编译器把高级语言翻成<b>汇编代码</b>，内部经历<b>词法分析 → 语法分析(AST) → 语义分析(类型检查) → 优化 → 代码生成</b>。语法错误、类型错误都在这一步报出。不同 CPU 架构（x86/ARM）产出的汇编不同。',
    code:[
      ['','sum:'],
      ['','    push   %rbp'],
      ['','    mov    %rsp, %rbp'],
      ['','    mov    %edi, -4(%rbp)'],
      ['','    mov    %esi, -8(%rbp)'],
      ['','    mov    -4(%rbp), %eax'],
      ['','    add    -8(%rbp), %eax'],
      ['','    pop    %rbp'],
      ['','    ret'],
      ['',''],
      ['','main:'],
      ['','    ...'],
      ['','    call   sum'],
      ['und','    call   printf   # 地址仍未知'],
    ]},
  { title:'步骤 3 · 汇编', chip:'汇编 (Assembly)', chipC:'p3', node:3, arrow:3,
    cmd:'$ gcc -c main.s -o main.o',
    codeName:'main.o', codeTag:'二进制·可重定位目标文件',
    desc:'汇编器把汇编助记符逐条翻成<b>机器指令（二进制）</b>，产出<b>可重定位目标文件 .o</b>。此时代码<b>还不能运行</b>：像 <code>printf</code> 这种外部符号的地址尚未确定，在符号表里标为 <span style="color:#b3543f;font-weight:600">U（未定义）</span>，留待链接解析。',
    code:[
      ['cmt','// 机器码（十六进制）'],
      ['','0000: 55 48 89 e5 89 7d fc 89'],
      ['','0008: 75 f8 8b 45 fc 03 45 f8'],
      ['','0010: 5d c3 ...'],
      ['',''],
      ['cmt','// 符号表 (nm main.o)'],
      ['add','0000000000000000 T sum'],
      ['add','000000000000001a T main'],
      ['und','                 U printf   ← 未定义！'],
      ['cmt','// U = 引用了但本文件没定义'],
      ['cmt','//     等链接时去 libc 找'],
    ]},
  { title:'步骤 4 · 链接', chip:'链接 (Linking)', chipC:'p4', node:4, arrow:4,
    cmd:'$ gcc main.o -o a.out    # 背后调用 ld',
    codeName:'a.out', codeTag:'可执行文件',
    desc:'链接器 <code>ld</code> 做三件事：<ul><li><b>合并段</b>：把各 .o 的 <code>.text</code>/<code>.data</code> 拼到一起</li><li><b>符号解析</b>：在 libc 里找到 <code>printf</code> 的定义，填上 <code>U</code></li><li><b>重定位</b>：把指令里的临时地址改成最终地址</li></ul>产出可直接运行的 <b>a.out</b>。',
    code:[
      ['cmt','// 符号表 (nm a.out)'],
      ['add','0000000000401126 T sum'],
      ['add','0000000000401140 T main'],
      ['add','0000000000401030 T printf   ← 已解析！'],
      ['cmt','//  U 消失了，printf 定位到 libc'],
      ['',''],
      ['cmt','// call 指令被重定位'],
      ['und','旧:  call   ????????'],
      ['add','新:  call   0x401030   # printf'],
      ['',''],
      ['add','$ ./a.out'],
      ['add','101'],
    ]},
];

/* ---------- 渲染 ---------- */
const nodes = [...document.querySelectorAll('.node')];
const arrows = [...document.querySelectorAll('.arrow')];
const stTitle=document.getElementById('stTitle'), stChip=document.getElementById('stChip');
const stCmd=document.getElementById('stCmd'), stDesc=document.getElementById('stDesc');
const codeName=document.getElementById('codeName'), codeTag=document.getElementById('codeTag');
const codebox=document.getElementById('codebox'), readout=document.getElementById('readout');
const btnPrev=document.getElementById('btnPrev'), btnNext=document.getElementById('btnNext'), btnPlay=document.getElementById('btnPlay');

const dotsBox=document.getElementById('dots'); const dotEls=[];
STEPS.forEach((s,i)=>{const d=document.createElement('button');d.className='dot';d.title=s.title;d.onclick=()=>go(i);dotsBox.appendChild(d);dotEls.push(d);});

function hl(cls,txt){
  txt=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return cls?'<span class="'+cls+'">'+txt+'</span>':txt;
}
function fmtCmd(s){return s.replace(/(-[ESco]\b|--?\w+)/g,'<span class="flag">$1</span>');}

let cur=0;
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const s=STEPS[cur];
  nodes.forEach((n,idx)=>{
    n.classList.toggle('lit',idx===s.node);
    n.classList.toggle('on',idx===s.node);
    n.classList.toggle('done',idx<s.node);
  });
  arrows.forEach((a)=>{
    const ai=+a.dataset.arrow;
    const on=ai===s.arrow;
    a.classList.toggle('on',on);
    a.querySelector('.fill').style.width=(ai<=s.arrow?100:0)+'%';
  });
  stTitle.textContent=s.title;
  stChip.textContent=s.chip; stChip.className='chip '+s.chipC;
  stCmd.innerHTML=fmtCmd(s.cmd);
  stDesc.innerHTML=s.desc;
  codeName.textContent=s.codeName; codeTag.textContent=s.codeTag;
  codebox.innerHTML=s.code.map(([c,...rest])=>{
    const line=rest.join('');
    return '<div class="cl fade">'+hl(c,line)+'</div>';
  }).join('');
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(STEPS.length-1);
  btnPrev.disabled=cur===0; btnNext.disabled=cur===STEPS.length-1;
  if(cur===STEPS.length-1) stop();
}

let timer=null, ms=2000;
function play(){ if(cur===STEPS.length-1) go(0); btnPlay.textContent='⏸ 暂停'; timer=setInterval(()=>{cur<STEPS.length-1?go(cur+1):stop();},ms); }
function stop(){ if(timer){clearInterval(timer);timer=null;} btnPlay.textContent='▶ 播放'; }
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.getElementById('speed').onclick=e=>{const b=e.target.closest('button[data-ms]');if(!b)return;ms=+b.dataset.ms;document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('on',x===b));if(timer){stop();play();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const m=location.hash.match(/step=(\d+)/); go(m?+m[1]:0);
</script>
</body>
</html>
