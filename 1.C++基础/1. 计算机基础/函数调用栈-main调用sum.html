<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>函数调用栈动画 · main 调用 sum(10, 20)</title>
<style>
/* ============ 设计系统：与笔记 SVG 同源的暖纸色系 ============
   纸底 #F5F4ED · 墨 #444441 · esp 棕 #854F0B · ebp 蓝 #185FA5
   局部变量绿 #0F6E56 · 边框 #c9c7bf · 网格 #e2e0d7
   节奏：8px 基准间距 · 卡片圆角 10px · 动效 450ms cubic-bezier(.4,0,.2,1) */
:root {
  --paper: #F5F4ED;
  --panel: #FBFAF6;
  --ink: #444441;
  --muted: #5F5E5A;
  --faint: #8a887f;
  --line: #c9c7bf;
  --grid: #e2e0d7;
  --esp: #854F0B;
  --esp-dark: #633806;
  --esp-bg: #FAEEDA;
  --ebp: #185FA5;
  --ebp-dark: #0C447C;
  --ebp-bg: #E6F1FB;
  --grn: #0F6E56;
  --grn-dark: #085041;
  --grn-bg: #E1F5EE;
  --gray-bg: #F1EFE8;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --dur: 450ms;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); color: var(--ink); }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding: 28px 32px 40px;
  text-wrap: pretty;
}
.wrap { max-width: 1180px; margin: 0 auto; }

header h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
header p  { font-size: 13px; color: var(--muted); margin-top: 4px; }
header kbd {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 5px; background: var(--panel);
}

.layout {
  display: grid;
  grid-template-columns: 480px 1fr;
  gap: 24px;
  margin-top: 24px;
  align-items: start;
}
@media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

/* ============ 左侧：内存栈 ============ */
.stack-panel {
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: 12px;
  padding: 18px 20px 20px;
}
.stack-panel .panel-title { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.stack-panel .panel-title b { color: var(--ink); font-weight: 600; }

.stack-grid {
  display: grid;
  grid-template-columns: 58px 1fr 148px;
  column-gap: 10px;
}
.addr-col, .cells-col { display: flex; flex-direction: column; }
.addr {
  height: 56px; margin-bottom: 4px;
  display: flex; align-items: center; justify-content: flex-end;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
}
.row { height: 56px; margin-bottom: 4px; position: relative; }
.cell {
  height: 100%;
  border-radius: 8px;
  border: 1px dashed var(--line);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
  background: transparent;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
              opacity var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
              filter var(--dur) var(--ease);
}
.cell .lbl { font-size: 13px; transition: color var(--dur) var(--ease); color: var(--faint); }
.cell .off {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  white-space: nowrap; margin-left: 8px;
  transition: color var(--dur) var(--ease);
}
.cell .dead-tag {
  font-size: 11px; color: var(--faint); opacity: 0;
  transition: opacity var(--dur) var(--ease);
  margin-left: 8px; white-space: nowrap;
}

/* 固定存在的 main 帧 */
.row.kind-fixed .cell { border: 1px solid var(--muted); border-style: solid; background: var(--gray-bg); }
.row.kind-fixed .cell .lbl { color: var(--ink); }
/* 虚线占位（main 栈顶起点） */
.row.kind-mark .cell .lbl { font-size: 12px; }

/* live 状态按色系填充 */
.row.live.c-brown .cell { background: var(--esp-bg); border: 1px solid var(--esp); }
.row.live.c-brown .cell .lbl { color: var(--esp-dark); }
.row.live.c-brown .cell .off { color: var(--esp); }
.row.live.c-blue  .cell { background: var(--ebp-bg); border: 1px solid var(--ebp); }
.row.live.c-blue  .cell .lbl { color: var(--ebp-dark); }
.row.live.c-blue  .cell .off { color: var(--ebp); }
.row.live.c-green .cell { background: var(--grn-bg); border: 1px solid var(--grn); }
.row.live.c-green .cell .lbl { color: var(--grn-dark); }
.row.live.c-green .cell .off { color: var(--grn); }

/* dead 残影：数据还在内存里，但已在栈顶之外 */
.row.dead .cell { opacity: 0.42; filter: saturate(0.25); border-style: dashed; }
.row.dead.c-brown .cell { background: var(--esp-bg); border-color: var(--esp); }
.row.dead.c-brown .cell .lbl { color: var(--esp-dark); }
.row.dead.c-blue  .cell { background: var(--ebp-bg); border-color: var(--ebp); }
.row.dead.c-blue  .cell .lbl { color: var(--ebp-dark); }
.row.dead.c-green .cell { background: var(--grn-bg); border-color: var(--grn); }
.row.dead.c-green .cell .lbl { color: var(--grn-dark); }
.row.dead .cell .dead-tag { opacity: 1; }

/* 指针所指行的描边提示 */
.row.esp-here .cell { box-shadow: inset 0 0 0 2px rgba(133, 79, 11, 0.55); }
.row.ebp-here .cell { box-shadow: inset 0 0 0 2px rgba(24, 95, 165, 0.55); }
.row.esp-here.ebp-here .cell {
  box-shadow: inset 0 0 0 2px rgba(133, 79, 11, 0.55), inset 0 0 0 5px rgba(24, 95, 165, 0.45);
}

/* ============ 指针泳道 ============ */
.ptr-lane { position: relative; }
.ptr {
  position: absolute; left: 0;
  height: 30px; width: 62px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 13px; font-weight: 700; color: #fff;
  transition: top var(--dur) var(--ease);
  will-change: top;
}
.ptr::before {
  content: ""; position: absolute; left: -8px; top: 50%;
  transform: translateY(-50%);
  border: 6px solid transparent; border-left-width: 0;
}
.ptr.p-esp { background: var(--esp); }
.ptr.p-esp::before { border-right-color: var(--esp); }
.ptr.p-ebp { background: var(--ebp); left: 78px; }
.ptr.p-ebp::before { border-right-color: var(--ebp); }

.stack-note { margin-top: 12px; font-size: 12px; color: var(--faint); }

/* ============ 右侧 ============ */
.right { display: flex; flex-direction: column; gap: 16px; }

.reg-panel { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
.reg {
  flex: 1; min-width: 150px;
  border-radius: 10px; padding: 10px 16px;
  display: flex; align-items: baseline; gap: 10px;
}
.reg .name { font-family: var(--mono); font-size: 13px; font-weight: 700; }
.reg .val  { font-family: var(--mono); font-size: 20px; font-weight: 600; }
.reg .hint { font-size: 11px; margin-left: auto; }
.reg.r-esp { background: var(--esp-bg); border: 1px solid var(--esp); color: var(--esp-dark); }
.reg.r-esp .name { color: var(--esp); }
.reg.r-ebp { background: var(--ebp-bg); border: 1px solid var(--ebp); color: var(--ebp-dark); }
.reg.r-ebp .name { color: var(--ebp); }
.reg .val.bump { animation: bump 500ms var(--ease); }
@keyframes bump {
  0% { transform: scale(1); }
  35% { transform: scale(1.18); }
  100% { transform: scale(1); }
}

.desc-card {
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: 12px;
  padding: 16px 20px;
  min-height: 128px;
}
.desc-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.desc-head .step-title { font-size: 17px; font-weight: 600; font-family: var(--mono); }
.desc-head .step-title .cn { font-family: inherit; }
.phase-chip {
  font-size: 11px; font-weight: 500;
  padding: 2px 10px; border-radius: 999px;
  border: 1px solid;
}
.phase-chip.ph-gray  { background: var(--gray-bg); border-color: var(--line); color: var(--muted); }
.phase-chip.ph-brown { background: var(--esp-bg); border-color: var(--esp); color: var(--esp-dark); }
.phase-chip.ph-blue  { background: var(--ebp-bg); border-color: var(--ebp); color: var(--ebp-dark); }
.phase-chip.ph-green { background: var(--grn-bg); border-color: var(--grn); color: var(--grn-dark); }
.desc-body { margin-top: 8px; font-size: 14px; color: var(--muted); }
.desc-body b { color: var(--ink); font-weight: 600; }

/* ============ 代码面板 ============ */
.code-panel {
  background: #2E2C27;
  border-radius: 12px;
  padding: 14px 0;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.5;
  overflow-x: auto;
}
.cl {
  padding: 2px 20px;
  white-space: pre;
  color: #D8D5CC;
  border-left: 3px solid transparent;
  transition: background 300ms var(--ease), border-color 300ms var(--ease);
}
.cl .cmt { color: #8F8B80; }
.cl.sect { color: #8F8B80; }
.cl.body { color: #A6A294; }
.cl.jumpable { cursor: pointer; }
.cl.jumpable:hover { background: rgba(255, 255, 255, 0.06); }
.cl.active { background: rgba(250, 238, 218, 0.13); border-left-color: #E3A44C; }
.cl.active .cmt { color: #CDB289; }

/* ============ 控制条 ============ */
.controls {
  margin-top: 22px;
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: 12px;
  padding: 14px 20px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.btn {
  font: inherit; font-size: 13px; font-weight: 500;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 16px;
  cursor: pointer;
  transition: background 150ms var(--ease), transform 100ms var(--ease), border-color 150ms var(--ease);
}
.btn:hover:not(:disabled) { background: var(--gray-bg); border-color: var(--muted); }
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 88px; }
.btn.primary:hover:not(:disabled) { background: #2E2C27; }
.btn:focus-visible { outline: 2px solid var(--ebp); outline-offset: 2px; }

.dots { display: flex; gap: 7px; align-items: center; margin: 0 auto; }
.dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1.5px solid var(--line); background: transparent;
  cursor: pointer; padding: 0;
  transition: all 250ms var(--ease);
}
.dot:hover { border-color: var(--muted); transform: scale(1.25); }
.dot.done { background: var(--line); border-color: var(--line); }
.dot.now { background: var(--ink); border-color: var(--ink); transform: scale(1.35); }

.step-readout { font-family: var(--mono); font-size: 13px; color: var(--muted); min-width: 56px; text-align: center; }

.speed { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.speed button {
  font: inherit; font-size: 12px; color: var(--muted);
  background: transparent; border: none; padding: 6px 12px; cursor: pointer;
  transition: background 150ms var(--ease), color 150ms var(--ease);
}
.speed button + button { border-left: 1px solid var(--line); }
.speed button.on { background: var(--ink); color: var(--paper); }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>函数调用栈动画 · main 调用 sum(10, 20)</h1>
    <p>逐步观察 esp / ebp 的移动与栈帧的建立、拆除　·　<kbd>←</kbd> <kbd>→</kbd> 切换步骤，<kbd>空格</kbd> 播放/暂停，也可直接点击右下方的汇编行跳转</p>
  </header>

  <div class="layout">
    <!-- 左：内存栈 -->
    <section class="stack-panel" aria-label="内存栈布局">
      <div class="panel-title"><b>内存栈</b>（上 = 高地址，下 = 低地址，每格 4 字节）</div>
      <div class="stack-grid">
        <div class="addr-col" id="addrCol"></div>
        <div class="cells-col" id="cellsCol"></div>
        <div class="ptr-lane" id="ptrLane">
          <div class="ptr p-esp" id="ptrEsp">esp</div>
          <div class="ptr p-ebp" id="ptrEbp">ebp</div>
        </div>
      </div>
      <div class="stack-note">半透明「残影」= 数据仍留在内存中，但已位于栈顶之外，随时会被下一次 push 覆盖。</div>
    </section>

    <!-- 右：寄存器 + 讲解 + 代码 -->
    <section class="right">
      <div class="reg-panel">
        <div class="reg r-esp">
          <span class="name">esp</span><span class="val" id="regEsp">0x1000</span>
          <span class="hint">栈顶指针 · 频繁移动</span>
        </div>
        <div class="reg r-ebp">
          <span class="name">ebp</span><span class="val" id="regEbp">0x1020</span>
          <span class="hint">帧基指针 · 序言后固定</span>
        </div>
      </div>

      <div class="desc-card">
        <div class="desc-head">
          <span class="step-title" id="stepTitle"></span>
          <span class="phase-chip" id="phaseChip"></span>
        </div>
        <div class="desc-body" id="stepDesc"></div>
      </div>

      <div class="code-panel" id="codePanel" aria-label="汇编代码"></div>
    </section>
  </div>

  <!-- 控制条 -->
  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="step-readout" id="readout"></span>
    <div class="speed" id="speed">
      <button data-ms="2600">慢</button>
      <button data-ms="1700" class="on">中</button>
      <button data-ms="950">快</button>
    </div>
  </div>
</div>

<script>
/* ---------- 数据模型 ---------- */
const ROWS = [
  { addr: '0x1020', id: 'main', lbl: 'main 帧（旧 ebp 起点）', kind: 'fixed' },
  { addr: '0x1000', id: 'top0', lbl: '（main 栈顶起点）',            kind: 'mark'  },
  { addr: '0x0FFC', id: 'b',    lbl: 'b = 20',                      off: 'ebp+12', color: 'brown' },
  { addr: '0x0FF8', id: 'a',    lbl: 'a = 10',                      off: 'ebp+8',  color: 'brown' },
  { addr: '0x0FF4', id: 'ret',  lbl: '返回地址',                     off: 'ebp+4',  color: 'blue'  },
  { addr: '0x0FF0', id: 'sebp', lbl: 'saved ebp 0x1020',            off: 'ebp+0',  color: 'blue'  },
  { addr: '0x0FEC', id: 'c',    lbl: 'c = a + b',                   off: 'ebp-4',  color: 'green' },
  { addr: '0x0FE0', id: 'loc',  lbl: '……预留局部空间',                               color: 'green' },
];

/* espRow/ebpRow 为指针所指的行号；live/dead 控制单元格状态 */
const STEPS = [
  { asm: '调用前', phase: '调用前', ph: 'gray',
    esp: '0x1000', ebp: '0x1020', espRow: 1, ebpRow: 0,
    live: [], dead: [], line: null,
    desc: '执行还在 <b>main</b> 中：esp 指向 main 的栈顶 0x1000，ebp 指向 main 的帧基 0x1020。sum 的栈帧尚不存在。' },
  { asm: 'push 20', phase: 'main · 压参 + call', ph: 'brown',
    esp: '0x0FFC', ebp: '0x1020', espRow: 2, ebpRow: 0,
    live: ['b'], dead: [], line: 1,
    desc: '压入参数 <b>b = 20</b>：esp 先减 4，再把 20 写到新栈顶。参数按<b>从右往左</b>的顺序入栈（__cdecl 约定）。' },
  { asm: 'push 10', phase: 'main · 压参 + call', ph: 'brown',
    esp: '0x0FF8', ebp: '0x1020', espRow: 3, ebpRow: 0,
    live: ['b', 'a'], dead: [], line: 2,
    desc: '压入参数 <b>a = 10</b>：esp 再减 4。两个参数已就位，正好排在将来 sum 帧基的上方（高地址侧）。' },
  { asm: 'call sum', phase: 'main · 压参 + call', ph: 'brown',
    esp: '0x0FF4', ebp: '0x1020', espRow: 4, ebpRow: 0,
    live: ['b', 'a', 'ret'], dead: [], line: 3,
    desc: '<b>call</b> 一条指令做两件事：把下一条指令的地址（<b>返回地址</b>）压栈，然后跳转到 sum 入口。' },
  { asm: 'push ebp', phase: 'sum · 序言（建帧）', ph: 'blue',
    esp: '0x0FF0', ebp: '0x1020', espRow: 5, ebpRow: 0,
    live: ['b', 'a', 'ret', 'sebp'], dead: [], line: 6,
    desc: '进入 sum 的第一件事：把 main 的 ebp（0x1020）压栈<b>保存</b>——不保存的话，函数返回后 main 就找不到自己的帧基了。' },
  { asm: 'mov ebp, esp', phase: 'sum · 序言（建帧）', ph: 'blue',
    esp: '0x0FF0', ebp: '0x0FF0', espRow: 5, ebpRow: 5,
    live: ['b', 'a', 'ret', 'sebp'], dead: [], line: 7,
    desc: 'ebp 落到当前栈顶 0x0FF0，<b>新帧基确立</b>。此后整个函数体内 ebp 不再移动：ebp+8 取 a、ebp+12 取 b、ebp−4 放 c。' },
  { asm: 'sub esp, 10h', phase: 'sum · 序言（建帧）', ph: 'blue',
    esp: '0x0FE0', ebp: '0x0FF0', espRow: 7, ebpRow: 5,
    live: ['b', 'a', 'ret', 'sebp', 'c', 'loc'], dead: [], line: 8,
    desc: 'esp 下移 16 字节（10h），为局部变量<b>预留空间</b>。局部变量 c 就住在 ebp−4，函数体将在这里完成 c = a + b。' },
  { asm: 'mov esp, ebp', phase: 'sum · 尾声（拆帧）', ph: 'green',
    esp: '0x0FF0', ebp: '0x0FF0', espRow: 5, ebpRow: 5,
    live: ['b', 'a', 'ret', 'sebp'], dead: ['c', 'loc'], line: 12,
    desc: '尾声第一步：esp 直接抬回 ebp 的位置，局部变量区被<b>一次性释放</b>——数据其实还留在内存里，只是已在栈顶之外（残影）。' },
  { asm: 'pop ebp', phase: 'sum · 尾声（拆帧）', ph: 'green',
    esp: '0x0FF4', ebp: '0x1020', espRow: 4, ebpRow: 0,
    live: ['b', 'a', 'ret'], dead: ['sebp', 'c', 'loc'], line: 13,
    desc: '弹出栈顶保存的旧 ebp（0x1020）恢复给 ebp 寄存器，<b>main 的帧基还原</b>，esp 上移 4。' },
  { asm: 'ret', phase: 'sum · 尾声（拆帧）', ph: 'green',
    esp: '0x0FF8', ebp: '0x1020', espRow: 3, ebpRow: 0,
    live: ['b', 'a'], dead: ['ret', 'sebp', 'c', 'loc'], line: 14,
    desc: '<b>ret</b> 弹出返回地址交给 EIP，CPU 跳回 main 中 call 的下一条指令。sum 的栈帧至此完全拆除。' },
  { asm: 'add esp, 8', phase: 'main · 清栈', ph: 'gray',
    esp: '0x1000', ebp: '0x1020', espRow: 1, ebpRow: 0,
    live: [], dead: ['b', 'a', 'ret', 'sebp', 'c', 'loc'], line: 4,
    desc: '调用方 main 清理两个参数（__cdecl：<b>谁调用谁清理</b>）。esp 回到 0x1000——栈与调用前完全一致，一次调用闭环完成。' },
];

/* 代码面板行：step 字段 = 高亮该行的步骤号 */
const CODE = [
  { t: '; ---------------- main ----------------', cls: 'sect' },
  { t: 'push   20            ', c: '; 步骤 1  压参 b（从右往左）', step: 1 },
  { t: 'push   10            ', c: '; 步骤 2  压参 a', step: 2 },
  { t: 'call   sum           ', c: '; 步骤 3  压返回地址并跳转', step: 3 },
  { t: 'add    esp, 8        ', c: '; 步骤 10 调用方清理参数', step: 10 },
  { t: '; ---------------- sum -----------------', cls: 'sect' },
  { t: 'push   ebp           ', c: '; 步骤 4  保存旧帧基', step: 4 },
  { t: 'mov    ebp, esp      ', c: '; 步骤 5  确立新帧基', step: 5 },
  { t: 'sub    esp, 10h      ', c: '; 步骤 6  分配局部变量区', step: 6 },
  { t: 'mov    eax, [ebp+8]  ', c: '; 函数体：取 a', cls: 'body' },
  { t: 'add    eax, [ebp+12] ', c: '; 函数体：加 b', cls: 'body' },
  { t: 'mov    [ebp-4], eax  ', c: '; 函数体：存 c', cls: 'body' },
  { t: 'mov    esp, ebp      ', c: '; 步骤 7  释放局部变量区', step: 7 },
  { t: 'pop    ebp           ', c: '; 步骤 8  还原旧帧基', step: 8 },
  { t: 'ret                  ', c: '; 步骤 9  弹返回地址，回 main', step: 9 },
];

/* ---------- 构建静态 DOM ---------- */
const ROW_H = 60; /* 56px 行高 + 4px 间距 */
const addrCol = document.getElementById('addrCol');
const cellsCol = document.getElementById('cellsCol');
const rowEls = [];

ROWS.forEach(r => {
  const a = document.createElement('div');
  a.className = 'addr';
  a.textContent = r.addr;
  addrCol.appendChild(a);

  const row = document.createElement('div');
  row.className = 'row kind-' + (r.kind || 'val') + (r.color ? ' c-' + r.color : '');
  const off = r.off ? '<span class="off">' + r.off + '</span>' : '';
  row.innerHTML = '<div class="cell"><span class="lbl">' + r.lbl +
                  '<span class="dead-tag">已失效</span></span>' + off + '</div>';
  cellsCol.appendChild(row);
  rowEls.push(row);
});

const codePanel = document.getElementById('codePanel');
const codeEls = [];
CODE.forEach(l => {
  const div = document.createElement('div');
  div.className = 'cl' + (l.cls ? ' ' + l.cls : '') + (l.step ? ' jumpable' : '');
  div.innerHTML = escapeHtml(l.t) + (l.c ? '<span class="cmt">' + escapeHtml(l.c) + '</span>' : '');
  if (l.step != null) {
    div.title = '跳到步骤 ' + l.step;
    div.addEventListener('click', () => go(l.step));
  }
  codePanel.appendChild(div);
  codeEls.push({ el: div, step: l.step });
});

const dotsBox = document.getElementById('dots');
const dotEls = [];
STEPS.forEach((s, i) => {
  const d = document.createElement('button');
  d.className = 'dot';
  d.title = '步骤 ' + i + ' · ' + s.asm;
  d.setAttribute('aria-label', d.title);
  d.addEventListener('click', () => go(i));
  dotsBox.appendChild(d);
  dotEls.push(d);
});

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------- 状态更新 ---------- */
const ptrEsp = document.getElementById('ptrEsp');
const ptrEbp = document.getElementById('ptrEbp');
const regEsp = document.getElementById('regEsp');
const regEbp = document.getElementById('regEbp');
const stepTitle = document.getElementById('stepTitle');
const phaseChip = document.getElementById('phaseChip');
const stepDesc = document.getElementById('stepDesc');
const readout = document.getElementById('readout');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnPlay = document.getElementById('btnPlay');

let cur = 0;

function setReg(el, val) {
  if (el.textContent !== val) {
    el.textContent = val;
    el.classList.remove('bump');
    void el.offsetWidth; /* 重新触发动画 */
    el.classList.add('bump');
  }
}

function ptrTop(rowIdx) { return rowIdx * ROW_H + (56 - 30) / 2 + 'px'; }

function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur];

  ptrEsp.style.top = ptrTop(s.espRow);
  ptrEbp.style.top = ptrTop(s.ebpRow);

  rowEls.forEach((el, idx) => {
    const id = ROWS[idx].id;
    el.classList.toggle('live', s.live.includes(id));
    el.classList.toggle('dead', s.dead.includes(id));
    el.classList.toggle('esp-here', idx === s.espRow);
    el.classList.toggle('ebp-here', idx === s.ebpRow);
  });

  setReg(regEsp, s.esp);
  setReg(regEbp, s.ebp);

  stepTitle.innerHTML = cur === 0
    ? '<span class="cn">步骤 0 · 调用前</span>'
    : '<span class="cn">步骤 ' + cur + ' · </span>' + s.asm;
  phaseChip.textContent = s.phase;
  phaseChip.className = 'phase-chip ph-' + s.ph;
  stepDesc.innerHTML = s.desc;

  codeEls.forEach(c => c.el.classList.toggle('active', c.step != null && c.step === cur));
  dotEls.forEach((d, idx) => {
    d.classList.toggle('now', idx === cur);
    d.classList.toggle('done', idx < cur);
  });

  readout.textContent = cur + ' / ' + (STEPS.length - 1);
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === STEPS.length - 1;
  if (cur === STEPS.length - 1) stopPlay();
}

/* ---------- 播放控制 ---------- */
let timer = null;
let speedMs = 1700;

function startPlay() {
  if (cur === STEPS.length - 1) go(0); /* 播到结尾后再按播放 → 从头开始 */
  btnPlay.textContent = '⏸ 暂停';
  timer = setInterval(() => {
    if (cur < STEPS.length - 1) go(cur + 1);
    else stopPlay();
  }, speedMs);
}
function stopPlay() {
  if (timer) { clearInterval(timer); timer = null; }
  btnPlay.textContent = '▶ 播放';
}
btnPlay.addEventListener('click', () => (timer ? stopPlay() : startPlay()));
btnPrev.addEventListener('click', () => { stopPlay(); go(cur - 1); });
btnNext.addEventListener('click', () => { stopPlay(); go(cur + 1); });

document.getElementById('speed').addEventListener('click', e => {
  const b = e.target.closest('button[data-ms]');
  if (!b) return;
  speedMs = +b.dataset.ms;
  document.querySelectorAll('.speed button').forEach(x => x.classList.toggle('on', x === b));
  if (timer) { stopPlay(); startPlay(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stopPlay(); go(cur + 1); }
  else if (e.key === 'ArrowLeft') { stopPlay(); go(cur - 1); }
  else if (e.key === ' ') { e.preventDefault(); timer ? stopPlay() : startPlay(); }
});

/* 支持 #step=N 直达某一步（便于笔记内链接特定状态） */
const m = location.hash.match(/step=(\d+)/);
go(m ? +m[1] : 0);
</script>
</body>
</html>
