<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">FP32 Reduction 误差模型</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">22 FP32 correctness：并行加法顺序改变，所以用相对误差</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“8.3/8.4”或测试矩阵后</text>
<rect x="95" y="155" width="280" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="95" y="155" width="280" height="8" rx="18" fill="#059669" opacity="1"/>
<text x="115" y="189" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">CPU reference</text>
<text x="115" y="219" font-size="14" font-weight="400" fill="#334155" text-anchor="start">float 路径用 double acc</text>
<text x="115" y="240" font-size="14" font-weight="400" fill="#334155" text-anchor="start">最后 cast 回 T</text>
<text x="115" y="261" font-size="14" font-weight="400" fill="#334155" text-anchor="start">降低 reference 自身误差</text>
<rect x="490" y="155" width="280" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="490" y="155" width="280" height="8" rx="18" fill="#2563EB" opacity="1"/>
<text x="510" y="189" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">GPU reduction</text>
<text x="510" y="219" font-size="14" font-weight="400" fill="#334155" text-anchor="start">block 内树形/warp 顺序</text>
<text x="510" y="240" font-size="14" font-weight="400" fill="#334155" text-anchor="start">加法不满足浮点结合律</text>
<text x="510" y="261" font-size="14" font-weight="400" fill="#334155" text-anchor="start">结果允许微小舍入差</text>
<rect x="885" y="155" width="280" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="885" y="155" width="280" height="8" rx="18" fill="#F59E0B" opacity="1"/>
<text x="905" y="189" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">check_result</text>
<text x="905" y="219" font-size="14" font-weight="400" fill="#334155" text-anchor="start">denom=max(abs(cpu),1e-6)</text>
<text x="905" y="240" font-size="14" font-weight="400" fill="#334155" text-anchor="start">rel_err=abs(gpu-cpu)/denom</text>
<text x="905" y="261" font-size="14" font-weight="400" fill="#334155" text-anchor="start">阈值：1e-3</text>
<line x1="375" y1="230" x2="490" y2="230" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="770" y1="230" x2="885" y2="230" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="160" y="430" width="960" height="150" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<text x="200" y="470" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start">核心判断</text>
<text x="200" y="505" font-size="16" font-weight="400" fill="#334155" text-anchor="start">int：不溢出时加法精确，必须 gpu_result == cpu_result。</text>
<text x="200" y="533" font-size="16" font-weight="400" fill="#334155" text-anchor="start">float：不同归约顺序会导致舍入差异，用 rel_err &lt; 1e-3 判断是否正确。</text>
<text x="200" y="561" font-size="16" font-weight="400" fill="#334155" text-anchor="start">denom 守卫用于 cpu_result 接近 0 时避免除零或异常放大。</text>
</svg>
