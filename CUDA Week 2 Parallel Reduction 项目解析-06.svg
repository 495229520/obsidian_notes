<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Makefile 命令入口图</title>
<desc id="desc">CUDA Week 2 Parallel Reduction note diagram</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EFF6FF"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
  </marker>
  <style><![CDATA[
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .small { font-size: 14px; fill: #64748B; }
    .label { font-size: 15px; fill: #334155; font-weight: 600; }
    .title { font-size: 30px; fill: #0F172A; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #64748B; }
    .caption { font-size: 13px; fill: #64748B; }
  ]]></style>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
<text x="50" y="50" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">06 Makefile 命令入口图</text>
<text x="52" y="78" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">放在“4. Makefile：命令入口”中，说明常用命令背后的依赖链</text>
<rect x="170" y="300" width="220" height="105" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="170" y="300" width="220" height="8" rx="18" fill="#2563EB" opacity="1"/>
<text x="190" y="334" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">configure</text>
<text x="190" y="364" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cmake -S . -B build</text>
<text x="190" y="385" font-size="14" font-weight="400" fill="#334155" text-anchor="start">-DCMAKE_CUDA_ARCHITECTURES=75</text>
<rect x="455" y="300" width="220" height="105" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="455" y="300" width="220" height="8" rx="18" fill="#7C3AED" opacity="1"/>
<text x="475" y="334" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">build</text>
<text x="475" y="364" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cmake --build build</text>
<rect x="740" y="155" width="220" height="105" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="740" y="155" width="220" height="8" rx="18" fill="#059669" opacity="1"/>
<text x="760" y="189" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">test</text>
<text x="760" y="219" font-size="14" font-weight="400" fill="#334155" text-anchor="start">三份 correctness test</text>
<rect x="740" y="300" width="220" height="105" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="740" y="300" width="220" height="8" rx="18" fill="#F59E0B" opacity="1"/>
<text x="760" y="334" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">bench</text>
<text x="760" y="364" font-size="14" font-weight="400" fill="#334155" text-anchor="start">./build/bench_reduce</text>
<rect x="740" y="445" width="220" height="105" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="740" y="445" width="220" height="8" rx="18" fill="#DC2626" opacity="1"/>
<text x="760" y="479" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">profile-*</text>
<text x="760" y="509" font-size="14" font-weight="400" fill="#334155" text-anchor="start">ncu --set full ./test_reduce_*</text>
<line x1="390" y1="352" x2="455" y2="352" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
<line x1="675" y1="352" x2="740" y2="207" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="675" y1="352" x2="740" y2="352" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="675" y1="352" x2="740" y2="497" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1000" y="275" width="210" height="135" rx="18" fill="white" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" opacity="1"/>
<rect x="1000" y="275" width="210" height="8" rx="18" fill="#334155" opacity="1"/>
<text x="1020" y="309" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start">clean</text>
<text x="1020" y="339" font-size="14" font-weight="400" fill="#334155" text-anchor="start">rm -rf build</text>
<text x="1020" y="360" font-size="14" font-weight="400" fill="#334155" text-anchor="start">清理构建产物</text>
<text x="1020" y="381" font-size="14" font-weight="400" fill="#334155" text-anchor="start">不删除源码/数据</text>
<rect x="165" y="185" width="270" height="34" rx="17.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" opacity="1"/>
<text x="300.0" y="207.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">CUDA_ARCH ?= 75，可用 make build CUDA_ARCH=86 覆盖</text>
<rect x="710" y="600" width="430" height="34" rx="17.0" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" opacity="1"/>
<text x="925.0" y="622.0" font-size="13" font-weight="700" fill="#DC2626" text-anchor="middle">profile 使用 test 程序入口：更聚焦单个 kernel，但不要和 benchmark 时间混用</text>
</svg>
