<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拥塞控制动画 · 慢启动 / 拥塞避免 / 快重传快恢复 / cwnd 曲线</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#3E3D39;--muted:#5F5E5A;--faint:#8a887f;
  --line:#c9c7bf;--grid:#e2e0d7;
  --blue:#185FA5;--bluebg:#E6F1FB;
  --green:#0F6E56;--greenbg:#E1F5EE;
  --brown:#9A5B0E;--brownbg:#FAEEDA;
  --danger:#B3402F;--dangerbg:#F6E0DB;
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 44px;text-wrap:pretty;}
.wrap{max-width:1180px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.4px;}
header p{font-size:13px;color:var(--muted);margin-top:5px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
.tab{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 17px;cursor:pointer;transition:all .18s var(--ease);display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
.tab:hover{border-color:var(--muted);transform:translateY(-1px);}
.tab .t{font-weight:600;color:var(--ink);}
.tab .s{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 10px rgba(62,61,57,.18);}
.tab.on .t,.tab.on .s{color:var(--paper);}
.tab.on .s{opacity:.75;}

.layout{display:grid;grid-template-columns:626px 1fr;gap:26px;margin-top:22px;align-items:start;}
@media(max-width:1080px){.layout{grid-template-columns:1fr;}}
.viz{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:22px;min-height:452px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.viz .vcap{font-size:12px;color:var(--muted);margin-bottom:14px;}
.viz .vcap b{color:var(--ink);}
@keyframes pop{0%{transform:scale(.7);}70%{transform:scale(1.14);}100%{transform:scale(1);}}

/* ===== 柱状图（场景 1 / 2 共用） ===== */
.bc-wrap{position:relative;width:500px;margin:6px auto 0;}
.bc-area{position:relative;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);display:flex;align-items:flex-end;justify-content:space-around;padding:0 14px;}
.bc-bar{width:64px;background:var(--blue);border-radius:6px 6px 0 0;height:0;position:relative;transition:height var(--dur) var(--ease),background var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.bc-bar.avoid{background:var(--green);}
.bc-bar.limit{box-shadow:0 0 0 3px rgba(154,91,14,.28);}
.bc-val{position:absolute;top:-22px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);opacity:1;transition:opacity var(--dur) var(--ease);}
.bc-val.off{opacity:0;}
.bc-thresh{position:absolute;left:0;right:0;border-top:2px dashed var(--brown);transition:bottom var(--dur) var(--ease);pointer-events:none;}
.bc-thresh span{position:absolute;right:2px;top:-20px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brown);}
.bc-x{display:flex;justify-content:space-around;padding:0 14px;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px;}
.bc-x span{width:64px;text-align:center;}
.bc-formula{text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:18px;}
.bc-formula b{color:var(--green);}

/* 在途报文段小视图（场景 1） */
.fl-strip{margin-top:20px;display:flex;flex-direction:column;gap:8px;align-items:center;}
.fl-row{display:flex;align-items:center;gap:6px;min-height:24px;}
.fl-tag{font-family:var(--mono);font-size:11px;color:var(--faint);width:88px;text-align:right;margin-right:4px;}
.fl-chip{width:26px;height:22px;border-radius:5px;border:1.5px solid var(--blue);background:var(--bluebg);color:var(--blue);font-family:var(--mono);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(8px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);}
.fl-chip.ack{border-color:var(--green);background:var(--greenbg);color:var(--green);}
.fl-chip.show{opacity:1;transform:none;}
.op-note{text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:auto;padding-top:12px;}
.op-note b{color:var(--ink);}

/* ===== 场景 3：双生命线 ===== */
.rc-stage{display:flex;gap:14px;flex:1;margin-top:4px;}
.rc-side{width:150px;display:flex;flex-direction:column;gap:10px;align-items:center;}
.rc-title{font-weight:600;font-size:13.5px;}
.rc-panel{width:100%;border:1.5px solid var(--grid);border-radius:10px;padding:8px 10px;font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px;background:var(--paper);transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);}
.rc-panel .pt{font-size:10.5px;font-weight:700;color:var(--faint);transition:color var(--dur) var(--ease);}
.rc-panel .row{display:flex;justify-content:space-between;gap:6px;}
.rc-panel b{color:var(--ink);display:inline-block;transition:color var(--dur) var(--ease);}
.rc-panel.caseB{border-color:var(--danger);background:var(--dangerbg);}
.rc-panel.caseB .pt{color:var(--danger);}
.rc-panel.caseB b{color:var(--danger);}
.flash{animation:pop .5s var(--ease);}
.rc-cnt{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--muted);border:1.5px solid var(--line);background:var(--gray);border-radius:999px;padding:3px 12px;transition:all var(--dur) var(--ease);}
.rc-cnt.hot{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);box-shadow:0 0 0 3px rgba(179,64,47,.2);}
.rc-chan{flex:1;position:relative;border-left:1.5px dashed var(--line);border-right:1.5px dashed var(--line);min-height:330px;}
.rc-chan.dim .rc-chip{opacity:.15;}
.rc-chip{position:absolute;left:2%;font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;border:1.5px solid var(--blue);background:var(--blue);color:#fff;white-space:nowrap;opacity:0;box-shadow:0 2px 6px rgba(60,55,40,.1);transition:left var(--dur) var(--ease),opacity 380ms var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.rc-chip.show{opacity:1;}
.rc-chip.ackc{border-color:var(--green);background:var(--greenbg);color:var(--green);}
.rc-chip.lost{background:var(--dangerbg);border-color:var(--danger);color:var(--danger);border-style:dashed;}
.rc-chip.retx{background:var(--brown);border-color:var(--brown);box-shadow:0 0 0 3px rgba(154,91,14,.3);}
.rc-rto{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:var(--danger);background:var(--dangerbg);border:1.5px solid var(--danger);border-radius:9px;padding:6px 14px;opacity:0;transition:opacity var(--dur) var(--ease);white-space:nowrap;z-index:2;}
.rc-rto.on{opacity:1;}
.rc-slots{display:flex;gap:4px;}
.rc-slot{width:22px;height:26px;border:1.5px solid var(--line);border-radius:5px;background:var(--gray);color:var(--faint);font-family:var(--mono);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all var(--dur) var(--ease);}
.rc-slot.got{background:var(--greenbg);border-color:var(--green);color:var(--green);}
.rc-slot.miss{background:var(--dangerbg);border-color:var(--danger);color:var(--danger);border-style:dashed;}
.rc-slot.re{background:var(--brownbg);border-color:var(--brown);color:var(--brown);}
.rc-wait{font-size:11px;font-family:var(--mono);color:var(--muted);text-align:center;min-height:34px;padding:0 4px;}
.rc-cmp{display:flex;gap:10px;margin-top:12px;opacity:0;transition:opacity var(--dur) var(--ease);}
.rc-cmp.on{opacity:1;}
.rc-cmp .box{flex:1;border:1.5px solid;border-radius:10px;padding:7px 11px;font-size:11px;line-height:1.55;}
.rc-cmp .box b{font-size:11.5px;}
.rc-cmp .bad{border-color:var(--danger);background:var(--dangerbg);color:var(--danger);}
.rc-cmp .ok{border-color:var(--green);background:var(--greenbg);color:var(--green);}

/* ===== 场景 4：完整曲线 ===== */
.cv-svg{width:100%;max-width:560px;margin:0 auto;display:block;overflow:visible;}
.cv-axis{stroke:var(--line);stroke-width:1.5;}
.cv-grid{stroke:var(--grid);stroke-width:1;}
.cv-ylbl,.cv-xlbl{font-family:var(--mono);font-size:9.5px;fill:var(--faint);}
.cv-band rect{transition:opacity var(--dur) var(--ease);opacity:0;}
.cv-band text{font-family:var(--mono);font-size:10px;fill:var(--muted);text-anchor:middle;transition:opacity var(--dur) var(--ease);opacity:0;}
.cv-band.on rect,.cv-band.on text{opacity:1;}
.cv-evt line{stroke:var(--danger);stroke-width:2;}
.cv-evt.big line{stroke-width:4;}
.cv-evt text{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--danger);text-anchor:middle;}
.cv-evt{opacity:0;transition:opacity var(--dur) var(--ease);}
.cv-evt.on{opacity:1;}
#cvSSg{transition:transform var(--dur) var(--ease);}
#cvSSg line{stroke:var(--brown);stroke-width:2;stroke-dasharray:6 5;}
#cvSSg text{font-family:var(--mono);font-size:10.5px;font-weight:700;fill:var(--brown);}
#cvPath{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease);}
#cvDot{fill:var(--blue);stroke:#FBFAF6;stroke-width:2;transition:transform var(--dur) var(--ease);}
.cv-stat{text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:14px;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;}
.cv-stat b{color:var(--ink);font-size:15px;display:inline-block;}

/* 右侧 */
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:18px 20px;min-height:196px;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.act{margin-top:14px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:9px 13px;border-radius:9px;}
.chip{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;border:1px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cb{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.desc-body{margin-top:10px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .bl{color:var(--blue);font-weight:600;}
.desc-body .gr{color:var(--green);font-weight:600;}
.desc-body .dg{color:var(--danger);font-weight:600;}
.codebox{background:#2E2C27;border-radius:11px;padding:12px 0;font-family:var(--mono);font-size:12px;line-height:1.65;color:#D8D5CC;white-space:pre;overflow-x:auto;box-shadow:0 2px 8px rgba(46,44,39,.18);}
.codebox .cmt{color:#8F8B80;} .codebox .kw{color:#E3A44C;}
.codebox .cl{padding:2px 17px;transition:background .3s var(--ease),color .3s var(--ease);}
.codebox .cl.hl{background:rgba(52,122,198,.52);box-shadow:inset 4px 0 0 #82B4E8;color:#F7F4EA;}
.codebox .cl.hl .cmt{color:#CCC8BA;}

.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:92px;}
.dots{display:flex;gap:7px;margin:0 auto;flex-wrap:wrap;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>拥塞控制动画 · 慢启动 / 拥塞避免 / 快重传快恢复 / cwnd 曲线</h1>
    <p>配套笔记《8.10 拥塞控制》 · 别把网络压垮：cwnd 随 ACK 与丢包信号动态伸缩　·　上方切场景，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <section class="viz" id="viz"></section>
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="act" id="stAct"></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
      <div class="codebox" id="codeBox"></div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
const viz=document.getElementById('viz');
const el=id=>document.getElementById(id);
const codeOf=lines=>lines.map(l=>'<div class="cl">'+l+'</div>').join('');
function setV(id,txt){const e=el(id);if(e.textContent!==txt){e.textContent=txt;e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');}}

/* 四个场景共用同一份「教学版规则总结」伪代码（笔记 8.10），按步骤高亮当前分支 */
const CODE=codeOf([
'<span class="kw">if</span> (timeout) {                     <span class="cmt">// 超时:整条路堵死</span>',
'    ssthresh = max(cwnd/2, 2*MSS);',
'    cwnd  = 1 * MSS;                <span class="cmt">// 打回起点</span>',
'    state = SLOW_START;             <span class="cmt">// 重回慢启动</span>',
'} <span class="kw">else if</span> (dup_ack == 3) {        <span class="cmt">// 3 个重复 ACK</span>',
'    retransmit_lost_segment();      <span class="cmt">// 快重传:不等 RTO</span>',
'    ssthresh = max(cwnd/2, 2*MSS);',
'    cwnd  = ssthresh;               <span class="cmt">// 快恢复(教学简化)</span>',
'    state = CONGESTION_AVOIDANCE;',
'} <span class="kw">else if</span> (state == SLOW_START) {',
'    grow_cwnd_exponentially();      <span class="cmt">// ≈ 每 RTT 翻倍</span>',
'} <span class="kw">else if</span> (state == CONGESTION_AVOIDANCE) {',
'    grow_cwnd_linearly();           <span class="cmt">// ≈ 每 RTT +1 MSS</span>',
'}'
]);

/* ========== 场景 1：慢启动（指数增长） ========== */
const slowScene=(()=>{
  const V=[1,2,4,8],U=24,N=8;
  const steps=[
    {title:'步骤 0 · 刚建连：从 cwnd = 1 MSS 起步',chip:'网络容量未知',chipC:'c0',r:1,p4:false,send:1,ack:0,lines:[9,10],
     note:'虚线 ssthresh = 8 是慢启动的切换门限',
     desc:'三次握手刚完成，发送方对这条路径能扛多少数据<b>一无所知</b>。贸然开大窗口可能瞬间压垮中间路由器，于是从最小的 <b>cwnd = 1 MSS</b> 起步——先发 1 个报文段试试水。上方虚线是慢启动门限 <b>ssthresh = 8</b>：低于它用慢启动快速探测，达到它就改用保守的拥塞避免。'},
    {title:'RTT1 · 发 1 段、收 1 个 ACK → cwnd = 2',chip:'cwnd 1→2',chipC:'cb',r:2,p4:false,send:1,ack:1,lines:[9,10],
     note:'收到 1 个 ACK：cwnd = 1 + 1 = 2',
     desc:'第 1 轮发出 1 个报文段，ACK 顺利返回。慢启动规则：<b>每收到一个 ACK，cwnd += 1 MSS</b>。1 个 ACK 到手，cwnd 变成 <span class="bl">2</span>——下一轮可以发 2 段了。ACK 能回来，说明这条路目前扛得住。'},
    {title:'RTT2 · 发 2 段、收 2 个 ACK → cwnd = 4',chip:'cwnd 2→4',chipC:'cb',r:3,p4:false,send:2,ack:2,lines:[9,10],
     note:'每个 ACK 都 +1 → 一轮下来正好翻倍',
     desc:'发 2 段、回 2 个 ACK，每个 ACK 让 cwnd +1 → cwnd = 2 + 2 = <span class="bl">4</span>。注意规则是"逐 ACK +1"，但<b>按 RTT 看效果就是翻倍</b>——发多少、确认多少、就再涨多少，这正是指数增长的来源。'},
    {title:'RTT3 · 发 4 段、收 4 个 ACK → cwnd = 8',chip:'cwnd 4→8',chipC:'cb',r:4,p4:false,send:4,ack:4,lines:[9,10],
     note:'1 → 2 → 4 → 8：指数逼近门限',
     desc:'同样的机制继续滚雪球：4 段全部确认，cwnd = 4 + 4 = <span class="bl">8</span>。短短 3 个 RTT，窗口从 1 冲到 8——柱子的高度差就是"指数"两个字的直观形状。'},
    {title:'cwnd 触到 ssthresh = 8 → 切换拥塞避免',chip:'cwnd ≥ ssthresh',chipC:'ch',r:4,p4:true,send:8,ack:0,lines:[11,12],
     note:'柱子变色：指数阶段到此为止',
     desc:'cwnd 摸到虚线：<b>cwnd ≥ ssthresh</b> 成立，慢启动结束。指数增长再翻一倍就是 16，很可能直接把路径打爆，所以 TCP 在这里"换挡"——进入<span class="gr">拥塞避免</span>，改为每 RTT 只加 1 MSS 的线性爬坡（见下一场景）。'},
    {title:'"慢启动"一点也不慢',chip:'指数探测',chipC:'cg',r:4,p4:true,send:8,ack:8,lines:[9,10],
     note:'慢的只是起点，增速是指数级',
     desc:'名字里的"慢"指<b>起点低</b>（从 1 MSS 开始），不是速度慢——每 RTT 翻倍是最快的探测方式。它的使命：在完全未知的网络上，用最少的轮次找到"大概能扛多少"的量级。'},
    {title:'慢启动的三个出口',chip:'门限 / 超时 / 3 dup ACK',chipC:'cd',r:4,p4:true,send:8,ack:8,lines:[0,4],

     desc:'从减半后的 5 出发，仍在拥塞避免里小步上爬：5 → 6 → 7。曲线开始呈现"锯齿"的雏形——TCP 的稳态就是这样一轮轮试探、回落、再试探。'},
    {title:'事件② · 超时：ssthresh = 7/2 ≈ 3，cwnd 跌回 1',chip:'处罚最重',chipC:'cd',n:11,ssv:3,bands:3,e1:true,e2:true,lines:[0,1,2],c:1,ph:'超时→慢启动',phC:'cd',
     desc:'这次是<b>超时</b>（更粗的红线）：连 ACK 都收不到，判定拥塞严重。<b>ssthresh = 7/2 ≈ 3</b>（虚线再往下滑），<b>cwnd 直接跌回 1</b>——曲线断崖式坠底，处罚远重于事件①。'},
    {title:'重新慢启动：1 → 2 → …',chip:'从头再来',chipC:'cb',n:12,ssv:3,bands:4,e1:true,e2:true,lines:[3,9,10],c:2,ph:'慢启动',phC:'cb',
     desc:'从 1 重新指数爬升：1 → 2 → …，这次门限只有 3，很快就会再切拥塞避免。整条曲线就是 TCP 的一生：<b>爬升 — 受挫 — 收缩 — 再爬升</b>。'},
    {title:'两条核心规律',chip:'AIMD',chipC:'cg',n:12,ssv:3,bands:4,e1:true,e2:true,lines:[],c:2,ph:'慢启动',phC:'cb',
     desc:'① <b>网络顺畅时逐步增大</b>：门限下指数、门限上线性；② <b>怀疑拥塞时迅速减小</b>：3 个重复 ACK 减半，超时归 1。涨得越谨慎、跌得越果断，整张网络越稳定。'},
    {title:'别忘了流控制：发送窗口 = min(rwnd, cwnd)',chip:'min(rwnd, cwnd)',chipC:'c0',n:12,ssv:3,bands:4,e1:true,e2:true,lines:[],c:2,ph:'慢启动',phC:'cb',
     desc:'cwnd 只是约束之一。真正能发出去的数据量 = <b>min(rwnd, cwnd)</b>：<b>rwnd</b> 管"接收方吃不吃得下"（流控制），<b>cwnd</b> 管"网络路上扛不扛得住"（拥塞控制）。两道闸门，永远取更小的那道。'},
  ];
  let path=null,lastLen=0;
  function setCurve(n){
    const d=PTS.slice(0,n).map((p,i)=>(i?'L ':'M ')+xs(p[0])+' '+ys(p[1])).join(' ');
    path.setAttribute('d',d);
    const L=path.getTotalLength();
    if(L>lastLen+0.5){
      path.style.transition='none';
      path.style.strokeDasharray=L+' '+L;
      path.style.strokeDashoffset=(L-lastLen);
      void path.getBoundingClientRect();
      path.style.transition='';
      path.style.strokeDashoffset='0';
      clearTimeout(path._t);
      path._t=setTimeout(()=>{path.style.strokeDasharray='';path.style.strokeDashoffset='';},680);
    }else{
      path.style.strokeDasharray='';path.style.strokeDashoffset='';
    }
    lastLen=L;
  }
  function mount(){
    lastLen=0;
    let grid='';
    for(let c=2;c<=12;c+=2)grid+='<line class="cv-grid" x1="36" y1="'+ys(c)+'" x2="516" y2="'+ys(c)+'"/><text class="cv-ylbl" x="30" y="'+(ys(c)+3)+'" text-anchor="end">'+c+'</text>';
    let xl='';
    for(let r=1;r<=12;r++)xl+='<text class="cv-xlbl" x="'+xs(r)+'" y="287" text-anchor="middle">'+r+'</text>';
    const band=(id,x,w,fill,lbl)=>'<g class="cv-band" id="'+id+'"><rect x="'+x+'" y="20" width="'+w+'" height="252" fill="'+fill+'" fill-opacity=".55"/><text x="'+(x+w/2)+'" y="34">'+lbl+'</text></g>';
    viz.innerHTML='<div class="vcap"><b>完整曲线</b>：笔记示例 RTT1–12 的 cwnd 轨迹，ssthresh 8 → 5 → 3</div>'+
      '<svg class="cv-svg" viewBox="0 0 560 300">'+
        band('cvB0',36,144,'#E6F1FB','慢启动')+
        band('cvB1',180,120,'#E1F5EE','拥塞避免')+
        band('cvB2',300,120,'#E1F5EE','拥塞避免')+
        band('cvB3',420,96,'#E6F1FB','慢启动')+
        grid+
        '<line class="cv-axis" x1="36" y1="20" x2="36" y2="272"/><line class="cv-axis" x1="36" y1="272" x2="516" y2="272"/>'+
        xl+'<text class="cv-xlbl" x="536" y="287" text-anchor="middle">RTT</text>'+
        '<text class="cv-ylbl" x="14" y="16">MSS</text>'+
        '<g class="cv-evt" id="cvE1"><line x1="300" y1="20" x2="300" y2="272"/><text x="300" y="14">3 dup ACK</text></g>'+
        '<g class="cv-evt big" id="cvE2"><line x1="420" y1="20" x2="420" y2="272"/><text x="420" y="14">超时</text></g>'+
        '<g id="cvSSg"><line x1="36" y1="'+ys(8)+'" x2="516" y2="'+ys(8)+'"/><text x="44" y="'+(ys(8)-6)+'" id="cvSSt">ssthresh = 8</text></g>'+
        '<path id="cvPath" d=""/>'+
        '<circle id="cvDot" cx="0" cy="0" r="5"/>'+
      '</svg>'+
      '<div class="cv-stat">cwnd = <b id="cvC">1</b> MSS　·　ssthresh = <b id="cvS">8</b> MSS　·　<span class="chip cb" id="cvP">慢启动</span></div>';
    path=el('cvPath');
  }
  function paint(s){
    setCurve(s.n);
    const p=PTS[s.n-1];
    el('cvDot').style.transform='translate('+xs(p[0])+'px,'+ys(p[1])+'px)';
    el('cvSSg').style.transform='translateY('+(ys(s.ssv)-ys(8))+'px)';
    el('cvSSt').textContent='ssthresh = '+s.ssv;
    for(let i=0;i<4;i++)el('cvB'+i).classList.toggle('on',i<s.bands);
    el('cvE1').classList.toggle('on',s.e1);
    el('cvE2').classList.toggle('on',s.e2);
    setV('cvC',''+s.c);setV('cvS',''+s.ssv);
    const ph=el('cvP');ph.textContent=s.ph;ph.className='chip '+s.phC;
  }
  return {id:'curve',label:'完整曲线',sub:'cwnd/ssthresh 全程锯齿',steps,mount,paint,code:CODE};
})();

/* ========== 引擎 ========== */
const SCENES=[slowScene,avoidScene,recovScene,curveScene];
const tabsBox=document.getElementById('tabs');
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stAct=document.getElementById('stAct'),stDesc=document.getElementById('stDesc');
const codeBox=document.getElementById('codeBox'),readout=document.getElementById('readout'),dotsBox=document.getElementById('dots');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');

SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML='<span class="t">'+sc.label+'</span><span class="s">'+sc.sub+'</span>';b.onclick=()=>{stop();switchScene(i);};tabsBox.appendChild(b);});
let si=0,cur=0,dotEls=[];
function switchScene(i){
  si=i;cur=0;
  [...tabsBox.children].forEach((t,idx)=>t.classList.toggle('on',idx===si));
  SCENES[si].mount();codeBox.innerHTML=SCENES[si].code;
  dotsBox.innerHTML='';dotEls=[];
  SCENES[si].steps.forEach((s,idx)=>{const d=document.createElement('button');d.className='dot';d.title=s.title;d.onclick=()=>{stop();go(idx);};dotsBox.appendChild(d);dotEls.push(d);});
  go(0);
}
function go(i){
  const steps=SCENES[si].steps;cur=Math.max(0,Math.min(steps.length-1,i));const s=steps[cur];
  SCENES[si].paint(s);
  stTitle.textContent=SCENES[si].label;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;stAct.innerHTML='▸ '+s.title;stDesc.innerHTML=s.desc;
  const hl=s.lines||[];
  [...codeBox.querySelectorAll('.cl')].forEach((c,idx)=>c.classList.toggle('hl',hl.includes(idx)));
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(steps.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
  try{history.replaceState(null,'','#scene='+SCENES[si].id+'&step='+cur);}catch(e){}
  if(cur===steps.length-1)stop();
}
let timer=null,ms=2600;
function play(){const steps=SCENES[si].steps;if(cur===steps.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<SCENES[si].steps.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const hm=location.hash.match(/scene=(\w+)/),sm=location.hash.match(/step=(\d+)/);
let initScene=0;if(hm){const idx=SCENES.findIndex(x=>x.id===hm[1]);if(idx>=0)initScene=idx;}
switchScene(initScene);if(sm)go(+sm[1]);
</script>
