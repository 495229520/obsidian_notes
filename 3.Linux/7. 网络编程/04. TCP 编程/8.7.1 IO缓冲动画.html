<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IO 缓冲动画 · write→发送缓冲→网络→接收缓冲→read 全链路 / write≠发送 / 关闭时的缓冲区行为</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#3E3D39;--muted:#5F5E5A;--faint:#8a887f;
  --line:#c9c7bf;--grid:#e2e0d7;
  --blue:#185FA5;--bluebg:#E6F1FB;
  --green:#0F6E56;--greenbg:#E1F5EE;
  --brown:#9A5B0E;--brownbg:#FAEEDA;
  --danger:#B3402F;--dangerbg:#F6E0DB;
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 44px;text-wrap:pretty;}
.wrap{max-width:1180px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.4px;}
header p{font-size:13px;color:var(--muted);margin-top:5px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
.tab{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 17px;cursor:pointer;transition:all .18s var(--ease);display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
.tab:hover{border-color:var(--muted);transform:translateY(-1px);}
.tab .t{font-weight:600;color:var(--ink);}
.tab .s{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 10px rgba(62,61,57,.18);}
.tab.on .t,.tab.on .s{color:var(--paper);}
.tab.on .s{opacity:.75;}

.layout{display:grid;grid-template-columns:626px 1fr;gap:26px;margin-top:22px;align-items:start;}
@media(max-width:1080px){.layout{grid-template-columns:1fr;}}
.viz{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:22px;min-height:452px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.viz .vcap{font-size:12px;color:var(--muted);margin-bottom:14px;}
.viz .vcap b{color:var(--ink);}

/* ===== 场景 1：全链路数据流 ===== */
.fl-stage{position:relative;width:578px;height:300px;margin:2px auto 0;}
.fl-zone{position:absolute;top:0;bottom:0;border-radius:10px;}
.fl-zone.user{background:rgba(24,95,165,.06);}
.fl-zone.kern{background:rgba(154,91,14,.08);}
.fl-zlbl{position:absolute;top:7px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--faint);white-space:nowrap;}
.fl-bound{position:absolute;top:24px;bottom:24px;width:0;border-left:1.5px dashed var(--brown);opacity:.55;}
.fl-blbl{position:absolute;top:28px;writing-mode:vertical-rl;font-size:8.5px;color:var(--brown);letter-spacing:2px;opacity:.8;}
.fl-box{position:absolute;top:64px;height:208px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);overflow:hidden;}
.fl-box.app{border-color:var(--blue);}
.fl-box.buf{border-color:var(--brown);}
.fl-box.glow{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,110,86,.25);}
.fl-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(154,91,14,.13);transition:height var(--dur) var(--ease);}
.fl-pipe{position:absolute;left:218px;top:112px;width:142px;height:96px;border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line);}
.fl-under{position:absolute;top:277px;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;white-space:nowrap;}
.fl-under b{color:var(--brown);}
.fl-chip{position:absolute;top:36px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--gray);color:var(--muted);transition:all var(--dur) var(--ease);white-space:nowrap;z-index:3;}
.fl-chip.on{color:var(--blue);border-color:var(--blue);background:var(--bluebg);box-shadow:0 0 0 3px rgba(24,95,165,.15);}
.byte{position:absolute;width:64px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;background:var(--bb,var(--blue));border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(60,55,40,.15);z-index:2;transition:left var(--dur) var(--ease),top var(--dur) var(--ease),background var(--dur) var(--ease),opacity var(--dur) var(--ease);}
.byte.fly{box-shadow:0 4px 10px rgba(24,95,165,.3);}
.byte.dlv{background:var(--green);}
.fl-anno{position:absolute;left:214px;width:150px;top:32px;text-align:center;font-size:10.5px;font-weight:600;border-radius:8px;border:1.5px solid var(--line);padding:4px 6px;line-height:1.35;opacity:0;transition:opacity var(--dur) var(--ease);z-index:3;}
.fl-anno.q{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.fl-anno.ok{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.fl-anno.h{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.fl-anno.show{opacity:1;}

/* ===== 场景 2：缓冲为什么存在 ===== */
.why-panel{border:1.5px solid var(--grid);border-radius:11px;padding:10px 14px 12px;background:var(--paper);margin-top:10px;transition:opacity var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.why-panel.dim{opacity:.35;}
.why-panel.lit{border-color:var(--ink);box-shadow:0 2px 8px rgba(60,55,40,.1);}
.wp-h{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px;}
.wp-row{display:flex;align-items:center;gap:5px;margin:7px 0;opacity:.28;transition:opacity var(--dur) var(--ease);}
.wp-row.show{opacity:1;}
.wp-lbl{font-family:var(--mono);font-size:10.5px;color:var(--muted);width:52px;text-align:right;flex:none;}
.wp-hdr{display:inline-block;height:20px;width:34px;background:var(--brownbg);border:1.5px solid var(--brown);border-radius:4px;color:var(--brown);font-size:9px;font-family:var(--mono);text-align:center;line-height:17px;flex:none;}
.wp-pay{display:inline-block;height:20px;width:5px;background:var(--blue);border-radius:4px;color:#fff;font-size:9px;font-family:var(--mono);text-align:center;line-height:20px;overflow:hidden;white-space:nowrap;flex:none;transition:width var(--dur) var(--ease);}
.wp-note{font-size:10.5px;color:var(--faint);margin-left:8px;}
.wp-flow{display:flex;align-items:center;gap:12px;padding:4px 0 12px;}
.wp-end{font-size:11px;color:var(--muted);text-align:center;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;}
.wp-chan{position:relative;flex:1;height:48px;border-left:1.5px dashed var(--line);border-right:1.5px dashed var(--line);}
.wp-ack{position:absolute;top:13px;left:72%;opacity:0;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--green);background:var(--greenbg);border:1.5px solid var(--green);border-radius:7px;padding:3px 8px;white-space:nowrap;transition:left var(--dur) var(--ease),opacity var(--dur) var(--ease);}
.wp-retx{position:absolute;top:13px;left:2%;opacity:0;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--danger);background:var(--dangerbg);border:1.5px solid var(--danger);border-radius:7px;padding:3px 8px;white-space:nowrap;transition:left var(--dur) var(--ease),opacity var(--dur) var(--ease);}
.wp-bar{width:110px;height:13px;border:1.5px solid var(--brown);border-radius:7px;overflow:hidden;background:var(--panel);}
.wp-fill{height:100%;width:30%;background:var(--brown);transition:width var(--dur) var(--ease),background var(--dur) var(--ease);}
.wp-fill.hot{background:var(--danger);}
.wp-badge{font-size:10px;font-weight:700;color:var(--danger);border:1.5px solid var(--danger);background:var(--dangerbg);border-radius:999px;padding:1px 8px;opacity:0;transition:opacity var(--dur) var(--ease);}
.wp-badge.on{opacity:1;}
.wp-blocks{display:flex;gap:6px;padding-bottom:12px;}
.wp-blk{width:52px;height:26px;border-radius:5px;background:var(--blue);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;transition:background var(--dur) var(--ease),opacity var(--dur) var(--ease);}
.wp-blk::after{content:'待确认';position:absolute;top:100%;margin-top:1px;font-size:8.5px;color:var(--faint);font-weight:400;}
.wp-blk.ok{background:var(--green);opacity:.28;}
.wp-blk.ok::after{content:'已删除';color:var(--green);}
.wp-blk.blink{animation:blinkRed .9s var(--ease) 2;}
@keyframes blinkRed{50%{box-shadow:0 0 0 4px rgba(179,64,47,.45);background:var(--danger);}}

/* ===== 场景 3：关闭时的命运 ===== */
.cs-stage{position:relative;width:578px;height:268px;margin:2px auto 0;}
.cs-app{position:absolute;left:50%;transform:translateX(-50%);top:0;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
.cs-fd{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--blue);border:1.5px solid var(--blue);background:var(--bluebg);border-radius:7px;padding:2px 10px;transition:all var(--dur) var(--ease);}
.cs-fd.off{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);text-decoration:line-through;}
.cs-host{position:absolute;left:40px;top:40px;width:498px;height:142px;border:1.5px solid var(--line);border-radius:11px;background:rgba(154,91,14,.05);}
.cs-hlbl{position:absolute;top:45px;left:50px;font-family:var(--mono);font-size:9.5px;color:var(--faint);}
.cs-buf{position:absolute;top:70px;width:210px;height:96px;border:1.5px solid var(--brown);border-radius:9px;background:var(--paper);}
.cs-buf .t{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--brown);font-weight:700;}
.cs-net{position:absolute;left:40px;top:206px;width:498px;height:56px;border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line);}
.cs-nlbl{position:absolute;right:46px;top:210px;font-family:var(--mono);font-size:9.5px;color:var(--faint);}
.cs-blk{position:absolute;width:56px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;background:var(--brown);box-shadow:0 1px 3px rgba(60,55,40,.15);z-index:2;transition:left var(--dur) var(--ease),top var(--dur) var(--ease),background var(--dur) var(--ease),opacity var(--dur) var(--ease),transform var(--dur) var(--ease);}
.cs-blk.sent{background:var(--green);}
.cs-blk.done{opacity:.3;}
.cs-blk.drop{background:var(--danger);opacity:0;transform:scale(.35) rotate(12deg);}
.cs-badge{position:absolute;font-size:10.5px;font-weight:700;border:1.5px solid;border-radius:999px;padding:2px 10px;opacity:0;transition:opacity var(--dur) var(--ease);white-space:nowrap;z-index:3;}
.cs-badge.g{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.cs-badge.d{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.cs-badge.on{opacity:1;}
.cs-fin{position:absolute;top:222px;left:70px;opacity:0;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brown);background:var(--brownbg);border:1.5px solid var(--brown);border-radius:7px;padding:3px 12px;transition:left 900ms var(--ease),opacity var(--dur) var(--ease);z-index:3;}
.cs-traits{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px;}
.trait{border:1.5px solid var(--grid);border-radius:9px;padding:7px 10px;font-size:11px;color:var(--muted);opacity:.4;background:var(--paper);transition:all var(--dur) var(--ease);}
.trait b{display:block;font-size:11.5px;color:var(--ink);margin-bottom:1px;}
.trait.lit{opacity:1;border-color:var(--green);background:var(--greenbg);}
.trait.lit.bad{border-color:var(--danger);background:var(--dangerbg);}

/* 右侧 */
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:18px 20px;min-height:196px;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.act{margin-top:14px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:9px 13px;border-radius:9px;}
.chip{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;border:1px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cb{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.desc-body{margin-top:10px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .bl{color:var(--blue);font-weight:600;}
.desc-body .gr{color:var(--green);font-weight:600;}
.desc-body .dg{color:var(--danger);font-weight:600;}
.desc-body .hb{color:var(--brown);font-weight:600;}
.codebox{background:#2E2C27;border-radius:11px;padding:12px 0;font-family:var(--mono);font-size:12px;line-height:1.65;color:#D8D5CC;white-space:pre;overflow-x:auto;box-shadow:0 2px 8px rgba(46,44,39,.18);}
.codebox .cmt{color:#8F8B80;} .codebox .kw{color:#E3A44C;}
.codebox .cl{padding:2px 17px;transition:background .3s var(--ease),color .3s var(--ease);}
.codebox .cl.hl{background:rgba(52,122,198,.52);box-shadow:inset 4px 0 0 #82B4E8;color:#F7F4EA;}
.codebox .cl.hl .cmt{color:#CCC8BA;}

.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:92px;}
.dots{display:flex;gap:7px;margin:0 auto;flex-wrap:wrap;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>IO 缓冲动画 · write→发送缓冲→网络→接收缓冲→read 全链路</h1>
    <p>配套笔记《8.7 IO缓冲》 · write ≠ 发送、read 读的是缓冲区：一次 write 40B，四次 read 各 10B　·　上方切场景，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <section class="viz" id="viz"></section>
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="act" id="stAct"></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
      <div class="codebox" id="codeBox"></div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
const viz=document.getElementById('viz');
const el=id=>document.getElementById(id);
const codeOf=lines=>lines.map(l=>'<div class="cl">'+l+'</div>').join('');

/* ========== 场景 1：全链路数据流（40B 一次写、4 次读） ========== */
const flowScene=(()=>{
  const BH=24;
  // 字节块位置：A=主机A app / S=发送缓冲 / N=网络管道 / R=接收缓冲 / B=主机B app
  function pos(loc){
    switch(loc.t){
      case 'A': return {x:20, y:268-(loc.k+1)*BH};
      case 'S': return {x:128,y:268-(loc.k+1)*BH};
      case 'N': return {x:222+loc.k*22,y:118+loc.k*16};
      case 'R': return {x:386,y:268-(loc.k+1)*BH};
      case 'B': return {x:490,y:268-(loc.k+1)*23-Math.floor(loc.k/2)*6};
    }
  }
  const L=(t,k)=>({t,k});
  const all=t=>[0,1,2,3,4,5,6,7].map(k=>L(t,k));
  const code=codeOf([
    '<span class="cmt">// ── 服务器端（主机A）──</span>',
    'write(sock, buf, 40);  <span class="cmt">// 拷入发送缓冲, 立刻返回</span>',
    '<span class="cmt">// 内核: 按 MSS 分段, 决定何时发/发多少</span>',
    '<span class="cmt">// ── 客户端（主机B）──</span>',
    'read(sock, buf, 10);   <span class="cmt">// 取 10B, 剩 30B 在接收缓冲排队</span>',
    'read(sock, buf, 10);   <span class="cmt">// 水位 30 → 20B</span>',
    'read(sock, buf, 10);   <span class="cmt">// 水位 20 → 10B</span>',
    'read(sock, buf, 10);   <span class="cmt">// 取空: 1 次 write 对上 4 次 read</span>',
    '<span class="cmt">// TCP 只保序, 不保留消息边界</span>'
  ]);
  const steps=[
    {title:'步骤 0 · 原问题：剩下的 30B 在哪等？',chip:'无边界疑问',chipC:'c0',lines:[0,3],
     blocks:all('A'),lv:[0,0],w:0,r:0,glow:0,anno:{t:'剩下的 30B 在空中盘旋?',c:'q'},
     desc:'服务器一次 <code>write()</code> 写出 <b>40 字节</b>（8 个 5B 字节块），客户端却分 <b>4 次 read()</b>、每次只收 10 字节。收完第一批 10B 后，剩下的 <b>30B 在哪里等待</b>？难道像飞机等待着陆一样在网络中"盘旋"？带着这个问题走一遍数据的完整旅程——注意两条虚线是<span class="bl">用户态</span>与<span class="hb">内核态</span>的分界。'},
    {title:'步骤 1 · write(40B)：只是拷贝进发送缓冲',chip:'write ≠ 发送',chipC:'cb',lines:[1],
     blocks:all('S'),lv:[40,0],w:1,r:0,glow:0,anno:{t:'write() 已返回 · 数据仍在本机内核',c:'ok'},
     desc:'<code>write()</code> 调用瞬间，40B 从 app 的用户态内存<b>拷贝进内核的发送缓冲区</b>，然后<span class="gr">立刻返回</span>。此刻数据<b>一个字节都还没上网络</b>——write 返回只代表"拷贝完成"，不代表"已发送"，更不代表"已送达"。'},

     desc:'接收缓冲里那 2 块 app 没来得及 read 的数据被<span class="dg">直接丢弃</span>（变红碎裂消失），且<b>没有任何通知</b>。教训：close 之前没 read 出来的数据就永远没了——应用协议要保证"读完该读的再关"。'},
    {title:'步骤 5 · 特点表：IO 缓冲四条铁律',chip:'汇总',chipC:'cg',lines:[6],
     fd:1,sp:'net',scls:'sent done',rdrop:1,grace:1,drop:1,fin:{o:1,x:430},traits:1,
     desc:'<b>① 独立存在</b>：每个 TCP 套接字单独一对；<b>② 自动创建</b>：创建套接字时自动生成；<b>③ 输出缓冲继续发送</b>：关闭后遗留数据尽量送达；<b>④ 输入缓冲数据丢失</b>：关闭时未读数据被丢弃。'},
  ];
  function mount(){
    let h='<div class="cs-app">应用进程 <span class="cs-fd" id="csFd">sockfd = 3</span> 调用 close()</div>';
    h+='<div class="cs-host"></div><span class="cs-hlbl">内核态</span>';
    h+='<div class="cs-buf" style="left:64px"><span class="t">接收缓冲区（输入）</span></div>';
    h+='<div class="cs-buf" style="left:304px"><span class="t">发送缓冲区（输出）</span></div>';
    h+='<div class="cs-net"></div><span class="cs-nlbl">网络 → 对端</span>';
    for(let i=0;i<2;i++)h+='<div class="cs-blk" id="cs-r'+i+'" style="left:'+(78+i*66)+'px;top:112px">10B</div>';
    for(let i=0;i<3;i++)h+='<div class="cs-blk" id="cs-s'+i+'" style="left:'+(318+i*64)+'px;top:112px">10B</div>';
    h+='<span class="cs-badge g" id="csGrace" style="left:330px;top:46px">遗留数据继续发送 · 尽量送达</span>';
    h+='<span class="cs-badge d" id="csDrop" style="left:80px;top:46px">未读数据直接丢弃</span>';
    h+='<span class="cs-fin" id="csFin">FIN</span>';
    let t='<div class="trait" id="csT0"><b>① 独立存在</b>每个 TCP 套接字单独拥有一对</div>';
    t+='<div class="trait" id="csT1"><b>② 自动创建</b>创建套接字时自动生成</div>';
    t+='<div class="trait" id="csT2"><b>③ 输出缓冲继续发送</b>关闭后遗留数据尽量送达</div>';
    t+='<div class="trait bad" id="csT3"><b>④ 输入缓冲数据丢失</b>关闭时未读数据被丢弃</div>';
    viz.innerHTML='<div class="vcap"><b>关闭套接字时缓冲区的命运</b>：输出缓冲发完再走，输入缓冲当场丢弃</div>'+
      '<div class="cs-stage">'+h+'</div><div class="cs-traits">'+t+'</div>';
  }
  function paint(s){
    el('csFd').className='cs-fd'+(s.fd?' off':'');
    for(let i=0;i<3;i++){
      const b=el('cs-s'+i);
      if(s.sp==='buf'){b.style.left=(318+i*64)+'px';b.style.top='112px';}
      else{b.style.left=(70+i*150)+'px';b.style.top='218px';}
      b.className='cs-blk '+s.scls;
    }
    for(let i=0;i<2;i++)el('cs-r'+i).className='cs-blk'+(s.rdrop?' drop':'');
    el('csGrace').classList.toggle('on',!!s.grace);
    el('csDrop').classList.toggle('on',!!s.drop);
    const f=el('csFin');f.style.left=s.fin.x+'px';f.style.opacity=s.fin.o;
    for(let i=0;i<4;i++)el('csT'+i).classList.toggle('lit',!!s.traits);
  }
  return {id:'close',label:'关闭时的命运',sub:'输出发完 · 输入丢弃',steps,mount,paint,code};
})();

/* ========== 引擎 ========== */
const SCENES=[flowScene,whyScene,closeScene];
const tabsBox=document.getElementById('tabs');
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stAct=document.getElementById('stAct'),stDesc=document.getElementById('stDesc');
const codeBox=document.getElementById('codeBox'),readout=document.getElementById('readout'),dotsBox=document.getElementById('dots');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');

SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML='<span class="t">'+sc.label+'</span><span class="s">'+sc.sub+'</span>';b.onclick=()=>{stop();switchScene(i);};tabsBox.appendChild(b);});
let si=0,cur=0,dotEls=[];
function switchScene(i){
  si=i;cur=0;
  [...tabsBox.children].forEach((t,idx)=>t.classList.toggle('on',idx===si));
  SCENES[si].mount();codeBox.innerHTML=SCENES[si].code;
  dotsBox.innerHTML='';dotEls=[];
  SCENES[si].steps.forEach((s,idx)=>{const d=document.createElement('button');d.className='dot';d.title=s.title;d.onclick=()=>{stop();go(idx);};dotsBox.appendChild(d);dotEls.push(d);});
  go(0);
}
function go(i){
  const steps=SCENES[si].steps;cur=Math.max(0,Math.min(steps.length-1,i));const s=steps[cur];
  SCENES[si].paint(s);
  codeBox.querySelectorAll('.cl').forEach((ln,idx)=>ln.classList.toggle('hl',!!(s.lines&&s.lines.includes(idx))));
  stTitle.textContent=SCENES[si].label;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;stAct.innerHTML='▸ '+s.title;stDesc.innerHTML=s.desc;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(steps.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
  history.replaceState(null,'','#scene='+SCENES[si].id+'&step='+cur);
  if(cur===steps.length-1)stop();
}
let timer=null,ms=2500;
function play(){const steps=SCENES[si].steps;if(cur===steps.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<SCENES[si].steps.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const hm=location.hash.match(/scene=(\w+)/),sm=location.hash.match(/step=(\d+)/);
let initScene=0;if(hm){const idx=SCENES.findIndex(x=>x.id===hm[1]);if(idx>=0)initScene=idx;}
switchScene(initScene);if(sm)go(+sm[1]);
</script>
