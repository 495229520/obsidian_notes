<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>select 与 epoll 对比动画 · 全量扫描 vs 红黑树 + 就绪链表</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFBF6;--ink:#2B2A26;--muted:#6B675C;--faint:#9B968A;
  --line:#D8D5C8;--grid:#D8D5C8;
  --blue:#3D5A80;--bluebg:#E3EAF4;--bluetx:#2C4460;
  --green:#2F6B5E;--greenbg:#DCE9E3;--greentx:#24473F;
  --amber:#8A6A3A;--amberbg:#EFE7DA;--ambertx:#6B4E28;
  --danger:#A64B3C;--dangerbg:#F0E0DB;--dangertx:#733428;
  --gray:#F1EFE8;--arrow:#5A564B;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 48px;text-wrap:pretty;}
.wrap{max-width:1240px;margin:0 auto;}
header h1{font-size:22px;font-weight:700;letter-spacing:.2px;color:var(--ink);}
header p{font-size:13px;color:var(--muted);margin-top:6px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.tabs{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.tab{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel);border:1.2px solid var(--line);border-radius:11px;padding:10px 18px;cursor:pointer;transition:all .18s var(--ease);display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
.tab:hover{border-color:var(--muted);transform:translateY(-1px);}
.tab .t{font-weight:700;color:var(--ink);}
.tab .s{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 10px rgba(43,42,38,.16);}
.tab.on .t,.tab.on .s{color:var(--paper);}
.tab.on .s{opacity:.75;}

.layout{display:grid;grid-template-columns:680px 1fr;gap:28px;margin-top:22px;align-items:start;}
@media(max-width:1280px){.layout{grid-template-columns:1fr;}}
.viz{background:var(--panel);border:1.2px solid var(--grid);border-radius:14px;padding:24px;min-height:520px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.viz .vcap{font-size:13px;color:var(--muted);margin-bottom:16px;}
.viz .vcap b{color:var(--ink);font-weight:700;}
.stage{position:relative;width:632px;height:420px;margin:0 auto;}

/* ===== 统一连线系统 ===== */
.arr-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.wire{--wc:var(--arrow);fill:none;stroke:var(--wc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity var(--dur) var(--ease),stroke-dashoffset var(--dur) var(--ease);}
.warrow{--wc:var(--arrow);fill:var(--wc);stroke:none;opacity:0;transition:opacity 240ms var(--ease);}
.wport{--wc:var(--arrow);fill:var(--panel);stroke:var(--wc);stroke-width:2;opacity:0;transition:opacity 240ms var(--ease);}
.wire.on,.warrow.on,.wport.on{opacity:1;}
.wire.hint{stroke-width:2;opacity:.1;}
.warrow.hint,.wport.hint{opacity:.1;}
.warrow.drawing{transition-delay:200ms;}
.wire.blue,.warrow.blue,.wport.blue{--wc:var(--blue);}
.wire.green,.warrow.green,.wport.green{--wc:var(--green);}
.wire.amber,.warrow.amber,.wport.amber{--wc:var(--amber);}
.wire.danger,.warrow.danger,.wport.danger{--wc:var(--danger);}
.wlabel{position:absolute;z-index:3;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:2px 7px;border-radius:6px;opacity:0;transform:translate(-50%,-50%);transition:opacity var(--dur) var(--ease);white-space:nowrap;pointer-events:none;}
.wlabel.on{opacity:1;}
.wlabel.blue{color:var(--bluetx);border-color:var(--blue);}
.wlabel.green{color:var(--greentx);border-color:var(--green);}
.wlabel.amber{color:var(--ambertx);border-color:var(--amber);}
.wlabel.danger{color:var(--dangertx);border-color:var(--danger);}

/* ===== select 工作流 ===== */
.sel-box{position:absolute;left:16px;width:600px;height:104px;border:1.5px solid var(--grid);border-radius:12px;background:var(--paper);transition:opacity var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);opacity:.45;}
.sel-box.lit{opacity:1;}
#sbUser.lit{border-color:var(--blue);background:#F8FAFC;}
#sbKern.lit{border-color:var(--amber);background:#FBF9F5;}
#sbScan.lit{border-color:var(--danger);background:#FBF6F4;}
.sel-box .hdr{position:absolute;top:8px;left:14px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--faint);white-space:nowrap;transition:color var(--dur) var(--ease);}
#sbUser.lit .hdr{color:var(--blue);}
#sbKern.lit .hdr{color:var(--amber);}
#sbScan.lit .hdr{color:var(--danger);}
.cost{position:absolute;top:7px;font-size:10px;font-weight:700;font-family:var(--mono);border:1px solid var(--line);color:var(--faint);background:var(--panel);border-radius:999px;padding:2px 9px;opacity:.45;transition:all var(--dur) var(--ease);white-space:nowrap;}
.cost.lit{opacity:1;color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}
.bcell{position:absolute;top:46px;width:56px;height:48px;border:1.5px solid var(--line);border-radius:8px;background:var(--gray);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);opacity:.45;}
.bcell .bfd{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--faint);line-height:1.3;}
.bcell .bbit{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--muted);line-height:1.2;transition:color var(--dur) var(--ease);}
.bcell.ghost{opacity:.28;}
.bcell.set{opacity:1;border-color:var(--blue);background:var(--bluebg);}
.bcell.set .bbit{color:var(--blue);}
.bcell.ready{opacity:1;border-color:var(--green);background:var(--greenbg);transform:scale(1.06);}
.bcell.ready .bbit{color:var(--green);}
.bcell.dim{opacity:.4;}
.bcell .dd{position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;background:var(--amber);border:2px solid var(--panel);opacity:0;transition:opacity var(--dur) var(--ease);}
.bcell.hasdata .dd{opacity:1;}
.scan-ptr{position:absolute;top:24px;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--dangertx);border:1px solid var(--danger);background:var(--dangerbg);padding:1px 7px;border-radius:5px;opacity:0;transition:left 200ms var(--ease),opacity 300ms var(--ease);z-index:3;white-space:nowrap;}
.scan-ptr.on{opacity:1;}
.scan-ptr.b{color:var(--bluetx);border-color:var(--blue);background:var(--bluebg);}

/* ===== epoll 工作流 ===== */
.ep-box{position:absolute;border:1.5px solid var(--grid);border-radius:12px;background:var(--paper);transition:opacity var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease);opacity:.45;}
.ep-box.lit{opacity:1;}
#ebTree.lit{border-color:var(--green);background:#F7FAF8;}
#ebList.lit{border-color:var(--amber);background:#FBF9F5;}
#ebEv.lit{border-color:var(--blue);background:#F8FAFC;}
.ep-box .hdr{position:absolute;top:8px;left:14px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--faint);white-space:nowrap;transition:color var(--dur) var(--ease);}
#ebTree.lit .hdr{color:var(--green);}
#ebList.lit .hdr{color:var(--amber);}
#ebEv.lit .hdr{color:var(--blue);}
.ep-box .tag{position:absolute;top:7px;right:12px;font-size:10px;font-weight:700;font-family:var(--mono);border:1px solid var(--line);color:var(--faint);background:var(--panel);border-radius:999px;padding:2px 9px;opacity:.45;transition:all var(--dur) var(--ease);white-space:nowrap;}
.ep-box .tag.lit{opacity:1;color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.tnode{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:1.5px solid var(--line);background:var(--gray);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.7);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);z-index:2;}
.tnode.on{opacity:1;transform:scale(1);border-color:var(--green);background:var(--greenbg);color:var(--green);}
.tnode.hot{opacity:1;transform:scale(1.12);border-color:var(--amber);background:var(--amberbg);color:var(--ambertx);box-shadow:0 0 0 3px rgba(138,106,58,.18);}
.tedge{stroke:var(--line);stroke-width:1.5;opacity:0;transition:opacity var(--dur) var(--ease);}
.tedge.on{opacity:1;stroke:#BFCFC4;}
.lrow{position:absolute;left:12px;right:12px;height:32px;border:1.5px solid var(--line);border-radius:7px;background:var(--gray);font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateX(-6px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),color var(--dur) var(--ease);white-space:nowrap;}
.lrow.on{opacity:1;transform:translateX(0);}
.lrow.hot{border-color:var(--amber);background:var(--amberbg);color:var(--ambertx);}
.lrow.done{border-color:var(--blue);background:var(--bluebg);color:var(--bluetx);}
.lrow.ok{border-color:var(--green);background:var(--greenbg);color:var(--greentx);}
.ep-note{position:absolute;left:50%;top:392px;transform:translateX(-50%);font-size:12px;font-weight:700;border:1.5px solid var(--green);border-radius:999px;padding:5px 14px;opacity:0;transition:opacity var(--dur) var(--ease);white-space:nowrap;color:var(--greentx);background:var(--greenbg);}
.ep-note.on{opacity:1;}

/* ===== 对照总结 ===== */
.vs-head{position:absolute;top:6px;font-family:var(--mono);font-size:11.5px;font-weight:700;padding:3px 14px;border-radius:999px;border:1.5px solid;}
.vs-head.sel{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}
.vs-head.ep{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.vs-row{position:absolute;left:8px;right:8px;height:76px;}
.vs-lab{position:absolute;left:0;top:8px;bottom:8px;width:114px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--faint);display:flex;align-items:center;transition:color var(--dur) var(--ease);}
.vs-row.lit .vs-lab{color:var(--ink);}
.vs-c{position:absolute;top:8px;bottom:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--gray);opacity:.3;transform:translateY(3px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),color var(--dur) var(--ease);padding:0 14px;font-size:12.5px;line-height:1.45;display:flex;align-items:center;color:var(--muted);}
.vs-c.sel{left:122px;width:240px;}
.vs-c.ep{left:376px;width:240px;}
.vs-row.lit .vs-c{opacity:1;transform:translateY(0);}
.vs-row.lit .vs-c.sel{border-color:var(--danger);background:var(--dangerbg);color:var(--dangertx);}
.vs-row.lit .vs-c.ep{border-color:var(--green);background:var(--greenbg);color:var(--greentx);}
.vs-row.was .vs-c{opacity:.72;transform:translateY(0);}
.vs-row.was .vs-c.sel{border-color:var(--danger);background:var(--dangerbg);color:var(--dangertx);}
.vs-row.was .vs-c.ep{border-color:var(--green);background:var(--greenbg);color:var(--greentx);}
.vs-note{position:absolute;left:50%;top:392px;transform:translateX(-50%);font-size:12px;font-weight:700;border:1.5px solid var(--amber);border-radius:999px;padding:5px 14px;opacity:0;transition:opacity var(--dur) var(--ease);white-space:nowrap;color:var(--ambertx);background:var(--amberbg);}
.vs-note.on{opacity:1;}

/* 右侧 */
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1.2px solid var(--grid);border-radius:14px;padding:18px 20px;min-height:196px;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:700;}
#stAct{margin-top:14px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1.2px solid var(--line);padding:10px 14px;border-radius:9px;}
.chip{font-size:11px;font-weight:700;padding:3px 11px;border-radius:999px;border:1.2px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cb{color:var(--bluetx);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--greentx);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--ambertx);border-color:var(--amber);background:var(--amberbg);}
.chip.cd{color:var(--dangertx);border-color:var(--danger);background:var(--dangerbg);}
.desc-body{margin-top:10px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .bl{color:var(--blue);font-weight:700;}
.desc-body .gr{color:var(--green);font-weight:700;}
.desc-body .dg{color:var(--danger);font-weight:700;}
.desc-body .hb{color:var(--amber);font-weight:700;}
.codebox{background:#2E2C27;border-radius:11px;padding:12px 0;font-family:var(--mono);font-size:13px;line-height:1.6;color:#D8D5CC;white-space:pre;box-shadow:0 2px 8px rgba(46,44,39,.18);}
.codebox .cmt{color:#8F8B80;} .codebox .kw{color:#E3A44C;}
.codebox .cl{padding:2px 16px;transition:background .3s var(--ease),color .3s var(--ease);}
.codebox .cl.hl{background:rgba(52,122,198,.52);box-shadow:inset 4px 0 0 #82B4E8;color:#F7F4EA;}
.codebox .cl.hl .cmt{color:#CCC8BA;}

.controls{margin-top:22px;background:var(--panel);border:1.2px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1.2px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:92px;}
.dots{display:flex;gap:7px;margin:0 auto;flex-wrap:wrap;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>select 与 epoll 对比 · 全量扫描 vs 红黑树 + 就绪链表</h1>
    <p>配套笔记《13.2 select模型》《13.4 epoll模型》 · 每次拷贝 fd 集合 / 内核线性扫描 / 用户再遍历 · 对照 epoll_ctl 常驻内核　·　上方切场景，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <section class="viz" id="viz"></section>
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="act" id="stAct"></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
      <div class="codebox" id="codeBox"></div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
const viz=document.getElementById('viz');
const el=id=>document.getElementById(id);
const codeOf=lines=>lines.map(l=>'<div class="cl">'+l+'</div>').join('');
const FDS=[3,5,7,9,11,13,15,17],READY=[5,13];

/* ===== 共享连线引擎 ===== */
const trioHTML=id=>`<path id="${id}" class="wire"/><path id="${id}-head" class="warrow"/><circle id="${id}-port" class="wport" r="4"/>`;
const trio=id=>[el(id),el(id+'-head'),el(id+'-port')];
function motionKit(){
  let timers=[],token=0;
  const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  return {
    reduced,
    schedule(fn,delay){const t=token;if(reduced())fn();else timers.push(setTimeout(()=>{if(t===token)fn();},delay));},
    later(fn,delay){const t=token;timers.push(setTimeout(()=>{if(t===token)fn();},delay));},
    clear(){token++;timers.forEach(clearTimeout);timers=[];}
  };
}
function setW(id,state='',color=''){
  const sfx=(state?' '+state:'')+(color?' '+color:'');
  const [p,a,o]=trio(id);
  p.setAttribute('class','wire'+sfx);a.setAttribute('class','warrow'+sfx);o.setAttribute('class','wport'+sfx);
  p.style.strokeDasharray='';p.style.strokeDashoffset='';p.style.transition='';a.classList.remove('drawing');
}
function drawW(motion,id,color){
  setW(id,'on',color);
  const [p,a]=trio(id);
  if(motion.reduced())return;
  const L=p.getTotalLength();
  p.style.transition='none';p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
  a.classList.add('drawing');void p.getBoundingClientRect();
  p.style.transition='';p.style.strokeDashoffset='0';
  motion.later(()=>{p.style.strokeDasharray='';p.style.strokeDashoffset='';a.classList.remove('drawing');},560);
}
function polyArrow(id,points){
  const p=el(id),a=el(id+'-head'),o=el(id+'-port');
  const start=points[0],tip=points[points.length-1],prev=points[points.length-2];
  let base={x:tip.x,y:tip.y},dHead;
  const horizontal=Math.abs(tip.x-prev.x)>=Math.abs(tip.y-prev.y);
  if(horizontal){const dir=Math.sign(tip.x-prev.x)||1;base.x=tip.x-dir*9;dHead=`M ${tip.x} ${tip.y} L ${base.x} ${tip.y-5} L ${base.x} ${tip.y+5} Z`;}
  else{const dir=Math.sign(tip.y-prev.y)||1;base.y=tip.y-dir*9;dHead=`M ${tip.x} ${tip.y} L ${tip.x-5} ${base.y} L ${tip.x+5} ${base.y} Z`;}
  const pts=[...points.slice(0,-1),base];
  let d=`M ${pts[0].x} ${pts[0].y}`;for(let i=1;i<pts.length;i++)d+=` L ${pts[i].x} ${pts[i].y}`;
  p.setAttribute('d',d);a.setAttribute('d',dHead);o.setAttribute('cx',start.x);o.setAttribute('cy',start.y);
}
function bezierArrow(id,x1,y1,tipX,tipY){
  const baseX=tipX-9,gap=Math.max(1,baseX-x1),c1=x1+gap*.45,c2=x1+gap*.55;
  el(id).setAttribute('d',`M ${x1} ${y1} C ${c1} ${y1}, ${c2} ${tipY}, ${baseX} ${tipY}`);
  el(id+'-head').setAttribute('d',`M ${tipX} ${tipY} L ${baseX} ${tipY-5} L ${baseX} ${tipY+5} Z`);
  el(id+'-port').setAttribute('cx',x1);el(id+'-port').setAttribute('cy',y1);
}
const relRect=(stageR,id)=>{
  const q=el(id).getBoundingClientRect();
  return {l:q.left-stageR.left,r:q.right-stageR.left,t:q.top-stageR.top,b:q.bottom-stageR.top,
          cx:(q.left+q.right)/2-stageR.left,cy:(q.top+q.bottom)/2-stageR.top};
};
const placeLabel=(id,x,y)=>{const n=el(id);n.style.left=x+'px';n.style.top=y+'px';};

/* ========== 场景 1：select 工作流 ========== */
const selectScene=(()=>{
  const code=codeOf([
    'FD_ZERO(&rfds);',
    'FD_SET(3,&rfds); ... FD_SET(17,&rfds);',
    'n = select(maxfd+1, &rfds, 0, 0, &tv);',
    '<span class="cmt">// 内核线性扫描全部监控 fd</span>',
    '<span class="kw">for</span> (fd = 0; fd <= maxfd; ++fd)',
    '  <span class="kw">if</span> (FD_ISSET(fd, &rfds)) handle(fd);',
    '<span class="cmt">// 集合已被破坏：下轮必须重建</span>'
  ]);
  const steps=[
    {k:'hold',title:'步骤 0 · 用户态持有 8 个连接 fd',chip:'监控集',chipC:'c0',lines:[],wires:[],
     desc:'服务器同时挂着 8 个 fd（示意；真实场景可达上千）。其中只有 <b>fd=5</b> 和 <b>fd=13</b> 的内核缓冲已有数据（橙点）。问题：如何高效找到它们？'},
    {k:'build',title:'步骤 1 · FD_ZERO / FD_SET 组装位图',chip:'组装',chipC:'cb',lines:[0,1],wires:[],
     desc:'select 用 <code>fd_set</code> <span class="bl">位图</span>表达监控集：每个 fd 占一位。调用前必须逐个 <code>FD_SET</code> 把 8 个位全部置 1。'},
    {k:'copy',title:'步骤 2 · 整份 fd_set 拷贝进内核',chip:'全量拷贝',chipC:'cd',lines:[2],wires:['sw1'],
     desc:'<code>select()</code> 把<span class="dg">整份位图从用户态拷贝到内核态</span>——不管这轮有没有变化，每次调用都要拷。这是第一道 O(总fd) 成本。'},
    {k:'scan',title:'步骤 3 · 内核线性扫描全部 fd',chip:'线性扫描',chipC:'cd',lines:[2,3],wires:['sw1'],
     desc:'内核没有就绪索引，只能<span class="dg">从头到尾轮询每个被监控的 fd</span>：8 个全问一遍，才发现 fd=5、fd=13 就绪。第二道 O(总fd) 成本，连接越多越慢。'},
    {k:'user',title:'步骤 4 · 返回后用户还要再扫一遍',chip:'FD_ISSET',chipC:'cd',lines:[4,5],wires:['sw1','sw2'],
     desc:'select 返回 <code>n=2</code>，但<b>不告诉你是谁</b>——它把未就绪的位清零（<span class="dg">集合被破坏</span>），用户态只能用 <code>FD_ISSET</code> 把 0..maxfd <span class="dg">再遍历一遍</span>。第三道 O(maxfd) 成本。'},
    {k:'rebuild',title:'步骤 5 · 下一轮：整套成本重来',chip:'每轮重建',chipC:'cd',lines:[6],wires:['sw1','sw2'],
     desc:'集合已被改写，下轮调用前必须<span class="dg">重新组装整个 fd_set</span>。三道线性成本 + 每轮重建 + <code>FD_SETSIZE≈1024</code> 硬上限——这就是 select 在高并发下力不从心的原因。'},
  ];
  const WIRES={sw1:'danger',sw2:'danger'};
  const LABELS={sw1:'sl1',sw2:'sl2'};
  let litW=new Set(),motion=motionKit(),observer=null;
  const cellX=i=>34+i*68;
  function cellsHTML(prefix){
    return FDS.map((fd,i)=>`<div class="bcell" id="${prefix}${i}" style="left:${cellX(i)}px"><span class="bfd">fd ${fd}</span><span class="bbit">0</span><span class="dd"></span></div>`).join('');
  }
  function setCell(prefix,i,cls,bit){
    const c=el(prefix+i);
    c.className='bcell'+(cls?' '+cls:'')+(prefix==='sk'&&READY.includes(FDS[i])?' hasdata':'');
    if(bit!==undefined)c.querySelector('.bbit').textContent=bit;
  }
  function layout(){
    const stage=el('selStage'),svg=el('selSvg');if(!stage||!svg)return;
    const sr=stage.getBoundingClientRect();
    svg.setAttribute('viewBox',`0 0 ${sr.width} ${sr.height}`);
    const u=relRect(sr,'sbUser'),k=relRect(sr,'sbKern'),c=relRect(sr,'sbScan');
    polyArrow('sw1',[{x:u.cx,y:u.b},{x:u.cx,y:k.t}]);
    polyArrow('sw2',[{x:k.cx,y:k.b},{x:k.cx,y:c.t}]);
    placeLabel('sl1',u.cx+108,(u.b+k.t)/2);
    placeLabel('sl2',k.cx+120,(k.b+c.t)/2);
  }
  function mount(){
    cancel();litW=new Set();
    let h='';
    h+='<div class="sel-box" id="sbUser" style="top:36px"><span class="hdr">用户态 · fd_set 位图</span><span class="cost" id="scRe" style="right:96px">每轮重建</span><span class="cost" id="scCap" style="right:12px">≤1024</span>'+cellsHTML('su')+'</div>';
    h+='<div class="sel-box" id="sbKern" style="top:176px"><span class="hdr">内核态 · 线性扫描</span><span class="cost" id="scScan" style="right:12px">O(总fd) 全问一遍</span><span class="scan-ptr" id="kPtr">scan ▾</span>'+cellsHTML('sk')+'</div>';
    h+='<div class="sel-box" id="sbScan" style="top:312px"><span class="hdr">用户态 · FD_ISSET 再遍历</span><span class="cost" id="scUser" style="right:12px">O(maxfd) 再扫一遍</span><span class="scan-ptr b" id="uPtr">FD_ISSET ▾</span>'+cellsHTML('sc')+'</div>';
    h+='<svg class="arr-layer" id="selSvg" preserveAspectRatio="none">'+Object.keys(WIRES).map(trioHTML).join('')+'</svg>';
    h+='<span class="wlabel danger" id="sl1">整份拷贝 · 每次调用</span>';
    h+='<span class="wlabel danger" id="sl2">返回 n=2 · 集合被破坏</span>';
    viz.innerHTML='<div class="vcap"><b>select 工作流</b>：组装 → 拷贝进内核 → 线性扫描 → 用户再找就绪</div><div class="stage" id="selStage">'+h+'</div>';
    layout();observer=new ResizeObserver(layout);observer.observe(el('selStage'));
  }
  function paint(s){
    motion.clear();layout();
    const schedule=motion.schedule;
    const on=id=>el(id).classList.add('lit');
    ['sbUser','sbKern','sbScan'].forEach(id=>el(id).classList.remove('lit'));
    ['scRe','scCap','scScan','scUser'].forEach(id=>el(id).classList.remove('lit'));
    el('kPtr').classList.remove('on');el('uPtr').classList.remove('on');
    for(let i=0;i<8;i++){setCell('su',i,'','0');setCell('sk',i,'ghost','0');setCell('sc',i,'ghost','0');}
    const want=new Set(s.wires);
    Object.entries(WIRES).forEach(([id,color])=>{
      const lbl=el(LABELS[id]);
      if(want.has(id)){
        if(!litW.has(id))schedule(()=>{drawW(motion,id,color);lbl.classList.add('on');},140);
        else{setW(id,'on',color);lbl.classList.add('on');}
      }else{setW(id,want.size?'':'hint',color);lbl.classList.remove('on');}
    });
    litW=want;
    const kernSet=()=>{for(let i=0;i<8;i++)setCell('sk',i,'set','1');};
    const kernBroken=()=>{for(let i=0;i<8;i++)setCell('sk',i,READY.includes(FDS[i])?'ready':'dim',READY.includes(FDS[i])?'1':'0');};
    const userSet=()=>{for(let i=0;i<8;i++)setCell('su',i,'set','1');};
    if(s.k==='hold'){on('sbUser');}
    if(s.k==='build'){
      on('sbUser');
      for(let i=0;i<8;i++)schedule(()=>setCell('su',i,'set','1'),120+i*90);
    }
    if(s.k==='copy'){
      on('sbUser');on('sbKern');userSet();el('scRe').classList.add('lit');
      for(let i=0;i<8;i++)schedule(()=>setCell('sk',i,'set','1'),420+i*70);
    }
    if(s.k==='scan'){
      on('sbUser');on('sbKern');userSet();kernSet();
      el('scRe').classList.add('lit');el('scScan').classList.add('lit');
      const ptr=el('kPtr');ptr.classList.add('on');
      for(let i=0;i<8;i++)schedule(()=>{
        ptr.style.left=(cellX(i)+28)+'px';
        setCell('sk',i,READY.includes(FDS[i])?'ready':'dim','1');
      },160+i*180);
    }
    if(s.k==='user'){
      on('sbUser');on('sbKern');on('sbScan');userSet();kernBroken();
      ['scRe','scScan','scUser'].forEach(id=>el(id).classList.add('lit'));
      const ptr=el('uPtr');ptr.classList.add('on');
      for(let i=0;i<8;i++)schedule(()=>{
        ptr.style.left=(cellX(i)+28)+'px';
        setCell('sc',i,READY.includes(FDS[i])?'ready':'dim',READY.includes(FDS[i])?'1':'0');
      },420+i*160);
    }
    if(s.k==='rebuild'){
      on('sbUser');on('sbKern');on('sbScan');kernBroken();
      for(let i=0;i<8;i++)setCell('sc',i,READY.includes(FDS[i])?'ready':'dim',READY.includes(FDS[i])?'1':'0');
      ['scRe','scCap','scScan','scUser'].forEach(id=>el(id).classList.add('lit'));
      for(let i=0;i<8;i++)schedule(()=>setCell('su',i,'set','1'),200+i*80);
    }
  }
  function cancel(){motion.clear();if(observer){observer.disconnect();observer=null;}}
  return {id:'select',label:'select 工作流',sub:'拷贝 · 扫描 · 再遍历',steps,mount,paint,cancel,code};
})();

/* ========== 场景 2：epoll 工作流 ========== */
const epollScene=(()=>{
  const code=codeOf([
    'epfd = epoll_create1(0);',
    'epoll_ctl(epfd, EPOLL_CTL_ADD, fd, &ev);',
    'n = epoll_wait(epfd, evs, MAX, -1);',
    '<span class="cmt">// 只返回就绪的 n 个</span>',
    '<span class="kw">for</span> (i = 0; i < n; ++i)',
    '  handle(evs[i].data.fd);'
  ]);
  const NODES={n9:[180,64],n5:[90,132],n13:[270,132],n3:[44,200],n7:[136,200],n11:[224,200],n15:[306,200],n17:[338,258]};
  const EDGES=[['n9','n5'],['n9','n13'],['n5','n3'],['n5','n7'],['n13','n11'],['n13','n15'],['n15','n17']];
  const ADD_ORDER=['n9','n5','n13','n3','n7','n11','n15','n17'];
  const steps=[
    {k:'create',title:'步骤 0 · epoll_create1 建实例',chip:'实例',chipC:'cg',lines:[0],wires:[],
     desc:'<code>epoll_create1</code> 在内核里建一个 epoll 实例，内部两套结构：<span class="gr">红黑树</span>存放全部被监控 fd，<span class="hb">就绪链表</span>只挂真正有事件的 fd。'},
    {k:'add',title:'步骤 1 · epoll_ctl ADD：注册一次，常驻内核',chip:'注册',chipC:'cg',lines:[1],wires:[],
     desc:'8 个 fd 逐个 <code>EPOLL_CTL_ADD</code> 挂进红黑树（增删改查 O(log n)）。<b>注册只做一次</b>——之后每轮 epoll_wait 都不需要再传监控集，对照 select 的每轮全量拷贝。'},
    {k:'ev1',title:'步骤 2 · fd=5 数据到达：回调挂就绪链表',chip:'事件驱动',chipC:'ch',lines:[],wires:['ew5'],
     desc:'网卡数据到达 fd=5，内核协议栈的<span class="hb">回调</span>把它的节点挂上就绪链表。<b>不是扫描发现的，是事件送上门的</b>——这是 epoll 与 select 的本质区别。'},
    {k:'ev2',title:'步骤 3 · fd=13 数据到达：同样挂链',chip:'事件驱动',chipC:'ch',lines:[],wires:['ew5','ew13'],
     desc:'fd=13 就绪，同样由回调挂进链表。此刻就绪链表长度 = 2，与「总共监控多少 fd」<b>无关</b>——监控 1 万个 fd 也只挂就绪的这几个。'},
    {k:'wait',title:'步骤 4 · epoll_wait 只搬运就绪链表',chip:'返回就绪',chipC:'cb',lines:[2,3],wires:['ew5','ew13','ewv'],
     desc:'<code>epoll_wait</code> 把就绪链表内容拷到 <code>events</code> 数组返回。用户拿到的<span class="bl">全是就绪 fd</span>，直接遍历 n=2 个处理，没有二次全量扫描。'},
    {k:'next',title:'步骤 5 · 下一轮：监控集不动，无需重建',chip:'常驻',chipC:'cg',lines:[4,5],wires:[],
     desc:'处理完回到下一轮 <code>epoll_wait</code>：红黑树<span class="gr">原封不动</span>，就绪链表清空重新收集。一轮代价主要 ∝ <b>就绪数</b>而非总连接数——这就是 epoll 高并发优势的来源。'},
  ];
  const WIRES={ew5:'amber',ew13:'amber',ewv:'blue'};
  const LABELS={ew5:'el5',ewv:'elv'};
  let litW=new Set(),motion=motionKit(),observer=null;
  function layout(){
    const stage=el('epStage'),svg=el('epSvg');if(!stage||!svg)return;
    const sr=stage.getBoundingClientRect();
    svg.setAttribute('viewBox',`0 0 ${sr.width} ${sr.height}`);
    const n5=relRect(sr,'n5'),n13=relRect(sr,'n13'),r1=relRect(sr,'lr1'),r2=relRect(sr,'lr2'),
          list=relRect(sr,'ebList'),ev=relRect(sr,'ebEv');
    bezierArrow('ew5',n5.r,n5.cy,r1.l,r1.cy);
    bezierArrow('ew13',n13.r,n13.cy,r2.l,r2.cy);
    polyArrow('ewv',[{x:list.cx,y:list.b},{x:list.cx,y:ev.t}]);
    placeLabel('el5',(n5.r+r1.l)/2,n5.cy-28);
    placeLabel('elv',list.cx-84,(list.b+ev.t)/2);
  }
  function mount(){
    cancel();litW=new Set();
    let h='';
    h+='<div class="ep-box" id="ebTree" style="left:16px;top:36px;width:360px;height:280px"><span class="hdr">内核 · 红黑树（监控集）</span><span class="tag" id="etTag">注册一次 · 常驻</span>';
    h+='<svg class="arr-layer" viewBox="0 0 360 280" preserveAspectRatio="none">';
    EDGES.forEach(([a,b],i)=>{const [x1,y1]=NODES[a],[x2,y2]=NODES[b];h+=`<line id="te${i}" class="tedge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;});
    h+='</svg>';
    Object.entries(NODES).forEach(([id,[x,y]])=>{h+=`<div class="tnode" id="${id}" style="left:${x}px;top:${y}px">${id.slice(1)}</div>`;});
    h+='</div>';
    h+='<div class="ep-box" id="ebList" style="left:400px;top:36px;width:216px;height:150px"><span class="hdr">就绪链表</span>';
    h+='<div class="lrow" id="lrEmpty" style="top:44px;border-style:dashed;background:transparent;color:var(--faint)">empty</div>';
    h+='<div class="lrow" id="lr1" style="top:44px">fd=5 · EPOLLIN</div>';
    h+='<div class="lrow" id="lr2" style="top:86px">fd=13 · EPOLLIN</div>';
    h+='</div>';
    h+='<div class="ep-box" id="ebEv" style="left:400px;top:226px;width:216px;height:150px"><span class="hdr">用户态 · events[n]</span>';
    h+='<div class="lrow" id="ev1" style="top:44px">events[0] · fd=5</div>';
    h+='<div class="lrow" id="ev2" style="top:86px">events[1] · fd=13</div>';
    h+='</div>';
    h+='<span class="ep-note" id="epNote"></span>';
    h+='<svg class="arr-layer" id="epSvg" preserveAspectRatio="none">'+Object.keys(WIRES).map(trioHTML).join('')+'</svg>';
    h+='<span class="wlabel amber" id="el5">回调挂链 · 非扫描</span>';
    h+='<span class="wlabel blue" id="elv">只搬就绪的 n 个</span>';
    viz.innerHTML='<div class="vcap"><b>epoll 工作流</b>：红黑树常驻 · 回调挂就绪链表 · epoll_wait 只返回就绪</div><div class="stage" id="epStage">'+h+'</div>';
    layout();observer=new ResizeObserver(layout);observer.observe(el('epStage'));
  }
  function paint(s){
    motion.clear();layout();
    const schedule=motion.schedule;
    ['ebTree','ebList','ebEv'].forEach(id=>el(id).classList.remove('lit'));
    el('etTag').classList.remove('lit');
    ADD_ORDER.forEach(id=>el(id).className='tnode');
    EDGES.forEach((_,i)=>el('te'+i).classList.remove('on'));
    ['lr1','lr2','ev1','ev2','lrEmpty'].forEach(id=>el(id).classList.remove('on','hot','done','ok'));
    el('epNote').classList.remove('on');
    const want=new Set(s.wires);
    Object.entries(WIRES).forEach(([id,color])=>{
      const lbl=LABELS[id]?el(LABELS[id]):null;
      if(want.has(id)){
        if(!litW.has(id))schedule(()=>{drawW(motion,id,color);if(lbl)lbl.classList.add('on');},160);
        else{setW(id,'on',color);if(lbl)lbl.classList.add('on');}
      }else{setW(id,want.size?'':'hint',color);if(lbl)lbl.classList.remove('on');}
    });
    litW=want;
    const treeOn=()=>{ADD_ORDER.forEach(id=>el(id).classList.add('on'));EDGES.forEach((_,i)=>el('te'+i).classList.add('on'));};
    if(s.k==='create'){el('ebTree').classList.add('lit');el('ebList').classList.add('lit');el('lrEmpty').classList.add('on');}
    if(s.k==='add'){
      el('ebTree').classList.add('lit');el('ebList').classList.add('lit');el('lrEmpty').classList.add('on');
      el('etTag').classList.add('lit');
      ADD_ORDER.forEach((id,i)=>schedule(()=>el(id).classList.add('on'),120+i*110));
      EDGES.forEach((_,i)=>schedule(()=>el('te'+i).classList.add('on'),240+i*110));
    }
    if(s.k==='ev1'){
      el('ebTree').classList.add('lit');el('ebList').classList.add('lit');el('etTag').classList.add('lit');
      treeOn();el('n5').classList.add('hot');
      schedule(()=>el('lr1').classList.add('on','hot'),420);
    }
    if(s.k==='ev2'){
      el('ebTree').classList.add('lit');el('ebList').classList.add('lit');el('etTag').classList.add('lit');
      treeOn();el('n5').classList.add('hot');el('n13').classList.add('hot');
      el('lr1').classList.add('on','hot');
      schedule(()=>el('lr2').classList.add('on','hot'),420);
    }
    if(s.k==='wait'){
      el('ebTree').classList.add('lit');el('ebList').classList.add('lit');el('ebEv').classList.add('lit');
      el('etTag').classList.add('lit');
      treeOn();el('n5').classList.add('hot');el('n13').classList.add('hot');
      el('lr1').classList.add('on','done');el('lr2').classList.add('on','done');
      schedule(()=>el('ev1').classList.add('on','ok'),520);
      schedule(()=>el('ev2').classList.add('on','ok'),700);
    }
    if(s.k==='next'){
      el('ebTree').classList.add('lit');el('ebEv').classList.add('lit');el('etTag').classList.add('lit');
      treeOn();
      el('ev1').classList.add('on','ok');el('ev2').classList.add('on','ok');
      el('lrEmpty').classList.add('on');
      schedule(()=>el('epNote').classList.add('on'),300);
      el('epNote').textContent='树常驻不重建 · 链表清空再收集 · 代价 ∝ 就绪数';
    }
  }
  function cancel(){motion.clear();if(observer){observer.disconnect();observer=null;}}
  return {id:'epoll',label:'epoll 工作流',sub:'红黑树 · 就绪链表',steps,mount,paint,cancel,code};
})();

    {k:1,title:'步骤 1 · 集合传递：每轮拷贝 vs 注册常驻',chip:'集合传递',chipC:'cb',lines:[1,3],
     desc:'select <span class="dg">每次调用</span>都把整份 fd_set 在用户态和内核态之间搬运；epoll 用 <code>epoll_ctl</code> <span class="gr">注册一次</span>后监控集常驻内核红黑树。'},
    {k:2,title:'步骤 2 · 事件检测：轮询 vs 回调',chip:'事件检测',chipC:'ch',lines:[1,3],
     desc:'select 靠内核<span class="dg">线性问一遍</span>所有 fd；epoll 反过来——数据到达时内核回调<span class="gr">主动把就绪 fd 挂上链表</span>。轮询变事件驱动。'},
    {k:3,title:'步骤 3 · 返回形态：再扫一遍 vs 直接可用',chip:'返回形态',chipC:'cg',lines:[2,4],
     desc:'select 返回后集合已被改写，用户还要 <code>FD_ISSET</code> <span class="dg">再遍历找就绪</span>；epoll 返回的 <code>events</code> 数组<span class="gr">全是就绪项</span>，遍历 n 个直接处理。'},
    {k:4,title:'步骤 4 · 上限与选型：Linux 高并发首选 epoll',chip:'选型',chipC:'cg',lines:[2,4],
     desc:'select 受 <code>FD_SETSIZE≈1024</code> 硬上限；epoll 代价主要 ∝ 就绪数——<b>勿机械背「永远 O(1)」</b>。记住分工：epoll 发现「谁就绪」，Reactor 负责「分发给谁」（见 13.6）。'},
  ];
  let motion=motionKit();
  function mount(){
    let h='<span class="vs-head sel" style="left:200px">select</span><span class="vs-head ep" style="left:462px">epoll</span>';
    ROWS.forEach((r,i)=>{
      h+=`<div class="vs-row" id="vr${i}" style="top:${44+i*84}px">`;
      h+=`<span class="vs-lab">${r.lab}</span>`;
      h+=`<div class="vs-c sel">${r.sel}</div>`;
      h+=`<div class="vs-c ep">${r.ep}</div>`;
      h+='</div>';
    });
    h+='<span class="vs-note" id="vsNote">epoll 发现「谁就绪」 · Reactor 分发「给谁」</span>';
    viz.innerHTML='<div class="vcap"><b>对照总结</b>：集合传递 · 事件检测 · 返回形态 · 上限与选型</div><div class="stage" id="vsStage">'+h+'</div>';
  }
  function paint(s){
    motion.clear();
    ROWS.forEach((_,i)=>{
      el('vr'+i).className='vs-row'+(s.k>0&&i===s.k-1?' lit':(s.k>0&&i<s.k-1?' was':''));
    });
    el('vsNote').className='vs-note'+(s.k===4?' on':'');
  }
  return {id:'versus',label:'对照总结',sub:'四条差异 · 选型',steps,mount,paint,code};
})();

/* ========== 引擎 ========== */
const SCENES=[selectScene,epollScene,versusScene];
const tabsBox=document.getElementById('tabs');
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stAct=document.getElementById('stAct'),stDesc=document.getElementById('stDesc');
const codeBox=document.getElementById('codeBox'),readout=document.getElementById('readout'),dotsBox=document.getElementById('dots');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');

SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML='<span class="t">'+sc.label+'</span><span class="s">'+sc.sub+'</span>';b.onclick=()=>{stop();switchScene(i);};tabsBox.appendChild(b);});
let si=0,cur=0,dotEls=[];
function switchScene(i){
  SCENES[si]?.cancel?.();
  si=i;cur=0;
  [...tabsBox.children].forEach((t,idx)=>t.classList.toggle('on',idx===si));
  SCENES[si].mount();codeBox.innerHTML=SCENES[si].code;
  dotsBox.innerHTML='';dotEls=[];
  SCENES[si].steps.forEach((s,idx)=>{const d=document.createElement('button');d.className='dot';d.title=s.title;d.onclick=()=>{stop();go(idx);};dotsBox.appendChild(d);dotEls.push(d);});
  go(0);
}
function go(i){
  const steps=SCENES[si].steps;cur=Math.max(0,Math.min(steps.length-1,i));const s=steps[cur];
  SCENES[si].paint(s);
  codeBox.querySelectorAll('.cl').forEach((ln,idx)=>ln.classList.toggle('hl',!!(s.lines&&s.lines.includes(idx))));
  stTitle.textContent=SCENES[si].label;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;stAct.innerHTML='▸ '+s.title;stDesc.innerHTML=s.desc;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(steps.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
  try{history.replaceState(null,'','#scene='+SCENES[si].id+'&step='+cur);}catch(e){}
  if(cur===steps.length-1)stop();
}
let timer=null,ms=2500;
function play(){const steps=SCENES[si].steps;if(cur===steps.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<SCENES[si].steps.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const hm=location.hash.match(/scene=(\w+)/),sm=location.hash.match(/step=(\d+)/);
let initScene=0;if(hm){const idx=SCENES.findIndex(x=>x.id===hm[1]);if(idx>=0)initScene=idx;}
switchScene(initScene);if(sm)go(+sm[1]);
</script>
