<svg xmlns="http://www.w3.org/2000/svg" width="932" height="362" viewBox="-16 -16 932 362" role="img" aria-label="MIPS 스택과 $sp. 높은 주소를 위에 그렸다. $sp는 아직 아무것도 쓰지 않은 다음 빈 슬롯을 가리키고, 실제 스택 최상단은 $sp + 4에 있다. push는 sw $a0 0($sp)로 빈 슬롯에 먼저 저장한 뒤 addiu $sp $sp -4로 $sp를 내린다. pop은 4($sp)에서 읽은 뒤 $sp를 4 올린다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .band { fill: none; stroke: #D97757; stroke-width: 1.6; stroke-dasharray: 5 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="362" rx="14" fill="#F0EEE6"/>
  <defs><marker id="cg-stack-sp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-stack-sp-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-stack-sp-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="470" height="330" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">$sp는 다음 빈 슬롯, 최상단은 $sp + 4</text>
  <text class="sm muted" x="16" y="46" xml:space="preserve">스택은 낮은 주소 방향(그림의 아래)으로 자란다</text>
  <text class="sm muted" x="210" y="76" text-anchor="middle" xml:space="preserve">높은 주소</text>
  <rect class="plain" x="130" y="86" width="160" height="40" rx="3"/>
  <text class="sm" x="210.0" y="110.0" text-anchor="middle" xml:space="preserve">이전 스택 내용</text>
  <rect class="acc" x="130" y="126" width="160" height="40" rx="3"/>
  <text class="sm" x="210.0" y="150.0" text-anchor="middle" xml:space="preserve">현재 스택 최상단</text>
  <rect class="ghost" x="130" y="166" width="160" height="40" rx="3"/>
  <text class="sm muted" x="210.0" y="190.0" text-anchor="middle" xml:space="preserve">(다음 빈 슬롯)</text>
  <rect class="box" x="130" y="206" width="160" height="40" rx="3"/>
  <text class="sm muted" x="210.0" y="230.0" text-anchor="middle" xml:space="preserve">...</text>
  <text class="sm muted" x="210" y="262" text-anchor="middle" xml:space="preserve">낮은 주소</text>
  <text class="mono sm b" x="100" y="150" text-anchor="end" xml:space="preserve">$sp + 4</text>
  <line class="ln" x1="106" y1="146" x2="126" y2="146" marker-end="url(#cg-stack-sp-a)"/>
  <text class="mono sm b" x="100" y="190" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln-acc" x1="106" y1="186" x2="126" y2="186" marker-end="url(#cg-stack-sp-acc)"/>
  <line class="ln" x1="338" y1="146" x2="296" y2="146" marker-end="url(#cg-stack-sp-a)"/>
  <text class="sm" x="344" y="150" xml:space="preserve">실제 스택 top 위치</text>
  <line class="ln-acc" x1="338" y1="186" x2="296" y2="186" marker-end="url(#cg-stack-sp-acc)"/>
  <text class="sm acc-t" x="344" y="190" xml:space="preserve">push가 쓸 자리</text>
  <text class="mono sm" x="16" y="292" xml:space="preserve">push: 먼저 sw $a0 0($sp), 그다음 $sp −= 4</text>
  <text class="mono sm" x="16" y="314" xml:space="preserve">pop:  먼저 lw $t1 4($sp), 그다음 $sp += 4</text>
  <rect class="box" x="490" y="0" width="410" height="330" rx="8"/>
  <text class="b" x="506" y="26" xml:space="preserve">push 두 단계: 저장이 먼저, 이동은 나중</text>
  <text class="sm muted" x="506" y="46" xml:space="preserve">$a0 = 7을 push한다. S = push 전 $sp 값</text>
  <text class="sm b" x="568" y="78" text-anchor="middle" xml:space="preserve">① push 전</text>
  <rect class="plain" x="536" y="112" width="64" height="32" rx="3"/>
  <text class="mono sm muted" x="568.0" y="132.0" text-anchor="middle" xml:space="preserve">이전 값</text>
  <text class="mono sm muted" x="604" y="132" xml:space="preserve">S+4</text>
  <rect class="ghost" x="536" y="144" width="64" height="32" rx="3"/>
  <text class="mono sm muted" x="604" y="164" xml:space="preserve">S</text>
  <rect class="ghost" x="536" y="176" width="64" height="32" rx="3"/>
  <text class="mono sm muted" x="604" y="196" xml:space="preserve">S−4</text>
  <text class="mono sm b" x="522" y="164" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln" x1="524" y1="160" x2="534" y2="160" marker-end="url(#cg-stack-sp-a)"/>
  <text class="sm b" x="696" y="78" text-anchor="middle" xml:space="preserve">② 저장</text>
  <text class="mono sm" x="696" y="96" text-anchor="middle" xml:space="preserve">sw $a0 0($sp)</text>
  <rect class="plain" x="664" y="112" width="64" height="32" rx="3"/>
  <text class="mono sm muted" x="696.0" y="132.0" text-anchor="middle" xml:space="preserve">이전 값</text>
  <text class="mono sm muted" x="732" y="132" xml:space="preserve">S+4</text>
  <rect class="acc" x="664" y="144" width="64" height="32" rx="3"/>
  <text class="mono sm" x="696.0" y="164.0" text-anchor="middle" xml:space="preserve">7</text>
  <text class="mono sm muted" x="732" y="164" xml:space="preserve">S</text>
  <rect class="ghost" x="664" y="176" width="64" height="32" rx="3"/>
  <text class="mono sm muted" x="732" y="196" xml:space="preserve">S−4</text>
  <text class="mono sm b" x="650" y="164" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln" x1="652" y1="160" x2="662" y2="160" marker-end="url(#cg-stack-sp-a)"/>
  <text class="sm b" x="824" y="78" text-anchor="middle" xml:space="preserve">③ 이동</text>
  <text class="mono sm" x="824" y="96" text-anchor="middle" xml:space="preserve">addiu $sp $sp -4</text>
  <rect class="plain" x="792" y="112" width="64" height="32" rx="3"/>
  <text class="mono sm muted" x="824.0" y="132.0" text-anchor="middle" xml:space="preserve">이전 값</text>
  <text class="mono sm muted" x="860" y="132" xml:space="preserve">S+4</text>
  <rect class="acc" x="792" y="144" width="64" height="32" rx="3"/>
  <text class="mono sm" x="824.0" y="164.0" text-anchor="middle" xml:space="preserve">7</text>
  <text class="mono sm muted" x="860" y="164" xml:space="preserve">S</text>
  <rect class="ghost" x="792" y="176" width="64" height="32" rx="3"/>
  <text class="mono sm muted" x="860" y="196" xml:space="preserve">S−4</text>
  <text class="mono sm b acc-t" x="778" y="196" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln-acc" x1="780" y1="192" x2="790" y2="192" marker-end="url(#cg-stack-sp-acc)"/>
  <text class="sm" x="506" y="238" xml:space="preserve">② 뒤에도 $sp는 7이 든 칸을 가리킨다. ③에서 $sp가</text>
  <text class="sm" x="506" y="258" xml:space="preserve">한 칸 내려가야 7이 $sp + 4, 즉 최상단이 된다</text>
  <text class="sm muted" x="506" y="288" xml:space="preserve">pop은 거꾸로: lw $t1 4($sp)로 읽고 $sp를 4 올린다</text>
  <text class="sm muted" x="506" y="308" xml:space="preserve">읽은 칸의 값은 지우지 않고 다음 push가 덮어쓴다</text>
</svg>
