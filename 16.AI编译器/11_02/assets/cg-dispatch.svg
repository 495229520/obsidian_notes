<svg xmlns="http://www.w3.org/2000/svg" width="992" height="436" viewBox="-16 -16 992 436" role="img" aria-label="Cool 객체 배치와 디스패치 테이블. 오프셋 0에 클래스 태그, 4에 크기, 8에 디스패치 포인터, 12부터 속성 a, d, 그리고 B의 b나 C의 c가 온다. 디스패치 포인터는 클래스별 메서드 테이블을 가리킨다. f는 모든 테이블에서 오프셋 0에 있고 A와 C는 A의 f를, B는 B의 f를 가리킨다. g와 h는 오프셋 4에 붙는다. 아래는 같은 클래스를 g++로 컴파일해 잰 값이다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .band { fill: none; stroke: #D97757; stroke-width: 1.6; stroke-dasharray: 5 3; }
  </style>
  <rect x="-16" y="-16" width="992" height="436" rx="14" fill="#F0EEE6"/>
  <defs><marker id="cg-dispatch-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-dispatch-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-dispatch-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="18" xml:space="preserve">Cool 객체 배치 (슬라이드 75)</text>
  <text class="b" x="640" y="18" xml:space="preserve">디스패치 테이블 (슬라이드 82)</text>
  <text class="mono sm muted" x="76.0" y="42" text-anchor="middle" xml:space="preserve">0</text>
  <text class="mono sm muted" x="148.0" y="42" text-anchor="middle" xml:space="preserve">4</text>
  <text class="mono sm muted" x="220.0" y="42" text-anchor="middle" xml:space="preserve">8</text>
  <text class="mono sm muted" x="292.0" y="42" text-anchor="middle" xml:space="preserve">12</text>
  <text class="mono sm muted" x="364.0" y="42" text-anchor="middle" xml:space="preserve">16</text>
  <text class="mono sm muted" x="436.0" y="42" text-anchor="middle" xml:space="preserve">20</text>
  <text class="mono b" x="14" y="74" text-anchor="middle" xml:space="preserve">A</text>
  <rect class="plain" x="40" y="54" width="72" height="30" rx="3"/>
  <text class="mono sm" x="76.0" y="73.0" text-anchor="middle" xml:space="preserve">Atag</text>
  <rect class="plain" x="112" y="54" width="72" height="30" rx="3"/>
  <text class="mono sm" x="148.0" y="73.0" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="blue" x="184" y="54" width="72" height="30" rx="3"/>
  <text class="mono sm" x="220.0" y="73.0" text-anchor="middle" xml:space="preserve">•</text>
  <rect class="acc" x="256" y="54" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="292.0" y="73.0" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="acc" x="328" y="54" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="364.0" y="73.0" text-anchor="middle" xml:space="preserve">d</text>
  <text class="mono b" x="14" y="120" text-anchor="middle" xml:space="preserve">B</text>
  <rect class="plain" x="40" y="100" width="72" height="30" rx="3"/>
  <text class="mono sm" x="76.0" y="119.0" text-anchor="middle" xml:space="preserve">Btag</text>
  <rect class="plain" x="112" y="100" width="72" height="30" rx="3"/>
  <text class="mono sm" x="148.0" y="119.0" text-anchor="middle" xml:space="preserve">6</text>
  <rect class="blue" x="184" y="100" width="72" height="30" rx="3"/>
  <text class="mono sm" x="220.0" y="119.0" text-anchor="middle" xml:space="preserve">•</text>
  <rect class="acc" x="256" y="100" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="292.0" y="119.0" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="acc" x="328" y="100" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="364.0" y="119.0" text-anchor="middle" xml:space="preserve">d</text>
  <rect class="box" x="400" y="100" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="436.0" y="119.0" text-anchor="middle" xml:space="preserve">b</text>
  <text class="mono b" x="14" y="166" text-anchor="middle" xml:space="preserve">C</text>
  <rect class="plain" x="40" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm" x="76.0" y="165.0" text-anchor="middle" xml:space="preserve">Ctag</text>
  <rect class="plain" x="112" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm" x="148.0" y="165.0" text-anchor="middle" xml:space="preserve">6</text>
  <rect class="blue" x="184" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm" x="220.0" y="165.0" text-anchor="middle" xml:space="preserve">•</text>
  <rect class="acc" x="256" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="292.0" y="165.0" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="acc" x="328" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="364.0" y="165.0" text-anchor="middle" xml:space="preserve">d</text>
  <rect class="box" x="400" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="436.0" y="165.0" text-anchor="middle" xml:space="preserve">c</text>
  <text class="sm muted" x="76.0" y="196" text-anchor="middle" xml:space="preserve">클래스 태그</text>
  <text class="sm muted" x="148.0" y="196" text-anchor="middle" xml:space="preserve">크기(워드)</text>
  <text class="sm muted" x="220.0" y="196" text-anchor="middle" xml:space="preserve">테이블 주소</text>
  <text class="sm muted" x="364.0" y="196" text-anchor="middle" xml:space="preserve">속성: 부모 것 먼저, 자기 것 뒤에</text>
  <text class="mono sm muted" x="730" y="42" text-anchor="middle" xml:space="preserve">0</text>
  <text class="mono sm muted" x="810" y="42" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="acc" x="690" y="54" width="80" height="30" rx="3"/>
  <text class="mono sm b" x="730.0" y="73.0" text-anchor="middle" xml:space="preserve">fA</text>
  <text class="sm muted" x="780" y="74" xml:space="preserve">A 테이블</text>
  <rect class="acc" x="690" y="100" width="80" height="30" rx="3"/>
  <text class="mono sm b" x="730.0" y="119.0" text-anchor="middle" xml:space="preserve">fB</text>
  <rect class="blue" x="770" y="100" width="80" height="30" rx="3"/>
  <text class="mono sm b" x="810.0" y="119.0" text-anchor="middle" xml:space="preserve">g</text>
  <text class="sm muted" x="860" y="120" xml:space="preserve">B 테이블</text>
  <rect class="acc" x="690" y="146" width="80" height="30" rx="3"/>
  <text class="mono sm b" x="730.0" y="165.0" text-anchor="middle" xml:space="preserve">fA</text>
  <rect class="blue" x="770" y="146" width="80" height="30" rx="3"/>
  <text class="mono sm b" x="810.0" y="165.0" text-anchor="middle" xml:space="preserve">h</text>
  <text class="sm muted" x="860" y="166" xml:space="preserve">C 테이블</text>
  <polyline class="ln-blue" points="220.0,84 220.0,92 626,92 626,69 686,69" marker-end="url(#cg-dispatch-blue)"/>
  <polyline class="ln-blue" points="220.0,130 220.0,138 618,138 618,115 686,115" marker-end="url(#cg-dispatch-blue)"/>
  <polyline class="ln-blue" points="220.0,176 220.0,184 610,184 610,161 686,161" marker-end="url(#cg-dispatch-blue)"/>
  <text class="sm acc-t" x="690" y="202" xml:space="preserve">f는 어느 테이블에서나 오프셋 0</text>
  <text class="sm muted" x="690" y="220" xml:space="preserve">바뀌는 것은 칸에 든 주소뿐</text>
  <rect class="box" x="0" y="238" width="960" height="166" rx="8"/>
  <text class="sm b" x="16" y="262" xml:space="preserve">같은 클래스를 C++로 옮겨 g++ 13.3 (x86-64)으로 컴파일한 실측</text>
  <text class="sm" x="16" y="290" xml:space="preserve">객체: vptr@0, a@8, d@12, b·c@16  /  sizeof A = 16, B = 24, C = 24  (b 뒤 4바이트는 8바이트 정렬용 패딩)</text>
  <text class="sm" x="16" y="318" xml:space="preserve">vtable (-fdump-lang-class): A = [A::f]   B = [B::f, B::g]   C = [A::f, C::h]   (첫 칸 앞에 offset-to-top과 RTTI 두 칸이 더 있다)</text>
  <text class="mono sm" x="16" y="346" xml:space="preserve">int callf(A* p) { return p-&gt;f(); }  →  -O2: movq (%rdi), %rax ; jmp *(%rax)   (vptr을 읽고 0번 칸으로 점프)</text>
  <text class="sm" x="16" y="374" xml:space="preserve">같은 callf가 A, B, C 객체에 대해 각각 1, 0, 1을 돌려준다 (A::f, B::f, A::f가 실행됨)</text>
</svg>
