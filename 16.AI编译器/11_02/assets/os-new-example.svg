<svg xmlns="http://www.w3.org/2000/svg" width="992" height="404" viewBox="-16 -16 992 404" role="img" aria-label="왼쪽: class A { a : Int ← b + 1; c : Int ← self.getb(); b : Int ← 5; o : A; }에서 new A의 저장소 변화. 기본값을 먼저 채운 S₁에서 a, c, b는 0, o는 void다. a ← b + 1은 아직 0인 b를 읽어 1, c ← self.getb()도 0을 읽어 0, 마지막에 b가 5가 된다. o는 초기화식이 없어 void로 남는다. 오른쪽: 부모 P의 copy()가 new SELF_TYPE을 실행할 때 so가 C 객체이면 T₀ = C가 되어 C(n = l₃, m = l₄)가 만들어진다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="992" height="404" rx="14" fill="#F0EEE6"/>
  <defs><marker id="os-new-example-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-new-example-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-new-example-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="570" height="372" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">기본값을 먼저 채우는 이유: new A의 저장소</text>
  <text class="mono sm" x="16" y="52" xml:space="preserve">class A {</text>
  <text class="mono sm" x="16" y="69" xml:space="preserve">  a : Int ← b + 1;</text>
  <text class="sm muted" x="220" y="69" xml:space="preserve">-- b는 아직 기본값 0</text>
  <text class="mono sm" x="16" y="86" xml:space="preserve">  c : Int ← self.getb();</text>
  <text class="sm muted" x="220" y="86" xml:space="preserve">-- getb()가 읽는 b도 0</text>
  <text class="mono sm" x="16" y="103" xml:space="preserve">  b : Int ← 5;</text>
  <text class="mono sm" x="16" y="120" xml:space="preserve">  o : A;</text>
  <text class="sm muted" x="220" y="120" xml:space="preserve">-- 초기화식 없음</text>
  <text class="mono sm" x="16" y="137" xml:space="preserve">  getb() : Int { b };</text>
  <text class="mono sm" x="16" y="154" xml:space="preserve">};</text>
  <text class="sm b" x="135.0" y="190" text-anchor="middle" xml:space="preserve">S₁ (기본값)</text>
  <text class="sm b" x="251.0" y="190" text-anchor="middle" xml:space="preserve">a ← b + 1 뒤</text>
  <text class="sm b" x="373.0" y="190" text-anchor="middle" xml:space="preserve">c ← self.getb() 뒤</text>
  <text class="sm b" x="497.0" y="190" text-anchor="middle" xml:space="preserve">b ← 5 뒤 = S₂</text>
  <text class="mono sm" x="16" y="219" xml:space="preserve">a (l₁)</text>
  <rect class="blue" x="80" y="200" width="110" height="28" rx="3"/>
  <text class="mono sm" x="135.0" y="218.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <rect class="acc" x="196" y="200" width="110" height="28" rx="3"/>
  <text class="mono sm b" x="251.0" y="218.0" text-anchor="middle" xml:space="preserve">Int(1)</text>
  <rect class="plain" x="312" y="200" width="122" height="28" rx="3"/>
  <text class="mono sm" x="373.0" y="218.0" text-anchor="middle" xml:space="preserve">Int(1)</text>
  <rect class="plain" x="440" y="200" width="114" height="28" rx="3"/>
  <text class="mono sm" x="497.0" y="218.0" text-anchor="middle" xml:space="preserve">Int(1)</text>
  <text class="mono sm" x="16" y="247" xml:space="preserve">c (l₂)</text>
  <rect class="blue" x="80" y="228" width="110" height="28" rx="3"/>
  <text class="mono sm" x="135.0" y="246.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <rect class="plain" x="196" y="228" width="110" height="28" rx="3"/>
  <text class="mono sm" x="251.0" y="246.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <rect class="acc" x="312" y="228" width="122" height="28" rx="3"/>
  <text class="mono sm b" x="373.0" y="246.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <rect class="plain" x="440" y="228" width="114" height="28" rx="3"/>
  <text class="mono sm" x="497.0" y="246.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <text class="mono sm" x="16" y="275" xml:space="preserve">b (l₃)</text>
  <rect class="blue" x="80" y="256" width="110" height="28" rx="3"/>
  <text class="mono sm" x="135.0" y="274.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <rect class="plain" x="196" y="256" width="110" height="28" rx="3"/>
  <text class="mono sm" x="251.0" y="274.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <rect class="plain" x="312" y="256" width="122" height="28" rx="3"/>
  <text class="mono sm" x="373.0" y="274.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <rect class="acc" x="440" y="256" width="114" height="28" rx="3"/>
  <text class="mono sm b" x="497.0" y="274.0" text-anchor="middle" xml:space="preserve">Int(5)</text>
  <text class="mono sm" x="16" y="303" xml:space="preserve">o (l₄)</text>
  <rect class="blue" x="80" y="284" width="110" height="28" rx="3"/>
  <text class="mono sm" x="135.0" y="302.0" text-anchor="middle" xml:space="preserve">void</text>
  <rect class="plain" x="196" y="284" width="110" height="28" rx="3"/>
  <text class="mono sm" x="251.0" y="302.0" text-anchor="middle" xml:space="preserve">void</text>
  <rect class="plain" x="312" y="284" width="122" height="28" rx="3"/>
  <text class="mono sm" x="373.0" y="302.0" text-anchor="middle" xml:space="preserve">void</text>
  <rect class="plain" x="440" y="284" width="114" height="28" rx="3"/>
  <text class="mono sm" x="497.0" y="302.0" text-anchor="middle" xml:space="preserve">void</text>
  <text class="sm muted" x="16" y="342" xml:space="preserve">기본값이 없으면 a ← b + 1이 아직 값이 없는 위치를 읽는다 (인터프리터 변형에서 S(l) 미정의 오류).</text>
  <text class="sm muted" x="16" y="362" xml:space="preserve">D_Int = Int(0), D_Bool = Bool(false), D_String = String(0, ""), 그 밖의 클래스 = void (슬라이드 44)</text>
  <rect class="box" x="590" y="0" width="370" height="372" rx="8"/>
  <text class="b" x="606" y="26" xml:space="preserve">new SELF_TYPE은 so의 동적 클래스로</text>
  <text class="mono sm" x="606" y="52" xml:space="preserve">class P {</text>
  <text class="mono sm" x="606" y="69" xml:space="preserve">  n : Int ← 7;</text>
  <text class="mono sm" x="606" y="86" xml:space="preserve">  copy() : SELF_TYPE { new SELF_TYPE };</text>
  <text class="mono sm" x="606" y="103" xml:space="preserve">};</text>
  <text class="mono sm" x="606" y="120" xml:space="preserve">class C inherits P { m : Int ← 9; };</text>
  <text class="mono sm b" x="606" y="154" xml:space="preserve">(new C).copy()</text>
  <text class="mono sm" x="606" y="196" xml:space="preserve">copy 본문의 so = C(n = l₁, m = l₂)</text>
  <text class="mono sm" x="606" y="222" xml:space="preserve">T = SELF_TYPE이고 so가 C 객체 → T₀ = C</text>
  <text class="mono sm" x="606" y="248" xml:space="preserve">class(C) = (n : Int ← 7, m : Int ← 9)</text>
  <text class="mono sm acc-t b" x="606" y="274" xml:space="preserve">결과: C(n = l₃, m = l₄)</text>
  <text class="sm" x="606" y="304" xml:space="preserve">P에 적힌 메서드인데도 P가 아니라 C가 생긴다.</text>
  <text class="mono sm muted" x="606" y="324" xml:space="preserve">(new P).copy()는 P(n = l₂)</text>
  <text class="sm muted" x="606" y="352" xml:space="preserve">두 결과 모두 인터프리터 출력 그대로</text>
</svg>
