<svg xmlns="http://www.w3.org/2000/svg" width="972" height="334" viewBox="-16 -16 972 334" role="img" aria-label="Cool 값과 별칭. 객체 값 A(a = l₁)은 속성 a의 값이 아니라 위치 l₁을 담는다. p와 q는 서로 다른 위치 l_p, l_q에 있지만 두 위치에 든 객체 값이 같은 l₁을 가리킨다. 그래서 p.set(7)로 S(l₁)을 Int(7)로 바꾸면 q.get()도 7을 본다. 오른쪽은 값의 종류로, 일반 객체 X(a₁ = l₁, …, aₙ = lₙ), Int(5), Bool(true), String(4, &quot;Cool&quot;), void가 있다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="972" height="334" rx="14" fill="#F0EEE6"/>
  <defs><marker id="os-object-value-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-object-value-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-object-value-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="560" height="302" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">객체 값은 속성의 "위치"를 담는다</text>
  <text class="mono sm muted" x="16" y="46" xml:space="preserve">let p : A ← new A in let q : A ← p in { p.set(7); q.get(); }</text>
  <rect class="plain" x="16.0" y="77.0" width="40" height="30" rx="6"/>
  <text class="mono b" x="36" y="96.5" text-anchor="middle" xml:space="preserve">p</text>
  <line class="ln-blue" x1="58" y1="92" x2="98" y2="92" marker-end="url(#os-object-value-blue)"/>
  <rect class="blue" x="100.0" y="77.0" width="60" height="30" rx="6"/>
  <text class="mono sm" x="130" y="96.5" text-anchor="middle" xml:space="preserve">l_p</text>
  <line class="ln" x1="162" y1="92" x2="206" y2="92" marker-end="url(#os-object-value-a)"/>
  <rect class="plain" x="208.0" y="77.0" width="104" height="30" rx="6"/>
  <text class="mono sm b" x="260" y="96.5" text-anchor="middle" xml:space="preserve">A(a = l₁)</text>
  <rect class="plain" x="16.0" y="153.0" width="40" height="30" rx="6"/>
  <text class="mono b" x="36" y="172.5" text-anchor="middle" xml:space="preserve">q</text>
  <line class="ln-blue" x1="58" y1="168" x2="98" y2="168" marker-end="url(#os-object-value-blue)"/>
  <rect class="blue" x="100.0" y="153.0" width="60" height="30" rx="6"/>
  <text class="mono sm" x="130" y="172.5" text-anchor="middle" xml:space="preserve">l_q</text>
  <line class="ln" x1="162" y1="168" x2="206" y2="168" marker-end="url(#os-object-value-a)"/>
  <rect class="plain" x="208.0" y="153.0" width="104" height="30" rx="6"/>
  <text class="mono sm b" x="260" y="172.5" text-anchor="middle" xml:space="preserve">A(a = l₁)</text>
  <text class="mono sm b blue-t" x="78" y="72" text-anchor="middle" xml:space="preserve">E</text>
  <text class="mono sm b" x="184" y="72" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="blue" x="378.0" y="115.0" width="44" height="30" rx="6"/>
  <text class="mono sm" x="400" y="134.5" text-anchor="middle" xml:space="preserve">l₁</text>
  <path class="ln" d="M314.0,92.0 Q352.0,96.0 376.0,124.0" marker-end="url(#os-object-value-a)"/>
  <path class="ln" d="M314.0,168.0 Q352.0,164.0 376.0,136.0" marker-end="url(#os-object-value-a)"/>
  <line class="ln" x1="424" y1="130" x2="450" y2="130" marker-end="url(#os-object-value-a)"/>
  <rect class="acc" x="452.0" y="115.0" width="92" height="30" rx="6"/>
  <text class="mono sm" x="498" y="134.5" text-anchor="middle" xml:space="preserve">Int(5)→Int(7)</text>
  <text class="sm acc-t" x="498" y="160" text-anchor="middle" xml:space="preserve">p.set(7)이 바꿈</text>
  <line class="ln-muted" x1="16" y1="206" x2="544" y2="206"/>
  <text class="sm" x="16" y="230" xml:space="preserve">p와 q는 위치가 다르다(l_p ≠ l_q). 두 위치에 든 값이 같은 객체 값이고,</text>
  <text class="sm" x="16" y="250" xml:space="preserve">그 값이 속성 위치 l₁을 가리키므로 q.get()도 7을 본다 (인터프리터로 확인).</text>
  <text class="sm muted" x="16" y="278" xml:space="preserve">값이 위치를 담기 때문에 별칭이 생긴다. E와 S를 나눈 이유가 여기서도 드러난다.</text>
  <rect class="box" x="580" y="0" width="360" height="302" rx="8"/>
  <text class="b" x="596" y="26" xml:space="preserve">Cool 값의 종류 (슬라이드 22–23)</text>
  <text class="mono sm b acc-t" x="596" y="58" xml:space="preserve">X(a₁ = l₁, …, aₙ = lₙ)</text>
  <text class="sm muted" x="596" y="76" xml:space="preserve">클래스 X의 객체. 상속 속성 포함, 속성마다 위치</text>
  <text class="mono sm b" x="596" y="104" xml:space="preserve">Int(5)</text>
  <text class="sm muted" x="596" y="122" xml:space="preserve">정수 5. 속성 없는 클래스의 특별 표기</text>
  <text class="mono sm b" x="596" y="150" xml:space="preserve">Bool(true)</text>
  <text class="sm muted" x="596" y="168" xml:space="preserve">불리언 true</text>
  <text class="mono sm b" x="596" y="196" xml:space="preserve">String(4, "Cool")</text>
  <text class="sm muted" x="596" y="214" xml:space="preserve">길이 4인 문자열 "Cool"</text>
  <text class="mono sm b" x="596" y="242" xml:space="preserve">void</text>
  <text class="sm muted" x="596" y="260" xml:space="preserve">Object 타입의 특수 값. isvoid 말고는 연산 불가</text>
</svg>
