<svg xmlns="http://www.w3.org/2000/svg" width="792" height="276" viewBox="-16 -16 792 276" role="img" aria-label="S에서 시작해 S → (S)를 세 번 적용하고 S → ε를 한 번 적용하면 ((()))가 된다. 규칙을 한 번 적용할 때마다 여는 괄호와 닫는 괄호가 한 쌍씩 함께 생기므로 개수가 항상 같다.">
