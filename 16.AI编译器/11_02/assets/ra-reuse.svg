<svg xmlns="http://www.w3.org/2000/svg" width="932" height="268" viewBox="-16 -16 932 268" role="img" aria-label="세 줄짜리 3-주소 코드의 각 지점 생존 집합과 변수별 생존 구간. a, e, f는 서로 다른 지점에서만 살아 있어 r1 하나에 들어가고 b, c, d는 r4, r2, r3을 쓴다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="932" height="268" rx="14" fill="#F0EEE6"/>
  <defs><marker id="ra-reuse-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ra-reuse-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ra-reuse-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">지점과 생존 집합</text>
  <text class="sm muted" x="0" y="230" xml:space="preserve">가정: a와 e는 다음 줄에서 읽힌 뒤 죽고, 끝에서는 f만 산다</text>
  <text class="mono sm muted" x="0" y="44" xml:space="preserve">p0</text>
  <line class="ln-muted" x1="24" y1="40" x2="300" y2="40"/>
  <text class="mono sm b blue-t" x="310" y="44" xml:space="preserve">{ b, c, d }</text>
  <rect class="box" x="40" y="50" width="180" height="30" rx="5"/>
  <text class="mono" x="130.0" y="69.5" text-anchor="middle" xml:space="preserve">a := c + d</text>
  <text class="mono sm muted" x="0" y="94" xml:space="preserve">p1</text>
  <line class="ln-muted" x1="24" y1="90" x2="300" y2="90"/>
  <text class="mono sm b blue-t" x="310" y="94" xml:space="preserve">{ a, b }</text>
  <rect class="box" x="40" y="100" width="180" height="30" rx="5"/>
  <text class="mono" x="130.0" y="119.5" text-anchor="middle" xml:space="preserve">e := a + b</text>
  <text class="mono sm muted" x="0" y="144" xml:space="preserve">p2</text>
  <line class="ln-muted" x1="24" y1="140" x2="300" y2="140"/>
  <text class="mono sm b blue-t" x="310" y="144" xml:space="preserve">{ e }</text>
  <rect class="box" x="40" y="150" width="180" height="30" rx="5"/>
  <text class="mono" x="130.0" y="169.5" text-anchor="middle" xml:space="preserve">f := e - 1</text>
  <text class="mono sm muted" x="0" y="194" xml:space="preserve">p3</text>
  <line class="ln-muted" x1="24" y1="190" x2="300" y2="190"/>
  <text class="mono sm b blue-t" x="310" y="194" xml:space="preserve">{ f }</text>
  <text class="b" x="420" y="14" xml:space="preserve">변수별 생존 구간 → 레지스터</text>
  <text class="mono sm muted" x="515" y="40" text-anchor="middle" xml:space="preserve">p0</text>
  <text class="mono sm muted" x="585" y="40" text-anchor="middle" xml:space="preserve">p1</text>
  <text class="mono sm muted" x="655" y="40" text-anchor="middle" xml:space="preserve">p2</text>
  <text class="mono sm muted" x="725" y="40" text-anchor="middle" xml:space="preserve">p3</text>
  <text class="mono b" x="440" y="67" xml:space="preserve">a</text>
  <rect class="acc" x="556" y="55" width="58" height="18" rx="5"/>
  <text class="mono sm b acc-t" x="772" y="68" xml:space="preserve">r1</text>
  <text class="mono b" x="440" y="95" xml:space="preserve">e</text>
  <rect class="acc" x="626" y="83" width="58" height="18" rx="5"/>
  <text class="mono sm b acc-t" x="772" y="96" xml:space="preserve">r1</text>
  <text class="mono b" x="440" y="123" xml:space="preserve">f</text>
  <rect class="acc" x="696" y="111" width="58" height="18" rx="5"/>
  <text class="mono sm b acc-t" x="772" y="124" xml:space="preserve">r1</text>
  <text class="mono b" x="440" y="151" xml:space="preserve">b</text>
  <rect class="dead" x="486" y="139" width="128" height="18" rx="5"/>
  <text class="mono sm b muted" x="772" y="152" xml:space="preserve">r4</text>
  <text class="mono b" x="440" y="179" xml:space="preserve">c</text>
  <rect class="blue" x="486" y="167" width="58" height="18" rx="5"/>
  <text class="mono sm b blue-t" x="772" y="180" xml:space="preserve">r2</text>
  <text class="mono b" x="440" y="207" xml:space="preserve">d</text>
  <rect class="green" x="486" y="195" width="58" height="18" rx="5"/>
  <text class="mono sm b green-t" x="772" y="208" xml:space="preserve">r3</text>
  <text class="sm muted" x="420" y="230" xml:space="preserve">a, e, f 막대는 세로로 겹치지 않는다 → 같은 r1. p0에서 겹치는 b, c, d는 서로 달라야 한다</text>
</svg>
