<svg xmlns="http://www.w3.org/2000/svg" width="932" height="290" viewBox="-16 -16 932 290" role="img" aria-label="생존과 사멸. X := 3, X := 4, y := X가 차례로 실행된다. 첫 번째 대입 X := 3은 값이 읽히기 전에 다음 명령어가 곧바로 덮어써서 죽은 코드(Dead)다. 두 번째 대입 X := 4는 이 값이 다음 명령어에서 실제로 읽히므로 생존(Live)이다. y := X가 사용 지점이다. 왼쪽 값은 그 지점에서 X가 살아 있는지를 아래에서 위로 계산한 것으로, X := 3 앞은 false, X := 3과 X := 4 사이는 false, X := 4와 y := X 사이는 true, y := X 뒤는 false다. X := 3 바로 뒤가 false이므로 X := 3을 지울 수 있다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="290" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-live-dead-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-live-dead-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-live-dead-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <line class="ln" x1="280" y1="0" x2="280" y2="26" marker-end="url(#opt-live-dead-a)"/>
  <rect class="bad" x="210" y="28" width="140" height="34" rx="8"/>
  <text class="mono b" x="280.0" y="49.5" text-anchor="middle" xml:space="preserve">X := 3</text>
  <line class="ln" x1="280" y1="62" x2="280" y2="108" marker-end="url(#opt-live-dead-a)"/>
  <rect class="blue" x="210" y="110" width="140" height="34" rx="8"/>
  <text class="mono b" x="280.0" y="131.5" text-anchor="middle" xml:space="preserve">X := 4</text>
  <line class="ln" x1="280" y1="144" x2="280" y2="190" marker-end="url(#opt-live-dead-a)"/>
  <rect class="plain" x="210" y="192" width="140" height="34" rx="8"/>
  <text class="mono" x="280.0" y="213.5" text-anchor="middle" xml:space="preserve">y := X</text>
  <line class="ln" x1="280" y1="226" x2="280" y2="252" marker-end="url(#opt-live-dead-a)"/>
  <text class="mono sm muted" x="268" y="18" text-anchor="end" xml:space="preserve">live = false</text>
  <text class="mono sm muted" x="268" y="90" text-anchor="end" xml:space="preserve">live = false</text>
  <text class="mono sm b acc-t" x="268" y="172" text-anchor="end" xml:space="preserve">live = true</text>
  <text class="mono sm muted" x="268" y="244" text-anchor="end" xml:space="preserve">live = false</text>
  <text class="sm b" x="0" y="18" xml:space="preserve">X가 살아 있는가</text>
  <text class="sm muted" x="0" y="36" xml:space="preserve">(아래에서 위로 계산)</text>
  <line class="ln-acc" x1="380" y1="45" x2="358" y2="45" marker-end="url(#opt-live-dead-acc)"/>
  <text class="b acc-t" x="388" y="42" xml:space="preserve">첫 번째 대입: 죽은 코드 (Dead)</text>
  <text class="sm muted" x="388" y="62" xml:space="preserve">(값이 읽히기 전에 다음 명령어가 곧바로 덮어씀)</text>
  <line class="ln-blue" x1="380" y1="127" x2="358" y2="127" marker-end="url(#opt-live-dead-blue)"/>
  <text class="b blue-t" x="388" y="124" xml:space="preserve">두 번째 대입: 생존 (Live)</text>
  <text class="sm muted" x="388" y="144" xml:space="preserve">(이 값이 다음 명령어에서 실제로 읽힘)</text>
  <line class="ln" x1="380" y1="209" x2="358" y2="209" marker-end="url(#opt-live-dead-a)"/>
  <text class="b" x="388" y="213" xml:space="preserve">사용 지점</text>
</svg>
