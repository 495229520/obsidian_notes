<svg xmlns="http://www.w3.org/2000/svg" width="932" height="442" viewBox="-16 -16 932 442" role="img" aria-label="루프가 있는 CFG. 진입에서 X := 3, if (B &gt; 0) 블록으로 들어가 Y := Z + W와 Y := 0으로 갈라졌다가 A := 2 * X, if (A &lt; B) 블록에서 합류한다. if (A &lt; B)가 참이면 역방향 간선(Back-edge)을 따라 Y := 0으로 돌아가고, 거짓이면 출구로 나간다. 주황색은 순환이다. Y := 0의 입구는 위쪽 블록의 출구와 역방향 간선의 lub이고, A := 2 * X의 입구는 Y := Z + W의 출구와 Y := 0의 출구의 lub이다. 두 값이 서로를 기다리므로 위상 정렬 순서로 한 번 훑어서는 시작할 곳이 없다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="442" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-loop-backedge-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-loop-backedge-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-loop-backedge-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <line class="ln" x1="250" y1="46" x2="328" y2="46" marker-end="url(#opt-loop-backedge-a)"/>
  <text class="sm b" x="200" y="50" text-anchor="middle" xml:space="preserve">[진입]</text>
  <rect class="plain" x="330" y="20" width="170" height="54" rx="8"/>
  <text class="mono" x="415.0" y="42.4" text-anchor="middle" xml:space="preserve">X := 3</text>
  <text class="mono" x="415.0" y="60.6" text-anchor="middle" xml:space="preserve">if (B &gt; 0)</text>
  <rect class="plain" x="150" y="132" width="170" height="40" rx="8"/>
  <text class="mono" x="235.0" y="156.5" text-anchor="middle" xml:space="preserve">Y := Z + W</text>
  <rect class="acc" x="510" y="132" width="170" height="40" rx="8"/>
  <text class="mono b" x="595.0" y="156.5" text-anchor="middle" xml:space="preserve">Y := 0</text>
  <rect class="acc" x="330" y="236" width="170" height="54" rx="8"/>
  <text class="mono b" x="415.0" y="258.4" text-anchor="middle" xml:space="preserve">A := 2 * X</text>
  <text class="mono" x="415.0" y="276.6" text-anchor="middle" xml:space="preserve">if (A &lt; B)</text>
  <polyline class="ln" points="395,74 395,100 235,100 235,130" marker-end="url(#opt-loop-backedge-a)"/>
  <polyline class="ln" points="435,74 435,100 595,100 595,130" marker-end="url(#opt-loop-backedge-a)"/>
  <polyline class="ln" points="235,172 235,204 395,204 395,234" marker-end="url(#opt-loop-backedge-a)"/>
  <polyline class="ln-acc" points="595,172 595,204 435,204 435,234" marker-end="url(#opt-loop-backedge-acc)"/>
  <polyline class="ln-acc" points="500,276 760,276 760,152 682,152" marker-end="url(#opt-loop-backedge-acc)"/>
  <text class="sm b acc-t" x="770" y="210" xml:space="preserve">역방향 간선</text>
  <text class="sm acc-t" x="770" y="228" xml:space="preserve">(Back-edge)</text>
  <text class="sm muted" x="770" y="246" xml:space="preserve">A &lt; B일 때</text>
  <line class="ln" x1="415" y1="290" x2="415" y2="318" marker-end="url(#opt-loop-backedge-a)"/>
  <text class="sm muted" x="425" y="312" xml:space="preserve">출구 (A ≥ B)</text>
  <rect class="box" x="0" y="334" width="900" height="76" rx="8"/>
  <text class="sm" x="16" y="358" xml:space="preserve"><tspan class="b acc-t">①  </tspan><tspan class="mono">Y := 0</tspan>의 입구 = lub( 위쪽 블록의 출구 , <tspan class="b acc-t">역방향 간선</tspan> )   ← 역방향 간선 값은 <tspan class="mono">A := 2 * X</tspan> 블록이 정한다</text>
  <text class="sm" x="16" y="380" xml:space="preserve"><tspan class="b acc-t">②  </tspan><tspan class="mono">A := 2 * X</tspan>의 입구 = lub( <tspan class="mono">Y := Z + W</tspan>의 출구 , <tspan class="b acc-t">Y := 0의 출구</tspan> )   ← <tspan class="mono">Y := 0</tspan>의 출구는 ①이 정한다</text>
  <text class="sm muted" x="16" y="400" xml:space="preserve">①은 ②의 결과를, ②는 ①의 결과를 기다린다. 위상 정렬 순서로 한 번 훑어서는 시작할 곳이 없다.</text>
</svg>
