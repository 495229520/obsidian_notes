<svg xmlns="http://www.w3.org/2000/svg" width="972" height="208" viewBox="-16 -16 972 208" role="img" aria-label="기본 블록 안의 상수 전파와 죽은 코드 제거. 초기 기본 블록은 int x = 3; int y = z * w; int q = x + y;이다. 상수 전파 단계에서 x = 3을 데이터 흐름을 따라 대입해 q = 3 + y가 된다. 죽은 코드 제거 단계에서 x는 이후 읽히지 않고 부수 효과도 없어 int x = 3;을 죽은 코드로 안전하게 제거하고, int y = z * w;와 int q = 3 + y;만 남는다">
  <style>
