  <text class="mono sm muted" x="297" y="70" text-anchor="middle" xml:space="preserve">===&gt;</text>
  <line class="ln" x1="599" y1="78" x2="685" y2="78" marker-end="url(#opt-local-cp-dce-a)"/>
  <text class="mono sm muted" x="642" y="70" text-anchor="middle" xml:space="preserve">===&gt;</text>
  <text class="sm blue-t" x="470" y="152" text-anchor="middle" xml:space="preserve">(x=3을 데이터 흐름 따라 대입)</text>
  <text class="sm acc-t" x="815" y="152" text-anchor="middle" xml:space="preserve">(x는 이후 읽히지 않고 부수 효과도 없어</text>
  <text class="sm acc-t" x="815" y="170" text-anchor="middle" xml:space="preserve">죽은 코드로 안전하게 제거)</text>
  <text class="sm muted" x="125" y="152" text-anchor="middle" xml:space="preserve">슬라이드 3</text>
</svg>
