  <text class="b" x="125" y="14" text-anchor="middle" xml:space="preserve">[ 초기 기본 블록 ]</text>
  <rect class="box" x="0" y="28" width="250" height="100" rx="8"/>
  <text class="b" x="470" y="14" text-anchor="middle" xml:space="preserve">[ 상수 전파 ]</text>
  <rect class="blue" x="345" y="28" width="250" height="100" rx="8"/>
  <text class="b" x="815" y="14" text-anchor="middle" xml:space="preserve">[ 죽은 코드 제거 ]</text>
  <rect class="acc" x="690" y="28" width="250" height="100" rx="8"/>
  <text class="mono" x="20" y="58" xml:space="preserve">int x = 3;</text>
  <text class="mono" x="20" y="84" xml:space="preserve">int y = z * w;</text>
  <text class="mono" x="20" y="110" xml:space="preserve">int q = x + y;</text>
  <text class="mono" x="365" y="58" xml:space="preserve">int x = 3;</text>
  <text class="mono" x="365" y="84" xml:space="preserve">int y = z * w;</text>
  <text class="mono" x="365" y="110" xml:space="preserve">int q = <tspan class="b blue-t">3</tspan> + y;</text>
  <text class="mono muted" x="710" y="58" xml:space="preserve">int x = 3;</text>
  <line x1="708" y1="54" x2="789.5" y2="54" stroke="#B0532F" stroke-width="1.4"/>
  <text class="mono" x="710" y="84" xml:space="preserve">int y = z * w;</text>
  <text class="mono" x="710" y="110" xml:space="preserve">int q = 3 + y;</text>
