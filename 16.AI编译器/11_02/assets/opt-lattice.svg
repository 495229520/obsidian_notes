<svg xmlns="http://www.w3.org/2000/svg" width="992" height="332" viewBox="-16 -16 992 332" role="img" aria-label="상수 전파 격자. 맨 위의 ⊤(Top)는 비상수, 동적 미정 값, 다중 경로 충돌을 뜻한다. 가운데 줄은 상수 계층으로 서로 다른 상수값 c가 놓이며 … -1 0 1 2 …처럼 서로 비교할 수 없다. 맨 아래의 ⊥(Bottom)는 미도달 코드, 초기 무정보 상태다. 오른쪽은 lub 예시로, lub(⊥, 1) = 1은 아래에서 위로 한 칸, lub(1, 2) = ⊤은 1과 2를 모두 덮는 가장 낮은 원소, lub(c, c) = c다. 높이가 2라서 한 지점의 값은 ⊥에서 c로, c에서 ⊤으로 최대 두 번만 바뀐다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="992" height="332" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-lattice-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-lattice-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-lattice-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <line class="ln" x1="116" y1="142" x2="200" y2="58"/>
  <line class="ln" x1="116" y1="166" x2="200" y2="250"/>
  <line class="ln" x1="172" y1="142" x2="200" y2="58"/>
  <line class="ln" x1="172" y1="166" x2="200" y2="250"/>
  <line class="ln-acc" x1="228" y1="142" x2="200" y2="58"/>
  <line class="ln-blue" x1="228" y1="166" x2="200" y2="250"/>
  <line class="ln-acc" x1="284" y1="142" x2="200" y2="58"/>
  <line class="ln" x1="284" y1="166" x2="200" y2="250"/>
  <text class="mono b muted" x="60" y="159" text-anchor="middle" xml:space="preserve">…</text>
  <rect class="plain" x="96.0" y="142.0" width="40" height="24" rx="6"/>
  <text class="mono b" x="116" y="158.5" text-anchor="middle" xml:space="preserve">-1</text>
  <rect class="plain" x="152.0" y="142.0" width="40" height="24" rx="6"/>
  <text class="mono b" x="172" y="158.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="blue" x="208.0" y="142.0" width="40" height="24" rx="6"/>
  <text class="mono b" x="228" y="158.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="plain" x="264.0" y="142.0" width="40" height="24" rx="6"/>
  <text class="mono b" x="284" y="158.5" text-anchor="middle" xml:space="preserve">2</text>
  <text class="mono b muted" x="340" y="159" text-anchor="middle" xml:space="preserve">…</text>
  <rect class="acc" x="178.0" y="30.0" width="44" height="28" rx="6"/>
  <text class="mono b acc-t" x="200" y="48.5" text-anchor="middle" xml:space="preserve">⊤</text>
  <rect class="ghost" x="178.0" y="250.0" width="44" height="28" rx="6"/>
  <text class="mono b" x="200" y="268.5" text-anchor="middle" xml:space="preserve">⊥</text>
  <text class="sm" x="240" y="32" xml:space="preserve">(Top: 비상수 / 동적 미정 값</text>
  <text class="sm" x="244" y="50" xml:space="preserve">/ 다중 경로 충돌)</text>
  <text class="sm" x="372" y="158" xml:space="preserve">(상수 계층: 서로 다른 상수값 c)</text>
  <text class="sm" x="240" y="262" xml:space="preserve">(Bottom: 미도달 코드 / 초기 무정보 상태)</text>
  <text class="sm muted" x="0" y="214" xml:space="preserve">상수끼리는 비교할 수 없다</text>
  <line class="ln-muted" x1="576" y1="20" x2="576" y2="290"/>
  <text class="b" x="600" y="20" xml:space="preserve">lub 읽는 법: 둘 다 덮는 가장 낮은 원소</text>
  <text class="" x="600" y="54" xml:space="preserve"><tspan class="mono">lub(⊥, 1) = </tspan><tspan class="mono b blue-t">1</tspan></text>
  <text class="sm muted" x="728" y="54" xml:space="preserve">파란 선: ⊥에서 1로 한 칸 올라간다</text>
  <text class="" x="600" y="100" xml:space="preserve"><tspan class="mono">lub(1, 2) = </tspan><tspan class="mono b acc-t">⊤</tspan></text>
  <text class="sm muted" x="728" y="100" xml:space="preserve">주황 선: 1과 2를 함께 덮는 것은 ⊤뿐</text>
  <text class="" x="600" y="146" xml:space="preserve"><tspan class="mono">lub(c, c) = </tspan><tspan class="mono b blue-t">c</tspan></text>
  <text class="sm muted" x="728" y="146" xml:space="preserve">같은 상수끼리는 그대로</text>
  <text class="" x="600" y="192" xml:space="preserve"><tspan class="mono">lub(⊤, v) = </tspan><tspan class="mono b acc-t">⊤</tspan></text>
  <text class="sm muted" x="728" y="192" xml:space="preserve">⊤ 위에는 더 올라갈 곳이 없다</text>
  <rect class="acc" x="592" y="236" width="368" height="50" rx="6"/>
  <text class="sm" x="604" y="256" xml:space="preserve"><tspan class="b acc-t">높이 2: </tspan><tspan class="mono b">⊥ → c → ⊤</tspan><tspan class="sm">. 위로만 움직이므로</tspan></text>
  <text class="sm" x="604" y="276" xml:space="preserve">한 지점의 값은 최대 두 번 바뀐다 (§5.4)</text>
</svg>
