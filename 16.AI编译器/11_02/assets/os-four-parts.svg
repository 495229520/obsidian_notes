<svg xmlns="http://www.w3.org/2000/svg" width="972" height="324" viewBox="-16 -16 972 324" role="img" aria-label="언어 정의의 네 가지 요소와 컴파일러 단계의 대응. 어휘 토큰은 어휘 분석, 구문 문법은 구문 분석, 타입 규칙은 의미 분석, 평가 규칙은 코드 생성 및 최적화에 대응한다. 오른쪽 열은 각 요소를 적는 형식 표기로, 정규 표현식, 문맥 자유 문법, 타입 판단 O, M, C ⊢ e : T, 평가 판단 so, E, S ⊢ e : v, S′이다. 앞 노트는 평가 규칙을 스택 머신 코드로 간접 정의했고, 이 노트는 연산 의미론으로 직접 정의한다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="972" height="324" rx="14" fill="#F0EEE6"/>
  <defs><marker id="os-four-parts-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-four-parts-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-four-parts-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="150" y="18" text-anchor="middle" xml:space="preserve">언어 정의의 네 가지 요소</text>
  <text class="b" x="520" y="18" text-anchor="middle" xml:space="preserve">컴파일러 대응 단계</text>
  <text class="b" x="815" y="18" text-anchor="middle" xml:space="preserve">형식 표기</text>
  <rect class="plain" x="0" y="36" width="300" height="38" rx="8"/>
  <text x="150.0" y="59.5" text-anchor="middle" xml:space="preserve">어휘 토큰 (Tokens)</text>
  <line class="ln" x1="306" y1="55" x2="364" y2="55" marker-end="url(#os-four-parts-a)"/>
  <rect class="plain" x="370" y="36" width="300" height="38" rx="8"/>
  <text x="520.0" y="59.5" text-anchor="middle" xml:space="preserve">어휘 분석 (Lexical analysis)</text>
  <line class="ln-muted" x1="676" y1="55" x2="694" y2="55"/>
  <rect class="box" x="700" y="36" width="240" height="38" rx="8"/>
  <text class="sm" x="820.0" y="59.5" text-anchor="middle" xml:space="preserve">정규 표현식</text>
  <rect class="plain" x="0" y="86" width="300" height="38" rx="8"/>
  <text x="150.0" y="109.5" text-anchor="middle" xml:space="preserve">구문 문법 (Grammar)</text>
  <line class="ln" x1="306" y1="105" x2="364" y2="105" marker-end="url(#os-four-parts-a)"/>
  <rect class="plain" x="370" y="86" width="300" height="38" rx="8"/>
  <text x="520.0" y="109.5" text-anchor="middle" xml:space="preserve">구문 분석 (Syntactic analysis)</text>
  <line class="ln-muted" x1="676" y1="105" x2="694" y2="105"/>
  <rect class="box" x="700" y="86" width="240" height="38" rx="8"/>
  <text class="sm" x="820.0" y="109.5" text-anchor="middle" xml:space="preserve">문맥 자유 문법 (CFG)</text>
  <rect class="plain" x="0" y="136" width="300" height="38" rx="8"/>
  <text x="150.0" y="159.5" text-anchor="middle" xml:space="preserve">타입 규칙 (Typing rules)</text>
  <line class="ln" x1="306" y1="155" x2="364" y2="155" marker-end="url(#os-four-parts-a)"/>
  <rect class="plain" x="370" y="136" width="300" height="38" rx="8"/>
  <text x="520.0" y="159.5" text-anchor="middle" xml:space="preserve">의미 분석 (Semantic analysis)</text>
  <line class="ln-muted" x1="676" y1="155" x2="694" y2="155"/>
  <rect class="box" x="700" y="136" width="240" height="38" rx="8"/>
  <text class="mono sm" x="820.0" y="159.5" text-anchor="middle" xml:space="preserve">O, M, C ⊢ e : T</text>
  <rect class="acc" x="0" y="186" width="300" height="38" rx="8"/>
  <text class="b acc-t" x="150.0" y="209.5" text-anchor="middle" xml:space="preserve">평가 규칙 (Eval rules)</text>
  <line class="ln-acc" x1="306" y1="205" x2="364" y2="205" marker-end="url(#os-four-parts-acc)"/>
  <rect class="acc" x="370" y="186" width="300" height="38" rx="8"/>
  <text class="b acc-t" x="520.0" y="209.5" text-anchor="middle" xml:space="preserve">코드 생성 및 최적화 (Code gen &amp; opt)</text>
  <line class="ln-muted" x1="676" y1="205" x2="694" y2="205"/>
  <rect class="acc" x="700" y="186" width="240" height="38" rx="8"/>
  <text class="mono sm b acc-t" x="820.0" y="209.5" text-anchor="middle" xml:space="preserve">so, E, S ⊢ e : v, S′</text>
  <line class="ln-muted" x1="0" y1="238" x2="940" y2="238"/>
  <text class="sm muted" x="0" y="262" xml:space="preserve">앞 노트(코드 생성): Cool → 스택 머신 코드, 그리고 스택 머신 명령어의 실행 규칙. 평가 규칙을 간접적으로 정한 셈이다.</text>
  <text class="sm acc-t" x="0" y="284" xml:space="preserve">이 노트(연산 의미론): 같은 평가 규칙을 스택, 레지스터, 정수 표현과 무관하게 추론 규칙으로 직접 적는다.</text>
</svg>
