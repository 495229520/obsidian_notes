<svg xmlns="http://www.w3.org/2000/svg" width="972" height="348" viewBox="-16 -16 972 348" role="img" aria-label="x ← { y ← 3; y + 1; }의 저장소 흐름. 처음 S에서 l_x, l_y는 모두 0이다. 우변을 평가하는 동안 y ← 3이 일어나 S₁에서 l_y는 3이 되고 v = Int(4)가 나온다. 맞는 규칙은 S₁ 위에 덮어써 S₂에서 l_x = 4, l_y = 3이다. 틀린 규칙 S[v/l_x]는 처음 S에 덮어써서 l_y가 0으로 남아 y ← 3이 사라진다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="972" height="348" rx="14" fill="#F0EEE6"/>
  <defs><marker id="os-assign-thread-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-assign-thread-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-assign-thread-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="18" xml:space="preserve">x ← { y ← 3; y + 1; }: S₁ 위에 덮어써야 y ← 3이 남는다</text>
  <text class="mono sm muted" x="0" y="38" xml:space="preserve">E = [x : l_x, y : l_y], 처음 S = [l_x → 0, l_y → 0]</text>
  <text class="sm b" x="66" y="72" text-anchor="middle" xml:space="preserve">S (처음)</text>
  <rect class="blue" x="0" y="82" width="50" height="28" rx="3"/>
  <text class="mono sm" x="25.0" y="100.0" text-anchor="middle" xml:space="preserve">l_x</text>
  <rect class="plain" x="50" y="82" width="82" height="28" rx="3"/>
  <text class="mono sm" x="91.0" y="100.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <rect class="blue" x="0" y="110" width="50" height="28" rx="3"/>
  <text class="mono sm" x="25.0" y="128.0" text-anchor="middle" xml:space="preserve">l_y</text>
  <rect class="plain" x="50" y="110" width="82" height="28" rx="3"/>
  <text class="mono sm" x="91.0" y="128.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <text class="sm b" x="456" y="72" text-anchor="middle" xml:space="preserve">S₁ (우변 평가 뒤)</text>
  <rect class="blue" x="390" y="82" width="50" height="28" rx="3"/>
  <text class="mono sm" x="415.0" y="100.0" text-anchor="middle" xml:space="preserve">l_x</text>
  <rect class="plain" x="440" y="82" width="82" height="28" rx="3"/>
  <text class="mono sm" x="481.0" y="100.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <rect class="blue" x="390" y="110" width="50" height="28" rx="3"/>
  <text class="mono sm" x="415.0" y="128.0" text-anchor="middle" xml:space="preserve">l_y</text>
  <rect class="acc" x="440" y="110" width="82" height="28" rx="3"/>
  <text class="mono sm b" x="481.0" y="128.0" text-anchor="middle" xml:space="preserve">Int(3)</text>
  <text class="sm b acc-t" x="856" y="72" text-anchor="middle" xml:space="preserve">S₂ = S₁[Int(4)/l_x]</text>
  <rect class="blue" x="790" y="82" width="50" height="28" rx="3"/>
  <text class="mono sm" x="815.0" y="100.0" text-anchor="middle" xml:space="preserve">l_x</text>
  <rect class="acc" x="840" y="82" width="82" height="28" rx="3"/>
  <text class="mono sm b" x="881.0" y="100.0" text-anchor="middle" xml:space="preserve">Int(4)</text>
  <rect class="blue" x="790" y="110" width="50" height="28" rx="3"/>
  <text class="mono sm" x="815.0" y="128.0" text-anchor="middle" xml:space="preserve">l_y</text>
  <rect class="plain" x="840" y="110" width="82" height="28" rx="3"/>
  <text class="mono sm" x="881.0" y="128.0" text-anchor="middle" xml:space="preserve">Int(3)</text>
  <line class="ln" x1="140" y1="110" x2="382" y2="110" marker-end="url(#os-assign-thread-a)"/>
  <text class="sm" x="261" y="100" text-anchor="middle" xml:space="preserve">① 우변 e 평가: 안에서 y ← 3</text>
  <text class="mono sm" x="261" y="130" text-anchor="middle" xml:space="preserve">결과 v = Int(4)</text>
  <line class="ln-acc" x1="530" y1="110" x2="782" y2="110" marker-end="url(#os-assign-thread-acc)"/>
  <text class="sm" x="656" y="100" text-anchor="middle" xml:space="preserve">② E(x) = l_x 찾기</text>
  <text class="sm acc-t" x="656" y="130" text-anchor="middle" xml:space="preserve">③ S₁의 l_x만 v로 덮어씀</text>
  <line class="ln-muted" x1="0" y1="170" x2="940" y2="170"/>
  <text class="b" x="0" y="194" xml:space="preserve">틀린 규칙: S₂ = S[v/l_x]</text>
  <rect class="blue" x="0" y="222" width="50" height="28" rx="3"/>
  <text class="mono sm" x="25.0" y="240.0" text-anchor="middle" xml:space="preserve">l_x</text>
  <rect class="plain" x="50" y="222" width="82" height="28" rx="3"/>
  <text class="mono sm" x="91.0" y="240.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <rect class="blue" x="0" y="250" width="50" height="28" rx="3"/>
  <text class="mono sm" x="25.0" y="268.0" text-anchor="middle" xml:space="preserve">l_y</text>
  <rect class="plain" x="50" y="250" width="82" height="28" rx="3"/>
  <text class="mono sm" x="91.0" y="268.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <text class="sm b muted" x="66" y="212" text-anchor="middle" xml:space="preserve">S (처음)</text>
  <rect class="blue" x="790" y="222" width="50" height="28" rx="3"/>
  <text class="mono sm" x="815.0" y="240.0" text-anchor="middle" xml:space="preserve">l_x</text>
  <rect class="acc" x="840" y="222" width="82" height="28" rx="3"/>
  <text class="mono sm b" x="881.0" y="240.0" text-anchor="middle" xml:space="preserve">Int(4)</text>
  <rect class="blue" x="790" y="250" width="50" height="28" rx="3"/>
  <text class="mono sm" x="815.0" y="268.0" text-anchor="middle" xml:space="preserve">l_y</text>
  <rect class="bad" x="840" y="250" width="82" height="28" rx="3"/>
  <text class="mono sm b" x="881.0" y="268.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <text class="sm b" x="856" y="212" text-anchor="middle" xml:space="preserve">S[Int(4)/l_x]</text>
  <polyline class="ln-dash" points="140,250 782,250" marker-end="url(#os-assign-thread-acc)"/>
  <text class="sm" x="461" y="240" text-anchor="middle" xml:space="preserve">v = Int(4)는 쓰지만, 우변이 만든 S₁은 버리고 처음 S에 덮어씀</text>
  <text class="sm b acc-t" x="461" y="270" text-anchor="middle" xml:space="preserve">y ← 3의 흔적(l_y = 3)이 사라진다</text>
  <text class="sm muted" x="0" y="312" xml:space="preserve">인터프리터에서 두 규칙을 모두 돌렸다: 맞는 규칙은 x = 4, y = 3, 틀린 규칙은 x = 4, y = 0</text>
</svg>
