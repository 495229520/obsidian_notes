<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="332" viewBox="-16 -16 1032 332" role="img" aria-label="생존성 규칙. 왼쪽은 합류 규칙인 규칙 1로, 문장 p의 출구 생존 L(p, x, out)은 후행 s1, s2, s3 입구 생존의 논리합 L(s1, x, in) ∨ L(s2, x, in) ∨ L(s3, x, in)이다. 예로 s1 입구가 true, s2와 s3이 false이면 p의 출구는 true다. 오른쪽은 한 문장 안에서 출구로부터 입구를 정하는 규칙 2–4다. 규칙 2: 오른쪽에서 x를 읽으면 입구는 true. 규칙 3: x := e이고 e가 x를 읽지 않으면 입구는 false. 규칙 4: x를 건드리지 않으면 입구는 출구와 같다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="1032" height="332" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-live-rule1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-live-rule1-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-live-rule1-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="plain" x="150" y="10" width="140" height="36" rx="8"/>
  <text class="b" x="220.0" y="32.5" text-anchor="middle" xml:space="preserve">문장 p</text>
  <line class="ln" x1="220" y1="46" x2="220" y2="120"/>
  <text class="mono sm b" x="230" y="74" xml:space="preserve">L(p, x, out) = L(s1, x, in) ∨ L(s2, x, in) ∨ L(s3, x, in)</text>
  <text class="sm" x="230" y="96" xml:space="preserve"><tspan class="sm">예: </tspan><tspan class="mono sm b acc-t">true</tspan><tspan class="mono sm"> ∨ </tspan><tspan class="mono sm muted">false</tspan><tspan class="mono sm"> ∨ </tspan><tspan class="mono sm muted">false</tspan><tspan class="mono sm"> = </tspan><tspan class="mono sm b acc-t">true</tspan></text>
  <line class="ln" x1="90" y1="120" x2="350" y2="120"/>
  <line class="ln" x1="90" y1="120" x2="90" y2="158" marker-end="url(#opt-live-rule1-a)"/>
  <rect class="acc" x="40" y="160" width="100" height="36" rx="8"/>
  <text class="b" x="90.0" y="182.5" text-anchor="middle" xml:space="preserve">후행 s1</text>
  <text class="mono sm b acc-t" x="90" y="220" text-anchor="middle" xml:space="preserve">in = true</text>
  <line class="ln" x1="220" y1="120" x2="220" y2="158" marker-end="url(#opt-live-rule1-a)"/>
  <rect class="plain" x="170" y="160" width="100" height="36" rx="8"/>
  <text class="b" x="220.0" y="182.5" text-anchor="middle" xml:space="preserve">후행 s2</text>
  <text class="mono sm muted" x="220" y="220" text-anchor="middle" xml:space="preserve">in = false</text>
  <line class="ln" x1="350" y1="120" x2="350" y2="158" marker-end="url(#opt-live-rule1-a)"/>
  <rect class="plain" x="300" y="160" width="100" height="36" rx="8"/>
  <text class="b" x="350.0" y="182.5" text-anchor="middle" xml:space="preserve">후행 s3</text>
  <text class="mono sm muted" x="350" y="220" text-anchor="middle" xml:space="preserve">in = false</text>
  <text class="sm" x="0" y="262" xml:space="preserve">후행 중 하나라도 x를 쓸 수 있으면 p 뒤에서 x는 산다.</text>
  <text class="sm muted" x="0" y="282" xml:space="preserve">정보는 후행 → 선행, 곧 실행과 반대 방향으로 흐른다.</text>
  <line class="ln-muted" x1="660" y1="10" x2="660" y2="290"/>
  <text class="b" x="680" y="16" xml:space="preserve">한 문장 안: 출구 → 입구 (슬라이드 69–71)</text>
  <rect class="box" x="680" y="34" width="320" height="72" rx="6"/>
  <text class="sm b" x="692" y="56" xml:space="preserve">규칙 2</text>
  <text class="mono sm" x="750" y="56" xml:space="preserve">... := f(x)</text>
  <text class="mono sm b acc-t" x="692" y="80" xml:space="preserve">in = true</text>
  <text class="sm muted" x="692" y="98" xml:space="preserve">x를 읽는다 → 산다</text>
  <rect class="box" x="680" y="118" width="320" height="72" rx="6"/>
  <text class="sm b" x="692" y="140" xml:space="preserve">규칙 3</text>
  <text class="mono sm" x="750" y="140" xml:space="preserve">x := e  (e에 x 없음)</text>
  <text class="mono sm muted" x="692" y="164" xml:space="preserve">in = false</text>
  <text class="sm muted" x="692" y="182" xml:space="preserve">덮어쓴다 → 이전 값은 죽는다</text>
  <rect class="box" x="680" y="202" width="320" height="72" rx="6"/>
  <text class="sm b" x="692" y="224" xml:space="preserve">규칙 4</text>
  <text class="mono sm" x="750" y="224" xml:space="preserve">x를 건드리지 않음</text>
  <text class="mono sm b" x="692" y="248" xml:space="preserve">in = out</text>
  <text class="sm muted" x="692" y="266" xml:space="preserve">그대로 위로 전달</text>
</svg>
