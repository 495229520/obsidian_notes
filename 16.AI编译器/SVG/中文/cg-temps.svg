<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="372" viewBox="-16 -16 1012 372" role="img" aria-label="把临时值放进 AR 固定位置的 fib 函数。左侧为 fib 的 AR，共 old fp、x、RA、T1、T0 五个槽位，即 2 + n + NT(e) = 2 + 1 + 2。T0 位于 -8($fp)，T1 位于 -4($fp)。右侧为各执行阶段的槽位复用：计算 fib(x-1) 时把 x 放在 T0，返回值留在 T0 后再把 fib(x-2) 的 x 放到 T1，最后取出 T0 中的左值相加。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .band { fill: none; stroke: #D97757; stroke-width: 1.6; stroke-dasharray: 5 3; }
  </style>
  <rect x="-16" y="-16" width="1012" height="372" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="cg-temps-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-temps-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-temps-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="300" height="340" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">fib 的 AR：2 + n + NT(e) = 5 格</text>
  <text class="sm muted" x="16" y="46" xml:space="preserve">n = 1（形参 x），NT(fib 函数体) = 2</text>
  <rect class="plain" x="90" y="64" width="190" height="34" rx="3"/>
  <text class="mono sm b" x="102" y="86" xml:space="preserve">old fp</text>
  <text class="mono sm muted" x="270" y="86" text-anchor="end" xml:space="preserve">8($fp)</text>
  <rect class="plain" x="90" y="98" width="190" height="34" rx="3"/>
  <text class="mono sm b" x="102" y="120" xml:space="preserve">x</text>
  <text class="mono sm muted" x="270" y="120" text-anchor="end" xml:space="preserve">4($fp)</text>
  <rect class="plain" x="90" y="132" width="190" height="34" rx="3"/>
  <text class="mono sm b" x="102" y="154" xml:space="preserve">RA</text>
  <text class="mono sm muted" x="270" y="154" text-anchor="end" xml:space="preserve">0($fp)</text>
  <rect class="blue" x="90" y="166" width="190" height="34" rx="3"/>
  <text class="mono sm b" x="102" y="188" xml:space="preserve">T1</text>
  <text class="mono sm muted" x="270" y="188" text-anchor="end" xml:space="preserve">−4($fp)</text>
  <rect class="acc" x="90" y="200" width="190" height="34" rx="3"/>
  <text class="mono sm b" x="102" y="222" xml:space="preserve">T0</text>
  <text class="mono sm muted" x="270" y="222" text-anchor="end" xml:space="preserve">−8($fp)</text>
  <rect class="ghost" x="90" y="234" width="190" height="34" rx="3"/>
  <text class="sm muted" x="102" y="256" xml:space="preserve">(下一个空闲槽位)</text>
  <text class="mono sm b" x="60" y="153" text-anchor="end" xml:space="preserve">FP</text>
  <line class="ln" x1="66" y1="149" x2="86" y2="149" marker-end="url(#cg-temps-a)"/>
  <text class="mono sm b" x="60" y="255" text-anchor="end" xml:space="preserve">SP</text>
  <line class="ln" x1="66" y1="251" x2="86" y2="251" marker-end="url(#cg-temps-a)"/>
  <text class="sm" x="16" y="294" xml:space="preserve">函数体执行期间 SP 保持不动</text>
  <text class="sm muted" x="16" y="314" xml:space="preserve">临时槽位按编译期定好的 FP 偏移访问</text>
  <text class="sm b" x="324" y="24" xml:space="preserve">执行阶段</text>
  <text class="sm b" x="474" y="24" xml:space="preserve">T0（临时槽位 0）</text>
  <text class="sm b" x="654" y="24" xml:space="preserve">T1（临时槽位 1）</text>
  <text class="sm b" x="834" y="24" xml:space="preserve">对应指令</text>
  <line class="ln-muted" x1="320" y1="34" x2="980" y2="34"/>
  <text class="mono sm" x="324" y="72" xml:space="preserve">算 fib(x-1)</text>
  <rect class="blue" x="470" y="46" width="160" height="40" rx="4"/>
  <text class="sm" x="550.0" y="70.5" text-anchor="middle" xml:space="preserve">暂存 x（供 x - 1 用）</text>
  <rect class="ghost" x="650" y="46" width="160" height="40" rx="4"/>
  <text class="sm muted" x="730.0" y="70.5" text-anchor="middle" xml:space="preserve">(空闲)</text>
  <text class="mono sm" x="834" y="72" xml:space="preserve">sw $a0 -8($fp)</text>
  <text class="mono sm" x="324" y="124" xml:space="preserve">fib(x-1) 返回</text>
  <rect class="acc" x="470" y="98" width="160" height="40" rx="4"/>
  <text class="sm" x="550.0" y="122.5" text-anchor="middle" xml:space="preserve">保存 fib(x-1) 结果</text>
  <rect class="ghost" x="650" y="98" width="160" height="40" rx="4"/>
  <text class="sm muted" x="730.0" y="122.5" text-anchor="middle" xml:space="preserve">(空闲)</text>
  <text class="mono sm" x="834" y="124" xml:space="preserve">sw $a0 -8($fp)</text>
  <text class="mono sm" x="324" y="176" xml:space="preserve">算 fib(x-2)</text>
  <rect class="acc" x="470" y="150" width="160" height="40" rx="4"/>
  <text class="sm" x="550.0" y="174.5" text-anchor="middle" xml:space="preserve">继续留着 fib(x-1)</text>
  <rect class="blue" x="650" y="150" width="160" height="40" rx="4"/>
  <text class="sm" x="730.0" y="174.5" text-anchor="middle" xml:space="preserve">暂存 x（供 x - 2 用）</text>
  <text class="mono sm" x="834" y="176" xml:space="preserve">sw $a0 -4($fp)</text>
  <text class="mono sm" x="324" y="228" xml:space="preserve">做加法返回</text>
  <rect class="plain" x="470" y="202" width="160" height="40" rx="4"/>
  <text class="sm" x="550.0" y="226.5" text-anchor="middle" xml:space="preserve">取出左值相加后释放</text>
  <rect class="ghost" x="650" y="202" width="160" height="40" rx="4"/>
  <text class="sm muted" x="730.0" y="226.5" text-anchor="middle" xml:space="preserve">(已空闲)</text>
  <text class="mono sm" x="834" y="228" xml:space="preserve">lw $t1 -8($fp)</text>
  <text class="sm" x="320" y="280" xml:space="preserve">因为要在留着左侧结果（T0）的同时计算右侧，必须同时占住两格：max(1, 1 + 1) = 2</text>
  <text class="sm muted" x="320" y="302" xml:space="preserve">递归调用的 fib 各自在自己的 AR 里拥有 T0、T1，不会覆盖调用方的 T0</text>
  <text class="sm muted" x="320" y="324" xml:space="preserve">偏移量按模拟器生成代码标注：首个临时槽位在最低地址（−8），下一槽位为 nt + 4</text>
</svg>
