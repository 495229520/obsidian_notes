<svg xmlns="http://www.w3.org/2000/svg" width="932" height="350" viewBox="-16 -16 932 350" role="img" aria-label="为什么不能把 e1 的值直接放在 $t1 里。按 move $t1 $a0 编译 1 + (2 + 3) 时，内层加法会把外层暂存的 1 覆盖成 2，算出 7 而不是 6。栈方式每次嵌套都新开槽位，外层的 1 得以保留。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .band { fill: none; stroke: #D97757; stroke-width: 1.6; stroke-dasharray: 5 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="350" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="cg-t1-clobber-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-t1-clobber-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-t1-clobber-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="590" height="318" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">错误优化：把 e1 直接暂存到 $t1（计算 1 + (2 + 3)）</text>
  <text class="mono sm muted" x="16" y="46" xml:space="preserve">cgen(e1); move $t1 $a0; cgen(e2); add $a0 $t1 $a0</text>
  <text class="sm b" x="16" y="72" xml:space="preserve">指令</text>
  <text class="sm b mono" x="190" y="72" text-anchor="middle" xml:space="preserve">$a0</text>
  <text class="sm b mono" x="250" y="72" text-anchor="middle" xml:space="preserve">$t1</text>
  <text class="sm b" x="290" y="72" xml:space="preserve">说明</text>
  <text class="mono sm" x="16" y="102" xml:space="preserve">li $a0 1</text>
  <rect class="box" x="170.0" y="86.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="190" y="102.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="box" x="230.0" y="86.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="250" y="102.5" text-anchor="middle" xml:space="preserve">?</text>
  <text class="sm" x="290" y="102" xml:space="preserve">外层 e1 = 1</text>
  <text class="mono sm" x="16" y="134" xml:space="preserve">move $t1 $a0</text>
  <rect class="box" x="170.0" y="118.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="190" y="134.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="box" x="230.0" y="118.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="250" y="134.5" text-anchor="middle" xml:space="preserve">1</text>
  <text class="sm" x="290" y="134" xml:space="preserve">把 1 暂存到 $t1</text>
  <text class="mono sm" x="16" y="166" xml:space="preserve">li $a0 2</text>
  <rect class="box" x="170.0" y="150.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="190" y="166.5" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box" x="230.0" y="150.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="250" y="166.5" text-anchor="middle" xml:space="preserve">1</text>
  <text class="sm" x="290" y="166" xml:space="preserve">内层 e1 = 2</text>
  <text class="mono sm" x="16" y="198" xml:space="preserve">move $t1 $a0</text>
  <rect class="box" x="170.0" y="182.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="190" y="198.5" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="bad" x="230.0" y="182.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="250" y="198.5" text-anchor="middle" xml:space="preserve">2</text>
  <text class="sm acc-t b" x="290" y="198" xml:space="preserve">把暂存的 1 覆盖掉了</text>
  <text class="mono sm" x="16" y="230" xml:space="preserve">li $a0 3</text>
  <rect class="box" x="170.0" y="214.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="190" y="230.5" text-anchor="middle" xml:space="preserve">3</text>
  <rect class="box" x="230.0" y="214.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="250" y="230.5" text-anchor="middle" xml:space="preserve">2</text>
  <text class="sm" x="290" y="230" xml:space="preserve">内层 e2 = 3</text>
  <text class="mono sm" x="16" y="262" xml:space="preserve">add $a0 $t1 $a0</text>
  <rect class="box" x="170.0" y="246.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="190" y="262.5" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="box" x="230.0" y="246.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="250" y="262.5" text-anchor="middle" xml:space="preserve">2</text>
  <text class="sm" x="290" y="262" xml:space="preserve">2 + 3 = 5（到这里还正常）</text>
  <text class="mono sm" x="16" y="294" xml:space="preserve">add $a0 $t1 $a0</text>
  <rect class="bad" x="170.0" y="278.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="190" y="294.5" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="box" x="230.0" y="278.0" width="40" height="24" rx="6"/>
  <text class="mono sm" x="250" y="294.5" text-anchor="middle" xml:space="preserve">2</text>
  <text class="sm acc-t b" x="290" y="294" xml:space="preserve">本该 1 + 5 = 6，却算成 2 + 5 = 7</text>
  <rect class="box" x="610" y="0" width="290" height="318" rx="8"/>
  <text class="b" x="626" y="26" xml:space="preserve">栈方式（§1.4 模板）</text>
  <text class="sm muted" x="626" y="46" xml:space="preserve">每多一层嵌套就新开一个槽位</text>
  <text class="sm" x="626" y="76" xml:space="preserve">最深处（刚执行完 li $a0 3）的栈</text>
  <rect class="acc" x="700" y="92" width="80" height="30" rx="3"/>
  <text class="mono sm" x="740.0" y="111.0" text-anchor="middle" xml:space="preserve">1</text>
  <text class="mono sm muted" x="788" y="112" xml:space="preserve">S</text>
  <rect class="acc" x="700" y="122" width="80" height="30" rx="3"/>
  <text class="mono sm" x="740.0" y="141.0" text-anchor="middle" xml:space="preserve">2</text>
  <text class="mono sm muted" x="788" y="142" xml:space="preserve">S−4</text>
  <rect class="ghost" x="700" y="152" width="80" height="30" rx="3"/>
  <text class="mono sm muted" x="788" y="172" xml:space="preserve">S−8</text>
  <text class="mono sm b" x="690" y="176" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln" x1="692" y1="172" x2="698" y2="172" marker-end="url(#cg-t1-clobber-a)"/>
  <text class="sm" x="626" y="216" xml:space="preserve">外层的 1 在 S，内层的 2 在 S−4，</text>
  <text class="sm" x="626" y="236" xml:space="preserve">各自独立存放，不会互相覆盖</text>
  <text class="sm b blue-t" x="626" y="266" xml:space="preserve">结果为 6（已在模拟器中验证）</text>
  <text class="sm muted" x="626" y="296" xml:space="preserve">单个寄存器无法容纳随嵌套深度</text>
  <text class="sm muted" x="626" y="314" xml:space="preserve">增加的多个中间结果</text>
</svg>
