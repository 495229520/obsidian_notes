<svg xmlns="http://www.w3.org/2000/svg" width="992" height="470" viewBox="-16 -16 992 470" role="img" aria-label="Slide 60-78 局部优化完整十步推演。初始基本块包含 a := x ** 2, b := 3, c := x, d := c * c, e := b * 2, f := a + d, g := e * f。依次经历代数化简、复制传播、常量折叠、公共子表达式消除、再次复制传播、死代码消除，得到 a := x * x, f := a + a, g := 6 * f；进一步经代数重构与重结合、二次死代码消除，最终收敛至 a := x * x 与 g := 12 * a。gcc 13.3 -O2 亦生成等价的 12 * (x * x) 汇编代码。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="992" height="470" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-local-chain-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-local-chain-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-local-chain-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="180" height="178" rx="8"/>
  <text class="sm b" x="10" y="20" xml:space="preserve">① 初始代码</text>
  <text class="sm muted" x="172" y="20" text-anchor="end" xml:space="preserve">60</text>
  <text class="mono sm" x="14" y="46" xml:space="preserve">a := x ** 2</text>
  <text class="mono sm" x="14" y="64" xml:space="preserve">b := 3</text>
  <text class="mono sm" x="14" y="82" xml:space="preserve">c := x</text>
  <text class="mono sm" x="14" y="100" xml:space="preserve">d := c * c</text>
  <text class="mono sm" x="14" y="118" xml:space="preserve">e := b * 2</text>
  <text class="mono sm" x="14" y="136" xml:space="preserve">f := a + d</text>
  <text class="mono sm" x="14" y="154" xml:space="preserve">g := e * f</text>
  <line class="ln" x1="181" y1="89.0" x2="194" y2="89.0" marker-end="url(#opt-local-chain-a)"/>
  <rect class="box" x="195" y="0" width="180" height="178" rx="8"/>
  <text class="sm b" x="205" y="20" xml:space="preserve">② 代数化简</text>
  <text class="sm muted" x="367" y="20" text-anchor="end" xml:space="preserve">62</text>
  <text class="mono sm b acc-t" x="209" y="46" xml:space="preserve">a := x * x</text>
  <text class="mono sm" x="209" y="64" xml:space="preserve">b := 3</text>
  <text class="mono sm" x="209" y="82" xml:space="preserve">c := x</text>
  <text class="mono sm" x="209" y="100" xml:space="preserve">d := c * c</text>
  <text class="mono sm b acc-t" x="209" y="118" xml:space="preserve">e := b &lt;&lt; 1</text>
  <text class="mono sm" x="209" y="136" xml:space="preserve">f := a + d</text>
  <text class="mono sm" x="209" y="154" xml:space="preserve">g := e * f</text>
  <line class="ln" x1="376" y1="89.0" x2="389" y2="89.0" marker-end="url(#opt-local-chain-a)"/>
  <rect class="box" x="390" y="0" width="180" height="178" rx="8"/>
  <text class="sm b" x="400" y="20" xml:space="preserve">③ 复制传播</text>
  <text class="sm muted" x="562" y="20" text-anchor="end" xml:space="preserve">64</text>
  <text class="mono sm" x="404" y="46" xml:space="preserve">a := x * x</text>
  <text class="mono sm" x="404" y="64" xml:space="preserve">b := 3</text>
  <text class="mono sm" x="404" y="82" xml:space="preserve">c := x</text>
  <text class="mono sm b acc-t" x="404" y="100" xml:space="preserve">d := x * x</text>
  <text class="mono sm b acc-t" x="404" y="118" xml:space="preserve">e := 3 &lt;&lt; 1</text>
  <text class="mono sm" x="404" y="136" xml:space="preserve">f := a + d</text>
  <text class="mono sm" x="404" y="154" xml:space="preserve">g := e * f</text>
  <line class="ln" x1="571" y1="89.0" x2="584" y2="89.0" marker-end="url(#opt-local-chain-a)"/>
  <rect class="box" x="585" y="0" width="180" height="178" rx="8"/>
  <text class="sm b" x="595" y="20" xml:space="preserve">④ 常量折叠</text>
  <text class="sm muted" x="757" y="20" text-anchor="end" xml:space="preserve">66</text>
  <text class="mono sm" x="599" y="46" xml:space="preserve">a := x * x</text>
  <text class="mono sm" x="599" y="64" xml:space="preserve">b := 3</text>
  <text class="mono sm" x="599" y="82" xml:space="preserve">c := x</text>
  <text class="mono sm" x="599" y="100" xml:space="preserve">d := x * x</text>
  <text class="mono sm b acc-t" x="599" y="118" xml:space="preserve">e := 6</text>
  <text class="mono sm" x="599" y="136" xml:space="preserve">f := a + d</text>
  <text class="mono sm" x="599" y="154" xml:space="preserve">g := e * f</text>
  <line class="ln" x1="766" y1="89.0" x2="779" y2="89.0" marker-end="url(#opt-local-chain-a)"/>
  <rect class="box" x="780" y="0" width="180" height="178" rx="8"/>
  <text class="sm b" x="790" y="20" xml:space="preserve">⑤ 公共子表达式消除 (CSE)</text>
  <text class="sm muted" x="952" y="20" text-anchor="end" xml:space="preserve">68</text>
  <text class="mono sm" x="794" y="46" xml:space="preserve">a := x * x</text>
  <text class="mono sm" x="794" y="64" xml:space="preserve">b := 3</text>
  <text class="mono sm" x="794" y="82" xml:space="preserve">c := x</text>
  <text class="mono sm b acc-t" x="794" y="100" xml:space="preserve">d := a</text>
  <text class="mono sm" x="794" y="118" xml:space="preserve">e := 6</text>
  <text class="mono sm" x="794" y="136" xml:space="preserve">f := a + d</text>
  <text class="mono sm" x="794" y="154" xml:space="preserve">g := e * f</text>
  <rect class="box" x="0" y="212" width="180" height="178" rx="8"/>
  <text class="sm b" x="10" y="232" xml:space="preserve">⑥ 复制传播</text>
  <text class="sm muted" x="172" y="232" text-anchor="end" xml:space="preserve">70</text>
  <text class="mono sm" x="14" y="258" xml:space="preserve">a := x * x</text>
  <text class="mono sm" x="14" y="276" xml:space="preserve">b := 3</text>
  <text class="mono sm" x="14" y="294" xml:space="preserve">c := x</text>
  <text class="mono sm" x="14" y="312" xml:space="preserve">d := a</text>
  <text class="mono sm" x="14" y="330" xml:space="preserve">e := 6</text>
  <text class="mono sm b acc-t" x="14" y="348" xml:space="preserve">f := a + a</text>
  <text class="mono sm b acc-t" x="14" y="366" xml:space="preserve">g := 6 * f</text>
  <line class="ln" x1="181" y1="301.0" x2="194" y2="301.0" marker-end="url(#opt-local-chain-a)"/>
  <rect class="box" x="195" y="212" width="180" height="178" rx="8"/>
  <text class="sm b" x="205" y="232" xml:space="preserve">⑦ 死代码消除 (DCE)</text>
  <text class="sm muted" x="367" y="232" text-anchor="end" xml:space="preserve">72</text>
  <text class="mono sm" x="209" y="258" xml:space="preserve">a := x * x</text>
  <text class="mono sm" x="209" y="276" xml:space="preserve">f := a + a</text>
  <text class="mono sm" x="209" y="294" xml:space="preserve">g := 6 * f</text>
  <line class="ln" x1="376" y1="301.0" x2="389" y2="301.0" marker-end="url(#opt-local-chain-a)"/>
  <rect class="box" x="390" y="212" width="180" height="178" rx="8"/>
  <text class="sm b" x="400" y="232" xml:space="preserve">⑧ 算术重构 a + a → 2 * a</text>
  <text class="sm muted" x="562" y="232" text-anchor="end" xml:space="preserve">74</text>
  <text class="mono sm" x="404" y="258" xml:space="preserve">a := x * x</text>
  <text class="mono sm b acc-t" x="404" y="276" xml:space="preserve">f := 2 * a</text>
  <text class="mono sm" x="404" y="294" xml:space="preserve">g := 6 * f</text>
  <line class="ln" x1="571" y1="301.0" x2="584" y2="301.0" marker-end="url(#opt-local-chain-a)"/>
  <rect class="box" x="585" y="212" width="180" height="178" rx="8"/>
  <text class="sm b" x="595" y="232" xml:space="preserve">⑨ 代入后代数重结合</text>
  <text class="sm muted" x="757" y="232" text-anchor="end" xml:space="preserve">76</text>
  <text class="mono sm" x="599" y="258" xml:space="preserve">a := x * x</text>
  <text class="mono sm" x="599" y="276" xml:space="preserve">f := 2 * a</text>
  <text class="mono sm b acc-t" x="599" y="294" xml:space="preserve">g := 12 * a</text>
  <line class="ln" x1="766" y1="301.0" x2="779" y2="301.0" marker-end="url(#opt-local-chain-a)"/>
  <rect class="acc" x="780" y="212" width="180" height="178" rx="8"/>
  <text class="sm b acc-t" x="790" y="232" xml:space="preserve">⑩ 死代码消除（最终定态）</text>
  <text class="sm muted" x="952" y="232" text-anchor="end" xml:space="preserve">77</text>
  <text class="mono sm" x="794" y="258" xml:space="preserve">a := x * x</text>
  <text class="mono sm" x="794" y="276" xml:space="preserve">g := 12 * a</text>
  <polyline class="ln" points="870.0,179 870.0,192 90.0,192 90.0,210" marker-end="url(#opt-local-chain-a)"/>
  <text class="sm" x="0" y="418" xml:space="preserve">橙色高亮 = 当前轮次发生改写的语句。经 500 次随机 x 赋值验证各阶段 g 值严格恒等。讲义提及 ⑧–⑩ 的高阶结合律化简“多数朴素编译器往往会遗漏”。</text>
  <text class="sm" x="0" y="436" xml:space="preserve">gcc 13.3 -O2 (x86-64) 实测编译输出： <tspan class="mono b">imul edi, edi</tspan> · <tspan class="mono b">lea eax, [rdi+rdi*2]</tspan> · <tspan class="mono b">sal eax, 2</tspan><tspan class="b blue-t">  → (x·x)·3·4 = 12·a，现代工业编译器直达最终定态</tspan></text>
</svg>
