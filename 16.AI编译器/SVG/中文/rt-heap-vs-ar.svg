<svg xmlns="http://www.w3.org/2000/svg" width="932" height="242" viewBox="-16 -16 932 242" role="img" aria-label="为什么 new Bar() 不能存放在 foo 的激活记录中：foo 返回时栈帧会被回收，而 Bar 必须继续存活，因此要分配在堆区并由栈帧中的指针指向它。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.8; stroke-dasharray: 5 3; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="932" height="242" rx="14" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="rt-ha-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="h-blue" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="0" y="0" width="420" height="210" rx="8"/>
  <text class="b" x="18" y="26" xml:space="preserve">栈帧：foo() 的激活记录</text>
  <text class="sm muted" x="18" y="46" xml:space="preserve">函数返回时立即销毁，无法保留长寿命对象</text>
  <rect class="bad" x="22" y="64" width="376" height="62" rx="6"/>
  <text class="b acc-t" x="38" y="88" xml:space="preserve">✕ 不能把 Bar 实例放在栈帧里</text>
  <text class="sm" x="38" y="109" xml:space="preserve">foo() 返回后栈帧即被回收，Bar 对象会随之失效</text>
  <rect class="blue" x="22" y="140" width="376" height="50" rx="6"/>
  <text class="mono b blue-t" x="38" y="162" xml:space="preserve">Bar* ptr</text>
  <text class="sm muted" x="38" y="180" xml:space="preserve">栈帧里只留返回地址或指向堆的指针</text>
  <line class="ln-blue" x1="398" y1="165" x2="498" y2="132" marker-end="url(#rt-ha-blue)"/>
  <rect class="box" x="480" y="0" width="420" height="210" rx="8"/>
  <text class="b" x="498" y="26" xml:space="preserve">堆区（Heap）</text>
  <text class="sm muted" x="498" y="46" xml:space="preserve">生命周期独立于栈帧，跨越函数返回继续存在</text>
  <rect class="acc" x="502" y="72" width="376" height="118" rx="8"/>
  <text class="mono lg b" x="690" y="108" text-anchor="middle" xml:space="preserve">new Bar()</text>
  <text class="sm" x="690" y="134" text-anchor="middle" xml:space="preserve">分配在堆上，foo() 返回后依然存活</text>
  <text class="sm muted" x="690" y="158" text-anchor="middle" xml:space="preserve">直到显式 delete / free 或由 GC 回收</text>
</svg>