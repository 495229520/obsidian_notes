<svg xmlns="http://www.w3.org/2000/svg" width="932" height="260" viewBox="-16 -16 932 260" role="img" aria-label="编译器前后端阶段划分：前端包含词法分析、语法分析与语义分析，共同强制执行语言定义；后端包含优化与代码生成。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .h-acc { fill: #D97757; }
  </style>
  <rect x="-16" y="-16" width="932" height="260" rx="14" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="rt-fb-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="h-acc" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="0" y="0" width="430" height="228" rx="8"/>
  <text class="b" x="18" y="26" xml:space="preserve">前端阶段（已完成）</text>
  <text class="sm muted" x="18" y="46" xml:space="preserve">只关心程序是否合法，把违规写法拦在门外</text>
  <rect class="blue" x="20" y="64" width="206" height="40" rx="6"/>
  <text class="b" x="123" y="88.5" text-anchor="middle" xml:space="preserve">词法分析（Lexical analysis）</text>
  <rect class="blue" x="20" y="114" width="206" height="40" rx="6"/>
  <text class="b" x="123" y="138.5" text-anchor="middle" xml:space="preserve">语法分析（Parsing）</text>
  <rect class="blue" x="20" y="164" width="206" height="40" rx="6"/>
  <text class="b" x="123" y="188.5" text-anchor="middle" xml:space="preserve">语义分析（Semantic analysis）</text>
  <polyline class="ln-blue" points="234,84 244,84 244,184 234,184"/>
  <line class="ln-blue" x1="244" y1="134" x2="256" y2="134"/>
  <rect class="plain" x="258" y="106" width="154" height="56" rx="6"/>
  <text class="b blue-t" x="335" y="130" text-anchor="middle" xml:space="preserve">强制执行语言定义</text>
  <text class="mono sm muted" x="335" y="149" text-anchor="middle" xml:space="preserve">enforce language def.</text>
  <line class="ln-acc" x1="436" y1="114" x2="464" y2="114" marker-end="url(#rt-fb-acc)"/>
  <rect class="box" x="470" y="0" width="430" height="228" rx="8"/>
  <text class="b" x="488" y="26" xml:space="preserve">后端阶段（接下来）</text>
  <text class="sm muted" x="488" y="46" xml:space="preserve">脱离静态检查，转向性能与目标代码结构</text>
  <rect class="acc" x="490" y="72" width="206" height="52" rx="6"/>
  <text class="b" x="593" y="102.5" text-anchor="middle" xml:space="preserve">优化（Optimization）</text>
  <rect class="acc" x="490" y="142" width="206" height="52" rx="6"/>
  <text class="b" x="593" y="172.5" text-anchor="middle" xml:space="preserve">代码生成（Code generation）</text>
  <rect class="plain" x="710" y="72" width="172" height="122" rx="6"/>
  <text class="b acc-t" x="724" y="96" xml:space="preserve">生成前先解决三件事</text>
  <text class="sm" x="724" y="120" xml:space="preserve">1. 运行时资源管理</text>
  <text class="sm" x="724" y="142" xml:space="preserve">2. 静/动态结构对应</text>
  <text class="sm" x="724" y="164" xml:space="preserve">3. 存储空间如何组织</text>
</svg>