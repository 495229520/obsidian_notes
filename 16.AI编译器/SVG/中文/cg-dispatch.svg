  <text class="mono sm" x="220.0" y="119.0" text-anchor="middle" xml:space="preserve">•</text>
  <rect class="acc" x="256" y="100" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="292.0" y="119.0" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="acc" x="328" y="100" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="364.0" y="119.0" text-anchor="middle" xml:space="preserve">d</text>
  <rect class="box" x="400" y="100" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="436.0" y="119.0" text-anchor="middle" xml:space="preserve">b</text>
  <text class="mono b" x="14" y="166" text-anchor="middle" xml:space="preserve">C</text>
  <rect class="plain" x="40" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm" x="76.0" y="165.0" text-anchor="middle" xml:space="preserve">Ctag</text>
  <rect class="plain" x="112" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm" x="148.0" y="165.0" text-anchor="middle" xml:space="preserve">6</text>
  <rect class="blue" x="184" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm" x="220.0" y="165.0" text-anchor="middle" xml:space="preserve">•</text>
  <rect class="acc" x="256" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="292.0" y="165.0" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="acc" x="328" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="364.0" y="165.0" text-anchor="middle" xml:space="preserve">d</text>
  <rect class="box" x="400" y="146" width="72" height="30" rx="3"/>
  <text class="mono sm b" x="436.0" y="165.0" text-anchor="middle" xml:space="preserve">c</text>
  <text class="sm muted" x="76.0" y="196" text-anchor="middle" xml:space="preserve">类标签</text>
  <text class="sm muted" x="148.0" y="196" text-anchor="middle" xml:space="preserve">大小(字)</text>
  <text class="sm muted" x="220.0" y="196" text-anchor="middle" xml:space="preserve">分派表地址</text>
  <text class="sm muted" x="364.0" y="196" text-anchor="middle" xml:space="preserve">属性：父类在前，自身在后</text>
  <text class="mono sm muted" x="730" y="42" text-anchor="middle" xml:space="preserve">0</text>
  <text class="mono sm muted" x="810" y="42" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="acc" x="690" y="54" width="80" height="30" rx="3"/>
  <text class="mono sm b" x="730.0" y="73.0" text-anchor="middle" xml:space="preserve">fA</text>
  <text class="sm muted" x="780" y="74" xml:space="preserve">A 表</text>
  <rect class="acc" x="690" y="100" width="80" height="30" rx="3"/>
  <text class="mono sm b" x="730.0" y="119.0" text-anchor="middle" xml:space="preserve">fB</text>
  <rect class="blue" x="770" y="100" width="80" height="30" rx="3"/>
  <text class="mono sm b" x="810.0" y="119.0" text-anchor="middle" xml:space="preserve">g</text>
  <text class="sm muted" x="860" y="120" xml:space="preserve">B 表</text>
  <rect class="acc" x="690" y="146" width="80" height="30" rx="3"/>
  <text class="mono sm b" x="730.0" y="165.0" text-anchor="middle" xml:space="preserve">fA</text>
  <rect class="blue" x="770" y="146" width="80" height="30" rx="3"/>
  <text class="mono sm b" x="810.0" y="165.0" text-anchor="middle" xml:space="preserve">h</text>
  <text class="sm muted" x="860" y="166" xml:space="preserve">C 表</text>
  <polyline class="ln-blue" points="220.0,84 220.0,92 626,92 626,69 686,69" marker-end="url(#cg-dispatch-blue)"/>
  <polyline class="ln-blue" points="220.0,130 220.0,138 618,138 618,115 686,115" marker-end="url(#cg-dispatch-blue)"/>
  <polyline class="ln-blue" points="220.0,176 220.0,184 610,184 610,161 686,161" marker-end="url(#cg-dispatch-blue)"/>
  <text class="sm acc-t" x="690" y="202" xml:space="preserve">f 在每张表里都位于偏移 0</text>
  <text class="sm muted" x="690" y="220" xml:space="preserve">变的只是槽位里填入的函数地址</text>
  <rect class="box" x="0" y="238" width="960" height="166" rx="8"/>
  <text class="sm b" x="16" y="262" xml:space="preserve">将同一组类改写为 C++ 并用 g++ 13.3 (x86-64) 编译的实测</text>
  <text class="sm" x="16" y="290" xml:space="preserve">对象：vptr@0, a@8, d@12, b·c@16  /  sizeof A = 16, B = 24, C = 24（b 后的 4 字节为 8 字节对齐填充）</text>
  <text class="sm" x="16" y="318" xml:space="preserve">vtable (-fdump-lang-class)：A = [A::f]   B = [B::f, B::g]   C = [A::f, C::h]（首项前还有 offset-to-top 与 RTTI 两项）</text>
  <text class="mono sm" x="16" y="346" xml:space="preserve">int callf(A* p) { return p-&gt;f(); }  →  -O2: movq (%rdi), %rax ; jmp *(%rax)   （读出 vptr 并跳转到第 0 项）</text>
  <text class="sm" x="16" y="374" xml:space="preserve">同一个 callf 对 A、B、C 对象分别返回 1、0、1（实际执行 A::f、B::f、A::f）</text>
</svg>
