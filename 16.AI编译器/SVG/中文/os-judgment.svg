<svg xmlns="http://www.w3.org/2000/svg" width="972" height="436" viewBox="-16 -16 972 436" role="img" aria-label="求值判断 so, E, S ⊢ e : v, S′ 的结构。⊢ 左侧的 so, E, S 为求值前状态（输入），右侧的 v 与 S′ 为求值结果（输出）。so 与 E 在单个表达式求值期间保持不变，因此不在输出中。下方表格展示了求值判断与类型判断 O, M, C ⊢ e : T 的对应关系：C 为代码所在类，so 为实际运行的对象；O 为名字到类型的一步映射，E 和 S 为名字到位置、位置到值的两步映射。">
  <style>
    text { fill: #141413; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="972" height="436" rx="14" fill="#F0EEE6"/>
  <defs><marker id="os-judgment-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-judgment-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-judgment-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="18" xml:space="preserve">求值判断的结构：⊢ 左侧为输入，右侧为输出</text>
  <polyline class="ln-blue" points="64,52 64,44 396,44 396,52"/>
  <text class="sm b blue-t" x="230" y="36" text-anchor="middle" xml:space="preserve">输入：求值前状态</text>
  <polyline class="ln-acc" points="596,52 596,44 804,44 804,52"/>
  <text class="sm b acc-t" x="700" y="36" text-anchor="middle" xml:space="preserve">输出：求值结果</text>
  <rect class="plain" x="78.0" y="60.0" width="64" height="36" rx="6"/>
  <text class="mono b" x="110" y="82.5" text-anchor="middle" xml:space="preserve">so</text>
  <rect class="plain" x="198.0" y="60.0" width="64" height="36" rx="6"/>
  <text class="mono b" x="230" y="82.5" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="blue" x="318.0" y="60.0" width="64" height="36" rx="6"/>
  <text class="mono b" x="350" y="82.5" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="box" x="478.0" y="60.0" width="64" height="36" rx="6"/>
  <text class="mono b" x="510" y="82.5" text-anchor="middle" xml:space="preserve">e</text>
  <rect class="acc" x="608.0" y="60.0" width="64" height="36" rx="6"/>
  <text class="mono b" x="640" y="82.5" text-anchor="middle" xml:space="preserve">v</text>
  <rect class="acc" x="728.0" y="60.0" width="64" height="36" rx="6"/>
  <text class="mono b" x="760" y="82.5" text-anchor="middle" xml:space="preserve">S′</text>
  <text class="mono b" x="170" y="82" text-anchor="middle" xml:space="preserve">,</text>
  <text class="mono b" x="290" y="82" text-anchor="middle" xml:space="preserve">,</text>
  <text class="mono lg" x="430" y="83" text-anchor="middle" xml:space="preserve">⊢</text>
  <text class="mono b" x="575" y="82" text-anchor="middle" xml:space="preserve">:</text>
  <text class="mono b" x="700" y="82" text-anchor="middle" xml:space="preserve">,</text>
  <text class="sm" x="110" y="116" text-anchor="middle" xml:space="preserve">当前 self 对象</text>
  <text class="sm muted" x="110" y="134" text-anchor="middle" xml:space="preserve">求值期间不变</text>
  <text class="sm" x="230" y="116" text-anchor="middle" xml:space="preserve">名字 → 位置</text>
  <text class="sm muted" x="230" y="134" text-anchor="middle" xml:space="preserve">求值期间不变</text>
  <text class="sm" x="350" y="116" text-anchor="middle" xml:space="preserve">位置 → 值</text>
  <text class="sm muted" x="350" y="134" text-anchor="middle" xml:space="preserve">求值前存储</text>
  <text class="sm" x="510" y="116" text-anchor="middle" xml:space="preserve">待求值表达式</text>
  <text class="sm" x="640" y="116" text-anchor="middle" xml:space="preserve">求值结果值</text>
  <text class="sm" x="760" y="116" text-anchor="middle" xml:space="preserve">位置 → 值</text>
  <text class="sm muted" x="760" y="134" text-anchor="middle" xml:space="preserve">求值后存储</text>
  <text class="sm acc-t" x="940" y="116" text-anchor="end" xml:space="preserve">S′ = S + e 的</text>
  <text class="sm acc-t" x="940" y="134" text-anchor="end" xml:space="preserve">副作用更新</text>
  <rect class="box" x="0" y="152" width="940" height="190" rx="8"/>
  <text class="sm b" x="16" y="176" xml:space="preserve">类型判断</text>
  <text class="mono sm" x="90" y="176" xml:space="preserve">O, M, C ⊢ e : T</text>
  <text class="sm muted" x="16" y="194" xml:space="preserve">(类型检查规则)</text>
  <text class="sm b" x="400" y="176" xml:space="preserve">求值判断</text>
  <text class="mono sm" x="474" y="176" xml:space="preserve">so, E, S ⊢ e : v, S′</text>
  <line class="ln-muted" x1="0" y1="204" x2="940" y2="204"/>
  <text class="sm" x="16" y="226" xml:space="preserve">C: 当前代码所在的类（编译期静态类型）</text>
  <text class="sm" x="400" y="226" xml:space="preserve">so: 实际运行中的对象。动态类型可能是 C 的子类</text>
  <text class="sm" x="16" y="256" xml:space="preserve">O: 名字 → 类型（一步映射）</text>
  <text class="sm" x="400" y="256" xml:space="preserve">E 与 S: 名字 → 位置 → 值 (两步映射)</text>
  <text class="sm" x="16" y="286" xml:space="preserve">M: 方法签名表</text>
  <text class="sm" x="400" y="286" xml:space="preserve">无对应项。方法调用时通过 impl(X, f) 在动态类 X 中查找方法体</text>
  <text class="sm" x="16" y="316" xml:space="preserve">T: 静态类型。上下文没有输出</text>
  <text class="sm" x="400" y="316" xml:space="preserve">v: 运行结果值。S′: 包含副作用的新存储</text>
  <text class="sm muted" x="0" y="370" xml:space="preserve">判断仅在表达式 e 求值能够正常终止（terminates）时才成立。对于不终止的表达式（如条件恒为真的 while 死循环），不存在满足该判断的 v 和 S′（Slide 24–25）。</text>
  <text class="sm muted" x="0" y="392" xml:space="preserve">so 与 E 不在输出侧的原因：求值单个表达式期间二者保持不变。self 的属性值虽然可能改变，但变化保存在存储 S 中（Slide 26）。</text>
</svg>
