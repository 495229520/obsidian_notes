<svg xmlns="http://www.w3.org/2000/svg" width="972" height="502" viewBox="-16 -16 972 502" role="img" aria-label="课件第 12 页的活跃变量集合及其寄存器干涉图，包含 11 条边，使用 4 种颜色">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="972" height="502" rx="14" fill="#F0EEE6"/>
  <defs><marker id="ra-rig-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ra-rig-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ra-rig-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">① 程序与活跃变量集合（出口处仅 b 活跃）</text>
  <rect class="box" x="120" y="50" width="150" height="26" rx="4"/>
  <text class="mono sm" x="195.0" y="67.0" text-anchor="middle" xml:space="preserve">a := b + c</text>
  <rect class="box" x="120" y="98" width="150" height="26" rx="4"/>
  <text class="mono sm" x="195.0" y="115.0" text-anchor="middle" xml:space="preserve">d := -a</text>
  <rect class="box" x="120" y="146" width="150" height="26" rx="4"/>
  <text class="mono sm" x="195.0" y="163.0" text-anchor="middle" xml:space="preserve">e := d + f</text>
  <text class="mono sm b blue-t" x="278" y="44" xml:space="preserve">{b,c,f}</text>
  <text class="mono sm b blue-t" x="278" y="92" xml:space="preserve">{a,c,f}</text>
  <text class="mono sm b blue-t" x="278" y="140" xml:space="preserve">{c,d,f}</text>
  <text class="mono sm b blue-t" x="278" y="188" xml:space="preserve">{c,d,e,f}</text>
  <line class="ln" x1="195" y1="76" x2="195" y2="96" marker-end="url(#ra-rig-a)"/>
  <line class="ln" x1="195" y1="124" x2="195" y2="144" marker-end="url(#ra-rig-a)"/>
  <line class="ln" x1="195" y1="20" x2="195" y2="48" marker-end="url(#ra-rig-a)"/>
  <polyline class="ln" points="195,172 195,196 80,196 80,226" marker-end="url(#ra-rig-a)"/>
  <polyline class="ln" points="195,196 300,196 300,226" marker-end="url(#ra-rig-a)"/>
  <rect class="box" x="10" y="228" width="140" height="26" rx="4"/>
  <text class="mono sm" x="80.0" y="245.0" text-anchor="middle" xml:space="preserve">f := 2 * e</text>
  <text class="mono sm b blue-t" x="14" y="222" xml:space="preserve">{c,e}</text>
  <rect class="box" x="230" y="228" width="140" height="26" rx="4"/>
  <text class="mono sm" x="300.0" y="245.0" text-anchor="middle" xml:space="preserve">b := d + e</text>
  <rect class="box" x="230" y="280" width="140" height="26" rx="4"/>
  <text class="mono sm" x="300.0" y="297.0" text-anchor="middle" xml:space="preserve">e := e - 1</text>
  <text class="mono sm b blue-t" x="310" y="218" xml:space="preserve">{c,d,e,f}</text>
  <text class="mono sm b blue-t" x="374" y="274" xml:space="preserve">{b,c,e,f}</text>
  <text class="mono sm b blue-t" x="374" y="326" xml:space="preserve">{b,c,f}</text>
  <line class="ln" x1="300" y1="254" x2="300" y2="278" marker-end="url(#ra-rig-a)"/>
  <text class="mono sm b blue-t" x="14" y="270" xml:space="preserve">{c,f}</text>
  <polyline class="ln" points="80,254 80,350 170,350 170,362" marker-end="url(#ra-rig-a)"/>
  <polyline class="ln" points="300,306 300,350 220,350 220,362" marker-end="url(#ra-rig-a)"/>
  <polyline class="ln-acc" points="370,293 446,293 446,24 198,24" marker-end="url(#ra-rig-acc)"/>
  <text class="sm acc-t" x="452" y="160" xml:space="preserve">回边</text>
  <rect class="box" x="120" y="364" width="150" height="26" rx="4"/>
  <text class="mono sm" x="195.0" y="381.0" text-anchor="middle" xml:space="preserve">b := f + c</text>
  <text class="mono sm b blue-t" x="278" y="380" xml:space="preserve">{c,f}</text>
  <text class="mono sm b blue-t" x="278" y="402" xml:space="preserve">{b}</text>
  <line class="ln" x1="195" y1="390" x2="195" y2="410" marker-end="url(#ra-rig-a)"/>
  <text class="sm muted" x="206" y="424" xml:space="preserve">出口</text>
  <text class="sm muted" x="0" y="456" xml:space="preserve">同一集合内的每一对变量连一条边。例如 {c,d,e,f} → c–d、c–e、c–f、d–e、d–f、e–f</text>
  <text class="b" x="560" y="14" xml:space="preserve">② 寄存器干涉图（RIG）示例</text>
  <line class="ln" x1="737.1940240686896" y1="87.58539216790786" x2="812.8059759313104" y2="272.41460783209214"/>
  <line class="ln" x1="716.5649711574556" y1="83.4350288425444" x2="653.4350288425444" y2="146.5649711574556"/>
  <line class="ln" x1="820.0" y1="179.0" x2="820.0" y2="271.0"/>
  <line class="ln" x1="804.5970946604023" y1="171.1243205230428" x2="655.4029053395977" y2="278.8756794769572"/>
  <line class="ln" x1="801.0" y1="160.0" x2="659.0" y2="160.0"/>
  <line class="ln" x1="806.5649711574556" y1="303.4350288425444" x2="743.4350288425444" y2="366.5649711574556"/>
  <line class="ln" x1="801.0" y1="290.0" x2="659.0" y2="290.0"/>
  <line class="ln" x1="804.5970946604023" y1="278.8756794769572" x2="655.4029053395977" y2="171.1243205230428"/>
  <line class="ln" x1="716.5649711574556" y1="366.5649711574556" x2="653.4350288425444" y2="303.4350288425444"/>
  <line class="ln" x1="722.8059759313104" y1="362.41460783209214" x2="647.1940240686896" y2="177.58539216790786"/>
  <line class="ln" x1="640.0" y1="271.0" x2="640.0" y2="179.0"/>
  <circle class="blue" cx="730" cy="70" r="19"/>
  <text class="mono b" x="730" y="75" text-anchor="middle" xml:space="preserve">a</text>
  <text class="mono sm b blue-t" x="730" y="44" text-anchor="middle" xml:space="preserve">(r2)</text>
  <circle class="acc" cx="640" cy="160" r="19"/>
  <text class="mono b" x="640" y="165" text-anchor="middle" xml:space="preserve">f</text>
  <text class="mono sm b acc-t" x="615" y="164" text-anchor="end" xml:space="preserve">(r1)</text>
  <circle class="green" cx="820" cy="160" r="19"/>
  <text class="mono b" x="820" y="165" text-anchor="middle" xml:space="preserve">b</text>
  <text class="mono sm b green-t" x="845" y="164" xml:space="preserve">(r3)</text>
  <circle class="blue" cx="640" cy="290" r="19"/>
  <text class="mono b" x="640" y="295" text-anchor="middle" xml:space="preserve">e</text>
  <text class="mono sm b blue-t" x="615" y="294" text-anchor="end" xml:space="preserve">(r2)</text>
  <circle class="dead" cx="820" cy="290" r="19"/>
  <text class="mono b" x="820" y="295" text-anchor="middle" xml:space="preserve">c</text>
  <text class="mono sm b muted" x="845" y="294" xml:space="preserve">(r4)</text>
  <circle class="green" cx="730" cy="380" r="19"/>
  <text class="mono b" x="730" y="385" text-anchor="middle" xml:space="preserve">d</text>
  <text class="mono sm b green-t" x="730" y="414" text-anchor="middle" xml:space="preserve">(r3)</text>
  <text class="sm muted" x="910" y="40" text-anchor="end" xml:space="preserve">括号内为寄存器，如 (r2)</text>
  <rect class="plain" x="756" y="360" width="184" height="100" rx="8"/>
  <text class="sm" x="768" y="381.0" xml:space="preserve">c、d、e、f 两两相邻，</text>
  <text class="sm" x="768" y="397.5" xml:space="preserve">构成完全图 K₄。</text>
  <text class="sm" x="768" y="414.0" xml:space="preserve">三色无法完成分配，</text>
  <text class="sm" x="768" y="430.5" xml:space="preserve">至少要 4 色，即 4 个寄存器。</text>
</svg>
