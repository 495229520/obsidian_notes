<svg xmlns="http://www.w3.org/2000/svg" width="972" height="318" viewBox="-16 -16 972 318" role="img" aria-label="环境 E 与存储 S 的两步查找机制。变量名 x, y 经环境 E 映射到内存位置 l_x, l_y，内存位置经存储 S 映射到存储的值 v_x, v_y。赋值后 v_y 更新为 v_x + 1。右侧展示在 x = 5, y = 0 下求值 y ← x + 1 的前后对比：E 保持不变，S 中仅 l_y 的值由 0 变为 6，得到新存储 S′ = S[6/l_y]。">
  <style>
    text { fill: #141413; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="972" height="318" rx="14" fill="#F0EEE6"/>
  <defs><marker id="os-env-store-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-env-store-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-env-store-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="540" height="286" rx="8"/>
  <text class="sm b" x="70" y="26" text-anchor="middle" xml:space="preserve">变量名 (vars)</text>
  <text class="sm b" x="260" y="26" text-anchor="middle" xml:space="preserve">内存位置 (locs)</text>
  <text class="sm b" x="450" y="26" text-anchor="middle" xml:space="preserve">存储的值 (values)</text>
  <line class="ln-muted" x1="16" y1="36" x2="524" y2="36"/>
  <rect class="plain" x="46.0" y="57.0" width="48" height="30" rx="6"/>
  <text class="mono b" x="70" y="76.5" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="blue" x="228.0" y="57.0" width="64" height="30" rx="6"/>
  <text class="mono" x="260" y="76.5" text-anchor="middle" xml:space="preserve">l_x</text>
  <rect class="box" x="418.0" y="57.0" width="64" height="30" rx="6"/>
  <text class="mono" x="450" y="76.5" text-anchor="middle" xml:space="preserve">v_x</text>
  <line class="ln-blue" x1="98" y1="72" x2="224" y2="72" marker-end="url(#os-env-store-blue)"/>
  <text class="mono sm b blue-t" x="161" y="64" text-anchor="middle" xml:space="preserve">[E]</text>
  <line class="ln" x1="296" y1="72" x2="414" y2="72" marker-end="url(#os-env-store-a)"/>
  <text class="mono sm b" x="355" y="64" text-anchor="middle" xml:space="preserve">[S]</text>
  <rect class="plain" x="46.0" y="119.0" width="48" height="30" rx="6"/>
  <text class="mono b" x="70" y="138.5" text-anchor="middle" xml:space="preserve">y</text>
  <rect class="blue" x="228.0" y="119.0" width="64" height="30" rx="6"/>
  <text class="mono" x="260" y="138.5" text-anchor="middle" xml:space="preserve">l_y</text>
  <rect class="acc" x="418.0" y="119.0" width="64" height="30" rx="6"/>
  <text class="mono" x="450" y="138.5" text-anchor="middle" xml:space="preserve">v_y</text>
  <line class="ln-blue" x1="98" y1="134" x2="224" y2="134" marker-end="url(#os-env-store-blue)"/>
  <text class="mono sm b blue-t" x="161" y="126" text-anchor="middle" xml:space="preserve">[E]</text>
  <line class="ln" x1="296" y1="134" x2="414" y2="134" marker-end="url(#os-env-store-a)"/>
  <text class="mono sm b" x="355" y="126" text-anchor="middle" xml:space="preserve">[S]</text>
  <text class="sm acc-t" x="450" y="172" text-anchor="middle" xml:space="preserve">(赋值后更新为 v_x + 1)</text>
  <line class="ln-muted" x1="16" y1="190" x2="524" y2="190"/>
  <text class="mono sm" x="16" y="214" xml:space="preserve"><tspan class="b blue-t">E = [x : l_x, y : l_y]</tspan><tspan class="muted">    名字 : 位置，由作用域决定</tspan></text>
  <text class="mono sm" x="16" y="238" xml:space="preserve"><tspan class="b">S = [l_x → v_x, l_y → v_y]</tspan><tspan class="muted">  位置 → 值，由赋值语句改写</tspan></text>
  <text class="sm muted" x="16" y="268" xml:space="preserve">存储映射用箭头表示，避免与环境映射的冒号混淆（Slide 21）</text>
  <rect class="box" x="560" y="0" width="380" height="286" rx="8"/>
  <text class="b" x="576" y="26" xml:space="preserve">y ← x + 1 执行前后 (初始 x = 5, y = 0)</text>
  <text class="sm muted" x="576" y="46" xml:space="preserve">E 保持不变，仅 S 发生变化</text>
  <text class="sm b" x="660" y="76" text-anchor="middle" xml:space="preserve">S (求值前)</text>
  <rect class="blue" x="590" y="88" width="56" height="30" rx="3"/>
  <text class="mono sm" x="618.0" y="107.0" text-anchor="middle" xml:space="preserve">l_x</text>
  <rect class="plain" x="646" y="88" width="84" height="30" rx="3"/>
  <text class="mono sm" x="688.0" y="107.0" text-anchor="middle" xml:space="preserve">Int(5)</text>
  <rect class="blue" x="590" y="118" width="56" height="30" rx="3"/>
  <text class="mono sm" x="618.0" y="137.0" text-anchor="middle" xml:space="preserve">l_y</text>
  <rect class="plain" x="646" y="118" width="84" height="30" rx="3"/>
  <text class="mono sm" x="688.0" y="137.0" text-anchor="middle" xml:space="preserve">Int(0)</text>
  <text class="sm b" x="840" y="76" text-anchor="middle" xml:space="preserve">S′ = S[6/l_y] (求值后)</text>
  <rect class="blue" x="770" y="88" width="56" height="30" rx="3"/>
  <text class="mono sm" x="798.0" y="107.0" text-anchor="middle" xml:space="preserve">l_x</text>
  <rect class="plain" x="826" y="88" width="84" height="30" rx="3"/>
  <text class="mono sm" x="868.0" y="107.0" text-anchor="middle" xml:space="preserve">Int(5)</text>
  <rect class="blue" x="770" y="118" width="56" height="30" rx="3"/>
  <text class="mono sm" x="798.0" y="137.0" text-anchor="middle" xml:space="preserve">l_y</text>
  <rect class="acc" x="826" y="118" width="84" height="30" rx="3"/>
  <text class="mono sm b" x="868.0" y="137.0" text-anchor="middle" xml:space="preserve">Int(6)</text>
  <line class="ln-acc" x1="736" y1="118" x2="764" y2="118" marker-end="url(#os-env-store-acc)"/>
  <text class="mono sm" x="576" y="180" xml:space="preserve"><tspan class="blue-t">E = [x : l_x, y : l_y]</tspan><tspan class="muted">  前后保持相同</tspan></text>
  <text class="sm" x="576" y="206" xml:space="preserve">S′(l_y) = 6，其余位置与 S 完全相同</text>
  <text class="sm muted" x="576" y="234" xml:space="preserve">S[v/l]: 仅将位置 l 的值替换为 v 的</text>
  <text class="sm muted" x="576" y="252" xml:space="preserve">新存储（Slide 21 的存储更新操作）</text>
</svg>
