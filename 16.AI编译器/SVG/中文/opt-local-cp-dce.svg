<svg xmlns="http://www.w3.org/2000/svg" width="972" height="208" viewBox="-16 -16 972 208" role="img" aria-label="基本块内的常量传播与死代码消除。初始基本块为 int x = 3; int y = z * w; int q = x + y;。常量传播阶段沿着数据流将 x = 3 代入，变为 q = 3 + y。死代码消除阶段检测到 x 之后不再被读取且无副作用，将 int x = 3; 作为死代码安全消除，仅保留 int y = z * w; 与 int q = 3 + y;。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="972" height="208" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-local-cp-dce-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-local-cp-dce-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-local-cp-dce-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="125" y="14" text-anchor="middle" xml:space="preserve">[ 初始基本块 ]</text>
  <rect class="box" x="0" y="28" width="250" height="100" rx="8"/>
  <text class="b" x="470" y="14" text-anchor="middle" xml:space="preserve">[ 常量传播 ]</text>
  <rect class="blue" x="345" y="28" width="250" height="100" rx="8"/>
  <text class="b" x="815" y="14" text-anchor="middle" xml:space="preserve">[ 死代码消除 ]</text>
  <rect class="acc" x="690" y="28" width="250" height="100" rx="8"/>
  <text class="mono" x="20" y="58" xml:space="preserve">int x = 3;</text>
  <text class="mono" x="20" y="84" xml:space="preserve">int y = z * w;</text>
  <text class="mono" x="20" y="110" xml:space="preserve">int q = x + y;</text>
  <text class="mono" x="365" y="58" xml:space="preserve">int x = 3;</text>
  <text class="mono" x="365" y="84" xml:space="preserve">int y = z * w;</text>
  <text class="mono" x="365" y="110" xml:space="preserve">int q = <tspan class="b blue-t">3</tspan> + y;</text>
  <text class="mono muted" x="710" y="58" xml:space="preserve">int x = 3;</text>
  <line x1="708" y1="54" x2="789.5" y2="54" stroke="#B0532F" stroke-width="1.4"/>
  <text class="mono" x="710" y="84" xml:space="preserve">int y = z * w;</text>
  <text class="mono" x="710" y="110" xml:space="preserve">int q = 3 + y;</text>
  <line class="ln" x1="254" y1="78" x2="340" y2="78" marker-end="url(#opt-local-cp-dce-a)"/>
  <text class="mono sm muted" x="297" y="70" text-anchor="middle" xml:space="preserve">===&gt;</text>
  <line class="ln" x1="599" y1="78" x2="685" y2="78" marker-end="url(#opt-local-cp-dce-a)"/>
  <text class="mono sm muted" x="642" y="70" text-anchor="middle" xml:space="preserve">===&gt;</text>
  <text class="sm blue-t" x="470" y="152" text-anchor="middle" xml:space="preserve">(沿数据流将 x=3 代入引用点)</text>
  <text class="sm acc-t" x="815" y="152" text-anchor="middle" xml:space="preserve">(x 后续未被读取且赋值无副作用，</text>
  <text class="sm acc-t" x="815" y="170" text-anchor="middle" xml:space="preserve">作为死代码安全剔除)</text>
  <text class="sm muted" x="125" y="152" text-anchor="middle" xml:space="preserve">Slide 3</text>
</svg>
