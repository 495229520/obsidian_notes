<svg xmlns="http://www.w3.org/2000/svg" width="920" height="332" viewBox="-16 -16 920 332" role="img" aria-label="执行 sum(2) 期间栈帧压入与回收的六个瞬间。按 sum(2)、sum(1)、sum(0) 的顺序向上压栈，返回时从顶部依次回收。等待中的调用保留各自的 x，并与返回的 y 相加。被回收的栈帧只是回退了 SP，值虽残留在内存里但已失效。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="920" height="332" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="rt-sum-calls-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-sum-calls-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-sum-calls-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="68" y="14" text-anchor="middle" xml:space="preserve">① 调用 sum(2)</text>
  <text class="sm muted" x="68" y="34" text-anchor="middle" xml:space="preserve">压入新栈帧</text>
  <rect class="box" x="0" y="44" width="136" height="216" rx="8"/>
  <rect class="plain" x="10" y="210" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="68.0" y="234.5" text-anchor="middle" xml:space="preserve">main</text>
  <rect class="acc" x="10" y="164" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="68.0" y="181.0" text-anchor="middle" xml:space="preserve">sum(2)</text>
  <text class="mono sm" x="68.0" y="196.0" text-anchor="middle" xml:space="preserve">x=2, y=?</text>
  <text class="b" x="218" y="14" text-anchor="middle" xml:space="preserve">② 调用 sum(1)</text>
  <text class="sm muted" x="218" y="34" text-anchor="middle" xml:space="preserve">保留 x=2 并等待</text>
  <rect class="box" x="150" y="44" width="136" height="216" rx="8"/>
  <rect class="plain" x="160" y="210" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="218.0" y="234.5" text-anchor="middle" xml:space="preserve">main</text>
  <rect class="blue" x="160" y="164" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="218.0" y="181.0" text-anchor="middle" xml:space="preserve">sum(2)</text>
  <text class="mono sm" x="218.0" y="196.0" text-anchor="middle" xml:space="preserve">x=2, y=?</text>
  <rect class="acc" x="160" y="118" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="218.0" y="135.0" text-anchor="middle" xml:space="preserve">sum(1)</text>
  <text class="mono sm" x="218.0" y="150.0" text-anchor="middle" xml:space="preserve">x=1, y=?</text>
  <text class="b" x="368" y="14" text-anchor="middle" xml:space="preserve">③ 调用 sum(0)</text>
  <text class="sm muted" x="368" y="34" text-anchor="middle" xml:space="preserve">3 个存活的 x</text>
  <rect class="box" x="300" y="44" width="136" height="216" rx="8"/>
  <rect class="plain" x="310" y="210" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="368.0" y="234.5" text-anchor="middle" xml:space="preserve">main</text>
  <rect class="blue" x="310" y="164" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="368.0" y="181.0" text-anchor="middle" xml:space="preserve">sum(2)</text>
  <text class="mono sm" x="368.0" y="196.0" text-anchor="middle" xml:space="preserve">x=2, y=?</text>
  <rect class="blue" x="310" y="118" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="368.0" y="135.0" text-anchor="middle" xml:space="preserve">sum(1)</text>
  <text class="mono sm" x="368.0" y="150.0" text-anchor="middle" xml:space="preserve">x=1, y=?</text>
  <rect class="acc" x="310" y="72" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="368.0" y="89.0" text-anchor="middle" xml:space="preserve">sum(0)</text>
  <text class="mono sm" x="368.0" y="104.0" text-anchor="middle" xml:space="preserve">x=0</text>
  <text class="b" x="518" y="14" text-anchor="middle" xml:space="preserve">④ sum(0) 返回</text>
  <text class="sm muted" x="518" y="34" text-anchor="middle" xml:space="preserve">返回 0 并回收</text>
  <rect class="box" x="450" y="44" width="136" height="216" rx="8"/>
  <rect class="plain" x="460" y="210" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="518.0" y="234.5" text-anchor="middle" xml:space="preserve">main</text>
  <rect class="blue" x="460" y="164" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="518.0" y="181.0" text-anchor="middle" xml:space="preserve">sum(2)</text>
  <text class="mono sm" x="518.0" y="196.0" text-anchor="middle" xml:space="preserve">x=2, y=?</text>
  <rect class="acc" x="460" y="118" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="518.0" y="135.0" text-anchor="middle" xml:space="preserve">sum(1)</text>
  <text class="mono sm" x="518.0" y="150.0" text-anchor="middle" xml:space="preserve">x=1, y=0</text>
  <rect class="ghost" x="460" y="72" width="116" height="40" rx="6"/>
  <text class="mono sm b muted" x="518.0" y="89.0" text-anchor="middle" xml:space="preserve">sum(0)</text>
  <text class="mono sm muted" x="518.0" y="104.0" text-anchor="middle" xml:space="preserve">x=0</text>
  <text class="b" x="668" y="14" text-anchor="middle" xml:space="preserve">⑤ sum(1) 返回</text>
  <text class="sm muted" x="668" y="34" text-anchor="middle" xml:space="preserve">返回 1 + 0 = 1</text>
  <rect class="box" x="600" y="44" width="136" height="216" rx="8"/>
  <rect class="plain" x="610" y="210" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="668.0" y="234.5" text-anchor="middle" xml:space="preserve">main</text>
  <rect class="acc" x="610" y="164" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="668.0" y="181.0" text-anchor="middle" xml:space="preserve">sum(2)</text>
  <text class="mono sm" x="668.0" y="196.0" text-anchor="middle" xml:space="preserve">x=2, y=1</text>
  <rect class="ghost" x="610" y="118" width="116" height="40" rx="6"/>
  <text class="mono sm b muted" x="668.0" y="135.0" text-anchor="middle" xml:space="preserve">sum(1)</text>
  <text class="mono sm muted" x="668.0" y="150.0" text-anchor="middle" xml:space="preserve">x=1, y=0</text>
  <text class="b" x="818" y="14" text-anchor="middle" xml:space="preserve">⑥ sum(2) 返回</text>
  <text class="sm muted" x="818" y="34" text-anchor="middle" xml:space="preserve">返回 2 + 1 = 3</text>
  <rect class="box" x="750" y="44" width="136" height="216" rx="8"/>
  <rect class="acc" x="760" y="210" width="116" height="40" rx="6"/>
  <text class="mono sm b" x="818.0" y="227.0" text-anchor="middle" xml:space="preserve">main</text>
  <text class="mono sm" x="818.0" y="242.0" text-anchor="middle" xml:space="preserve">r = 3</text>
  <rect class="ghost" x="760" y="164" width="116" height="40" rx="6"/>
  <text class="mono sm b muted" x="818.0" y="181.0" text-anchor="middle" xml:space="preserve">sum(2)</text>
  <text class="mono sm muted" x="818.0" y="196.0" text-anchor="middle" xml:space="preserve">x=2, y=1</text>
  <rect class="acc" x="0" y="274" width="18" height="12" rx="3"/>
  <text class="sm" x="24" y="284" xml:space="preserve">正在执行的调用</text>
  <rect class="blue" x="122.6" y="274" width="18" height="12" rx="3"/>
  <text class="sm" x="146.6" y="284" xml:space="preserve">保留 x 并等待返回的调用</text>
  <rect class="ghost" x="334.96000000000004" y="274" width="18" height="12" rx="3"/>
  <text class="sm" x="358.96000000000004" y="284" xml:space="preserve">已回收的栈帧：仅回退 SP，旧值残留但无效</text>
  <text class="sm muted" x="888" y="284" text-anchor="end" xml:space="preserve">越往上越晚压入栈帧</text>
</svg>