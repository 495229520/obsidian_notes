<svg xmlns="http://www.w3.org/2000/svg" width="912" height="258" viewBox="-16 -16 912 258" role="img" aria-label="假设允许 SELF_TYPE 作为形参类型：编译时仅根据 obj 的静态类型 A 接受 comp(new A)，运行时却可能执行 B::comp，试图从 A 对象读取 B 特有的属性 b。">
  <rect x="-16" y="-16" width="912" height="258" fill="rgb(245, 244, 237)" />
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <defs><marker id="sa-param-selftype-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-param-selftype-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-param-selftype-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <rect class="box" x="0" y="0" width="280" height="226" rx="8" />
  <text class="b" x="12" y="22.25" xml:space="preserve">假设的代码（不合法）</text>
  <text class="mono sm" x="12" y="43.0" xml:space="preserve">class A {</text>
  <text class="mono sm" x="12" y="61.8" xml:space="preserve">  comp(x: SELF_TYPE): Bool</text>
  <text class="mono sm" x="12" y="80.5" xml:space="preserve">};</text>
  <text class="mono sm" x="12" y="99.2" xml:space="preserve">class B inherits A {</text>
  <text class="mono sm" x="12" y="118.0" xml:space="preserve">  b: Int;</text>
  <text class="mono sm" x="12" y="136.8" xml:space="preserve">  comp(x: SELF_TYPE): Bool</text>
  <text class="mono sm" x="12" y="155.5" xml:space="preserve">    { … x.b … }</text>
  <text class="mono sm" x="12" y="174.2" xml:space="preserve">};</text>
  <rect class="acc" x="370.0" y="9.0" width="420" height="26" rx="6" />
  <text class="mono" x="580" y="26.5" text-anchor="middle" xml:space="preserve">let obj: A &lt;- new B in obj.comp(new A)</text>
  <rect class="blue" x="330" y="56" width="240" height="84" rx="8" />
  <text class="b" x="450.0" y="84.4" text-anchor="middle" xml:space="preserve">编译时</text>
  <text class="sm" x="450.0" y="102.5" text-anchor="middle" xml:space="preserve">按 obj : A 检查</text>
  <text class="sm" x="450.0" y="120.6" text-anchor="middle" xml:space="preserve">A::comp(x: A) 接受 new A</text>
  <rect class="box" x="610" y="56" width="270" height="84" rx="8" />
  <text class="b" x="745.0" y="84.4" text-anchor="middle" xml:space="preserve">运行时</text>
  <text class="sm" x="745.0" y="102.5" text-anchor="middle" xml:space="preserve">obj 是 B 对象</text>
  <text class="sm" x="745.0" y="120.6" text-anchor="middle" xml:space="preserve">动态分派 → B::comp</text>
  <line class="ln" x1="570" y1="98" x2="608" y2="98" marker-end="url(#sa-param-selftype-a)" />
  <rect class="bad" x="330" y="160" width="550" height="62" rx="8" />
  <text class="b acc-t" x="605.0" y="186.4" text-anchor="middle" xml:space="preserve">B::comp 的 x 是 A 对象，不含 b → 不安全</text>
  <text class="sm" x="605.0" y="204.6" text-anchor="middle" xml:space="preserve">因此，Cool 禁止形参类型为 SELF_TYPE</text>
  <line class="ln-acc" x1="745" y1="140" x2="745" y2="158" marker-end="url(#sa-param-selftype-acc)" />
</svg>
