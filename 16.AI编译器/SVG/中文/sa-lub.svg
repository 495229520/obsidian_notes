<svg xmlns="http://www.w3.org/2000/svg" width="832" height="262" viewBox="-16 -16 832 262" role="img" aria-label="Cool 继承树中的最小上界：Cat 与 Dog 的 lub 是最近公共祖先 Animal，Dog 与 Int 的 lub 是 Object。">
  <rect x="-16" y="-16" width="832" height="262" fill="rgb(245, 244, 237)" />
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <defs><marker id="sa-lub-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-lub-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-lub-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <line class="ln-dash" x1="120" y1="85" x2="300" y2="35" />
  <line class="ln-dash" x1="250" y1="85" x2="300" y2="35" />
  <line class="ln" x1="350" y1="85" x2="300" y2="35" />
  <line class="ln" x1="450" y1="85" x2="300" y2="35" />
  <line class="ln" x1="540" y1="85" x2="300" y2="35" />
  <line class="ln-acc" x1="60" y1="175" x2="120" y2="115" />
  <line class="ln-acc" x1="180" y1="175" x2="120" y2="115" />
  <rect class="blue" x="263.0" y="5" width="74" height="30" rx="6" />
  <text class="mono" x="300" y="24.5" text-anchor="middle" xml:space="preserve">Object</text>
  <rect class="acc" x="83.0" y="85" width="74" height="30" rx="6" />
  <text class="mono" x="120" y="104.5" text-anchor="middle" xml:space="preserve">Animal</text>
  <rect class="box" x="213.0" y="85" width="74" height="30" rx="6" />
  <text class="mono" x="250" y="104.5" text-anchor="middle" xml:space="preserve">Int</text>
  <rect class="box" x="313.0" y="85" width="74" height="30" rx="6" />
  <text class="mono" x="350" y="104.5" text-anchor="middle" xml:space="preserve">String</text>
  <rect class="box" x="413.0" y="85" width="74" height="30" rx="6" />
  <text class="mono" x="450" y="104.5" text-anchor="middle" xml:space="preserve">Bool</text>
  <rect class="box" x="503.0" y="85" width="74" height="30" rx="6" />
  <text class="mono" x="540" y="104.5" text-anchor="middle" xml:space="preserve">IO</text>
  <rect class="box" x="23.0" y="175" width="74" height="30" rx="6" />
  <text class="mono" x="60" y="194.5" text-anchor="middle" xml:space="preserve">Dog</text>
  <rect class="box" x="143.0" y="175" width="74" height="30" rx="6" />
  <text class="mono" x="180" y="194.5" text-anchor="middle" xml:space="preserve">Cat</text>
  <rect class="plain" x="600" y="0" width="200" height="230" rx="8" />
  <text class="b" x="612" y="22.25" xml:space="preserve">查找方法</text>
  <text class="mono sm" x="612" y="43.0" xml:space="preserve">lub(Cat, Dog)</text>
  <text class="mono sm acc-t" x="612" y="61.8" xml:space="preserve">= Animal</text>
  <text class="mono sm" x="612" y="99.2" xml:space="preserve">lub(Dog, Int)</text>
  <text class="mono sm blue-t" x="612" y="118.0" xml:space="preserve">= Object</text>
  <text class="sm" x="612" y="155.5" xml:space="preserve">沿两个类的</text>
  <text class="sm" x="612" y="174.2" xml:space="preserve">父类链向上，寻找</text>
  <text class="sm" x="612" y="193.0" xml:space="preserve">最近公共祖先</text>
  <text class="sm muted" x="0" y="228" xml:space="preserve">橙色实线：Cat、Dog → Animal；虚线：Dog、Int → Object</text>
</svg>
