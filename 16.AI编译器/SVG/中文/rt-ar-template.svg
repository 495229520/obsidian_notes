<svg xmlns="http://www.w3.org/2000/svg" width="932" height="252" viewBox="-16 -16 932 252" role="img" aria-label="函数 f 的激活记录四格模板：包含 result 返回值、argument 参数、control link 控制链和 return address 返回地址。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="252" rx="14" fill="rgb(245, 244, 237)"/>
  <rect class="box" x="0" y="0" width="350" height="220" rx="8"/>
  <text class="b" x="18" y="26" xml:space="preserve">f 的激活记录模板（AR for f）</text>
  <rect class="acc" x="24" y="46" width="302" height="38" rx="0"/>
  <text class="mono b" x="38" y="69.5" xml:space="preserve">result</text>
  <text class="sm acc-t" x="312" y="69.5" text-anchor="end" xml:space="preserve">返回值</text>
  <rect class="blue" x="24" y="84" width="302" height="38" rx="0"/>
  <text class="mono b" x="38" y="107.5" xml:space="preserve">argument</text>
  <text class="sm blue-t" x="312" y="107.5" text-anchor="end" xml:space="preserve">实参（如 x）</text>
  <rect class="plain" x="24" y="122" width="302" height="38" rx="0"/>
  <text class="mono b" x="38" y="145.5" xml:space="preserve">control link</text>
  <text class="sm muted" x="312" y="145.5" text-anchor="end" xml:space="preserve">控制链</text>
  <rect class="plain" x="24" y="160" width="302" height="38" rx="0"/>
  <text class="mono b" x="38" y="183.5" xml:space="preserve">return address</text>
  <text class="sm muted" x="312" y="183.5" text-anchor="end" xml:space="preserve">返回地址</text>
  <rect class="box" x="380" y="0" width="520" height="220" rx="8"/>
  <text class="b" x="398" y="26" xml:space="preserve">四个字段的分工（完成当前调用 + 恢复外层调用）</text>
  <line class="ln-muted" x1="328" y1="65" x2="396" y2="65"/>
  <rect class="plain" x="398" y="48" width="484" height="34" rx="5"/>
  <text class="sm" x="412" y="69" xml:space="preserve">保存本次计算结果，方便调用方恢复后按约定位置取走</text>
  <line class="ln-muted" x1="328" y1="103" x2="396" y2="103"/>
  <rect class="plain" x="398" y="86" width="484" height="34" rx="5"/>
  <text class="sm" x="412" y="107" xml:space="preserve">每层调用各自存一份参数（3 / 2 / 1 / 0），彼此不会覆盖</text>
  <line class="ln-muted" x1="328" y1="141" x2="396" y2="141"/>
  <rect class="plain" x="398" y="124" width="484" height="34" rx="5"/>
  <text class="sm" x="412" y="145" xml:space="preserve">动态链指针，指向调用者 AR，结束时据此退回上一层栈帧</text>
  <line class="ln-muted" x1="328" y1="179" x2="396" y2="179"/>
  <rect class="plain" x="398" y="162" width="484" height="34" rx="5"/>
  <text class="sm" x="412" y="183" xml:space="preserve">记录返回后跳转的指令位置，区分首次 (*) 与递归 (**) 断点</text>
</svg>