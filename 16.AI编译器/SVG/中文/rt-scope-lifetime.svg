<svg xmlns="http://www.w3.org/2000/svg" width="932" height="322" viewBox="-16 -16 932 322" role="img" aria-label="作用域与生命周期对比。左侧是源码中可以使用 p 和 b 的范围，右侧是运行时间轴。make 返回时它的栈帧和 p 就消失了，但用 new 在堆上创建的 Bar 对象直到 main 调用 delete b 才结束生命。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="322" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="rt-scope-lifetime-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-scope-lifetime-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-scope-lifetime-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="360" height="290" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">作用域：源码范围（编译期）</text>
  <text class="mono sm" x="30" y="60" xml:space="preserve">Bar* make() {</text>
  <text class="mono sm" x="30" y="82" xml:space="preserve">    Bar* p = new Bar();</text>
  <text class="mono sm" x="30" y="104" xml:space="preserve">    p-&gt;init();</text>
  <text class="mono sm" x="30" y="126" xml:space="preserve">    return p;</text>
  <text class="mono sm" x="30" y="148" xml:space="preserve">}</text>
  <text class="mono sm" x="30" y="170" xml:space="preserve">int main() {</text>
  <text class="mono sm" x="30" y="192" xml:space="preserve">    Bar* b = make();</text>
  <text class="mono sm" x="30" y="214" xml:space="preserve">    b-&gt;use();</text>
  <text class="mono sm" x="30" y="236" xml:space="preserve">    delete b;</text>
  <text class="mono sm" x="30" y="258" xml:space="preserve">}</text>
  <polyline class="ln-blue" points="226,74 232,74 232,130 226,130"/>
  <text class="sm blue-t" x="240" y="106" xml:space="preserve">p 的作用域</text>
  <polyline class="ln-blue" points="226,184 232,184 232,240 226,240"/>
  <text class="sm blue-t" x="240" y="216" xml:space="preserve">b 的作用域</text>
  <text class="sm muted" x="16" y="280" xml:space="preserve">能够引用名字 p、b 的源码区间</text>
  <rect class="box" x="390" y="0" width="510" height="290" rx="8"/>
  <text class="b" x="406" y="26" xml:space="preserve">生命周期：运行时间段（运行期）</text>
  <rect class="plain" x="420" y="54" width="450" height="24" rx="4"/>
  <text class="sm" x="430" y="70" xml:space="preserve">main 的栈帧：b</text>
  <rect class="blue" x="470" y="92" width="150" height="24" rx="4"/>
  <text class="sm" x="480" y="108" xml:space="preserve">make 的栈帧：p</text>
  <rect class="acc" x="486" y="130" width="304" height="24" rx="4"/>
  <text class="sm" x="496" y="146" xml:space="preserve">堆上的 Bar 对象</text>
  <line class="ln-muted" x1="620" y1="86" x2="620" y2="212"/>
  <line class="ln-muted" x1="790" y1="86" x2="790" y2="212"/>
  <text class="sm" x="628" y="180" xml:space="preserve">make 返回：p 消失</text>
  <text class="sm b acc-t" x="628" y="198" xml:space="preserve">对象继续存活</text>
  <text class="sm" x="798" y="180" xml:space="preserve">delete：</text>
  <text class="sm" x="798" y="198" xml:space="preserve">释放对象</text>
  <line class="ln" x1="410" y1="236" x2="884" y2="236" marker-end="url(#rt-scope-lifetime-a)"/>
  <line class="ln" x1="470" y1="231" x2="470" y2="241"/>
  <text class="sm muted" x="470" y="256" text-anchor="middle" xml:space="preserve">调用 make</text>
  <line class="ln" x1="620" y1="231" x2="620" y2="241"/>
  <text class="sm muted" x="620" y="256" text-anchor="middle" xml:space="preserve">make 返回</text>
  <line class="ln" x1="790" y1="231" x2="790" y2="241"/>
  <text class="sm muted" x="790" y="256" text-anchor="middle" xml:space="preserve">delete b</text>
  <text class="sm muted" x="884" y="276" text-anchor="end" xml:space="preserve">时间</text>
</svg>