  <text class="sm" x="720" y="62" xml:space="preserve">完整落在一个字内</text>
  <text class="sm b" x="720" y="80" xml:space="preserve">→ 一次读取</text>
  <text class="sm b" x="40" y="124" xml:space="preserve">未对齐：int 从地址 6 开始</text>
