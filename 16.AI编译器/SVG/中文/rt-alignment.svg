  <polyline class="ln-blue" points="362,170 362,176 518,176 518,170"/>
  <text class="sm blue-t" x="440" y="192" text-anchor="middle" xml:space="preserve">读取 ②</text>
  <text class="sm" x="720" y="142" xml:space="preserve">横跨两个字边界</text>
  <text class="sm b" x="720" y="160" xml:space="preserve">→ 读两次再拼接</text>
  <text class="sm muted" x="720" y="178" xml:space="preserve">（严格 CPU 会触发异常）</text>
  <text class="b" x="0" y="228" xml:space="preserve">结构体填充：由下一个成员的对齐要求决定（gcc 13.3 x86-64 实测）</text>
  <text class="mono sm" x="40" y="252" xml:space="preserve">struct S1 { char c[5]; int x; };   sizeof = 12</text>
