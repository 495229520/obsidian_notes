<svg xmlns="http://www.w3.org/2000/svg" width="932" height="292" viewBox="-16 -16 932 292" role="img" aria-label="栈式机器执行 push 7、push 5、add 计算 7 加 5 的四步栈变化：结果 12 留在栈顶，原有栈内容 S 保持不变。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .h { fill: #6F6D66; }
  </style>
  <rect x="-16" y="-16" width="932" height="292" rx="14" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="rt-sae-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="h" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <text class="b" x="98" y="18" text-anchor="middle" xml:space="preserve">① 初始状态</text>
  <rect class="box" x="0" y="30" width="196" height="176" rx="8"/>
  <text class="sm muted" x="98" y="88" text-anchor="middle" xml:space="preserve">表达式求值前</text>
  <line class="ln-acc" x1="18" y1="158" x2="178" y2="158"/>
  <rect class="dead" x="28" y="164" width="140" height="30" rx="4"/>
  <text class="mono sm muted" x="98" y="183.5" text-anchor="middle" xml:space="preserve">S（原有栈内容）</text>
  <line class="ln" x1="202" y1="120" x2="228" y2="120" marker-end="url(#rt-sae-a)"/>
  <text class="mono b" x="332" y="18" text-anchor="middle" xml:space="preserve">② push 7</text>
  <rect class="box" x="234" y="30" width="196" height="176" rx="8"/>
  <rect class="blue" x="262" y="122" width="140" height="30" rx="4"/>
  <text class="mono b" x="332" y="141.5" text-anchor="middle" xml:space="preserve">7</text>
  <line class="ln-acc" x1="252" y1="158" x2="412" y2="158"/>
  <rect class="dead" x="262" y="164" width="140" height="30" rx="4"/>
  <text class="mono sm muted" x="332" y="183.5" text-anchor="middle" xml:space="preserve">S</text>
  <line class="ln" x1="436" y1="120" x2="462" y2="120" marker-end="url(#rt-sae-a)"/>
  <text class="mono b" x="566" y="18" text-anchor="middle" xml:space="preserve">③ push 5</text>
  <rect class="box" x="468" y="30" width="196" height="176" rx="8"/>
  <rect class="acc" x="496" y="86" width="140" height="30" rx="4"/>
  <text class="mono b" x="566" y="105.5" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="blue" x="496" y="122" width="140" height="30" rx="4"/>
  <text class="mono b" x="566" y="141.5" text-anchor="middle" xml:space="preserve">7</text>
  <line class="ln-acc" x1="486" y1="158" x2="646" y2="158"/>
  <rect class="dead" x="496" y="164" width="140" height="30" rx="4"/>
  <text class="mono sm muted" x="566" y="183.5" text-anchor="middle" xml:space="preserve">S</text>
  <line class="ln" x1="670" y1="120" x2="696" y2="120" marker-end="url(#rt-sae-a)"/>
  <text class="b" x="800" y="18" text-anchor="middle" xml:space="preserve">④ add（弹出 5 和 7）</text>
  <rect class="box" x="702" y="30" width="196" height="176" rx="8"/>
  <text class="mono sm acc-t b" x="800" y="96" text-anchor="middle" xml:space="preserve">7 + 5 = 12</text>
  <rect class="acc" x="730" y="122" width="140" height="30" rx="4"/>
  <text class="mono b" x="800" y="141.5" text-anchor="middle" xml:space="preserve">12</text>
  <line class="ln-acc" x1="720" y1="158" x2="880" y2="158"/>
  <rect class="dead" x="730" y="164" width="140" height="30" rx="4"/>
  <text class="mono sm muted" x="800" y="183.5" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="plain" x="0" y="220" width="898" height="36" rx="6"/>
  <text class="sm" x="449" y="242" text-anchor="middle" xml:space="preserve">不变性：表达式求值完成后，结果 12 留在栈顶，原有栈底内容 S 保持不变。</text>
</svg>