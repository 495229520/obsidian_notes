<svg xmlns="http://www.w3.org/2000/svg" width="972" height="592" viewBox="-16 -16 972 592" role="img" aria-label="简化卡住时的直接溢出和乐观着色，以及 k = 3 时失败和 k = 2 时成功的两个例子">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="972" height="592" rx="14" fill="#F0EEE6"/>
  <defs><marker id="ra-spill-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ra-spill-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ra-spill-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bad" x="60" y="0" width="420" height="40" rx="8"/>
  <text class="b" x="270.0" y="24.5" text-anchor="middle" xml:space="preserve">简化卡住：剩余节点的度数均 ≥ k</text>
  <line class="ln" x1="270" y1="40" x2="270" y2="66" marker-end="url(#ra-spill-a)"/>
  <rect class="box" x="170" y="68" width="200" height="34" rx="8"/>
  <text class="b" x="270.0" y="89.5" text-anchor="middle" xml:space="preserve">启动溢出策略</text>
  <polyline class="ln" points="220,102 120,102 120,132" marker-end="url(#ra-spill-a)"/>
  <polyline class="ln" points="320,102 390,102 390,132" marker-end="url(#ra-spill-a)"/>
  <rect class="plain" x="0" y="134" width="230" height="70" rx="8"/>
  <text class="b" x="115.0" y="155.4" text-anchor="middle" xml:space="preserve">【悲观策略：直接溢出】</text>
  <text class="sm" x="115.0" y="173.5" text-anchor="middle" xml:space="preserve">选定一个节点，</text>
  <text class="sm" x="115.0" y="191.6" text-anchor="middle" xml:space="preserve">直接溢出到栈帧</text>
  <text class="sm muted" x="115" y="226" text-anchor="middle" xml:space="preserve">Chaitin，1982 年</text>
  <rect class="blue" x="250" y="134" width="280" height="96" rx="8"/>
  <text class="b" x="390.0" y="159.3" text-anchor="middle" xml:space="preserve">【乐观着色】</text>
  <text class="sm" x="390.0" y="177.4" text-anchor="middle" xml:space="preserve">邻居可能共用颜色。</text>
  <text class="sm" x="390.0" y="195.6" text-anchor="middle" xml:space="preserve">先把候选节点当作低度数节点压栈，</text>
  <text class="sm" x="390.0" y="213.7" text-anchor="middle" xml:space="preserve">继续简化，在恢复时再尝试着色。</text>
  <text class="sm muted" x="390" y="250" text-anchor="middle" xml:space="preserve">Briggs 等，1989 年</text>
  <line class="ln" x1="390" y1="256" x2="390" y2="282" marker-end="url(#ra-spill-a)"/>
  <rect class="box" x="290" y="284" width="200" height="34" rx="8"/>
  <text class="b" x="390.0" y="305.5" text-anchor="middle" xml:space="preserve">出栈时检查邻居用色数</text>
  <polyline class="ln" points="330,318 330,340 180,340 180,360" marker-end="url(#ra-spill-a)"/>
  <polyline class="ln" points="450,318 450,360" marker-end="url(#ra-spill-a)"/>
  <rect class="blue" x="60" y="362" width="240" height="58" rx="8"/>
  <text class="sm" x="180.0" y="386.4" text-anchor="middle" xml:space="preserve">少于 k 色：</text>
  <text class="b blue-t" x="180.0" y="404.6" text-anchor="middle" xml:space="preserve">着色成功，无需溢出。</text>
  <rect class="acc" x="320" y="362" width="210" height="58" rx="8"/>
  <text class="sm" x="425.0" y="386.4" text-anchor="middle" xml:space="preserve">已占满 k 色：</text>
  <text class="b acc-t" x="425.0" y="404.6" text-anchor="middle" xml:space="preserve">着色失败，执行溢出。</text>
  <polyline class="ln-dash" points="20,204 20,478 298,478" marker-end="url(#ra-spill-acc)"/>
  <line class="ln-dash" x1="425" y1="420" x2="425" y2="456" marker-end="url(#ra-spill-acc)"/>
  <rect class="acc" x="300" y="458" width="250" height="40" rx="8"/>
  <text class="sm b" x="425.0" y="482.0" text-anchor="middle" xml:space="preserve">插入溢出代码 → 重算活跃性和 RIG</text>
  <text class="sm muted" x="0" y="540" xml:space="preserve">直接策略在卡住时决定溢出，乐观策略在出栈时再决定</text>
  <rect class="box" x="590" y="0" width="350" height="236" rx="8"/>
  <text class="b" x="604" y="22" xml:space="preserve">课件第 42–48 页：k = 3，乐观着色失败</text>
  <text class="sm" x="604" y="50" xml:space="preserve">移除 a 后，剩余度数为 b3 c4 d3 e4 f4</text>
  <text class="sm" x="604" y="72" xml:space="preserve">所有度数均 ≥ 3，简化无法继续</text>
  <text class="sm" x="604" y="94" xml:space="preserve">选择 f 作为候选，先压入栈</text>
  <text class="sm" x="604" y="116" xml:space="preserve">然后按 b、d、e、c 的顺序简化</text>
  <text class="sm" x="604" y="138" xml:space="preserve">出栈时，c、e、d、b 先获得颜色</text>
  <text class="sm" x="604" y="160" xml:space="preserve">f 的邻居 b、c、d、e 用完 r1、r2、r3</text>
  <text class="sm b acc-t" x="604" y="182" xml:space="preserve">→ f 没有可用颜色 → 实际溢出 f</text>
  <text class="sm muted" x="604" y="208" xml:space="preserve">溢出后拆成 f1、f2、f3，可用 3 色（§2.4）</text>
  <rect class="box" x="590" y="252" width="350" height="250" rx="8"/>
  <text class="b" x="604" y="274" xml:space="preserve">四节点环 a–b–c–d–a，k = 2：着色成功</text>
  <line class="ln" x1="667.0" y1="322.0" x2="723.0" y2="322.0"/>
  <line class="ln" x1="740.0" y1="339.0" x2="740.0" y2="385.0"/>
  <line class="ln" x1="723.0" y1="402.0" x2="667.0" y2="402.0"/>
  <line class="ln" x1="650.0" y1="385.0" x2="650.0" y2="339.0"/>
  <circle class="blue" cx="650" cy="322" r="17"/>
  <text class="mono b" x="650" y="327" text-anchor="middle" xml:space="preserve">a</text>
  <text class="mono sm b blue-t" x="627" y="326" text-anchor="end" xml:space="preserve">(r2)</text>
  <circle class="acc" cx="740" cy="322" r="17"/>
  <text class="mono b" x="740" y="327" text-anchor="middle" xml:space="preserve">b</text>
  <text class="mono sm b acc-t" x="763" y="326" xml:space="preserve">(r1)</text>
  <circle class="blue" cx="740" cy="402" r="17"/>
  <text class="mono b" x="740" y="407" text-anchor="middle" xml:space="preserve">c</text>
  <text class="mono sm b blue-t" x="763" y="406" xml:space="preserve">(r2)</text>
  <circle class="acc" cx="650" cy="402" r="17"/>
  <text class="mono b" x="650" y="407" text-anchor="middle" xml:space="preserve">d</text>
  <text class="mono sm b acc-t" x="627" y="406" text-anchor="end" xml:space="preserve">(r1)</text>
  <text class="sm" x="800" y="316" xml:space="preserve">每个节点的度数都是 2 = k</text>
  <text class="sm" x="800" y="337" xml:space="preserve">直接策略：溢出 1 个节点</text>
  <text class="sm" x="800" y="358" xml:space="preserve">乐观策略：压入 a 后继续</text>
  <text class="sm" x="800" y="379" xml:space="preserve">恢复 a 时，b 和 d 共用 r1</text>
  <text class="sm b blue-t" x="800" y="400" xml:space="preserve">→ a 用 r2，溢出数为 0</text>
  <text class="sm muted" x="604" y="480" xml:space="preserve">b 和 d 互不相邻，可以共用颜色</text>
</svg>
