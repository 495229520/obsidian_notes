<svg xmlns="http://www.w3.org/2000/svg" width="932" height="382" viewBox="-16 -16 932 382" role="img" aria-label="Cheney 算法用 scan 和 alloc 之间的区间作为工作列表，两指针相遇即结束">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="932" height="382" rx="14" fill="#F0EEE6"/>
  <defs><marker id="gc-cheney-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-cheney-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-cheney-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">用新空间中的 scan 和 alloc 指针界定工作列表（课件第 64–73 页）</text>
  <rect class="dead" x="40" y="40" width="380" height="34" rx="4"/>
  <rect class="acc" x="44" y="43" width="58" height="28" rx="4"/>
  <text class="mono b" x="73.0" y="61.5" text-anchor="middle" xml:space="preserve">A'</text>
  <line class="ln-blue" x1="42" y1="92" x2="42" y2="77" marker-end="url(#gc-cheney-blue)"/>
  <text class="mono sm b blue-t" x="38" y="100" text-anchor="end" xml:space="preserve">scan</text>
  <line class="ln-acc" x1="104" y1="92" x2="104" y2="77" marker-end="url(#gc-cheney-acc)"/>
  <text class="mono sm b acc-t" x="108" y="100" xml:space="preserve">alloc</text>
  <text class="sm" x="440" y="62" xml:space="preserve">① 复制根指向的 A，在旧 A 中留下转发指针</text>
  <rect class="dead" x="40" y="106" width="380" height="34" rx="4"/>
  <rect class="blue" x="44" y="109" width="58" height="28" rx="4"/>
  <text class="mono b" x="73.0" y="127.5" text-anchor="middle" xml:space="preserve">A'</text>
  <rect class="acc" x="106" y="109" width="58" height="28" rx="4"/>
  <text class="mono b" x="135.0" y="127.5" text-anchor="middle" xml:space="preserve">C'</text>
  <line class="ln-blue" x1="104" y1="158" x2="104" y2="143" marker-end="url(#gc-cheney-blue)"/>
  <text class="mono sm b blue-t" x="100" y="166" text-anchor="end" xml:space="preserve">scan</text>
  <line class="ln-acc" x1="166" y1="158" x2="166" y2="143" marker-end="url(#gc-cheney-acc)"/>
  <text class="mono sm b acc-t" x="170" y="166" xml:space="preserve">alloc</text>
  <text class="sm" x="440" y="128" xml:space="preserve">② 扫描 A：复制其指向的 C，并把引用更新为 C′</text>
  <rect class="dead" x="40" y="172" width="380" height="34" rx="4"/>
  <rect class="blue" x="44" y="175" width="58" height="28" rx="4"/>
  <text class="mono b" x="73.0" y="193.5" text-anchor="middle" xml:space="preserve">A'</text>
  <rect class="blue" x="106" y="175" width="58" height="28" rx="4"/>
  <text class="mono b" x="135.0" y="193.5" text-anchor="middle" xml:space="preserve">C'</text>
  <rect class="acc" x="168" y="175" width="58" height="28" rx="4"/>
  <text class="mono b" x="197.0" y="193.5" text-anchor="middle" xml:space="preserve">F'</text>
  <line class="ln-blue" x1="166" y1="224" x2="166" y2="209" marker-end="url(#gc-cheney-blue)"/>
  <text class="mono sm b blue-t" x="162" y="232" text-anchor="end" xml:space="preserve">scan</text>
  <line class="ln-acc" x1="228" y1="224" x2="228" y2="209" marker-end="url(#gc-cheney-acc)"/>
  <text class="mono sm b acc-t" x="232" y="232" xml:space="preserve">alloc</text>
  <text class="sm" x="440" y="194" xml:space="preserve">③ 扫描 C：复制 F</text>
  <rect class="dead" x="40" y="238" width="380" height="34" rx="4"/>
  <rect class="blue" x="44" y="241" width="58" height="28" rx="4"/>
  <text class="mono b" x="73.0" y="259.5" text-anchor="middle" xml:space="preserve">A'</text>
  <rect class="blue" x="106" y="241" width="58" height="28" rx="4"/>
  <text class="mono b" x="135.0" y="259.5" text-anchor="middle" xml:space="preserve">C'</text>
  <rect class="blue" x="168" y="241" width="58" height="28" rx="4"/>
  <text class="mono b" x="197.0" y="259.5" text-anchor="middle" xml:space="preserve">F'</text>
  <line class="ln-blue" x1="228" y1="290" x2="228" y2="275" marker-end="url(#gc-cheney-blue)"/>
  <text class="mono sm b blue-t" x="224" y="298" text-anchor="end" xml:space="preserve">scan</text>
  <line class="ln-acc" x1="228" y1="290" x2="228" y2="275" marker-end="url(#gc-cheney-acc)"/>
  <text class="mono sm b acc-t" x="232" y="298" xml:space="preserve">alloc</text>
  <text class="sm b" x="440" y="260" xml:space="preserve">④ 扫描 F：沿转发指针更新对 A 的引用，scan = alloc 时结束</text>
  <rect class="blue" x="0" y="326" width="18" height="16" rx="3"/>
  <text x="9.0" y="338.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="sm" x="24" y="338" xml:space="preserve">已复制并扫描</text>
  <rect class="acc" x="160" y="326" width="18" height="16" rx="3"/>
  <text x="169.0" y="338.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="sm" x="184" y="338" xml:space="preserve">已复制、待扫描（scan 与 alloc 之间）</text>
  <text class="sm muted" x="500" y="338" xml:space="preserve">用新空间完成广度优先遍历</text>
</svg>
