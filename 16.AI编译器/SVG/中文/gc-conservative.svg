<svg xmlns="http://www.w3.org/2000/svg" width="972" height="432" viewBox="-16 -16 972 432" role="img" aria-label="保守式 GC 用堆范围和对齐条件检查候选指针，右侧用四个数值演示">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="972" height="432" rx="14" fill="#F0EEE6"/>
  <defs><marker id="gc-conservative-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-conservative-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-conservative-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">检查机器字的值</text>
  <rect class="box" x="0" y="30" width="470" height="52" rx="8"/>
  <text class="b" x="235.0" y="51.4" text-anchor="middle" xml:space="preserve">数值是否在有效堆地址范围内？</text>
  <text class="mono sm" x="235.0" y="69.6" text-anchor="middle" xml:space="preserve">有效范围：0x1000 至 0x8000</text>
  <line class="ln" x1="235" y1="82" x2="235" y2="104" marker-end="url(#gc-conservative-a)"/>
  <text class="sm" x="243" y="98" xml:space="preserve">是</text>
  <rect class="box" x="0" y="106" width="470" height="52" rx="8"/>
  <text class="b" x="235.0" y="127.4" text-anchor="middle" xml:space="preserve">地址是否满足对齐条件？</text>
  <text class="sm" x="235.0" y="145.6" text-anchor="middle" xml:space="preserve">4 / 8 字节对齐时，最低 2 / 3 位为 0</text>
  <line class="ln-blue" x1="235" y1="158" x2="235" y2="196" marker-end="url(#gc-conservative-blue)"/>
  <text class="sm b blue-t" x="243" y="182" xml:space="preserve">均满足</text>
  <rect class="blue" x="0" y="198" width="470" height="52" rx="8"/>
  <text class="b blue-t" x="235.0" y="219.4" text-anchor="middle" xml:space="preserve">视为指针，保留它指向的对象</text>
  <text class="sm" x="235.0" y="237.6" text-anchor="middle" xml:space="preserve">（可能多保留对象）</text>
  <polyline class="ln-acc" points="470,56 510,56 510,296 472,296" marker-end="url(#gc-conservative-acc)"/>
  <line class="ln-acc" x1="470" y1="132" x2="510" y2="132"/>
  <text class="sm b acc-t" x="518" y="140" xml:space="preserve">对齐失败</text>
  <text class="sm acc-t" x="518" y="64" xml:space="preserve">否</text>
  <rect class="acc" x="0" y="272" width="470" height="48" rx="8"/>
  <text class="b acc-t" x="235.0" y="300.5" text-anchor="middle" xml:space="preserve">当作普通数值，无需追踪</text>
  <text class="sm muted" x="0" y="346" xml:space="preserve">把整数当成指针，可能多保留一些垃圾。</text>
  <text class="sm muted" x="0" y="364" xml:space="preserve">把真实指针当成整数，会误回收存活对象。因此疑似指针也要追踪。</text>
  <rect class="box" x="610" y="0" width="330" height="330" rx="8"/>
  <text class="b" x="624" y="24" xml:space="preserve">示例（堆范围 0x1000 至 0x8000，4 字节对齐）</text>
  <text class="sm b muted" x="624" y="52" xml:space="preserve">数值</text>
  <text class="sm b muted" x="720" y="52" xml:space="preserve">范围内</text>
  <text class="sm b muted" x="770" y="52" xml:space="preserve">对齐</text>
  <text class="sm b muted" x="820" y="52" xml:space="preserve">判定</text>
  <text class="mono sm b" x="624" y="78" xml:space="preserve">0x2460</text>
  <text class="mono sm" x="728" y="78" text-anchor="middle" xml:space="preserve">O</text>
  <text class="mono sm" x="778" y="78" text-anchor="middle" xml:space="preserve">O</text>
  <text class="sm b blue-t" x="820" y="78" xml:space="preserve">视为指针</text>
  <text class="mono sm b" x="624" y="108" xml:space="preserve">0x2462</text>
  <text class="mono sm" x="728" y="108" text-anchor="middle" xml:space="preserve">O</text>
  <text class="mono sm" x="778" y="108" text-anchor="middle" xml:space="preserve">X</text>
  <text class="sm b acc-t" x="820" y="108" xml:space="preserve">普通数值</text>
  <text class="mono sm b" x="624" y="138" xml:space="preserve">0x9A00</text>
  <text class="mono sm" x="728" y="138" text-anchor="middle" xml:space="preserve">X</text>
  <text class="mono sm" x="778" y="138" text-anchor="middle" xml:space="preserve">–</text>
  <text class="sm b acc-t" x="820" y="138" xml:space="preserve">普通数值</text>
  <text class="mono sm b" x="624" y="168" xml:space="preserve">0x3000</text>
  <text class="mono sm" x="728" y="168" text-anchor="middle" xml:space="preserve">O</text>
  <text class="mono sm" x="778" y="168" text-anchor="middle" xml:space="preserve">O</text>
  <text class="sm b blue-t" x="820" y="168" xml:space="preserve">视为指针</text>
  <rect class="plain" x="624" y="206" width="302" height="110" rx="8"/>
  <text class="sm" x="636" y="227.0" xml:space="preserve">最后一项 0x3000 实际是账户余额 12288。</text>
  <text class="sm" x="636" y="243.5" xml:space="preserve">保守式 GC 将它视为指针，</text>
  <text class="sm" x="636" y="260.0" xml:space="preserve">因此会保留 0x3000 处的对象。</text>
  <text class="sm" x="636" y="276.5" xml:space="preserve">若移动对象并把该值改成新地址，</text>
  <text class="sm" x="636" y="293.0" xml:space="preserve">余额也会改变，因此该对象必须留在原地。</text>
</svg>
