<svg xmlns="http://www.w3.org/2000/svg" width="960" height="366" viewBox="0 0 960 366" role="img" aria-label="左侧展示编译期 javac 源码类型检查生成字节码；右侧展示运行期 ClassLoader 加载、Bytecode Verifier 字节码验证与首次使用时才触发的并发安全延迟初始化，以及类卸载说明。">
  <title>Java 类加载验证与延迟初始化</title>
  <desc>左侧展示编译期 javac 源码类型检查生成字节码；右侧展示运行期 ClassLoader 加载、Bytecode Verifier 字节码验证与首次使用时才触发的并发安全延迟初始化，以及类卸载说明。</desc>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', monospace; }
    .title { font-size: 15.5px; font-weight: 700; fill: #141413; }
    .sub { font-size: 11.5px; fill: #6F6D66; }
    .sec { font-size: 13px; font-weight: 600; fill: #141413; }
    .sm { font-size: 11px; }
    .xs { font-size: 10.5px; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .green-t { fill: #47703F; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1.1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.8; stroke-dasharray: 5 3; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.4; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; }
    .h-acc { fill: #D97757; }
    .h-blue { fill: #4F7FAF; }
    .h-green { fill: #5E8A5A; }
  </style>
  <defs>
    <marker id="java-class-lifecycle-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="java-class-lifecycle-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="java-class-lifecycle-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="java-class-lifecycle-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-green" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="366" fill="rgb(245, 244, 237)"/>
  <rect x="6" y="6" width="948" height="354" rx="14" fill="#F0EEE6"/>
  <text class="title" x="26" y="36">Java 类的检查与生命周期：编译期、动态加载、验证与延迟初始化</text>
  <text class="sub" x="26" y="56">动态类加载迫使 JVM 把类型安全防线延伸到运行期；类初始化则刻意延迟到符号首次使用</text>

  <!-- Left zone: Compile time -->
  <rect class="box" x="24" y="74" width="234" height="218" rx="10"/>
  <rect class="blue" x="38" y="88" width="206" height="28" rx="6"/>
  <text class="sm b blue-t" x="141" y="106" text-anchor="middle">编译期（Compile Time）</text>

  <rect class="plain" x="54" y="132" width="174" height="34" rx="6"/>
  <text class="mono sm b" x="141" y="153" text-anchor="middle">.java 源代码</text>

  <line class="ln-blue" x1="141" y1="166" x2="141" y2="184" marker-end="url(#java-class-lifecycle-blue)"/>

  <rect class="blue" x="44" y="188" width="194" height="44" rx="6"/>
  <text class="sm b blue-t" x="141" y="207" text-anchor="middle">javac 源码类型检查</text>
  <text class="xs blue-t" x="141" y="224" text-anchor="middle">语法、静态类型、异常声明</text>

  <line class="ln-blue" x1="141" y1="232" x2="141" y2="248" marker-end="url(#java-class-lifecycle-blue)"/>

  <rect class="plain" x="54" y="252" width="174" height="28" rx="6"/>
  <text class="mono sm b" x="141" y="270" text-anchor="middle">.class 字节码</text>

  <!-- Arrow across Compile -> Run boundary -->
  <line class="ln" x1="258" y1="184" x2="294" y2="184" marker-end="url(#java-class-lifecycle-a)"/>
  <text class="xs muted" x="276" y="174" text-anchor="middle">分发</text>

  <!-- Right zone: Run time -->
  <rect class="box" x="298" y="74" width="638" height="218" rx="10"/>
  <rect class="acc" x="312" y="88" width="610" height="28" rx="6"/>
  <text class="sm b acc-t" x="617" y="106" text-anchor="middle">运行期（Run Time / JVM）— 加载验证与初始化严格解耦</text>

  <!-- Stage 1: ClassLoader -->
  <rect class="plain" x="314" y="132" width="174" height="106" rx="8"/>
  <text class="sm b" x="401" y="154" text-anchor="middle">1. 动态加载</text>
  <rect class="dead" x="330" y="164" width="142" height="26" rx="5"/>
  <text class="mono xs b" x="401" y="181" text-anchor="middle">ClassLoader</text>
  <text class="xs muted" x="401" y="208" text-anchor="middle">自定义加载策略</text>
  <text class="xs muted" x="401" y="226" text-anchor="middle">磁盘 / 网络 / 运行期生成</text>

  <line class="ln-acc" x1="488" y1="185" x2="516" y2="185" marker-end="url(#java-class-lifecycle-acc)"/>

  <!-- Stage 2: Bytecode Verification -->
  <rect class="acc" x="520" y="132" width="184" height="106" rx="8"/>
  <text class="sm b acc-t" x="612" y="154" text-anchor="middle">2. 字节码验证</text>
  <rect class="plain" x="536" y="164" width="152" height="26" rx="5"/>
  <text class="mono xs b acc-t" x="612" y="181" text-anchor="middle">Bytecode Verifier</text>
  <text class="xs acc-t" x="612" y="208" text-anchor="middle">防恶意手写 .class</text>
  <text class="xs acc-t" x="612" y="226" text-anchor="middle">检查操作数栈与类型安全</text>

  <line class="ln-green" x1="704" y1="185" x2="734" y2="185" marker-end="url(#java-class-lifecycle-green)"/>
  <text class="xs green-t b" x="719" y="174" text-anchor="middle">延迟</text>

  <!-- Stage 3: Lazy Initialization -->
  <rect class="green" x="738" y="132" width="182" height="106" rx="8"/>
  <text class="sm b green-t" x="829" y="154" text-anchor="middle">3. 首次使用才初始化</text>
  <rect class="plain" x="754" y="164" width="150" height="26" rx="5"/>
  <text class="mono xs b green-t" x="829" y="181" text-anchor="middle">执行 &lt;clinit&gt;</text>
  <text class="xs green-t" x="829" y="208" text-anchor="middle">new / 静态调用 / 读写字段</text>
  <text class="xs green-t" x="829" y="226" text-anchor="middle">加锁防多线程并发竞争</text>

  <!-- Unloading note inside Runtime -->
  <rect class="dead" x="314" y="250" width="606" height="30" rx="6"/>
  <text class="xs b" x="328" y="269">类卸载（Unloading）：</text>
  <text class="xs muted" x="458" y="269">早期规范未明确定义；现代 JVM 仅在 ClassLoader 不可达时回收</text>

  <!-- Bottom takeaway -->
  <rect class="plain" x="24" y="306" width="912" height="44" rx="8"/>
  <text class="sm b" x="40" y="332">为什么要把加载和初始化分开？</text>
  <text class="sm muted" x="220" y="332">把初始化异常固定推迟到「首次主动引用该类符号」的可预测位置，不受提前加载时机干扰</text>
</svg>
