<svg xmlns="http://www.w3.org/2000/svg" width="892" height="362" viewBox="-16 -16 892 362" role="img" aria-label="基本块的结构。顶部箭头为唯一入口，可附加标号。块内包含语句 1: x = a + b, 语句 2: y = x * c, 语句 3: z = y - 1, 语句 4: if (z &gt; 0) goto L_END。块内无分支与标号，严格顺序执行，仅允许在末尾转移控制流。底部出口根据条件分流：z ≤ 0 则顺序 fall-through 进入下一块，z &gt; 0 则跳转至 L_END。左侧虚线箭头为非法行为：严禁中途插队跳入或中途分支跳出。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="892" height="362" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-basic-block-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-basic-block-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-basic-block-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <line class="ln" x1="320" y1="8" x2="320" y2="64" marker-end="url(#opt-basic-block-a)"/>
  <text class="sm muted" x="332" y="38" xml:space="preserve">(唯一入口，可附加标号)</text>
  <rect class="blue" x="260" y="66" width="320" height="148" rx="8"/>
  <text class="mono" x="278" y="96" xml:space="preserve">语句 1: x = a + b</text>
  <text class="mono" x="278" y="128" xml:space="preserve">语句 2: y = x * c</text>
  <text class="mono" x="278" y="160" xml:space="preserve">语句 3: z = y - 1</text>
  <text class="mono b" x="278" y="192" xml:space="preserve">语句 4: if (z &gt; 0) goto L_END</text>
  <line class="ln" x1="618" y1="128" x2="592" y2="128" marker-end="url(#opt-basic-block-a)"/>
  <text class="sm" x="626" y="132" xml:space="preserve">内部无分支、无内部标号，严格顺序执行</text>
  <line class="ln-acc" x1="618" y1="192" x2="592" y2="192" marker-end="url(#opt-basic-block-acc)"/>
  <text class="sm acc-t" x="626" y="196" xml:space="preserve">仅允许在块末尾转移控制流</text>
  <line class="ln" x1="320" y1="216" x2="320" y2="272" marker-end="url(#opt-basic-block-a)"/>
  <line class="ln-acc" x1="530" y1="216" x2="530" y2="272" marker-end="url(#opt-basic-block-acc)"/>
  <text class="sm muted" x="425" y="248" text-anchor="middle" xml:space="preserve">(唯一出口或分支流转)</text>
  <rect class="plain" x="250" y="274" width="140" height="32" rx="8"/>
  <text class="sm" x="320.0" y="294.5" text-anchor="middle" xml:space="preserve">下一基本块 (z ≤ 0, 顺序顺延)</text>
  <rect class="acc" x="460" y="274" width="140" height="32" rx="8"/>
  <text class="mono sm" x="530.0" y="294.5" text-anchor="middle" xml:space="preserve">标号 L_END: (z &gt; 0, 条件跳转)</text>
  <text class="sm acc-t" x="8" y="112" xml:space="preserve">✗ 严禁中途插队跳入</text>
  <line class="ln-dash" x1="16" y1="122" x2="256" y2="122" marker-end="url(#opt-basic-block-acc)"/>
  <line class="ln-dash" x1="256" y1="158" x2="16" y2="158" marker-end="url(#opt-basic-block-acc)"/>
  <text class="sm acc-t" x="8" y="176" xml:space="preserve">✗ 严禁中途分支跳出</text>
</svg>
