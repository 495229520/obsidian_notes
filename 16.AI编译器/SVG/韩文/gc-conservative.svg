<svg xmlns="http://www.w3.org/2000/svg" width="972" height="432" viewBox="-16 -16 972 432" role="img" aria-label="보수적 GC가 메모리 워드 하나를 검사하는 순서. 힙 주소 범위 안이고 정렬도 맞으면 포인터로 가정해 객체를 보존하고, 하나라도 어긋나면 일반 수치로 본다. 오른쪽은 예시 값 네 개">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="972" height="432" rx="14" fill="#F0EEE6"/>
  <defs><marker id="gc-conservative-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-conservative-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-conservative-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">메모리 워드 값 검사:</text>
  <rect class="box" x="0" y="30" width="470" height="52" rx="8"/>
  <text class="b" x="235.0" y="51.4" text-anchor="middle" xml:space="preserve">수치가 힙의 합법적 주소 범위 내에 드는가?</text>
  <text class="mono sm" x="235.0" y="69.6" text-anchor="middle" xml:space="preserve">[유효 범위: 0x1000 ~ 0x8000]</text>
  <line class="ln" x1="235" y1="82" x2="235" y2="104" marker-end="url(#gc-conservative-a)"/>
  <text class="sm" x="243" y="98" xml:space="preserve">예</text>
  <rect class="box" x="0" y="106" width="470" height="52" rx="8"/>
  <text class="b" x="235.0" y="127.4" text-anchor="middle" xml:space="preserve">주소가 정렬 요건을 만족하는가?</text>
  <text class="sm" x="235.0" y="145.6" text-anchor="middle" xml:space="preserve">(최하위 비트가 4/8바이트 정렬 만족: 0b...00)</text>
  <line class="ln-blue" x1="235" y1="158" x2="235" y2="196" marker-end="url(#gc-conservative-blue)"/>
  <text class="sm b blue-t" x="243" y="182" xml:space="preserve">둘 다 만족</text>
  <rect class="blue" x="0" y="198" width="470" height="52" rx="8"/>
  <text class="b blue-t" x="235.0" y="219.4" text-anchor="middle" xml:space="preserve">포인터로 가정하고, 가리키는 객체를 보수적으로 보존</text>
  <text class="sm" x="235.0" y="237.6" text-anchor="middle" xml:space="preserve">(생존 집합 과대추정)</text>
  <polyline class="ln-acc" points="470,56 510,56 510,296 472,296" marker-end="url(#gc-conservative-acc)"/>
  <line class="ln-acc" x1="470" y1="132" x2="510" y2="132"/>
  <text class="sm b acc-t" x="518" y="140" xml:space="preserve">하나라도 위배</text>
  <text class="sm acc-t" x="518" y="64" xml:space="preserve">아니오</text>
  <rect class="acc" x="0" y="272" width="470" height="48" rx="8"/>
  <text class="b acc-t" x="235.0" y="300.5" text-anchor="middle" xml:space="preserve">일반 수치로 판정하고, 포인터로 추적하지 않음</text>
  <text class="sm muted" x="0" y="346" xml:space="preserve">틀려도 되는 방향은 하나뿐: 수치를 포인터로 오인하면 가비지가 조금 남을 뿐,</text>
  <text class="sm muted" x="0" y="364" xml:space="preserve">진짜 포인터를 수치로 보면 살아 있는 객체를 해제한다. 그래서 의심스러우면 포인터로 친다.</text>
  <rect class="box" x="610" y="0" width="330" height="330" rx="8"/>
  <text class="b" x="624" y="24" xml:space="preserve">예시 워드 (힙 0x1000 ~ 0x8000, 4바이트 정렬)</text>
  <text class="sm b muted" x="624" y="52" xml:space="preserve">값</text>
  <text class="sm b muted" x="720" y="52" xml:space="preserve">범위</text>
  <text class="sm b muted" x="770" y="52" xml:space="preserve">정렬</text>
  <text class="sm b muted" x="820" y="52" xml:space="preserve">판정</text>
  <text class="mono sm b" x="624" y="78" xml:space="preserve">0x2460</text>
  <text class="mono sm" x="728" y="78" text-anchor="middle" xml:space="preserve">O</text>
  <text class="mono sm" x="778" y="78" text-anchor="middle" xml:space="preserve">O</text>
  <text class="sm b blue-t" x="820" y="78" xml:space="preserve">포인터로 취급</text>
  <text class="mono sm b" x="624" y="108" xml:space="preserve">0x2462</text>
  <text class="mono sm" x="728" y="108" text-anchor="middle" xml:space="preserve">O</text>
  <text class="mono sm" x="778" y="108" text-anchor="middle" xml:space="preserve">X</text>
  <text class="sm b acc-t" x="820" y="108" xml:space="preserve">수치</text>
  <text class="mono sm b" x="624" y="138" xml:space="preserve">0x9A00</text>
  <text class="mono sm" x="728" y="138" text-anchor="middle" xml:space="preserve">X</text>
  <text class="mono sm" x="778" y="138" text-anchor="middle" xml:space="preserve">–</text>
  <text class="sm b acc-t" x="820" y="138" xml:space="preserve">수치</text>
  <text class="mono sm b" x="624" y="168" xml:space="preserve">0x3000</text>
  <text class="mono sm" x="728" y="168" text-anchor="middle" xml:space="preserve">O</text>
  <text class="mono sm" x="778" y="168" text-anchor="middle" xml:space="preserve">O</text>
  <text class="sm b blue-t" x="820" y="168" xml:space="preserve">포인터로 취급</text>
  <rect class="plain" x="624" y="206" width="302" height="110" rx="8"/>
  <text class="sm" x="636" y="227.0" xml:space="preserve">마지막 0x3000은 사실 계좌 잔액 12288이다.</text>
  <text class="sm" x="636" y="243.5" xml:space="preserve">보수적 GC는 이것을 포인터로 보고 0x3000의</text>
  <text class="sm" x="636" y="260.0" xml:space="preserve">객체를 남긴다(누수일 뿐 안전).</text>
  <text class="sm" x="636" y="276.5" xml:space="preserve">객체를 옮기고 이 값을 새 주소로 고치면</text>
  <text class="sm" x="636" y="293.0" xml:space="preserve">잔액이 바뀐다 → 그래서 이동 금지</text>
</svg>
