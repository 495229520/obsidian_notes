  <rect class="blue" x="60" y="212" width="70" height="30" rx="4"/>
  <text class="mono" x="95.0" y="231.5" text-anchor="middle" xml:space="preserve"><tspan class="muted">0</tspan><tspan class="muted">:</tspan><tspan class="b">A</tspan></text>
  <line class="ln" x1="130" y1="227" x2="158" y2="227" marker-end="url(#gc-marksweep-a)"/>
