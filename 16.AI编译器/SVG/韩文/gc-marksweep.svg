  <text class="mono" x="55.0" y="377.5" text-anchor="middle" xml:space="preserve"><tspan class="b blue-t">1</tspan><tspan class="muted">:</tspan><tspan class="b">A</tspan></text>
  <rect class="ghost" x="106" y="358" width="90" height="30" rx="4"/>
  <text class="mono" x="151.0" y="377.5" text-anchor="middle" xml:space="preserve"><tspan class="muted">0</tspan><tspan class="muted">:</tspan><tspan class="b">B</tspan></text>
  <rect class="blue" x="202" y="358" width="90" height="30" rx="4"/>
  <text class="mono" x="247.0" y="377.5" text-anchor="middle" xml:space="preserve"><tspan class="b blue-t">1</tspan><tspan class="muted">:</tspan><tspan class="b">C</tspan></text>
  <rect class="ghost" x="298" y="358" width="90" height="30" rx="4"/>
  <text class="mono" x="343.0" y="377.5" text-anchor="middle" xml:space="preserve"><tspan class="muted">0</tspan><tspan class="muted">:</tspan><tspan class="b">D</tspan></text>
  <rect class="blue" x="394" y="358" width="90" height="30" rx="4"/>
  <text class="mono" x="439.0" y="377.5" text-anchor="middle" xml:space="preserve"><tspan class="b blue-t">1</tspan><tspan class="muted">:</tspan><tspan class="b">E</tspan></text>
  <text class="sm muted" x="500" y="378" xml:space="preserve">1 → 0으로 리셋, 0 → 프리 리스트</text>
  <line class="ln-blue" x1="10" y1="404" x2="470" y2="404" marker-end="url(#gc-marksweep-blue)"/>
  <text class="sm blue-t" x="10" y="420" xml:space="preserve">주소 증가 방향</text>
  <text class="sm muted" x="500" y="400" xml:space="preserve">비용은 살아 있는 객체 수가 아니라 힙 크기에 비례</text>
