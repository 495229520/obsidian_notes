  <line class="ln" x1="470" y1="137" x2="498" y2="137" marker-end="url(#gc-marksweep-a)"/>
  <text class="b" x="0" y="194" xml:space="preserve">【Sweep 단계: 생존자는 0으로 초기화, 가비지는 FreeList에 등록】</text>
  <text class="mono sm b acc-t" x="0" y="232" xml:space="preserve">root</text>
