  <text class="mono" x="195.0" y="231.5" text-anchor="middle" xml:space="preserve"><tspan class="muted">0</tspan><tspan class="muted">:</tspan><tspan class="b">C</tspan></text>
  <line class="ln" x1="230" y1="227" x2="258" y2="227" marker-end="url(#gc-marksweep-a)"/>
  <rect class="blue" x="260" y="212" width="70" height="30" rx="4"/>
  <text class="mono" x="295.0" y="231.5" text-anchor="middle" xml:space="preserve"><tspan class="muted">0</tspan><tspan class="muted">:</tspan><tspan class="b">E</tspan></text>
  <text class="sm b" x="0" y="290" xml:space="preserve">가비지 회수 큐</text>
