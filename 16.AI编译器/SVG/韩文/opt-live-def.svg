<svg xmlns="http://www.w3.org/2000/svg" width="972" height="350" viewBox="-16 -16 972 350" role="img" aria-label="생존성의 정의. 왼쪽은 원래 그림으로, 문장 s는 x := 2이고 실행 경로를 따라 내려가 문장 s′에서 ... := x로 변수 x가 읽혀 사용된다. 경로상에 x에 대한 쓰기가 없으므로(no write to x) x는 s에서 살아 있다. 오른쪽은 경로가 둘인 경우다. 경로 A에는 x := 7이 끼어 있어 s의 값이 s′에 닿지 못하지만, 경로 B에는 쓰기가 없다. 경로 하나만 조건을 만족해도 x는 s에서 살아 있다. 이것이 may 분석이고 §6.4의 논리합이다. 경로 A만 있었다면 s 직후 x는 죽어 있고 x := 2는 죽은 코드다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="972" height="350" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-live-def-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-live-def-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-live-def-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="42" xml:space="preserve">문장 s ───&gt;</text>
  <rect class="blue" x="110" y="20" width="150" height="36" rx="8"/>
  <text class="mono b" x="185.0" y="42.5" text-anchor="middle" xml:space="preserve">x := 2</text>
  <line class="ln-blue" x1="185" y1="58" x2="185" y2="236"/>
  <path d="M185,236 l-4,-8 l8,0 z" class="h-blue"/>
  <text class="mono sm blue-t" x="200" y="128" xml:space="preserve">~~~ [실행 경로] ~~~</text>
  <text class="sm" x="200" y="148" xml:space="preserve">(경로상에 x에 대한 쓰기가 없음:</text>
  <text class="sm" x="200" y="166" xml:space="preserve">no write to x)</text>
  <text class="b" x="0" y="262" xml:space="preserve">문장 s' ───&gt;</text>
  <rect class="plain" x="110" y="240" width="150" height="36" rx="8"/>
  <text class="mono b" x="185.0" y="262.5" text-anchor="middle" xml:space="preserve">... := x</text>
  <line class="ln" x1="300" y1="258" x2="264" y2="258" marker-end="url(#opt-live-def-a)"/>
  <text class="sm b" x="308" y="262" xml:space="preserve">변수 x가 읽혀 사용됨</text>
  <line class="ln-muted" x1="470" y1="10" x2="470" y2="310"/>
  <text class="b" x="500" y="14" xml:space="preserve">경로가 여러 개라면</text>
  <rect class="blue" x="640" y="30" width="150" height="34" rx="8"/>
  <text class="mono b" x="715.0" y="51.5" text-anchor="middle" xml:space="preserve">s:  x := 2</text>
  <polyline class="ln" points="690,64 690,84 590,84 590,110" marker-end="url(#opt-live-def-a)"/>
  <polyline class="ln-blue" points="740,64 740,84 840,84 840,228 794,228" marker-end="url(#opt-live-def-blue)"/>
  <rect class="bad" x="530" y="112" width="120" height="32" rx="8"/>
  <text class="mono b" x="590.0" y="132.5" text-anchor="middle" xml:space="preserve">x := 7</text>
  <text class="sm b" x="520" y="102" text-anchor="end" xml:space="preserve">경로 A</text>
  <text class="sm b blue-t" x="850" y="140" xml:space="preserve">경로 B</text>
  <text class="sm blue-t" x="850" y="158" xml:space="preserve">쓰기 없음</text>
  <polyline class="ln" points="590,144 590,228 636,228" marker-end="url(#opt-live-def-a)"/>
  <text class="sm acc-t" x="504" y="170" xml:space="preserve">x를 죽인다</text>
  <rect class="plain" x="640" y="212" width="150" height="32" rx="8"/>
  <text class="mono" x="715.0" y="232.5" text-anchor="middle" xml:space="preserve">s':  ... := x</text>
  <text class="sm b" x="500" y="270" xml:space="preserve">경로 B 하나로 충분하다: x는 s에서 살아 있다 (may 분석).</text>
  <text class="sm muted" x="500" y="290" xml:space="preserve">경로 A만 있었다면 s 직후 x는 죽고, x := 2는 죽은 코드다.</text>
</svg>
