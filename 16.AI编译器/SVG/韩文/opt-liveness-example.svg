<svg xmlns="http://www.w3.org/2000/svg" width="992" height="362" viewBox="-16 -16 992 362" role="img" aria-label="생존성 분석 예제, 슬라이드 73–82. X := 0 다음 if (X == 10)에서 참이면 출구로 나가고(X는 죽음), 거짓이면 X := X + 1을 거쳐 다시 if로 돌아간다. 모든 지점을 false로 두고 시작해 규칙을 만족하지 않는 곳을 고친다. 솔버의 갱신 순서는 ① if 입구가 true(X를 읽음, 규칙 2), ② X := 0 출구가 true(규칙 1), ③ X := X + 1 출구가 true(규칙 1), ④ X := X + 1 입구가 true(규칙 2), ⑤ if 출구가 true(규칙 1)다. X := 0의 입구는 X를 덮어쓰므로 규칙 3에 따라 false로 남고, 출구 간선도 false다. 다섯 번 바뀌고 끝났으며, 갱신 순서를 무작위로 바꿔도 결과는 같았다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="992" height="362" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-liveness-example-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-liveness-example-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-liveness-example-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <line class="ln" x1="160" y1="0" x2="160" y2="34" marker-end="url(#opt-liveness-example-a)"/>
  <text class="mono sm muted" x="150" y="22" text-anchor="end" xml:space="preserve">false</text>
  <rect class="plain" x="90" y="36" width="140" height="34" rx="8"/>
  <text class="mono b" x="160.0" y="57.5" text-anchor="middle" xml:space="preserve">X := 0</text>
  <line class="ln" x1="160" y1="70" x2="160" y2="120" marker-end="url(#opt-liveness-example-a)"/>
  <text class="mono sm b acc-t" x="150" y="100" text-anchor="end" xml:space="preserve">true ①②</text>
  <rect class="acc" x="80" y="122" width="160" height="34" rx="8"/>
  <text class="mono b" x="160.0" y="143.5" text-anchor="middle" xml:space="preserve">if (X == 10)</text>
  <polyline class="ln" points="160,156 160,196 70,196 70,266" marker-end="url(#opt-liveness-example-a)"/>
  <text class="mono sm muted" x="62" y="238" text-anchor="end" xml:space="preserve">false</text>
  <text class="sm muted" x="78" y="214" xml:space="preserve">참</text>
  <rect class="ghost" x="10" y="268" width="130" height="30" rx="8"/>
  <text class="sm" x="75.0" y="287.5" text-anchor="middle" xml:space="preserve">출구 (X는 죽음)</text>
  <polyline class="ln-acc" points="200,156 200,196 290,196 290,222" marker-end="url(#opt-liveness-example-acc)"/>
  <text class="mono sm b acc-t" x="298" y="214" xml:space="preserve">true ⑤</text>
  <text class="sm muted" x="212" y="188" xml:space="preserve">거짓</text>
  <rect class="acc" x="220" y="224" width="140" height="34" rx="8"/>
  <text class="mono b" x="290.0" y="245.5" text-anchor="middle" xml:space="preserve">X := X + 1</text>
  <text class="mono sm b acc-t" x="298" y="280" xml:space="preserve">in: true ④</text>
  <polyline class="ln-acc" points="360,241 400,241 400,139 242,139" marker-end="url(#opt-liveness-example-acc)"/>
  <text class="mono sm b acc-t" x="408" y="192" xml:space="preserve">true ③</text>
  <line class="ln-muted" x1="460" y1="6" x2="460" y2="320"/>
  <text class="b" x="480" y="16" xml:space="preserve">갱신 순서 (솔버 실행 결과, 처음엔 모두 false)</text>
  <text class="b acc-t" x="480" y="48" xml:space="preserve">①</text>
  <text class="mono sm b" x="504" y="48" xml:space="preserve">if (X == 10) 입구</text>
  <text class="sm muted" x="504" y="65" xml:space="preserve">false → true · 규칙 2: X를 읽는다</text>
  <text class="b acc-t" x="480" y="88" xml:space="preserve">②</text>
  <text class="mono sm b" x="504" y="88" xml:space="preserve">X := 0 출구</text>
  <text class="sm muted" x="504" y="105" xml:space="preserve">false → true · 규칙 1: 후행 if의 입구가 true</text>
  <text class="b acc-t" x="480" y="128" xml:space="preserve">③</text>
  <text class="mono sm b" x="504" y="128" xml:space="preserve">X := X + 1 출구</text>
  <text class="sm muted" x="504" y="145" xml:space="preserve">false → true · 규칙 1: 후행 if의 입구가 true</text>
  <text class="b acc-t" x="480" y="168" xml:space="preserve">④</text>
  <text class="mono sm b" x="504" y="168" xml:space="preserve">X := X + 1 입구</text>
  <text class="sm muted" x="504" y="185" xml:space="preserve">false → true · 규칙 2: X를 읽는다</text>
  <text class="b acc-t" x="480" y="208" xml:space="preserve">⑤</text>
  <text class="mono sm b" x="504" y="208" xml:space="preserve">if (X == 10) 출구</text>
  <text class="sm muted" x="504" y="225" xml:space="preserve">false → true · 규칙 1: false ∨ true = true</text>
  <rect class="box" x="474" y="248" width="486" height="66" rx="6"/>
  <text class="sm" x="486" y="270" xml:space="preserve"><tspan class="mono b">X := 0</tspan> 입구는 규칙 3(덮어씀)으로 <tspan class="mono b muted">false</tspan> 그대로다.</text>
  <text class="sm" x="486" y="290" xml:space="preserve">값마다 false → true로 한 번만 바뀐다. 다섯 번 갱신하고 멈췄다.</text>
  <text class="sm muted" x="486" y="308" xml:space="preserve">갱신 순서를 무작위로 200가지 바꿔도 같은 결과가 나왔다.</text>
</svg>
