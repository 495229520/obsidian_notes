<svg xmlns="http://www.w3.org/2000/svg" width="932" height="310" viewBox="-16 -16 932 310" role="img" aria-label="오류 노드에 Object를 붙이면 미선언 x 하나 때문에 오류가 세 번 보고된다. No_type을 모든 타입의 아래에 두면 첫 오류 하나만 보고하고 나머지는 억제한다. 대신 타입 계층이 트리가 아닌 DAG가 된다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="932" height="310" rx="14" fill="#F0EEE6"/>
  <defs><marker id="sa-recovery-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-recovery-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-recovery-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="330" height="278" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">Object로 복구</text>
  <rect class="plain" x="16" y="48" width="120" height="40" rx="5"/>
  <text class="mono sm" x="76.0" y="72.5" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="bad" x="146" y="48" width="168" height="40" rx="5"/>
  <text class="sm" x="230.0" y="72.5" text-anchor="middle" xml:space="preserve">오류 1: x 미선언</text>
  <rect class="plain" x="16" y="100" width="120" height="40" rx="5"/>
  <text class="mono sm" x="76.0" y="124.5" text-anchor="middle" xml:space="preserve">x + 2</text>
  <rect class="bad" x="146" y="100" width="168" height="40" rx="5"/>
  <text class="sm" x="230.0" y="124.5" text-anchor="middle" xml:space="preserve">오류 2: Object에 +</text>
  <rect class="plain" x="16" y="152" width="120" height="40" rx="5"/>
  <text class="mono sm" x="76.0" y="176.5" text-anchor="middle" xml:space="preserve">y: Int &lt;- …</text>
  <rect class="bad" x="146" y="152" width="168" height="40" rx="5"/>
  <text class="sm" x="230.0" y="176.5" text-anchor="middle" xml:space="preserve">오류 3: Object ≤ Int 거짓</text>
  <rect class="plain" x="16" y="204" width="120" height="40" rx="5"/>
  <text class="mono sm" x="76.0" y="228.5" text-anchor="middle" xml:space="preserve">y + 3</text>
  <rect class="plain" x="146" y="204" width="168" height="40" rx="5"/>
  <text class="sm" x="230.0" y="228.5" text-anchor="middle" xml:space="preserve">Int (정상)</text>
  <text class="sm b acc-t" x="16" y="262" xml:space="preserve">원인 하나에 진단 세 개</text>
  <rect class="box" x="350" y="0" width="330" height="278" rx="8"/>
  <text class="b" x="366" y="26" xml:space="preserve">No_type으로 복구</text>
  <rect class="plain" x="366" y="48" width="120" height="40" rx="5"/>
  <text class="mono sm" x="426.0" y="72.5" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="bad" x="496" y="48" width="168" height="40" rx="5"/>
  <text class="sm" x="580.0" y="72.5" text-anchor="middle" xml:space="preserve">오류 1: x 미선언</text>
  <rect class="plain" x="366" y="100" width="120" height="40" rx="5"/>
  <text class="mono sm" x="426.0" y="124.5" text-anchor="middle" xml:space="preserve">x + 2</text>
  <rect class="blue" x="496" y="100" width="168" height="40" rx="5"/>
  <text class="sm" x="580.0" y="124.5" text-anchor="middle" xml:space="preserve">No_type, 진단 억제</text>
  <rect class="plain" x="366" y="152" width="120" height="40" rx="5"/>
  <text class="mono sm" x="426.0" y="176.5" text-anchor="middle" xml:space="preserve">y: Int &lt;- …</text>
  <rect class="blue" x="496" y="152" width="168" height="40" rx="5"/>
  <text class="sm" x="580.0" y="176.5" text-anchor="middle" xml:space="preserve">No_type ≤ Int 참</text>
  <rect class="plain" x="366" y="204" width="120" height="40" rx="5"/>
  <text class="mono sm" x="426.0" y="228.5" text-anchor="middle" xml:space="preserve">y + 3</text>
  <rect class="plain" x="496" y="204" width="168" height="40" rx="5"/>
  <text class="sm" x="580.0" y="228.5" text-anchor="middle" xml:space="preserve">Int (정상)</text>
  <text class="sm b blue-t" x="366" y="262" xml:space="preserve">원인 하나에 진단 하나</text>
  <rect class="plain" x="700" y="0" width="200" height="278" rx="8"/>
  <text class="b" x="716" y="26" xml:space="preserve">타입 계층</text>
  <rect class="box" x="760.0" y="47" width="80" height="30" rx="6"/>
  <text class="mono" x="800" y="66.5" text-anchor="middle" xml:space="preserve">Object</text>
  <rect class="box" x="709.0" y="125" width="62" height="30" rx="6"/>
  <text class="mono" x="740" y="144.5" text-anchor="middle" xml:space="preserve">Int</text>
  <line class="ln" x1="740" y1="125" x2="800" y2="77"/>
  <line class="ln-dash" x1="740" y1="155" x2="800" y2="203"/>
  <rect class="box" x="769.0" y="125" width="62" height="30" rx="6"/>
  <text class="mono" x="800" y="144.5" text-anchor="middle" xml:space="preserve">Bool</text>
  <line class="ln" x1="800" y1="125" x2="800" y2="77"/>
  <line class="ln-dash" x1="800" y1="155" x2="800" y2="203"/>
  <rect class="box" x="829.0" y="125" width="62" height="30" rx="6"/>
  <text class="mono" x="860" y="144.5" text-anchor="middle" xml:space="preserve">Animal</text>
  <line class="ln" x1="860" y1="125" x2="800" y2="77"/>
  <line class="ln-dash" x1="860" y1="155" x2="800" y2="203"/>
  <rect class="bad" x="757.0" y="203" width="86" height="30" rx="6"/>
  <text class="mono" x="800" y="222.5" text-anchor="middle" xml:space="preserve">No_type</text>
  <text class="sm muted" x="716" y="262" xml:space="preserve">트리가 아니라 DAG</text>
</svg>
