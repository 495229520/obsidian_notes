<svg xmlns="http://www.w3.org/2000/svg" width="992" height="322" viewBox="-16 -16 992 322" role="img" aria-label="추상화 수준의 전환 흐름. 소스 코드(Source Code)는 추상화 수준이 가장 높고 하위 배치 세부 정보가 부족하다. 중간 코드(IR / TAC)는 양쪽 절충으로 소스보다 구체적이고 타깃 코드보다 추상적이다. 타깃 코드(Target Code)는 추상화 수준이 가장 낮고 물리 레지스터와 하드웨어 제약이 가득하다. 오른쪽 열은 같은 식 x + y * z가 각 단계에서 어떻게 보이는지 보여 준다. 소스는 int res = x + y * z, 3-주소 코드는 t1 := y * z와 t2 := x + t1, x86-64 gcc 13.3 -O2 출력은 imul esi, edx와 lea eax, [rsi+rdi]이다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="992" height="322" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-abstraction-levels-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-abstraction-levels-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-abstraction-levels-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="115" y="14" text-anchor="middle" xml:space="preserve">단계</text>
  <text class="b" x="250" y="14" xml:space="preserve">특징</text>
  <text class="b" x="660" y="14" xml:space="preserve">같은 식 x + y * z</text>
  <rect class="plain" x="0" y="30" width="230" height="56" rx="8"/>
  <text x="115.0" y="62.5" text-anchor="middle" xml:space="preserve">소스 코드 Source Code</text>
  <text class="sm" x="250" y="54" xml:space="preserve">추상화 수준이 가장 높음, 하위 배치 세부 정보 부족</text>
  <text class="sm muted" x="250" y="72" xml:space="preserve">중첩된 식, 이름 붙은 변수만 보인다</text>
  <rect class="box" x="660" y="30" width="300" height="56" rx="6"/>
  <text class="mono sm" x="676" y="63.0" xml:space="preserve">int res = x + y * z;</text>
  <line class="ln" x1="115" y1="88" x2="115" y2="116" marker-end="url(#opt-abstraction-levels-a)"/>
  <rect class="acc" x="0" y="118" width="230" height="56" rx="8"/>
  <text class="b acc-t" x="115.0" y="150.5" text-anchor="middle" xml:space="preserve">중간 코드 IR / TAC</text>
  <text class="sm" x="250" y="142" xml:space="preserve">양쪽 절충: 소스보다 구체적이고 타깃 코드보다 추상적</text>
  <text class="sm muted" x="250" y="160" xml:space="preserve">임시 이름 t1, t2 · 레지스터 무제한 · 명령마다 연산 하나</text>
  <rect class="box" x="660" y="118" width="300" height="56" rx="6"/>
  <text class="mono sm" x="676" y="142.0" xml:space="preserve">t1 := y * z</text>
  <text class="mono sm" x="676" y="160.0" xml:space="preserve">t2 := x + t1</text>
  <line class="ln" x1="115" y1="176" x2="115" y2="204" marker-end="url(#opt-abstraction-levels-a)"/>
  <rect class="plain" x="0" y="206" width="230" height="56" rx="8"/>
  <text x="115.0" y="238.5" text-anchor="middle" xml:space="preserve">타깃 코드 Target Code</text>
  <text class="sm" x="250" y="230" xml:space="preserve">추상화 수준이 가장 낮음, 물리 레지스터와 하드웨어 제약이 가득함</text>
  <text class="sm muted" x="250" y="248" xml:space="preserve">물리 레지스터 esi, edx, eax · 덧셈도 주소 계산(lea)으로</text>
  <rect class="box" x="660" y="206" width="300" height="56" rx="6"/>
  <text class="mono sm" x="676" y="230.0" xml:space="preserve">imul esi, edx</text>
  <text class="mono sm" x="676" y="248.0" xml:space="preserve">lea  eax, [rsi+rdi]</text>
  <text class="sm muted" x="950" y="284" text-anchor="end" xml:space="preserve">x86-64, gcc 13.3 -O2 실제 출력</text>
</svg>
