<svg xmlns="http://www.w3.org/2000/svg" width="972" height="332" viewBox="-16 -16 972 332" role="img" aria-label="참조 카운팅에서 자기 대입 x = x를 할 때 증가를 먼저 하면 rc가 1 → 2 → 1로 안전하고, 감소를 먼저 하면 rc가 0이 되어 객체가 해제된 뒤 증가가 해제된 객체를 건드리는 그림. 오른쪽은 x를 null로 바꾼 뒤에도 rc가 1씩 남는 순환 A ⇄ B">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="972" height="332" rx="14" fill="#F0EEE6"/>
  <defs><marker id="gc-rc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-rc-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-rc-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">① 자기 대입 x = x (x → o, rc(o) = 1)</text>
  <rect class="blue" x="0" y="30" width="250" height="220" rx="8"/>
  <text class="b blue-t" x="14" y="54" xml:space="preserve">증가 먼저 (슬라이드 81 순서)</text>
  <text class="mono sm" x="14" y="84" xml:space="preserve">rc(o) = rc(o) + 1</text>
  <text class="mono sm b blue-t" x="236" y="84" text-anchor="end" xml:space="preserve">rc = 2</text>
  <text class="mono sm" x="14" y="120" xml:space="preserve">rc(o) = rc(o) - 1</text>
  <text class="mono sm b blue-t" x="236" y="120" text-anchor="end" xml:space="preserve">rc = 1</text>
  <text class="mono sm" x="14" y="156" xml:space="preserve">rc(o) == 0 ?</text>
  <text class="mono sm b blue-t" x="236" y="156" text-anchor="end" xml:space="preserve">아니오</text>
  <text class="mono sm" x="14" y="192" xml:space="preserve">x = x</text>
  <text class="mono sm b blue-t" x="236" y="192" text-anchor="end" xml:space="preserve">o 살아 있음</text>
  <rect class="acc" x="270" y="30" width="250" height="220" rx="8"/>
  <text class="b acc-t" x="284" y="54" xml:space="preserve">감소 먼저 (잘못된 순서)</text>
  <text class="mono sm" x="284" y="84" xml:space="preserve">rc(o) = rc(o) - 1</text>
  <text class="mono sm b acc-t" x="506" y="84" text-anchor="end" xml:space="preserve">rc = 0</text>
  <text class="mono sm" x="284" y="120" xml:space="preserve">rc(o) == 0 ?</text>
  <text class="mono sm b acc-t" x="506" y="120" text-anchor="end" xml:space="preserve">예 → free(o)</text>
  <text class="mono sm" x="284" y="156" xml:space="preserve">rc(o) = rc(o) + 1</text>
  <text class="mono sm b acc-t" x="506" y="156" text-anchor="end" xml:space="preserve">해제된 o!</text>
  <text class="mono sm" x="284" y="192" xml:space="preserve">x = x</text>
  <text class="mono sm b acc-t" x="506" y="192" text-anchor="end" xml:space="preserve">댕글링</text>
  <text class="sm muted" x="0" y="276" xml:space="preserve">같은 객체를 가리키는 대입에서 감소를 먼저 하면 아직 쓰는 객체를 해제한다 (gc.py로 재현)</text>
  <text class="b" x="560" y="14" xml:space="preserve">② 순환 구조 (슬라이드 84–87)</text>
  <text class="mono b acc-t" x="560" y="50" xml:space="preserve">x</text>
  <line class="ln-acc" x1="574" y1="46" x2="622" y2="46" marker-end="url(#gc-rc-acc)"/>
  <rect class="blue" x="624" y="30" width="70" height="32" rx="5"/>
  <text class="mono sm b" x="659.0" y="50.0" text-anchor="middle" xml:space="preserve">A  rc 2</text>
  <rect class="blue" x="790" y="30" width="70" height="32" rx="5"/>
  <text class="mono sm b" x="825.0" y="50.0" text-anchor="middle" xml:space="preserve">B  rc 1</text>
  <line class="ln" x1="694" y1="40" x2="788" y2="40" marker-end="url(#gc-rc-a)"/>
  <line class="ln" x1="788" y1="54" x2="696" y2="54" marker-end="url(#gc-rc-a)"/>
  <text class="b" x="560" y="100" xml:space="preserve">x ← null 뒤:</text>
  <text class="mono b muted" x="560" y="136" xml:space="preserve">x</text>
  <text class="mono sm muted" x="574" y="136" xml:space="preserve">= null</text>
  <rect class="ghost" x="624" y="150" width="70" height="32" rx="5"/>
  <text class="mono sm b" x="659.0" y="170.0" text-anchor="middle" xml:space="preserve">A  rc 1</text>
  <rect class="ghost" x="790" y="150" width="70" height="32" rx="5"/>
  <text class="mono sm b" x="825.0" y="170.0" text-anchor="middle" xml:space="preserve">B  rc 1</text>
  <line class="ln" x1="694" y1="160" x2="788" y2="160" marker-end="url(#gc-rc-a)"/>
  <line class="ln" x1="788" y1="174" x2="696" y2="174" marker-end="url(#gc-rc-a)"/>
  <text class="sm" x="560" y="214" xml:space="preserve">둘 다 루트에서 닿지 않는데 rc는 1</text>
  <text class="sm" x="560" y="234" xml:space="preserve">서로의 참조가 0이 되는 것을 막는다</text>
  <text class="sm b acc-t" x="560" y="254" xml:space="preserve">→ 영원히 해제되지 않는 누수</text>
  <text class="sm muted" x="560" y="276" xml:space="preserve">해결: 한쪽을 weak 참조로, 또는 가끔 추적 GC로 순환 수거</text>
</svg>
