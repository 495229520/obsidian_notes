<svg xmlns="http://www.w3.org/2000/svg" width="912" height="284" viewBox="-16 -16 912 284" role="img" aria-label="case 식의 타입 검사. 분기마다 변수를 새로 묶은 환경에서 본문을 검사하고, 본문 타입들의 lub가 case 전체의 타입이다. 실행할 때는 객체의 동적 타입에 맞는 분기 하나만 실행한다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
