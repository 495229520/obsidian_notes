    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="912" height="284" rx="14" fill="#F0EEE6"/>
  <defs><marker id="sa-case-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-case-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-case-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="acc" x="290" y="0" width="300" height="44" rx="8"/>
  <text class="mono" x="440.0" y="17.4" text-anchor="middle" xml:space="preserve">case pet of … esac</text>
  <text class="mono sm blue-t" x="440.0" y="35.6" text-anchor="middle" xml:space="preserve">O₁ ⊢ pet : Animal</text>
  <line class="ln-blue" x1="440" y1="44" x2="230" y2="98" marker-end="url(#sa-case-blue)"/>
  <rect class="box" x="90" y="100" width="280" height="64" rx="8"/>
  <text class="mono" x="230.0" y="127.4" text-anchor="middle" xml:space="preserve">d: Dog =&gt; 1</text>
  <text class="mono sm blue-t" x="230.0" y="145.6" text-anchor="middle" xml:space="preserve">환경 O₁[Dog/d]</text>
  <rect class="acc" x="160.0" y="174.0" width="140" height="24" rx="6"/>
  <text class="sm" x="230" y="190.5" text-anchor="middle" xml:space="preserve">본문 타입 Int</text>
  <line class="ln-blue" x1="440" y1="44" x2="650" y2="98" marker-end="url(#sa-case-blue)"/>
  <rect class="box" x="510" y="100" width="280" height="64" rx="8"/>
  <text class="mono" x="650.0" y="127.4" text-anchor="middle" xml:space="preserve">c: Cat =&gt; 2</text>
  <text class="mono sm blue-t" x="650.0" y="145.6" text-anchor="middle" xml:space="preserve">환경 O₁[Cat/c]</text>
  <rect class="acc" x="580.0" y="174.0" width="140" height="24" rx="6"/>
  <text class="sm" x="650" y="190.5" text-anchor="middle" xml:space="preserve">본문 타입 Int</text>
  <rect class="blue" x="290" y="212" width="300" height="40" rx="8"/>
  <text class="sm b" x="440.0" y="236.5" text-anchor="middle" xml:space="preserve">lub(Int, Int) = Int → case 전체 : Int</text>
  <text class="sm muted" x="0" y="70" xml:space="preserve">컴파일 시: 모든 분기를 검사</text>
  <text class="sm muted" x="700" y="66" xml:space="preserve">실행 시: pet이 Cat 객체면</text>
  <text class="sm muted" x="700" y="84" xml:space="preserve">c 분기 하나만 실행</text>
