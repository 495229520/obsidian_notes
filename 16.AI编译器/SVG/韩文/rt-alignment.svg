  <rect class="plain" x="120" y="332" width="40" height="30" rx="2"/>
  <text class="mono sm" x="140.0" y="351.5" text-anchor="middle" xml:space="preserve">c</text>
  <rect class="plain" x="160" y="332" width="40" height="30" rx="2"/>
  <text class="mono sm" x="180.0" y="351.5" text-anchor="middle" xml:space="preserve">c</text>
