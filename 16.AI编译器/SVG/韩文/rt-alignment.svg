  <rect class="box" x="560" y="132" width="40" height="30" rx="2"/>
  <rect class="box" x="600" y="132" width="40" height="30" rx="2"/>
  <rect class="box" x="640" y="132" width="40" height="30" rx="2"/>
  <line class="ln" x1="40" y1="128" x2="40" y2="166"/>
  <line class="ln" x1="200" y1="128" x2="200" y2="166"/>
  <line class="ln" x1="360" y1="128" x2="360" y2="166"/>
  <line class="ln" x1="520" y1="128" x2="520" y2="166"/>
  <line class="ln" x1="680" y1="128" x2="680" y2="166"/>
  <polyline class="ln-blue" points="202,170 202,176 358,176 358,170"/>
  <text class="sm blue-t" x="280" y="192" text-anchor="middle" xml:space="preserve">읽기 ①</text>
  <polyline class="ln-blue" points="362,170 362,176 518,176 518,170"/>
  <text class="sm blue-t" x="440" y="192" text-anchor="middle" xml:space="preserve">읽기 ②</text>
  <text class="sm" x="720" y="142" xml:space="preserve">두 워드에 걸쳐 있다</text>
  <text class="sm b" x="720" y="160" xml:space="preserve">→ 두 번 읽어 이어 붙인다</text>
  <text class="sm muted" x="720" y="178" xml:space="preserve">(엄격한 CPU는 예외 발생)</text>
  <text class="b" x="0" y="228" xml:space="preserve">구조체 패딩: 다음 멤버의 정렬이 정한다 (gcc 13.3 x86-64 실측)</text>
  <text class="mono sm" x="40" y="252" xml:space="preserve">struct S1 { char c[5]; int x; };   sizeof = 12</text>
  <rect class="plain" x="40" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm" x="60.0" y="279.5" text-anchor="middle" xml:space="preserve">c</text>
  <rect class="plain" x="80" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm" x="100.0" y="279.5" text-anchor="middle" xml:space="preserve">c</text>
  <rect class="plain" x="120" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm" x="140.0" y="279.5" text-anchor="middle" xml:space="preserve">c</text>
  <rect class="plain" x="160" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm" x="180.0" y="279.5" text-anchor="middle" xml:space="preserve">c</text>
  <rect class="plain" x="200" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm" x="220.0" y="279.5" text-anchor="middle" xml:space="preserve">c</text>
  <rect class="ghost" x="240" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm muted" x="260.0" y="279.5" text-anchor="middle" xml:space="preserve">pad</text>
  <rect class="ghost" x="280" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm muted" x="300.0" y="279.5" text-anchor="middle" xml:space="preserve">pad</text>
  <rect class="ghost" x="320" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm muted" x="340.0" y="279.5" text-anchor="middle" xml:space="preserve">pad</text>
  <rect class="acc" x="360" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm" x="380.0" y="279.5" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="acc" x="400" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm" x="420.0" y="279.5" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="acc" x="440" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm" x="460.0" y="279.5" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="acc" x="480" y="260" width="40" height="30" rx="2"/>
  <text class="mono sm" x="500.0" y="279.5" text-anchor="middle" xml:space="preserve">x</text>
  <text class="sm muted" x="40" y="304" text-anchor="middle" xml:space="preserve">0</text>
  <text class="sm muted" x="240" y="304" text-anchor="middle" xml:space="preserve">5</text>
  <text class="sm muted" x="360" y="304" text-anchor="middle" xml:space="preserve">8</text>
  <text class="sm muted" x="520" y="304" text-anchor="middle" xml:space="preserve">12</text>
  <text class="sm" x="720" y="280" xml:space="preserve">x는 4의 배수인 8에서 시작</text>
  <text class="mono sm" x="40" y="324" xml:space="preserve">struct S2 { char c[5]; char d; };  sizeof = 6</text>
  <rect class="plain" x="40" y="332" width="40" height="30" rx="2"/>
  <text class="mono sm" x="60.0" y="351.5" text-anchor="middle" xml:space="preserve">c</text>
