  <line class="ln" x1="40" y1="46" x2="40" y2="84"/>
  <text class="sm muted" x="40" y="98" text-anchor="middle" xml:space="preserve">0</text>
  <line class="ln" x1="200" y1="46" x2="200" y2="84"/>
  <text class="sm muted" x="200" y="98" text-anchor="middle" xml:space="preserve">4</text>
  <line class="ln" x1="360" y1="46" x2="360" y2="84"/>
  <text class="sm muted" x="360" y="98" text-anchor="middle" xml:space="preserve">8</text>
  <line class="ln" x1="520" y1="46" x2="520" y2="84"/>
  <text class="sm muted" x="520" y="98" text-anchor="middle" xml:space="preserve">12</text>
  <line class="ln" x1="680" y1="46" x2="680" y2="84"/>
  <text class="sm muted" x="680" y="98" text-anchor="middle" xml:space="preserve">16</text>
  <text class="sm" x="720" y="62" xml:space="preserve">워드 하나에 들어 있다</text>
  <text class="sm b" x="720" y="80" xml:space="preserve">→ 한 번 읽기</text>
  <text class="sm b" x="40" y="124" xml:space="preserve">어긋남: int가 주소 6에서 시작</text>
  <rect class="box" x="40" y="132" width="40" height="30" rx="2"/>
  <rect class="box" x="80" y="132" width="40" height="30" rx="2"/>
