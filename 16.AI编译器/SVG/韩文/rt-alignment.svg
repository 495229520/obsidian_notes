<svg xmlns="http://www.w3.org/2000/svg" width="932" height="392" viewBox="-16 -16 932 392" role="img" aria-label="정렬. 4바이트 int가 주소 4에서 시작하면 워드 하나에 들어가 한 번에 읽힌다. 주소 6에서 시작하면 두 워드에 걸쳐 두 번 읽어 이어 붙여야 한다. 아래는 gcc 13.3 실측 구조체 배치다. char c[5] 뒤에 int가 오면 3바이트 패딩이 들어가 x가 8에서 시작하고 크기는 12다. char가 오면 패딩이 없고 크기는 6이다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="392" rx="14" fill="#F0EEE6"/>
  <defs><marker id="rt-alignment-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-alignment-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-alignment-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="16" xml:space="preserve">정렬된 접근과 어긋난 접근 (워드 = 4바이트)</text>
  <text class="sm b" x="40" y="42" xml:space="preserve">정렬됨: int가 주소 4에서 시작</text>
  <rect class="box" x="40" y="50" width="40" height="30" rx="2"/>
  <rect class="box" x="80" y="50" width="40" height="30" rx="2"/>
  <rect class="box" x="120" y="50" width="40" height="30" rx="2"/>
  <rect class="box" x="160" y="50" width="40" height="30" rx="2"/>
  <rect class="acc" x="200" y="50" width="40" height="30" rx="2"/>
  <text class="mono sm" x="220.0" y="69.5" text-anchor="middle" xml:space="preserve">i0</text>
  <rect class="acc" x="240" y="50" width="40" height="30" rx="2"/>
  <text class="mono sm" x="260.0" y="69.5" text-anchor="middle" xml:space="preserve">i1</text>
  <rect class="acc" x="280" y="50" width="40" height="30" rx="2"/>
  <text class="mono sm" x="300.0" y="69.5" text-anchor="middle" xml:space="preserve">i2</text>
  <rect class="acc" x="320" y="50" width="40" height="30" rx="2"/>
  <text class="mono sm" x="340.0" y="69.5" text-anchor="middle" xml:space="preserve">i3</text>
