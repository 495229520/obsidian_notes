  <rect class="acc" x="320" y="132" width="40" height="30" rx="2"/>
  <text class="mono sm" x="340.0" y="151.5" text-anchor="middle" xml:space="preserve">i1</text>
  <rect class="acc" x="360" y="132" width="40" height="30" rx="2"/>
  <text class="mono sm" x="380.0" y="151.5" text-anchor="middle" xml:space="preserve">i2</text>
  <rect class="acc" x="400" y="132" width="40" height="30" rx="2"/>
  <text class="mono sm" x="420.0" y="151.5" text-anchor="middle" xml:space="preserve">i3</text>
