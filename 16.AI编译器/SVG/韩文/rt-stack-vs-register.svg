<svg xmlns="http://www.w3.org/2000/svg" width="932" height="362" viewBox="-16 -16 932 362" role="img" aria-label="스택 머신과 레지스터 머신의 명령어 비교. 7 + 5는 둘 다 명령어 3개지만 스택 머신의 add에는 피연산자 칸이 없고 레지스터 머신의 add에는 칸이 3개 있다. a + b에서 값이 이미 레지스터에 있으면 레지스터 머신은 add 한 개로 끝나지만 스택 머신은 값을 다시 스택에 올려야 해서 명령어 3개가 든다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
