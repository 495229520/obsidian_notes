<svg xmlns="http://www.w3.org/2000/svg" width="852" height="246" viewBox="-16 -16 852 246" role="img" aria-label="환경 O에서 O[Bool/x]를 만들면 x만 Bool로 바뀐 새 환경이 생기고 O는 그대로 남는다. 같은 이름 x를 어느 환경에서 찾느냐에 따라 Int와 Bool로 답이 다르다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="852" height="246" rx="14" fill="#F0EEE6"/>
  <defs><marker id="sa-env-update-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-env-update-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-env-update-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="16" xml:space="preserve">기존 환경 O</text>
  <rect class="box" x="0" y="28" width="90" height="34" rx="0"/>
  <text class="mono" x="45" y="50" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="box" x="90" y="28" width="110" height="34" rx="0"/>
  <text class="mono" x="145" y="50" text-anchor="middle" xml:space="preserve">Int</text>
  <rect class="box" x="0" y="62" width="90" height="34" rx="0"/>
  <text class="mono" x="45" y="84" text-anchor="middle" xml:space="preserve">y</text>
  <rect class="box" x="90" y="62" width="110" height="34" rx="0"/>
  <text class="mono" x="145" y="84" text-anchor="middle" xml:space="preserve">String</text>
  <line class="ln-acc" x1="216" y1="62" x2="330" y2="62" marker-end="url(#sa-env-update-acc)"/>
  <text class="mono sm acc-t" x="273" y="52" text-anchor="middle" xml:space="preserve">O[Bool/x]</text>
  <text class="b" x="346" y="16" xml:space="preserve">새 환경 O' = O[Bool/x]</text>
  <rect class="acc" x="346" y="28" width="90" height="34" rx="0"/>
  <text class="mono" x="391" y="50" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="acc" x="436" y="28" width="110" height="34" rx="0"/>
  <text class="mono" x="491" y="50" text-anchor="middle" xml:space="preserve">Bool</text>
  <rect class="box" x="346" y="62" width="90" height="34" rx="0"/>
  <text class="mono" x="391" y="84" text-anchor="middle" xml:space="preserve">y</text>
  <rect class="box" x="436" y="62" width="110" height="34" rx="0"/>
  <text class="mono" x="491" y="84" text-anchor="middle" xml:space="preserve">String</text>
  <text class="sm acc-t" x="560" y="50" xml:space="preserve">← x만 바뀐다</text>
  <text class="sm muted" x="560" y="84" xml:space="preserve">← 나머지는 O에서 그대로</text>
  <text class="mono" x="0" y="142" xml:space="preserve">O(x)</text>
  <text class="mono" x="80" y="142" xml:space="preserve">=</text>
  <text class="mono b" x="100" y="142" xml:space="preserve">Int</text>
  <text class="sm muted" x="180" y="142" xml:space="preserve">기존 환경에서 조회</text>
  <text class="mono" x="0" y="170" xml:space="preserve">O'(x)</text>
  <text class="mono" x="80" y="170" xml:space="preserve">=</text>
  <text class="mono b" x="100" y="170" xml:space="preserve">Bool</text>
  <text class="sm muted" x="180" y="170" xml:space="preserve">새 바인딩이 가린다</text>
  <text class="mono" x="0" y="198" xml:space="preserve">O'(y)</text>
  <text class="mono" x="80" y="198" xml:space="preserve">=</text>
  <text class="mono b" x="100" y="198" xml:space="preserve">String</text>
  <text class="sm muted" x="180" y="198" xml:space="preserve">y ≠ x이므로 O(y)</text>
  <rect class="plain" x="470" y="124" width="350" height="88" rx="8"/>
  <text class="b" x="482" y="146.25" xml:space="preserve">섀도잉</text>
  <text x="482" y="167.0" xml:space="preserve">O는 지워지거나 덮어써지지 않는다.</text>
  <text x="482" y="185.8" xml:space="preserve">안쪽 let을 나오면 O로 다시 검사한다.</text>
</svg>
