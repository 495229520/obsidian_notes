<svg xmlns="http://www.w3.org/2000/svg" width="932" height="332" viewBox="-16 -16 932 332" role="img" aria-label="상속 사슬과 class(C)의 평탄화. class A { a1; a2; }, class B inherits A { b1; b2; }, class C inherits B { c1; c2; }일 때 class(C)는 최상위 조상 A의 속성 a1, a2, 부모 클래스 B의 속성 b1, b2, 현재 클래스 C의 속성 c1, c2 순서다. new C는 이 순서로 위치 l1부터 l6을 할당하고 초기화식도 이 순서로 실행한다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="332" rx="14" fill="#F0EEE6"/>
  <defs><marker id="os-class-flatten-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-class-flatten-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-class-flatten-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="18" xml:space="preserve">상속 사슬 정의</text>
  <text class="b" x="400" y="18" xml:space="preserve">class(C) 평탄화 결과 (최상위 조상 우선)</text>
  <rect class="blue" x="0" y="52" width="300" height="36" rx="8"/>
  <text class="mono sm b" x="150.0" y="74.5" text-anchor="middle" xml:space="preserve">class A { a1; a2; }</text>
  <rect class="plain" x="0" y="112" width="300" height="36" rx="8"/>
  <text class="mono sm b" x="150.0" y="134.5" text-anchor="middle" xml:space="preserve">class B inherits A { b1; b2; }</text>
  <rect class="acc" x="0" y="172" width="300" height="36" rx="8"/>
  <text class="mono sm b" x="150.0" y="194.5" text-anchor="middle" xml:space="preserve">class C inherits B { c1; c2; }</text>
  <line class="ln" x1="150" y1="112" x2="150" y2="90" marker-end="url(#os-class-flatten-a)"/>
  <line class="ln" x1="150" y1="172" x2="150" y2="150" marker-end="url(#os-class-flatten-a)"/>
  <text class="mono sm muted" x="160" y="104" xml:space="preserve">inherits</text>
  <text class="mono sm muted" x="160" y="164" xml:space="preserve">inherits</text>
  <rect class="blue" x="400" y="40" width="70" height="30" rx="3"/>
  <text class="mono b" x="435.0" y="59.0" text-anchor="middle" xml:space="preserve">a1</text>
  <text class="mono sm muted" x="392" y="59" text-anchor="end" xml:space="preserve">1</text>
  <text class="mono sm" x="694" y="59" text-anchor="middle" xml:space="preserve">l₁</text>
  <rect class="blue" x="400" y="70" width="70" height="30" rx="3"/>
  <text class="mono b" x="435.0" y="89.0" text-anchor="middle" xml:space="preserve">a2</text>
  <text class="mono sm muted" x="392" y="89" text-anchor="end" xml:space="preserve">2</text>
  <text class="mono sm" x="694" y="89" text-anchor="middle" xml:space="preserve">l₂</text>
  <rect class="plain" x="400" y="100" width="70" height="30" rx="3"/>
  <text class="mono b" x="435.0" y="119.0" text-anchor="middle" xml:space="preserve">b1</text>
  <text class="mono sm muted" x="392" y="119" text-anchor="end" xml:space="preserve">3</text>
  <text class="mono sm" x="694" y="119" text-anchor="middle" xml:space="preserve">l₃</text>
  <rect class="plain" x="400" y="130" width="70" height="30" rx="3"/>
  <text class="mono b" x="435.0" y="149.0" text-anchor="middle" xml:space="preserve">b2</text>
  <text class="mono sm muted" x="392" y="149" text-anchor="end" xml:space="preserve">4</text>
  <text class="mono sm" x="694" y="149" text-anchor="middle" xml:space="preserve">l₄</text>
  <rect class="acc" x="400" y="160" width="70" height="30" rx="3"/>
  <text class="mono b" x="435.0" y="179.0" text-anchor="middle" xml:space="preserve">c1</text>
  <text class="mono sm muted" x="392" y="179" text-anchor="end" xml:space="preserve">5</text>
  <text class="mono sm" x="694" y="179" text-anchor="middle" xml:space="preserve">l₅</text>
  <rect class="acc" x="400" y="190" width="70" height="30" rx="3"/>
  <text class="mono b" x="435.0" y="209.0" text-anchor="middle" xml:space="preserve">c2</text>
  <text class="mono sm muted" x="392" y="209" text-anchor="end" xml:space="preserve">6</text>
  <text class="mono sm" x="694" y="209" text-anchor="middle" xml:space="preserve">l₆</text>
  <polyline class="ln" points="478,42 484,42 484,98 478,98"/>
  <text class="sm" x="494" y="74" xml:space="preserve">최상위 조상 A의 속성</text>
  <polyline class="ln" points="478,102 484,102 484,158 478,158"/>
  <text class="sm" x="494" y="134" xml:space="preserve">부모 클래스 B의 속성</text>
  <polyline class="ln" points="478,162 484,162 484,218 478,218"/>
  <text class="sm" x="494" y="194" xml:space="preserve">현재 클래스 C의 속성</text>
  <text class="sm b" x="694" y="30" text-anchor="middle" xml:space="preserve">new C의 위치</text>
  <line class="ln-acc" x1="740" y1="44" x2="740" y2="216" marker-end="url(#os-class-flatten-acc)"/>
  <text class="sm acc-t" x="752" y="120" xml:space="preserve">초기화식도</text>
  <text class="sm acc-t" x="752" y="138" xml:space="preserve">이 순서로 실행</text>
  <line class="ln-muted" x1="0" y1="236" x2="900" y2="236"/>
  <text class="sm" x="0" y="260" xml:space="preserve">한 클래스 안에서는 소스에 적힌 순서를 따른다(슬라이드 45). Cool은 상속받은 속성을 다시 정의할 수 없어 이름이 겹치지 않는다.</text>
  <text class="sm muted" x="0" y="282" xml:space="preserve">코드 생성 노트 §5의 객체 배치(부모 속성이 앞, 자식 속성이 뒤)와 같은 순서다.</text>
</svg>
