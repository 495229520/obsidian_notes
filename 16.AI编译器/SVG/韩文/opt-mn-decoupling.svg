<svg xmlns="http://www.w3.org/2000/svg" width="992" height="350" viewBox="-16 -16 992 350" role="img" aria-label="직접 번역 방식과 IR 도입 디커플링 방식의 비교. 왼쪽은 IR 없이 원시 언어 1, 2, 3을 타깃 아키텍처 1, 2, 3으로 직접 번역하는 방식으로, 모든 쌍마다 번역기가 필요해 복잡도가 M 곱하기 N, 여기서는 9개다. 오른쪽은 원시 언어가 모두 중간 코드(IR/IL)로 번역되고 IR이 각 타깃으로 번역되는 방식으로, 프런트엔드 3개와 백엔드 3개, 복잡도 M 더하기 N, 여기서는 6개다. 실제 예로 Clang, rustc, swiftc가 LLVM IR을 거쳐 x86-64, AArch64, RISC-V로 간다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="992" height="350" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-mn-decoupling-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-mn-decoupling-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-mn-decoupling-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="225" y="16" text-anchor="middle" xml:space="preserve">직접 번역 방식 (IR 없음, 복잡도 M * N)</text>
  <rect class="plain" x="0" y="56" width="116" height="36" rx="8"/>
  <text x="58.0" y="78.5" text-anchor="middle" xml:space="preserve">원시 언어 1</text>
  <rect class="plain" x="0" y="126" width="116" height="36" rx="8"/>
  <text x="58.0" y="148.5" text-anchor="middle" xml:space="preserve">원시 언어 2</text>
  <rect class="plain" x="0" y="196" width="116" height="36" rx="8"/>
  <text x="58.0" y="218.5" text-anchor="middle" xml:space="preserve">원시 언어 3</text>
  <rect class="plain" x="320" y="56" width="130" height="36" rx="8"/>
  <text x="385.0" y="78.5" text-anchor="middle" xml:space="preserve">타깃 아키텍처 1</text>
  <rect class="plain" x="320" y="126" width="130" height="36" rx="8"/>
  <text x="385.0" y="148.5" text-anchor="middle" xml:space="preserve">타깃 아키텍처 2</text>
  <rect class="plain" x="320" y="196" width="130" height="36" rx="8"/>
  <text x="385.0" y="218.5" text-anchor="middle" xml:space="preserve">타깃 아키텍처 3</text>
  <line class="ln" x1="118" y1="74" x2="316" y2="74" marker-end="url(#opt-mn-decoupling-a)"/>
  <line class="ln-muted" x1="118" y1="74" x2="316" y2="144" marker-end="url(#opt-mn-decoupling-a)"/>
  <line class="ln-muted" x1="118" y1="74" x2="316" y2="214" marker-end="url(#opt-mn-decoupling-a)"/>
  <line class="ln-muted" x1="118" y1="144" x2="316" y2="74" marker-end="url(#opt-mn-decoupling-a)"/>
  <line class="ln" x1="118" y1="144" x2="316" y2="144" marker-end="url(#opt-mn-decoupling-a)"/>
  <line class="ln-muted" x1="118" y1="144" x2="316" y2="214" marker-end="url(#opt-mn-decoupling-a)"/>
  <line class="ln-muted" x1="118" y1="214" x2="316" y2="74" marker-end="url(#opt-mn-decoupling-a)"/>
  <line class="ln-muted" x1="118" y1="214" x2="316" y2="144" marker-end="url(#opt-mn-decoupling-a)"/>
  <line class="ln" x1="118" y1="214" x2="316" y2="214" marker-end="url(#opt-mn-decoupling-a)"/>
  <text class="b acc-t" x="225" y="262" text-anchor="middle" xml:space="preserve">번역기 3 × 3 = 9개</text>
  <text class="sm muted" x="225" y="282" text-anchor="middle" xml:space="preserve">언어가 하나 늘면 N개, 타깃이 하나 늘면 M개를 새로 짠다</text>
  <line class="ln-muted" x1="478" y1="30" x2="478" y2="290"/>
  <text class="b" x="733" y="16" text-anchor="middle" xml:space="preserve">IR 도입 디커플링 방식 (복잡도 M + N)</text>
  <rect class="plain" x="506" y="56" width="116" height="36" rx="8"/>
  <text x="564.0" y="78.5" text-anchor="middle" xml:space="preserve">원시 언어 1</text>
  <rect class="plain" x="506" y="126" width="116" height="36" rx="8"/>
  <text x="564.0" y="148.5" text-anchor="middle" xml:space="preserve">원시 언어 2</text>
  <rect class="plain" x="506" y="196" width="116" height="36" rx="8"/>
  <text x="564.0" y="218.5" text-anchor="middle" xml:space="preserve">원시 언어 3</text>
  <rect class="acc" x="674" y="116" width="118" height="56" rx="8"/>
  <text class="b acc-t" x="733.0" y="139.4" text-anchor="middle" xml:space="preserve">중간 코드</text>
  <text class="mono sm" x="733.0" y="157.6" text-anchor="middle" xml:space="preserve">(IR/IL)</text>
  <rect class="plain" x="830" y="56" width="130" height="36" rx="8"/>
  <text x="895.0" y="78.5" text-anchor="middle" xml:space="preserve">타깃 아키텍처 1</text>
  <rect class="plain" x="830" y="126" width="130" height="36" rx="8"/>
  <text x="895.0" y="148.5" text-anchor="middle" xml:space="preserve">타깃 아키텍처 2</text>
  <rect class="plain" x="830" y="196" width="130" height="36" rx="8"/>
  <text x="895.0" y="218.5" text-anchor="middle" xml:space="preserve">타깃 아키텍처 3</text>
  <line class="ln-blue" x1="624" y1="74" x2="672" y2="123.0" marker-end="url(#opt-mn-decoupling-blue)"/>
  <line class="ln-blue" x1="794" y1="123.0" x2="826" y2="74" marker-end="url(#opt-mn-decoupling-blue)"/>
  <line class="ln-blue" x1="624" y1="144" x2="672" y2="144.0" marker-end="url(#opt-mn-decoupling-blue)"/>
  <line class="ln-blue" x1="794" y1="144.0" x2="826" y2="144" marker-end="url(#opt-mn-decoupling-blue)"/>
  <line class="ln-blue" x1="624" y1="214" x2="672" y2="165.0" marker-end="url(#opt-mn-decoupling-blue)"/>
  <line class="ln-blue" x1="794" y1="165.0" x2="826" y2="214" marker-end="url(#opt-mn-decoupling-blue)"/>
  <text class="sm blue-t" x="566" y="44" text-anchor="middle" xml:space="preserve">프런트엔드 M개</text>
  <text class="sm blue-t" x="895" y="44" text-anchor="middle" xml:space="preserve">백엔드 N개</text>
  <text class="b blue-t" x="733" y="262" text-anchor="middle" xml:space="preserve">프런트엔드 3 + 백엔드 3 = 6개</text>
  <text class="sm muted" x="733" y="282" text-anchor="middle" xml:space="preserve">예: Clang · rustc · swiftc → LLVM IR → x86-64 · AArch64 · RISC-V</text>
</svg>
