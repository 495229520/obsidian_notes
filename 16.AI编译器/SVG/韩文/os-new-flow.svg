<svg xmlns="http://www.w3.org/2000/svg" width="852" height="536" viewBox="-16 -16 852 536" role="img" aria-label="new T의 실행 흐름. 입력 상태 (so, E, S)에서 1. 실제 클래스 T₀ 결정, 2. class(T₀) 조회로 전체 속성 획득, 3. 새 위치 n개 할당과 객체 값 v 구성, 4. 타입별 기본값을 기록해 초기 저장소 S₁ 생성, 5. 새 환경 E′를 만들고 v를 self로 삼아 초기화 블록을 순차 평가해 S₂ 획득. 출력은 (v, S₂)로, 마지막 초기화식 값 vₙ은 버린다. 1–3단계는 객체 할당, 4–5단계는 초기화에 해당한다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="852" height="536" rx="14" fill="#F0EEE6"/>
  <defs><marker id="os-new-flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-new-flow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-new-flow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="blue" x="200.0" y="0.0" width="200" height="32" rx="6"/>
  <text class="mono sm b" x="300.0" y="20.5" text-anchor="middle" xml:space="preserve">입력 상태 (so, E, S)</text>
  <line class="ln" x1="300.0" y1="34" x2="300.0" y2="46" marker-end="url(#os-new-flow-a)"/>
  <rect class="plain" x="0" y="48" width="600" height="58" rx="8"/>
  <text class="sm" x="14" y="70" xml:space="preserve">1. 실제 클래스 T₀ 결정: T == SELF_TYPE이고 so = X(…)이면 T₀ = X, 아니면 T₀ = T</text>
  <text class="sm muted" x="14" y="90" xml:space="preserve">new SELF_TYPE일 때만 so의 동적 클래스로 바뀐다</text>
  <line class="ln" x1="300.0" y1="110" x2="300.0" y2="122" marker-end="url(#os-new-flow-a)"/>
  <rect class="plain" x="0" y="124" width="600" height="58" rx="8"/>
  <text class="sm" x="14" y="146" xml:space="preserve">2. class(T₀) 조회로 전체 속성 (a₁ : T₁ ← e₁, …, aₙ : Tₙ ← eₙ) 획득 (조상 속성 우선)</text>
  <text class="sm muted" x="14" y="166" xml:space="preserve">상속 속성 포함, 최상위 조상부터</text>
  <line class="ln" x1="300.0" y1="186" x2="300.0" y2="198" marker-end="url(#os-new-flow-a)"/>
  <rect class="plain" x="0" y="200" width="600" height="58" rx="8"/>
  <text class="sm" x="14" y="222" xml:space="preserve">3. 새 위치 n개 할당 (l₁..lₙ = newloc(S)), 객체 값 v = T₀(a₁ = l₁, …, aₙ = lₙ) 구성</text>
  <text class="sm muted" x="14" y="242" xml:space="preserve">lᵢ는 서로 다른 n개의 새 위치. v는 값이 아니라 위치를 담는다</text>
  <line class="ln" x1="300.0" y1="262" x2="300.0" y2="274" marker-end="url(#os-new-flow-a)"/>
  <rect class="box" x="0" y="276" width="600" height="58" rx="8"/>
  <text class="sm" x="14" y="298" xml:space="preserve">4. 타입별 기본값 D_{Tᵢ}를 기록해 초기 저장소 S₁ = S[D_{T₁}/l₁, …, D_{Tₙ}/lₙ] 생성</text>
  <text class="sm muted" x="14" y="318" xml:space="preserve">초기화식이 아직 돌지 않은 속성도 읽을 수 있는 값을 갖는다</text>
  <line class="ln" x1="300.0" y1="338" x2="300.0" y2="350" marker-end="url(#os-new-flow-a)"/>
  <rect class="acc" x="0" y="352" width="600" height="76" rx="8"/>
  <text class="sm" x="14" y="374" xml:space="preserve">5. 새 환경 E′ = [a₁ : l₁, …, aₙ : lₙ]을 만들고 v를 self로 삼아 (v, E′, S₁)에서</text>
  <text class="sm" x="14" y="392" xml:space="preserve">초기화 블록 { a₁ ← e₁; …; aₙ ← eₙ; }을 순차 평가해 저장소 S₂ 획득</text>
  <text class="sm acc-t" x="14" y="412" xml:space="preserve">self = v. 호출자의 E는 보이지 않는다 (E′는 E와 무관)</text>
  <line class="ln" x1="300.0" y1="432" x2="300.0" y2="444" marker-end="url(#os-new-flow-a)"/>
  <rect class="blue" x="0" y="446" width="600" height="58" rx="8"/>
  <text class="mono sm b" x="14" y="468" xml:space="preserve">출력 (v, S₂)</text>
  <text class="sm" x="14" y="488" xml:space="preserve">(새로 만든 객체 v를 반환하고 마지막 초기화식 값 vₙ은 버리며, 부수 효과 S₂만 유지)</text>
  <polyline class="ln" points="620,50 626,50 626,256 620,256"/>
  <text class="b" x="638" y="149.0" xml:space="preserve">객체 할당</text>
  <text class="sm muted" x="638" y="169.0" xml:space="preserve">비형식 단계 1</text>
  <polyline class="ln" points="620,278 626,278 626,332 620,332"/>
  <text class="b" x="638" y="301.0" xml:space="preserve">초기화: 기본값</text>
  <text class="sm muted" x="638" y="321.0" xml:space="preserve">비형식 단계 2</text>
  <polyline class="ln-acc" points="620,354 626,354 626,426 620,426"/>
  <text class="b acc-t" x="638" y="386.0" xml:space="preserve">초기화: 초기화식</text>
  <text class="sm muted" x="638" y="406.0" xml:space="preserve">비형식 단계 3</text>
  <polyline class="ln-blue" points="620,448 626,448 626,502 620,502"/>
  <text class="b blue-t" x="638" y="471.0" xml:space="preserve">반환</text>
  <text class="sm muted" x="638" y="491.0" xml:space="preserve">비형식 단계 4</text>
</svg>
