<svg xmlns="http://www.w3.org/2000/svg" width="952" height="332" viewBox="-16 -16 952 332" role="img" aria-label="g가 실행 중인 순간의 활성화 레코드. main, f(3), f(2), f(1), f(0), g의 AR이 차례로 쌓여 있다. f의 AR은 result, argument, control link, return address로 이루어진다. 각 control link는 바로 앞 호출자의 AR을 가리키고, f(3)의 반환 주소는 (*), 재귀로 부른 f들의 반환 주소는 (**), g의 반환 주소는 f 안의 return g() 위치다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="952" height="332" rx="14" fill="#F0EEE6"/>
  <defs><marker id="rt-ar-chain-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-ar-chain-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-ar-chain-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="sm muted" x="0" y="12" xml:space="preserve">호출할 때마다 오른쪽에 AR이 하나씩 쌓인다. 그림은 g가 실행 중인 순간 (main → f(3) → f(2) → f(1) → f(0) → g)</text>
  <rect class="plain" x="0" y="26" width="124" height="28" rx="4"/>
  <text class="mono b" x="62.0" y="44.5" text-anchor="middle" xml:space="preserve">main</text>
  <rect class="box" x="0" y="54" width="124" height="112" rx="4"/>
  <text class="mono sm" x="62" y="104" text-anchor="middle" xml:space="preserve">ans = ?</text>
  <text class="sm muted" x="62" y="124" text-anchor="middle" xml:space="preserve">(main의 지역 변수)</text>
  <rect class="plain" x="159" y="26" width="124" height="28" rx="4"/>
  <text class="mono b" x="221.0" y="44.5" text-anchor="middle" xml:space="preserve">f(3)</text>
  <rect class="box" x="159" y="54" width="124" height="28" rx="0"/>
  <text class="sm muted" x="167" y="72" xml:space="preserve">result</text>
  <text class="mono sm" x="275" y="72" text-anchor="end" xml:space="preserve">?</text>
  <rect class="box" x="159" y="82" width="124" height="28" rx="0"/>
  <text class="sm muted" x="167" y="100" xml:space="preserve">argument</text>
  <text class="mono sm" x="275" y="100" text-anchor="end" xml:space="preserve">3</text>
  <rect class="box" x="159" y="110" width="124" height="28" rx="0"/>
  <text class="sm muted" x="167" y="128" xml:space="preserve">control link</text>
  <rect class="box" x="159" y="138" width="124" height="28" rx="0"/>
  <text class="sm muted" x="167" y="156" xml:space="preserve">return addr</text>
  <text class="mono sm" x="275" y="156" text-anchor="end" xml:space="preserve">(*)</text>
  <line class="ln-blue" x1="158" y1="124" x2="125" y2="124" marker-end="url(#rt-ar-chain-blue)"/>
  <rect class="plain" x="318" y="26" width="124" height="28" rx="4"/>
  <text class="mono b" x="380.0" y="44.5" text-anchor="middle" xml:space="preserve">f(2)</text>
  <rect class="box" x="318" y="54" width="124" height="28" rx="0"/>
  <text class="sm muted" x="326" y="72" xml:space="preserve">result</text>
  <text class="mono sm" x="434" y="72" text-anchor="end" xml:space="preserve">?</text>
  <rect class="box" x="318" y="82" width="124" height="28" rx="0"/>
  <text class="sm muted" x="326" y="100" xml:space="preserve">argument</text>
  <text class="mono sm" x="434" y="100" text-anchor="end" xml:space="preserve">2</text>
  <rect class="box" x="318" y="110" width="124" height="28" rx="0"/>
  <text class="sm muted" x="326" y="128" xml:space="preserve">control link</text>
  <rect class="box" x="318" y="138" width="124" height="28" rx="0"/>
  <text class="sm muted" x="326" y="156" xml:space="preserve">return addr</text>
  <text class="mono sm" x="434" y="156" text-anchor="end" xml:space="preserve">(**)</text>
  <line class="ln-blue" x1="317" y1="124" x2="284" y2="124" marker-end="url(#rt-ar-chain-blue)"/>
  <rect class="plain" x="477" y="26" width="124" height="28" rx="4"/>
  <text class="mono b" x="539.0" y="44.5" text-anchor="middle" xml:space="preserve">f(1)</text>
  <rect class="box" x="477" y="54" width="124" height="28" rx="0"/>
  <text class="sm muted" x="485" y="72" xml:space="preserve">result</text>
  <text class="mono sm" x="593" y="72" text-anchor="end" xml:space="preserve">?</text>
  <rect class="box" x="477" y="82" width="124" height="28" rx="0"/>
  <text class="sm muted" x="485" y="100" xml:space="preserve">argument</text>
  <text class="mono sm" x="593" y="100" text-anchor="end" xml:space="preserve">1</text>
  <rect class="box" x="477" y="110" width="124" height="28" rx="0"/>
  <text class="sm muted" x="485" y="128" xml:space="preserve">control link</text>
  <rect class="box" x="477" y="138" width="124" height="28" rx="0"/>
  <text class="sm muted" x="485" y="156" xml:space="preserve">return addr</text>
  <text class="mono sm" x="593" y="156" text-anchor="end" xml:space="preserve">(**)</text>
  <line class="ln-blue" x1="476" y1="124" x2="443" y2="124" marker-end="url(#rt-ar-chain-blue)"/>
  <rect class="plain" x="636" y="26" width="124" height="28" rx="4"/>
  <text class="mono b" x="698.0" y="44.5" text-anchor="middle" xml:space="preserve">f(0)</text>
  <rect class="box" x="636" y="54" width="124" height="28" rx="0"/>
  <text class="sm muted" x="644" y="72" xml:space="preserve">result</text>
  <text class="mono sm" x="752" y="72" text-anchor="end" xml:space="preserve">?</text>
  <rect class="box" x="636" y="82" width="124" height="28" rx="0"/>
  <text class="sm muted" x="644" y="100" xml:space="preserve">argument</text>
  <text class="mono sm" x="752" y="100" text-anchor="end" xml:space="preserve">0</text>
  <rect class="box" x="636" y="110" width="124" height="28" rx="0"/>
  <text class="sm muted" x="644" y="128" xml:space="preserve">control link</text>
  <rect class="box" x="636" y="138" width="124" height="28" rx="0"/>
  <text class="sm muted" x="644" y="156" xml:space="preserve">return addr</text>
  <text class="mono sm" x="752" y="156" text-anchor="end" xml:space="preserve">(**)</text>
  <line class="ln-blue" x1="635" y1="124" x2="602" y2="124" marker-end="url(#rt-ar-chain-blue)"/>
  <rect class="acc" x="795" y="26" width="124" height="28" rx="4"/>
  <text class="mono b" x="857.0" y="44.5" text-anchor="middle" xml:space="preserve">g()</text>
  <rect class="box" x="795" y="54" width="124" height="28" rx="0"/>
  <text class="sm muted" x="803" y="72" xml:space="preserve">result</text>
  <text class="mono sm" x="911" y="72" text-anchor="end" xml:space="preserve">? → 1</text>
  <rect class="dead" x="795" y="82" width="124" height="28" rx="0"/>
  <text class="sm muted" x="803" y="100" xml:space="preserve">argument</text>
  <text class="mono sm" x="911" y="100" text-anchor="end" xml:space="preserve">없음</text>
  <rect class="box" x="795" y="110" width="124" height="28" rx="0"/>
  <text class="sm muted" x="803" y="128" xml:space="preserve">control link</text>
  <rect class="box" x="795" y="138" width="124" height="28" rx="0"/>
  <text class="sm muted" x="803" y="156" xml:space="preserve">return addr</text>
  <text class="mono sm" x="911" y="156" text-anchor="end" xml:space="preserve">(***)</text>
  <line class="ln-blue" x1="794" y1="124" x2="761" y2="124" marker-end="url(#rt-ar-chain-blue)"/>
  <rect class="plain" x="0" y="190" width="470" height="110" rx="8"/>
  <text class="b" x="12" y="212.25" xml:space="preserve">반환 주소가 가리키는 곳 ((***)는 그림에서 붙인 표시)</text>
  <text class="mono sm" x="12" y="233.2" xml:space="preserve">main: int ans = f(3);       // (*)</text>
  <text class="mono sm" x="12" y="252.2" xml:space="preserve">f:    int res = f(x - 1);   // (**)</text>
  <text class="mono sm" x="12" y="271.2" xml:space="preserve">f:    return g();           // (***)</text>
  <rect class="plain" x="490" y="190" width="430" height="110" rx="8"/>
  <text class="b" x="502" y="212.25" xml:space="preserve">필드 읽는 법</text>
  <text class="sm" x="502" y="233.2" xml:space="preserve">control link (파란 화살표): 호출자의 AR을 가리킨다</text>
  <text class="sm" x="502" y="252.2" xml:space="preserve">return addr: 끝난 뒤 이어서 실행할 명령어</text>
  <text class="sm" x="502" y="271.2" xml:space="preserve">result: g가 1을 쓰면 f(0)이 꺼내 자기 result로</text>
</svg>
