  <text class="sm muted" x="240.0" y="227.6" text-anchor="middle" xml:space="preserve">Sym 사용</text>
  <line class="ln" x1="142" y1="214" x2="167" y2="214" marker-end="url(#sa-let-env-a)"/>
  <rect class="blue" x="338" y="186" width="142" height="56" rx="8"/>
  <text class="b" x="409.0" y="209.4" text-anchor="middle" xml:space="preserve">x 등록</text>
  <text class="sm muted" x="409.0" y="227.6" text-anchor="middle" xml:space="preserve">add_symbol</text>
  <line class="ln" x1="311" y1="214" x2="336" y2="214" marker-end="url(#sa-let-env-a)"/>
  <rect class="plain" x="507" y="186" width="142" height="56" rx="8"/>
  <text class="b" x="578.0" y="209.4" text-anchor="middle" xml:space="preserve">본문 검사</text>
  <text class="sm muted" x="578.0" y="227.6" text-anchor="middle" xml:space="preserve">Sym + x</text>
  <line class="ln" x1="480" y1="214" x2="505" y2="214" marker-end="url(#sa-let-env-a)"/>
  <rect class="blue" x="676" y="186" width="142" height="56" rx="8"/>
  <text class="b" x="747.0" y="209.4" text-anchor="middle" xml:space="preserve">After</text>
  <text class="sm muted" x="747.0" y="227.6" text-anchor="middle" xml:space="preserve">x 제거, Sym 복원</text>
  <line class="ln" x1="649" y1="214" x2="674" y2="214" marker-end="url(#sa-let-env-a)"/>
</svg>
