  <text class="sm muted" x="190.0" y="138.6" text-anchor="middle" xml:space="preserve">새 x는 아직 안 보인다</text>
  <rect class="box" x="520" y="98" width="220" height="54" rx="8"/>
  <text x="630.0" y="120.4" text-anchor="middle" xml:space="preserve">본문 e</text>
  <text class="sm muted" x="630.0" y="138.6" text-anchor="middle" xml:space="preserve">새 x가 바깥 x를 가린다</text>
  <rect class="plain" x="0" y="186" width="142" height="56" rx="8"/>
  <text class="b" x="71.0" y="209.4" text-anchor="middle" xml:space="preserve">Before</text>
  <text class="sm muted" x="71.0" y="227.6" text-anchor="middle" xml:space="preserve">스코프 준비</text>
  <rect class="plain" x="169" y="186" width="142" height="56" rx="8"/>
