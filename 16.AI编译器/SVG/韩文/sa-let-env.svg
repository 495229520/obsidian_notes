<svg xmlns="http://www.w3.org/2000/svg" width="852" height="282" viewBox="-16 -16 852 282" role="img" aria-label="let 노드의 두 자식은 다른 환경에서 검사한다. 초기화식은 원래 환경 Sym, 본문은 x를 더한 Sym + x에서 검사하고, 본문을 마치면 Sym으로 돌아간다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="852" height="282" rx="14" fill="#F0EEE6"/>
  <defs><marker id="sa-let-env-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-let-env-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-let-env-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="acc" x="290" y="0" width="240" height="44" rx="8"/>
  <text class="mono sm" x="410.0" y="26.5" text-anchor="middle" xml:space="preserve">let x: Int &lt;- 초기화식 in e</text>
  <line class="ln" x1="350" y1="44" x2="190" y2="96" marker-end="url(#sa-let-env-a)"/>
  <line class="ln" x1="470" y1="44" x2="630" y2="96" marker-end="url(#sa-let-env-a)"/>
  <text class="sm blue-t b" x="196" y="66" xml:space="preserve">환경 Sym</text>
  <text class="sm blue-t b" x="560" y="66" xml:space="preserve">환경 Sym + {x: Int}</text>
  <rect class="box" x="80" y="98" width="220" height="54" rx="8"/>
