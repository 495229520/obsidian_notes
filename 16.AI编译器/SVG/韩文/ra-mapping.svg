<svg xmlns="http://www.w3.org/2000/svg" width="932" height="332" viewBox="-16 -16 932 332" role="img" aria-label="가상 임시 변수 t1…tn이 레지스터 할당기를 거쳐 물리 레지스터 r1…rk로 다대일 매핑되는 그림과, 생존 구간이 겹치지 않는 t1과 t3이 r1을 같이 쓰는 예">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="932" height="332" rx="14" fill="#F0EEE6"/>
  <defs><marker id="ra-mapping-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ra-mapping-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ra-mapping-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">중간 코드 계층 (가상 레지스터 무한):</text>
  <rect class="blue" x="7.0" y="33.0" width="46" height="26" rx="6"/>
  <text class="mono" x="30" y="50.5" text-anchor="middle" xml:space="preserve">t1</text>
  <rect class="blue" x="65.0" y="33.0" width="46" height="26" rx="6"/>
  <text class="mono" x="88" y="50.5" text-anchor="middle" xml:space="preserve">t2</text>
  <rect class="blue" x="123.0" y="33.0" width="46" height="26" rx="6"/>
  <text class="mono" x="146" y="50.5" text-anchor="middle" xml:space="preserve">t3</text>
  <rect class="blue" x="181.0" y="33.0" width="46" height="26" rx="6"/>
  <text class="mono" x="204" y="50.5" text-anchor="middle" xml:space="preserve">t4</text>
  <rect class="blue" x="239.0" y="33.0" width="46" height="26" rx="6"/>
  <text class="mono" x="262" y="50.5" text-anchor="middle" xml:space="preserve">t5</text>
  <rect class="blue" x="297.0" y="33.0" width="46" height="26" rx="6"/>
  <text class="mono" x="320" y="50.5" text-anchor="middle" xml:space="preserve">t6</text>
  <rect class="box" x="355.0" y="33.0" width="46" height="26" rx="6"/>
  <text class="mono" x="378" y="50.5" text-anchor="middle" xml:space="preserve">...</text>
  <rect class="blue" x="413.0" y="33.0" width="46" height="26" rx="6"/>
  <text class="mono" x="436" y="50.5" text-anchor="middle" xml:space="preserve">tn</text>
  <rect class="acc" x="130" y="112" width="230" height="40" rx="8"/>
  <text class="b" x="245.0" y="136.5" text-anchor="middle" xml:space="preserve">레지스터 할당기</text>
  <line class="ln" x1="245" y1="62" x2="245" y2="110" marker-end="url(#ra-mapping-a)"/>
  <line class="ln" x1="245" y1="154" x2="245" y2="202" marker-end="url(#ra-mapping-a)"/>
  <text class="sm muted" x="256" y="92" xml:space="preserve">많은 임시 변수</text>
  <text class="sm muted" x="256" y="184" xml:space="preserve">적은 레지스터 (다대일)</text>
  <text class="b" x="0" y="226" xml:space="preserve">타깃 머신 계층 (물리 레지스터 k개로 고정):</text>
  <rect class="acc" x="7.0" y="247.0" width="46" height="26" rx="6"/>
  <text class="mono" x="30" y="264.5" text-anchor="middle" xml:space="preserve">r1</text>
  <rect class="acc" x="65.0" y="247.0" width="46" height="26" rx="6"/>
  <text class="mono" x="88" y="264.5" text-anchor="middle" xml:space="preserve">r2</text>
  <rect class="box" x="123.0" y="247.0" width="46" height="26" rx="6"/>
  <text class="mono" x="146" y="264.5" text-anchor="middle" xml:space="preserve">...</text>
  <rect class="acc" x="181.0" y="247.0" width="46" height="26" rx="6"/>
  <text class="mono" x="204" y="264.5" text-anchor="middle" xml:space="preserve">rk</text>
  <text class="sm muted" x="236" y="265" xml:space="preserve">x86-64 정수 16개, RISC-V/AArch64 31개</text>
  <rect class="box" x="500" y="0" width="400" height="300" rx="8"/>
  <text class="b" x="516" y="24" xml:space="preserve">같이 쓸 수 있는가: 생존 구간으로 판정</text>
  <text class="mono sm muted" x="570" y="52" text-anchor="middle" xml:space="preserve">p0</text>
  <line class="ln-muted" x1="570" y1="60" x2="570" y2="196"/>
  <text class="mono sm muted" x="622" y="52" text-anchor="middle" xml:space="preserve">p1</text>
  <line class="ln-muted" x1="622" y1="60" x2="622" y2="196"/>
  <text class="mono sm muted" x="674" y="52" text-anchor="middle" xml:space="preserve">p2</text>
  <line class="ln-muted" x1="674" y1="60" x2="674" y2="196"/>
  <text class="mono sm muted" x="726" y="52" text-anchor="middle" xml:space="preserve">p3</text>
  <line class="ln-muted" x1="726" y1="60" x2="726" y2="196"/>
  <text class="mono sm muted" x="778" y="52" text-anchor="middle" xml:space="preserve">p4</text>
  <line class="ln-muted" x1="778" y1="60" x2="778" y2="196"/>
  <text class="mono sm muted" x="830" y="52" text-anchor="middle" xml:space="preserve">p5</text>
  <line class="ln-muted" x1="830" y1="60" x2="830" y2="196"/>
  <text class="mono b" x="526" y="89" xml:space="preserve">t1</text>
  <rect class="acc" x="570" y="77" width="104" height="18" rx="5"/>
  <text class="mono sm b acc-t" x="684" y="90" xml:space="preserve">r1</text>
  <text class="mono b" x="526" y="129" xml:space="preserve">t2</text>
  <rect class="blue" x="622" y="117" width="156" height="18" rx="5"/>
  <text class="mono sm b blue-t" x="788" y="130" xml:space="preserve">r2</text>
  <text class="mono b" x="526" y="169" xml:space="preserve">t3</text>
  <rect class="acc" x="726" y="157" width="104" height="18" rx="5"/>
  <text class="mono sm b acc-t" x="840" y="170" xml:space="preserve">r1</text>
  <rect class="plain" x="514" y="206" width="372" height="82" rx="8"/>
  <text class="sm" x="526" y="227.0" xml:space="preserve">t1과 t3은 같은 지점에서 함께 살아 있지 않다 → r1 공유</text>
  <text class="sm" x="526" y="243.5" xml:space="preserve">t2는 p1–p2에서 t1과, p3–p4에서 t3과 겹친다 → 다른 r2</text>
  <text class="sm" x="526" y="260.0" xml:space="preserve">겹침 = 간섭(interference) = RIG의 간선</text>
</svg>
