<svg xmlns="http://www.w3.org/2000/svg" width="992" height="324" viewBox="-16 -16 992 324" role="img" aria-label="피홀 슬라이딩 윈도우. 명령어 흐름은 movq %rbx, %rax, movq %rax, %rcx, movq %rcx, %rax, addq $8, %rsp, ret이다. 윈도우는 연속된 둘째와 셋째 명령을 포착해 치환 규칙을 적용한다. AT&amp;T 문법에서 movq 원본, 대상이므로 둘째 명령 뒤에 %rcx와 %rax가 같은 값이고, 셋째 명령은 아무것도 바꾸지 않아 삭제된다. 이것은 move $a $b; move $b $a를 move $a $b로 바꾸는 규칙과 같은 꼴이다. %rax는 ret이 돌려주는 값이라 살아 있으므로, 지울 수 있는 이유는 죽어서가 아니라 이미 같은 값이기 때문이다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="992" height="324" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-peephole-window-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-peephole-window-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-peephole-window-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">명령어 흐름:</text>
  <text class="mono" x="34" y="46" xml:space="preserve">movq %rbx, %rax</text>
  <rect class="acc" x="14" y="58" width="236" height="62" rx="8"/>
  <text class="mono" x="34" y="84" xml:space="preserve">movq %rax, %rcx</text>
  <text class="mono" x="34" y="108" xml:space="preserve">movq %rcx, %rax</text>
  <text class="mono" x="34" y="146" xml:space="preserve">addq $8, %rsp</text>
  <text class="mono" x="34" y="170" xml:space="preserve">ret</text>
  <line class="ln-acc" x1="280" y1="89" x2="254" y2="89" marker-end="url(#opt-peephole-window-acc)"/>
  <text class="sm b acc-t" x="288" y="86" xml:space="preserve">피홀 슬라이딩 윈도우 (Peephole Window)</text>
  <text class="sm muted" x="288" y="104" xml:space="preserve">(연속된 지역 명령어를 포착해 치환 규칙 적용)</text>
  <line class="ln-muted" x1="560" y1="26" x2="560" y2="186"/>
  <text class="b" x="590" y="14" xml:space="preserve">규칙을 적용한 뒤</text>
  <text class="mono" x="610" y="46" xml:space="preserve">movq %rbx, %rax</text>
  <text class="mono" x="610" y="84" xml:space="preserve">movq %rax, %rcx</text>
  <text class="mono muted" x="610" y="108" xml:space="preserve">movq %rcx, %rax</text>
  <line x1="608" y1="104" x2="728.25" y2="104" stroke="#B0532F" stroke-width="1.4"/>
  <text class="mono" x="610" y="146" xml:space="preserve">addq $8, %rsp</text>
  <text class="mono" x="610" y="170" xml:space="preserve">ret</text>
  <text class="sm blue-t" x="752" y="84" xml:space="preserve">← 이 뒤로 %rcx = %rax</text>
  <text class="sm acc-t" x="752" y="108" xml:space="preserve">← 바꾸는 것이 없어 삭제</text>
  <rect class="box" x="0" y="202" width="960" height="90" rx="8"/>
  <text class="sm" x="16" y="226" xml:space="preserve">AT&amp;T 문법은 <tspan class="mono">movq 원본, 대상</tspan>이다. 둘째 줄은 rcx ← rax, 셋째 줄은 rax ← rcx다.</text>
  <text class="sm" x="16" y="248" xml:space="preserve">슬라이드 81의 규칙 <tspan class="mono acc-t">move $a $b; move $b $a → move $a $b</tspan>와 같은 꼴이다(MIPS move는 대상이 왼쪽). 셋째 줄이 점프 대상이 아니어야 한다.</text>
  <text class="sm muted" x="16" y="270" xml:space="preserve">%rax는 ret이 돌려주는 값이라 살아 있다. 셋째 줄을 지워도 되는 이유는 값이 죽어서가 아니라 이미 같은 값이 들어 있어서다.</text>
</svg>
