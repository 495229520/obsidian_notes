<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="三个节点分别存储 count =、3 和换行符；各节点的 case 选择 String 或 Int 分支生成字符串，递归返回时通过 concat 拼接为 count = 3 和换行符">
  <style>
    .t { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; fill: #141413; }
    .m { font-family: 'JetBrains Mono', 'D2Coding', Consolas, monospace; font-size: 13px; fill: #141413; }
    .h { font-size: 17px; font-weight: 700; }
    .b { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #5E5D59; }
    .tag { font-size: 12px; font-weight: 600; fill: #C15F3C; }
    .ln { stroke: #87867F; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#87867F"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="rgb(245, 244, 237)"/>
  <text class="t h" x="36" y="40">list.flatten()：各节点用 case 生成字符串，再用 concat 拼接</text>

  <!-- node 1 -->
  <rect x="40" y="70" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#B0AEA5"/>
  <text class="t tag" x="56" y="90">List 节点 1</text>
  <text class="m" x="56" y="116">item: "count = "</text>
  <line x1="40" y1="126" x2="240" y2="126" stroke="#E0DDD3"/>
  <text class="m" x="56" y="148">next:</text>
  <circle cx="220" cy="144" r="4" fill="#87867F"/>
  <path class="ln" d="M224,144 H296" marker-end="url(#a)"/>

  <!-- node 2 -->
  <rect x="300" y="70" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#B0AEA5"/>
  <text class="t tag" x="316" y="90">List 节点 2</text>
  <text class="m" x="316" y="116">item: 3</text>
  <line x1="300" y1="126" x2="500" y2="126" stroke="#E0DDD3"/>
  <text class="m" x="316" y="148">next:</text>
  <circle cx="480" cy="144" r="4" fill="#87867F"/>
  <path class="ln" d="M484,144 H556" marker-end="url(#a)"/>

  <!-- node 3 -->
  <rect x="560" y="70" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#B0AEA5"/>
  <text class="t tag" x="576" y="90">List 节点 3</text>
  <text class="m" x="576" y="116">item: "\n"</text>
  <line x1="560" y1="126" x2="760" y2="126" stroke="#E0DDD3"/>
  <text class="m" x="576" y="148">next:</text>
  <circle cx="740" cy="144" r="4" fill="#87867F"/>
  <path class="ln" d="M744,144 H796" marker-end="url(#a)"/>

  <rect x="800" y="127" width="72" height="34" rx="17" fill="#F0EEE6" stroke="#B0AEA5" stroke-dasharray="4 3"/>
  <text class="m" x="836" y="149" text-anchor="middle">void</text>
  <text class="t s" x="836" y="180" text-anchor="middle">nil · 链表末尾</text>

  <!-- case branches -->
  <path class="ln" d="M140,160 V196" marker-end="url(#a)"/>
  <path class="ln" d="M400,160 V196" marker-end="url(#a)"/>
  <path class="ln" d="M660,160 V196" marker-end="url(#a)"/>
  <rect x="40" y="200" width="200" height="50" rx="8" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5"/>
  <text class="m" x="140" y="220" text-anchor="middle">s : String =&gt; s</text>
  <text class="m" x="140" y="240" text-anchor="middle">"count = "</text>
  <rect x="300" y="200" width="200" height="50" rx="8" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5"/>
  <text class="m" x="400" y="220" text-anchor="middle">i : Int =&gt; i2a(i)</text>
  <text class="m" x="400" y="240" text-anchor="middle">"3"</text>
  <rect x="560" y="200" width="200" height="50" rx="8" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5"/>
  <text class="m" x="660" y="220" text-anchor="middle">s : String =&gt; s</text>
  <text class="m" x="660" y="240" text-anchor="middle">"\n"</text>
  <text class="t tag" x="772" y="222">case：选择最接近</text>
  <text class="t tag" x="772" y="240">实际类型的分支</text>

  <!-- concat -->
  <rect x="40" y="276" width="820" height="104" rx="12" fill="#F0EEE6"/>
  <text class="t b" x="60" y="302">递归返回时逐层拼接</text>
  <text class="m" x="60" y="330">"count = ".concat( "3".concat( "\n" ) )</text>
  <text class="m" x="420" y="330" fill="#C15F3C" font-weight="700">= "count = 3\n"</text>
  <text class="t s" x="60" y="362">节点 3 的 isvoid next 为真，直接返回自身字符串；前面的节点将返回结果接在自身字符串后。</text>
</svg>
