<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="main 方法内依次嵌套 let、let 主体块、while 和循环体块；值从 while 的 void 开始，经过块和 let 向外传递，成为 main 的返回值">
  <style>
    .t { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; fill: #141413; }
    .m { font-family: 'JetBrains Mono', 'D2Coding', Consolas, monospace; font-size: 13px; fill: #141413; }
    .h { font-size: 17px; font-weight: 700; }
    .b { font-size: 14px; font-weight: 600; }
    .c { font-size: 13px; }
    .s { font-size: 12px; fill: #5E5D59; }
    .tag { font-size: 12px; font-weight: 600; fill: #C15F3C; }
    .ln { stroke: #87867F; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#87867F"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="rgb(245, 244, 237)"/>
  <text class="t h" x="36" y="40">各层大括号结束的结构不同</text>

  <!-- method -->
  <rect x="24" y="60" width="560" height="346" rx="12" fill="#F0EEE6" stroke="#B0AEA5"/>
  <text class="m" x="40" y="86">main() : Object {</text>
  <text class="t tag" x="570" y="86" text-anchor="end">① 方法边界</text>

  <!-- let -->
  <rect x="44" y="100" width="520" height="262" rx="10" fill="#FAF9F5" stroke="#B0AEA5"/>
  <text class="m" x="60" y="126">let x : Int &lt;- 0 in</text>
  <text class="t tag" x="550" y="126" text-anchor="end">② let：x 的作用域</text>

  <!-- block -->
  <rect x="64" y="140" width="480" height="206" rx="10" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5"/>
  <text class="m" x="80" y="164">{</text>
  <text class="t tag" x="530" y="164" text-anchor="end">③ 块 = let 的主体</text>

  <!-- while -->
  <rect x="84" y="176" width="440" height="150" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
  <text class="m" x="100" y="200">while x &lt; 3 loop</text>
  <text class="t tag" x="510" y="200" text-anchor="end">④ while … pool</text>

  <!-- loop body block -->
  <rect x="104" y="212" width="400" height="84" rx="8" fill="#F5DDD3" stroke="#D97757"/>
  <text class="m" x="120" y="236">{ out_int(square(x));</text>
  <text class="m" x="120" y="258">  out_string("\n");</text>
  <text class="m" x="120" y="280">  x &lt;- x + 1; }</text>
  <text class="t tag" x="490" y="236" text-anchor="end">⑤ 循环体块</text>

  <text class="m" x="100" y="316">pool;</text>
  <text class="t s" x="152" y="316">← 块内表达式后需要分号</text>
  <text class="m" x="80" y="338">}</text>
  <text class="m" x="40" y="394">};</text>
  <text class="t s" x="70" y="394">← 结束方法定义的分号</text>

  <!-- value flow -->
  <text class="t b" x="614" y="86">值从内层传到外层</text>
  <rect x="614" y="104" width="262" height="40" rx="20" fill="#FFFFFF" stroke="#D97757"/>
  <text class="t c" x="745" y="129" text-anchor="middle">④ while → void（空引用）</text>
  <path class="ln" d="M745,144 V170" marker-end="url(#a)"/>
  <rect x="614" y="174" width="262" height="40" rx="20" fill="#FFFFFF" stroke="#D97757"/>
  <text class="t c" x="745" y="199" text-anchor="middle">③ 块 → 末尾 while 的值</text>
  <path class="ln" d="M745,214 V240" marker-end="url(#a)"/>
  <rect x="614" y="244" width="262" height="40" rx="20" fill="#FFFFFF" stroke="#D97757"/>
  <text class="t c" x="745" y="269" text-anchor="middle">② let → 主体块的值</text>
  <path class="ln" d="M745,284 V310" marker-end="url(#a)"/>
  <rect x="614" y="314" width="262" height="40" rx="20" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5"/>
  <text class="t c" x="745" y="339" text-anchor="middle">① main → 返回 let 的值</text>
  <text class="t s" x="614" y="380">while 的静态类型为 Object，</text>
  <text class="t s" x="614" y="398">与声明的返回类型 Object 兼容。</text>
</svg>
