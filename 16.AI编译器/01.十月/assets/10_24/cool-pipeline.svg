<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="1.cl 在 coolc 中经过词法、语法、语义分析和代码生成，得到 MIPS 汇编 1.s，再由 x86-64 电脑上的 SPIM 模拟执行并产生输出">
  <style>
    .t { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; fill: #141413; }
    .m { font-family: 'JetBrains Mono', 'D2Coding', Consolas, monospace; font-size: 13px; fill: #141413; }
    .h { font-size: 17px; font-weight: 700; }
    .b { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #5E5D59; }
    .tag { font-size: 12px; font-weight: 600; fill: #C15F3C; }
    .ln { stroke: #87867F; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#87867F"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="rgb(245, 244, 237)"/>
  <text class="t h" x="36" y="44">coolc 的内部流程与 SPIM 的职责</text>

  <!-- source -->
  <rect x="24" y="112" width="100" height="56" rx="8" fill="#FFFFFF" stroke="#B0AEA5"/>
  <text class="t b" x="74" y="137" text-anchor="middle">1.cl</text>
  <text class="t s" x="74" y="155" text-anchor="middle">COOL 源码</text>
  <path class="ln" d="M124,140 H166" marker-end="url(#a)"/>

  <!-- coolc panel -->
  <rect x="150" y="66" width="726" height="166" rx="12" fill="#F0EEE6"/>
  <text class="t tag" x="170" y="92">coolc = 参考编译器 · 本学期要亲自实现的目标</text>

  <rect x="170" y="110" width="150" height="60" rx="8" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5"/>
  <text class="t b" x="245" y="136" text-anchor="middle">词法分析</text>
  <text class="t s" x="245" y="156" text-anchor="middle">PA2 · 词法分析器</text>
  <path class="ln" d="M320,140 H344" marker-end="url(#a)"/>

  <rect x="348" y="110" width="150" height="60" rx="8" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5"/>
  <text class="t b" x="423" y="136" text-anchor="middle">语法分析</text>
  <text class="t s" x="423" y="156" text-anchor="middle">PA3 · 语法分析器</text>
  <path class="ln" d="M498,140 H522" marker-end="url(#a)"/>

  <rect x="526" y="110" width="150" height="60" rx="8" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5"/>
  <text class="t b" x="601" y="136" text-anchor="middle">语义分析</text>
  <text class="t s" x="601" y="156" text-anchor="middle">PA4 · 类型检查</text>
  <path class="ln" d="M676,140 H700" marker-end="url(#a)"/>

  <rect x="704" y="110" width="150" height="60" rx="8" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5"/>
  <text class="t b" x="779" y="136" text-anchor="middle">代码生成</text>
  <text class="t s" x="779" y="156" text-anchor="middle">PA5 · 输出 MIPS</text>

  <text class="t s" x="334" y="190" text-anchor="middle">token</text>
  <text class="t s" x="512" y="190" text-anchor="middle">AST</text>
  <text class="t s" x="690" y="190" text-anchor="middle">带类型标注的 AST</text>
  <text class="t s" x="170" y="218">PA1：编写 COOL 程序，作为后续阶段的测试输入。</text>

  <!-- row 2 -->
  <path class="ln" d="M779,170 V266" marker-end="url(#a)"/>
  <rect x="704" y="270" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#B0AEA5"/>
  <text class="t b" x="779" y="294" text-anchor="middle">1.s</text>
  <text class="t s" x="779" y="313" text-anchor="middle">MIPS 汇编文本</text>
  <path class="ln" d="M704,298 H644" marker-end="url(#a)"/>

  <rect x="440" y="270" width="200" height="56" rx="8" fill="#DCE7F2" stroke="#6A9BCC" stroke-width="1.5"/>
  <text class="t b" x="540" y="294" text-anchor="middle">SPIM</text>
  <text class="t s" x="540" y="313" text-anchor="middle">逐条模拟 MIPS 指令</text>
  <path class="ln" d="M440,298 H384" marker-end="url(#a)"/>

  <rect x="230" y="270" width="150" height="56" rx="8" fill="#E3E8D9" stroke="#788C5D" stroke-width="1.5"/>
  <text class="t b" x="305" y="294" text-anchor="middle">程序输出</text>
  <text class="m" x="305" y="314" text-anchor="middle">Hello, COOL!</text>

  <text class="t tag" x="36" y="294">x86-64 PC</text>
  <text class="t s" x="36" y="312">WSL Ubuntu</text>

  <text class="t s" x="36" y="358">1.s 不是 Linux 可执行文件，x86-64 CPU 无法直接执行 MIPS 指令。</text>
  <text class="t s" x="36" y="376">SPIM 用软件模拟 MIPS 的寄存器、内存及指令执行。</text>
</svg>
