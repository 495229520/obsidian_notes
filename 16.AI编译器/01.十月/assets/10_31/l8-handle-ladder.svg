<svg xmlns="http://www.w3.org/2000/svg" width="812" height="432" viewBox="-16 -16 812 432" role="img" aria-label="最右推导与归约的对应：从上到下依次展开最右非终结符，从下到上执行五次归约。橙色句柄在竖线左侧的栈顶结束，右侧只剩终结符。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="812" height="432" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="l8-handle-ladder-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-handle-ladder-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-handle-ladder-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="780" height="400" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">同一推导，沿两个方向阅读</text>
  <text class="muted" x="16" y="47" xml:space="preserve">竖线左侧是栈，右侧是未读输入；橙色标出该行的句柄。</text>
  <text class="muted sm" x="130" y="96.5" text-anchor="end" xml:space="preserve">γ0</text>
  <rect class="blue" x="150.0" y="79.0" width="34" height="26" rx="6"/>
  <text class="mono" x="167.0" y="96.5" text-anchor="middle" xml:space="preserve">E</text>
  <line class="ln-blue" x1="96" y1="102" x2="96" y2="132" marker-end="url(#l8-handle-ladder-blue)"/>
  <line class="ln-acc" x1="470" y1="132" x2="470" y2="102" marker-end="url(#l8-handle-ladder-acc)"/>
  <text class="mono acc-t" x="482" y="121.5" xml:space="preserve">归约 E → T + E</text>
  <text class="muted sm" x="130" y="146.5" text-anchor="end" xml:space="preserve">γ1</text>
  <rect class="acc" x="150.0" y="129.0" width="34" height="26" rx="6"/>
  <text class="mono" x="167.0" y="146.5" text-anchor="middle" xml:space="preserve">T</text>
  <rect class="acc" x="190.0" y="129.0" width="34" height="26" rx="6"/>
  <text class="mono" x="207.0" y="146.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="acc" x="230.0" y="129.0" width="34" height="26" rx="6"/>
  <text class="mono" x="247.0" y="146.5" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="acc" x="270.5" y="125.0" width="3" height="34" rx="1"/>
  <line class="ln-blue" x1="96" y1="152" x2="96" y2="182" marker-end="url(#l8-handle-ladder-blue)"/>
  <line class="ln-acc" x1="470" y1="182" x2="470" y2="152" marker-end="url(#l8-handle-ladder-acc)"/>
  <text class="mono acc-t" x="482" y="171.5" xml:space="preserve">归约 E → T</text>
  <text class="muted sm" x="130" y="196.5" text-anchor="end" xml:space="preserve">γ2</text>
  <rect class="plain" x="150.0" y="179.0" width="34" height="26" rx="6"/>
  <text class="mono" x="167.0" y="196.5" text-anchor="middle" xml:space="preserve">T</text>
  <rect class="plain" x="190.0" y="179.0" width="34" height="26" rx="6"/>
  <text class="mono" x="207.0" y="196.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="acc" x="230.0" y="179.0" width="34" height="26" rx="6"/>
  <text class="mono" x="247.0" y="196.5" text-anchor="middle" xml:space="preserve">T</text>
  <rect class="acc" x="270.5" y="175.0" width="3" height="34" rx="1"/>
  <line class="ln-blue" x1="96" y1="202" x2="96" y2="232" marker-end="url(#l8-handle-ladder-blue)"/>
  <line class="ln-acc" x1="470" y1="232" x2="470" y2="202" marker-end="url(#l8-handle-ladder-acc)"/>
  <text class="mono acc-t" x="482" y="221.5" xml:space="preserve">归约 T → int</text>
  <text class="muted sm" x="130" y="246.5" text-anchor="end" xml:space="preserve">γ3</text>
  <rect class="plain" x="150.0" y="229.0" width="34" height="26" rx="6"/>
  <text class="mono" x="167.0" y="246.5" text-anchor="middle" xml:space="preserve">T</text>
  <rect class="plain" x="190.0" y="229.0" width="34" height="26" rx="6"/>
  <text class="mono" x="207.0" y="246.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="acc" x="230.0" y="229.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="250.625" y="246.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="acc" x="277.75" y="225.0" width="3" height="34" rx="1"/>
  <line class="ln-blue" x1="96" y1="252" x2="96" y2="282" marker-end="url(#l8-handle-ladder-blue)"/>
  <line class="ln-acc" x1="470" y1="282" x2="470" y2="252" marker-end="url(#l8-handle-ladder-acc)"/>
  <text class="mono acc-t" x="482" y="271.5" xml:space="preserve">归约 T → int * T</text>
  <text class="muted sm" x="130" y="296.5" text-anchor="end" xml:space="preserve">γ4</text>
  <rect class="acc" x="150.0" y="279.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="170.625" y="296.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="acc" x="197.25" y="279.0" width="34" height="26" rx="6"/>
  <text class="mono" x="214.25" y="296.5" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="acc" x="237.25" y="279.0" width="34" height="26" rx="6"/>
  <text class="mono" x="254.25" y="296.5" text-anchor="middle" xml:space="preserve">T</text>
  <rect class="acc" x="277.75" y="275.0" width="3" height="34" rx="1"/>
  <rect class="dead" x="289.25" y="279.0" width="34" height="26" rx="6"/>
  <text class="mono" x="306.25" y="296.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="dead" x="329.25" y="279.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="349.875" y="296.5" text-anchor="middle" xml:space="preserve">int</text>
  <line class="ln-blue" x1="96" y1="302" x2="96" y2="332" marker-end="url(#l8-handle-ladder-blue)"/>
  <line class="ln-acc" x1="470" y1="332" x2="470" y2="302" marker-end="url(#l8-handle-ladder-acc)"/>
  <text class="mono acc-t" x="482" y="321.5" xml:space="preserve">归约 T → int</text>
  <text class="muted sm" x="130" y="346.5" text-anchor="end" xml:space="preserve">γ5</text>
  <rect class="plain" x="150.0" y="329.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="170.625" y="346.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="197.25" y="329.0" width="34" height="26" rx="6"/>
  <text class="mono" x="214.25" y="346.5" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="acc" x="237.25" y="329.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="257.875" y="346.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="acc" x="285.0" y="325.0" width="3" height="34" rx="1"/>
  <rect class="dead" x="296.5" y="329.0" width="34" height="26" rx="6"/>
  <text class="mono" x="313.5" y="346.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="dead" x="336.5" y="329.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="357.125" y="346.5" text-anchor="middle" xml:space="preserve">int</text>
  <text class="b blue-t" x="16" y="96.5" xml:space="preserve">正向</text>
  <text class="sm muted" x="16" y="116" xml:space="preserve">最右侧</text>
  <text class="sm muted" x="16" y="131" xml:space="preserve">非终结符展开</text>
  <text class="b acc-t" x="482" y="86" xml:space="preserve">逆向：自下而上</text>
  <text class="muted" x="16" y="388" xml:space="preserve">γ1–γ3 的输入已读完，γ4、γ5 仍剩 + int；竖线右侧始终只有终结符（§3.2）。</text>
</svg>
