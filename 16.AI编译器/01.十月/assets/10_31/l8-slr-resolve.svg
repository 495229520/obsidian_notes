<svg xmlns="http://www.w3.org/2000/svg" width="822" height="362" viewBox="-16 -16 822 362" role="img" aria-label="SLR(1) 用 Follow 集消除两个 LR(0) 冲突：I2 仅在 Follow(E) = { $, ) } 上归约，保留 + 上的移进；I3 仅在 Follow(T) = { $, ), + } 上归约，保留 * 上的移进。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="822" height="362" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="l8-slr-resolve-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-slr-resolve-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-slr-resolve-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="390" height="330" rx="8"/>
  <text class="lg" x="14" y="26" xml:space="preserve">I2（讲义编号 5）：已读 T</text>
  <text class="mono" x="14" y="52" xml:space="preserve">E → T ·</text>
  <text class="sm acc-t" x="150" y="52" xml:space="preserve">完成项：归约候选</text>
  <text class="mono" x="14" y="72" xml:space="preserve">E → T · + E</text>
  <text class="sm blue-t" x="150" y="72" xml:space="preserve">等待 +：移进候选</text>
  <text class="mono b" x="96.0" y="104" text-anchor="middle" xml:space="preserve">int</text>
  <text class="mono b" x="148.0" y="104" text-anchor="middle" xml:space="preserve">*</text>
  <text class="mono b" x="200.0" y="104" text-anchor="middle" xml:space="preserve">+</text>
  <text class="mono b" x="252.0" y="104" text-anchor="middle" xml:space="preserve">(</text>
  <text class="mono b" x="304.0" y="104" text-anchor="middle" xml:space="preserve">)</text>
  <text class="mono b" x="356.0" y="104" text-anchor="middle" xml:space="preserve">$</text>
  <text class="b" x="14" y="146" xml:space="preserve">LR(0)</text>
  <rect class="acc" x="72" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="96.0" y="146" text-anchor="middle" xml:space="preserve">r</text>
