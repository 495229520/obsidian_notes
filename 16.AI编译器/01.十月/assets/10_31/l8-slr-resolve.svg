  <text class="mono sm" x="148.0" y="146" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="bad" x="176" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="200.0" y="136" text-anchor="middle" xml:space="preserve">s→I5</text>
  <text class="mono sm acc-t" x="200.0" y="154" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="acc" x="228" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="252.0" y="146" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="acc" x="280" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="304.0" y="146" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="acc" x="332" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="356.0" y="146" text-anchor="middle" xml:space="preserve">r</text>
  <text class="b" x="14" y="212" xml:space="preserve">SLR(1)</text>
  <rect class="dead" x="72" y="182" width="48" height="50" rx="4"/>
  <rect class="dead" x="124" y="182" width="48" height="50" rx="4"/>
  <rect class="blue" x="176" y="182" width="48" height="50" rx="4"/>
  <text class="mono sm" x="200.0" y="212" text-anchor="middle" xml:space="preserve">s→I5</text>
  <rect class="dead" x="228" y="182" width="48" height="50" rx="4"/>
  <rect class="acc" x="280" y="182" width="48" height="50" rx="4"/>
  <text class="mono sm" x="304.0" y="212" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="acc" x="332" y="182" width="48" height="50" rx="4"/>
  <text class="mono sm" x="356.0" y="212" text-anchor="middle" xml:space="preserve">r</text>
  <text class="mono b" x="14" y="270" xml:space="preserve">Follow(E) = { $, ) }</text>
  <text class="sm" x="14" y="292" xml:space="preserve">r = E → T；仅在 Follow 对应列填归约。</text>
  <text class="sm muted" x="14" y="312" xml:space="preserve">+ 不在 Follow 中，故 + 列只保留移进。</text>
  <rect class="box" x="400" y="0" width="390" height="330" rx="8"/>
  <text class="lg" x="414" y="26" xml:space="preserve">I3（讲义编号 3）：已读 int</text>
  <text class="mono" x="414" y="52" xml:space="preserve">T → int ·</text>
  <text class="sm acc-t" x="550" y="52" xml:space="preserve">完成项：归约候选</text>
  <text class="mono" x="414" y="72" xml:space="preserve">T → int · * T</text>
  <text class="sm blue-t" x="550" y="72" xml:space="preserve">等待 *：移进候选</text>
  <text class="mono b" x="496.0" y="104" text-anchor="middle" xml:space="preserve">int</text>
  <text class="mono b" x="548.0" y="104" text-anchor="middle" xml:space="preserve">*</text>
  <text class="mono b" x="600.0" y="104" text-anchor="middle" xml:space="preserve">+</text>
  <text class="mono b" x="652.0" y="104" text-anchor="middle" xml:space="preserve">(</text>
  <text class="mono b" x="704.0" y="104" text-anchor="middle" xml:space="preserve">)</text>
  <text class="mono b" x="756.0" y="104" text-anchor="middle" xml:space="preserve">$</text>
  <text class="b" x="414" y="146" xml:space="preserve">LR(0)</text>
  <rect class="acc" x="472" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="496.0" y="146" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="bad" x="524" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="548.0" y="136" text-anchor="middle" xml:space="preserve">s→I6</text>
  <text class="mono sm acc-t" x="548.0" y="154" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="acc" x="576" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="600.0" y="146" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="acc" x="628" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="652.0" y="146" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="acc" x="680" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="704.0" y="146" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="acc" x="732" y="116" width="48" height="50" rx="4"/>
  <text class="mono sm" x="756.0" y="146" text-anchor="middle" xml:space="preserve">r</text>
  <text class="b" x="414" y="212" xml:space="preserve">SLR(1)</text>
  <rect class="dead" x="472" y="182" width="48" height="50" rx="4"/>
  <rect class="blue" x="524" y="182" width="48" height="50" rx="4"/>
  <text class="mono sm" x="548.0" y="212" text-anchor="middle" xml:space="preserve">s→I6</text>
  <rect class="acc" x="576" y="182" width="48" height="50" rx="4"/>
  <text class="mono sm" x="600.0" y="212" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="dead" x="628" y="182" width="48" height="50" rx="4"/>
  <rect class="acc" x="680" y="182" width="48" height="50" rx="4"/>
  <text class="mono sm" x="704.0" y="212" text-anchor="middle" xml:space="preserve">r</text>
  <rect class="acc" x="732" y="182" width="48" height="50" rx="4"/>
  <text class="mono sm" x="756.0" y="212" text-anchor="middle" xml:space="preserve">r</text>
  <text class="mono b" x="414" y="270" xml:space="preserve">Follow(T) = { $, ), + }</text>
  <text class="sm" x="414" y="292" xml:space="preserve">r = T → int；仅在 Follow 对应列填归约。</text>
  <text class="sm muted" x="414" y="312" xml:space="preserve">* 不在 Follow 中，故 * 列只保留移进。</text>
</svg>
