<svg xmlns="http://www.w3.org/2000/svg" width="812" height="464" viewBox="-16 -16 812 464" role="img" aria-label="活前缀不能越过句柄右端。右句型 int * int + int 的句柄是第二个 int；空栈、int、int *、int * int 均为活前缀。int * int + 越过句柄，I3 无 + 转移；过早归约得到的 T * 也因 I2 无 * 转移而被拒绝。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="812" height="464" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="l8-viable-boundary-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-viable-boundary-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-viable-boundary-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="780" height="432" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">栈最多增长到句柄的右端</text>
  <rect class="plain" x="150.0" y="57.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="170.625" y="74.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="197.25" y="57.0" width="34" height="26" rx="6"/>
  <text class="mono" x="214.25" y="74.5" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="acc" x="237.25" y="57.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="257.875" y="74.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="dead" x="284.5" y="57.0" width="34" height="26" rx="6"/>
  <text class="mono" x="301.5" y="74.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="dead" x="324.5" y="57.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="345.125" y="74.5" text-anchor="middle" xml:space="preserve">int</text>
  <text class="muted" x="16" y="74.5" xml:space="preserve">右句型</text>
  <polyline class="ln-acc" points="237.25,90 237.25,96 278.5,96 278.5,90"/>
  <text class="acc-t sm" x="257.875" y="113" text-anchor="middle" xml:space="preserve">句柄</text>
  <line class="ln-dash" x1="281.5" y1="50" x2="281.5" y2="400"/>
  <text class="acc-t sm" x="289.5" y="116" xml:space="preserve">句柄右端</text>
  <text class="muted sm" x="150" y="154.5" xml:space="preserve">(空)</text>
  <text class="muted" x="16" y="154.5" xml:space="preserve">栈 1</text>
  <rect class="blue" x="357.0" y="138.0" width="86" height="24" rx="6"/>
  <text class="sm" x="400" y="154.5" text-anchor="middle" xml:space="preserve">活前缀</text>
  <text class="mono sm" x="452" y="148" xml:space="preserve">I0</text>
  <text class="sm muted" x="452" y="164" xml:space="preserve">空栈，处于初始状态</text>
  <rect class="plain" x="150.0" y="182.0" width="41.25" height="24" rx="6"/>
  <text class="mono" x="170.625" y="198.5" text-anchor="middle" xml:space="preserve">int</text>
  <text class="muted" x="16" y="198.5" xml:space="preserve">栈 2</text>
  <rect class="blue" x="357.0" y="182.0" width="86" height="24" rx="6"/>
  <text class="sm" x="400" y="198.5" text-anchor="middle" xml:space="preserve">活前缀</text>
  <text class="mono sm" x="452" y="192" xml:space="preserve">I0 →int I3</text>
  <text class="sm muted" x="452" y="208" xml:space="preserve">句柄的前部</text>
  <rect class="plain" x="150.0" y="226.0" width="41.25" height="24" rx="6"/>
  <text class="mono" x="170.625" y="242.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="197.25" y="226.0" width="34" height="24" rx="6"/>
  <text class="mono" x="214.25" y="242.5" text-anchor="middle" xml:space="preserve">*</text>
  <text class="muted" x="16" y="242.5" xml:space="preserve">栈 3</text>
  <rect class="blue" x="357.0" y="226.0" width="86" height="24" rx="6"/>
  <text class="sm" x="400" y="242.5" text-anchor="middle" xml:space="preserve">活前缀</text>
  <text class="mono sm" x="452" y="236" xml:space="preserve">I3 →* I6</text>
  <text class="sm muted" x="452" y="252" xml:space="preserve">句柄的前部</text>
  <rect class="plain" x="150.0" y="270.0" width="41.25" height="24" rx="6"/>
  <text class="mono" x="170.625" y="286.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="197.25" y="270.0" width="34" height="24" rx="6"/>
  <text class="mono" x="214.25" y="286.5" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="plain" x="237.25" y="270.0" width="41.25" height="24" rx="6"/>
  <text class="mono" x="257.875" y="286.5" text-anchor="middle" xml:space="preserve">int</text>
  <text class="muted" x="16" y="286.5" xml:space="preserve">栈 4</text>
  <rect class="blue" x="357.0" y="270.0" width="86" height="24" rx="6"/>
  <text class="sm" x="400" y="286.5" text-anchor="middle" xml:space="preserve">活前缀</text>
  <text class="mono sm" x="452" y="280" xml:space="preserve">I6 →int I3</text>
  <text class="sm muted" x="452" y="296" xml:space="preserve">句柄在栈顶完成，应在此归约</text>
  <rect class="plain" x="150.0" y="314.0" width="41.25" height="24" rx="6"/>
  <text class="mono" x="170.625" y="330.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="197.25" y="314.0" width="34" height="24" rx="6"/>
  <text class="mono" x="214.25" y="330.5" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="plain" x="237.25" y="314.0" width="41.25" height="24" rx="6"/>
  <text class="mono" x="257.875" y="330.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="284.5" y="314.0" width="34" height="24" rx="6"/>
  <text class="mono" x="301.5" y="330.5" text-anchor="middle" xml:space="preserve">+</text>
  <text class="muted" x="16" y="330.5" xml:space="preserve">栈 5</text>
  <rect class="bad" x="357.0" y="314.0" width="86" height="24" rx="6"/>
  <text class="sm" x="400" y="330.5" text-anchor="middle" xml:space="preserve">非活前缀</text>
  <text class="mono sm" x="452" y="324" xml:space="preserve">I3 没有 + 转移</text>
  <text class="sm acc-t" x="452" y="340" xml:space="preserve">越过句柄，埋在栈内的 int 无法归约</text>
  <rect class="blue" x="150.0" y="358.0" width="34" height="24" rx="6"/>
  <text class="mono" x="167.0" y="374.5" text-anchor="middle" xml:space="preserve">T</text>
  <rect class="plain" x="190.0" y="358.0" width="34" height="24" rx="6"/>
  <text class="mono" x="207.0" y="374.5" text-anchor="middle" xml:space="preserve">*</text>
  <text class="muted" x="16" y="374.5" xml:space="preserve">栈 6</text>
  <rect class="bad" x="357.0" y="358.0" width="86" height="24" rx="6"/>
  <text class="sm" x="400" y="374.5" text-anchor="middle" xml:space="preserve">非活前缀</text>
  <text class="mono sm" x="452" y="368" xml:space="preserve">I0 →T I2，无 * 转移</text>
  <text class="sm acc-t" x="452" y="384" xml:space="preserve">第一个 int 归约过早</text>
  <text class="muted sm" x="16" y="422" xml:space="preserve">DFA 状态编号沿用 §18.5 的 I0–I10；路径能读完整个栈，该栈就是活前缀。</text>
</svg>
