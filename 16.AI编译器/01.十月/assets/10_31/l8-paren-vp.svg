<svg xmlns="http://www.w3.org/2000/svg" width="812" height="362" viewBox="-16 -16 812 362" role="img" aria-label="S → ( S ) | ε 的活前缀 DFA，共五个状态。读取左括号后回到 P2，DFA 不记录嵌套深度，深度由栈中的左括号记录。活前缀有图中正则表达式所示的三种形式。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="812" height="362" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="l8-paren-vp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-paren-vp-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-paren-vp-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="470" height="330" rx="8"/>
  <rect class="box" x="490" y="0" width="290" height="330" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">活前缀 DFA：S → ( S ) | ε</text>
  <rect class="box" x="16" y="52" width="128" height="73" rx="7"/>
  <text class="b sm" x="24" y="67" xml:space="preserve">P0</text>
  <text class="mono sm" x="24" y="84" xml:space="preserve">S' → · S</text>
  <text class="mono sm" x="24" y="101" xml:space="preserve">S → · ( S )</text>
  <text class="mono sm" x="24" y="118" xml:space="preserve">S → ·</text>
  <rect class="blue" x="210" y="52" width="128" height="73" rx="7"/>
  <text class="b sm" x="218" y="67" xml:space="preserve">P2</text>
  <text class="mono sm" x="218" y="84" xml:space="preserve">S → ( · S )</text>
  <text class="mono sm" x="218" y="101" xml:space="preserve">S → · ( S )</text>
  <text class="mono sm" x="218" y="118" xml:space="preserve">S → ·</text>
  <rect class="box" x="16" y="210" width="128" height="39" rx="7"/>
  <text class="b sm" x="24" y="225" xml:space="preserve">P1</text>
  <text class="mono sm" x="24" y="242" xml:space="preserve">S' → S ·</text>
  <rect class="box" x="210" y="210" width="128" height="39" rx="7"/>
  <text class="b sm" x="218" y="225" xml:space="preserve">P3</text>
  <text class="mono sm" x="218" y="242" xml:space="preserve">S → ( S · )</text>
  <rect class="box" x="210" y="280" width="128" height="39" rx="7"/>
  <text class="b sm" x="218" y="295" xml:space="preserve">P4</text>
  <text class="mono sm" x="218" y="312" xml:space="preserve">S → ( S ) ·</text>
  <line class="ln" x1="144" y1="90" x2="208" y2="90" marker-end="url(#l8-paren-vp-a)"/>
  <text class="mono" x="176" y="84" text-anchor="middle" xml:space="preserve">(</text>
  <line class="ln" x1="80" y1="125" x2="80" y2="208" marker-end="url(#l8-paren-vp-a)"/>
  <text class="mono" x="88" y="172" xml:space="preserve">S</text>
  <line class="ln" x1="274" y1="125" x2="274" y2="208" marker-end="url(#l8-paren-vp-a)"/>
  <text class="mono" x="282" y="172" xml:space="preserve">S</text>
  <line class="ln" x1="274" y1="249" x2="274" y2="278" marker-end="url(#l8-paren-vp-a)"/>
  <text class="mono" x="282" y="268" xml:space="preserve">)</text>
  <path class="ln-blue" d="M320.0,52.0 Q372.0,22.0 338.0,72.0" marker-end="url(#l8-paren-vp-blue)"/>
  <text class="mono blue-t" x="372" y="40" xml:space="preserve">(</text>
  <text class="sm muted" x="352" y="104" xml:space="preserve">无论第几个 (</text>
  <text class="sm muted" x="352" y="120" xml:space="preserve">均回到同一状态</text>
  <text class="sm muted" x="356" y="225" xml:space="preserve">含完成项的状态</text>
  <text class="sm muted" x="356" y="241" xml:space="preserve">P0, P2, P4</text>
  <text class="sm muted" x="356" y="257" xml:space="preserve">(S → · 也是完成项)</text>
  <text class="lg" x="506" y="26" xml:space="preserve">嵌套深度由栈记录</text>
  <rect class="plain" x="506.0" y="54.0" width="34" height="24" rx="6"/>
  <text class="mono" x="523" y="70.5" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="plain" x="546.0" y="54.0" width="34" height="24" rx="6"/>
  <text class="mono" x="563" y="70.5" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="plain" x="586.0" y="54.0" width="34" height="24" rx="6"/>
  <text class="mono" x="603" y="70.5" text-anchor="middle" xml:space="preserve">(</text>
  <text class="mono" x="674" y="70.5" xml:space="preserve">→ P2</text>
  <rect class="plain" x="506.0" y="98.0" width="34" height="24" rx="6"/>
  <text class="mono" x="523" y="114.5" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="plain" x="546.0" y="98.0" width="34" height="24" rx="6"/>
  <text class="mono" x="563" y="114.5" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="blue" x="586.0" y="98.0" width="34" height="24" rx="6"/>
  <text class="mono" x="603" y="114.5" text-anchor="middle" xml:space="preserve">S</text>
  <text class="mono" x="674" y="114.5" xml:space="preserve">→ P3</text>
  <rect class="plain" x="506.0" y="142.0" width="34" height="24" rx="6"/>
  <text class="mono" x="523" y="158.5" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="plain" x="546.0" y="142.0" width="34" height="24" rx="6"/>
  <text class="mono" x="563" y="158.5" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="blue" x="586.0" y="142.0" width="34" height="24" rx="6"/>
  <text class="mono" x="603" y="158.5" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="plain" x="626.0" y="142.0" width="34" height="24" rx="6"/>
  <text class="mono" x="643" y="158.5" text-anchor="middle" xml:space="preserve">)</text>
  <text class="mono" x="674" y="158.5" xml:space="preserve">→ P4</text>
  <text class="muted sm" x="506" y="206" xml:space="preserve">无论有 3 个还是 100 个 (，DFA 均在 P2。</text>
  <text class="muted sm" x="506" y="224" xml:space="preserve">归约生成 S 时需弹出的 (</text>
  <text class="muted sm" x="506" y="242" xml:space="preserve">由栈记录并提供。</text>
  <text class="b" x="506" y="276" xml:space="preserve">活前缀的正则表达式</text>
  <text class="mono acc-t" x="506" y="298" xml:space="preserve">(*  |  (*S  |  (+S)</text>
  <text class="muted sm" x="506" y="318" xml:space="preserve">原图枚举核对：长度 ≤ 8，共 23 个</text>
</svg>
