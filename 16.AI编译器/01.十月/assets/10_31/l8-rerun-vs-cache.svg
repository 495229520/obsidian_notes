    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
