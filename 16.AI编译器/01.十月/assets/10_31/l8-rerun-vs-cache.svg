  <text class="b" x="0" y="324" xml:space="preserve">int * int * … * int（1,999 个 token）：3,001 次动作；重跑需 2,999,001 次 DFA 转移。</text>
  <text class="muted sm" x="0" y="344" xml:space="preserve">同一输入下，对栈每次移进或归约只查一次 GOTO；计数来自原图的 Python 驱动程序。</text>
