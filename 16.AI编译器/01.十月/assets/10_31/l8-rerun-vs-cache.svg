<svg xmlns="http://www.w3.org/2000/svg" width="822" height="384" viewBox="-16 -16 822 384" role="img" aria-label="朴素 SLR 算法每次从栈底重跑 DFA，开销与栈长成正比；符号-状态对栈保存每个位置的 DFA 状态，只读取栈顶。原图统计：1,999 个 token 的乘法链有 3,001 次动作，重跑需 2,999,001 次 DFA 转移。">
