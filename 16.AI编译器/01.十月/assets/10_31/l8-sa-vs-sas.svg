<svg xmlns="http://www.w3.org/2000/svg" width="822" height="362" viewBox="-16 -16 822 362" role="img" aria-label="两个文法的 LR(0) DFA 对照。S → S a | b 有四个状态，接受与移进分别发生于 $ 和 a，无冲突；S → S a S | b 有五个状态，完成项与移进项共存时，a 属于 Follow(S)，产生移进-归约冲突。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="822" height="362" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="l8-sa-vs-sas-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-sa-vs-sas-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-sa-vs-sas-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="385" height="330" rx="8"/>
  <rect class="box" x="405" y="0" width="385" height="330" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">例 A：S → S a | b</text>
  <rect class="box" x="16" y="46" width="150" height="66" rx="6"/>
  <text class="sm b" x="22" y="60" xml:space="preserve">A0</text>
  <text class="mono sm" x="46" y="60" xml:space="preserve">S' → · S</text>
  <text class="mono sm" x="46" y="76" xml:space="preserve">S → · S a</text>
  <text class="mono sm" x="46" y="92" xml:space="preserve">S → · b</text>
  <rect class="box" x="216" y="46" width="150" height="34" rx="6"/>
  <text class="sm b" x="222" y="60" xml:space="preserve">A2</text>
  <text class="mono sm" x="246" y="60" xml:space="preserve">S → b ·</text>
  <rect class="blue" x="16" y="150" width="150" height="50" rx="6"/>
  <text class="sm b" x="22" y="164" xml:space="preserve">A1</text>
  <text class="mono sm" x="46" y="164" xml:space="preserve">S' → S ·</text>
  <text class="mono sm" x="46" y="180" xml:space="preserve">S → S · a</text>
  <rect class="box" x="216" y="150" width="150" height="34" rx="6"/>
  <text class="sm b" x="222" y="164" xml:space="preserve">A3</text>
  <text class="mono sm" x="246" y="164" xml:space="preserve">S → S a ·</text>
  <line class="ln" x1="166" y1="60" x2="214" y2="60" marker-end="url(#l8-sa-vs-sas-a)"/>
  <text class="mono sm" x="190" y="54" text-anchor="middle" xml:space="preserve">b</text>
  <line class="ln" x1="60" y1="98" x2="60" y2="148" marker-end="url(#l8-sa-vs-sas-a)"/>
  <text class="mono sm" x="68" y="128" xml:space="preserve">S</text>
  <line class="ln" x1="166" y1="164" x2="214" y2="164" marker-end="url(#l8-sa-vs-sas-a)"/>
  <text class="mono sm" x="190" y="158" text-anchor="middle" xml:space="preserve">a</text>
  <text class="mono" x="16" y="230" xml:space="preserve">A1：$ → 接受，a → 移进</text>
  <text class="mono sm blue-t" x="16" y="252" xml:space="preserve">Follow(S') ∩ { a } = { $ } ∩ { a } = ∅</text>
  <text class="b blue-t" x="16" y="280" xml:space="preserve">无冲突：属于 SLR(1)</text>
  <text class="sm muted" x="16" y="302" xml:space="preserve">语言为 b a*；左递归使栈保持较浅。</text>
  <text class="lg" x="421" y="26" xml:space="preserve">例 B：S → S a S | b</text>
  <rect class="box" x="421" y="46" width="150" height="66" rx="6"/>
  <text class="sm b" x="427" y="60" xml:space="preserve">B0</text>
  <text class="mono sm" x="451" y="60" xml:space="preserve">S' → · S</text>
  <text class="mono sm" x="451" y="76" xml:space="preserve">S → · S a S</text>
  <text class="mono sm" x="451" y="92" xml:space="preserve">S → · b</text>
  <rect class="box" x="621" y="46" width="150" height="50" rx="6"/>
  <text class="sm b" x="627" y="60" xml:space="preserve">B1</text>
  <text class="mono sm" x="651" y="60" xml:space="preserve">S' → S ·</text>
  <text class="mono sm" x="651" y="76" xml:space="preserve">S → S · a S</text>
  <rect class="box" x="621" y="116" width="150" height="66" rx="6"/>
  <text class="sm b" x="627" y="130" xml:space="preserve">B3</text>
  <text class="mono sm" x="651" y="130" xml:space="preserve">S → S a · S</text>
  <text class="mono sm" x="651" y="146" xml:space="preserve">S → · S a S</text>
  <text class="mono sm" x="651" y="162" xml:space="preserve">S → · b</text>
  <rect class="acc" x="421" y="150" width="150" height="50" rx="6"/>
  <text class="sm b" x="427" y="164" xml:space="preserve">B4</text>
  <text class="mono sm" x="451" y="164" xml:space="preserve">S → S a S ·</text>
  <text class="mono sm" x="451" y="180" xml:space="preserve">S → S · a S</text>
  <line class="ln" x1="571" y1="60" x2="619" y2="60" marker-end="url(#l8-sa-vs-sas-a)"/>
  <text class="mono sm" x="595" y="54" text-anchor="middle" xml:space="preserve">S</text>
  <line class="ln" x1="696" y1="98" x2="696" y2="114" marker-end="url(#l8-sa-vs-sas-a)"/>
  <text class="mono sm" x="703" y="110" xml:space="preserve">a</text>
  <line class="ln" x1="619" y1="150" x2="573" y2="165" marker-end="url(#l8-sa-vs-sas-a)"/>
  <text class="mono sm" x="597" y="150" text-anchor="middle" xml:space="preserve">S</text>
  <path class="ln-acc" d="M521.0,200.0 Q611.0,222.0 661.0,182.0" marker-end="url(#l8-sa-vs-sas-acc)"/>
  <text class="mono sm acc-t" x="617" y="222" xml:space="preserve">a</text>
  <text class="sm muted" x="421" y="238" xml:space="preserve">图中省略 B2 = { S → b · }。</text>
  <text class="mono sm" x="421" y="258" xml:space="preserve">B4 遇 a：移进到 B3 / 按 S → S a S 归约</text>
  <text class="mono sm acc-t" x="421" y="278" xml:space="preserve">Follow(S) ∩ { a } = { $, a } ∩ { a } = { a }</text>
  <text class="b acc-t" x="421" y="302" xml:space="preserve">存在冲突：不属于 SLR(1)。</text>
  <text class="sm acc-t" x="421" y="320" xml:space="preserve">归约得到左结合，移进得到右结合。</text>
</svg>
