<svg xmlns="http://www.w3.org/2000/svg" width="822" height="392" viewBox="-16 -16 822 392" role="img" aria-label="归约 E → T + E 时，弹出三个栈项，执行 $$ = Add($1, $3)，再查 GOTO[1, E] = 2，压入状态 2 与新 AST 值 Add(Num 2, Num 3)。虚线符号栏不参与语法决策。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="822" height="392" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="l8-semantic-stack-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-semantic-stack-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-semantic-stack-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="790" height="360" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">状态控制语法，值承载语义：int + int 的最后一次归约</text>
  <text class="b" x="16" y="54" xml:space="preserve">归约前</text>
  <text class="sm muted" x="46" y="74" text-anchor="middle" xml:space="preserve">状态</text>
  <text class="sm muted" x="110" y="74" text-anchor="middle" xml:space="preserve">符号</text>
  <text class="sm muted" x="200" y="74" text-anchor="middle" xml:space="preserve">值</text>
  <rect class="acc" x="16" y="86" width="60" height="30" rx="5"/>
  <text class="mono b" x="46" y="106" text-anchor="middle" xml:space="preserve">7</text>
  <rect x="82" y="86" width="56" height="30" rx="5" style="fill:#E6E3D9;stroke:#6F6D66;stroke-width:1.2;stroke-dasharray:4 3"/>
  <text class="mono muted" x="110" y="106" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="acc" x="144" y="86" width="112" height="30" rx="5"/>
  <text class="mono sm" x="200" y="106" text-anchor="middle" xml:space="preserve">Num 3</text>
  <rect class="acc" x="16" y="124" width="60" height="30" rx="5"/>
  <text class="mono b" x="46" y="144" text-anchor="middle" xml:space="preserve">6</text>
  <rect x="82" y="124" width="56" height="30" rx="5" style="fill:#E6E3D9;stroke:#6F6D66;stroke-width:1.2;stroke-dasharray:4 3"/>
  <text class="mono muted" x="110" y="144" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="acc" x="144" y="124" width="112" height="30" rx="5"/>
  <text class="mono sm" x="200" y="144" text-anchor="middle" xml:space="preserve">—</text>
  <rect class="acc" x="16" y="162" width="60" height="30" rx="5"/>
  <text class="mono b" x="46" y="182" text-anchor="middle" xml:space="preserve">5</text>
  <rect x="82" y="162" width="56" height="30" rx="5" style="fill:#E6E3D9;stroke:#6F6D66;stroke-width:1.2;stroke-dasharray:4 3"/>
  <text class="mono muted" x="110" y="182" text-anchor="middle" xml:space="preserve">T</text>
  <rect class="acc" x="144" y="162" width="112" height="30" rx="5"/>
  <text class="mono sm" x="200" y="182" text-anchor="middle" xml:space="preserve">Num 2</text>
  <rect class="blue" x="16" y="200" width="60" height="30" rx="5"/>
  <text class="mono b" x="46" y="220" text-anchor="middle" xml:space="preserve">1</text>
  <rect x="82" y="200" width="56" height="30" rx="5" style="fill:#E6E3D9;stroke:#6F6D66;stroke-width:1.2;stroke-dasharray:4 3"/>
  <text class="mono muted" x="110" y="220" text-anchor="middle" xml:space="preserve">⊥</text>
  <rect class="box" x="144" y="200" width="112" height="30" rx="5"/>
  <text class="mono sm" x="200" y="220" text-anchor="middle" xml:space="preserve">—</text>
  <text class="b" x="540" y="54" xml:space="preserve">归约后</text>
  <text class="sm muted" x="570" y="74" text-anchor="middle" xml:space="preserve">状态</text>
  <text class="sm muted" x="634" y="74" text-anchor="middle" xml:space="preserve">符号</text>
  <text class="sm muted" x="724" y="74" text-anchor="middle" xml:space="preserve">值</text>
  <rect class="blue" x="540" y="86" width="60" height="30" rx="5"/>
  <text class="mono b" x="570" y="106" text-anchor="middle" xml:space="preserve">2</text>
  <rect x="606" y="86" width="56" height="30" rx="5" style="fill:#E6E3D9;stroke:#6F6D66;stroke-width:1.2;stroke-dasharray:4 3"/>
  <text class="mono muted" x="634" y="106" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="668" y="86" width="112" height="30" rx="5"/>
  <text class="mono sm" x="724" y="106" text-anchor="middle" xml:space="preserve">Add(…)</text>
  <rect class="blue" x="540" y="124" width="60" height="30" rx="5"/>
  <text class="mono b" x="570" y="144" text-anchor="middle" xml:space="preserve">1</text>
  <rect x="606" y="124" width="56" height="30" rx="5" style="fill:#E6E3D9;stroke:#6F6D66;stroke-width:1.2;stroke-dasharray:4 3"/>
  <text class="mono muted" x="634" y="144" text-anchor="middle" xml:space="preserve">⊥</text>
  <rect class="box" x="668" y="124" width="112" height="30" rx="5"/>
  <text class="mono sm" x="724" y="144" text-anchor="middle" xml:space="preserve">—</text>
  <text class="mono b" x="272" y="70" xml:space="preserve">E : T '+' E</text>
  <text class="mono acc-t" x="272" y="92" xml:space="preserve">{ $$ = Add($1, $3); }</text>
  <text class="sm" x="272" y="122" xml:space="preserve">1. 按右部长度弹出 3 项</text>
  <text class="sm" x="272" y="142" xml:space="preserve">2. $1 = Num 2, $3 = Num 3</text>
  <text class="sm" x="272" y="162" xml:space="preserve">3. 语义动作创建新节点</text>
  <text class="sm" x="272" y="182" xml:space="preserve">4. 露出状态 1，查 GOTO[1, E] = 2</text>
  <text class="sm" x="272" y="202" xml:space="preserve">5. 压入 ⟨2, E, Add⟩</text>
  <line class="ln-acc" x1="448" y1="88" x2="532" y2="88" marker-end="url(#l8-semantic-stack-acc)"/>
  <rect class="acc" x="632.0" y="209.0" width="56" height="26" rx="6"/>
  <text class="mono" x="660" y="226.5" text-anchor="middle" xml:space="preserve">Add</text>
  <rect class="plain" x="580.0" y="265.0" width="64" height="26" rx="6"/>
  <text class="mono" x="612" y="282.5" text-anchor="middle" xml:space="preserve">Num 2</text>
  <rect class="plain" x="676.0" y="265.0" width="64" height="26" rx="6"/>
  <text class="mono" x="708" y="282.5" text-anchor="middle" xml:space="preserve">Num 3</text>
  <line class="ln" x1="650" y1="235" x2="618" y2="265"/>
  <line class="ln" x1="670" y1="235" x2="702" y2="265"/>
  <text class="sm muted" x="560" y="330" xml:space="preserve">Add(…) 指向的 AST</text>
  <text class="sm muted" x="16" y="316" xml:space="preserve">虚线符号栏：语法决策只需状态和下一 token（幻灯片 129）。</text>
  <text class="sm muted" x="16" y="336" xml:space="preserve">Bison 并列维护状态栈 yyss 与值栈 yyvs；图中 + 等无语义值的 token 留空。</text>
</svg>
