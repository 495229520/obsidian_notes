  <text class="sm" x="772.0" y="406.5" text-anchor="middle" xml:space="preserve">接受</text>
  <text class="muted" x="16" y="448" xml:space="preserve">橙色对是归约时弹出的右部（句柄），始终位于栈顶；蓝色小格记录读到该位置时的 DFA 状态。</text>
  <text class="mono sm muted" x="16" y="466" xml:space="preserve">规则编号：r1 E→T+E，r2 E→T，r3 T→int*T，r4 T→int，r5 T→(E)</text>
</svg>
