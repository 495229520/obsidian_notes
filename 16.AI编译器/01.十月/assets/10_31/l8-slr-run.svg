<svg xmlns="http://www.w3.org/2000/svg" width="912" height="502" viewBox="-16 -16 912 502" role="img" aria-label="int * int $ 的七步分析，状态编号沿用讲义 1–11。依次移进 int、*、int，归约 T → int、T → int * T、E → T，最后接受。归约后 GOTO 依次得到状态 4、5、2。">
  <style>
