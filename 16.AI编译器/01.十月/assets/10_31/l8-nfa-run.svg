<svg xmlns="http://www.w3.org/2000/svg" width="892" height="552" viewBox="-16 -16 892 552" role="img" aria-label="活前缀 NFA 的 18 个项及读取栈 ( int * 的路径。各列对应产生式，圆点从上往下逐项右移；点后为非终结符时，向其全部起始项作 ε 转移。橙色路径为 1、7、15、16、7、9、10、11；下方状态集合依次对应 DFA 的 I0、I4、I3、I6。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="892" height="552" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="l8-nfa-run-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-nfa-run-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-nfa-run-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="860" height="520" rx="8"/>
  <text class="lg" x="16" y="24" xml:space="preserve">NFA：项就是状态，从栈底读取 ( int *</text>
  <text class="mono sm muted" x="74" y="62" text-anchor="middle" xml:space="preserve">S' → E</text>
  <rect class="acc" x="10.0" y="78" width="128" height="28" rx="6"/>
  <text class="sm muted" x="16.0" y="96.5" xml:space="preserve">1</text>
  <text class="mono sm" x="82" y="96.5" text-anchor="middle" xml:space="preserve">S' → · E</text>
  <line class="ln" x1="74" y1="106" x2="74" y2="137" marker-end="url(#l8-nfa-run-a)"/>
  <text class="mono sm" x="80" y="126.0" xml:space="preserve">E</text>
  <rect class="box" x="10.0" y="138" width="128" height="28" rx="6"/>
  <text class="sm muted" x="16.0" y="156.5" xml:space="preserve">2</text>
  <text class="mono sm" x="82" y="156.5" text-anchor="middle" xml:space="preserve">S' → E ·</text>
  <text class="mono sm muted" x="216" y="62" text-anchor="middle" xml:space="preserve">E → T + E</text>
  <rect class="box" x="152.0" y="78" width="128" height="28" rx="6"/>
  <text class="sm muted" x="158.0" y="96.5" xml:space="preserve">3</text>
  <text class="mono sm" x="224" y="96.5" text-anchor="middle" xml:space="preserve">E → · T + E</text>
  <line class="ln" x1="216" y1="106" x2="216" y2="137" marker-end="url(#l8-nfa-run-a)"/>
  <text class="mono sm" x="222" y="126.0" xml:space="preserve">T</text>
  <rect class="box" x="152.0" y="138" width="128" height="28" rx="6"/>
  <text class="sm muted" x="158.0" y="156.5" xml:space="preserve">4</text>
  <text class="mono sm" x="224" y="156.5" text-anchor="middle" xml:space="preserve">E → T · + E</text>
  <line class="ln" x1="216" y1="166" x2="216" y2="197" marker-end="url(#l8-nfa-run-a)"/>
  <text class="mono sm" x="222" y="186.0" xml:space="preserve">+</text>
  <rect class="box" x="152.0" y="198" width="128" height="28" rx="6"/>
  <text class="sm muted" x="158.0" y="216.5" xml:space="preserve">5</text>
  <text class="mono sm" x="224" y="216.5" text-anchor="middle" xml:space="preserve">E → T + · E</text>
  <line class="ln" x1="216" y1="226" x2="216" y2="257" marker-end="url(#l8-nfa-run-a)"/>
  <text class="mono sm" x="222" y="246.0" xml:space="preserve">E</text>
  <rect class="box" x="152.0" y="258" width="128" height="28" rx="6"/>
  <text class="sm muted" x="158.0" y="276.5" xml:space="preserve">6</text>
  <text class="mono sm" x="224" y="276.5" text-anchor="middle" xml:space="preserve">E → T + E ·</text>
  <text class="mono sm muted" x="358" y="62" text-anchor="middle" xml:space="preserve">E → T</text>
  <rect class="acc" x="294.0" y="78" width="128" height="28" rx="6"/>
  <text class="sm muted" x="300.0" y="96.5" xml:space="preserve">7</text>
  <text class="mono sm" x="366" y="96.5" text-anchor="middle" xml:space="preserve">E → · T</text>
  <line class="ln" x1="358" y1="106" x2="358" y2="137" marker-end="url(#l8-nfa-run-a)"/>
  <text class="mono sm" x="364" y="126.0" xml:space="preserve">T</text>
  <rect class="box" x="294.0" y="138" width="128" height="28" rx="6"/>
  <text class="sm muted" x="300.0" y="156.5" xml:space="preserve">8</text>
  <text class="mono sm" x="366" y="156.5" text-anchor="middle" xml:space="preserve">E → T ·</text>
  <text class="mono sm muted" x="500" y="62" text-anchor="middle" xml:space="preserve">T → int * T</text>
  <rect class="acc" x="436.0" y="78" width="128" height="28" rx="6"/>
  <text class="sm muted" x="442.0" y="96.5" xml:space="preserve">9</text>
  <text class="mono sm" x="508" y="96.5" text-anchor="middle" xml:space="preserve">T → · int * T</text>
  <line class="ln-acc" x1="500" y1="106" x2="500" y2="137" marker-end="url(#l8-nfa-run-acc)"/>
  <text class="mono sm acc-t" x="506" y="126.0" xml:space="preserve">int</text>
  <rect class="acc" x="436.0" y="138" width="128" height="28" rx="6"/>
  <text class="sm muted" x="442.0" y="156.5" xml:space="preserve">10</text>
  <text class="mono sm" x="508" y="156.5" text-anchor="middle" xml:space="preserve">T → int · * T</text>
  <line class="ln-acc" x1="500" y1="166" x2="500" y2="197" marker-end="url(#l8-nfa-run-acc)"/>
  <text class="mono sm acc-t" x="506" y="186.0" xml:space="preserve">*</text>
  <rect class="acc" x="436.0" y="198" width="128" height="28" rx="6"/>
  <text class="sm muted" x="442.0" y="216.5" xml:space="preserve">11</text>
  <text class="mono sm" x="508" y="216.5" text-anchor="middle" xml:space="preserve">T → int * · T</text>
  <line class="ln" x1="500" y1="226" x2="500" y2="257" marker-end="url(#l8-nfa-run-a)"/>
  <text class="mono sm" x="506" y="246.0" xml:space="preserve">T</text>
  <rect class="box" x="436.0" y="258" width="128" height="28" rx="6"/>
  <text class="sm muted" x="442.0" y="276.5" xml:space="preserve">12</text>
  <text class="mono sm" x="508" y="276.5" text-anchor="middle" xml:space="preserve">T → int * T ·</text>
  <text class="mono sm muted" x="642" y="62" text-anchor="middle" xml:space="preserve">T → int</text>
  <rect class="box" x="578.0" y="78" width="128" height="28" rx="6"/>
  <text class="sm muted" x="584.0" y="96.5" xml:space="preserve">13</text>
  <text class="mono sm" x="650" y="96.5" text-anchor="middle" xml:space="preserve">T → · int</text>
  <line class="ln" x1="642" y1="106" x2="642" y2="137" marker-end="url(#l8-nfa-run-a)"/>
  <text class="mono sm" x="648" y="126.0" xml:space="preserve">int</text>
  <rect class="box" x="578.0" y="138" width="128" height="28" rx="6"/>
  <text class="sm muted" x="584.0" y="156.5" xml:space="preserve">14</text>
  <text class="mono sm" x="650" y="156.5" text-anchor="middle" xml:space="preserve">T → int ·</text>
  <text class="mono sm muted" x="784" y="62" text-anchor="middle" xml:space="preserve">T → ( E )</text>
  <rect class="acc" x="720.0" y="78" width="128" height="28" rx="6"/>
  <text class="sm muted" x="726.0" y="96.5" xml:space="preserve">15</text>
  <text class="mono sm" x="792" y="96.5" text-anchor="middle" xml:space="preserve">T → · ( E )</text>
  <line class="ln-acc" x1="784" y1="106" x2="784" y2="137" marker-end="url(#l8-nfa-run-acc)"/>
  <text class="mono sm acc-t" x="790" y="126.0" xml:space="preserve">(</text>
  <rect class="acc" x="720.0" y="138" width="128" height="28" rx="6"/>
  <text class="sm muted" x="726.0" y="156.5" xml:space="preserve">16</text>
  <text class="mono sm" x="792" y="156.5" text-anchor="middle" xml:space="preserve">T → ( · E )</text>
  <line class="ln" x1="784" y1="166" x2="784" y2="197" marker-end="url(#l8-nfa-run-a)"/>
  <text class="mono sm" x="790" y="186.0" xml:space="preserve">E</text>
  <rect class="box" x="720.0" y="198" width="128" height="28" rx="6"/>
  <text class="sm muted" x="726.0" y="216.5" xml:space="preserve">17</text>
  <text class="mono sm" x="792" y="216.5" text-anchor="middle" xml:space="preserve">T → ( E · )</text>
  <line class="ln" x1="784" y1="226" x2="784" y2="257" marker-end="url(#l8-nfa-run-a)"/>
  <text class="mono sm" x="790" y="246.0" xml:space="preserve">)</text>
  <rect class="box" x="720.0" y="258" width="128" height="28" rx="6"/>
  <text class="sm muted" x="726.0" y="276.5" xml:space="preserve">18</text>
  <text class="mono sm" x="792" y="276.5" text-anchor="middle" xml:space="preserve">T → ( E ) ·</text>
  <text class="sm blue-t" x="136.0" y="75" text-anchor="end" xml:space="preserve">ε→E 起始项</text>
  <text class="sm blue-t" x="278.0" y="195" text-anchor="end" xml:space="preserve">ε→E 起始项</text>
  <text class="sm blue-t" x="846.0" y="135" text-anchor="end" xml:space="preserve">ε→E 起始项</text>
  <text class="sm blue-t" x="278.0" y="75" text-anchor="end" xml:space="preserve">ε→T 起始项</text>
  <text class="sm blue-t" x="420.0" y="75" text-anchor="end" xml:space="preserve">ε→T 起始项</text>
  <text class="sm blue-t" x="562.0" y="195" text-anchor="end" xml:space="preserve">ε→T 起始项</text>
  <polyline class="ln-blue" points="152.0,50 152.0,46 422.0,46 422.0,50"/>
  <polyline class="ln-blue" points="436.0,50 436.0,46 848.0,46 848.0,50"/>
  <text class="sm blue-t" x="287.0" y="41" text-anchor="middle" xml:space="preserve">E 的起始项</text>
  <text class="sm blue-t" x="642" y="41" text-anchor="middle" xml:space="preserve">T 的起始项</text>
  <text class="blue-t sm" x="16" y="316" xml:space="preserve">蓝色 ε→X：点后为非终结符 X 时，向 X 的全部起始项作 ε 转移，共 15 条。</text>
  <text class="acc-t sm" x="16" y="336" xml:space="preserve">橙色路径：1 →ε 7 →ε 15 →( 16 →ε 7 →ε 9 →int 10 →* 11；两次经过 7。竖向符号转移共 12 条。</text>
  <line class="ln-muted" x1="16" y1="352" x2="844" y2="352"/>
  <text class="b" x="16" y="376" xml:space="preserve">用状态集合跟踪同一输入（子集构造法）</text>
  <rect class="box" x="16" y="392" width="186" height="64" rx="8"/>
  <text class="sm muted" x="26" y="412" xml:space="preserve">起始</text>
  <text class="mono sm" x="26" y="432" xml:space="preserve">{1, 3, 7, 9, 13, 15}</text>
  <text class="sm b" x="26" y="449" xml:space="preserve">= DFA 状态 I0</text>
  <line class="ln" x1="204" y1="424" x2="222" y2="424" marker-end="url(#l8-nfa-run-a)"/>
  <rect class="box" x="226" y="392" width="186" height="64" rx="8"/>
  <text class="sm muted" x="236" y="412" xml:space="preserve">读取 ( 后</text>
  <text class="mono sm" x="236" y="432" xml:space="preserve">{16, 3, 7, 9, 13, 15}</text>
  <text class="sm b" x="236" y="449" xml:space="preserve">= DFA 状态 I4</text>
  <line class="ln" x1="414" y1="424" x2="432" y2="424" marker-end="url(#l8-nfa-run-a)"/>
  <rect class="box" x="436" y="392" width="186" height="64" rx="8"/>
  <text class="sm muted" x="446" y="412" xml:space="preserve">读取 int 后</text>
  <text class="mono sm" x="446" y="432" xml:space="preserve">{10, 14}</text>
  <text class="sm b" x="446" y="449" xml:space="preserve">= DFA 状态 I3</text>
  <line class="ln" x1="624" y1="424" x2="642" y2="424" marker-end="url(#l8-nfa-run-a)"/>
  <rect class="blue" x="646" y="392" width="186" height="64" rx="8"/>
  <text class="sm muted" x="656" y="412" xml:space="preserve">读取 * 后</text>
  <text class="mono sm" x="656" y="432" xml:space="preserve">{11, 9, 13, 15}</text>
  <text class="sm b" x="656" y="449" xml:space="preserve">= DFA 状态 I6</text>
  <text class="muted" x="16" y="482" xml:space="preserve">集合非空，因此 ( int * 是活前缀；所有状态均为接受态，读完整个栈即接受。</text>
  <text class="muted sm" x="16" y="504" xml:space="preserve">编号对应 §15.2 的状态表；8、14 不在集合中时，对应项对当前栈无效。</text>
</svg>
