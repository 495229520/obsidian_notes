<svg xmlns="http://www.w3.org/2000/svg" width="812" height="444" viewBox="-16 -16 812 444" role="img" aria-label="文法类的包含关系及反例：有歧义 CFG、无歧义但非 LR(1) 的文法、LR(1) 但非 LALR(1) 的文法、LALR(1) 但非 SLR(1) 的文法，以及本文无冲突的 SLR(1) 文法。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="812" height="444" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="l8-grammar-classes-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-grammar-classes-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-grammar-classes-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="780" height="412" rx="12"/>
  <text class="b" x="14" y="25" xml:space="preserve">所有 CFG</text>
  <text class="mono" x="160" y="25" xml:space="preserve">S → S a S | b</text>
  <text class="muted sm" x="160" y="46" xml:space="preserve">有歧义：b a b a b 有两棵语法树（§30），任何 LR 表都有冲突。</text>
  <rect class="box" x="22" y="64" width="736" height="338" rx="12"/>
  <text class="b" x="36" y="89" xml:space="preserve">无歧义 CFG</text>
  <text class="mono" x="182" y="89" xml:space="preserve">S → a S a | a</text>
  <text class="muted sm" x="182" y="110" xml:space="preserve">语法树唯一，但确定中间的 a 需看完输入，因此不是 LR(1)。</text>
  <rect class="box" x="44" y="128" width="692" height="264" rx="12"/>
  <text class="b" x="58" y="153" xml:space="preserve">LR(1)</text>
  <text class="mono" x="204" y="153" xml:space="preserve">S → a A d | b B d | a B e | b A e,  A → c,  B → c</text>
  <text class="muted sm" x="204" y="174" xml:space="preserve">LR(1) 有 14 个状态，无冲突；合并同核状态后有 2 个归约-归约冲突格。</text>
  <rect class="box" x="66" y="192" width="648" height="190" rx="12"/>
  <text class="b" x="80" y="217" xml:space="preserve">LALR(1)</text>
  <text class="mono" x="226" y="217" xml:space="preserve">S → L = R | R,  L → * R | id,  R → L</text>
  <text class="muted sm" x="226" y="238" xml:space="preserve">LALR(1) 无冲突；SLR(1) 因 = ∈ Follow(R)，在 = 列产生冲突。</text>
  <rect class="blue" x="88" y="256" width="604" height="116" rx="12"/>
  <text class="b" x="102" y="281" xml:space="preserve">SLR(1)</text>
  <text class="mono" x="248" y="281" xml:space="preserve">E → T + E | T,  T → int * T | int | ( E )</text>
  <text class="muted sm" x="248" y="302" xml:space="preserve">本文文法：11 个状态，无冲突。</text>
  <text class="muted" x="102" y="330" xml:space="preserve">越往内层，构表越简单，表越小，但适用的文法也越少。</text>
  <text class="muted sm" x="102" y="352" xml:space="preserve">原图的状态数与冲突数由自编构表程序统计。</text>
</svg>
