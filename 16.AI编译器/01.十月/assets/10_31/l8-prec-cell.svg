<svg xmlns="http://www.w3.org/2000/svg" width="822" height="412" viewBox="-16 -16 822 412" role="img" aria-label="歧义表达式文法的 SLR 表有四个移进-归约冲突格。先声明加法左结合，再声明乘法左结合：E + E 后遇加号归约、遇乘号移进；E * E 后遇加号或乘号均归约。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="822" height="412" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="l8-prec-cell-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-prec-cell-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-prec-cell-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="790" height="380" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">优先级声明决定四个冲突格的取舍</text>
  <text class="mono" x="16" y="50" xml:space="preserve">E → E + E | E * E | ( E ) | int,  Follow(E) = { $, +, *, ) }</text>
  <text class="b" x="215" y="86" text-anchor="middle" xml:space="preserve">下一 token：+</text>
  <text class="b" x="375" y="86" text-anchor="middle" xml:space="preserve">下一 token：*</text>
  <text class="b" x="16" y="128" xml:space="preserve">读完 E + E</text>
  <text class="mono sm muted" x="16" y="148" xml:space="preserve">E → E + E ·</text>
  <rect class="acc" x="140" y="100" width="150" height="74" rx="6"/>
  <text class="sm muted" x="152" y="122" xml:space="preserve">移进 / 归约冲突</text>
  <text class="b" x="152" y="144" xml:space="preserve">→ 归约</text>
  <text class="sm" x="152" y="163" xml:space="preserve">同级，左结合</text>
  <rect class="blue" x="300" y="100" width="150" height="74" rx="6"/>
  <text class="sm muted" x="312" y="122" xml:space="preserve">移进 / 归约冲突</text>
  <text class="b" x="312" y="144" xml:space="preserve">→ 移进</text>
  <text class="sm" x="312" y="163" xml:space="preserve">token * 优先级更高</text>
  <text class="b" x="16" y="214" xml:space="preserve">读完 E * E</text>
  <text class="mono sm muted" x="16" y="234" xml:space="preserve">E → E * E ·</text>
  <rect class="acc" x="140" y="186" width="150" height="74" rx="6"/>
  <text class="sm muted" x="152" y="208" xml:space="preserve">移进 / 归约冲突</text>
  <text class="b" x="152" y="230" xml:space="preserve">→ 归约</text>
  <text class="sm" x="152" y="249" xml:space="preserve">乘法规则优先级更高</text>
  <rect class="acc" x="300" y="186" width="150" height="74" rx="6"/>
  <text class="sm muted" x="312" y="208" xml:space="preserve">移进 / 归约冲突</text>
  <text class="b" x="312" y="230" xml:space="preserve">→ 归约</text>
  <text class="sm" x="312" y="249" xml:space="preserve">同级，左结合</text>
  <rect class="box" x="470" y="74" width="304" height="132" rx="8"/>
  <text class="mono" x="484" y="98" xml:space="preserve">%left '+'</text>
  <text class="sm muted" x="590" y="98" xml:space="preserve">先声明的优先级低</text>
  <text class="mono" x="484" y="120" xml:space="preserve">%left '*'</text>
  <text class="sm muted" x="590" y="120" xml:space="preserve">后声明的优先级高</text>
  <text class="sm" x="484" y="148" xml:space="preserve">规则优先级 = 右部最后一个终结符的优先级</text>
  <text class="sm" x="484" y="168" xml:space="preserve">token 优先级高则移进，低则归约</text>
  <text class="sm" x="484" y="188" xml:space="preserve">同级看结合性（%left 选择归约）</text>
  <text class="b" x="470" y="232" xml:space="preserve">结果（原图使用自编构表程序验证）</text>
  <text class="mono sm" x="470" y="254" xml:space="preserve">int + int * int  →  int + (int * int)</text>
  <text class="mono sm" x="470" y="273" xml:space="preserve">int * int + int  →  (int * int) + int</text>
  <text class="mono sm" x="470" y="292" xml:space="preserve">int + int + int  →  (int + int) + int</text>
  <text class="muted" x="16" y="322" xml:space="preserve">声明指导构表程序在冲突格中保留哪个动作，不改变文法本身的歧义性（幻灯片 84）。</text>
  <text class="muted" x="16" y="344" xml:space="preserve">复杂文法中，优先级比较可能影响预期之外的表项，需检查生成的自动机（幻灯片 85）。</text>
  <text class="muted sm" x="16" y="366" xml:space="preserve">未编号的状态名仅用于图示；共 10 个状态，冲突格只有这四个。</text>
</svg>
