<svg xmlns="http://www.w3.org/2000/svg" width="822" height="416" viewBox="-16 -16 822 416" role="img" aria-label="栈 ( int * 由三个右部前缀串接而成：( 对应 T → ( E )，空串对应 E → T，int * 对应 T → int * T。下一 int 归约为 T 后，结果依次完成内层 T、E，并推进外层括号项的圆点。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="822" height="416" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="l8-prefix-chain-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-prefix-chain-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l8-prefix-chain-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="790" height="384" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">栈是右部前缀的串接：( int * | int )</text>
  <rect class="plain" x="200.0" y="133.0" width="34" height="26" rx="6"/>
  <text class="mono" x="217" y="150.5" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="plain" x="273.975" y="133.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="294.6" y="150.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="321.0" y="133.0" width="34" height="26" rx="6"/>
  <text class="mono" x="338" y="150.5" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="acc" x="362.5" y="129.0" width="3" height="34" rx="1"/>
  <rect class="dead" x="374.975" y="133.0" width="41.25" height="26" rx="6"/>
  <text class="mono" x="395.6" y="150.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="dead" x="422.0" y="133.0" width="34" height="26" rx="6"/>
  <text class="mono" x="439" y="150.5" text-anchor="middle" xml:space="preserve">)</text>
  <text class="muted" x="16" y="150.5" xml:space="preserve">栈 | 输入</text>
  <polyline class="ln-blue" points="200,126 200,120 234,120 234,126"/>
  <text class="b sm" x="234" y="88" text-anchor="end" xml:space="preserve">Prefix₁ = (</text>
  <text class="mono sm" x="234" y="106" text-anchor="end" xml:space="preserve">T → ( · E )</text>
  <line class="ln-acc" x1="254" y1="62" x2="254" y2="132"/>
  <text class="b sm" x="258" y="50" xml:space="preserve">Prefix₂ = ε</text>
  <text class="mono sm" x="258" y="66" xml:space="preserve">E → · T</text>
  <polyline class="ln-blue" points="274,126 274,120 355,120 355,126"/>
  <text class="b sm" x="314" y="88" text-anchor="middle" xml:space="preserve">Prefix₃ = int *</text>
  <text class="mono sm" x="314" y="106" text-anchor="middle" xml:space="preserve">T → int * · T</text>
  <text class="sm muted" x="470" y="88" xml:space="preserve">三个前缀串接起来就是整个栈。</text>
  <text class="mono sm muted" x="470" y="106" xml:space="preserve">( + ε + int * = ( int *</text>
  <text class="b" x="16" y="196" xml:space="preserve">项栈（左侧为栈底）</text>
  <rect class="box" x="16" y="210" width="220" height="50" rx="8"/>
  <text class="mono" x="28" y="231" xml:space="preserve">T → ( · E )</text>
  <text class="muted sm" x="28" y="250" xml:space="preserve">等待 E</text>
  <rect class="box" x="270" y="210" width="220" height="50" rx="8"/>
  <text class="mono" x="282" y="231" xml:space="preserve">E → · T</text>
  <text class="muted sm" x="282" y="250" xml:space="preserve">等待 T</text>
  <rect class="blue" x="524" y="210" width="220" height="50" rx="8"/>
  <text class="mono" x="536" y="231" xml:space="preserve">T → int * · T</text>
  <text class="muted sm" x="536" y="250" xml:space="preserve">等待 T</text>
  <line class="ln-acc" x1="268" y1="235" x2="238" y2="235" marker-end="url(#l8-prefix-chain-acc)"/>
  <line class="ln-acc" x1="522" y1="235" x2="492" y2="235" marker-end="url(#l8-prefix-chain-acc)"/>
  <text class="b" x="16" y="296" xml:space="preserve">后续步骤（结果由内向外传递）</text>
  <rect class="acc" x="16" y="312" width="160.35999999999999" height="30" rx="6"/>
  <text class="sm" x="26" y="331" xml:space="preserve">移进 int 后，按 T → int 归约</text>
  <line class="ln" x1="178.35999999999999" y1="327" x2="194.35999999999999" y2="327" marker-end="url(#l8-prefix-chain-a)"/>
  <rect class="acc" x="198.35999999999999" y="312" width="127.13999999999999" height="30" rx="6"/>
  <text class="sm" x="208.35999999999999" y="331" xml:space="preserve">T → int * T ·  归约</text>
  <line class="ln" x1="327.5" y1="327" x2="343.5" y2="327" marker-end="url(#l8-prefix-chain-a)"/>
  <rect class="acc" x="347.5" y="312" width="100.3" height="30" rx="6"/>
  <text class="sm" x="357.5" y="331" xml:space="preserve">E → T ·  归约</text>
  <line class="ln" x1="449.8" y1="327" x2="465.8" y2="327" marker-end="url(#l8-prefix-chain-a)"/>
  <rect class="blue" x="469.8" y="312" width="136.38" height="30" rx="6"/>
  <text class="sm" x="479.8" y="331" xml:space="preserve">T → ( E · )  等待 )</text>
  <text class="muted mono sm" x="16" y="370" xml:space="preserve">归约结果 Xᵢ 使下一层前缀的圆点右移：Xᵢ₋₁ → Prefixᵢ₋₁ · Xᵢ β</text>
</svg>
