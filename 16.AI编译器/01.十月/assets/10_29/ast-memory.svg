<svg xmlns="http://www.w3.org/2000/svg" width="792" height="308" viewBox="-16 -16 792 308" role="img" aria-label="AST 的内存结构。PLUS 节点保存运算类型和左右子指针。根节点的左指针指向值为 5 的叶节点，右指针指向另一 PLUS 节点；后者的两个指针分别指向值为 2 和 3 的叶节点。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="308" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="amryA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="amryAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="amryBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-acc" x="170" y="16" width="72" height="32" rx="4"/>
  <text class="sm mono" x="206" y="36.5" text-anchor="middle" xml:space="preserve">PLUS</text>
  <rect class="box" x="242" y="16" width="72" height="32" rx="4"/>
  <text class="sm mono" x="278" y="36.5" text-anchor="middle" xml:space="preserve">left*</text>
  <rect class="box" x="314" y="16" width="72" height="32" rx="4"/>
  <text class="sm mono" x="350" y="36.5" text-anchor="middle" xml:space="preserve">right*</text>
  <text class="sm muted" x="170" y="8" xml:space="preserve">根节点</text>
  <rect class="box-blue" x="30" y="110" width="62" height="32" rx="4"/>
  <text class="sm mono" x="61" y="130.5" text-anchor="middle" xml:space="preserve">INT</text>
  <rect class="box" x="92" y="110" width="42" height="32" rx="4"/>
  <text class="sm mono" x="113" y="130.5" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="box-acc" x="400" y="110" width="72" height="32" rx="4"/>
  <text class="sm mono" x="436" y="130.5" text-anchor="middle" xml:space="preserve">PLUS</text>
  <rect class="box" x="472" y="110" width="72" height="32" rx="4"/>
  <text class="sm mono" x="508" y="130.5" text-anchor="middle" xml:space="preserve">left*</text>
  <rect class="box" x="544" y="110" width="72" height="32" rx="4"/>
  <text class="sm mono" x="580" y="130.5" text-anchor="middle" xml:space="preserve">right*</text>
  <rect class="box-blue" x="280" y="204" width="62" height="32" rx="4"/>
  <text class="sm mono" x="311" y="224.5" text-anchor="middle" xml:space="preserve">INT</text>
  <rect class="box" x="342" y="204" width="42" height="32" rx="4"/>
  <text class="sm mono" x="363" y="224.5" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-blue" x="560" y="204" width="62" height="32" rx="4"/>
  <text class="sm mono" x="591" y="224.5" text-anchor="middle" xml:space="preserve">INT</text>
  <rect class="box" x="622" y="204" width="42" height="32" rx="4"/>
  <text class="sm mono" x="643" y="224.5" text-anchor="middle" xml:space="preserve">3</text>
  <line class="ln-acc" x1="278" y1="48" x2="82" y2="110" marker-end="url(#amryAcc)"/>
  <line class="ln-acc" x1="350" y1="48" x2="508" y2="110" marker-end="url(#amryAcc)"/>
  <line class="ln-acc" x1="508" y1="142" x2="332" y2="204" marker-end="url(#amryAcc)"/>
  <line class="ln-acc" x1="580" y1="142" x2="612" y2="204" marker-end="url(#amryAcc)"/>
  <text x="0" y="262" xml:space="preserve">只需 5 个节点和 4 个指针。指针连接表示先计算 2 + 3，无需保留括号。</text>
