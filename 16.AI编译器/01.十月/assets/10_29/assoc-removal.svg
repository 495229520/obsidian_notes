<svg xmlns="http://www.w3.org/2000/svg" width="792" height="344" viewBox="-16 -16 792 344" role="img" aria-label="对 1 - 2 - 3 消除左递归后的求值差异。左递归文法表示 (1 - 2) - 3 = -4。若按消除后的树形直接求值，会得到 1 - (2 - 3) = 2。逐次累积读取的值，使 left 依次为 1、-1、-4，可恢复正确结果。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="344" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="aralA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aralAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aralBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="240" height="308" rx="10"/>
  <rect class="box" x="260" y="0" width="240" height="308" rx="10"/>
  <rect class="box" x="520" y="0" width="240" height="308" rx="10"/>
  <text class="lg" x="14" y="24" xml:space="preserve">左递归的含义</text>
  <text class="lg" x="274" y="24" xml:space="preserve">消除后按树形求值</text>
  <text class="lg" x="534" y="24" xml:space="preserve">消除后累积计算</text>
  <text class="sm muted mono" x="14" y="44" xml:space="preserve">E → E - T | T</text>
  <text class="sm muted mono" x="274" y="44" xml:space="preserve">E → T E'   E' → - T E' | ε</text>
  <text class="sm muted" x="534" y="44" xml:space="preserve">相同文法，相同词法单元顺序</text>
  <line class="edge" x1="136.5" y1="88" x2="93" y2="122"/>
  <line class="edge" x1="93" y1="146" x2="64" y2="180"/>
  <line class="edge" x1="93" y1="146" x2="122" y2="180"/>
  <line class="edge" x1="136.5" y1="88" x2="180" y2="122"/>
  <rect class="box-acc" x="121.5" y="64" width="30" height="24" rx="6"/>
  <text class="mono" x="136.5" y="80.3" text-anchor="middle" xml:space="preserve">-</text>
  <rect class="box-acc" x="78" y="122" width="30" height="24" rx="6"/>
  <text class="mono" x="93" y="138.3" text-anchor="middle" xml:space="preserve">-</text>
  <rect class="box-blue" x="49" y="180" width="30" height="24" rx="6"/>
  <text class="mono" x="64" y="196.3" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="box-blue" x="107" y="180" width="30" height="24" rx="6"/>
  <text class="mono" x="122" y="196.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-blue" x="165" y="122" width="30" height="24" rx="6"/>
  <text class="mono" x="180" y="138.3" text-anchor="middle" xml:space="preserve">3</text>
  <text class="mono" x="14" y="262" xml:space="preserve">(1 - 2) - 3</text>
  <text class="lg blue-t mono" x="14" y="288" xml:space="preserve">= -4</text>
  <line class="edge" x1="365.5" y1="88" x2="322" y2="122"/>
  <line class="edge" x1="365.5" y1="88" x2="409" y2="122"/>
  <line class="edge" x1="409" y1="146" x2="380" y2="180"/>
  <line class="edge" x1="409" y1="146" x2="438" y2="180"/>
  <rect class="box-acc" x="350.5" y="64" width="30" height="24" rx="6"/>
  <text class="mono" x="365.5" y="80.3" text-anchor="middle" xml:space="preserve">-</text>
  <rect class="box-blue" x="307" y="122" width="30" height="24" rx="6"/>
  <text class="mono" x="322" y="138.3" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="box-acc" x="394" y="122" width="30" height="24" rx="6"/>
  <text class="mono" x="409" y="138.3" text-anchor="middle" xml:space="preserve">-</text>
  <rect class="box-blue" x="365" y="180" width="30" height="24" rx="6"/>
  <text class="mono" x="380" y="196.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-blue" x="423" y="180" width="30" height="24" rx="6"/>
  <text class="mono" x="438" y="196.3" text-anchor="middle" xml:space="preserve">3</text>
  <text class="mono" x="274" y="262" xml:space="preserve">1 - (2 - 3)</text>
  <text class="lg acc-t mono" x="274" y="288" xml:space="preserve">= 2（错误）</text>
  <text class="sm muted" x="534" y="74" xml:space="preserve">读取 T</text>
  <rect class="box-blue" x="534" y="82" width="192" height="30" rx="6"/>
  <text class="sm mono" x="546" y="102" xml:space="preserve">left = 1</text>
  <text class="sm muted" x="534" y="132" xml:space="preserve">读取 - 2</text>
  <rect class="box-blue" x="534" y="140" width="192" height="30" rx="6"/>
  <text class="sm mono" x="546" y="160" xml:space="preserve">left = 1 - 2 = -1</text>
  <text class="sm muted" x="534" y="190" xml:space="preserve">读取 - 3</text>
  <rect class="box-blue" x="534" y="198" width="192" height="30" rx="6"/>
  <text class="sm mono" x="546" y="218" xml:space="preserve">left = -1 - 3 = -4</text>
  <text class="sm" x="534" y="262" xml:space="preserve">将左项作为参数传递，或用 while 循环</text>
  <text class="lg blue-t mono" x="534" y="288" xml:space="preserve">= -4</text>
</svg>
