<svg xmlns="http://www.w3.org/2000/svg" width="792" height="350" viewBox="-16 -16 792 350" role="img" aria-label="同一字符串 β α α 的两棵树。S → S α | β 的树向左延伸，推导时先生成最右侧的 α，首个词法单元 β 最后生成。S → β S&#x27;、S&#x27; → α S&#x27; | ε 的树向右延伸，按输入顺序生成 β、α、α。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="350" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="batesA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="batesAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="batesBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="370" height="314" rx="10"/>
  <rect class="box" x="390" y="0" width="370" height="314" rx="10"/>
  <text class="lg" x="16" y="26" xml:space="preserve">左递归：S → S α | β</text>
  <text class="lg" x="406" y="26" xml:space="preserve">右递归：S → β S'   S' → α S' | ε</text>
  <line class="edge" x1="197.5" y1="74" x2="145" y2="102"/>
  <line class="edge" x1="145" y1="126" x2="110" y2="154"/>
  <line class="edge" x1="110" y1="178" x2="110" y2="206"/>
  <line class="edge" x1="145" y1="126" x2="180" y2="154"/>
  <line class="edge" x1="197.5" y1="74" x2="250" y2="102"/>
  <rect class="box-acc" x="182.5" y="50" width="30" height="24" rx="6"/>
  <text class="mono" x="197.5" y="66.3" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="box" x="130" y="102" width="30" height="24" rx="6"/>
  <text class="mono" x="145" y="118.3" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="box" x="95" y="154" width="30" height="24" rx="6"/>
  <text class="mono" x="110" y="170.3" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="box-blue" x="95" y="206" width="30" height="24" rx="6"/>
  <text class="mono" x="110" y="222.3" text-anchor="middle" xml:space="preserve">β</text>
  <rect class="box-blue" x="165" y="154" width="30" height="24" rx="6"/>
  <text class="mono" x="180" y="170.3" text-anchor="middle" xml:space="preserve">α</text>
  <rect class="box-blue" x="235" y="102" width="30" height="24" rx="6"/>
  <text class="mono" x="250" y="118.3" text-anchor="middle" xml:space="preserve">α</text>
  <circle class="badge" cx="84" cy="218" r="8"/>
  <text class="badge-t" x="84" y="221.7" text-anchor="middle" xml:space="preserve">3</text>
  <circle class="badge" cx="206" cy="166" r="8"/>
  <text class="badge-t" x="206" y="169.7" text-anchor="middle" xml:space="preserve">2</text>
  <circle class="badge" cx="276" cy="114" r="8"/>
  <text class="badge-t" x="276" y="117.7" text-anchor="middle" xml:space="preserve">1</text>
  <text class="sm mono" x="16" y="262" xml:space="preserve">最左推导：S ⇒ Sα ⇒ Sαα ⇒ βαα</text>
  <text class="sm" x="16" y="282" xml:space="preserve">先生成最右侧的 α，首个词法单元 β 最后生成。</text>
  <text class="sm acc-t" x="16" y="300" xml:space="preserve">与分析器从左向右读取输入的方向相反。</text>
  <line class="edge" x1="511.25" y1="74" x2="450" y2="90"/>
  <line class="edge" x1="511.25" y1="74" x2="572.5" y2="90"/>
  <line class="edge" x1="572.5" y1="114" x2="520" y2="130"/>
  <line class="edge" x1="572.5" y1="114" x2="625" y2="130"/>
  <line class="edge" x1="625" y1="154" x2="590" y2="170"/>
  <line class="edge" x1="625" y1="154" x2="660" y2="170"/>
  <line class="edge" x1="660" y1="194" x2="660" y2="210"/>
  <rect class="box-acc" x="496.25" y="50" width="30" height="24" rx="6"/>
  <text class="mono" x="511.25" y="66.3" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="box-blue" x="435" y="90" width="30" height="24" rx="6"/>
  <text class="mono" x="450" y="106.3" text-anchor="middle" xml:space="preserve">β</text>
  <rect class="box" x="557.5" y="90" width="30" height="24" rx="6"/>
  <text class="mono" x="572.5" y="106.3" text-anchor="middle" xml:space="preserve">S'</text>
  <rect class="box-blue" x="505" y="130" width="30" height="24" rx="6"/>
  <text class="mono" x="520" y="146.3" text-anchor="middle" xml:space="preserve">α</text>
  <rect class="box" x="610" y="130" width="30" height="24" rx="6"/>
  <text class="mono" x="625" y="146.3" text-anchor="middle" xml:space="preserve">S'</text>
  <rect class="box-blue" x="575" y="170" width="30" height="24" rx="6"/>
  <text class="mono" x="590" y="186.3" text-anchor="middle" xml:space="preserve">α</text>
  <rect class="box" x="645" y="170" width="30" height="24" rx="6"/>
  <text class="mono" x="660" y="186.3" text-anchor="middle" xml:space="preserve">S'</text>
  <rect class="box-blue" x="645" y="210" width="30" height="24" rx="6"/>
  <text class="mono" x="660" y="226.3" text-anchor="middle" xml:space="preserve">ε</text>
  <circle class="badge" cx="424" cy="102" r="8"/>
  <text class="badge-t" x="424" y="105.7" text-anchor="middle" xml:space="preserve">1</text>
  <circle class="badge" cx="494" cy="142" r="8"/>
  <text class="badge-t" x="494" y="145.7" text-anchor="middle" xml:space="preserve">2</text>
  <circle class="badge" cx="564" cy="182" r="8"/>
  <text class="badge-t" x="564" y="185.7" text-anchor="middle" xml:space="preserve">3</text>
  <text class="sm mono" x="406" y="262" xml:space="preserve">最左推导：S ⇒ βS' ⇒ βαS' ⇒ βααS' ⇒ βαα</text>
  <text class="sm" x="406" y="282" xml:space="preserve">字符串相同，仅树形不同。</text>
  <text class="sm blue-t" x="406" y="300" xml:space="preserve">按输入顺序从 β 开始生成。</text>
</svg>
