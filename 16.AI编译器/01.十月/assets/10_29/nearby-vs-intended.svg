<svg xmlns="http://www.w3.org/2000/svg" width="792" height="362" viewBox="-16 -16 792 362" role="img" aria-label="修正输入 1 + 2 ) * 3 的三个编辑距离为 1 的候选。删除右括号得到 1 + 2 * 3 = 7；在开头插入左括号得到 (1 + 2) * 3 = 9；在 2 前插入左括号得到 1 + (2) * 3 = 7。仅凭文法无法判断原意。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="362" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="nviedA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="nviedAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="nviedBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="22" xml:space="preserve">输入</text>
  <rect class="box" x="56" y="4" width="38" height="28" rx="5"/>
  <text class="mono" x="75" y="22.3" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="box" x="100" y="4" width="38" height="28" rx="5"/>
  <text class="mono" x="119" y="22.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="144" y="4" width="38" height="28" rx="5"/>
  <text class="mono" x="163" y="22.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-bad" x="188" y="4" width="38" height="28" rx="5"/>
  <text class="mono" x="207" y="22.3" text-anchor="middle" xml:space="preserve">)</text>
  <rect class="box" x="232" y="4" width="38" height="28" rx="5"/>
  <text class="mono" x="251" y="22.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box" x="276" y="4" width="38" height="28" rx="5"/>
  <text class="mono" x="295" y="22.3" text-anchor="middle" xml:space="preserve">3</text>
  <text class="acc-t" x="340" y="22" xml:space="preserve">在 ) 处发现错误，但真正写错的位置不一定在这里</text>
  <rect class="box" x="0" y="46" width="240" height="244" rx="10"/>
  <text class="b" x="14" y="70" xml:space="preserve">A. 删除 )</text>
  <text class="mono" x="14" y="94" xml:space="preserve">1 + 2 * 3</text>
  <line class="edge" x1="106.5" y1="136" x2="66" y2="164"/>
  <line class="edge" x1="106.5" y1="136" x2="147" y2="164"/>
  <line class="edge" x1="147" y1="188" x2="120" y2="216"/>
  <line class="edge" x1="147" y1="188" x2="174" y2="216"/>
  <rect class="box-acc" x="91.5" y="112" width="30" height="24" rx="6"/>
  <text class="mono" x="106.5" y="128.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-blue" x="51" y="164" width="30" height="24" rx="6"/>
  <text class="mono" x="66" y="180.3" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="box-acc" x="132" y="164" width="30" height="24" rx="6"/>
  <text class="mono" x="147" y="180.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box-blue" x="105" y="216" width="30" height="24" rx="6"/>
  <text class="mono" x="120" y="232.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-blue" x="159" y="216" width="30" height="24" rx="6"/>
  <text class="mono" x="174" y="232.3" text-anchor="middle" xml:space="preserve">3</text>
  <text class="lg acc-t mono" x="14" y="250" xml:space="preserve">= 7</text>
  <text class="sm muted" x="14" y="274" xml:space="preserve">如果右括号是多写的</text>
  <rect class="box" x="260" y="46" width="240" height="244" rx="10"/>
  <text class="b" x="274" y="70" xml:space="preserve">B. 在开头插入 (</text>
  <text class="mono" x="274" y="94" xml:space="preserve">( 1 + 2 ) * 3</text>
  <line class="edge" x1="393.5" y1="136" x2="353" y2="164"/>
  <line class="edge" x1="353" y1="188" x2="326" y2="216"/>
  <line class="edge" x1="353" y1="188" x2="380" y2="216"/>
  <line class="edge" x1="393.5" y1="136" x2="434" y2="164"/>
  <rect class="box-acc" x="378.5" y="112" width="30" height="24" rx="6"/>
  <text class="mono" x="393.5" y="128.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box-acc" x="338" y="164" width="30" height="24" rx="6"/>
  <text class="mono" x="353" y="180.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-blue" x="311" y="216" width="30" height="24" rx="6"/>
  <text class="mono" x="326" y="232.3" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="box-blue" x="365" y="216" width="30" height="24" rx="6"/>
  <text class="mono" x="380" y="232.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-blue" x="419" y="164" width="30" height="24" rx="6"/>
  <text class="mono" x="434" y="180.3" text-anchor="middle" xml:space="preserve">3</text>
  <text class="lg acc-t mono" x="274" y="250" xml:space="preserve">= 9</text>
  <text class="sm muted" x="274" y="274" xml:space="preserve">如果漏写了左括号</text>
  <rect class="box" x="520" y="46" width="240" height="244" rx="10"/>
  <text class="b" x="534" y="70" xml:space="preserve">C. 在 2 前插入 (</text>
  <text class="mono" x="534" y="94" xml:space="preserve">1 + ( 2 ) * 3</text>
  <line class="edge" x1="626.5" y1="136" x2="586" y2="164"/>
  <line class="edge" x1="626.5" y1="136" x2="667" y2="164"/>
  <line class="edge" x1="667" y1="188" x2="640" y2="216"/>
  <line class="edge" x1="667" y1="188" x2="694" y2="216"/>
  <rect class="box-acc" x="611.5" y="112" width="30" height="24" rx="6"/>
  <text class="mono" x="626.5" y="128.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-blue" x="571" y="164" width="30" height="24" rx="6"/>
  <text class="mono" x="586" y="180.3" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="box-acc" x="652" y="164" width="30" height="24" rx="6"/>
  <text class="mono" x="667" y="180.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box-blue" x="625" y="216" width="30" height="24" rx="6"/>
  <text class="mono" x="640" y="232.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-blue" x="679" y="216" width="30" height="24" rx="6"/>
  <text class="mono" x="694" y="232.3" text-anchor="middle" xml:space="preserve">3</text>
  <text class="lg acc-t mono" x="534" y="250" xml:space="preserve">= 7</text>
  <text class="sm muted" x="534" y="274" xml:space="preserve">符合文法，但没有这样写的必要</text>
  <text class="b" x="380" y="318" text-anchor="middle" xml:space="preserve">三者的编辑距离均为 1，文法无法判断哪一个符合原意</text>
</svg>
