<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="-16 -16 820 420" role="img" aria-label="具体解析树（CST）与抽象语法树（AST）对比：5 + (2 + 3)">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .xs { font-size: 10px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #2E5C8A; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .box-bad { fill: #FCE8E6; stroke: #D9534F; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .box-warn { fill: #FEF3C7; stroke: #F59E0B; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.5; fill: none; }
    .edge-blue { stroke: #4F7FAF; stroke-width: 1.5; fill: none; }
    .panel { fill: #FAF9F5; stroke: #D8D6CE; stroke-width: 1; }
    .div-ln { stroke: #D8D6CE; stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>
  <rect x="-16" y="-16" width="820" height="420" rx="14" fill="#F0EEE6" />

  <!-- 顶部标题与说明 -->
  <text class="lg b" x="12" y="16">具体解析树 (CST / Parse Tree) vs 抽象语法树 (AST)</text>
  <text class="sm muted" x="430" y="16">表达式：5 + (2 + 3)</text>

  <!-- 左面板：具体解析树 -->
  <rect class="panel" x="0" y="32" width="410" height="360" rx="10" />
  <text class="b acc-t" x="16" y="54">具体解析树 (CST) — 记录推导过程</text>
  <text class="xs muted" x="16" y="70">缺陷：包含产生式垫片与冗余语法标记</text>

  <!-- 连线：CST -->
  <!-- 根 E 到一层 -->
  <line class="edge" x1="190" y1="108" x2="80" y2="134" />
  <line class="edge" x1="190" y1="108" x2="190" y2="134" />
  <line class="edge" x1="190" y1="108" x2="300" y2="134" />
  <!-- 左 E 到 int5 -->
  <line class="edge-acc" x1="80" y1="158" x2="80" y2="200" />
  <!-- 右 E 到 ( E ) -->
  <line class="edge" x1="300" y1="158" x2="230" y2="198" />
  <line class="edge" x1="300" y1="158" x2="300" y2="198" />
  <line class="edge" x1="300" y1="158" x2="370" y2="198" />
  <!-- 内层 E 到子分支 -->
  <line class="edge" x1="300" y1="222" x2="250" y2="258" />
  <line class="edge" x1="300" y1="222" x2="300" y2="258" />
  <line class="edge" x1="300" y1="222" x2="350" y2="258" />
  <!-- 内层叶子 -->
  <line class="edge-acc" x1="250" y1="282" x2="250" y2="318" />
  <line class="edge-acc" x1="350" y1="282" x2="350" y2="318" />

  <!-- CST 节点 -->
  <!-- 根 E -->
  <rect class="box" x="175" y="86" width="30" height="22" rx="5" />
  <text class="mono" x="190" y="102" text-anchor="middle">E</text>

  <!-- Level 1: E, +, E -->
  <rect class="box-warn" x="65" y="136" width="30" height="22" rx="5" />
  <text class="mono" x="80" y="152" text-anchor="middle">E</text>

  <rect class="box" x="175" y="136" width="30" height="22" rx="5" />
  <text class="mono b" x="190" y="152" text-anchor="middle">+</text>

  <rect class="box" x="285" y="136" width="30" height="22" rx="5" />
  <text class="mono" x="300" y="152" text-anchor="middle">E</text>

  <!-- 左叶子 int5 -->
  <rect class="box-acc" x="60" y="200" width="40" height="22" rx="5" />
  <text class="mono b" x="80" y="216" text-anchor="middle">int₅</text>

  <!-- Level 2: ( , E , ) -->
  <rect class="box-bad" x="218" y="198" width="24" height="22" rx="4" />
  <text class="mono b acc-t" x="230" y="214" text-anchor="middle">(</text>

  <rect class="box" x="285" y="198" width="30" height="22" rx="5" />
  <text class="mono" x="300" y="214" text-anchor="middle">E</text>

  <rect class="box-bad" x="358" y="198" width="24" height="22" rx="4" />
  <text class="mono b acc-t" x="370" y="214" text-anchor="middle">)</text>

  <!-- Level 3: E, +, E -->
  <rect class="box-warn" x="235" y="260" width="30" height="22" rx="5" />
  <text class="mono" x="250" y="276" text-anchor="middle">E</text>

  <rect class="box" x="285" y="260" width="30" height="22" rx="5" />
  <text class="mono b" x="300" y="276" text-anchor="middle">+</text>

  <rect class="box-warn" x="335" y="260" width="30" height="22" rx="5" />
  <text class="mono" x="350" y="276" text-anchor="middle">E</text>

  <!-- Level 4: int2, int3 -->
  <rect class="box-acc" x="230" y="320" width="40" height="22" rx="5" />
  <text class="mono b" x="250" y="336" text-anchor="middle">int₂</text>

  <rect class="box-acc" x="330" y="320" width="40" height="22" rx="5" />
  <text class="mono b" x="350" y="336" text-anchor="middle">int₃</text>

  <!-- 标注说明 -->
  <text class="xs acc-t" x="14" y="360">✕ 冗余1：单后继节点（虚线黄框，无语义价值）</text>
  <text class="xs acc-t" x="14" y="378">✕ 冗余2：显式括号（红框，树形结构已含优先级）</text>

  <!-- 右面板：抽象语法树 -->
  <rect class="panel" x="424" y="32" width="364" height="360" rx="10" />
  <text class="b blue-t" x="440" y="54">抽象语法树 (AST) — 仅保留核心语义</text>
  <text class="xs muted" x="440" y="70">特性：抽离具体语法，节点紧凑，可直接用于求值/IR</text>

  <!-- AST 树形图 (上半区) -->
  <line class="edge-blue" x1="600" y1="110" x2="520" y2="148" />
  <line class="edge-blue" x1="600" y1="110" x2="680" y2="148" />
  <line class="edge-blue" x1="680" y1="172" x2="640" y2="208" />
  <line class="edge-blue" x1="680" y1="172" x2="720" y2="208" />

  <!-- AST 节点 -->
  <rect class="box-blue" x="575" y="88" width="50" height="24" rx="6" />
  <text class="mono b" x="600" y="105" text-anchor="middle">PLUS</text>

  <rect class="box-acc" x="502" y="148" width="36" height="24" rx="6" />
  <text class="mono b" x="520" y="165" text-anchor="middle">5</text>

  <rect class="box-blue" x="655" y="148" width="50" height="24" rx="6" />
  <text class="mono b" x="680" y="165" text-anchor="middle">PLUS</text>

  <rect class="box-acc" x="622" y="208" width="36" height="24" rx="6" />
  <text class="mono b" x="640" y="225" text-anchor="middle">2</text>

  <rect class="box-acc" x="702" y="208" width="36" height="24" rx="6" />
  <text class="mono b" x="720" y="225" text-anchor="middle">3</text>

  <!-- 分割线 -->
  <line class="div-ln" x1="440" y1="248" x2="770" y2="248" />
  <text class="xs muted" x="440" y="264">AST 内存结构表示 (结构体与指针)：</text>

  <!-- AST 内存结构图 (下半区) -->
  <!-- 根节点结构体 -->
  <rect class="box-blue" x="450" y="278" width="60" height="24" rx="4" />
  <text class="mono sm b" x="480" y="294" text-anchor="middle">PLUS</text>
  <rect class="box" x="510" y="278" width="22" height="24" />
  <circle cx="521" cy="290" r="3" fill="#D97757" />
  <rect class="box" x="532" y="278" width="22" height="24" rx="0 4 4 0" />
  <circle cx="543" cy="290" r="3" fill="#4F7FAF" />

  <!-- 指针连线 -->
  <!-- 连到 5 -->
  <path class="edge-acc" d="M 521 293 L 521 340 L 485 340" />
  <rect class="box-acc" x="450" y="330" width="35" height="22" rx="4" />
  <text class="mono b sm" x="467" y="345" text-anchor="middle">5</text>

  <!-- 连到右 PLUS 结构体 -->
  <path class="edge-blue" d="M 543 293 L 543 320 L 590 320" />

  <!-- 右结构体 -->
  <rect class="box-blue" x="590" y="308" width="60" height="24" rx="4" />
  <text class="mono sm b" x="620" y="324" text-anchor="middle">PLUS</text>
  <rect class="box" x="650" y="308" width="22" height="24" />
  <circle cx="661" cy="320" r="3" fill="#D97757" />
  <rect class="box" x="672" y="308" width="22" height="24" rx="0 4 4 0" />
  <circle cx="683" cy="320" r="3" fill="#D97757" />

  <!-- 指针连到 2 和 3 -->
  <path class="edge-acc" d="M 661 323 L 661 360 L 635 360" />
  <rect class="box-acc" x="605" y="350" width="30" height="22" rx="4" />
  <text class="mono b sm" x="620" y="365" text-anchor="middle">2</text>

  <path class="edge-acc" d="M 683 323 L 683 360 L 705 360" />
  <rect class="box-acc" x="705" y="350" width="30" height="22" rx="4" />
  <text class="mono b sm" x="720" y="365" text-anchor="middle">3</text>

  <text class="xs blue-t" x="440" y="385">✓ 剔除全部非终结符与括号，层级深度天然保序</text>
</svg>
