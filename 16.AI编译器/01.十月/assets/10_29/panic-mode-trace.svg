<svg xmlns="http://www.w3.org/2000/svg" width="792" height="394" viewBox="-16 -16 792 394" role="img" aria-label="输入 (1 + + 2) + 3 的恢复过程。在第二个 + 处出错，丢弃它，在下一个整数 2 处恢复。下表表示存在 E → error int 规则时的栈变化：移入 error，丢弃 +，再移入 2 并归约为 E。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="394" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="pmtceA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="pmtceAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="pmtceBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="45" xml:space="preserve">输入</text>
  <rect class="box" x="80" y="26" width="64" height="30" rx="5"/>
  <text class="mono" x="112" y="45.3" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="box" x="152" y="26" width="64" height="30" rx="5"/>
  <text class="mono" x="184" y="45.3" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="box" x="224" y="26" width="64" height="30" rx="5"/>
  <text class="mono" x="256" y="45.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-bad" x="296" y="26" width="64" height="30" rx="5"/>
  <text class="mono" x="328" y="45.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-strong" x="368" y="26" width="64" height="30" rx="5"/>
  <text class="mono" x="400" y="45.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box" x="440" y="26" width="64" height="30" rx="5"/>
  <text class="mono" x="472" y="45.3" text-anchor="middle" xml:space="preserve">)</text>
  <rect class="box" x="512" y="26" width="64" height="30" rx="5"/>
  <text class="mono" x="544" y="45.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="584" y="26" width="64" height="30" rx="5"/>
  <text class="mono" x="616" y="45.3" text-anchor="middle" xml:space="preserve">3</text>
  <text class="sm acc-t" x="328" y="16" text-anchor="middle" xml:space="preserve">在此出错，丢弃该词法单元</text>
  <path class="ln-muted" d="M80,62 L80,68 L288,68 L288,62"/>
  <text class="sm muted" x="184" y="84" text-anchor="middle" xml:space="preserve">正常分析</text>
  <text class="sm blue-t" x="400" y="84" text-anchor="middle" xml:space="preserve">在下一个整数处恢复</text>
  <path class="ln-muted" d="M440,62 L440,68 L648,68 L648,62"/>
  <text class="sm muted" x="544" y="84" text-anchor="middle" xml:space="preserve">继续正常分析</text>
  <line class="ln-muted" x1="0" y1="100" x2="760" y2="100"/>
  <text class="b" x="0" y="124" xml:space="preserve">Bison 的栈</text>
  <text class="b" x="300" y="124" xml:space="preserve">下一词法单元</text>
  <text class="b" x="392" y="124" xml:space="preserve">动作</text>
  <rect class="box" x="0" y="136" width="34" height="28" rx="5"/>
  <text class="sm mono" x="17" y="154.3" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="box" x="38" y="136" width="34" height="28" rx="5"/>
  <text class="sm mono" x="55" y="154.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="76" y="136" width="34" height="28" rx="5"/>
  <text class="sm mono" x="93" y="154.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="310" y="136" width="34" height="28" rx="5"/>
  <text class="sm mono" x="327" y="154.3" text-anchor="middle" xml:space="preserve">+</text>
  <text class="sm acc-t" x="392" y="154.3" xml:space="preserve">报告语法错误；当前状态可移入 error</text>
  <rect class="box" x="0" y="173" width="34" height="28" rx="5"/>
  <text class="sm mono" x="17" y="191.3" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="box" x="38" y="173" width="34" height="28" rx="5"/>
  <text class="sm mono" x="55" y="191.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="76" y="173" width="34" height="28" rx="5"/>
  <text class="sm mono" x="93" y="191.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-bad" x="114" y="173" width="54" height="28" rx="5"/>
  <text class="sm mono" x="141" y="191.3" text-anchor="middle" xml:space="preserve">error</text>
  <rect class="box" x="310" y="173" width="34" height="28" rx="5"/>
  <text class="sm mono" x="327" y="191.3" text-anchor="middle" xml:space="preserve">+</text>
  <text class="sm acc-t" x="392" y="191.3" xml:space="preserve">移入 error；无法接受 +，将其丢弃</text>
  <rect class="box" x="0" y="210" width="34" height="28" rx="5"/>
  <text class="sm mono" x="17" y="228.3" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="box" x="38" y="210" width="34" height="28" rx="5"/>
  <text class="sm mono" x="55" y="228.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="76" y="210" width="34" height="28" rx="5"/>
  <text class="sm mono" x="93" y="228.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-bad" x="114" y="210" width="54" height="28" rx="5"/>
  <text class="sm mono" x="141" y="228.3" text-anchor="middle" xml:space="preserve">error</text>
  <rect class="box-blue" x="172" y="210" width="34" height="28" rx="5"/>
  <text class="sm mono" x="189" y="228.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box" x="310" y="210" width="34" height="28" rx="5"/>
  <text class="sm mono" x="327" y="228.3" text-anchor="middle" xml:space="preserve">)</text>
  <text class="sm blue-t" x="392" y="228.3" xml:space="preserve">移入 2，找到恢复点</text>
  <rect class="box" x="0" y="247" width="34" height="28" rx="5"/>
  <text class="sm mono" x="17" y="265.3" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="box" x="38" y="247" width="34" height="28" rx="5"/>
  <text class="sm mono" x="55" y="265.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="76" y="247" width="34" height="28" rx="5"/>
  <text class="sm mono" x="93" y="265.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="114" y="247" width="34" height="28" rx="5"/>
  <text class="sm mono" x="131" y="265.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="310" y="247" width="34" height="28" rx="5"/>
  <text class="sm mono" x="327" y="265.3" text-anchor="middle" xml:space="preserve">)</text>
  <text class="sm blue-t" x="392" y="265.3" xml:space="preserve">按 E → error int 归约</text>
  <rect class="box" x="0" y="284" width="34" height="28" rx="5"/>
  <text class="sm mono" x="17" y="302.3" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="box" x="38" y="284" width="34" height="28" rx="5"/>
  <text class="sm mono" x="55" y="302.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="310" y="284" width="34" height="28" rx="5"/>
  <text class="sm mono" x="327" y="302.3" text-anchor="middle" xml:space="preserve">)</text>
  <text class="sm" x="392" y="302.3" xml:space="preserve">按 E → E + E 归约，随后正常分析</text>
  <rect class="box" x="0" y="321" width="34" height="28" rx="5"/>
  <text class="sm mono" x="17" y="339.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="310" y="321" width="34" height="28" rx="5"/>
  <text class="sm mono" x="327" y="339.3" text-anchor="middle" xml:space="preserve">+</text>
  <text class="sm" x="392" y="339.3" xml:space="preserve">移入 )，按 E → ( E ) 归约；读完 + 3 后接受</text>
</svg>
