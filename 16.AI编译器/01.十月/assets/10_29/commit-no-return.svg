<svg xmlns="http://www.w3.org/2000/svg" width="792" height="364" viewBox="-16 -16 792 364" role="img" aria-label="输入 int * int 的调用过程。E 依次调用 E_1、T、T_1。T_1 仅读取首个 int 就成功返回，T_2、T_3、E_2 均未调用，true 逐层返回。结束检查发现剩余 * int 而拒绝输入，但无法重新进入已经返回的 T。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="364" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="cnrrnA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cnrrnAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cnrrnBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="450" height="328" rx="10"/>
  <text class="lg" x="16" y="24" xml:space="preserve">实际调用：int * int</text>
  <line class="edge" x1="220" y1="66" x2="136" y2="96"/>
  <line class="edge" x1="136" y1="120" x2="136" y2="150"/>
  <line class="edge" x1="136" y1="174" x2="52" y2="204"/>
  <line class="ln-muted" x1="136" y1="174" x2="136" y2="204"/>
  <line class="ln-muted" x1="136" y1="174" x2="220" y2="204"/>
  <line class="ln-muted" x1="220" y1="66" x2="304" y2="96"/>
  <rect class="box" x="189" y="42" width="62" height="24" rx="6"/>
  <text class="mono" x="220" y="58.3" text-anchor="middle" xml:space="preserve">E()</text>
  <rect class="box" x="105" y="96" width="62" height="24" rx="6"/>
  <text class="mono" x="136" y="112.3" text-anchor="middle" xml:space="preserve">E_1()</text>
  <rect class="box" x="105" y="150" width="62" height="24" rx="6"/>
  <text class="mono" x="136" y="166.3" text-anchor="middle" xml:space="preserve">T()</text>
  <rect class="box-acc" x="21" y="204" width="62" height="24" rx="6"/>
  <text class="mono" x="52" y="220.3" text-anchor="middle" xml:space="preserve">T_1()</text>
  <rect class="box-dash" x="105" y="204" width="62" height="24" rx="6"/>
  <text class="mono" x="136" y="220.3" text-anchor="middle" xml:space="preserve">T_2()</text>
  <rect class="box-dash" x="189" y="204" width="62" height="24" rx="6"/>
  <text class="mono" x="220" y="220.3" text-anchor="middle" xml:space="preserve">T_3()</text>
  <rect class="box-dash" x="273" y="96" width="62" height="24" rx="6"/>
  <text class="mono" x="304" y="112.3" text-anchor="middle" xml:space="preserve">E_2()</text>
  <text class="sm acc-t" x="52" y="243" text-anchor="middle" xml:space="preserve">true</text>
  <text class="sm muted" x="136" y="243" text-anchor="middle" xml:space="preserve">未调用</text>
  <text class="sm muted" x="220" y="243" text-anchor="middle" xml:space="preserve">未调用</text>
  <text class="sm muted" x="304" y="136" text-anchor="middle" xml:space="preserve">未调用</text>
  <rect class="box-blue" x="16" y="252" width="44" height="24" rx="5"/>
  <text class="sm mono" x="38" y="268.3" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="box" x="64" y="252" width="44" height="24" rx="5"/>
  <text class="sm mono" x="86" y="268.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box" x="112" y="252" width="44" height="24" rx="5"/>
  <text class="sm mono" x="134" y="268.3" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="box" x="160" y="252" width="44" height="24" rx="5"/>
  <text class="sm mono" x="182" y="268.3" text-anchor="middle" xml:space="preserve">$</text>
  <line class="ln-acc" x1="86" y1="292" x2="86" y2="278" marker-end="url(#cnrrnAcc)"/>
  <text class="sm acc-t" x="94" y="293" xml:space="preserve">next</text>
  <text class="sm" x="220" y="262" xml:space="preserve">E() 返回 true</text>
  <text class="sm acc-t" x="220" y="280" xml:space="preserve">结束检查：剩余 * int，因此拒绝</text>
  <text class="sm muted" x="16" y="316" xml:space="preserve">输入符合文法，但错过了尝试 T_2 后成功的机会。</text>
  <rect class="box-blue" x="470" y="0" width="290" height="150" rx="10"/>
  <text class="lg" x="486" y="26" xml:space="preserve">该实现支持的回溯</text>
  <text class="sm" x="486" y="54" xml:space="preserve">候选分支返回 false 时</text>
  <text class="sm" x="486" y="72" xml:space="preserve">执行 next = save，再尝试下一候选。</text>
  <text class="sm" x="486" y="104" xml:space="preserve">例如：T_1 失败 → 尝试 T_2</text>
  <text class="sm blue-t" x="486" y="128" xml:space="preserve">范围：当前正在执行的函数内</text>
  <rect class="box-acc" x="470" y="168" width="290" height="160" rx="10"/>
  <text class="lg" x="486" y="194" xml:space="preserve">该实现不支持的回溯</text>
  <text class="sm" x="486" y="222" xml:space="preserve">已返回 true 的 T() 调用已经结束。</text>
  <text class="sm" x="486" y="240" xml:space="preserve">外层随后失败，也无法重新进入它。</text>
  <text class="sm" x="486" y="272" xml:space="preserve">例如：结束检查失败 → 尝试 T_2</text>
  <text class="sm acc-t" x="486" y="296" xml:space="preserve">范围：已返回的调用（不支持）</text>
</svg>
