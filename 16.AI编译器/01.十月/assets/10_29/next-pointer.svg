<svg xmlns="http://www.w3.org/2000/svg" width="792" height="350" viewBox="-16 -16 792 350" role="img" aria-label="按 E → T + E 分析输入 2 * 3 + 4 时 next 的变化。T() 读取 3 个词法单元，next 到达 3；term(PLUS) 读取 +，到达 4；右侧 E() 读取 4，到达 5。读取位置通过 next 传递，而不是通过返回值传递。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="350" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="nperA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="nperAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="nperBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="sm muted mono" x="205" y="12" text-anchor="middle" xml:space="preserve">[0]</text>
  <text class="sm muted mono" x="271" y="12" text-anchor="middle" xml:space="preserve">[1]</text>
  <text class="sm muted mono" x="337" y="12" text-anchor="middle" xml:space="preserve">[2]</text>
  <text class="sm muted mono" x="403" y="12" text-anchor="middle" xml:space="preserve">[3]</text>
  <text class="sm muted mono" x="469" y="12" text-anchor="middle" xml:space="preserve">[4]</text>
  <text class="sm muted mono" x="535" y="12" text-anchor="middle" xml:space="preserve">[5]</text>
  <text class="b" x="0" y="41" xml:space="preserve">开始</text>
  <rect class="box" x="176" y="22" width="58" height="28" rx="5"/>
  <text class="sm mono" x="205" y="40.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box" x="242" y="22" width="58" height="28" rx="5"/>
  <text class="sm mono" x="271" y="40.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box" x="308" y="22" width="58" height="28" rx="5"/>
  <text class="sm mono" x="337" y="40.3" text-anchor="middle" xml:space="preserve">3</text>
  <rect class="box" x="374" y="22" width="58" height="28" rx="5"/>
  <text class="sm mono" x="403" y="40.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="440" y="22" width="58" height="28" rx="5"/>
  <text class="sm mono" x="469" y="40.3" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="box" x="506" y="22" width="58" height="28" rx="5"/>
  <text class="sm mono" x="535" y="40.3" text-anchor="middle" xml:space="preserve">$</text>
  <line class="ln-acc" x1="205" y1="68" x2="205" y2="52" marker-end="url(#nperAcc)"/>
  <text class="sm acc-t" x="213" y="68" xml:space="preserve">next</text>
  <text class="b" x="0" y="107" xml:space="preserve">T() 返回后</text>
  <rect class="box-blue" x="176" y="88" width="58" height="28" rx="5"/>
  <text class="sm mono" x="205" y="106.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-blue" x="242" y="88" width="58" height="28" rx="5"/>
  <text class="sm mono" x="271" y="106.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box-blue" x="308" y="88" width="58" height="28" rx="5"/>
  <text class="sm mono" x="337" y="106.3" text-anchor="middle" xml:space="preserve">3</text>
  <rect class="box" x="374" y="88" width="58" height="28" rx="5"/>
  <text class="sm mono" x="403" y="106.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="440" y="88" width="58" height="28" rx="5"/>
  <text class="sm mono" x="469" y="106.3" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="box" x="506" y="88" width="58" height="28" rx="5"/>
  <text class="sm mono" x="535" y="106.3" text-anchor="middle" xml:space="preserve">$</text>
  <line class="ln-acc" x1="403" y1="134" x2="403" y2="118" marker-end="url(#nperAcc)"/>
  <text class="sm acc-t" x="411" y="134" xml:space="preserve">next</text>
  <text class="sm" x="586" y="107" xml:space="preserve">T 读取 3 个词法单元</text>
  <text class="sm" x="586" y="124" xml:space="preserve">前进 3 格</text>
  <text class="b" x="0" y="173" xml:space="preserve">term(PLUS) 之后</text>
  <rect class="box-blue" x="176" y="154" width="58" height="28" rx="5"/>
  <text class="sm mono" x="205" y="172.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-blue" x="242" y="154" width="58" height="28" rx="5"/>
  <text class="sm mono" x="271" y="172.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box-blue" x="308" y="154" width="58" height="28" rx="5"/>
  <text class="sm mono" x="337" y="172.3" text-anchor="middle" xml:space="preserve">3</text>
  <rect class="box-blue" x="374" y="154" width="58" height="28" rx="5"/>
  <text class="sm mono" x="403" y="172.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="440" y="154" width="58" height="28" rx="5"/>
  <text class="sm mono" x="469" y="172.3" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="box" x="506" y="154" width="58" height="28" rx="5"/>
  <text class="sm mono" x="535" y="172.3" text-anchor="middle" xml:space="preserve">$</text>
  <line class="ln-acc" x1="469" y1="200" x2="469" y2="184" marker-end="url(#nperAcc)"/>
  <text class="sm acc-t" x="477" y="200" xml:space="preserve">next</text>
  <text class="sm" x="586" y="173" xml:space="preserve">读取 +</text>
  <text class="sm" x="586" y="190" xml:space="preserve">前进 1 格</text>
  <text class="b" x="0" y="239" xml:space="preserve">E() 返回后</text>
  <rect class="box-blue" x="176" y="220" width="58" height="28" rx="5"/>
  <text class="sm mono" x="205" y="238.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-blue" x="242" y="220" width="58" height="28" rx="5"/>
  <text class="sm mono" x="271" y="238.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box-blue" x="308" y="220" width="58" height="28" rx="5"/>
  <text class="sm mono" x="337" y="238.3" text-anchor="middle" xml:space="preserve">3</text>
  <rect class="box-blue" x="374" y="220" width="58" height="28" rx="5"/>
  <text class="sm mono" x="403" y="238.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-blue" x="440" y="220" width="58" height="28" rx="5"/>
  <text class="sm mono" x="469" y="238.3" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="box" x="506" y="220" width="58" height="28" rx="5"/>
  <text class="sm mono" x="535" y="238.3" text-anchor="middle" xml:space="preserve">$</text>
  <line class="ln-acc" x1="535" y1="266" x2="535" y2="250" marker-end="url(#nperAcc)"/>
  <text class="sm acc-t" x="543" y="266" xml:space="preserve">next</text>
  <text class="sm" x="586" y="239" xml:space="preserve">E 读取剩余输入</text>
  <text class="sm" x="586" y="256" xml:space="preserve">到达末尾</text>
  <text class="b" x="0" y="296" xml:space="preserve">T() 不返回读取的数量。下一个函数只需从 next 指向的位置继续读取。</text>
  <text class="sm muted" x="0" y="314" xml:space="preserve">本图假定 T() 正确选择了 int * T。按课件顺序实现时的实际行为见 §6.1。</text>
</svg>
