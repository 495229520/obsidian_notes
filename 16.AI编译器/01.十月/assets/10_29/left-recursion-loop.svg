<svg xmlns="http://www.w3.org/2000/svg" width="792" height="372" viewBox="-16 -16 792 372" role="img" aria-label="消除左递归前后的执行过程。直接实现 S → S a 时，S 与 S_1 未读取任何词法单元就相互调用，最终栈溢出。原文实测在 -O0 下，S_1 调用 261,926 次后触发 SIGSEGV，next 未移动。改为 S → b S&#x27; 后，每次递归调用前先读取词法单元，在输入末尾结束。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="372" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="lrlopA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="lrlopAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="lrlopBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="370" height="336" rx="10"/>
  <rect class="box" x="390" y="0" width="370" height="336" rx="10"/>
  <text class="lg" x="16" y="26" xml:space="preserve">消除前：S → S a</text>
  <text class="lg" x="406" y="26" xml:space="preserve">消除后：S → b S'     S' → a S' | ε</text>
  <rect class="box-acc" x="30" y="44" width="86" height="30" rx="6"/>
  <text class="sm mono" x="73" y="63.5" text-anchor="middle" xml:space="preserve">S()</text>
  <text class="sm muted mono" x="130" y="63.5" xml:space="preserve">next = 0</text>
  <line class="ln" x1="73" y1="75" x2="73" y2="89" marker-end="url(#lrlopA)"/>
  <rect class="box" x="30" y="90" width="86" height="30" rx="6"/>
  <text class="sm mono" x="73" y="109.5" text-anchor="middle" xml:space="preserve">S_1()</text>
  <text class="sm muted mono" x="130" y="109.5" xml:space="preserve">next = 0</text>
  <line class="ln" x1="73" y1="121" x2="73" y2="135" marker-end="url(#lrlopA)"/>
  <rect class="box-acc" x="30" y="136" width="86" height="30" rx="6"/>
  <text class="sm mono" x="73" y="155.5" text-anchor="middle" xml:space="preserve">S()</text>
  <text class="sm muted mono" x="130" y="155.5" xml:space="preserve">next = 0</text>
  <line class="ln" x1="73" y1="167" x2="73" y2="181" marker-end="url(#lrlopA)"/>
  <rect class="box" x="30" y="182" width="86" height="30" rx="6"/>
  <text class="sm mono" x="73" y="201.5" text-anchor="middle" xml:space="preserve">S_1()</text>
  <text class="sm muted mono" x="130" y="201.5" xml:space="preserve">next = 0</text>
  <line class="ln-acc-dash" x1="73" y1="213" x2="73" y2="234" marker-end="url(#lrlopAcc)"/>
  <text class="sm acc-t" x="90" y="232" xml:space="preserve">无限重复</text>
  <text class="sm muted" x="284" y="82" text-anchor="middle" xml:space="preserve">S_1() 的第二步</text>
  <rect class="box-bad" x="214" y="90" width="140" height="62" rx="8"/>
  <text class="sm mono" x="284" y="112" text-anchor="middle" xml:space="preserve">term(a)</text>
  <text class="sm acc-t" x="284" y="132" text-anchor="middle" xml:space="preserve">无法执行到这里</text>
  <text class="sm" x="16" y="266" xml:space="preserve">尚未读取词法单元，就再次调用自身。</text>
  <text class="sm" x="16" y="290" xml:space="preserve">实测（-O0，8MB 栈）：S_1 调用 261,926 次后</text>
  <text class="sm acc-t" x="16" y="308" xml:space="preserve">触发 SIGSEGV，next 未移动。</text>
  <rect class="box-acc" x="420" y="44" width="72" height="30" rx="6"/>
  <text class="sm mono" x="456" y="63.5" text-anchor="middle" xml:space="preserve">S()</text>
  <line class="ln" x1="493" y1="59" x2="520" y2="59" marker-end="url(#lrlopA)"/>
  <rect class="box-blue" x="522" y="44" width="84" height="30" rx="6"/>
  <text class="sm mono" x="564" y="63.5" text-anchor="middle" xml:space="preserve">term(b)</text>
  <text class="sm blue-t mono" x="620" y="63.5" xml:space="preserve">next = 1</text>
  <line class="ln" x1="456" y1="75" x2="456" y2="89" marker-end="url(#lrlopA)"/>
  <rect class="box" x="420" y="90" width="72" height="30" rx="6"/>
  <text class="sm mono" x="456" y="109.5" text-anchor="middle" xml:space="preserve">S'()</text>
  <line class="ln" x1="493" y1="105" x2="520" y2="105" marker-end="url(#lrlopA)"/>
  <rect class="box-blue" x="522" y="90" width="84" height="30" rx="6"/>
  <text class="sm mono" x="564" y="109.5" text-anchor="middle" xml:space="preserve">term(a)</text>
  <text class="sm blue-t mono" x="620" y="109.5" xml:space="preserve">next = 2</text>
  <line class="ln" x1="456" y1="121" x2="456" y2="135" marker-end="url(#lrlopA)"/>
  <rect class="box" x="420" y="136" width="72" height="30" rx="6"/>
  <text class="sm mono" x="456" y="155.5" text-anchor="middle" xml:space="preserve">S'()</text>
  <line class="ln" x1="493" y1="151" x2="520" y2="151" marker-end="url(#lrlopA)"/>
  <rect class="box-blue" x="522" y="136" width="84" height="30" rx="6"/>
  <text class="sm mono" x="564" y="155.5" text-anchor="middle" xml:space="preserve">term(a)</text>
  <text class="sm blue-t mono" x="620" y="155.5" xml:space="preserve">next = 3</text>
  <line class="ln" x1="456" y1="167" x2="456" y2="181" marker-end="url(#lrlopA)"/>
  <rect class="box" x="420" y="182" width="72" height="30" rx="6"/>
  <text class="sm mono" x="456" y="201.5" text-anchor="middle" xml:space="preserve">S'()</text>
  <line class="ln" x1="493" y1="197" x2="520" y2="197" marker-end="url(#lrlopA)"/>
  <rect class="box-blue" x="522" y="182" width="84" height="30" rx="6"/>
  <text class="sm" x="564" y="201.5" text-anchor="middle" xml:space="preserve">ε，返回</text>
  <text class="sm blue-t mono" x="620" y="201.5" xml:space="preserve">next = 3</text>
  <text class="sm" x="406" y="266" xml:space="preserve">输入 b a a，每次递归调用前先读取词法单元。</text>
  <text class="sm blue-t" x="406" y="290" xml:space="preserve">输入有限，因此递归最终会结束。</text>
  <text class="sm muted" x="406" y="308" xml:space="preserve">条件：α 不能推导出空串。</text>
</svg>
