<svg xmlns="http://www.w3.org/2000/svg" width="792" height="248" viewBox="-16 -16 792 248" role="img" aria-label="工作线程循环：加锁、检查条件、等待并重新检查、判断退出条件、取出任务、解锁、执行；从加锁到取出任务期间一直持锁">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .guard { fill: none; stroke: #D97757; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .band { fill: #F5DDD1; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.5; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="248" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="wlA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <line class="ln-acc" x1="16" y1="22" x2="526" y2="22"/>
  <line class="ln-acc" x1="16" y1="16" x2="16" y2="28"/><line class="ln-acc" x1="526" y1="16" x2="526" y2="28"/>
  <text x="271" y="14" text-anchor="middle" class="sm acc-t" style="font-family: Microsoft YaHei, sans-serif">持锁区间</text>
  <line class="ln-muted" x1="556" y1="22" x2="750" y2="22"/>
  <text x="653" y="14" text-anchor="middle" class="sm muted" style="font-family: Microsoft YaHei, sans-serif">锁外 · 并行执行</text>

  <rect class="box" x="16" y="40" width="100" height="44" rx="6"/><text x="66" y="67" text-anchor="middle" style="font-family: Microsoft YaHei, sans-serif">获取锁</text>
  <rect class="box" x="146" y="40" width="110" height="44" rx="6"/><text x="201" y="67" text-anchor="middle" class="mono sm" style="font-family: Microsoft YaHei, sans-serif">pred() 为真？</text>
  <rect class="box" x="286" y="40" width="130" height="44" rx="6"/><text x="351" y="60" text-anchor="middle" class="mono sm">stopping &amp;&amp;</text><text x="351" y="75" text-anchor="middle" class="mono sm">empty() ?</text>
  <rect class="box" x="446" y="40" width="80" height="44" rx="6"/><text x="486" y="67" text-anchor="middle" class="mono sm">pop</text>
  <rect class="box" x="556" y="40" width="80" height="44" rx="6"/><text x="596" y="67" text-anchor="middle" class="mono sm">unlock</text>
  <rect class="box-acc" x="666" y="40" width="84" height="44" rx="6"/><text x="708" y="67" text-anchor="middle" class="mono sm">task()</text>

  <line class="ln" x1="116" y1="62" x2="142" y2="62" marker-end="url(#wlA)"/>
  <line class="ln" x1="256" y1="62" x2="282" y2="62" marker-end="url(#wlA)"/>
  <text x="269" y="56" text-anchor="middle" class="sm" style="font-family: Microsoft YaHei, sans-serif">真</text>
  <line class="ln" x1="416" y1="62" x2="442" y2="62" marker-end="url(#wlA)"/>
  <text x="431" y="56" text-anchor="middle" class="sm" style="font-family: Microsoft YaHei, sans-serif">否</text>
  <line class="ln" x1="526" y1="62" x2="552" y2="62" marker-end="url(#wlA)"/>
  <line class="ln" x1="636" y1="62" x2="662" y2="62" marker-end="url(#wlA)"/>

  <rect class="box-blue" x="146" y="128" width="110" height="40" rx="6"/><text x="201" y="152" text-anchor="middle" class="sm" style="font-family: Microsoft YaHei, sans-serif">wait：解锁并阻塞</text>
  <line class="ln" x1="186" y1="84" x2="186" y2="124" marker-end="url(#wlA)"/>
  <text x="180" y="110" text-anchor="end" class="sm" style="font-family: Microsoft YaHei, sans-serif">假</text>
  <line class="ln" x1="216" y1="128" x2="216" y2="88" marker-end="url(#wlA)"/>
  <text x="222" y="110" class="sm" style="font-family: Microsoft YaHei, sans-serif">醒来后重新加锁、检查</text>

  <rect class="box-dash" x="301" y="128" width="100" height="40" rx="6"/><text x="351" y="152" text-anchor="middle" class="mono sm">return</text>
  <line class="ln" x1="371" y1="84" x2="371" y2="124" marker-end="url(#wlA)"/>
  <text x="378" y="110" class="sm" style="font-family: Microsoft YaHei, sans-serif">是</text>

  <polyline class="ln" points="708,84 708,196 66,196 66,88" marker-end="url(#wlA)"/>
  <text x="560" y="190" text-anchor="middle" class="sm muted" style="font-family: Microsoft YaHei, sans-serif">下一个任务</text>
    </svg>
