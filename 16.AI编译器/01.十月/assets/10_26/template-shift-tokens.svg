<svg xmlns="http://www.w3.org/2000/svg" width="792" height="208" viewBox="-16 -16 792 208" role="img" aria-label="C++03 将 &gt;&gt; 识别为一个右移 Token，语法分析器因缺少两个右尖括号而报错；C++11 在模板实参上下文中将其拆成两个 &gt;，依次闭合内外层模板">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .guard { fill: none; stroke: #D97757; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .band { fill: #F5DDD1; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.5; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="208" fill="rgb(245, 244, 237)"/>
  <text x="20" y="52" class="lg">C++03</text>
  <g class="mono">
    <rect class="box" x="130" y="30" width="50" height="34" rx="4"/><text x="155" y="52" text-anchor="middle">Foo</text>
    <rect class="box" x="186" y="30" width="30" height="34" rx="4"/><text x="201" y="52" text-anchor="middle">&lt;</text>
    <rect class="box" x="222" y="30" width="50" height="34" rx="4"/><text x="247" y="52" text-anchor="middle">Bar</text>
    <rect class="box" x="278" y="30" width="30" height="34" rx="4"/><text x="293" y="52" text-anchor="middle">&lt;</text>
    <rect class="box" x="314" y="30" width="56" height="34" rx="4"/><text x="342" y="52" text-anchor="middle">Bazz</text>
    <rect class="box-acc" x="376" y="30" width="66" height="34" rx="4"/><text x="409" y="52" text-anchor="middle" class="lg">&gt;&gt;</text>
  </g>
  <text x="470" y="44" class="sm" style="font-family: Microsoft YaHei, sans-serif">词法分析：最长匹配得到一个右移运算符</text>
  <text x="470" y="62" class="sm acc-t" style="font-family: Microsoft YaHei, sans-serif">语法分析：需要两个 '&gt;' → 语法错误</text>

  <text x="20" y="122" class="lg">C++11</text>
  <g class="mono">
    <rect class="box" x="130" y="100" width="50" height="34" rx="4"/><text x="155" y="122" text-anchor="middle">Foo</text>
    <rect class="box" x="186" y="100" width="30" height="34" rx="4"/><text x="201" y="122" text-anchor="middle">&lt;</text>
    <rect class="box" x="222" y="100" width="50" height="34" rx="4"/><text x="247" y="122" text-anchor="middle">Bar</text>
    <rect class="box" x="278" y="100" width="30" height="34" rx="4"/><text x="293" y="122" text-anchor="middle">&lt;</text>
    <rect class="box" x="314" y="100" width="56" height="34" rx="4"/><text x="342" y="122" text-anchor="middle">Bazz</text>
    <rect class="box-blue" x="376" y="100" width="30" height="34" rx="4"/><text x="391" y="122" text-anchor="middle">&gt;</text>
    <rect class="box-blue" x="412" y="100" width="30" height="34" rx="4"/><text x="427" y="122" text-anchor="middle">&gt;</text>
  </g>
  <polyline class="ln-blue" points="293,134 293,146 391,146 391,134"/>
  <polyline class="ln-blue" points="201,134 201,160 427,160 427,134"/>
  <text x="470" y="114" class="sm" style="font-family: Microsoft YaHei, sans-serif">在模板实参上下文中</text>
  <text x="470" y="132" class="sm blue-t" style="font-family: Microsoft YaHei, sans-serif">把 '&gt;&gt;' 拆成两个 '&gt;' 处理</text>
    </svg>
