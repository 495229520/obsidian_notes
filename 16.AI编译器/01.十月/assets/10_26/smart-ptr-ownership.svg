<svg xmlns="http://www.w3.org/2000/svg" width="792" height="268" viewBox="-16 -16 792 268" role="img" aria-label="unique_ptr 独占对象，移动后原指针为空；两个 shared_ptr 共用控制块，图中有两个强引用和一个弱引用；make_shared 合并分配对象与控制块">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .guard { fill: none; stroke: #D97757; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .band { fill: #F5DDD1; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.5; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="268" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="spA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="20" y="22" class="lg">unique_ptr</text>
  <rect class="box" x="20" y="42" width="130" height="34" rx="6"/><text x="85" y="64" text-anchor="middle" class="mono sm">u</text>
  <rect class="box-acc" x="220" y="42" width="120" height="34" rx="6"/><text x="280" y="64" text-anchor="middle" class="mono sm">Widget{11}</text>
  <line class="ln" x1="150" y1="59" x2="216" y2="59" marker-end="url(#spA)"/>
  <text x="183" y="52" text-anchor="middle" class="sm" style="font-family: Microsoft YaHei, sans-serif">持有</text>

  <text x="20" y="112" class="sm muted" style="font-family: Microsoft YaHei, sans-serif">执行 auto tmp = std::move(u); 后</text>
  <rect class="box-dash" x="20" y="124" width="130" height="34" rx="6"/><text x="85" y="146" text-anchor="middle" class="mono sm muted">u == nullptr</text>
  <rect class="box" x="20" y="170" width="130" height="34" rx="6"/><text x="85" y="192" text-anchor="middle" class="mono sm">tmp</text>
  <rect class="box-acc" x="220" y="170" width="120" height="34" rx="6"/><text x="280" y="192" text-anchor="middle" class="mono sm">Widget{11}</text>
  <line class="ln" x1="150" y1="187" x2="216" y2="187" marker-end="url(#spA)"/>
  <text x="183" y="180" text-anchor="middle" class="sm" style="font-family: Microsoft YaHei, sans-serif">持有</text>

  <line class="ln-muted" x1="372" y1="16" x2="372" y2="220"/>

  <text x="400" y="22" class="lg">shared_ptr / weak_ptr</text>
  <rect class="box" x="400" y="42" width="100" height="32" rx="6"/><text x="450" y="63" text-anchor="middle" class="mono sm">p1</text>
  <rect class="box" x="400" y="86" width="100" height="32" rx="6"/><text x="450" y="107" text-anchor="middle" class="mono sm">p2 = p1</text>
  <rect class="box-dash" x="400" y="150" width="100" height="32" rx="6"/><text x="450" y="171" text-anchor="middle" class="mono sm">weak_ptr w</text>

  <rect class="guard" x="550" y="34" width="196" height="166" rx="10"/>
  <rect class="box-blue" x="562" y="46" width="172" height="78" rx="6"/>
  <text x="648" y="68" text-anchor="middle" class="sm" style="font-family: Microsoft YaHei, sans-serif">控制块</text>
  <text x="648" y="90" text-anchor="middle" class="mono sm" style="font-family: Microsoft YaHei, sans-serif">强引用 = 2</text>
  <text x="648" y="110" text-anchor="middle" class="mono sm" style="font-family: Microsoft YaHei, sans-serif">弱引用 = 1</text>
  <rect class="box-acc" x="562" y="140" width="172" height="34" rx="6"/><text x="648" y="162" text-anchor="middle" class="mono sm">Widget{100}</text>
  <text x="648" y="194" text-anchor="middle" class="sm acc-t" style="font-family: Microsoft YaHei, sans-serif">make_shared：合并分配</text>

  <line class="ln" x1="500" y1="58" x2="558" y2="70" marker-end="url(#spA)"/>
  <line class="ln" x1="500" y1="102" x2="558" y2="90" marker-end="url(#spA)"/>
  <line class="ln-dash" x1="500" y1="166" x2="558" y2="112" marker-end="url(#spA)"/>
  <text x="400" y="216" class="sm muted" style="font-family: Microsoft YaHei, sans-serif">强引用归零时析构对象；弱引用也归零后释放控制块</text>
    </svg>
