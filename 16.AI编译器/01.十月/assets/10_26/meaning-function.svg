<svg xmlns="http://www.w3.org/2000/svg" width="792" height="284" viewBox="-16 -16 792 284" role="img" aria-label="语义函数 L 可以把不同正则表达式映射到同一个字符串集合；0*、(0*)*、(0+ε)0* 都表示仅由 0 组成的字符串，a+b 与 b+a 都表示集合 {a,b}">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .guard { fill: none; stroke: #D97757; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .band { fill: #F5DDD1; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.5; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="284" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="mfA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="125" y="20" text-anchor="middle" class="muted" style="font-family: Microsoft YaHei, sans-serif">语法 · 表达式</text>
  <text x="380" y="20" text-anchor="middle" class="acc-t lg">L</text>
  <text x="610" y="20" text-anchor="middle" class="muted" style="font-family: Microsoft YaHei, sans-serif">语义 · 字符串集合</text>

  <rect class="box" x="40" y="36" width="170" height="32" rx="6"/><text x="125" y="57" text-anchor="middle" class="mono">0*</text>
  <rect class="box" x="40" y="80" width="170" height="32" rx="6"/><text x="125" y="101" text-anchor="middle" class="mono">(0*)*</text>
  <rect class="box" x="40" y="124" width="170" height="32" rx="6"/><text x="125" y="145" text-anchor="middle" class="mono">(0+ε)0*</text>
  <rect class="box" x="40" y="172" width="170" height="32" rx="6"/><text x="125" y="193" text-anchor="middle" class="mono">a + b</text>
  <rect class="box" x="40" y="212" width="170" height="32" rx="6"/><text x="125" y="233" text-anchor="middle" class="mono">b + a</text>

  <rect class="box-acc" x="490" y="71" width="240" height="50" rx="8"/><text x="610" y="101" text-anchor="middle" class="mono">{ ε, 0, 00, 000, … }</text>
  <rect class="box-acc" x="490" y="183" width="240" height="50" rx="8"/><text x="610" y="213" text-anchor="middle" class="mono">{ a, b }</text>

  <line class="ln" x1="210" y1="52" x2="486" y2="88" marker-end="url(#mfA)"/>
  <line class="ln" x1="210" y1="96" x2="486" y2="96" marker-end="url(#mfA)"/>
  <line class="ln" x1="210" y1="140" x2="486" y2="104" marker-end="url(#mfA)"/>
  <line class="ln" x1="210" y1="188" x2="486" y2="203" marker-end="url(#mfA)"/>
  <line class="ln" x1="210" y1="228" x2="486" y2="213" marker-end="url(#mfA)"/>
  <text x="380" y="160" text-anchor="middle" class="sm muted" style="font-family: Microsoft YaHei, sans-serif">多个表达式 → 同一集合（允许）</text>
    </svg>
