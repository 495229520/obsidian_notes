<svg xmlns="http://www.w3.org/2000/svg" width="792" height="182" viewBox="-16 -16 792 182" role="img" aria-label="Parent 通过 shared_ptr 持有 Child，Child 通过 weak_ptr 观察 Parent；离开作用域时局部变量 child、parent 依次析构，对象则先析构 Parent，再析构 Child">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .guard { fill: none; stroke: #D97757; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .band { fill: #F5DDD1; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.5; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="182" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="cyA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="20" y="20" class="sm muted" style="font-family: Microsoft YaHei, sans-serif">局部变量</text>
  <rect class="box" x="20" y="30" width="110" height="32" rx="6"/><text x="75" y="51" text-anchor="middle" class="mono sm">parent</text>
  <rect class="box" x="20" y="100" width="110" height="32" rx="6"/><text x="75" y="121" text-anchor="middle" class="mono sm">child</text>
  <rect class="box-acc" x="220" y="30" width="170" height="32" rx="6"/><text x="305" y="51" text-anchor="middle" class="sm" style="font-family: Microsoft YaHei, sans-serif">Parent · 强引用 1</text>
  <rect class="box-acc" x="220" y="100" width="170" height="32" rx="6"/><text x="305" y="121" text-anchor="middle" class="sm" style="font-family: Microsoft YaHei, sans-serif">Child · 强引用 2</text>
  <line class="ln" x1="130" y1="46" x2="216" y2="46" marker-end="url(#cyA)"/>
  <line class="ln" x1="130" y1="116" x2="216" y2="116" marker-end="url(#cyA)"/>
  <line class="ln" x1="270" y1="62" x2="270" y2="96" marker-end="url(#cyA)"/>
  <text x="264" y="84" text-anchor="end" class="mono sm">child_</text>
  <line class="ln-dash" x1="340" y1="100" x2="340" y2="66" marker-end="url(#cyA)"/>
  <text x="346" y="84" class="mono sm" style="font-family: Microsoft YaHei, sans-serif">parent_（弱引用）</text>

  <text x="460" y="30" class="sm lg" style="font-family: Microsoft YaHei, sans-serif">离开作用域时</text>
  <text x="460" y="54" class="sm" style="font-family: Microsoft YaHei, sans-serif">1. child 析构 → Child 强引用 2→1</text>
  <text x="460" y="76" class="sm" style="font-family: Microsoft YaHei, sans-serif">2. parent 析构 → Parent 强引用 1→0</text>
  <text x="474" y="94" class="sm acc-t" style="font-family: Microsoft YaHei, sans-serif">输出“Parent 析构”，释放 child_</text>
  <text x="460" y="116" class="sm" style="font-family: Microsoft YaHei, sans-serif">3. Child 强引用 1→0</text>
  <text x="474" y="134" class="sm acc-t" style="font-family: Microsoft YaHei, sans-serif">输出“Child 析构”</text>
    </svg>
