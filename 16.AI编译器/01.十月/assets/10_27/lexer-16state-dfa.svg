<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="780" viewBox="-16 -16 1020 780" role="img" aria-label="图一词法分析器子集构造得到的完整 DFA（16 个状态）">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Arial, sans-serif; font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', monospace; }
    .sm { font-size: 10.5px; }
    .xs { font-size: 9.5px; }
    .lg { font-size: 14px; font-weight: 700; }
    .title { font-size: 17px; font-weight: 700; fill: #141413; }
    .subtitle { font-size: 12px; fill: #6F6D66; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; font-weight: 600; }
    .blue-t { fill: #4F7FAF; font-weight: 600; }
    
    /* 容器与状态节点样式（完全对齐 subset-dfa.svg） */
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .box-err { fill: #FBEAE8; stroke: #D9534F; stroke-width: 1.4; }
    .ring-err { fill: none; stroke: #D9534F; stroke-width: 1.2; }
    .lane-box { fill: none; stroke: #D5D3CB; stroke-width: 1; stroke-dasharray: 4 4; rx: 8; }
    
    /* 转移连线样式 */
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.5; fill: none; }
    .ln-muted { stroke: #8C897F; stroke-width: 1.2; fill: none; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-err { fill: #D9534F; }
  </style>

  <rect x="-16" y="-16" width="1020" height="780" rx="14" fill="#F0EEE6"/>

  <defs>
    <marker id="sdA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="sdAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-acc" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="sdAErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-err" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- 顶部标题栏 -->
  <text x="10" y="16" class="title">图一词法分析器子集构造结果（完整 16 个 DFA 状态）</text>
  <text x="10" y="36" class="subtitle">由 8 条正则规则对应的 41 状态 NFA 经子集构造生成 · 橙底双框为接受状态 (含 Token 判定)</text>

  <!-- ==================== D0 起始状态 ==================== -->
  <g id="node-D0">
    <rect class="box" x="10" y="340" width="130" height="54" rx="8"/>
    <text x="75" y="362" text-anchor="middle" class="lg">D0</text>
    <text x="75" y="377" text-anchor="middle" class="mono xs muted">尚未读取字符</text>
    <text x="75" y="389" text-anchor="middle" class="xs muted">（非接受状态）</text>
    <!-- Start arrow -->
    <line class="ln" x1="-10" y1="367" x2="8" y2="367" marker-end="url(#sdA)"/>
  </g>

  <!-- ==================== 分支 1：关键字与标识符 (IF / ID) ==================== -->
  <text x="210" y="60" class="sm muted" font-weight="600">分支 ①：关键字与标识符 (Keyword &amp; Identifier)</text>

  <!-- D1 节点 -->
  <g id="node-D1">
    <rect class="box-acc" x="210" y="72" width="135" height="54" rx="8"/>
    <rect class="ring" x="214" y="76" width="127" height="46" rx="6"/>
    <text x="277" y="93" text-anchor="middle" class="lg">D1</text>
    <text x="277" y="108" text-anchor="middle" class="mono xs">读入 'i'</text>
    <text x="277" y="120" text-anchor="middle" class="xs acc-t">【接受：ID】</text>
  </g>

  <!-- D2 节点 -->
  <g id="node-D2">
    <rect class="box-acc" x="210" y="146" width="135" height="54" rx="8"/>
    <rect class="ring" x="214" y="150" width="127" height="46" rx="6"/>
    <text x="277" y="167" text-anchor="middle" class="lg">D2</text>
    <text x="277" y="182" text-anchor="middle" class="mono xs">除 'i' 外的字母</text>
    <text x="277" y="194" text-anchor="middle" class="xs acc-t">【接受：ID】</text>
  </g>

  <!-- D9 节点 -->
  <g id="node-D9">
    <rect class="box-acc" x="460" y="72" width="135" height="54" rx="8"/>
    <rect class="ring" x="464" y="76" width="127" height="46" rx="6"/>
    <text x="527" y="93" text-anchor="middle" class="lg">D9</text>
    <text x="527" y="108" text-anchor="middle" class="mono xs">读入 "if"</text>
    <text x="527" y="120" text-anchor="middle" class="xs acc-t">【接受：IF (优先级高)】</text>
  </g>

  <!-- D8 节点 -->
  <g id="node-D8">
    <rect class="box-acc" x="720" y="110" width="135" height="54" rx="8"/>
    <rect class="ring" x="724" y="114" width="127" height="46" rx="6"/>
    <text x="787" y="131" text-anchor="middle" class="lg">D8</text>
    <text x="787" y="146" text-anchor="middle" class="mono xs">标识符后续字符</text>
    <text x="787" y="158" text-anchor="middle" class="xs acc-t">【接受：ID】</text>
  </g>

  <!-- 分支 1 连线 -->
  <!-- D0 -> D1 ('i') -->
  <path class="ln" d="M 140,345 C 160,240 170,120 208,103" marker-end="url(#sdA)"/>
  <text x="160" y="185" class="mono lg">i</text>

  <!-- D0 -> D2 ('a-z' 除i) -->
  <path class="ln" d="M 140,352 C 165,280 175,200 208,178" marker-end="url(#sdA)"/>
  <text x="165" y="235" class="mono sm">f, a-z</text>

  <!-- D1 -> D9 ('f') -->
  <line class="ln" x1="345" y1="99" x2="458" y2="99" marker-end="url(#sdA)"/>
  <text x="400" y="93" text-anchor="middle" class="mono lg">f</text>

  <!-- D1 -> D8 ('i', 'a-z', '0-9') -->
  <path class="ln" d="M 345,85 C 440,40 640,40 730,108" marker-end="url(#sdA)"/>
  <text x="530" y="52" text-anchor="middle" class="mono xs">i, a-z, 0-9</text>

  <!-- D2 -> D8 ('i', 'f', 'a-z', '0-9') -->
  <path class="ln" d="M 345,173 C 480,185 620,180 718,148" marker-end="url(#sdA)"/>
  <text x="530" y="188" text-anchor="middle" class="mono xs">i, f, a-z, 0-9</text>

  <!-- D9 -> D8 ('i', 'f', 'a-z', '0-9' 最长匹配续读为ID如 if8) -->
  <line class="ln" x1="595" y1="108" x2="718" y2="128" marker-end="url(#sdA)"/>
  <text x="655" y="112" text-anchor="middle" class="mono xs">i,f,a-z,0-9 (如 if8)</text>

  <!-- D8 自环 -->
  <path class="ln" d="M 855,125 C 910,105 910,160 857,145" marker-end="url(#sdA)"/>
  <text x="918" y="135" class="mono xs">i, f, a-z, 0-9</text>


  <!-- ==================== 分支 2：数字 (NUM) ==================== -->
  <text x="210" y="232" class="sm muted" font-weight="600">分支 ②：数字 (NUM，整数与浮点数)</text>

  <!-- D3 节点 -->
  <g id="node-D3">
    <rect class="box-acc" x="210" y="244" width="130" height="54" rx="8"/>
    <rect class="ring" x="214" y="248" width="122" height="46" rx="6"/>
    <text x="275" y="265" text-anchor="middle" class="lg">D3</text>
    <text x="275" y="280" text-anchor="middle" class="mono xs">首位数字</text>
    <text x="275" y="292" text-anchor="middle" class="xs acc-t">【接受：NUM】</text>
  </g>

  <!-- D10 节点 -->
  <g id="node-D10">
    <rect class="box-acc" x="420" y="244" width="130" height="54" rx="8"/>
    <rect class="ring" x="424" y="248" width="122" height="46" rx="6"/>
    <text x="485" y="265" text-anchor="middle" class="lg">D10</text>
    <text x="485" y="280" text-anchor="middle" class="mono xs">整数多位自环</text>
    <text x="485" y="292" text-anchor="middle" class="xs acc-t">【接受：NUM】</text>
  </g>

  <!-- D11 节点 -->
  <g id="node-D11">
    <rect class="box" x="630" y="244" width="130" height="54" rx="8"/>
    <text x="695" y="265" text-anchor="middle" class="lg">D11</text>
    <text x="695" y="280" text-anchor="middle" class="mono xs">读到小数点 '.'</text>
    <text x="695" y="292" text-anchor="middle" class="xs muted">（非接受：等待小数）</text>
  </g>

  <!-- D15 节点 -->
  <g id="node-D15">
    <rect class="box-acc" x="840" y="244" width="130" height="54" rx="8"/>
    <rect class="ring" x="844" y="248" width="122" height="46" rx="6"/>
    <text x="905" y="265" text-anchor="middle" class="lg">D15</text>
    <text x="905" y="280" text-anchor="middle" class="mono xs">小数部分自环</text>
    <text x="905" y="292" text-anchor="middle" class="xs acc-t">【接受：NUM】</text>
  </g>

  <!-- 分支 2 连线 -->
  <!-- D0 -> D3 ('0-9') -->
  <path class="ln" d="M 140,360 C 165,330 180,285 208,274" marker-end="url(#sdA)"/>
  <text x="175" y="305" class="mono lg">0-9</text>

  <!-- D3 -> D10 ('0-9') -->
  <line class="ln" x1="340" y1="271" x2="418" y2="271" marker-end="url(#sdA)"/>
  <text x="380" y="265" text-anchor="middle" class="mono lg">0-9</text>

  <!-- D10 自环 ('0-9') -->
  <path class="ln" d="M 465,244 C 465,215 505,215 505,242" marker-end="url(#sdA)"/>
  <text x="485" y="210" text-anchor="middle" class="mono xs">0-9</text>

  <!-- D3 -> D11 ('.') -->
  <path class="ln" d="M 340,285 C 430,320 540,320 630,285" marker-end="url(#sdA)"/>
  <text x="485" y="325" text-anchor="middle" class="mono lg">.</text>

  <!-- D10 -> D11 ('.') -->
  <line class="ln" x1="550" y1="271" x2="628" y2="271" marker-end="url(#sdA)"/>
  <text x="590" y="265" text-anchor="middle" class="mono lg">.</text>

  <!-- D11 -> D15 ('0-9') -->
  <line class="ln" x1="760" y1="271" x2="838" y2="271" marker-end="url(#sdA)"/>
  <text x="800" y="265" text-anchor="middle" class="mono lg">0-9</text>

  <!-- D15 自环 ('0-9') -->
  <path class="ln" d="M 885,244 C 885,215 925,215 925,242" marker-end="url(#sdA)"/>
  <text x="905" y="210" text-anchor="middle" class="mono xs">0-9</text>


  <!-- ==================== 分支 3：运算符 (ASSIGN / EQEQ) ==================== -->
  <text x="210" y="340" class="sm muted" font-weight="600">分支 ③：运算符 (ASSIGN 与 EQEQ)</text>

  <!-- D5 节点 -->
  <g id="node-D5">
    <rect class="box-acc" x="210" y="352" width="130" height="54" rx="8"/>
    <rect class="ring" x="214" y="356" width="122" height="46" rx="6"/>
    <text x="275" y="373" text-anchor="middle" class="lg">D5</text>
    <text x="275" y="388" text-anchor="middle" class="mono xs">读入单等号 '='</text>
    <text x="275" y="400" text-anchor="middle" class="xs acc-t">【接受：ASSIGN】</text>
  </g>

  <!-- D12 节点 -->
  <g id="node-D12">
    <rect class="box-acc" x="420" y="352" width="130" height="54" rx="8"/>
    <rect class="ring" x="424" y="356" width="122" height="46" rx="6"/>
    <text x="485" y="373" text-anchor="middle" class="lg">D12</text>
    <text x="485" y="388" text-anchor="middle" class="mono xs">读入双等号 "=="</text>
    <text x="485" y="400" text-anchor="middle" class="xs acc-t">【接受：EQEQ】</text>
  </g>

  <!-- 分支 3 连线 -->
  <!-- D0 -> D5 ('=') -->
  <line class="ln" x1="140" y1="375" x2="208" y2="375" marker-end="url(#sdA)"/>
  <text x="175" y="370" text-anchor="middle" class="mono lg">=</text>

  <!-- D5 -> D12 ('=') -->
  <line class="ln" x1="340" y1="379" x2="418" y2="379" marker-end="url(#sdA)"/>
  <text x="380" y="373" text-anchor="middle" class="mono lg">=</text>


  <!-- ==================== 分支 4：空白 (WS) ==================== -->
  <text x="210" y="445" class="sm muted" font-weight="600">分支 ④：空白符 (WS，空格 / 制表符 / 换行)</text>

  <!-- D7 节点 -->
  <g id="node-D7">
    <rect class="box-acc" x="210" y="457" width="130" height="54" rx="8"/>
    <rect class="ring" x="214" y="461" width="122" height="46" rx="6"/>
    <text x="275" y="478" text-anchor="middle" class="lg">D7</text>
    <text x="275" y="493" text-anchor="middle" class="mono xs">首个空白字符</text>
    <text x="275" y="505" text-anchor="middle" class="xs acc-t">【接受：WS (丢弃)】</text>
  </g>

  <!-- D14 节点 -->
  <g id="node-D14">
    <rect class="box-acc" x="420" y="457" width="130" height="54" rx="8"/>
    <rect class="ring" x="424" y="461" width="122" height="46" rx="6"/>
    <text x="485" y="478" text-anchor="middle" class="lg">D14</text>
    <text x="485" y="493" text-anchor="middle" class="mono xs">连续空白自环</text>
    <text x="485" y="505" text-anchor="middle" class="xs acc-t">【接受：WS (丢弃)】</text>
  </g>

  <!-- 分支 4 连线 -->
  <!-- D0 -> D7 ('␠ / ↵') -->
  <path class="ln" d="M 140,380 C 165,410 180,455 208,474" marker-end="url(#sdA)"/>
  <text x="175" y="440" class="mono sm">␠, ↵</text>

  <!-- D7 -> D14 ('␠ / ↵') -->
  <line class="ln" x1="340" y1="484" x2="418" y2="484" marker-end="url(#sdA)"/>
  <text x="380" y="478" text-anchor="middle" class="mono sm">␠, ↵</text>

  <!-- D14 自环 ('␠ / ↵') -->
  <path class="ln" d="M 550,475 C 600,455 600,510 552,495" marker-end="url(#sdA)"/>
  <text x="608" y="488" class="mono sm">␠, ↵</text>


  <!-- ==================== 分支 5：注释 (COMMENT) ==================== -->
  <text x="210" y="550" class="sm muted" font-weight="600">分支 ⑤：注释 (COMMENT，以 '#' 开头直到换行)</text>

  <!-- D6 节点 -->
  <g id="node-D6">
    <rect class="box-acc" x="210" y="562" width="130" height="54" rx="8"/>
    <rect class="ring" x="214" y="566" width="122" height="46" rx="6"/>
    <text x="275" y="583" text-anchor="middle" class="lg">D6</text>
    <text x="275" y="598" text-anchor="middle" class="mono xs">读入 '#'</text>
    <text x="275" y="610" text-anchor="middle" class="xs acc-t">【接受：COMMENT】</text>
  </g>

  <!-- D13 节点 -->
  <g id="node-D13">
    <rect class="box-acc" x="420" y="562" width="130" height="54" rx="8"/>
    <rect class="ring" x="424" y="566" width="122" height="46" rx="6"/>
    <text x="485" y="583" text-anchor="middle" class="lg">D13</text>
    <text x="485" y="598" text-anchor="middle" class="mono xs">注释正文自环</text>
    <text x="485" y="610" text-anchor="middle" class="xs acc-t">【接受：COMMENT】</text>
  </g>

  <!-- 分支 5 连线 -->
  <!-- D0 -> D6 ('#') -->
  <path class="ln" d="M 140,385 C 160,450 170,540 208,575" marker-end="url(#sdA)"/>
  <text x="175" y="525" class="mono lg">#</text>

  <!-- D6 -> D13 ('[^\n]') -->
  <line class="ln" x1="340" y1="589" x2="418" y2="589" marker-end="url(#sdA)"/>
  <text x="380" y="583" text-anchor="middle" class="mono sm">[^
]</text>

  <!-- D13 自环 ('[^\n]') -->
  <path class="ln" d="M 550,580 C 600,560 600,615 552,600" marker-end="url(#sdA)"/>
  <text x="608" y="593" class="mono sm">[^
]</text>


  <!-- ==================== 分支 6：错误兜底 (ERROR) ==================== -->
  <text x="210" y="655" class="sm muted" font-weight="600">分支 ⑥：错误兜底规则 (ERROR，单个非法字符或孤立小数点)</text>

  <!-- D4 节点 -->
  <g id="node-D4">
    <rect class="box-acc" x="210" y="667" width="130" height="54" rx="8"/>
    <rect class="ring" x="214" y="671" width="122" height="46" rx="6"/>
    <text x="275" y="688" text-anchor="middle" class="lg">D4</text>
    <text x="275" y="703" text-anchor="middle" class="mono xs">孤立 '.' 或其它字符</text>
    <text x="275" y="715" text-anchor="middle" class="xs acc-t">【接受：ERROR】</text>
  </g>

  <!-- 分支 6 连线 -->
  <!-- D0 -> D4 ('.', '其它') -->
  <path class="ln" d="M 130,394 C 150,510 160,630 208,685" marker-end="url(#sdA)"/>
  <text x="155" y="630" class="mono sm">., 其它</text>

</svg>