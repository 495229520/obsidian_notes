<svg xmlns="http://www.w3.org/2000/svg" width="792" height="290" viewBox="-16 -16 792 290" role="img" aria-label="第一个自动机从 A 读取 1 后进入接受状态 B：接受 1，0 和 10 因无转移而拒绝。第二个自动机 1*0 在 A 读取 1 时自环，读取 0 时进入接受状态 B：接受 110，100 卡住而拒绝，11 读完后停在非接受状态 A 而拒绝">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="290" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="faA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="faAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="faABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="0" y="4" class="lg">① 只接受 "1" 的自动机</text>
  <circle class="st" cx="60" cy="60" r="18"/>
  <text x="60" y="65" text-anchor="middle" class="lg">A</text>
  <circle class="st-acc" cx="170" cy="60" r="18"/>
  <circle class="ring" cx="170" cy="60" r="14"/>
  <text x="170" y="65" text-anchor="middle" class="lg">B</text>
  <line class="ln" x1="18" y1="60" x2="40.5" y2="60" marker-end="url(#faA)"/>
  <line class="ln" x1="78" y1="60" x2="150.5" y2="60" marker-end="url(#faA)"/>
  <text x="115" y="52" text-anchor="middle" class="mono lg">1</text>
  <text x="270" y="36" class="mono">"1"</text>
  <text x="330" y="36">A →1→ B，输入结束，B 接受</text>
  <text x="760" y="36" text-anchor="end" class="blue-t lg">接受</text>
  <text x="270" y="62" class="mono">"0"</text>
  <text x="330" y="62">A 没有 0 转移，停止</text>
  <text x="760" y="62" text-anchor="end" class="acc-t">拒绝 · 卡住</text>
  <text x="270" y="88" class="mono">"10"</text>
  <text x="330" y="88">A →1→ B，B 没有 0 转移，停止</text>
  <text x="760" y="88" text-anchor="end" class="acc-t">拒绝 · 卡住</text>
  <line class="ln-muted" x1="0" y1="112" x2="760" y2="112"/>
  <text x="0" y="136" class="lg">② 1*0：零个或多个 1，后接一个 0</text>
  <circle class="st" cx="60" cy="214" r="18"/>
  <text x="60" y="219" text-anchor="middle" class="lg">A</text>
  <circle class="st-acc" cx="170" cy="214" r="18"/>
  <circle class="ring" cx="170" cy="214" r="14"/>
  <text x="170" y="219" text-anchor="middle" class="lg">B</text>
  <line class="ln" x1="18" y1="214" x2="40.5" y2="214" marker-end="url(#faA)"/>
  <path class="ln" d="M50.6,198.7 C38,156 82,156 70.2,197.4" marker-end="url(#faA)"/>
  <text x="60.1" y="161.5" text-anchor="middle" class="mono lg">1</text>
  <line class="ln" x1="78" y1="214" x2="150.5" y2="214" marker-end="url(#faA)"/>
  <text x="115" y="206" text-anchor="middle" class="mono lg">0</text>
  <text x="270" y="182" class="mono">"110"</text>
  <text x="330" y="182">A →1→ A →1→ A →0→ B，输入结束</text>
  <text x="760" y="182" text-anchor="end" class="blue-t lg">接受</text>
  <text x="270" y="208" class="mono">"100"</text>
  <text x="330" y="208">A →1→ A →0→ B，B 没有 0 转移，停止</text>
  <text x="760" y="208" text-anchor="end" class="acc-t">拒绝 · 卡住</text>
  <text x="270" y="234" class="mono">"11"</text>
  <text x="330" y="234">A →1→ A →1→ A，输入结束但 A 不接受</text>
  <text x="760" y="234" text-anchor="end" class="acc-t">拒绝 · 非接受</text>
  <text x="0" y="264" class="sm muted">拒绝有两种情况：读完输入停在非接受状态，或没有处理剩余输入的转移而卡住。</text>
</svg>
