<svg xmlns="http://www.w3.org/2000/svg" width="792" height="202" viewBox="-16 -16 792 202" role="img" aria-label="DO 5 I = 1,25와 DO 5 I = 1.25는 7번째 문자인 쉼표와 마침표에서야 구분된다. 그 문자를 읽기 전까지는 DO가 키워드인지 변수명의 일부인지 정할 수 없다.">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .guard { fill: none; stroke: #D97757; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .band { fill: #F5DDD1; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.5; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="202" rx="14" fill="#F0EEE6"/>
  <line class="ln-acc" x1="140" y1="22" x2="364" y2="22"/>
  <line class="ln-acc" x1="140" y1="16" x2="140" y2="28"/><line class="ln-acc" x1="364" y1="16" x2="364" y2="28"/>
  <text x="252" y="14" text-anchor="middle" class="sm acc-t">여기까지 읽어야 첫 Token이 정해진다</text>

  <text x="20" y="57" class="sm">문장 A</text>
  <g class="mono">
    <rect class="box" x="140" y="36" width="32" height="32"/><text x="156" y="57" text-anchor="middle">D</text>
    <rect class="box" x="172" y="36" width="32" height="32"/><text x="188" y="57" text-anchor="middle">O</text>
    <rect class="box" x="204" y="36" width="32" height="32"/><text x="220" y="57" text-anchor="middle">5</text>
    <rect class="box" x="236" y="36" width="32" height="32"/><text x="252" y="57" text-anchor="middle">I</text>
    <rect class="box" x="268" y="36" width="32" height="32"/><text x="284" y="57" text-anchor="middle">=</text>
    <rect class="box" x="300" y="36" width="32" height="32"/><text x="316" y="57" text-anchor="middle">1</text>
    <rect class="box-acc" x="332" y="36" width="32" height="32"/><text x="348" y="57" text-anchor="middle" class="lg">,</text>
    <rect class="box" x="364" y="36" width="32" height="32"/><text x="380" y="57" text-anchor="middle">2</text>
    <rect class="box" x="396" y="36" width="32" height="32"/><text x="412" y="57" text-anchor="middle">5</text>
  </g>
  <text x="452" y="50" class="sm">DO 반복문: I = 1부터 25까지</text>
  <text x="452" y="66" class="mono sm muted">DO | 5 | I | = | 1 | , | 25</text>

  <text x="20" y="117" class="sm">문장 B</text>
  <g class="mono">
    <rect class="box" x="140" y="96" width="32" height="32"/><text x="156" y="117" text-anchor="middle">D</text>
    <rect class="box" x="172" y="96" width="32" height="32"/><text x="188" y="117" text-anchor="middle">O</text>
    <rect class="box" x="204" y="96" width="32" height="32"/><text x="220" y="117" text-anchor="middle">5</text>
    <rect class="box" x="236" y="96" width="32" height="32"/><text x="252" y="117" text-anchor="middle">I</text>
    <rect class="box" x="268" y="96" width="32" height="32"/><text x="284" y="117" text-anchor="middle">=</text>
    <rect class="box" x="300" y="96" width="32" height="32"/><text x="316" y="117" text-anchor="middle">1</text>
    <rect class="box-acc" x="332" y="96" width="32" height="32"/><text x="348" y="117" text-anchor="middle" class="lg">.</text>
    <rect class="box" x="364" y="96" width="32" height="32"/><text x="380" y="117" text-anchor="middle">2</text>
    <rect class="box" x="396" y="96" width="32" height="32"/><text x="412" y="117" text-anchor="middle">5</text>
  </g>
  <text x="452" y="110" class="sm">대입문: 변수 DO5I에 1.25</text>
  <text x="452" y="126" class="mono sm muted">DO5I | = | 1.25</text>
  <text x="140" y="156" class="sm muted">공백은 무시되므로 "DO 5 I"와 "DO5I"는 같은 문자열이다</text>
    </svg>
