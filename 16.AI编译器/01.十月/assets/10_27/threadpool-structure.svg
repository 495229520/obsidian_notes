<svg xmlns="http://www.w3.org/2000/svg" width="792" height="364" viewBox="-16 -16 792 364" role="img" aria-label="제출자는 잠금 안에서 큐에 작업을 넣고 notify_one으로 대기 스레드 하나를 깨운다. 작업 스레드는 잠금 안에서 작업을 꺼내고 잠금 밖에서 실행한다. 종료 시 stopping을 true로 바꾸고 notify_all 후 모든 스레드를 join한다.">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .guard { fill: none; stroke: #D97757; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .band { fill: #F5DDD1; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.5; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="364" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="tpA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="tpB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="80" y="26" text-anchor="middle" class="muted">제출자 스레드</text>
  <text x="340" y="26" text-anchor="middle" class="muted">공유 상태</text>
  <text x="665" y="26" text-anchor="middle" class="muted">작업 스레드 N개</text>

  <rect class="box" x="20" y="60" width="120" height="40" rx="6"/>
  <text x="80" y="85" text-anchor="middle" class="mono">submit(f)</text>
  <rect class="box" x="20" y="124" width="120" height="40" rx="6"/>
  <text x="80" y="149" text-anchor="middle" class="mono">submit(g)</text>

  <rect class="guard" x="210" y="44" width="260" height="150" rx="10"/>
  <text x="224" y="64" class="sm acc-t mono">mutex로 보호</text>
  <rect class="box" x="230" y="84" width="50" height="40"/>
  <rect class="box" x="280" y="84" width="50" height="40"/>
  <rect class="box" x="330" y="84" width="50" height="40"/>
  <rect class="box" x="380" y="84" width="50" height="40"/>
  <text x="255" y="109" text-anchor="middle" class="mono sm">t6</text>
  <text x="305" y="109" text-anchor="middle" class="mono sm">t5</text>
  <text x="355" y="109" text-anchor="middle" class="mono sm">t4</text>
  <text x="405" y="109" text-anchor="middle" class="mono sm">t3</text>
  <text x="255" y="142" text-anchor="middle" class="sm muted">back</text>
  <text x="405" y="142" text-anchor="middle" class="sm muted">front</text>
  <text x="340" y="178" text-anchor="middle" class="mono sm muted">bool stopping = false</text>

  <line class="ln" x1="140" y1="80" x2="226" y2="98" marker-end="url(#tpA)"/>
  <line class="ln" x1="140" y1="144" x2="226" y2="112" marker-end="url(#tpA)"/>
  <text x="168" y="118" text-anchor="middle" class="sm">push</text>

  <rect class="box" x="590" y="50" width="150" height="40" rx="6"/>
  <text x="665" y="75" text-anchor="middle">W1 · task() 실행</text>
  <rect class="box" x="590" y="110" width="150" height="40" rx="6"/>
  <text x="665" y="135" text-anchor="middle">W2 · task() 실행</text>
  <rect class="box-dash" x="590" y="170" width="150" height="40" rx="6"/>
  <text x="665" y="195" text-anchor="middle">W3 · wait(pred)</text>

  <line class="ln" x1="472" y1="100" x2="586" y2="72" marker-end="url(#tpA)"/>
  <line class="ln" x1="472" y1="112" x2="586" y2="128" marker-end="url(#tpA)"/>
  <text x="530" y="108" text-anchor="middle" class="sm">pop → unlock</text>

  <rect class="box-blue" x="280" y="236" width="150" height="36" rx="18"/>
  <text x="355" y="259" text-anchor="middle" class="mono sm">condition_variable</text>
  <line class="ln-blue" x1="80" y1="166" x2="276" y2="252" marker-end="url(#tpB)" stroke-dasharray="4 3"/>
  <text x="150" y="232" text-anchor="middle" class="sm blue-t">unlock 후 notify_one</text>
  <line class="ln-blue" x1="588" y1="196" x2="434" y2="254" stroke-dasharray="4 3"/>
  <text x="540" y="246" text-anchor="middle" class="sm blue-t">잠금 해제 + 블록</text>

  <rect class="band" x="20" y="292" width="720" height="32" rx="6"/>
  <text x="380" y="313" text-anchor="middle" class="sm">종료: lock → stopping = true → unlock → notify_all() → 모든 스레드 join()</text>
    </svg>
