<svg xmlns="http://www.w3.org/2000/svg" width="792" height="264" viewBox="-16 -16 792 264" role="img" aria-label="子集构造得到的 DFA：开始 S0 为 ABCDHI，S1 为 ABCDFGHI，接受状态 S2 为 ABCDEGHIJ。任何状态读 0 到 S1，读 1 到 S2。S0 与 S1 都不接受且转移相同，最小化后得到 P、Q 两个状态">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="264" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="sdA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sdAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sdABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="0" y="4" class="lg">子集构造结果（3 个状态）</text>
  <rect class="box" x="0" y="104" width="130" height="48" rx="8"/>
  <text x="65" y="125" text-anchor="middle" class="lg">S0</text>
  <text x="65" y="142" text-anchor="middle" class="mono sm">ABCDHI</text>
  <rect class="box" x="250" y="20" width="130" height="48" rx="8"/>
  <text x="315" y="41" text-anchor="middle" class="lg">S1</text>
  <text x="315" y="58" text-anchor="middle" class="mono sm">ABCDFGHI</text>
  <rect class="box-acc" x="250" y="190" width="130" height="48" rx="8"/>
  <rect class="ring" x="254" y="194" width="122" height="40" rx="6"/>
  <text x="315" y="211" text-anchor="middle" class="lg">S2</text>
  <text x="315" y="228" text-anchor="middle" class="mono sm">ABCDEGHIJ</text>
  <line class="ln" x1="-14" y1="128" x2="-2" y2="128" marker-end="url(#sdA)"/>
  <line class="ln" x1="130" y1="116" x2="248" y2="54" marker-end="url(#sdA)"/>
  <text x="178" y="76" class="mono lg">0</text>
  <line class="ln" x1="130" y1="140" x2="248" y2="202" marker-end="url(#sdA)"/>
  <text x="178" y="190" class="mono lg">1</text>
  <line class="ln" x1="300" y1="68" x2="300" y2="188" marker-end="url(#sdA)"/>
  <text x="292" y="134" text-anchor="end" class="mono lg">1</text>
  <line class="ln" x1="330" y1="190" x2="330" y2="70" marker-end="url(#sdA)"/>
  <text x="338" y="134" class="mono lg">0</text>
  <path class="ln" d="M380,36 C428,20 428,68 381.5,52" marker-end="url(#sdA)"/>
  <text x="422" y="49" class="mono lg">0</text>
  <path class="ln" d="M380,206 C428,190 428,238 381.5,222" marker-end="url(#sdA)"/>
  <text x="422" y="219" class="mono lg">1</text>
  <text x="446" y="40" class="sm">最后字符为 0</text>
  <text x="446" y="56" class="sm muted">（非接受）</text>
  <text x="446" y="210" class="sm">最后字符为 1</text>
  <text x="446" y="226" class="sm acc-t">（接受）</text>
  <text x="0" y="172" class="sm muted">尚未读取字符</text>
  <line class="ln-muted" x1="570" y1="0" x2="570" y2="246"/>
  <text x="590" y="4" class="lg">最小化（2 个状态）</text>
  <circle class="st" cx="630" cy="130" r="24"/>
  <text x="630" y="135" text-anchor="middle" class="lg">P</text>
  <circle class="st-acc" cx="720" cy="130" r="24"/>
  <circle class="ring" cx="720" cy="130" r="20"/>
  <text x="720" y="135" text-anchor="middle" class="lg">Q</text>
  <line class="ln" x1="592" y1="130" x2="604.5" y2="130" marker-end="url(#sdA)"/>
  <path class="ln" d="M652.9,122.9 Q675,116 695.7,122.4" marker-end="url(#sdA)"/>
  <text x="675" y="112" text-anchor="middle" class="mono lg">1</text>
  <path class="ln" d="M697.1,137.1 Q675,144 654.3,137.6" marker-end="url(#sdA)"/>
  <text x="675" y="162" text-anchor="middle" class="mono lg">0</text>
  <path class="ln" d="M617.5,109.5 C608,66 652,66 643.3,108.3" marker-end="url(#sdA)"/>
  <text x="630.1" y="71.7" text-anchor="middle" class="mono lg">0</text>
  <path class="ln" d="M707.5,109.5 C698,66 742,66 733.3,108.3" marker-end="url(#sdA)"/>
  <text x="720.1" y="71.7" text-anchor="middle" class="mono lg">1</text>
  <text x="630" y="174" text-anchor="middle" class="sm muted">= S0, S1</text>
  <text x="720" y="174" text-anchor="middle" class="sm muted">= S2</text>
  <text x="590" y="202" class="sm">S0、S1 均不接受</text>
  <text x="590" y="218" class="sm">转移也相同：0→S1，1→S2</text>
  <text x="590" y="236" class="sm acc-t">→ 无法用输入区分，合并</text>
</svg>
