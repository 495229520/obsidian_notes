<svg xmlns="http://www.w3.org/2000/svg" width="792" height="220" viewBox="-16 -16 792 220" role="img" aria-label="接受倒数第三个字符为 1 的字符串，NFA 只需 q0 到 q3 共 4 个状态。同语言的 DFA 必须记住最近 3 位，需要 000 到 111 共 8 个状态，其中以 1 开头的 4 个是接受状态">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="220" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="klA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="klAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="klABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="0" y="4" class="lg">NFA (k = 3)：4 个状态</text>
  <circle class="st" cx="44" cy="80" r="18"/>
  <text x="44" y="85" text-anchor="middle" class="lg">q0</text>
  <circle class="st" cx="132" cy="80" r="18"/>
  <text x="132" y="85" text-anchor="middle" class="lg">q1</text>
  <circle class="st" cx="220" cy="80" r="18"/>
  <text x="220" y="85" text-anchor="middle" class="lg">q2</text>
  <circle class="st-acc" cx="308" cy="80" r="18"/>
  <circle class="ring" cx="308" cy="80" r="14"/>
  <text x="308" y="85" text-anchor="middle" class="lg">q3</text>
  <line class="ln" x1="6" y1="80" x2="24.5" y2="80" marker-end="url(#klA)"/>
  <path class="ln" d="M34.6,64.7 C22,22 66,22 54.2,63.4" marker-end="url(#klA)"/>
  <text x="44.1" y="27.5" text-anchor="middle" class="mono">0, 1</text>
  <line class="ln" x1="62" y1="80" x2="112.5" y2="80" marker-end="url(#klA)"/>
  <text x="88" y="72" text-anchor="middle" class="mono lg">1</text>
  <line class="ln" x1="150" y1="80" x2="200.5" y2="80" marker-end="url(#klA)"/>
  <text x="176" y="72" text-anchor="middle" class="mono">0, 1</text>
  <line class="ln" x1="238" y1="80" x2="288.5" y2="80" marker-end="url(#klA)"/>
  <text x="264" y="72" text-anchor="middle" class="mono">0, 1</text>
  <text x="0" y="136" class="sm muted">读到 1 时，猜测“这是倒数第三位”并分叉。</text>
  <text x="0" y="152" class="sm muted">猜错的分支会停止。</text>
  <text x="0" y="188" class="sm acc-t">k = 20 时：NFA 21 个 vs DFA 2²⁰ = 1,048,576 个</text>
  <text x="380" y="4" class="lg">DFA：最近 3 位作为状态 → 2³ = 8 个</text>
  <rect class="box" x="392" y="40" width="80" height="34" rx="6"/>
  <text x="432" y="63" text-anchor="middle" class="mono lg">000</text>
  <rect class="box" x="484" y="40" width="80" height="34" rx="6"/>
  <text x="524" y="63" text-anchor="middle" class="mono lg">001</text>
  <rect class="box" x="576" y="40" width="80" height="34" rx="6"/>
  <text x="616" y="63" text-anchor="middle" class="mono lg">010</text>
  <rect class="box" x="668" y="40" width="80" height="34" rx="6"/>
  <text x="708" y="63" text-anchor="middle" class="mono lg">011</text>
  <rect class="box-acc" x="392" y="90" width="80" height="34" rx="6"/>
  <text x="432" y="113" text-anchor="middle" class="mono lg">100</text>
  <rect class="box-acc" x="484" y="90" width="80" height="34" rx="6"/>
  <text x="524" y="113" text-anchor="middle" class="mono lg">101</text>
  <rect class="box-acc" x="576" y="90" width="80" height="34" rx="6"/>
  <text x="616" y="113" text-anchor="middle" class="mono lg">110</text>
  <rect class="box-acc" x="668" y="90" width="80" height="34" rx="6"/>
  <text x="708" y="113" text-anchor="middle" class="mono lg">111</text>
  <text x="380" y="150" class="sm">转移：abc —d→ bcd（丢弃最旧位，追加新位）</text>
  <text x="380" y="168" class="sm">下行（1xx）接受：倒数第三位为 1</text>
  <text x="380" y="188" class="sm muted">开始状态为 000，最小 DFA 也恰好有 8 个状态。</text>
</svg>
