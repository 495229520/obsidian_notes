<svg xmlns="http://www.w3.org/2000/svg" width="792" height="330" viewBox="-16 -16 792 330" role="img" aria-label="仅考虑单点 DOT 和三点 ELLIPSIS 的 DFA。读取 ..x，第一个点后的 s1 记录最后接受位置 1；第二个点后的 s2 不接受但继续读取；遇 x 无转移而停止。退回位置 1 输出 DOT，再从该处重新扫描，得到 DOT DOT ID">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="330" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="mbA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mbAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mbABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="0" y="4" class="lg">DFA：词法单元 .(DOT) 与 ...(ELLIPSIS)</text>
  <circle class="st" cx="30" cy="64" r="18"/>
  <text x="30" y="69" text-anchor="middle" class="mono">s0</text>
  <circle class="st-acc" cx="130" cy="64" r="18"/>
  <circle class="ring" cx="130" cy="64" r="14"/>
  <text x="130" y="69" text-anchor="middle" class="mono">s1</text>
  <circle class="st" cx="230" cy="64" r="18"/>
  <text x="230" y="69" text-anchor="middle" class="mono">s2</text>
  <circle class="st-acc" cx="330" cy="64" r="18"/>
  <circle class="ring" cx="330" cy="64" r="14"/>
  <text x="330" y="69" text-anchor="middle" class="mono">s3</text>
  <line class="ln" x1="-12" y1="64" x2="10.5" y2="64" marker-end="url(#mbA)"/>
  <line class="ln" x1="48" y1="64" x2="110.5" y2="64" marker-end="url(#mbA)"/>
  <text x="80" y="54" text-anchor="middle" class="mono lg">.</text>
  <line class="ln" x1="148" y1="64" x2="210.5" y2="64" marker-end="url(#mbA)"/>
  <text x="180" y="54" text-anchor="middle" class="mono lg">.</text>
  <line class="ln" x1="248" y1="64" x2="310.5" y2="64" marker-end="url(#mbA)"/>
  <text x="280" y="54" text-anchor="middle" class="mono lg">.</text>
  <text x="130" y="104" text-anchor="middle" class="sm acc-t">DOT</text>
  <text x="230" y="104" text-anchor="middle" class="sm muted">非接受</text>
  <text x="330" y="104" text-anchor="middle" class="sm acc-t">ELLIPSIS</text>
  <rect class="box" x="400" y="16" width="360" height="108" rx="6"/>
  <text x="414" y="38" class="mono sm">state = 0; last = 无</text>
  <text x="414" y="56" class="mono sm">while T[state][c[i]] != DEAD:</text>
  <text x="414" y="74" class="mono sm">    state = T[state][c[i]]; i++</text>
  <text x="414" y="92" class="mono sm">    if accept[state]: last = (i, tok[state])</text>
  <text x="414" y="110" class="mono sm acc-t">i = last.i; emit(last.tok)   // 回退</text>
  <text x="0" y="146" class="lg">处理输入 "..x"</text>
  <rect class="box" x="0" y="170" width="40" height="36"/>
  <text x="20" y="194" text-anchor="middle" class="mono lg">.</text>
  <rect class="box" x="40" y="170" width="40" height="36"/>
  <text x="60" y="194" text-anchor="middle" class="mono lg">.</text>
  <rect class="box" x="80" y="170" width="40" height="36"/>
  <text x="100" y="194" text-anchor="middle" class="mono lg">x</text>
  <text x="0" y="222" text-anchor="middle" class="sm muted">0</text>
  <text x="40" y="222" text-anchor="middle" class="sm muted">1</text>
  <text x="80" y="222" text-anchor="middle" class="sm muted">2</text>
  <text x="120" y="222" text-anchor="middle" class="sm muted">3</text>
  <line class="ln" x1="2" y1="160" x2="118" y2="160" marker-end="url(#mbA)"/>
  <line class="ln-acc" x1="118" y1="236" x2="42" y2="236" marker-end="url(#mbAAcc)"/>
  <text x="80" y="254" text-anchor="middle" class="sm acc-t">回退</text>
  <text x="170" y="170" class="sm muted">步骤</text>
  <text x="220" y="170" class="sm muted">已读前缀</text>
  <text x="330" y="170" class="sm muted">DFA 状态</text>
  <text x="500" y="170" class="sm muted">最后接受 last</text>
  <text x="170" y="194">①</text>
  <text x="220" y="194" class="mono">.</text>
  <text x="330" y="194">s1（接受）</text>
  <text x="500" y="194">last = (1, DOT)</text>
  <text x="170" y="218">②</text>
  <text x="220" y="218" class="mono">..</text>
  <text x="330" y="218">s2（非接受，继续读取）</text>
  <text x="500" y="218">不变</text>
  <text x="170" y="242">③</text>
  <text x="220" y="242" class="mono">..x</text>
  <text x="330" y="242">无转移 → 停止</text>
  <text x="500" y="242" class="acc-t">回退：i = 1，输出 DOT</text>
  <text x="170" y="274">从位置 1 重读："." → DOT，"x" → Identifier  ⇒  DOT DOT ID</text>
  <text x="0" y="304" class="sm muted">最坏情况：词法单元为 a、a*b，输入为 a…a（n 个），每次读到末尾却只前进一格 → O(n²)</text>
</svg>
