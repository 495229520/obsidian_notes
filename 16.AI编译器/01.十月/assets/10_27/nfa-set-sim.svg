<svg xmlns="http://www.w3.org/2000/svg" width="792" height="248" viewBox="-16 -16 792 248" role="img" aria-label="NFA 中 A 对 0、1 自环，读 0 也可到 B，B 读 0 到接受状态 C。读取 100 有三条路径，其中 A A B C 到达接受状态。各时刻状态集合依次为 A、A、A B、A B C，最后包含 C，所以接受">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="248" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="nsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="nsAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="nsABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="0" y="4" class="lg">NFA：以 00 结尾的 0、1 字符串</text>
  <circle class="st" cx="50" cy="100" r="18"/>
  <text x="50" y="105" text-anchor="middle" class="lg">A</text>
  <circle class="st" cx="150" cy="100" r="18"/>
  <text x="150" y="105" text-anchor="middle" class="lg">B</text>
  <circle class="st-acc" cx="250" cy="100" r="18"/>
  <circle class="ring" cx="250" cy="100" r="14"/>
  <text x="250" y="105" text-anchor="middle" class="lg">C</text>
  <line class="ln" x1="10" y1="100" x2="30.5" y2="100" marker-end="url(#nsA)"/>
  <path class="ln" d="M40.6,84.7 C28,42 72,42 60.2,83.4" marker-end="url(#nsA)"/>
  <text x="50.1" y="47.5" text-anchor="middle" class="mono">0, 1</text>
  <line class="ln" x1="68" y1="100" x2="130.5" y2="100" marker-end="url(#nsA)"/>
  <text x="100" y="92" text-anchor="middle" class="mono lg">0</text>
  <line class="ln" x1="168" y1="100" x2="230.5" y2="100" marker-end="url(#nsA)"/>
  <text x="200" y="92" text-anchor="middle" class="mono lg">0</text>
  <text x="0" y="150" class="sm muted">A 读 0 时，可以留在 A，也可以进入 B</text>
  <text x="0" y="166" class="sm muted">→ 同一状态、同一字符有两条转移 = NFA</text>
  <text x="300" y="30" class="sm muted">输入</text>
  <text x="425" y="31" text-anchor="middle" class="mono lg">1</text>
  <text x="515" y="31" text-anchor="middle" class="mono lg">0</text>
  <text x="605" y="31" text-anchor="middle" class="mono lg">0</text>
  <text x="300" y="64" class="sm">路径 ①</text>
  <text x="380" y="64" text-anchor="middle" class="lg">A</text>
  <text x="470" y="64" text-anchor="middle" class="lg">A</text>
  <line class="ln" x1="392" y1="59" x2="458" y2="59" marker-end="url(#nsA)"/>
  <text x="560" y="64" text-anchor="middle" class="lg">A</text>
  <line class="ln" x1="482" y1="59" x2="548" y2="59" marker-end="url(#nsA)"/>
  <text x="650" y="64" text-anchor="middle" class="lg">A</text>
  <line class="ln" x1="572" y1="59" x2="638" y2="59" marker-end="url(#nsA)"/>
  <text x="690" y="64" class="sm muted">A：非接受</text>
  <text x="300" y="94" class="sm">路径 ②</text>
  <text x="380" y="94" text-anchor="middle" class="lg">A</text>
  <text x="470" y="94" text-anchor="middle" class="lg">A</text>
  <line class="ln" x1="392" y1="89" x2="458" y2="89" marker-end="url(#nsA)"/>
  <text x="560" y="94" text-anchor="middle" class="lg">A</text>
  <line class="ln" x1="482" y1="89" x2="548" y2="89" marker-end="url(#nsA)"/>
  <text x="650" y="94" text-anchor="middle" class="lg">B</text>
  <line class="ln" x1="572" y1="89" x2="638" y2="89" marker-end="url(#nsA)"/>
  <text x="690" y="94" class="sm muted">B：非接受</text>
  <text x="300" y="124" class="sm">路径 ③</text>
  <text x="380" y="124" text-anchor="middle" class="lg acc-t">A</text>
  <text x="470" y="124" text-anchor="middle" class="lg acc-t">A</text>
  <line class="ln-acc" x1="392" y1="119" x2="458" y2="119" marker-end="url(#nsAAcc)"/>
  <text x="560" y="124" text-anchor="middle" class="lg acc-t">B</text>
  <line class="ln-acc" x1="482" y1="119" x2="548" y2="119" marker-end="url(#nsAAcc)"/>
  <text x="650" y="124" text-anchor="middle" class="lg acc-t">C</text>
  <line class="ln-acc" x1="572" y1="119" x2="638" y2="119" marker-end="url(#nsAAcc)"/>
  <text x="690" y="124" class="acc-t">C：接受</text>
  <text x="300" y="168" class="sm">状态集合</text>
  <rect class="box-blue" x="358" y="150" width="44" height="28" rx="6"/>
  <text x="380" y="168" text-anchor="middle" class="mono sm">{A}</text>
  <rect class="box-blue" x="448" y="150" width="44" height="28" rx="6"/>
  <text x="470" y="168" text-anchor="middle" class="mono sm">{A}</text>
  <rect class="box-blue" x="530" y="150" width="60" height="28" rx="6"/>
  <text x="560" y="168" text-anchor="middle" class="mono sm">{A,B}</text>
  <rect class="box-acc" x="612" y="150" width="76" height="28" rx="6"/>
  <text x="650" y="168" text-anchor="middle" class="mono sm">{A,B,C}</text>
  <text x="300" y="204" class="sm muted">同列状态合起来，就是该时刻的状态集合。</text>
  <text x="300" y="220" class="sm muted">最后集合包含接受状态 C，因此接受 "100"。</text>
</svg>
