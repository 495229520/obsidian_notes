<svg xmlns="http://www.w3.org/2000/svg" width="792" height="384" viewBox="-16 -16 792 384" role="img" aria-label="生产者先将 data 写为 42，再以 release 存储 ready。消费者以 acquire 读取 ready，为 false 时循环，为 true 时读取 data。release 存储与读到该值的 acquire 读取之间形成 synchronizes-with，再结合各线程内顺序，使 data 写入 happens-before data 读取">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="384" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="raA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="raAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="raABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="170" y="4" text-anchor="middle" class="lg">生产者线程</text>
  <text x="590" y="4" text-anchor="middle" class="lg">消费者线程</text>
  <rect class="box" x="60" y="30" width="220" height="36" rx="6"/>
  <text x="170" y="53" text-anchor="middle" class="mono">data = 42;</text>
  <rect class="box-acc" x="60" y="130" width="220" height="36" rx="6"/>
  <text x="170" y="153" text-anchor="middle" class="mono sm">ready.store(true, release)</text>
  <line class="ln" x1="170" y1="66" x2="170" y2="128" marker-end="url(#raA)"/>
  <text x="178" y="101" class="sm muted">sb</text>
  <rect class="box-dash" x="480" y="30" width="220" height="36" rx="6"/>
  <text x="590" y="53" text-anchor="middle" class="mono sm muted">ready.load(acquire) → false</text>
  <rect class="box-acc" x="480" y="140" width="220" height="36" rx="6"/>
  <text x="590" y="163" text-anchor="middle" class="mono sm">ready.load(acquire) → true</text>
  <rect class="box" x="480" y="236" width="220" height="36" rx="6"/>
  <text x="590" y="259" text-anchor="middle" class="mono">assert(data == 42);</text>
  <line class="ln" x1="590" y1="66" x2="590" y2="138" marker-end="url(#raA)"/>
  <text x="582" y="101" text-anchor="end" class="sm muted">sb</text>
  <text x="600" y="101" class="sm muted">为 false 时循环</text>
  <line class="ln" x1="590" y1="176" x2="590" y2="234" marker-end="url(#raA)"/>
  <text x="582" y="210" text-anchor="end" class="sm muted">sb</text>
  <line class="ln-acc" x1="280" y1="150" x2="478" y2="158" marker-end="url(#raAAcc)"/>
  <text x="380" y="142" text-anchor="middle" class="sm acc-t">synchronizes-with</text>
  <polyline class="ln-blue-dash" points="58,48 30,48 30,300 560,300 560,274" marker-end="url(#raABlue)"/>
  <text x="295" y="294" text-anchor="middle" class="sm blue-t">happens-before（由 sb → sw → sb 推导）</text>
  <text x="0" y="324" class="sm">release store：前面的读写不能移到 store 后面</text>
  <text x="0" y="342" class="sm">acquire load：后面的读写不能移到 load 前面</text>
  <text x="0" y="360" class="sm muted">只有 acquire 读到 release 写入的那个值（true），才建立 synchronizes-with</text>
</svg>
