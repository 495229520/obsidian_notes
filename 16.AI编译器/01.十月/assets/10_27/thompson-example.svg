<svg xmlns="http://www.w3.org/2000/svg" width="792" height="360" viewBox="-16 -16 792 360" role="img" aria-label="(1+0)*1 的 Thompson NFA。A 经 ε 到 B、H，B 经 ε 分叉到 C、D。C 读 1 到 E，D 读 0 到 F。E、F 经 ε 汇入 G，G 经 ε 返回 A 或进入 H。H 经 ε 到 I，I 读 1 到接受状态 J。各状态同时标注第 4-3 讲图中的编号 0 到 9">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="360" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="teA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="teAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="teABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <circle class="st" cx="40" cy="130" r="20"/>
  <text x="40" y="129" text-anchor="middle" class="lg">A</text>
  <text x="40" y="142" text-anchor="middle" class="sm muted">0</text>
  <circle class="st" cx="120" cy="130" r="20"/>
  <text x="120" y="129" text-anchor="middle" class="lg">B</text>
  <text x="120" y="142" text-anchor="middle" class="sm muted">1</text>
  <circle class="st" cx="205" cy="80" r="20"/>
  <text x="205" y="79" text-anchor="middle" class="lg">C</text>
  <text x="205" y="92" text-anchor="middle" class="sm muted">2</text>
  <circle class="st" cx="205" cy="180" r="20"/>
  <text x="205" y="179" text-anchor="middle" class="lg">D</text>
  <text x="205" y="192" text-anchor="middle" class="sm muted">4</text>
  <circle class="st" cx="300" cy="80" r="20"/>
  <text x="300" y="79" text-anchor="middle" class="lg">E</text>
  <text x="300" y="92" text-anchor="middle" class="sm muted">3</text>
  <circle class="st" cx="300" cy="180" r="20"/>
  <text x="300" y="179" text-anchor="middle" class="lg">F</text>
  <text x="300" y="192" text-anchor="middle" class="sm muted">5</text>
  <circle class="st" cx="385" cy="130" r="20"/>
  <text x="385" y="129" text-anchor="middle" class="lg">G</text>
  <text x="385" y="142" text-anchor="middle" class="sm muted">6</text>
  <circle class="st" cx="480" cy="130" r="20"/>
  <text x="480" y="129" text-anchor="middle" class="lg">H</text>
  <text x="480" y="142" text-anchor="middle" class="sm muted">7</text>
  <circle class="st" cx="565" cy="130" r="20"/>
  <text x="565" y="129" text-anchor="middle" class="lg">I</text>
  <text x="565" y="142" text-anchor="middle" class="sm muted">8</text>
  <circle class="st-acc" cx="665" cy="130" r="20"/>
  <circle class="ring" cx="665" cy="130" r="16"/>
  <text x="665" y="129" text-anchor="middle" class="lg">J</text>
  <text x="665" y="142" text-anchor="middle" class="sm muted">9</text>
  <line class="ln" x1="-6" y1="130" x2="18.5" y2="130" marker-end="url(#teA)"/>
  <line class="ln" x1="60" y1="130" x2="98.5" y2="130" marker-end="url(#teA)"/>
  <text x="80" y="122" text-anchor="middle">ε</text>
  <line class="ln" x1="137.2" y1="119.9" x2="186.5" y2="90.9" marker-end="url(#teA)"/>
  <text x="152" y="96" text-anchor="middle">ε</text>
  <line class="ln" x1="137.2" y1="140.1" x2="186.5" y2="169.1" marker-end="url(#teA)"/>
  <text x="152" y="174" text-anchor="middle">ε</text>
  <line class="ln-acc" x1="225" y1="80" x2="278.5" y2="80" marker-end="url(#teAAcc)"/>
  <text x="252" y="72" text-anchor="middle" class="mono lg acc-t">1</text>
  <line class="ln-acc" x1="225" y1="180" x2="278.5" y2="180" marker-end="url(#teAAcc)"/>
  <text x="252" y="172" text-anchor="middle" class="mono lg acc-t">0</text>
  <line class="ln" x1="317.2" y1="90.1" x2="366.5" y2="119.1" marker-end="url(#teA)"/>
  <text x="352" y="96" text-anchor="middle">ε</text>
  <line class="ln" x1="317.2" y1="169.9" x2="366.5" y2="140.9" marker-end="url(#teA)"/>
  <text x="352" y="174" text-anchor="middle">ε</text>
  <line class="ln" x1="405" y1="130" x2="458.5" y2="130" marker-end="url(#teA)"/>
  <text x="432" y="122" text-anchor="middle">ε</text>
  <line class="ln" x1="500" y1="130" x2="543.5" y2="130" marker-end="url(#teA)"/>
  <text x="522" y="122" text-anchor="middle">ε</text>
  <line class="ln-acc" x1="585" y1="130" x2="643.5" y2="130" marker-end="url(#teAAcc)"/>
  <text x="615" y="122" text-anchor="middle" class="mono lg acc-t">1</text>
  <path class="ln" d="M385,110 C385,22 40,22 40,108.5" marker-end="url(#teA)"/>
  <text x="212" y="36" text-anchor="middle" class="sm">ε（重复）</text>
  <path class="ln" d="M40,150 C40,245 480,245 480,151.5" marker-end="url(#teA)"/>
  <text x="260" y="240" text-anchor="middle" class="sm">ε（重复 0 次）</text>
  <polyline class="ln-muted" points="100,258 100,264 405,264 405,258"/>
  <text x="252.5" y="279" text-anchor="middle" class="sm muted">(1 + 0)：并</text>
  <polyline class="ln-muted" points="545,258 545,264 685,264 685,258"/>
  <text x="615" y="279" text-anchor="middle" class="sm muted">1：字符</text>
  <polyline class="ln-muted" points="20,294 20,300 500,300 500,294"/>
  <text x="260" y="315" text-anchor="middle" class="sm muted">(1 + 0)*：重复</text>
  <text x="510" y="315" class="sm muted">H → I 的 ε = 连接</text>
  <text x="0" y="338" class="sm muted">大字母为 4-4 状态名，小数字为 4-3 图中编号；仅橙色边消耗输入。</text>
</svg>
