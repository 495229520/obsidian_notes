<svg xmlns="http://www.w3.org/2000/svg" width="792" height="244" viewBox="-16 -16 792 244" role="img" aria-label="首先是状态 S T U、输入 0 1 构成的二维转移表，每行都是 T U。其次，相同行只存一次，每个状态用指针引用该行。最后，将行为相同的字符归为一个等价类，减少列数">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="244" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="tdA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="tdAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="tdABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="0" y="4" class="lg">① 二维表 T[state][c]</text>
  <rect class="box" x="0" y="22" width="80" height="26"/>
  <rect class="box" x="80" y="22" width="70" height="26"/>
  <text x="115" y="40" text-anchor="middle" class="sm muted">输入 0</text>
  <rect class="box" x="150" y="22" width="70" height="26"/>
  <text x="185" y="40" text-anchor="middle" class="sm muted">输入 1</text>
  <rect class="box" x="0" y="48" width="80" height="32"/>
  <text x="10" y="69" class="sm">S（开始）</text>
  <rect class="box" x="80" y="48" width="70" height="32"/>
  <text x="115" y="70" text-anchor="middle" class="mono lg">T</text>
  <rect class="box" x="150" y="48" width="70" height="32"/>
  <text x="185" y="70" text-anchor="middle" class="mono lg">U</text>
  <rect class="box" x="0" y="80" width="80" height="32"/>
  <text x="10" y="101" class="sm">T</text>
  <rect class="box" x="80" y="80" width="70" height="32"/>
  <text x="115" y="102" text-anchor="middle" class="mono lg">T</text>
  <rect class="box" x="150" y="80" width="70" height="32"/>
  <text x="185" y="102" text-anchor="middle" class="mono lg">U</text>
  <rect class="box" x="0" y="112" width="80" height="32"/>
  <text x="10" y="133" class="sm">U（接受）</text>
  <rect class="box" x="80" y="112" width="70" height="32"/>
  <text x="115" y="134" text-anchor="middle" class="mono lg">T</text>
  <rect class="box" x="150" y="112" width="70" height="32"/>
  <text x="185" y="134" text-anchor="middle" class="mono lg">U</text>
  <text x="0" y="166" class="sm muted">3 个状态 × 2 个字符 = 6 格</text>
  <text x="0" y="182" class="sm muted">按 ASCII 字节建表，每状态 256 格</text>
  <text x="270" y="4" class="lg">② 相同行只存一次</text>
  <rect class="box" x="270" y="48" width="60" height="32"/>
  <text x="286" y="69" text-anchor="middle" class="mono lg">S</text>
  <circle cx="316" cy="64" r="3" class="head"/>
  <rect class="box" x="270" y="80" width="60" height="32"/>
  <text x="286" y="101" text-anchor="middle" class="mono lg">T</text>
  <circle cx="316" cy="96" r="3" class="head"/>
  <rect class="box" x="270" y="112" width="60" height="32"/>
  <text x="286" y="133" text-anchor="middle" class="mono lg">U</text>
  <circle cx="316" cy="128" r="3" class="head"/>
  <rect class="box-blue" x="420" y="80" width="50" height="32"/>
  <text x="445" y="102" text-anchor="middle" class="mono lg">T</text>
  <text x="445" y="72" text-anchor="middle" class="sm muted">0</text>
  <rect class="box-blue" x="470" y="80" width="50" height="32"/>
  <text x="495" y="102" text-anchor="middle" class="mono lg">U</text>
  <text x="495" y="72" text-anchor="middle" class="sm muted">1</text>
  <line class="ln" x1="320" y1="64" x2="417" y2="90" marker-end="url(#tdA)"/>
  <line class="ln" x1="320" y1="96" x2="417" y2="96" marker-end="url(#tdA)"/>
  <line class="ln" x1="320" y1="128" x2="417" y2="102" marker-end="url(#tdA)"/>
  <text x="270" y="166" class="mono sm">next = rows[state][c]</text>
  <text x="270" y="182" class="sm muted">节省空间，多一次间接引用</text>
  <text x="560" y="4" class="lg">③ 字符等价类</text>
  <rect class="box" x="560" y="22" width="120" height="26"/>
  <rect class="box" x="680" y="22" width="70" height="26"/>
  <text x="620" y="40" text-anchor="middle" class="mono sm">c</text>
  <text x="715" y="40" text-anchor="middle" class="mono sm">ec[c]</text>
  <rect class="box" x="560" y="48" width="120" height="32"/>
  <rect class="box" x="680" y="48" width="70" height="32"/>
  <text x="620" y="69" text-anchor="middle" class="mono sm">'a' … 'z'</text>
  <text x="715" y="70" text-anchor="middle" class="mono lg">1</text>
  <rect class="box" x="560" y="80" width="120" height="32"/>
  <rect class="box" x="680" y="80" width="70" height="32"/>
  <text x="620" y="101" text-anchor="middle" class="mono sm">'0' … '9'</text>
  <text x="715" y="102" text-anchor="middle" class="mono lg">2</text>
  <rect class="box" x="560" y="112" width="120" height="32"/>
  <rect class="box" x="680" y="112" width="70" height="32"/>
  <text x="620" y="133" text-anchor="middle" class="mono sm">' ' '\t' '\n'</text>
  <text x="715" y="134" text-anchor="middle" class="mono lg">3</text>
  <text x="560" y="166" class="mono sm">next = T[state][ec[c]]</text>
  <text x="560" y="182" class="sm muted">256 列 → 等价类数量</text>
  <text x="0" y="214" class="sm muted">flex 默认 (-Cem) 在③基础上按“默认状态 + 差异”压缩相似行。-f(-Cfr) 为不压缩的完整表。</text>
</svg>
