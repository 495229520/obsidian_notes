<svg xmlns="http://www.w3.org/2000/svg" width="792" height="344" viewBox="-16 -16 792 344" role="img" aria-label="Thompson 构造的五条规则。空串与单字符用一条边连接开始和接受状态。连接 AB 用 ε 边连接 A 的接受状态与 B 的开始状态。并 A+B 从新开始状态经 ε 分叉进入 A、B，再汇合到新接受状态。重复 A* 从新开始进入 A，并设置从 A 末尾返回新开始的 ε 边，以及从新开始跳到新接受的 ε 边">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="344" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="trA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="trAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="trABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="0" y="4" class="lg">ε（空串）</text>
  <circle class="st" cx="36" cy="56" r="13"/>
  <circle class="st-acc" cx="116" cy="56" r="13"/>
  <circle class="ring" cx="116" cy="56" r="9"/>
  <line class="ln" x1="3" y1="56" x2="21.5" y2="56" marker-end="url(#trA)"/>
  <line class="ln" x1="49" y1="56" x2="101.5" y2="56" marker-end="url(#trA)"/>
  <text x="76" y="49" text-anchor="middle">ε</text>
  <text x="170" y="4" class="lg">a（单字符）</text>
  <circle class="st" cx="206" cy="56" r="13"/>
  <circle class="st-acc" cx="286" cy="56" r="13"/>
  <circle class="ring" cx="286" cy="56" r="9"/>
  <line class="ln" x1="173" y1="56" x2="191.5" y2="56" marker-end="url(#trA)"/>
  <line class="ln-acc" x1="219" y1="56" x2="271.5" y2="56" marker-end="url(#trAAcc)"/>
  <text x="246" y="49" text-anchor="middle" class="mono lg acc-t">a</text>
  <text x="350" y="4" class="lg">AB（连接）</text>
  <rect class="box-dash" x="380" y="34" width="160" height="44" rx="8"/>
  <circle class="st" cx="398" cy="56" r="13"/>
  <circle class="st" cx="522" cy="56" r="13"/>
  <text x="460" y="61" text-anchor="middle" class="lg">A</text>
  <rect class="box-dash" x="590" y="34" width="160" height="44" rx="8"/>
  <circle class="st" cx="608" cy="56" r="13"/>
  <circle class="st-acc" cx="732" cy="56" r="13"/>
  <circle class="ring" cx="732" cy="56" r="9"/>
  <text x="670" y="61" text-anchor="middle" class="lg">B</text>
  <line class="ln" x1="357" y1="56" x2="383.5" y2="56" marker-end="url(#trA)"/>
  <line class="ln" x1="535" y1="56" x2="593.5" y2="56" marker-end="url(#trA)"/>
  <text x="565" y="49" text-anchor="middle">ε</text>
  <text x="380" y="98" class="sm muted">A 的接受状态改为普通状态，经 ε 连接 B 的开始状态</text>
  <text x="0" y="128" class="lg">A + B（并）</text>
  <circle class="st" cx="30" cy="214" r="13"/>
  <line class="ln" x1="-3" y1="214" x2="15.5" y2="214" marker-end="url(#trA)"/>
  <rect class="box-dash" x="76" y="142" width="188" height="44" rx="8"/>
  <circle class="st" cx="94" cy="164" r="13"/>
  <circle class="st" cx="246" cy="164" r="13"/>
  <text x="170" y="169" text-anchor="middle" class="lg">A</text>
  <rect class="box-dash" x="76" y="242" width="188" height="44" rx="8"/>
  <circle class="st" cx="94" cy="264" r="13"/>
  <circle class="st" cx="246" cy="264" r="13"/>
  <text x="170" y="269" text-anchor="middle" class="lg">B</text>
  <circle class="st-acc" cx="316" cy="214" r="13"/>
  <circle class="ring" cx="316" cy="214" r="9"/>
  <line class="ln" x1="40.2" y1="206" x2="82.6" y2="172.9" marker-end="url(#trA)"/>
  <text x="52" y="182" text-anchor="middle">ε</text>
  <line class="ln" x1="40.2" y1="222" x2="82.6" y2="255.1" marker-end="url(#trA)"/>
  <text x="52" y="256" text-anchor="middle">ε</text>
  <line class="ln" x1="256.6" y1="171.6" x2="304.2" y2="205.6" marker-end="url(#trA)"/>
  <text x="292" y="182" text-anchor="middle">ε</text>
  <line class="ln" x1="256.6" y1="256.4" x2="304.2" y2="222.4" marker-end="url(#trA)"/>
  <text x="292" y="256" text-anchor="middle">ε</text>
  <text x="380" y="128" class="lg">A*（重复）</text>
  <circle class="st" cx="420" cy="214" r="13"/>
  <line class="ln" x1="385" y1="214" x2="405.5" y2="214" marker-end="url(#trA)"/>
  <rect class="box-dash" x="480" y="192" width="180" height="44" rx="8"/>
  <circle class="st" cx="498" cy="214" r="13"/>
  <circle class="st" cx="642" cy="214" r="13"/>
  <text x="570" y="219" text-anchor="middle" class="lg">A</text>
  <circle class="st-acc" cx="730" cy="214" r="13"/>
  <circle class="ring" cx="730" cy="214" r="9"/>
  <line class="ln" x1="433" y1="214" x2="483.5" y2="214" marker-end="url(#trA)"/>
  <text x="458" y="207" text-anchor="middle">ε</text>
  <line class="ln" x1="655" y1="214" x2="715.5" y2="214" marker-end="url(#trA)"/>
  <text x="687" y="207" text-anchor="middle">ε</text>
  <path class="ln" d="M642,201 C642,148 420,148 420,199.5" marker-end="url(#trA)"/>
  <text x="531" y="154" text-anchor="middle" class="sm">ε（再次重复）</text>
  <path class="ln" d="M420,227 C420,290 730,290 730,228.5" marker-end="url(#trA)"/>
  <text x="575" y="292" text-anchor="middle" class="sm">ε（重复 0 次）</text>
  <text x="0" y="316" class="sm acc-t">每个片段：一个开始、一个接受 → 可组合</text>
  <text x="380" y="316" class="sm muted">有些教材将回边连到 A 的开始状态（§4.2）</text>
</svg>
