<svg xmlns="http://www.w3.org/2000/svg" width="792" height="228" viewBox="-16 -16 792 228" role="img" aria-label="生成时将词法规格说明依次经 Thompson 构造转换为 NFA、经子集构造转换为 DFA，再最小化并生成转移表。运行时驱动循环查表读取源字符串，生成 Token 序列并交给解析器">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="228" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="plA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="plAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="plABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="0" y="4" class="sm muted">生成时：flex、re2c 等工具读取规格说明，执行一次</text>
  <rect class="box" x="0" y="14" width="124" height="62" rx="6"/>
  <text x="62" y="36" text-anchor="middle" class="lg">词法规格说明</text>
  <text x="62" y="54" text-anchor="middle" class="sm">每种词法单元的正则式</text>
  <text x="62" y="69" text-anchor="middle" class="sm muted">R = R₁ + … + Rₙ</text>
  <rect class="box" x="159" y="14" width="124" height="62" rx="6"/>
  <text x="221" y="36" text-anchor="middle" class="lg">NFA</text>
  <text x="221" y="54" text-anchor="middle" class="sm">Thompson 构造</text>
  <text x="221" y="69" text-anchor="middle" class="sm muted">大小与时间均为线性</text>
  <line class="ln" x1="126" y1="45" x2="156" y2="45" marker-end="url(#plA)"/>
  <rect class="box" x="318" y="14" width="124" height="62" rx="6"/>
  <text x="380" y="36" text-anchor="middle" class="lg">DFA</text>
  <text x="380" y="54" text-anchor="middle" class="sm">子集构造</text>
  <text x="380" y="69" text-anchor="middle" class="sm muted">最坏 2ⁿ 个状态</text>
  <line class="ln" x1="285" y1="45" x2="315" y2="45" marker-end="url(#plA)"/>
  <rect class="box" x="477" y="14" width="124" height="62" rx="6"/>
  <text x="539" y="36" text-anchor="middle" class="lg">最小 DFA</text>
  <text x="539" y="54" text-anchor="middle" class="sm">Hopcroft</text>
  <text x="539" y="69" text-anchor="middle" class="sm muted">合并不可区分的状态</text>
  <line class="ln" x1="444" y1="45" x2="474" y2="45" marker-end="url(#plA)"/>
  <rect class="box-blue" x="636" y="14" width="124" height="62" rx="6"/>
  <text x="698" y="36" text-anchor="middle" class="lg">转移表</text>
  <text x="698" y="54" text-anchor="middle" class="sm mono">T[state][c]</text>
  <text x="698" y="69" text-anchor="middle" class="sm muted">行列压缩</text>
  <line class="ln" x1="603" y1="45" x2="633" y2="45" marker-end="url(#plA)"/>
  <text x="0" y="116" class="sm muted">运行时：对每个源文件执行</text>
  <rect class="box" x="0" y="128" width="150" height="60" rx="6"/>
  <text x="75" y="152" text-anchor="middle" class="lg">源字符串</text>
  <text x="75" y="172" text-anchor="middle" class="mono">if(x==0)</text>
  <rect class="box-acc" x="220" y="128" width="230" height="60" rx="6"/>
  <text x="335" y="149" text-anchor="middle" class="lg">驱动循环</text>
  <text x="335" y="166" text-anchor="middle" class="mono sm">state = T[state][c]</text>
  <text x="335" y="181" text-anchor="middle" class="sm">最长匹配 · 优先级 · 回退</text>
  <rect class="box" x="500" y="128" width="140" height="60" rx="6"/>
  <text x="570" y="152" text-anchor="middle" class="lg">Token 序列</text>
  <text x="570" y="172" text-anchor="middle" class="mono sm">IF ( ID EQ INT )</text>
  <rect class="box" x="680" y="128" width="80" height="60" rx="6"/>
  <text x="720" y="163" text-anchor="middle" class="lg">解析器</text>
  <line class="ln" x1="150" y1="158" x2="218" y2="158" marker-end="url(#plA)"/>
  <line class="ln" x1="450" y1="158" x2="498" y2="158" marker-end="url(#plA)"/>
  <line class="ln" x1="640" y1="158" x2="678" y2="158" marker-end="url(#plA)"/>
  <polyline class="ln" points="698,76 698,100 335,100 335,126" marker-end="url(#plA)"/>
  <text x="516" y="94" text-anchor="middle" class="sm muted">直接使用已生成的表</text>
  <text x="0" y="206" class="sm muted">正则式描述“识别什么”，自动机决定“如何实现”；高开销转换只在生成时做一次。</text>
</svg>
