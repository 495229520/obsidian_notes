<svg xmlns="http://www.w3.org/2000/svg" width="792" height="228" viewBox="-16 -16 792 228" role="img" aria-label="어휘 분석기는 문자열을 lexeme 경계로 나누고 각 조각에 범주를 붙인다. 공백 Token은 버리고 나머지 Token 열을 구문 분석기에 넘긴다.">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .guard { fill: none; stroke: #D97757; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .band { fill: #F5DDD1; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.5; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="228" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="lxA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="20" y="22" class="sm muted">입력 문자열</text>
  <g class="mono">
    <rect class="box" x="20" y="32" width="34" height="34"/><text x="37" y="54" text-anchor="middle" class="sm muted">\t</text>
    <rect class="box" x="54" y="32" width="34" height="34"/><text x="71" y="54" text-anchor="middle">i</text>
    <rect class="box" x="88" y="32" width="34" height="34"/><text x="105" y="54" text-anchor="middle">f</text>
    <rect class="box" x="122" y="32" width="34" height="34"/><text x="139" y="54" text-anchor="middle" class="sm muted">␠</text>
    <rect class="box" x="156" y="32" width="34" height="34"/><text x="173" y="54" text-anchor="middle">(</text>
    <rect class="box" x="190" y="32" width="34" height="34"/><text x="207" y="54" text-anchor="middle">i</text>
    <rect class="box" x="224" y="32" width="34" height="34"/><text x="241" y="54" text-anchor="middle" class="sm muted">␠</text>
    <rect class="box" x="258" y="32" width="34" height="34"/><text x="275" y="54" text-anchor="middle">=</text>
    <rect class="box" x="292" y="32" width="34" height="34"/><text x="309" y="54" text-anchor="middle">=</text>
    <rect class="box" x="326" y="32" width="34" height="34"/><text x="343" y="54" text-anchor="middle" class="sm muted">␠</text>
    <rect class="box" x="360" y="32" width="34" height="34"/><text x="377" y="54" text-anchor="middle">j</text>
    <rect class="box" x="394" y="32" width="34" height="34"/><text x="411" y="54" text-anchor="middle">)</text>
  </g>
  <g class="ln-muted">
    <line x1="20" y1="66" x2="20" y2="116"/><line x1="54" y1="66" x2="54" y2="116"/><line x1="122" y1="66" x2="122" y2="116"/>
    <line x1="156" y1="66" x2="156" y2="116"/><line x1="190" y1="66" x2="190" y2="116"/><line x1="224" y1="66" x2="224" y2="116"/>
    <line x1="258" y1="66" x2="258" y2="116"/><line x1="326" y1="66" x2="326" y2="116"/><line x1="360" y1="66" x2="360" y2="116"/>
    <line x1="394" y1="66" x2="394" y2="116"/><line x1="428" y1="66" x2="428" y2="116"/>
  </g>
  <text x="444" y="88" class="sm">lexeme 경계 = 분할</text>
  <text x="444" y="104" class="sm muted">최장 일치: "==" 는 한 조각</text>

  <g>
    <rect class="box-dash" x="20" y="116" width="34" height="42"/><text x="37" y="136" text-anchor="middle" class="sm muted">W</text>
    <rect class="box-acc" x="54" y="116" width="68" height="42"/><text x="88" y="134" text-anchor="middle" class="lg">K</text><text x="88" y="151" text-anchor="middle" class="mono sm">"if"</text>
    <rect class="box-dash" x="122" y="116" width="34" height="42"/><text x="139" y="136" text-anchor="middle" class="sm muted">W</text>
    <rect class="box" x="156" y="116" width="34" height="42"/><text x="173" y="141" text-anchor="middle" class="lg mono">(</text>
    <rect class="box" x="190" y="116" width="34" height="42"/><text x="207" y="134" text-anchor="middle" class="lg">I</text><text x="207" y="151" text-anchor="middle" class="mono sm">"i"</text>
    <rect class="box-dash" x="224" y="116" width="34" height="42"/><text x="241" y="136" text-anchor="middle" class="sm muted">W</text>
    <rect class="box" x="258" y="116" width="68" height="42"/><text x="292" y="134" text-anchor="middle" class="lg">O</text><text x="292" y="151" text-anchor="middle" class="mono sm">"=="</text>
    <rect class="box-dash" x="326" y="116" width="34" height="42"/><text x="343" y="136" text-anchor="middle" class="sm muted">W</text>
    <rect class="box" x="360" y="116" width="34" height="42"/><text x="377" y="134" text-anchor="middle" class="lg">I</text><text x="377" y="151" text-anchor="middle" class="mono sm">"j"</text>
    <rect class="box" x="394" y="116" width="34" height="42"/><text x="411" y="141" text-anchor="middle" class="lg mono">)</text>
  </g>
  <text x="20" y="180" class="sm muted">점선 W(공백)는 파서에 넘기지 않는다</text>

  <line class="ln" x1="432" y1="138" x2="556" y2="138" marker-end="url(#lxA)"/>
  <text x="494" y="130" text-anchor="middle" class="sm">Token 열</text>
  <rect class="box" x="560" y="112" width="180" height="56" rx="6"/>
  <text x="650" y="135" text-anchor="middle" class="lg">구문 분석기</text>
  <text x="650" y="155" text-anchor="middle" class="mono sm muted">K ( I O I ) …</text>
    </svg>
