<svg xmlns="http://www.w3.org/2000/svg" width="792" height="280" viewBox="-16 -16 792 280" role="img" aria-label="按规则和前缀长度组成的网格。输入 if (x 中，长度 1 的 i 匹配 Identifier 和 Error，长度 2 的 if 匹配 Keyword 和 Identifier，长度 3 无匹配。先选最长的 2，再选优先级最高的 Keyword。输入 $x 时，长度 1 的 $ 只匹配 Error，因此报错并跳过一个字符">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; font-size: 12.5px; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', 'Noto Sans SC', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cell-hi { fill: #F5DDD1; stroke: #B0AEA5; stroke-width: 1.2; }
    .sel { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .ring { fill: none; stroke: #D97757; stroke-width: 1.2; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-blue-dash { stroke: #4F7FAF; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="280" rx="14" fill="#F0EEE6"/>
  <defs>
    <marker id="cgA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cgAAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cgABlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text x="0" y="4" class="lg">① 输入 "if (x"</text>
  <rect class="box" x="108" y="16" width="64" height="36"/>
  <text x="140" y="30" text-anchor="middle" class="sm muted">长度 1</text>
  <text x="140" y="46" text-anchor="middle" class="mono">i</text>
  <rect class="cell-hi" x="172" y="16" width="64" height="36"/>
  <text x="204" y="30" text-anchor="middle" class="sm muted">长度 2</text>
  <text x="204" y="46" text-anchor="middle" class="mono">if</text>
  <rect class="box" x="236" y="16" width="64" height="36"/>
  <text x="268" y="30" text-anchor="middle" class="sm muted">长度 3</text>
  <text x="268" y="46" text-anchor="middle" class="mono">if␠</text>
  <rect class="box" x="0" y="52" width="108" height="26"/>
  <text x="8" y="69" class="sm muted">1</text>
  <text x="22" y="69">Keyword</text>
  <rect class="box" x="108" y="52" width="64" height="26"/>
  <rect class="sel" x="172" y="52" width="64" height="26"/>
  <text x="204" y="70" text-anchor="middle" class="lg acc-t">✓</text>
  <rect class="box" x="236" y="52" width="64" height="26"/>
  <rect class="box" x="0" y="78" width="108" height="26"/>
  <text x="8" y="95" class="sm muted">2</text>
  <text x="22" y="95">Identifier</text>
  <rect class="box" x="108" y="78" width="64" height="26"/>
  <text x="140" y="96" text-anchor="middle" class="blue-t">✓</text>
  <rect class="cell-hi" x="172" y="78" width="64" height="26"/>
  <text x="204" y="96" text-anchor="middle" class="blue-t">✓</text>
  <rect class="box" x="236" y="78" width="64" height="26"/>
  <rect class="box" x="0" y="104" width="108" height="26"/>
  <text x="8" y="121" class="sm muted">3</text>
  <text x="22" y="121">Integer</text>
  <rect class="box" x="108" y="104" width="64" height="26"/>
  <rect class="cell-hi" x="172" y="104" width="64" height="26"/>
  <rect class="box" x="236" y="104" width="64" height="26"/>
  <rect class="box" x="0" y="130" width="108" height="26"/>
  <text x="8" y="147" class="sm muted">4</text>
  <text x="22" y="147">Whitespace</text>
  <rect class="box" x="108" y="130" width="64" height="26"/>
  <rect class="cell-hi" x="172" y="130" width="64" height="26"/>
  <rect class="box" x="236" y="130" width="64" height="26"/>
  <rect class="box" x="0" y="156" width="108" height="26"/>
  <text x="8" y="173" class="sm muted">5</text>
  <text x="22" y="173">OpenPar</text>
  <rect class="box" x="108" y="156" width="64" height="26"/>
  <rect class="cell-hi" x="172" y="156" width="64" height="26"/>
  <rect class="box" x="236" y="156" width="64" height="26"/>
  <rect class="box" x="0" y="182" width="108" height="26"/>
  <text x="8" y="199" class="sm muted">6</text>
  <text x="22" y="199">Error</text>
  <rect class="box" x="108" y="182" width="64" height="26"/>
  <text x="140" y="200" text-anchor="middle" class="blue-t">✓</text>
  <rect class="cell-hi" x="172" y="182" width="64" height="26"/>
  <rect class="box" x="236" y="182" width="64" height="26"/>
  <text x="0" y="232" class="sm acc-t">最长长度 = 2 → 该列最高优先级 = Keyword</text>
  <text x="0" y="250" class="sm muted">i（长度 1）也匹配 Identifier，但更短而落选</text>
  <text x="336" y="4" class="lg">② 输入 "$x"（$ 不是合法词法单元）</text>
  <rect class="cell-hi" x="444" y="16" width="64" height="36"/>
  <text x="476" y="30" text-anchor="middle" class="sm muted">长度 1</text>
  <text x="476" y="46" text-anchor="middle" class="mono">$</text>
  <rect class="box" x="508" y="16" width="64" height="36"/>
  <text x="540" y="30" text-anchor="middle" class="sm muted">长度 2</text>
  <text x="540" y="46" text-anchor="middle" class="mono">$x</text>
  <rect class="box" x="336" y="52" width="108" height="26"/>
  <text x="344" y="69" class="sm muted">1</text>
  <text x="358" y="69">Keyword</text>
  <rect class="cell-hi" x="444" y="52" width="64" height="26"/>
  <rect class="box" x="508" y="52" width="64" height="26"/>
  <rect class="box" x="336" y="78" width="108" height="26"/>
  <text x="344" y="95" class="sm muted">2</text>
  <text x="358" y="95">Identifier</text>
  <rect class="cell-hi" x="444" y="78" width="64" height="26"/>
  <rect class="box" x="508" y="78" width="64" height="26"/>
  <rect class="box" x="336" y="104" width="108" height="26"/>
  <text x="344" y="121" class="sm muted">3</text>
  <text x="358" y="121">Integer</text>
  <rect class="cell-hi" x="444" y="104" width="64" height="26"/>
  <rect class="box" x="508" y="104" width="64" height="26"/>
  <rect class="box" x="336" y="130" width="108" height="26"/>
  <text x="344" y="147" class="sm muted">4</text>
  <text x="358" y="147">Whitespace</text>
  <rect class="cell-hi" x="444" y="130" width="64" height="26"/>
  <rect class="box" x="508" y="130" width="64" height="26"/>
  <rect class="box" x="336" y="156" width="108" height="26"/>
  <text x="344" y="173" class="sm muted">5</text>
  <text x="358" y="173">OpenPar</text>
  <rect class="cell-hi" x="444" y="156" width="64" height="26"/>
  <rect class="box" x="508" y="156" width="64" height="26"/>
  <rect class="box" x="336" y="182" width="108" height="26"/>
  <text x="344" y="199" class="sm muted">6</text>
  <text x="358" y="199">Error</text>
  <rect class="sel" x="444" y="182" width="64" height="26"/>
  <text x="476" y="200" text-anchor="middle" class="lg acc-t">✓</text>
  <rect class="box" x="508" y="182" width="64" height="26"/>
  <text x="336" y="232" class="sm acc-t">仅匹配 Error → 报告错误</text>
  <text x="336" y="250" class="sm muted">丢弃字符 $，从 x 继续</text>
  <rect class="box" x="600" y="16" width="160" height="192" rx="6"/>
  <text x="612" y="40" class="lg">决策顺序</text>
  <text x="612" y="64" class="sm">① 在有匹配的列中</text>
  <text x="612" y="80" class="sm">    选最长长度（最长匹配）</text>
  <text x="612" y="104" class="sm">② 在该列中选择</text>
  <text x="612" y="120" class="sm">    编号最小的规则（优先级）</text>
  <text x="612" y="144" class="sm">③ Error 对所有字符</text>
  <text x="612" y="160" class="sm">    都匹配长度 1（兜底）</text>
  <text x="612" y="190" class="sm muted">空格 = 该长度没有匹配</text>
</svg>
