<svg xmlns="http://www.w3.org/2000/svg" width="792" height="332" viewBox="-16 -16 792 332" role="img" aria-label="用带槽位的模板表示 EXPR 三条规则，以嵌套方框展示完整 while 或 if 表达式放入另一个 if 的条件位置。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="332" rx="14" fill="#F0EEE6" />
  <defs><marker id="nstsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker><marker id="nstsAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="nstsBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">规则模板：槽位可放入任何由 EXPR 推导出的结构</text>
  <rect class="box" x="0" y="28" width="272" height="36" rx="5" />
  <text class="mono" x="14.5" y="50.3" text-anchor="middle" xml:space="preserve">if</text>
  <rect class="box-dash" x="28" y="33" width="44" height="26" rx="5" />
  <text class="muted mono" x="50" y="50.3" text-anchor="middle" xml:space="preserve">EXPR</text>
  <text class="mono" x="93" y="50.3" text-anchor="middle" xml:space="preserve">then</text>
  <rect class="box-dash" x="114" y="33" width="44" height="26" rx="5" />
  <text class="muted mono" x="136" y="50.3" text-anchor="middle" xml:space="preserve">EXPR</text>
  <text class="mono" x="179" y="50.3" text-anchor="middle" xml:space="preserve">else</text>
  <rect class="box-dash" x="200" y="33" width="44" height="26" rx="5" />
  <text class="muted mono" x="222" y="50.3" text-anchor="middle" xml:space="preserve">EXPR</text>
  <text class="mono" x="257.5" y="50.3" text-anchor="middle" xml:space="preserve">fi</text>
  <rect class="box" x="290" y="28" width="223.5" height="36" rx="5" />
  <text class="mono" x="315.75" y="50.3" text-anchor="middle" xml:space="preserve">while</text>
  <rect class="box-dash" x="340.5" y="33" width="44" height="26" rx="5" />
  <text class="muted mono" x="362.5" y="50.3" text-anchor="middle" xml:space="preserve">EXPR</text>
  <text class="mono" x="405.5" y="50.3" text-anchor="middle" xml:space="preserve">loop</text>
  <rect class="box-dash" x="426.5" y="33" width="44" height="26" rx="5" />
  <text class="muted mono" x="448.5" y="50.3" text-anchor="middle" xml:space="preserve">EXPR</text>
  <text class="mono" x="491.5" y="50.3" text-anchor="middle" xml:space="preserve">pool</text>
  <rect class="box" x="531.5" y="33" width="29" height="26" rx="5" />
  <text class="mono" x="546" y="50.3" text-anchor="middle" xml:space="preserve">id</text>
  <line class="ln-muted" x1="0" y1="80" x2="760" y2="80" />
  <text class="b mono" x="0" y="104" xml:space="preserve">if while id loop id pool then id else id fi</text>
  <rect class="box" x="0" y="117" width="391.5" height="46" rx="5" />
  <text class="mono" x="14.5" y="144.3" text-anchor="middle" xml:space="preserve">if</text>
  <rect class="box-acc" x="28" y="122" width="193.5" height="36" rx="5" />
  <text class="mono" x="53.75" y="144.3" text-anchor="middle" xml:space="preserve">while</text>
  <rect class="box-blue" x="78.5" y="127" width="29" height="26" rx="5" />
  <text class="mono" x="93" y="144.3" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="128.5" y="144.3" text-anchor="middle" xml:space="preserve">loop</text>
  <rect class="box-blue" x="149.5" y="127" width="29" height="26" rx="5" />
  <text class="mono" x="164" y="144.3" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="199.5" y="144.3" text-anchor="middle" xml:space="preserve">pool</text>
  <text class="mono" x="242.5" y="144.3" text-anchor="middle" xml:space="preserve">then</text>
  <rect class="box-acc" x="263.5" y="127" width="29" height="26" rx="5" />
  <text class="mono" x="278" y="144.3" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="313.5" y="144.3" text-anchor="middle" xml:space="preserve">else</text>
  <rect class="box-acc" x="334.5" y="127" width="29" height="26" rx="5" />
  <text class="mono" x="349" y="144.3" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="377" y="144.3" text-anchor="middle" xml:space="preserve">fi</text>
  <text class="sm" x="411.5" y="134" xml:space="preserve">完整 while 表达式</text>
  <text class="sm" x="411.5" y="150" xml:space="preserve">放入 if 的条件槽位</text>
  <text class="b mono" x="0" y="190" xml:space="preserve">if if id then id else id fi then id else id fi</text>
  <rect class="box" x="0" y="203" width="425" height="46" rx="5" />
  <text class="mono" x="14.5" y="230.3" text-anchor="middle" xml:space="preserve">if</text>
  <rect class="box-acc" x="28" y="208" width="227" height="36" rx="5" />
  <text class="mono" x="42.5" y="230.3" text-anchor="middle" xml:space="preserve">if</text>
  <rect class="box-blue" x="56" y="213" width="29" height="26" rx="5" />
  <text class="mono" x="70.5" y="230.3" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="106" y="230.3" text-anchor="middle" xml:space="preserve">then</text>
  <rect class="box-blue" x="127" y="213" width="29" height="26" rx="5" />
  <text class="mono" x="141.5" y="230.3" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="177" y="230.3" text-anchor="middle" xml:space="preserve">else</text>
  <rect class="box-blue" x="198" y="213" width="29" height="26" rx="5" />
  <text class="mono" x="212.5" y="230.3" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="240.5" y="230.3" text-anchor="middle" xml:space="preserve">fi</text>
  <text class="mono" x="276" y="230.3" text-anchor="middle" xml:space="preserve">then</text>
  <rect class="box-acc" x="297" y="213" width="29" height="26" rx="5" />
  <text class="mono" x="311.5" y="230.3" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="347" y="230.3" text-anchor="middle" xml:space="preserve">else</text>
  <rect class="box-acc" x="368" y="213" width="29" height="26" rx="5" />
  <text class="mono" x="382.5" y="230.3" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="410.5" y="230.3" text-anchor="middle" xml:space="preserve">fi</text>
  <text class="sm" x="445" y="220" xml:space="preserve">完整 if 表达式</text>
  <text class="sm" x="445" y="236" xml:space="preserve">放入另一个 if 的条件槽位</text>
  <text class="sm muted" x="0" y="280" xml:space="preserve">槽位可再次容纳同类结构，因此文法没有固定深度上限。条件类型由后续语义分析检查。</text>
</svg>