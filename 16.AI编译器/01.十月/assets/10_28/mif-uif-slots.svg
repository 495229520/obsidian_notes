<svg xmlns="http://www.w3.org/2000/svg" width="792" height="300" viewBox="-16 -16 792 300" role="img" aria-label="用槽位表示 MIF/UIF 规则：MIF 闭合，UIF 开放，E 可为两者。带 else 的规则中 then 槽位始终为 MIF，避免 else 跳过内层开放的 if 而连接外层。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="300" rx="14" fill="#F0EEE6" />
  <defs><marker id="mustsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker><marker id="mustsAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="mustsBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <rect class="box-blue" x="0" y="0" width="14" height="14" rx="3" />
  <text class="sm" x="20" y="11.5" xml:space="preserve">MIF：闭合，不接收后续 else</text>
  <rect class="box-acc" x="236" y="0" width="14" height="14" rx="3" />
  <text class="sm" x="256" y="11.5" xml:space="preserve">UIF：开放，可接收后续 else</text>
  <rect class="box" x="472" y="0" width="14" height="14" rx="3" />
  <text class="sm" x="492" y="11.5" xml:space="preserve">E：两者均可</text>
  <rect class="box-blue" x="1" y="39" width="46" height="30" rx="6" />
  <text class="mono" x="24" y="58.3" text-anchor="middle" xml:space="preserve">MIF</text>
  <text x="55" y="58.5" text-anchor="middle" xml:space="preserve">→</text>
  <text class="mono" x="70" y="58.5" xml:space="preserve">if</text>
  <rect class="box" x="92" y="39" width="30" height="30" rx="6" />
  <text class="mono" x="107" y="58.3" text-anchor="middle" xml:space="preserve">E</text>
  <text class="mono" x="138" y="58.5" xml:space="preserve">then</text>
  <rect class="box-strong" x="178" y="39" width="56" height="30" rx="6" />
  <text class="mono" x="206" y="58.3" text-anchor="middle" xml:space="preserve">MIF</text>
  <text class="mono" x="244" y="58.5" xml:space="preserve">else</text>
  <rect class="box-blue" x="284" y="39" width="56" height="30" rx="6" />
  <text class="mono" x="312" y="58.3" text-anchor="middle" xml:space="preserve">MIF</text>
  <text class="sm" x="356" y="58.5" xml:space="preserve">除条件外各槽位都闭合，因此整体也闭合</text>
  <rect class="box-blue" x="1" y="85" width="46" height="30" rx="6" />
  <text class="mono" x="24" y="104.3" text-anchor="middle" xml:space="preserve">MIF</text>
  <text x="55" y="104.5" text-anchor="middle" xml:space="preserve">→</text>
  <rect class="box" x="68" y="85" width="64" height="30" rx="6" />
  <text class="mono" x="100" y="104.3" text-anchor="middle" xml:space="preserve">OTHER</text>
  <text class="sm" x="356" y="104.5" xml:space="preserve">基本结构，不含 if，已经闭合</text>
  <rect class="box-acc" x="1" y="131" width="46" height="30" rx="6" />
  <text class="mono" x="24" y="150.3" text-anchor="middle" xml:space="preserve">UIF</text>
  <text x="55" y="150.5" text-anchor="middle" xml:space="preserve">→</text>
  <text class="mono" x="70" y="150.5" xml:space="preserve">if</text>
  <rect class="box" x="92" y="131" width="30" height="30" rx="6" />
  <text class="mono" x="107" y="150.3" text-anchor="middle" xml:space="preserve">E</text>
  <text class="mono" x="138" y="150.5" xml:space="preserve">then</text>
  <rect class="box" x="178" y="131" width="30" height="30" rx="6" />
  <text class="mono" x="193" y="150.3" text-anchor="middle" xml:space="preserve">E</text>
  <text class="sm" x="356" y="150.5" xml:space="preserve">没有 else 的 if，整体开放</text>
  <rect class="box-acc" x="1" y="177" width="46" height="30" rx="6" />
  <text class="mono" x="24" y="196.3" text-anchor="middle" xml:space="preserve">UIF</text>
  <text x="55" y="196.5" text-anchor="middle" xml:space="preserve">→</text>
  <text class="mono" x="70" y="196.5" xml:space="preserve">if</text>
  <rect class="box" x="92" y="177" width="30" height="30" rx="6" />
  <text class="mono" x="107" y="196.3" text-anchor="middle" xml:space="preserve">E</text>
  <text class="mono" x="138" y="196.5" xml:space="preserve">then</text>
  <rect class="box-strong" x="178" y="177" width="56" height="30" rx="6" />
  <text class="mono" x="206" y="196.3" text-anchor="middle" xml:space="preserve">MIF</text>
  <text class="mono" x="244" y="196.5" xml:space="preserve">else</text>
  <rect class="box-acc" x="284" y="177" width="56" height="30" rx="6" />
  <text class="mono" x="312" y="196.3" text-anchor="middle" xml:space="preserve">UIF</text>
  <text class="sm" x="356" y="196.5" xml:space="preserve">虽有 else，但其后仍留有开放的 if</text>
  <rect class="box-blue" x="0" y="236" width="760" height="30" rx="7" />
  <text class="sm" x="16" y="255.5" xml:space="preserve">关键：else 前的 then 槽位（粗框）始终为 MIF，避免 else 跳过内层开放的 if 连接外层。</text>
</svg>