<svg xmlns="http://www.w3.org/2000/svg" width="792" height="310" viewBox="-16 -16 792 310" role="img" aria-label="推导形成语法分析树：从 E 开始，应用 E → E + E，左侧 E 应用 E → E * E，其余 E 应用 E → id。从左到右读取叶子得到 id * id + id。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="310" rx="14" fill="#F0EEE6" />
  <defs><marker id="dtteeA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker><marker id="dtteeAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="dtteeBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <text class="sm b" x="16" y="12" text-anchor="middle" xml:space="preserve">① 开始</text>
  <rect class="box-acc" x="1" y="22" width="30" height="24" rx="6" />
  <text class="mono" x="16" y="38.3" text-anchor="middle" xml:space="preserve">E</text>
  <text class="mono" x="16" y="222" text-anchor="middle" xml:space="preserve">E</text>
  <text class="lg muted" x="50" y="84" text-anchor="middle" xml:space="preserve">⇒</text>
  <text class="sm b" x="130" y="12" text-anchor="middle" xml:space="preserve">② E → E + E</text>
  <line class="edge" x1="130" y1="46" x2="84" y2="68" />
  <line class="edge" x1="130" y1="46" x2="130" y2="68" />
  <line class="edge" x1="130" y1="46" x2="176" y2="68" />
  <rect class="box" x="115" y="22" width="30" height="24" rx="6" />
  <text class="mono" x="130" y="38.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="69" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="84" y="84.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="115" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="130" y="84.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-acc" x="161" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="176" y="84.3" text-anchor="middle" xml:space="preserve">E</text>
  <text class="mono" x="130" y="222" text-anchor="middle" xml:space="preserve">E + E</text>
  <text class="lg muted" x="214" y="84" text-anchor="middle" xml:space="preserve">⇒</text>
  <text class="sm b" x="336" y="12" text-anchor="middle" xml:space="preserve">③ 左侧 E → E * E</text>
  <line class="edge" x1="359" y1="46" x2="290" y2="68" />
  <line class="edge" x1="290" y1="92" x2="244" y2="114" />
  <line class="edge" x1="290" y1="92" x2="290" y2="114" />
  <line class="edge" x1="290" y1="92" x2="336" y2="114" />
  <line class="edge" x1="359" y1="46" x2="382" y2="68" />
  <line class="edge" x1="359" y1="46" x2="428" y2="68" />
  <rect class="box" x="344" y="22" width="30" height="24" rx="6" />
  <text class="mono" x="359" y="38.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="275" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="290" y="84.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="229" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="244" y="130.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="275" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="290" y="130.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box-acc" x="321" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="336" y="130.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="367" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="382" y="84.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="413" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="428" y="84.3" text-anchor="middle" xml:space="preserve">E</text>
  <text class="mono" x="336" y="222" text-anchor="middle" xml:space="preserve">E * E + E</text>
  <text class="lg muted" x="466" y="84" text-anchor="middle" xml:space="preserve">⇒</text>
  <text class="sm b" x="604" y="12" text-anchor="middle" xml:space="preserve">④ 其余 E → id（三次）</text>
  <line class="edge" x1="627" y1="46" x2="558" y2="68" />
  <line class="edge" x1="558" y1="92" x2="512" y2="114" />
  <line class="edge" x1="512" y1="138" x2="512" y2="160" />
  <line class="edge" x1="558" y1="92" x2="558" y2="114" />
  <line class="edge" x1="558" y1="92" x2="604" y2="114" />
  <line class="edge" x1="604" y1="138" x2="604" y2="160" />
  <line class="edge" x1="627" y1="46" x2="650" y2="68" />
  <line class="edge" x1="627" y1="46" x2="696" y2="68" />
  <line class="edge" x1="696" y1="92" x2="696" y2="114" />
  <rect class="box" x="612" y="22" width="30" height="24" rx="6" />
  <text class="mono" x="627" y="38.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="543" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="558" y="84.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="497" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="512" y="130.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="497" y="160" width="30" height="24" rx="6" />
  <text class="mono" x="512" y="176.3" text-anchor="middle" xml:space="preserve">id</text>
  <rect class="box-blue" x="543" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="558" y="130.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box" x="589" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="604" y="130.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="589" y="160" width="30" height="24" rx="6" />
  <text class="mono" x="604" y="176.3" text-anchor="middle" xml:space="preserve">id</text>
  <rect class="box-blue" x="635" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="650" y="84.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="681" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="696" y="84.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="681" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="696" y="130.3" text-anchor="middle" xml:space="preserve">id</text>
  <line class="ln-muted" x1="512" y1="184" x2="512" y2="206" />
  <line class="ln-muted" x1="558" y1="138" x2="558" y2="206" />
  <line class="ln-muted" x1="604" y1="184" x2="604" y2="206" />
  <line class="ln-muted" x1="650" y1="92" x2="650" y2="206" />
  <line class="ln-muted" x1="696" y1="138" x2="696" y2="206" />
  <rect class="box-blue" x="492" y="206" width="224" height="24" rx="5" />
  <text class="mono" x="512" y="223" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="558" y="223" text-anchor="middle" xml:space="preserve">*</text>
  <text class="mono" x="604" y="223" text-anchor="middle" xml:space="preserve">id</text>
  <text class="mono" x="650" y="223" text-anchor="middle" xml:space="preserve">+</text>
  <text class="mono" x="696" y="223" text-anchor="middle" xml:space="preserve">id</text>
  <text class="sm muted mono" x="0" y="262" xml:space="preserve">最左推导：E ⇒ E+E ⇒ E*E+E ⇒ id*E+E ⇒ id*id+E ⇒ id*id+id</text>
  <text class="sm acc-t" x="760" y="262" text-anchor="end" xml:space="preserve">从左到右读取叶子，得到输入</text>
</svg>