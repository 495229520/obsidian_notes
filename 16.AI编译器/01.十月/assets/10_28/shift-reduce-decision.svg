<svg xmlns="http://www.w3.org/2000/svg" width="792" height="344" viewBox="-16 -16 792 344" role="img" aria-label="LR 分析器比较栈顶规则与下一 Token 的四种情况：规则 +、Token * 时移进；规则 *、Token + 时归约；两者都是 + 时，左结合归约，右结合移进。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="344" rx="14" fill="#F0EEE6" />
  <defs><marker id="srdonA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker><marker id="srdonAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="srdonBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <text class="sm muted" x="0" y="12" xml:space="preserve">栈</text>
  <text class="sm muted" x="146" y="12" xml:space="preserve">下一词元</text>
  <text class="sm muted" x="202" y="12" xml:space="preserve">规则与 Token 比较</text>
  <text class="sm muted" x="396" y="12" xml:space="preserve">选择</text>
  <text class="sm muted" x="512" y="12" xml:space="preserve">得到的分组</text>
  <rect class="box" x="2" y="29" width="32" height="30" rx="6" />
  <text class="mono" x="18" y="48.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="40" y="29" width="32" height="30" rx="6" />
  <text class="mono" x="56" y="48.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="78" y="29" width="32" height="30" rx="6" />
  <text class="mono" x="94" y="48.3" text-anchor="middle" xml:space="preserve">E</text>
  <line class="ln-acc" x1="132" y1="26" x2="132" y2="62" />
  <rect class="box-blue" x="148" y="29" width="32" height="30" rx="6" />
  <text class="mono" x="164" y="48.3" text-anchor="middle" xml:space="preserve">*</text>
  <text x="202" y="41" xml:space="preserve">+<tspan class="muted"> 低 &lt; </tspan>*<tspan class="muted"> 高</tspan></text>
  <text class="sm muted mono" x="202" y="58" xml:space="preserve">先声明 %left +，再声明 %left *</text>
  <rect class="box-blue" x="396" y="29" width="80" height="30" rx="6" />
  <text class="b" x="436" y="48.3" text-anchor="middle" xml:space="preserve">移进</text>
  <text class="mono" x="512" y="48.5" xml:space="preserve">int + (int * int)</text>
  <rect class="box" x="2" y="81" width="32" height="30" rx="6" />
  <text class="mono" x="18" y="100.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="40" y="81" width="32" height="30" rx="6" />
  <text class="mono" x="56" y="100.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box" x="78" y="81" width="32" height="30" rx="6" />
  <text class="mono" x="94" y="100.3" text-anchor="middle" xml:space="preserve">E</text>
  <line class="ln-acc" x1="132" y1="78" x2="132" y2="114" />
  <rect class="box-blue" x="148" y="81" width="32" height="30" rx="6" />
  <text class="mono" x="164" y="100.3" text-anchor="middle" xml:space="preserve">+</text>
  <text x="202" y="93" xml:space="preserve">*<tspan class="muted"> 高 &gt; </tspan>+<tspan class="muted"> 低</tspan></text>
  <text class="sm muted mono" x="202" y="110" xml:space="preserve">先声明 %left +，再声明 %left *</text>
  <rect class="box-acc" x="396" y="81" width="80" height="30" rx="6" />
  <text class="b" x="436" y="100.3" text-anchor="middle" xml:space="preserve">归约</text>
  <text class="mono" x="512" y="100.5" xml:space="preserve">(int * int) + int</text>
  <rect class="box" x="2" y="133" width="32" height="30" rx="6" />
  <text class="mono" x="18" y="152.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="40" y="133" width="32" height="30" rx="6" />
  <text class="mono" x="56" y="152.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="78" y="133" width="32" height="30" rx="6" />
  <text class="mono" x="94" y="152.3" text-anchor="middle" xml:space="preserve">E</text>
  <line class="ln-acc" x1="132" y1="130" x2="132" y2="166" />
  <rect class="box-blue" x="148" y="133" width="32" height="30" rx="6" />
  <text class="mono" x="164" y="152.3" text-anchor="middle" xml:space="preserve">+</text>
  <text x="202" y="145" xml:space="preserve">+<tspan class="muted"> = </tspan>+<tspan class="muted">，左结合</tspan></text>
  <text class="sm muted mono" x="202" y="162" xml:space="preserve">声明 %left +</text>
  <rect class="box-acc" x="396" y="133" width="80" height="30" rx="6" />
  <text class="b" x="436" y="152.3" text-anchor="middle" xml:space="preserve">归约</text>
  <text class="mono" x="512" y="152.5" xml:space="preserve">(int + int) + int</text>
  <rect class="box" x="2" y="185" width="32" height="30" rx="6" />
  <text class="mono" x="18" y="204.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-acc" x="40" y="185" width="32" height="30" rx="6" />
  <text class="mono" x="56" y="204.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="78" y="185" width="32" height="30" rx="6" />
  <text class="mono" x="94" y="204.3" text-anchor="middle" xml:space="preserve">E</text>
  <line class="ln-acc" x1="132" y1="182" x2="132" y2="218" />
  <rect class="box-blue" x="148" y="185" width="32" height="30" rx="6" />
  <text class="mono" x="164" y="204.3" text-anchor="middle" xml:space="preserve">+</text>
  <text x="202" y="197" xml:space="preserve">+<tspan class="muted"> = </tspan>+<tspan class="muted">，右结合</tspan></text>
  <text class="sm muted mono" x="202" y="214" xml:space="preserve">声明 %right +</text>
  <rect class="box-blue" x="396" y="185" width="80" height="30" rx="6" />
  <text class="b" x="436" y="204.3" text-anchor="middle" xml:space="preserve">移进</text>
  <text class="mono" x="512" y="204.5" xml:space="preserve">int + (int + int)</text>
  <line class="ln-muted" x1="0" y1="244" x2="760" y2="244" />
  <text class="sm" x="0" y="266" xml:space="preserve"><tspan class="b">移进（shift）：</tspan>将下一 Token 入栈，暂不归约 E + E，让后面的运算符先与右侧 E 结合。</text>
  <text class="sm" x="0" y="288" xml:space="preserve"><tspan class="b">归约（reduce）：</tspan>立即将栈顶 E + E 归约为一个 E，先结合当前栈中的运算。</text>
  <text class="sm muted" x="0" y="308" xml:space="preserve">规则优先级取自最后一个终结符；有 %prec 时，取其指定 Token 的优先级。</text>
</svg>