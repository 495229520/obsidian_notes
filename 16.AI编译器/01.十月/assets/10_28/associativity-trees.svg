<svg xmlns="http://www.w3.org/2000/svg" width="792" height="332" viewBox="-16 -16 792 332" role="img" aria-label="1 - 2 - 3 的两棵树：左结合为 (1 - 2) - 3 = -4，向左加深；右结合为 1 - (2 - 3) = 2，向右加深。">
  <style>
