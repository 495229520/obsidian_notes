  <text class="b mono" x="185" y="238" text-anchor="middle" xml:space="preserve">(1 - 2) - 3 = -4</text>
  <text class="b mono" x="575" y="238" text-anchor="middle" xml:space="preserve">1 - (2 - 3) = 2</text>
  <text class="sm" x="185" y="260" text-anchor="middle" xml:space="preserve">向左加深，递归形式为 E → E - T</text>
  <text class="sm" x="575" y="260" text-anchor="middle" xml:space="preserve">向右加深，递归形式为 E → T - E</text>
  <text class="sm muted" x="185" y="280" text-anchor="middle" xml:space="preserve">通常的减法采用这种解释</text>
