  <rect class="box-acc" x="201" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="216" y="84.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="105" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="120" y="130.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="41" y="160" width="30" height="24" rx="6" />
  <text class="mono" x="56" y="176.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="32" y="206" width="48" height="24" rx="6" />
  <text class="mono" x="56" y="222.3" text-anchor="middle" xml:space="preserve">id(2)</text>
  <rect class="box-blue" x="105" y="160" width="30" height="24" rx="6" />
  <text class="mono" x="120" y="176.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box" x="169" y="160" width="30" height="24" rx="6" />
  <text class="mono" x="184" y="176.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="160" y="206" width="48" height="24" rx="6" />
  <text class="mono" x="184" y="222.3" text-anchor="middle" xml:space="preserve">id(3)</text>
  <rect class="box-acc" x="233" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="248" y="130.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="297" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="312" y="130.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="288" y="160" width="48" height="24" rx="6" />
  <text class="mono" x="312" y="176.3" text-anchor="middle" xml:space="preserve">id(4)</text>
  <text class="b acc-t" x="237" y="84.5" xml:space="preserve">= 10</text>
  <text class="b acc-t" x="141" y="130.5" xml:space="preserve">= 6</text>
  <line class="edge" x1="538" y1="92" x2="446" y2="114" />
  <line class="edge" x1="446" y1="138" x2="446" y2="160" />
  <line class="edge" x1="538" y1="92" x2="510" y2="114" />
  <line class="edge" x1="538" y1="92" x2="638" y2="114" />
  <line class="edge" x1="638" y1="138" x2="574" y2="160" />
  <line class="edge" x1="574" y1="184" x2="574" y2="206" />
  <line class="edge" x1="638" y1="138" x2="638" y2="160" />
  <line class="edge" x1="638" y1="138" x2="702" y2="160" />
  <line class="edge" x1="702" y1="184" x2="702" y2="206" />
  <rect class="box-acc" x="523" y="68" width="30" height="24" rx="6" />
  <text class="mono" x="538" y="84.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="431" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="446" y="130.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="422" y="160" width="48" height="24" rx="6" />
  <text class="mono" x="446" y="176.3" text-anchor="middle" xml:space="preserve">id(2)</text>
  <rect class="box-acc" x="495" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="510" y="130.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box" x="623" y="114" width="30" height="24" rx="6" />
  <text class="mono" x="638" y="130.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="559" y="160" width="30" height="24" rx="6" />
  <text class="mono" x="574" y="176.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="550" y="206" width="48" height="24" rx="6" />
  <text class="mono" x="574" y="222.3" text-anchor="middle" xml:space="preserve">id(3)</text>
  <rect class="box-blue" x="623" y="160" width="30" height="24" rx="6" />
  <text class="mono" x="638" y="176.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="687" y="160" width="30" height="24" rx="6" />
  <text class="mono" x="702" y="176.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="678" y="206" width="48" height="24" rx="6" />
  <text class="mono" x="702" y="222.3" text-anchor="middle" xml:space="preserve">id(4)</text>
  <text class="b acc-t" x="559" y="84.5" xml:space="preserve">= 14</text>
  <text class="b acc-t" x="659" y="130.5" xml:space="preserve">= 7</text>
  <text class="b mono" x="185" y="256" text-anchor="middle" xml:space="preserve">(2 * 3) + 4 = 10</text>
  <text class="b mono" x="575" y="256" text-anchor="middle" xml:space="preserve">2 * (3 + 4) = 14</text>
  <text class="sm" x="185" y="292" text-anchor="middle" xml:space="preserve">符合通常的优先级</text>
  <text class="sm" x="575" y="292" text-anchor="middle" xml:space="preserve">不符合通常的优先级</text>
  <text class="acc-t" x="380" y="324" text-anchor="middle" xml:space="preserve">两棵树都<tspan class="mono">E → E+E | E*E | (E) | id</tspan>都能由文法推导得到；仅凭原文法，两种解释都合法。</text>
</svg>