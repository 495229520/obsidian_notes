<svg xmlns="http://www.w3.org/2000/svg" width="792" height="372" viewBox="-16 -16 792 372" role="img" aria-label="输入 id * id + id 有两棵不同的语法分析树。顶层为加法时得到 (2 * 3) + 4 = 10；顶层为乘法时得到 2 * (3 + 4) = 14。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
