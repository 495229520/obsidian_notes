<svg xmlns="http://www.w3.org/2000/svg" width="792" height="328" viewBox="-16 -16 792 328" role="img" aria-label="字符流 if x &gt; 0 then 1 else 2 fi 经过词法分析变为 IF ID GT INT THEN INT ELSE INT FI，再经过语法分析形成树：条件为 x &gt; 0，两分支为1和2。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="328" rx="14" fill="#F0EEE6" />
  <defs><marker id="lvpseA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker><marker id="lvpseAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="lvpseBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <text class="b" x="0" y="22" xml:space="preserve">字符流</text>
  <rect class="box" x="104" y="2" width="450" height="30" rx="7" />
  <text class="mono" x="329" y="22" text-anchor="middle" xml:space="preserve">if x &gt; 0 then 1 else 2 fi</text>
  <line class="ln" x1="329" y1="34" x2="329" y2="64" marker-end="url(#lvpseA)" />
  <text class="sm muted" x="341" y="54" xml:space="preserve">词法分析：正则表达式、DFA</text>
  <text class="b" x="0" y="86" xml:space="preserve">Token 流</text>
  <rect class="box-blue" x="104" y="66" width="38.2692" height="30" rx="5" />
  <text class="sm mono" x="123.135" y="85.5" text-anchor="middle" xml:space="preserve">IF</text>
  <rect class="box-blue" x="148.269" y="66" width="38.2692" height="30" rx="5" />
  <text class="sm mono" x="167.404" y="85.5" text-anchor="middle" xml:space="preserve">ID</text>
  <rect class="box-blue" x="192.538" y="66" width="38.2692" height="30" rx="5" />
  <text class="sm mono" x="211.673" y="85.5" text-anchor="middle" xml:space="preserve">GT</text>
  <rect class="box-blue" x="236.808" y="66" width="45.9231" height="30" rx="5" />
  <text class="sm mono" x="259.769" y="85.5" text-anchor="middle" xml:space="preserve">INT</text>
  <rect class="box-blue" x="288.731" y="66" width="53.5769" height="30" rx="5" />
  <text class="sm mono" x="315.519" y="85.5" text-anchor="middle" xml:space="preserve">THEN</text>
  <rect class="box-blue" x="348.308" y="66" width="45.9231" height="30" rx="5" />
  <text class="sm mono" x="371.269" y="85.5" text-anchor="middle" xml:space="preserve">INT</text>
  <rect class="box-blue" x="400.231" y="66" width="53.5769" height="30" rx="5" />
  <text class="sm mono" x="427.019" y="85.5" text-anchor="middle" xml:space="preserve">ELSE</text>
  <rect class="box-blue" x="459.808" y="66" width="45.9231" height="30" rx="5" />
  <text class="sm mono" x="482.769" y="85.5" text-anchor="middle" xml:space="preserve">INT</text>
  <rect class="box-blue" x="511.731" y="66" width="38.2692" height="30" rx="5" />
  <text class="sm mono" x="530.865" y="85.5" text-anchor="middle" xml:space="preserve">FI</text>
  <line class="ln" x1="329" y1="98" x2="329" y2="128" marker-end="url(#lvpseA)" />
  <text class="sm muted" x="341" y="118" xml:space="preserve">语法分析：CFG、栈</text>
  <text class="b" x="0" y="150" xml:space="preserve">语法结构</text>
  <line class="edge" x1="352" y1="159" x2="232" y2="199" />
  <line class="edge" x1="232" y1="225" x2="184" y2="265" />
  <line class="edge" x1="232" y1="225" x2="280" y2="265" />
  <line class="edge" x1="352" y1="159" x2="376" y2="199" />
  <line class="edge" x1="352" y1="159" x2="472" y2="199" />
  <rect class="box" x="299" y="133" width="106" height="26" rx="6" />
  <text class="mono" x="352" y="150.3" text-anchor="middle" xml:space="preserve">if-then-else</text>
  <rect class="box-acc" x="213" y="199" width="38" height="26" rx="6" />
  <text class="mono" x="232" y="216.3" text-anchor="middle" xml:space="preserve">GT</text>
  <rect class="box-blue" x="169" y="265" width="30" height="26" rx="6" />
  <text class="mono" x="184" y="282.3" text-anchor="middle" xml:space="preserve">ID</text>
  <rect class="box-blue" x="265" y="265" width="30" height="26" rx="6" />
  <text class="mono" x="280" y="282.3" text-anchor="middle" xml:space="preserve">INT</text>
  <rect class="box-blue" x="357" y="199" width="38" height="26" rx="6" />
  <text class="mono" x="376" y="216.3" text-anchor="middle" xml:space="preserve">INT</text>
  <rect class="box-blue" x="453" y="199" width="38" height="26" rx="6" />
  <text class="mono" x="472" y="216.3" text-anchor="middle" xml:space="preserve">INT</text>
  <rect class="box" x="584" y="2" width="176" height="94" rx="8" />
  <text class="b" x="596" y="24" xml:space="preserve">词法分析识别什么</text>
  <text class="sm" x="596" y="46" xml:space="preserve">单个 Token 的形式与种类</text>
  <text class="sm" x="596" y="64" xml:space="preserve">不判断 Token 之间的结构</text>
  <text class="sm" x="596" y="82" xml:space="preserve">不负责判断括号是否配对</text>
  <rect class="box-acc" x="584" y="136" width="176" height="144" rx="8" />
  <text class="b" x="596" y="158" xml:space="preserve">语法分析识别什么</text>
  <text class="sm" x="596" y="180" xml:space="preserve">Token 之间的结构</text>
  <text class="sm" x="596" y="198" xml:space="preserve">GT 分组构成条件</text>
  <text class="sm" x="596" y="216" xml:space="preserve">第一个 INT 是 then 分支</text>
  <text class="sm" x="596" y="234" xml:space="preserve">第二个 INT 是 else 分支</text>
  <text class="sm muted" x="596" y="262" xml:space="preserve">不一定要将树保存在内存中</text>
</svg>