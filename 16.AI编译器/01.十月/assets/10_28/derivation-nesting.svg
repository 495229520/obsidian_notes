<svg xmlns="http://www.w3.org/2000/svg" width="792" height="276" viewBox="-16 -16 792 276" role="img" aria-label="从 S 开始，三次应用 S → (S)，一次应用 S → ε，得到 ((()))。每次同时生成一对左右括号，数量始终相等。">
