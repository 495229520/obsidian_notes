<svg xmlns="http://www.w3.org/2000/svg" width="792" height="354" viewBox="-16 -16 792 354" role="img" aria-label="if E1 then if E2 then E3 else E4 的两种解释。else 连外层时，then 槽位必须放 UIF，不符合 MIF/UIF 文法；连内层时，外层为 UIF、内层为 MIF，是唯一合法解释。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="354" rx="14" fill="#F0EEE6" />
  <defs><marker id="detesA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker><marker id="detesAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="detesBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <rect class="box" x="0" y="0" width="370" height="318" rx="10" />
  <rect class="box" x="390" y="0" width="370" height="318" rx="10" />
  <text class="lg" x="16" y="24" xml:space="preserve">else 连接外层 if</text>
  <text class="b acc-t" x="354" y="24" text-anchor="end" xml:space="preserve">不允许</text>
  <text class="sm mono" x="16" y="46" xml:space="preserve">if E1 then (if E2 then E3) else E4</text>
  <text class="lg" x="406" y="24" xml:space="preserve">else 连接内层 if</text>
  <text class="b blue-t" x="744" y="24" text-anchor="end" xml:space="preserve">唯一合法解释</text>
  <text class="sm mono" x="406" y="46" xml:space="preserve">if E1 then (if E2 then E3 else E4)</text>
  <line class="edge" x1="185" y1="98" x2="50" y2="136" />
  <line class="edge-dash" x1="185" y1="98" x2="185" y2="136" />
  <line class="edge" x1="185" y1="164" x2="140" y2="202" />
  <line class="edge" x1="185" y1="164" x2="230" y2="202" />
  <line class="edge" x1="185" y1="98" x2="320" y2="136" />
  <rect class="box" x="133" y="70" width="104" height="28" rx="6" />
  <text x="185" y="88.3" text-anchor="middle" xml:space="preserve">if-then-else</text>
  <rect class="box" x="33" y="136" width="34" height="28" rx="6" />
  <text class="mono" x="50" y="154.3" text-anchor="middle" xml:space="preserve">E1</text>
  <rect class="box-bad" x="133" y="136" width="104" height="28" rx="6" />
  <text x="185" y="154.3" text-anchor="middle" xml:space="preserve">UIF: if-then</text>
  <rect class="box" x="123" y="202" width="34" height="28" rx="6" />
  <text class="mono" x="140" y="220.3" text-anchor="middle" xml:space="preserve">E2</text>
  <rect class="box" x="213" y="202" width="34" height="28" rx="6" />
  <text class="mono" x="230" y="220.3" text-anchor="middle" xml:space="preserve">E3</text>
  <rect class="box" x="303" y="136" width="34" height="28" rx="6" />
  <text class="mono" x="320" y="154.3" text-anchor="middle" xml:space="preserve">E4</text>
  <text class="sm acc-t" x="193" y="130" xml:space="preserve">then 槽位</text>
  <text class="sm" x="16" y="268" xml:space="preserve">带 else 的规则都要求 then 槽位</text>
  <text class="sm" x="16" y="286" xml:space="preserve">为 MIF。但没有 else 的 if E2 then E3</text>
  <text class="sm acc-t" x="16" y="304" xml:space="preserve">是 UIF，因此不存在合法的树。</text>
  <line class="edge" x1="510" y1="98" x2="440" y2="136" />
  <line class="edge" x1="510" y1="98" x2="580" y2="136" />
  <line class="edge" x1="580" y1="164" x2="510" y2="202" />
  <line class="edge" x1="580" y1="164" x2="580" y2="202" />
  <line class="edge" x1="580" y1="164" x2="650" y2="202" />
  <rect class="box" x="458" y="70" width="104" height="28" rx="6" />
  <text x="510" y="88.3" text-anchor="middle" xml:space="preserve">UIF: if-then</text>
  <rect class="box" x="423" y="136" width="34" height="28" rx="6" />
  <text class="mono" x="440" y="154.3" text-anchor="middle" xml:space="preserve">E1</text>
  <rect class="box-strong" x="514" y="136" width="132" height="28" rx="6" />
  <text x="580" y="154.3" text-anchor="middle" xml:space="preserve">MIF: if-then-else</text>
  <rect class="box" x="493" y="202" width="34" height="28" rx="6" />
  <text class="mono" x="510" y="220.3" text-anchor="middle" xml:space="preserve">E2</text>
  <rect class="box" x="563" y="202" width="34" height="28" rx="6" />
  <text class="mono" x="580" y="220.3" text-anchor="middle" xml:space="preserve">E3</text>
  <rect class="box" x="633" y="202" width="34" height="28" rx="6" />
  <text class="mono" x="650" y="220.3" text-anchor="middle" xml:space="preserve">E4</text>
  <text class="sm blue-t" x="594" y="121" xml:space="preserve">then 槽位</text>
  <text class="sm" x="406" y="268" xml:space="preserve">UIF → if E then E 允许 then 槽位为 E，</text>
  <text class="sm" x="406" y="286" xml:space="preserve">该 E 可以展开为 MIF：if E2 then E3 else E4。</text>
  <text class="sm blue-t" x="406" y="304" xml:space="preserve">else 因此属于内层 if E2。</text>
</svg>