<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img" aria-label="DFA的有限状态与下推自动机栈内存对比">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1.5 L8,5 L0,8.5 z" fill="#5F5E5A" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1.5 L8,5 L0,8.5 z" fill="#185FA5" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1.5 L8,5 L0,8.5 z" fill="#D9383A" />
    </marker>
  </defs>

  
  <rect width="820" height="290" rx="12" fill="#F5F4ED" />

  
  <g transform="translate(20, 20)">
    <rect width="375" height="205" rx="8" fill="#FAF9F5" stroke="#B0AEA5" stroke-width="1.2" />
    <rect x="0" y="0" width="375" height="36" rx="8" fill="#FCE8E6" stroke="#D9383A" stroke-width="1.2" />
    <text x="187" y="23" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9C1C1D">有限自动机（DFA）：固定状态，无外部记忆</text>

    
    <circle cx="65" cy="95" r="22" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5" />
    <text x="65" y="100" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#141413">S₀</text>

    <circle cx="165" cy="95" r="22" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5" />
    <text x="165" y="100" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#141413">S₁</text>

    <circle cx="265" cy="95" r="22" fill="#FFFFFF" stroke="#D9383A" stroke-width="1.8" stroke-dasharray="3,3" />
    <text x="265" y="100" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#9C1C1D">S_k</text>

    
    <path d="M 87,95 L 141,95" stroke="#5F5E5A" stroke-width="1.4" fill="none" marker-end="url(#arrow)" />
    <text x="114" y="87" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5F5E5A">(</text>

    <path d="M 187,95 L 241,95" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)" />
    <text x="214" y="87" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#5F5E5A">...</text>

    
    <path d="M 265,117 C 265,160 65,160 65,119" stroke="#D9383A" stroke-width="1.6" fill="none" marker-end="url(#arrow-red)" />
    <text x="165" y="152" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11.5" font-weight="500" fill="#9C1C1D">鸽巢原理：超过 k 个 '(' 必强行绕圈，丢失计数！</text>

    
    <rect x="15" y="168" width="345" height="26" rx="4" fill="#F1EFE8" />
    <text x="187" y="185" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#5F5E5A">只能处理模运算 (count mod k)，无法处理 L = {(ⁿ )ⁿ}</text>
  </g>

  
  <g transform="translate(425, 20)">
    <rect width="375" height="205" rx="8" fill="#FAF9F5" stroke="#B0AEA5" stroke-width="1.2" />
    <rect x="0" y="0" width="375" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2" />
    <text x="187" y="23" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#085041">下推自动机（PDA / CFG）：引入内存栈</text>

    
    <g transform="translate(30, 48)">
      <rect x="15" y="20" width="85" height="110" rx="3" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="0 85 0 0" />
      
      <rect x="20" y="98" width="75" height="26" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2" />
      <text x="57" y="115" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#0C447C">1st '('</text>

      <rect x="20" y="68" width="75" height="26" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2" />
      <text x="57" y="85" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#0C447C">2nd '('</text>

      <rect x="20" y="38" width="75" height="26" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2" />
      <text x="57" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#633806">n-th '('</text>
    </g>

    
    <g transform="translate(145, 55)">
      
      <path d="M 0,25 L 35,25" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)" />
      <text x="45" y="29" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#0C447C">遇到 '(' 入栈 (Push)</text>

      
      <path d="M 0,65 L 35,65" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
      <text x="45" y="69" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#085041">遇到 ')' 弹栈 (Pop)</text>

      
      <rect x="0" y="88" width="215" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" />
      <text x="107" y="108" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11.5" font-weight="600" fill="#085041">串读完且栈空 = 括号完美配对！</text>
    </g>

    
    <rect x="15" y="168" width="345" height="26" rx="4" fill="#F1EFE8" />
    <text x="187" y="185" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#5F5E5A">栈的动态深度天然契合递归语法树，打破线性限制</text>
  </g>

  
  <g transform="translate(20, 238)">
    <rect width="780" height="38" rx="6" fill="#FAF9F5" stroke="#D97757" stroke-width="1.2" />
    <circle cx="22" cy="19" r="8" fill="#F5DDD1" />
    <text x="22" y="23" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#B0532F">i</text>
    <text x="40" y="24" font-family="'Noto Sans SC', sans-serif" font-size="12.5" font-weight="500" fill="#141413">核心洞察：正则表达式/DFA 擅长词法阶段的局部扁平切分；而 CFG/Parser 则借助栈（递归）接管任意深度的嵌套结构。</text>
  </g>
</svg>