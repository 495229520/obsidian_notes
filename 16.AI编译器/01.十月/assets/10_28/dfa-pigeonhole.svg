<svg xmlns="http://www.w3.org/2000/svg" width="792" height="318" viewBox="-16 -16 792 318" role="img" aria-label="三个状态的 DFA 读入0、1、2、3个左括号后，状态依次为 q0、q1、q2、q1，读入1个和3个时状态相同。再读取同一右括号会到达相同状态 p，无法区分应接受的 () 与应拒绝的 ((()，至少判错一个。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="318" rx="14" fill="#F0EEE6" />
  <defs><marker id="dpleA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker><marker id="dpleAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="dpleBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <text class="sm muted" x="62" y="16" text-anchor="middle" xml:space="preserve">读入0个 (</text>
  <circle class="st" cx="62" cy="52" r="21" />
  <text class="mono" x="62" y="56.5" text-anchor="middle" xml:space="preserve">q0</text>
  <text class="sm muted" x="192" y="16" text-anchor="middle" xml:space="preserve">读入1个 (</text>
  <circle class="st-acc" cx="192" cy="52" r="21" />
  <text class="mono" x="192" y="56.5" text-anchor="middle" xml:space="preserve">q1</text>
  <text class="sm muted" x="322" y="16" text-anchor="middle" xml:space="preserve">读入2个 (</text>
  <circle class="st" cx="322" cy="52" r="21" />
  <text class="mono" x="322" y="56.5" text-anchor="middle" xml:space="preserve">q2</text>
  <text class="sm muted" x="452" y="16" text-anchor="middle" xml:space="preserve">读入3个 (</text>
  <circle class="st-acc" cx="452" cy="52" r="21" />
  <text class="mono" x="452" y="56.5" text-anchor="middle" xml:space="preserve">q1</text>
  <line class="ln" x1="84" y1="52" x2="169" y2="52" marker-end="url(#dpleA)" />
  <text class="mono" x="127" y="45" text-anchor="middle" xml:space="preserve">(</text>
  <line class="ln" x1="214" y1="52" x2="299" y2="52" marker-end="url(#dpleA)" />
  <text class="mono" x="257" y="45" text-anchor="middle" xml:space="preserve">(</text>
  <line class="ln" x1="344" y1="52" x2="429" y2="52" marker-end="url(#dpleA)" />
  <text class="mono" x="387" y="45" text-anchor="middle" xml:space="preserve">(</text>
  <path class="ln-acc-dash" d="M192,76 L192,90 L452,90 L452,76" />
  <text class="acc-t" x="322" y="108" text-anchor="middle" xml:space="preserve">两个时刻状态相同，DFA 无法区分此前的输入</text>
  <text class="sm" x="510" y="34" xml:space="preserve">共有4个时刻（0至3个），只有3个状态</text>
  <text class="sm" x="510" y="52" xml:space="preserve">由鸽巢原理，必有两个时刻状态重复</text>
  <text class="sm muted" x="510" y="70" xml:space="preserve">k 个状态，在 k+1 个时刻内必有重复</text>
  <line class="ln-muted" x1="0" y1="126" x2="760" y2="126" />
  <text class="lg" x="0" y="150" xml:space="preserve">重复后，再读相同的 )</text>
  <rect class="box" x="4" y="175" width="56" height="30" rx="6" />
  <text class="mono" x="32" y="194.3" text-anchor="middle" xml:space="preserve">(</text>
  <line class="ln" x1="62" y1="190" x2="104" y2="190" marker-end="url(#dpleA)" />
  <circle class="st-acc" cx="126" cy="190" r="21" />
  <text class="mono" x="126" y="194.5" text-anchor="middle" xml:space="preserve">q1</text>
  <line class="ln" x1="148" y1="190" x2="208" y2="190" marker-end="url(#dpleA)" />
  <text class="mono" x="178" y="183" text-anchor="middle" xml:space="preserve">)</text>
  <circle class="st-blue" cx="230" cy="190" r="21" />
  <text class="mono" x="230" y="194.5" text-anchor="middle" xml:space="preserve">p</text>
  <text x="262" y="194.5" xml:space="preserve">() 属于语言：应接受</text>
  <rect class="box" x="4" y="235" width="56" height="30" rx="6" />
  <text class="mono" x="32" y="254.3" text-anchor="middle" xml:space="preserve">(((</text>
  <line class="ln" x1="62" y1="250" x2="104" y2="250" marker-end="url(#dpleA)" />
  <circle class="st-acc" cx="126" cy="250" r="21" />
  <text class="mono" x="126" y="254.5" text-anchor="middle" xml:space="preserve">q1</text>
  <line class="ln" x1="148" y1="250" x2="208" y2="250" marker-end="url(#dpleA)" />
  <text class="mono" x="178" y="243" text-anchor="middle" xml:space="preserve">)</text>
  <circle class="st-blue" cx="230" cy="250" r="21" />
  <text class="mono" x="230" y="254.5" text-anchor="middle" xml:space="preserve">p</text>
  <text x="262" y="254.5" xml:space="preserve">((() 不属于语言：应拒绝</text>
  <rect class="box-acc" x="520" y="160" width="240" height="118" rx="7" />
  <text class="b" x="536" y="186" xml:space="preserve">p 只能有一种判定</text>
  <text class="sm" x="536" y="214" xml:space="preserve">若 p 是接受状态</text>
  <text class="sm acc-t" x="536" y="230" xml:space="preserve">就会错误接受 ((()</text>
  <text class="sm" x="536" y="250" xml:space="preserve">若 p 是拒绝状态</text>
  <text class="sm acc-t" x="536" y="266" xml:space="preserve">就会错误拒绝 ()</text>
</svg>