<svg xmlns="http://www.w3.org/2000/svg" width="792" height="354" viewBox="-16 -16 792 354" role="img" aria-label="分层文法中 id * id + id 只有一棵树，整体为 E → E' + E，左侧 E' 生成乘法。若把乘法放在外层，右侧 E' 必须生成 id + id，而规则不允许无括号的加法。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="354" rx="14" fill="#F0EEE6" />
  <defs><marker id="lteeA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker><marker id="lteeAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="lteeBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <text class="lg" x="0" y="14" xml:space="preserve">唯一的树：(id * id) + id</text>
  <rect class="region-acc" x="10" y="92" width="240" height="196" rx="10" />
  <text class="sm acc-t" x="18" y="282" xml:space="preserve">乘法分组位于 E' 内部</text>
  <line class="edge" x1="248" y1="68" x2="128" y2="100" />
  <line class="edge" x1="128" y1="124" x2="48" y2="156" />
  <line class="edge" x1="128" y1="124" x2="128" y2="156" />
  <line class="edge" x1="128" y1="124" x2="208" y2="156" />
  <line class="edge" x1="208" y1="180" x2="208" y2="212" />
  <line class="edge" x1="248" y1="68" x2="288" y2="100" />
  <line class="edge" x1="248" y1="68" x2="368" y2="100" />
  <line class="edge" x1="368" y1="124" x2="368" y2="156" />
  <line class="edge" x1="368" y1="180" x2="368" y2="212" />
  <rect class="box-acc" x="233" y="44" width="30" height="24" rx="6" />
  <text class="mono" x="248" y="60.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="113" y="100" width="30" height="24" rx="6" />
  <text class="mono" x="128" y="116.3" text-anchor="middle" xml:space="preserve">E'</text>
  <rect class="box-blue" x="33" y="156" width="30" height="24" rx="6" />
  <text class="mono" x="48" y="172.3" text-anchor="middle" xml:space="preserve">id</text>
  <rect class="box-blue" x="113" y="156" width="30" height="24" rx="6" />
  <text class="mono" x="128" y="172.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box" x="193" y="156" width="30" height="24" rx="6" />
  <text class="mono" x="208" y="172.3" text-anchor="middle" xml:space="preserve">E'</text>
  <rect class="box-blue" x="193" y="212" width="30" height="24" rx="6" />
  <text class="mono" x="208" y="228.3" text-anchor="middle" xml:space="preserve">id</text>
  <rect class="box-acc" x="273" y="100" width="30" height="24" rx="6" />
  <text class="mono" x="288" y="116.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="353" y="100" width="30" height="24" rx="6" />
  <text class="mono" x="368" y="116.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="353" y="156" width="30" height="24" rx="6" />
  <text class="mono" x="368" y="172.3" text-anchor="middle" xml:space="preserve">E'</text>
  <rect class="box-blue" x="353" y="212" width="30" height="24" rx="6" />
  <text class="mono" x="368" y="228.3" text-anchor="middle" xml:space="preserve">id</text>
  <text class="sm muted mono" x="272" y="60.5" xml:space="preserve">E → E' + E</text>
  <text class="sm muted mono" x="152" y="116.5" xml:space="preserve">E' → id * E'</text>
  <line class="ln-muted" x1="474" y1="0" x2="474" y2="316" />
  <text class="lg" x="494" y="14" xml:space="preserve">尝试把乘法放在外层</text>
  <line class="edge" x1="600" y1="68" x2="600" y2="96" />
  <line class="edge" x1="600" y1="120" x2="530" y2="148" />
  <line class="edge" x1="600" y1="120" x2="600" y2="148" />
  <line class="edge-dash" x1="600" y1="120" x2="670" y2="148" />
  <rect class="box" x="585" y="44" width="30" height="24" rx="6" />
  <text class="mono" x="600" y="60.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="585" y="96" width="30" height="24" rx="6" />
  <text class="mono" x="600" y="112.3" text-anchor="middle" xml:space="preserve">E'</text>
  <rect class="box-blue" x="515" y="148" width="30" height="24" rx="6" />
  <text class="mono" x="530" y="164.3" text-anchor="middle" xml:space="preserve">id</text>
  <rect class="box-blue" x="585" y="148" width="30" height="24" rx="6" />
  <text class="mono" x="600" y="164.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box-bad" x="653" y="148" width="34" height="24" rx="6" />
  <text class="mono" x="670" y="164.3" text-anchor="middle" xml:space="preserve">E'</text>
  <text class="sm muted mono" x="622" y="60.5" xml:space="preserve">E → E'</text>
  <text x="622" y="200" xml:space="preserve">剩余输入 id + id</text>
  <line class="edge-dash" x1="670" y1="172" x2="670" y2="188" />
  <rect class="box-acc" x="494" y="212" width="266" height="100" rx="7" />
  <text class="b" x="508" y="234" xml:space="preserve">E' 只有四条规则</text>
  <text class="sm mono" x="508" y="254" xml:space="preserve">id * E'   id   ( E ) * E'   ( E )</text>
  <text class="sm" x="508" y="276" xml:space="preserve">没有规则能生成不带括号的 +</text>
  <text class="sm acc-t" x="508" y="296" xml:space="preserve">所以不存在这棵树</text>
</svg>