<svg xmlns="http://www.w3.org/2000/svg" width="792" height="294" viewBox="-16 -16 792 294" role="img" aria-label="E 层生成加法，E' 层生成乘法与操作数。E 可直接下降到 E'，E' 只有通过括号才能回到 E，所以乘法操作数中出现加法必须加括号。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="294" rx="14" fill="#F0EEE6" />
  <defs><marker id="glrsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker><marker id="glrsAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="glrsBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <rect class="box-blue" x="0" y="0" width="470" height="68" rx="9" />
  <text class="b" x="16" y="24" xml:space="preserve">E 层：生成加法（外层）</text>
  <text class="mono" x="16" y="50" xml:space="preserve">E → E' + E | E'</text>
  <rect class="box" x="0" y="146" width="470" height="68" rx="9" />
  <text class="b" x="16" y="170" xml:space="preserve">E' 层：乘法与基本操作数（内层）</text>
  <text class="mono" x="16" y="196" xml:space="preserve">E' → id * E' | id | ( E ) * E' | ( E )</text>
  <line class="ln" x1="92" y1="70" x2="92" y2="144" marker-end="url(#glrsA)" />
  <text class="sm" x="104" y="104" xml:space="preserve">可直接下降</text>
  <text class="sm muted mono" x="104" y="120" xml:space="preserve">(E → E')</text>
  <line class="ln-acc" x1="352" y1="144" x2="352" y2="70" marker-end="url(#glrsAcc)" />
  <text class="sm acc-t" x="364" y="104" xml:space="preserve">只有通过括号</text>
  <text class="sm acc-t" x="364" y="120" xml:space="preserve">才能返回上层</text>
  <text class="sm" x="0" y="242" xml:space="preserve">+ 只在 E 层生成。要在乘法操作数 E' 中加入 +，必须通过括号返回 E 层。</text>
  <text class="lg" x="500" y="16" xml:space="preserve">因此</text>
  <rect class="box-blue" x="500" y="28" width="260" height="54" rx="8" />
  <text class="mono" x="514" y="49" xml:space="preserve">id * id + id</text>
  <text class="sm" x="514" y="69" xml:space="preserve">只能分组为 (id * id) + id</text>
  <rect class="box-blue" x="500" y="90" width="260" height="54" rx="8" />
  <text class="mono" x="514" y="111" xml:space="preserve">id * (id + id)</text>
  <text class="sm" x="514" y="131" xml:space="preserve">通过括号返回 E，因此可行</text>
  <rect class="box-acc" x="500" y="152" width="260" height="54" rx="8" />
  <text class="mono" x="514" y="173" xml:space="preserve">id * [id + id]</text>
  <text class="sm" x="514" y="193" xml:space="preserve">无括号时不可行：E' 无法生成 +</text>
</svg>