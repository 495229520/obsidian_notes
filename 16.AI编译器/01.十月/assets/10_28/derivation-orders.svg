  <text class="sm muted" x="388" y="138" text-anchor="middle" xml:space="preserve">同一棵树</text>
  <text class="sm mono" x="4" y="254" xml:space="preserve">E ⇒ E+E ⇒ E*E+E ⇒ id*E+E ⇒ id*id+E ⇒ id*id+id</text>
  <text class="sm mono" x="410" y="254" xml:space="preserve">E ⇒ E+E ⇒ E+id ⇒ E*E+id ⇒ E*id+id ⇒ id*id+id</text>
  <rect class="box-acc" x="0" y="270" width="760" height="44" rx="7" />
  <text class="sm" x="16" y="289" xml:space="preserve">数字表示内部节点的展开顺序。这棵树共有8种推导顺序，父节点必须先于子节点展开。</text>
  <text class="sm" x="16" y="305" xml:space="preserve">最左与最右推导各占一种。顺序不同，但各节点使用的规则相同，因此结果树相同。</text>
