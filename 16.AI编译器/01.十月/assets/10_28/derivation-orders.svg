<svg xmlns="http://www.w3.org/2000/svg" width="792" height="350" viewBox="-16 -16 792 350" role="img" aria-label="同一棵树的最左和最右推导：数字标示内部节点展开次序。顺序不同，树相同；共有8种推导顺序，最左与最右各恰好一种。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
