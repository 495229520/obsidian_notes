<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="静态链接将库代码复制到可执行文件；动态链接在运行时加载共享库并解析引用">
  <style>
    .t { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; fill: #141413; }
    .m { font-family: 'JetBrains Mono', D2Coding, Menlo, Consolas, monospace; }
    .h { font-size: 17px; font-weight: 700; }
    .b { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #5E5D59; }
    .ln { stroke: #87867F; stroke-width: 1.6; fill: none; }
    .dash { stroke: #D97757; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#87867F" />
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757" />
    </marker>
  </defs>
  <rect width="960" height="430" fill="rgb(245, 244, 237)" />

  <!-- static -->
  <rect x="16" y="16" width="456" height="398" rx="12" fill="#F0EEE6" />
  <text class="t h" x="36" y="46">静态链接（.a）</text>
  <rect x="50" y="68" width="140" height="44" rx="8" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t m b" x="120" y="95" text-anchor="middle">main.o</text>
  <rect x="250" y="68" width="190" height="44" rx="8" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t m b" x="345" y="95" text-anchor="middle">libmathutils.a</text>
  <path class="ln" d="M120,112 C120,135 200,135 226,150" marker-end="url(#a)" />
  <path class="ln" d="M345,112 C345,135 290,135 268,150" marker-end="url(#a)" />
  <rect x="150" y="152" width="190" height="48" rx="10" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5" />
  <text class="t b" x="245" y="172" text-anchor="middle">链接器 ld</text>
  <text class="t s" x="245" y="190" text-anchor="middle">构建时复制所需代码</text>
  <path class="ln" d="M245,200 V228" marker-end="url(#a)" />
  <rect x="100" y="232" width="290" height="104" rx="10" fill="#E3E8D9" stroke="#788C5D" stroke-width="1.5" />
  <text class="t m b" x="120" y="256">app_static</text>
  <rect x="120" y="270" width="110" height="48" rx="6" fill="#FFFFFF" stroke="#B0AEA5" />
  <text class="t" x="175" y="299" text-anchor="middle" font-size="13">main 代码</text>
  <rect x="240" y="270" width="130" height="48" rx="6" fill="#F1E3D6" stroke="#D4A27F" />
  <text class="t" x="305" y="291" text-anchor="middle" font-size="13">add 代码</text>
  <text class="t s" x="305" y="308" text-anchor="middle">（库代码副本）</text>
  <text class="t" x="36" y="368" font-size="13">运行时无需查找这个静态链接库。</text>
  <text class="t" x="36" y="390" font-size="13">库更新后，需<tspan font-weight="700">重新链接</tspan>才能生效。</text>

  <!-- dynamic -->
  <rect x="488" y="16" width="456" height="398" rx="12" fill="#F0EEE6" />
  <text class="t h" x="508" y="46">动态链接（.so）</text>
  <rect x="512" y="68" width="140" height="44" rx="8" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t m b" x="582" y="95" text-anchor="middle">main.o</text>
  <rect x="712" y="68" width="200" height="44" rx="8" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t m b" x="812" y="95" text-anchor="middle">libmathutils.so</text>
  <path class="ln" d="M582,112 C582,135 640,135 660,150" marker-end="url(#a)" />
  <path class="ln" d="M770,112 C770,135 730,135 708,150" marker-end="url(#a)" />
  <rect x="580" y="152" width="190" height="48" rx="10" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5" />
  <text class="t b" x="675" y="172" text-anchor="middle">链接器 ld</text>
  <text class="t s" x="675" y="190" text-anchor="middle">记录共享库依赖</text>
  <path class="ln" d="M675,200 V228" marker-end="url(#a)" />
  <rect x="512" y="232" width="250" height="104" rx="10" fill="#E3E8D9" stroke="#788C5D" stroke-width="1.5" />
  <text class="t m b" x="532" y="256">app_dynamic</text>
  <rect x="532" y="270" width="80" height="48" rx="6" fill="#FFFFFF" stroke="#B0AEA5" />
  <text class="t" x="572" y="291" text-anchor="middle" font-size="13">main</text>
  <text class="t" x="572" y="308" text-anchor="middle" font-size="13">代码</text>
  <rect x="622" y="270" width="124" height="48" rx="6" fill="#FFFFFF" stroke="#D97757" stroke-dasharray="4 3" />
  <text class="t m" x="684" y="291" text-anchor="middle" font-size="11">NEEDED:</text>
  <text class="t m" x="684" y="307" text-anchor="middle" font-size="11">libmathutils.so</text>

  <!-- runtime loader -->
  <path class="dash" d="M880,112 V226" marker-end="url(#ao)" />
  <rect x="790" y="230" width="134" height="64" rx="10" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5" />
  <text class="t m b" x="857" y="253" text-anchor="middle">ld.so</text>
  <text class="t s" x="857" y="271" text-anchor="middle">运行时加载 .so</text>
  <text class="t s" x="857" y="286" text-anchor="middle">并解析引用</text>
  <path class="dash" d="M790,262 H766" marker-end="url(#ao)" />
  <text class="t" x="508" y="368" font-size="13">更换 ABI 兼容的 .so，<tspan font-weight="700">无需重新链接</tspan>即可生效。</text>
  <text class="t" x="508" y="390" font-size="13">实验：add(2, 3) 从 5 变为 50；app_static 仍为 5</text>
</svg>