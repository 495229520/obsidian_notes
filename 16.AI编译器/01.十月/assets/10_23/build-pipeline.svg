<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 350" width="1170" height="350" role="img" aria-label="两个源文件分别经过预处理、编译和汇编，再链接为同一个可执行文件">
  <style>
    .t { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; fill: #141413; }
    .m { font-family: 'JetBrains Mono', D2Coding, Menlo, Consolas, monospace; }
    .sub { font-size: 11px; fill: #5E5D59; }
    .file { font-size: 14px; font-weight: 600; }
    .stage { font-size: 13px; font-weight: 700; }
    .cmd { font-size: 12px; fill: #C15F3C; }
    .ln { stroke: #87867F; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#87867F" />
    </marker>
  </defs>
  <rect width="1170" height="350" fill="rgb(245, 244, 237)" />

  <!-- row A: main.cpp -->
  <rect x="30" y="60" width="130" height="56" rx="8" fill="#F1E3D6" stroke="#D4A27F" />
  <text class="t m file" x="95" y="84" text-anchor="middle">main.cpp</text>
  <text class="t sub" x="95" y="103" text-anchor="middle">#include 头文件</text>
  <rect x="250" y="60" width="130" height="56" rx="8" fill="#F0EEE6" stroke="#B0AEA5" />
  <text class="t m file" x="315" y="84" text-anchor="middle">main.ii</text>
  <text class="t sub" x="315" y="103" text-anchor="middle">展开头文件后的源码</text>
  <rect x="470" y="60" width="130" height="56" rx="8" fill="#F0EEE6" stroke="#B0AEA5" />
  <text class="t m file" x="535" y="84" text-anchor="middle">main.s</text>
  <text class="t sub" x="535" y="103" text-anchor="middle">汇编代码</text>
  <rect x="690" y="60" width="130" height="56" rx="8" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t m file" x="755" y="84" text-anchor="middle">main.o</text>
  <text class="t sub" x="755" y="103" text-anchor="middle">目标文件</text>

  <!-- row B: math_utils.cpp -->
  <rect x="30" y="200" width="130" height="56" rx="8" fill="#F1E3D6" stroke="#D4A27F" />
  <text class="t m file" x="95" y="224" text-anchor="middle">math_utils.cpp</text>
  <text class="t sub" x="95" y="243" text-anchor="middle">#include 头文件</text>
  <rect x="250" y="200" width="130" height="56" rx="8" fill="#F0EEE6" stroke="#B0AEA5" />
  <text class="t m file" x="315" y="224" text-anchor="middle">math_utils.ii</text>
  <text class="t sub" x="315" y="243" text-anchor="middle">展开头文件后的源码</text>
  <rect x="470" y="200" width="130" height="56" rx="8" fill="#F0EEE6" stroke="#B0AEA5" />
  <text class="t m file" x="535" y="224" text-anchor="middle">math_utils.s</text>
  <text class="t sub" x="535" y="243" text-anchor="middle">汇编代码</text>
  <rect x="690" y="200" width="130" height="56" rx="8" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t m file" x="755" y="224" text-anchor="middle">math_utils.o</text>
  <text class="t sub" x="755" y="243" text-anchor="middle">目标文件</text>

  <!-- arrows rows -->
  <path class="ln" d="M160,88 H246" marker-end="url(#a)" />
  <path class="ln" d="M380,88 H466" marker-end="url(#a)" />
  <path class="ln" d="M600,88 H686" marker-end="url(#a)" />
  <path class="ln" d="M160,228 H246" marker-end="url(#a)" />
  <path class="ln" d="M380,228 H466" marker-end="url(#a)" />
  <path class="ln" d="M600,228 H686" marker-end="url(#a)" />

  <!-- stage labels between rows -->
  <text class="t stage" x="205" y="148" text-anchor="middle">① 预处理</text>
  <text class="t m cmd" x="205" y="167" text-anchor="middle">g++ -E</text>
  <text class="t stage" x="425" y="148" text-anchor="middle">② 编译</text>
  <text class="t m cmd" x="425" y="167" text-anchor="middle">g++ -S</text>
  <text class="t sub" x="425" y="185" text-anchor="middle">前端 → IR → 后端</text>
  <text class="t stage" x="645" y="148" text-anchor="middle">③ 汇编</text>
  <text class="t m cmd" x="645" y="167" text-anchor="middle">g++ -c</text>

  <!-- link -->
  <path class="ln" d="M820,88 C850,88 845,140 866,146" marker-end="url(#a)" />
  <path class="ln" d="M820,228 C850,228 845,176 866,170" marker-end="url(#a)" />
  <rect x="870" y="120" width="120" height="76" rx="10" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5" />
  <text class="t stage" x="930" y="145" text-anchor="middle">④ 链接</text>
  <text class="t m cmd" x="930" y="164" text-anchor="middle">ld</text>
  <text class="t sub" x="930" y="183" text-anchor="middle">符号解析与重定位</text>
  <path class="ln" d="M990,158 H1036" marker-end="url(#a)" />
  <rect x="1040" y="130" width="100" height="56" rx="8" fill="#E3E8D9" stroke="#788C5D" stroke-width="1.5" />
  <text class="t m file" x="1090" y="154" text-anchor="middle">app</text>
  <text class="t sub" x="1090" y="173" text-anchor="middle">可执行文件</text>

  <!-- brackets -->
  <path d="M30,286 V296 H820 V286" stroke="#B0AEA5" stroke-width="1.4" fill="none" />
  <text class="t" x="425" y="322" text-anchor="middle" font-size="13">各翻译单元独立处理（.cpp + 所含头文件），此时不读取其他 .cpp</text>
  <path d="M870,286 V296 H1140 V286" stroke="#D97757" stroke-width="1.4" fill="none" />
  <text class="t" x="1005" y="322" text-anchor="middle" font-size="13">合并整个程序</text>
</svg>