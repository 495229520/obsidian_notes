<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="编译器先生成可执行文件，再输入数据运行；解释器接收程序与数据，直接产生结果">
  <style>
    .t { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; fill: #141413; }
    .h { font-size: 17px; font-weight: 700; }
    .b { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #5E5D59; }
    .tag { font-size: 12px; font-weight: 600; fill: #C15F3C; }
    .ln { stroke: #87867F; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#87867F" />
    </marker>
  </defs>
  <rect width="900" height="480" fill="rgb(245, 244, 237)" />

  <!-- compiler panel -->
  <rect x="16" y="16" width="868" height="210" rx="12" fill="#F0EEE6" />
  <text class="t h" x="36" y="46">编译器：off-line，翻译与运行分离</text>

  <text class="t tag" x="36" y="93">构建时翻译一次</text>
  <rect x="150" y="70" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#B0AEA5" />
  <text class="t b" x="210" y="97" text-anchor="middle">程序</text>
  <path class="ln" d="M270,92 H326" marker-end="url(#a)" />
  <rect x="330" y="70" width="140" height="44" rx="8" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5" />
  <text class="t b" x="400" y="97" text-anchor="middle">编译器</text>
  <path class="ln" d="M470,92 H526" marker-end="url(#a)" />
  <rect x="530" y="70" width="150" height="44" rx="8" fill="#E3E8D9" stroke="#788C5D" stroke-width="1.5" />
  <text class="t b" x="605" y="97" text-anchor="middle">可执行文件</text>
  <text class="t s" x="700" y="90">翻译成机器码的</text>
  <text class="t s" x="700" y="106">新程序</text>

  <path class="ln" d="M605,114 V144" marker-end="url(#a)" />

  <text class="t tag" x="36" y="173">每次运行</text>
  <rect x="330" y="150" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#B0AEA5" />
  <text class="t b" x="400" y="177" text-anchor="middle">数据（输入）</text>
  <path class="ln" d="M470,172 H526" marker-end="url(#a)" />
  <rect x="530" y="150" width="150" height="44" rx="8" fill="#E3E8D9" stroke="#788C5D" stroke-width="1.5" />
  <text class="t b" x="605" y="171" text-anchor="middle">运行可执行文件</text>
  <text class="t s" x="605" y="187" text-anchor="middle">由 CPU 直接执行</text>
  <path class="ln" d="M680,172 H736" marker-end="url(#a)" />
  <rect x="740" y="150" width="120" height="44" rx="8" fill="#DCE7F2" stroke="#6A9BCC" stroke-width="1.5" />
  <text class="t b" x="800" y="177" text-anchor="middle">输出</text>
  <text class="t s" x="36" y="212">运行时无需编译器，翻译成本在构建时支付。</text>

  <!-- interpreter panel -->
  <rect x="16" y="244" width="868" height="220" rx="12" fill="#F0EEE6" />
  <text class="t h" x="36" y="274">解释器：on-line，边解释边执行</text>

  <rect x="60" y="300" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#B0AEA5" />
  <text class="t b" x="120" y="327" text-anchor="middle">程序</text>
  <rect x="60" y="380" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#B0AEA5" />
  <text class="t b" x="120" y="407" text-anchor="middle">数据（输入）</text>
  <path class="ln" d="M180,322 C215,322 215,350 256,356" marker-end="url(#a)" />
  <path class="ln" d="M180,402 C215,402 215,374 256,368" marker-end="url(#a)" />

  <rect x="260" y="296" width="440" height="138" rx="10" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5" />
  <text class="t b" x="280" y="320">解释器（运行期间持续参与）</text>
  <!-- loop chips -->
  <rect x="280" y="340" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#D97757" />
  <text class="t" x="340" y="362" text-anchor="middle" font-size="13">读取下一条语句</text>
  <rect x="420" y="340" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#D97757" />
  <text class="t" x="480" y="362" text-anchor="middle" font-size="13">检查名称与类型</text>
  <rect x="560" y="340" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#D97757" />
  <text class="t" x="620" y="362" text-anchor="middle" font-size="13">执行运算</text>
  <path class="ln" d="M400,357 H416" marker-end="url(#a)" />
  <path class="ln" d="M540,357 H556" marker-end="url(#a)" />
  <path class="ln" d="M620,374 V396 H340 V378" marker-end="url(#a)" />
  <text class="t s" x="480" y="418" text-anchor="middle">循环中再次执行相同语句时，仍需经过解释与分派</text>

  <path class="ln" d="M700,365 H736" marker-end="url(#a)" />
  <rect x="740" y="343" width="120" height="44" rx="8" fill="#DCE7F2" stroke="#6A9BCC" stroke-width="1.5" />
  <text class="t b" x="800" y="370" text-anchor="middle">输出</text>
  <text class="t s" x="740" y="410">不生成独立的</text>
  <text class="t s" x="740" y="426">可执行文件</text>
</svg>