<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="if x == y then z = 1; else z = 2; 的 token 序列与抽象语法树">
  <style>
    .t { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; fill: #141413; }
    .m { font-family: 'JetBrains Mono', D2Coding, Menlo, Consolas, monospace; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 12px; fill: #5E5D59; }
    .ln { stroke: #87867F; stroke-width: 1.6; fill: none; }
  </style>
  <rect width="960" height="470" fill="rgb(245, 244, 237)" />
  <text class="t h" x="30" y="40">① 词法分析：字符序列 → 14 个 token</text>
  <rect x="134" y="66" width="42" height="38" rx="6" fill="#F5DDD3" stroke="#D97757" />
  <text class="t m" x="155" y="91" text-anchor="middle" font-size="16">if</text>
  <rect x="184" y="66" width="38" height="38" rx="6" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t m" x="203" y="91" text-anchor="middle" font-size="16">x</text>
  <rect x="230" y="66" width="42" height="38" rx="6" fill="#F1E3D6" stroke="#D4A27F" stroke-width="2" />
  <text class="t m" x="251" y="91" text-anchor="middle" font-size="16">==</text>
  <rect x="280" y="66" width="38" height="38" rx="6" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t m" x="299" y="91" text-anchor="middle" font-size="16">y</text>
  <rect x="326" y="66" width="62" height="38" rx="6" fill="#F5DDD3" stroke="#D97757" />
  <text class="t m" x="357" y="91" text-anchor="middle" font-size="16">then</text>
  <rect x="396" y="66" width="38" height="38" rx="6" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t m" x="415" y="91" text-anchor="middle" font-size="16">z</text>
  <rect x="442" y="66" width="38" height="38" rx="6" fill="#F1E3D6" stroke="#D4A27F" />
  <text class="t m" x="461" y="91" text-anchor="middle" font-size="16">=</text>
  <rect x="488" y="66" width="38" height="38" rx="6" fill="#E3E8D9" stroke="#788C5D" />
  <text class="t m" x="507" y="91" text-anchor="middle" font-size="16">1</text>
  <rect x="534" y="66" width="38" height="38" rx="6" fill="#FFFFFF" stroke="#B0AEA5" />
  <text class="t m" x="553" y="91" text-anchor="middle" font-size="16">;</text>
  <rect x="580" y="66" width="62" height="38" rx="6" fill="#F5DDD3" stroke="#D97757" />
  <text class="t m" x="611" y="91" text-anchor="middle" font-size="16">else</text>
  <rect x="650" y="66" width="38" height="38" rx="6" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t m" x="669" y="91" text-anchor="middle" font-size="16">z</text>
  <rect x="696" y="66" width="38" height="38" rx="6" fill="#F1E3D6" stroke="#D4A27F" />
  <text class="t m" x="715" y="91" text-anchor="middle" font-size="16">=</text>
  <rect x="742" y="66" width="38" height="38" rx="6" fill="#E3E8D9" stroke="#788C5D" />
  <text class="t m" x="761" y="91" text-anchor="middle" font-size="16">2</text>
  <rect x="788" y="66" width="38" height="38" rx="6" fill="#FFFFFF" stroke="#B0AEA5" />
  <text class="t m" x="807" y="91" text-anchor="middle" font-size="16">;</text>
  <path d="M251,106 V126" stroke="#D97757" stroke-width="1.6" />
  <text class="t" x="237" y="144" font-size="13" fill="#C15F3C">读到 '=' 后向前看一字符：仍为 '='，则合成一个 '==' token（最长匹配）</text>
  <rect x="245" y="166" width="14" height="14" rx="3" fill="#F5DDD3" stroke="#D97757" />
  <text class="t s" x="265" y="178">关键字</text>
  <rect x="339" y="166" width="14" height="14" rx="3" fill="#DCE7F2" stroke="#6A9BCC" />
  <text class="t s" x="359" y="178">标识符</text>
  <rect x="433" y="166" width="14" height="14" rx="3" fill="#F1E3D6" stroke="#D4A27F" />
  <text class="t s" x="453" y="178">运算符</text>
  <rect x="527" y="166" width="14" height="14" rx="3" fill="#E3E8D9" stroke="#788C5D" />
  <text class="t s" x="547" y="178">常量</text>
  <rect x="621" y="166" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B0AEA5" />
  <text class="t s" x="641" y="178">标点</text>
  <line x1="30" y1="204" x2="930" y2="204" stroke="#E8E6DC" stroke-width="1.5" />
  <text class="t h" x="30" y="232">② 语法分析：token → AST</text>
  <text class="t s" x="30" y="254">';'、'then'、'else' 的结构信息由树形关系表达，无需保留为独立节点</text>
  <path class="ln" d="M480,319 L240,357" />
  <path class="ln" d="M480,319 L480,357" />
  <path class="ln" d="M480,319 L720,357" />
  <path class="ln" d="M240,395 L180,421" />
  <path class="ln" d="M240,395 L300,421" />
  <path class="ln" d="M480,395 L420,421" />
  <path class="ln" d="M480,395 L540,421" />
  <path class="ln" d="M720,395 L660,421" />
  <path class="ln" d="M720,395 L780,421" />
  <rect x="405" y="281" width="150" height="38" rx="8" fill="#F5DDD3" stroke="#D97757" stroke-width="1.5" />
  <text class="t m" x="480" y="306" text-anchor="middle" font-size="16">if-then-else</text>
  <rect x="210" y="357" width="60" height="38" rx="8" fill="#F1E3D6" stroke="#D4A27F" stroke-width="1.5" />
  <text class="t m" x="240" y="382" text-anchor="middle" font-size="16">==</text>
  <rect x="450" y="357" width="60" height="38" rx="8" fill="#F1E3D6" stroke="#D4A27F" stroke-width="1.5" />
  <text class="t m" x="480" y="382" text-anchor="middle" font-size="16">=</text>
  <rect x="690" y="357" width="60" height="38" rx="8" fill="#F1E3D6" stroke="#D4A27F" stroke-width="1.5" />
  <text class="t m" x="720" y="382" text-anchor="middle" font-size="16">=</text>
  <rect x="158" y="421" width="44" height="38" rx="8" fill="#DCE7F2" stroke="#6A9BCC" stroke-width="1.5" />
  <text class="t m" x="180" y="446" text-anchor="middle" font-size="16">x</text>
  <rect x="278" y="421" width="44" height="38" rx="8" fill="#DCE7F2" stroke="#6A9BCC" stroke-width="1.5" />
  <text class="t m" x="300" y="446" text-anchor="middle" font-size="16">y</text>
  <rect x="398" y="421" width="44" height="38" rx="8" fill="#DCE7F2" stroke="#6A9BCC" stroke-width="1.5" />
  <text class="t m" x="420" y="446" text-anchor="middle" font-size="16">z</text>
  <rect x="518" y="421" width="44" height="38" rx="8" fill="#E3E8D9" stroke="#788C5D" stroke-width="1.5" />
  <text class="t m" x="540" y="446" text-anchor="middle" font-size="16">1</text>
  <rect x="638" y="421" width="44" height="38" rx="8" fill="#DCE7F2" stroke="#6A9BCC" stroke-width="1.5" />
  <text class="t m" x="660" y="446" text-anchor="middle" font-size="16">z</text>
  <rect x="758" y="421" width="44" height="38" rx="8" fill="#E3E8D9" stroke="#788C5D" stroke-width="1.5" />
  <text class="t m" x="780" y="446" text-anchor="middle" font-size="16">2</text>
  <text class="t s" x="340" y="330" text-anchor="end">条件</text>
  <text class="t s" x="488" y="342">then</text>
  <text class="t s" x="620" y="330">else</text>
</svg>