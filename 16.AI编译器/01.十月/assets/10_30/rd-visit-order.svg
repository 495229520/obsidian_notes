<svg xmlns="http://www.w3.org/2000/svg" width="792" height="288" viewBox="-16 -16 792 288" role="img" aria-label="自顶向下构造顺序：1、t2、3、4、t5、t6、7、t8、t9；父节点先于子节点，子节点从左到右，相当于先序遍历；叶子按输入顺序t2 t5 t6 t8 t9出现">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="288" rx="14" fill="#F0EEE6"/>
  <defs><marker id="rvoerA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rvoerAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rvoerBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <line class="edge" x1="160" y1="30" x2="36" y2="58"/>
  <line class="edge" x1="160" y1="30" x2="175.5" y2="58"/>
  <line class="edge" x1="175.5" y1="82" x2="129" y2="110"/>
  <line class="edge" x1="129" y1="134" x2="98" y2="162"/>
  <line class="edge" x1="129" y1="134" x2="160" y2="162"/>
  <line class="edge" x1="175.5" y1="82" x2="222" y2="110"/>
  <line class="edge" x1="222" y1="134" x2="222" y2="162"/>
  <line class="edge" x1="160" y1="30" x2="284" y2="58"/>
  <rect class="box-acc" x="145" y="6" width="30" height="24" rx="6"/>
  <text class="mono" x="160" y="22.3" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="box-blue" x="19" y="58" width="34" height="24" rx="6"/>
  <text class="mono" x="36" y="74.3" text-anchor="middle" xml:space="preserve">t2</text>
  <rect class="box" x="160.5" y="58" width="30" height="24" rx="6"/>
  <text class="mono" x="175.5" y="74.3" text-anchor="middle" xml:space="preserve">3</text>
  <rect class="box" x="114" y="110" width="30" height="24" rx="6"/>
  <text class="mono" x="129" y="126.3" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="box-blue" x="81" y="162" width="34" height="24" rx="6"/>
  <text class="mono" x="98" y="178.3" text-anchor="middle" xml:space="preserve">t5</text>
  <rect class="box-blue" x="143" y="162" width="34" height="24" rx="6"/>
  <text class="mono" x="160" y="178.3" text-anchor="middle" xml:space="preserve">t6</text>
  <rect class="box" x="207" y="110" width="30" height="24" rx="6"/>
  <text class="mono" x="222" y="126.3" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="box-blue" x="205" y="162" width="34" height="24" rx="6"/>
  <text class="mono" x="222" y="178.3" text-anchor="middle" xml:space="preserve">t8</text>
  <rect class="box-blue" x="267" y="58" width="34" height="24" rx="6"/>
  <text class="mono" x="284" y="74.3" text-anchor="middle" xml:space="preserve">t9</text>
  <line class="ln-blue" x1="14" y1="208" x2="306" y2="208" marker-end="url(#rvoerBlue)"/>
  <text class="sm blue-t" x="160" y="230" text-anchor="middle" xml:space="preserve">按输入顺序遇到叶节点</text>
  <rect class="box" x="350" y="0" width="410" height="250" rx="10"/>
  <text class="lg" x="366" y="26" xml:space="preserve">编号为节点创建顺序</text>
  <text class="sm mono" x="366" y="54" xml:space="preserve">1 → t2 → 3 → 4 → t5 → t6 → 7 → t8 → t9</text>
  <text class="b" x="366" y="86" xml:space="preserve">先建父节点，子节点从左到右</text>
  <text class="sm" x="366" y="106" xml:space="preserve">树遍历上属于先序。</text>
  <text class="b" x="366" y="138" xml:space="preserve">总先展开最左非终结符</text>
  <text class="sm" x="366" y="158" xml:space="preserve">推导上属于最左推导；完成3之前不会处理t9。</text>
  <text class="b" x="366" y="190" xml:space="preserve">遇到终结符就与输入比较</text>
  <text class="sm" x="366" y="210" xml:space="preserve">相同则前移一个token。</text>
  <text class="sm" x="366" y="228" xml:space="preserve">不同则候选失败，需要回退。</text>
</svg>
