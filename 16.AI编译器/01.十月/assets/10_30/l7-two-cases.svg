<svg xmlns="http://www.w3.org/2000/svg" width="812" height="332" viewBox="-16 -16 812 332" role="img" aria-label="填入A → α的两种依据：α能以t开始则看FIRST，如X行+列；α可为空且t能跟在A后则看FOLLOW，如Y行+列">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="812" height="332" rx="14" fill="#F0EEE6"/>
  <defs><marker id="l7-two-cases-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-two-cases-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-two-cases-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="380" height="300" rx="8"/>
  <rect class="box" x="400" y="0" width="380" height="300" rx="8"/>
  <text class="lg blue-t" x="16" y="26" xml:space="preserve">情况1：α能以t开始 → FIRST</text>
  <text x="16" y="54" xml:space="preserve">应用A → α，可与输入t匹配。</text>
  <text class="muted" x="16" y="88" xml:space="preserve">栈顶</text>
  <rect class="blue" x="90.0" y="71.0" width="40" height="26" rx="6"/>
  <text class="mono" x="110" y="88.5" text-anchor="middle" xml:space="preserve">X</text>
  <text class="muted" x="150" y="88" xml:space="preserve">输入</text>
  <rect class="blue" x="185.0" y="71.0" width="40" height="26" rx="6"/>
  <text class="mono" x="205" y="88.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="plain" x="233.0" y="71.0" width="40" height="26" rx="6"/>
  <text class="mono" x="253" y="88.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="281.0" y="71.0" width="40" height="26" rx="6"/>
  <text class="mono" x="301" y="88.5" text-anchor="middle" xml:space="preserve">$</text>
  <line class="ln-blue" x1="110" y1="98" x2="110" y2="126" marker-end="url(#l7-two-cases-blue)"/>
  <text class="mono" x="16" y="145" xml:space="preserve">X → + E</text>
  <rect class="blue" x="90.0" y="159.0" width="40" height="26" rx="6"/>
  <text class="mono" x="110" y="176.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="plain" x="138.0" y="159.0" width="40" height="26" rx="6"/>
  <text class="mono" x="158" y="176.5" text-anchor="middle" xml:space="preserve">E</text>
  <polyline class="ln-blue" points="205,98 205,112 150,112 115,157" marker-end="url(#l7-two-cases-blue)"/>
  <text class="muted" x="200" y="176" xml:space="preserve">右部以+开始</text>
  <text class="mono" x="16" y="216" xml:space="preserve">因为+ ∈ FIRST(+ E)</text>
  <text class="mono b" x="16" y="238" xml:space="preserve">M[X, +] = + E</text>
  <text class="muted" x="16" y="276" xml:space="preserve">询问右部能否生成以当前token开始的串。</text>
  <text class="lg acc-t" x="416" y="26" xml:space="preserve">情况2：α可消失 → FOLLOW</text>
  <text x="416" y="54" xml:space="preserve">移除A后，后续结构接收t。</text>
  <text class="muted" x="416" y="88" xml:space="preserve">栈顶</text>
  <rect class="acc" x="490.0" y="71.0" width="40" height="26" rx="6"/>
  <text class="mono" x="510" y="88.5" text-anchor="middle" xml:space="preserve">Y</text>
  <rect class="plain" x="538.0" y="71.0" width="40" height="26" rx="6"/>
  <text class="mono" x="558" y="88.5" text-anchor="middle" xml:space="preserve">X</text>
  <text class="muted" x="588" y="88" xml:space="preserve">输入</text>
  <rect class="acc" x="621.0" y="71.0" width="40" height="26" rx="6"/>
  <text class="mono" x="641" y="88.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="plain" x="669.0" y="71.0" width="40" height="26" rx="6"/>
  <text class="mono" x="689" y="88.5" text-anchor="middle" xml:space="preserve">int</text>
  <text class="mono" x="416" y="132" xml:space="preserve">E ⇒ T X ⇒ int Y X ⇒ int Y + E</text>
  <text class="muted" x="416" y="154" xml:space="preserve">可推导句型中，+能紧随Y。</text>
  <text x="416" y="188" xml:space="preserve">用Y → ε移除Y，再由X → + E接收+。</text>
  <text class="mono" x="416" y="216" xml:space="preserve">因为+ ∈ FOLLOW(Y)且Y ⇒* ε</text>
  <text class="mono b" x="416" y="238" xml:space="preserve">M[Y, +] = ε</text>
  <text class="muted" x="416" y="276" xml:space="preserve">问A的出现位置，而非A生成什么。</text>
</svg>
