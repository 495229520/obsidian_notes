<svg xmlns="http://www.w3.org/2000/svg" width="812" height="302" viewBox="-16 -16 812 302" role="img" aria-label="竖线左侧是含终结符与非终结符的栈，右侧是未读token；移进把一个token移到栈顶，归约用左部替换栈顶右部且不消费输入">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="812" height="302" rx="14" fill="#F0EEE6"/>
  <defs><marker id="l7-bar-model-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-bar-model-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-bar-model-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="780" height="270" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">移进：将一个token移到栈</text>
  <rect class="plain" x="29.0" y="53.0" width="40" height="26" rx="6"/>
  <text class="mono" x="49.0" y="70.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="75.0" y="53.0" width="40" height="26" rx="6"/>
  <text class="mono" x="95.0" y="70.5" text-anchor="middle" xml:space="preserve">*</text>
  <line class="ln-acc" x1="124" y1="46" x2="124" y2="86"/>
  <rect class="dead" x="129.0" y="53.0" width="40" height="26" rx="6"/>
  <text class="mono" x="149.0" y="70.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="dead" x="175.0" y="53.0" width="40" height="26" rx="6"/>
  <text class="mono" x="195.0" y="70.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="dead" x="221.0" y="53.0" width="40" height="26" rx="6"/>
  <text class="mono" x="241.0" y="70.5" text-anchor="middle" xml:space="preserve">int</text>
  <line class="ln" x1="322" y1="66" x2="372" y2="66" marker-end="url(#l7-bar-model-a)"/>
  <rect class="plain" x="391.0" y="53.0" width="40" height="26" rx="6"/>
  <text class="mono" x="411.0" y="70.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="437.0" y="53.0" width="40" height="26" rx="6"/>
  <text class="mono" x="457.0" y="70.5" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="acc" x="483.0" y="53.0" width="40" height="26" rx="6"/>
  <text class="mono" x="503.0" y="70.5" text-anchor="middle" xml:space="preserve">int</text>
  <line class="ln-acc" x1="532" y1="46" x2="532" y2="86"/>
  <rect class="dead" x="537.0" y="53.0" width="40" height="26" rx="6"/>
  <text class="mono" x="557.0" y="70.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="dead" x="583.0" y="53.0" width="40" height="26" rx="6"/>
  <text class="mono" x="603.0" y="70.5" text-anchor="middle" xml:space="preserve">int</text>
  <text class="sm muted" x="30" y="104" xml:space="preserve">栈（右端为栈顶）</text>
  <text class="sm muted" x="392" y="104" xml:space="preserve">竖线右移一格，消费一个输入。</text>
  <text class="lg" x="16" y="146" xml:space="preserve">归约：栈顶右部替换为左部</text>
  <rect class="acc" x="29.0" y="173.0" width="40" height="26" rx="6"/>
  <text class="mono" x="49.0" y="190.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="acc" x="75.0" y="173.0" width="40" height="26" rx="6"/>
  <text class="mono" x="95.0" y="190.5" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="acc" x="121.0" y="173.0" width="40" height="26" rx="6"/>
  <text class="mono" x="141.0" y="190.5" text-anchor="middle" xml:space="preserve">T</text>
  <line class="ln-acc" x1="170" y1="166" x2="170" y2="206"/>
  <rect class="dead" x="175.0" y="173.0" width="40" height="26" rx="6"/>
  <text class="mono" x="195.0" y="190.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="dead" x="221.0" y="173.0" width="40" height="26" rx="6"/>
  <text class="mono" x="241.0" y="190.5" text-anchor="middle" xml:space="preserve">int</text>
  <line class="ln" x1="322" y1="186" x2="372" y2="186" marker-end="url(#l7-bar-model-a)"/>
  <rect class="acc" x="391.0" y="173.0" width="40" height="26" rx="6"/>
  <text class="mono" x="411.0" y="190.5" text-anchor="middle" xml:space="preserve">T</text>
  <line class="ln-acc" x1="440" y1="166" x2="440" y2="206"/>
  <rect class="dead" x="445.0" y="173.0" width="40" height="26" rx="6"/>
  <text class="mono" x="465.0" y="190.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="dead" x="491.0" y="173.0" width="40" height="26" rx="6"/>
  <text class="mono" x="511.0" y="190.5" text-anchor="middle" xml:space="preserve">int</text>
  <text class="sm mono muted" x="30" y="226" xml:space="preserve">逆用T → int * T</text>
  <text class="sm muted" x="392" y="226" xml:space="preserve">输入不变，弹出3个符号，压入1个T。</text>
  <text class="muted" x="16" y="256" xml:space="preserve">竖线右边始终只有终结符：正向最右推导优先展开最右非终结符。</text>
</svg>
