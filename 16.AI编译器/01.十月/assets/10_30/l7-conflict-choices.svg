<svg xmlns="http://www.w3.org/2000/svg" width="812" height="384" viewBox="-16 -16 812 384" role="img" aria-label="两类冲突：E + E之后遇*时，可先归约加法或移进乘号；( id之后遇)时，可将id归约为类型名N或表达式E">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="812" height="384" rx="14" fill="#F0EEE6"/>
  <defs><marker id="l7-conflict-choices-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-conflict-choices-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-conflict-choices-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="380" height="352" rx="8"/>
  <rect class="box" x="400" y="0" width="380" height="352" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">移进／归约冲突</text>
  <text class="mono sm muted" x="16" y="50" xml:space="preserve">E → E + E | E * E | int</text>
  <rect class="acc" x="105.0" y="67.0" width="170" height="30" rx="6"/>
  <text class="mono" x="190" y="86.5" text-anchor="middle" xml:space="preserve">E + E | * int</text>
  <line class="ln-blue" x1="150" y1="97" x2="88" y2="130" marker-end="url(#l7-conflict-choices-blue)"/>
  <line class="ln-acc" x1="230" y1="97" x2="296" y2="130" marker-end="url(#l7-conflict-choices-acc)"/>
  <text class="b blue-t" x="16" y="116" xml:space="preserve">移进</text>
  <text class="b acc-t" x="364" y="116" text-anchor="end" xml:space="preserve">归约</text>
  <line class="ln" x1="73.33333333333333" y1="157" x2="28" y2="179"/>
  <line class="ln" x1="73.33333333333333" y1="157" x2="62" y2="179"/>
  <line class="ln" x1="73.33333333333333" y1="157" x2="130.0" y2="179"/>
  <line class="ln" x1="130.0" y1="201" x2="96" y2="223"/>
  <line class="ln" x1="130.0" y1="201" x2="130" y2="223"/>
  <line class="ln" x1="130.0" y1="201" x2="164" y2="223"/>
  <rect class="blue" x="59.33333333333333" y="135.0" width="28" height="22" rx="6"/>
  <text class="mono" x="73.33333333333333" y="150.5" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="plain" x="10.0" y="179.0" width="36" height="22" rx="6"/>
  <text class="mono" x="28" y="194.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="48.0" y="179.0" width="28" height="22" rx="6"/>
  <text class="mono" x="62" y="194.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="blue" x="116.0" y="179.0" width="28" height="22" rx="6"/>
  <text class="mono" x="130.0" y="194.5" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="plain" x="78.0" y="223.0" width="36" height="22" rx="6"/>
  <text class="mono" x="96" y="238.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="116.0" y="223.0" width="28" height="22" rx="6"/>
  <text class="mono" x="130" y="238.5" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="plain" x="146.0" y="223.0" width="36" height="22" rx="6"/>
  <text class="mono" x="164" y="238.5" text-anchor="middle" xml:space="preserve">int</text>
  <line class="ln" x1="306.6666666666667" y1="157" x2="250.0" y2="179"/>
  <line class="ln" x1="250.0" y1="201" x2="216" y2="223"/>
  <line class="ln" x1="250.0" y1="201" x2="250" y2="223"/>
  <line class="ln" x1="250.0" y1="201" x2="284" y2="223"/>
  <line class="ln" x1="306.6666666666667" y1="157" x2="318" y2="179"/>
  <line class="ln" x1="306.6666666666667" y1="157" x2="352" y2="179"/>
  <rect class="blue" x="292.6666666666667" y="135.0" width="28" height="22" rx="6"/>
  <text class="mono" x="306.6666666666667" y="150.5" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="blue" x="236.0" y="179.0" width="28" height="22" rx="6"/>
  <text class="mono" x="250.0" y="194.5" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="plain" x="198.0" y="223.0" width="36" height="22" rx="6"/>
  <text class="mono" x="216" y="238.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="236.0" y="223.0" width="28" height="22" rx="6"/>
  <text class="mono" x="250" y="238.5" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="plain" x="266.0" y="223.0" width="36" height="22" rx="6"/>
  <text class="mono" x="284" y="238.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="plain" x="304.0" y="179.0" width="28" height="22" rx="6"/>
  <text class="mono" x="318" y="194.5" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="plain" x="334.0" y="179.0" width="36" height="22" rx="6"/>
  <text class="mono" x="352" y="194.5" text-anchor="middle" xml:space="preserve">int</text>
  <text class="sm" x="16" y="320" xml:space="preserve">先组合乘法</text>
  <text class="sm" x="198" y="320" xml:space="preserve">先组合加法</text>
  <text class="mono sm muted" x="16" y="340" xml:space="preserve">int + (int * int)</text>
  <text class="mono sm muted" x="198" y="340" xml:space="preserve">(int + int) * int</text>
  <text class="lg" x="416" y="26" xml:space="preserve">归约／归约冲突</text>
  <text class="mono sm muted" x="416" y="50" xml:space="preserve">E → ( N ) E | ( E ) | id    N → id</text>
  <rect class="acc" x="515.0" y="67.0" width="150" height="30" rx="6"/>
  <text class="mono" x="590" y="86.5" text-anchor="middle" xml:space="preserve">( id | ) …</text>
  <line class="ln-acc" x1="550" y1="97" x2="500" y2="124" marker-end="url(#l7-conflict-choices-acc)"/>
  <line class="ln-acc" x1="630" y1="97" x2="680" y2="124" marker-end="url(#l7-conflict-choices-acc)"/>
  <text class="mono b acc-t" x="416" y="116" xml:space="preserve">N → id</text>
  <text class="mono b acc-t" x="764" y="116" text-anchor="end" xml:space="preserve">E → id</text>
  <rect class="plain" x="416" y="134" width="166" height="120" rx="8"/>
  <rect class="plain" x="598" y="134" width="166" height="120" rx="8"/>
  <text class="mono" x="428" y="158" xml:space="preserve">( N | ) …</text>
  <text class="sm" x="428" y="184" xml:space="preserve">解释为类型转换</text>
  <text class="mono sm" x="428" y="206" xml:space="preserve">接受( id ) id</text>
  <text class="mono sm acc-t" x="428" y="228" xml:space="preserve">拒绝( id )</text>
  <text class="mono" x="610" y="158" xml:space="preserve">( E | ) …</text>
  <text class="sm" x="610" y="184" xml:space="preserve">解释为括号表达式</text>
  <text class="mono sm" x="610" y="206" xml:space="preserve">接受( id )</text>
  <text class="mono sm acc-t" x="610" y="228" xml:space="preserve">拒绝( id ) id</text>
  <text class="sm" x="416" y="282" xml:space="preserve">两个输入都合法，一个token不足以决定。</text>
  <text class="sm" x="416" y="304" xml:space="preserve">默认选择先出现的规则，会使其中一种输入</text>
  <text class="sm" x="416" y="324" xml:space="preserve">不再被接受。以上结果来自模拟器。</text>
</svg>
