<svg xmlns="http://www.w3.org/2000/svg" width="812" height="344" viewBox="-16 -16 812 344" role="img" aria-label="X → AB展开后，原来紧随X的t转而紧随B；FIRST(B)去除ε加入FOLLOW(A)，FOLLOW(X)传入FOLLOW(B)；B可空时也传入FOLLOW(A)">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="812" height="344" rx="14" fill="#F0EEE6"/>
  <defs><marker id="l7-follow-rules-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-follow-rules-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-follow-rules-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="780" height="312" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">FOLLOW查看右部出现位置：X → A B</text>
  <text class="muted" x="16" y="62" xml:space="preserve">展开前</text>
  <text class="mono" x="110" y="62" xml:space="preserve">…</text>
  <rect class="plain" x="167.0" y="45.0" width="46" height="26" rx="6"/>
  <text class="mono" x="190" y="62.5" text-anchor="middle" xml:space="preserve">X</text>
  <rect class="blue" x="307.0" y="45.0" width="46" height="26" rx="6"/>
  <text class="mono" x="330" y="62.5" text-anchor="middle" xml:space="preserve">t</text>
  <text class="mono" x="376" y="62" xml:space="preserve">…</text>
  <text class="muted" x="16" y="146" xml:space="preserve">展开后</text>
  <text class="mono" x="110" y="146" xml:space="preserve">…</text>
  <rect class="acc" x="147.0" y="129.0" width="46" height="26" rx="6"/>
  <text class="mono" x="170" y="146.5" text-anchor="middle" xml:space="preserve">A</text>
  <rect class="acc" x="227.0" y="129.0" width="46" height="26" rx="6"/>
  <text class="mono" x="250" y="146.5" text-anchor="middle" xml:space="preserve">B</text>
  <rect class="blue" x="307.0" y="129.0" width="46" height="26" rx="6"/>
  <text class="mono" x="330" y="146.5" text-anchor="middle" xml:space="preserve">t</text>
  <text class="mono" x="376" y="146" xml:space="preserve">…</text>
  <line class="ln" x1="182" y1="72" x2="172" y2="128"/>
  <line class="ln" x1="198" y1="72" x2="248" y2="128"/>
  <line class="ln-muted" x1="330" y1="72" x2="330" y2="128"/>
  <polyline class="ln-acc" points="250,158 250,176 170,176 170,158" marker-end="url(#l7-follow-rules-acc)"/>
  <text class="acc-t b" x="204" y="192" xml:space="preserve">①</text>
  <polyline class="ln-blue" points="322,128 322,110 256,110 256,128" marker-end="url(#l7-follow-rules-blue)"/>
  <text class="blue-t b" x="284" y="102" xml:space="preserve">②</text>
  <polyline class="ln-dash" points="330,158 330,206 150,206 150,158" marker-end="url(#l7-follow-rules-acc)"/>
  <text class="acc-t b" x="236" y="222" xml:space="preserve">③</text>
  <text class="acc-t mono" x="16" y="250" xml:space="preserve">① FIRST(B) - {ε} ⊆ FOLLOW(A)</text>
  <text class="blue-t mono" x="16" y="272" xml:space="preserve">② FOLLOW(X) ⊆ FOLLOW(B)</text>
  <text class="acc-t mono" x="16" y="294" xml:space="preserve">③ 若B ⇒* ε，则FOLLOW(X) ⊆ FOLLOW(A)</text>
  <line class="ln-muted" x1="470" y1="16" x2="470" y2="296"/>
  <text class="b" x="486" y="62" xml:space="preserve">包含关系方向</text>
  <text x="486" y="86" xml:space="preserve">父符号X的后继传给子符号。</text>
  <text x="486" y="108" xml:space="preserve">反向通常不成立。</text>
  <text class="b" x="486" y="146" xml:space="preserve">FOLLOW的三个来源</text>
  <text x="486" y="170" xml:space="preserve">· 开始符号后的$</text>
  <text x="486" y="192" xml:space="preserve">· 后继符号串的FIRST（除ε）</text>
  <text x="486" y="214" xml:space="preserve">· 位于末尾或后缀可空时，继承父符号FOLLOW</text>
  <text class="b" x="486" y="252" xml:space="preserve">与FIRST的区别</text>
  <text x="486" y="276" xml:space="preserve">FIRST可含ε，不含输入结束标记$。</text>
  <text x="486" y="296" xml:space="preserve">FOLLOW可含$，不含ε。</text>
</svg>
