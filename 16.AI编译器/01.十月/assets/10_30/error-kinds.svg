<svg xmlns="http://www.w3.org/2000/svg" width="792" height="282" viewBox="-16 -16 792 282" role="img" aria-label="编译阶段与错误类型：词法分析器检查无法组成 token 的字符，语法分析器检查 token 顺序，类型检查器检查语义；正确性问题通常由测试者或用户发现">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="282" rx="14" fill="#F0EEE6"/>
  <defs><marker id="ekdsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ekdsAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ekdsBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box-blue" x="0" y="0" width="178" height="34" rx="7"/>
  <text class="b" x="89" y="22" text-anchor="middle" xml:space="preserve">词法分析器</text>
  <rect class="box" x="0" y="44" width="178" height="158" rx="8"/>
  <text class="lg" x="12" y="68" xml:space="preserve">词法错误</text>
  <text class="sm mono" x="12" y="94" xml:space="preserve">... $ ...</text>
  <text class="sm" x="12" y="118" xml:space="preserve">字符无法组成token</text>
  <text class="sm muted" x="12" y="146" xml:space="preserve">GCC诊断</text>
  <text class="sm acc-t mono" x="12" y="164" xml:space="preserve">stray '@' in program</text>
  <rect class="box-blue" x="194" y="0" width="178" height="34" rx="7"/>
  <text class="b" x="283" y="22" text-anchor="middle" xml:space="preserve">语法分析器</text>
  <rect class="box" x="194" y="44" width="178" height="158" rx="8"/>
  <text class="lg" x="206" y="68" xml:space="preserve">语法错误</text>
  <text class="sm mono" x="206" y="94" xml:space="preserve">... x *% ...</text>
  <text class="sm" x="206" y="118" xml:space="preserve">token合法，顺序错误</text>
  <text class="sm muted" x="206" y="146" xml:space="preserve">GCC诊断</text>
  <text class="sm acc-t mono" x="206" y="164" xml:space="preserve">expected expression</text>
  <text class="sm acc-t mono" x="206" y="180" xml:space="preserve">before '%' token</text>
  <rect class="box-blue" x="388" y="0" width="178" height="34" rx="7"/>
  <text class="b" x="477" y="22" text-anchor="middle" xml:space="preserve">类型检查器</text>
  <rect class="box" x="388" y="44" width="178" height="158" rx="8"/>
  <text class="lg" x="400" y="68" xml:space="preserve">语义错误</text>
  <text class="sm mono" x="400" y="94" xml:space="preserve">int x; y = x(3);</text>
  <text class="sm" x="400" y="118" xml:space="preserve">结构正确，含义错误</text>
  <text class="sm muted" x="400" y="146" xml:space="preserve">GCC诊断</text>
  <text class="sm acc-t mono" x="400" y="164" xml:space="preserve">called object 'x' is</text>
  <text class="sm acc-t mono" x="400" y="180" xml:space="preserve">not a function ...</text>
  <rect class="box" x="582" y="0" width="178" height="34" rx="7"/>
  <text class="b" x="671" y="22" text-anchor="middle" xml:space="preserve">测试者、用户</text>
  <rect class="box" x="582" y="44" width="178" height="158" rx="8"/>
  <text class="lg" x="594" y="68" xml:space="preserve">正确性错误</text>
  <text class="sm mono" x="594" y="94" xml:space="preserve">your favorite program</text>
  <text class="sm" x="594" y="118" xml:space="preserve">能够运行，结果错误</text>
  <text class="sm muted" x="594" y="146" xml:space="preserve">编译器诊断</text>
  <text class="sm acc-t" x="594" y="164" xml:space="preserve">无</text>
  <line class="ln" x1="178" y1="17" x2="193" y2="17" marker-end="url(#ekdsA)"/>
  <line class="ln" x1="372" y1="17" x2="387" y2="17" marker-end="url(#ekdsA)"/>
  <line class="ln" x1="566" y1="17" x2="581" y2="17" marker-end="url(#ekdsA)"/>
  <path class="ln-blue" d="M0,212 L0,220 L566,220 L566,212"/>
  <text class="b blue-t" x="283" y="240" text-anchor="middle" xml:space="preserve">编译时发现</text>
  <path class="ln-acc" d="M582,212 L582,220 L760,220 L760,212"/>
  <text class="b acc-t" x="671" y="240" text-anchor="middle" xml:space="preserve">需检查运行行为</text>
</svg>
