<svg xmlns="http://www.w3.org/2000/svg" width="792" height="300" viewBox="-16 -16 792 300" role="img" aria-label="提取左因子：先读公共int，再由Y看下一个token；*继续乘法，合法后继符号则选择ε">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="300" rx="14" fill="#F0EEE6"/>
  <defs><marker id="lfngA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="lfngAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="lfngBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="370" height="264" rx="10"/>
  <rect class="box" x="390" y="0" width="370" height="264" rx="10"/>
  <text class="lg" x="16" y="26" xml:space="preserve">提取前：读取前必须选择</text>
  <text class="lg" x="406" y="26" xml:space="preserve">提取后：先读再选择</text>
  <rect class="box-acc" x="33" y="95" width="34" height="30" rx="6"/>
  <text class="mono" x="50" y="114.3" text-anchor="middle" xml:space="preserve">T</text>
  <line class="ln" x1="67" y1="104" x2="114" y2="72" marker-end="url(#lfngA)"/>
  <line class="ln" x1="67" y1="116" x2="114" y2="150" marker-end="url(#lfngA)"/>
  <rect class="box-bad" x="116" y="58" width="46" height="30" rx="5"/>
  <text class="mono" x="139" y="77.3" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="box-bad" x="116" y="136" width="46" height="30" rx="5"/>
  <text class="mono" x="139" y="155.3" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="box" x="166" y="136" width="46" height="30" rx="5"/>
  <text class="mono" x="189" y="155.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box" x="216" y="136" width="46" height="30" rx="5"/>
  <text class="mono" x="239" y="155.3" text-anchor="middle" xml:space="preserve">T</text>
  <text class="sm" x="16" y="200" xml:space="preserve">两候选首token相同，不能立即区分。</text>
  <text class="sm acc-t" x="16" y="218" xml:space="preserve">短候选先成功，长候选就不会尝试。</text>
  <text class="sm muted mono" x="16" y="244" xml:space="preserve">T → int | int * T</text>
  <rect class="box-acc" x="419" y="55" width="34" height="30" rx="6"/>
  <text class="mono" x="436" y="74.3" text-anchor="middle" xml:space="preserve">T</text>
  <line class="ln" x1="453" y1="70" x2="474" y2="70" marker-end="url(#lfngA)"/>
  <rect class="box-blue" x="476" y="55" width="46" height="30" rx="5"/>
  <text class="mono" x="499" y="74.3" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="box-acc" x="526" y="55" width="46" height="30" rx="5"/>
  <text class="mono" x="549" y="74.3" text-anchor="middle" xml:space="preserve">Y</text>
  <line class="ln" x1="549" y1="86" x2="549" y2="110" marker-end="url(#lfngA)"/>
  <text class="sm muted" x="558" y="104" xml:space="preserve">Y查看下一token</text>
  <line class="ln" x1="549" y1="110" x2="470" y2="134" marker-end="url(#lfngA)"/>
  <line class="ln" x1="549" y1="110" x2="640" y2="134" marker-end="url(#lfngA)"/>
  <text class="sm" x="470" y="150" text-anchor="middle" xml:space="preserve">下一个是*</text>
  <text class="sm" x="640" y="150" text-anchor="middle" xml:space="preserve">其他合法后继</text>
  <rect class="box" x="424" y="158" width="46" height="30" rx="5"/>
  <text class="mono" x="447" y="177.3" text-anchor="middle" xml:space="preserve">*</text>
  <rect class="box" x="474" y="158" width="46" height="30" rx="5"/>
  <text class="mono" x="497" y="177.3" text-anchor="middle" xml:space="preserve">T</text>
  <rect class="box" x="615" y="158" width="50" height="30" rx="5"/>
  <text class="mono" x="640" y="177.3" text-anchor="middle" xml:space="preserve">ε</text>
  <text class="sm" x="406" y="218" xml:space="preserve">先读int，公共前缀就不再妨碍选择。</text>
  <text class="sm muted mono" x="406" y="244" xml:space="preserve">T → int Y     Y → * T | ε</text>
</svg>
