<svg xmlns="http://www.w3.org/2000/svg" width="792" height="350" viewBox="-16 -16 792 350" role="img" aria-label="5 + (2 + 3)的分析树和AST：13个节点中去掉2个括号、4个冗余E、2个+叶节点；2个表示加法的E变为PLUS，保留3个整数叶节点，最终共5个节点">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #4F7FAF; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .box-dash { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.4; }
    .box-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.2; }
    .box-strong { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 2.4; }
    .box-bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2.2; stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .region-acc { fill: none; stroke: #D97757; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .st { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.3; }
    .st-acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.6; }
    .st-blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.5; }
    .badge { fill: #D97757; stroke: none; }
    .badge-t { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    .edge { stroke: #6F6D66; stroke-width: 1.2; fill: none; }
    .edge-acc { stroke: #D97757; stroke-width: 1.7; fill: none; }
    .edge-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln { stroke: #141413; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.6; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.4; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .ln-acc-dash { stroke: #D97757; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .head { fill: #141413; }
    .head-acc { fill: #D97757; }
    .head-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="350" rx="14" fill="#F0EEE6"/>
  <defs><marker id="cvastA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cvastAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cvastBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="490" height="314" rx="10"/>
  <rect class="box" x="510" y="0" width="250" height="314" rx="10"/>
  <text class="lg" x="16" y="24" xml:space="preserve">分析树（13个节点）</text>
  <text class="lg" x="526" y="24" xml:space="preserve">AST（5个节点）</text>
  <line class="edge" x1="178" y1="70" x2="46" y2="92"/>
  <line class="edge" x1="46" y1="116" x2="46" y2="138"/>
  <line class="edge" x1="178" y1="70" x2="112" y2="92"/>
  <line class="edge" x1="178" y1="70" x2="310" y2="92"/>
  <line class="edge" x1="310" y1="116" x2="178" y2="138"/>
  <line class="edge" x1="310" y1="116" x2="310" y2="138"/>
  <line class="edge" x1="310" y1="162" x2="244" y2="184"/>
  <line class="edge" x1="244" y1="208" x2="244" y2="230"/>
  <line class="edge" x1="310" y1="162" x2="310" y2="184"/>
  <line class="edge" x1="310" y1="162" x2="376" y2="184"/>
  <line class="edge" x1="376" y1="208" x2="376" y2="230"/>
  <line class="edge" x1="310" y1="116" x2="442" y2="138"/>
  <rect class="box-acc" x="163" y="46" width="30" height="24" rx="6"/>
  <text class="mono" x="178" y="62.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-dash" x="31" y="92" width="30" height="24" rx="6"/>
  <text class="mono" x="46" y="108.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="24" y="138" width="44" height="24" rx="6"/>
  <text class="mono" x="46" y="154.3" text-anchor="middle" xml:space="preserve">int5</text>
  <rect class="box-dash" x="97" y="92" width="30" height="24" rx="6"/>
  <text class="mono" x="112" y="108.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-dash" x="295" y="92" width="30" height="24" rx="6"/>
  <text class="mono" x="310" y="108.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-dash" x="163" y="138" width="30" height="24" rx="6"/>
  <text class="mono" x="178" y="154.3" text-anchor="middle" xml:space="preserve">(</text>
  <rect class="box-acc" x="295" y="138" width="30" height="24" rx="6"/>
  <text class="mono" x="310" y="154.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-dash" x="229" y="184" width="30" height="24" rx="6"/>
  <text class="mono" x="244" y="200.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="222" y="230" width="44" height="24" rx="6"/>
  <text class="mono" x="244" y="246.3" text-anchor="middle" xml:space="preserve">int2</text>
  <rect class="box-dash" x="295" y="184" width="30" height="24" rx="6"/>
  <text class="mono" x="310" y="200.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box-dash" x="361" y="184" width="30" height="24" rx="6"/>
  <text class="mono" x="376" y="200.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="354" y="230" width="44" height="24" rx="6"/>
  <text class="mono" x="376" y="246.3" text-anchor="middle" xml:space="preserve">int3</text>
  <rect class="box-dash" x="427" y="138" width="30" height="24" rx="6"/>
  <text class="mono" x="442" y="154.3" text-anchor="middle" xml:space="preserve">)</text>
  <rect class="box-acc" x="16" y="276" width="18" height="16" rx="3"/>
  <text class="sm" x="40" y="288" xml:space="preserve">保留为PLUS</text>
  <rect class="box-blue" x="126" y="276" width="18" height="16" rx="3"/>
  <text class="sm" x="150" y="288" xml:space="preserve">保留数值</text>
  <rect class="box-dash" x="236" y="276" width="18" height="16" rx="3"/>
  <text class="sm" x="260" y="288" xml:space="preserve">AST中删除（8个）</text>
  <line class="edge" x1="610" y1="86" x2="556" y2="128"/>
  <line class="edge" x1="610" y1="86" x2="664" y2="128"/>
  <line class="edge" x1="664" y1="152" x2="628" y2="194"/>
  <line class="edge" x1="664" y1="152" x2="700" y2="194"/>
  <rect class="box-acc" x="587" y="62" width="46" height="24" rx="6"/>
  <text class="mono" x="610" y="78.3" text-anchor="middle" xml:space="preserve">PLUS</text>
  <rect class="box-blue" x="541" y="128" width="30" height="24" rx="6"/>
  <text class="mono" x="556" y="144.3" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="box-acc" x="641" y="128" width="46" height="24" rx="6"/>
  <text class="mono" x="664" y="144.3" text-anchor="middle" xml:space="preserve">PLUS</text>
  <rect class="box-blue" x="613" y="194" width="30" height="24" rx="6"/>
  <text class="mono" x="628" y="210.3" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="box-blue" x="685" y="194" width="30" height="24" rx="6"/>
  <text class="mono" x="700" y="210.3" text-anchor="middle" xml:space="preserve">3</text>
  <text class="sm" x="526" y="252" xml:space="preserve">无需括号，2 + 3仍为一组。</text>
  <text class="sm" x="526" y="270" xml:space="preserve">内部PLUS是外部PLUS的子节点，</text>
  <text class="sm" x="526" y="288" xml:space="preserve">父子关系表达分组。</text>
</svg>
