<svg xmlns="http://www.w3.org/2000/svg" width="812" height="352" viewBox="-16 -16 812 352" role="img" aria-label="FOLLOW依赖图：$、)进入E，+进入T；E与X互传，T与Y互传，E还单向传给T；结果E、X为{$, )}，T、Y为{+, $, )}">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="812" height="352" rx="14" fill="#F0EEE6"/>
  <defs><marker id="l7-follow-graph-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-follow-graph-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-follow-graph-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="780" height="320" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">FOLLOW传递图（箭头A → B表示FOLLOW(A) ⊆ FOLLOW(B)）</text>
  <rect class="blue" x="188" y="66" width="124" height="52" rx="10"/>
  <text class="mono b" x="250" y="87" text-anchor="middle" xml:space="preserve">E</text>
  <text class="mono sm" x="250" y="107" text-anchor="middle" xml:space="preserve">{ $, ) }</text>
  <rect class="blue" x="428" y="66" width="124" height="52" rx="10"/>
  <text class="mono b" x="490" y="87" text-anchor="middle" xml:space="preserve">X</text>
  <text class="mono sm" x="490" y="107" text-anchor="middle" xml:space="preserve">{ $, ) }</text>
  <rect class="blue" x="188" y="206" width="124" height="52" rx="10"/>
  <text class="mono b" x="250" y="227" text-anchor="middle" xml:space="preserve">T</text>
  <text class="mono sm" x="250" y="247" text-anchor="middle" xml:space="preserve">{ +, $, ) }</text>
  <rect class="blue" x="428" y="206" width="124" height="52" rx="10"/>
  <text class="mono b" x="490" y="227" text-anchor="middle" xml:space="preserve">Y</text>
  <text class="mono sm" x="490" y="247" text-anchor="middle" xml:space="preserve">{ +, $, ) }</text>
  <line class="ln" x1="314" y1="84" x2="426" y2="84" marker-end="url(#l7-follow-graph-a)"/>
  <text class="mono sm" x="370" y="76" text-anchor="middle" xml:space="preserve">E → T X</text>
  <line class="ln" x1="426" y1="100" x2="314" y2="100" marker-end="url(#l7-follow-graph-a)"/>
  <text class="mono sm" x="370" y="118" text-anchor="middle" xml:space="preserve">X → + E</text>
  <line class="ln-acc" x1="250" y1="120" x2="250" y2="204" marker-end="url(#l7-follow-graph-acc)"/>
  <text class="sm acc-t" x="258" y="158" xml:space="preserve">E → T X（X可空）</text>
  <text class="sm acc-t" x="258" y="174" xml:space="preserve">仅单向</text>
  <line class="ln" x1="314" y1="224" x2="426" y2="224" marker-end="url(#l7-follow-graph-a)"/>
  <text class="mono sm" x="370" y="216" text-anchor="middle" xml:space="preserve">T → int Y</text>
  <line class="ln" x1="426" y1="240" x2="314" y2="240" marker-end="url(#l7-follow-graph-a)"/>
  <text class="mono sm" x="370" y="258" text-anchor="middle" xml:space="preserve">Y → * T</text>
  <rect class="plain" x="45.0" y="53.0" width="30" height="26" rx="6"/>
  <text class="mono" x="60" y="70.5" text-anchor="middle" xml:space="preserve">$</text>
  <text class="sm muted" x="82" y="62" xml:space="preserve">开始符号</text>
  <line class="ln-blue" x1="75" y1="70" x2="186" y2="84" marker-end="url(#l7-follow-graph-blue)"/>
  <rect class="plain" x="45.0" y="105.0" width="30" height="26" rx="6"/>
  <text class="mono" x="60" y="122.5" text-anchor="middle" xml:space="preserve">)</text>
  <text class="sm mono muted" x="82" y="136" xml:space="preserve">T → ( E )</text>
  <line class="ln-blue" x1="75" y1="114" x2="186" y2="100" marker-end="url(#l7-follow-graph-blue)"/>
  <rect class="plain" x="45.0" y="219.0" width="30" height="26" rx="6"/>
  <text class="mono" x="60" y="236.5" text-anchor="middle" xml:space="preserve">+</text>
  <text class="sm mono muted" x="40" y="264" xml:space="preserve">FIRST(X) - {ε}</text>
  <text class="sm muted" x="40" y="280" xml:space="preserve">E → T X中X之前</text>
  <line class="ln-blue" x1="75" y1="232" x2="186" y2="232" marker-end="url(#l7-follow-graph-blue)"/>
  <text class="sm" x="572" y="88" xml:space="preserve">双向传递最终使集合相同。</text>
  <text class="sm mono" x="572" y="106" xml:space="preserve">E = X, T = Y</text>
  <text class="sm" x="572" y="226" xml:space="preserve">只有T与Y含+。</text>
  <text class="sm" x="572" y="244" xml:space="preserve">没有从T到E的箭头。</text>
  <text class="muted" x="16" y="308" xml:space="preserve">为何需要多轮：)较晚加入E，还需传给X、T、Y。</text>
</svg>
