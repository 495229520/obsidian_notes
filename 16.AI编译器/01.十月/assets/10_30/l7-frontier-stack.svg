<svg xmlns="http://www.w3.org/2000/svg" width="792" height="332" viewBox="-16 -16 792 332" role="img" aria-label="展开到T → int Y后的语法树与栈：未处理叶节点从左到右为int、Y、X，对应栈从上到下顺序；栈底为结束标记$">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="792" height="332" rx="14" fill="#F0EEE6"/>
  <defs><marker id="l7-frontier-stack-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-frontier-stack-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-frontier-stack-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="470" height="300" rx="8"/>
  <rect class="box" x="490" y="0" width="270" height="300" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">语法树：展开E → T X与T → int Y</text>
  <line class="ln" x1="235" y1="74" x2="135" y2="106"/>
  <line class="ln" x1="235" y1="74" x2="335" y2="106"/>
  <line class="ln" x1="135" y1="130" x2="85" y2="162"/>
  <line class="ln" x1="135" y1="130" x2="185" y2="162"/>
  <rect class="plain" x="220.0" y="50.0" width="30" height="24" rx="6"/>
  <text class="mono" x="235" y="66.5" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="plain" x="120.0" y="106.0" width="30" height="24" rx="6"/>
  <text class="mono" x="135" y="122.5" text-anchor="middle" xml:space="preserve">T</text>
  <rect class="acc" x="320.0" y="106.0" width="30" height="24" rx="6"/>
  <text class="mono" x="335" y="122.5" text-anchor="middle" xml:space="preserve">X</text>
  <rect class="acc" x="65.375" y="162.0" width="39.25" height="24" rx="6"/>
  <text class="mono" x="85" y="178.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="acc" x="170.0" y="162.0" width="30" height="24" rx="6"/>
  <text class="mono" x="185" y="178.5" text-anchor="middle" xml:space="preserve">Y</text>
  <text class="b" x="16" y="226" xml:space="preserve">未处理前沿（从左到右）</text>
  <rect class="acc" x="181.0" y="209.0" width="48" height="26" rx="6"/>
  <text class="mono" x="205" y="226.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="acc" x="239.0" y="209.0" width="48" height="26" rx="6"/>
  <text class="mono" x="263" y="226.5" text-anchor="middle" xml:space="preserve">Y</text>
  <rect class="acc" x="297.0" y="209.0" width="48" height="26" rx="6"/>
  <text class="mono" x="321" y="226.5" text-anchor="middle" xml:space="preserve">X</text>
  <line class="ln-acc" x1="375" y1="222" x2="424" y2="222" marker-end="url(#l7-frontier-stack-acc)"/>
  <text class="muted" x="16" y="262" xml:space="preserve">已展开的E、T留在树中，但不在栈中。</text>
  <text class="muted" x="16" y="281" xml:space="preserve">最左叶节点在栈顶，因此始终先处理最左符号。</text>
  <text class="lg" x="506" y="26" xml:space="preserve">分析栈</text>
  <rect class="acc" x="570.0" y="55.0" width="110" height="34" rx="6"/>
  <text class="mono" x="625" y="76.5" text-anchor="middle" xml:space="preserve">int</text>
  <rect class="acc" x="570.0" y="99.0" width="110" height="34" rx="6"/>
  <text class="mono" x="625" y="120.5" text-anchor="middle" xml:space="preserve">Y</text>
  <rect class="acc" x="570.0" y="143.0" width="110" height="34" rx="6"/>
  <text class="mono" x="625" y="164.5" text-anchor="middle" xml:space="preserve">X</text>
  <rect class="dead" x="570.0" y="187.0" width="110" height="34" rx="6"/>
  <text class="mono" x="625" y="208.5" text-anchor="middle" xml:space="preserve">$</text>
  <text class="acc-t sm" x="690" y="76" xml:space="preserve">← 栈顶</text>
  <text class="muted sm" x="690" y="208" xml:space="preserve">← 栈底</text>
  <text class="muted" x="506" y="266" xml:space="preserve">栈顶为终结符：匹配输入；</text>
  <text class="muted" x="506" y="285" xml:space="preserve">栈顶为非终结符：查表展开。</text>
</svg>
