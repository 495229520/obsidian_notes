<svg xmlns="http://www.w3.org/2000/svg" width="812" height="360" viewBox="-16 -16 812 360" role="img" aria-label="三个选择点：int | * int + int应移进；int * int | + int应按T → int归约；T | + int应移进而不能按E → T归约；依据是下一token是否属于待归约左部的FOLLOW">
  <rect x="-16" y="-16" width="100%" height="100%" fill="rgb(245, 244, 237)"/>
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="812" height="360" rx="14" fill="#F0EEE6"/>
  <defs><marker id="l7-wrong-reduce-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-wrong-reduce-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="l7-wrong-reduce-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="780" height="328" rx="8"/>
  <text class="lg" x="16" y="26" xml:space="preserve">栈顶匹配右部，也可能不该归约</text>
  <text class="b muted" x="20" y="54" xml:space="preserve">选择点</text>
  <text class="b muted" x="236" y="54" xml:space="preserve">可继续的动作</text>
  <text class="b muted" x="486" y="54" xml:space="preserve">导致失败的动作</text>
  <rect class="plain" x="16" y="70" width="200" height="68" rx="8"/>
  <text class="mono" x="116" y="98" text-anchor="middle" xml:space="preserve">int | * int + int</text>
  <text class="mono sm acc-t" x="116" y="120" text-anchor="middle" xml:space="preserve">* ∉ FOLLOW(T)</text>
  <line class="ln-blue" x1="216" y1="100" x2="232" y2="100" marker-end="url(#l7-wrong-reduce-blue)"/>
  <rect class="blue" x="236" y="70" width="226" height="68" rx="8"/>
  <text class="b" x="250" y="96" xml:space="preserve">移进</text>
  <text class="mono" x="250" y="120" xml:space="preserve">int * | int + int</text>
  <line class="ln-acc" x1="462" y1="100" x2="482" y2="100" marker-end="url(#l7-wrong-reduce-acc)"/>
  <rect class="bad" x="486" y="70" width="278" height="68" rx="8"/>
  <text class="mono sm" x="500" y="92" xml:space="preserve">T → int →</text>
  <text class="mono sm" x="590" y="92" xml:space="preserve">T | * int + int</text>
  <text class="acc-t" x="500" y="118" xml:space="preserve">没有允许T后接*的规则</text>
  <rect class="plain" x="16" y="154" width="200" height="68" rx="8"/>
  <text class="mono" x="116" y="182" text-anchor="middle" xml:space="preserve">int * int | + int</text>
  <text class="mono sm acc-t" x="116" y="204" text-anchor="middle" xml:space="preserve">+ ∈ FOLLOW(T)</text>
  <line class="ln-blue" x1="216" y1="184" x2="232" y2="184" marker-end="url(#l7-wrong-reduce-blue)"/>
  <rect class="blue" x="236" y="154" width="226" height="68" rx="8"/>
  <text class="b" x="250" y="180" xml:space="preserve">归约T → int</text>
  <text class="mono" x="250" y="204" xml:space="preserve">int * T | + int</text>
  <line class="ln-acc" x1="462" y1="184" x2="482" y2="184" marker-end="url(#l7-wrong-reduce-acc)"/>
  <rect class="bad" x="486" y="154" width="278" height="68" rx="8"/>
  <text class="mono sm" x="500" y="176" xml:space="preserve">移进 →</text>
  <text class="mono sm" x="590" y="176" xml:space="preserve">int * int + | int</text>
  <text class="acc-t" x="500" y="202" xml:space="preserve">*后必须有T</text>
  <rect class="plain" x="16" y="238" width="200" height="68" rx="8"/>
  <text class="mono" x="116" y="266" text-anchor="middle" xml:space="preserve">T | + int</text>
  <text class="mono sm acc-t" x="116" y="288" text-anchor="middle" xml:space="preserve">+ ∉ FOLLOW(E)</text>
  <line class="ln-blue" x1="216" y1="268" x2="232" y2="268" marker-end="url(#l7-wrong-reduce-blue)"/>
  <rect class="blue" x="236" y="238" width="226" height="68" rx="8"/>
  <text class="b" x="250" y="264" xml:space="preserve">移进</text>
  <text class="mono" x="250" y="288" xml:space="preserve">T + | int</text>
  <line class="ln-acc" x1="462" y1="268" x2="482" y2="268" marker-end="url(#l7-wrong-reduce-acc)"/>
  <rect class="bad" x="486" y="238" width="278" height="68" rx="8"/>
  <text class="mono sm" x="500" y="260" xml:space="preserve">E → T →</text>
  <text class="mono sm" x="590" y="260" xml:space="preserve">E | + int</text>
  <text class="acc-t" x="500" y="286" xml:space="preserve">没有允许E后接+的规则</text>
</svg>
