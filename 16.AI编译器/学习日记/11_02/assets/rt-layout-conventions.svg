<svg xmlns="http://www.w3.org/2000/svg" width="932" height="398" viewBox="-16 -16 932 398" role="img" aria-label="같은 메모리 배치를 그리는 두 관례. 왼쪽은 이 강의처럼 낮은 주소를 위에 그린 그림으로 Code, Static Data, Heap, 여유 공간, Stack 순서다. 오른쪽은 x86-64 Linux를 높은 주소가 위로 오게 그린 그림이고 실측 주소를 붙였다. 두 그림 모두 힙은 높은 주소 쪽으로, 스택은 낮은 주소 쪽으로 자란다. 실제 Linux에는 그 사이에 mmap 영역이 있다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="398" rx="14" fill="#F0EEE6"/>
  <defs><marker id="rt-layout-conventions-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-layout-conventions-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-layout-conventions-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="410" height="366" rx="8"/>
  <text class="b" x="16" y="24" xml:space="preserve">강의 그림: 낮은 주소가 위</text>
  <text class="sm muted" x="155" y="42" text-anchor="middle" xml:space="preserve">낮은 주소</text>
  <text class="sm muted" x="155" y="348" text-anchor="middle" xml:space="preserve">높은 주소</text>
  <rect class="plain" x="50" y="50" width="210" height="42" rx="0"/>
  <text class="b" x="155" y="75.5" text-anchor="middle" xml:space="preserve">Code (목적 코드)</text>
  <text class="sm muted" x="272" y="75.0" xml:space="preserve">읽기 전용인 경우가 많다</text>
  <rect class="plain" x="50" y="92" width="210" height="42" rx="0"/>
  <text class="b" x="155" y="117.5" text-anchor="middle" xml:space="preserve">Static Data (전역)</text>
  <text class="sm muted" x="272" y="117.0" xml:space="preserve">크기 고정</text>
  <rect class="blue" x="50" y="134" width="210" height="42" rx="0"/>
  <text class="b" x="155" y="159.5" text-anchor="middle" xml:space="preserve">Heap</text>
  <text class="sm muted" x="272" y="159.0" xml:space="preserve">malloc / new</text>
  <rect class="ghost" x="50" y="176" width="210" height="98" rx="0"/>
  <rect class="acc" x="50" y="274" width="210" height="56" rx="0"/>
  <text class="b" x="155" y="306.5" text-anchor="middle" xml:space="preserve">Stack (AR)</text>
  <text class="sm muted" x="272" y="306.0" xml:space="preserve">호출마다 AR 하나</text>
  <line class="ln-blue" x1="80" y1="180" x2="80" y2="210" marker-end="url(#rt-layout-conventions-blue)"/>
  <text class="sm blue-t" x="94" y="200" xml:space="preserve">힙: 높은 주소 쪽으로</text>
  <line class="ln-acc" x1="80" y1="270" x2="80" y2="240" marker-end="url(#rt-layout-conventions-acc)"/>
  <text class="sm acc-t" x="94" y="258" xml:space="preserve">스택: 낮은 주소 쪽으로</text>
  <rect class="box" x="440" y="0" width="460" height="366" rx="8"/>
  <text class="b" x="456" y="24" xml:space="preserve">실제 x86-64 Linux: 흔히 높은 주소를 위에 그린다</text>
  <text class="sm muted" x="575" y="42" text-anchor="middle" xml:space="preserve">높은 주소</text>
  <text class="sm muted" x="575" y="348" text-anchor="middle" xml:space="preserve">낮은 주소</text>
  <rect class="acc" x="470" y="50" width="210" height="45" rx="0"/>
  <text class="b" x="575" y="77.0" text-anchor="middle" xml:space="preserve">스택</text>
  <text class="mono sm" x="694" y="70.5" xml:space="preserve">0x7ffe4157e954</text>
  <text class="sm muted" x="694" y="86.5" xml:space="preserve">지역 변수 local</text>
  <rect class="ghost" x="470" y="95" width="210" height="45" rx="0"/>
  <rect class="plain" x="470" y="140" width="210" height="40" rx="0"/>
  <text class="b" x="575" y="164.5" text-anchor="middle" xml:space="preserve">mmap 영역</text>
  <text class="mono sm" x="694" y="158.0" xml:space="preserve">0x7a42ffc89010</text>
  <text class="sm muted" x="694" y="174.0" xml:space="preserve">malloc(1MB)</text>
  <rect class="ghost" x="470" y="180" width="210" height="32" rx="0"/>
  <rect class="blue" x="470" y="212" width="210" height="40" rx="0"/>
  <text class="b" x="575" y="236.5" text-anchor="middle" xml:space="preserve">힙 (brk)</text>
  <text class="mono sm" x="694" y="230.0" xml:space="preserve">0x5761026872a0</text>
  <text class="sm muted" x="694" y="246.0" xml:space="preserve">malloc(16)</text>
  <rect class="plain" x="470" y="252" width="210" height="44" rx="0"/>
  <text class="b" x="575" y="278.5" text-anchor="middle" xml:space="preserve">전역·정적 데이터</text>
  <text class="mono sm" x="694" y="272.0" xml:space="preserve">0x576100735010</text>
  <text class="sm muted" x="694" y="288.0" xml:space="preserve">전역 변수</text>
  <rect class="plain" x="470" y="296" width="210" height="34" rx="0"/>
  <text class="b" x="575" y="317.5" text-anchor="middle" xml:space="preserve">코드 (.text)</text>
  <text class="mono sm" x="694" y="311.0" xml:space="preserve">0x576100732189</text>
  <text class="sm muted" x="694" y="327.0" xml:space="preserve">main 함수</text>
  <line class="ln-acc" x1="490" y1="99" x2="490" y2="129" marker-end="url(#rt-layout-conventions-acc)"/>
  <text class="sm acc-t" x="504" y="120" xml:space="preserve">스택: 낮은 주소 쪽으로</text>
  <line class="ln-blue" x1="490" y1="208" x2="490" y2="186" marker-end="url(#rt-layout-conventions-blue)"/>
  <text class="sm blue-t" x="504" y="201" xml:space="preserve">힙: 높은 주소 쪽으로</text>
  <text class="sm muted" x="694" y="348" xml:space="preserve">ASLR: 실행마다 바뀜</text>
</svg>
