<svg xmlns="http://www.w3.org/2000/svg" width="932" height="302" viewBox="-16 -16 932 302" role="img" aria-label="두 가정과 스택. 가정이 성립하면 호출 구간이 포개지기만 하므로 스택 하나로 충분하다. 예외는 f1, f2, f3 프레임을 한 번에 빼지만 안쪽부터 차례로 정리하므로 LIFO는 유지된다. 스레드와 코루틴은 흐름마다 스택이 필요하고, call/cc는 이미 반환한 프레임으로 돌아가므로 프레임을 힙에 둔다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="302" rx="14" fill="#F0EEE6"/>
  <defs><marker id="rt-lifo-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-lifo-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-lifo-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="284" height="270" rx="8"/>
  <text class="b" x="14" y="24" xml:space="preserve">두 가정 성립: 호출이 포개진다</text>
  <text class="sm muted" x="14" y="44" xml:space="preserve">늦게 시작한 호출이 먼저 끝난다 (LIFO)</text>
  <rect class="plain" x="20" y="62" width="244" height="22" rx="4"/>
  <text class="mono sm" x="142.0" y="77.5" text-anchor="middle" xml:space="preserve">main</text>
  <rect class="blue" x="50" y="94" width="184" height="22" rx="4"/>
  <text class="mono sm" x="142.0" y="109.5" text-anchor="middle" xml:space="preserve">f</text>
  <rect class="acc" x="90" y="126" width="104" height="22" rx="4"/>
  <text class="mono sm" x="142.0" y="141.5" text-anchor="middle" xml:space="preserve">g</text>
  <line class="ln" x1="20" y1="170" x2="264" y2="170" marker-end="url(#rt-lifo-a)"/>
  <text class="sm muted" x="264" y="188" text-anchor="end" xml:space="preserve">시간</text>
  <text class="sm" x="14" y="222" xml:space="preserve">막대가 포개지기만 하고 엇갈리지 않는다</text>
  <text class="sm b" x="14" y="242" xml:space="preserve">→ 스택 하나로 충분하다</text>
  <rect class="box" x="308" y="0" width="284" height="270" rx="8"/>
  <text class="b" x="322" y="24" xml:space="preserve">예외: 가정 2가 깨진다</text>
  <text class="sm muted" x="322" y="44" xml:space="preserve">f3이 던지고 main이 잡는다</text>
  <rect class="plain" x="328" y="62" width="244" height="20" rx="4"/>
  <text class="mono sm" x="450.0" y="76.5" text-anchor="middle" xml:space="preserve">main</text>
  <rect class="blue" x="352" y="90" width="146" height="20" rx="4"/>
  <text class="mono sm" x="425.0" y="104.5" text-anchor="middle" xml:space="preserve">f1</text>
  <rect class="blue" x="372" y="118" width="126" height="20" rx="4"/>
  <text class="mono sm" x="435.0" y="132.5" text-anchor="middle" xml:space="preserve">f2</text>
  <rect class="acc" x="392" y="146" width="106" height="20" rx="4"/>
  <text class="mono sm" x="445.0" y="160.5" text-anchor="middle" xml:space="preserve">f3</text>
  <text class="sm acc-t" x="498" y="184" text-anchor="end" xml:space="preserve">throw</text>
  <line class="ln-acc" x1="512" y1="156" x2="512" y2="86" marker-end="url(#rt-lifo-acc)"/>
  <text class="sm acc-t" x="520" y="126" xml:space="preserve">catch</text>
  <text class="sm" x="322" y="222" xml:space="preserve">세 프레임이 한 번에 빠지지만</text>
  <text class="sm" x="322" y="242" xml:space="preserve">안쪽부터 정리한다 (~f3 → ~f2 → ~f1)</text>
  <rect class="box" x="616" y="0" width="284" height="270" rx="8"/>
  <text class="b" x="630" y="24" xml:space="preserve">가정 1이 깨진다: 흐름이 여럿</text>
  <text class="sm muted" x="630" y="44" xml:space="preserve">스레드·코루틴마다 스택이 따로 있다</text>
  <text class="sm muted" x="694" y="72" text-anchor="middle" xml:space="preserve">스레드 A</text>
  <rect class="plain" x="644" y="136" width="100" height="24" rx="4"/>
  <text class="mono sm" x="694.0" y="152.5" text-anchor="middle" xml:space="preserve">run_a</text>
  <rect class="blue" x="644" y="108" width="100" height="24" rx="4"/>
  <text class="mono sm" x="694.0" y="124.5" text-anchor="middle" xml:space="preserve">f</text>
  <rect class="acc" x="644" y="80" width="100" height="24" rx="4"/>
  <text class="mono sm" x="694.0" y="96.5" text-anchor="middle" xml:space="preserve">g</text>
  <text class="sm muted" x="822" y="72" text-anchor="middle" xml:space="preserve">스레드 B</text>
  <rect class="plain" x="772" y="136" width="100" height="24" rx="4"/>
  <text class="mono sm" x="822.0" y="152.5" text-anchor="middle" xml:space="preserve">worker</text>
  <rect class="acc" x="772" y="108" width="100" height="24" rx="4"/>
  <text class="mono sm" x="822.0" y="124.5" text-anchor="middle" xml:space="preserve">h</text>
  <text class="sm" x="630" y="202" xml:space="preserve">각 흐름 안에서는 여전히 LIFO</text>
  <text class="sm" x="630" y="222" xml:space="preserve">call/cc는 이미 반환한 프레임으로</text>
  <text class="sm" x="630" y="242" xml:space="preserve">다시 들어가므로 프레임을 힙에 둔다</text>
</svg>
