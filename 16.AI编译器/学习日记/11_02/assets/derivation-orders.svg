  <text class="mono" x="232" y="110.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="271" y="94" width="30" height="24" rx="6"/>
  <text class="mono" x="286" y="110.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="271" y="142" width="30" height="24" rx="6"/>
  <text class="mono" x="286" y="158.3" text-anchor="middle" xml:space="preserve">id</text>
