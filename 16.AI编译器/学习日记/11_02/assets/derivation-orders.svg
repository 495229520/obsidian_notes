  <rect class="box" x="163" y="142" width="30" height="24" rx="6"/>
  <text class="mono" x="178" y="158.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="163" y="190" width="30" height="24" rx="6"/>
  <text class="mono" x="178" y="206.3" text-anchor="middle" xml:space="preserve">id</text>
