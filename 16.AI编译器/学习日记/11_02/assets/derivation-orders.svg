  <rect class="box" x="109" y="94" width="30" height="24" rx="6"/>
  <text class="mono" x="124" y="110.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="55" y="142" width="30" height="24" rx="6"/>
  <text class="mono" x="70" y="158.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="55" y="190" width="30" height="24" rx="6"/>
  <text class="mono" x="70" y="206.3" text-anchor="middle" xml:space="preserve">id</text>
  <rect class="box-blue" x="109" y="142" width="30" height="24" rx="6"/>
