  <text class="mono" x="692" y="158.3" text-anchor="middle" xml:space="preserve">id</text>
  <circle class="badge" cx="585" cy="58" r="8"/>
  <text class="badge-t" x="585" y="61.7" text-anchor="middle" xml:space="preserve">1</text>
  <circle class="badge" cx="504" cy="106" r="8"/>
  <text class="badge-t" x="504" y="109.7" text-anchor="middle" xml:space="preserve">3</text>
  <circle class="badge" cx="450" cy="154" r="8"/>
  <text class="badge-t" x="450" y="157.7" text-anchor="middle" xml:space="preserve">5</text>
  <circle class="badge" cx="558" cy="154" r="8"/>
  <text class="badge-t" x="558" y="157.7" text-anchor="middle" xml:space="preserve">4</text>
  <circle class="badge" cx="666" cy="106" r="8"/>
  <text class="badge-t" x="666" y="109.7" text-anchor="middle" xml:space="preserve">2</text>
  <text class="lg" x="388" y="118" text-anchor="middle" xml:space="preserve">=</text>
  <text class="sm muted" x="388" y="138" text-anchor="middle" xml:space="preserve">같은 트리</text>
  <text class="sm mono" x="4" y="254" xml:space="preserve">E ⇒ E+E ⇒ E*E+E ⇒ id*E+E ⇒ id*id+E ⇒ id*id+id</text>
  <text class="sm mono" x="410" y="254" xml:space="preserve">E ⇒ E+E ⇒ E+id ⇒ E*E+id ⇒ E*id+id ⇒ id*id+id</text>
  <rect class="box-acc" x="0" y="270" width="760" height="44" rx="7"/>
  <text class="sm" x="16" y="289" xml:space="preserve">숫자는 내부 노드를 확장하는 순서다. 이 트리를 만드는 순서는 모두 8가지로, 부모를 자식보다 먼저 확장하기만 하면 된다.</text>
  <text class="sm" x="16" y="305" xml:space="preserve">최좌단과 최우단은 그중 각각 정확히 1가지다. 순서가 달라도 각 노드에 쓴 규칙이 같으므로 결과 트리는 같다.</text>
</svg>
