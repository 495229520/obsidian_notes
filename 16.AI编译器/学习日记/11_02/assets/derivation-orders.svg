  <circle class="badge" cx="260" cy="106" r="8"/>
  <text class="badge-t" x="260" y="109.7" text-anchor="middle" xml:space="preserve">5</text>
  <text class="lg" x="584" y="14" text-anchor="middle" xml:space="preserve">최우단 유도</text>
  <text class="sm muted" x="584" y="32" text-anchor="middle" xml:space="preserve">항상 가장 오른쪽 E부터</text>
  <line class="edge" x1="611" y1="70" x2="530" y2="94"/>
  <line class="edge" x1="530" y1="118" x2="476" y2="142"/>
  <line class="edge" x1="476" y1="166" x2="476" y2="190"/>
  <line class="edge" x1="530" y1="118" x2="530" y2="142"/>
  <line class="edge" x1="530" y1="118" x2="584" y2="142"/>
  <line class="edge" x1="584" y1="166" x2="584" y2="190"/>
  <line class="edge" x1="611" y1="70" x2="638" y2="94"/>
  <line class="edge" x1="611" y1="70" x2="692" y2="94"/>
  <line class="edge" x1="692" y1="118" x2="692" y2="142"/>
  <rect class="box" x="596" y="46" width="30" height="24" rx="6"/>
  <text class="mono" x="611" y="62.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="515" y="94" width="30" height="24" rx="6"/>
  <text class="mono" x="530" y="110.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box" x="461" y="142" width="30" height="24" rx="6"/>
  <text class="mono" x="476" y="158.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="461" y="190" width="30" height="24" rx="6"/>
  <text class="mono" x="476" y="206.3" text-anchor="middle" xml:space="preserve">id</text>
  <rect class="box-blue" x="515" y="142" width="30" height="24" rx="6"/>
