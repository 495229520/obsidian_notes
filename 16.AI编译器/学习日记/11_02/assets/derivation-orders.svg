  <rect class="box" x="569" y="142" width="30" height="24" rx="6"/>
  <text class="mono" x="584" y="158.3" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="box-blue" x="569" y="190" width="30" height="24" rx="6"/>
  <text class="mono" x="584" y="206.3" text-anchor="middle" xml:space="preserve">id</text>
  <rect class="box-blue" x="623" y="94" width="30" height="24" rx="6"/>
  <text class="mono" x="638" y="110.3" text-anchor="middle" xml:space="preserve">+</text>
  <rect class="box" x="677" y="94" width="30" height="24" rx="6"/>
  <text class="mono" x="692" y="110.3" text-anchor="middle" xml:space="preserve">E</text>
