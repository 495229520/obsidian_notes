<svg xmlns="http://www.w3.org/2000/svg" width="932" height="362" viewBox="-16 -16 932 362" role="img" aria-label="将可达对象 A、C、F 紧凑地复制到新空间，在旧对象中记录转发指针">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="932" height="362" rx="14" fill="#F0EEE6"/>
  <defs><marker id="gc-copy-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-copy-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-copy-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">【复制前：旧空间已满】</text>
  <text class="mono sm b acc-t" x="0" y="58" xml:space="preserve">根</text>
  <line class="ln-acc" x1="34" y1="53" x2="58" y2="53" marker-end="url(#gc-copy-acc)"/>
  <rect class="blue" x="60" y="38" width="70" height="30" rx="4"/>
  <text class="mono b" x="95.0" y="57.5" text-anchor="middle" xml:space="preserve">A</text>
  <rect class="blue" x="180" y="38" width="70" height="30" rx="4"/>
  <text class="mono b" x="215.0" y="57.5" text-anchor="middle" xml:space="preserve">C</text>
  <rect class="blue" x="300" y="38" width="70" height="30" rx="4"/>
  <text class="mono b" x="335.0" y="57.5" text-anchor="middle" xml:space="preserve">F</text>
  <line class="ln" x1="130" y1="53" x2="178" y2="53" marker-end="url(#gc-copy-a)"/>
  <line class="ln" x1="250" y1="53" x2="298" y2="53" marker-end="url(#gc-copy-a)"/>
  <polyline class="ln" points="335,68 335,86 95,86 95,70" marker-end="url(#gc-copy-a)"/>
  <text class="sm muted" x="400" y="58" xml:space="preserve">B、D、E 从根不可达，可以回收</text>
  <rect class="ghost" x="640" y="38" width="60" height="30" rx="4"/>
  <text class="mono b muted" x="670.0" y="57.5" text-anchor="middle" xml:space="preserve">B</text>
  <rect class="ghost" x="716" y="38" width="60" height="30" rx="4"/>
  <text class="mono b muted" x="746.0" y="57.5" text-anchor="middle" xml:space="preserve">D</text>
  <rect class="ghost" x="792" y="38" width="60" height="30" rx="4"/>
  <text class="mono b muted" x="822.0" y="57.5" text-anchor="middle" xml:space="preserve">E</text>
  <text class="b" x="340" y="200" xml:space="preserve">【复制后：对象在新空间中紧凑排列，两区交换角色】</text>
  <text class="mono sm b acc-t" x="0" y="238" xml:space="preserve">根</text>
  <line class="ln-acc" x1="34" y1="233" x2="58" y2="233" marker-end="url(#gc-copy-acc)"/>
  <rect class="blue" x="60" y="218" width="70" height="30" rx="4"/>
  <text class="mono b" x="95.0" y="237.5" text-anchor="middle" xml:space="preserve">A'</text>
  <rect class="blue" x="160" y="218" width="70" height="30" rx="4"/>
  <text class="mono b" x="195.0" y="237.5" text-anchor="middle" xml:space="preserve">C'</text>
  <rect class="blue" x="260" y="218" width="70" height="30" rx="4"/>
  <text class="mono b" x="295.0" y="237.5" text-anchor="middle" xml:space="preserve">F'</text>
  <line class="ln" x1="130" y1="233" x2="158" y2="233" marker-end="url(#gc-copy-a)"/>
  <line class="ln" x1="230" y1="233" x2="258" y2="233" marker-end="url(#gc-copy-a)"/>
  <polyline class="ln" points="295,248 295,266 95,266 95,250" marker-end="url(#gc-copy-a)"/>
  <rect class="dead" x="330" y="218" width="300" height="30" rx="4"/>
  <text class="sm" x="480.0" y="237.0" text-anchor="middle" xml:space="preserve">连续的空闲空间…</text>
  <line class="ln-acc" x1="330" y1="300" x2="330" y2="252" marker-end="url(#gc-copy-acc)"/>
  <text class="mono sm b acc-t" x="338" y="300" xml:space="preserve">堆指针</text>
  <line class="ln-dash" x1="118" y1="70" x2="118" y2="216" marker-end="url(#gc-copy-acc)"/>
  <line class="ln-dash" x1="230" y1="70" x2="205" y2="216" marker-end="url(#gc-copy-acc)"/>
  <line class="ln-dash" x1="350" y1="70" x2="310" y2="216" marker-end="url(#gc-copy-acc)"/>
  <text class="sm acc-t" x="400" y="118" xml:space="preserve">虚线 = 旧对象中的转发指针（记录新地址）</text>
  <text class="sm muted" x="400" y="138" xml:space="preserve">下方的 F → A 在复制后改为 F′ → A′</text>
  <text class="sm muted" x="0" y="324" xml:space="preserve">B、D、E 无需扫描或复制，回收成本主要随存活对象数增长（课件第 76 页）。</text>
</svg>
