<svg xmlns="http://www.w3.org/2000/svg" width="932" height="252" viewBox="-16 -16 932 252" role="img" aria-label="堆被分为两个半空间，分配时将堆指针推进一个对象的大小">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="932" height="252" rx="14" fill="#F0EEE6"/>
  <defs><marker id="gc-semispace-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-semispace-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-semispace-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">堆内存分成两半</text>
  <rect class="box" x="0" y="28" width="440" height="110" rx="4"/>
  <rect class="ghost" x="440" y="28" width="440" height="110" rx="4"/>
  <text class="b" x="220" y="50" text-anchor="middle" xml:space="preserve">当前分配区（Old Space）</text>
  <text class="b" x="660" y="50" text-anchor="middle" xml:space="preserve">备用区（New Space）</text>
  <rect class="blue" x="14" y="68" width="46" height="40" rx="4"/>
  <text class="mono b" x="37.0" y="92.5" text-anchor="middle" xml:space="preserve">A</text>
  <rect class="blue" x="64" y="68" width="46" height="40" rx="4"/>
  <text class="mono b" x="87.0" y="92.5" text-anchor="middle" xml:space="preserve">B</text>
  <rect class="blue" x="114" y="68" width="46" height="40" rx="4"/>
  <text class="mono b" x="137.0" y="92.5" text-anchor="middle" xml:space="preserve">C</text>
  <rect class="blue" x="164" y="68" width="46" height="40" rx="4"/>
  <text class="mono b" x="187.0" y="92.5" text-anchor="middle" xml:space="preserve">D</text>
  <rect class="blue" x="214" y="68" width="46" height="40" rx="4"/>
  <text class="mono b" x="237.0" y="92.5" text-anchor="middle" xml:space="preserve">E</text>
  <text class="mono b" x="272" y="93" xml:space="preserve">...</text>
  <rect class="dead" x="300" y="68" width="126" height="40" rx="4"/>
  <text class="sm" x="363.0" y="92.0" text-anchor="middle" xml:space="preserve">尚未分配</text>
  <text class="muted" x="660" y="93" text-anchor="middle" xml:space="preserve">（空）</text>
  <line class="ln-acc" x1="298" y1="172" x2="298" y2="112" marker-end="url(#gc-semispace-acc)"/>
  <text class="mono sm b acc-t" x="306" y="170" xml:space="preserve">堆指针</text>
  <text class="sm muted" x="306" y="188" xml:space="preserve">分配：指针向右移动 size 字节</text>
  <text class="sm muted" x="0" y="214" xml:space="preserve">指针左侧已使用，右侧全部空闲，可以直接分配（课件第 53 页）。</text>
</svg>
