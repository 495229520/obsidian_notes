<svg xmlns="http://www.w3.org/2000/svg" width="932" height="282" viewBox="-16 -16 932 282" role="img" aria-label="A、C、E 从根集合可达，B 和 D 互相引用且从根不可达">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="932" height="282" rx="14" fill="#F0EEE6"/>
  <defs><marker id="gc-reach-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-reach-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gc-reach-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="acc" x="0" y="0" width="330" height="40" rx="6"/>
  <text class="b" x="165.0" y="24.5" text-anchor="middle" xml:space="preserve">根集合（栈变量、寄存器、全局指针）</text>
  <line class="ln-acc" x1="60" y1="40" x2="60" y2="84" marker-end="url(#gc-reach-acc)"/>
  <rect class="blue" x="20" y="86" width="90" height="34" rx="5"/>
  <text class="b" x="65.0" y="107.5" text-anchor="middle" xml:space="preserve">对象 A</text>
  <rect class="blue" x="230" y="86" width="90" height="34" rx="5"/>
  <text class="b" x="275.0" y="107.5" text-anchor="middle" xml:space="preserve">对象 C</text>
  <rect class="blue" x="440" y="86" width="90" height="34" rx="5"/>
  <text class="b" x="485.0" y="107.5" text-anchor="middle" xml:space="preserve">对象 E</text>
  <line class="ln-blue" x1="110" y1="103" x2="228" y2="103" marker-end="url(#gc-reach-blue)"/>
  <line class="ln-blue" x1="320" y1="103" x2="438" y2="103" marker-end="url(#gc-reach-blue)"/>
  <text class="sm blue-t" x="550" y="108" xml:space="preserve">（可达对象，必须保留）</text>
  <rect class="ghost" x="20" y="170" width="90" height="34" rx="5"/>
  <text class="b muted" x="65.0" y="191.5" text-anchor="middle" xml:space="preserve">对象 B</text>
  <rect class="ghost" x="230" y="170" width="90" height="34" rx="5"/>
  <text class="b muted" x="275.0" y="191.5" text-anchor="middle" xml:space="preserve">对象 D</text>
  <line class="ln" x1="110" y1="180" x2="228" y2="180" marker-end="url(#gc-reach-a)"/>
  <line class="ln" x1="228" y1="194" x2="112" y2="194" marker-end="url(#gc-reach-a)"/>
  <text class="sm muted" x="340" y="192" xml:space="preserve">（从根不可达，两个对象均可回收）</text>
  <text class="sm muted" x="0" y="240" xml:space="preserve">B 指向 D，但 B 本身从根不可达。D 仍可回收（课件第 21 页）。</text>
</svg>
