<svg xmlns="http://www.w3.org/2000/svg" width="972" height="362" viewBox="-16 -16 972 362" role="img" aria-label="k = 4 时依序简化并逆序恢复节点，为各节点选择颜色（课件第 28–40 页）">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', 'SimHei', monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .green { fill: #E0EBDB; stroke: #5E8A5A; stroke-width: 1.4; }
    .green-t { fill: #47703F; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-green { stroke: #5E8A5A; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="-16" y="-16" width="972" height="362" rx="14" fill="#F0EEE6"/>
  <defs><marker id="ra-simplify-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ra-simplify-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ra-simplify-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">① 简化：移除度数小于 4 的节点并压栈</text>
  <text class="sm b muted" x="0" y="42" xml:space="preserve">移除节点</text>
  <text class="sm b muted" x="90" y="42" xml:space="preserve">移除前的各节点度数</text>
  <text class="sm b muted" x="330" y="42" xml:space="preserve">栈（右端为栈顶）</text>
  <rect class="blue" x="5.0" y="51.0" width="30" height="22" rx="6"/>
  <text class="mono" x="20" y="66.5" text-anchor="middle" xml:space="preserve">a</text>
  <text class="mono sm" x="90" y="66" xml:space="preserve"><tspan class="b blue-t">a2</tspan>  b3  c5  d3  e4  f5</text>
  <text class="mono sm" x="330" y="66" xml:space="preserve">a</text>
  <rect class="blue" x="5.0" y="81.0" width="30" height="22" rx="6"/>
  <text class="mono" x="20" y="96.5" text-anchor="middle" xml:space="preserve">d</text>
  <text class="mono sm" x="90" y="96" xml:space="preserve">b3  c4  <tspan class="b blue-t">d3</tspan>  e4  f4</text>
  <text class="mono sm" x="330" y="96" xml:space="preserve">a d</text>
  <rect class="blue" x="5.0" y="111.0" width="30" height="22" rx="6"/>
  <text class="mono" x="20" y="126.5" text-anchor="middle" xml:space="preserve">c</text>
  <text class="mono sm" x="90" y="126" xml:space="preserve">b3  <tspan class="b blue-t">c3</tspan>  e3  f3</text>
  <text class="mono sm" x="330" y="126" xml:space="preserve">a d c</text>
  <rect class="blue" x="5.0" y="141.0" width="30" height="22" rx="6"/>
  <text class="mono" x="20" y="156.5" text-anchor="middle" xml:space="preserve">b</text>
  <text class="mono sm" x="90" y="156" xml:space="preserve"><tspan class="b blue-t">b2</tspan>  e2  f2</text>
  <text class="mono sm" x="330" y="156" xml:space="preserve">a d c b</text>
  <rect class="blue" x="5.0" y="171.0" width="30" height="22" rx="6"/>
  <text class="mono" x="20" y="186.5" text-anchor="middle" xml:space="preserve">e</text>
  <text class="mono sm" x="90" y="186" xml:space="preserve"><tspan class="b blue-t">e1</tspan>  f1</text>
  <text class="mono sm" x="330" y="186" xml:space="preserve">a d c b e</text>
  <rect class="blue" x="5.0" y="201.0" width="30" height="22" rx="6"/>
  <text class="mono" x="20" y="216.5" text-anchor="middle" xml:space="preserve">f</text>
  <text class="mono sm" x="90" y="216" xml:space="preserve"><tspan class="b blue-t">f0</tspan></text>
  <text class="mono sm" x="330" y="216" xml:space="preserve">a d c b e f</text>
  <text class="sm muted" x="0" y="262" xml:space="preserve">c 和 f 初始度数为 5，移除邻居后度数才下降</text>
  <line class="ln-muted" x1="480" y1="0" x2="480" y2="300"/>
  <text class="b" x="500" y="14" xml:space="preserve">② 选择：从栈顶弹出，避开邻居已用的颜色</text>
  <text class="sm b muted" x="500" y="42" xml:space="preserve">弹出节点</text>
  <text class="sm b muted" x="570" y="42" xml:space="preserve">已着色的邻居</text>
  <text class="sm b muted" x="800" y="42" xml:space="preserve">所选颜色</text>
  <rect class="acc" x="505.0" y="51.0" width="30" height="22" rx="6"/>
  <text class="mono" x="520" y="66.5" text-anchor="middle" xml:space="preserve">f</text>
  <text class="mono sm" x="570" y="66" xml:space="preserve">无</text>
  <text class="mono sm b acc-t" x="800" y="66" xml:space="preserve">r1</text>
  <rect class="blue" x="505.0" y="81.0" width="30" height="22" rx="6"/>
  <text class="mono" x="520" y="96.5" text-anchor="middle" xml:space="preserve">e</text>
  <text class="mono sm" x="570" y="96" xml:space="preserve">f=r1</text>
  <text class="mono sm b blue-t" x="800" y="96" xml:space="preserve">r2</text>
  <rect class="green" x="505.0" y="111.0" width="30" height="22" rx="6"/>
  <text class="mono" x="520" y="126.5" text-anchor="middle" xml:space="preserve">b</text>
  <text class="mono sm" x="570" y="126" xml:space="preserve">e=r2, f=r1</text>
  <text class="mono sm b green-t" x="800" y="126" xml:space="preserve">r3</text>
  <rect class="dead" x="505.0" y="141.0" width="30" height="22" rx="6"/>
  <text class="mono" x="520" y="156.5" text-anchor="middle" xml:space="preserve">c</text>
  <text class="mono sm" x="570" y="156" xml:space="preserve">b=r3, e=r2, f=r1</text>
  <text class="mono sm b muted" x="800" y="156" xml:space="preserve">r4</text>
  <rect class="green" x="505.0" y="171.0" width="30" height="22" rx="6"/>
  <text class="mono" x="520" y="186.5" text-anchor="middle" xml:space="preserve">d</text>
  <text class="mono sm" x="570" y="186" xml:space="preserve">c=r4, e=r2, f=r1</text>
  <text class="mono sm b green-t" x="800" y="186" xml:space="preserve">r3</text>
  <rect class="blue" x="505.0" y="201.0" width="30" height="22" rx="6"/>
  <text class="mono" x="520" y="216.5" text-anchor="middle" xml:space="preserve">a</text>
  <text class="mono sm" x="570" y="216" xml:space="preserve">c=r4, f=r1</text>
  <text class="mono sm b blue-t" x="800" y="216" xml:space="preserve">r2</text>
  <text class="sm muted" x="500" y="262" xml:space="preserve">移除时的邻居少于 4 个，恢复时至少还剩一种颜色</text>
  <text class="sm muted" x="500" y="284" xml:space="preserve">d 与 b 不相邻，可以共用 r3（课件第 39 页）</text>
  <text class="sm muted" x="0" y="318" xml:space="preserve">a=r2、b=r3、c=r4、d=r3、e=r2、f=r1，与干涉图一致。课件第 23 页的改写在 2000 次随机执行中都得到相同的 b。</text>
</svg>
