<svg xmlns="http://www.w3.org/2000/svg" width="972" height="318" viewBox="-16 -16 972 318" role="img" aria-label="在 x = 1 下对 (x ← x + 10) + x 求值。Cool 规则规定先在 S 中求值 e₁、在 S₁ 中求值 e₂，因此 e₁ 将 x 改为 11 后 e₂ 读出 11，最终加法结果为 22。假若按从右向左的假想规则，e₂ 先读出 1，随后 e₁ 改写为 11，结果为 12。推理规则中存储传递的方向决定了求值顺序。">
  <style>
    text { fill: #141413; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="972" height="318" rx="14" fill="#F0EEE6"/>
  <defs><marker id="os-add-order-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-add-order-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-add-order-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="18" xml:space="preserve">(x ← x + 10) + x, 初始 x = 1</text>
  <text class="mono sm muted" x="0" y="38" xml:space="preserve">e₁ = (x ← x + 10), e₂ = x</text>
  <text class="sm b acc-t" x="0" y="62" xml:space="preserve">Cool 规则: 先在 S 中求值 e₁，再在 S₁ 中求值 e₂ (从左到右)</text>
  <rect class="blue" x="0.0" y="83.0" width="86" height="30" rx="6"/>
  <text class="mono sm" x="43.0" y="102.5" text-anchor="middle" xml:space="preserve">S: x = 1</text>
  <line class="ln" x1="90" y1="98" x2="112" y2="98" marker-end="url(#os-add-order-a)"/>
  <rect class="box" x="116" y="78" width="172" height="40" rx="8"/>
  <text class="mono sm b" x="202.0" y="95.0" text-anchor="middle" xml:space="preserve">e₁: x ← x + 10</text>
  <text class="mono sm muted" x="202.0" y="110.0" text-anchor="middle" xml:space="preserve">v₁ = 11</text>
  <line class="ln" x1="292" y1="98" x2="314" y2="98" marker-end="url(#os-add-order-a)"/>
  <rect class="acc" x="318.0" y="83.0" width="86" height="30" rx="6"/>
  <text class="mono sm" x="361.0" y="102.5" text-anchor="middle" xml:space="preserve">S₁: x = 11</text>
  <line class="ln" x1="408" y1="98" x2="430" y2="98" marker-end="url(#os-add-order-a)"/>
  <rect class="box" x="434" y="78" width="172" height="40" rx="8"/>
  <text class="mono sm b" x="520.0" y="95.0" text-anchor="middle" xml:space="preserve">e₂: x</text>
  <text class="mono sm muted" x="520.0" y="110.0" text-anchor="middle" xml:space="preserve">v₂ = 11</text>
  <line class="ln" x1="610" y1="98" x2="632" y2="98" marker-end="url(#os-add-order-a)"/>
  <rect class="acc" x="636.0" y="83.0" width="86" height="30" rx="6"/>
  <text class="mono sm" x="679.0" y="102.5" text-anchor="middle" xml:space="preserve">S₂: x = 11</text>
  <line class="ln" x1="726" y1="98" x2="748" y2="98" marker-end="url(#os-add-order-a)"/>
  <rect class="acc" x="752.0" y="81.0" width="80" height="34" rx="6"/>
  <text class="mono b" x="792" y="102.5" text-anchor="middle" xml:space="preserve">22</text>
  <text class="sm b muted" x="0" y="156" xml:space="preserve">假想规则: 先在 S 中求值 e₂，再在其结果中求值 e₁ (从右到左)</text>
  <rect class="blue" x="0.0" y="177.0" width="86" height="30" rx="6"/>
  <text class="mono sm" x="43.0" y="196.5" text-anchor="middle" xml:space="preserve">S: x = 1</text>
  <line class="ln" x1="90" y1="192" x2="112" y2="192" marker-end="url(#os-add-order-a)"/>
  <rect class="box" x="116" y="172" width="172" height="40" rx="8"/>
  <text class="mono sm b" x="202.0" y="189.0" text-anchor="middle" xml:space="preserve">e₂: x</text>
  <text class="mono sm muted" x="202.0" y="204.0" text-anchor="middle" xml:space="preserve">v₂ = 1</text>
  <line class="ln" x1="292" y1="192" x2="314" y2="192" marker-end="url(#os-add-order-a)"/>
  <rect class="blue" x="318.0" y="177.0" width="86" height="30" rx="6"/>
  <text class="mono sm" x="361.0" y="196.5" text-anchor="middle" xml:space="preserve">x = 1</text>
  <line class="ln" x1="408" y1="192" x2="430" y2="192" marker-end="url(#os-add-order-a)"/>
  <rect class="box" x="434" y="172" width="172" height="40" rx="8"/>
  <text class="mono sm b" x="520.0" y="189.0" text-anchor="middle" xml:space="preserve">e₁: x ← x + 10</text>
  <text class="mono sm muted" x="520.0" y="204.0" text-anchor="middle" xml:space="preserve">v₁ = 11</text>
  <line class="ln" x1="610" y1="192" x2="632" y2="192" marker-end="url(#os-add-order-a)"/>
  <rect class="acc" x="636.0" y="177.0" width="86" height="30" rx="6"/>
  <text class="mono sm" x="679.0" y="196.5" text-anchor="middle" xml:space="preserve">x = 11</text>
  <line class="ln" x1="726" y1="192" x2="748" y2="192" marker-end="url(#os-add-order-a)"/>
  <rect class="plain" x="752.0" y="175.0" width="80" height="34" rx="6"/>
  <text class="mono b" x="792" y="196.5" text-anchor="middle" xml:space="preserve">12</text>
  <line class="ln-muted" x1="0" y1="232" x2="940" y2="232"/>
  <text class="sm" x="0" y="256" xml:space="preserve">同一个表达式因求值顺序不同可能得到 22 或 12。推理规则中存储按 S → S₁ → S₂ 传递的方向严格规定了求值顺序（Slide 31）。</text>
  <text class="sm muted" x="0" y="278" xml:space="preserve">解释器实测：按规则计算得 22，颠倒顺序的变体得 12。若调换操作数为 x + (x ← x + 10)，按规则计算得 1 + 11 = 12。</text>
</svg>
