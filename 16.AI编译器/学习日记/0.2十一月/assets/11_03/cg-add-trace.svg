<svg xmlns="http://www.w3.org/2000/svg" width="1042" height="532" viewBox="-16 -16 1042 532" role="img" aria-label="cgen(e1 + e2) 的编译期展开与运行期状态。编译期由 cgen(e1) 和 cgen(e2) 嵌入代码，运行期由 sw 和 addiu 将 val(e1) 压入栈。即使 cgen(e2) 覆盖了 $a0，val(e1) 依然留在 $sp + 4。最后用 lw $t1 4($sp)、add $a0 $t1 $a0、addiu $sp $sp 4 完成相加并把 $sp 恢复到进入前的状态。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .band { fill: none; stroke: #D97757; stroke-width: 1.6; stroke-dasharray: 5 3; }
  </style>
  <rect x="-16" y="-16" width="1042" height="532" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="cg-add-trace-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-add-trace-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-add-trace-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="62" y="16" xml:space="preserve">编译期规则 cgen(e1 + e2)</text>
  <text class="b" x="346" y="16" xml:space="preserve">运行期状态（$a0、$t1 与栈的变化）</text>
  <text class="mono sm b" x="730" y="16" text-anchor="middle" xml:space="preserve">$a0</text>
  <text class="mono sm b" x="820" y="16" text-anchor="middle" xml:space="preserve">$t1</text>
  <text class="sm b" x="938" y="16" text-anchor="middle" xml:space="preserve">栈</text>
  <text class="sm muted" x="346" y="34" xml:space="preserve">v1 = val(e1)，v2 = val(e2)，S = 进入时的 $sp</text>
  <line class="ln-muted" x1="0" y1="44" x2="1010" y2="44"/>
  <rect class="acc" x="62.0" y="69.0" width="90" height="24" rx="6"/>
  <text class="sm" x="107" y="85.5" text-anchor="middle" xml:space="preserve">编译期</text>
  <text class="mono acc-t b" x="164" y="85" xml:space="preserve">cgen(e1)</text>
  <line class="ln" x1="300" y1="81" x2="336" y2="81" marker-end="url(#cg-add-trace-a)"/>
  <text class="sm" x="346" y="85" xml:space="preserve">$a0 = val(e1)，栈和 $sp 都不变</text>
  <rect class="acc" x="690.0" y="68.0" width="80" height="26" rx="6"/>
  <text class="mono sm" x="730" y="85.5" text-anchor="middle" xml:space="preserve">v1</text>
  <rect class="box" x="785.0" y="68.0" width="70" height="26" rx="6"/>
  <text class="mono sm" x="820" y="85.5" text-anchor="middle" xml:space="preserve">?</text>
  <rect class="ghost" x="914" y="61" width="56" height="20" rx="3"/>
  <text class="mono sm muted" x="974" y="75" xml:space="preserve">S</text>
  <rect class="ghost" x="914" y="81" width="56" height="20" rx="3"/>
  <text class="mono sm muted" x="974" y="95" xml:space="preserve">S−4</text>
  <text class="mono sm b" x="894" y="75" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln" x1="896" y1="71" x2="912" y2="71" marker-end="url(#cg-add-trace-a)"/>
  <rect class="blue" x="62.0" y="125.0" width="90" height="24" rx="6"/>
  <text class="sm" x="107" y="141.5" text-anchor="middle" xml:space="preserve">运行期</text>
  <text class="mono" x="164" y="141" xml:space="preserve">sw $a0 0($sp)</text>
  <line class="ln" x1="300" y1="137" x2="336" y2="137" marker-end="url(#cg-add-trace-a)"/>
  <text class="sm" x="346" y="141" xml:space="preserve">把 val(e1) 写入 $sp 指向的空闲槽位</text>
  <rect class="box" x="690.0" y="124.0" width="80" height="26" rx="6"/>
  <text class="mono sm" x="730" y="141.5" text-anchor="middle" xml:space="preserve">v1</text>
  <rect class="box" x="785.0" y="124.0" width="70" height="26" rx="6"/>
  <text class="mono sm" x="820" y="141.5" text-anchor="middle" xml:space="preserve">?</text>
  <rect class="acc" x="914" y="117" width="56" height="20" rx="3"/>
  <text class="mono sm" x="942.0" y="131.0" text-anchor="middle" xml:space="preserve">v1</text>
  <text class="mono sm muted" x="974" y="131" xml:space="preserve">S</text>
  <rect class="ghost" x="914" y="137" width="56" height="20" rx="3"/>
  <text class="mono sm muted" x="974" y="151" xml:space="preserve">S−4</text>
  <text class="mono sm b" x="894" y="131" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln" x1="896" y1="127" x2="912" y2="127" marker-end="url(#cg-add-trace-a)"/>
  <rect class="blue" x="62.0" y="181.0" width="90" height="24" rx="6"/>
  <text class="sm" x="107" y="197.5" text-anchor="middle" xml:space="preserve">运行期</text>
  <text class="mono" x="164" y="197" xml:space="preserve">addiu $sp $sp -4</text>
  <line class="ln" x1="300" y1="193" x2="336" y2="193" marker-end="url(#cg-add-trace-a)"/>
  <text class="sm" x="346" y="197" xml:space="preserve">$sp 下移 4 字节，val(e1) 落在 $sp+4</text>
  <rect class="box" x="690.0" y="180.0" width="80" height="26" rx="6"/>
  <text class="mono sm" x="730" y="197.5" text-anchor="middle" xml:space="preserve">v1</text>
  <rect class="box" x="785.0" y="180.0" width="70" height="26" rx="6"/>
  <text class="mono sm" x="820" y="197.5" text-anchor="middle" xml:space="preserve">?</text>
  <rect class="plain" x="914" y="173" width="56" height="20" rx="3"/>
  <text class="mono sm" x="942.0" y="187.0" text-anchor="middle" xml:space="preserve">v1</text>
  <text class="mono sm muted" x="974" y="187" xml:space="preserve">S</text>
  <rect class="ghost" x="914" y="193" width="56" height="20" rx="3"/>
  <text class="mono sm muted" x="974" y="207" xml:space="preserve">S−4</text>
  <text class="mono sm b acc-t" x="894" y="207" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln-acc" x1="896" y1="203" x2="912" y2="203" marker-end="url(#cg-add-trace-acc)"/>
  <rect class="acc" x="62.0" y="237.0" width="90" height="24" rx="6"/>
  <text class="sm" x="107" y="253.5" text-anchor="middle" xml:space="preserve">编译期</text>
  <text class="mono acc-t b" x="164" y="253" xml:space="preserve">cgen(e2)</text>
  <line class="ln" x1="300" y1="249" x2="336" y2="249" marker-end="url(#cg-add-trace-a)"/>
  <text class="sm" x="346" y="253" xml:space="preserve">$a0 = val(e2)，val(e1) 留在 $sp+4</text>
  <rect class="acc" x="690.0" y="236.0" width="80" height="26" rx="6"/>
  <text class="mono sm" x="730" y="253.5" text-anchor="middle" xml:space="preserve">v2</text>
  <rect class="box" x="785.0" y="236.0" width="70" height="26" rx="6"/>
  <text class="mono sm" x="820" y="253.5" text-anchor="middle" xml:space="preserve">?</text>
  <rect class="plain" x="914" y="229" width="56" height="20" rx="3"/>
  <text class="mono sm" x="942.0" y="243.0" text-anchor="middle" xml:space="preserve">v1</text>
  <text class="mono sm muted" x="974" y="243" xml:space="preserve">S</text>
  <rect class="ghost" x="914" y="249" width="56" height="20" rx="3"/>
  <text class="mono sm muted" x="974" y="263" xml:space="preserve">S−4</text>
  <text class="mono sm b" x="894" y="263" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln" x1="896" y1="259" x2="912" y2="259" marker-end="url(#cg-add-trace-a)"/>
  <rect class="blue" x="62.0" y="327.0" width="90" height="24" rx="6"/>
  <text class="sm" x="107" y="343.5" text-anchor="middle" xml:space="preserve">运行期</text>
  <text class="mono" x="164" y="343" xml:space="preserve">lw $t1 4($sp)</text>
  <line class="ln" x1="300" y1="339" x2="336" y2="339" marker-end="url(#cg-add-trace-a)"/>
  <text class="sm" x="346" y="343" xml:space="preserve">从栈顶读出 val(e1) 放进临时寄存器 $t1</text>
  <rect class="box" x="690.0" y="326.0" width="80" height="26" rx="6"/>
  <text class="mono sm" x="730" y="343.5" text-anchor="middle" xml:space="preserve">v2</text>
  <rect class="acc" x="785.0" y="326.0" width="70" height="26" rx="6"/>
  <text class="mono sm" x="820" y="343.5" text-anchor="middle" xml:space="preserve">v1</text>
  <rect class="plain" x="914" y="319" width="56" height="20" rx="3"/>
  <text class="mono sm" x="942.0" y="333.0" text-anchor="middle" xml:space="preserve">v1</text>
  <text class="mono sm muted" x="974" y="333" xml:space="preserve">S</text>
  <rect class="ghost" x="914" y="339" width="56" height="20" rx="3"/>
  <text class="mono sm muted" x="974" y="353" xml:space="preserve">S−4</text>
  <text class="mono sm b" x="894" y="353" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln" x1="896" y1="349" x2="912" y2="349" marker-end="url(#cg-add-trace-a)"/>
  <rect class="blue" x="62.0" y="383.0" width="90" height="24" rx="6"/>
  <text class="sm" x="107" y="399.5" text-anchor="middle" xml:space="preserve">运行期</text>
  <text class="mono" x="164" y="399" xml:space="preserve">add $a0 $t1 $a0</text>
  <line class="ln" x1="300" y1="395" x2="336" y2="395" marker-end="url(#cg-add-trace-a)"/>
  <text class="sm" x="346" y="399" xml:space="preserve">$a0 = val(e1) + val(e2)</text>
  <rect class="acc" x="690.0" y="382.0" width="80" height="26" rx="6"/>
  <text class="mono sm" x="730" y="399.5" text-anchor="middle" xml:space="preserve">v1+v2</text>
  <rect class="box" x="785.0" y="382.0" width="70" height="26" rx="6"/>
  <text class="mono sm" x="820" y="399.5" text-anchor="middle" xml:space="preserve">v1</text>
  <rect class="plain" x="914" y="375" width="56" height="20" rx="3"/>
  <text class="mono sm" x="942.0" y="389.0" text-anchor="middle" xml:space="preserve">v1</text>
  <text class="mono sm muted" x="974" y="389" xml:space="preserve">S</text>
  <rect class="ghost" x="914" y="395" width="56" height="20" rx="3"/>
  <text class="mono sm muted" x="974" y="409" xml:space="preserve">S−4</text>
  <text class="mono sm b" x="894" y="409" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln" x1="896" y1="405" x2="912" y2="405" marker-end="url(#cg-add-trace-a)"/>
  <rect class="blue" x="62.0" y="439.0" width="90" height="24" rx="6"/>
  <text class="sm" x="107" y="455.5" text-anchor="middle" xml:space="preserve">运行期</text>
  <text class="mono" x="164" y="455" xml:space="preserve">addiu $sp $sp 4</text>
  <line class="ln" x1="300" y1="451" x2="336" y2="451" marker-end="url(#cg-add-trace-a)"/>
  <text class="sm" x="346" y="455" xml:space="preserve">$sp 上移 4 字节，恢复进入前的栈状态</text>
  <rect class="box" x="690.0" y="438.0" width="80" height="26" rx="6"/>
  <text class="mono sm" x="730" y="455.5" text-anchor="middle" xml:space="preserve">v1+v2</text>
  <rect class="box" x="785.0" y="438.0" width="70" height="26" rx="6"/>
  <text class="mono sm" x="820" y="455.5" text-anchor="middle" xml:space="preserve">v1</text>
  <rect class="dead" x="914" y="431" width="56" height="20" rx="3"/>
  <text class="mono sm muted" x="942.0" y="445.0" text-anchor="middle" xml:space="preserve">v1</text>
  <text class="mono sm muted" x="974" y="445" xml:space="preserve">S</text>
  <rect class="ghost" x="914" y="451" width="56" height="20" rx="3"/>
  <text class="mono sm muted" x="974" y="465" xml:space="preserve">S−4</text>
  <text class="mono sm b acc-t" x="894" y="445" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln-acc" x1="896" y1="441" x2="912" y2="441" marker-end="url(#cg-add-trace-acc)"/>
  <polyline class="ln-acc" points="56,114 50,114 50,216 56,216"/>
  <text class="sm b acc-t" x="44" y="161.0" text-anchor="end" xml:space="preserve">压栈</text>
  <text class="sm muted" x="44" y="177.0" text-anchor="end" xml:space="preserve">(红括号)</text>
  <line class="ln-muted" x1="0" y1="286" x2="1010" y2="286"/>
  <text class="sm muted" x="62" y="306" xml:space="preserve">(补全收尾：取出左值相加并恢复 $sp)</text>
  <polyline class="ln" points="56,316 50,316 50,474 56,474"/>
  <text class="sm b" x="44" y="399.0" text-anchor="end" xml:space="preserve">出栈</text>
  <rect class="acc" x="62" y="486" width="18" height="12" rx="3"/>
  <text class="sm" x="86" y="496" xml:space="preserve">该行改变的值</text>
  <rect class="dead" x="184" y="486" width="18" height="12" rx="3"/>
  <text class="sm" x="208" y="496" xml:space="preserve">移出 $sp 范围后作废的值</text>
  <rect class="ghost" x="372" y="486" width="18" height="12" rx="3"/>
  <text class="sm" x="396" y="496" xml:space="preserve">空闲槽位</text>
  <text class="sm muted" x="1010" y="496" text-anchor="end" xml:space="preserve">栈槽位按高地址在上排列</text>
</svg>
