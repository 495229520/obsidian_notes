<svg xmlns="http://www.w3.org/2000/svg" width="932" height="294" viewBox="-16 -16 932 294" role="img" aria-label="类 A、B、C 对象的属性内存布局。三个对象中 a 和 d 位于相同偏移处，因此 A 的方法可以直接在 B 和 C 对象上运行。子类新增的 b 和 c 接在父类属性后面；b 和 c 虽然占同一偏移位置，但 B 与 C 互不为子类，不会冲突。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .band { fill: none; stroke: #D97757; stroke-width: 1.6; stroke-dasharray: 5 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="294" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="cg-object-layout-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-object-layout-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-object-layout-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="sm b" x="0" y="22" xml:space="preserve">字段偏移</text>
  <rect class="band" x="100" y="34" width="440" height="52" rx="6"/>
  <text class="sm b" x="170" y="22" text-anchor="middle" xml:space="preserve">Class A 对象</text>
  <rect class="acc" x="110" y="40" width="120" height="40" rx="3"/>
  <text class="mono b" x="170.0" y="64.0" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="plain" x="110" y="80" width="120" height="40" rx="3"/>
  <text class="mono b" x="170.0" y="104.0" text-anchor="middle" xml:space="preserve">d</text>
  <text class="sm b" x="320" y="22" text-anchor="middle" xml:space="preserve">Class B 对象</text>
  <rect class="acc" x="260" y="40" width="120" height="40" rx="3"/>
  <text class="mono b" x="320.0" y="64.0" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="plain" x="260" y="80" width="120" height="40" rx="3"/>
  <text class="mono b" x="320.0" y="104.0" text-anchor="middle" xml:space="preserve">d</text>
  <rect class="blue" x="260" y="120" width="120" height="40" rx="3"/>
  <text class="mono b" x="320.0" y="144.0" text-anchor="middle" xml:space="preserve">b</text>
  <text class="sm b" x="470" y="22" text-anchor="middle" xml:space="preserve">Class C 对象</text>
  <rect class="acc" x="410" y="40" width="120" height="40" rx="3"/>
  <text class="mono b" x="470.0" y="64.0" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="plain" x="410" y="80" width="120" height="40" rx="3"/>
  <text class="mono b" x="470.0" y="104.0" text-anchor="middle" xml:space="preserve">d</text>
  <rect class="blue" x="410" y="120" width="120" height="40" rx="3"/>
  <text class="mono b" x="470.0" y="144.0" text-anchor="middle" xml:space="preserve">c</text>
  <text class="mono sm" x="0" y="65" xml:space="preserve">off(a)</text>
  <text class="mono sm" x="0" y="105" xml:space="preserve">off(d)</text>
  <line class="ln-acc" x1="590" y1="60" x2="546" y2="60" marker-end="url(#cg-object-layout-acc)"/>
  <text class="sm acc-t b" x="598" y="56" xml:space="preserve">偏移相同，A 的方法</text>
  <text class="sm acc-t b" x="598" y="74" xml:space="preserve">可直接访问</text>
  <line class="ln-blue" x1="590" y1="140" x2="536" y2="140" marker-end="url(#cg-object-layout-blue)"/>
  <text class="sm blue-t b" x="598" y="136" xml:space="preserve">子类新增属性</text>
  <text class="sm blue-t b" x="598" y="154" xml:space="preserve">排在末尾</text>
  <line class="ln-muted" x1="0" y1="186" x2="900" y2="186"/>
  <text class="sm" x="0" y="210" xml:space="preserve">A::f() 的机器码只做“从 self + off(a) 读取，加上 self + off(d)，写回 self + off(a)”。无论对象是 A、B 还是 C，该地址上都正好是 a 和 d。</text>
  <text class="sm muted" x="0" y="232" xml:space="preserve">b 和 c 共用第三个槽位，但 B 的方法不会接到 C 对象（B 与 C 互不为子类），所以不会冲突。</text>
  <text class="sm muted" x="0" y="254" xml:space="preserve">实际实现会在最前面放对象头（Cool：类标签、大小、分派指针；C++：vptr），因此 off(a) 不为 0，详见下文补充的实测值。</text>
</svg>
