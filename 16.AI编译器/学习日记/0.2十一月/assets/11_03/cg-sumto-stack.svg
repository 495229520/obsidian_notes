<svg xmlns="http://www.w3.org/2000/svg" width="932" height="456" viewBox="-16 -16 932 456" role="img" aria-label="sumto(2) 递归到最深一刻的栈状态，此时 sumto(0) 刚到达 true1。高地址在上。每次调用的 AR 包含 old fp、x、RA 三个槽位，AR 之间夹着加法的左操作数 x 作为中间值。old fp 指向调用方的 RA 槽位，当前 $fp 指向 sumto(0) 的 RA 槽位，$sp 指向其下方的空闲槽位。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .band { fill: none; stroke: #D97757; stroke-width: 1.6; stroke-dasharray: 5 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="456" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="cg-sumto-stack-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-sumto-stack-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-sumto-stack-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="18" xml:space="preserve">sumto(2) 递归到最深的一刻（sumto(0) 刚到达 true1）</text>
  <text class="sm muted" x="0" y="38" xml:space="preserve">S = main 调用 sumto(2) 前的 $sp，高地址在上</text>
  <rect class="plain" x="260" y="56" width="230" height="26" rx="3"/>
  <text class="mono sm" x="272" y="73.5" xml:space="preserve">old fp = S</text>
  <text class="mono sm muted" x="480" y="73.5" text-anchor="end" xml:space="preserve">S</text>
  <rect class="plain" x="260" y="82" width="230" height="26" rx="3"/>
  <text class="mono sm" x="272" y="99.5" xml:space="preserve">x = 2</text>
  <text class="mono sm muted" x="480" y="99.5" text-anchor="end" xml:space="preserve">S−4</text>
  <rect class="plain" x="260" y="108" width="230" height="26" rx="3"/>
  <text class="mono sm" x="272" y="125.5" xml:space="preserve">RA (返回 main)</text>
  <text class="mono sm muted" x="480" y="125.5" text-anchor="end" xml:space="preserve">S−8</text>
  <rect class="acc" x="260" y="134" width="230" height="26" rx="3"/>
  <text class="mono sm b acc-t" x="272" y="151.5" xml:space="preserve">2</text>
  <text class="mono sm muted" x="480" y="151.5" text-anchor="end" xml:space="preserve">S−12</text>
  <rect class="plain" x="260" y="160" width="230" height="26" rx="3"/>
  <text class="mono sm" x="272" y="177.5" xml:space="preserve">old fp = S−8</text>
  <text class="mono sm muted" x="480" y="177.5" text-anchor="end" xml:space="preserve">S−16</text>
  <rect class="plain" x="260" y="186" width="230" height="26" rx="3"/>
  <text class="mono sm" x="272" y="203.5" xml:space="preserve">x = 1</text>
  <text class="mono sm muted" x="480" y="203.5" text-anchor="end" xml:space="preserve">S−20</text>
  <rect class="plain" x="260" y="212" width="230" height="26" rx="3"/>
  <text class="mono sm" x="272" y="229.5" xml:space="preserve">RA (jal 下条指令)</text>
  <text class="mono sm muted" x="480" y="229.5" text-anchor="end" xml:space="preserve">S−24</text>
  <rect class="acc" x="260" y="238" width="230" height="26" rx="3"/>
  <text class="mono sm b acc-t" x="272" y="255.5" xml:space="preserve">1</text>
  <text class="mono sm muted" x="480" y="255.5" text-anchor="end" xml:space="preserve">S−28</text>
  <rect class="plain" x="260" y="264" width="230" height="26" rx="3"/>
  <text class="mono sm" x="272" y="281.5" xml:space="preserve">old fp = S−24</text>
  <text class="mono sm muted" x="480" y="281.5" text-anchor="end" xml:space="preserve">S−32</text>
  <rect class="plain" x="260" y="290" width="230" height="26" rx="3"/>
  <text class="mono sm" x="272" y="307.5" xml:space="preserve">x = 0</text>
  <text class="mono sm muted" x="480" y="307.5" text-anchor="end" xml:space="preserve">S−36</text>
  <rect class="blue" x="260" y="316" width="230" height="26" rx="3"/>
  <text class="mono sm" x="272" y="333.5" xml:space="preserve">RA (jal 下条指令)</text>
  <text class="mono sm muted" x="480" y="333.5" text-anchor="end" xml:space="preserve">S−40</text>
  <rect class="ghost" x="260" y="342" width="230" height="26" rx="3"/>
  <text class="sm muted" x="272" y="359.5" xml:space="preserve">(下一个空闲槽位)</text>
  <text class="mono sm muted" x="480" y="359.5" text-anchor="end" xml:space="preserve">S−44</text>
  <polyline class="ln" points="500,58 506,58 506,132 500,132"/>
  <text class="sm b" x="518" y="99.0" xml:space="preserve">sumto(2) 的 AR</text>
  <polyline class="ln" points="500,162 506,162 506,236 500,236"/>
  <text class="sm b" x="518" y="203.0" xml:space="preserve">sumto(1) 的 AR</text>
  <polyline class="ln" points="500,266 506,266 506,340 500,340"/>
  <text class="sm b" x="518" y="307.0" xml:space="preserve">sumto(0) 的 AR</text>
  <line class="ln-acc" x1="500" y1="147.0" x2="512" y2="147.0"/>
  <text class="sm acc-t" x="518" y="151.0" xml:space="preserve">+ 的左操作数 x = 2（夹在 AR 之间的中间值）</text>
  <line class="ln-acc" x1="500" y1="251.0" x2="512" y2="251.0"/>
  <text class="sm acc-t" x="518" y="255.0" xml:space="preserve">+ 的左操作数 x = 1（夹在 AR 之间的中间值）</text>
  <path class="ln-muted" d="M258.0,173.0 Q210.0,147.0 256.0,121.0" marker-end="url(#cg-sumto-stack-a)"/>
  <path class="ln-muted" d="M258.0,277.0 Q210.0,251.0 256.0,225.0" marker-end="url(#cg-sumto-stack-a)"/>
  <text class="sm muted" x="206" y="151.0" text-anchor="end" xml:space="preserve">old fp</text>
  <text class="sm muted" x="206" y="255.0" text-anchor="end" xml:space="preserve">old fp</text>
  <text class="mono sm b" x="150" y="333.0" text-anchor="end" xml:space="preserve">$fp</text>
  <line class="ln-blue" x1="156" y1="329.0" x2="256" y2="329.0" marker-end="url(#cg-sumto-stack-blue)"/>
  <text class="mono sm b" x="150" y="359.0" text-anchor="end" xml:space="preserve">$sp</text>
  <line class="ln" x1="156" y1="355.0" x2="256" y2="355.0" marker-end="url(#cg-sumto-stack-a)"/>
  <text class="sm muted" x="0" y="307.0" xml:space="preserve">正在执行：sumto(0), x = 0</text>
  <text class="sm muted" x="0" y="384" xml:space="preserve">RA (jal 下条指令) = sumto 中紧跟在 jal sumto_entry 后的 lw $t1 4($sp) 的地址；返回后由该指令取回栈上的 x 相加。</text>
  <text class="sm muted" x="0" y="406" xml:space="preserve">改用 §4 的方案后，橙色槽位（中间值）不再夹在 AR 之间，而是放进各自 AR 内部的固定临时槽位。</text>
</svg>
