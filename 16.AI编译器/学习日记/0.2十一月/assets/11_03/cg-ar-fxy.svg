<svg xmlns="http://www.w3.org/2000/svg" width="932" height="436" viewBox="-16 -16 932 436" role="img" aria-label="调用 f(x, y) 时栈上建立的激活记录。高地址在上。调用方按 old fp、y、x 的顺序压栈，被调用方压入返回地址 RA。原图 FP 指向调用方帧；被调用方执行 move $fp $sp 后，新 FP 指向 RA 槽位，x 位于 4($fp)，y 位于 8($fp)，old fp 位于 12($fp)，SP 指向下一个空闲槽位。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .band { fill: none; stroke: #D97757; stroke-width: 1.6; stroke-dasharray: 5 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="436" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="cg-ar-fxy-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-ar-fxy-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cg-ar-fxy-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="sm muted" x="330" y="18" text-anchor="middle" xml:space="preserve">高地址</text>
  <rect class="plain" x="230" y="30" width="200" height="40" rx="3"/>
  <text class="sm" x="330.0" y="54.0" text-anchor="middle" xml:space="preserve">(调用方)</text>
  <rect class="blue" x="230" y="70" width="200" height="40" rx="3"/>
  <text class="mono b" x="300" y="95" text-anchor="middle" xml:space="preserve">old fp</text>
  <text class="mono sm muted" x="420" y="95" text-anchor="end" xml:space="preserve">12($fp)</text>
  <text class="sm blue-t" x="350" y="95" text-anchor="middle" xml:space="preserve">①</text>
  <line class="ln-muted" x1="446" y1="90" x2="470" y2="90"/>
  <text class="sm" x="478" y="94" xml:space="preserve">保存调用者的帧指针</text>
  <rect class="blue" x="230" y="110" width="200" height="40" rx="3"/>
  <text class="mono b" x="300" y="135" text-anchor="middle" xml:space="preserve">y</text>
  <text class="mono sm muted" x="420" y="135" text-anchor="end" xml:space="preserve">8($fp)</text>
  <text class="sm blue-t" x="350" y="135" text-anchor="middle" xml:space="preserve">②</text>
  <line class="ln-muted" x1="446" y1="130" x2="470" y2="130"/>
  <text class="sm" x="478" y="134" xml:space="preserve">实参逆序压栈：先压 y</text>
  <rect class="blue" x="230" y="150" width="200" height="40" rx="3"/>
  <text class="mono b" x="300" y="175" text-anchor="middle" xml:space="preserve">x</text>
  <text class="mono sm muted" x="420" y="175" text-anchor="end" xml:space="preserve">4($fp)</text>
  <text class="sm blue-t" x="350" y="175" text-anchor="middle" xml:space="preserve">③</text>
  <line class="ln-muted" x1="446" y1="170" x2="470" y2="170"/>
  <text class="sm" x="478" y="174" xml:space="preserve">再压 x</text>
  <rect class="acc" x="230" y="190" width="200" height="40" rx="3"/>
  <text class="mono b" x="300" y="215" text-anchor="middle" xml:space="preserve">RA</text>
  <text class="mono sm muted" x="420" y="215" text-anchor="end" xml:space="preserve">0($fp)</text>
  <text class="sm acc-t" x="350" y="215" text-anchor="middle" xml:space="preserve">④</text>
  <line class="ln-muted" x1="446" y1="210" x2="470" y2="210"/>
  <text class="sm" x="478" y="214" xml:space="preserve">返回地址（Return Address）</text>
  <rect class="ghost" x="230" y="230" width="200" height="36" rx="3"/>
  <text class="sm muted" x="330.0" y="252.0" text-anchor="middle" xml:space="preserve">(下一个空闲槽位)</text>
  <polyline class="ln" points="684,72 690,72 690,228 684,228"/>
  <text class="b" x="704" y="146" xml:space="preserve">f 的激活记录</text>
  <text class="mono sm muted" x="704" y="166" xml:space="preserve">(AR of f)</text>
  <text class="mono sm b" x="196" y="54" text-anchor="end" xml:space="preserve">FP</text>
  <line class="ln" x1="202" y1="50" x2="226" y2="50" marker-end="url(#cg-ar-fxy-a)"/>
  <text class="sm muted" x="196" y="68" text-anchor="end" xml:space="preserve">调用方的</text>
  <text class="sm b acc-t" x="196" y="214" text-anchor="end" xml:space="preserve">新 FP</text>
  <line class="ln-acc" x1="202" y1="210" x2="226" y2="210" marker-end="url(#cg-ar-fxy-acc)"/>
  <text class="mono sm muted" x="196" y="228" text-anchor="end" xml:space="preserve">move $fp $sp 后</text>
  <text class="mono sm b" x="196" y="252" text-anchor="end" xml:space="preserve">SP</text>
  <line class="ln" x1="202" y1="248" x2="226" y2="248" marker-end="url(#cg-ar-fxy-a)"/>
  <text class="sm muted" x="330" y="290" text-anchor="middle" xml:space="preserve">低地址（栈向低地址方向增长）</text>
  <line class="ln-muted" x1="0" y1="310" x2="900" y2="310"/>
  <rect class="blue" x="0" y="324" width="18" height="12" rx="3"/>
  <text class="sm" x="24" y="334" xml:space="preserve">调用方压入的槽位（①–③）</text>
  <rect class="acc" x="200" y="324" width="18" height="12" rx="3"/>
  <text class="sm" x="224" y="334" xml:space="preserve">被调用方压入的槽位（④，jal 后才确定 RA）</text>
  <rect class="ghost" x="510" y="324" width="18" height="12" rx="3"/>
  <text class="sm" x="534" y="334" xml:space="preserve">SP 指向的空闲槽位</text>
  <text class="sm muted" x="0" y="362" xml:space="preserve">槽位右侧的灰色偏移量以被调用方执行 move $fp $sp 后的新 FP 为基准。无论实参有几个，第 i 个实参 x_i 都在 4·i($fp) 处。</text>
  <text class="sm muted" x="0" y="384" xml:space="preserve">原图里的 FP（调用方的）和 RA（被调用方压入）属于不同时刻的状态，这里把两个 FP 一并标出。</text>
</svg>
