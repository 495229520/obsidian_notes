<svg xmlns="http://www.w3.org/2000/svg" width="932" height="294" viewBox="-16 -16 932 294" role="img" aria-label="语义分析的四遍处理：第 1 遍收集所有类名，因此 Foo 提前引用后面定义的 Bar 时，第 4 遍检查仍能找到 Bar。">
  <rect x="-16" y="-16" width="932" height="294" fill="rgb(245, 244, 237)" />
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <defs><marker id="sa-passes-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-passes-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-passes-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <rect class="acc" x="0" y="0" width="204" height="116" rx="8" />
  <text class="b" x="102.0" y="35.3" text-anchor="middle" xml:space="preserve">第 1 遍：类名</text>
  <text x="102.0" y="53.4" text-anchor="middle" xml:space="preserve">将所有 class 名称</text>
  <text x="102.0" y="71.6" text-anchor="middle" xml:space="preserve">登记到全局表</text>
  <text x="102.0" y="89.7" text-anchor="middle" xml:space="preserve">检查重复定义</text>
  <rect class="box" x="232" y="0" width="204" height="116" rx="8" />
  <text class="b" x="334.0" y="35.3" text-anchor="middle" xml:space="preserve">第 2 遍：继承关系</text>
  <text x="334.0" y="53.4" text-anchor="middle" xml:space="preserve">父类是否存在</text>
  <text x="334.0" y="71.6" text-anchor="middle" xml:space="preserve">禁止 Int、String、Bool</text>
  <text x="334.0" y="89.7" text-anchor="middle" xml:space="preserve">是否存在环</text>
  <line class="ln" x1="204" y1="58" x2="230" y2="58" marker-end="url(#sa-passes-a)" />
  <rect class="box" x="464" y="0" width="204" height="116" rx="8" />
  <text class="b" x="566.0" y="35.3" text-anchor="middle" xml:space="preserve">第 3 遍：成员签名</text>
  <text x="566.0" y="53.4" text-anchor="middle" xml:space="preserve">属性类型</text>
  <text x="566.0" y="71.6" text-anchor="middle" xml:space="preserve">方法形参与返回类型</text>
  <text x="566.0" y="89.7" text-anchor="middle" xml:space="preserve">检查重复与重写</text>
  <line class="ln" x1="436" y1="58" x2="462" y2="58" marker-end="url(#sa-passes-a)" />
  <rect class="acc" x="696" y="0" width="204" height="116" rx="8" />
  <text class="b" x="798.0" y="35.3" text-anchor="middle" xml:space="preserve">第 4 遍：正文类型</text>
  <text x="798.0" y="53.4" text-anchor="middle" xml:space="preserve">后序遍历表达式</text>
  <text x="798.0" y="71.6" text-anchor="middle" xml:space="preserve">管理局部作用域</text>
  <text x="798.0" y="89.7" text-anchor="middle" xml:space="preserve">记录类型</text>
  <line class="ln" x1="668" y1="58" x2="694" y2="58" marker-end="url(#sa-passes-a)" />
  <rect class="box" x="0" y="140" width="420" height="122" rx="8" />
  <text class="mono" x="16.0" y="168" xml:space="preserve">class Foo {</text>
  <rect class="acc" x="41.0" y="176" width="174.75" height="22" rx="4" />
  <text class="mono" x="47.0" y="192" xml:space="preserve">... let y: Bar in ...</text>
  <text class="mono" x="16.0" y="216" xml:space="preserve">};</text>
  <rect class="blue" x="10.0" y="224" width="151.5" height="22" rx="4" />
  <text class="mono" x="16.0" y="240" xml:space="preserve">class Bar { ... };</text>
  <rect class="plain" x="448" y="140" width="452" height="122" rx="8" />
  <text class="b" x="460" y="162.25" xml:space="preserve">前向引用</text>
  <text x="460" y="183.0" xml:space="preserve">检查 Foo 时尚未读到 Bar</text>
  <text x="460" y="201.8" xml:space="preserve">边读边判 → 误报 Bar 未定义</text>
  <text class="blue-t b" x="460" y="220.5" xml:space="preserve">第 1 遍收集 Bar，第 4 遍即可找到它。</text>
</svg>
