<svg xmlns="http://www.w3.org/2000/svg" width="892" height="290" viewBox="-16 -16 892 290" role="img" aria-label="find_symbol 从栈顶向外查找，check_scope 只检查当前层。同一作用域中的重复形参会被拒绝；内层 let 的同名变量属于新作用域，允许遮蔽外层。">
  <rect x="-16" y="-16" width="892" height="290" fill="rgb(245, 244, 237)" />
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <defs><marker id="sa-check-scope-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-check-scope-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-check-scope-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <text class="sm muted" x="0" y="14" xml:space="preserve">作用域栈（上方为当前层）</text>
  <rect class="acc" x="0" y="24" width="250" height="50" rx="6" />
  <text class="sm muted" x="125.0" y="44.4" text-anchor="middle" xml:space="preserve">当前层：foo 的形参</text>
  <text class="mono sm" x="125.0" y="62.6" text-anchor="middle" xml:space="preserve">x: Int</text>
  <rect class="box" x="0" y="82" width="250" height="50" rx="6" />
  <text class="sm muted" x="125.0" y="102.4" text-anchor="middle" xml:space="preserve">类属性</text>
  <text class="mono sm" x="125.0" y="120.6" text-anchor="middle" xml:space="preserve">x: String, y: Int</text>
  <rect class="box" x="0" y="140" width="250" height="50" rx="6" />
  <text class="sm muted" x="125.0" y="160.4" text-anchor="middle" xml:space="preserve">全局</text>
  <text class="mono sm" x="125.0" y="178.6" text-anchor="middle" xml:space="preserve">类名 Main、Foo</text>
  <line class="ln-blue" x1="270" y1="34" x2="270" y2="190" marker-end="url(#sa-check-scope-blue)" />
  <text class="mono sm blue-t" x="280" y="60" xml:space="preserve">find_symbol(x)</text>
  <text class="sm" x="280" y="78" xml:space="preserve">从上向下查找</text>
  <text class="mono sm acc-t" x="280" y="40" xml:space="preserve">check_scope(x)：只查栈顶</text>
  <text class="sm muted" x="0" y="214" xml:space="preserve">若多个层有同名绑定，使用最上层的绑定</text>
  <rect class="bad" x="470" y="0" width="390" height="118" rx="8" />
  <text class="b" x="482" y="22.25" xml:space="preserve">（一）重复形参</text>
  <text class="mono sm" x="482" y="43.0" xml:space="preserve">foo(x: Int, x: String)</text>
  <text x="482" y="61.8" xml:space="preserve">加入第二个 x 前，check_scope(x) = true</text>
  <text class="acc-t b" x="482" y="80.5" xml:space="preserve">同层重复 → 错误</text>
  <rect class="box" x="470" y="132" width="390" height="118" rx="8" />
  <text class="b" x="482" y="154.25" xml:space="preserve">（二）内层 let 的同名绑定</text>
  <text class="mono sm" x="482" y="175.0" xml:space="preserve">let x:Int&lt;-0 in let x:Bool&lt;-true in x</text>
  <text x="482" y="193.8" xml:space="preserve">新 let 层：check_scope(x) = false</text>
  <text class="blue-t b" x="482" y="212.5" xml:space="preserve">遮蔽外层 x → 允许</text>
</svg>
