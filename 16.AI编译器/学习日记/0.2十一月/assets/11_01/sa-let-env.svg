<svg xmlns="http://www.w3.org/2000/svg" width="852" height="282" viewBox="-16 -16 852 282" role="img" aria-label="let 的两个子节点使用不同环境：初始化式使用原环境 Sym，正文使用加入 x 后的环境；正文检查完后恢复 Sym。">
  <rect x="-16" y="-16" width="852" height="282" fill="rgb(245, 244, 237)" />
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <defs><marker id="sa-let-env-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-let-env-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-let-env-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <rect class="acc" x="290" y="0" width="240" height="44" rx="8" />
  <text class="mono sm" x="410.0" y="26.5" text-anchor="middle" xml:space="preserve">let x: Int &lt;- 初始化式 in e</text>
  <line class="ln" x1="350" y1="44" x2="190" y2="96" marker-end="url(#sa-let-env-a)" />
  <line class="ln" x1="470" y1="44" x2="630" y2="96" marker-end="url(#sa-let-env-a)" />
  <text class="sm blue-t b" x="196" y="66" xml:space="preserve">环境 Sym</text>
  <text class="sm blue-t b" x="560" y="66" xml:space="preserve">环境 Sym + {x: Int}</text>
  <rect class="box" x="80" y="98" width="220" height="54" rx="8" />
  <text x="190.0" y="120.4" text-anchor="middle" xml:space="preserve">初始化式</text>
  <text class="sm muted" x="190.0" y="138.6" text-anchor="middle" xml:space="preserve">新 x 尚不可见</text>
  <rect class="box" x="520" y="98" width="220" height="54" rx="8" />
  <text x="630.0" y="120.4" text-anchor="middle" xml:space="preserve">正文 e</text>
  <text class="sm muted" x="630.0" y="138.6" text-anchor="middle" xml:space="preserve">新 x 遮蔽外层 x</text>
  <rect class="plain" x="0" y="186" width="142" height="56" rx="8" />
  <text class="b" x="71.0" y="209.4" text-anchor="middle" xml:space="preserve">进入前</text>
  <text class="sm muted" x="71.0" y="227.6" text-anchor="middle" xml:space="preserve">准备作用域</text>
  <rect class="plain" x="169" y="186" width="142" height="56" rx="8" />
  <text class="b" x="240.0" y="209.4" text-anchor="middle" xml:space="preserve">检查初始化式</text>
  <text class="sm muted" x="240.0" y="227.6" text-anchor="middle" xml:space="preserve">使用 Sym</text>
  <line class="ln" x1="142" y1="214" x2="167" y2="214" marker-end="url(#sa-let-env-a)" />
  <rect class="blue" x="338" y="186" width="142" height="56" rx="8" />
  <text class="b" x="409.0" y="209.4" text-anchor="middle" xml:space="preserve">登记 x</text>
  <text class="sm muted" x="409.0" y="227.6" text-anchor="middle" xml:space="preserve">add_symbol</text>
  <line class="ln" x1="311" y1="214" x2="336" y2="214" marker-end="url(#sa-let-env-a)" />
  <rect class="plain" x="507" y="186" width="142" height="56" rx="8" />
  <text class="b" x="578.0" y="209.4" text-anchor="middle" xml:space="preserve">检查正文</text>
  <text class="sm muted" x="578.0" y="227.6" text-anchor="middle" xml:space="preserve">Sym + x</text>
  <line class="ln" x1="480" y1="214" x2="505" y2="214" marker-end="url(#sa-let-env-a)" />
  <rect class="blue" x="676" y="186" width="142" height="56" rx="8" />
  <text class="b" x="747.0" y="209.4" text-anchor="middle" xml:space="preserve">退出后</text>
  <text class="sm muted" x="747.0" y="227.6" text-anchor="middle" xml:space="preserve">移除 x，恢复 Sym</text>
  <line class="ln" x1="649" y1="214" x2="674" y2="214" marker-end="url(#sa-let-env-a)" />
</svg>
