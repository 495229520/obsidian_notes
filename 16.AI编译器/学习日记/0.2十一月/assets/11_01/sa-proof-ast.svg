<svg xmlns="http://www.w3.org/2000/svg" width="832" height="242" viewBox="-16 -16 832 242" role="img" aria-label="1 + 2 的证明树与 AST：证明树的叶节点在上、结论在下，AST 的根在上。两者结构对应，先确定子节点类型，再确定父节点类型。">
  <rect x="-16" y="-16" width="832" height="242" fill="rgb(245, 244, 237)" />
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <defs><marker id="sa-proof-ast-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-proof-ast-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-proof-ast-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <rect class="box" x="0" y="0" width="440" height="210" rx="8" />
  <text class="b" x="16" y="26" xml:space="preserve">证明树：叶节点在上</text>
  <text class="sm" x="110" y="64" text-anchor="middle" xml:space="preserve">1 是整数字面量</text>
  <line class="ln" x1="62.62" y1="72" x2="157.38" y2="72" />
  <text class="sm muted" x="163.38" y="77" xml:space="preserve">[Int]</text>
  <text class="mono" x="110" y="92" text-anchor="middle" xml:space="preserve">⊢ 1 : Int</text>
  <text class="sm" x="290" y="64" text-anchor="middle" xml:space="preserve">2 是整数字面量</text>
  <line class="ln" x1="242.62" y1="72" x2="337.38" y2="72" />
  <text class="sm muted" x="343.38" y="77" xml:space="preserve">[Int]</text>
  <text class="mono" x="290" y="92" text-anchor="middle" xml:space="preserve">⊢ 2 : Int</text>
  <line class="ln" x1="50" y1="108" x2="350" y2="108" />
  <text class="sm muted" x="358" y="113" xml:space="preserve">[Add]</text>
  <text class="mono b" x="200" y="132" text-anchor="middle" xml:space="preserve">⊢ 1 + 2 : Int</text>
  <text class="sm muted" x="16" y="192" xml:space="preserve">上方判断全部成立，才能写出下方结论</text>
  <rect class="box" x="480" y="0" width="320" height="210" rx="8" />
  <text class="b" x="496" y="26" xml:space="preserve">AST：根节点在上</text>
  <circle class="acc" cx="640" cy="68" r="18" />
  <text class="mono b" x="640" y="72.5" text-anchor="middle" xml:space="preserve">+</text>
  <circle class="blue" cx="580" cy="140" r="18" />
  <text class="mono" x="580" y="144.5" text-anchor="middle" xml:space="preserve">1</text>
  <circle class="blue" cx="700" cy="140" r="18" />
  <text class="mono" x="700" y="144.5" text-anchor="middle" xml:space="preserve">2</text>
  <line class="ln" x1="628" y1="82" x2="592" y2="126" />
  <line class="ln" x1="652" y1="82" x2="688" y2="126" />
  <text class="mono sm acc-t" x="664" y="72" xml:space="preserve">: Int</text>
  <text class="mono sm blue-t" x="604" y="144" xml:space="preserve">: Int</text>
  <text class="mono sm blue-t" x="724" y="144" xml:space="preserve">: Int</text>
  <text class="sm muted" x="496" y="192" xml:space="preserve">后序遍历：先处理 1、2，再处理 +</text>
</svg>
