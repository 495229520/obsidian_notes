<svg xmlns="http://www.w3.org/2000/svg" width="812" height="268" viewBox="-16 -16 812 268" role="img" aria-label="单栈的顺序限制：先压入 a b，弹出时得到 b a，无法与第二个同序 w 的 a 对齐；反序的 w c wᴿ 则与弹栈顺序一致。">
  <rect x="-16" y="-16" width="812" height="268" fill="rgb(245, 244, 237)" />
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <defs><marker id="sa-wcw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-wcw-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-wcw-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <rect class="box" x="0" y="0" width="370" height="236" rx="8" />
  <text class="b" x="16" y="26" xml:space="preserve">w c w：按相同顺序重复</text>
  <rect class="blue" x="18.0" y="49.0" width="32" height="26" rx="6" />
  <text class="mono" x="34" y="66.5" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="blue" x="58.0" y="49.0" width="32" height="26" rx="6" />
  <text class="mono" x="74" y="66.5" text-anchor="middle" xml:space="preserve">b</text>
  <rect class="plain" x="98.0" y="49.0" width="32" height="26" rx="6" />
  <text class="mono" x="114" y="66.5" text-anchor="middle" xml:space="preserve">c</text>
  <rect class="acc" x="138.0" y="49.0" width="32" height="26" rx="6" />
  <text class="mono" x="154" y="66.5" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="box" x="178.0" y="49.0" width="32" height="26" rx="6" />
  <text class="mono" x="194" y="66.5" text-anchor="middle" xml:space="preserve">b</text>
  <text class="sm muted" x="238" y="66" xml:space="preserve">输入</text>
  <text class="sm muted" x="18" y="104" xml:space="preserve">栈</text>
  <rect class="bad" x="18" y="112" width="64" height="34" rx="4" />
  <text class="mono" x="50" y="134" text-anchor="middle" xml:space="preserve">b</text>
  <rect class="box" x="18" y="146" width="64" height="34" rx="4" />
  <text class="mono" x="50" y="168" text-anchor="middle" xml:space="preserve">a</text>
  <line class="ln" x1="10" y1="184" x2="90" y2="184" />
  <text class="sm muted" x="94" y="134" xml:space="preserve">← 栈顶</text>
  <text class="mono sm" x="170" y="120" xml:space="preserve">弹出符号：b</text>
  <text class="mono sm" x="170" y="142" xml:space="preserve">下一个输入：a</text>
  <text class="b acc-t" x="170" y="168" xml:space="preserve">不同 → 失败</text>
  <text class="sm muted" x="16" y="216" xml:space="preserve">栈将 a b 按 b a 的顺序弹出</text>
  <rect class="box" x="410" y="0" width="370" height="236" rx="8" />
  <text class="b" x="426" y="26" xml:space="preserve">w c wᴿ：按相反顺序出现</text>
  <rect class="blue" x="428.0" y="49.0" width="32" height="26" rx="6" />
  <text class="mono" x="444" y="66.5" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="blue" x="468.0" y="49.0" width="32" height="26" rx="6" />
  <text class="mono" x="484" y="66.5" text-anchor="middle" xml:space="preserve">b</text>
  <rect class="plain" x="508.0" y="49.0" width="32" height="26" rx="6" />
  <text class="mono" x="524" y="66.5" text-anchor="middle" xml:space="preserve">c</text>
  <rect class="acc" x="548.0" y="49.0" width="32" height="26" rx="6" />
  <text class="mono" x="564" y="66.5" text-anchor="middle" xml:space="preserve">b</text>
  <rect class="box" x="588.0" y="49.0" width="32" height="26" rx="6" />
  <text class="mono" x="604" y="66.5" text-anchor="middle" xml:space="preserve">a</text>
  <text class="sm muted" x="648" y="66" xml:space="preserve">输入</text>
  <text class="sm muted" x="428" y="104" xml:space="preserve">栈</text>
  <rect class="acc" x="428" y="112" width="64" height="34" rx="4" />
  <text class="mono" x="460" y="134" text-anchor="middle" xml:space="preserve">b</text>
  <rect class="box" x="428" y="146" width="64" height="34" rx="4" />
  <text class="mono" x="460" y="168" text-anchor="middle" xml:space="preserve">a</text>
  <line class="ln" x1="420" y1="184" x2="500" y2="184" />
  <text class="sm muted" x="504" y="134" xml:space="preserve">← 栈顶</text>
  <text class="mono sm" x="580" y="120" xml:space="preserve">弹出符号：b</text>
  <text class="mono sm" x="580" y="142" xml:space="preserve">下一个输入：b</text>
  <text class="b blue-t" x="580" y="168" xml:space="preserve">相同 → 继续</text>
  <text class="sm muted" x="426" y="216" xml:space="preserve">弹栈顺序与输入顺序一致</text>
</svg>
