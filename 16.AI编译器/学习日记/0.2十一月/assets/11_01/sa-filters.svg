<svg xmlns="http://www.w3.org/2000/svg" width="932" height="268" viewBox="-16 -16 932 268" role="img" aria-label="编译器前端的三层检查：源码依次通过词法、语法和语义分析，生成带类型信息的 AST。各阶段拒绝不同类别的错误。">
  <rect x="-16" y="-16" width="932" height="268" fill="rgb(245, 244, 237)" />
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <defs><marker id="sa-filters-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-filters-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-filters-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <rect class="plain" x="0" y="20" width="104" height="76" rx="8" />
  <text x="52.0" y="53.4" text-anchor="middle" xml:space="preserve">源码</text>
  <text x="52.0" y="71.6" text-anchor="middle" xml:space="preserve">字符串</text>
  <line class="ln" x1="104" y1="58" x2="124" y2="58" marker-end="url(#sa-filters-a)" />
  <rect class="box" x="126" y="20" width="182" height="76" rx="8" />
  <text class="b" x="217.0" y="44.4" text-anchor="middle" xml:space="preserve">词法分析</text>
  <text x="217.0" y="62.5" text-anchor="middle" xml:space="preserve">每个 Token</text>
  <text x="217.0" y="80.6" text-anchor="middle" xml:space="preserve">是否合法</text>
  <line class="ln-dash" x1="217" y1="96" x2="217" y2="146" marker-end="url(#sa-filters-acc)" />
  <text class="sm acc-t" x="225" y="126" xml:space="preserve">拒绝</text>
  <rect class="bad" x="126" y="148" width="182" height="84" rx="8" />
  <text class="mono sm" x="217.0" y="176.4" text-anchor="middle" xml:space="preserve">foo$bar</text>
  <text class="sm" x="217.0" y="194.5" text-anchor="middle" xml:space="preserve">不接受 $ 的语言：</text>
  <text class="sm" x="217.0" y="212.6" text-anchor="middle" xml:space="preserve">无法识别的字符</text>
  <line class="ln" x1="308" y1="58" x2="328" y2="58" marker-end="url(#sa-filters-a)" />
  <rect class="box" x="330" y="20" width="182" height="76" rx="8" />
  <text class="b" x="421.0" y="44.4" text-anchor="middle" xml:space="preserve">语法分析</text>
  <text x="421.0" y="62.5" text-anchor="middle" xml:space="preserve">Token 的排列</text>
  <text x="421.0" y="80.6" text-anchor="middle" xml:space="preserve">是否符合文法</text>
  <line class="ln-dash" x1="421" y1="96" x2="421" y2="146" marker-end="url(#sa-filters-acc)" />
  <text class="sm acc-t" x="429" y="126" xml:space="preserve">拒绝</text>
  <rect class="bad" x="330" y="148" width="182" height="84" rx="8" />
  <text class="mono sm" x="421.0" y="176.4" text-anchor="middle" xml:space="preserve">let x = 2 * + 3;</text>
  <text class="sm" x="421.0" y="194.5" text-anchor="middle" xml:space="preserve">* 后应出现</text>
  <text class="sm" x="421.0" y="212.6" text-anchor="middle" xml:space="preserve">操作数</text>
  <line class="ln" x1="512" y1="58" x2="532" y2="58" marker-end="url(#sa-filters-a)" />
  <rect class="box" x="534" y="20" width="182" height="76" rx="8" />
  <text class="b" x="625.0" y="44.4" text-anchor="middle" xml:space="preserve">语义分析</text>
  <text x="625.0" y="62.5" text-anchor="middle" xml:space="preserve">名称、类型与继承</text>
  <text x="625.0" y="80.6" text-anchor="middle" xml:space="preserve">关系是否合法</text>
  <line class="ln-dash" x1="625" y1="96" x2="625" y2="146" marker-end="url(#sa-filters-acc)" />
  <text class="sm acc-t" x="633" y="126" xml:space="preserve">拒绝</text>
  <rect class="bad" x="534" y="148" width="182" height="84" rx="8" />
  <text class="mono sm" x="625.0" y="176.4" text-anchor="middle" xml:space="preserve">let y: Int in x + 3</text>
  <text class="sm" x="625.0" y="194.5" text-anchor="middle" xml:space="preserve">语法正确，但</text>
  <text class="sm" x="625.0" y="212.6" text-anchor="middle" xml:space="preserve">找不到 x 的声明</text>
  <line class="ln" x1="716" y1="58" x2="756" y2="58" marker-end="url(#sa-filters-a)" />
  <rect class="blue" x="758" y="20" width="142" height="76" rx="8" />
  <text x="829.0" y="53.4" text-anchor="middle" xml:space="preserve">带类型信息</text>
  <text x="829.0" y="71.6" text-anchor="middle" xml:space="preserve">的 AST</text>
</svg>
