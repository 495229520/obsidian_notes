<svg xmlns="http://www.w3.org/2000/svg" width="932" height="368" viewBox="-16 -16 932 368" role="img" aria-label="Animal 示例的 AST：蓝字是向下传递的环境，橙色标签是向上返回的类型。if 将 Cat 与 Dog 合并为 lub = Animal，整个 let 也为 Animal。">
