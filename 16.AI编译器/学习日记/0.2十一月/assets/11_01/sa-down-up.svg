  <text class="mono sm blue-t" x="0" y="266" xml:space="preserve">O = {flag: Bool}</text>
  <text class="mono sm blue-t" x="0" y="286" xml:space="preserve">O₁ = O[Animal/pet]</text>
  <text class="sm" x="0" y="312" xml:space="preserve">初始化：Dog ≤ Animal</text>
