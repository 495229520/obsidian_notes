<svg xmlns="http://www.w3.org/2000/svg" width="912" height="268" viewBox="-16 -16 912 268" role="img" aria-label="嵌套 let 中三处 x 的绑定与作用域栈：(1)、(3) 绑定外层声明 A，(2) 绑定内层声明 B。访问 (2) 时，B 遮蔽 A。">
  <rect x="-16" y="-16" width="912" height="268" fill="rgb(245, 244, 237)" />
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <defs><marker id="sa-scope-stack-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-scope-stack-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z" /></marker><marker id="sa-scope-stack-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <rect class="box" x="0" y="0" width="300" height="236" rx="8" />
  <rect class="blue" x="10" y="15" width="150" height="20" rx="4" />
  <text class="mono" x="16.0" y="30" xml:space="preserve">let x: Int &lt;- 0 in</text>
  <text class="mono" x="16.0" y="52" xml:space="preserve">{</text>
  <text class="mono" x="47.0" y="74" xml:space="preserve">x;</text>
  <rect class="blue" x="41" y="81" width="150" height="20" rx="4" />
  <text class="mono" x="47.0" y="96" xml:space="preserve">let x: Int &lt;- 1 in</text>
  <text class="mono" x="47.0" y="118" xml:space="preserve">{</text>
  <text class="mono" x="78.0" y="140" xml:space="preserve">x;</text>
  <text class="mono" x="47.0" y="162" xml:space="preserve">};</text>
  <text class="mono" x="47.0" y="184" xml:space="preserve">x;</text>
  <text class="mono" x="16.0" y="206" xml:space="preserve">}</text>
  <text class="sm blue-t" x="176" y="30" xml:space="preserve">声明 A</text>
  <text class="sm blue-t" x="208" y="96" xml:space="preserve">声明 B</text>
  <text class="sm acc-t b" x="220" y="74" xml:space="preserve">(1) → A</text>
  <text class="sm acc-t b" x="220" y="140" xml:space="preserve">(2) → B</text>
  <text class="sm acc-t b" x="220" y="184" xml:space="preserve">(3) → A</text>
  <text class="b" x="415" y="26" text-anchor="middle" xml:space="preserve">在 (1) 处</text>
  <rect class="acc" x="330" y="146" width="170" height="46" rx="6" />
  <text class="sm muted" x="415.0" y="164.4" text-anchor="middle" xml:space="preserve">Scope 1</text>
  <text class="mono sm" x="415.0" y="182.6" text-anchor="middle" xml:space="preserve">x → A: Int</text>
  <line class="ln" x1="324" y1="200" x2="506" y2="200" />
  <text class="b" x="605" y="26" text-anchor="middle" xml:space="preserve">在 (2) 处</text>
  <rect class="dead" x="520" y="146" width="170" height="46" rx="6" />
  <text class="sm muted" x="605.0" y="164.4" text-anchor="middle" xml:space="preserve">Scope 1</text>
  <text class="mono sm" x="605.0" y="182.6" text-anchor="middle" xml:space="preserve">x → A：被遮蔽</text>
  <rect class="acc" x="520" y="96" width="170" height="46" rx="6" />
  <text class="sm muted" x="605.0" y="114.4" text-anchor="middle" xml:space="preserve">Scope 2</text>
  <text class="mono sm" x="605.0" y="132.6" text-anchor="middle" xml:space="preserve">x → B: Int</text>
  <line class="ln" x1="514" y1="200" x2="696" y2="200" />
  <text class="b" x="795" y="26" text-anchor="middle" xml:space="preserve">在 (3) 处</text>
  <rect class="acc" x="710" y="146" width="170" height="46" rx="6" />
  <text class="sm muted" x="795.0" y="164.4" text-anchor="middle" xml:space="preserve">Scope 1</text>
  <text class="mono sm" x="795.0" y="182.6" text-anchor="middle" xml:space="preserve">x → A: Int</text>
  <line class="ln" x1="704" y1="200" x2="886" y2="200" />
  <text class="sm muted" x="330" y="226" xml:space="preserve">从栈顶向外查找，使用最先找到的 x。</text>
</svg>
