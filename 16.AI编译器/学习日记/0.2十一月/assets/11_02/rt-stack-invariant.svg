<svg xmlns="http://www.w3.org/2000/svg" width="932" height="342" viewBox="-16 -16 932 342" role="img" aria-label="用 push 和 add 计算 7 + (5 + 3) 时的栈变化。依次执行 push 7、push 5、push 3、add、add。计算 5 + 3 的三条指令不碰下方的 S 和 7，只在栈顶留下 8；整条表达式也保持 S 不变，只在栈顶留下 15。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="342" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="rt-stack-invariant-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-stack-invariant-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-stack-invariant-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="65" y="18" text-anchor="middle" xml:space="preserve">初始</text>
  <rect class="box" x="0" y="30" width="130" height="206" rx="8"/>
  <rect class="dead" x="15" y="200" width="100" height="28" rx="4"/>
  <text class="mono sm muted" x="65.0" y="218.5" text-anchor="middle" xml:space="preserve">S</text>
  <text class="mono" x="65" y="100" text-anchor="middle" xml:space="preserve">7 + (5 + 3)</text>
  <text class="sm muted" x="65" y="118" text-anchor="middle" xml:space="preserve">待求表达式</text>
  <text class="mono b" x="219" y="18" text-anchor="middle" xml:space="preserve">push 7</text>
  <rect class="box" x="154" y="30" width="130" height="206" rx="8"/>
  <rect class="dead" x="169" y="200" width="100" height="28" rx="4"/>
  <text class="mono sm muted" x="219.0" y="218.5" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="plain" x="169" y="168" width="100" height="28" rx="4"/>
  <text class="mono b" x="219.0" y="186.5" text-anchor="middle" xml:space="preserve">7</text>
  <text class="mono b" x="373" y="18" text-anchor="middle" xml:space="preserve">push 5</text>
  <rect class="box" x="308" y="30" width="130" height="206" rx="8"/>
  <rect class="dead" x="323" y="200" width="100" height="28" rx="4"/>
  <text class="mono sm muted" x="373.0" y="218.5" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="plain" x="323" y="168" width="100" height="28" rx="4"/>
  <text class="mono b" x="373.0" y="186.5" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="blue" x="323" y="136" width="100" height="28" rx="4"/>
  <text class="mono b" x="373.0" y="154.5" text-anchor="middle" xml:space="preserve">5</text>
  <text class="mono b" x="527" y="18" text-anchor="middle" xml:space="preserve">push 3</text>
  <rect class="box" x="462" y="30" width="130" height="206" rx="8"/>
  <rect class="dead" x="477" y="200" width="100" height="28" rx="4"/>
  <text class="mono sm muted" x="527.0" y="218.5" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="plain" x="477" y="168" width="100" height="28" rx="4"/>
  <text class="mono b" x="527.0" y="186.5" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="blue" x="477" y="136" width="100" height="28" rx="4"/>
  <text class="mono b" x="527.0" y="154.5" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="blue" x="477" y="104" width="100" height="28" rx="4"/>
  <text class="mono b" x="527.0" y="122.5" text-anchor="middle" xml:space="preserve">3</text>
  <text class="mono b" x="681" y="18" text-anchor="middle" xml:space="preserve">add</text>
  <rect class="box" x="616" y="30" width="130" height="206" rx="8"/>
  <rect class="dead" x="631" y="200" width="100" height="28" rx="4"/>
  <text class="mono sm muted" x="681.0" y="218.5" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="plain" x="631" y="168" width="100" height="28" rx="4"/>
  <text class="mono b" x="681.0" y="186.5" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="blue" x="631" y="136" width="100" height="28" rx="4"/>
  <text class="mono b" x="681.0" y="154.5" text-anchor="middle" xml:space="preserve">8</text>
  <text class="mono b" x="835" y="18" text-anchor="middle" xml:space="preserve">add</text>
  <rect class="box" x="770" y="30" width="130" height="206" rx="8"/>
  <rect class="dead" x="785" y="200" width="100" height="28" rx="4"/>
  <text class="mono sm muted" x="835.0" y="218.5" text-anchor="middle" xml:space="preserve">S</text>
  <rect class="acc" x="785" y="168" width="100" height="28" rx="4"/>
  <text class="mono b" x="835.0" y="186.5" text-anchor="middle" xml:space="preserve">15</text>
  <polyline class="ln-blue" points="310,242 310,248 744,248 744,242"/>
  <text class="sm blue-t" x="527" y="266" text-anchor="middle" xml:space="preserve">5 + 3 的代码：不改下方的 S 和 7，只在栈顶多出一个 8</text>
  <polyline class="ln-acc" points="156,278 156,284 898,284 898,278"/>
  <text class="sm acc-t" x="527" y="302" text-anchor="middle" xml:space="preserve">7 + (5 + 3) 整段代码：保持 S 不变，只在栈顶多出一个 15</text>
</svg>