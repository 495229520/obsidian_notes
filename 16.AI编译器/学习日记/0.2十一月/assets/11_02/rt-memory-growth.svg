<svg xmlns="http://www.w3.org/2000/svg" width="932" height="332" viewBox="-16 -16 932 332" role="img" aria-label="内存四大分区与堆栈相向生长示意图：低地址到高地址依次为 Code、Static Data、Heap 向下生长、Free Space 空闲空间、Stack 向上生长。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="932" height="332" rx="14" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="rt-mg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="rt-mg-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="rt-mg-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="box" x="0" y="0" width="500" height="300" rx="8"/>
  <text class="b" x="18" y="24" xml:space="preserve">四大内存分区与堆栈相向生长</text>
  <text class="b" x="20" y="264" xml:space="preserve">Memory</text>
  <line class="ln" x1="78" y1="260" x2="108" y2="260" marker-end="url(#rt-mg-a)"/>
  <rect class="plain" x="116" y="42" width="246" height="38" rx="0"/>
  <text class="b" x="239" y="65.5" text-anchor="middle" xml:space="preserve">Code（代码区）</text>
  <rect class="plain" x="116" y="80" width="246" height="38" rx="0"/>
  <text class="b" x="239" y="103.5" text-anchor="middle" xml:space="preserve">Static Data（静态区）</text>
  <rect class="blue" x="116" y="118" width="246" height="42" rx="0"/>
  <text class="b" x="239" y="143.5" text-anchor="middle" xml:space="preserve">Heap（堆区）</text>
  <rect class="ghost" x="116" y="160" width="246" height="80" rx="0"/>
  <line class="ln-blue" x1="150" y1="164" x2="150" y2="196" marker-end="url(#rt-mg-blue)"/>
  <text class="sm blue-t" x="166" y="185" xml:space="preserve">Heap 向高地址增长</text>
  <line class="ln-acc" x1="150" y1="236" x2="150" y2="204" marker-end="url(#rt-mg-acc)"/>
  <text class="sm acc-t" x="166" y="224" xml:space="preserve">Stack 向低地址增长</text>
  <rect class="acc" x="116" y="240" width="246" height="42" rx="0"/>
  <text class="b" x="239" y="265.5" text-anchor="middle" xml:space="preserve">Stack（栈区 / AR）</text>
  <text class="sm muted b" x="376" y="56" xml:space="preserve">低地址（Low）</text>
  <text class="sm muted" x="376" y="204" xml:space="preserve">空闲共享区</text>
  <text class="sm muted b" x="376" y="276" xml:space="preserve">高地址（High）</text>
  <rect class="box" x="526" y="0" width="374" height="300" rx="8"/>
  <text class="b" x="544" y="24" xml:space="preserve">各区域特征与管理方式</text>
  <rect class="plain" x="544" y="42" width="338" height="54" rx="6"/>
  <text class="b" x="558" y="64" xml:space="preserve">Code</text>
  <text class="sm muted" x="558" y="84" xml:space="preserve">大小固定、通常只读，存放目标机器码</text>
  <rect class="plain" x="544" y="104" width="338" height="54" rx="6"/>
  <text class="b" x="558" y="126" xml:space="preserve">Static Data</text>
  <text class="sm muted" x="558" y="146" xml:space="preserve">大小固定、可读写，存放全局变量与 static 数据</text>
  <rect class="blue" x="544" y="166" width="338" height="54" rx="6"/>
  <text class="b blue-t" x="558" y="188" xml:space="preserve">Heap</text>
  <text class="sm" x="558" y="208" xml:space="preserve">动态分配；C 用 malloc/free，Java 用 new + GC</text>
  <rect class="acc" x="544" y="228" width="338" height="54" rx="6"/>
  <text class="b acc-t" x="558" y="250" xml:space="preserve">Stack</text>
  <text class="sm" x="558" y="270" xml:space="preserve">活跃过程各占一个固定 AR，中间空闲区按需共享</text>
</svg>