<svg xmlns="http://www.w3.org/2000/svg" width="932" height="272" viewBox="-16 -16 932 272" role="img" aria-label="内存空间的基础切分与绘图约定：低地址在顶部存放 Code 代码区，下方为 Other Space 其他空间，且示意图为逻辑简化，实际内存不必连续。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .h { fill: #6F6D66; }
  </style>
  <rect x="-16" y="-16" width="932" height="272" rx="14" fill="rgb(245, 244, 237)"/>
  <defs>
    <marker id="rt-mb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="h" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="0" y="0" width="460" height="240" rx="8"/>
  <text class="b" x="18" y="26" xml:space="preserve">OS 加载代码后的初始内存切分</text>
  <text class="b" x="30" y="138" xml:space="preserve">Memory</text>
  <line class="ln" x1="88" y1="134" x2="128" y2="134" marker-end="url(#rt-mb-a)"/>
  <rect class="blue" x="136" y="48" width="196" height="54" rx="0"/>
  <text class="b" x="234" y="79" text-anchor="middle" xml:space="preserve">Code（代码区）</text>
  <rect class="ghost" x="136" y="102" width="196" height="114" rx="0"/>
  <text class="muted" x="234" y="163" text-anchor="middle" xml:space="preserve">Other Space（其他空间）</text>
  <text class="sm acc-t b" x="346" y="64" xml:space="preserve">低地址（Low）</text>
  <text class="sm muted b" x="346" y="210" xml:space="preserve">高地址（High）</text>
  <rect class="box" x="490" y="0" width="410" height="240" rx="8"/>
  <text class="b" x="508" y="26" xml:space="preserve">机器组织图的约定与简化前提</text>
  <rect class="plain" x="508" y="46" width="374" height="84" rx="6"/>
  <text class="b blue-t" x="524" y="68" xml:space="preserve">绘制惯例</text>
  <text class="sm" x="524" y="90" xml:space="preserve">· 低地址画在顶部，高地址画在底部</text>
  <text class="sm" x="524" y="110" xml:space="preserve">· 用分隔线划出不同种类数据的区域</text>
  <rect class="acc" x="508" y="142" width="374" height="80" rx="6"/>
  <text class="b acc-t" x="524" y="164" xml:space="preserve">简化前提</text>
  <text class="sm" x="524" y="186" xml:space="preserve">· 框图只是逻辑分区，并非所有内存都必须连续</text>
  <text class="sm" x="524" y="206" xml:space="preserve">· 虚拟内存体系下各段之间允许存在空洞或分散映射</text>
</svg>