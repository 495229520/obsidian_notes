<svg xmlns="http://www.w3.org/2000/svg" width="932" height="332" viewBox="-16 -16 932 332" role="img" aria-label="静态结构与动态结构的对应关系。源码中只有一处 int x 声明，读取 return x + y 中 x 的机器指令也只有一份 load [FP − 4]。运行期间 sum(0)、sum(1)、sum(2) 每个栈帧里各有一份 x，同一条指令按当前 FP 读取 sum(0) 栈帧里的 x。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="332" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="rt-static-dynamic-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-static-dynamic-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-static-dynamic-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="330" height="300" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">静态：源码中只有一份</text>
  <text class="sm muted" x="16" y="46" xml:space="preserve">1 个 sum 定义，1 处 int x 声明</text>
  <text class="mono sm" x="30" y="80" xml:space="preserve">int sum(int n)</text>
  <text class="mono sm" x="30" y="102" xml:space="preserve">{</text>
  <rect class="acc" x="22" y="109" width="200" height="21" rx="4"/>
  <text class="mono sm" x="30" y="124" xml:space="preserve">    int x = n;</text>
  <text class="mono sm" x="30" y="146" xml:space="preserve">    if (n == 0)</text>
  <text class="mono sm" x="30" y="168" xml:space="preserve">        return 0;</text>
  <text class="mono sm" x="30" y="190" xml:space="preserve">    int y = sum(n - 1);</text>
  <rect class="blue" x="22" y="197" width="200" height="21" rx="4"/>
  <text class="mono sm" x="30" y="212" xml:space="preserve">    return x + y;</text>
  <text class="mono sm" x="30" y="234" xml:space="preserve">}</text>
  <text class="sm muted" x="16" y="264" xml:space="preserve">名字 x 指向哪条声明，</text>
  <text class="sm muted" x="16" y="284" xml:space="preserve">在编译期由作用域分析确定</text>
  <rect class="box" x="370" y="0" width="530" height="82" rx="8"/>
  <text class="b" x="386" y="26" xml:space="preserve">代码区：读取 return x + y 中 x 的同一份指令</text>
  <text class="sm muted" x="386" y="50" xml:space="preserve">偏移 −4 在编译期固定，只有 FP 随调用变化</text>
  <rect class="blue" x="725.0" y="28.0" width="150" height="26" rx="6"/>
  <text class="mono" x="800" y="45.5" text-anchor="middle" xml:space="preserve">load [FP − 4]</text>
  <rect class="box" x="370" y="100" width="530" height="200" rx="8"/>
  <text class="b" x="386" y="126" xml:space="preserve">动态：运行中有三个 x（上方为最近调用）</text>
  <rect class="acc" x="386" y="140" width="498" height="42" rx="6"/>
  <text class="mono sm b" x="402" y="158" xml:space="preserve">sum(0)</text>
  <text class="sm acc-t" x="402" y="174" xml:space="preserve">当前正在执行</text>
  <text class="mono sm" x="540" y="165" xml:space="preserve">x 地址 = FP − 4</text>
  <rect class="plain" x="725.0" y="148.0" width="150" height="26" rx="6"/>
  <text class="mono" x="800" y="165.5" text-anchor="middle" xml:space="preserve">x = 0</text>
  <line class="ln-muted" x1="224" y1="120" x2="384" y2="161" marker-end="url(#rt-static-dynamic-a)"/>
  <rect class="plain" x="386" y="190" width="498" height="42" rx="6"/>
  <text class="mono sm b" x="402" y="208" xml:space="preserve">sum(1)</text>
  <text class="sm muted" x="402" y="224" xml:space="preserve">等待 sum(0) 返回</text>
  <text class="mono sm muted" x="540" y="215" xml:space="preserve">各自 FP − 4</text>
  <rect class="box" x="725.0" y="198.0" width="150" height="26" rx="6"/>
  <text class="mono" x="800" y="215.5" text-anchor="middle" xml:space="preserve">x = 1</text>
  <line class="ln-muted" x1="224" y1="120" x2="384" y2="211" marker-end="url(#rt-static-dynamic-a)"/>
  <rect class="plain" x="386" y="240" width="498" height="42" rx="6"/>
  <text class="mono sm b" x="402" y="258" xml:space="preserve">sum(2)</text>
  <text class="sm muted" x="402" y="274" xml:space="preserve">等待 sum(1) 返回</text>
  <text class="mono sm muted" x="540" y="265" xml:space="preserve">各自 FP − 4</text>
  <rect class="box" x="725.0" y="248.0" width="150" height="26" rx="6"/>
  <text class="mono" x="800" y="265.5" text-anchor="middle" xml:space="preserve">x = 2</text>
  <line class="ln-muted" x1="224" y1="120" x2="384" y2="261" marker-end="url(#rt-static-dynamic-a)"/>
  <line class="ln-acc" x1="800" y1="57" x2="800" y2="146" marker-end="url(#rt-static-dynamic-acc)"/>
</svg>