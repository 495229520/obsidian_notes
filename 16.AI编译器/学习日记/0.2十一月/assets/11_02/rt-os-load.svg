<svg xmlns="http://www.w3.org/2000/svg" width="932" height="350" viewBox="-16 -16 932 350" role="img" aria-label="可执行文件进入运行态的过程。磁盘上的 ELF 文件只是一堆字节。操作系统分配内存空间，将代码加载到低地址一侧，再将 PC 置为入口点。真实入口点不是 main 而是 _start，经由 __libc_start_main 才调用 main。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="350" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="rt-os-load-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-os-load-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-os-load-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="100" y="16" text-anchor="middle" xml:space="preserve">磁盘上的可执行文件</text>
  <rect class="plain" x="30" y="46" width="140" height="150" rx="8"/>
  <text class="mono sm b" x="100" y="68" text-anchor="middle" xml:space="preserve">a.out (ELF)</text>
  <rect class="box" x="42" y="80" width="116" height="30" rx="5"/>
  <text class="sm" x="100.0" y="99.0" text-anchor="middle" xml:space="preserve">文件头：入口地址</text>
  <rect class="blue" x="42" y="116" width="116" height="30" rx="5"/>
  <text class="sm" x="100.0" y="135.0" text-anchor="middle" xml:space="preserve">.text：机器指令</text>
  <rect class="box" x="42" y="152" width="116" height="30" rx="5"/>
  <text class="sm" x="100.0" y="171.0" text-anchor="middle" xml:space="preserve">.data：初值数据</text>
  <line class="ln" x1="204" y1="121" x2="229" y2="121" marker-end="url(#rt-os-load-a)"/>
  <text class="sm" x="100" y="238" text-anchor="middle" xml:space="preserve">磁盘上的一堆字节</text>
  <text class="sm" x="100" y="256" text-anchor="middle" xml:space="preserve">尚未开始执行</text>
  <text class="b" x="333" y="16" text-anchor="middle" xml:space="preserve">① 分配内存空间</text>
  <text class="sm muted" x="333" y="38" text-anchor="middle" xml:space="preserve">低地址</text>
  <rect class="box" x="278" y="46" width="110" height="150" rx="4"/>
  <text class="sm muted" x="333" y="212" text-anchor="middle" xml:space="preserve">高地址</text>
  <text class="sm muted" x="333" y="125" text-anchor="middle" xml:space="preserve">空闲未用</text>
  <line class="ln" x1="437" y1="121" x2="462" y2="121" marker-end="url(#rt-os-load-a)"/>
  <text class="sm" x="333" y="238" text-anchor="middle" xml:space="preserve">OS 为程序划出</text>
  <text class="sm" x="333" y="256" text-anchor="middle" xml:space="preserve">一段运行空间</text>
  <text class="b" x="566" y="16" text-anchor="middle" xml:space="preserve">② 加载代码</text>
  <text class="sm muted" x="566" y="38" text-anchor="middle" xml:space="preserve">低地址</text>
  <rect class="box" x="511" y="46" width="110" height="150" rx="4"/>
  <text class="sm muted" x="566" y="212" text-anchor="middle" xml:space="preserve">高地址</text>
  <rect class="blue" x="511" y="46" width="110" height="48" rx="4"/>
  <text class="b" x="566.0" y="74.5" text-anchor="middle" xml:space="preserve">Code</text>
  <text class="sm muted" x="566" y="150" text-anchor="middle" xml:space="preserve">Other Space</text>
  <line class="ln" x1="670" y1="121" x2="695" y2="121" marker-end="url(#rt-os-load-a)"/>
  <text class="sm" x="566" y="238" text-anchor="middle" xml:space="preserve">把机器指令加载到</text>
  <text class="sm" x="566" y="256" text-anchor="middle" xml:space="preserve">低地址一侧 (load)</text>
  <text class="b" x="799" y="16" text-anchor="middle" xml:space="preserve">③ 跳转到入口点</text>
  <text class="sm muted" x="799" y="38" text-anchor="middle" xml:space="preserve">低地址</text>
  <rect class="box" x="744" y="46" width="110" height="150" rx="4"/>
  <text class="sm muted" x="799" y="212" text-anchor="middle" xml:space="preserve">高地址</text>
  <rect class="acc" x="744" y="46" width="110" height="48" rx="4"/>
  <text class="b" x="799.0" y="74.5" text-anchor="middle" xml:space="preserve">Code</text>
  <text class="sm muted" x="799" y="150" text-anchor="middle" xml:space="preserve">Other Space</text>
  <text class="sm b acc-t" x="703" y="60" xml:space="preserve">PC</text>
  <line class="ln-acc" x1="703" y1="70" x2="742" y2="70" marker-end="url(#rt-os-load-acc)"/>
  <text class="sm" x="799" y="238" text-anchor="middle" xml:space="preserve">把 PC 指向入口点</text>
  <text class="sm" x="799" y="256" text-anchor="middle" xml:space="preserve">_start → … → main</text>
  <rect class="plain" x="0" y="270" width="900" height="48" rx="8"/>
  <text class="sm" x="14" y="290" xml:space="preserve">实测（gcc 13.3，x86-64 Linux）：readelf 显示的入口点 0x10a0 是 _start，而 main 位于 0x1189。</text>
  <text class="sm muted" x="14" y="308" xml:space="preserve">动态链接的可执行文件会先执行动态加载器（ld-linux），完成共享库链接后再交过去。</text>
</svg>