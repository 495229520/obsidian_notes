<svg xmlns="http://www.w3.org/2000/svg" width="932" height="264" viewBox="-16 -16 932 264" role="img" aria-label="32位机上字符串 Hello 的字对齐填充示意：Word 1 存放 H e l l，Word 2 存放 o 与 3 个未使用填充字节，总计 8 字节。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln-acc { stroke: #D97757; stroke-width: 2; fill: none; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1.2; fill: none; }
  </style>
  <rect x="-16" y="-16" width="932" height="264" rx="14" fill="rgb(245, 244, 237)"/>
  <text class="b" x="40" y="16" xml:space="preserve">"Hello" 字符串的字对齐填充（32 位机：1 字 = 4 字节）</text>
  <text class="sm b muted" x="270" y="46" text-anchor="middle" xml:space="preserve">Word 1（4 字节）</text>
  <text class="sm b muted" x="630" y="46" text-anchor="middle" xml:space="preserve">Word 2（4 字节）</text>
  <line class="ln-muted" x1="90" y1="38" x2="90" y2="54"/>
  <line class="ln-muted" x1="450" y1="38" x2="450" y2="54"/>
  <line class="ln-muted" x1="810" y1="38" x2="810" y2="54"/>
  <rect class="blue" x="90" y="56" width="90" height="44" rx="2"/>
  <text class="mono b" x="135" y="83" text-anchor="middle" xml:space="preserve">'H'</text>
  <rect class="blue" x="180" y="56" width="90" height="44" rx="2"/>
  <text class="mono b" x="225" y="83" text-anchor="middle" xml:space="preserve">'e'</text>
  <rect class="blue" x="270" y="56" width="90" height="44" rx="2"/>
  <text class="mono b" x="315" y="83" text-anchor="middle" xml:space="preserve">'l'</text>
  <rect class="blue" x="360" y="56" width="90" height="44" rx="2"/>
  <text class="mono b" x="405" y="83" text-anchor="middle" xml:space="preserve">'l'</text>
  <rect class="blue" x="450" y="56" width="90" height="44" rx="2"/>
  <text class="mono b" x="495" y="83" text-anchor="middle" xml:space="preserve">'o'</text>
  <rect class="ghost" x="540" y="56" width="90" height="44" rx="2"/>
  <text class="mono sm muted" x="585" y="83" text-anchor="middle" xml:space="preserve">pad</text>
  <rect class="ghost" x="630" y="56" width="90" height="44" rx="2"/>
  <text class="mono sm muted" x="675" y="83" text-anchor="middle" xml:space="preserve">pad</text>
  <rect class="ghost" x="720" y="56" width="90" height="44" rx="2"/>
  <text class="mono sm muted" x="765" y="83" text-anchor="middle" xml:space="preserve">pad</text>
  <line class="ln-acc" x1="90" y1="52" x2="90" y2="104"/>
  <line class="ln-acc" x1="450" y1="52" x2="450" y2="104"/>
  <line class="ln-acc" x1="810" y1="52" x2="810" y2="104"/>
  <text class="mono sm muted" x="135" y="120" text-anchor="middle" xml:space="preserve">byte 0</text>
  <text class="mono sm muted" x="225" y="120" text-anchor="middle" xml:space="preserve">byte 1</text>
  <text class="mono sm muted" x="315" y="120" text-anchor="middle" xml:space="preserve">byte 2</text>
  <text class="mono sm muted" x="405" y="120" text-anchor="middle" xml:space="preserve">byte 3</text>
  <text class="mono sm muted" x="495" y="120" text-anchor="middle" xml:space="preserve">byte 4</text>
  <text class="mono sm muted" x="585" y="120" text-anchor="middle" xml:space="preserve">byte 5</text>
  <text class="mono sm muted" x="675" y="120" text-anchor="middle" xml:space="preserve">byte 6</text>
  <text class="mono sm muted" x="765" y="120" text-anchor="middle" xml:space="preserve">byte 7</text>
  <polyline class="ln-acc" points="542,132 542,138 808,138 808,132"/>
  <text class="sm acc-t b" x="675" y="156" text-anchor="middle" xml:space="preserve">3 字节未使用填充（对齐下一字边界）</text>
  <rect class="plain" x="40" y="176" width="820" height="44" rx="6"/>
  <text class="sm" x="56" y="202" xml:space="preserve">C/C++ 对照：若算上末尾 '\0'（"Hello\0" 占 6 字节），则只需补 2 字节填充即可凑齐 8 字节；填充字节不属于字符串内容。</text>
</svg>