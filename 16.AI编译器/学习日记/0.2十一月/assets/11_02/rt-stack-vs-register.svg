<svg xmlns="http://www.w3.org/2000/svg" width="932" height="362" viewBox="-16 -16 932 362" role="img" aria-label="栈式机器与寄存器机器指令对比。计算 7 + 5 都需要 3 条指令，但栈式机器的 add 没有操作数槽位，而寄存器机器的 add 有 3 个槽位。计算 a + b 时若值已在寄存器里，寄存器机器 1 条 add 即可完成，栈式机器则需重新压栈，共需 3 条指令。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="932" height="362" rx="14" fill="rgb(245, 244, 237)"/>
  <defs><marker id="rt-stack-vs-register-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-stack-vs-register-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rt-stack-vs-register-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="430" height="330" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">栈式机器：指令中不写位置</text>
  <rect class="box" x="470" y="0" width="430" height="330" rx="8"/>
  <text class="b" x="486" y="26" xml:space="preserve">寄存器机器：显式写出寄存器位置</text>
  <text class="mono b" x="16" y="54" xml:space="preserve">7 + 5</text>
  <text class="mono b" x="16" y="186" xml:space="preserve">a + b</text>
  <text class="mono b" x="486" y="54" xml:space="preserve">7 + 5</text>
  <text class="mono b" x="486" y="186" xml:space="preserve">a + b</text>
  <text class="sm muted" x="64" y="186" xml:space="preserve">（a、b 已算好时）</text>
  <text class="sm muted" x="534" y="186" xml:space="preserve">（a、b 已在 r1、r2 中时）</text>
  <rect class="blue" x="24" y="64" width="64" height="28" rx="3"/>
  <text class="mono sm" x="56.0" y="82.0" text-anchor="middle" xml:space="preserve">push</text>
  <rect class="box" x="88" y="64" width="44" height="28" rx="3"/>
  <text class="mono sm" x="110.0" y="82.0" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="blue" x="24" y="98" width="64" height="28" rx="3"/>
  <text class="mono sm" x="56.0" y="116.0" text-anchor="middle" xml:space="preserve">push</text>
  <rect class="box" x="88" y="98" width="44" height="28" rx="3"/>
  <text class="mono sm" x="110.0" y="116.0" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="blue" x="24" y="132" width="64" height="28" rx="3"/>
  <text class="mono sm" x="56.0" y="150.0" text-anchor="middle" xml:space="preserve">add</text>
  <text class="sm" x="200" y="102" xml:space="preserve">共 3 条指令</text>
  <rect class="blue" x="494" y="64" width="64" height="28" rx="3"/>
  <text class="mono sm" x="526.0" y="82.0" text-anchor="middle" xml:space="preserve">li</text>
  <rect class="box" x="558" y="64" width="44" height="28" rx="3"/>
  <text class="mono sm" x="580.0" y="82.0" text-anchor="middle" xml:space="preserve">r1</text>
  <rect class="box" x="602" y="64" width="44" height="28" rx="3"/>
  <text class="mono sm" x="624.0" y="82.0" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="blue" x="494" y="98" width="64" height="28" rx="3"/>
  <text class="mono sm" x="526.0" y="116.0" text-anchor="middle" xml:space="preserve">li</text>
  <rect class="box" x="558" y="98" width="44" height="28" rx="3"/>
  <text class="mono sm" x="580.0" y="116.0" text-anchor="middle" xml:space="preserve">r2</text>
  <rect class="box" x="602" y="98" width="44" height="28" rx="3"/>
  <text class="mono sm" x="624.0" y="116.0" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="blue" x="494" y="132" width="64" height="28" rx="3"/>
  <text class="mono sm" x="526.0" y="150.0" text-anchor="middle" xml:space="preserve">add</text>
  <rect class="box" x="558" y="132" width="44" height="28" rx="3"/>
  <text class="mono sm" x="580.0" y="150.0" text-anchor="middle" xml:space="preserve">r3</text>
  <rect class="box" x="602" y="132" width="44" height="28" rx="3"/>
  <text class="mono sm" x="624.0" y="150.0" text-anchor="middle" xml:space="preserve">r1</text>
  <rect class="box" x="646" y="132" width="44" height="28" rx="3"/>
  <text class="mono sm" x="668.0" y="150.0" text-anchor="middle" xml:space="preserve">r2</text>
  <text class="sm" x="706" y="102" xml:space="preserve">共 3 条指令</text>
  <rect class="blue" x="24" y="198" width="64" height="28" rx="3"/>
  <text class="mono sm" x="56.0" y="216.0" text-anchor="middle" xml:space="preserve">load</text>
  <rect class="box" x="88" y="198" width="44" height="28" rx="3"/>
  <text class="mono sm" x="110.0" y="216.0" text-anchor="middle" xml:space="preserve">a</text>
  <rect class="blue" x="24" y="232" width="64" height="28" rx="3"/>
  <text class="mono sm" x="56.0" y="250.0" text-anchor="middle" xml:space="preserve">load</text>
  <rect class="box" x="88" y="232" width="44" height="28" rx="3"/>
  <text class="mono sm" x="110.0" y="250.0" text-anchor="middle" xml:space="preserve">b</text>
  <rect class="blue" x="24" y="266" width="64" height="28" rx="3"/>
  <text class="mono sm" x="56.0" y="284.0" text-anchor="middle" xml:space="preserve">add</text>
  <text class="sm" x="200" y="236" xml:space="preserve">共 3 条指令：每次都要</text>
  <text class="sm" x="200" y="254" xml:space="preserve">把值重新压入栈顶</text>
  <rect class="blue" x="494" y="198" width="64" height="28" rx="3"/>
  <text class="mono sm" x="526.0" y="216.0" text-anchor="middle" xml:space="preserve">add</text>
  <rect class="box" x="558" y="198" width="44" height="28" rx="3"/>
  <text class="mono sm" x="580.0" y="216.0" text-anchor="middle" xml:space="preserve">r3</text>
  <rect class="box" x="602" y="198" width="44" height="28" rx="3"/>
  <text class="mono sm" x="624.0" y="216.0" text-anchor="middle" xml:space="preserve">r1</text>
  <rect class="box" x="646" y="198" width="44" height="28" rx="3"/>
  <text class="mono sm" x="668.0" y="216.0" text-anchor="middle" xml:space="preserve">r2</text>
  <text class="sm" x="494" y="252" xml:space="preserve">仅 1 条指令：值本就在寄存器里，</text>
  <text class="sm" x="494" y="270" xml:space="preserve">可以直接相加</text>
  <text class="sm b" x="16" y="316" xml:space="preserve">add：0 个操作数槽位 → 指令短且紧凑</text>
  <text class="sm b" x="486" y="316" xml:space="preserve">add r3, r1, r2：3 个槽位 → 指令较长但可复用值</text>
</svg>