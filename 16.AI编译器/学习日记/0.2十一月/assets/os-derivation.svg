<svg xmlns="http://www.w3.org/2000/svg" width="992" height="300" viewBox="-16 -16 992 300" role="img" aria-label="{ x ← 7 + 5; 4; } 的推导树。E = [x : l]，初始 S = [l → 0]。最上方 7 和 5 分别求值为 Int(7) 与 Int(5)，存储不变。加法规则推导出 7 + 5 为 Int(12)。结合 E(x) = l 与 [l → 12] = [l → 0][Int(12)/l]，赋值规则得出 x ← 7 + 5 : Int(12), [l → 12]。4 在更新后的存储 [l → 12] 中求值，顺序表达式规则最终得出结果 Int(4) 与存储 [l → 12]。">
  <style>
    text { fill: #141413; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="992" height="300" rx="14" fill="#F0EEE6"/>
  <defs><marker id="os-derivation-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-derivation-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="os-derivation-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="18" xml:space="preserve">{ x ← 7 + 5; 4; } 的推导树 (Slide 34–36)</text>
  <text class="sm muted" x="0" y="38" xml:space="preserve">E = [x : l]，初始 S = [l → 0]。横线上方为前提，下方为结论</text>
  <text class="mono sm" x="0" y="74" xml:space="preserve">so, E, <tspan class="blue-t">[l → 0]</tspan> ⊢ 7 : Int(7), <tspan class="blue-t">[l → 0]</tspan></text>
  <text class="mono sm" x="272" y="74" xml:space="preserve">so, E, <tspan class="blue-t">[l → 0]</tspan> ⊢ 5 : Int(5), <tspan class="blue-t">[l → 0]</tspan></text>
  <line class="ln" x1="0" y1="84" x2="520" y2="84"/>
  <text class="mono sm muted" x="528" y="88" xml:space="preserve">[Add]</text>
  <text class="mono sm" x="120" y="108" xml:space="preserve">so, E, <tspan class="blue-t">[l → 0]</tspan> ⊢ 7 + 5 : Int(12), <tspan class="blue-t">[l → 0]</tspan></text>
  <text class="mono sm" x="430" y="108" xml:space="preserve">E(x) = l</text>
  <text class="mono sm" x="516" y="108" xml:space="preserve"><tspan class="acc-t b">[l → 12]</tspan> = <tspan class="blue-t">[l → 0]</tspan>[Int(12)/l]</text>
  <line class="ln" x1="120" y1="118" x2="740" y2="118"/>
  <text class="mono sm muted" x="748" y="122" xml:space="preserve">[Assign]</text>
  <text class="mono sm" x="240" y="142" xml:space="preserve">so, E, <tspan class="blue-t">[l → 0]</tspan> ⊢ x ← 7 + 5 : Int(12), <tspan class="acc-t b">[l → 12]</tspan></text>
  <text class="mono sm" x="600" y="142" xml:space="preserve">so, E, <tspan class="acc-t b">[l → 12]</tspan> ⊢ 4 : Int(4), <tspan class="acc-t b">[l → 12]</tspan></text>
  <line class="ln" x1="240" y1="152" x2="860" y2="152"/>
  <text class="mono sm muted" x="868" y="156" xml:space="preserve">[Seq]</text>
  <text class="mono sm" x="366" y="176" xml:space="preserve">so, E, <tspan class="blue-t">[l → 0]</tspan> ⊢ { x ← 7 + 5; 4; } : Int(4), <tspan class="acc-t b">[l → 12]</tspan></text>
  <line class="ln-muted" x1="0" y1="196" x2="960" y2="196"/>
  <rect class="blue" x="0" y="212" width="18" height="12" rx="3"/>
  <text class="sm" x="24" y="222" xml:space="preserve">赋值前存储 [l → 0]</text>
  <rect class="acc" x="158.46" y="212" width="18" height="12" rx="3"/>
  <text class="sm" x="182.46" y="222" xml:space="preserve">赋值后存储 [l → 12]</text>
  <text class="sm" x="0" y="246" xml:space="preserve">[l → 0] 在 7、5、7 + 5 求值过程中原样传递，赋值语句将其更新为 [l → 12]，随后传给 4 求值。</text>
  <text class="sm muted" x="0" y="266" xml:space="preserve">顺序表达式仅将最后一个表达式的值 Int(4) 作为结果，前面表达式的副作用全部保留在存储中。so 与 E 在整棵树中保持不变。</text>
</svg>
