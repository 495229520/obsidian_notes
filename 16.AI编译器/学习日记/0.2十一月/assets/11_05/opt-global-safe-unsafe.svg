<svg xmlns="http://www.w3.org/2000/svg" width="972" height="422" viewBox="-16 -16 972 422" role="img" aria-label="全局常量传播的安全情形与不安全情形对比。两组 CFG 均在 X := 3, if (B &gt; 0) 处分流为 Y := Z + W 与 Y := 0 两个分支，并在 A := 2 * X 处合流。在安全传播中，所有前驱路径上 X 均为 3，合流处 lub(3, 3) = 3，可安全代换为 2 * 3；在不安全传播中，左分支覆盖赋值 X := 4 产生路径冲突，合流处 X 可能为 3 或 4，lub(4, 3) = ⊤，禁止常量代换。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="972" height="422" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-global-safe-unsafe-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-global-safe-unsafe-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-global-safe-unsafe-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="225" y="14" text-anchor="middle" xml:space="preserve">【安全传播情形】</text>
  <text class="sm muted" x="225" y="34" text-anchor="middle" xml:space="preserve">所有前驱路径到达此处时 X 恒等于 3</text>
  <rect class="plain" x="150" y="50" width="150" height="50" rx="8"/>
  <text class="mono" x="225.0" y="70.4" text-anchor="middle" xml:space="preserve">X := 3</text>
  <text class="mono" x="225.0" y="88.6" text-anchor="middle" xml:space="preserve">if (B &gt; 0)</text>
  <rect class="plain" x="20" y="160" width="150" height="56" rx="8"/>
  <text class="mono" x="95" y="192" text-anchor="middle" xml:space="preserve">Y := Z + W</text>
  <rect class="plain" x="280" y="160" width="150" height="56" rx="8"/>
  <text class="mono" x="355.0" y="192.5" text-anchor="middle" xml:space="preserve">Y := 0</text>
  <rect class="blue" x="150" y="290" width="150" height="40" rx="8"/>
  <text class="mono b" x="225.0" y="314.5" text-anchor="middle" xml:space="preserve">A := 2 * X</text>
  <polyline class="ln" points="205,100 205,126 95,126 95,158" marker-end="url(#opt-global-safe-unsafe-a)"/>
  <polyline class="ln" points="245,100 245,126 355,126 355,158" marker-end="url(#opt-global-safe-unsafe-a)"/>
  <polyline class="ln" points="95,216 95,260 205,260 205,288" marker-end="url(#opt-global-safe-unsafe-a)"/>
  <polyline class="ln" points="355,216 355,260 245,260 245,288" marker-end="url(#opt-global-safe-unsafe-a)"/>
  <text class="mono sm b blue-t" x="103" y="148" xml:space="preserve">X = 3</text>
  <text class="mono sm b blue-t" x="363" y="148" xml:space="preserve">X = 3</text>
  <text class="mono sm b blue-t" x="103" y="244" xml:space="preserve">X = 3</text>
  <text class="mono sm b blue-t" x="363" y="244" xml:space="preserve">X = 3</text>
  <text class="mono sm b blue-t" x="312" y="315" xml:space="preserve">lub(3, 3) = 3</text>
  <text class="sm" x="225" y="362" text-anchor="middle" xml:space="preserve">合流点处 X 恒为 3，</text>
  <text class="sm b blue-t" x="225" y="382" text-anchor="middle" xml:space="preserve">可安全代换为 2 * 3</text>
  <line class="ln-muted" x1="470" y1="20" x2="470" y2="380"/>
  <text class="b" x="715" y="14" text-anchor="middle" xml:space="preserve">【不安全传播情形】</text>
  <text class="sm acc-t" x="715" y="34" text-anchor="middle" xml:space="preserve">左分支赋值 X = 4 产生路径冲突</text>
  <rect class="plain" x="640" y="50" width="150" height="50" rx="8"/>
  <text class="mono" x="715.0" y="70.4" text-anchor="middle" xml:space="preserve">X := 3</text>
  <text class="mono" x="715.0" y="88.6" text-anchor="middle" xml:space="preserve">if (B &gt; 0)</text>
  <rect class="acc" x="510" y="160" width="150" height="56" rx="8"/>
  <text class="mono" x="585" y="182" text-anchor="middle" xml:space="preserve">Y := Z + W</text>
  <text class="mono b acc-t" x="585" y="204" text-anchor="middle" xml:space="preserve">X := 4 (!)</text>
  <rect class="plain" x="770" y="160" width="150" height="56" rx="8"/>
  <text class="mono" x="845.0" y="192.5" text-anchor="middle" xml:space="preserve">Y := 0</text>
  <rect class="acc" x="640" y="290" width="150" height="40" rx="8"/>
  <text class="mono b" x="715.0" y="314.5" text-anchor="middle" xml:space="preserve">A := 2 * X</text>
  <polyline class="ln" points="695,100 695,126 585,126 585,158" marker-end="url(#opt-global-safe-unsafe-a)"/>
  <polyline class="ln" points="735,100 735,126 845,126 845,158" marker-end="url(#opt-global-safe-unsafe-a)"/>
  <polyline class="ln-acc" points="585,216 585,260 695,260 695,288" marker-end="url(#opt-global-safe-unsafe-acc)"/>
  <polyline class="ln" points="845,216 845,260 735,260 735,288" marker-end="url(#opt-global-safe-unsafe-a)"/>
  <text class="mono sm b blue-t" x="593" y="148" xml:space="preserve">X = 3</text>
  <text class="mono sm b blue-t" x="853" y="148" xml:space="preserve">X = 3</text>
  <text class="mono sm b blue-t" x="593" y="244" xml:space="preserve">X = 4</text>
  <text class="mono sm b blue-t" x="853" y="244" xml:space="preserve">X = 3</text>
  <text class="mono sm b acc-t" x="802" y="315" xml:space="preserve">lub(4, 3) = ⊤</text>
  <text class="sm" x="715" y="362" text-anchor="middle" xml:space="preserve">合流点处 X 既可能为 3 也可能为 4，</text>
  <text class="sm b acc-t" x="715" y="382" text-anchor="middle" xml:space="preserve">属于非常量（禁止常量代换！）</text>
</svg>
