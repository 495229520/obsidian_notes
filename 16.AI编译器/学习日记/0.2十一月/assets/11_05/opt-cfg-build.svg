<svg xmlns="http://www.w3.org/2000/svg" width="972" height="362" viewBox="-16 -16 972 362" role="img" aria-label="指令序列切分为基本块并构建控制流图的过程。示例为 CS143 slide 23：1: x := 1, 2: i := 1, 3: L: x := x * x, 4: i := i + 1, 5: if i &lt; 10 goto L。首领指令（Leader）分为三类：程序第一条指令（1 号）、跳转目标标号指令（3 号）、跳转指令紧随的下一条（6 号）。从首领到下一首领前一条为一个基本块，因此 B1 为 1-2 号，B2 为 3-5 号。右侧控制流图中，起点进入 B1，B1 顺延到 B2，B2 在 i &lt; 10 时通过回边循环回自身，i ≥ 10 时流向出口。">
  <style>
    text { fill: #141413; font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
    .ghost { fill: #F0EEE6; stroke: #B0AEA5; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <rect x="-16" y="-16" width="972" height="362" rx="14" fill="#F0EEE6"/>
  <defs><marker id="opt-cfg-build-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-cfg-build-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="opt-cfg-build-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="b" x="0" y="14" xml:space="preserve">① 指令序列与首领指令（Leader）划分</text>
  <text class="mono sm muted" x="14" y="50" xml:space="preserve">1</text>
  <text class="mono" x="40" y="50" xml:space="preserve">x := 1</text>
  <rect class="acc" x="230.0" y="35.0" width="140" height="22" rx="6"/>
  <text class="sm acc-t" x="300" y="50.5" text-anchor="middle" xml:space="preserve">首领 ① 程序首条指令</text>
  <text class="mono sm muted" x="14" y="84" xml:space="preserve">2</text>
  <text class="mono" x="40" y="84" xml:space="preserve">i := 1</text>
  <text class="mono sm muted" x="14" y="118" xml:space="preserve">3</text>
  <text class="mono" x="40" y="118" xml:space="preserve">L: x := x * x</text>
  <rect class="acc" x="230.0" y="103.0" width="140" height="22" rx="6"/>
  <text class="sm acc-t" x="300" y="118.5" text-anchor="middle" xml:space="preserve">首领 ② 跳转目标指令</text>
  <text class="mono sm muted" x="14" y="152" xml:space="preserve">4</text>
  <text class="mono" x="40" y="152" xml:space="preserve">i := i + 1</text>
  <text class="mono sm muted" x="14" y="186" xml:space="preserve">5</text>
  <text class="mono" x="40" y="186" xml:space="preserve">if i &lt; 10 goto L</text>
  <text class="mono sm muted" x="14" y="220" xml:space="preserve">6</text>
  <text class="mono muted" x="40" y="220" xml:space="preserve">(后续代码)</text>
  <rect class="acc" x="230.0" y="205.0" width="140" height="22" rx="6"/>
  <text class="sm acc-t" x="300" y="220.5" text-anchor="middle" xml:space="preserve">首领 ③ 紧随跳转后的指令</text>
  <polyline class="ln-blue" points="196,34 204,34 204,92 196,92"/>
  <text class="mono sm b blue-t" x="214" y="67.0" xml:space="preserve">B1</text>
  <polyline class="ln-blue" points="196,102 204,102 204,228 196,228"/>
  <text class="mono sm b blue-t" x="214" y="169.0" xml:space="preserve">B2</text>
  <text class="sm" x="0" y="290" xml:space="preserve">从首领指令开始到下一个首领指令之前，构成一个基本块。</text>
  <text class="sm muted" x="0" y="310" xml:space="preserve">块尾为跳转指令则指向目标标号；条件分支或普通顺延则向后继块连接边。</text>
  <line class="ln-muted" x1="400" y1="30" x2="400" y2="270"/>
  <text class="b" x="424" y="14" xml:space="preserve">② 控制流图（Control Flow Graph, CFG）</text>
  <rect class="ghost" x="560" y="30" width="80" height="26" rx="8"/>
  <text class="sm" x="600.0" y="47.5" text-anchor="middle" xml:space="preserve">入口</text>
  <line class="ln" x1="600" y1="56" x2="600" y2="74" marker-end="url(#opt-cfg-build-a)"/>
  <rect class="blue" x="520" y="76" width="160" height="56" rx="8"/>
  <text class="mono sm b blue-t" x="532" y="96" xml:space="preserve">B1</text>
  <text class="mono sm" x="560" y="98" xml:space="preserve">x := 1</text>
  <text class="mono sm" x="560" y="118" xml:space="preserve">i := 1</text>
  <line class="ln-blue" x1="600" y1="132" x2="600" y2="154" marker-end="url(#opt-cfg-build-blue)"/>
  <rect class="blue" x="500" y="156" width="200" height="76" rx="8"/>
  <text class="mono sm b blue-t" x="512" y="176" xml:space="preserve">B2</text>
  <text class="mono sm" x="540" y="178" xml:space="preserve">L: x := x * x</text>
  <text class="mono sm" x="540" y="198" xml:space="preserve">i := i + 1</text>
  <text class="mono sm" x="540" y="218" xml:space="preserve">if i &lt; 10 goto L</text>
  <polyline class="ln-acc" points="700,214 760,214 760,170 702,170" marker-end="url(#opt-cfg-build-acc)"/>
  <text class="sm acc-t" x="768" y="196" xml:space="preserve">i &lt; 10（回边 / Back-edge）</text>
  <line class="ln" x1="600" y1="232" x2="600" y2="262" marker-end="url(#opt-cfg-build-a)"/>
  <rect class="ghost" x="548" y="264" width="104" height="26" rx="8"/>
  <text class="sm" x="600.0" y="281.5" text-anchor="middle" xml:space="preserve">出口</text>
  <text class="sm muted" x="612" y="252" xml:space="preserve">i ≥ 10</text>
</svg>
