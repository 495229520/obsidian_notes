<svg xmlns="http://www.w3.org/2000/svg" width="812" height="268" viewBox="-16 -16 812 268" role="img" aria-label="스택 하나로 w c w를 비교할 수 없는 이유. 먼저 넣은 a b를 꺼내면 b a 순서로 나와 두 번째 w의 a와 비교할 수 없다. 뒤집힌 w c w^R은 꺼내는 순서와 맞아 스택으로 처리된다">
