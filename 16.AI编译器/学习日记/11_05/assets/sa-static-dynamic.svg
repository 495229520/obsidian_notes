<svg xmlns="http://www.w3.org/2000/svg" width="912" height="292" viewBox="-16 -16 912 292" role="img" aria-label="정적 스코프와 동적 스코프에서 f 안의 a를 찾는 경로. 정적 스코프는 f가 정의된 바깥 환경을 보고 a가 없어 컴파일 오류가 된다. 동적 스코프는 실행 중 호출 스택을 따라 g의 a = 4를 찾는다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="912" height="292" rx="14" fill="#F0EEE6"/>
  <defs><marker id="sa-static-dynamic-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-static-dynamic-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-static-dynamic-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="420" height="260" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">정적 스코프: 코드의 중첩을 본다</text>
  <rect class="plain" x="16" y="44" width="388" height="160" rx="8"/>
  <text class="sm muted" x="28" y="64" xml:space="preserve">전역: g, f</text>
  <rect class="box" x="32" y="76" width="190" height="54" rx="8"/>
  <text class="mono sm" x="127.0" y="107.5" text-anchor="middle" xml:space="preserve">g(y) = let a &lt;- 4 in f(3);</text>
  <rect class="acc" x="32" y="140" width="190" height="50" rx="8"/>
  <text class="mono sm" x="127.0" y="169.5" text-anchor="middle" xml:space="preserve">f(x) = a;</text>
  <text class="sm" x="236" y="160" xml:space="preserve">① f 안에 a? 없음 (x뿐)</text>
  <text class="sm" x="236" y="182" xml:space="preserve">② 전역에 a? 없음</text>
  <text class="b acc-t" x="16" y="228" xml:space="preserve">③ 미선언 오류: 실행 전에 보고한다</text>
  <text class="sm muted" x="16" y="248" xml:space="preserve">g 안의 a는 f의 바깥이 아니라서 보이지 않는다</text>
  <rect class="box" x="460" y="0" width="420" height="260" rx="8"/>
  <text class="b" x="476" y="26" xml:space="preserve">동적 스코프: 실행 중 호출 관계를 본다</text>
  <text class="sm muted" x="476" y="54" xml:space="preserve">호출 스택 (위가 최근)</text>
  <rect class="acc" x="476" y="64" width="200" height="50" rx="8"/>
  <text class="sm muted" x="576.0" y="84.4" text-anchor="middle" xml:space="preserve">f 프레임</text>
  <text class="mono sm" x="576.0" y="102.6" text-anchor="middle" xml:space="preserve">x = 3</text>
  <rect class="blue" x="476" y="118" width="200" height="50" rx="8"/>
  <text class="sm muted" x="576.0" y="138.4" text-anchor="middle" xml:space="preserve">g 프레임</text>
  <text class="mono sm" x="576.0" y="156.6" text-anchor="middle" xml:space="preserve">y, a = 4</text>
  <line class="ln" x1="470" y1="174" x2="682" y2="174"/>
  <text class="sm" x="690" y="94" xml:space="preserve">① f 프레임에 a? 없음</text>
  <text class="sm" x="690" y="148" xml:space="preserve">② g 프레임에 a = 4</text>
  <text class="b blue-t" x="476" y="228" xml:space="preserve">③ f(3)은 4를 돌려준다</text>
  <text class="sm muted" x="476" y="248" xml:space="preserve">다른 곳에서 f를 부르면 결과가 달라진다</text>
</svg>
