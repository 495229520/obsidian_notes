<svg xmlns="http://www.w3.org/2000/svg" width="892" height="258" viewBox="-16 -16 892 258" role="img" aria-label="SELF_TYPE_C는 C 또는 C의 자식 중 하나를 뜻한다. 그래서 SELF_TYPE_C ≤ C이고 C ≤ T이면 SELF_TYPE_C ≤ T다. 반대로 일반 클래스 T ≤ SELF_TYPE_C는 T = C여도 성립하지 않는다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="892" height="258" rx="14" fill="#F0EEE6"/>
  <defs><marker id="sa-selftype-order-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-selftype-order-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-selftype-order-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="45.0" y="5" width="150" height="30" rx="6"/>
  <text class="mono" x="120" y="24.5" text-anchor="middle" xml:space="preserve">Object</text>
  <rect class="plain" x="45.0" y="57" width="150" height="30" rx="6"/>
  <text class="mono" x="120" y="76.5" text-anchor="middle" xml:space="preserve">… 조상 T …</text>
  <line class="ln" x1="120" y1="57" x2="120" y2="37" marker-end="url(#sa-selftype-order-a)"/>
  <rect class="acc" x="45.0" y="109" width="150" height="30" rx="6"/>
  <text class="mono" x="120" y="128.5" text-anchor="middle" xml:space="preserve">C</text>
  <line class="ln" x1="120" y1="109" x2="120" y2="89" marker-end="url(#sa-selftype-order-a)"/>
  <rect class="bad" x="20" y="162" width="200" height="62" rx="8"/>
  <text class="mono b" x="120" y="186" text-anchor="middle" xml:space="preserve">SELF_TYPE_C</text>
  <text class="sm" x="120" y="208" text-anchor="middle" xml:space="preserve">C 또는 C의 자식 하나</text>
  <line class="ln" x1="120" y1="162" x2="120" y2="141" marker-end="url(#sa-selftype-order-a)"/>
  <text class="sm muted" x="204" y="98" xml:space="preserve">↑ ≤</text>
  <rect class="plain" x="300" y="0" width="560" height="226" rx="8"/>
  <text class="mono sm" x="320" y="34" xml:space="preserve">SELF_TYPE_C ≤ SELF_TYPE_C</text>
  <text class="sm b blue-t" x="600" y="34" xml:space="preserve">참</text>
  <text class="mono sm" x="320" y="74" xml:space="preserve">SELF_TYPE_C ≤ T</text>
  <text class="sm b blue-t" x="600" y="74" xml:space="preserve">C ≤ T일 때 참</text>
  <text class="mono sm" x="320" y="114" xml:space="preserve">T ≤ SELF_TYPE_C</text>
  <text class="sm b acc-t" x="600" y="114" xml:space="preserve">항상 거짓 (T = C여도)</text>
  <text class="mono sm" x="320" y="154" xml:space="preserve">lub(SELF_TYPE_C, SELF_TYPE_C)</text>
  <text class="sm b blue-t" x="600" y="154" xml:space="preserve">= SELF_TYPE_C</text>
  <text class="mono sm" x="320" y="194" xml:space="preserve">lub(SELF_TYPE_C, T)</text>
  <text class="sm b blue-t" x="600" y="194" xml:space="preserve">= lub(C, T)</text>
  <text class="sm muted" x="320" y="212" xml:space="preserve">T = C여도 거짓인 이유: self가 C의 자식일 수 있다</text>
</svg>
