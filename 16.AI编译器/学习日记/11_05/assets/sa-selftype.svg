<svg xmlns="http://www.w3.org/2000/svg" width="932" height="294" viewBox="-16 -16 932 294" role="img" aria-label="inc의 반환 타입을 Count로 적으면 (new Stock).inc()의 정적 타입이 Count가 되어 a: Stock 초기화가 실패한다. SELF_TYPE으로 적으면 호출식의 타입이 수신 식의 타입 Stock이 되어 통과한다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="932" height="294" rx="14" fill="#F0EEE6"/>
  <defs><marker id="sa-selftype-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-selftype-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-selftype-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="box" x="0" y="0" width="430" height="262" rx="8"/>
  <text class="b" x="16" y="26" xml:space="preserve">inc(): Count</text>
  <rect class="acc" x="30.0" y="43.0" width="370" height="26" rx="6"/>
  <text class="mono" x="215.0" y="60.5" text-anchor="middle" xml:space="preserve">a: Stock &lt;- (new Stock).inc()</text>
  <text class="sm muted" x="16" y="104" xml:space="preserve">수신 식 타입</text>
  <rect class="plain" x="140" y="88" width="274" height="30" rx="5"/>
  <text class="mono sm" x="277.0" y="107.5" text-anchor="middle" xml:space="preserve">T₀ = Stock</text>
  <text class="sm muted" x="16" y="144" xml:space="preserve">선언된 반환</text>
  <rect class="plain" x="140" y="128" width="274" height="30" rx="5"/>
  <text class="mono sm" x="277.0" y="147.5" text-anchor="middle" xml:space="preserve">Count</text>
  <text class="sm muted" x="16" y="184" xml:space="preserve">호출식 타입</text>
  <rect class="bad" x="140" y="168" width="274" height="30" rx="5"/>
  <text class="mono sm" x="277.0" y="187.5" text-anchor="middle" xml:space="preserve">Count (자식 정보가 사라짐)</text>
  <text class="sm muted" x="16" y="224" xml:space="preserve">초기화 검사</text>
  <rect class="bad" x="140" y="208" width="274" height="30" rx="5"/>
  <text class="mono sm" x="277.0" y="227.5" text-anchor="middle" xml:space="preserve">Count ≤ Stock ?  거짓 → 오류</text>
  <rect class="box" x="470" y="0" width="430" height="262" rx="8"/>
  <text class="b" x="486" y="26" xml:space="preserve">inc(): SELF_TYPE</text>
  <rect class="acc" x="500.0" y="43.0" width="370" height="26" rx="6"/>
  <text class="mono" x="685.0" y="60.5" text-anchor="middle" xml:space="preserve">a: Stock &lt;- (new Stock).inc()</text>
  <text class="sm muted" x="486" y="104" xml:space="preserve">수신 식 타입</text>
  <rect class="plain" x="610" y="88" width="274" height="30" rx="5"/>
  <text class="mono sm" x="747.0" y="107.5" text-anchor="middle" xml:space="preserve">T₀ = Stock</text>
  <text class="sm muted" x="486" y="144" xml:space="preserve">선언된 반환</text>
  <rect class="plain" x="610" y="128" width="274" height="30" rx="5"/>
  <text class="mono sm" x="747.0" y="147.5" text-anchor="middle" xml:space="preserve">SELF_TYPE</text>
  <text class="sm muted" x="486" y="184" xml:space="preserve">호출식 타입</text>
  <rect class="blue" x="610" y="168" width="274" height="30" rx="5"/>
  <text class="mono sm" x="747.0" y="187.5" text-anchor="middle" xml:space="preserve">T₀ = Stock ([Dispatch-Self])</text>
  <text class="sm muted" x="486" y="224" xml:space="preserve">초기화 검사</text>
  <rect class="blue" x="610" y="208" width="274" height="30" rx="5"/>
  <text class="mono sm" x="747.0" y="227.5" text-anchor="middle" xml:space="preserve">Stock ≤ Stock  참 → 통과</text>
</svg>
