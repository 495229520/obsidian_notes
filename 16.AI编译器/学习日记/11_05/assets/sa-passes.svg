<svg xmlns="http://www.w3.org/2000/svg" width="932" height="294" viewBox="-16 -16 932 294" role="img" aria-label="의미 분석을 네 번의 순회로 나눈 예. 1차에서 클래스 이름을 모두 모으므로, 앞쪽 클래스 Foo가 뒤에 정의된 Bar를 써도 4차 검사에서 찾을 수 있다">
  <style>
    text { fill: #141413; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12.5px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sm { font-size: 11px; }
    .lg { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .muted { fill: #6F6D66; }
    .acc-t { fill: #B0532F; }
    .blue-t { fill: #3D6A97; }
    .box { fill: #FAF9F5; stroke: #B0AEA5; stroke-width: 1.2; }
    .plain { fill: #FAF9F5; stroke: #6F6D66; stroke-width: 1.2; }
    .acc { fill: #F5DDD1; stroke: #D97757; stroke-width: 1.5; }
    .blue { fill: #DCE7F2; stroke: #4F7FAF; stroke-width: 1.4; }
    .dead { fill: #E6E3D9; stroke: #B0AEA5; stroke-width: 1; }
    .bad { fill: #F5DDD1; stroke: #D97757; stroke-width: 2; stroke-dasharray: 5 3; }
    .ln { stroke: #6F6D66; stroke-width: 1.3; fill: none; }
    .ln-acc { stroke: #D97757; stroke-width: 1.8; fill: none; }
    .ln-blue { stroke: #4F7FAF; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #D97757; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .ln-muted { stroke: #B0AEA5; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .h { fill: #6F6D66; } .h-acc { fill: #D97757; } .h-blue { fill: #4F7FAF; }
  </style>
  <rect x="-16" y="-16" width="932" height="294" rx="14" fill="#F0EEE6"/>
  <defs><marker id="sa-passes-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-passes-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sa-passes-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="acc" x="0" y="0" width="204" height="116" rx="8"/>
  <text class="b" x="102.0" y="35.3" text-anchor="middle" xml:space="preserve">1차: 클래스 이름</text>
  <text x="102.0" y="53.4" text-anchor="middle" xml:space="preserve">모든 class 이름을</text>
  <text x="102.0" y="71.6" text-anchor="middle" xml:space="preserve">전역 표에 등록</text>
  <text x="102.0" y="89.7" text-anchor="middle" xml:space="preserve">중복 정의 검사</text>
  <rect class="box" x="232" y="0" width="204" height="116" rx="8"/>
  <text class="b" x="334.0" y="35.3" text-anchor="middle" xml:space="preserve">2차: 상속 관계</text>
  <text x="334.0" y="53.4" text-anchor="middle" xml:space="preserve">부모가 있는가</text>
  <text x="334.0" y="71.6" text-anchor="middle" xml:space="preserve">Int·String·Bool 금지</text>
  <text x="334.0" y="89.7" text-anchor="middle" xml:space="preserve">사이클이 없는가</text>
  <line class="ln" x1="204" y1="58" x2="230" y2="58" marker-end="url(#sa-passes-a)"/>
  <rect class="box" x="464" y="0" width="204" height="116" rx="8"/>
  <text class="b" x="566.0" y="35.3" text-anchor="middle" xml:space="preserve">3차: 멤버 시그니처</text>
  <text x="566.0" y="53.4" text-anchor="middle" xml:space="preserve">속성 타입</text>
  <text x="566.0" y="71.6" text-anchor="middle" xml:space="preserve">메서드 매개변수·반환</text>
  <text x="566.0" y="89.7" text-anchor="middle" xml:space="preserve">중복·오버라이드 검사</text>
  <line class="ln" x1="436" y1="58" x2="462" y2="58" marker-end="url(#sa-passes-a)"/>
  <rect class="acc" x="696" y="0" width="204" height="116" rx="8"/>
  <text class="b" x="798.0" y="35.3" text-anchor="middle" xml:space="preserve">4차: 본문 타입</text>
  <text x="798.0" y="53.4" text-anchor="middle" xml:space="preserve">표현식 후위 순회</text>
  <text x="798.0" y="71.6" text-anchor="middle" xml:space="preserve">지역 스코프 관리</text>
  <text x="798.0" y="89.7" text-anchor="middle" xml:space="preserve">타입 기록</text>
  <line class="ln" x1="668" y1="58" x2="694" y2="58" marker-end="url(#sa-passes-a)"/>
  <rect class="box" x="0" y="140" width="420" height="122" rx="8"/>
  <text class="mono" x="16.0" y="168" xml:space="preserve">class Foo {</text>
  <rect class="acc" x="41.0" y="176" width="174.75" height="22" rx="4"/>
  <text class="mono" x="47.0" y="192" xml:space="preserve">... let y: Bar in ...</text>
  <text class="mono" x="16.0" y="216" xml:space="preserve">};</text>
  <rect class="blue" x="10.0" y="224" width="151.5" height="22" rx="4"/>
  <text class="mono" x="16.0" y="240" xml:space="preserve">class Bar { ... };</text>
  <rect class="plain" x="448" y="140" width="452" height="122" rx="8"/>
  <text class="b" x="460" y="162.25" xml:space="preserve">전방 참조</text>
  <text x="460" y="183.0" xml:space="preserve">Foo를 검사할 때 Bar는 아직 텍스트에 나오지 않았다.</text>
  <text x="460" y="201.8" xml:space="preserve">한 번에 읽으며 판단하면 "Bar 미정의"로 잘못 보고한다.</text>
  <text class="blue-t b" x="460" y="220.5" xml:space="preserve">1차에서 Bar를 모아 두었으므로 4차에서 찾는다.</text>
</svg>
