<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二分查找动画 · 普通二分 / lower_bound / 旋转数组 / 二分答案</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#3E3D39;--muted:#5F5E5A;--faint:#8a887f;
  --line:#c9c7bf;--grid:#e2e0d7;
  --blue:#185FA5;--bluebg:#E6F1FB;
  --green:#0F6E56;--greenbg:#E1F5EE;
  --brown:#9A5B0E;--brownbg:#FAEEDA;
  --danger:#B3402F;--dangerbg:#F6E0DB;
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 44px;text-wrap:pretty;}
.wrap{max-width:1180px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.4px;}
header p{font-size:13px;color:var(--muted);margin-top:5px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.9em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
.tab{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 17px;cursor:pointer;transition:all .18s var(--ease);display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
.tab:hover{border-color:var(--muted);transform:translateY(-1px);}
.tab .t{font-weight:600;color:var(--ink);}
.tab .s{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 10px rgba(62,61,57,.18);}
.tab.on .t,.tab.on .s{color:var(--paper);}
.tab.on .s{opacity:.72;}

.layout{display:grid;grid-template-columns:626px 1fr;gap:26px;margin-top:22px;align-items:start;}
@media(max-width:1080px){.layout{grid-template-columns:1fr;}}
.viz{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:22px;min-height:452px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.viz .vcap{font-size:12px;color:var(--muted);margin-bottom:8px;}
.viz .vcap b{color:var(--ink);}
.tgt{text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted);margin:14px 0 4px;}
.tgt b{color:var(--danger);font-size:16px;}

/* ---- 索引单元格 ---- */
.cwrap{position:relative;}
.cellrow{display:flex;gap:8px;justify-content:center;position:relative;padding:22px 0 50px;flex-wrap:wrap;}
.cell{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:18px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--muted);position:relative;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),opacity var(--dur) var(--ease);}
.cell .idx{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:10px;color:var(--faint);font-weight:400;}
.cell.active{background:var(--panel);border-color:var(--muted);color:var(--ink);}
.cell.excl{opacity:.28;}
.cell.mid{background:var(--brownbg);border-color:var(--brown);color:var(--brown);box-shadow:0 0 0 4px rgba(154,91,14,.16);}
.cell.found{background:var(--greenbg);border-color:var(--green);color:var(--green);box-shadow:0 0 0 4px rgba(15,110,86,.2);}
.cell.ord{background:var(--bluebg);border-color:var(--blue);color:var(--blue);}
.cell.add{background:var(--brownbg);border-color:var(--brown);color:var(--brown);}
.cell.vph{border-style:dashed;color:var(--faint);opacity:.5;}
.cbadge{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:12px;font-weight:700;text-align:center;transition:left var(--dur) var(--ease),top var(--dur) var(--ease),opacity .25s;line-height:1.05;pointer-events:none;z-index:3;}
.cbadge .tri{font-size:9px;display:block;}
.cbadge.a{color:var(--blue);}.cbadge.m{color:var(--brown);}.cbadge.g{color:var(--green);}

.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:auto;padding-top:12px;flex-wrap:wrap;}
.legend .bl{color:var(--blue);}.legend .gr{color:var(--green);}.legend .br{color:var(--brown);}.legend .dg{color:var(--danger);}

/* ---- 二分答案：答案带 ---- */
.band{position:relative;height:52px;border-radius:10px;margin:46px 0 52px;border:1px solid var(--grid);display:flex;overflow:visible;}
.band .seg{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;transition:width var(--dur) var(--ease);}
.band .seg.f{background:var(--dangerbg);color:var(--danger);border-radius:9px 0 0 9px;}
.band .seg.t{background:var(--greenbg);color:var(--green);border-radius:0 9px 9px 0;}
.bmark{position:absolute;top:-34px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;font-weight:700;text-align:center;transition:left var(--dur) var(--ease),opacity .25s;z-index:3;}
.bmark .v{display:block;}
.bmark::after{content:"";position:absolute;left:50%;top:20px;width:1.5px;height:58px;background:currentColor;transform:translateX(-50%);opacity:.5;}
.bmark.l{color:var(--blue);}.bmark.r{color:var(--green);}.bmark.m{color:var(--brown);}
.loads{display:flex;gap:7px;justify-content:center;margin:10px 0 12px;}
.load{min-width:48px;height:48px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:15px;border:1.5px solid var(--line);border-radius:10px;transition:all var(--dur) var(--ease);}
.load.g0{background:var(--bluebg);border-color:var(--blue);color:var(--blue);}
.load.g1{background:var(--brownbg);border-color:var(--brown);color:var(--brown);}
.load.g2{background:var(--dangerbg);border-color:var(--danger);color:var(--danger);}
.load.g3{background:var(--greenbg);border-color:var(--green);color:var(--green);}
.verdict{text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:auto;padding-top:10px;}
.verdict b.t{color:var(--green);}.verdict b.f{color:var(--danger);}

/* ---- 右侧 ---- */
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:18px 20px;min-height:196px;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.chip{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;border:1px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cb{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.act{margin-top:14px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:9px 13px;border-radius:9px;}
.desc-body{margin-top:13px;font-size:13.5px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .bl{color:var(--blue);font-weight:600;}
.desc-body .gr{color:var(--green);font-weight:600;}
.desc-body .dg{color:var(--danger);font-weight:600;}
.desc-body .br{color:var(--brown);font-weight:600;}
.codebox{background:#2E2C27;border-radius:11px;padding:14px 17px;font-family:var(--mono);font-size:12px;line-height:1.65;color:#D8D5CC;white-space:pre;overflow-x:auto;box-shadow:0 2px 8px rgba(46,44,39,.18);}
.codebox .cmt{color:#8F8B80;} .codebox .kw{color:#E3A44C;}

.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.38;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:92px;}
.dots{display:flex;gap:7px;margin:0 auto;flex-wrap:wrap;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:48px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
<link rel="stylesheet" href="./算法动画题单.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>二分查找动画 · 四个核心套路</h1>
    <p>普通二分 / lower_bound 边界二分 / 旋转数组二分 / 二分答案　·　上方切主题，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <section class="viz" id="viz"></section>
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="act" id="stAct"></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
      <div class="codebox" id="codeBox"></div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
const viz=document.getElementById('viz');
function buildCells(container,values,badges,pfx){
  pfx=pfx||'c';
  let h='<div class="cellrow" id="crow-'+pfx+'">';
  values.forEach((v,i)=>{h+='<div class="cell" id="'+pfx+i+'"><span class="idx">'+i+'</span><span class="v">'+v+'</span></div>';});
  (badges||[]).forEach(b=>{h+='<div class="cbadge '+b.cls+'" id="bdg-'+pfx+'-'+b.name+'" style="opacity:0"><span class="tri">▲</span>'+b.label+'</div>';});
  h+='</div>';
  container.innerHTML=h;
}
function setCell(pfx,i,cls){const el=document.getElementById(pfx+i);if(!el)return;el.className='cell '+cls;}
function moveBadges(pfx,list){const occ={};list.forEach(p=>{const el=document.getElementById('bdg-'+pfx+'-'+p.name);if(!el)return;
  if(p.at==null){el.style.opacity=0;return;}
  const cell=document.getElementById(pfx+p.at);if(!cell)return;
  let top=cell.offsetTop+cell.offsetHeight+8;if(occ[p.at])top+=22;occ[p.at]=1;
  el.style.left=(cell.offsetLeft+cell.offsetWidth/2)+'px';el.style.top=top+'px';el.style.opacity=1;});}

/* ========== 场景 1：普通二分 [l,r] 闭区间 ========== */
const plainScene=(()=>{
  const arr=[1,3,5,7,9,11,13];
  return {
    id:'plain',label:'普通二分',sub:'[l,r] 找值',
    code:'<span class="kw">int</span> l=0, r=n-1;         <span class="cmt">// 闭区间 [l,r]</span>\n'+
      '<span class="kw">while</span>(l&lt;=r){\n'+
      '    <span class="kw">int</span> m=l+(r-l)/2;\n'+
      '    <span class="kw">if</span>(a[m]==t) <span class="kw">return</span> m;\n'+
      '    <span class="kw">else if</span>(a[m]&lt;t) l=m+1;   <span class="cmt">// 丢左半含 m</span>\n'+
      '    <span class="kw">else</span> r=m-1;              <span class="cmt">// 丢右半含 m</span>\n'+
      '}',
    steps:[
      {l:0,r:6,mid:null,chip:'target = 9',chipC:'c0',
       act:'▸ 闭区间 [l,r]，循环 l≤r，每轮取中点 m=l+(r−l)/2',
       desc:'升序数组里找 <b class="dg">9</b>。闭区间 <code>[l,r]</code>，条件 <code>l&lt;=r</code>。每轮取中点 <code>m=l+(r-l)/2</code>（防溢出），把不可能含答案的<b>一半连同 m</b> 丢掉。'},
      {l:0,r:6,mid:3,chip:'a[3]=7 < 9',chipC:'cb',
       act:'▸ a[3]=7 < 9 → 丢左半含 mid，l = mid+1 = 4',
       desc:'mid=3，<span class="br">a[3]=7</span>。7 &lt; 9 → target 只可能在<b>右半</b>，mid 及左侧全排除，<code>l = mid+1 = 4</code>。一次砍掉一半（左侧灰色淡出）。'},
      {l:4,r:6,mid:5,chip:'a[5]=11 > 9',chipC:'ch',
       act:'▸ a[5]=11 > 9 → 丢右半含 mid，r = mid−1 = 4',
       desc:'新区间 [4,6]。mid=5，<span class="br">a[5]=11</span>。11 &gt; 9 → target 在<b>左半</b>，<code>r = mid-1 = 4</code>。'},
      {l:4,r:4,mid:4,chip:'a[4]=9 命中',chipC:'cg',found:4,
       act:'▸ a[4]=9 == target → 返回下标 4',
       desc:'区间收缩到 [4,4]。mid=4，<span class="gr">a[4]=9 == target</span>，返回下标 <b>4</b>。每轮区间减半，最多 <b>⌈log₂n⌉</b> 次，复杂度 <b>O(log n)</b>。'},
    ],
    build(){
      viz.innerHTML='<div class="vcap"><b>普通二分</b>：升序数组里找某个值（LC 704）</div>'+
        '<div class="tgt">target = <b>9</b></div><div class="cwrap" id="cw"></div>'+
        '<div class="legend"><span class="bl">l 左界</span><span class="br">mid 中点</span><span class="gr">r 右界</span><span>灰=已排除</span></div>';
      buildCells(document.getElementById('cw'),arr,[{name:'l',cls:'a',label:'l'},{name:'mid',cls:'m',label:'mid'},{name:'r',cls:'g',label:'r'}],'p');
    },
    render(s){
      arr.forEach((v,i)=>{
        let cls;
        if(s.found===i)cls='found';
        else if(i<s.l||i>s.r)cls='excl';
        else if(i===s.mid)cls='mid';
        else cls='active';
        setCell('p',i,cls);
      });
      moveBadges('p',[{name:'l',at:s.l},{name:'mid',at:s.mid},{name:'r',at:s.r}]);
    }
  };
})();

/* ========== 场景 2：lower_bound [l,r) 左闭右开 ========== */
const lbScene=(()=>{
  const arr=[1,2,2,2,5,7,'∅'];   // 索引 6 = 虚拟 n 边界
  return {
    id:'lower',label:'lower_bound',sub:'[l,r) 找边界',
    code:'<span class="kw">int</span> l=0, r=n;           <span class="cmt">// 右开 [l,r)</span>\n'+
      '<span class="kw">while</span>(l&lt;r){\n'+
      '    <span class="kw">int</span> m=l+(r-l)/2;\n'+
      '    <span class="kw">if</span>(a[m]&gt;=t) r=m;         <span class="cmt">// 满足 → 收右，保留 m</span>\n'+
      '    <span class="kw">else</span> l=m+1;              <span class="cmt">// 不满足 → 弃左含 m</span>\n'+
      '}\n<span class="kw">return</span> l;              <span class="cmt">// 第一个 &gt;=t 的位置</span>',
    steps:[
      {l:0,r:6,mid:null,chip:'找第一个 ≥ 2',chipC:'c0',
       act:'▸ 左闭右开 [l,r)，r 初始 = n = 6（虚拟越界位）',
       desc:'有重复值时找<b>边界</b>而非任意位置。用左闭右开 <code>[l,r)</code>，<code>r</code> 初始化为 <b>n=6</b>（越界，代表插到末尾）。把区间看成 <span class="dg">左段不满足</span> | <span class="gr">右段满足</span>，目标是<b>第一个满足 <code>a[i]≥2</code> 的位置</b>。<b>遇相等不停</b>。'},
      {l:0,r:6,mid:3,chip:'a[3]=2 ≥ 2',chipC:'cg',
       act:'▸ a[3]=2 ≥ 2 满足 → 保留 mid，r = mid = 3',
       desc:'mid=3，<span class="br">a[3]=2 ≥ 2</span> 满足。答案可能就是 mid，也可能更左，所以<b>保留 mid</b>：<code>r = mid = 3</code>。这正是与普通二分的关键区别——不返回，继续往左逼。'},
      {l:0,r:3,mid:1,chip:'a[1]=2 ≥ 2',chipC:'cg',
       act:'▸ a[1]=2 ≥ 2 满足 → r = mid = 1',
       desc:'区间 [0,3)。mid=1，<span class="br">a[1]=2 ≥ 2</span> 满足，<code>r = mid = 1</code>。继续向左找更早的满足位置。'},
      {l:0,r:1,mid:0,chip:'a[0]=1 < 2',chipC:'cd',
       act:'▸ a[0]=1 < 2 不满足 → l = mid+1 = 1，l==r 结束',
       desc:'区间 [0,1)。mid=0，<span class="br">a[0]=1 &lt; 2</span> 不满足 → mid 及左侧都不是答案，<code>l = mid+1 = 1</code>。此时 <code>l==r==1</code>，循环结束。'},
      {l:1,r:1,mid:null,chip:'返回 1；[1,4)',chipC:'cg',lower:1,upper:4,
       act:'▸ 返回 l=1（第一个≥2）；换 >t 即 upper_bound=4',
       desc:'返回 <b>l = 1</b>，第一个 <b>≥2</b> 的下标。把判断换成 <code>a[m] &gt; t</code> 就是 <b>upper_bound</b> = 第一个 <b>&gt;2</b> 的位置 = <b>4</b>。于是 2 的出现区间是 <code>[lower, upper) = [1,4)</code>，共 3 个——这就是 LC 34。'},
    ],
    build(){
      viz.innerHTML='<div class="vcap"><b>边界二分 lower_bound</b>：左闭右开 [l,r)，找第一个满足条件的位置</div>'+
        '<div class="tgt">target = <b>2</b>　（数组含重复值）</div><div class="cwrap" id="cw"></div>'+
        '<div class="legend"><span class="gr">■ ≥target 满足</span><span class="dg">■ &lt;target 不满足</span><span class="bl">l</span><span class="br">mid</span><span class="gr">r 可越界</span></div>';
      buildCells(document.getElementById('cw'),arr,[{name:'l',cls:'a',label:'l'},{name:'mid',cls:'m',label:'mid'},{name:'r',cls:'g',label:'r'}],'b');
    },
    render(s){
      for(let k=0;k<7;k++){
        let cls;
        if(k===6)cls='vph';
        else if(s.lower!==undefined)cls=(k>=s.lower&&k<s.upper)?'found':(k===s.upper?'add':'active');
        else cls=(k<s.l||k>=s.r)?'excl':(k===s.mid?'mid':'active');
        setCell('b',k,cls);
      }
      if(s.lower!==undefined)moveBadges('b',[{name:'l',at:s.lower},{name:'mid',at:null},{name:'r',at:null}]);
      else moveBadges('b',[{name:'l',at:s.l},{name:'mid',at:s.mid},{name:'r',at:s.r}]);
    }
  };
})();

/* ========== 场景 3：旋转数组二分 LC 33 ========== */
const rotScene=(()=>{
  const arr=[4,5,6,7,0,1,2];
  return {
    id:'rotate',label:'旋转数组',sub:'先定有序半',
    code:'<span class="kw">while</span>(l&lt;=r){\n'+
      '    <span class="kw">int</span> m=l+(r-l)/2;\n'+
      '    <span class="kw">if</span>(a[m]==t) <span class="kw">return</span> m;\n'+
      '    <span class="kw">if</span>(a[l]&lt;=a[m]){            <span class="cmt">// 左半有序</span>\n'+
      '        <span class="kw">if</span>(a[l]&lt;=t&&t&lt;a[m]) r=m-1;\n'+
      '        <span class="kw">else</span> l=m+1;\n'+
      '    } <span class="kw">else</span> {                   <span class="cmt">// 右半有序</span>\n'+
      '        <span class="kw">if</span>(a[m]&lt;t&&t&lt;=a[r]) l=m+1;\n'+
      '        <span class="kw">else</span> r=m-1;\n'+
      '    }\n}',
    steps:[
      {l:0,r:6,mid:null,ord:null,chip:'旋转后非整体有序',chipC:'c0',
       act:'▸ 以 mid 切开必有一半有序；先判有序半，再看 target 是否落入',
       desc:'<b>[4,5,6,7,0,1,2]</b> 是升序数组旋转得到，整体无序，但<b>以 mid 切开必有一半有序</b>。找 <b class="dg">0</b>。策略：先判哪半有序，再看 target 是否落在这个<b>有序半</b>里。'},
      {l:0,r:6,mid:3,ord:'L',chip:'左半 [4..7] 有序',chipC:'cb',
       act:'▸ a[l]≤a[mid] → 左半有序；0∉[4,7) → 去右半，l=4',
       desc:'mid=3，a[mid]=7。<code>a[l]=4 ≤ a[m]=7</code> → <span class="bl">左半有序</span>。target 0 在 [4,7) 内？<b>否</b>（0&lt;4）。答案在右半，<code>l = mid+1 = 4</code>。'},
      {l:4,r:6,mid:5,ord:'L',chip:'左半 [0,1] 有序',chipC:'cb',
       act:'▸ a[l]≤a[mid] → 左半有序；0∈[0,1) → 收右半，r=4',
       desc:'新区间 [4,6]。mid=5，a[mid]=1。<code>a[l]=0 ≤ a[m]=1</code> → <span class="bl">左半有序</span>，值 [0,1]。target 0 在 [0,1) 内？<b>是</b> → 收右半，<code>r = mid-1 = 4</code>。'},
      {l:4,r:4,mid:4,ord:null,chip:'a[4]=0 命中',chipC:'cg',found:4,
       act:'▸ a[4]=0 == target → 返回 4；仍 O(log n)',
       desc:'区间 [4,4]。<span class="gr">a[4]=0 == target</span>，返回 <b>4</b>。全程仍是 <b>O(log n)</b>。注意：若含<b>大量重复值</b>（如 [1,0,1,1,1]），<code>a[l]==a[m]==a[r]</code> 时无法判断哪半有序，需先收边界，最坏退化 <b>O(n)</b>。'},
    ],
    build(){
      viz.innerHTML='<div class="vcap"><b>旋转数组二分</b>：每轮先找有序半，再判 target 是否落入（LC 33）</div>'+
        '<div class="tgt">target = <b>0</b></div><div class="cwrap" id="cw"></div>'+
        '<div class="legend"><span class="bl">■ 本轮有序半</span><span class="bl">l</span><span class="br">mid</span><span class="gr">r</span></div>';
      buildCells(document.getElementById('cw'),arr,[{name:'l',cls:'a',label:'l'},{name:'mid',cls:'m',label:'mid'},{name:'r',cls:'g',label:'r'}],'r');
    },
    render(s){
      arr.forEach((v,i)=>{
        let cls;
        if(s.found===i)cls='found';
        else if(i<s.l||i>s.r)cls='excl';
        else if(i===s.mid)cls='mid';
        else if(s.ord==='L'&&i>=s.l&&i<s.mid)cls='ord';
        else if(s.ord==='R'&&i>s.mid&&i<=s.r)cls='ord';
        else cls='active';
        setCell('r',i,cls);
      });
      moveBadges('r',[{name:'l',at:s.l},{name:'mid',at:s.mid},{name:'r',at:s.r}]);
    }
  };
})();

/* ========== 场景 4：二分答案 · 最小化最大值 LC 410 ========== */
const ansScene=(()=>{
  const nums=[7,2,5,10,8],groups=2,LO=10,HI=32,ANS=18;
  function split(limit){let g=[],used=1,cur=0;nums.forEach(x=>{if(cur+x<=limit){cur+=x;}else{used++;cur=x;}g.push(used-1);});return {g,used};}
  function pct(v){return (v-LO)/(HI-LO)*100;}
  return {
    id:'answer',label:'二分答案',sub:'最小化最大值',
    code:'<span class="kw">int</span> l=max(a), r=sum(a);   <span class="cmt">// 答案空间，非下标</span>\n'+
      '<span class="kw">while</span>(l&lt;r){\n'+
      '    <span class="kw">int</span> m=l+(r-l)/2;\n'+
      '    <span class="kw">if</span>(canFinish(a,m,k)) r=m;   <span class="cmt">// 可行→压小上限</span>\n'+
      '    <span class="kw">else</span> l=m+1;               <span class="cmt">// 不可行→抬高</span>\n'+
      '}\n<span class="kw">return</span> l;   <span class="cmt">// 第一个可行的 limit</span>',
    steps:[
      {l:LO,r:HI,mid:null,chip:'把数组分 2 段',chipC:'c0',
       act:'▸ 搜索的是「答案值」[max=10, sum=32]，不是下标',
       desc:'LC 410：把 <b>[7,2,5,10,8]</b> 分成 <b>2</b> 段（不打乱顺序），让「<b>各段和的最大值</b>」尽量小。直接求难，但给定上限 <code>limit</code> 可 <b>O(n)</b> 贪心验证能否 ≤2 段。答案空间 <code>[max=10, sum=32]</code>——搜的是<b>答案值</b>，不是下标。'},
      {l:LO,r:HI,mid:21,chip:'limit=21 可行',chipC:'cg',
       act:'▸ mid=21：贪心 14 | 18 = 2 段 ≤ 2 → 可行，r = mid = 21',
       desc:'mid=21。贪心装箱：14 | 18，只用 <b>2 段 ≤ 2</b> → <span class="gr">可行</span>。可行说明 21 够用还能更小，<b>压低上限</b>：<code>r = mid = 21</code>。可行性单调：limit 越大越易可行 → <code>F F F T T T</code>，找<b>第一个 T</b>。'},
      {l:LO,r:16,mid:15,chip:'limit=15 不可行',chipC:'cd',
       act:'▸ mid=15：贪心 14|10|8 = 3 段 > 2 → 不可行，l = 16',
       desc:'区间 [10,21)。mid=15。贪心：14 | 10 | 8，需 <b>3 段 &gt; 2</b> → <span class="dg">不可行</span>。太小了，<b>抬高下限</b>：<code>l = mid+1 = 16</code>。'},
      {l:16,r:21,mid:18,chip:'limit=18 可行',chipC:'cg',
       act:'▸ mid=18：贪心 14 | 18 = 2 段 → 可行，r = mid = 18',
       desc:'区间 [16,21)。mid=18。贪心：14 | 18（10+8=18 恰好≤18），<b>2 段</b> → <span class="gr">可行</span>，<code>r = mid = 18</code>。'},
      {l:16,r:18,mid:17,chip:'limit=17 不可行',chipC:'cd',
       act:'▸ mid=17：贪心 14|10|8 = 3 段 → 不可行，l = 18',
       desc:'区间 [16,18)。mid=17。贪心：14 | 10 | 8（10+8=18&gt;17），<b>3 段</b> → <span class="dg">不可行</span>，<code>l = mid+1 = 18</code>。此时 <code>l==r==18</code>。'},
      {l:18,r:18,mid:null,done:true,chip:'答案 = 18',chipC:'cg',
       act:'▸ 返回 l=18：最优分法 [7,2,5] | [10,8]，最大段和 18',
       desc:'返回 <b>l = 18</b>——第一个可行的上限，即最优分法 <b>[7,2,5] | [10,8]</b>，最大段和 18。复杂度 <b>O(n·log(sum))</b>。题眼不是「数组有序」，而是「<b>可行性 canFinish(mid) 随 mid 单调</b>」；「最大化最小值」则反过来找<b>最后一个可行值</b>，且 mid 要<b>向上取整</b>防死循环。'},
    ],
    build(){
      viz.innerHTML='<div class="vcap"><b>二分答案 · 最小化最大值</b>：在答案空间上找第一个可行的上限（LC 410）</div>'+
        '<div class="band" id="band">'+
        '<div class="seg f" style="width:'+pct(ANS)+'%">不可行 F</div>'+
        '<div class="seg t" style="width:'+(100-pct(ANS))+'%">可行 T（≥18）</div>'+
        '<div class="bmark l" id="bm-l"><span class="v"></span>l</div>'+
        '<div class="bmark r" id="bm-r"><span class="v"></span>r</div>'+
        '<div class="bmark m" id="bm-m" style="opacity:0"><span class="v"></span>mid</div>'+
        '</div>'+
        '<div class="loads" id="loads"></div>'+
        '<div class="verdict" id="verdict"></div>';
      let ld='';nums.forEach((x,i)=>ld+='<div class="load" id="ld-'+i+'">'+x+'</div>');
      document.getElementById('loads').innerHTML=ld;
    },
    render(s){
      const setMark=(id,val,show)=>{const el=document.getElementById(id);if(!show){el.style.opacity=0;return;}el.style.opacity=1;el.style.left=pct(val)+'%';el.querySelector('.v').textContent=val;};
      setMark('bm-l',s.l,true);setMark('bm-r',s.r,true);setMark('bm-m',s.mid,s.mid!=null);
      let verdict;
      if(s.mid!=null||s.done){
        const limit=s.done?ANS:s.mid;const r=split(limit);
        nums.forEach((x,i)=>{document.getElementById('ld-'+i).className='load g'+r.g[i];});
        const ok=r.used<=groups;
        verdict='limit = <b>'+limit+'</b> → 贪心用 <b>'+r.used+'</b> 段　'+(ok?'<b class="t">≤ '+groups+' ✓ 可行</b>':'<b class="f">&gt; '+groups+' ✗ 不可行</b>');
      }else{
        nums.forEach((x,i)=>{document.getElementById('ld-'+i).className='load';});
        verdict='答案空间 <b>[10, 32]</b>：左界=最大元素 10，右界=总和 32';
      }
      document.getElementById('verdict').innerHTML=verdict;
    }
  };
})();

/* ========== 引擎 ========== */
const SCENES=[plainScene,lbScene,rotScene,ansScene];
const tabsBox=document.getElementById('tabs');
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stAct=document.getElementById('stAct'),stDesc=document.getElementById('stDesc');
const codeBox=document.getElementById('codeBox'),readout=document.getElementById('readout'),dotsBox=document.getElementById('dots');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');
SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML='<span class="t">'+sc.label+'</span><span class="s">'+sc.sub+'</span>';b.onclick=()=>{stop();switchScene(i);};tabsBox.appendChild(b);});
let si=0,cur=0,dotEls=[];
const SC=()=>SCENES[si];
function switchScene(i){
  si=i;cur=0;
  [...tabsBox.children].forEach((t,idx)=>t.classList.toggle('on',idx===si));
  SC().build();codeBox.innerHTML=SC().code;
  dotsBox.innerHTML='';dotEls=[];
  SC().steps.forEach((s,idx)=>{const d=document.createElement('button');d.className='dot';d.title=s.chip;d.onclick=()=>{stop();go(idx);};dotsBox.appendChild(d);dotEls.push(d);});
  go(0);
}
function go(i){
  const steps=SC().steps;cur=Math.max(0,Math.min(steps.length-1,i));const s=steps[cur];
  SC().render(s);
  stTitle.textContent=SC().label;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;
  stAct.innerHTML=s.act;stDesc.innerHTML=s.desc;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(steps.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
  if(cur===steps.length-1)stop();
}
let timer=null,ms=2700;
function play(){const steps=SC().steps;if(cur===steps.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<SC().steps.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const hm=location.hash.match(/scene=(\w+)/),sm=location.hash.match(/step=(\d+)/);
let initScene=0;if(hm){const idx=SCENES.findIndex(x=>x.id===hm[1]);if(idx>=0)initScene=idx;}
switchScene(initScene);if(sm)go(+sm[1]);
</script>
