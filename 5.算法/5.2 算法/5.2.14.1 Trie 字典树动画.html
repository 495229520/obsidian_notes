<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Trie 字典树动画 · 插入 / 查找 / 剪枝 / 词根 / 搜索建议</title>
<style>
:root{
  /* Same warm-paper teaching system as the surrounding algorithm animations. */
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#3E3D39;--muted:#5F5E5A;--faint:#8A887F;
  --line:#C9C7BF;--grid:#E2E0D7;--gray:#F1EFE8;
  --blue:#185FA5;--bluebg:#E6F1FB;--green:#0F6E56;--greenbg:#E1F5EE;
  --brown:#9A5B0E;--brownbg:#FAEEDA;--danger:#B3402F;--dangerbg:#F6E0DB;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}html,body{background:var(--paper);color:var(--ink);}body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16.5px;line-height:1.68;padding:34px 40px 52px;text-wrap:pretty;}button{font:inherit;}.wrap{max-width:1320px;margin:0 auto;}header h1{font-size:27px;font-weight:600;letter-spacing:0;}header p{font-size:14.5px;color:var(--muted);margin-top:7px;}header kbd{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:var(--panel);}code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:2px 6px;border-radius:4px;}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:26px;}.tab{font-size:14.5px;font-weight:500;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 18px;cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease);display:flex;flex-direction:column;gap:3px;align-items:flex-start;justify-content:center;min-height:72px;}.tab:hover{border-color:var(--muted);transform:translateY(-1px);}.tab:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}.tab .t{font-weight:600;color:var(--ink);}.tab .s{font-size:11.5px;color:var(--faint);font-family:var(--mono);}.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 4px 14px rgba(62,61,57,.18);}.tab.on .t,.tab.on .s{color:var(--paper);}.tab.on .s{opacity:.78;}
.layout{display:grid;grid-template-columns:minmax(0,760px) minmax(420px,1fr);gap:32px;margin-top:30px;align-items:start;}.viz{background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:30px;min-height:620px;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(60,55,40,.05);overflow:hidden;}.vcap{font-size:14px;color:var(--muted);margin-bottom:12px;}.vcap b{color:var(--ink);}.right{display:flex;flex-direction:column;gap:20px;}.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:25px 27px;min-height:270px;box-shadow:0 1px 4px rgba(60,55,40,.05);}.desc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}.desc-head .st{font-size:21px;font-weight:600;}.act{margin-top:18px;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:12px 15px;border-radius:7px;}.desc-body{margin-top:14px;font-size:16px;color:var(--muted);}.desc-body b{color:var(--ink);}.desc-body .bl{color:var(--blue);font-weight:600;}.desc-body .gr{color:var(--green);font-weight:600;}.desc-body .br{color:var(--brown);font-weight:600;}.desc-body .dg{color:var(--danger);font-weight:600;}.chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid;}.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}.chip.cb{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}.codebox{background:#2E2C27;border-radius:8px;padding:21px 23px;font-family:var(--mono);font-size:13.5px;line-height:1.72;color:#D8D5CC;white-space:pre;overflow-x:auto;box-shadow:0 3px 10px rgba(46,44,39,.19);}.codebox .cmt{color:#8F8B80;}.codebox .kw{color:#E3A44C;}.codebox .fn{color:#8EC5EA;}

.triearea{position:relative;height:480px;margin:2px 24px 6px;}.trieedge{position:absolute;height:2px;background:var(--line);transform-origin:left center;transition:background var(--dur) var(--ease),height var(--dur) var(--ease),opacity var(--dur) var(--ease);}.trieedge.hide{opacity:0;}.trieedge.hot{background:var(--brown);height:3px;}.trieedge.done{background:var(--green);height:3px;}.trienode{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:8px;border:2px solid var(--line);background:var(--paper);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:21px;font-weight:800;opacity:0;transform:scale(.48);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),opacity var(--dur) var(--ease),transform var(--dur) var(--ease);}.trienode.show{opacity:1;transform:scale(1);}.trienode.root{border-radius:50%;border-color:var(--blue);background:var(--bluebg);color:var(--blue);font-size:13px;}.trienode.path{border-color:var(--brown);background:var(--brownbg);color:var(--brown);}.trienode.end{border-color:var(--green);background:var(--greenbg);color:var(--green);}.trienode.active{border-color:var(--blue);background:var(--bluebg);color:var(--blue);transform:scale(1.14);box-shadow:0 0 0 5px rgba(24,95,165,.16);}.trienode.fail{border-color:var(--danger);background:var(--dangerbg);color:var(--danger);}.endmark{position:absolute;right:-18px;top:-12px;display:none;padding:1px 5px;border-radius:4px;background:var(--green);color:white;font-family:var(--mono);font-size:9px;font-weight:700;line-height:15px;}.trienode.end .endmark{display:block;}.nodecount{position:absolute;bottom:-20px;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--faint);white-space:nowrap;}.trieptr{position:absolute;z-index:3;font-family:var(--mono);font-size:12px;color:var(--ink);opacity:0;transform:translateX(-50%);transition:left var(--dur) var(--ease),top var(--dur) var(--ease),opacity .18s;}
.collbl{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:center;margin:14px 0 8px;}.wordbox{position:relative;display:flex;gap:9px;justify-content:center;padding-top:26px;min-height:86px;}.wordtag{position:absolute;top:0;left:0;font-family:var(--mono);font-size:11.5px;color:var(--faint);}.wordptr{position:absolute;top:2px;left:0;color:var(--ink);font-size:15px;opacity:0;transform:translateX(-50%);transition:left var(--dur) var(--ease),opacity .18s;}.charcell{width:54px;height:54px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:20px;font-weight:700;color:var(--muted);transition:all var(--dur) var(--ease);}.charcell.used{background:var(--greenbg);border-color:var(--green);color:var(--green);}.charcell.current{background:var(--bluebg);border-color:var(--blue);color:var(--blue);transform:translateY(-4px);box-shadow:0 6px 14px rgba(24,95,165,.14);}.charcell.fail{background:var(--dangerbg);border-color:var(--danger);color:var(--danger);}.charcell.skip{opacity:.42;}
.metrics{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:7px;}.metric{font-family:var(--mono);font-size:13.5px;padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--muted);}.metric b{color:var(--ink);}.metric.good{border-color:var(--green);background:var(--greenbg);color:var(--green);}.metric.bad{border-color:var(--danger);background:var(--dangerbg);color:var(--danger);}.metric.info{border-color:var(--blue);background:var(--bluebg);color:var(--blue);}
.gridboard{display:grid;grid-template-columns:repeat(3,56px);gap:9px;justify-content:center;margin-top:10px;}.gcell{width:56px;height:56px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:21px;font-weight:700;color:var(--muted);transition:all var(--dur) var(--ease);}.gcell.path{border-color:var(--brown);background:var(--brownbg);color:var(--brown);}.gcell.active{border-color:var(--blue);background:var(--bluebg);color:var(--blue);transform:translateY(-4px);box-shadow:0 5px 12px rgba(24,95,165,.14);}.gcell.fail{border-color:var(--danger);background:var(--dangerbg);color:var(--danger);}.gcell.done{border-color:var(--green);background:var(--greenbg);color:var(--green);}.answers{display:flex;justify-content:center;gap:10px;min-height:46px;}.answer{min-width:92px;height:40px;padding:0 11px;border:1.5px dashed var(--line);border-radius:6px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14.5px;color:var(--faint);transition:all var(--dur) var(--ease);}.answer.fill{border-style:solid;border-color:var(--green);background:var(--greenbg);color:var(--green);font-weight:700;}.answer.suggest{border-style:solid;border-color:var(--brown);background:var(--brownbg);color:var(--brown);font-weight:700;}.op-note{text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:auto;padding-top:13px;min-height:36px;}.op-note b{color:var(--ink);}.op-note .dg{color:var(--danger);font-weight:700;}
.controls{margin-top:26px;background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:17px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(60,55,40,.05);}.btn{font-size:14px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:10px 18px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;min-height:44px;}.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}.btn:active:not(:disabled){transform:scale(.96);}.btn:disabled{opacity:.4;cursor:default;}.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:104px;}.dots{display:flex;gap:9px;margin:0 auto;flex-wrap:wrap;justify-content:center;}.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}.dot:hover{border-color:var(--muted);transform:scale(1.2);}.dot.done{background:var(--line);border-color:var(--line);}.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.3);}.readout{font-family:var(--mono);font-size:14px;color:var(--muted);min-width:50px;text-align:center;}
@media(max-width:1180px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr));}.layout{grid-template-columns:1fr;}.viz{min-height:570px;}.right{display:grid;grid-template-columns:1fr 1fr;}.codebox{min-height:260px;}}@media(max-width:720px){body{font-size:15px;padding:20px 14px 32px;}header h1{font-size:22px;}header p{font-size:13px;}.tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px;}.tab{font-size:13px;padding:9px 12px;min-height:60px;}.tab .s{font-size:10.5px;}.right{display:flex;}.viz{padding:16px;min-height:438px;}.vcap{font-size:12px;}.triearea{height:310px;margin:0}.trienode{width:38px;height:38px;margin:-19px 0 0 -19px;font-size:15px}.trienode.root{font-size:10px}.endmark{right:-14px;top:-9px;font-size:8px;line-height:13px}.nodecount{bottom:-16px;font-size:8px}.charcell{width:36px;height:40px;font-size:16px}.wordbox{gap:4px;min-height:70px;padding-top:22px}.answer{min-width:70px;height:34px;font-size:12.5px}.desc-card{padding:18px 20px;min-height:218px}.desc-head .st{font-size:17px}.act{font-size:12.5px;margin-top:14px;padding:9px 13px}.desc-body{font-size:14px;margin-top:10px}.codebox{font-size:11px;padding:14px 17px}.controls{padding:12px;gap:8px;margin-top:22px}.dots{order:4;width:100%}.btn{font-size:13px;padding:8px 12px;min-height:40px;}}@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>

<body>
<div class="wrap">
  <header><h1>Trie 字典树动画 · 一条路径如何变成前缀能力</h1><p>共享前缀、完整查找、网格剪枝、最短词根、搜索建议　·　上方切主题，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p></header>
  <nav class="tabs" id="tabs" aria-label="动画主题"></nav>
  <div class="layout"><section class="viz" id="viz" aria-live="polite"></section><section class="right"><div class="desc-card"><div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div><div class="act" id="stAct"></div><div class="desc-body" id="stDesc"></div></div><div class="codebox" id="codeBox"></div></section></div>
  <div class="controls"><button class="btn" id="btnPrev" aria-label="上一步">‹ 上一步</button><button class="btn primary" id="btnPlay" aria-label="播放动画">▶ 播放</button><button class="btn" id="btnNext" aria-label="下一步">下一步 ›</button><div class="dots" id="dots" aria-label="步骤跳转"></div><span class="readout" id="readout"></span></div>
</div>
<script>
const viz=document.getElementById('viz');
const NODES=[
  {id:'root',ch:'root',pos:[50,8]},{id:'a1',ch:'a',pos:[30,25]},{id:'b1',ch:'b',pos:[70,25]},
  {id:'p1',ch:'p',pos:[30,42]},{id:'a2',ch:'a',pos:[70,42]},{id:'p2',ch:'p',pos:[23,60]},{id:'e1',ch:'e',pos:[38,60]},{id:'t1',ch:'t',pos:[70,60]},
  {id:'l1',ch:'l',pos:[23,77]},{id:'e2',ch:'e',pos:[23,93]}
];
const EDGES=[['root','a1'],['root','b1'],['a1','p1'],['b1','a2'],['p1','p2'],['p1','e1'],['a2','t1'],['p2','l1'],['l1','e2']];
const FULL=NODES.map(n=>n.id),BASE=['root','a1','b1','p1','a2','p2','e1','t1'],ENDS=['p2','e1','e2','t1'];
const PATHS={app:['root','a1','p1','p2'],apple:['root','a1','p1','p2','l1','e2'],ape:['root','a1','p1','e1'],bat:['root','b1','a2','t1']};
function trieMarkup(prefix,caption){let edges='',nodes='';EDGES.forEach((_,i)=>edges+='<span class="trieedge" id="'+prefix+'e'+i+'"></span>');NODES.forEach(n=>nodes+='<div class="trienode" id="'+prefix+'n'+n.id+'" style="left:'+n.pos[0]+'%;top:'+n.pos[1]+'%"><span>'+n.ch+'</span><span class="endmark">END</span><span class="nodecount"></span></div>');return '<div class="vcap">'+caption+'</div><div class="triearea" id="'+prefix+'tree">'+edges+nodes+'<span class="trieptr" id="'+prefix+'ptr">node ▼</span></div>';}
function layoutTrie(prefix){const tree=document.getElementById(prefix+'tree');if(!tree)return;const w=tree.clientWidth,h=tree.clientHeight;EDGES.forEach((edge,i)=>{const a=NODES.find(n=>n.id===edge[0]),b=NODES.find(n=>n.id===edge[1]),x1=a.pos[0]/100*w,y1=a.pos[1]/100*h,x2=b.pos[0]/100*w,y2=b.pos[1]/100*h,dx=x2-x1,dy=y2-y1,line=document.getElementById(prefix+'e'+i);line.style.left=x1+'px';line.style.top=y1+'px';line.style.width=Math.hypot(dx,dy)+'px';line.style.transform='rotate('+Math.atan2(dy,dx)*180/Math.PI+'deg)';});}
function paintTrie(prefix,s){const visible=s.visible||FULL,path=s.path||[],ends=s.ends||ENDS,counts=s.counts||{},fail=s.failNode||null;NODES.forEach(n=>{const el=document.getElementById(prefix+'n'+n.id);let cls='trienode'+(visible.includes(n.id)?' show':'');if(n.id==='root')cls+=' root';if(path.includes(n.id))cls+=' path';if(ends.includes(n.id))cls+=' end';if(n.id===s.active)cls+=' active';if(n.id===fail)cls+=' fail';el.className=cls;el.querySelector('.nodecount').textContent=counts[n.id]?'pass '+counts[n.id]:'';});EDGES.forEach((edge,i)=>{const line=document.getElementById(prefix+'e'+i),on=visible.includes(edge[0])&&visible.includes(edge[1]),hot=path.includes(edge[0])&&path.includes(edge[1]);line.className='trieedge'+(!on?' hide':'')+(hot?' hot':'')+(ends.includes(edge[1])&&path.includes(edge[1])?' done':'');});const ptr=document.getElementById(prefix+'ptr');if(!s.active){ptr.style.opacity=0;return;}const target=document.getElementById(prefix+'n'+s.active);ptr.style.opacity=1;ptr.style.left=(target.offsetLeft+target.offsetWidth/2)+'px';ptr.style.top=(target.offsetTop-23)+'px';}
function wordMarkup(prefix,count,label){let h='';for(let i=0;i<count;i++)h+='<div class="charcell" id="'+prefix+'c'+i+'">·</div>';return '<div class="wordbox" id="'+prefix+'box"><span class="wordtag">'+label+'</span><span class="wordptr" id="'+prefix+'ptr">▼</span>'+h+'</div>';}
function paintWord(prefix,count,word,index,failIndex=-1,stopFrom=-1){for(let i=0;i<count;i++){const el=document.getElementById(prefix+'c'+i),has=i<word.length;el.textContent=has?word[i]:'·';el.className='charcell'+(i<index?' used':'')+(i===index?' current':'')+(i===failIndex?' fail':'')+(stopFrom>=0&&i>=stopFrom?' skip':'');}const ptr=document.getElementById(prefix+'ptr');if(index<0){ptr.style.opacity=0;return;}const cell=document.getElementById(prefix+'c'+index);ptr.style.opacity=1;ptr.style.left=(cell.offsetLeft+cell.offsetWidth/2)+'px';}
function answersMarkup(prefix,count){let h='';for(let i=0;i<count;i++)h+='<div class="answer" id="'+prefix+i+'">·</div>';return '<div class="answers">'+h+'</div>';}
function paintAnswers(prefix,count,values,kind='fill'){for(let i=0;i<count;i++){const el=document.getElementById(prefix+i),has=i<values.length;el.className='answer'+(has?' '+kind:'');el.textContent=has?values[i]:'·';}}
function gridMarkup(prefix){const grid=[['a','p','e'],['x','p','x']];let h='';grid.forEach((row,r)=>row.forEach((ch,c)=>h+='<div class="gcell" id="'+prefix+r+'-'+c+'">'+ch+'</div>'));return '<div class="gridboard">'+h+'</div>';}
function paintGrid(prefix,s){const path=s.gridPath||[],active=s.gridActive||'',fail=s.gridFail||'';for(let r=0;r<2;r++)for(let c=0;c<3;c++){const id=r+'-'+c,el=document.getElementById(prefix+id);el.className='gcell'+(path.includes(id)?' path':'')+(active===id?' active':'')+(fail===id?' fail':'')+(s.gridDone&&path.includes(id)?' done':'');}}

const insertScene=(()=>{const steps=[
  {visible:BASE,ends:['p2','e1','t1'],path:['root'],active:'root',word:'apple',index:-1,words:['app','ape','bat'],chip:'共享前缀',chipC:'c0',title:'已有 app、ape、bat：公共字符只存一份',desc:'Trie 的边代表字符，根到节点的路径代表前缀。<b>app</b> 和 <b>ape</b> 共用 root → a → p，只在最后一个字符处分叉；绿色 END 只表示“这里刚好是一个完整单词”。'},
  {visible:BASE,ends:['p2','e1','t1'],path:['root','a1'],active:'a1',word:'apple',index:0,words:['app','ape','bat'],chip:'a 已存在',chipC:'cb',title:'读到 a：沿已有边前进，不创建节点',desc:'插入从根开始逐字符走。当前节点已有 a 子节点，所以复用它；共享前缀正是 Trie 节省重复存储的来源。'},
  {visible:BASE,ends:['p2','e1','t1'],path:['root','a1','p1'],active:'p1',word:'apple',index:1,words:['app','ape','bat'],chip:'p 已存在',chipC:'cb',title:'读到 p：继续沿共享路径向下',desc:'此时路径是 <b>ap</b>。它不是完整单词，但它是 app、apple、ape 三个单词共同的前缀节点。'},
  {visible:BASE,ends:['p2','e1','t1'],path:PATHS.app,active:'p2',word:'apple',index:2,words:['app','ape','bat'],chip:'app 是完整单词',chipC:'ch',title:'读到第三个 p：app 的 END 不会阻止继续插入',desc:'节点 p2 已带有 END，说明 <b>app</b> 已存在；但 apple 更长，插入仍要继续走。END 只记录词尾，不是路径终点。'},
  {visible:[...BASE,'l1'],ends:['p2','e1','t1'],path:['root','a1','p1','p2','l1'],active:'l1',word:'apple',index:3,words:['app','ape','bat'],chip:'创建 l',chipC:'ch',title:'读到 l：边不存在，创建新节点',desc:'从 app 节点出发没有 l 子节点，因此新建 l。插入的时间只随单词长度增长，每个字符最多创建一个节点。'},
  {visible:FULL,ends:ENDS,path:PATHS.apple,active:'e2',word:'apple',index:4,words:['app','ape','bat','apple'],chip:'标记 END',chipC:'cg',title:'读到 e：创建节点并标记完整单词',desc:'最后一个字符 e 创建完成后，将它的 <code>isEnd</code> 设为 true。现在 app 和 apple 都是合法单词，且仍共享同一段前缀。'},
  {visible:FULL,ends:ENDS,path:[],active:null,word:'apple',index:-1,words:['app','ape','bat','apple'],chip:'insert 完成',chipC:'cg',title:'一棵树承载四个单词的公共前缀',desc:'插入完成。Trie 不需要保存每个单词的独立完整副本，而是通过共享路径存储前缀关系；查询时也只需沿字符路径走一遍。'}
];const code='<span class="kw">void</span> <span class="fn">insert</span>(string word) {\n    TrieNode* node = root;\n    <span class="kw">for</span> (<span class="kw">char</span> ch : word) {\n        <span class="kw">int</span> i = ch - \'a\';\n        <span class="kw">if</span> (node-&gt;child[i] == <span class="kw">nullptr</span>)\n            node-&gt;child[i] = <span class="kw">new</span> TrieNode();\n        node = node-&gt;child[i];\n    }\n    node-&gt;isEnd = <span class="kw">true</span>;\n}';function mount(){viz.innerHTML=trieMarkup('in','<b>插入 apple</b>：复用已有前缀，只有缺失边才创建节点')+wordMarkup('iw',5,'word')+'<div class="collbl">当前词典</div>'+answersMarkup('ia',4)+'<div class="op-note" id="inote"></div>';requestAnimationFrame(()=>layoutTrie('in'));}function paint(s){paintTrie('in',s);paintWord('iw',5,s.word,s.index);paintAnswers('ia',4,s.words);document.getElementById('inote').textContent='END 节点：'+s.ends.map(id=>({p2:'app',e1:'ape',e2:'apple',t1:'bat'}[id])).join(' / ');}return{id:'insert',label:'共享前缀',sub:'insert(word)',steps,mount,paint,layout:()=>layoutTrie('in'),code};})();

const searchScene=(()=>{const counts={root:4,a1:3,p1:3,p2:2,l1:1,e1:1,e2:1,b1:1,a2:1,t1:1};const steps=[
  {visible:FULL,ends:ENDS,path:['root'],active:'root',counts,word:'app',index:-1,result:'准备查询',resultC:'info',chip:'search / startsWith',chipC:'c0',title:'完整查找和前缀查找复用同一条路径',desc:'两种查询都先调用 findNode 沿字符路径走。区别只在最后一步：<b>search</b> 还要检查节点是否带 END；<b>startsWith</b> 只关心路径是否存在。'},
  {visible:FULL,ends:ENDS,path:['root','a1'],active:'a1',counts,word:'app',index:0,result:'a 路径存在',resultC:'info',chip:'走到 a',chipC:'cb',title:'query app：a 子节点存在',desc:'从根走 a 成功。此时还不能说明 app 是完整单词，只能说明前缀 a 存在。'},
  {visible:FULL,ends:ENDS,path:['root','a1','p1'],active:'p1',counts,word:'app',index:1,result:'ap 路径存在',resultC:'info',chip:'走到 p',chipC:'cb',title:'继续到 ap，路径仍然存在',desc:'p1 的 <code>passCount</code> 是 3，说明 app、apple、ape 都经过这个前缀节点。若题目要统计前缀数量，返回该计数即可。'},
  {visible:FULL,ends:ENDS,path:PATHS.app,active:'p2',counts,word:'app',index:2,result:'search(app) = true',resultC:'good',chip:'END = true',chipC:'cg',title:'走到 app，节点带 END：完整查找成功',desc:'路径存在且当前节点 <code>isEnd == true</code>，所以 search(app) 返回 true。注意 app 与 apple 可以同时成立，因为 END 不会阻断更深的孩子。'},
  {visible:FULL,ends:ENDS,path:['root','a1','p1'],active:'p1',counts,word:'ap',index:1,result:'search(ap) = false',resultC:'bad',chip:'路径存在，但非词尾',chipC:'cd',title:'query ap：路径存在，但 p1 没有 END',desc:'ap 是一个有效前缀，却没有作为单词插入。因此 <b>search(ap) 为 false</b>；如果误把“路径存在”当成完整单词存在，就会犯 Trie 最常见的错误。'},
  {visible:FULL,ends:ENDS,path:['root','a1','p1'],active:'p1',counts,word:'ap',index:1,result:'startsWith(ap) = true · passCount = 3',resultC:'good',chip:'前缀查询成功',chipC:'cg',title:'同一个节点对 startsWith 与 passCount 给出不同答案',desc:'startsWith 不检查 END，只要能走到 p1 就返回 true。节点的 passCount 为 3，说明这个前缀下当前有 3 个完整单词。'},
  {visible:FULL,ends:ENDS,path:['root','a1','p1','p2','l1'],active:'l1',counts,word:'apply',index:4,failIndex:4,result:'search(apply) = false',resultC:'bad',chip:'y 边不存在',chipC:'cd',title:'query apply：在 l 后找不到 y，立刻失败',desc:'Trie 查找在某个字符边缺失时立即停止，不会扫描其他单词。这就是它适合前缀判断和多词搜索剪枝的原因。'}
];const code='TrieNode* <span class="fn">findNode</span>(string text) {\n    TrieNode* node = root;\n    <span class="kw">for</span> (<span class="kw">char</span> ch : text) {\n        <span class="kw">int</span> i = ch - \'a\';\n        <span class="kw">if</span> (node-&gt;child[i] == <span class="kw">nullptr</span>) <span class="kw">return</span> <span class="kw">nullptr</span>;\n        node = node-&gt;child[i];\n    }\n    <span class="kw">return</span> node;\n}\n<span class="cmt">// search: node && node->isEnd</span>';function mount(){viz.innerHTML=trieMarkup('se','<b>查找与前缀</b>：同样走路径，只有 search 需要检查 END')+wordMarkup('sw',5,'query')+'<div class="metrics"><span class="metric" id="seresult"></span></div><div class="op-note" id="senote"></div>';requestAnimationFrame(()=>layoutTrie('se'));}function paint(s){paintTrie('se',s);paintWord('sw',5,s.word,s.index,s.failIndex);const r=document.getElementById('seresult');r.textContent=s.result;r.className='metric '+s.resultC;document.getElementById('senote').textContent='p1 的 passCount = 3：app / apple / ape';}return{id:'search',label:'查找与前缀',sub:'isEnd / passCount',steps,mount,paint,layout:()=>layoutTrie('se'),code};})();

const boardScene=(()=>{const steps=[
  {visible:['root','a1','p1','p2','e1'],ends:['p2','e1'],path:['root'],active:'root',gridPath:[],gridActive:'',answers:[],chip:'Trie + DFS',chipC:'c0',title:'把 app、ape 放入 Trie，再从每个网格格子出发',desc:'多单词网格搜索不为每个单词分别 DFS，而是让当前网格路径同步走 Trie。只要 Trie 没有对应的下一条边，就可以立即剪枝。'},
  {visible:['root','a1','p1','p2','e1'],ends:['p2','e1'],path:['root','a1'],active:'a1',gridPath:['0-0'],gridActive:'0-0',answers:[],chip:'a 是有效前缀',chipC:'cb',title:'从左上角 a 出发：root → a 成功',desc:'格子 a 对应 Trie 中的 a 子节点，因此这条网格路径仍可能组成字典单词，DFS 继续向相邻格子扩展。'},
  {visible:['root','a1','p1','p2','e1'],ends:['p2','e1'],path:['root','a1','p1'],active:'p1',gridPath:['0-0','0-1'],gridActive:'0-1',answers:[],chip:'ap 是有效前缀',chipC:'cb',title:'右移到 p：路径 a → p 仍在 Trie 中',desc:'当前路径 ap 同时是 app 和 ape 的公共前缀。Trie 把两个候选单词合并在一条 DFS 路径上，避免重复搜索。'},
  {visible:['root','a1','p1','p2','e1'],ends:['p2','e1'],path:PATHS.ape,active:'e1',gridPath:['0-0','0-1','0-2'],gridActive:'0-2',answers:['ape'],chip:'遇到 END',chipC:'cg',title:'右移到 e：ape 命中，记录答案',desc:'e1 带 END，说明当前网格路径组成完整单词 ape。实际 Word Search II 常把节点的 wordIndex 设为 -1，避免同一单词被重复加入。'},
  {visible:['root','a1','p1','p2','e1'],ends:['p2','e1'],path:PATHS.app,active:'p2',gridPath:['0-0','0-1','1-1'],gridActive:'1-1',answers:['ape','app'],chip:'回溯后换方向',chipC:'ch',title:'回到 ap 后向下走 p：app 也命中',desc:'DFS 回溯后必须恢复格子的访问状态，才能从同一个前缀尝试另一条方向。a → p → p 走到 p2，命中 app。'},
  {visible:['root','a1','p1','p2','e1'],ends:['p2','e1'],path:['root'],active:'root',gridPath:[],gridActive:'',gridFail:'1-0',answers:['ape','app'],chip:'x 无根边 → 剪枝',chipC:'cd',title:'从 x 出发：root 没有 x 子节点，直接返回',desc:'x 不在 Trie 根节点的孩子中，因此无需再从 x 做四方向 DFS。不存在的前缀越早被截断，Trie 剪枝收益越明显。'},
  {visible:['root','a1','p1','p2','e1'],ends:['p2','e1'],path:[],active:null,gridPath:[],gridActive:'',answers:['ape','app'],chip:'搜索完成',chipC:'cg',title:'结果去重并保留，网格现场恢复',desc:'Trie 负责判断当前字符路径是否仍有希望，DFS 负责枚举网格相邻路径。二者组合适合在同一张网格里搜索一批单词。'}
];const code='<span class="kw">if</span> (node-&gt;child[index] == <span class="kw">nullptr</span>) <span class="kw">return</span>; <span class="cmt">// 前缀不存在，剪枝</span>\nnode = node-&gt;child[index];\n<span class="kw">if</span> (node-&gt;wordIndex != -1) {\n    result.<span class="fn">push_back</span>(words[node-&gt;wordIndex]);\n    node-&gt;wordIndex = -1; <span class="cmt">// 防止重复答案</span>\n}\nboard[r][c] = \'#\';\n<span class="cmt">// DFS 四个方向</span>\nboard[r][c] = ch; <span class="cmt">// 回溯恢复</span>';function mount(){viz.innerHTML=trieMarkup('bo','<b>单词搜索 II</b>：网格路径每走一步，都同步检查 Trie 前缀')+'<div class="collbl">board</div>'+gridMarkup('bg')+'<div class="collbl">已命中的单词</div>'+answersMarkup('ba',2)+'<div class="op-note" id="bonote"></div>';requestAnimationFrame(()=>layoutTrie('bo'));}function paint(s){paintTrie('bo',s);paintGrid('bg',s);paintAnswers('ba',2,s.answers);document.getElementById('bonote').innerHTML=s.gridFail?'<span class="dg">x 不在 root.child 中：停止 DFS</span>':'网格路径必须在递归返回时恢复访问标记';}return{id:'board',label:'网格剪枝',sub:'Trie + DFS',steps,mount,paint,layout:()=>layoutTrie('bo'),code};})();

const rootScene=(()=>{const steps=[
  {visible:FULL,ends:ENDS,path:['root'],active:'root',word:'battery',index:-1,result:'原词：battery',chip:'最短词根',chipC:'c0',title:'根词集合含 bat，扫描 battery',desc:'替换词根时，沿目标单词逐字符走 Trie。一旦第一次遇到 END，就已经命中最短词根，可以立刻停止，不必继续读剩余字符。'},
  {visible:FULL,ends:ENDS,path:['root','b1'],active:'b1',word:'battery',index:0,result:'前缀 b',chip:'走 b',chipC:'cb',title:'b 存在，继续匹配',desc:'b 是 bat 的第一个字符，但还没有到词尾；继续沿孩子边走。'},
  {visible:FULL,ends:ENDS,path:['root','b1','a2'],active:'a2',word:'battery',index:1,result:'前缀 ba',chip:'走 a',chipC:'cb',title:'ba 存在，继续匹配',desc:'ba 是一条有效路径，不过 a2 没有 END，说明它还不是一个完整词根。'},
  {visible:FULL,ends:ENDS,path:PATHS.bat,active:'t1',word:'battery',index:2,stopFrom:3,result:'替换为：bat',chip:'首次 END',chipC:'cg',title:'到 bat 首次遇到 END，立即返回最短词根',desc:'bat 是 battery 的最短已插入词根。继续寻找更长路径没有意义，因为题目要求最短词根；余下的 t、e、r、y 不再扫描。'},
  {visible:FULL,ends:ENDS,path:PATHS.bat,active:null,word:'battery',index:-1,stopFrom:3,result:'battery → bat',chip:'替换完成',chipC:'cg',title:'用命中的最短词根替换原单词',desc:'Trie 的词尾标记让“最短词根”判断天然发生在从左到右的第一次 END。中途若某条边不存在，则返回原单词。'}
];const code='<span class="kw">string</span> <span class="fn">findShortestRoot</span>(string word) {\n    TrieNode* node = root;\n    string prefix;\n    <span class="kw">for</span> (<span class="kw">char</span> ch : word) {\n        <span class="kw">if</span> (node-&gt;child[ch-\'a\'] == <span class="kw">nullptr</span>) <span class="kw">return</span> word;\n        node = node-&gt;child[ch-\'a\'];\n        prefix += ch;\n        <span class="kw">if</span> (node-&gt;isEnd) <span class="kw">return</span> prefix;\n    }\n    <span class="kw">return</span> word;\n}';function mount(){viz.innerHTML=trieMarkup('ro','<b>替换单词</b>：第一次遇到 END，就是最短词根')+wordMarkup('rw',7,'word')+'<div class="metrics"><span class="metric" id="roresult"></span></div><div class="op-note" id="ronote"></div>';requestAnimationFrame(()=>layoutTrie('ro'));}function paint(s){paintTrie('ro',s);paintWord('rw',7,s.word,s.index,-1,s.stopFrom);const r=document.getElementById('roresult');r.textContent=s.result;r.className='metric '+(s.result.includes('bat')?'good':'info');document.getElementById('ronote').textContent='只要首次 END 命中，就不再扫描剩余字符';}return{id:'roots',label:'最短词根',sub:'首次 END 即返回',steps,mount,paint,layout:()=>layoutTrie('ro'),code};})();

const suggestScene=(()=>{const steps=[
  {visible:FULL,ends:ENDS,path:['root','a1','p1'],active:'p1',word:'ap',index:1,suggestions:[],chip:'定位前缀节点',chipC:'c0',title:'先沿 ap 走到前缀节点，再从这里收集候选',desc:'搜索建议先定位输入前缀对应的 Trie 节点。之后从这个节点 DFS，按 a 到 z 的子节点顺序访问，自然得到字典序最小的候选。'},
  {visible:FULL,ends:ENDS,path:PATHS.ape,active:'e1',word:'ap',index:1,suggestions:['ape'],chip:'先走 e',chipC:'cb',title:'e 比 p 小：先收集 ape',desc:'在 ap 节点的孩子中，e 排在 p 前。e1 带 END，因此第一个建议是 ape。字典序顺序来自对子节点按 a 到 z 的遍历。'},
  {visible:FULL,ends:ENDS,path:PATHS.app,active:'p2',word:'ap',index:1,suggestions:['ape','app'],chip:'再走 p',chipC:'ch',title:'访问 p 子树，p2 本身就是单词 app',desc:'继续 DFS 到 p2，先检查当前节点是否为词尾。p2 带 END，所以 app 成为第二个建议；之后还可继续走到更长单词 apple。'},
  {visible:FULL,ends:ENDS,path:PATHS.apple,active:'e2',word:'ap',index:1,suggestions:['ape','app','apple'],chip:'第三个候选',chipC:'cg',title:'沿 l → e 收集 apple，达到 3 个就停止',desc:'搜索建议通常只要最多 3 个结果。收集到 ape、app、apple 后即可提前停止 DFS，不必遍历该前缀下的全部单词。'},
  {visible:FULL,ends:ENDS,path:['root','a1','p1'],active:null,word:'ap',index:-1,suggestions:['ape','app','apple'],chip:'字典序前三项',chipC:'cg',title:'ap 的建议列表完成',desc:'Trie 适合动态词典和频繁前缀查询；若词典完全静态，排序数组加二分也能解决搜索建议，但动态插入时 Trie 更自然。'}
];const code='<span class="kw">void</span> <span class="fn">collect</span>(TrieNode* node, string& path) {\n    <span class="kw">if</span> (result.size() == 3) <span class="kw">return</span>;\n    <span class="kw">if</span> (node-&gt;isEnd) result.<span class="fn">push_back</span>(path);\n    <span class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt; 26; ++i) {\n        <span class="kw">if</span> (node-&gt;child[i] == <span class="kw">nullptr</span>) <span class="kw">continue</span>;\n        path += <span class="kw">char</span>(\'a\' + i);\n        <span class="fn">collect</span>(node-&gt;child[i], path);\n        path.<span class="fn">pop_back</span>();\n    }\n}';function mount(){viz.innerHTML=trieMarkup('su','<b>搜索建议</b>：定位前缀 ap 后，按字典序 DFS 收集最多 3 个单词')+wordMarkup('sw',2,'prefix')+'<div class="collbl">suggestions</div>'+answersMarkup('sa',3)+'<div class="op-note" id="sunote"></div>';requestAnimationFrame(()=>layoutTrie('su'));}function paint(s){paintTrie('su',s);paintWord('sw',2,s.word,s.index);paintAnswers('sa',3,s.suggestions,'suggest');document.getElementById('sunote').textContent=s.suggestions.length?'已收集 '+s.suggestions.length+' / 3 个候选':'从 ap 节点开始 DFS';}return{id:'suggest',label:'搜索建议',sub:'字典序 DFS · 最多 3 个',steps,mount,paint,layout:()=>layoutTrie('su'),code};})();

const SCENES=[insertScene,searchScene,boardScene,rootScene,suggestScene];
const tabsBox=document.getElementById('tabs'),dotsBox=document.getElementById('dots');const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stAct=document.getElementById('stAct'),stDesc=document.getElementById('stDesc'),codeBox=document.getElementById('codeBox'),readout=document.getElementById('readout');const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');
SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML='<span class="t">'+sc.label+'</span><span class="s">'+sc.sub+'</span>';b.onclick=()=>{stop();switchScene(i);};tabsBox.appendChild(b);});let si=0,cur=0,dotEls=[],timer=null;const ms=2800;
function switchScene(i){si=i;cur=0;[...tabsBox.children].forEach((tab,idx)=>tab.classList.toggle('on',idx===si));SCENES[si].mount();codeBox.innerHTML=SCENES[si].code;dotsBox.innerHTML='';dotEls=[];SCENES[si].steps.forEach((s,idx)=>{const d=document.createElement('button');d.className='dot';d.title=s.title;d.setAttribute('aria-label','第 '+idx+' 步：'+s.title);d.onclick=()=>{stop();go(idx);};dotsBox.appendChild(d);dotEls.push(d);});go(0);}
function go(i){const steps=SCENES[si].steps;cur=Math.max(0,Math.min(steps.length-1,i));const s=steps[cur];SCENES[si].paint(s);stTitle.textContent=SCENES[si].label;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;stAct.textContent='▸ '+s.title;stDesc.innerHTML=s.desc;dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});readout.textContent=cur+' / '+(steps.length-1);btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;if(cur===steps.length-1)stop();history.replaceState(null,'','#scene='+SCENES[si].id+'&step='+cur);}
function play(){if(cur===SCENES[si].steps.length-1)go(0);btnPlay.textContent='Ⅱ 暂停';btnPlay.setAttribute('aria-label','暂停动画');timer=setInterval(()=>{cur<SCENES[si].steps.length-1?go(cur+1):stop();},ms);}function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';btnPlay.setAttribute('aria-label','播放动画');}btnPlay.onclick=()=>timer?stop():play();btnPrev.onclick=()=>{stop();go(cur-1);};btnNext.onclick=()=>{stop();go(cur+1);};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();timer?stop():play();}});window.addEventListener('resize',()=>SCENES[si].layout());
const hashScene=location.hash.match(/scene=([a-z]+)/),hashStep=location.hash.match(/step=(\d+)/);let initialScene=0;if(hashScene){const found=SCENES.findIndex(scene=>scene.id===hashScene[1]);if(found>=0)initialScene=found;}switchScene(initialScene);if(hashStep)go(+hashStep[1]);
</script>
