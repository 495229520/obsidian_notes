<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试常考数据结构设计动画 · LRU / LFU / RandomizedSet / MedianFinder</title>
<style>
:root{
  /* Warm-paper teaching system: 8px rhythm, restrained semantic color, one shadow depth. */
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#3E3D39;--muted:#5F5E5A;--faint:#8A887F;
  --line:#C9C7BF;--grid:#E2E0D7;--gray:#F1EFE8;
  --blue:#185FA5;--bluebg:#E6F1FB;--green:#0F6E56;--greenbg:#E1F5EE;
  --brown:#9A5B0E;--brownbg:#FAEEDA;--danger:#B3402F;--dangerbg:#F6E0DB;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.68;padding:34px 40px 52px;text-wrap:pretty}
button{font:inherit}code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:2px 6px;border-radius:4px}
.wrap{max-width:1320px;margin:0 auto}header h1{font-size:27px;font-weight:600;letter-spacing:0}header p{font-size:14.5px;color:var(--muted);margin-top:7px}
header kbd{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:var(--panel)}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:26px}.tab{font-size:14.5px;font-weight:500;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 18px;cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease);display:flex;flex-direction:column;gap:3px;align-items:flex-start;justify-content:center;min-height:72px}.tab:hover{border-color:var(--muted);transform:translateY(-1px)}.tab:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.tab .t{font-weight:600;color:var(--ink)}.tab .s{font-size:11.5px;color:var(--faint);font-family:var(--mono)}.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 4px 14px rgba(62,61,57,.18)}.tab.on .t,.tab.on .s{color:var(--paper)}.tab.on .s{opacity:.78}
.layout{display:grid;grid-template-columns:minmax(0,760px) minmax(420px,1fr);gap:32px;margin-top:30px;align-items:start}.viz{background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:30px;min-height:610px;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(60,55,40,.05);overflow:hidden}.vcap{font-size:14px;color:var(--muted);margin-bottom:16px}.vcap b{color:var(--ink)}.right{display:flex;flex-direction:column;gap:20px}.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:25px 27px;min-height:280px;box-shadow:0 1px 4px rgba(60,55,40,.05)}.desc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.desc-head .st{font-size:21px;font-weight:600}.act{margin-top:18px;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:12px 15px;border-radius:7px}.desc-body{margin-top:14px;font-size:16px;color:var(--muted)}.desc-body b{color:var(--ink)}.desc-body .bl{color:var(--blue);font-weight:600}.desc-body .gr{color:var(--green);font-weight:600}.desc-body .br{color:var(--brown);font-weight:600}.desc-body .dg{color:var(--danger);font-weight:600}.chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid}.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray)}.chip.cb{color:var(--blue);border-color:var(--blue);background:var(--bluebg)}.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg)}.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg)}.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg)}.codebox{background:#2E2C27;border-radius:8px;padding:21px 23px;font-family:var(--mono);font-size:13.5px;line-height:1.72;color:#D8D5CC;white-space:pre;overflow-x:auto;box-shadow:0 3px 10px rgba(46,44,39,.19)}.codebox .cmt{color:#8F8B80}.codebox .kw{color:#E3A44C}.codebox .fn{color:#8EC5EA}
.collbl{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:center;margin:16px 0 9px}.op-note{text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:auto;padding-top:16px;min-height:38px}.op-note b{color:var(--ink)}.op-note .gr{color:var(--green);font-weight:700}.op-note .dg{color:var(--danger);font-weight:700}

/* Structure-choice map. */
.designmap{display:grid;gap:15px;margin-top:12px}.designrow{display:grid;grid-template-columns:minmax(0,1fr) 50px minmax(0,1.2fr);gap:12px;align-items:stretch;opacity:.42;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}.designrow.on{opacity:1;transform:translateY(-2px)}.need,.combo{border:1.5px solid var(--line);border-radius:8px;background:var(--paper);padding:16px 18px;transition:all var(--dur) var(--ease)}.designrow.on .need{border-color:var(--blue);background:var(--bluebg);color:var(--blue)}.designrow.on .combo{border-color:var(--green);background:var(--greenbg);color:var(--green)}.need b,.combo b{display:block;font-size:16px}.need span,.combo span{display:block;margin-top:4px;font-family:var(--mono);font-size:11.5px;color:var(--faint)}.mapplus{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:21px;color:var(--faint)}.mapchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.mapchip{font-family:var(--mono);font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}

/* LRU: persistent nodes glide across stable list positions. */
.lru-stage{position:relative;height:174px;margin-top:6px}.list-track{position:absolute;left:42px;right:42px;top:72px;height:2px;background:var(--line)}.endlabel{position:absolute;top:24px;font-family:var(--mono);font-size:11px;color:var(--faint)}.endlabel.mru{left:42px}.endlabel.lru{right:42px}.lnode{position:absolute;top:48px;width:104px;height:66px;border:2px solid var(--line);border-radius:8px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);opacity:0;transform:scale(.65);transition:left var(--dur) var(--ease),opacity var(--dur) var(--ease),transform var(--dur) var(--ease),background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}.lnode.show{opacity:1;transform:scale(1)}.lnode.hot{border-color:var(--blue);background:var(--bluebg);color:var(--blue);transform:scale(1.07)}.lnode.evict{border-color:var(--danger);background:var(--dangerbg);color:var(--danger);opacity:.52}.lnode .key{font-size:18px;font-weight:800}.lnode .val{font-size:11px;color:var(--faint)}.hashgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.hashslot{min-height:62px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);padding:9px 10px;font-family:var(--mono);font-size:12px;color:var(--faint);transition:all var(--dur) var(--ease)}.hashslot.show{border-color:var(--blue);background:var(--bluebg);color:var(--blue)}.hashslot.dead{border-color:var(--danger);background:var(--dangerbg);color:var(--danger);opacity:.55}.hashslot b{display:block;font-size:15px;color:inherit}

/* LFU: keys move between frequency lanes. */
.lfu-stage{position:relative;height:320px;margin-top:2px}.freqrow{position:absolute;left:74px;right:22px;height:82px;border:1px solid var(--grid);border-radius:8px;background:var(--paper)}.freqrow.f1{top:12px}.freqrow.f2{top:112px}.freqrow.f3{top:212px}.freqlabel{position:absolute;left:-66px;top:25px;font-family:var(--mono);font-size:12px;color:var(--muted)}.freqhint{position:absolute;right:12px;top:8px;font-family:var(--mono);font-size:10px;color:var(--faint)}.lfukey{position:absolute;width:92px;height:52px;border:2px solid var(--line);border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:800;opacity:0;transform:scale(.65);transition:left var(--dur) var(--ease),top var(--dur) var(--ease),opacity var(--dur) var(--ease),transform var(--dur) var(--ease),background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}.lfukey.show{opacity:1;transform:scale(1)}.lfukey.hot{border-color:var(--blue);background:var(--bluebg);color:var(--blue);transform:scale(1.08)}.lfukey.promote{border-color:var(--brown);background:var(--brownbg);color:var(--brown)}.lfukey.evict{border-color:var(--danger);background:var(--dangerbg);color:var(--danger);opacity:.4}.minfreq{display:flex;justify-content:center;gap:12px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:8px}.minfreq b{font-size:22px;color:var(--green);min-width:24px;text-align:center}

/* RandomizedSet: array and index map stay visibly synchronized. */
.arraybox{position:relative;padding-top:35px;margin-top:8px}.arrptr{position:absolute;top:0;left:0;opacity:0;transform:translateX(-50%);font-family:var(--mono);font-size:12px;color:var(--ink);transition:left var(--dur) var(--ease),opacity .2s}.arrayrow{display:grid;grid-template-columns:repeat(4,88px);gap:12px;justify-content:center}.acell{height:76px;border:2px solid var(--line);border-radius:8px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);transition:all var(--dur) var(--ease)}.acell .av{font-size:23px;font-weight:800;color:var(--muted)}.acell .ai{font-size:10px;color:var(--faint)}.acell.hot{border-color:var(--blue);background:var(--bluebg);transform:translateY(-4px)}.acell.hot .av{color:var(--blue)}.acell.last{border-color:var(--brown);background:var(--brownbg)}.acell.last .av{color:var(--brown)}.acell.done{border-color:var(--green);background:var(--greenbg)}.acell.done .av{color:var(--green)}.acell.dead{opacity:.26;border-style:dashed}.maptable{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.mapentry{min-height:58px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);padding:8px 10px;font-family:var(--mono);font-size:12px;color:var(--faint);transition:all var(--dur) var(--ease)}.mapentry.show{border-color:var(--blue);background:var(--bluebg);color:var(--blue)}.mapentry.changed{border-color:var(--green);background:var(--greenbg);color:var(--green)}.mapentry.dead{border-color:var(--danger);background:var(--dangerbg);color:var(--danger);opacity:.45}.mapentry b{display:block;font-size:15px;color:inherit}

/* MedianFinder: stable tokens travel between two heap panels. */
.median-stage{position:relative;height:278px;margin-top:6px}.heap-panel{position:absolute;top:18px;width:45%;height:220px;border:1px solid var(--grid);border-radius:8px;background:var(--paper);padding:15px}.heap-panel.left{left:2%}.heap-panel.right{right:2%}.heap-panel h3{text-align:center;font-size:14px;font-weight:600;color:var(--muted)}.heap-panel p{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}.heapline{position:absolute;left:12%;right:12%;top:85px;height:1px;background:var(--grid)}.median-token{position:absolute;width:62px;height:52px;border:2px solid var(--line);border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:18px;font-weight:800;opacity:0;transform:scale(.65);transition:left var(--dur) var(--ease),top var(--dur) var(--ease),opacity var(--dur) var(--ease),transform var(--dur) var(--ease),background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}.median-token.show{opacity:1;transform:scale(1)}.median-token.leftside{border-color:var(--blue);background:var(--bluebg);color:var(--blue)}.median-token.rightside{border-color:var(--brown);background:var(--brownbg);color:var(--brown)}.median-token.top{border-color:var(--green);background:var(--greenbg);color:var(--green);box-shadow:0 0 0 4px rgba(15,110,86,.14)}.medianread{text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted)}.medianread b{font-size:23px;color:var(--green)}.invariants{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.invariant{font-family:var(--mono);font-size:11.5px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--faint);transition:all var(--dur) var(--ease)}.invariant.ok{border-color:var(--green);background:var(--greenbg);color:var(--green)}

.controls{margin-top:26px;background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:17px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(60,55,40,.05)}.btn{font-size:14px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:10px 18px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;min-height:44px}.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted)}.btn:active:not(:disabled){transform:scale(.96)}.btn:disabled{opacity:.4;cursor:default}.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:104px}.dots{display:flex;gap:9px;margin:0 auto;flex-wrap:wrap;justify-content:center}.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease)}.dot:hover{border-color:var(--muted);transform:scale(1.2)}.dot.done{background:var(--line);border-color:var(--line)}.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.3)}.readout{font-family:var(--mono);font-size:14px;color:var(--muted);min-width:50px;text-align:center}
@media(max-width:1180px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:1fr}.right{display:grid;grid-template-columns:1fr 1fr}.codebox{min-height:270px}}
@media(max-width:720px){body{font-size:15px;padding:20px 14px 32px}header h1{font-size:22px}header p{font-size:13px}.tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}.tab{font-size:13px;padding:9px 12px;min-height:60px}.tab .s{font-size:10.5px}.right{display:flex}.viz{padding:16px;min-height:560px}.vcap{font-size:12px}.designrow{grid-template-columns:1fr 28px 1.15fr;gap:6px}.need,.combo{padding:11px 10px}.need b,.combo b{font-size:13px}.mapchip{font-size:10px;padding:3px 5px}.lnode{width:72px;height:58px}.hashgrid,.maptable{grid-template-columns:repeat(2,1fr)}.lfu-stage{height:304px}.freqrow{left:50px;right:2px}.freqlabel{left:-46px}.lfukey{width:66px}.arrayrow{grid-template-columns:repeat(4,minmax(0,70px));gap:6px}.acell{height:68px}.median-stage{height:268px}.median-token{width:48px;height:46px}.heap-panel{width:47%}.heap-panel.left{left:0}.heap-panel.right{right:0}.desc-card{padding:18px 20px;min-height:218px}.desc-head .st{font-size:17px}.act{font-size:12.5px;margin-top:14px;padding:9px 13px}.desc-body{font-size:14px;margin-top:10px}.codebox{font-size:11px;padding:14px 17px}.controls{padding:12px;gap:8px;margin-top:22px}.dots{order:4;width:100%}.btn{font-size:13px;padding:8px 12px;min-height:44px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}
</style>

<body>
<div class="wrap">
  <header>
    <h1>面试常考数据结构设计 · 把复杂度拆成结构职责</h1>
    <p>接口约束、LRU、LFU、RandomizedSet、MedianFinder　·　上方切主题，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="动画主题"></nav>
  <div class="layout">
    <section class="viz" id="viz" aria-live="polite"></section>
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="act" id="stAct"></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
      <div class="codebox" id="codeBox"></div>
    </section>
  </div>
  <div class="controls">
    <button class="btn" id="btnPrev" aria-label="上一步">‹ 上一步</button>
    <button class="btn primary" id="btnPlay" aria-label="播放动画">▶ 播放</button>
    <button class="btn" id="btnNext" aria-label="下一步">下一步 ›</button>
    <div class="dots" id="dots" aria-label="步骤跳转"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>
<script>
const viz=document.getElementById('viz');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const designScene=(()=>{const steps=[
  {row:-1,chip:'先接口，后结构',chipC:'c0',title:'先写清接口语义与复杂度，再决定底层结构',desc:'设计题不是“猜 STL”。先明确 <b>get 是否改变顺序</b>、淘汰规则、随机是否等概率，以及每个操作必须达到的复杂度。结构只为这些约束服务。'},
  {row:0,chip:'定位 + 顺序',chipC:'cb',title:'平均 O(1) 查找，同时维护最近访问顺序',desc:'哈希表负责从 key 直接定位节点；双向链表负责在 O(1) 时间移动和删除节点。两种职责组合后才得到 LRU。'},
  {row:1,chip:'定位 + 随机下标',chipC:'ch',title:'平均 O(1) 删除，同时支持等概率随机访问',desc:'哈希表把 value 映射到数组下标；vector 提供 O(1) 下标访问。删除中间元素时用末尾覆盖，避开线性搬移。'},
  {row:2,chip:'分区 + 边界',chipC:'cg',title:'动态数据流中持续维护中间边界',desc:'大根堆保存较小的一半，小根堆保存较大的一半。两个堆顶正好夹住中位数，插入后只需恢复大小平衡。'},
  {row:3,chip:'模式复用',chipC:'cg',title:'一个结构只承担一种最擅长的职责',desc:'MinStack 用辅助栈维护历史最小值，单调队列用 deque 维护候选下标，Trie 用字符路径处理前缀。面试表达时要把“谁负责定位、谁负责顺序、谁负责边界”讲清楚。'}
];const code='<span class="cmt">// 先写约束，再组合结构</span>\nLRU          = unordered_map + list\nLFU          = keyMap + freqMap + minFreq\nRandomizedSet = unordered_map + vector\nMedianFinder = maxHeap + minHeap\nMinStack     = dataStack + minStack';
function mount(){viz.innerHTML='<div class="vcap"><b>结构选择</b>：把接口要求拆成彼此独立的职责</div><div class="designmap"><div class="designrow" id="dr0"><div class="need"><b>O(1) 定位 + 最近顺序</b><span>get / put / evict</span></div><div class="mapplus">→</div><div class="combo"><b>unordered_map + list</b><div class="mapchips"><span class="mapchip">定位</span><span class="mapchip">移动</span></div></div></div><div class="designrow" id="dr1"><div class="need"><b>O(1) 删除 + 随机返回</b><span>remove / getRandom</span></div><div class="mapplus">→</div><div class="combo"><b>unordered_map + vector</b><div class="mapchips"><span class="mapchip">下标</span><span class="mapchip">随机访问</span></div></div></div><div class="designrow" id="dr2"><div class="need"><b>动态插入 + 中位数</b><span>addNum / findMedian</span></div><div class="mapplus">→</div><div class="combo"><b>maxHeap + minHeap</b><div class="mapchips"><span class="mapchip">左半</span><span class="mapchip">右半</span></div></div></div></div><div class="op-note" id="dnote"></div>'}
function paint(s){for(let i=0;i<3;i++)document.getElementById('dr'+i).classList.toggle('on',s.row===i||s.row===3);document.getElementById('dnote').innerHTML=s.row===3?'<span class="gr">结构职责清楚，复杂度证明才成立</span>':'目标：每个接口的复杂度都能从组合结构直接推出'}return{id:'design',label:'结构选择',sub:'接口 → 结构职责',steps,mount,paint,code};})();

const lruScene=(()=>{const keys=[1,2,3,4];const steps=[
  {order:[],hot:null,evict:null,chip:'capacity = 3',chipC:'c0',title:'链表维护新旧顺序，哈希表保存节点位置',desc:'链表头是 MRU，尾是 LRU。哈希表让 key 在平均 O(1) 时间定位到链表节点；容量为 3。',note:'MRU 在左，LRU 在右'},
  {order:[1],hot:1,evict:null,chip:'put(1, A)',chipC:'cb',title:'新 key 插入链表头，并记录迭代器',desc:'节点 1 成为最近使用项。哈希表保存 key 到该链表节点的迭代器，之后不需要扫描链表。'},
  {order:[2,1],hot:2,evict:null,chip:'put(2, B)',chipC:'cb',title:'新节点始终从 MRU 端进入',desc:'2 插到头部，原来的 1 自然向 LRU 方向后移。链表顺序本身就是访问时间。'},
  {order:[3,2,1],hot:3,evict:null,chip:'put(3, C)',chipC:'cb',title:'容量填满：尾节点 1 是当前淘汰候选',desc:'哈希表负责查找，链表尾部直接暴露最久未使用项，因此淘汰不需要比较时间戳。'},
  {order:[1,3,2],hot:1,evict:null,chip:'get(1)',chipC:'ch',title:'get 命中也是一次访问：把 1 移到头部',desc:'读取 value 后必须更新顺序。C++ 的 <code>list::splice</code> 能原地移动节点，已有迭代器继续有效。'},
  {order:[4,1,3],hot:4,evict:2,chip:'put(4, D)',chipC:'cd',title:'插入 4 后超容量，删除尾部的 2',desc:'先取尾节点 key，再从哈希表删除 key=2，最后弹出链表尾。漏删任一侧都会让两种结构失去同步。'}
];const code='<span class="kw">int</span> <span class="fn">get</span>(<span class="kw">int</span> key) {\n    <span class="kw">auto</span> it = pos.find(key);\n    <span class="kw">if</span> (it == pos.end()) <span class="kw">return</span> -1;\n    cache.splice(cache.begin(), cache, it-&gt;second);\n    <span class="kw">return</span> it-&gt;second-&gt;second;\n}\n<span class="cmt">// 超容量：先 erase map，再 pop_back list</span>';
function mount(){let nodes='',slots='';keys.forEach(k=>{nodes+='<div class="lnode" id="ln'+k+'"><span class="key">'+k+'</span><span class="val">value '+String.fromCharCode(64+k)+'</span></div>';slots+='<div class="hashslot" id="lh'+k+'"><b>key '+k+'</b><span>iterator → node</span></div>'});viz.innerHTML='<div class="vcap"><b>LRU Cache</b>：unordered_map 定位，list 维护最近访问顺序</div><div class="lru-stage"><span class="endlabel mru">MRU / head</span><span class="endlabel lru">LRU / tail</span><div class="list-track"></div>'+nodes+'</div><div class="collbl">pos：key → list iterator</div><div class="hashgrid">'+slots+'</div><div class="op-note" id="lrnote"></div>'}
function paint(s){const stage=document.querySelector('.lru-stage'),sample=document.getElementById('ln1'),pad=16,gap=Math.max(0,(stage.clientWidth-pad*2-sample.offsetWidth)/3);keys.forEach(k=>{const n=document.getElementById('ln'+k),idx=s.order.indexOf(k),visible=idx>=0||s.evict===k,pos=s.evict===k?3:Math.max(0,idx);n.className='lnode'+(visible?' show':'')+(s.hot===k?' hot':'')+(s.evict===k?' evict':'');n.style.left=(pad+pos*gap)+'px';const h=document.getElementById('lh'+k);h.className='hashslot'+(idx>=0?' show':'')+(s.evict===k?' dead':'')});document.getElementById('lrnote').innerHTML=s.evict?'<span class="dg">evict key 2：map 与 list 必须同步删除</span>':s.note||'list::splice：移动节点但保持迭代器有效'}return{id:'lru',label:'LRU Cache',sub:'map + 双向链表',steps,mount,paint,code};})();

const lfuScene=(()=>{const keys=[1,2,3,4];const steps=[
  {loc:{1:[1,2],2:[1,1],3:[1,0]},hot:null,evict:null,min:1,chip:'capacity = 3',chipC:'c0',title:'每个频次内部仍按最近使用顺序排列',desc:'keyMap 直接定位 key 的 value、freq 和链表迭代器；freqMap 为每个频次维护一条 LRU 链表；minFreq 指向最低非空频次。'},
  {loc:{1:[2,0],2:[1,1],3:[1,0]},hot:1,evict:null,min:1,chip:'get(1)',chipC:'cb',title:'key 1 从 freq=1 提升到 freq=2',desc:'先从旧频次链表删除，再插入新频次链表头。旧桶仍有 key，所以 minFreq 保持 1。'},
  {loc:{1:[2,1],2:[2,0],3:[1,0]},hot:2,evict:null,min:1,chip:'get(2)',chipC:'cb',title:'key 2 进入 freq=2，并成为该桶 MRU',desc:'相同频次还要区分时间先后。freq=2 桶中 2 在头部，1 在尾部；这就是 LFU 内部嵌套 LRU 的原因。'},
  {loc:{1:[3,0],2:[2,0],3:[1,0]},hot:1,evict:null,min:1,chip:'get(1)',chipC:'ch',title:'key 1 再次提升，形成三个频次层级',desc:'提升只触碰 key 当前所在桶和下一个桶，不扫描所有 key，因此 get 仍保持平均 O(1)。'},
  {loc:{1:[3,0],2:[2,0],4:[1,0]},hot:4,evict:3,min:1,chip:'put(4)',chipC:'cd',title:'容量已满：从 minFreq=1 的尾部淘汰 key 3',desc:'淘汰目标不是全局最旧，而是“最低频次桶中的最旧项”。删除 3 后，新 key 4 以 freq=1 插入，并把 minFreq 重置为 1。'},
  {loc:{1:[3,0],2:[2,1],4:[2,0]},hot:4,evict:null,min:2,chip:'get(4)',chipC:'cg',title:'freq=1 桶变空，minFreq 从 1 更新为 2',desc:'若旧频次正好等于 minFreq 且删除后桶为空，必须递增 minFreq。漏掉这一步，下一次淘汰就找不到正确桶。'}
];const code='<span class="kw">void</span> <span class="fn">touch</span>(<span class="kw">int</span> key) {\n    <span class="kw">auto</span>& node = keyMap[key];\n    <span class="kw">int</span> f = node.freq;\n    freqMap[f].erase(node.it);\n    <span class="kw">if</span> (f == minFreq && freqMap[f].empty()) ++minFreq;\n    freqMap[++node.freq].push_front(key);\n    node.it = freqMap[node.freq].begin();\n}';
function mount(){let keysHtml='';keys.forEach(k=>keysHtml+='<div class="lfukey" id="fk'+k+'">key '+k+'</div>');viz.innerHTML='<div class="vcap"><b>LFU Cache</b>：最低频次优先；同频次内淘汰最久未使用项</div><div class="lfu-stage"><div class="freqrow f1"><span class="freqlabel">freq 1</span><span class="freqhint">MRU → LRU</span></div><div class="freqrow f2"><span class="freqlabel">freq 2</span><span class="freqhint">MRU → LRU</span></div><div class="freqrow f3"><span class="freqlabel">freq 3</span><span class="freqhint">MRU → LRU</span></div>'+keysHtml+'</div><div class="minfreq">minFreq = <b id="minfreq">1</b><span id="lfunote"></span></div>'}
function paint(s){const row=document.querySelector('.freqrow'),sample=document.getElementById('fk1'),x0=row.offsetLeft+16,gap=Math.max(0,(row.clientWidth-32-sample.offsetWidth)/2),y={1:27,2:127,3:227};keys.forEach(k=>{const p=s.loc[k],el=document.getElementById('fk'+k),show=!!p||s.evict===k;el.className='lfukey'+(show?' show':'')+(s.hot===k?' hot':'')+(s.evict===k?' evict':'');if(p){el.style.left=(x0+p[1]*gap)+'px';el.style.top=y[p[0]]+'px'}else if(s.evict===k){el.style.left=(x0+2*gap)+'px';el.style.top=y[1]+'px'}});document.getElementById('minfreq').textContent=s.min;document.getElementById('lfunote').textContent=s.evict?'· 淘汰 key 3':'· 始终指向最低非空桶'}return{id:'lfu',label:'LFU Cache',sub:'keyMap + freqMap',steps,mount,paint,code};})();

const randomScene=(()=>{const steps=[
  {vals:[8,3,6,9],active:-1,last:-1,dead:-1,map:{8:0,3:1,6:2,9:3},changed:null,removed:null,ptr:-1,chip:'vector + map',chipC:'c0',title:'数组负责随机访问，哈希表负责值到下标的定位',desc:'getRandom 只需均匀生成合法下标。难点在 remove：vector 中间删除会移动后续元素，不能满足平均 O(1)。'},
  {vals:[8,3,6,9],active:1,last:-1,dead:-1,map:{8:0,3:1,6:2,9:3},changed:null,removed:null,ptr:1,chip:'remove(3)',chipC:'cb',title:'哈希表直接得到 3 位于下标 1',desc:'通过 index[3] 在平均 O(1) 时间找到待删位置，不需要扫描 vector。'},
  {vals:[8,3,6,9],active:1,last:3,dead:-1,map:{8:0,3:1,6:2,9:3},changed:null,removed:null,ptr:3,chip:'last = 9',chipC:'ch',title:'读取末尾元素 9，准备覆盖下标 1',desc:'末尾删除可以直接 pop_back，因此先把最后一个元素搬到洞的位置。'},
  {vals:[8,9,6,9],active:1,last:3,dead:-1,map:{8:0,3:1,6:2,9:1},changed:9,removed:null,ptr:1,chip:'覆盖 + 改映射',chipC:'cg',title:'nums[1] = 9，同时把 index[9] 更新为 1',desc:'覆盖动作和哈希映射必须同步。若忘记更新 index[9]，以后删除 9 会访问已经失效的下标 3。'},
  {vals:[8,9,6,9],active:-1,last:-1,dead:3,map:{8:0,6:2,9:1},changed:9,removed:3,ptr:-1,chip:'pop + erase',chipC:'cg',title:'pop_back 删除重复尾项，再从 map 删除 key 3',desc:'vector 变为 [8, 9, 6]，map 也只保留三个有效映射。四个步骤都只触碰常数个位置。'},
  {vals:[8,9,6,9],active:1,last:-1,dead:3,map:{8:0,6:2,9:1},changed:null,removed:3,ptr:1,chip:'getRandom()',chipC:'cg',title:'在有效下标区间均匀采样，示例命中 9',desc:'连续 vector 让每个元素对应一个等概率下标。哈希表不参与随机，只负责 insert 和 remove 的定位。'}
];const code='<span class="kw">bool</span> <span class="fn">remove</span>(<span class="kw">int</span> val) {\n    <span class="kw">auto</span> it = index.find(val);\n    <span class="kw">if</span> (it == index.end()) <span class="kw">return</span> <span class="kw">false</span>;\n    <span class="kw">int</span> i = it-&gt;second, last = nums.back();\n    nums[i] = last;\n    index[last] = i;\n    nums.pop_back();\n    index.erase(it);\n    <span class="kw">return</span> <span class="kw">true</span>;\n}';
function mount(){let cells='',entries='';[8,3,6,9].forEach((v,i)=>cells+='<div class="acell" id="ac'+i+'"><span class="av"></span><span class="ai">index '+i+'</span></div>');[8,3,6,9].forEach(v=>entries+='<div class="mapentry" id="me'+v+'"><b>value '+v+'</b><span class="mi"></span></div>');viz.innerHTML='<div class="vcap"><b>RandomizedSet</b>：删除时用末尾覆盖，随机时直接抽数组下标</div><div class="arraybox"><span class="arrptr" id="arptr">▼ current</span><div class="arrayrow">'+cells+'</div></div><div class="collbl">index：value → vector index</div><div class="maptable">'+entries+'</div><div class="op-note" id="rsnote"></div>'}
function paint(s){s.vals.forEach((v,i)=>{const c=document.getElementById('ac'+i);c.querySelector('.av').textContent=v;c.className='acell'+(s.active===i?' hot':'')+(s.last===i?' last':'')+(s.dead===i?' dead':'')+(s.changed===v&&i===1?' done':'')});const ptr=document.getElementById('arptr');if(s.ptr<0)ptr.style.opacity=0;else{const target=document.getElementById('ac'+s.ptr);ptr.style.opacity=1;ptr.style.left=(target.offsetLeft+target.offsetWidth/2)+'px'};[8,3,6,9].forEach(v=>{const e=document.getElementById('me'+v),exists=Object.prototype.hasOwnProperty.call(s.map,v);e.className='mapentry'+(exists?' show':'')+(s.changed===v?' changed':'')+(s.removed===v?' dead':'');e.querySelector('.mi').textContent=exists?'index = '+s.map[v]:'已删除'});document.getElementById('rsnote').innerHTML=s.dead>=0?'<span class="gr">有效数组：[8, 9, 6] · 每个元素仍只占一个下标</span>':'中间删除不搬移整段，只覆盖一个位置'}return{id:'random',label:'RandomizedSet',sub:'vector + 下标表',steps,mount,paint,code};})();

const medianScene=(()=>{const values=[5,2,10,4,8];const steps=[
  {left:[],right:[],hot:null,median:'—',chip:'两个不变量',chipC:'c0',title:'左堆保存较小一半，右堆保存较大一半',desc:'左侧大根堆的堆顶是左半最大值，右侧小根堆的堆顶是右半最小值。大小相等，或左侧恰好多一个元素。'},
  {left:[5],right:[],hot:5,median:'5',chip:'addNum(5)',chipC:'cb',title:'首个元素进入左侧大根堆',desc:'左侧比右侧多一个元素，大小平衡成立，中位数就是 left.top。'},
  {left:[2],right:[5],hot:5,median:'3.5',chip:'addNum(2)',chipC:'ch',title:'2 进入左堆后过重，把堆顶 5 移到右堆',desc:'重平衡移动的是边界元素。两个堆大小相等，中位数是两个堆顶的平均值。'},
  {left:[5,2],right:[10],hot:5,median:'5',chip:'addNum(10)',chipC:'cb',title:'10 先进入右堆，随后右堆顶 5 回到左堆',desc:'插入后右侧多于左侧，因此把右侧最小值移到左侧。左边多一个，中位数再次由 left.top 给出。'},
  {left:[4,2],right:[5,10],hot:5,median:'4.5',chip:'addNum(4)',chipC:'ch',title:'4 进入左堆后，边界 5 被移到右堆',desc:'两边重新等长，且 left.top 不大于 right.top。查询中位数只读两个堆顶，不修改结构。'},
  {left:[5,2,4],right:[8,10],hot:5,median:'5',chip:'addNum(8)',chipC:'cg',title:'8 进入右堆后，把右堆顶 5 移回左堆',desc:'最终左侧保存 2、4、5，右侧保存 8、10。两个不变量成立，因此中位数稳定落在边界 5。'}
];const code='<span class="kw">void</span> <span class="fn">rebalance</span>() {\n    <span class="kw">if</span> (left.size() &gt; right.size() + 1) {\n        right.push(left.top()); left.pop();\n    } <span class="kw">else if</span> (right.size() &gt; left.size()) {\n        left.push(right.top()); right.pop();\n    }\n}\n<span class="cmt">// 查询只读两个堆顶：O(1)</span>';
function mount(){let tokens='';values.forEach(v=>tokens+='<div class="median-token" id="mt'+v+'">'+v+'</div>');viz.innerHTML='<div class="vcap"><b>MedianFinder</b>：两个堆顶夹住数据流的中间边界</div><div class="median-stage"><div class="heap-panel left"><h3>left · 大根堆</h3><p>较小的一半 · top 最大</p><div class="heapline"></div></div><div class="heap-panel right"><h3>right · 小根堆</h3><p>较大的一半 · top 最小</p><div class="heapline"></div></div>'+tokens+'</div><div class="medianread">median = <b id="medread">—</b></div><div class="invariants"><span class="invariant" id="invsize">size 差不超过 1</span><span class="invariant" id="invorder">left.top ≤ right.top</span></div>'}
function paint(s){const panels=[document.querySelector('.heap-panel.left'),document.querySelector('.heap-panel.right')],sample=document.getElementById('mt5'),ys=[108,168,168],slotX=(panel,i)=>panel.offsetLeft+panel.clientWidth*[.5,.27,.67][i]-sample.offsetWidth/2;values.forEach(v=>{const el=document.getElementById('mt'+v),li=s.left.indexOf(v),ri=s.right.indexOf(v),show=li>=0||ri>=0;el.className='median-token'+(show?' show':'')+(li>=0?' leftside':'')+(ri>=0?' rightside':'')+(s.hot===v?' top':'');if(li>=0){el.style.left=slotX(panels[0],li)+'px';el.style.top=ys[li]+'px'}else if(ri>=0){el.style.left=slotX(panels[1],ri)+'px';el.style.top=ys[ri]+'px'}});document.getElementById('medread').textContent=s.median;document.getElementById('invsize').classList.toggle('ok',s.left.length+s.right.length>0);document.getElementById('invorder').classList.toggle('ok',s.left.length>0&&s.right.length>0)}return{id:'median',label:'双堆中位数',sub:'maxHeap + minHeap',steps,mount,paint,code};})();

const SCENES=[designScene,lruScene,lfuScene,randomScene,medianScene];
const tabsBox=document.getElementById('tabs'),dotsBox=document.getElementById('dots');const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stAct=document.getElementById('stAct'),stDesc=document.getElementById('stDesc'),codeBox=document.getElementById('codeBox'),readout=document.getElementById('readout');const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');
SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML='<span class="t">'+sc.label+'</span><span class="s">'+sc.sub+'</span>';b.onclick=()=>{stop();switchScene(i)};tabsBox.appendChild(b)});let si=0,cur=0,dotEls=[],timer=null;const ms=2900;
function switchScene(i){si=i;cur=0;[...tabsBox.children].forEach((tab,idx)=>tab.classList.toggle('on',idx===si));SCENES[si].mount();codeBox.innerHTML=SCENES[si].code;dotsBox.innerHTML='';dotEls=[];SCENES[si].steps.forEach((s,idx)=>{const d=document.createElement('button');d.className='dot';d.title=s.title;d.setAttribute('aria-label','第 '+idx+' 步：'+s.title);d.onclick=()=>{stop();go(idx)};dotsBox.appendChild(d);dotEls.push(d)});go(0)}
function go(i){const steps=SCENES[si].steps;cur=Math.max(0,Math.min(steps.length-1,i));const s=steps[cur];SCENES[si].paint(s);stTitle.textContent=SCENES[si].label;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;stAct.textContent='▸ '+s.title;stDesc.innerHTML=s.desc;dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur)});readout.textContent=cur+' / '+(steps.length-1);btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;if(cur===steps.length-1)stop();history.replaceState(null,'','#scene='+SCENES[si].id+'&step='+cur)}
function play(){if(cur===SCENES[si].steps.length-1)go(0);btnPlay.textContent='Ⅱ 暂停';btnPlay.setAttribute('aria-label','暂停动画');timer=setInterval(()=>{cur<SCENES[si].steps.length-1?go(cur+1):stop()},ms)}function stop(){if(timer){clearInterval(timer);timer=null}btnPlay.textContent='▶ 播放';btnPlay.setAttribute('aria-label','播放动画')}btnPlay.onclick=()=>timer?stop():play();btnPrev.onclick=()=>{stop();go(cur-1)};btnNext.onclick=()=>{stop();go(cur+1)};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1)}else if(e.key==='ArrowLeft'){stop();go(cur-1)}else if(e.key===' '&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();timer?stop():play()}});
window.addEventListener('resize',()=>SCENES[si].paint(SCENES[si].steps[cur]));
const hashScene=location.hash.match(/scene=([a-z]+)/),hashStep=location.hash.match(/step=(\d+)/);let initialScene=0;if(hashScene){const found=SCENES.findIndex(scene=>scene.id===hashScene[1]);if(found>=0)initialScene=found}switchScene(initialScene);if(hashStep)go(+hashStep[1]);
</script>
