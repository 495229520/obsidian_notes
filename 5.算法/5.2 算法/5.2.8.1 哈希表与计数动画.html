<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈希表动画 · 拉链冲突 / rehash / 两数之和 / 最长连续序列</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#3E3D39;--muted:#5F5E5A;--faint:#8a887f;
  --line:#c9c7bf;--grid:#e2e0d7;
  --blue:#185FA5;--bluebg:#E6F1FB;
  --green:#0F6E56;--greenbg:#E1F5EE;
  --brown:#9A5B0E;--brownbg:#FAEEDA;
  --danger:#B3402F;--dangerbg:#F6E0DB;
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.34,.02,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 44px;text-wrap:pretty;}
.wrap{max-width:1180px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.4px;}
header p{font-size:13px;color:var(--muted);margin-top:5px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.9em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
.tab{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 17px;cursor:pointer;transition:all .18s var(--ease);display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
.tab:hover{border-color:var(--muted);transform:translateY(-1px);}
.tab .t{font-weight:600;color:var(--ink);}
.tab .s{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
.tab.on{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 10px rgba(62,61,57,.18);}
.tab.on .t,.tab.on .s{color:var(--paper);}
.tab.on .s{opacity:.72;}

.layout{display:grid;grid-template-columns:626px 1fr;gap:26px;margin-top:22px;align-items:start;}
@media(max-width:1080px){.layout{grid-template-columns:1fr;}}
.viz{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:22px;min-height:452px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.viz .vcap{font-size:12px;color:var(--muted);margin-bottom:14px;}
.viz .vcap b{color:var(--ink);}

/* ---- 桶 + 拉链 ---- */
.buckets{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px;}
.brow{display:flex;align-items:center;gap:12px;}
.bidx{width:96px;font-family:var(--mono);font-size:11.5px;color:var(--faint);text-align:right;flex-shrink:0;}
.bslot{width:14px;height:40px;border-radius:5px 0 0 5px;border:1.5px solid var(--line);border-right:none;background:var(--gray);flex-shrink:0;}
.chain{display:flex;align-items:center;gap:0;flex-wrap:wrap;min-height:40px;}
.hnode{width:42px;height:40px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:14px;border:1.5px solid var(--blue);border-radius:8px;background:var(--bluebg);color:var(--blue);box-shadow:0 1px 2px rgba(60,55,40,.06);}
.hnode.pop{animation:pop .55s var(--ease);}
.hnode.collide{border-color:var(--danger);background:var(--dangerbg);color:var(--danger);}
.harr{width:18px;text-align:center;color:var(--faint);font-size:14px;}
@keyframes pop{0%{transform:scale(.5);opacity:.2;}70%{transform:scale(1.14);}100%{transform:scale(1);opacity:1;}}
.loadbar{text-align:center;font-family:var(--mono);font-size:13.5px;color:var(--muted);margin-top:auto;padding-top:10px;}
.loadbar b{color:var(--ink);}
.loadbar .warn{color:var(--danger);font-weight:700;}
.loadbar .ok{color:var(--green);font-weight:700;}

/* ---- 通用单元格（持久 DOM，靠 class 过渡）---- */
.cwrap{position:relative;margin:6px 0 20px;min-height:96px;}
.cellrow{display:flex;gap:8px;justify-content:center;position:relative;padding-top:22px;}
.cell{width:50px;height:50px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:17px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--muted);position:relative;transition:all var(--dur) var(--ease);}
.cell.cur{background:var(--bluebg);border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px rgba(24,95,165,.14);}
.cell.start{background:var(--greenbg);border-color:var(--green);color:var(--green);box-shadow:0 0 0 4px rgba(15,110,86,.15);}
.cell.ext{background:var(--brownbg);border-color:var(--brown);color:var(--brown);}
.cell.skip{opacity:.32;}
.cell.found{background:var(--greenbg);border-color:var(--green);color:var(--green);box-shadow:0 0 0 4px rgba(15,110,86,.15);}
.cell .idx{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--faint);font-weight:400;}
.cbadge{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--blue);text-align:center;transition:left var(--dur) var(--ease),opacity .25s;line-height:1.05;pointer-events:none;}
.cbadge .tri{font-size:9px;display:block;}

/* ---- 哈希表 map 展示 ---- */
.maprow{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:6px 0 12px;min-height:38px;}
.maprow .lbl{font-family:var(--mono);font-size:11px;color:var(--faint);}
.ment{font-family:var(--mono);font-size:13px;font-weight:700;border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--panel);color:var(--muted);}
.ment.pop{animation:pop .5s var(--ease);}
.ment.hit{border-color:var(--green);background:var(--greenbg);color:var(--green);box-shadow:0 0 0 4px rgba(15,110,86,.15);}
.needbar{text-align:center;font-family:var(--mono);font-size:13.5px;color:var(--muted);margin:4px 0 6px;min-height:22px;}
.needbar b{color:var(--ink);}.needbar .hit{color:var(--green);font-weight:700;}.needbar .miss{color:var(--danger);font-weight:700;}

/* ---- 异位词分组 ---- */
.words{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px;}
.word{font-family:var(--mono);font-weight:700;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:8px 13px;background:var(--paper);color:var(--muted);transition:all var(--dur) var(--ease);}
.word.cur{border-color:var(--blue);background:var(--bluebg);color:var(--blue);box-shadow:0 0 0 4px rgba(24,95,165,.14);}
.word.done{opacity:.38;}
.keyline{text-align:center;font-family:var(--mono);font-size:13.5px;color:var(--muted);margin:2px 0 16px;min-height:22px;}
.keyline b{color:var(--brown);}
.groups{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:auto;}
.grp{border:1px solid var(--grid);border-radius:11px;padding:9px 13px;background:var(--paper);min-width:112px;box-shadow:0 1px 2px rgba(60,55,40,.05);}
.grp.enter{animation:pop .5s var(--ease);}
.grp .gk{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:7px;text-align:center;}
.grp .gv{display:flex;flex-direction:column;gap:4px;align-items:center;}
.grp .gw{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue);}
.grp.flash{border-color:var(--blue);box-shadow:0 0 0 4px rgba(24,95,165,.13);}

/* ---- 右侧 ---- */
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:18px 20px;min-height:196px;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.chip{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;border:1px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cb{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.act{margin-top:14px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:9px 13px;border-radius:9px;}
.desc-body{margin-top:13px;font-size:13.5px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .bl{color:var(--blue);font-weight:600;}
.desc-body .gr{color:var(--green);font-weight:600;}
.desc-body .dg{color:var(--danger);font-weight:600;}
.desc-body .br{color:var(--brown);font-weight:600;}
.codebox{background:#2E2C27;border-radius:11px;padding:14px 17px;font-family:var(--mono);font-size:12px;line-height:1.65;color:#D8D5CC;white-space:pre;overflow-x:auto;box-shadow:0 2px 8px rgba(46,44,39,.18);}
.codebox .cmt{color:#8F8B80;} .codebox .kw{color:#E3A44C;}

.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(60,55,40,.04);}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease),border-color .15s;}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.38;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:92px;}
.dots{display:flex;gap:7px;margin:0 auto;flex-wrap:wrap;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:48px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>

<body>
<div class="wrap">
  <header>
    <h1>哈希表与计数动画 · 四个核心套路</h1>
    <p>拉链冲突 + rehash 扩容 / 两数之和查补数 / 最长连续序列 / 异位词分组　·　上方切主题，<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <section class="viz" id="viz"></section>
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="act" id="stAct"></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
      <div class="codebox" id="codeBox"></div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
const viz=document.getElementById('viz');

/* 持久单元格行：cells 建一次，靠 class 过渡；badge 用像素 left 平滑滑动 */
function buildCells(container,values,withBadge,badgeName){
  let row='<div class="cellrow" id="crow">';
  values.forEach((v,i)=>{row+='<div class="cell" id="c'+i+'"><span class="idx">'+i+'</span>'+v+'</div>';});
  row+='</div>';
  if(withBadge)row+='<div class="cbadge" id="cbadge" style="opacity:0">'+badgeName+'<span class="tri">▲</span></div>';
  container.innerHTML=row;
}
function moveBadge(i){
  const b=document.getElementById('cbadge');if(!b)return;
  if(i==null){b.style.opacity=0;return;}
  const cell=document.getElementById('c'+i);
  b.style.left=(cell.offsetLeft+cell.offsetWidth/2)+'px';
  b.style.top=(cell.offsetTop+cell.offsetHeight+8)+'px';
  b.style.opacity=1;
}

/* ========== 场景 1：拉链法冲突 + rehash ========== */
const chainScene={
  id:'chain',label:'拉链 + rehash',sub:'冲突与扩容',
  code:'<span class="cmt">// 拉链法：bucket = hash(key) % N</span>\n'+
    'freq.max_load_factor(0.75);\n'+
    '<span class="kw">if</span>(size &gt; N * max_load_factor)\n'+
    '    rehash(2*N);   <span class="cmt">// 扩容并重新散列</span>\n'+
    '<span class="cmt">// rehash 后旧迭代器全部失效</span>',
  steps:[
    {N:5,table:{},chip:'5 个桶，空表',chipC:'c0',
     act:'▸ 定位公式 bucket = hash(key) % N，此处 N = 5',
     desc:'哈希表不是拿 key 直接当下标，而是 <code>hash(key) % N</code> 映射到<b>桶（bucket）</b>。这里 <code>hash(k)=k</code>、桶数 <b>N=5</b>。不同 key 落进同一桶叫<b>冲突</b>，用<b>拉链法</b>把它们串成链表挂在桶后。'},
    {N:5,table:{2:[12]},ins:12,chip:'12 % 5 = 2',chipC:'cb',
     act:'▸ 插入 12：12 % 5 = 2 → 放进 bucket 2',
     desc:'插入 <b>12</b>：12 % 5 = <b>2</b> → 落进 bucket 2，当前无冲突。'},
    {N:5,table:{2:[12,7]},ins:7,collide:7,chip:'7 % 5 = 2 冲突',chipC:'cd',
     act:'▸ 插入 7：7 % 5 = 2，与 12 同桶 → 冲突',
     desc:'插入 <b>7</b>：7 % 5 = <b>2</b>，和 12 同桶 → <span class="dg">冲突</span>！拉链法把 7 挂到链尾：<b>bucket 2：12 → 7</b>。查找时要在这条链上<b>线性比对</b>。'},
    {N:5,table:{2:[12,7,22]},ins:22,collide:22,chip:'22 % 5 = 2 冲突',chipC:'cd',
     act:'▸ 插入 22：22 % 5 = 2，再次冲突',
     desc:'插入 <b>22</b>：22 % 5 = <b>2</b>，再次冲突 → <b>bucket 2：12 → 7 → 22</b>。链越长，这个桶的查找越慢。'},
    {N:5,table:{2:[12,7,22],0:[5]},ins:5,chip:'5 % 5 = 0',chipC:'cb',
     act:'▸ 插入 5：5 % 5 = 0 → bucket 0，无冲突',
     desc:'插入 <b>5</b>：5 % 5 = <b>0</b> → 落进 bucket 0，无冲突。'},
    {N:5,table:{2:[12,7,22,17],0:[5]},ins:17,collide:17,chip:'load = 5 / 5 = 1.0',chipC:'ch',
     act:'▸ 插入 17 → load_factor = 5/5 = 1.0 > 0.75',
     desc:'插入 <b>17</b>（17 % 5 = 2）→ bucket 2 链变成 4 个。此时 <b>load_factor = 元素数 / 桶数 = 5 / 5 = 1.0</b>，超过阈值 <b>0.75</b> → <b>触发 rehash</b>。'},
    {N:10,table:{2:[12,22],7:[7,17],5:[5]},rehash:true,chip:'rehash → N = 10',chipC:'cg',
     act:'▸ 桶数翻倍 N=10，全部元素按新 N 重新散列',
     desc:'<b>rehash</b>：桶数翻倍到 <b>N=10</b>，所有元素<b>按新 N 重新散列</b>：12%10=2、22%10=2（仍同桶）、7%10=7、17%10=7、5%10=5。链变短 → 查找更快。<b class="dg">代价：所有旧迭代器 / 引用失效</b>——这正是 <code>unordered_map</code> 边遍历边插入会崩的根因。'},
    {N:10,table:{2:[12,22],7:[7,17],5:[5]},rehash:true,chip:'平均 O(1)',chipC:'cg',
     act:'▸ 冲突少 → 每桶常数个 → 查找平均 O(1)',
     desc:'冲突少时每桶只有常数个元素 → 查找<b>平均 O(1)</b>；若哈希极差全挤一桶则退化为 <b>O(n)</b>。工程建议：预估规模用 <code>reserve(n)</code> 一次性建好桶，避免多次 rehash；只查询用 <code>find / count</code>，别用 <code>[]</code>（会插入默认值）。'},
  ],
  build(){viz.innerHTML='<div class="vcap"><b>拉链法 + rehash</b>：hash(key)%N 定位桶，冲突挂链，load 超阈值扩容重散列</div>'+
    '<div class="buckets" id="chbox"></div><div class="loadbar" id="chload"></div>';},
  render(s){
    let rows='';
    for(let b=0;b<s.N;b++){
      const chain=s.table[b]||[];let ch='';
      chain.forEach((k,ci)=>{
        const cls='hnode'+((s.ins===k||s.collide===k)?' pop':'')+((s.collide===k)?' collide':'');
        ch+=(ci>0?'<span class="harr">→</span>':'')+'<div class="'+cls+'">'+k+'</div>';
      });
      rows+='<div class="brow"><span class="bidx">bucket '+b+'</span><span class="bslot"></span><div class="chain">'+ch+'</div></div>';
    }
    document.getElementById('chbox').innerHTML=rows;
    const cnt=Object.values(s.table).reduce((a,c)=>a+c.length,0);
    const lf=(cnt/s.N).toFixed(2);
    let msg='元素 '+cnt+' / 桶 '+s.N+' → load_factor = <b>'+lf+'</b>　阈值 0.75';
    if(s.rehash)msg='已 rehash：N = <b>'+s.N+'</b>，load = <b class="ok">'+lf+'</b> ✓　旧迭代器失效';
    else if(lf>=0.75)msg+='　<span class="warn">→ 超阈值，触发 rehash</span>';
    document.getElementById('chload').innerHTML=msg;
  }
};

/* ========== 场景 2：两数之和 查补数 ========== */
const twoSumScene=(()=>{
  const nums=[3,2,4];
  return {
    id:'twosum',label:'两数之和',sub:'查补数',
    code:'<span class="kw">for</span>(<span class="kw">int</span> i=0;i&lt;n;++i){\n'+
      '    <span class="kw">int</span> need = t - a[i];\n'+
      '    <span class="kw">if</span>(mp.count(need)) <span class="kw">return</span> {mp[need], i};\n'+
      '    mp[a[i]] = i;   <span class="cmt">// 先查后插，避免自用</span>\n'+
      '}',
    steps:[
      {i:null,map:[],chip:'target = 6',chipC:'c0',
       act:'▸ 遍历到 x 时，只问：补数 target−x 出现过吗？',
       desc:'朴素两数之和枚举 i、j 是 <b>O(n²)</b>。哈希优化：遍历到 <b>x</b> 时只问一句——<b>它的补数 <code>target − x</code> 之前出现过吗？</b> 用 <code>mp[值] = 下标</code> 记录见过的数，查补数平均 <b>O(1)</b>。'},
      {i:0,need:3,found:false,map:[[3,0]],chip:'i=0 x=3 need=3',chipC:'cb',
       act:'▸ need = 6−3 = 3，表空 → 存入 3→0',
       desc:'i=0，x=3，need = 6 − 3 = <b>3</b>。map 为空，<span class="miss">没找到</span> → 把 <b>3→0</b> 存入 map。<b>先查再插</b>是关键，否则 x 会把自己当补数。'},
      {i:1,need:4,found:false,map:[[3,0],[2,1]],chip:'i=1 x=2 need=4',chipC:'cb',
       act:'▸ need = 6−2 = 4，表里没有 → 存入 2→1',
       desc:'i=1，x=2，need = 6 − 2 = <b>4</b>。map 里没有 4 → 存入 <b>2→1</b>。'},
      {i:2,need:2,found:true,hitKey:2,map:[[3,0],[2,1]],chip:'i=2 need=2 命中',chipC:'cg',
       act:'▸ need = 6−4 = 2，命中下标 1 → 返回 {1, 2}',
       desc:'i=2，x=4，need = 6 − 4 = <b>2</b>。map 里<span class="hit">有 2（下标 1）</span> → 命中！返回 <b>{1, 2}</b>。一趟遍历，<b>平均 O(n)</b> 时间、O(n) 空间——用空间换时间的典型。'},
    ],
    build(){viz.innerHTML='<div class="vcap"><b>两数之和</b>：遍历时查「补数 target − x」是否已在哈希表（LC 1）</div>'+
      '<div class="cwrap" id="cw"></div>'+
      '<div class="needbar" id="tneed"></div>'+
      '<div class="maprow" id="tmap"></div>';
      buildCells(document.getElementById('cw'),nums,true,'i');},
    render(s){
      nums.forEach((v,i)=>{const el=document.getElementById('c'+i);let c='cell';if(s.found&&i===s.i)c+=' found';else if(i===s.i)c+=' cur';el.className=c;});
      moveBadge(s.i);
      document.getElementById('tneed').innerHTML=s.i===null?'先扫一遍，每步查补数':
        ('need = target − a[i] = 6 − <b>'+nums[s.i]+'</b> = <b>'+s.need+'</b>　'+
         (s.found?'<span class="hit">在表中 ✓ 返回</span>':'<span class="miss">不在表，存入当前数</span>'));
      let m='<span class="lbl">mp（值→下标）=</span>';
      if(!s.map.length)m+='<span class="lbl">∅</span>';
      else s.map.forEach(([k,v],idx)=>{const hit=(s.found&&k===s.hitKey);const isNew=(!s.found&&idx===s.map.length-1);m+='<span class="ment'+(hit?' hit':'')+(isNew?' pop':'')+'">'+k+'→'+v+'</span>';});
      document.getElementById('tmap').innerHTML=m;
    }
  };
})();

/* ========== 场景 3：最长连续序列 ========== */
const lcsScene=(()=>{
  const nums=[100,4,200,1,3,2];
  return {
    id:'lcs',label:'最长连续序列',sub:'只从起点扩展',
    code:'unordered_set&lt;int&gt; S(a.begin(),a.end());\n'+
      '<span class="kw">for</span>(<span class="kw">int</span> x : S){\n'+
      '    <span class="kw">if</span>(S.count(x-1)) <span class="kw">continue</span>; <span class="cmt">// 非起点，跳过</span>\n'+
      '    <span class="kw">int</span> len=1;\n'+
      '    <span class="kw">while</span>(S.count(x+len)) ++len; <span class="cmt">// 从起点右扩</span>\n'+
      '    best = max(best, len);\n}',
    steps:[
      {cur:null,start:null,ext:[],best:0,chip:'装进哈希集合',chipC:'c0',
       act:'▸ 全塞进 set；x 是起点 ⟺ x−1 不在集合',
       desc:'求无序数组的最长<b>连续</b>序列。先全塞进 <code>unordered_set</code>（O(1) 查存在）。诀窍：<b>只从「连续段起点」向右扩展</b>——x 是起点当且仅当 <code>x − 1 不在集合</code>。这样每段只扫一次，总 <b>O(n)</b>。'},
      {cur:100,start:100,ext:[100],best:1,chip:'100 是起点',chipC:'cb',
       act:'▸ 99 不在 → 100 是起点；101 不在 → 长度 1',
       desc:'看 <b>100</b>：99 不在集合 → 它是起点。向右找 101？不在 → 长度 1。best = 1。'},
      {cur:4,start:null,skip:4,ext:[],best:1,chip:'4 不是起点，跳过',chipC:'c0',
       act:'▸ 3 在集合 → 4 不是起点 → continue',
       desc:'看 <b>4</b>：3 在集合里 → 4 <b>不是起点</b>，<code>continue</code> 跳过。它会在真正的起点那一次被数到，<b>避免重复扫描</b>。'},
      {cur:200,start:200,ext:[200],best:1,chip:'200 是起点',chipC:'cb',
       act:'▸ 199 不在 → 起点；201 不在 → 长度 1',
       desc:'看 <b>200</b>：199 不在 → 起点。201 不在 → 长度 1。best 仍为 1。'},
      {cur:1,start:1,ext:[1,2,3,4],best:4,chip:'1 起点 → 扩到 4',chipC:'cg',
       act:'▸ 1 是起点 → 右扩 2,3,4，长度 4',
       desc:'看 <b>1</b>：0 不在 → 起点！向右：2 在 ✓、3 在 ✓、4 在 ✓、5 不在 → 停。连续段 <b>1→2→3→4</b>，长度 <b>4</b>。best = 4。'},
      {cur:null,start:null,ext:[1,2,3,4],best:4,done:true,chip:'O(n) · best = 4',chipC:'cg',
       act:'▸ 2、3 因 x−1 在集合被跳过 → 不重复扫描',
       desc:'2、3 因为 <code>x − 1 在集合</code> 都被跳过，不会再触发扫描。最终 <b>best = 4</b>。<b>关键陷阱</b>：若对每个元素都向右扩展，<code>[1,2,3,4,5]</code> 会被反复扫成 <b>O(n²)</b>——「只从起点扩展」正是把它压回 <b>O(n)</b> 的核心。'},
    ],
    build(){viz.innerHTML='<div class="vcap"><b>最长连续序列</b>：集合 O(1) 查存在，只从起点（x − 1 不在）向右扩展（LC 128）</div>'+
      '<div class="cwrap" id="cw"></div><div class="loadbar" id="lbest"></div>';
      buildCells(document.getElementById('cw'),nums,false);},
    render(s){
      nums.forEach((v,i)=>{
        let cls='cell';
        if(v===s.start)cls='cell start';
        else if(s.skip===v)cls='cell skip';
        else if((s.ext.includes(v)&&s.start!==null&&s.best>1)||(s.done&&s.ext.includes(v)))cls='cell ext';
        else if(v===s.cur)cls='cell cur';
        document.getElementById('c'+i).className=cls;
      });
      document.getElementById('lbest').innerHTML='最长连续长度 best = <b class="ok">'+s.best+'</b>'+
        (s.ext.length>1?'　当前段 '+s.ext.join('→'):'');
    }
  };
})();

/* ========== 场景 4：字母异位词分组 ========== */
const anagramScene=(()=>{
  const words=['eat','tea','tan','ate','nat','bat'];
  const keyOf=w=>w.split('').sort().join('');
  const steps=[];
  const build={};
  words.forEach((w,i)=>{
    const k=keyOf(w);
    const existed=!!build[k];
    if(!build[k])build[k]=[];
    build[k].push(w);
    steps.push({i,key:k,groups:JSON.parse(JSON.stringify(build)),flash:k,
      chip:"'"+w+"' → "+k,chipC:i===0?'cb':'ch',
      act:"▸ sort('"+w+"') = "+k+(existed?'（已存在 → 入组）':'（新 key → 建组）'),
      desc:"处理 <b>'"+w+"'</b>：把字母排序得 key = <b>"+k+"</b>。"+
        (existed?'该 key <b>已存在</b> → 加入同组。异位词字母组成相同，排序后 key 必然一致。':'新 key，<b>建一个新组</b>。')});
  });
  steps.unshift({i:null,key:null,groups:{},chip:'为每词造标准 key',chipC:'c0',
    act:'▸ 排序字母作 key：异位词排序后必然相同',
    desc:'异位词 = 字母相同、顺序不同（如 eat / tea / ate）。要分组就给每个词造一个<b>标准 key</b>。最简单：<b>把字母排序</b>——异位词排序后完全一样，天然成为同一个 key。用 <code>unordered_map&lt;key, vector&gt;</code> 归桶。'});
  steps.push({i:null,key:null,groups:JSON.parse(JSON.stringify(build)),done:true,chip:'排序 key vs 计数 key',chipC:'cg',
    act:'▸ 共 3 组；小写字母可改 26 位计数签名做到 O(k)',
    desc:'共得 3 组：<b>[eat, tea, ate] · [tan, nat] · [bat]</b>。排序 key 每词 <b>O(k log k)</b>；若只含小写字母，可改用 <b>26 位计数签名</b>（如 <code>#1#0#..</code>，带分隔符防歧义）做到每词 <b>O(k)</b>。注意 <code>unordered_map</code> 遍历<b>无序</b>，要有序输出得另行排序。'});
  return {
    id:'anagram',label:'异位词分组',sub:'排序作 key',
    code:'<span class="kw">for</span>(<span class="kw">auto</span>&amp; w : words){\n'+
      '    <span class="kw">string</span> key = w;\n'+
      '    sort(key.begin(), key.end()); <span class="cmt">// 排序作 key</span>\n'+
      '    groups[key].push_back(w);      <span class="cmt">// 同 key 归一组</span>\n'+
      '}',
    steps,
    build(){viz.innerHTML='<div class="vcap"><b>字母异位词分组</b>：排序后的字符串作 key，同 key 归一组（LC 49）</div>'+
      '<div class="words" id="awords"></div><div class="keyline" id="akey"></div>'+
      '<div class="groups" id="agrp"></div>';
      let ws='';words.forEach((w,i)=>{ws+='<div class="word" id="w'+i+'">'+w+'</div>';});
      document.getElementById('awords').innerHTML=ws;},
    render(s){
      words.forEach((w,i)=>{const cls=(i===s.i)?'word cur':((s.i!==null&&i<s.i)||s.done?'word done':'word');document.getElementById('w'+i).className=cls;});
      document.getElementById('akey').innerHTML=s.key?("sort('"+words[s.i]+"') = <b>"+s.key+"</b>"):(s.done?'分组完成':'&nbsp;');
      let gs='';
      Object.keys(s.groups).forEach(k=>{
        gs+='<div class="grp'+(s.flash===k?' flash enter':'')+'"><div class="gk">key = '+k+'</div><div class="gv">'+
          s.groups[k].map(w=>'<span class="gw">'+w+'</span>').join('')+'</div></div>';
      });
      document.getElementById('agrp').innerHTML=gs||'<span class="loadbar">（还没有分组）</span>';
    }
  };
})();

/* ========== 引擎 ========== */
const SCENES=[chainScene,twoSumScene,lcsScene,anagramScene];
const tabsBox=document.getElementById('tabs');
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stAct=document.getElementById('stAct'),stDesc=document.getElementById('stDesc');
const codeBox=document.getElementById('codeBox'),readout=document.getElementById('readout'),dotsBox=document.getElementById('dots');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');
SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML='<span class="t">'+sc.label+'</span><span class="s">'+sc.sub+'</span>';b.onclick=()=>{stop();switchScene(i);};tabsBox.appendChild(b);});
let si=0,cur=0,dotEls=[];
const SC=()=>SCENES[si];
function switchScene(i){
  si=i;cur=0;
  [...tabsBox.children].forEach((t,idx)=>t.classList.toggle('on',idx===si));
  SC().build();codeBox.innerHTML=SC().code;
  dotsBox.innerHTML='';dotEls=[];
  SC().steps.forEach((s,idx)=>{const d=document.createElement('button');d.className='dot';d.title=s.chip;d.onclick=()=>{stop();go(idx);};dotsBox.appendChild(d);dotEls.push(d);});
  go(0);
}
function go(i){
  const steps=SC().steps;cur=Math.max(0,Math.min(steps.length-1,i));const s=steps[cur];
  SC().render(s);
  stTitle.textContent=SC().label;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;
  stAct.innerHTML=s.act;stDesc.innerHTML=s.desc;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(steps.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
  if(cur===steps.length-1)stop();
}
let timer=null,ms=2700;
function play(){const steps=SC().steps;if(cur===steps.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<SC().steps.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const hm=location.hash.match(/scene=(\w+)/),sm=location.hash.match(/step=(\d+)/);
let initScene=0;if(hm){const idx=SCENES.findIndex(x=>x.id===hm[1]);if(idx>=0)initScene=idx;}
switchScene(initScene);if(sm)go(+sm[1]);
</script>
