<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vector 扩容机制 · 三指针、搬家与摊还 O(1)</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#444441;--muted:#5F5E5A;--faint:#8a887f;
  --line:#c9c7bf;--grid:#e2e0d7;
  --blue:#185FA5;--bluebg:#E6F1FB;      /* _first / 元素 */
  --green:#0F6E56;--greenbg:#E1F5EE;    /* _last / 新内存 */
  --brown:#854F0B;--brownbg:#FAEEDA;    /* _end / capacity */
  --danger:#B3402F;--dangerbg:#F6E0DB;  /* 释放/失效 */
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);--dur:520ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 40px;text-wrap:pretty;}
.wrap{max-width:1180px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.5px;}
header p{font-size:13px;color:var(--muted);margin-top:4px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.layout{display:grid;grid-template-columns:600px 1fr;gap:26px;margin-top:24px;align-items:start;}
@media(max-width:1060px){.layout{grid-template-columns:1fr;}}

/* ---------- 左：内存视图 ---------- */
.viz{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-height:420px;}
.viz .cap{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
.stat{font-family:var(--mono);font-size:12px;}
.stat b{color:var(--green);} .stat i{font-style:normal;color:var(--brown);}

.blockwrap{transition:opacity var(--dur) var(--ease);padding-bottom:30px;position:relative;}
.blockwrap.hide{display:none;}
.blockwrap .blab{font-size:11px;color:var(--faint);margin-bottom:4px;font-family:var(--mono);}
.block{display:flex;gap:2px;position:relative;}
.cell{flex:1;height:40px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--faint);transition:all var(--dur) var(--ease);min-width:0;}
.cell.filled{background:var(--bluebg);color:var(--blue);border-color:var(--blue);}
.cell.newmem{border-style:dashed;border-color:var(--green);}
.cell.newmem.filled{background:var(--greenbg);color:var(--green);border-style:solid;}
.cell.flash{animation:pop .5s var(--ease);}
@keyframes pop{0%{transform:scale(.7);}70%{transform:scale(1.1);}100%{transform:scale(1);}}
.blockwrap.ghost .cell{background:var(--dangerbg)!important;color:var(--danger)!important;border-color:var(--danger)!important;opacity:.45;}
.blockwrap.ghost .blab{color:var(--danger);}
/* 指针标签行 */
.ptrs{position:absolute;left:0;right:0;bottom:0;height:26px;}
.ptr{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:1px 6px;transition:left var(--dur) var(--ease);white-space:nowrap;}
.ptr::before{content:'▲';position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:9px;}
.ptr.pf{background:var(--blue);}.ptr.pf::before{color:var(--blue);}
.ptr.pl{background:var(--green);}.ptr.pl::before{color:var(--green);}
.ptr.pe{background:var(--brown);}.ptr.pe::before{color:var(--brown);}
/* 待插入元素 */
.incoming{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);height:34px;transition:opacity var(--dur) var(--ease);}
.incoming.hide{opacity:0;}
.incoming .val{font-family:var(--mono);font-weight:700;font-size:15px;background:var(--brownbg);color:var(--brown);border:1px solid var(--brown);border-radius:6px;padding:2px 10px;animation:bounce 1.2s infinite var(--ease);}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
/* 扩容序列 */
.seq{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--faint);flex-wrap:wrap;}
.seq .sc{border:1px solid var(--line);border-radius:6px;padding:1px 8px;transition:all var(--dur) var(--ease);}
.seq .sc.hot{background:var(--brownbg);color:var(--brown);border-color:var(--brown);font-weight:700;}
.warnbar{font-size:12px;font-weight:600;color:var(--danger);background:var(--dangerbg);border:1px dashed var(--danger);border-radius:6px;padding:4px 10px;opacity:0;transition:opacity var(--dur) var(--ease);}
.warnbar.show{opacity:1;}

/* ---------- 右 ---------- */
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:16px 20px;min-height:170px;}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.chip{font-size:11px;font-weight:500;padding:2px 10px;border-radius:999px;border:1px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cs{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.desc-body{margin-top:10px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .f{color:var(--blue);font-weight:600;}
.desc-body .l{color:var(--green);font-weight:600;}
.desc-body .e{color:var(--brown);font-weight:600;}
.desc-body .d{color:var(--danger);font-weight:600;}

.free{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 18px;}
.free .lbl{font-size:12px;color:var(--muted);margin-bottom:10px;}
.free .row{display:flex;gap:10px;flex-wrap:wrap;}
.act{font:inherit;font-size:13px;font-weight:500;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid;transition:all .15s var(--ease);}
.act:active{transform:scale(.96);}
.act:disabled{opacity:.4;cursor:default;}
.act.p{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.act.p:hover:not(:disabled){background:#d8e8f8;}
.act.r{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.act.r:hover:not(:disabled){background:#cfeee2;}
.act.reset{color:var(--muted);border-color:var(--line);background:var(--paper);margin-left:auto;}
.freeout{margin-top:10px;font-size:13px;color:var(--muted);min-height:22px;}
.freeout b{color:var(--ink);}

/* ---------- 控制条 ---------- */
.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease);}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:88px;}
.dots{display:flex;gap:7px;margin:0 auto;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>vector 扩容机制 · 三指针、搬家与摊还 O(1)</h1>
    <p>push_back 塞满容量时发生了什么：分配新内存 → 拷贝 → 释放旧内存 → 指针更新　·　<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="layout">
    <!-- 左：内存视图 -->
    <section class="viz">
      <div class="cap">
        <span>堆上的内存块</span>
        <span class="stat">size = <b id="stSize">4</b> / capacity = <i id="stCap">4</i></span>
      </div>

      <div class="incoming" id="incoming"><span>待插入：</span><span class="val" id="incomingV">5</span><span id="incomingT">size == capacity，塞不下了！</span></div>

      <div class="blockwrap" id="wrapOld">
        <div class="blab" id="labOld">旧内存块 · capacity 4</div>
        <div class="block" id="blkOld"></div>
        <div class="ptrs" id="ptrOld"></div>
      </div>

      <div class="blockwrap hide" id="wrapNew">
        <div class="blab" id="labNew">新内存块 · capacity 8（2 倍扩容，MSVC 为 1.5 倍）</div>
        <div class="block" id="blkNew"></div>
        <div class="ptrs" id="ptrNew"></div>
      </div>

      <div class="warnbar" id="warnBar">⚠ 旧内存已释放 —— 扩容前保存的所有迭代器 / 指针 / 引用现在都是悬空的</div>

      <div class="seq" id="seqBar" style="margin-top:auto;">
        <span>扩容序列：</span>
        <span class="sc">0</span><span class="sc">1</span><span class="sc">2</span><span class="sc">4</span><span class="sc" data-c="4">4</span><span class="sc" data-c="8">8</span><span class="sc" data-c="16">16</span><span class="sc">…</span>
      </div>
    </section>

    <!-- 右 -->
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="desc-body" id="stDesc"></div>
      </div>

      <div class="free">
        <div class="lbl">自由操作 —— 亲手把容器塞爆：</div>
        <div class="row">
          <button class="act p" id="actPush">push_back(随机值)</button>
          <button class="act r" id="actReserve">reserve(16)</button>
          <button class="act reset" id="actReset">↺ 复位</button>
        </div>
        <div class="freeout" id="freeOut"></div>
      </div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
/* ---------- 块渲染 ---------- */
function renderBlock(blkId,ptrId,cap,vals,isNew,stagger){
  const blk=document.getElementById(blkId);
  blk.innerHTML='';
  for(let i=0;i<cap;i++){
    const c=document.createElement('div');
    c.className='cell'+(isNew?' newmem':'');
    if(i<vals.length){
      if(stagger){setTimeout(()=>{c.textContent=vals[i];c.classList.add('filled','flash');},i*160);}
      else{c.textContent=vals[i];c.classList.add('filled');}
    }
    blk.appendChild(c);
  }
  const pr=document.getElementById(ptrId);
  pr.innerHTML='';
  if(vals.ptrs!==false){
    [['pf','_first',0],['pl','_last',vals.length],['pe','_end',cap]].forEach(([cls,name,idx])=>{
      const p=document.createElement('span');p.className='ptr '+cls;p.textContent=name;
      p.style.left=(idx/cap*100)+'%';pr.appendChild(p);
    });
  }
}
const wrapOld=document.getElementById('wrapOld'),wrapNew=document.getElementById('wrapNew');
const labOld=document.getElementById('labOld'),labNew=document.getElementById('labNew');
const incoming=document.getElementById('incoming'),incomingT=document.getElementById('incomingT');
const warnBar=document.getElementById('warnBar');
const stSize=document.getElementById('stSize'),stCap=document.getElementById('stCap');

/* state: {old:{cap,vals,ghost,ptrs}, nw:{cap,vals,ptrs,stagger}|null, inc, incT, warn, size, capv, seqHot} */
function paint(st,stagger){
  wrapOld.classList.toggle('hide',!st.old);
  if(st.old){
    wrapOld.classList.toggle('ghost',!!st.old.ghost);
    labOld.textContent=st.old.ghost?'旧内存块 · 已 delete 释放（残影）':'旧内存块 · capacity '+st.old.cap;
    const v=st.old.vals.slice();v.ptrs=st.old.ptrs;
    renderBlock('blkOld','ptrOld',st.old.cap,v,false,false);
  }
  wrapNew.classList.toggle('hide',!st.nw);
  if(st.nw){
    const v=st.nw.vals.slice();v.ptrs=st.nw.ptrs;
    labNew.textContent='新内存块 · capacity '+st.nw.cap+'（2 倍扩容，MSVC 为 1.5 倍）';
    renderBlock('blkNew','ptrNew',st.nw.cap,v,true,stagger&&st.nw.stagger);
  }
  incoming.classList.toggle('hide',!st.inc);
  if(st.inc){document.getElementById('incomingV').textContent=st.inc;incomingT.textContent=st.incT||'';}
  warnBar.classList.toggle('show',!!st.warn);
  stSize.textContent=st.size;stCap.textContent=st.capv;
  document.querySelectorAll('#seqBar .sc').forEach(sc=>sc.classList.toggle('hot',sc.dataset.c===String(st.seqHot)));
}

/* ---------- 步骤 ---------- */
const V4=[1,2,3,4];
const STEPS=[
  { title:'步骤 0 · 三根指针管一切', chip:'_first _last _end', chipC:'c0',
    st:{old:{cap:4,vals:V4,ptrs:true},nw:null,inc:null,warn:0,size:4,capv:4,seqHot:4},
    desc:'vector 内部只有三根指针：<span class="f">_first</span> 指向数组头，<span class="l">_last</span> 指向有效元素的后一格，<span class="e">_end</span> 指向整块内存的末尾。<b>size = _last − _first</b>（现在 4），<b>capacity = _end − _first</b>（现在 4）。' },
  { title:'步骤 1 · push_back(5)，塞不下了', chip:'size == capacity', chipC:'ch',
    st:{old:{cap:4,vals:V4,ptrs:true},nw:null,inc:'5',incT:'size == capacity，塞不下了！',warn:0,size:4,capv:4,seqHot:4},
    desc:'<span class="l">_last</span> 已经追上 <span class="e">_end</span>——有效元素填满了整块内存。这一次 <code>push_back</code> 没法直接写入，必须<b>先扩容</b>。' },
  { title:'步骤 2 · 分配 2 倍新内存', chip:'new T[8]', chipC:'cg',
    st:{old:{cap:4,vals:V4,ptrs:true},nw:{cap:8,vals:[],ptrs:false},inc:'5',incT:'等待新家装修好…',warn:0,size:4,capv:4,seqHot:4},
    desc:'在堆上另找一块 <b>2 倍大</b>的空间（8 格）。注意：是"另找"，不是"原地续建"——<b>动态数组必须整块连续</b>，旧块后面的内存未必是空闲的。' },
  { title:'步骤 3 · 逐个拷贝搬家', chip:'O(n) 拷贝', chipC:'cs',
    st:{old:{cap:4,vals:V4,ptrs:true},nw:{cap:8,vals:V4,ptrs:false,stagger:true},inc:'5',incT:'等元素搬完…',warn:0,size:4,capv:4,seqHot:4},
    desc:'把 4 个旧元素<b>逐个拷贝（或移动）</b>到新内存。这一步是 O(n) 的——扩容的全部代价都在这里。元素越多，一次搬家越贵。' },
  { title:'步骤 4 · 释放旧内存，指针换家', chip:'迭代器全体失效', chipC:'cd',
    st:{old:{cap:4,vals:V4,ghost:1,ptrs:false},nw:{cap:8,vals:V4,ptrs:true},inc:'5',incT:'马上就位',warn:1,size:4,capv:8,seqHot:8},
    desc:'旧块 <code>delete</code> 掉，<span class="f">_first</span>/<span class="l">_last</span>/<span class="e">_end</span> 全部指向新块。<b class="d">扩容前保存的所有迭代器、指针、引用此刻全部悬空</b>——这就是"insert 导致扩容后迭代器失效"的根源。' },
  { title:'步骤 5 · 新元素终于就位', chip:'size=5 cap=8', chipC:'cg',
    st:{old:null,nw:{cap:8,vals:[1,2,3,4,5],ptrs:true},inc:null,warn:0,size:5,capv:8,seqHot:8},
    desc:'5 写入 <span class="l">_last</span> 所指的位置，<span class="l">_last</span> 后移一格。接下来的 3 次 <code>push_back</code> 都不再扩容，直接 O(1) 写入。' },
  { title:'步骤 6 · 为什么均摊还是 O(1)', chip:'摊还分析', chipC:'c0',
    st:{old:null,nw:{cap:8,vals:[1,2,3,4,5],ptrs:true},inc:null,warn:0,size:5,capv:8,seqHot:8},
    desc:'扩容序列 0→1→2→4→8→16…：搬 n 个元素之前，已经免费写入过约 n 次，<b>总代价平摊到每次 push_back 仍是 O(1)</b>。但单次扩容的抖动是真实的——<b>预先 <code>reserve(N)</code></b> 可以把扩容次数直接归零。' },
];

/* ---------- 控制 ---------- */
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stDesc=document.getElementById('stDesc');
const readout=document.getElementById('readout');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');
const dotsBox=document.getElementById('dots');const dotEls=[];
STEPS.forEach((s,i)=>{const d=document.createElement('button');d.className='dot';d.title=s.title;d.onclick=()=>{stop();go(i);};dotsBox.appendChild(d);dotEls.push(d);});

let cur=0;
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const s=STEPS[cur];
  paint(s.st,true);
  stTitle.textContent=s.title;stChip.textContent=s.chip;stChip.className='chip '+s.chipC;stDesc.innerHTML=s.desc;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(STEPS.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===STEPS.length-1;
  document.getElementById('freeOut').textContent='';
  if(cur===STEPS.length-1)stop();
}

/* ---------- 自由操作 ---------- */
let fv=null; // {cap, vals}
const freeOut=document.getElementById('freeOut');
let seed=7;
function rnd(){seed=(seed*73+41)%97;return seed%90+10;}
function fpaint(msg){
  paint({old:null,nw:{cap:fv.cap,vals:fv.vals,ptrs:true},inc:null,warn:0,size:fv.vals.length,capv:fv.cap,seqHot:fv.cap<=16?fv.cap:16});
  freeOut.innerHTML=msg;
}
document.getElementById('actPush').onclick=()=>{
  stop();
  if(!fv)fv={cap:STEPS[cur].st.nw?STEPS[cur].st.nw.cap:4,vals:(STEPS[cur].st.nw?STEPS[cur].st.nw.vals:STEPS[cur].st.old.vals).slice()};
  const v=rnd();
  if(fv.vals.length<fv.cap){
    fv.vals.push(v);
    fpaint('push_back('+v+')：还有空位，<b>O(1) 直接写入</b>。size '+fv.vals.length+' / cap '+fv.cap);
  }else if(fv.cap>=16){
    freeOut.innerHTML='cap 已到 16，再扩就画不下了——想象它继续 32、64…翻倍下去。点「复位」重来。';
  }else{
    const oldCap=fv.cap;
    fv.cap*=2;fv.vals.push(v);
    paint({old:{cap:oldCap,vals:fv.vals.slice(0,oldCap),ghost:1,ptrs:false},nw:{cap:fv.cap,vals:fv.vals,ptrs:true,stagger:true},inc:null,warn:1,size:fv.vals.length,capv:fv.cap,seqHot:fv.cap<=16?fv.cap:16},true);
    freeOut.innerHTML='push_back('+v+')：<b>触发扩容 '+oldCap+' → '+fv.cap+'</b>！搬 '+oldCap+' 个元素 + 释放旧块，迭代器全体失效。';
  }
};
document.getElementById('actReserve').onclick=()=>{
  stop();
  if(!fv)fv={cap:STEPS[cur].st.nw?STEPS[cur].st.nw.cap:4,vals:(STEPS[cur].st.nw?STEPS[cur].st.nw.vals:STEPS[cur].st.old.vals).slice()};
  if(fv.cap>=16){freeOut.innerHTML='capacity 已 ≥ 16，reserve(16) 什么都不做（reserve 只增不减）。';return;}
  fv.cap=16;
  fpaint('reserve(16)：一次性把 capacity 拉到 16，<b>size 不变</b>（'+fv.vals.length+'）。之后连续 push_back 到 16 个都不会再扩容——这就是"预分配"的意义。');
};
document.getElementById('actReset').onclick=()=>{stop();fv=null;go(0);};

/* ---------- 播放 ---------- */
let timer=null,ms=2600;
function play(){if(cur===STEPS.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<STEPS.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const m=location.hash.match(/step=(\d+)/);go(m?+m[1]:0);
</script>
</body>
</html>
