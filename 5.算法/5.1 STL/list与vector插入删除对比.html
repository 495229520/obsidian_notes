<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>list 与 vector · 中间插入删除的代价对比</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#444441;--muted:#5F5E5A;--faint:#8a887f;
  --line:#c9c7bf;--grid:#e2e0d7;
  --blue:#185FA5;--bluebg:#E6F1FB;      /* vector */
  --green:#0F6E56;--greenbg:#E1F5EE;    /* list / 新节点 */
  --brown:#854F0B;--brownbg:#FAEEDA;    /* 搬移/遍历 */
  --danger:#B3402F;--dangerbg:#F6E0DB;
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);--dur:480ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 40px;text-wrap:pretty;}
.wrap{max-width:1180px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.5px;}
header p{font-size:13px;color:var(--muted);margin-top:4px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.layout{display:grid;grid-template-columns:600px 1fr;gap:26px;margin-top:24px;align-items:start;}
@media(max-width:1060px){.layout{grid-template-columns:1fr;}}

/* ---------- 左 ---------- */
.viz{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:22px;min-height:400px;}
.lane .lt{font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.lane.vec .lt{color:var(--blue);}
.lane.lst .lt{color:var(--green);}
.lane .lt .cost{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;border:1px solid;transition:all var(--dur) var(--ease);}
.lane .lt .cost.on{background:var(--dangerbg);color:var(--danger);border-color:var(--danger);}
.lane .lt .cost.ok{background:var(--greenbg);color:var(--green);border-color:var(--green);}
.lane .lt .cost.off{color:var(--faint);border-color:var(--line);background:transparent;}
/* vector 车道 */
.vcells{display:flex;gap:3px;}
.vc{width:64px;height:48px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:700;border:1px solid var(--blue);border-radius:7px;background:var(--bluebg);color:var(--blue);transition:all var(--dur) var(--ease);}
.vc.gap{border-style:dashed;border-color:var(--line);background:transparent;color:var(--faint);}
.vc.moved{background:var(--brownbg);color:var(--brown);border-color:var(--brown);animation:slide .55s var(--ease);}
@keyframes slide{0%{transform:translateX(-58px);}100%{transform:translateX(0);}}
.vc.hot{box-shadow:0 0 0 3px var(--brown);}
.vc.newel{background:var(--greenbg);color:var(--green);border-color:var(--green);animation:drop .5s var(--ease);}
@keyframes drop{0%{transform:translateY(-16px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
/* list 车道 */
.nodes{display:flex;align-items:center;gap:0;flex-wrap:wrap;row-gap:14px;}
.node{width:58px;height:48px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:700;border:1px solid var(--green);border-radius:10px;background:var(--greenbg);color:var(--green);transition:all var(--dur) var(--ease);position:relative;}
.node.newel{box-shadow:0 0 0 3px var(--green);animation:drop .5s var(--ease);}
.node.hot{background:var(--brownbg);color:var(--brown);border-color:var(--brown);}
.link{font-family:var(--mono);font-size:13px;color:var(--faint);padding:0 3px;transition:all var(--dur) var(--ease);white-space:nowrap;}
.link.rewire{color:var(--danger);font-weight:700;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
.loopnote{font-size:10.5px;color:var(--faint);margin-top:6px;font-family:var(--mono);}
.banner{font-size:12px;font-weight:600;border-radius:6px;padding:4px 10px;border:1px dashed;opacity:0;transition:opacity var(--dur) var(--ease);}
.banner.show{opacity:1;}
.banner.good{color:var(--green);background:var(--greenbg);border-color:var(--green);}
.banner.bad{color:var(--danger);background:var(--dangerbg);border-color:var(--danger);}

/* ---------- 右 ---------- */
.right{display:flex;flex-direction:column;gap:16px;}
.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:16px 20px;min-height:190px;}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.chip{font-size:11px;font-weight:500;padding:2px 10px;border-radius:999px;border:1px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cs{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.desc-body{margin-top:10px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .v{color:var(--blue);font-weight:600;}
.desc-body .l{color:var(--green);font-weight:600;}
.desc-body .h{color:var(--brown);font-weight:600;}
.desc-body .d{color:var(--danger);font-weight:600;}

/* ---------- 控制条 ---------- */
.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease);}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:88px;}
.dots{display:flex;gap:7px;margin:0 auto;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>list 与 vector · 中间插入删除的代价对比</h1>
    <p>同一个动作「在 20 和 30 之间插入 25」，两种底层结构付出的代价完全不同　·　<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="layout">
    <!-- 左 -->
    <section class="viz">
      <div class="lane vec">
        <div class="lt">vector · 连续内存动态数组<span class="cost off" id="costV">—</span></div>
        <div class="vcells" id="vcells"></div>
      </div>
      <div class="lane lst">
        <div class="lt">list · 双向循环链表<span class="cost off" id="costL">—</span></div>
        <div class="nodes" id="nodes"></div>
        <div class="loopnote">↺ 双向循环：尾节点的 next 指回头节点（图中省略回环线）</div>
      </div>
      <div class="banner" id="banner"></div>
    </section>

    <!-- 右 -->
    <section class="right">
      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
/* ---------- 渲染 ----------
   vec: {vals:[{v,cls}...]}  lst: {vals:[{v,cls}...], rewire:[gapIdx...], walk:n}
   cost: {v:'on'|'ok'|'off'+text, l:...} */
const vcells=document.getElementById('vcells'),nodesBox=document.getElementById('nodes');
const costV=document.getElementById('costV'),costL=document.getElementById('costL');
const banner=document.getElementById('banner');
function paint(st){
  vcells.innerHTML='';
  st.vec.forEach(o=>{
    const c=document.createElement('div');c.className='vc'+(o.cls?' '+o.cls:'');
    c.textContent=o.v;vcells.appendChild(c);
  });
  nodesBox.innerHTML='';
  st.lst.forEach((o,i)=>{
    if(i>0){
      const lk=document.createElement('span');
      lk.className='link'+((st.rewire||[]).includes(i)?' rewire':'');
      lk.textContent='⇄';nodesBox.appendChild(lk);
    }
    const n=document.createElement('div');n.className='node'+(o.cls?' '+o.cls:'');
    n.textContent=o.v;nodesBox.appendChild(n);
    if(st.walkTo!==undefined&&i<=st.walkTo){setTimeout(()=>n.classList.add('hot'),i*300);}
  });
  costV.textContent=st.cv[1];costV.className='cost '+st.cv[0];
  costL.textContent=st.cl[1];costL.className='cost '+st.cl[0];
  if(st.banner){banner.textContent=st.banner.txt;banner.className='banner show '+st.banner.type;}
  else banner.className='banner';
}
const P=(v,cls)=>({v,cls});
const BASE_V=[P(10),P(20),P(30),P(40),P(50)];
const BASE_L=[P(10),P(20),P(30),P(40),P(50)];

/* ---------- 步骤 ---------- */
const STEPS=[
  { t:'步骤 0 · 两种底层结构', c:'结构对比', cc:'c0',
    st:{vec:BASE_V,lst:BASE_L,cv:['off','连续内存'],cl:['off','节点 + 指针']},
    d:'<span class="v">vector</span>：一整块连续内存，元素肩并肩挤在一起。<span class="l">list</span>：每个节点独立 new 出来，靠 <code>prev/next</code> 指针串成<b>双向循环链表</b>，节点散落在堆的各处。同样存 {10,20,30,40,50}，代价结构完全不同。' },
  { t:'步骤 1 · vector 插入：先腾位置', c:'搬移 O(n)', cc:'cd',
    st:{vec:[P(10),P(20),P('',' gap'),P(30,'moved'),P(40,'moved'),P(50,'moved')],lst:BASE_L,
        cv:['on','O(n) 搬移'],cl:['off','—'],
        banner:{txt:'30、40、50 依次向后挪一格 —— 插入位置越靠前，要搬的元素越多',type:'bad'}},
    d:'要在下标 2 插入，必须先把 30、40、50 <b class="h">全部向后搬一格</b>腾出空位。平均要搬 n/2 个元素，所以是 <b class="d">O(n)</b>。如果此刻恰好 size == capacity，还要<b>先整体扩容搬家</b>（见「vector 扩容机制」动画），雪上加霜。' },
  { t:'步骤 2 · vector 插入完成', c:'25 就位', cc:'cs',
    st:{vec:[P(10),P(20),P(25,'newel'),P(30),P(40),P(50)],lst:BASE_L,
        cv:['on','O(n)'],cl:['off','—']},
    d:'25 写进腾出来的空位。注意副作用：<b class="d">插入点之后的所有迭代器/指针都失效了</b>（元素地址全变了）。' },
  { t:'步骤 3 · list 插入：只改两对指针', c:'O(1)', cc:'cg',
    st:{vec:[P(10),P(20),P(25),P(30),P(40),P(50)],lst:[P(10),P(20),P(25,'newel'),P(30),P(40),P(50)],rewire:[2,3],
        cv:['off','—'],cl:['ok','O(1) 改指针'],
        banner:{txt:'new 一个节点，把 20⇄25、25⇄30 两对指针接好 —— 其他节点原地不动',type:'good'}},
    d:'list 在同样的位置插入：<b class="l">new 一个节点，改两对 prev/next 指针</b>，完事。不管链表有一万个还是一亿个节点，这一步永远是 <b class="l">O(1)</b>，而且<b>所有旧迭代器依然有效</b>。这就是"频繁中间插删选 list"的原因。' },
  { t:'步骤 4 · 但随机访问，形势反转', c:'v[3] vs 走链', cc:'ch',
    st:{vec:[P(10),P(20),P(25),P(30,'hot'),P(40),P(50)],lst:[P(10),P(20),P(25),P(30),P(40),P(50)],walkTo:3,
        cv:['ok','O(1) 直达'],cl:['on','O(n) 顺藤摸瓜']},
    d:'要访问第 4 个元素：<span class="v">vector</span> 直接算地址 <code>_first + 3</code>，<b class="l">一步直达 O(1)</b>；<span class="l">list</span> 只能从头 <code>next→next→next</code> <b class="d">顺藤摸瓜 O(n)</b>——所以 list 没有 <code>operator[]</code>，也用不了 <code>sort()</code> 这类要求随机访问的算法（它有成员版 <code>list::sort</code>）。' },
  { t:'步骤 5 · 看不见的第三个维度：缓存', c:'cache 友好性', cc:'ch',
    st:{vec:[P(10),P(20),P(25),P(30),P(40),P(50)],lst:[P(10),P(20),P(25),P(30),P(40),P(50)],
        cv:['ok','预取友好'],cl:['on','缓存不友好']},
    d:'vector 连续内存对 <b>CPU 缓存和预取器极度友好</b>，顺序遍历快得多；list 节点散落各处，每走一步都可能 cache miss，还要为每个节点额外付出两个指针 + 一次 new 的开销。<b>数据量不大时，vector 连"中间插入"都常常实测更快</b>。' },
  { t:'步骤 6 · 选型口诀', c:'总结', cc:'c0',
    st:{vec:[P(10),P(20),P(25),P(30),P(40),P(50)],lst:[P(10),P(20),P(25),P(30),P(40),P(50)],
        cv:['off','默认首选'],cl:['off','特定场景']},
    d:'<b>默认用 vector</b>（随机访问 + 尾部增删 + 缓存友好）；<b>频繁在中间插删、且需要迭代器长期稳定</b>时才用 list；两端都要 O(1) 增删用 deque。面试标准答案：vector 增删 O(n) 查询下标 O(1)；list 增删 O(1)（定位后）查询 O(n)、无随机访问。' },
];

/* ---------- 控制 ---------- */
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stDesc=document.getElementById('stDesc');
const readout=document.getElementById('readout');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');
const dotsBox=document.getElementById('dots');const dotEls=[];
STEPS.forEach((s,i)=>{const d=document.createElement('button');d.className='dot';d.title=s.t;d.onclick=()=>{stop();go(i);};dotsBox.appendChild(d);dotEls.push(d);});

let cur=0;
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const s=STEPS[cur];
  paint(s.st);
  stTitle.textContent=s.t;stChip.textContent=s.c;stChip.className='chip '+s.cc;stDesc.innerHTML=s.d;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(STEPS.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===STEPS.length-1;
  if(cur===STEPS.length-1)stop();
}

let timer=null,ms=3000;
function play(){if(cur===STEPS.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<STEPS.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const m=location.hash.match(/step=(\d+)/);go(m?+m[1]:0);
</script>
</body>
</html>
