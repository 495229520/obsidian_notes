<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>erase-remove 惯用法 · remove 为什么"删不掉"东西</title>
<style>
:root{
  --paper:#F5F4ED;--panel:#FBFAF6;--ink:#444441;--muted:#5F5E5A;--faint:#8a887f;
  --line:#c9c7bf;--grid:#e2e0d7;
  --blue:#185FA5;--bluebg:#E6F1FB;      /* 保留元素 / write */
  --green:#0F6E56;--greenbg:#E1F5EE;    /* 完成区 */
  --brown:#854F0B;--brownbg:#FAEEDA;    /* read 指针 */
  --danger:#B3402F;--dangerbg:#F6E0DB;  /* 待删/残留 */
  --gray:#F1EFE8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);--dur:480ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding:28px 32px 40px;text-wrap:pretty;}
.wrap{max-width:1180px;margin:0 auto;}
header h1{font-size:22px;font-weight:600;letter-spacing:.5px;}
header p{font-size:13px;color:var(--muted);margin-top:4px;}
header kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);}
code{font-family:var(--mono);font-size:.92em;background:var(--gray);padding:1px 5px;border-radius:4px;}

.layout{display:grid;grid-template-columns:560px 1fr;gap:26px;margin-top:24px;align-items:start;}
@media(max-width:1020px){.layout{grid-template-columns:1fr;}}

/* ---------- 左 ---------- */
.viz{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px 20px;}
.viz .cap{font-size:12px;color:var(--muted);margin-bottom:30px;display:flex;justify-content:space-between;}
.stat{font-family:var(--mono);}
.arena{position:relative;padding:26px 0 54px;}
.cells{display:flex;gap:4px;}
.cell{width:74px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:17px;font-weight:700;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--muted);transition:all var(--dur) var(--ease);}
.cell .ci{font-size:9px;font-weight:400;color:var(--faint);}
.cell.keep{background:var(--bluebg);color:var(--blue);border-color:var(--blue);}
.cell.del{background:var(--dangerbg);color:var(--danger);border-color:var(--danger);}
.cell.junk{background:var(--dangerbg);color:var(--danger);border-color:var(--danger);border-style:dashed;opacity:.55;}
.cell.copyin{animation:pop .55s var(--ease);}
@keyframes pop{0%{transform:scale(.7);}70%{transform:scale(1.12);}100%{transform:scale(1);}}
.cell.gone{opacity:0;transform:scale(.6);}
/* read/write 指针 */
.rptr,.wptr{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left var(--dur) var(--ease),opacity var(--dur);}
.rptr{top:0;}
.rptr .a{color:var(--brown);font-size:12px;line-height:.9;order:2;}
.rptr .l{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--brown);border-radius:4px;padding:1px 7px;order:1;}
.wptr{bottom:26px;}
.wptr .a{color:var(--blue);font-size:12px;line-height:.9;}
.wptr .l{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--blue);border-radius:4px;padding:1px 7px;}
/* newEnd 标尺 */
.nend{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left var(--dur) var(--ease),opacity var(--dur);}
.nend .a{color:var(--green);font-size:12px;line-height:.9;}
.nend .l{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--green);border-radius:4px;padding:1px 7px;}
.judge{font-family:var(--mono);font-size:13px;color:var(--muted);min-height:24px;}
.judge b{color:var(--ink);}
.banner{margin-top:10px;font-size:12px;font-weight:600;border-radius:6px;padding:4px 10px;border:1px dashed;opacity:0;transition:opacity var(--dur) var(--ease);}
.banner.show{opacity:1;}
.banner.bad{color:var(--danger);background:var(--dangerbg);border-color:var(--danger);}
.banner.good{color:var(--green);background:var(--greenbg);border-color:var(--green);}

/* ---------- 右 ---------- */
.right{display:flex;flex-direction:column;gap:16px;}
.codecard{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.9;color:var(--muted);}
.codecard b{color:var(--ink);}
.codecard .hl{background:var(--greenbg);color:var(--green);border-radius:4px;padding:0 4px;font-weight:700;}
.desc-card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:16px 20px;min-height:180px;}
.desc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.desc-head .st{font-size:17px;font-weight:600;}
.chip{font-size:11px;font-weight:500;padding:2px 10px;border-radius:999px;border:1px solid;}
.chip.c0{color:var(--muted);border-color:var(--line);background:var(--gray);}
.chip.cs{color:var(--blue);border-color:var(--blue);background:var(--bluebg);}
.chip.cg{color:var(--green);border-color:var(--green);background:var(--greenbg);}
.chip.ch{color:var(--brown);border-color:var(--brown);background:var(--brownbg);}
.chip.cd{color:var(--danger);border-color:var(--danger);background:var(--dangerbg);}
.desc-body{margin-top:10px;font-size:14px;color:var(--muted);}
.desc-body b{color:var(--ink);}
.desc-body .w{color:var(--blue);font-weight:600;}
.desc-body .r{color:var(--brown);font-weight:600;}
.desc-body .g{color:var(--green);font-weight:600;}
.desc-body .d{color:var(--danger);font-weight:600;}

/* ---------- 控制条 ---------- */
.controls{margin-top:22px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 16px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease);}
.btn:hover:not(:disabled){background:var(--gray);border-color:var(--muted);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:88px;}
.dots{display:flex;gap:7px;margin:0 auto;}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease);}
.dot:hover{border-color:var(--muted);transform:scale(1.25);}
.dot.done{background:var(--line);border-color:var(--line);}
.dot.now{background:var(--ink);border-color:var(--ink);transform:scale(1.35);}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:center;}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>erase-remove 惯用法 · remove 为什么"删不掉"东西</h1>
    <p>对 <code>{1,6,2,7,3,8}</code> 执行 <code>remove_if(x &gt; 5)</code> —— 看双指针怎么搬运、尾巴为什么要 erase　·　<kbd>←</kbd> <kbd>→</kbd> 单步，<kbd>空格</kbd> 播放</p>
  </header>

  <div class="layout">
    <!-- 左 -->
    <section class="viz">
      <div class="cap"><span>vector 内存（红色 = 该删的 &gt;5）</span><span class="stat">size = <b id="stSize">6</b></span></div>
      <div class="arena">
        <div class="rptr" id="rptr"><span class="l">read 探路</span><span class="a">▼</span></div>
        <div class="cells" id="cells"></div>
        <div class="wptr" id="wptr"><span class="a">▲</span><span class="l">write 安置</span></div>
        <div class="nend" id="nend"><span class="a">▲</span><span class="l">newEnd（remove 的返回值）</span></div>
      </div>
      <div class="judge" id="judge"></div>
      <div class="banner" id="banner"></div>
    </section>

    <!-- 右 -->
    <section class="right">
      <div class="codecard" id="codecard">
        <span style="color:var(--faint)">// 完整惯用法（一行）：</span><br>
        v.erase(<span id="cHl2">std::remove_if(v.begin(), v.end(), 谓词)</span>, v.end());
      </div>

      <div class="desc-card">
        <div class="desc-head"><span class="st" id="stTitle"></span><span class="chip" id="stChip"></span></div>
        <div class="desc-body" id="stDesc"></div>
      </div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">‹ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ›</button>
    <div class="dots" id="dots"></div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script>
const CW=78; // 74 + 4 gap
/* st: {vals:[{v,cls}], read, write, nend, size, judge, banner:{txt,type}, hide:[] } */
const cellsBox=document.getElementById('cells');
const rptr=document.getElementById('rptr'),wptr=document.getElementById('wptr'),nend=document.getElementById('nend');
const judge=document.getElementById('judge'),banner=document.getElementById('banner'),stSize=document.getElementById('stSize');
function paint(st){
  cellsBox.innerHTML='';
  st.vals.forEach((o,i)=>{
    const c=document.createElement('div');c.className='cell'+(o.cls?' '+o.cls:'');
    c.innerHTML=o.v+'<span class="ci">['+i+']</span>';
    cellsBox.appendChild(c);
  });
  setP(rptr,st.read);setP(wptr,st.write);setP(nend,st.nend);
  judge.innerHTML=st.judge||'';
  stSize.textContent=st.size;
  if(st.banner){banner.textContent=st.banner.txt;banner.className='banner show '+st.banner.type;}
  else banner.className='banner';
}
function setP(el,idx){
  if(idx===undefined||idx===null){el.style.opacity='0';return;}
  el.style.opacity='1';el.style.left=(idx*CW+CW/2-2)+'px';
}
const P=(v,cls)=>({v,cls});

/* ---------- 步骤 ---------- */
const STEPS=[
  { t:'步骤 0 · 先破除一个误区', c:'remove ≠ 删除', cc:'cd',
    st:{vals:[P(1,'keep'),P(6,'del'),P(2,'keep'),P(7,'del'),P(3,'keep'),P(8,'del')],size:6,
        judge:'目标：把 &gt;5 的 6、7、8 都"删掉"'},
    d:'很多人写完 <code>std::remove_if(v.begin(), v.end(), 谓词)</code> 发现 <b class="d">size 还是 6，"删掉"的元素还在</b>。这不是 bug：<b>算法只拿到两个迭代器，根本摸不到容器本身</b>，它不可能改变 size。它做的是另一件事——搬运。' },
  { t:'步骤 1 · 双指针出发：1 是保留元素', c:'read / write', cc:'cs',
    st:{vals:[P(1,'keep'),P(6,'del'),P(2,'keep'),P(7,'del'),P(3,'keep'),P(8,'del')],read:0,write:0,size:6,
        judge:'read=0：1 ≤ 5 保留 → 原地写下（自己拷给自己）→ 双双前进'},
    d:'<span class="r">read</span> 负责逐个探路，<span class="w">write</span> 负责安置保留下来的元素。1 要保留，write 和 read 还在同一格，相当于原地不动，两个指针一起前进。' },
  { t:'步骤 2 · 遇到 6：write 按兵不动', c:'跳过待删', cc:'ch',
    st:{vals:[P(1,'keep'),P(6,'del'),P(2,'keep'),P(7,'del'),P(3,'keep'),P(8,'del')],read:1,write:1,size:6,
        judge:'read=1：6 &gt; 5 该删 → <b>write 不动，read 独自前进</b>'},
    d:'6 是要"删"的——但没有任何删除动作发生！<b>只是 write 拒绝为它安家</b>，read 独自往前走。位置 [1] 暂时还躺着 6，等着被后面的保留元素覆盖。' },
  { t:'步骤 3 · 遇到 2：拷贝到 write，覆盖 6', c:'前移覆盖', cc:'cs',
    st:{vals:[P(1,'keep'),P(2,'keep copyin'),P(2,'keep'),P(7,'del'),P(3,'keep'),P(8,'del')],read:2,write:2,size:6,
        judge:'read=2：2 保留 → 拷到 write=1（6 被覆盖）→ write 前进到 2'},
    d:'2 要保留，拷贝到 <span class="w">write</span> 所在的 [1]，<b>把 6 覆盖掉</b>。注意 [2] 还残留着 2 的旧值——remove 不负责清理旧位置。<b>保留元素的相对顺序不变</b>（stable），这是 remove 系列的承诺。' },
  { t:'步骤 4 · 扫完全程', c:'快进', cc:'cs',
    st:{vals:[P(1,'keep'),P(2,'keep'),P(3,'keep copyin'),P(7,'junk'),P(3,'junk'),P(8,'junk')],read:5,write:3,size:6,
        judge:'7 跳过 → 3 拷到 [2] → 8 跳过　扫描结束'},
    d:'同样的规则走完：7 跳过、3 安置到 [2]、8 跳过。现在前 3 格是<b>紧凑的保留区 {1,2,3}</b>，后 3 格是<b class="d">垃圾尾巴</b>——里面的值是搬运后的残影（{7,3,8}），<b>标准只说"值未指定"</b>，不要依赖它们。' },
  { t:'步骤 5 · remove 返回"逻辑结尾"', c:'size 还是 6！', cc:'cd',
    st:{vals:[P(1,'keep'),P(2,'keep'),P(3,'keep'),P(7,'junk'),P(3,'junk'),P(8,'junk')],nend:3,size:6,
        judge:'返回值 newEnd = begin() + 3　指向垃圾区的第一格',
        banner:{txt:'remove_if 干完活了：有效数据 [begin, newEnd)，但容器 size 依然是 6',type:'bad'}},
    d:'remove_if 的返回值是<b class="g">逻辑结尾 newEnd</b>——保留区的后一格。到这里算法的职责结束：它把"活下来的数据"整理到了前面，把边界告诉你，<b class="d">但 size 没变，垃圾还占着地</b>。删除的后半程必须交给容器自己。' },
  { t:'步骤 6 · erase(newEnd, end())：真正砍掉尾巴', c:'成员函数出手', cc:'cg',
    st:{vals:[P(1,'keep'),P(2,'keep'),P(3,'keep'),P(7,'junk gone'),P(3,'junk gone'),P(8,'junk gone')],nend:3,size:3,
        banner:{txt:'erase 是成员函数，有权修改 size：6 → 3，删除完成',type:'good'}},
    d:'<code>v.erase(newEnd, v.end())</code> 把垃圾区整段截断——<b>只有成员函数才有权改 size</b>。至此才算真正删完：{1,2,3}，size=3。两步合成一行就是标题的 <b class="g">erase-remove 惯用法</b>。' },
  { t:'步骤 7 · 为什么 STL 要这样设计', c:'算法与容器解耦', cc:'c0',
    st:{vals:[P(1,'keep'),P(2,'keep'),P(3,'keep')],size:3},
    d:'<code>&lt;algorithm&gt;</code> 里的算法<b>只依赖迭代器</b>，不知道背后是 vector、string 还是普通数组——所以同一个 remove_if 三者通用，代价是它无法收缩容器。补充：<b>list 请用成员版 <code>lst.remove_if(...)</code></b>（改指针，不搬元素）；C++20 起可以直接写 <code>std::erase_if(v, 谓词)</code>，一步到位。' },
];

/* ---------- 控制 ---------- */
const stTitle=document.getElementById('stTitle'),stChip=document.getElementById('stChip'),stDesc=document.getElementById('stDesc');
const readout=document.getElementById('readout');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),btnPlay=document.getElementById('btnPlay');
const dotsBox=document.getElementById('dots');const dotEls=[];
STEPS.forEach((s,i)=>{const d=document.createElement('button');d.className='dot';d.title=s.t;d.onclick=()=>{stop();go(i);};dotsBox.appendChild(d);dotEls.push(d);});

let cur=0;
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const s=STEPS[cur];
  paint(s.st);
  stTitle.textContent=s.t;stChip.textContent=s.c;stChip.className='chip '+s.cc;stDesc.innerHTML=s.d;
  dotEls.forEach((d,idx)=>{d.classList.toggle('now',idx===cur);d.classList.toggle('done',idx<cur);});
  readout.textContent=cur+' / '+(STEPS.length-1);
  btnPrev.disabled=cur===0;btnNext.disabled=cur===STEPS.length-1;
  if(cur===STEPS.length-1)stop();
}

let timer=null,ms=3200;
function play(){if(cur===STEPS.length-1)go(0);btnPlay.textContent='⏸ 暂停';timer=setInterval(()=>{cur<STEPS.length-1?go(cur+1):stop();},ms);}
function stop(){if(timer){clearInterval(timer);timer=null;}btnPlay.textContent='▶ 播放';}
btnPlay.onclick=()=>timer?stop():play();
btnPrev.onclick=()=>{stop();go(cur-1);};
btnNext.onclick=()=>{stop();go(cur+1);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();go(cur+1);}else if(e.key==='ArrowLeft'){stop();go(cur-1);}else if(e.key===' '){e.preventDefault();timer?stop():play();}});
const m=location.hash.match(/step=(\d+)/);go(m?+m[1]:0);
</script>
</body>
</html>
